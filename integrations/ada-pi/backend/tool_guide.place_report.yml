# place_report tool_guide fragment — append to
# <ada-pi>/backend/tool_guide.yml. Staged copy of ada-pi @ 074c7a8
# (card maps-url-to-cms-line-maps-link-resolved-c418f8).
place_report: >-
  Maps link or place name in -> public CMS page out. Pass the maps link
  verbatim as url= (short maps.app.goo.gl links expand fine); use place=
  when the user only named a spot. ask= records their question on the
  page. Always send public_url in the reply — that is the link they
  asked for; the page lands on chaba.h3 within ~15min of the publisher.
  A bare name that can't be resolved publishes NOTHING — the result is
  unresolved:true with a maps_url search link; send that in chat and/or
  ask for the place's Google Maps link. Never claim a page exists when
  ok is false. Pages are meta.public by design: do NOT run this on
  someone's home address or a location the user asked to keep private —
  answer in chat instead. Publish failure is storage, not confirmation —
  report it plainly.
