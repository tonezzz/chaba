# tool_guide.yml snippet — append at top level (backend/tool_guide.yml)

trip_calendar: >-
  Generates a shareable trip-calendar page family — rollup trip-<slug>
  with a mermaid gantt and a day table, plus a daily leaf page per trip
  day — from the lane calendar and LINE journal context. slug= names
  the trip ('capetown'); start=/end= (YYYY-MM-DD) are optional — the
  generator infers the span from a matching calendar event. Answer with
  the returned link: view_url on the tailnet, public_url for LINE/TG —
  but public='yes' only when the user explicitly asked for a shareable
  link, and then confirmed='yes' is required. page_snapshot renders the
  page to a PNG when the room prefers a picture.
