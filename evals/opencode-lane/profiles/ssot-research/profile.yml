# Task-scoped OpenCode agent profile — ssot-research
# (card opencode-task-agent-profiles).
#
# Read-only SSOT/education retrieval agent. Answers knowledge questions
# from the checkout's SSOT (docs/ssot/, AGENTS.md, docs/kb/) and the
# education layer (mcp_mddb_doc when the proxy exists) — with mandatory
# citations. No writes, no bash, no secrets.
id: ssot-research
version: 1
status: enabled
unattended: true
description: >-
  Read-only SSOT/education retrieval. Answers a research question using
  only repo read tools and the SSOT subset of the mcp-debug read-only
  allowlist; every claim must carry a resolvable citation (file path,
  optionally line range) verified held-out.
task_classes: [read_only, report]
stages: [S1, S2, S3]
target_host:
  required: true
  allowed: []
model:
  tier: cheap
  default: litellm/gemini-3.5-flash-lite
  allowed: [litellm/gemini-3.5-flash-lite, litellm/gemini-3.5-flash]
providers: [litellm]
agent:
  mode: primary
tools:
  read: true
  grep: true
  glob: true
  list: true
  todoread: true
  todowrite: true
  bash: false              # no shell at all — file tools suffice
  write: false
  edit: false
  patch: false
  task: false
  webfetch: false
permission:
  edit: deny
  bash: deny
  webfetch: deny
  external_directory: deny
  doom_loop: ask
mcp:
  # SSOT/education retrieval only — no host/debug tools in this profile.
  allowed: [mcp_read_ssot, mcp_search_ssot, mcp_ssot_query,
            mcp_ssot_get, mcp_mddb_doc]
  denied: [mcp_raw, mcp_put_file, mcp_remediate, mcp_ssot_append,
           mcp_clipboard_set, mcp_clipboard_get, mcp_clipboard_image_get,
           mcp_eget, mcp_screenshot, mcp_window_list, mcp_preset_run,
           mcp_adaptive, mcp_debug, mcp_health, mcp_get_file]
  upstream:
    name: mcp-debug-readonly
    proxy: ~/.config/devin/mcp-scripts/mcp-allowlist.py
    command: [/bin/bash, ~/.config/devin/mcp-scripts/mcp-debug-ssh.sh]
allowed_paths: []
artifact:
  mode: message
  format: json
  dirs: [evals/opencode-lane/out/, reports/]
  schema: >-
    evals/opencode-lane/profiles/ssot-research/fixture/task.yaml
    #contract.required_fields
verifier:
  type: held_out_py
  ref: evals/opencode-lane/profiles/ssot-research/fixture/verify.py
escalation:
  on_fail: manual
  allowed_on_fail: [manual, devin, retry_then_manual, hold]
  max_retries: 1
rollback:
  kind: none
rails: >-
  You are the ssot-research profile agent. Answer ONLY from the repo's
  SSOT (docs/ssot/, AGENTS.md, docs/kb/) and SSOT MCP tools — never from
  memory. Every factual claim must cite a file path (with a line range
  when possible). If the sources do not contain the answer, say so in
  the answer field instead of guessing. You may not write, run shell
  commands, or read anything under ~/.config/secrets. Emit ONLY the
  JSON artifact as your final message.
