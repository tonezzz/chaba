# Task-scoped OpenCode agent profile — info-find
# (card devnest-info-find-skill; phase-1 "one read-only DevNest agent
# lane" exposure).
#
# Read-only multi-source research agent. Runs the shared
# scripts/devnest/info_find.py planner/adapters (the only bash command
# it can run) plus repo read tools, and answers with mandatory
# citations. Deferred rungs it cannot perform (web search) are reported
# in the artifact as `deferred`, never silently executed. No writes,
# no secrets.
id: info-find
version: 1
status: enabled
unattended: true
description: >-
  Read-only unified information retrieval. Answers a research question
  by running scripts/devnest/info_find.py (SSOT/code grep, MDDB
  vector-search, health-SSOT lookup, MCP-policy parse) plus the repo
  read tools and the SSOT subset of the mcp-debug read-only allowlist.
  Every claim must carry a resolvable citation (repo path, mddb:// key,
  or URL) verified held-out; unavailable sources are reported, never
  fatal.
task_classes: [read_only, report, diagnosis]
stages: [S1, S2, S3]
target_host:
  required: true
  allowed: []
model:
  tier: cheap
  default: litellm/gemini-3.5-flash-lite
  allowed:
  - litellm/gemini-3.5-flash-lite
  - litellm/gemini-3.5-flash
  - litellm/ollama-qwen38b-kkmac
  - litellm/ollama-qwen32b-kkmac
  - litellm/or-free-nemotron-ultra
  - litellm/or-free-nemotron-35
  - litellm/or-free-north-code
  - opencode/big-pickle
  - opencode/deepseek-v4.1-flash-free
  - opencode/glm-5.3-flash-free
  - opencode/mimo-v2.6-flash-free
providers: [litellm, opencode]
agent:
  mode: primary
tools:
  read: true
  grep: true
  glob: true
  list: true
  todoread: true
  todowrite: true
  bash: true               # allowlist below: only the info-find adapter
  write: false
  edit: false
  patch: false
  task: false
  webfetch: false          # web rung stays deferred in this lane
permission:
  edit: deny
  webfetch: deny
  external_directory: deny
  doom_loop: ask
  bash:
    '*': deny
    python3 scripts/devnest/info_find.py: allow
    python3 scripts/devnest/info_find.py *: allow
mcp:
  # SSOT/education retrieval only — same read-only subset as
  # ssot-research; the MCP rung in info_find.py is policy-read only.
  allowed: [mcp_read_ssot, mcp_search_ssot, mcp_ssot_query,
            mcp_ssot_get, mcp_mddb_doc]
  denied: [mcp_raw, mcp_put_file, mcp_remediate, mcp_ssot_append,
           mcp_clipboard_set, mcp_clipboard_get, mcp_clipboard_image_get,
           mcp_eget, mcp_screenshot, mcp_window_list, mcp_preset_run,
           mcp_adaptive, mcp_debug, mcp_health, mcp_get_file]
  upstream:
    name: mcp-debug-readonly
    proxy: ~/.config/devin/mcp-scripts/mcp-allowlist.py
    command: [/bin/bash, ~/.config/devin/mcp-scripts/mcp-debug-ssh.sh]
allowed_paths: []
artifact:
  mode: message
  format: json
  dirs: [evals/opencode-lane/out/, reports/]
  schema: >-
    evals/opencode-lane/profiles/info-find/fixture/task.yaml
    #contract.required_fields
verifier:
  type: held_out_py
  ref: evals/opencode-lane/profiles/info-find/fixture/verify.py
escalation:
  on_fail: manual
  allowed_on_fail: [manual, devin, retry_then_manual, hold]
  max_retries: 1
rollback:
  kind: none
rails: >-
  You are the info-find profile agent. Your ONLY bash command is
  `python3 scripts/devnest/info_find.py` — run `run --query "<q>"
  --format json` from the checkout root (add --quick for local-only or
  --collection <name> to pick MDDB collections). The query must be
  plain text — no shell metacharacters (>, <, |, ;, &, $, backticks).
  Also read files with the read/grep/glob tools. Every factual claim
  must cite a ref from the tool output: a repo path, an mddb:// key,
  or a URL. A source reporting status "unavailable" is normal — record
  it in unavailable_sources and keep going; rungs marked "deferred"
  (e.g. web) go in deferred_rungs — do NOT emulate them yourself. If
  nothing answers the question, say "not found" and list what was
  consulted. You may not write files, run any other shell command, or
  read anything under ~/.config/secrets. Emit ONLY the JSON artifact
  as your final message.
