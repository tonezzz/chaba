# Task-scoped OpenCode agent profile — mddb-sequence
# (card nest-opencode-executor-eval; MEM-0871 eval template).
#
# Read-only checkable-sequence planner for the mddb prune/compact
# runbook (docs/kb/mddb-prune-compact.md). The agent collects live bank
# state through ONE bounded tool — scripts/devnest/mddb_probe.py, which
# exposes only GETs and read-only search scans — reads the runbook, and
# emits a sequenced plan where every step carries a machine-checkable
# `check`. Mutating steps are planned, never executed: the agent holds
# no write tools and the plan marks every mutating step
# executor=human. The held-out verifier recomputes every number against
# the live banks and re-checks plan structure — nothing is trusted from
# the narrative.
id: mddb-sequence
version: 1
status: enabled
unattended: true
description: >-
  Checkable-sequence planner for runbook ops (template: MEM-0871 mddb
  prune/compact). Collects live state via the read-only mddb_probe.py
  allowlist entry, then emits a plan JSON whose every step carries a
  check the held-out verifier can recompute.
task_classes: [read_only, report]
stages: [S1, S2, S3]
target_host:
  required: true          # envelope must name the executing runner host
  allowed: []             # [] = any runner host (probe reaches idc03
                          # banks over tailnet from any worker)
model:
  tier: cheap
  default: litellm/gemini-3.5-flash-lite
  allowed: [litellm/gemini-3.5-flash-lite, litellm/gemini-3.5-flash]
providers: [litellm]
agent:
  mode: primary
# builtin tool toggles rendered into the opencode agent
tools:
  read: true              # the runbook lives in-repo (docs/kb/)
  grep: true
  glob: true
  list: true
  todoread: true
  todowrite: true
  bash: true              # bounded to the probe allowlist below
  write: false
  edit: false
  patch: false
  task: false
  webfetch: false
# opencode permission rules rendered into the agent. The ONLY
# network-capable command is the probe script — it is read-only by
# construction, so no argument the agent can pass reaches a mutating
# mddb endpoint. Everything else in bash is a hard deny.
permission:
  edit: deny
  webfetch: deny
  external_directory: deny
  doom_loop: ask
  bash:
    "*": deny
    "hostname": allow
    "hostname *": allow
    "date": allow
    "date *": allow
    "python3 scripts/devnest/mddb_probe.py": allow
    "python3 scripts/devnest/mddb_probe.py *": allow
mcp:
  # ceiling — envelopes may narrow, never widen. Same read-only set as
  # ops-readonly; rendered only when the host provides the allowlist
  # proxy (idc02 does not — envelopes run mcp_allowlist: []).
  allowed: [mcp_debug, mcp_health, mcp_get_file, mcp_read_ssot,
            mcp_search_ssot, mcp_ssot_query, mcp_ssot_get, mcp_mddb_doc]
  denied: [mcp_raw, mcp_put_file, mcp_remediate, mcp_ssot_append,
           mcp_clipboard_set, mcp_clipboard_get, mcp_clipboard_image_get,
           mcp_eget, mcp_screenshot, mcp_window_list, mcp_preset_run,
           mcp_adaptive]
  upstream:
    name: mcp-debug-readonly
    proxy: ~/.config/devin/mcp-scripts/mcp-allowlist.py
    command: [/bin/bash, ~/.config/devin/mcp-scripts/mcp-debug-ssh.sh]
allowed_paths: []
artifact:
  mode: message           # agent emits the plan as its final message;
                          # the runner writes it — no write tools held
  format: json
  dirs: [evals/opencode-lane/out/, reports/]
  schema: >-
    evals/opencode-lane/profiles/mddb-sequence/fixture/task.yaml
    #contract.required_fields
verifier:
  type: held_out_py       # floor — envelopes may strengthen to
                          # independent_devin, never weaken
  ref: evals/opencode-lane/profiles/mddb-sequence/fixture/verify.py
escalation:
  on_fail: manual
  allowed_on_fail: [manual, devin, retry_then_manual, hold]
  max_retries: 1
rollback:
  kind: none              # agent writes nothing; the runner-written
                          # artifact is simply removed
rails: >-
  You are the mddb-sequence profile agent. You produce a READ-ONLY
  preflight plan for the mddb prune/compact runbook
  (docs/kb/mddb-prune-compact.md). You may read repo files and run ONLY
  the allowlisted probe script for live bank state — every other bash
  command is denied and counts against the job. You never execute
  mutating steps: delete/truncate/compact/swap actions appear in the
  plan with executor="human" and mutating=true, never as work you
  performed. Do not read anything under ~/.config/secrets. Your plan is
  your final message: emit ONLY the JSON artifact, no prose around it.
