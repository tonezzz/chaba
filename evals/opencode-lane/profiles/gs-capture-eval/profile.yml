id: gs-capture-eval
version: 1
status: enabled
unattended: true
description: >-
  Read-only Gaussian Splat capture-set evaluation via the mcp-kornia
  MCP server (OPS-1055). The agent calls the five read-only evaluator
  tools against a declared local image set and emits a JSON report;
  it holds no bash, write, or edit tools. Heavy matcher backends
  (torch/kornia, LPIPS) degrade cleanly; the cv2 path is the baseline.
task_classes:
- read_only
- read_only
- report
stages:
- S1
- S2
- S3
target_host:
  required: true
  allowed:
  - idc02
model:
  tier: cheap
  default: litellm/gemini-3.5-flash-lite
  allowed:
  - litellm/gemini-3.5-flash-lite
  - litellm/gemini-3.5-flash
  - litellm/or-free-nemotron-nano
  - litellm/or-gemini-3.5-flash-lite
  - litellm/or-gemini-3.5-flash
providers:
- litellm
agent:
  mode: primary
tools:
  read: true
  grep: true
  glob: true
  list: true
  todoread: true
  todowrite: true
  bash: false
  write: false
  edit: false
  patch: false
  task: false
  webfetch: false
permission:
  edit: deny
  webfetch: deny
  external_directory: deny
  doom_loop: ask
mcp:
  allowed:
  - inspect_image_set
  - match_views
  - propose_foreground_masks
  - score_capture_manifest
  - compare_gs_runs
  denied:
  - mcp_raw
  - mcp_put_file
  - mcp_remediate
  - mcp_ssot_append
  - mcp_clipboard_set
  - mcp_clipboard_get
  - mcp_clipboard_image_get
  - mcp_eget
  - mcp_screenshot
  - mcp_window_list
  - mcp_preset_run
  - mcp_adaptive
  upstream:
    name: mcp-kornia
    proxy: ~/.config/devin/mcp-scripts/mcp-allowlist.py
    command:
    - /home/tony/.local/share/mcp-kornia-venv/bin/python
    - /home/tony/CascadeProjects/chaba/mcp-servers/mcp-kornia/server.py
allowed_paths: []
artifact:
  mode: message
  format: json
  dirs:
  - evals/opencode-lane/out/
  - reports/
  schema: 'evals/opencode-lane/profiles/gs-capture-eval/fixture/task.yaml #contract.required_fields'
verifier:
  type: held_out_py
  ref: evals/opencode-lane/profiles/gs-capture-eval/fixture/verify.py
escalation:
  on_fail: manual
  allowed_on_fail:
  - manual
  - devin
  - retry_then_manual
  - hold
  max_retries: 1
rollback:
  kind: none
rails: 'You are the gs-capture-eval profile agent. You evaluate Gaussian
  Splat capture sets ONLY through the mcp-kornia MCP tools — never by
  reading images yourself, never by writing scripts. All five tools are
  read-only; do not attempt training, deletion, upload, or publication.
  Do not read anything under ~/.config/secrets. Your report is your final
  message: emit ONLY the artifact JSON, no prose around it.'
