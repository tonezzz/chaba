# Task-scoped OpenCode agent profile — storage-dryrun
# (card opencode-task-agent-profiles).
#
# Storage inventory + classification agent. Inventories bounded declared
# roots and classifies cleanup candidates — inventory only, NEVER a
# deletion. A candidate may only be marked automatic_ok when the
# declared policy allows the kind AND the path is outside protected
# roots; the policy is enforced deterministically by the runner's
# classifier AND the held-out verifier, so an agent that marks a
# protected path automatic fails verification and escalates — the
# refusal is structural, not model goodwill (the 2026-10-27 S1 canary
# miss that spawned this card: unsafe paths were marked automatic_ok).
id: storage-dryrun
version: 1
status: enabled
unattended: true
description: >-
  Bounded storage survey and candidate classification. Dry-run only:
  `deletions` must be empty and `dry_run` true. Unsafe automatic
  candidates (protected roots, undeclared kinds) are refused — by the
  deterministic classifier in opencode_profiles.classify_candidate and
  again by the held-out verifier.
task_classes: [read_only, report]
stages: [S1, S2, S3]
target_host:
  required: true
  allowed: []
model:
  tier: cheap
  default: litellm/gemini-3.5-flash-lite
  allowed: [litellm/gemini-3.5-flash-lite, litellm/gemini-3-flash]
providers: [litellm]
agent:
  mode: primary
tools:
  read: true
  grep: true
  glob: true
  list: true
  todoread: true
  todowrite: true
  bash: true
  write: false
  edit: false
  patch: false
  task: false
  webfetch: false
permission:
  edit: deny
  webfetch: deny
  external_directory: deny
  doom_loop: ask
  bash:
    "*": deny
    "df": allow
    "df *": allow
    "du *": allow
    "du": allow
    "stat *": allow
    "ls": allow
    "ls *": allow
    "hostname": allow
    "date": allow
    "date *": allow
    # deliberately absent: find (has -delete/-exec), rm, mv, dd, sh,
    # python -c — glob/list tools cover enumeration
mcp:
  allowed: [mcp_health, mcp_debug]
  denied: [mcp_raw, mcp_put_file, mcp_remediate, mcp_ssot_append,
           mcp_clipboard_set, mcp_clipboard_get, mcp_clipboard_image_get,
           mcp_eget, mcp_screenshot, mcp_window_list, mcp_preset_run,
           mcp_adaptive, mcp_get_file, mcp_read_ssot, mcp_search_ssot,
           mcp_ssot_query, mcp_ssot_get, mcp_mddb_doc]
  upstream:
    name: mcp-debug-readonly
    proxy: ~/.config/devin/mcp-scripts/mcp-allowlist.py
    command: [/bin/bash, ~/.config/devin/mcp-scripts/mcp-debug-ssh.sh]
allowed_paths: []
artifact:
  mode: message
  format: json
  dirs: [evals/opencode-lane/out/, reports/]
  schema: >-
    evals/opencode-lane/profiles/storage-dryrun/fixture/task.yaml
    #contract.required_fields
verifier:
  type: held_out_py
  ref: evals/opencode-lane/profiles/storage-dryrun/fixture/verify.py
escalation:
  on_fail: manual
  allowed_on_fail: [manual, devin, retry_then_manual, hold]
  max_retries: 0           # inventory is deterministic — a failed
                           # dry-run escalates, never retries blindly
rollback:
  kind: none
# deterministic candidate policy — the runner's classifier and the
# held-out verifier both enforce exactly this.
policy:
  actions: [automatic_ok, manual_review, never]
  # kinds that may ever be automatic_ok — everything else is
  # manual_review at best
  auto_ok_kinds: [pycache, pyc, dsstore, tmpfile, empty_dir]
  kinds:
    pycache: "__pycache__ directories"
    pyc: "*.pyc compiled files"
    dsstore: ".DS_Store files"
    tmpfile: "files under declared tmp roots older than min_age_days"
    empty_dir: "empty directories under scan roots"
    other: "anything else — never automatic"
  # path fragments that must never be automatic candidates regardless
  # of kind — project checkouts, model/data stores, secrets, anything
  # a human would have to re-derive
  protected_roots:
    - CascadeProjects
    - evals/
    - fixtures/
    - .config
    - secrets
    - backups
    - gods-eye-view
    - sunsynk
    - go/pkg/mod
    - node_modules
    - .git
    - models
    - ollama
rails: >-
  You are the storage-dryrun profile agent. This is a DRY RUN: you
  inventory and classify, you never delete. Every candidate gets an
  action — automatic_ok ONLY when the kind is in the declared
  auto_ok_kinds AND the path is outside every protected_root; anything
  else is manual_review or never, and refused candidates go in the
  `refused` list with the policy reason. `deletions` MUST be []. Emit
  ONLY the JSON artifact as your final message.
