# Task-scoped OpenCode agent profile — branch-code
# (card opencode-task-agent-profiles).
#
# Isolated-worktree code agent for S5 branch/code tasks: strong-tier
# model, isolated git worktree, tests + independent review REQUIRED.
# Enabled only for Tony-approved supervised pilot runs; unattended routing remains disabled.
id: branch-code-supervised-pilot
version: 1
status: enabled           # one-off Tony-approved supervised pilot
unattended: false         # never serves unattended routing
description: >-
  Branch/code tasks only: an isolated worktree, a strong-tier model,
  mandatory test execution, and an independent_devin verifier. The
  the profile is enabled only for Tony-approved supervised pilots;
  it never serves unattended routing.
task_classes: [branch_code]
stages: [S5]
target_host:
  required: true
  allowed: [idc02]         # Tony-approved one-off pilot runner
model:
  tier: strong            # envelope model must be in STRONG_MODELS
  default: litellm/claude-fable-5.1
  allowed: [litellm/claude-fable-5.1, litellm/gemini-3-pro,
            litellm/or-claude-fable-5.1, litellm/or-gemini-3.1-pro-preview]
providers: [litellm, openrouter]
agent:
  mode: primary
tools:
  read: true
  grep: true
  glob: true
  list: true
  todoread: true
  todowrite: true
  bash: true
  write: true             # confined to the isolated worktree
  edit: true
  patch: true
  task: false
  webfetch: false
permission:
  edit: allow             # worktree-confined writes
  webfetch: deny
  external_directory: deny
  doom_loop: ask
  bash:
    "*": deny
    # test/build surface only — no git mutation beyond add/commit in
    # the worktree, no network, no services
    "python3 *": allow
    "python3": allow
    "python -m unittest *": allow
    "pytest *": allow
    "make *": allow
    "git status *": allow
    "git status": allow
    "git diff *": allow
    "git diff": allow
    "git log *": allow
    "git add *": allow
    "git commit *": allow
    "ls": allow
    "ls *": allow
    "cat *": allow
    "find *": allow
mcp:
  allowed: [mcp_read_ssot, mcp_search_ssot, mcp_ssot_query, mcp_ssot_get]
  denied: [mcp_raw, mcp_put_file, mcp_remediate, mcp_ssot_append,
           mcp_clipboard_set, mcp_clipboard_get, mcp_clipboard_image_get,
           mcp_eget, mcp_screenshot, mcp_window_list, mcp_preset_run,
           mcp_adaptive, mcp_debug, mcp_health, mcp_mddb_doc]
  upstream:
    name: mcp-debug-readonly
    proxy: ~/.config/devin/mcp-scripts/mcp-allowlist.py
    command: [/bin/bash, ~/.config/devin/mcp-scripts/mcp-debug-ssh.sh]
allowed_paths: [scripts/, tests/, docs/, evals/]
isolation:
  worktree: required      # runs in a profile/<job> worktree+branch,
                          # never the live checkout
artifact:
  mode: file              # the agent writes real files in the worktree;
                          # the artifact is the diff/test report
  format: json
  dirs: [evals/opencode-lane/out/, reports/]
  schema: >-
    evals/opencode-lane/profiles/branch-code/fixture/task.yaml
    #contract.required_fields
verifier:
  type: independent_devin # floor — branch/code never self-verifies
  ref: evals/opencode-lane/profiles/branch-code/fixture/verify.py
  require_tests: true     # artifact must record tests_run/test_passed
  require_review: true    # artifact must carry a review_ref
escalation:
  on_fail: manual
  allowed_on_fail: [manual, hold]
  max_retries: 0
rollback:
  kind: worktree-drop     # floor — envelope may pick worktree-drop or
                          # git-revert, never none/file-restore
rails: >-
  You are the branch-code profile agent inside an isolated worktree.
  Implement the task, run the tests, and produce the declared JSON
  artifact. You may not push, merge, touch other worktrees, or read
  secrets. Tests must actually run — a skipped test run fails the
  verifier.
