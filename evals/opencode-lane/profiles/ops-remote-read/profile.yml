# Task-scoped OpenCode agent profile — ops-remote-read (OPS-1025).
#
# Sibling of ops-readonly for REMOTE targets. ops-readonly's held-out
# verifier pins artifact.host == runner host, so remote diagnosis could
# never pass it (OPS-1021 first run, 2026-10-30). Here the target is a
# declared remote host: the agent reaches it through the mcp_debug
# read-only allowlist (the ssh surface — no ssh in bash), and the
# verifier independently re-probes the target itself, so the artifact
# can't be fabricated without actually reading the host.
id: ops-remote-read
version: 1
status: enabled
unattended: true
description: >-
  Read-only diagnosis of a declared REMOTE host. The agent collects
  facts about action.target_host via the mcp_debug read-only allowlist
  (no ssh in bash, no writes anywhere) and emits a JSON report artifact
  as its final message. The held-out verifier re-probes the target over
  its own ssh and compares — the agent's narrative is never trusted.
task_classes:
- read_only
- report
- diagnosis
stages:
- S1
- S2
- S3
target_host:
  required: true          # remote diagnosis without a target is meaningless
  allowed: []             # any tailnet host
model:
  tier: cheap
  default: litellm/gemini-3.5-flash-lite
  allowed:
  - litellm/gemini-3.5-flash-lite
  - litellm/gemini-3-flash
  - litellm/or-free-nemotron-nano
  - litellm/or-gemini-3.5-flash-lite
  - litellm/or-gemini-3.5-flash
providers:
- litellm
agent:
  mode: primary
tools:
  read: true
  grep: true
  glob: true
  list: true
  todoread: true
  todowrite: true
  bash: true
  write: false
  edit: false
  patch: false
  task: false
  webfetch: false
permission:
  edit: deny
  webfetch: deny
  external_directory: deny
  doom_loop: ask
  bash:
    '*': deny
    hostname: allow
    hostname *: allow
    uname: allow
    uname *: allow
    whoami: allow
    date: allow
    date *: allow
    uptime: allow
    uptime *: allow
    nproc: allow
    nproc *: allow
    lscpu: allow
    lscpu *: allow
    df: allow
    df *: allow
    du *: allow
    free: allow
    free *: allow
    ls: allow
    ls *: allow
    stat *: allow
    ss *: allow
    ps *: allow
    journalctl *: allow
    systemctl list-units *: allow
    systemctl --user list-units *: allow
    systemctl list-timers *: allow
    systemctl --user list-timers *: allow
    systemctl status *: allow
    systemctl --user status *: allow
    systemctl is-active *: allow
    systemctl --user is-active *: allow
    systemctl is-enabled *: allow
    systemctl --user is-enabled *: allow
    systemctl show *: allow
    systemctl --user show *: allow
mcp:
  # remote reads ride the mcp_debug allowlist — the controlled ssh
  # surface (same upstream as ops-readonly). Bash has no ssh: an agent
  # that claims remote facts without mcp_debug tool calls is fabricating,
  # and the held-out verifier re-probes the target to catch it anyway.
  allowed:
  - mcp_debug
  - mcp_health
  - mcp_get_file
  - mcp_read_ssot
  - mcp_search_ssot
  - mcp_ssot_query
  - mcp_ssot_get
  - mcp_mddb_doc
  denied:
  - mcp_raw
  - mcp_put_file
  - mcp_remediate
  - mcp_ssot_append
  - mcp_clipboard_set
  - mcp_clipboard_get
  - mcp_clipboard_image_get
  - mcp_eget
  - mcp_screenshot
  - mcp_window_list
  - mcp_preset_run
  - mcp_adaptive
  upstream:
    name: mcp-debug-readonly
    proxy: ~/.config/devin/mcp-scripts/mcp-allowlist.py
    command:
    - /bin/bash
    - ~/.config/devin/mcp-scripts/mcp-debug-ssh.sh
allowed_paths: []
artifact:
  mode: message           # the final message IS the artifact
  format: json
  dirs:
  - evals/opencode-lane/out/
  - reports/
  schema: 'evals/opencode-lane/profiles/ops-remote-read/fixture/task.yaml #contract.required_fields'
verifier:
  type: held_out_py
  ref: evals/opencode-lane/profiles/ops-remote-read/fixture/verify.py
escalation:
  on_fail: manual
  allowed_on_fail:
  - manual
  - devin
  - retry_then_manual
  - hold
  max_retries: 1
rollback:
  kind: none
rails: >-
  You are the ops-remote-read profile agent. You diagnose the DECLARED
  remote target host (the card's action.target_host) using the mcp_debug
  read-only tools — ssh is intentionally absent from your bash allowlist.
  You may not write, edit, move, delete, install packages, or change
  services anywhere, local or remote — denied tool calls are recorded and
  fail the job. Do not read anything under ~/.config/secrets, on any host.
  Your report is your final message: emit ONLY the JSON artifact, no prose
  around it — the runner writes it to the declared artifact path.
