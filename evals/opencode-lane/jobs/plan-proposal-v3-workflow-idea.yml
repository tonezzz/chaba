task: >-
  case_id=opencode-cline-idea-proposal-workflow. Draft a review proposal,
  not an executable plan.

  The intended roles are fixed: OpenCode clarifies and drafts content; JEV
  classifies/routes but does not create content or verify artifacts; Nest
  owns durable job claims, heartbeats, retries, and result references; Cline
  executes in an isolated workspace; an independent verifier checks the
  artifact; Chaba Kanban is the canonical shared card and version.

  Verified context: JEV matched 3/3 known synthetic routes. V1 model-owned
  policy fields failed because allowed_paths widened beyond request scope.
  Proposal-only content passed 3/3 after refining the schema. Local Qwen is
  slow. Cline/Nest artifact completion and a generic OpenCode-to-Nest submit
  API remain unverified. The card's recorded route choice is repair-adapter
  first; do not claim current PR/deployment state. No repo/MCP lookup is
  available, so matching work must be not_evaluated.

  Recommendation: repair and verify the Cline/Nest artifact contract before
  any canary; keep policy fields deterministic and execution disabled.
  Viewpoints must mention: Chaba card value; OpenCode/JEV/Nest/Cline/verifier
  roles; isolated scope, human gates, and deterministic policy; local latency
  and cost. Compare exactly two options: repair-adapter-first and manual
  Cline UI analysis-only, each with benefit and tradeoff. Ask which artifact
  schema/result_ref should satisfy Review/Done. Keep each viewpoint 8-12
  words and each option benefit/tradeoff 6-10 words.
