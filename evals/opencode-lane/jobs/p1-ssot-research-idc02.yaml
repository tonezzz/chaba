# S1 profile job — ssot-research canary on idc02 (card
# opencode-task-agent-profiles). Real read-only retrieval job: answer
# from the checkout's SSOT with mandatory citations — no bash, no
# writes; the agent's final message is the artifact.
id: p1-ssot-research-idc02
card: opencode-task-agent-profiles
task_class: read_only
stage: S1
target_host: idc02
executor: opencode
profile: ssot-research
model: litellm/gemini-3.5-flash-lite
provider: litellm
unattended: true
task: >-
  What is the standard write path for kanban card mutations from a
  non-writer host, and which mechanism converges card files that arrive
  via dispatch worktree merges? Cite the governing docs.
mcp_allowlist: []           # local read/grep/glob tools cover the
                            # checkout; no mcp proxy on idc02
allowed_paths: [evals/opencode-lane/out/]
artifact:
  path: evals/opencode-lane/out/p1-ssot-research-answer.json
  schema: >-
    evals/opencode-lane/profiles/ssot-research/fixture/task.yaml
    #contract.required_fields
verifier:
  type: held_out_py
  ref: evals/opencode-lane/profiles/ssot-research/fixture/verify.py
escalation:
  on_fail: manual
  max_retries: 1
rollback:
  kind: none
heartbeat:
  required: true
  stale_s: 300
