# S0 shadow-replay envelope — frozen fixture worktree-safety (card
# opencode-graduated-routing-standard). Admitted only while the lane is
# at stage S0; pairs the deterministic l0 arm with the opencode arm.
id: s0-worktree-safety
card: opencode-graduated-routing-standard
task_class: shadow_replay
stage: S0
target_host: tony-macbook
executor: opencode
fixture: worktree-safety
pair_arms: [l0, opencode]
model: litellm/gemini-3.5-flash-lite
provider: litellm
mcp_allowlist: []
allowed_paths: [evals/shadow/task/]
artifact:
  path: evals/shadow/task/artifacts/worktree-safety.json
  schema: evals/shadow/fixtures/worktree-safety/task.yaml#contract.required_fields
verifier:
  type: held_out_py
  ref: evals/shadow/fixtures/worktree-safety/verify.py
escalation:
  on_fail: manual
  max_retries: 1
rollback:
  kind: worktree-drop
  ref: shadow/<run>-<arm>-worktree-safety branch+worktree dropped by shadow_eval clean
heartbeat:
  required: false
