task_class: read_only
stage: S1
target_host: idc02
executor: opencode
profile: gs-capture-eval
model: litellm/gemini-3.5-flash-lite
provider: litellm
unattended: true
task: >-
  image_dir=/home/tony/.local/share/ada/gs-fixtures/hibiscus-v1/original
mcp_allowlist:
- inspect_image_set
- score_capture_manifest
- match_views
allowed_paths: [evals/opencode-lane/out/]
artifact:
  path: evals/opencode-lane/out/p1-gs-capture-eval.json
  schema: >-
    evals/opencode-lane/profiles/gs-capture-eval/fixture/task.yaml
    #contract.required_fields
verifier:
