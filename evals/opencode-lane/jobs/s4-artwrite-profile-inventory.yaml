# S4 artifact_write job 1/5 — OpenCode lane profile inventory
# (card branch-code-s4-evidence-ladder, OPS-1030). First counted
# artifact_write-class job on the graduated lane: the agent writes
# ONE markdown file inside the S4 roots via write/edit (file-mode
# artifact — no bash, no message-mode emit). Runs on idc02 where the
# lane ledger lives; admits only when lane stage == S4.
id: s4-artwrite-profile-inventory
card: branch-code-s4-evidence-ladder
task_class: artifact_write
stage: S4
target_host: idc02
executor: opencode
profile: artifact-write
model: litellm/gemini-3.5-flash-lite
provider: litellm
unattended: true
mcp_allowlist: []
allowed_paths: [evals/opencode-lane/out/]
artifact:
  path: evals/opencode-lane/out/s4-artwrite-profile-inventory.md
  schema: >-
    evals/opencode-lane/profiles/artifact-write/fixture/task.yaml
    #contract.required_fields
verifier:
  type: held_out_py
  ref: evals/opencode-lane/profiles/artifact-write/fixture/verify.py
escalation:
  on_fail: manual
  max_retries: 1
rollback:
  kind: worktree-drop
  ref: dispatch/profile-run worktree dropped after review; artifact is
    a single new file under evals/opencode-lane/out/
heartbeat:
  required: false
timeout_s: 420
task: >-
  Write a markdown inventory of every task-scoped OpenCode lane
  profile in this checkout. Read each
  evals/opencode-lane/profiles/<id>/profile.yml and report a table:
  profile id, status (enabled/disabled), unattended flag, task
  classes, stages, artifact mode (message vs file), verifier type,
  rollback kind. Then a short paragraph on which profiles are
  write-capable (tools.write/edit/patch true) and which are
  read-only. The file must mention artifact-write, branch-code, and
  ops-readonly verbatim. Begin the file with a single `# ` title
  line.
