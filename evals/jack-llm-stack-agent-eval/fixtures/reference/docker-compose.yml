# Disposable Jack LLM stack — real deployment (container host required).
# The eval/mock path uses mock/ instead; this file is the production-shape
# artifact reviewed for correctness, not executed on the eval host.
name: jack-llm-stack

services:
  ollama:
    image: ollama/ollama:latest
    container_name: jack-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      # Resource limits — single small model, single user
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "5m"
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_HOST: "0.0.0.0"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: "2.0"
          pids: 256
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 3

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: jack-litellm
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - .env
    environment:
      JACK_OLLAMA_URL: http://ollama:11434
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
          pids: 128
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness',timeout=5)\""]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  ollama_models:
