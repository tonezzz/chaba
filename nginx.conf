server {
    listen 80;
    server_name localhost;
    root /app/public;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /apps/raceman/ {
        alias /app/public/apps/raceman/;
        try_files $uri $uri/ /apps/raceman/index.html;
    }

    # Static assets (served from root for proxy access)
    location /assets/ {
        alias /app/public/assets/;
    }

    location /apps/common.css {
        alias /app/public/apps/common.css;
    }

    location /apps/nav.js {
        alias /app/public/apps/nav.js;
    }

    # Handle relative paths from raceman directory
    location ~ ^/apps/raceman/(.+\.(css|js))$ {
        alias /app/public/apps/raceman/$1;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass raceman-php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
