server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /apps/raceman/ {
        alias /usr/share/nginx/html/apps/raceman/;
        try_files $uri $uri/ /apps/raceman/index.html;
    }

    # Static assets (served from root for proxy access)
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
    }

    location /apps/common.css {
        alias /usr/share/nginx/html/apps/common.css;
    }

    location /apps/nav.js {
        alias /usr/share/nginx/html/apps/nav.js;
    }

    # Handle relative paths from raceman directory
    location ~ ^/apps/raceman/(.+\.(css|js))$ {
        alias /usr/share/nginx/html/apps/raceman/$1;
    }
}
