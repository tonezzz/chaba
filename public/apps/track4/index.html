<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Windsurfing Course Simulation</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <link rel="stylesheet" href="/assets/tailwind.css">
    <link rel="stylesheet" href="/apps/common.css">
  <link rel="stylesheet" href="track.css">
</head>
<body class="bg-bg">
  <div id="app-nav"></div>

  <div class="relative">
    <div id="map"></div>
    <div class="course-panel bg-card/95 border border-gray-700 rounded-lg p-4 shadow-lg w-80 text-sm">
      <div class="flex gap-2 mb-3">
        <button id="tab-course" class="flex-1 px-2 py-1 text-xs rounded bg-gray-800 text-gray-300">COURSE</button>
        <button id="tab-map" class="flex-1 px-2 py-1 text-xs rounded bg-gray-800 text-gray-300">MAP</button>
        <button id="tab-sections" class="flex-1 px-2 py-1 text-xs rounded bg-gray-800 text-gray-300">SECTIONS</button>
        <button id="tab-sim" class="flex-1 px-2 py-1 text-xs rounded bg-gray-700 text-white">SIM</button>
        <button id="tab-yaml" class="flex-1 px-2 py-1 text-xs rounded bg-gray-800 text-gray-300">YAML</button>
      </div>

      <div id="tab-course-content" class="hidden">
        <h2 class="font-semibold text-white mb-2">Race Course Guide</h2>
        <div id="summary" class="text-xs text-gray-400 mb-3">Loading...</div>
        <div id="brief" class="text-xs text-gray-300 mb-3"></div>
        <div class="border-t border-gray-700 pt-2 mb-3">
          <h3 class="font-semibold text-white text-xs mb-1">Legs</h3>
          <div id="legs" class="space-y-1 text-xs">Loading...</div>
        </div>
        <div class="border-t border-gray-700 pt-3">
          <h3 class="font-semibold text-white text-xs mb-2">Save / Load</h3>
          <div class="flex gap-1 mb-2">
            <input id="course-name" type="text" placeholder="name" class="flex-1 px-2 py-1 text-xs rounded bg-gray-800 border border-gray-600 text-white" value="">
            <button id="btn-save" class="px-2 py-1 text-xs rounded bg-accent text-white">Save</button>
          </div>
          <div class="flex gap-1 mb-2">
            <select id="course-select" class="flex-1 px-2 py-1 text-xs rounded bg-gray-800 border border-gray-600 text-white">
              <option value="">Load course...</option>
            </select>
            <button id="btn-load" class="px-2 py-1 text-xs rounded bg-gray-700 text-white">Load</button>
          </div>
          <div id="course-msg" class="text-xs text-accent min-h-[1em]"></div>
        </div>
      </div>

      <div id="tab-map-content" class="hidden">
        <div class="space-y-2 mb-3">
          <label class="flex items-center gap-2 text-xs cursor-pointer"><input id="toggle-guide" type="checkbox" checked class="accent-accent"> แสดงเส้นทาง</label>
          <label class="flex items-center gap-2 text-xs cursor-pointer"><input id="toggle-markers" type="checkbox" checked class="accent-accent"> แสดงทุ่น</label>
          <label class="flex items-center gap-2 text-xs cursor-pointer"><input id="toggle-zones" type="checkbox" checked class="accent-accent"> แสดงวงรอบทุ่น</label>
        </div>
      </div>

      <div id="tab-sections-content" class="hidden">
        <h3 class="font-semibold text-white text-xs mb-1">
          <label class="flex items-center gap-2 cursor-pointer">
            <input id="check-all-sections" type="checkbox" checked> Race Sections
          </label>
        </h3>
        <div id="sections-list" class="space-y-1 text-xs">No sections</div>
      </div>
      <div id="tab-sim-content">
        <h3 class="font-semibold text-white text-xs mb-2">Race Simulation</h3>
        <div class="space-y-2 mb-3 text-xs">
          <label class="flex items-center gap-2 cursor-pointer"><input id="toggle-focus-leader" type="checkbox" checked class="accent-accent"> Focus Leader (L)</label>
          <div id="focus-status" class="text-accent text-xs"></div>
        </div>
        <div class="border-t border-gray-700 pt-2 mb-3">
          <h3 class="font-semibold text-white text-xs mb-2">Wind Configuration</h3>
          <div class="space-y-2 mb-2 text-xs">
            <div class="flex items-center justify-between">
              <span>Direction</span>
              <span id="wind-direction-value" class="text-accent">180°</span>
            </div>
            <input id="wind-direction" type="range" min="0" max="360" value="180" class="w-full accent-accent">
            <div class="flex items-center justify-between">
              <span id="wind-direction-label" class="text-gray-400">S</span>
              <span>Compass</span>
            </div>
            <div class="flex items-center justify-between mt-2">
              <span>Speed</span>
              <span id="wind-speed-value" class="text-accent">15</span>
            </div>
            <input id="wind-speed" type="range" min="5" max="30" value="15" class="w-full accent-accent">
            <div class="flex items-center justify-between mt-2">
              <span>Gust Factor</span>
              <span id="wind-gust-value" class="text-accent">0.20</span>
            </div>
            <input id="wind-gust" type="range" min="0" max="0.5" step="0.05" value="0.2" class="w-full accent-accent">
            <button id="apply-wind" class="w-full mt-2 px-2 py-1 text-xs rounded bg-accent text-white">Apply Wind</button>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2 mb-3">
          <button id="sim-start" class="px-2 py-1 text-xs rounded bg-green-700 text-white">Start</button>
          <button id="sim-reset" class="px-2 py-1 text-xs rounded bg-gray-700 text-white">Reset</button>
        </div>
        <div class="space-y-2 mb-3 text-xs">
          <label class="flex items-center justify-between">Racers <input id="sim-racers" type="range" min="2" max="10" value="10" class="accent-accent"></label>
          <label class="flex items-center justify-between">Speed <input id="sim-speed" type="range" min="0.5" max="3" step="0.5" value="1" class="accent-accent"></label>
        </div>
        <div id="sim-standings" class="space-y-1 text-xs">Press Start to simulate</div>
      </div>
      <div id="tab-yaml-content" class="hidden">
        <h3 class="font-semibold text-white text-xs mb-2">YAML Editor</h3>
        <textarea id="yaml-text" class="w-full h-40 px-2 py-1 text-xs rounded bg-gray-800 border border-gray-600 text-white font-mono mb-2" spellcheck="false"></textarea>
        <div class="flex gap-1 mb-2">
          <button id="btn-save-yaml" class="flex-1 px-2 py-1 text-xs rounded bg-accent text-white">Save YAML</button>
          <button id="btn-cancel-yaml" class="flex-1 px-2 py-1 text-xs rounded bg-gray-700 text-white">Cancel</button>
        </div>
        <div id="yaml-msg" class="text-xs text-accent min-h-[1em]"></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/apps/nav.js"></script>
  <script src="course.js"></script>
  <script src="themes/default.js"></script>
  <script src="renderer.js"></script>
  <script src="wind-system.js"></script>
  <script src="leader-focus.js"></script>
  <script src="state-manager.js"></script>
  <script src="simulation.js"></script>
  <script src="course-manager.js"></script>
  <script src="yaml-editor.js"></script>
    <script src="track.js"></script>
</body>
</html>
