<!doctype html>
<html lang="en">
<head>

  <title>tony-dell</title>
  <link rel="stylesheet" href="/assets/tailwind.css">
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; }
    body.bright { background-color: #f8fafc; color: #111827; }
    body.bright .bg-card { background-color: #ffffff; }
    body.bright .border-gray-700 { border-color: #e2e8f0; }
    body.bright .text-gray-200 { color: #111827; }
    body.bright .text-white { color: #111827; }
    body.bright .text-gray-400 { color: #64748b; }

    body.bright .divide-gray-200 { border-color: #e2e8f0; }
    .app-card { display: block; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 0.75rem; padding: 1rem; box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05); transition: all 0.15s; }

    .docs-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; background-color: #f1f5f9; color: #0f172a; padding: 0.125rem 0.375rem; border-radius: 0.25rem; font-size: 0.8rem; }

<body class="bg-bg text-gray-200 min-h-screen bright">
