title: tony-omen
subtitle: Docker host, GPU/NVR server
icon: 🖥️
sections:
  - title: Overview
    icon: 🖥️
    layout: grid-2
    items:
      - title: Hostname
        value: tony-omen
      - title: IP
        value: 192.168.1.48
      - title: Role
        value: Docker host, GPU/NVR server
      - title: GPU
        value: NVIDIA (CUDA 11.8+)

  - title: Apps
    icon: 🗂️
    layout: apps

  - title: Docker Stacks
    icon: 🐳
    layout: table
    headers: [Stack, Service, Port, Notes]
    rows:
      - [Web, Caddy, '8080', 'Static files + reverse proxy']
      - [Web, 'Caddy (parity)', '8081', 'chaba.h3 root preview']
      - [Web, status-api, '8000', 'FastAPI status backend']
      - [Web, camera-control, '8090', 'Flask camera registry panel']
      - [Frigate, frigate, '5000', 'NVR Web UI']
      - [Frigate, 'RTSP restream', '8554', '—']
      - [Frigate, WebRTC, '8555', 'TCP + UDP']
      - [Main, nerfstudio, '7007', 'Web viewer']
      - [Main, jupyter, '8888', 'JupyterLab']

  - title: Runbooks
    icon: 🛠️
    layout: runbook
    items:
      - service: Web stack
        description: Caddy, status-api, camera-control, bserver, imagen, imagen2
        stack: /home/tony/CascadeProjects/chaba/stacks/web/docker-compose.yml
        start_command: 'cd /home/tony/CascadeProjects/chaba/stacks/web && docker compose up -d'
        env_file: stacks/web/.env
        pre_requisites: Docker + NVIDIA Container Toolkit for imagen services
        depends_on: frigate_default Docker network
        health_check: 'http://192.168.1.48:8080, http://192.168.1.48:8081'
        backup_paths: 'stacks/web/Caddyfile, stacks/web/public, chaba-h3/public'
        last_verified: 2026-07-26

      - service: Frigate NVR
        stack: /home/tony/CascadeProjects/chaba/frigate/docker-compose.yml
        start_command: 'cd /home/tony/CascadeProjects/chaba/frigate && docker compose up -d'
        pre_requisites: config.yml generated from cameras.json
        depends_on: frigate/cameras.json
        health_check: 'http://192.168.1.48:5000'
        backup_paths: 'frigate/cameras.json, frigate/config.yml, frigate/storage, frigate/db'
        last_verified: 2026-07-26

      - service: GPU / 3DGS research stack
        stack: /home/tony/CascadeProjects/chaba/docker-compose.yml
        start_command: 'cd /home/tony/CascadeProjects/chaba && docker compose up -d <service>'
        pre_requisites: NVIDIA Container Toolkit + CUDA 11.8+
        health_check: 'nerfstudio 7007, jupyter 8888'
        backup_paths: 'data/, outputs/, notebooks/'
        last_verified: 2026-07-26

  - title: Host-level services
    icon: ⚙️
    layout: runbook
    items:
      - service: Barrier server
        description: KVM server for tony-omen -> tony-dell
        start_command: 'systemctl --user enable --now barriers.service'
        pre_requisites: 'apt install barrier; copy ~/.barrier/barrier.conf'
        depends_on: 'x11vnc-gdm.service or local X session, tony-dell barrierc'
        health_check: 'ss -ltn | grep 24800'
        backup_paths: '~/.barrier/barrier.conf, ~/.config/systemd/user/barriers.service'
        last_verified: 2026-07-26

      - service: Google Drive mount
        description: rclone mount for GoogleDrive
        start_command: 'systemctl --user enable --now rclone-gdrive.service'
        pre_requisites: 'rclone configured with gdrive remote'
        health_check: 'ls ~/GoogleDrive'
        backup_paths: '~/.config/rclone/rclone.conf, ~/.config/systemd/user/rclone-gdrive.service'
        last_verified: 2026-07-26

      - service: VNC login screen
        description: x11vnc for LightDM shared session
        start_command: 'sudo systemctl enable --now x11vnc-gdm.service'
        pre_requisites: 'LightDM + XFCE, x11vnc installed'
        depends_on: graphical.target
        health_check: 'ss -ltn | grep 5900'
        backup_paths: '/etc/systemd/system/x11vnc-gdm.service'
        last_verified: 2026-07-26
