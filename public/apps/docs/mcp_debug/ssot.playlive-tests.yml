title: MCP Debug H3 PlayLive Test Cases
subtitle: Browser-driven verification for the mcp_debug savings report page

base_url: https://chaba.h3.gizmo-thailand.com/apps/docs/mcp_debug

prerequisites:
  - The H3 PHP proxy reaches the tony-dell Tailscale Funnel endpoint at https://tony-dell.taila0626a.ts.net/mcp-savings.json.
  - If the Funnel endpoint is unreachable, the PHP proxy falls back to the static data/mcp-savings.json snapshot.

components:
  - name: savings_report
    test_page: index.html
    cases:
      - step: Load index.html and wait for the initial report
        expected: "#status shows a generated ISO timestamp; #live-note indicates live or fallback; tony_omen and tony_dell tables render without JS errors."
      - step: Click the "Refresh" button
        expected: "A new live request is issued. When the PHP proxy reaches the upstream, #status timestamp updates to a new value and #live-note shows 'Live data from tony-omen'. If the upstream is unreachable, #status keeps the existing generated timestamp and #live-note reports that live data is unavailable."
      - step: Click a command row (e.g. "df -h" under tony_omen)
        expected: "The detail panel opens with a table of filesystems data; #detail-title matches the selected host and command."

  - name: table_detail
    test_page: index.html
    cases:
      - step: With a loaded report, click any row under a host
        expected: "Detail panel appears and the rendered table has at least one data row."
      - step: Click the Close button in the detail panel
        expected: "Detail panel is hidden (#detail has 'hidden' class)."
