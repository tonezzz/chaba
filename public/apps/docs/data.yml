title: System Overview
subtitle: A quick reference for the chaba.h3 site and the local tony-omen infrastructure behind it.
icon: 📚
sections:
  - title: Hosts
    icon: 🖥️
    layout: grid-2
    items:
      - title: tony-omen
        href: /apps/docs/tony-omen/
        description: Docker host, GPU/NVR server
        value: 192.168.1.48
      - title: tony-dell
        href: /apps/docs/tony-dell/
        description: Secondary workstation
        value: 192.168.1.42

  - title: Web
    icon: 🌐
    layout: list
    items:
      - label: Production
        href: https://chaba.h3.gizmo-thailand.com/
        text: https://chaba.h3.gizmo-thailand.com/ (Plesk static hosting)
      - label: Local preview (full parity)
        href: http://192.168.1.48:8081/
        text: http://192.168.1.48:8081/
      - label: Main chaba Caddy
        href: http://192.168.1.48:8080/
        text: http://192.168.1.48:8080/

  - title: Apps
    icon: 🗂️
    layout: apps

  - title: Docker Stacks
    icon: 🐳
    layout: table
    headers: [Stack, Service, Port, Notes]
    rows:
      - [Web, Caddy, '8080', 'Static files + reverse proxy']
      - [Web, 'Caddy (parity)', '8081', 'chaba.h3 root preview']
      - [Web, status-api, '8000', 'FastAPI status backend']
      - [Web, camera-control, '8090', 'Flask camera registry panel']
      - [Frigate, frigate, '5000', 'NVR Web UI']
      - [Frigate, 'RTSP restream', '8554', '—']
      - [Frigate, WebRTC, '8555', 'TCP + UDP']
      - [Main, nerfstudio, '7007', 'Web viewer']
      - [Main, jupyter, '8888', 'JupyterLab']

  - title: Runbooks
    icon: 🛠️
    layout: runbook
    items:
      - service: Camera map generator
        stack: /home/tony/CascadeProjects/chaba/frigate/generate_config.py
        start_command: 'cd /home/tony/CascadeProjects/chaba && python3 frigate/generate_config.py'
        pre_requisites: 'frigate/cameras.json up to date'
        depends_on: 'frigate/ directory'
        health_check: 'frigate/config.yml and frigate/camera-map.html updated'
        backup_paths: 'frigate/cameras.json'
        last_verified: 2026-07-26

      - service: mcp-llama / llama-server
        stack: /home/tony/CascadeProjects/chaba-omen/stacks/ai/docker-compose.yml
        start_command: 'cd /home/tony/CascadeProjects/chaba-omen/stacks/ai && docker compose up -d llama-server'
        env_file: chaba-omen/.env
        pre_requisites: 'NVIDIA Container Toolkit, model in chaba-omen/data/models/'
        depends_on: 'chaba-omen/data/models/'
        health_check: 'curl http://192.168.1.48:8008/health'
        backup_paths: 'chaba-omen/data/models/, chaba-omen/.env'
        last_verified: 2026-07-26

      - service: ChatLocal
        stack: /home/tony/CascadeProjects/chaba-omen/chat-uis/ChatLocal
        start_command: 'cd /home/tony/CascadeProjects/chaba-omen/chat-uis/ChatLocal && npm install && npm run start'
        pre_requisites: 'Node + npm installed'
        health_check: 'http://192.168.1.48:3000'
        backup_paths: 'chaba-omen/chat-uis/ChatLocal/data/chatlocal.db'
        last_verified: 2026-07-26

      - service: Neo Chat
        stack: /home/tony/CascadeProjects/chaba-omen/chat-uis/neo-chat
        start_command: 'cd /home/tony/CascadeProjects/chaba-omen/chat-uis/neo-chat && npm install && npm run start'
        pre_requisites: 'Node + npm installed'
        health_check: 'http://192.168.1.48:3001'
        backup_paths: 'chaba-omen/chat-uis/neo-chat/.env'
        last_verified: 2026-07-26

      - service: Yomi LINE export
        stack: /home/tony/CascadeProjects/chaba/scripts/yomi/update-conversations.mjs
        start_command: 'cd /home/tony/CascadeProjects/chaba && node scripts/yomi/update-conversations.mjs'
        pre_requisites: 'LINE session configured'
        health_check: 'stacks/web/public/apps/yomi/conversations.json updated'
        backup_paths: 'stacks/web/public/apps/yomi/conversations.json, stacks/web/public/apps/yomi/messages/, stacks/web/public/apps/yomi/media/, stacks/web/public/apps/yomi/summaries.json'
        last_verified: 2026-07-26

  - title: Backups
    icon: 💾
    layout: table
    headers: [Source, Destination, Notes]
    rows:
      - [frigate/storage, 'GoogleDrive or /data/backup', 'Recordings/clips (large)']
      - [frigate/db, 'GoogleDrive or /data/backup', 'Frigate SQLite DB']
      - [chaba-h3/apps_data, 'GoogleDrive or /data/backup', 'Track3/4 runtime state']
      - [chaba-h3/inference/data, 'GoogleDrive or /data/backup', 'Imagen history']
      - [chaba-h3/inference2/data, 'GoogleDrive or /data/backup', 'Imagen2 history']
      - [stacks/web/public/apps/yomi/media, 'GoogleDrive or /data/backup', 'LINE media exports']
      - [chaba-omen/chat-uis/ChatLocal/data, 'GoogleDrive or /data/backup', 'ChatLocal SQLite DB']
      - ['~/.cache/huggingface', 'GoogleDrive or /data/backup', 'Diffusers/Transformers cache']
      - ['~/.ssh, ~/.config/secrets', 'secure offline', 'SSH keys and tokens']
      - ['.env files (chaba/stacks/web, chaba-omen)', 'secure offline', 'Password hashes and API keys']

  - title: Secrets
    icon: 🔑
    layout: list
    items:
      - label: Caddy YOMI password
        text: chaba/stacks/web/.env (YOMI_PASSWORD_HASH)
      - label: GitHub MCP token
        text: ~/.config/secrets/github-mcp.env
      - label: HuggingFace cache
        text: ~/.cache/huggingface
      - label: SSH keys
        text: ~/.ssh/id_*
      - label: rclone config
        text: ~/.config/rclone/rclone.conf

  - title: Bootstrap
    icon: 🚀
    layout: list
    items:
      - label: 1. OS
        text: Install Ubuntu, NVIDIA drivers, Docker + NVIDIA Container Toolkit
      - label: 2. Repos
        text: Clone chaba, chaba-h3, chaba-omen worktrees to /home/tony/CascadeProjects/
      - label: 3. Secrets
        text: Restore .env files, ~/.config/secrets, ~/.ssh from backup
      - label: 4. Data
        text: Restore runtime data dirs to frigate/, inference/, inference2/, apps_data/
      - label: 5. Stacks
        text: 'docker compose up -d in frigate/, chaba/stacks/web/, chaba-omen/stacks/ai/'
      - label: 6. Host services
        text: systemctl --user enable --now barriers.service rclone-gdrive.service
      - label: 7. Apps
        text: npm run start in chat-uis/ChatLocal and neo-chat (ports 3000/3001)
      - label: 8. Static site
        text: Build and push chaba.h3 branch, or serve locally with npm run serve:php

