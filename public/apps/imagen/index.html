<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imagen</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem;
    }
    h1 { margin: 0 0 0.5rem; }
    .status {
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 1rem;
    }
    .status.ok { color: #4ade80; }
    .status.error { color: var(--danger); }
    .help {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1rem;
      height: 1rem;
      border-radius: 50%;
      background: var(--muted);
      color: var(--bg);
      font-size: 0.65rem;
      cursor: help;
      margin-left: 0.25rem;
      position: relative;
      vertical-align: middle;
    }
    .help::after {
      content: attr(data-help);
      position: absolute;
      left: 50%;
      bottom: 125%;
      transform: translateX(-50%);
      background: #0f172a;
      color: var(--text);
      border: 1px solid #334155;
      border-radius: 0.5rem;
      padding: 0.5rem;
      width: 220px;
      font-size: 0.75rem;
      line-height: 1.3;
      z-index: 100;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.15s;
    }
    .help:hover::after, .help:focus::after {
      opacity: 1;
      visibility: visible;
    }
    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--panel);
      border-radius: 0.75rem;
      padding: 1rem;
    }
    label {
      display: block;
      font-size: 0.875rem;
      margin-bottom: 0.25rem;
      color: var(--muted);
    }
    input, textarea, select {
      width: 100%;
      padding: 0.5rem;
      border-radius: 0.5rem;
      border: 1px solid #334155;
      background: #0f172a;
      color: var(--text);
      font-size: 0.875rem;
    }
    textarea { resize: vertical; min-height: 80px; }
    .field { margin-bottom: 0.75rem; }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 0.5rem;
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    .image-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #020617;
      border-radius: 0.75rem;
      min-height: 512px;
      overflow: hidden;
    }
    .image-wrap img {
      max-width: 100%;
      max-height: 80vh;
      display: block;
    }
    .placeholder {
      color: var(--muted);
      text-align: center;
      padding: 2rem;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #334155;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 0.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .history {
      margin-top: 1rem;
    }
    .history h2 {
      font-size: 1rem;
      margin: 0 0 0.5rem;
    }
    .thumbs {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 0.5rem;
    }
    .thumb {
      aspect-ratio: 1;
      border-radius: 0.5rem;
      overflow: hidden;
      background: #0f172a;
      cursor: pointer;
      border: 2px solid transparent;
      position: relative;
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .thumb.active { border-color: var(--accent); }
    .remove {
      position: absolute;
      top: 0.25rem;
      right: 0.25rem;
      width: 1.5rem;
      height: 1.5rem;
      border: none;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.8);
      color: #f8fafc;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .remove:hover { background: #ef4444; }
    .remove.confirm { background: #ef4444; }
    .meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.5rem;
    }
    .ref-preview {
      max-width: 100%;
      max-height: 120px;
      border-radius: 0.5rem;
      margin-top: 0.5rem;
      display: none;
      object-fit: contain;
      background: #0f172a;
    }
    .ref-preview.visible { display: block; }
    .ref-clear {
      margin-top: 0.5rem;
      background: transparent;
      border: 1px solid #334155;
      color: var(--text);
      font-size: 0.75rem;
      padding: 0.35rem 0.5rem;
      width: auto;
      cursor: pointer;
    }
    .ref-clear:hover { background: #334155; }
    input[type="range"] { width: 100%; }
    .progress-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .progress-row progress {
      flex: 1;
      height: 0.4rem;
      border-radius: 0.2rem;
      overflow: hidden;
    }
    .progress-row progress::-webkit-progress-bar { background: #1e293b; }
    .progress-row progress::-webkit-progress-value { background: #38bdf8; }
    .progress-row progress::-moz-progress-bar { background: #38bdf8; }
    .download-select {
      background: #1e293b;
      color: var(--text);
      border: 1px solid #334155;
      border-radius: 0.25rem;
      padding: 0.35rem 0.5rem;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .download-select:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <a href="/apps/" style="position: fixed; top: 0.5rem; left: 0.5rem; z-index: 1000; padding: 0.35rem 0.7rem; background: var(--panel); color: var(--text); border-radius: 0.4rem; text-decoration: none; font-size: 0.85rem; box-shadow: 0 2px 6px rgba(0,0,0,0.2);">← Apps</a>
  <div class="container">
    <h1>Imagen</h1>
    <div id="status" class="status">Checking backend...</div>
    <div class="layout">
      <div class="panel">
        <div class="field">
          <label for="prompt">Prompt</label>
          <textarea id="prompt" placeholder="a futuristic sailboat racing on a neon sea"></textarea>
        </div>
        <div class="field">
          <label for="negative">Negative prompt <span class="help" data-help="Describe what you want the model to avoid in the generated image.">?</span></label>
          <input id="negative" type="text" value="blurry, low quality" />
        </div>
        <div class="field">
          <label for="guidance-scale">CFG Scale <span class="help" data-help="Classifier-Free Guidance scale: higher values make the output follow the prompt more strictly (1–20).">?</span></label>
          <input id="guidance-scale" type="number" value="7.5" min="1" max="20" step="0.5" />
        </div>
        <div class="field">
          <label for="reference">Reference image</label>
          <input id="reference" type="file" accept="image/*" />
          <img id="ref-preview" class="ref-preview" alt="Reference preview" />
          <button id="ref-clear" class="ref-clear" type="button">Clear reference</button>
        </div>
        <div class="field">
          <label for="strength">Strength: <span id="strength-val">0.5</span> <span class="help" data-help="How much the reference image is changed. 0.1 = subtle edit, 1.0 = almost completely new image.">?</span></label>
          <input id="strength" type="range" min="0.1" max="1.0" step="0.05" value="0.5" />
        </div>
        <div class="row">
          <div class="field">
            <label for="width">Width</label>
            <select id="width">
              <option value="512">512</option>
              <option value="768">768</option>
              <option value="1024" selected>1024</option>
            </select>
          </div>
          <div class="field">
            <label for="height">Height</label>
            <select id="height">
              <option value="512">512</option>
              <option value="768">768</option>
              <option value="1024" selected>1024</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="steps">Steps <span class="help" data-help="Number of diffusion denoising steps. More steps can improve quality but take longer.">?</span></label>
            <input id="steps" type="number" value="25" min="1" max="50" />
          </div>
          <div class="field">
            <label for="seed">Seed</label>
            <input id="seed" type="number" value="-1" />
          </div>
        </div>
        <button id="generate" disabled>Generate</button>
        <div id="meta" class="meta"></div>
      </div>
      <div>
        <div id="output" class="image-wrap">
          <div class="placeholder">Generated image will appear here</div>
        </div>
        <div class="progress-row">
          <progress id="progress" class="progress" value="0" max="100" style="display: none;"></progress>
          <select id="download-scale" class="download-select" disabled>
            <option value="" disabled selected>Download</option>
            <option value="1">1x</option>
            <option value="2">2x</option>
            <option value="4">4x</option>
            <option value="5">5x</option>
            <option value="8">8x</option>
          </select>
        </div>
        <div class="panel history">
          <h2>History</h2>
          <div id="thumbs" class="thumbs"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = './api';
    const MAX_HISTORY = 12;

    const $ = (id) => document.getElementById(id);
    const statusEl = $('status');
    const generateBtn = $('generate');
    const outputEl = $('output');
    const thumbsEl = $('thumbs');
    const metaEl = $('meta');
    const downloadSelect = $('download-scale');
    const progressEl = $('progress');
    const refInput = $('reference');
    const refPreview = $('ref-preview');
    const refClear = $('ref-clear');
    const strengthEl = $('strength');
    const strengthVal = $('strength-val');

    let history = [];
    let currentB64 = null;
    let refBase64 = '';
    let currentBody = null;
    let totalSteps = 0;
    let pollTimer = null;
    let pendingDeleteIndex = -1;

    function readFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    function updateRefPreview() {
      refPreview.src = refBase64;
      refPreview.classList.toggle('visible', !!refBase64);
    }

    function saveForm() {
      const form = {
        prompt: $('prompt').value,
        negative_prompt: $('negative').value,
        width: $('width').value,
        height: $('height').value,
        steps: $('steps').value,
        seed: $('seed').value,
        strength: $('strength').value,
        guidance_scale: $('guidance-scale').value
      };
      try { localStorage.setItem('imagen_form', JSON.stringify(form)); } catch {}
    }

    function restoreState() {
      try {
        const form = JSON.parse(localStorage.getItem('imagen_form') || '{}');
        if (form.prompt !== undefined) $('prompt').value = form.prompt;
        if (form.negative_prompt !== undefined) $('negative').value = form.negative_prompt;
        if (form.width !== undefined) $('width').value = form.width;
        if (form.height !== undefined) $('height').value = form.height;
        if (form.steps !== undefined) $('steps').value = form.steps;
        if (form.seed !== undefined) $('seed').value = form.seed;
        if (form.strength !== undefined) {
          $('strength').value = form.strength;
          $('strength-val').textContent = form.strength;
        }
        if (form.guidance_scale !== undefined) {
          $('guidance-scale').value = form.guidance_scale;
        }
      } catch {}
      try {
        const ref = localStorage.getItem('imagen_ref');
        if (ref) { refBase64 = ref; updateRefPreview(); }
      } catch {}
      try {
        const last = JSON.parse(localStorage.getItem('imagen_last') || '{}');
        if (last && last.b64) { showImage(last); }
      } catch {}
    }

    ['prompt', 'negative', 'width', 'height', 'steps', 'seed', 'guidance-scale'].forEach(id => {
      const el = $(id);
      if (el) el.addEventListener('change', saveForm);
    });
    $('strength').addEventListener('input', saveForm);

    refInput.addEventListener('change', async () => {
      const file = refInput.files[0];
      if (!file) {
        refBase64 = '';
        updateRefPreview();
        try { localStorage.removeItem('imagen_ref'); } catch {}
        return;
      }
      try {
        refBase64 = await readFile(file);
        updateRefPreview();
        try { localStorage.setItem('imagen_ref', refBase64); } catch {}
      } catch (e) {
        statusEl.textContent = `Failed to read reference image: ${e.message}`;
        statusEl.className = 'status error';
      }
    });

    refClear.addEventListener('click', () => {
      refInput.value = '';
      refBase64 = '';
      updateRefPreview();
      try { localStorage.removeItem('imagen_ref'); } catch {}
    });

    strengthEl.addEventListener('input', () => {
      strengthVal.textContent = strengthEl.value;
    });

    async function checkHealth() {
      try {
        const r = await fetch(`${API}/health`);
        const data = await r.json();
        statusEl.textContent = `Backend ready: ${data.model}`;
        statusEl.className = 'status ok';
        generateBtn.disabled = false;
      } catch (e) {
        statusEl.textContent = `Backend unavailable (${e.message})`;
        statusEl.className = 'status error';
      }
    }

    async function loadHistory() {
      try {
        const r = await fetch(`${API}/history`);
        if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
        const data = await r.json();
        history = Array.isArray(data.history) ? data.history : [];
      } catch (e) {
        history = [];
      }
      renderHistory();
    }

    async function saveHistory() {
      const payload = { history: history.slice(0, MAX_HISTORY) };
      try {
        await fetch(`${API}/history`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } catch (e) {
        console.error('Failed to save history to server:', e);
      }
    }

    function renderHistory() {
      thumbsEl.innerHTML = '';
      history.forEach((item, i) => {
        const div = document.createElement('div');
        div.className = 'thumb' + (item.b64 === currentB64 ? ' active' : '');
        const img = document.createElement('img');
        img.src = `data:image/png;base64,${item.b64}`;
        img.alt = item.prompt;
        div.appendChild(img);
        const removeBtn = document.createElement('button');
        removeBtn.className = 'remove';
        removeBtn.textContent = '×';
        removeBtn.title = 'Remove';
        removeBtn.onclick = (e) => {
          e.stopPropagation();
          if (pendingDeleteIndex === i) {
            removeHistory(i);
          } else {
            resetDeleteButtons();
            removeBtn.textContent = 'Y';
            removeBtn.classList.add('confirm');
            pendingDeleteIndex = i;
          }
        };
        div.appendChild(removeBtn);
        div.onclick = () => recallItem(item);
        thumbsEl.appendChild(div);
      });
    }

    function removeHistory(idx) {
      pendingDeleteIndex = -1;
      history.splice(idx, 1);
      saveHistory();
      renderHistory();
    }

    function resetDeleteButtons() {
      document.querySelectorAll('.remove').forEach(btn => {
        btn.textContent = '×';
        btn.classList.remove('confirm');
      });
      pendingDeleteIndex = -1;
    }

    function recallItem(item) {
      resetDeleteButtons();
      $('prompt').value = item.prompt || '';
      $('negative').value = item.negative_prompt || '';
      $('width').value = item.width || 1024;
      $('height').value = item.height || 1024;
      $('steps').value = item.steps || 25;
      $('seed').value = item.seed !== undefined ? item.seed : -1;
      $('strength').value = item.strength !== undefined ? item.strength : 0.5;
      $('strength-val').textContent = $('strength').value;
      $('guidance-scale').value = item.guidance_scale !== undefined ? item.guidance_scale : 7.5;
      refBase64 = item.image || '';
      updateRefPreview();
      saveForm();
      try { localStorage.setItem('imagen_ref', refBase64 || ''); } catch {}
      showImage(item);
    }

    function showImage(item) {
      currentB64 = item.b64;
      outputEl.innerHTML = `<img src="data:image/png;base64,${item.b64}" alt="">`;
      metaEl.textContent = `${item.width}x${item.height} · steps ${item.steps} · seed ${item.seed} · ${item.time}s`;
      downloadSelect.disabled = false;
      renderHistory();
      try { localStorage.setItem('imagen_last', JSON.stringify(item)); } catch {}
    }

    function base64ToBlob(b64, mime) {
      const byteString = atob(b64);
      const ab = new ArrayBuffer(byteString.length);
      const ia = new Uint8Array(ab);
      for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
      return new Blob([ab], { type: mime });
    }

    async function downloadScale(scale) {
      if (!currentB64) return;
      downloadSelect.disabled = true;
      try {
        const r = await fetch(`${API}/upscale`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: currentB64, scale: parseInt(scale, 10), fmt: 'png' })
        });
        if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
        const data = await r.json();
        const mime = `image/${data.format.toLowerCase()}`;
        const blob = base64ToBlob(data.image_base64, mime);
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `imagen_${data.width}x${data.height}_${scale}x.${data.format.toLowerCase()}`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      } catch (e) {
        const msg = typeof e === 'string' ? e : (e && e.message ? e.message : String(e));
        statusEl.textContent = `Upscale error: ${msg}`;
        statusEl.className = 'status error';
      } finally {
        downloadSelect.disabled = false;
        downloadSelect.value = '';
      }
    }

    downloadSelect.addEventListener('change', () => {
      const scale = downloadSelect.value;
      if (!scale) return;
      downloadScale(scale);
    });

    function finishGenerate(data) {
      const item = {
        b64: data.image_base64,
        prompt: currentBody.prompt,
        negative_prompt: currentBody.negative_prompt,
        width: currentBody.width,
        height: currentBody.height,
        steps: currentBody.steps,
        seed: data.seed,
        strength: currentBody.strength,
        guidance_scale: currentBody.guidance_scale,
        image: refBase64,
        time: data.inference_time
      };
      currentB64 = item.b64;
      history.unshift(item);
      saveHistory();
      showImage(item);
      generateBtn.disabled = false;
      statusEl.textContent = 'Done';
      statusEl.className = 'status ok';
      progressEl.value = 100;
      progressEl.style.display = 'none';
    }

    function poll(jobId) {
      fetch(`${API}/progress/${jobId}`)
        .then(r => r.ok ? r.json() : Promise.reject(`${r.status} ${r.statusText}`))
        .then(data => {
          if (data.error) throw new Error(data.error);
          if (data.done) {
            finishGenerate(data.result);
            return;
          }
          if (data.progress && data.progress.image) {
            outputEl.innerHTML = `<img src="data:image/jpeg;base64,${data.progress.image}" alt="" style="max-width:100%;max-height:70vh">`;
            metaEl.textContent = `Step ${data.progress.step}`;
            progressEl.value = Math.min(data.progress.step, totalSteps);
            progressEl.max = totalSteps || 100;
            progressEl.style.display = 'block';
          }
          pollTimer = setTimeout(() => poll(jobId), 500);
        })
        .catch(e => {
          const msg = typeof e === 'string' ? e : (e && e.message ? e.message : String(e));
          statusEl.textContent = `Error: ${msg}`;
          statusEl.className = 'status error';
          outputEl.innerHTML = `<div class="placeholder">Failed to generate image.<br>${msg}</div>`;
          generateBtn.disabled = false;
          progressEl.style.display = 'none';
        });
    }

    async function generate() {
      saveForm();
      const prompt = $('prompt').value.trim();
      if (!prompt) {
        alert('Please enter a prompt');
        return;
      }
      currentBody = {
        prompt,
        negative_prompt: $('negative').value,
        width: parseInt($('width').value, 10),
        height: parseInt($('height').value, 10),
        steps: parseInt($('steps').value, 10),
        seed: parseInt($('seed').value, 10),
        strength: parseFloat($('strength').value),
        guidance_scale: parseFloat($('guidance-scale').value)
      };
      if (refBase64) {
        currentBody.image = refBase64.split(',')[1] || refBase64;
      }
      totalSteps = currentBody.image
        ? Math.max(1, Math.floor(currentBody.steps * currentBody.strength))
        : currentBody.steps;
      if (pollTimer) clearTimeout(pollTimer);
      generateBtn.disabled = true;
      outputEl.innerHTML = '<div class="placeholder"><div class="spinner"></div>Generating image...</div>';
      metaEl.textContent = '';
      statusEl.textContent = 'Generating...';
      statusEl.className = 'status';
      progressEl.value = 0;
      progressEl.max = totalSteps || 100;
      progressEl.style.display = 'block';
      try {
        const r = await fetch(`${API}/generate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(currentBody)
        });
        if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
        const data = await r.json();
        poll(data.job_id);
      } catch (e) {
        const msg = typeof e === 'string' ? e : (e && e.message ? e.message : String(e));
        statusEl.textContent = `Error: ${msg}`;
        statusEl.className = 'status error';
        outputEl.innerHTML = `<div class="placeholder">Failed to start generation.<br>${msg}</div>`;
        generateBtn.disabled = false;
        progressEl.style.display = 'none';
      }
    }

    generateBtn.addEventListener('click', generate);
    document.addEventListener('click', () => {
      if (pendingDeleteIndex !== -1) resetDeleteButtons();
    });
    (async () => {
      await loadHistory();
      restoreState();
      checkHealth();
    })();
  </script>
</body>
</html>
