<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splat Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }
    #viewer { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="viewer"></div>
  <script type="module">
    const urlParams = new URLSearchParams(window.location.search);
    const splatUrl = urlParams.get('splat');

    if (!splatUrl) {
      document.getElementById('viewer').innerHTML = '<div style="color: white; padding: 20px;">No splat URL provided</div>';
    } else {
      // Use esm.sh CDN for better ESM support
      try {
        const GaussianSplats3D = await import('https://esm.sh/@mkkellogg/gaussian-splats-3d@0.4.0');
        const viewer = new GaussianSplats3D.DropInViewer(document.getElementById('viewer'), {
          selfDrivenMode: true,
          antialiased: true
        });
        await viewer.addSplatScene(splatUrl);
      } catch (error) {
        document.getElementById('viewer').innerHTML = `<div style="color: white; padding: 20px;">Failed to load: ${error.message}</div>`;
        console.error('Splat viewer error:', error);
      }
    }
  </script>
</body>
</html>
