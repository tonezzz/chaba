markers:
  in-bouy:
    icon: sausage-orange
    label: ทุ่นใน
    description: ทุ่นใกล้ฝั่ง
    lat: 13.24413075920102
    lon: 100.92940092086792
  out-bouy:
    icon: sausage-orange
    label: ทุ่นนอก
    description: ทุ่นไกลฝั่ง
    lat: 13.244976679476169
    lon: 100.92805445194246
  start-flag:
    icon: flag-checkered
    label: ธงสตาร์ท/ธงเส้นชัย
    description: 
    lat: 13.243595530348099
    lon: 100.92951089143754
  beach-start-upwind:
    icon: flag-square
    label: ธงบีชสตาร์ท เหนือลม
    description: 
    lat: 13.243634693474807
    lon: 100.9299346804619
  beach-start-downwind:
    icon: flag-square
    label: ธงบีชสตาร์ท ใต้ลม
    description: 
    lat: 13.24416731137244
    lon: 100.92981666326524

wind:
  direction: 180

course:
  brief:
    - Wait between the beach-start-upwind and beach-start-downwind
    - Sail past start start_line
    - Round the out-bouy keeping it on your port side
    - Round the in-bouy keeping it on your starboard side
    - Round the out-bouy keeping it on your port side
    - Finish by passing the finish line
  annotations:
    beach_start_line:
      type: line
      role: beach_start
      from: beach-start-upwind
      to: beach-start-downwind
      text: BEACH START
      label_side: front
    start_line:
      type: line
      role: start
      from: in-bouy
      to: start-flag
      text: START
      label_side: front
    finish_line:
      type: line
      role: finish
      from: in-bouy
      to: start-flag
      text: FINISH
      label_side: front
    out_bouy_zone:
      type: zone
      mark: out-bouy
      radius: 25
    in_bouy_zone:
      type: zone
      mark: in-bouy
      radius: 25
    path_beach_to_start:
      type: path
      from: beach_start_line
      to: start_line
      color: '#64748b'
      dash: '4,6'
  sections:
    beach_start:
      type: arrow-area
      from: beach_start_line
      to: start_line
      text: บีชสตาร์ท
    leg_1:
      type: arrow-area
      from: start_line
      to: out_bouy_zone
      text: L1R1:สตาร์ท->ทุ่นนอก
    round_bouy_out_1:
      type: round-bouy
      bouy: out_bouy_zone
      rounding: port
      text: R1:อ้อมทุ่นนอก
    leg_2:
      type: arrow-area
      from: out_bouy_zone
      to: in_bouy_zone
      text: L2R1:ทุ่นนอก->ทุ่นใน
    round_bouy_in_1:
      type: round-bouy
      bouy: in_bouy_zone
      rounding: starboard
      text: R1:อ้อมทุ่นใน
    leg_3:
      type: arrow-area
      from: in_bouy_zone
      to: out_bouy_zone
      text: L3R2:ทุ่นใน->ทุ่นนอก
    round_bouy_out_2:
      type: round-bouy
      bouy: out_bouy_zone
      rounding: port
      text: R2:อ้อมทุ่นนอก
    leg_4:
      type: arrow-area
      from: out_bouy_zone
      to: finish_line
      text: L4R2:ทุ่นนอก>เส้นชัย
