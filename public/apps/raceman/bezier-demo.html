<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track4 Bezier Path Demo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; background: #0f172a; color: #e5e7eb; font-family: system-ui, sans-serif; }
    #map { width: 100vw; height: 100vh; }
    .topbar { position: absolute; top: 12px; left: 12px; z-index: 1000; background: rgba(15,23,42,0.85); padding: 10px 14px; border-radius: 8px; border: 1px solid #334155; }
    .topbar h1 { margin: 0 0 6px; font-size: 14px; color: #38bdf8; }
    .topbar label { display: flex; align-items: center; gap: 8px; font-size: 12px; cursor: pointer; }
    .topbar input { accent-color: #38bdf8; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>Track4 Bezier Path Demo</h1>
    <label><input type="checkbox" id="show-bezier" checked /> Show bezier course line</label>
    <label style="margin-top:6px;"><input type="checkbox" id="show-straight" checked /> Show straight guide points</label>
  </div>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const center = [12.62, 100.92];
    const map = L.map('map', { zoomControl: false }).setView(center, 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: 'OSM' }).addTo(map);

    // Sample course: start line, two buoys, finish line
    const start1 = [12.6230, 100.9180];
    const start2 = [12.6220, 100.9195];
    const buoy1 = [12.6210, 100.9220];
    const buoy2 = [12.6190, 100.9200];
    const fin1 = [12.6180, 100.9225];
    const fin2 = [12.6170, 100.9240];

    const startMid = [(start1[0]+start2[0])/2, (start1[1]+start2[1])/2];
    const finMid = [(fin1[0]+fin2[0])/2, (fin1[1]+fin2[1])/2];

    // Guide points (approximate rounded route)
    const guidePts = [startMid, [12.6220, 100.9210], [12.6202, 100.9225], buoy1, [12.6198, 100.9208], buoy2, [12.6183, 100.9220], finMid];

    let straightLayer, bezierLayer;

    function bearing(p1, p2) {
      const dLon = (p2[1] - p1[1]) * Math.PI / 180;
      const lat1 = p1[0] * Math.PI / 180, lat2 = p2[0] * Math.PI / 180;
      const y = Math.sin(dLon) * Math.cos(lat2);
      const x = Math.cos(lat1)*Math.sin(lat2) - Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    function dist(p1, p2) {
      const R = 6371000, toRad = Math.PI/180;
      const dLat = (p2[0]-p1[0])*toRad, dLon = (p2[1]-p1[1])*toRad;
      const a = Math.sin(dLat/2)**2 + Math.cos(p1[0]*toRad)*Math.cos(p2[0]*toRad)*Math.sin(dLon/2)**2;
      return 2*R*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function pointAt(p, bearingDeg, dM) {
      const R = 6371000, toRad = Math.PI/180;
      const lat1 = p[0]*toRad, lon1 = p[1]*toRad, h = bearingDeg*toRad;
      const lat2 = Math.asin(Math.sin(lat1)*Math.cos(dM/R) + Math.cos(lat1)*Math.sin(dM/R)*Math.cos(h));
      const lon2 = lon1 + Math.atan2(Math.sin(h)*Math.sin(dM/R)*Math.cos(lat1), Math.cos(dM/R) - Math.sin(lat1)*Math.sin(lat2));
      return [lat2*180/Math.PI, lon2*180/Math.PI];
    }

    // Cubic bezier path through all guide points
    function buildBezierSvg(points, tension = 0.35) {
      // Build an SVG path in map pixel space via project/unproject
      const origin = map.latLngToLayerPoint(L.latLng(points[0][0], points[0][1]));
      const segs = [];
      for (let i = 0; i < points.length - 1; i++) {
        const p0 = i > 0 ? points[i-1] : points[i];
        const p1 = points[i];
        const p2 = points[i+1];
        const p3 = i + 2 < points.length ? points[i+2] : p2;
        const c1 = pointAt(p1, bearing(p0, p2), dist(p0, p2) * tension * 0.5);
        const c2 = pointAt(p2, bearing(p1, p3) + 180, dist(p1, p3) * tension * 0.5);
        segs.push([p1, c1, c2, p2]);
      }
      return segs;
    }

    function render() {
      if (straightLayer) map.removeLayer(straightLayer);
      if (bezierLayer) map.removeLayer(bezierLayer);

      if (document.getElementById('show-straight').checked) {
        straightLayer = L.polyline(guidePts, { color: '#94a3b8', weight: 2, dashArray: '4 6', opacity: 0.6 }).addTo(map);
        for (const p of guidePts) {
          L.circleMarker(p, { radius: 4, color: '#94a3b8', fillOpacity: 0.5 }).addTo(map);
        }
      }

      if (document.getElementById('show-bezier').checked) {
        const segs = buildBezierSvg(guidePts, 0.35);
        const d = segs.map((seg, i) => {
          const pts = seg.map(p => map.latLngToLayerPoint(L.latLng(p[0], p[1])));
          const pre = i === 0 ? `M ${pts[0].x} ${pts[0].y}` : '';
          return `${pre} C ${pts[1].x} ${pts[1].y}, ${pts[2].x} ${pts[2].y}, ${pts[3].x} ${pts[3].y}`;
        }).join(' ');
        const svg = `<svg width="100%" height="100%" style="pointer-events:none;"><path d="${d}" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 4px rgba(56,189,248,0.6));" /></svg>`;
        bezierLayer = L.divIcon({ className: 'bezier-path', html: svg, iconSize: [map.getSize().x, map.getSize().y], iconAnchor: [0, 0] });
        // Use a marker to place SVG overlay
        bezierLayer = L.marker(map.getBounds().getNorthWest(), { icon: bezierLayer, interactive: false }).addTo(map);
      }
    }

    [start1, start2, buoy1, buoy2, fin1, fin2].forEach((p, i) => {
      const colors = ['#22c55e', '#22c55e', '#f59e0b', '#f59e0b', '#ef4444', '#ef4444'];
      const labels = ['S1', 'S2', 'B1', 'B2', 'F1', 'F2'];
      L.marker(p, { icon: L.divIcon({ className: 'course-mark', html: `<div style="width:14px;height:14px;background:${colors[i]};border:2px solid #fff;border-radius:50%;box-shadow:0 0 4px rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;font-size:9px;color:#000;">${labels[i]}</div>`, iconSize: [16,16], iconAnchor: [8,8] }) }).addTo(map);
    });

    render();
    document.getElementById('show-bezier').addEventListener('change', render);
    document.getElementById('show-straight').addEventListener('change', render);
    map.on('zoom move', render);
  </script>
</body>
</html>
