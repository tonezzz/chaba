<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imagen</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem;
    }
    h1 { margin: 0 0 0.5rem; }
    .status {
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 1rem;
    }
    .status.ok { color: #4ade80; }
    .status.error { color: var(--danger); }
    .help {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1rem;
      height: 1rem;
      border-radius: 50%;
      background: var(--muted);
      color: var(--bg);
      font-size: 0.65rem;
      cursor: help;
      margin-left: 0.25rem;
      position: relative;
      vertical-align: middle;
    }
    .help::after {
      content: attr(data-help);
      position: absolute;
      left: 50%;
      bottom: 125%;
      transform: translateX(-50%);
      background: #0f172a;
      color: var(--text);
      border: 1px solid #334155;
      border-radius: 0.5rem;
      padding: 0.5rem;
      width: 220px;
      font-size: 0.75rem;
      line-height: 1.3;
      z-index: 100;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.15s;
    }
    .help:hover::after, .help:focus::after {
      opacity: 1;
      visibility: visible;
    }
    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--panel);
      border-radius: 0.75rem;
      padding: 1rem;
    }
    label {
      display: block;
      font-size: 0.875rem;
      margin-bottom: 0.25rem;
      color: var(--muted);
    }
    input, textarea, select {
      width: 100%;
      padding: 0.5rem;
      border-radius: 0.5rem;
      border: 1px solid #334155;
      background: #0f172a;
      color: var(--text);
      font-size: 0.875rem;
    }
    textarea { resize: vertical; min-height: 80px; }
    .field { margin-bottom: 0.75rem; }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 0.5rem;
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    .image-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #020617;
      border-radius: 0.75rem;
      min-height: 512px;
      overflow: hidden;
    }
    .image-wrap img {
      max-width: 100%;
      max-height: 80vh;
      display: block;
    }
    .placeholder {
      color: var(--muted);
      text-align: center;
      padding: 2rem;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #334155;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 0.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .history {
      margin-top: 1rem;
    }
    .history h2 {
      font-size: 1rem;
      margin: 0 0 0.5rem;
    }
    .thumbs {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 0.5rem;
    }
    .thumb {
      aspect-ratio: 1;
      border-radius: 0.5rem;
      overflow: hidden;
      background: #0f172a;
      cursor: pointer;
      border: 2px solid transparent;
      position: relative;
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .thumb.active { border-color: var(--accent); }
    .remove {
      position: absolute;
      top: 0.25rem;
      right: 0.25rem;
      width: 1.5rem;
      height: 1.5rem;
      border: none;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.8);
      color: #f8fafc;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .remove:hover { background: #ef4444; }
    .remove.confirm { background: #ef4444; }
    .meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.5rem;
    }
    .ref-preview {
      max-width: 100%;
      max-height: 120px;
      border-radius: 0.5rem;
      margin-top: 0.5rem;
      display: none;
      object-fit: contain;
      background: #0f172a;
    }
    .ref-preview.visible { display: block; }
    .ref-clear {
      margin-top: 0.5rem;
      background: transparent;
      border: 1px solid #334155;
      color: var(--text);
      font-size: 0.75rem;
      padding: 0.35rem 0.5rem;
      width: auto;
      cursor: pointer;
    }
    .ref-clear:hover { background: #334155; }
    input[type="range"] { width: 100%; }
    .progress-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .progress-row progress {
      flex: 1;
      height: 0.4rem;
      border-radius: 0.2rem;
      overflow: hidden;
    }
    .progress-row progress::-webkit-progress-bar { background: #1e293b; }
    .progress-row progress::-webkit-progress-value { background: #38bdf8; }
    .progress-row progress::-moz-progress-bar { background: #38bdf8; }
    .download-select {
      background: #1e293b;
      color: var(--text);
      border: 1px solid #334155;
      border-radius: 0.25rem;
      padding: 0.35rem 0.5rem;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .download-select:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .tabs button {
      flex: 1;
      background: #1e293b;
      color: var(--text);
      border: 1px solid #334155;
      padding: 0.35rem;
      border-radius: 0.35rem;
      cursor: pointer;
      font-size: 0.875rem;
    }
    .tabs button.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: 600;
    }
    .thumb.pending { border-color: #334155; }
    .thumb.error { border-color: #ef4444; }
    .thumb .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 0.25rem;
      pointer-events: none;
    }
    .thumb .step-label {
      font-size: 0.65rem;
      color: #fff;
      background: rgba(15, 23, 42, 0.7);
      padding: 0.1rem 0.25rem;
      border-radius: 0.25rem;
      align-self: flex-start;
    }
    .thumb .progress-bar {
      height: 4px;
      background: #334155;
      border-radius: 2px;
      overflow: hidden;
      align-self: stretch;
      margin-top: auto;
    }
    .thumb .progress-bar > div {
      height: 100%;
      background: var(--accent);
      width: 0%;
    }
    .thumb .queued-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: var(--muted);
      background: rgba(15, 23, 42, 0.6);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Imagen</h1>
    <div class="layout">
      <div class="panel">
        <div class="field">
          <label for="prompt">Prompt</label>
          <textarea id="prompt" placeholder="a futuristic sailboat racing on a neon sea"></textarea>
        </div>
        <div class="field">
          <label for="negative">Negative prompt <span class="help" data-help="Describe what you want the model to avoid in the generated image.">?</span></label>
          <input id="negative" type="text" value="blurry, low quality" />
        </div>
        <div class="field">
          <label for="guidance-scale">CFG Scale <span class="help" data-help="Classifier-Free Guidance scale: higher values make the output follow the prompt more strictly (1–20).">?</span></label>
          <input id="guidance-scale" type="number" value="7.5" min="1" max="20" step="0.5" />
        </div>
        <div class="field">
          <label for="reference">Reference image</label>
          <input id="reference" type="file" accept="image/*" />
          <img id="ref-preview" class="ref-preview" alt="Reference preview" />
          <button id="ref-clear" class="ref-clear" type="button">Clear reference</button>
        </div>
        <div class="field">
          <label for="strength">Strength: <span id="strength-val">0.5</span> <span class="help" data-help="How much the reference image is changed. 0.1 = subtle edit, 1.0 = almost completely new image.">?</span></label>
          <input id="strength" type="range" min="0.1" max="1.0" step="0.05" value="0.5" />
        </div>
        <div class="row">
          <div class="field">
            <label for="width">Width</label>
            <select id="width">
              <option value="512">512</option>
              <option value="768">768</option>
              <option value="1024" selected>1024</option>
            </select>
          </div>
          <div class="field">
            <label for="height">Height</label>
            <select id="height">
              <option value="512">512</option>
              <option value="768">768</option>
              <option value="1024" selected>1024</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="steps">Steps <span class="help" data-help="Number of diffusion denoising steps. More steps can improve quality but take longer.">?</span></label>
            <input id="steps" type="number" value="25" min="1" max="50" />
          </div>
          <div class="field">
            <label for="seed">Seed</label>
            <input id="seed" type="number" value="-1" />
          </div>
        </div>
        <button id="generate" disabled>Generate</button>
        <div id="meta" class="meta"></div>
      </div>
      <div>
        <div id="status" class="status">Checking backend...</div>
        <div id="view-tabs" class="tabs" style="display: none;">
          <button type="button" data-tab="generated" class="active">Generated</button>
          <button type="button" data-tab="original">Original</button>
        </div>
        <div id="output" class="image-wrap">
          <div class="placeholder">Generated image will appear here</div>
        </div>
        <div class="progress-row">
          <progress id="progress" class="progress" value="0" max="100" style="display: none;"></progress>
          <select id="download-scale" class="download-select" disabled>
            <option value="" disabled selected>Download</option>
            <option value="1">1x</option>
            <option value="2">2x</option>
            <option value="4">4x</option>
            <option value="5">5x</option>
            <option value="8">8x</option>
          </select>
        </div>
        <div class="panel history">
          <h2>History</h2>
          <div id="thumbs" class="thumbs"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = './api';
    const MAX_HISTORY = 12;
    const MAX_QUEUE = 5;

    const $ = (id) => document.getElementById(id);
    const statusEl = $('status');
    const generateBtn = $('generate');
    const outputEl = $('output');
    const thumbsEl = $('thumbs');
    const metaEl = $('meta');
    const downloadSelect = $('download-scale');
    const progressEl = $('progress');
    const refInput = $('reference');
    const refPreview = $('ref-preview');
    const refClear = $('ref-clear');
    const strengthEl = $('strength');
    const strengthVal = $('strength-val');

    let history = [];
    let queue = [];
    let activeJob = null;
    let currentB64 = null;
    let refBase64 = '';
    let activeView = 'generated';
    let pendingDeleteIndex = -1;

    function readFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    function updateRefPreview() {
      refPreview.src = refBase64;
      refPreview.classList.toggle('visible', !!refBase64);
      renderTabs();
      if (activeView === 'original') renderViewer();
    }

    function renderTabs() {
      const tabs = $('view-tabs');
      if (!tabs) return;
      const hasRef = !!refBase64;
      tabs.style.display = hasRef ? 'flex' : 'none';
      tabs.querySelectorAll('button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === activeView);
      });
    }

    function renderViewer() {
      if (activeView === 'original' && refBase64) {
        outputEl.innerHTML = `<img src="${refBase64}" alt="Original">`;
        return;
      }
      if (activeJob && activeJob.preview) {
        outputEl.innerHTML = `<img src="${activeJob.preview}" alt="Preview" style="max-width:100%;max-height:70vh">`;
        return;
      }
      if (activeJob) {
        outputEl.innerHTML = '<div class="placeholder"><div class="spinner"></div>Generating image...</div>';
        return;
      }
      if (currentB64) {
        outputEl.innerHTML = `<img src="data:image/png;base64,${currentB64}" alt="Generated">`;
        return;
      }
      outputEl.innerHTML = '<div class="placeholder">Generated image will appear here</div>';
    }

    function updateGenerateBtn() {
      const pendingCount = history.filter(i => i.pending).length;
      if (pendingCount >= MAX_QUEUE) {
        generateBtn.disabled = true;
        generateBtn.textContent = 'Queue full';
      } else {
        generateBtn.disabled = false;
        generateBtn.textContent = activeJob ? 'Add to queue' : 'Generate';
      }
    }

    function saveForm() {
      const form = {
        prompt: $('prompt').value,
        negative_prompt: $('negative').value,
        width: $('width').value,
        height: $('height').value,
        steps: $('steps').value,
        seed: $('seed').value,
        strength: $('strength').value,
        guidance_scale: $('guidance-scale').value
      };
      try { localStorage.setItem('imagen_form', JSON.stringify(form)); } catch {}
    }

    function restoreState() {
      try {
        const form = JSON.parse(localStorage.getItem('imagen_form') || '{}');
        if (form.prompt !== undefined) $('prompt').value = form.prompt;
        if (form.negative_prompt !== undefined) $('negative').value = form.negative_prompt;
        if (form.width !== undefined) $('width').value = form.width;
        if (form.height !== undefined) $('height').value = form.height;
        if (form.steps !== undefined) $('steps').value = form.steps;
        if (form.seed !== undefined) $('seed').value = form.seed;
        if (form.strength !== undefined) {
          $('strength').value = form.strength;
          $('strength-val').textContent = form.strength;
        }
        if (form.guidance_scale !== undefined) {
          $('guidance-scale').value = form.guidance_scale;
        }
      } catch {}
      try {
        const ref = localStorage.getItem('imagen_ref');
        if (ref) { refBase64 = ref; updateRefPreview(); }
      } catch {}
      try {
        const last = JSON.parse(localStorage.getItem('imagen_last') || '{}');
        if (last && last.b64) { showImage(last); }
      } catch {}
    }

    ['prompt', 'negative', 'width', 'height', 'steps', 'seed', 'guidance-scale'].forEach(id => {
      const el = $(id);
      if (el) el.addEventListener('change', saveForm);
    });
    $('strength').addEventListener('input', saveForm);

    refInput.addEventListener('change', async () => {
      const file = refInput.files[0];
      if (!file) {
        refBase64 = '';
        updateRefPreview();
        try { localStorage.removeItem('imagen_ref'); } catch {}
        return;
      }
      try {
        refBase64 = await readFile(file);
        updateRefPreview();
        try { localStorage.setItem('imagen_ref', refBase64); } catch {}
      } catch (e) {
        statusEl.textContent = `Failed to read reference image: ${e.message}`;
        statusEl.className = 'status error';
      }
    });

    refClear.addEventListener('click', () => {
      refInput.value = '';
      refBase64 = '';
      updateRefPreview();
      try { localStorage.removeItem('imagen_ref'); } catch {}
    });

    strengthEl.addEventListener('input', () => {
      strengthVal.textContent = strengthEl.value;
    });

    $('view-tabs').addEventListener('click', (e) => {
      if (e.target.tagName !== 'BUTTON') return;
      activeView = e.target.dataset.tab || 'generated';
      renderTabs();
      renderViewer();
    });

    async function checkHealth() {
      try {
        const r = await fetch(`${API}/health`);
        const data = await r.json();
        statusEl.textContent = `Backend ready: ${data.model}`;
        statusEl.className = 'status ok';
        updateGenerateBtn();
      } catch (e) {
        statusEl.textContent = `Backend unavailable (${e.message})`;
        statusEl.className = 'status error';
      }
    }

    async function loadHistory() {
      try {
        const r = await fetch(`${API}/history`);
        if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
        const data = await r.json();
        history = Array.isArray(data.history) ? data.history : [];
      } catch (e) {
        history = [];
      }
      renderHistory();
    }

    async function saveHistory() {
      const payload = { history: history.filter(i => !i.pending).slice(0, MAX_HISTORY) };
      try {
        await fetch(`${API}/history`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } catch (e) {
        console.error('Failed to save history to server:', e);
      }
    }

    function renderHistory() {
      thumbsEl.innerHTML = '';
      history.forEach((item, i) => {
        const div = document.createElement('div');
        const isActive = item === activeJob || (!activeJob && item.b64 === currentB64);
        div.className = 'thumb' + (isActive ? ' active' : '') + (item.pending ? ' pending' : '');
        const img = document.createElement('img');
        if (item.pending && item.preview) {
          img.src = item.preview;
        } else if (item.pending) {
          img.style.display = 'none';
        } else {
          img.src = `data:image/png;base64,${item.b64}`;
        }
        img.alt = item.prompt || '';
        div.appendChild(img);
        if (item.pending) {
          const overlay = document.createElement('div');
          overlay.className = 'overlay';
          if (item.error) {
            div.classList.add('error');
            const label = document.createElement('div');
            label.className = 'step-label';
            label.textContent = 'Error';
            overlay.appendChild(label);
          } else if (!item.submitted) {
            const pos = queue.indexOf(item) + 1;
            const qLabel = document.createElement('div');
            qLabel.className = 'queued-label';
            qLabel.textContent = `Queued #${pos}`;
            div.appendChild(qLabel);
          } else {
            const stepLabel = document.createElement('div');
            stepLabel.className = 'step-label';
            stepLabel.textContent = item.progress ? `Step ${item.progress.step}/${item.totalSteps}` : 'Starting...';
            overlay.appendChild(stepLabel);
            const pbar = document.createElement('div');
            pbar.className = 'progress-bar';
            const fill = document.createElement('div');
            const pct = item.progress && item.totalSteps ? Math.min(100, Math.round((item.progress.step / item.totalSteps) * 100)) : 0;
            fill.style.width = `${pct}%`;
            pbar.appendChild(fill);
            overlay.appendChild(pbar);
          }
          div.appendChild(overlay);
        }
        const removeBtn = document.createElement('button');
        removeBtn.className = 'remove';
        removeBtn.textContent = '×';
        removeBtn.title = 'Remove';
        removeBtn.onclick = (e) => {
          e.stopPropagation();
          if (pendingDeleteIndex === i) {
            removeHistory(i);
          } else {
            resetDeleteButtons();
            removeBtn.textContent = 'Y';
            removeBtn.classList.add('confirm');
            pendingDeleteIndex = i;
          }
        };
        div.appendChild(removeBtn);
        div.onclick = () => recallItem(item);
        thumbsEl.appendChild(div);
      });
    }

    function removeHistory(idx) {
      pendingDeleteIndex = -1;
      const item = history[idx];
      if (item && item.pending) {
        if (item === activeJob) {
          item.discarded = true;
        } else {
          queue = queue.filter(q => q !== item);
        }
      }
      history.splice(idx, 1);
      renderHistory();
      saveHistory();
      updateGenerateBtn();
    }

    function resetDeleteButtons() {
      document.querySelectorAll('.remove').forEach(btn => {
        btn.textContent = '×';
        btn.classList.remove('confirm');
      });
      pendingDeleteIndex = -1;
    }

    function recallItem(item) {
      resetDeleteButtons();
      $('prompt').value = item.prompt || '';
      $('negative').value = item.negative_prompt || '';
      $('width').value = item.width || 1024;
      $('height').value = item.height || 1024;
      $('steps').value = item.steps || 25;
      $('seed').value = item.seed !== undefined ? item.seed : -1;
      $('strength').value = item.strength !== undefined ? item.strength : 0.5;
      $('strength-val').textContent = $('strength').value;
      $('guidance-scale').value = item.guidance_scale !== undefined ? item.guidance_scale : 7.5;
      refBase64 = item.image || '';
      activeView = 'generated';
      updateRefPreview();
      saveForm();
      try { localStorage.setItem('imagen_ref', refBase64 || ''); } catch {}
      if (activeJob) {
        renderViewer();
      } else {
        showImage(item);
      }
    }

    function showImage(item) {
      currentB64 = item.b64;
      renderViewer();
      metaEl.textContent = `${item.width}x${item.height} · steps ${item.steps} · seed ${item.seed} · ${item.time}s`;
      downloadSelect.disabled = false;
      renderHistory();
      try { localStorage.setItem('imagen_last', JSON.stringify(item)); } catch {}
    }

    function base64ToBlob(b64, mime) {
      const byteString = atob(b64);
      const ab = new ArrayBuffer(byteString.length);
      const ia = new Uint8Array(ab);
      for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
      return new Blob([ab], { type: mime });
    }

    async function downloadScale(scale) {
      if (!currentB64) return;
      downloadSelect.disabled = true;
      try {
        const r = await fetch(`${API}/upscale`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: currentB64, scale: parseInt(scale, 10), fmt: 'png' })
        });
        if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
        const data = await r.json();
        const mime = `image/${data.format.toLowerCase()}`;
        const blob = base64ToBlob(data.image_base64, mime);
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `imagen_${data.width}x${data.height}_${scale}x.${data.format.toLowerCase()}`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      } catch (e) {
        const msg = typeof e === 'string' ? e : (e && e.message ? e.message : String(e));
        statusEl.textContent = `Upscale error: ${msg}`;
        statusEl.className = 'status error';
      } finally {
        downloadSelect.disabled = false;
        downloadSelect.value = '';
      }
    }

    downloadSelect.addEventListener('change', () => {
      const scale = downloadSelect.value;
      if (!scale) return;
      downloadScale(scale);
    });

    function finishGenerate(queueItem, data) {
      activeJob = null;
      if (!queueItem.discarded) {
        const item = {
          b64: data.image_base64,
          prompt: queueItem.body.prompt,
          negative_prompt: queueItem.body.negative_prompt,
          width: queueItem.body.width,
          height: queueItem.body.height,
          steps: queueItem.body.steps,
          seed: data.seed,
          strength: queueItem.body.strength,
          guidance_scale: queueItem.body.guidance_scale,
          image: queueItem.ref,
          time: data.inference_time
        };
        const idx = history.indexOf(queueItem);
        if (idx !== -1) history[idx] = item;
        else history.unshift(item);
        currentB64 = item.b64;
        showImage(item);
        statusEl.textContent = 'Done';
        statusEl.className = 'status ok';
        saveHistory();
      }
      updateGenerateBtn();
      processNext();
    }

    function poll(queueItem) {
      fetch(`${API}/progress/${queueItem.job_id}`)
        .then(r => {
          if (r.status === 404) {
            queueItem.timer = setTimeout(() => poll(queueItem), 500);
            return;
          }
          if (!r.ok) return Promise.reject(`${r.status} ${r.statusText}`);
          return r.json();
        })
        .then(data => {
          if (!data) return;
          if (data.error) throw new Error(data.error);
          if (data.done) {
            finishGenerate(queueItem, data.result);
            return;
          }
          if (data.progress && data.progress.image) {
            queueItem.preview = `data:image/jpeg;base64,${data.progress.image}`;
            queueItem.progress = { step: data.progress.step };
            renderHistory();
            if (queueItem === activeJob) {
              renderViewer();
              metaEl.textContent = `Step ${data.progress.step}/${queueItem.totalSteps}`;
              progressEl.value = Math.min(data.progress.step, queueItem.totalSteps);
              progressEl.max = queueItem.totalSteps || 100;
              progressEl.style.display = 'block';
            }
          }
          queueItem.timer = setTimeout(() => poll(queueItem), 500);
        })
        .catch(e => {
          const msg = typeof e === 'string' ? e : (e && e.message ? e.message : String(e));
          queueItem.error = msg;
          if (queueItem === activeJob) {
            activeJob = null;
            statusEl.textContent = `Error: ${msg}`;
            statusEl.className = 'status error';
            progressEl.style.display = 'none';
          }
          renderHistory();
          updateGenerateBtn();
          processNext();
        });
    }

    async function generate() {
      saveForm();
      const prompt = $('prompt').value.trim();
      if (!prompt) {
        alert('Please enter a prompt');
        return;
      }
      if (history.filter(i => i.pending).length >= MAX_QUEUE) {
        alert('Queue is full');
        return;
      }
      const body = {
        prompt,
        negative_prompt: $('negative').value,
        width: parseInt($('width').value, 10),
        height: parseInt($('height').value, 10),
        steps: parseInt($('steps').value, 10),
        seed: parseInt($('seed').value, 10),
        strength: parseFloat($('strength').value),
        guidance_scale: parseFloat($('guidance-scale').value)
      };
      const ref = refBase64;
      if (ref) {
        body.image = ref.split(',')[1] || ref;
      }
      const totalSteps = body.image
        ? Math.max(1, Math.floor(body.steps * body.strength))
        : body.steps;
      const queueItem = {
        pending: true,
        submitted: false,
        discarded: false,
        body,
        ref,
        totalSteps,
        prompt: body.prompt,
        negative_prompt: body.negative_prompt,
        width: body.width,
        height: body.height,
        steps: body.steps,
        seed: body.seed,
        strength: body.strength,
        guidance_scale: body.guidance_scale,
        time: 0,
        progress: null,
        preview: null,
        error: null,
        job_id: null,
        timer: null
      };
      history.unshift(queueItem);
      queue.push(queueItem);
      activeView = 'generated';
      renderTabs();
      renderHistory();
      updateGenerateBtn();
      if (!activeJob) {
        processNext();
      }
    }

    function processNext() {
      if (activeJob) return;
      if (queue.length === 0) {
        updateGenerateBtn();
        statusEl.textContent = 'Ready';
        statusEl.className = 'status ok';
        progressEl.style.display = 'none';
        return;
      }
      const next = queue.shift();
      activeJob = next;
      statusEl.textContent = 'Generating...';
      statusEl.className = 'status';
      progressEl.value = 0;
      progressEl.max = next.totalSteps || 100;
      progressEl.style.display = 'block';
      updateGenerateBtn();
      renderHistory();
      renderViewer();
      startGenerate(next);
    }

    async function startGenerate(queueItem) {
      queueItem.submitted = true;
      try {
        const r = await fetch(`${API}/generate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(queueItem.body)
        });
        if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
        const data = await r.json();
        queueItem.job_id = data.job_id;
        renderHistory();
        renderViewer();
        poll(queueItem);
      } catch (e) {
        const msg = typeof e === 'string' ? e : (e && e.message ? e.message : String(e));
        queueItem.error = msg;
        if (queueItem === activeJob) {
          activeJob = null;
          statusEl.textContent = `Error: ${msg}`;
          statusEl.className = 'status error';
          progressEl.style.display = 'none';
        }
        renderHistory();
        updateGenerateBtn();
        processNext();
      }
    }

    generateBtn.addEventListener('click', generate);
    document.addEventListener('click', () => {
      if (pendingDeleteIndex !== -1) resetDeleteButtons();
    });
    (async () => {
      await loadHistory();
      restoreState();
      checkHealth();
    })();
  </script>
</body>
</html>
