<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imagen2</title>
  <link rel="stylesheet" href="./imagen2.css">
</head>
<body>
  <a href="/apps/" style="position: fixed; top: 0.5rem; left: 0.5rem; z-index: 1000; padding: 0.35rem 0.7rem; background: var(--panel); color: var(--text); border-radius: 0.4rem; text-decoration: none; font-size: 0.85rem; box-shadow: 0 2px 6px rgba(0,0,0,0.2);">← Apps</a>
  <div class="container">
    <h1>Imagen2</h1>
    <div class="layout">
      <div class="panel">
        <div class="field">
          <label for="prompt">Prompt</label>
          <textarea id="prompt" placeholder="a futuristic sailboat racing on a neon sea"></textarea>
          <button type="button" id="add-quality" class="ref-clear">Add quality tags</button>
        </div>
        <div class="field">
          <label for="negative">Negative prompt <span class="help" data-help="Describe what you want the model to avoid in the generated image.">?</span></label>
          <textarea id="negative">blurry, low quality, worst quality, bad anatomy, deformed, extra limbs, missing fingers, mutated hands, watermark, signature, text, logo</textarea>
          <button type="button" id="add-negative" class="ref-clear">Add negative presets</button>
        </div>
        <div class="field">
          <label for="guidance-scale">CFG Scale <span class="help" data-help="Classifier-Free Guidance scale: higher values make the output follow the prompt more strictly (1–20).">?</span></label>
          <input id="guidance-scale" type="number" value="8.5" min="1" max="20" step="0.5" />
        </div>
        <div class="field">
          <label for="guidance-rescale">Guidance rescale <span class="help" data-help="Reduces oversaturation at high CFG. 0 = off, 0.5-0.7 recommended.">?</span></label>
          <input id="guidance-rescale" type="number" value="0.7" min="0" max="1" step="0.05" />
        </div>
        <div class="field">
          <label for="reference">Reference image</label>
          <input id="reference" type="file" accept="image/*" />
          <img id="ref-preview" class="ref-preview" alt="Reference preview" />
          <button id="ref-clear" class="ref-clear" type="button">Clear reference</button>
        </div>
        <div class="field">
          <label for="strength">Strength: <span id="strength-val">0.5</span> <span class="help" data-help="How much the reference image is changed. 0.1 = subtle edit, 1.0 = almost completely new image.">?</span></label>
          <input id="strength" type="range" min="0.1" max="1.0" step="0.05" value="0.5" />
        </div>
        <div class="row">
          <div class="field">
            <label for="width">Width</label>
            <select id="width">
              <option value="512">512</option>
              <option value="768">768</option>
              <option value="1024" selected>1024</option>
            </select>
          </div>
          <div class="field">
            <label for="height">Height</label>
            <select id="height">
              <option value="512">512</option>
              <option value="768">768</option>
              <option value="1024" selected>1024</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="steps">Steps <span class="help" data-help="Number of diffusion denoising steps. More steps can improve quality but take longer.">?</span></label>
            <input id="steps" type="number" value="25" min="1" max="50" />
          </div>
          <div class="field">
            <label for="seed">Seed</label>
            <input id="seed" type="number" value="-1" />
          </div>
        </div>
        <button id="generate" disabled>Generate</button>
        <div class="row" style="margin-top: 0.5rem;">
          <button id="regenerate" class="ref-clear" type="button" disabled style="width: 100%">Regenerate last</button>
          <button id="variate" class="ref-clear" type="button" disabled style="width: 100%">Variate last</button>
        </div>
        <div id="meta" class="meta"></div>
      </div>
      <div>
        <div id="status" class="status">Checking backend...</div>
        <div id="view-tabs" class="tabs" style="display: none;">
          <button type="button" data-tab="generated" class="active">Generated</button>
          <button type="button" data-tab="original">Original</button>
        </div>
        <div id="output" class="image-wrap">
          <div class="placeholder">Generated image will appear here</div>
        </div>
        <div class="progress-row">
          <progress id="progress" class="progress" value="0" max="100" style="display: none;"></progress>
          <select id="download-scale" class="download-select" disabled>
            <option value="" disabled selected>Download</option>
            <option value="1">1x</option>
            <option value="2">2x</option>
            <option value="4">4x</option>
            <option value="5">5x</option>
            <option value="8">8x</option>
          </select>
        </div>
        <div class="panel history">
          <h2>History</h2>
          <div id="thumbs" class="thumbs"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
