sections:
  - id: hero
    type: hero
    heading: Reef Riders Boracay
    subheading: "Windsurfing · Kitesurfing · Wingfoiling · Stand-up Paddleboarding"
    tagline: "Asia's premier watersports center on Bulabog Beach — fully operational November to April."
    background_image: "assets/hero-bolabog.jpg"
    fallback_background_color: "#0ea5e9"
    ctas:
      - label: "Book a lesson"
        href: "#contact"
        style: primary
      - label: "Check the wind"
        href: "#wind"
        style: secondary

  - id: about
    type: split_text_image
    layout: image_right
    heading: About Us
    image: "assets/typhoon.jpg"
    image_alt: "Reef Riders crew and equipment on Boracay"
    content: |
      Welcome to Reef Riders Windsurfing, Kitesurfing & SUP Center in Boracay,
      Philippines. We are fully operational from November to April and offer
      year-round lessons and rentals at Bolabog Beach (Amihan season) and White
      Beach (Habagat season).

      We provide beginner, intermediate and advanced rentals and lessons with a
      hospitable crew for unlimited action on the water. We use the latest
      Starboard, Severne & Airush equipment and help you choose the right gear.
    subsections:
      - title: "Bolabog Beach"
        content: |
          Boracay's windsurfing season runs during the Amihan (Northeast
          Monsoon), from September/October to May/June. The windiest months are
          December, January and February, with daily averages of 20-30 knots.
          The lagoon is protected by a reef, making it ideal for slalom,
          freestyle and beginners. Advanced riders can head to the reef for bump
          and jump swells when it is blowing 20-35 knots.
      - title: "White Beach"
        content: |
          During the Habagat (Southwest Monsoon) we offer rentals and lessons at
          Sinagpa, White Beach (Boracay Terraces Resort front), so we are open
          all year round.

  - id: activities
    type: cards_grid
    heading: Activities
    intro: "One-on-one courses and quality rentals for all levels."
    cards:
      - id: windsurfing
        title: Windsurfing
        icon: wind
        image: "assets/windsurfing.jpg"
        image_alt: "Windsurfing in Boracay"
        summary: "One-on-one courses and rental gear for every level."
        features:
          - "Discovery Lesson: 1.5 hr"
          - "Private Beginner Package: 3 days"
          - "Beginner-Intermediate Package: 5 days"
          - "Improver-Advanced Lesson: 1 hr"
        cta:
          label: "See pricing"
          href: "#pricing"
      - id: kitesurfing
        title: Kitesurfing
        icon: kite
        image: "assets/kitesurfing.jpg"
        image_alt: "Kitesurfing in Boracay"
        summary: "Kiteboarding lessons and beach support on Bolabog Beach."
        features:
          - "Discovery, Day, Beginner, Advanced & Foil courses"
          - "Launch and landing support"
          - "Latest Airush kites"
        cta:
          label: "More details"
          href: "#activities-detail"
      - id: wingfoiling
        title: Wingfoiling
        icon: wing
        image: "assets/wingfoiling.jpg"
        image_alt: "Wingfoiling in Boracay"
        summary: "Learn to wing and foil with one-on-one coaching."
        features:
          - "Discovery: 1 hr"
          - "Beginner Level 1: 3 hrs"
          - "Beginner Level 2: 4 hrs"
          - "Full Beginner Course: 7 hrs"
        cta:
          label: "More details"
          href: "#activities-detail"
      - id: sup
        title: SUP
        icon: paddle
        image: "assets/sup.jpg"
        image_alt: "Stand-up paddleboarding in Boracay"
        summary: "Explore Boracay by paddleboard — flat water, waves or sunset."
        features:
          - "Bolabog to Puka Beach: ~1 hr"
          - "Bolabog to White Beach: 2-3 hrs"
          - "Balance, core workout and nature tours"
        cta:
          label: "More details"
          href: "#activities-detail"

  - id: activities-detail
    type: detail_list
    heading: Activity Details
    intro: "Course descriptions and what is included."
    items:
      - title: "Windsurfing Courses"
        content: |
          One-on-one windsurfing courses from beginner to advanced level. Shoes
          and harnesses are provided. Courses are available daily for all levels.

          Discovery Lesson (1.5 hr): instruction and rental, simulator training,
          intensive water training, balancing and positioning on the board,
          steering and light wind tack.

          Private Beginner Package (3 days, 1.5 hr/day): balancing and
          positioning, steering, light wind tack, beach start and introduction
          to harness.

          Beginner-Intermediate Package (5 days, 1.5 hr/day): balancing and
          positioning, steering, light wind tack, light wind gybe, beach start
          and introduction to harness.

          Improver-Advanced Lesson (1 hr): waterstart, fast tack, footstraps,
          going upwind, planing/speeding and carve gybes. Equipment rental is
          not included.
      - title: "Kitesurfing Courses"
        content: |
          DISCOVERY COURSE: Learn the basics of flying a kite.

          DAY COURSE: Theory of Wind Window, Kite Setup, Kite Control, Kite
          Relaunch, Body Dragging, Safety Measures, Board Recovery, Self Rescue.

          BEGINNER COURSE: Waterstart, Boardriding, Board Control, Upwind Riding,
          Transitions.

          ADVANCED COURSE: Coaching to ride upwind, change direction or learn
          first jumps.

          BEGINNER KITE FOIL COURSE: Learn the basics of kite foiling.

          Beach caddies are available to launch and land your kites.
      - title: "Wingfoiling Courses"
        content: |
          Discovery Lesson (1 hr): learn to harness the wind with a wing. Starts
          on the beach learning to control the wing, then progresses to steering
          while balancing and positioning on a big flat board on the water.

          Beginner Level 1 (3 hrs): wing control, steering and balance.

          Beginner Level 2 (4 hrs): first foiling rides.

          Full Beginner Course (7 hrs): combined wing and foil training.

          Wingfoiling rental boards, wings and foils are available; equipment
          insurance can be paid on site.
      - title: "Stand-up Paddleboarding"
        content: |
          "It will take you approximately 1 hour on a calm flat water day with
          moderate paddling, from Reef Riders on Bolabog Beach to Puka Beach."

          "Burn fat, trim your muscles, train your balance and get the best core
          workout with the SUP. Enjoy the nature on a sunny and calm flat water
          day or do an intense workout session. Catch and ride some waves. Paddle
          to places you normally would never reach. Or just relax and enjoy the
          beautiful sunset."

          "It will take you 2-3 hours from Reef Riders on Bolabog Beach to
          Jony's or Epic depending on weather and currents. The intense paddling
          part is between Bolabog and Puka in the Amihan Season (October-April)."

  - id: pricing
    type: pricing
    heading: Pricing
    intro: "All courses include shoes and harnesses. Courses are available daily for all levels. Prices below are placeholders until confirmed."
    payment_note: "Debit/Credit card payment accepted. Contact us for current rates and availability."
    packages:
      - title: "Discovery Lesson"
        duration: "1.5 hr"
        price: "TBD"
        includes: "instruction + rental, simulator training, water training, balancing, steering and light wind tack"
      - title: "Private Beginner Package"
        duration: "3 days, 1.5 hr/day"
        price: "TBD"
        includes: "balancing, steering, light wind tack, beach start, intro to harness"
      - title: "Beginner-Intermediate Package"
        duration: "5 days, 1.5 hr/day"
        price: "TBD"
        includes: "balancing, steering, light wind tack, light wind gybe, beach start, intro to harness"
      - title: "Improver-Advanced Lesson"
        duration: "1 hr"
        price: "TBD"
        includes: "waterstart, fast tack, footstraps, upwind, planing/speeding, carve gybes (rental not included)"
      - title: "Improver Course"
        duration: "5 days, 1.5 hr/day"
        price: "TBD"
        includes: "waterstart, fast tack, footstraps, upwind, planing/speeding, carve gybes (rental not included)"
    rental:
      heading: "Windsurfing Rental"
      content: |
        Boards from 151-171L, freestyle, freerace, slalom and quad-fin wave
        boards. Sails include beginner, slalom, freeride, wave, race and
        freestyle. Equipment insurance payable on site.
      note: "Kitesurfing, wingfoiling and SUP rental also available; details to be added."

  - id: wind
    type: info_box
    heading: Wind Conditions
    content: |
      The best months for windsurfing in Boracay are December, January and
      February. The lagoon is ideal for speed, freestyle and freeride. The flat
      and shallow water makes learning the basics easy.
    statistics_note: "Live wind statistics are provided by iwindsurf.com with data courtesy of Boracay Weather Station."
    widget:
      type: iframe
      src: "https://embed.windy.com/embed2.html?lat=11.965&lon=121.926&zoom=11&level=surface&overlay=wind&menu=&message=true&marker=true&calendar=now&pressure=&type=map&detailLat=11.965&detailLon=121.926&detail=true"
      note: "Live wind map for Boracay via Windy."
      fallback_text: "Current wind forecast widget placeholder"

  - id: getting-here
    type: travel_info
    heading: How to Get Here
    intro: "Boracay is Asia's premier spot for windsurfing and kitesurfing."
    image: "assets/how-to-get-here.jpg"
    image_alt: "Map and directions to Reef Riders on Boracay"
    routes:
      - title: "Via plane from Manila"
        icon: plane
        content: |
          Caticlan Airport (Godofredo P. Ramos Airport) is about 15 minutes land
          and sea travel to Boracay. It now accepts up to 45 kg pre-booked
          baggage on selected airlines.

          Kalibo International Airport is about 2.5 hours land and sea travel.
          Airlines include Scoot, Silkair, Cebu Pacific, AirAsia, Philippine
          Airlines, Air Seoul and Pan Pacific.
      - title: "Via ship (2Go)"
        icon: ship
        content: |
          The ship leaves Batangas Port, 2 hours from Manila by bus. Bus ticket
          is roughly Php140-175/person or about Php3,000 for a chartered taxi.
          2Go has 8am and 9pm departures; the trip is 9 hours and docks at
          Caticlan Jetty Port.
    transfers:
      - "Caticlan Airport to Caticlan Jetty Port: Php50 tricycle"
      - "Kalibo Airport to Caticlan Jetty Port: Php175/person (L300 van) or Php1,000-1,500 chartered"
      - "Caticlan Jetty to Cagban Jetty (Boracay): Php25/30 + Php100 terminal + Php75 environmental"
      - "Cagban Jetty to Reef Riders (Bolabog Beach): Php150 tricycle or Php250-300 multi-cab"
    transfer_note: "Hotels and agencies can arrange transfers. Southwest Tours is a leading agency for transfer services."

  - id: crew
    type: profiles
    heading: The Crew
    intro: "Run by local watermen who know Boracay's wind and waves."
    members:
      - name: "Ronald Schroeder"
        role: "Co-owner, Beach Bum and Equipment Insurance Investigator"
        image: "assets/ronald.jpg"
      - name: "Chill Hilario"
        role: "Co-owner & Secretary"
        image: "assets/chill.jpg"

  - id: reviews
    type: testimonials
    heading: What Riders Say
    intro: "Real Google reviews from Reef Riders guests."
    reviews:
      - author: "Walter Meissl"
        source: "Google"
        text: "Very friendly people with enough good and recent gear for windsurfing. Very helpful service with suggestions about the best conditions to go out as well as help in rigging up and down and changing sail or board size. I highly recommend them."
      - author: "Sara Andrade"
        source: "Google"
        text: "Super friendly staff and owners… the spot is great for kiting, probably the best in Boracay and the kites are amazing! Completely fell in love with the airush lift :)"
      - author: "Val Valino"
        source: "Google"
        text: "They were great and helpful. Doy, my instructor, was knowledgeable, patient, and a great overall instructor."
      - author: "Jun T"
        source: "Google"
        text: "I'm a long time windsurfer at Berkeley California and just thrilled to windsurf in Boracay without a wetsuit. All equipment is provided — booties, helmet, harness and even impact vest. Excellent boards and sails. The instructors are excellent and the progression was surprising. Very satisfied."
      - author: "Carl Cabanada"
        source: "Google"
        text: "Was able to learn in 30 mins! Pretty cool and understanding instructors and management. I highly recommend them."

  - id: contact
    type: contact
    heading: Contact Us
    intro: "For inquiries and bookings reach out directly."
    phone: "+63 908 820 2267"
    email: "reefridersboracay@gmail.com"
    whatsapp: "+63 908 820 2267"
    cta:
      label: "Call or WhatsApp"
      href: "tel:+639088202267"
      style: primary
    form:
      enabled: false
      note: "Static site; use email, phone or WhatsApp for now. A form can be added later via a third-party provider."
    map:
      enabled: true
      note: "Embed a static Google Maps or OpenStreetMap iframe pointing to Reef Riders on Bolabog Beach."

