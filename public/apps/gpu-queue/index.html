<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPU Queue Status</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
  <div class="container mx-auto px-4 py-8 max-w-4xl">
    <h1 class="text-3xl font-bold mb-8 text-center">GPU Queue Status</h1>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
      <div class="bg-gray-800 rounded-lg p-6">
        <h2 class="text-lg font-semibold mb-2 text-gray-400">Pending</h2>
        <p id="pending-count" class="text-4xl font-bold text-yellow-400">-</p>
      </div>
      <div class="bg-gray-800 rounded-lg p-6">
        <h2 class="text-lg font-semibold mb-2 text-gray-400">Running</h2>
        <p id="running-count" class="text-4xl font-bold text-blue-400">-</p>
      </div>
      <div class="bg-gray-800 rounded-lg p-6">
        <h2 class="text-lg font-semibold mb-2 text-gray-400">Completed</h2>
        <p id="completed-count" class="text-4xl font-bold text-green-400">-</p>
      </div>
    </div>

    <div class="bg-gray-800 rounded-lg p-6 mb-8">
      <h2 class="text-xl font-semibold mb-4 text-gray-400">Submit New Job</h2>
      <form id="job-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">Job Type</label>
          <select id="job-type" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="imagen2">Imagen2 (Image Generation)</option>
            <option value="txt2vid">Txt2vid (Video Generation)</option>
            <option value="llama">Llama (Chat)</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">Prompt</label>
          <textarea id="job-prompt" rows="3" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter prompt..."></textarea>
        </div>
        <div id="imagen2-params" class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">Width</label>
            <input type="number" id="job-width" value="512" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">Height</label>
            <input type="number" id="job-height" value="512" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>
        <div id="txt2vid-params" class="grid grid-cols-2 gap-4 hidden">
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">Num Frames</label>
            <input type="number" id="job-frames" value="16" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">FPS</label>
            <input type="number" id="job-fps" value="8" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded transition">
          Submit Job
        </button>
      </form>
      <div id="submit-status" class="mt-4 text-sm"></div>
    </div>

    <div id="running-job" class="bg-gray-800 rounded-lg p-6 mb-8 hidden">
      <h2 class="text-xl font-semibold mb-4 text-blue-400">Running Job</h2>
      <div id="running-job-details"></div>
    </div>

    <div class="bg-gray-800 rounded-lg p-6">
      <h2 class="text-xl font-semibold mb-4 text-gray-400">Recent Jobs</h2>
      <div id="jobs-list" class="space-y-2"></div>
    </div>

    <div class="mt-8 text-center text-gray-500 text-sm">
      <p>Last updated: <span id="last-updated">-</span></p>
      <p>Auto-refreshing every 5 seconds</p>
    </div>
  </div>

  <script>
    const API_BASE = '/api/gpu-queue';

    // Handle job type change to show/hide relevant params
    document.getElementById('job-type').addEventListener('change', (e) => {
      const type = e.target.value;
      const imagen2Params = document.getElementById('imagen2-params');
      const txt2vidParams = document.getElementById('txt2vid-params');

      imagen2Params.classList.add('hidden');
      txt2vidParams.classList.add('hidden');

      if (type === 'imagen2') {
        imagen2Params.classList.remove('hidden');
      } else if (type === 'txt2vid') {
        txt2vidParams.classList.remove('hidden');
      }
    });

    // Handle job form submission
    document.getElementById('job-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitStatus = document.getElementById('submit-status');

      const type = document.getElementById('job-type').value;
      const prompt = document.getElementById('job-prompt').value;

      if (!prompt) {
        submitStatus.innerHTML = '<span class="text-red-400">Prompt is required</span>';
        return;
      }

      let params = { prompt };

      if (type === 'imagen2') {
        params.width = parseInt(document.getElementById('job-width').value) || 512;
        params.height = parseInt(document.getElementById('job-height').value) || 512;
        params.steps = 4;
        params.guidance_scale = 1.0;
        params.mode = 'lightning_txt2img';
      } else if (type === 'txt2vid') {
        params.width = 256;
        params.height = 256;
        params.num_frames = parseInt(document.getElementById('job-frames').value) || 16;
        params.num_inference_steps = 25;
        params.guidance_scale = 9.0;
        params.fps = parseInt(document.getElementById('job-fps').value) || 8;
      }

      try {
        submitStatus.innerHTML = '<span class="text-blue-400">Submitting job...</span>';
        const response = await fetch(`${API_BASE}/jobs`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type, params })
        });

        if (response.ok) {
          const job = await response.json();
          submitStatus.innerHTML = `<span class="text-green-400">Job #${job.id} submitted successfully</span>`;
          document.getElementById('job-prompt').value = '';
          fetchJobs();
          fetchStatus();
        } else {
          const error = await response.json();
          submitStatus.innerHTML = `<span class="text-red-400">Failed: ${error.error}</span>`;
        }
      } catch (error) {
        submitStatus.innerHTML = `<span class="text-red-400">Error: ${error.message}</span>`;
      }
    });

    // Cancel job function
    async function cancelJob(jobId) {
      if (!confirm(`Cancel job #${jobId}?`)) return;

      try {
        const response = await fetch(`${API_BASE}/jobs/${jobId}`, {
          method: 'DELETE'
        });

        if (response.ok) {
          fetchJobs();
          fetchStatus();
        } else {
          alert('Failed to cancel job');
        }
      } catch (error) {
        alert(`Error cancelling job: ${error.message}`);
      }
    }

    async function fetchStatus() {
      try {
        const response = await fetch(`${API_BASE}/status`);
        const data = await response.json();
        updateStatus(data);
      } catch (error) {
        console.error('Failed to fetch status:', error);
      }
    }

    async function fetchJobs() {
      try {
        const response = await fetch(`${API_BASE}/jobs`);
        const jobs = await response.json();
        updateJobsList(jobs);
      } catch (error) {
        console.error('Failed to fetch jobs:', error);
      }
    }

    function updateStatus(data) {
      const status = data.status || {};
      document.getElementById('pending-count').textContent = status.pending || 0;
      document.getElementById('running-count').textContent = status.running || 0;
      document.getElementById('completed-count').textContent = status.completed || 0;

      const runningJob = data.running;
      const runningJobDiv = document.getElementById('running-job');
      const runningJobDetails = document.getElementById('running-job-details');

      if (runningJob) {
        runningJobDiv.classList.remove('hidden');
        runningJobDetails.innerHTML = `
          <p><span class="text-gray-400">ID:</span> ${runningJob.id}</p>
          <p><span class="text-gray-400">Type:</span> ${runningJob.type}</p>
          <p><span class="text-gray-400">Created:</span> ${new Date(runningJob.created_at).toLocaleString()}</p>
          <p><span class="text-gray-400">Started:</span> ${new Date(runningJob.started_at).toLocaleString()}</p>
        `;
      } else {
        runningJobDiv.classList.add('hidden');
      }

      document.getElementById('last-updated').textContent = new Date().toLocaleString();
    }

    function updateJobsList(jobs) {
      const jobsList = document.getElementById('jobs-list');
      const recentJobs = jobs.slice(0, 10);

      if (recentJobs.length === 0) {
        jobsList.innerHTML = '<p class="text-gray-500">No jobs</p>';
        return;
      }

      jobsList.innerHTML = recentJobs.map(job => {
        const statusColors = {
          pending: 'text-yellow-400',
          running: 'text-blue-400',
          completed: 'text-green-400',
          failed: 'text-red-400',
          cancelled: 'text-gray-400'
        };
        const statusColor = statusColors[job.status] || 'text-gray-400';

        const cancelBtn = (job.status === 'pending' || job.status === 'running')
          ? `<button onclick="cancelJob(${job.id})" class="ml-4 bg-red-600 hover:bg-red-700 text-white text-xs px-2 py-1 rounded">Cancel</button>`
          : '';

        return `
          <div class="bg-gray-700 rounded p-3 flex justify-between items-center">
            <div>
              <span class="font-semibold">#${job.id}</span>
              <span class="text-gray-400 ml-2">${job.type}</span>
              <span class="text-gray-500 text-sm ml-2">${new Date(job.created_at).toLocaleString()}</span>
            </div>
            <div class="flex items-center">
              <span class="${statusColor} font-semibold">${job.status}</span>
              ${cancelBtn}
            </div>
          </div>
        `;
      }).join('');
    }

    // Initial fetch
    fetchStatus();
    fetchJobs();

    // Auto-refresh every 5 seconds
    setInterval(() => {
      fetchStatus();
      fetchJobs();
    }, 5000);
  </script>
</body>
</html>
