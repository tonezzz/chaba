<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart Renderer Component Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #161b22;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, 'Trebuchet MS', Roboto, Ubuntu, sans-serif;
        }
        #main-chart {
            width: 100%;
            height: 600px;
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
        }
        #log {
            margin-top: 20px;
            padding: 12px;
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            font-family: monospace;
            white-space: pre-wrap;
            min-height: 120px;
        }
        .row {
            margin-bottom: 12px;
        }
        select, button {
            padding: 6px 12px;
            margin-right: 8px;
            background-color: #21262d;
            color: #e6edf3;
            border: 1px solid #30363d;
            border-radius: 6px;
            font-size: 14px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <script src="chart-data-provider.js?v=8"></script>
    <script src="chart-renderer.js?v=9"></script>
</head>
<body>
    <h1>ChartRenderer Component Test</h1>

    <div class="row">
        <select id="symbol-select">
            <option value="THB">USD/THB</option>
            <option value="EUR">EUR/USD</option>
            <option value="GBP">GBP/USD</option>
            <option value="JPY">USD/JPY</option>
            <option value="GOLD" selected>GOLD</option>
            <option value="DXY">DXY</option>
            <option value="OIL">OIL</option>
        </select>
        <select id="timeframe-select">
            <option value="1D">1D</option>
            <option value="1W">1W</option>
            <option value="1M">1M</option>
            <option value="3M">3M</option>
            <option value="6M">6M</option>
            <option value="1Y">1Y</option>
            <option value="2Y">2Y</option>
            <option value="all" selected>All</option>
        </select>
        <button id="load-btn">Load Data</button>
        <button id="sample-btn">Load Sample Data</button>
    </div>

    <div id="main-chart"></div>
    <div id="log"></div>

    <script>
        const log = (msg) => {
            const el = document.getElementById('log');
            el.textContent += msg + '\n';
        };

        const renderer = new ChartRenderer({ containerId: 'main-chart' });
        const provider = new ChartDataProvider();

        renderer.initializeChart();
        log('ChartRenderer initialized');

        function scanCanvas() {
            const canvases = document.getElementById('main-chart').getElementsByTagName('canvas');
            const result = [];
            for (let i = 0; i < canvases.length; i++) {
                const c = canvases[i];
                const ctx = c.getContext('2d');
                const center = ctx.getImageData(Math.floor(c.width / 2), Math.floor(c.height / 2), 1, 1).data;
                result.push({ index: i, width: c.width, height: c.height, centerPixel: Array.from(center) });
            }
            return result;
        }

        function setChartData(data) {
            renderer.updateChart(data);
            const visible = renderer.chart.timeScale().getVisibleLogicalRange();
            const scan = scanCanvas();
            log('Set ' + data.length + ' points. visibleRange: ' + JSON.stringify(visible));
            log('Canvas scan: ' + JSON.stringify(scan));
        }

        async function loadData() {
            const symbol = document.getElementById('symbol-select').value;
            const timeframe = document.getElementById('timeframe-select').value;
            log('Loading ' + symbol + '/' + timeframe + '...');
            try {
                const result = await provider.loadData(symbol, timeframe);
                log('Loaded ' + result.data.length + ' points (sample=' + result.isSampleData + ', api=' + result.loadedFromAPI + ')');
                setChartData(result.data);
            } catch (e) {
                log('Error: ' + e.message);
            }
        }

        function loadSample() {
            const symbol = document.getElementById('symbol-select').value;
            const timeframe = document.getElementById('timeframe-select').value;
            const data = provider.generateSampleData(symbol, timeframe);
            log('Generated sample ' + symbol + '/' + timeframe + ': ' + data.length + ' points');
            setChartData(data);
        }

        document.getElementById('load-btn').addEventListener('click', loadData);
        document.getElementById('sample-btn').addEventListener('click', loadSample);

        // Script runs at end of body; DOM is already ready.
        loadSample();
    </script>
</body>
</html>
