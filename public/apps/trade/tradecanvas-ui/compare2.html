<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>TradeCanvas - Compare</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <script src="ui-components.js?v=4"></script>
</head>
<body>
    <div class="container">
        <!-- Compact Header with Navigation -->
        <header class="header-compact">
            <div class="header-left">
                <h1>TradeCanvas</h1>
                <nav class="nav-compact">
                    <a href="index.html" class="nav-link">Dashboard</a>
                    <a href="compare.html" class="nav-link">Compare</a>
                    <a href="compare2.html?v=11" class="nav-link active">Compare2</a>
                </nav>
            </div>
            <div class="header-right"></div>
        </header>

        <div class="main-content-compact">
            <div class="chart-section-compact">
                <div id="main-chart" class="chart-container-compact"></div>
            </div>

            <div class="side-panel-compact">
                <div class="panel-section-compact symbol-panel" id="symbol-panel">
                    <div class="panel-header">
                        <h3>Symbol / Timeframe</h3>
                    </div>
                    <div id="currency-selector-container"></div>
                    <div id="timeframe-selector-container"></div>
                    <div class="market-info">
                        <div class="market-info-row">
                            <span class="pair-label" id="pair-label">USD/THB</span>
                            <span id="connection-status" class="status disconnected">Loading</span>
                        </div>
                        <div class="market-info-row price-row">
                            <span id="current-price" class="price-display">--</span>
                            <span id="price-change" class="price-change">--</span>
                        </div>
                    </div>
                </div>

                <div class="panel-section-compact" id="strategy-panel">
                    <div class="panel-header">
                        <h3>Strategy Comparison</h3>
                        <button id="toggle-params" class="toggle-btn">▼</button>
                    </div>
                    <div id="strategy-controls" class="strategy-controls-compact">Loading strategies...</div>
                    <div id="strategy-results" class="strategy-results-compact"></div>
                </div>
            </div>
        </div>

        <footer class="footer-compact">
            <span id="last-update">Last update: --</span>
        </footer>
    </div>

    <script src="ssot-page-loader.js"></script>
    <script src="page-initializer.js"></script>
</body>
</html>
