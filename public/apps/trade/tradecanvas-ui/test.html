<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart Test</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body {
            background-color: #21262d;
            color: #e6edf3;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        #chart {
            width: 100%;
            height: 500px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>Chart Test Page</h1>
    <div id="chart"></div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded');
            console.log('LightweightCharts available:', typeof LightweightCharts);
            
            const chartContainer = document.getElementById('chart');
            console.log('Chart container:', chartContainer);
            console.log('Container dimensions:', chartContainer.clientWidth, chartContainer.clientHeight);
            
            if (typeof LightweightCharts === 'undefined') {
                console.error('LightweightCharts not loaded');
                document.body.innerHTML += '<p style="color: red;">LightweightCharts not loaded!</p>';
                return;
            }
            
            try {
                console.log('Creating chart...');
                const chart = LightweightCharts.createChart(chartContainer, {
                    width: chartContainer.clientWidth,
                    height: chartContainer.clientHeight,
                    layout: {
                        background: { type: 'solid', color: '#21262d' },
                        textColor: '#e6edf3',
                    },
                    grid: {
                        vertLines: { color: '#30363d' },
                        horzLines: { color: '#30363d' },
                    },
                });
                
                const candlestickSeries = chart.addCandlestickSeries({
                    upColor: '#238636',
                    downColor: '#da3633',
                    borderDownColor: '#da3633',
                    borderUpColor: '#238636',
                    wickDownColor: '#da3633',
                    wickUpColor: '#238636',
                });
                
                // Generate sample data
                const data = [];
                const basePrice = 35.5;
                let price = basePrice;
                const endTime = Math.floor(Date.now() / 1000);
                const startTime = endTime - (30 * 86400); // 30 days
                let currentTime = startTime;
                
                while (currentTime <= endTime) {
                    const date = new Date(currentTime * 1000);
                    if (date.getDay() !== 0 && date.getDay() !== 6) {
                        const volatility = basePrice * 0.02;
                        const open = price;
                        const change = (Math.random() - 0.5) * volatility;
                        const close = price + change;
                        const high = Math.max(open, close) + Math.random() * volatility * 0.5;
                        const low = Math.min(open, close) - Math.random() * volatility * 0.5;
                        
                        data.push({
                            time: currentTime,
                            open: open,
                            high: high,
                            low: low,
                            close: close
                        });
                        price = close;
                    }
                    currentTime += 86400;
                }
                
                console.log('Setting data with', data.length, 'points');
                candlestickSeries.setData(data);
                chart.timeScale().fitContent();
                console.log('Chart initialized successfully');
                
                document.body.innerHTML += '<p style="color: green;">Chart initialized successfully with ' + data.length + ' data points!</p>';
                
            } catch (error) {
                console.error('Error creating chart:', error);
                document.body.innerHTML += '<p style="color: red;">Error: ' + error.message + '</p>';
            }
        });
    </script>
</body>
</html>
