title: TradeCanvas Compare2 Page Configuration
subtitle: Page-specific settings for compare2.html

family: compare-family
features: []

page:
  id: compare2
  html_file: compare2.html
  cache_version: 7
  title: "TradeCanvas - Compare"
  layout: compact

layout:
  full_viewport: true
  header_class: header-compact
  side_panel_width: 350
  side_panel_title: Strategy Comparison

chart_loader:
  ref: ssot.ui.compare-family.yml#chart_loader

currency_selector:
  mode: compact
  class_name: currency-selector compact

timeframe_selector:
  class_name: currency-selector compact

strategy_panel:
  ref: ssot.ui.compare-family.yml#strategy_panel
  title: Strategy Comparison
  default_strategy: hindsight_01
  hindsight:
    force_100_percent_position: true
    hide_stop_for_hindsight: true
    hide_take_profit_for_hindsight: true
    hide_position_pct_for_hindsight: true

scripts:
  extra:
  - strategies-new.js

cache_busting:
  versions:
    compare2_html: 11

navigation:
  ref: "ssot.ui.yml#navigation"
  active_page: compare2
