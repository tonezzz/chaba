title: TradeCanvas Compare Page Configuration
subtitle: Page-specific settings for compare.html

family: compare-family
features: []

page:
  id: compare
  html_file: compare.html
  cache_version: 2
  title: "TradeCanvas - Compare"
  layout: full

chart_loader:
  show_volume: false
  enable_controls: false
  enable_markers: false

currency_selector:
  mode: full
  class_name: currency-selector

timeframe_selector: null

strategy_panel:
  ref: "ssot.ui.compare-family.yml#strategy_panel"

scripts:
  extra:
  - strategies.js

cache_busting:
  versions:
    compare_html: 2

navigation:
  ref: "ssot.ui.yml#navigation"
  active_page: compare
