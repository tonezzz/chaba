<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map3D - 3D Map Viewer</title>
  <link rel="stylesheet" href="/apps/common.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #1a1a2e;
      color: #eee;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #map {
      flex: 1;
      width: 100%;
      height: 100%;
    }
    #controls-wrapper {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10000;
      pointer-events: none;
    }
    #controls {
      background: rgba(26, 26, 46, 0.95);
      border-radius: 12px;
      min-width: 240px;
      max-width: 280px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      pointer-events: auto;
      -webkit-overflow-scrolling: touch;
    }
    #controls-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      user-select: none;
    }
    #controls-header h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }
    #controls-toggle {
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      padding: 4px;
      font-size: 16px;
      transition: color 0.2s, transform 0.2s;
    }
    #controls-toggle:hover {
      color: #fff;
    }
    #controls-toggle.collapsed {
      transform: rotate(-90deg);
    }
    #controls-content {
      padding: 16px;
      max-height: 500px;
      overflow-y: auto;
      transition: max-height 0.3s ease, opacity 0.3s ease;
    }
    #controls-content.collapsed {
      max-height: 0;
      opacity: 0;
      padding: 0 16px;
      overflow: hidden;
    }
    .control-section {
      margin-bottom: 16px;
    }
    .control-section:last-child {
      margin-bottom: 0;
    }
    .section-header {
      font-size: 11px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .control-row:last-child {
      margin-bottom: 0;
    }
    .control-row label {
      font-size: 13px;
      color: #ccc;
      flex: 1;
    }
    .control-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-left: 8px;
      accent-color: #6366f1;
      cursor: pointer;
    }
    .control-row select {
      flex: 1;
      padding: 6px 10px;
      background: rgba(42, 42, 78, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #eee;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .control-row select:hover {
      border-color: rgba(255, 255, 255, 0.2);
    }
    .slider-row {
      margin-bottom: 12px;
    }
    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .slider-header label {
      font-size: 13px;
      color: #ccc;
    }
    .slider-value {
      font-size: 12px;
      color: #6366f1;
      font-weight: 600;
      min-width: 32px;
      text-align: right;
    }
    .slider-row input[type="range"] {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }
    .slider-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      background: #6366f1;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .slider-row input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.1);
    }
    .slider-row input[type="range"]::-webkit-slider-thumb:active {
      transform: scale(1.2);
    }
    .slider-row input[type="range"]::-moz-range-thumb {
      width: 24px;
      height: 24px;
      background: #6366f1;
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }
    #status {
      margin-top: 12px;
      padding: 8px 12px;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 6px;
      font-size: 11px;
      color: #a5b4fc;
      text-align: center;
    }
    #status.error {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
    }
    #status.success {
      background: rgba(34, 197, 94, 0.1);
      border-color: rgba(34, 197, 94, 0.2);
      color: #86efac;
    }
    .btn {
      width: 100%;
      padding: 8px 12px;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn:hover {
      background: rgba(99, 102, 241, 0.3);
      border-color: rgba(99, 102, 241, 0.5);
      color: #fff;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .preset-btn {
      flex: 1;
      margin: 0 4px;
      padding: 6px 8px;
      font-size: 11px;
    }
    .preset-btn:first-child {
      margin-left: 0;
    }
    .preset-btn:last-child {
      margin-right: 0;
    }
    .button-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-small {
      width: 36px;
      height: 36px;
      padding: 0;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      border-radius: 6px;
      cursor: pointer;
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      min-width: 36px;
    }
    .btn-small:hover {
      background: rgba(99, 102, 241, 0.3);
      border-color: rgba(99, 102, 241, 0.5);
      color: #fff;
    }
    .btn-small:active {
      transform: scale(0.95);
    }
    .value-display {
      min-width: 48px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: #6366f1;
    }
    .shortcuts-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .shortcut-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: #999;
    }
    .shortcut-key {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 10px;
      color: #a5b4fc;
      min-width: 24px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="map"></div>
    <div id="controls-wrapper">
      <div id="controls">
        <div id="controls-header">
          <h3>Map3D Controls</h3>
          <button id="controls-toggle">▼</button>
        </div>
        <div id="controls-content">
          <div class="control-section">
            <div class="section-header">Scene</div>
            <div class="control-row">
              <select id="scene-select">
                <option value="">Select a scene...</option>
              </select>
            </div>
          </div>
          <div class="control-section">
            <div class="section-header">3D Settings</div>
            <div class="control-row">
              <label>Enable 3D</label>
              <input type="checkbox" id="toggle-3d">
            </div>
            <div class="control-row">
              <label>Show Walls</label>
              <input type="checkbox" id="toggle-walls">
            </div>
          </div>
          <div class="control-section">
            <div class="section-header">View</div>
            <div class="slider-row">
              <div class="slider-header">
                <label>Tilt</label>
                <span class="slider-value" id="tilt-slider-value">0°</span>
              </div>
              <input type="range" id="tilt-slider" min="0" max="60" value="0" step="1">
              <div class="control-row" style="margin-top: 6px;">
                <div class="button-group">
                  <button class="btn-small" data-control="tilt" data-action="decrease" id="tilt-decrease">-</button>
                  <span class="value-display" id="tilt-value">0°</span>
                  <button class="btn-small" data-control="tilt" data-action="increase" id="tilt-increase">+</button>
                </div>
              </div>
            </div>
            <div class="slider-row">
              <div class="slider-header">
                <label>Bearing</label>
                <span class="slider-value" id="bearing-slider-value">0°</span>
              </div>
              <input type="range" id="bearing-slider" min="0" max="360" value="0" step="1">
              <div class="control-row" style="margin-top: 6px;">
                <div class="button-group">
                  <button class="btn-small" data-control="bearing" data-action="decrease" id="bearing-decrease">-</button>
                  <span class="value-display" id="bearing-value">0°</span>
                  <button class="btn-small" data-control="bearing" data-action="increase" id="bearing-increase">+</button>
                </div>
              </div>
            </div>
            <div class="slider-row">
              <div class="slider-header">
                <label>Zoom</label>
                <span class="slider-value" id="zoom-slider-value">18.0</span>
              </div>
              <input type="range" id="zoom-slider" min="10" max="22" value="18" step="0.1">
              <div class="control-row" style="margin-top: 6px;">
                <div class="button-group">
                  <button class="btn-small" data-control="zoom" data-action="decrease" id="zoom-decrease">-</button>
                  <span class="value-display" id="zoom-value">18.0</span>
                  <button class="btn-small" data-control="zoom" data-action="increase" id="zoom-increase">+</button>
                </div>
              </div>
            </div>
            <div class="control-row" style="margin-top: 12px;">
              <button id="reset-view" class="btn">Reset View</button>
            </div>
            <div class="section-header" style="margin-top: 16px;">Presets</div>
            <div class="control-row">
              <button class="btn preset-btn" data-preset="top-down">Top-down</button>
              <button class="btn preset-btn" data-preset="isometric">Isometric</button>
              <button class="btn preset-btn" data-preset="side">Side</button>
            </div>
            <div class="section-header" style="margin-top: 16px;">Shortcuts</div>
            <div class="shortcuts-list">
              <div class="shortcut-item"><span class="shortcut-key">R</span> Reset view</div>
              <div class="shortcut-item"><span class="shortcut-key">↑↓←→</span> Pan</div>
              <div class="shortcut-item"><span class="shortcut-key">+/-</span> Zoom</div>
              <div class="shortcut-item"><span class="shortcut-key">[/]</span> Tilt</div>
              <div class="shortcut-item"><span class="shortcut-key">Shift+←→</span> Rotate</div>
            </div>
          </div>
          <div id="status">Ready</div>
        </div>
      </div>
    </div>
  </div>

  <link href="https://unpkg.com/maplibre-gl@4.1.3/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.1.3/dist/maplibre-gl.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
