- slug: /how-to-get-here-boracay/
  title: How to get here
  status: active
  lastmod: '2017-12-07'
  sections:
  - type: h1
    text: Listed are various modes of transportation that you will take on how to get here in Boracay, Asia's premier spot
      for windsurfing and kitesurfing.
  - type: h3
    text: VIA PLANE FROM MANILA AIRPORT
  - type: text
    content: "Two airports near Boracay Island:\n\n- Caticlan Airport (Godofredo P. Ramos Airport): about 15 minutes land\n\
      \  and sea travel to Boracay. Now accepts up to 45 kg pre-booked\n  baggage on selected airlines.\n- Kalibo International\
      \ Airport: about 2.5 hours land and sea travel.\n\nAirlines include Scoot, Silkair, Cebu Pacific, AirAsia, Philippine\n\
      Airlines, Air Seoul, Pan Pacific and others. A list of airline\nwebsites is provided on the original page.\n"
  - type: h3
    text: VIA SHIP (2Go)
  - type: text
    content: 'A cheaper option with no luggage limit. The ship leaves Batangas Port,

      2 hours from Manila by bus. Bus ticket is roughly Php140-175/person or

      about Php3,000 for a chartered taxi. 2Go has 8am and 9pm departures;

      the trip is 9 hours and docks at Caticlan Jetty Port.

      '
  - type: h3
    text: TRANSIT TIME AND COSTS
  - type: text
    content: "- Caticlan Airport to Caticlan Jetty Port: Php50 tricycle.\n- Kalibo Airport to Caticlan Jetty Port: Php175/person\
      \ for L300 vans,\n  or Php1,000-1,500 for chartered L300 van/taxi.\n- Caticlan Jetty Port to Cagban Jetty Port in Boracay:\
      \ Php25 before\n  6pm, Php30 after 6pm, plus Php100 Terminal Fee and Php75\n  Environmental Fee.\n- Cagban Jetty Port\
      \ to Reef Riders (Bolabog Beach): Php150 tricycle\n  or Php250-300 multi-cab.\n\nHotels and agencies can arrange transfers.\
      \ Southwest Tours is a\nleading agency for transfer services.\n"
  assets:
  - https://reefriders-watersports.com/wp-content/uploads/2012/12/How-to-get-here.jpg
