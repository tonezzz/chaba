- slug: /about-us-windsurfing-kitesurfing-boracay/
  title: About Us
  status: active
  lastmod: '2024-11-08'
  sections:
  - type: h1
    text: Welcome to Reef Riders Windsurfing, Kitesurfing & SUP Center in Boracay, Philippines! (fully operational from November
      to April)
  - type: h3
    text: WINDSURFING, KITESURFING, WINGFOILING & STAND-UP PADDLEBOARDING LESSONS AND RENTALS
  - type: text
    content: 'The center aims to provide beginner, intermediate and advanced rentals,

      lessons and a hospitable crew for convenient, fun action on the water.

      Uses the best quality and latest Starboard, Severne & Airush equipment.

      The crew helps choose the right gear for windsurfing and kitesurfing needs.

      '
  - type: h3
    text: BOLABOG BEACH, BORACAY
  - type: text
    content: 'Boracay has 2 seasons: Amihan (Northeast Monsoon) and Habagat

      (Southwest Monsoon). Amihan is the windsurfing season on Bolabog Beach,

      beginning September/October and ending May/June. The windiest months are

      December, January and February, with daily averages of 20-30 knots.

      Bolabog lagoon is protected by a reef, making it ideal for slalom,

      freestyle and beginners. Advanced riders can head to the reef for bump

      and jump swells, especially when it is blowing 20-35 knots.

      '
  - type: h3
    text: WHITE BEACH, BORACAY
  - type: text
    content: 'For the Habagat Season (Southwest Monsoon, onshore wind on White Beach),

      rentals and lessons are offered at Sinagpa, White Beach (beachfront of

      Boracay Terraces Resort). Open all year round.

      '
  assets:
  - https://reefriders-watersports.com/wp-content/uploads/2014/06/Typhoon.jpg
- slug: /windsurfing-boracay-philippines/
  title: Windsurfing
  status: active
  lastmod: '2025-03-20'
  sections:
  - type: h1
    text: Windsurfing
  - type: h2
    text: WINDSURFING COURSES
  - type: text
    content: "One-on-one windsurfing courses from beginner to advanced level,\nguaranteeing well-supervised, client-centered\
      \ training. Shoes and\nharnesses are provided. Courses are available daily for all levels.\n\n- Discovery Lesson: 1.5\
      \ hr, instruction + rental, simulator training,\n  intensive water training, balancing/positioning, steering and light\n\
      \  wind tack.\n- Private Beginner Package: 3 days, 1.5 hr/day, balancing/positioning,\n  steering, light wind tack,\
      \ beach start and introduction to harness.\n- Private Beginner-Intermediate Package: 5 days, 1.5 hr/day,\n  balancing/positioning,\
      \ steering, light wind tack, light wind gybe,\n  beach start and introduction to harness.\n- Improver-Advanced Lesson:\
      \ 1 hr, waterstart, fast tack, footstraps,\n  going upwind, planing/speeding and carve gybes. Equipment rental\n  not\
      \ included.\n\nPayment Button accepts Debit/Credit Card without PayPal login and\nworks best with Safari.\n"
  - type: h2
    text: WINDSURFING RENTAL
  - type: text
    content: 'Variety of boards for rental: Start boards and sails for beginners,

      intermediate-advanced boards (162-181L on the activity page / 151-171L

      on the price page), freestyle wave, freerace, slalom and quad-fin wave

      boards. Sails include beginner, slalom, freeride, wave and freestyle.

      Equipment insurance can be paid on site.

      '
  assets:
  - https://reefriders-watersports.com/wp-content/uploads/2014/06/Ronald_Schroeder.jpg
