- slug: /kitesurfingboracay/
  title: Kitesurfing
  status: active
  lastmod: '2025-03-30'
  sections:
  - type: h1
    text: Kitesurfing
  - type: h2
    text: KITEBOARDING LESSONS
  - type: text
    content: "- DISCOVERY COURSE: Learn the basics of flying a kite.\n- DAY COURSE: Theory of Wind Window, Kite Setup, Kite\
      \ Control, Kite\n  Relaunch, Body Dragging, Safety Measures, Board Recovery, Self Rescue.\n- BEGINNER COURSE: Waterstart,\
      \ Boardriding, Board Control, Upwind Riding,\n  Transitions.\n- ADVANCED COURSE: For riders who have taken the Beginner\
      \ Course and still\n  need coaching to ride upwind, change direction or learn first jumps.\n- BEGINNER KITE FOIL COURSE:\
      \ Learn the basics of kite foiling.\n"
  - type: h2
    text: STORAGE
  - type: text
    content: 'Dedicated beach caddies help launch and land kites. A NextGEN Gallery

      slideshow is embedded on the page.

      '
