- slug: /stand-up-paddleboarding-boracay-philippines/
  title: Stand-up Paddleboarding
  status: active
  lastmod: '2014-07-13'
  sections:
  - type: h1
    text: Stand-up Paddleboarding
  - type: h3
    text: Stand-up Paddleboarding in Boracay, Philippines!
  - type: text
    content: "Quotes from Ronald Schroeder describe SUP routes and benefits:\n\n- About 1 hour on calm flat water from Reef\
      \ Riders on Bolabog Beach to\n  Puka Beach.\n- 2-3 hours from Bolabog Beach to Jony's or Epic, depending on weather\n\
      \  and currents.\n- Intense paddling between Bolabog and Puka during Amihan Season\n  (October-April).\n- Burn fat,\
      \ trim muscles, train balance and get a core workout.\n- Enjoy nature, catch waves, paddle to places normally unreachable,\
      \ or\n  relax and watch the sunset.\n"
