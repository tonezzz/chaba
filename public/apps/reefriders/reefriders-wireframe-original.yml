- slug: /wingfoiling/
  title: Wingfoiling
  status: active
  lastmod: '2025-03-30'
  sections:
  - type: h1
    text: Wingfoiling
  - type: h2
    text: WINGFOILING COURSES
  - type: text
    content: "One-on-one wingfoiling courses from beginner to advanced level. Shoes\nand harnesses are provided. Courses are\
      \ available daily for all levels.\n\n- Discovery Lesson: 1 hr, learn to harness the wind with a wing. Starts\n  on the\
      \ beach learning to control the wing, then progresses to steering\n  while balancing and positioning on a big flat board\
      \ on the water.\n- Beginner Level 1: 3 hrs, beach wing control, steering and balance on\n  the board.\n- Beginner Level\
      \ 2: 4 hrs, after mastering wingsurfing, start foiling\n  and take your first rides.\n- Full Beginner Course: 7 hrs,\
      \ combination of learning to control the\n  wing and the foil.\n\nWINGFOILING RENTAL: variety of boards, wings and foils.\
      \ Equipment\ninsurance can be paid on site.\n"
