<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>txt2vid — Image to Video</title>
  <style>
    :root { --bg: #1a1a2e; --card: #16213e; --text: #e5e7eb; --muted: #94a3b8; --accent: #0a84ff; --border: #1f2937; }
    * { box-sizing: border-box; }
    html, body { overflow-x: hidden; max-width: 100%; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 1rem; word-break: break-word; }
    a { color: var(--text); }
    .back { display: inline-block; margin-bottom: 1rem; text-decoration: none; background: var(--card); padding: 0.35rem 0.7rem; border-radius: 0.4rem; border: 1px solid var(--border); }
    h1 { margin: 0 0 1rem; }
    .layout { display: grid; grid-template-columns: minmax(300px, 1fr) 1.5fr; gap: 1.5rem; align-items: start; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 0.75rem; padding: 1rem; overflow-x: hidden; }
    .field { margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.3rem; }
    input, textarea, select { width: 100%; padding: 0.5rem; background: #0f172a; color: var(--text); border: 1px solid var(--border); border-radius: 0.4rem; font: inherit; }
    textarea { min-height: 5rem; resize: vertical; }
    input[type="file"] { padding: 0.35rem; }
    .info { display: inline-flex; margin-left: 0.35rem; width: 1rem; height: 1rem; align-items: center; justify-content: center; border-radius: 50%; background: var(--accent); color: #fff; font-size: 0.7rem; cursor: help; position: relative; vertical-align: middle; }
    .info::after { content: attr(data-tip); position: absolute; bottom: 1.35rem; left: 50%; transform: translateX(-50%); width: 240px; padding: 0.45rem 0.6rem; background: #0f172a; border: 1px solid var(--border); border-radius: 0.35rem; font-size: 0.75rem; font-weight: 400; color: var(--text); line-height: 1.35; opacity: 0; pointer-events: none; transition: opacity 0.15s; z-index: 10; }
    .info:hover::after { opacity: 1; }
    .row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
    button { background: var(--accent); color: #fff; border: none; padding: 0.65rem 1rem; border-radius: 0.4rem; cursor: pointer; font-weight: 600; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .status { margin-top: 1rem; font-size: 0.9rem; color: var(--muted); }
    video { width: 100%; border-radius: 0.5rem; margin-top: 0.75rem; background: #000; }
    #preview { width: 100%; max-height: 240px; object-fit: contain; border-radius: 0.5rem; margin-top: 0.5rem; background: #000; }
    .nav { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="nav">
    <a class="back" href="/apps/">&larr; Apps</a>
    <a class="back" href="index.html">&larr; txt2vid</a>
  </div>
  <h1>Image to Video</h1>
  <div class="layout">
    <div class="panel">
      <div class="field">
        <label for="image">Reference image <span class="info" data-tip="Upload a clear image. The video will start from this frame and animate it.">?</span></label>
        <input id="image" type="file" accept="image/*">
        <img id="preview" style="display:none" alt="preview">
      </div>
      <div class="field" style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.75rem;">
        <input id="match_source" type="checkbox" checked style="width:auto;">
        <label for="match_source" style="margin:0; color:var(--text);">Match source dimensions (scale down to fit max width/height)</label>
      </div>
      <div class="field">
        <label for="prompt">Prompt <span class="info" data-tip="Describe the motion or scene you want. Be specific for best results.">?</span></label>
        <textarea id="prompt">A woman dancing gently on a tropical beach at sunset, subtle wind in hair, photorealistic, sharp focus</textarea>
      </div>
      <div class="field">
        <label for="negative_prompt">Negative prompt <span class="info" data-tip="Describe what you do NOT want to appear in the video. Official: 'worst quality, inconsistent motion, blurry, jittery, distorted'">?</span></label>
        <input id="negative_prompt" type="text" value="worst quality, inconsistent motion, blurry, jittery, distorted">
      </div>
      <div class="row">
        <div class="field"><label for="width">Width <span class="info" data-tip="Video width. Multiple of 32. Official i2v default: 704">?</span></label><input id="width" type="number" value="704" step="32" min="128" max="1280"></div>
        <div class="field"><label for="height">Height <span class="info" data-tip="Video height. Multiple of 32. Official i2v default: 480">?</span></label><input id="height" type="number" value="480" step="32" min="128" max="1280"></div>
      </div>
      <div class="row">
        <div class="field"><label for="num_frames">Frames (8n+1) <span class="info" data-tip="For LTX i2v use 9, 17, 25, etc. Official default: 161 frames (~6.4s at 25fps)">?</span></label><input id="num_frames" type="number" value="161" step="8" min="9" max="257"></div>
        <div class="field"><label for="fps">FPS</label><input id="fps" type="number" value="25" min="1" max="60"></div>
      </div>
      <div class="row">
        <div class="field"><label for="steps">Steps</label><input id="steps" type="number" value="50" min="1" max="100"></div>
        <div class="field"><label for="guidance">Guidance scale</label><input id="guidance" type="number" value="3.0" step="0.1" min="1" max="20"></div>
      </div>
      <div class="field"><label for="seed">Seed (-1 = random)</label><input id="seed" type="number" value="42"></div>
      <button id="generate" type="button">Generate from Image</button>
      <div class="status" id="status">Ready.</div>
    </div>
    <div class="panel">
      <h2 style="margin-top:0">Output</h2>
      <div id="current-job" class="status" style="display:none;"></div>
      <video id="output" controls style="display:none"></video>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const API = './api';

    $('image').addEventListener('change', () => {
      const file = $('image').files[0];
      if (file) {
        $('preview').src = URL.createObjectURL(file);
        $('preview').style.display = '';
      }
    });

    function toBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    let polling = false;
    $('generate').addEventListener('click', async () => {
      if (polling) return;
      const file = $('image').files[0];
      if (!file) { $('status').textContent = 'Please select an image.'; return; }
      $('status').textContent = 'Reading image...';
      const imageB64 = await toBase64(file);
      const body = {
        prompt: $('prompt').value,
        negative_prompt: $('negative_prompt').value,
        image: imageB64,
        match_source: $('match_source').checked,
        width: parseInt($('width').value),
        height: parseInt($('height').value),
        num_frames: parseInt($('num_frames').value),
        fps: parseInt($('fps').value),
        num_inference_steps: parseInt($('steps').value),
        guidance_scale: parseFloat($('guidance').value),
        seed: parseInt($('seed').value),
      };
      $('status').textContent = 'Enqueueing...';
      $('output').style.display = 'none';
      $('current-job').style.display = 'none';
      $('generate').disabled = true;
      polling = true;
      const res = await fetch(`${API}/generate_image`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
      if (!res.ok) { $('status').textContent = `Error: ${res.status}`; $('generate').disabled = false; polling = false; return; }
      const { job_id } = await res.json();
      $('current-job').style.display = '';
      $('current-job').textContent = `Job ${job_id}: queued`;
      poll(job_id);
    });

    async function poll(job_id) {
      while (polling) {
        const res = await fetch(`${API}/progress/${job_id}`);
        const j = await res.json();
        $('status').textContent = `Status: ${j.status}`;
        $('current-job').textContent = `Job ${job_id}: ${j.status}`;
        if (j.status === 'completed') {
          polling = false;
          $('generate').disabled = false;
          const h = await (await fetch(`${API}/history/${job_id}`)).json();
          $('output').style.display = '';
          $('output').src = h.video_url;
          return;
        }
        if (j.status === 'failed') {
          polling = false;
          $('generate').disabled = false;
          $('status').textContent = `Failed: ${j.error || 'unknown'}`;
          return;
        }
        await new Promise(r => setTimeout(r, 2000));
      }
    }
  </script>
</body>
</html>
