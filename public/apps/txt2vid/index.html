<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>txt2vid</title>
  <style>
    :root { --bg: #1a1a2e; --card: #16213e; --text: #e5e7eb; --muted: #94a3b8; --accent: #0a84ff; --border: #1f2937; }
    * { box-sizing: border-box; }
    html, body { overflow-x: hidden; max-width: 100%; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 1rem; word-break: break-word; }
    a { color: var(--text); }
    .back { display: inline-block; margin-bottom: 1rem; text-decoration: none; background: var(--card); padding: 0.35rem 0.7rem; border-radius: 0.4rem; border: 1px solid var(--border); }
    h1 { margin: 0 0 1rem; }
    .layout { display: grid; grid-template-columns: minmax(300px, 1fr) 1.5fr; gap: 1.5rem; align-items: start; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 0.75rem; padding: 1rem; overflow-x: hidden; }
    .field { margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.3rem; }
    input, textarea, select { width: 100%; padding: 0.5rem; background: #0f172a; color: var(--text); border: 1px solid var(--border); border-radius: 0.4rem; font: inherit; }
    textarea { min-height: 5rem; resize: vertical; }
    .info { display: inline-flex; margin-left: 0.35rem; width: 1rem; height: 1rem; align-items: center; justify-content: center; border-radius: 50%; background: var(--accent); color: #fff; font-size: 0.7rem; cursor: help; position: relative; vertical-align: middle; }
    .info::after { content: attr(data-tip); position: absolute; bottom: 1.35rem; left: 50%; transform: translateX(-50%); width: 240px; padding: 0.45rem 0.6rem; background: #0f172a; border: 1px solid var(--border); border-radius: 0.35rem; font-size: 0.75rem; font-weight: 400; color: var(--text); line-height: 1.35; opacity: 0; pointer-events: none; transition: opacity 0.15s; z-index: 10; }
    .info:hover::after { opacity: 1; }
    .row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
    button { background: var(--accent); color: #fff; border: none; padding: 0.65rem 1rem; border-radius: 0.4rem; cursor: pointer; font-weight: 600; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .status { margin-top: 1rem; font-size: 0.9rem; color: var(--muted); }
    video { width: 100%; border-radius: 0.5rem; margin-top: 0.75rem; background: #000; }
    .history { max-height: 500px; overflow-y: auto; overflow-x: hidden; }
    .history-item { display: flex; gap: 0.75rem; padding: 0.75rem; background: #0f172a; border: 1px solid var(--border); border-radius: 0.5rem; margin-bottom: 0.5rem; cursor: pointer; align-items: flex-start; min-width: 0; max-width: 100%; }
    .history-item:hover { border-color: var(--accent); }
    .history-item video { width: 100%; max-width: 120px; height: auto; margin: 0; border-radius: 0.35rem; }
    .history-meta { flex: 1; min-width: 0; max-width: 100%; }
    .history-meta .prompt { font-size: 0.9rem; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 100%; }
    .history-meta .params { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.4rem; max-width: 100%; }
    .history-meta .params .pill { background: #1f2937; color: var(--muted); font-size: 0.7rem; padding: 0.15rem 0.45rem; border-radius: 0.3rem; }
    .history-meta .negative { font-size: 0.75rem; color: var(--muted); font-style: italic; margin-top: 0.35rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; width: 100%; }
    .history-meta .status { font-size: 0.75rem; color: var(--muted); margin-top: 0.35rem; }
    .del { background: #7f1d1d; color: #fff; padding: 0.3rem 0.6rem; font-size: 0.75rem; border-radius: 0.3rem; cursor: pointer; }
    .regen { background: #059669; color: #fff; padding: 0.3rem 0.6rem; font-size: 0.75rem; border-radius: 0.3rem; cursor: pointer; border: none; }
  </style>
</head>
<body>
  <a class="back" href="/apps/">&larr; Apps</a>
  <a class="back" href="img2vid.html" style="margin-left:0.5rem;">Image &rarr; Video</a>
  <h1>txt2vid</h1>
  <div class="layout">
    <div class="panel">
      <div class="field">
        <label for="prompt">Prompt <span class="info" data-tip="Text description of the video you want the model to generate. Be specific for best results.">?</span></label>
        <textarea id="prompt">A panda playing a guitar in a bamboo forest.</textarea>
      </div>
      <div class="field">
        <label for="negative_prompt">Negative prompt <span class="info" data-tip="Describe what you do NOT want to appear in the video (e.g. blur, watermark, extra limbs).">?</span></label>
        <input id="negative_prompt" type="text" value="">
      </div>
      <div class="row">
        <div class="field"><label for="width">Width <span class="info" data-tip="Video width in pixels. LTX Video works best at standard resolutions; lower values use less VRAM.">?</span></label><input id="width" type="number" value="384" step="32" min="128" max="1280"></div>
        <div class="field"><label for="height">Height <span class="info" data-tip="Video height in pixels. Lower resolutions are faster and fit better on 4 GB GPUs.">?</span></label><input id="height" type="number" value="224" step="32" min="128" max="1280"></div>
      </div>
      <div class="row">
        <div class="field"><label for="num_frames">Frames (4n+1) <span class="info" data-tip="Number of frames to generate. For this LTX model use values of the form 4n+1 (e.g. 9, 13, 17). More frames need more time and VRAM.">?</span></label><input id="num_frames" type="number" value="49" step="4" min="9" max="129"></div>
        <div class="field"><label for="fps">FPS <span class="info" data-tip="Frames per second of the saved MP4. Higher FPS plays faster; lower FPS is slower motion.">?</span></label><input id="fps" type="number" value="8" min="1" max="60"></div>
      </div>
      <div class="row">
        <div class="field"><label for="steps">Steps <span class="info" data-tip="Number of denoising iterations. More steps can improve quality, but with sequential offloading each step takes noticeable time.">?</span></label><input id="steps" type="number" value="50" min="1" max="100"></div>
        <div class="field"><label for="guidance">Guidance scale <span class="info" data-tip="How closely the output follows the prompt. Higher = stricter adherence; lower = more creative freedom. Typical range 3–7.">?</span></label><input id="guidance" type="number" value="6.0" step="0.1" min="1" max="20"></div>
      </div>
      <div class="field"><label for="seed">Seed (-1 = random) <span class="info" data-tip="Use -1 for a random seed, or any positive number to reproduce the same result from the same settings.">?</span></label><input id="seed" type="number" value="-1"></div>
      <button id="generate" type="button">Generate</button>
      <div class="status" id="status">Ready.</div>
    </div>
    <div class="panel">
      <h2 style="margin-top:0">Output</h2>
      <div id="current-job" class="status" style="display:none;"></div>
      <video id="output" controls style="display:none"></video>
      <h2 style="margin-top:1.5rem">History</h2>
      <div class="history" id="history"></div>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const API = './api';

    async function loadHistory() {
      const res = await fetch(`${API}/history`);
      const data = await res.json();
      const list = $('history');
      if (!data.history.length) { list.innerHTML = '<p class="info">No generations yet.</p>'; return; }
      list.innerHTML = data.history.map(h => {
        const when = h.created_at ? new Date(h.created_at).toLocaleString() : 'unknown';
        const neg = h.negative_prompt ? `<div class="negative" title="${escapeHtml(h.negative_prompt)}">– ${escapeHtml(h.negative_prompt)}</div>` : '';
        const isPending = !h.video_url;
        const thumb = isPending
          ? `<div class="history-thumb" style="width:120px;height:68px;display:flex;align-items:center;justify-content:center;background:#1f2937;color:var(--muted);font-size:0.7rem;border-radius:0.35rem;">${h.status}</div>`
          : `<video src="${h.video_url}" preload="metadata" muted playsinline></video>`;
        return `
        <div class="history-item ${isPending ? 'pending' : ''}" data-id="${h.id}">
          ${thumb}
          <div class="history-meta">
            <div class="prompt">${escapeHtml(h.prompt || '(in progress)')}</div>
            <div class="params">
              <span class="pill">${h.width || '-'}×${h.height || '-'}</span>
              <span class="pill">${h.num_frames || '-'}f @ ${h.fps || '-'}fps</span>
              <span class="pill">${h.num_inference_steps || '-'} steps</span>
              <span class="pill">cfg ${h.guidance_scale || '-'}</span>
              <span class="pill">seed ${h.seed || '-'}</span>
            </div>
            ${neg}
            <div class="status">${h.status} · ${when}</div>
          </div>
          ${isPending ? '' : `<button class="del" data-id="${h.id}">Delete</button><button class="regen" data-id="${h.id}">Regenerate</button>`}
        </div>
      `;}).join('');
      list.querySelectorAll('.history-item').forEach(el => el.addEventListener('click', e => {
        if (e.target.classList.contains('del')) return;
        if (el.classList.contains('pending')) return;
        openItem(el.dataset.id);
      }));
      list.querySelectorAll('.del').forEach(b => b.addEventListener('click', async e => {
        e.stopPropagation();
        await fetch(`${API}/history/${b.dataset.id}`, { method: 'DELETE' });
        loadHistory();
      }));
      list.querySelectorAll('.regen').forEach(b => b.addEventListener('click', async e => {
        e.stopPropagation();
        await openItem(b.dataset.id);
        $('generate').click();
      }));
    }

    async function openItem(id) {
      const res = await fetch(`${API}/history/${id}`);
      const h = await res.json();
      $('current-job').style.display = 'none';
      $('output').style.display = '';
      $('output').src = h.video_url;
      $('prompt').value = h.prompt;
      $('negative_prompt').value = h.negative_prompt || '';
      $('width').value = h.width;
      $('height').value = h.height;
      $('num_frames').value = h.num_frames;
      $('fps').value = h.fps;
      $('steps').value = h.num_inference_steps;
      $('guidance').value = h.guidance_scale;
      $('seed').value = h.seed;
    }

    function escapeHtml(s) { return (s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    let polling = false;
    $('generate').addEventListener('click', async () => {
      if (polling) return;
      const body = {
        prompt: $('prompt').value,
        negative_prompt: $('negative_prompt').value,
        width: parseInt($('width').value),
        height: parseInt($('height').value),
        num_frames: parseInt($('num_frames').value),
        fps: parseInt($('fps').value),
        num_inference_steps: parseInt($('steps').value),
        guidance_scale: parseFloat($('guidance').value),
        seed: parseInt($('seed').value),
      };
      $('status').textContent = 'Enqueueing...';
      $('output').style.display = 'none';
      $('current-job').style.display = 'none';
      $('generate').disabled = true;
      polling = true;
      const res = await fetch(`${API}/generate`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
      if (!res.ok) { $('status').textContent = `Error: ${res.status}`; $('generate').disabled = false; polling = false; return; }
      const { job_id } = await res.json();
      $('current-job').style.display = '';
      $('current-job').textContent = `Job ${job_id}: queued`;
      poll(job_id);
    });

    async function poll(job_id) {
      while (polling) {
        const res = await fetch(`${API}/progress/${job_id}`);
        const j = await res.json();
        $('status').textContent = `Status: ${j.status}`;
        $('current-job').textContent = `Job ${job_id}: ${j.status}`;
        if (j.status === 'completed') {
          polling = false;
          $('generate').disabled = false;
          const h = await (await fetch(`${API}/history/${job_id}`)).json();
          $('output').style.display = '';
          $('output').src = h.video_url;
          loadHistory();
          return;
        }
        if (j.status === 'failed') {
          polling = false;
          $('generate').disabled = false;
          $('status').textContent = `Failed: ${j.error || 'unknown'}`;
          return;
        }
        await new Promise(r => setTimeout(r, 2000));
      }
    }

    loadHistory();
  </script>
</body>
</html>
