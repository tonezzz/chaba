<!DOCTYPE html>
<html class="h-full w-full overflow-hidden">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Track3 Sim</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #1a1a2e; }
    iframe { border: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <iframe id="sim" allow="fullscreen" loading="eager"></iframe>
  <script>
    const params = new URLSearchParams(window.location.search);
    if (!params.get('course')) params.set('course', 'tabsai-ws8-track3');
    params.set('view', 'sim');
    document.getElementById('sim').src = '../index.html?' + params.toString();
  </script>
</body>
</html>
