title: Track4 - Windsurf Race Course Simulator
subtitle: Modular course editor and simulator with YAML support, theme engine, and leader focus
icon: 🏁
sections:
  - title: Core Architecture
    icon: �️
    layout: list
    items:
      - label: Modular design
        text: '10 modules: simulation, course-manager, yaml-editor, wind-system, leader-focus, state-manager, renderer, sections, guide-path, section-highlighter. track.js: 379 lines (62% reduction from 1003).'
      - label: Theme engine
        text: 'Query parameter ?theme=1 loads themes/1.js. DefaultTheme provides base rendering. Racing theme (1.js) adds broadcast chrome, race dashboard, high-contrast labels.'
      - label: File structure
        text: 'track.js (main), simulation.js (physics), course-manager.js (persistence), yaml-editor.js (editing), wind-system.js (wind physics), leader-focus.js (visual focus), state-manager.js (state), renderer.js (drawing), sections.js (geometry), guide-path.js (path), section-highlighter.js (interaction).'

  - title: Course System
    icon: 📂
    layout: list
    items:
      - label: YAML format
        text: 'Course definition with markers, sections, annotations, wind config. Supports start/finish lines, legs, rounding zones, arrow areas.'
      - label: Loading
        text: 'Tries PHP API first, falls back to static YAML. Direct fetch for individual courses. Wind config loaded from course YAML.'
      - label: Editing
        text: 'YAML editor with validation. Save via PHP API. Marker drag-and-drop with state persistence (localStorage + server).'
      - label: State management
        text: 'Marker overrides, hidden sections, course preferences. LocalStorage sync + server backup. Per-course state isolation.'

  - title: Simulation Engine
    icon: ⚡
    layout: list
    items:
      - label: Physics
        text: 'Wind factor based on point of sail (upwind slower, downwind faster). Gust effects, direction variability. Collision detection (6m minimum separation).'
      - label: Racer movement
        text: 'Speed based on wind × boat skill × start penalty. Lane offsets for realistic spacing. Return-to-beach after finish.'
      - label: Wind system
        text: 'Configurable direction (0-360°), speed (5-30 kts), gust factor (0-0.5). UI controls in SIM tab. Real-time application.'
      - label: Performance
        text: 'Binary search for segment finding (O(n)→O(log n)). Early return for <2 racers in collision. Path data caching.'

  - title: Leader Focus
    icon: 🎯
    layout: list
    items:
      - label: Auto-follow leader
        text: 'Highlight leader section (100% opacity), dim others (30%). Press L to toggle. Status shows current section.'
      - label: Manual override
        text: 'Click section in SECTIONS list to focus manually. Visual hierarchy: leader section glow, dimmed others.'
      - label: Implementation
        text: 'CSS transitions (0.3s). Classes: .leader-focus-active, .leader-section, .leader-racer, .dimmed-section, .dimmed-racer.'

  - title: Access & URLs
    icon: 🔗
    layout: list
    items:
      - label: Main application
        text: '/apps/track4/ - Primary course editor and simulator'
      - label: Theme variants
        text: '/apps/track4/?theme=1 - Racing theme with broadcast chrome'
      - label: Simulation-only view
        text: '/apps/track4/?view=sim - Hides course panel, shows simulation only'
      - label: Course files
        text: '/apps/track4/courses/*.yml - YAML course definitions'
      - label: API endpoints
        text: '/apps/track4/api/list.php, api/save.php, api/load.php, api/save-course.php'
      - label: Local development
        text: 'http://tony-omen.local:8081/apps/track4/ - Local development server'
      - label: Production
        text: 'https://chaba.h3.gizmo-thailand.com/apps/track4/ - Production Plesk deployment'

  - title: Testing & Performance
    icon: 🧪
    layout: list
    items:
      - label: Unit tests
        text: '10 tests in course.test.js (haversine, midpoint, resolveSide, buildGuide, buildRoundedGuide). All passing.'
      - label: Integration
        text: 'Module loading, course loading, racer rendering, simulation, layers, UI controls. Verified via syntax checks.'
      - label: Code quality
        text: 'Pre-commit hooks for JS syntax. All modules pass node --check. Total: 2,514 lines across 13 files.'
