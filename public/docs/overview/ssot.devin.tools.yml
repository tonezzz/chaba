mcp:
 cdp-tony-dell: Chrome DevTools Protocol (Tony Dell).
 github: Local github service.
 mcp-gpu: Local GPU control.
 mcp-llama: Local Llama.cpp.
 playwright: Playwright (Local).
 playwright-tony-dell: Playwright (Tony Dell).
 yomi: LINE conversation viewer.
mcp-conf:
- name: cdp-tony-dell
  command: /usr/bin/python3
  args:
  - /home/tony/CascadeProjects/chaba-omen/mcp/mcp-cdp-controller/server.py
- name: github
  command: /bin/bash
  args:
  - /home/tony/CascadeProjects/chaba/.windsurf/run-github-mcp.sh
- name: mcp-gpu
  command: /usr/bin/python3
  args:
  - /home/tony/CascadeProjects/chaba-omen/mcp/mcp-gpu/server.py
  env:
    IMAGEN_URL: http://localhost:8080/apps/imagen2/api
    LLAMA_COMPOSE: /home/tony/CascadeProjects/chaba-omen/stacks/ai/docker-compose.yml
    LLAMA_URL: http://localhost:8008
- name: mcp-llama
  command: /bin/bash
  args:
  - /home/tony/CascadeProjects/chaba/.windsurf/run-llama-mcp.sh
  env:
    LLAMA_URL: http://localhost:8008
- name: playwright
  command: /usr/bin/npx
  args:
  - -y
  - '@playwright/mcp@0.0.78'
  disabled: true
- name: playwright-tony-dell
  command: ssh
  args:
  - -o
  - BatchMode=yes
  - -o
  - ConnectTimeout=5
  - -o
  - ForwardX11=no
  - tony@192.168.1.42
  - export CHROME_CDP_MODE=monitor PATH=/home/tony/.local/bin:/home/tony/.local/node/bin:$PATH; exec chaba-playwright-mcp --headless
  disabled: true
- name: yomi
  command: /usr/bin/node
  args:
  - /home/tony/.yomi/mcpb/run.mjs