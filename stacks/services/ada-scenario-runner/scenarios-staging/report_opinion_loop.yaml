# STAGED scenario — install to ada-pi tests/scenarios-live/report_opinion_loop.yaml
# Created 2026-10-07 for card report-session-loop (design
# docs/design/report-session-loop.md §4a). Tests the ADA-IN-THE-LOOP half:
# Tony asks Ada's opinion of a CMS report -> she must cms_get_page it
# (never opine unread) -> post it to the report-linked card as a from=ada
# [opinion] comment via ada_board_write.
#
# Fixtures (live state, no seeding needed):
#   report: dev-kanban  — regenerated by kanban-sync, always present
#   card:   scenario-report-opinion (report: dev-kanban) — dedicated comms
#           sink in chaba docs/ssot/kanban/cards/; [opinion] comms from ada
#           here are scenario output, not real review input.
# Card-side verification (the comment landed on the probe card) is out of
# the runner's reach — it asserts tool calls, not board state. Spot-check
# GET /apps/board-api/cards for the probe card's comms tail.
name: report_opinion_loop
tier: smoke
url: ws://127.0.0.1:8002/ws
key_name: user-tony
turns:
  # Read-before-opine: an opinion without a cms_get_page first is the
  # failure this scenario exists to catch.
  - user: "What's your opinion of the dev-kanban report — is it accurate?"
    calls_any: [cms_get_page]
    response_nonempty: true
  # Posting the opinion: she may already have posted it on turn 1 (the
  # instructions tell her to) — either way a board write must happen now.
  - user: "Post that opinion on the kanban card linked to that report"
    calls_any: [ada_board_write]
    response_nonempty: true
cleanup:
  # Nothing to clean: probe card comms accumulate by design (they're the
  # scenario trail); dev-kanban is read-only here.
  []
