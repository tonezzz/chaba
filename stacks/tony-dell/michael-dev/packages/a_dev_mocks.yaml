rest:
  - resource: http://michael-ha:8123/api/states/sensor.tze200_mja3fuja_ts0601_temperature
    headers:
      Authorization: !secret michael_ha_auth
    scan_interval: 86400
    timeout: 5
    sensor:
      - name: tze200_mja3fuja_ts0601_temperature
        unique_id: mha_mirror_tze200_temperature
        value_template: "{{ value_json.get('state', 'unavailable') if (value_json is defined and value_json is mapping) else 'unavailable' }}"
        availability: "{{ is_state('binary_sensor.michael_ha_reachable', 'on') and value_json is defined and value_json is mapping and value_json.state is defined and value_json.state not in ('unavailable', 'unknown', 'none') }}"
        unit_of_measurement: "°C"
        state_class: measurement
        device_class: temperature
