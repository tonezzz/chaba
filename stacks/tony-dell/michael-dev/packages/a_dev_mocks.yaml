# Generic service relay to michael-ha — lets dev template switches
# actually toggle the live entity. Read-only mirrors stay read-only;
# only the 9 template switch wrappers below call this.
rest_command:
  mha_call:
    url: "http://michael-ha:8123/api/services/{{ domain }}/{{ service }}"
    method: post
    headers:
      Authorization: !secret michael_ha_auth
      Content-Type: application/json
    payload: '{"entity_id": "{{ entity_id }}"}'

# --- mha mirror reachability gate (card michael-dev-offlan-mirrors, 2026-10-10) ---
# Off-LAN replicas cannot reach michael-ha:8123 cleanly; ungated 30s REST
# polling produced ~1.5-2.1k timeout/UndefinedError lines per host per day.
# Gate design: keep the mirrors, fetch only while the probe says michael-ha
# is reachable. Probe retries slowly (300s, always exits 0 -> quiet);
# mirrors refresh every 30s while the gate is on; a gate->off transition
# forces one last refresh so mirrors mark unavailable promptly.
command_line:
  - binary_sensor:
      name: michael_ha_reachable
      unique_id: mha_gate_michael_ha_reachable
      device_class: connectivity
      command: 'curl -sf -o /dev/null -m 5 http://michael-ha:8123/ >/dev/null 2>&1 && echo ON || echo OFF'
      payload_on: "ON"
      payload_off: "OFF"
      scan_interval: 300
      command_timeout: 8

automation:
  - id: mha_mirror_refresh
    alias: "Dev: refresh mha mirrors while michael-ha reachable"
    mode: single
    triggers:
      - trigger: time_pattern
        seconds: "/30"
        id: tick
      - trigger: state
        entity_id: binary_sensor.michael_ha_reachable
        to: "off"
        id: gate-down
    conditions:
      - or:
          - condition: trigger
            id: gate-down
          - condition: state
            entity_id: binary_sensor.michael_ha_reachable
            state: "on"
    actions:
      - action: homeassistant.update_entity
        target:
          entity_id:
            - sensor.tze200_mja3fuja_ts0601_temperature
            - sensor.tze200_mja3fuja_ts0601_humidity
            - sensor.tze200_mja3fuja_ts0601_carbon_dioxide
            - sensor.tze200_mja3fuja_ts0601_volatile_organic_compounds
            - sensor.tze200_mja3fuja_ts0601_formaldehyde_concentration
            - sensor.laundry_room_washing_machine_power
            - sensor.batteries_1_cell_voltage_average
            - sensor.batteries_1_cell_voltage_highest
            - sensor.batteries_1_cell_voltage_imbalance
            - sensor.batteries_1_cell_voltage_lowest
            - sensor.batteries_1_charge_capacity
            - sensor.batteries_1_temperature_1
            - sensor.batteries_1_temperature_2
            - sensor.batteries_1_temperature_mos
            - sensor.batteries_2_cell_voltage_average
            - sensor.batteries_2_cell_voltage_highest
            - sensor.batteries_2_cell_voltage_imbalance
            - sensor.batteries_2_cell_voltage_lowest
            - sensor.batteries_2_charge_capacity
            - sensor.batteries_2_temperature_1
            - sensor.batteries_2_temperature_2
            - sensor.batteries_2_temperature_mos
            - sensor.batteries_3_cell_voltage_average
            - sensor.batteries_3_cell_voltage_highest
            - sensor.batteries_3_cell_voltage_imbalance
            - sensor.batteries_3_cell_voltage_lowest
