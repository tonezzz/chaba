    step: 0.1
    initial: -48.1
    unit_of_measurement: "A"
    icon: mdi:current-dc
  dev_battery2_voltage:
    min: 40
    max: 60
    step: 0.1
    initial: 52.05
    unit_of_measurement: "V"
    icon: mdi:battery
  dev_battery2_soc:
    min: 0
    max: 100
    step: 1
    initial: 77
    unit_of_measurement: "%"
    icon: mdi:battery
  dev_battery2_power:
    min: -10000
    max: 10000
    step: 10
    initial: -600
    unit_of_measurement: "W"
    icon: mdi:battery
  dev_battery2_current:
    min: -200
    max: 200
    step: 0.1
    initial: -12.0
    unit_of_measurement: "A"
    icon: mdi:current-dc
  dev_battery3_voltage:
    min: 40
    max: 60
    step: 0.1
    initial: 51.95
    unit_of_measurement: "V"
    icon: mdi:battery
  dev_battery3_soc:
    min: 0
    max: 100
    step: 1
    initial: 79
    unit_of_measurement: "%"
    icon: mdi:battery
  dev_battery3_power:
    min: -10000
    max: 10000
    step: 10
    initial: -600
    unit_of_measurement: "W"
    icon: mdi:battery
  dev_battery3_current:
    min: -200
