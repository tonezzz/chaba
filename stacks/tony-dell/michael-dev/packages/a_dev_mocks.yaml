    unit_of_measurement: "V"
    icon: mdi:flash
  dev_grid_frequency:
    min: 45
    max: 65
    step: 0.1
    initial: 50.0
    unit_of_measurement: "Hz"
    icon: mdi:sine-wave
  dev_pv1_power:
    min: 0
    max: 10000
    step: 10
    initial: 4500
    unit_of_measurement: "W"
    icon: mdi:solar-panel
  dev_pv2_power:
    min: 0
    max: 10000
    step: 10
    initial: 3200
    unit_of_measurement: "W"
    icon: mdi:solar-panel
  dev_battery_voltage:
    min: 40
    max: 60
    step: 0.1
    initial: 52.0
    unit_of_measurement: "V"
    icon: mdi:battery
  dev_battery_soc:
    min: 0
    max: 100
    step: 1
    initial: 78
    unit_of_measurement: "%"
    icon: mdi:battery
  dev_battery_power:
    min: -10000
    max: 10000
    step: 10
    initial: -2500
    unit_of_measurement: "W"
    icon: mdi:battery
  dev_battery_current:
    min: -200
