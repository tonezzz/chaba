# Dev-only mock entities for michael-dev
# Use the Data tab on the tony-test dashboard to adjust these live.

input_select:
  dev_inverter_mode:
    options:
      - Normal
      - Standby
      - Self-test
      - Fault
      - Off
    initial: Normal
    icon: mdi:solar-power
  dev_battery_direction:
    options:
      - charge
      - discharge
      - idle
      - unknown
    initial: discharge
    icon: mdi:battery

  dev_g3_source:
    name: G3 source
    options:
      - sensor.inverters_1_pv_power
      - sensor.inverters_1_pv_power_1
      - sensor.inverters_1_pv_power_2
      - sensor.inverters_1_load_power
      - sensor.inverters_1_load_power_essential
      - sensor.inverters_1_grid_power
      - sensor.totals_battery_power
      - sensor.batteries_1_power
      - sensor.batteries_2_power
      - sensor.batteries_3_power
      - input_number.dev_pv1_power
      - input_number.dev_pv2_power
      - input_number.dev_load_power
      - input_number.dev_essential_power
      - input_number.dev_grid_power
      - input_number.dev_battery_power
      - input_number.dev_battery2_power
      - input_number.dev_battery3_power
    initial: sensor.inverters_1_pv_power
    icon: mdi:chart-arc

input_number:
  dev_inverter_temperature:
    min: 0
    max: 100
    step: 1
    initial: 35
    unit_of_measurement: "°C"
    icon: mdi:thermometer
