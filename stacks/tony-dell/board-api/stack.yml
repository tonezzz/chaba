id: chaba-board-api
host: tony-dell
description: >-
  Kanban board write API — the unified mutation door: card
  actions/respond/comment → YAML + board rerender; /lesson /job → WP
  lesson/nest_job CPTs; /report → ada-cms-pages; /inbox → focus-inbox
  (docs/kb/board-api-write-door.md). Binds 127.0.0.1:8787; /health
  returns {"ok": true}.
verify: >-
  curl -sf http://127.0.0.1:8787/health | grep -q '"ok": *true'
requires:
  - "tool:python3 — scripts/board/board-api.py"
state:
  - "~/CascadeProjects/chaba-tony-dell/docs/ssot/kanban/cards — card store"
  - "~/CascadeProjects/chaba-tony-dell/stacks/web/public/apps/board —
     rendered artifacts (gitignored)"
ports:
  - "127.0.0.1:8787 — board write API (loopback)"
restore: >-
  Repo checkout + unit file; board artifacts regenerate via
  chaba-board-render.timer.
related_cards: [service-onboarding-standard]
status: deployed
deployed: 2026-10-04
