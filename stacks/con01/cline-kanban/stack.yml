id: cline-kanban
host: con01
unit: cline-kanban.service
description: >-
  Disposable Cline Kanban v0.1.70 research-preview pilot. Rootless Podman
  service behind strict Host/Origin and Basic Auth checks; HTTP/WebSocket
  port 3484 is published only on con01's Tailscale IPv4 address. No public
  Caddy route, live Chaba repository, or provider credential is included.
verify: >-
  bash ~/CascadeProjects/chaba/stacks/con01/cline-kanban/verify.sh
secrets:
  - "~/.config/secrets/cline-kanban.env — CLINE_PROXY_PASSCODE; never log the value"
requires:
  - "tool:podman"
  - "tool:git"
  - "tcp:registry-1.docker.io:443"
  - "tcp:registry.npmjs.org:443"
state:
  - "~/.local/share/cline-kanban/data — disposable application/session state; no secrets or production work"
  - "~/cline-kanban-pilot/workspace — disposable seeded Git smoke-test project"
  - "~/.cache/nest-worker/cline-kanban-pilot — isolated Nest-pack work cache"
ports:
  - "100.72.146.39:3484 — Basic Auth and strict Host/Origin proxy for UI/WebSocket; Tailscale only"
restore: >-
  Rebuild localhost/cline-kanban:0.1.70 from this directory's Containerfile,
  reinstall the declared Quadlets, and restart cline-kanban.service. The
  proxy password remains in ~/.config/secrets/cline-kanban.env; rotate it
  by replacing that file and restarting the Quadlet. Pilot state is
  disposable and is not backed up. Rollback stops the unit and removes the
  Quadlets through the repository sync path; retain state for inspection
  unless Tony separately approves cleanup.
related_cards:
  - cline-kanban-con01-pilot
  - cline-kanban-nest-worker-adapter
status: deployed
deployed: '2026-10-27'
