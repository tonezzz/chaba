# gh-radar watchlist — groups -> repos
# Canonical seed authored 2026-11-25 (card gh-radar / SYS-0067, dispatch
# 20261125-205450). Deploy target: ~/CascadeProjects/gh-radar/watchlist.yml
# on tony-omen (the gh-radar repo is standalone, NOT a chaba checkout —
# copy this file there to activate; collector format is owner/repo lists
# per group, matching the 2026-11-12 hand-tuned watchlist this replaces).
#
# Sources:
#   starred        — api.github.com/users/tonezzz/starred (5 repos, live pull)
#   fork-upstreams — parent.full_name of every tonezzz/* fork (30 forks,
#                    resolved via api.github.com/repos/tonezzz/<fork>)
#   stack-tools    — upstreams of tools the Chaba stack actually runs
#                    (verified against docs/ssot + stacks/ in this repo)
