title: UI
subtitle: Shared UI conventions, components, and styling for chaba.h3 and 8080 apps.
icon: 🎨
sections:
  - title: Design tokens
    icon: 🎨
    layout: list
    items:
      - label: Background
        text: '#1a1a2e'
      - label: Card surface
        text: '#16213e'
      - label: Accent
        text: '#0a84ff'
      - label: Default text
        text: '#e5e7eb'
      - label: Muted text
        text: '#6b7280 / gray-500'
      - label: Font
        text: system-ui, sans-serif
      - label: Tailwind config
        text: chaba-h3/tailwind.config.cjs
      - label: Built CSS
        text: public/assets/tailwind.css

  - title: Shared navigation
    icon: 🧭
    layout: list
    items:
      - label: Source
        text: chaba-h3/public/apps/nav.js
      - label: Registry
        text: public/apps/apps.yml (nav + apps arrays)
      - label: API
        text: >-
          ChabaNav.load(url, targetId);
          ChabaNav.renderSubnav(items, path)
      - label: Top nav
        text: Sticky, bg-card, z-1100, two-level hover dropdowns, hamburger on mobile.
      - label: Sub nav
        text: Sticky top-12, z-1000, simple link row.
      - label: Active link
        text: text-accent + font-semibold when path starts with href.

  - title: Shared components
    icon: 🧩
    layout: list
    items:
      - label: App card
        text: >-
          .app-card class used across apps/grid/panels;
          hover border accent.
      - label: Common CSS
        text: >-
          chaba-h3/public/apps/common.css (body, #map,
          leaflet popup overrides).
      - label: Overview renderer
        text: >-
          chaba-h3/public/apps/overview/overview.js:
          layouts link-grid, panels, stats, list, table,
          tree, dynamic-panels
      - label: YAML editor
        text: >-
          public/apps/shared/yml-edit.js for in-browser
          YAML copy/download/server-save.
      - label: Shared JS utilities
        text: >-
          public/apps/shared/js/ for reusable JavaScript:
          date-utils.js, date-utils-thailand.js,
          api-utils.js, api-yomi.js, ui-utils.js.
          TypeScript definitions (*.d.ts) provided.
          Unit tests in shared/tests/.
          See shared/README.md for usage.
      - label: Migrated apps
        text: >-
          Yomi apps using shared utilities:
          daily2, memory, daily, chat.html, index.html.
          All fetch calls migrated to YomiApi.
      - label: Icons
        text: Emoji icons for page/app cards; keep short and consistent.

  - title: App registration
    icon: 🗂️
    layout: list
    items:
      - label: Index
        text: public/apps/index.html renders apps.yml into a grid.
      - label: Nav
        text: Add to public/apps/apps.yml nav or apps arrays.
      - label: Paths
        text: Use trailing slash in hrefs (/apps/foo/) to avoid bare-directory asset resolution bugs.

  - title: Asset paths
    icon: 🔗
    layout: list
    items:
      - label: Absolute preferred
        text: >-
          /apps/foo/asset.css not 'asset.css' so
          directory-index or bare-URL redirects work.
      - label: Plesk parity
        text: >-
          chaba.h3 serves public/ as docroot;
          /apps/foo/ maps to public/apps/foo/.
      - label: Local preview
        text: >-
          :8081 full parity via Caddy;
          :8123 via php -S for PHP apps.

  - title: Constraints
    icon: ⚠️
    layout: list
    items:
      - label: Static only
        text: >-
          chaba.h3 on Plesk: no Node, Docker,
          WebSocket, or LAN-only APIs.
      - label: PHP allowed
        text: >-
          PHP 8.x on Plesk; file IO works,
          disable_functions blocks shell/process functions.
      - label: Dynamic features
        text: Keep dynamic APIs in chaba stacks or the 8080 web stack, not in chaba.h3.

  - title: Build workflow
    icon: 🛠️
    layout: list
    items:
      - label: CSS
        text: >-
          npm install && npm run build:css in chaba-h3.
      - label: Tailwind watch
        text: >-
          npm run watch:css
      - label: Pre-commit
        text: >-
          chaba/.githooks/pre-commit runs node --check
          for .js/.mjs and py_compile for .py.
