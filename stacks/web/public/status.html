<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>System Status</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #22c55e;
      --warn: #f59e0b;
      --err: #ef4444;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 1.5rem; }
    .updated { color: var(--muted); font-size: 0.9rem; }
    button {
      background: var(--accent);
      border: none;
      color: #0f172a;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { opacity: 0.9; }
    main {
      padding: 2rem;
      display: grid;
      gap: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.25rem;
    }
    .card h2 { margin: 0 0 1rem; font-size: 1.1rem; color: var(--accent); }
    .card h3 { margin: 0 0 0.5rem; font-size: 1rem; }
    .row { display: flex; justify-content: space-between; padding: 0.35rem 0; border-bottom: 1px solid var(--border); }
    .row:last-child { border-bottom: none; }
    .label { color: var(--muted); }
    .value { font-weight: 500; }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-running { background: rgba(34, 197, 94, 0.15); color: var(--ok); }
    .badge-stopped { background: rgba(239, 68, 68, 0.15); color: var(--err); }
    .badge-other { background: rgba(245, 158, 11, 0.15); color: var(--warn); }
    .badge-true { background: rgba(34, 197, 94, 0.15); color: var(--ok); }
    .badge-false { background: rgba(239, 68, 68, 0.15); color: var(--err); }
    .progress {
      height: 0.5rem;
      background: #334155;
      border-radius: 0.25rem;
      overflow: hidden;
      margin-top: 0.5rem;
    }
    .progress-bar { height: 100%; background: var(--accent); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.6rem; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; font-size: 0.85rem; }
    .links a { color: var(--accent); text-decoration: none; margin-right: 1rem; }
    .links a:hover { text-decoration: underline; }
    .error { color: var(--err); }
    .loading { color: var(--muted); }
    @media (max-width: 640px) {
      header, main { padding: 1rem; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>System Status</h1>
      <div class="updated" id="updated">Loading...</div>
    </div>
    <button id="refresh">Refresh</button>
  </header>
  <main>
    <section class="grid-3" id="summary-cards"></section>

    <section class="card">
      <h2>Quick Links</h2>
      <div class="links">
        <a href="/camera-map.html" target="_blank">Camera Map</a>
        <a id="link-frigate" href="#" target="_blank">Frigate UI</a>
        <a id="link-control" href="#" target="_blank">Camera Control (tony-omen)</a>
        <a href="http://tony-dell.local:8090/" target="_blank">Camera Control (tony-dell)</a>
        <a id="link-jupyter" href="#" target="_blank">JupyterLab</a>
        <a id="link-nerfstudio" href="#" target="_blank">Nerfstudio</a>
      </div>
    </section>

    <section class="grid-2">
      <div class="card">
        <h2>System</h2>
        <div id="system-info" class="loading">Loading...</div>
      </div>
      <div class="card">
        <h2>Git</h2>
        <div id="git-info" class="loading">Loading...</div>
      </div>
      <div class="card">
        <h2>Host Resources</h2>
        <div id="host-info" class="loading">Loading...</div>
      </div>
    </section>

    <section class="card">
      <h2>Containers</h2>
      <div id="containers-info" class="loading">Loading...</div>
    </section>

    <section class="grid-2">
      <div class="card">
        <h2>Frigate</h2>
        <div id="frigate-info" class="loading">Loading...</div>
      </div>
      <div class="card">
        <h2>Cameras</h2>
        <div id="camera-info" class="loading">Loading...</div>
      </div>
    </section>
  </main>

  <script>
    const fmtTime = (seconds) => {
      if (!seconds && seconds !== 0) return "—";
      const d = Math.floor(seconds / 86400);
      const h = Math.floor((seconds % 86400) / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const parts = [];
      if (d) parts.push(`${d}d`);
      if (h) parts.push(`${h}h`);
      if (m) parts.push(`${m}m`);
      return parts.join(" ") || `${Math.floor(seconds)}s`;
    };

    const badge = (text, type) => `<span class="badge badge-${type}">${text}</span>`;

    const renderSummary = (data) => {
      const running = data.containers.filter(c => c.state === "running").length;
      const total = data.containers.length;
      const html = `
        <div class="card"><h3>Containers</h3><div class="value" style="font-size:1.5rem">${running} / ${total}</div><div class="label">running</div></div>
        <div class="card"><h3>Frigate</h3><div class="value" style="font-size:1.5rem">${data.frigate.reachable ? "Online" : "Offline"}</div><div class="label">${data.frigate.version || ""}</div></div>
        <div class="card"><h3>Cameras</h3><div class="value" style="font-size:1.5rem">${data.cameras.total || 0}</div><div class="label">${data.cameras.enabled || 0} enabled</div></div>
      `;
      document.getElementById("summary-cards").innerHTML = html;
    };

    const renderHost = (host) => {
      const cpuBar = `<div class="progress"><div class="progress-bar" style="width:${Math.min(host.cpu_percent, 100)}%"></div></div>`;
      const memBar = `<div class="progress"><div class="progress-bar" style="width:${Math.min(host.memory.percent, 100)}%"></div></div>`;
      const tempRows = Object.entries(host.temperatures || {})
        .flatMap(([name, entries]) => entries.map(e => `
          <div class="row"><span class="label">${e.label || name}</span><span class="value">${e.current !== null ? e.current.toFixed(1) + "°C" : "—"}</span></div>
        `))
        .join("");
      document.getElementById("host-info").innerHTML = `
        <div class="row"><span class="label">CPU</span><span class="value">${host.cpu_percent.toFixed(1)}%</span></div>
        ${cpuBar}
        <div class="row"><span class="label">Memory</span><span class="value">${host.memory.used_gb.toFixed(2)} / ${host.memory.total_gb.toFixed(2)} GB</span></div>
        ${memBar}
        <div class="row"><span class="label">Load avg</span><span class="value">${host.load_average["1m"]} / ${host.load_average["5m"]} / ${host.load_average["15m"]}</span></div>
        ${tempRows}
      `;
    };

    const renderSystem = (sys) => {
      const disks = Object.entries(sys.disk || {})
        .map(([key, d]) => {
          if (!d) return "";
          return `
            <div class="row">
              <span class="label">${key}</span>
              <span class="value">${d.percent_used}% used</span>
            </div>
            <div class="row" style="border-bottom:none">
              <span class="label">${d.path}</span>
              <span class="value">${d.used_gb} / ${d.total_gb} GB</span>
            </div>
            <div class="progress"><div class="progress-bar" style="width:${d.percent_used}%"></div></div>
          `;
        }).join("");
      document.getElementById("system-info").innerHTML = `
        <div class="row"><span class="label">Hostname</span><span class="value">${sys.hostname}</span></div>
        <div class="row"><span class="label">Uptime</span><span class="value">${fmtTime(sys.uptime_seconds)}</span></div>
        ${disks}
      `;
    };

    const renderGit = (git) => {
      document.getElementById("git-info").innerHTML = `
        <div class="row"><span class="label">Branch</span><span class="value">${git.branch || "—"}</span></div>
        <div class="row"><span class="label">Commit</span><span class="value">${git.commit || "—"}</span></div>
        <div class="row"><span class="label">Message</span><span class="value">${git.message || "—"}</span></div>
        <div class="row"><span class="label">Clean</span><span class="value">${git.is_clean === null ? "—" : badge(git.is_clean ? "clean" : "dirty", git.is_clean)}</span></div>
      `;
    };

    const renderContainers = (containers) => {
      if (!containers.length) {
        document.getElementById("containers-info").innerHTML = "<p class=\"error\">No container data</p>";
        return;
      }
      if (containers[0]?.error) {
        document.getElementById("containers-info").innerHTML = `<p class="error">${containers[0].error}</p>`;
        return;
      }
      const rows = containers.map(c => {
        const stateClass = c.state === "running" ? "running" : (c.state === "exited" ? "stopped" : "other");
        const ports = c.ports?.join(", ") || "—";
        return `<tr>
          <td>${c.name}</td>
          <td>${badge(c.state, stateClass)}</td>
          <td>${c.image}</td>
          <td>${ports}</td>
        </tr>`;
      }).join("");
      document.getElementById("containers-info").innerHTML = `
        <table>
          <thead><tr><th>Name</th><th>State</th><th>Image</th><th>Ports</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    };

    const renderFrigate = (f) => {
      document.getElementById("frigate-info").innerHTML = `
        <div class="row"><span class="label">Reachable</span><span class="value">${badge(f.reachable ? "yes" : "no", f.reachable)}</span></div>
        <div class="row"><span class="label">Version</span><span class="value">${f.version || "—"}</span></div>
        <div class="row"><span class="label">Cameras in config</span><span class="value">${f.camera_count ?? "—"}</span></div>
        <div class="row"><span class="label">Enabled</span><span class="value">${f.enabled_count ?? "—"}</span></div>
        ${f.error ? `<div class="row error"><span class="label">Error</span><span class="value">${f.error}</span></div>` : ""}
      `;
    };

    const renderCameras = (cam) => {
      if (cam.error) {
        document.getElementById("camera-info").innerHTML = `<p class="error">${cam.error}</p>`;
        return;
      }
      const groups = Object.entries(cam.groups || {})
        .map(([name, g]) => `<div class="row"><span class="label">${name}</span><span class="value">${g.count}</span></div>`)
        .join("");
      const sources = Object.entries(cam.sources || {})
        .map(([name, count]) => `<div class="row"><span class="label">${name}</span><span class="value">${count}</span></div>`)
        .join("");
      document.getElementById("camera-info").innerHTML = `
        <div class="row"><span class="label">Total</span><span class="value">${cam.total}</span></div>
        <div class="row"><span class="label">Enabled</span><span class="value">${cam.enabled}</span></div>
        <div class="row"><span class="label">With heading</span><span class="value">${cam.with_heading}</span></div>
        <h3 style="margin-top:1rem">Groups</h3>
        ${groups}
        <h3 style="margin-top:1rem">Sources</h3>
        ${sources}
      `;
    };

    let timer;
    const load = async () => {
      document.getElementById("updated").textContent = "Loading...";
      try {
        const res = await fetch("/api/status");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        renderSummary(data);
        renderSystem(data.system);
        renderHost(data.host);
        renderGit(data.git);
        renderContainers(data.containers);
        renderFrigate(data.frigate);
        renderCameras(data.cameras);
        const ts = new Date(data.system.timestamp);
        document.getElementById("updated").textContent = "Updated: " + ts.toLocaleString();
      } catch (err) {
        document.getElementById("updated").innerHTML = `<span class="error">Error: ${err.message}</span>`;
      }
    };

    const host = window.location.hostname;
    document.getElementById("link-frigate").href = `http://${host}:5000`;
    document.getElementById("link-control").href = `http://${host}:8090/`;
    document.getElementById("link-jupyter").href = `http://${host}:8888`;
    document.getElementById("link-nerfstudio").href = `http://${host}:7007`;

    document.getElementById("refresh").addEventListener("click", load);
    load();
    timer = setInterval(load, 30000);
  </script>
</body>
</html>
