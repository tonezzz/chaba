<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents</title>
<script src="https://idc03.taila0626a.ts.net/apps/ha/ada-tony/cards/ada-webchat-card.js"></script>
<style>
  :root { --bg:#141824; --rail:#1b2133; --rail-edge:#262f47; --card:#232b40;
          --txt:#e8ecf4; --dim:#8b94a8; --accent:#4a90d9; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; background: var(--bg); color: var(--txt);
         font: 15px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; }
  #rail { width: 220px; flex: none; background: var(--rail);
          border-right: 1px solid var(--rail-edge); display: flex;
          flex-direction: column; }
  #rail h1 { font-size: 15px; margin: 0; padding: 14px 16px 10px;
             letter-spacing: .04em; text-transform: uppercase;
             color: var(--dim); }
  .contact { display: flex; align-items: center; gap: 10px; width: 100%;
             padding: 10px 14px; border: 0; background: none;
             color: var(--txt); font: inherit; text-align: left;
             cursor: pointer; }
  .contact:hover { background: var(--card); }
  .contact.sel { background: var(--card);
                 box-shadow: inset 3px 0 0 var(--accent); }
  .contact .av { width: 34px; height: 34px; border-radius: 50%;
                 display: grid; place-items: center; font-weight: 700;
                 font-size: 15px; color: #fff; flex: none; }
  .contact .nm { font-weight: 600; }
  .contact .sub { font-size: 11px; color: var(--dim); }
  .contact .dot { width: 8px; height: 8px; border-radius: 50%;
                  flex: none; margin-left: auto;
                  border: 1px solid var(--dim); }
  .contact .dot.keyed { background: #57d98d; border-color: #57d98d; }
  .contact.soon { opacity: .45; cursor: default; }
  #rail .foot { margin-top: auto; padding: 10px 14px; font-size: 11px;
                color: var(--dim); border-top: 1px solid var(--rail-edge); }
  #seedbox { margin-top: 8px; display: flex; gap: 6px; }
  #seedbox input { flex: 1; min-width: 0; background: var(--card);
                   border: 1px solid var(--rail-edge); border-radius: 6px;
                   color: var(--txt); padding: 6px 8px; font-size: 11px; }
  #seedbox button { background: var(--accent); border: 0; border-radius: 6px;
                    color: #fff; padding: 6px 10px; font-size: 11px;
                    cursor: pointer; }
  #seed-msg { margin-top: 6px; font-size: 11px; color: var(--accent); }
  #stage { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #stage-head { padding: 10px 16px; border-bottom: 1px solid var(--rail-edge);
                display: flex; align-items: baseline; gap: 10px; }
  #stage-head .nm { font-weight: 700; font-size: 16px; }
  #stage-head .ln { font-size: 12px; color: var(--dim); }
  #chat-wrap { flex: 1; min-height: 0; padding: 12px; }
  #chat-wrap ada-webchat-card { height: 100%; }
  #empty { flex: 1; display: grid; place-items: center; color: var(--dim); }
  #empty .box { text-align: center; max-width: 340px; }
</style>
</head>
<body>
  <nav id="rail"><h1>Agents</h1><div id="contacts"></div>
    <div class="foot">Lanes connect over the tailnet (idc03).
      Off-tailnet? Connect Tailscale first.
      <div id="seedbox">
        <input id="seed-in" type="password" autocomplete="off"
               placeholder="Paste bootstrap URL or keys blob">
        <button id="seed-go">Seed</button>
      </div>
      <div id="seed-msg"></div></div>
  </nav>
  <div id="stage">
    <div id="stage-head"><span class="nm" id="h-name"></span>
      <span class="ln" id="h-lane"></span></div>
    <div id="chat-wrap"></div>
  </div>
<script>
// Agent roster — one <ada-webchat-card> per ada lane, swapped on select.
// The card persists {lane,key,device_id} in a single localStorage record
// ("ada_webchat"), so this page keeps a per-lane key cache ("ada_roster")
// and rewrites that record before mounting the contact's card.
const CONTACTS = [
  { id: "chaba",  name: "Chaba",   color: "#2c7a4b",
    lane: "https://idc03.taila0626a.ts.net/apps/ha/ada-tony" },
  { id: "kaewta", name: "Kaewta",  color: "#7a4b2c",
    lane: "https://idc03.taila0626a.ts.net/apps/ha/ada-kk" },
  { id: "kraut",  name: "Kraut",   color: "#4b2c7a",
    lane: "https://idc03.taila0626a.ts.net/apps/ha/ada-michael" },
  { id: "dev",    name: "Ada Dev", color: "#555f70",
    lane: "https://idc03.taila0626a.ts.net/apps/ha/ada-dev" },
  { id: "devin",  name: "Devin",   soon: "needs ws shim" },
  { id: "nest",   name: "Nest",    soon: "needs ws shim" },
];
const MEMBER = "tony";   // -> chat_id web-tony on every lane
const LS_KEYS = "ada_roster";

const keys = () => { try { return JSON.parse(localStorage.getItem(LS_KEYS) || "{}"); }
                     catch (_) { return {}; } };
const setKey = (lane, key, device_id) => {
  const k = keys(); k[lane] = { key, device_id };
  localStorage.setItem(LS_KEYS, JSON.stringify(k));
};

// Seeding: accepts "#key.<id>=ada-..." pairs — from the URL fragment OR
// pasted into the seed box (the fragment is fragile: a Cloudflare Access
// or similar auth redirect drops it before the page ever runs).
function seedFrom(str) {
  let i = str.indexOf("#"); if (i >= 0) str = str.slice(i + 1);
  i = str.indexOf("key."); if (i >= 0) str = str.slice(i);
  const h = new URLSearchParams(str.trim());
  let touched = false;
  for (const c of CONTACTS) {
    const v = h.get("key." + c.id);
    if (v && /^ada-[A-Za-z0-9_-]{10,}$/.test(v)) { setKey(c.lane, v); touched = true; }
  }
  return touched;
}
if (seedFrom(location.hash.slice(1)))
  history.replaceState(null, "", location.pathname);

document.getElementById("seed-go").addEventListener("click", () => {
  const inp = document.getElementById("seed-in");
  const msg = document.getElementById("seed-msg");
  if (seedFrom(inp.value)) { msg.textContent = "Keys stored — reloading…";
                           location.reload(); }
  else msg.textContent = "No key.<name>=ada-… pairs found in that paste.";
});

const rail = document.getElementById("contacts");
const wrap = document.getElementById("chat-wrap");
const hName = document.getElementById("h-name");
const hLane = document.getElementById("h-lane");
let current = null, cardEl = null;

function deviceId() {
  let d = localStorage.getItem("ada_roster_device");
  if (!d) { d = (crypto.randomUUID ? crypto.randomUUID()
              : Date.now() + "-" + Math.random()).replace(/-/g, "");
          localStorage.setItem("ada_roster_device", d); }
  return d;
}

// Cache whatever key the card saved (paste flow) back into the roster map.
function harvest() {
  try {
    const d = JSON.parse(localStorage.getItem("ada_webchat") || "{}");
    if (d.lane && d.key) setKey(d.lane, d.key, d.device_id);
  } catch (_) {}
  refreshDots();
}
setInterval(harvest, 2000);

// Per-contact key presence: filled dot = ada_roster has a usable key for
// the lane, hollow = the card will show its invite gate on select.
function refreshDots() {
  const k = keys();
  document.querySelectorAll(".contact").forEach(b => {
    const c = CONTACTS.find(x => x.id === b.dataset.id);
    const dot = b.querySelector(".dot");
    if (dot) dot.classList.toggle("keyed",
      !c.soon && /^ada-[A-Za-z0-9_-]{10,}$/.test(k[c.lane]?.key || ""));
  });
}

function select(c) {
  // Always remount: re-clicking a contact stuck on its invite/denied gate
  // must re-inject ada_webchat and create a fresh card — an early return
  // leaves the dead card on screen while storage may already hold a key.
  harvest();
  document.querySelectorAll(".contact").forEach(b =>
    b.classList.toggle("sel", b.dataset.id === c.id));
  current = c.id;
  hName.textContent = c.name;
  hLane.textContent = c.lane || "";
  if (cardEl) { cardEl.remove(); cardEl = null; }
  wrap.innerHTML = "";
  if (c.soon) {
    wrap.innerHTML = `<div id="empty"><div class="box">
      <p><b>${c.name}</b> isn't on a lane yet — ${c.soon}.</p></div></div>`;
    return;
  }
  const k = keys()[c.lane];
  if (k && /^ada-[A-Za-z0-9_-]{10,}$/.test(k.key || ""))
    localStorage.setItem("ada_webchat", JSON.stringify(
      { lane: c.lane, key: k.key, device_id: k.device_id || deviceId() }));
  else localStorage.removeItem("ada_webchat");
  cardEl = document.createElement("ada-webchat-card");
  cardEl.setAttribute("lane", c.lane);
  cardEl.setAttribute("member", MEMBER);
  wrap.append(cardEl);
}

for (const c of CONTACTS) {
  const b = document.createElement("button");
  b.className = "contact" + (c.soon ? " soon" : "");
  b.dataset.id = c.id;
  b.innerHTML = `<span class="av" style="background:${c.color || "#333"}">
      ${c.name[0]}</span>
    <span><span class="nm">${c.name}</span><br>
      <span class="sub">${c.soon || c.lane.split("/").pop()}</span></span>
    <span class="dot"></span>`;
  if (!c.soon) b.addEventListener("click", () => select(c));
  rail.append(b);
}
refreshDots();
select(CONTACTS[0]);
</script>
</body>
</html>
