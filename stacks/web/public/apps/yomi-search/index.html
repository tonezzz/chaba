<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yomi Message Search</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 2em;
      margin-bottom: 10px;
    }

    .header p {
      opacity: 0.9;
    }

    .search-section {
      padding: 30px;
      border-bottom: 1px solid #eee;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .search-box input {
      flex: 1;
      padding: 15px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    .search-box input:focus {
      outline: none;
      border-color: #667eea;
    }

    .search-box button {
      padding: 15px 30px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .search-box button:hover {
      transform: translateY(-2px);
    }

    .filters {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .filter-group {
      flex: 1;
      min-width: 200px;
    }

    .filter-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #333;
    }

    .filter-group input,
    .filter-group select {
      width: 100%;
      padding: 10px;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }

    .results-section {
      padding: 30px;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .results-count {
      font-weight: 600;
      color: #666;
    }

    .message-card {
      background: #f9f9f9;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 15px;
      border-left: 4px solid #667eea;
      transition: transform 0.2s;
    }

    .message-card:hover {
      transform: translateX(5px);
    }

    .message-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 14px;
      color: #666;
    }

    .message-sender {
      font-weight: 600;
      color: #333;
    }

    .message-chat {
      color: #667eea;
    }

    .message-time {
      color: #999;
    }

    .message-text {
      font-size: 16px;
      line-height: 1.6;
      color: #333;
      margin-bottom: 10px;
    }

    .message-meta {
      display: flex;
      gap: 15px;
      font-size: 12px;
      color: #999;
    }

    .similarity-score {
      color: #667eea;
      font-weight: 600;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    .error {
      background: #fee;
      color: #c33;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: #f9f9f9;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }

    .stat-value {
      font-size: 2em;
      font-weight: 700;
      color: #667eea;
    }

    .stat-label {
      color: #666;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔍 Yomi Message Search</h1>
      <p>Semantic search across your LINE conversations</p>
    </div>

    <div class="search-section">
      <div class="search-box">
        <input type="text" id="searchQuery" placeholder="Search your messages..." />
        <button onclick="searchMessages()">Search</button>
      </div>

      <div class="filters">
        <div class="filter-group">
          <label>Chat Name</label>
          <input type="text" id="chatName" placeholder="Filter by chat name" />
        </div>
        <div class="filter-group">
          <label>Sender</label>
          <input type="text" id="fromName" placeholder="Filter by sender" />
        </div>
        <div class="filter-group">
          <label>Category</label>
          <select id="category">
            <option value="">All Categories</option>
            <option value="family">Family</option>
            <option value="friends">Friends</option>
            <option value="work">Work</option>
            <option value="shopping">Shopping</option>
            <option value="news">News</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Results</label>
          <select id="limit">
            <option value="10">10 results</option>
            <option value="20" selected>20 results</option>
            <option value="50">50 results</option>
            <option value="100">100 results</option>
          </select>
        </div>
      </div>
    </div>

    <div class="results-section">
      <div id="stats"></div>
      <div id="error"></div>
      <div class="results-header">
        <div class="results-count" id="resultsCount"></div>
      </div>
      <div id="results"></div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:3003';

    async function loadStats() {
      try {
        const response = await fetch(`${API_URL}/stats`);
        const data = await response.json();
        
        document.getElementById('stats').innerHTML = `
          <div class="stats">
            <div class="stat-card">
              <div class="stat-value">${data.total_messages.toLocaleString()}</div>
              <div class="stat-label">Total Messages</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${data.top_chats?.[0]?.count || 0}</div>
              <div class="stat-label">Top Chat: ${data.top_chats?.[0]?.value || 'N/A'}</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${data.top_senders?.[0]?.count || 0}</div>
              <div class="stat-label">Top Sender: ${data.top_senders?.[0]?.value || 'N/A'}</div>
            </div>
          </div>
        `;
      } catch (error) {
        console.error('Failed to load stats:', error);
      }
    }

    async function searchMessages() {
      const query = document.getElementById('searchQuery').value.trim();
      if (!query) {
        showError('Please enter a search query');
        return;
      }

      const filters = {
        chatName: document.getElementById('chatName').value.trim() || undefined,
        fromName: document.getElementById('fromName').value.trim() || undefined,
        category: document.getElementById('category').value || undefined,
        limit: parseInt(document.getElementById('limit').value)
      };

      // Remove undefined filters
      Object.keys(filters).forEach(key => {
        if (filters[key] === undefined) delete filters[key];
      });

      showLoading();
      hideError();

      try {
        const response = await fetch(`${API_URL}/search`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query, filters })
        });

        const data = await response.json();
        
        if (data.error) {
          showError(data.error);
          return;
        }

        displayResults(data.results);
        document.getElementById('resultsCount').textContent = `Found ${data.total} messages`;
      } catch (error) {
        showError('Search failed: ' + error.message);
      }
    }

    function displayResults(results) {
      const container = document.getElementById('results');
      
      if (results.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #666; padding: 40px;">No messages found. Try a different search term.</p>';
        return;
      }

      container.innerHTML = results.map(msg => `
        <div class="message-card">
          <div class="message-header">
            <span class="message-sender">${msg.fromName}</span>
            <span class="message-chat">${msg.chatName}</span>
            <span class="message-time">${new Date(msg.deliveredTime).toLocaleString()}</span>
          </div>
          <div class="message-text">${msg.text}</div>
          <div class="message-meta">
            <span class="similarity-score">Similarity: ${(msg.similarity * 100).toFixed(1)}%</span>
            <span>${msg.isGroup ? 'Group Chat' : 'Direct Message'}</span>
            <span>${msg.category || 'Uncategorized'}</span>
          </div>
        </div>
      `).join('');
    }

    function showLoading() {
      document.getElementById('results').innerHTML = '<div class="loading">Searching messages...</div>';
    }

    function showError(message) {
      document.getElementById('error').innerHTML = `<div class="error">${message}</div>`;
    }

    function hideError() {
      document.getElementById('error').innerHTML = '';
    }

    // Load stats on page load
    loadStats();

    // Enable Enter key search
    document.getElementById('searchQuery').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchMessages();
    });
  </script>
</body>
</html>
