<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cam-wall</title>
<style>
  html, body { margin: 0; background: #000; color: #ddd; font-family: ui-monospace, monospace; height: 100%; }
  #grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
          gap: 2px; height: 100vh; box-sizing: border-box; padding: 2px; }
  .cell { position: relative; background: #111; overflow: hidden; min-height: 0; cursor: pointer; }
  .cell img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .cell.live-edge { outline: 1px solid #2af; outline-offset: -1px; }
  .lbl { position: absolute; left: 0; top: 0; padding: 3px 8px; background: rgba(0,0,0,.55);
         font-size: 13px; color: #8ef; letter-spacing: .04em; }
  .age { position: absolute; right: 0; bottom: 0; padding: 2px 7px; background: rgba(0,0,0,.55);
         font-size: 12px; color: #9aa; }
  .age.stale { color: #f66; }
  .err { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
         color: #f66; font-size: 13px; }
  #hud { position: fixed; right: 8px; top: 8px; z-index: 10; font-size: 12px; color: #8ef;
         background: rgba(0,0,0,.5); padding: 3px 8px; border-radius: 4px; }
  #gear { position: fixed; right: 8px; top: 34px; z-index: 10; font-size: 16px;
          background: rgba(0,0,0,.5); border-radius: 4px; padding: 2px 8px;
          cursor: pointer; color: #8ef; user-select: none; }
  #panel { position: fixed; right: 8px; top: 62px; z-index: 20; width: 240px;
           background: rgba(10,14,20,.94); border: 1px solid #234; border-radius: 8px;
           padding: 10px 12px; display: none; font-size: 12px; color: #bcd; }
  #panel label { display: flex; justify-content: space-between; align-items: center;
                 margin: 6px 0; gap: 6px; }
  #panel input[type=range] { width: 110px; }
  #panel .cams { max-height: 140px; overflow: auto; margin: 6px 0; }
  #panel .cams label { justify-content: flex-start; }
  #panel .fx label { justify-content: flex-start; }
  #panel button { margin-top: 6px; width: 100%; padding: 5px; background: #134;
                  color: #8ef; border: 1px solid #2af; border-radius: 5px; cursor: pointer; }
  #panel .st { font-size: 11px; color: #6a8; margin-top: 6px; }
  .det { position: absolute; right: 0; top: 0; padding: 2px 7px;
         background: rgba(20,60,20,.6); color: #8f8; font-size: 11px; }
  /* tap-to-fullscreen overlay — scrollable so a big frame can be panned */
  #zoom { position: fixed; inset: 0; z-index: 50; background: #000; display: none;
          overflow: auto; -webkit-overflow-scrolling: touch; }
  #zoom img { display: block; margin: 0 auto; max-width: none; }
  #zoom .cap { position: fixed; left: 0; top: 0; padding: 6px 12px; z-index: 51;
               background: rgba(0,0,0,.6); color: #8ef; font-size: 14px; }
  #zoom .x { position: fixed; right: 10px; top: 8px; z-index: 51; color: #f88;
             font-size: 22px; background: rgba(0,0,0,.6); padding: 2px 10px;
             border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>
<div id="grid"></div>
<div id="hud">cam-wall</div>
<div id="gear">⚙</div>
<div id="panel">
  <label>auto-refresh <input id="p-enabled" type="checkbox"></label>
  <label>interval <input id="p-interval" type="range" min="15" max="600" step="15"><span id="p-interval-v"></span></label>
  <label>quality <input id="p-q" type="range" min="1" max="8"><span id="p-q-v"></span></label>
  <label>thumb px <input id="p-tw" type="range" min="240" max="960" step="40"><span id="p-tw-v"></span></label>
  <div class="fx">
    <label><input id="p-fx-ts" type="checkbox"> timestamp</label>
    <label><input id="p-fx-grid" type="checkbox"> grid</label>
    <label><input id="p-fx-yolo" type="checkbox"> yolo detect</label>
    <label>classes <input id="p-fx-cls" size="12" placeholder="person,car"></label>
  </div>
  <div class="cams" id="p-cams"></div>
  <button id="p-save">apply</button>
  <div class="st" id="p-st"></div>
</div>
<div id="zoom"><div class="cap"></div><div class="x">✕</div><img alt=""></div>
<script>
  const zone = new URLSearchParams(location.search).get("zone") || "zone-a";
  const grid = document.getElementById("grid");
  const hud = document.getElementById("hud");
  const zoom = document.getElementById("zoom");
  const zoomImg = zoom.querySelector("img");
  const zoomCap = zoom.querySelector(".cap");
  const cells = new Map(); // key -> {img, age, err, ts, url}
  let order = [];          // round-robin rotation order (live cams)
  let rrIdx = 0;
  let zoomKey = null;

  function closeZoom() { zoom.style.display = "none"; zoomKey = null; }
  zoom.querySelector(".x").addEventListener("click", closeZoom);
  zoom.addEventListener("click", (e) => { if (e.target !== zoomImg) closeZoom(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeZoom(); });

  function openZoom(c, cam) {
    if (!c.url) return;
    zoomKey = cam.key;
    zoomImg.src = `${c.url}?t=${c.ts}`;
    zoomCap.textContent = cam.label;
    zoom.style.display = "block";
    zoom.scrollTo(0, 0);
  }

  async function refresh() {
    let man;
    try {
      man = await (await fetch(`data/${zone}/manifest-${zone}.json?t=${Date.now()}`, { cache: "no-store" })).json();
    } catch (e) {
      hud.textContent = `cam-wall ${zone} — no manifest`;
      return;
    }
    const live = man.cams.filter(c => c.ok).length;
    hud.textContent = live
      ? `${zone} · ${live}/${man.cams.length} live`
      : `${zone} · all ${man.cams.length} cams down — showing stale/err`;
    const now = Date.now() / 1000;
    order = [];
    for (const cam of man.cams) {
      let c = cells.get(cam.key);
      if (!c) {
        const div = document.createElement("div");
        div.className = "cell";
        div.innerHTML = `<span class="lbl">${cam.label}</span><img alt=""><span class="age"></span><div class="err" style="display:none"></div>`;
        grid.appendChild(div);
        c = { img: div.querySelector("img"), age: div.querySelector(".age"),
              err: div.querySelector(".err"), ts: 0, url: "", det: null };
        div.addEventListener("click", () => openZoom(c, cam));
        cells.set(cam.key, c);
      }
      // yolo detection badge (counts from manifest 'det')
      let db = c.det || div.querySelector(".det");
      if (!db) {
        db = document.createElement("div");
        db.className = "det"; db.style.display = "none";
        div.appendChild(db); c.det = db;
      }
      if (cam.det) {
        db.textContent = Object.entries(cam.det)
          .map(([k, n]) => `${k}×${n}`).join(" ");
        db.style.display = "block";
      } else db.style.display = "none";
      if (cam.ts && cam.ts !== c.ts) {
        c.ts = cam.ts;
        c.url = `data/${zone}/${cam.key}.jpg`;
        c.img.src = `${c.url}?t=${cam.ts}`;
        c.img.style.display = "block";
        c.err.style.display = "none";
        c.img.onload = () => { c.err.style.display = "none"; };
        if (zoomKey === cam.key) zoomImg.src = c.img.src;
      }
      if (!cam.ok && cam.err && !c.url) {
        c.err.textContent = cam.err;
        c.err.style.display = "flex";
      }
      if (c.url) order.push(c);   // only live cells join the rotation
      const age = cam.ts ? Math.round(now - cam.ts) : null;
      if (age != null) {
        c.age.textContent = age < 5 ? "live" : `${age}s ago`;
        c.age.className = "age" + (age > 180 ? " stale" : "");
      }
    }
  }

  // Round-robin live ticker: rotate the highlight through live cells once
  // a second. Image bytes only re-fetch when the manifest ts advances —
  // re-downloading the same thumb every second made cells flicker and
  // burned ~50-500KB/s of pointless decode bandwidth.
  setInterval(() => {
    if (document.visibilityState !== "visible" || !order.length) return;
    for (const c of cells.values()) c.img.parentElement.classList.remove("live-edge");
    order[rrIdx++ % order.length].img.parentElement.classList.add("live-edge");
  }, 1000);

  refresh();
  setInterval(refresh, 5000);

  // ---- settings drawer — per-zone knobs live in the relay /camwall state
  const BRIDGE = `${location.origin}/api/input-bridge`;
  const panel = document.getElementById("panel");
  const pSt = document.getElementById("p-st");
  document.getElementById("gear").addEventListener("click", () => {
    panel.style.display = panel.style.display === "block" ? "none" : "block";
    if (panel.style.display === "block") loadPanel();
  });
  const $ = id => document.getElementById(id);
  $("p-interval").oninput = e => $("p-interval-v").textContent = e.target.value + "s";
  $("p-q").oninput = e => $("p-q-v").textContent = "q" + e.target.value;
  $("p-tw").oninput = e => $("p-tw-v").textContent = e.target.value + "px";

  async function loadPanel() {
    let st;
    try { st = await (await fetch(`${BRIDGE}/camwall`)).json(); }
    catch (e) { pSt.textContent = "bridge unreachable"; return; }
    const z = (st.zones || {})[zone] || {};
    const s = z.settings || {};
    $("p-enabled").checked = !!z.enabled;
    $("p-interval").value = s.interval || 60; $("p-interval").oninput({target: $("p-interval")});
    $("p-q").value = s.jpeg_q || 4; $("p-q").oninput({target: $("p-q")});
    $("p-tw").value = s.thumb_w || 480; $("p-tw").oninput({target: $("p-tw")});
    const fx = s.effects || [];
    $("p-fx-ts").checked = fx.includes("timestamp");
    $("p-fx-grid").checked = fx.includes("grid");
    const yolo = fx.find(e => e.startsWith("yolo"));
    $("p-fx-yolo").checked = !!yolo;
    $("p-fx-cls").value = yolo && yolo.includes(":") ? yolo.split(":")[1].split("@")[0] : "person,car";
    // cam checkboxes from the current manifest
    try {
      const man = await (await fetch(`data/${zone}/manifest-${zone}.json`)).json();
      const skip = new Set(s.cams_skip || []);
      $("p-cams").innerHTML = man.cams.map(c =>
        `<label><input type="checkbox" data-k="${c.key}" ${skip.has(c.key) ? "" : "checked"}> ${c.label}</label>`
      ).join("");
    } catch (e) { $("p-cams").innerHTML = ""; }
    pSt.textContent = z.enabled ? "zone enabled" : "zone off (warm pulls still run)";
  }

  $("p-save").addEventListener("click", async () => {
    const fx = [];
    if ($("p-fx-ts").checked) fx.push("timestamp");
    if ($("p-fx-grid").checked) fx.push("grid");
    if ($("p-fx-yolo").checked) {
      const cls = $("p-fx-cls").value.trim();
      fx.push(cls ? `yolo:${cls}@0.35` : "yolo");
    }
    const skip = [...document.querySelectorAll("#p-cams input")]
      .filter(i => !i.checked).map(i => i.dataset.k);
    const body = { zone, enabled: $("p-enabled").checked, settings: {
      interval: Number($("p-interval").value),
      jpeg_q: Number($("p-q").value),
      thumb_w: Number($("p-tw").value),
      cams_skip: skip, effects: fx } };
    pSt.textContent = "saving…";
    try {
      const r = await (await fetch(`${BRIDGE}/camwall`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body) })).json();
      pSt.textContent = r.ok ? "saved — puller picks it up next cycle" :
                             "error: " + (r.error || "?");
    } catch (e) { pSt.textContent = "save failed"; }
  });
</script>
</body>
</html>
