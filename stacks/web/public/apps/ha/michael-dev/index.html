<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0, viewport-fit=cover'>
  <meta name='theme-color' content='#0e1117'>
  <title>Michael Dev</title>
  <link rel='stylesheet' href='../styles.css'>
  <style>
    .links { display: grid; grid-template-columns: 1fr; gap: 1.5rem; padding: 1.5rem; max-width: 640px; margin: 0 auto; align-content: start; min-height: 100vh; }
    .ha-button { display: flex; flex-direction: column; gap: .5rem; padding: 2rem; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; text-decoration: none; color: var(--text); text-align: center; justify-content: center; min-height: 160px; transition: border-color .15s, transform .1s; }
    .ha-button:hover { border-color: var(--accent); transform: translateY(-2px); }
    .ha-button .label { font-size: 1.4rem; font-weight: 600; color: var(--accent); }
    .ha-button .url  { font-size: .8rem; color: var(--muted); word-break: break-all; }
  </style>
</head>
<body>
  <header>
    <h1>Michael Dev</h1>
    <p>Open the dev Home Assistant UI</p>
  </header>
  <main class='links'>
    <a class='ha-button' href='https://tony-dell.taila0626a.ts.net:8124/'>
      <span class='label'>Tailnet HTTPS</span>
      <span class='url'>https://tony-dell.taila0626a.ts.net:8124</span>
    </a>
    <a class='ha-button' href='http://127.0.0.1:8124/'>
      <span class='label'>Local</span>
      <span class='url'>http://127.0.0.1:8124</span>
    </a>
  </main>
</body>
</html>
