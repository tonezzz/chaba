<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0e1117">
  <meta name="description" content="Mint a one-time pairing link / QR for an Ada HA voice assistant instance.">
  <title>Ada HA — Pair a device</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    .wrap { max-width: 720px; margin: 0 auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1.25rem; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; display: flex; flex-direction: column; gap: .75rem; }
    .card h2 { margin: 0; font-size: 1.05rem; color: var(--accent); }
    .card .sub { font-size: .8rem; color: var(--muted); word-break: break-all; }
    .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
    input[type="password"], input[type="text"] {
      flex: 1; min-width: 200px; padding: .55rem .7rem; border-radius: 6px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85rem;
    }
    button {
      padding: .55rem 1rem; border-radius: 6px; border: 1px solid var(--border);
      background: var(--panel); color: var(--text); cursor: pointer; font-size: .9rem;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #0e1117; font-weight: 600; }
    button:hover { border-color: var(--accent); }
    button.primary:hover { filter: brightness(1.1); }
    button:disabled { opacity: .5; cursor: default; }
    .status { font-size: .8rem; min-height: 1.2em; }
    .status.err { color: #f47067; }
    .status.ok { color: #3fb950; }
    .status.muted { color: var(--muted); }
    .qr-box { display: flex; flex-direction: column; align-items: center; gap: .75rem; }
    .qr-box svg { width: 220px; height: 220px; background: #fff; border-radius: 8px; padding: 8px; }
    .link-box { display: flex; gap: .5rem; width: 100%; }
    .link-box input { font-size: .75rem; }
    .expiry { font-size: .8rem; color: var(--muted); }
    .expiry.warn { color: #d29922; }
    a { color: var(--accent); }
    .hint { font-size: .8rem; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>Ada HA — Pair a device</h1>
    <p><a href="/apps/ha/">← Home Assistant</a> · one-time QR hands the instance key to the device that scans it</p>
  </header>
  <main class="wrap">
    <section class="card" id="cards"></section>
    <section class="card" id="result" hidden>
      <h2 id="result-title">Pairing link</h2>
      <div class="qr-box" id="qr-box"></div>
      <div class="link-box">
        <input type="text" id="pair-link" readonly>
        <button id="copy-btn">Copy</button>
      </div>
      <div class="expiry" id="expiry"></div>
      <div class="hint">Single use, ~10 minutes. The device that opens it stores the key and unlocks the app immediately.</div>
    </section>
    <div class="row">
      <button id="forget-btn">Forget saved keys</button>
      <span class="hint">Keys stay in this browser's localStorage only.</span>
    </div>
  </main>
  <script>
    const INSTANCES = [
      { id: "tony", title: "Ada HA Tony", base: "/apps/ada_ha_tony", desc: "Tony's home (tony-ha)" },
      { id: "michael", title: "Ada HA Michael", base: "/apps/ada_ha_michael", desc: "Michael's home (michael-ha)" },
    ];
    const keyStore = id => `ada_pair_key_${id}`;
    const cardsEl = document.querySelector("#cards");
    const resultEl = document.querySelector("#result");
    const qrBox = document.querySelector("#qr-box");
    const linkInput = document.querySelector("#pair-link");
    const expiryEl = document.querySelector("#expiry");
    const titleEl = document.querySelector("#result-title");
    let countdown = null;

    function instStatus(id) { return document.querySelector(`#status-${id}`); }

    for (const inst of INSTANCES) {
      const saved = localStorage.getItem(keyStore(inst.id)) || "";
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <h2>${inst.title}</h2>
        <div class="sub">${inst.desc} · ${inst.base}</div>
        <div class="row">
          <input type="password" id="key-${inst.id}" placeholder="Admin API key" value="">
          <button class="primary" id="go-${inst.id}">Generate QR</button>
        </div>
        <div class="status muted" id="status-${inst.id}">${saved ? "Key saved — just tap Generate QR." : "Paste the instance's API key once; it is remembered on this browser."}</div>`;
      cardsEl.appendChild(div);
      div.querySelector(`#key-${inst.id}`).value = saved;
      div.querySelector(`#go-${inst.id}`).addEventListener("click", () => mint(inst));
    }

    async function mint(inst) {
      const input = document.querySelector(`#key-${inst.id}`);
      const status = instStatus(inst.id);
      const btn = document.querySelector(`#go-${inst.id}`);
      const key = input.value.trim();
      if (!key) { status.textContent = "Enter the API key first."; status.className = "status err"; input.focus(); return; }
      btn.disabled = true;
      status.textContent = "Minting one-time link…"; status.className = "status muted";
      try {
        const resp = await fetch(`${inst.base}/api/auth/redeem-token`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Api-Key": key },
          body: JSON.stringify({ path: inst.base, qr: true, origin: location.origin }),
        });
        if (resp.status === 401) {
          localStorage.removeItem(keyStore(inst.id));
          status.textContent = "Key rejected — check and re-enter."; status.className = "status err";
          input.value = ""; input.focus();
          return;
        }
        if (!resp.ok) { status.textContent = `Mint failed: HTTP ${resp.status}`; status.className = "status err"; return; }
        const data = await resp.json();
        localStorage.setItem(keyStore(inst.id), key);
        status.textContent = "Link ready."; status.className = "status ok";
        showResult(inst, location.origin + data.redeem_url, data.qr_svg, data.expires_in);
      } catch (e) {
        status.textContent = `Mint failed: ${e.message}`; status.className = "status err";
      } finally {
        btn.disabled = false;
      }
    }

    function showResult(inst, url, svg, ttl) {
      resultEl.hidden = false;
      titleEl.textContent = `${inst.title} — scan to pair`;
      qrBox.innerHTML = svg || `<div class="hint">QR unavailable — use the link below.</div>`;
      linkInput.value = url;
      if (countdown) clearInterval(countdown);
      let left = ttl;
      const tick = () => {
        expiryEl.textContent = left > 0 ? `Expires in ${left}s (or on first use)` : "Expired — generate a new link.";
        expiryEl.className = left > 30 ? "expiry" : "expiry warn";
        left -= 1;
      };
      tick(); countdown = setInterval(tick, 1000);
      resultEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    document.querySelector("#copy-btn").addEventListener("click", async () => {
      await navigator.clipboard.writeText(linkInput.value).catch(() => linkInput.select());
      document.querySelector("#copy-btn").textContent = "Copied";
      setTimeout(() => document.querySelector("#copy-btn").textContent = "Copy", 1200);
    });

    document.querySelector("#forget-btn").addEventListener("click", () => {
      for (const inst of INSTANCES) {
        localStorage.removeItem(keyStore(inst.id));
        document.querySelector(`#key-${inst.id}`).value = "";
        const s = instStatus(inst.id);
        s.textContent = "Key cleared."; s.className = "status muted";
      }
    });
  </script>
</body>
</html>
