<!doctype html>
<html lang="en">
<head>
  <meta name="theme-color" content="#1a1a2e">
  <meta name="background-color" content="#16213e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pigeon Race">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="/apps/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apps/apple-touch-icon.png">

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pattaya International Pigeon Race</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <link rel="stylesheet" href="./pegion.css">
</head>
<body>
  <nav class="pg-topnav">
    <a href="/apps/" class="pg-topnav-link">&larr; Apps</a>
    <span class="pg-topnav-sep">|</span>
    <span class="pg-topnav-title">PIPR</span>
  </nav>

  <header id="hero" class="pg-hero">
    <h1>Pattaya International Pigeon Race</h1>
    <p>Loading…</p>
  </header>

  <main class="pg-main">
    <section class="pg-section">
      <h2 class="pg-section-title">Training &amp; Race Schedule</h2>
      <div id="schedule" class="pg-grid-schedule"></div>
    </section>

    <section class="pg-section">
      <h2 class="pg-section-title">Participants by Country</h2>
      <div id="participants" class="pg-participants"></div>
    </section>

    <section class="pg-section">
      <h2 class="pg-section-title">News</h2>
      <div id="news" class="pg-news-grid"></div>
    </section>

    <section class="pg-section">
      <h2 class="pg-section-title">Sponsors</h2>
      <div id="sponsors" class="pg-sponsors"></div>
    </section>

    <section class="pg-section">
      <h2 class="pg-section-title">Contact</h2>
      <div id="contact" class="pg-contact"></div>
    </section>

    <p class="pg-source-note">
      Content snapshot from
      <a href="https://www.pattayaoneloftrace.com/en" target="_blank" rel="noopener">pattayaoneloftrace.com/en</a>
      · for reference only
    </p>
  </main>

  <footer class="pg-footer">
    Copyright &copy; Pattaya International Pigeon Race · dashboard mirror
  </footer>

  <script src="./pegion.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/apps/sw.js', { scope: '/apps/' })
      .then((r) => console.log('SW registered', r.scope))
      .catch((e) => console.error('SW registration failed', e));
  }
</script>
</body>
</html>
