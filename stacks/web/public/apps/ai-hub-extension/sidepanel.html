<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="container">
    <h1>AI Hub</h1>
    <div class="chips" id="targetChips">
      <button class="chip active" data-value="chatgpt" type="button">ChatGPT</button>
      <button class="chip active" data-value="gemini" type="button">Gemini</button>
      <button class="chip active" data-value="gemini-images" type="button">Gemini Images</button>
      <button class="chip active" data-value="claude" type="button">Claude</button>
      <button class="chip active" data-value="midjourney" type="button">Midjourney</button>
      <button class="chip active" data-value="aistudio" type="button">AI Studio</button>
    </div>
    <div id="tabStatus" class="status">Active tab: —</div>
    <div id="bridgeStatus" class="status">Bridge: checking...</div>
    <textarea id="prompt" rows="4" placeholder="Prompt..."></textarea>
    <button id="send">Send to all</button>

    <details class="section" id="nbDetails">
      <summary><h2>NotebookLM</h2></summary>
      <div class="section-body">
        <div class="subsection">
          <h3>Auth</h3>
          <label>Bridge URL <input type="text" id="bridgeUrl" value="http://127.0.0.1:9876"></label>
          <div class="row">
            <button id="captureCookies">Capture cookies</button>
            <button id="copyCookies">Copy JSON</button>
            <button id="sendCookies">Send to bridge</button>
          </div>
          <div id="cookieStatus" class="status"></div>
        </div>

        <div class="subsection">
          <h3>REST</h3>
          <label>API key <input type="password" id="nbApiKey" placeholder="NOTEBOOKLM_REST_API_KEY"></label>
          <label>Base URL <input type="text" id="nbBaseUrl" value="https://tony-dell.taila0626a.ts.net/apps/notebooklm/api"></label>
          <label>Notebook ID <input type="text" id="nbNotebookId" placeholder="paste or select below"></label>
          <select id="notebookList"><option value="">Select notebook</option></select>
          <div class="row">
            <button id="nbListBtn">List notebooks</button>
            <button id="nbUploadBtn">Upload current page</button>
          </div>
          <div id="nbStatus" class="status"></div>
        </div>
      </div>
    </details>

    <details class="section" id="debugDetails">
      <summary><h2>Debug</h2></summary>
      <div class="section-body">
        <div class="row">
          <button id="debugCaptureBtn">Capture page + selectors</button>
          <button id="dumpPageBtn">Dump page text</button>
        </div>
        <div id="debugStatus" class="status"></div>
      </div>
    </details>

    <h2>Responses</h2>
    <div id="responses"></div>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
