<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ada Net Jam — Chaba</title>
<link rel="stylesheet" href="/apps/sw-theme.css">
<style>
  body{font-family:system-ui;background:#0b0d10;color:#e8e8e8;margin:0;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;
       gap:.9rem;padding:1rem .5rem;box-sizing:border-box}
  h1{font-size:1rem;font-weight:600;letter-spacing:.15em;opacity:.85;margin:0}
  h1 .th{font-size:.8rem;opacity:.7;letter-spacing:0}
  #pads{display:grid;grid-template-columns:repeat(4,minmax(64px,110px));
        gap:.55rem;touch-action:manipulation}
  .pad{aspect-ratio:1;border-radius:14px;border:2px solid #2a3542;
       background:#141a22;color:#cfe3ff;font-size:.8rem;font-weight:600;
       cursor:pointer;user-select:none;display:flex;flex-direction:column;
       align-items:center;justify-content:center;gap:.15rem}
  .pad .ic{font-size:1.4rem}
  .pad.hit{background:#1d3a55;border-color:#3af;transform:scale(.96)}
  #bar,#fx,#mods{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
  .btn{padding:.55rem .9rem;border-radius:10px;border:1px solid #2a3542;
       background:#141a22;color:#e8e8e8;font-size:.8rem;cursor:pointer}
  .btn.on{border-color:#5f5;background:#15251a;box-shadow:0 0 12px #5f53}
  .btn:disabled{opacity:.35;cursor:default}
  #cam{position:fixed;right:8px;bottom:8px;width:160px;border-radius:10px;
       border:1px solid #2a3542;transform:scaleX(-1);display:none}
  #matrix{font-size:.68rem;border-collapse:collapse;opacity:.9}
  #matrix td,#matrix th{border:1px solid #222c38;padding:.25rem .45rem;text-align:center}
  #matrix th{background:#141a22;font-weight:600}
  #matrix td.on{background:#1d3a55;color:#7fd4ff;cursor:pointer}
  #matrix td{cursor:pointer;color:#4a5560}
  #hud{font-size:.65rem;opacity:.5;white-space:pre-wrap;max-width:92vw;
       min-height:1.2em;text-align:center}
  details{max-width:92vw;font-size:.72rem;opacity:.8}
  details table{margin:.4rem auto}
  a{color:#7fd4ff}
</style>
</head>
<body>
<h1>ADA NET JAM <span class="th">ชบาเน็ต · nest jam</span></h1>
<div id="bar">
  <button class="btn" id="b-cam">📷 camera</button>
  <button class="btn" id="b-mic">🎤 mic</button>
  <button class="btn" id="b-share">🔗 share setup</button>
  <button class="btn" id="b-fb">💬 feedback</button>
</div>
<div id="pads"></div>
<div id="fx"></div>
<div id="mods"></div>
<video id="cam" playsinline muted></video>
<div id="hud">tap a pad — or enable camera/mic</div>
<details><summary>bindings matrix — tap a cell to rewire (events → sounds)</summary>
  <div id="matrix-wrap"></div>
</details>
<script>
  const _s = document.createElement("script");
  _s.src = "app.js?v=" + (new URLSearchParams(location.search).get("v") || Date.now());
  document.body.appendChild(_s);
</script>
</body>
</html>
