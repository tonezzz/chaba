<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RView Control</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 1rem; background: #0b0b0b; color: #e5e5e5; font-family: system-ui, -apple-system, sans-serif; overflow: auto; }
    .panel { max-width: 42rem; margin: 0 auto; background: #1a1a1a; border-radius: 0.75rem; padding: 1rem; }
    h1, h2 { margin-top: 0; }
    .row { display: flex; gap: 0.5rem; margin: 0.5rem 0; flex-wrap: wrap; align-items: center; }
    input, select, button { padding: 0.5rem; border-radius: 0.25rem; border: 1px solid #333; background: #0b0b0b; color: #e5e5e5; }
    input, select { flex: 1; min-width: 8rem; }
    button { background: #2563eb; border: none; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    button.secondary { background: #334155; }
    button.danger { background: #7f1d1d; }
    .view-list { display: grid; gap: 0.5rem; margin: 1rem 0; }
    .view-card { padding: 0.75rem; border: 1px solid #333; border-radius: 0.5rem; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .queue { list-style: none; padding: 0; margin: 0; }
    .queue li { padding: 0.5rem 0; border-bottom: 1px solid #333; display: flex; justify-content: space-between; gap: 0.5rem; }
    .status { color: #a1a1a1; font-size: 0.875rem; margin: 0.5rem 0; }
    label { display: inline-flex; align-items: center; gap: 0.25rem; }
    hr { border: 0; border-top: 1px solid #333; margin: 1rem 0; }
    a { color: #60a5fa; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>RView Control</h1>
    <p class="status"><a href="index.html">Back to viewer</a></p>
    <div class="row">
      <input id="new-view-id" type="text" placeholder="new view id">
      <input id="new-view-name" type="text" placeholder="display name">
      <button id="btn-create">Create View</button>
    </div>
    <div id="view-list" class="view-list"></div>
    <hr>
    <h2>Selected: <span id="sel-id">none</span></h2>
    <div class="row">
      <input id="media-url" type="text" placeholder="https://...">
      <input id="media-title" type="text" placeholder="title (optional)">
      <select id="media-type">
        <option value="auto">auto</option>
        <option value="image">image</option>
        <option value="video">video</option>
        <option value="audio">audio</option>
        <option value="iframe">iframe</option>
        <option value="pdf">pdf</option>
      </select>
      <button id="btn-set">Set</button>
      <button id="btn-enqueue" class="secondary">Enqueue</button>
    </div>
    <div class="row">
      <button id="btn-play">Play</button>
      <button id="btn-pause">Pause</button>
      <button id="btn-stop">Stop</button>
      <button id="btn-next" class="secondary">Next</button>
      <button id="btn-prev" class="secondary">Prev</button>
      <button id="btn-clear" class="danger">Clear Queue</button>
    </div>
    <div class="row">
      <input id="seek-val" type="number" step="1" placeholder="seek (s)">
      <button id="btn-seek">Seek</button>
      <input id="vol-val" type="number" step="0.1" min="0" max="1" placeholder="volume (0-1)">
      <button id="btn-vol">Volume</button>
    </div>
    <div class="row">
      <label><input id="chk-full" type="checkbox"> Fullscreen</label>
      <label><input id="chk-loop" type="checkbox"> Loop</label>
      <label><input id="chk-shuffle" type="checkbox"> Shuffle</label>
    </div>
    <div id="status" class="status"></div>
    <ul id="queue" class="queue"></ul>
    <hr>
    <h2>Viewer QR</h2>
    <p id="qr-hint" class="status">Select a view to generate a QR code for that view.</p>
    <div class="row">
      <img id="qr" style="width:200px;height:200px;object-fit:contain;background:#fff;border-radius:0.5rem;display:none;" alt="QR code">
    </div>
    <div class="row">
      <a id="qr-url" target="_blank" style="word-break:break-all;"></a>
    </div>
  </div>
  <script src="control.js"></script>
</body>
</html>
