<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dot Wave — WebGL</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    canvas { display: block; width: 100vw; height: 100vh; }
    #fallback {
      color: #fff;
      font-family: sans-serif;
      padding: 20px;
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="dotWave"></canvas>
  <div id="fallback">WebGL is not available in this browser.</div>
  <script>
    const canvas = document.getElementById('dotWave');
    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

    if (!gl) {
      document.getElementById('fallback').style.display = 'block';
      return;
    }

    const vsSource = `
      attribute vec2 a_ij;
      attribute float a_color;

      uniform vec2 u_resolution;
      uniform float u_time;
      uniform float u_dx;
      uniform float u_dy;
      uniform float u_yFactor;
      uniform float u_iFactor;
      uniform float u_jFactor;
      uniform float u_waveAmp;
      uniform float u_sizeBase;
      uniform float u_sizeAmp;
      uniform float u_dpr;

      varying float v_alpha;
      varying float v_color;

      void main() {
        float i = a_ij.x;
        float j = a_ij.y;

        float y = j * u_dy;
        float x = i * u_dx + u_waveAmp * sin((j * u_yFactor + u_time * 0.4));

        float phase = i * u_iFactor + j * u_jFactor + u_time;
        float s = sin(phase);

        float r = u_sizeBase + u_sizeAmp * s;
        float alpha = 0.35 + 0.65 * max(0.0, s);

        gl_Position = vec4(
          (x / u_resolution.x) * 2.0 - 1.0,
          1.0 - (y / u_resolution.y) * 2.0,
          0.0,
          1.0
        );

        gl_PointSize = max(1.0, r * 2.0 * u_dpr);
        v_alpha = alpha;
        v_color = a_color;
      }
    `;

    const fsSource = `
      precision mediump float;
      varying float v_alpha;
      varying float v_color;

      void main() {
        vec2 coord = gl_PointCoord - vec2(0.5);
        if (length(coord) > 0.5) discard;

        vec3 c;
        if (v_color < 0.5)      c = vec3(1.0, 0.12, 0.12);   // red
        else if (v_color < 1.5) c = vec3(0.12, 1.0, 0.12);   // green
        else                    c = vec3(0.12, 0.31, 1.0);   // blue

        gl_FragColor = vec4(c * v_alpha, v_alpha);
      }
    `;

    function createShader(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(shader));
        gl.deleteShader(shader);
        return null;
      }
      return shader;
    }

    function createProgram(vs, fs) {
      const program = gl.createProgram();
      gl.attachShader(program, vs);
      gl.attachShader(program, fs);
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        console.error(gl.getProgramInfoLog(program));
        gl.deleteProgram(program);
        return null;
      }
      return program;
    }

    const vs = createShader(gl.VERTEX_SHADER, vsSource);
    const fs = createShader(gl.FRAGMENT_SHADER, fsSource);
    const program = createProgram(vs, fs);

    const aIjLoc = gl.getAttribLocation(program, 'a_ij');
    const aColorLoc = gl.getAttribLocation(program, 'a_color');

    const uResolution = gl.getUniformLocation(program, 'u_resolution');
    const uTime = gl.getUniformLocation(program, 'u_time');
    const uDx = gl.getUniformLocation(program, 'u_dx');
    const uDy = gl.getUniformLocation(program, 'u_dy');
    const uYFactor = gl.getUniformLocation(program, 'u_yFactor');
    const uIFactor = gl.getUniformLocation(program, 'u_iFactor');
    const uJFactor = gl.getUniformLocation(program, 'u_jFactor');
    const uWaveAmp = gl.getUniformLocation(program, 'u_waveAmp');
    const uSizeBase = gl.getUniformLocation(program, 'u_sizeBase');
    const uSizeAmp = gl.getUniformLocation(program, 'u_sizeAmp');
    const uDpr = gl.getUniformLocation(program, 'u_dpr');

    const dx = 10;
    const dy = 10;
    const amplitude = 24;
    const yPeriod = 96;
    const sizeBase = 1.6;
    const sizeAmp = 2.6;
    const iFactor = 0.55;
    const jFactor = 0.25;

    let dotCount = 0;
    let aIjBuffer = gl.createBuffer();
    let aColorBuffer = gl.createBuffer();

    function buildDots() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.floor(canvas.clientWidth * dpr);
      canvas.height = Math.floor(canvas.clientHeight * dpr);
      gl.viewport(0, 0, canvas.width, canvas.height);

      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      const xCount = Math.ceil(width / dx) + 6;
      const yCount = Math.ceil(height / dy) + 6;

      dotCount = xCount * yCount;
      const ij = new Float32Array(dotCount * 2);
      const colors = new Float32Array(dotCount);

      let k = 0;
      for (let j = -3; j < yCount; j++) {
        for (let i = -3; i < xCount; i++) {
          ij[k * 2] = i;
          ij[k * 2 + 1] = j;
          colors[k] = ((i % 3) + 3) % 3;
          k++;
        }
      }

      gl.bindBuffer(gl.ARRAY_BUFFER, aIjBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, ij, gl.STATIC_DRAW);

      gl.bindBuffer(gl.ARRAY_BUFFER, aColorBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, colors, gl.STATIC_DRAW);
    }

    function resize() {
      buildDots();
    }

    window.addEventListener('resize', resize);
    buildDots();

    gl.useProgram(program);
    gl.uniform2f(uResolution, canvas.clientWidth, canvas.clientHeight);
    gl.uniform1f(uDx, dx);
    gl.uniform1f(uDy, dy);
    gl.uniform1f(uYFactor, dy / yPeriod);
    gl.uniform1f(uIFactor, iFactor);
    gl.uniform1f(uJFactor, jFactor);
    gl.uniform1f(uWaveAmp, amplitude);
    gl.uniform1f(uSizeBase, sizeBase);
    gl.uniform1f(uSizeAmp, sizeAmp);
    gl.uniform1f(uDpr, window.devicePixelRatio || 1);

    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.disable(gl.DEPTH_TEST);

    let time = 0;

    function draw() {
      gl.clearColor(0.0, 0.0, 0.0, 1.0);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.uniform2f(uResolution, canvas.clientWidth, canvas.clientHeight);
      gl.uniform1f(uTime, time);
      gl.uniform1f(uDpr, window.devicePixelRatio || 1);

      gl.bindBuffer(gl.ARRAY_BUFFER, aIjBuffer);
      gl.enableVertexAttribArray(aIjLoc);
      gl.vertexAttribPointer(aIjLoc, 2, gl.FLOAT, false, 0, 0);

      gl.bindBuffer(gl.ARRAY_BUFFER, aColorBuffer);
      gl.enableVertexAttribArray(aColorLoc);
      gl.vertexAttribPointer(aColorLoc, 1, gl.FLOAT, false, 0, 0);

      gl.drawArrays(gl.POINTS, 0, dotCount);

      time += 0.025;
      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
