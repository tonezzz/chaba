<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dot Wave — DOM+CSS</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    .dot {
      position: absolute;
      top: 0;
      left: 0;
      width: 6px;
      height: 6px;
      margin-left: -3px;
      margin-top: -3px;
      border-radius: 50%;
      background-color: var(--c);
      opacity: var(--a);
      mix-blend-mode: screen;
      transform: translate3d(var(--x), var(--y), 0) scale(var(--s));
      transform-origin: center;
      will-change: transform, opacity;
      pointer-events: none;
    }
    .c0 { --c: #ff1e1e; }
    .c1 { --c: #1eff1e; }
    .c2 { --c: #1e50ff; }
  </style>
</head>
<body>
<script>
  const width = window.innerWidth;
  const height = window.innerHeight;
  const dx = 20;
  const dy = 20;
  const amplitude = 24;
  const yPeriod = 96;
  const sizeBase = 1.6;
  const sizeAmp = 2.6;
  const xCount = Math.ceil(width / dx) + 6;
  const yCount = Math.ceil(height / dy) + 6;

  const dots = [];
  const fragment = document.createDocumentFragment();

  for (let j = -3; j < yCount; j++) {
    for (let i = -3; i < xCount; i++) {
      const el = document.createElement('div');
      el.className = `dot c${((i % 3) + 3) % 3}`;
      dots.push({ el, i, j });
      fragment.appendChild(el);
    }
  }
  document.body.appendChild(fragment);

  let time = 0;

  function draw() {
    for (const { el, i, j } of dots) {
      const y0 = j * dy;
      const waveX = amplitude * Math.sin((y0 / yPeriod) + time * 0.4);
      const x0 = i * dx + waveX;
      const phase = (i * 0.55 + j * 0.25) + time;
      const r = sizeBase + sizeAmp * Math.sin(phase);
      const s = Math.max(0.2, r / 3);
      const a = 0.35 + 0.65 * Math.max(0, Math.sin(phase));

      el.style.cssText = `--x:${x0.toFixed(2)}px;--y:${y0.toFixed(2)}px;--s:${s.toFixed(3)};--a:${a.toFixed(3)};`;
    }
    time += 0.025;
    requestAnimationFrame(draw);
  }

  draw();
</script>
</body>
</html>
