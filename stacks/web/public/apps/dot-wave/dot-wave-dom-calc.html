<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dot Wave — DOM+CSS+calc()</title>
  <style>
    :root {
      --dx: 20px;
      --dy: 20px;
      --d: 6px;
      --sizeBase: 0.5333;
      --sizeAmp: 0.8667;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    .dot {
      position: absolute;
      top: 0;
      left: 0;
      width: var(--d);
      height: var(--d);
      margin-left: calc(var(--d) / -2);
      margin-top: calc(var(--d) / -2);
      border-radius: 50%;
      background-color: var(--c);
      opacity: calc(0.35 + 0.65 * max(0, var(--phaseSin)));
      mix-blend-mode: screen;
      transform: translate3d(
        calc(var(--col) * var(--dx) + var(--wave)),
        calc(var(--row) * var(--dy)),
        0px
      ) scale(calc(max(0.2, var(--sizeBase) + var(--sizeAmp) * var(--phaseSin))));
      transform-origin: center;
      will-change: transform, opacity;
      pointer-events: none;
    }
    .c0 { --c: #ff1e1e; }
    .c1 { --c: #1eff1e; }
    .c2 { --c: #1e50ff; }
  </style>
</head>
<body>
<script>
  const width = window.innerWidth;
  const height = window.innerHeight;
  const dx = 20;
  const dy = 20;
  const amplitude = 24;
  const yPeriod = 96;
  const xCount = Math.ceil(width / dx) + 6;
  const yCount = Math.ceil(height / dy) + 6;

  const dots = [];
  const fragment = document.createDocumentFragment();

  for (let j = -3; j < yCount; j++) {
    for (let i = -3; i < xCount; i++) {
      const el = document.createElement('div');
      el.className = `dot c${((i % 3) + 3) % 3}`;
      el.style.setProperty('--col', i);
      el.style.setProperty('--row', j);
      dots.push({ el, i, j });
      fragment.appendChild(el);
    }
  }
  document.body.appendChild(fragment);

  let time = 0;

  function draw() {
    for (const { el, i, j } of dots) {
      const wave = amplitude * Math.sin((j * dy / yPeriod) + time * 0.4);
      const phase = (i * 0.55 + j * 0.25) + time;
      const phaseSin = Math.sin(phase);

      el.style.setProperty('--wave', wave.toFixed(2) + 'px');
      el.style.setProperty('--phaseSin', phaseSin.toFixed(4));
    }
    time += 0.025;
    requestAnimationFrame(draw);
  }

  draw();
</script>
</body>
</html>
