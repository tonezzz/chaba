<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="background-color" content="#16213e">
  <meta name="apple-mobile-web-app-capable" content="no">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GEV Gemini Live">
  <meta name="description" content="Gemini Live voice bridge for God’s Eye View">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="/apps/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apps/apple-touch-icon.png">
  <title>GEV Gemini Live</title>
  <style>
    * { box-sizing: border-box; }
    body { background: #0f1a2e; color: #e0e6ed; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 1rem; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    #wrap { width: 100%; max-width: 420px; text-align: center; }
    h1 { margin-bottom: 0.5rem; font-size: 1.2rem; color: #7fb3ff; }
    #statusMsg { display: none; padding: 0.8rem; border-radius: 8px; margin: 0.8rem 0; font-size: 0.9rem; text-align: left; }
    #statusMsg.info { background: #16213e; color: #7fb3ff; border: 1px solid #1f2937; }
    #statusMsg.warn { background: #3d2c00; color: #ffd166; border: 1px solid #665200; }
    #statusMsg.error { background: #3a0f0f; color: #ff8a8a; border: 1px solid #5c1a1a; }
    #ptt { width: 120px; height: 120px; border-radius: 50%; border: none; background: linear-gradient(145deg, #1c3a6e, #15294f); color: #fff; font-size: 1.1rem; box-shadow: 0 4px 15px rgba(0,0,0,0.4); margin: 1.5rem 0; touch-action: none; user-select: none; -webkit-user-select: none; }
    #ptt:disabled { background: #555; }
    #ptt.recording { background: linear-gradient(145deg, #c0392b, #962d22); }
    #text { padding: 0.8rem; background: #16213e; border-radius: 8px; margin-top: 0.8rem; white-space: pre-wrap; word-wrap: break-word; min-height: 3rem; font-size: 1.1rem; }
    #log { margin-top: 1rem; padding: 0.5rem; background: #0b1322; border-radius: 6px; font-size: 0.75rem; color: #8a9bb8; max-height: 10rem; overflow-y: auto; text-align: left; white-space: pre-wrap; }
    #home { display: inline-block; margin-top: 1rem; color: #7fb3ff; text-decoration: none; }
  </style>
</head>
<body>
  <div id="wrap">
    <h1>GEV Gemini Live</h1>
    <div id="statusMsg" class="info"></div>
    <button id="ptt" disabled>Hold to talk</button>
    <div id="text"></div>
    <div id="log"></div>
    <a id="home" href="/apps/">&larr; Apps</a>
  </div>
  <script>
    const ptt = document.getElementById('ptt');
    const textDiv = document.getElementById('text');
    const logDiv = document.getElementById('log');
    const statusMsg = document.getElementById('statusMsg');
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const WS_URL = protocol + '//' + location.host + '/apps/gev-live/ws';

    let ws = null;
    let micStream = null;
    let micCtx = null;
    let processor = null;
    let recordedChunks = [];
    let isRecording = false;
    let isInitializing = false;

    function log(m) { logDiv.textContent += m + '\n'; logDiv.scrollTop = logDiv.scrollHeight; console.log(m); }
    function showMsg(text, type) {
      statusMsg.textContent = text;
      statusMsg.className = type || 'info';
      statusMsg.style.display = 'block';
    }

    function ensureWs() {
      if (ws && ws.readyState === WebSocket.OPEN) return;
      ws = new WebSocket(WS_URL);
      ws.binaryType = 'arraybuffer';
      ws.onopen = () => { log('WebSocket open'); ptt.disabled = false; };
      ws.onclose = () => { log('WebSocket closed'); ws = null; ptt.disabled = true; };
      ws.onerror = (e) => log('WebSocket error');
      ws.onmessage = async (e) => {
        try {
          const obj = JSON.parse(e.data);
          if (obj.type === 'text') textDiv.textContent = obj.text;
          else if (obj.type === 'done') log('Done');
          else if (obj.type === 'status') log('Status: ' + obj.message);
          else if (obj.type === 'error') { log('Error: ' + obj.message); showMsg('Server error: ' + obj.message, 'error'); }
          else if (obj.type === 'function_call') log('Function call: ' + obj.name + ' ' + JSON.stringify(obj.args));
        } catch (_) { log(e.data); }
      };
    }

    function floatToInt16(input) {
      const out = new Int16Array(input.length);
      for (let i = 0; i < input.length; i++) {
        const s = Math.max(-1, Math.min(1, input[i]));
        out[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
      }
      return out;
    }

    function resampleFloat32(input, srcRate, dstRate) {
      if (srcRate === dstRate) return input;
      const ratio = dstRate / srcRate;
      const outLen = Math.floor(input.length * ratio);
      const out = new Float32Array(outLen);
      for (let i = 0; i < outLen; i++) {
        const src = i / ratio;
        const i0 = Math.floor(src);
        const i1 = Math.min(i0 + 1, input.length - 1);
        const frac = src - i0;
        out[i] = input[i0] * (1 - frac) + input[i1] * frac;
      }
      return out;
    }

    async function startRecording() {
      if (isInitializing) return;
      isInitializing = true;
      ptt.disabled = true;
      ptt.textContent = 'Starting mic...';
      showMsg('Initializing microphone...', 'info');
      ensureWs();
      recordedChunks = [];
      try {
        const ok = await initMic();
        if (!ok) {
          showMsg('Microphone unavailable. On iOS use Safari and allow microphone access.', 'error');
          return;
        }
        if (micCtx.state === 'suspended') await micCtx.resume();
        isRecording = true;
        ptt.classList.add('recording');
        ptt.textContent = 'Release to send';
        showMsg('Recording... release to send', 'info');
      } finally {
        isInitializing = false;
        if (!isRecording) ptt.disabled = false;
      }
    }

    async function stopRecording() {
      if (isInitializing) {
        // wait briefly for initMic to complete before sending
        await new Promise(r => setTimeout(r, 400));
      }
      isRecording = false;
      ptt.classList.remove('recording');
      ptt.textContent = 'Hold to talk';
      if (!micCtx) {
        ptt.disabled = false;
        return;
      }
      await new Promise(r => setTimeout(r, 250));
      sendRecording();
      ptt.disabled = false;
    }

    async function initMic() {
      if (micCtx) return true;
      try {
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            sampleRate: { ideal: 16000 },
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        });
        try {
          micCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        } catch (e) {
          log('AudioContext 16k failed, using device default: ' + e.message);
          micCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        const src = micCtx.createMediaStreamSource(micStream);
        const gain = micCtx.createGain();
        gain.gain.value = 0;
        processor = micCtx.createScriptProcessor(4096, 1, 1);
        processor.onaudioprocess = (ev) => {
          if (isRecording) {
            recordedChunks.push(new Float32Array(ev.inputBuffer.getChannelData(0)));
          }
        };
        src.connect(gain);
        gain.connect(processor);
        processor.connect(micCtx.destination);
        log('Mic ready at ' + micCtx.sampleRate + ' Hz');
        return true;
      } catch (e) {
        log('mic: ' + e);
        showMsg('Microphone error: ' + e.message, 'error');
        return false;
      }
    }

    function sendRecording() {
      if (!micCtx || !recordedChunks.length) return;
      const n = recordedChunks.reduce((a, b) => a + b.length, 0);
      const all = new Float32Array(n);
      let o = 0;
      for (const c of recordedChunks) { all.set(c, o); o += c.length; }
      const resampled = resampleFloat32(all, micCtx.sampleRate, 16000);
      const pcm = floatToInt16(resampled);
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(pcm.buffer);
        ws.send(JSON.stringify({"type": "end"}));
        log('Sent audio: ' + pcm.length + ' samples at 16k');
        showMsg('Processing...', 'info');
      }
    }

    // iOS PWA limitation: getUserMedia may not work in standalone home-screen apps.
    if (navigator.standalone) {
      showMsg('Running as a home-screen web app. On iOS, microphone access may be restricted. If voice does not work, open this URL directly in Safari.', 'warn');
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showMsg('Microphone API not available in this browser view. Please open this page in Safari on iOS.', 'error');
    }

    ptt.addEventListener('pointerdown', startRecording);
    ptt.addEventListener('pointerup', stopRecording);
    ptt.addEventListener('pointerleave', stopRecording);
    ensureWs();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/apps/sw.js', { scope: '/apps/' })
        .then((r) => console.log('SW registered', r.scope))
        .catch((e) => console.error('SW registration failed', e));
    }
  </script>
</body>
</html>
