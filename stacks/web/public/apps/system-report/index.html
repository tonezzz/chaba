<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chaba System Report</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --border: #334155; --text: #e2e8f0;
            --muted: #94a3b8; --ok: #22c55e; --warn: #facc15; --fail: #ef4444; --link: #60a5fa; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text);
           margin: 0; padding: 0 0 2rem; }
    .topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center;
              gap: 0.9rem; padding: 0.8rem 1.5rem; background: var(--bg);
              border-bottom: 1px solid var(--border); }
    .topbar h1 { flex: 0 0 auto; margin: 0; font-size: 1.15rem; }
    #freshness { font-size: 0.8rem; padding: 0.15rem 0.6rem; border-radius: 1rem;
                 border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
    #freshness.ok { color: var(--ok); border-color: var(--ok); }
    #freshness.warn { color: var(--warn); border-color: var(--warn); }
    #freshness.fail { color: var(--fail); border-color: var(--fail); }
    .topbar .spacer { flex: 1; }
    #refresh-status { color: var(--muted); font-size: 0.8rem; }
    #refresh { background: var(--card); color: var(--text); border: 1px solid var(--border);
               border-radius: 0.5rem; padding: 0.45rem 1rem; font-size: 0.85rem; cursor: pointer; }
    #refresh:hover:not(:disabled) { border-color: var(--link); }
    #refresh:disabled { opacity: 0.5; cursor: default; }
    .wrap { padding: 0 1.5rem; max-width: 1400px; }
    .meta { color: var(--muted); font-size: 0.8rem; margin: 0.8rem 0 0.4rem; }
    .summary { display: flex; gap: 0.7rem; flex-wrap: wrap; margin: 0.8rem 0; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 0.5rem;
            padding: 0.7rem 1rem; min-width: 92px; cursor: pointer; user-select: none;
            transition: border-color .15s, transform .1s; }
    .card:hover { border-color: var(--link); }
    .card.active { border-color: var(--link); box-shadow: 0 0 0 1px var(--link) inset; }
    .card .value { font-size: 1.4rem; font-weight: bold; }
    .card .label { color: var(--muted); font-size: 0.78rem; }
    .ok { color: var(--ok); } .warn { color: var(--warn); } .fail { color: var(--fail); }
    .muted { color: var(--muted); }
    .pill { display: inline-block; padding: 0.05rem 0.5rem; border-radius: 1rem;
            font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
    .pill.ok { background: #14532d; color: #86efac; }
    .pill.warn, .pill.delta { background: #422006; color: #fde047; }
    .pill.stale, .pill.unreachable { background: #431407; color: #fdba74; }
    .pill.error, .pill.missing { background: #450a0a; color: #fca5a5; }
    .pill.planned, .pill.untracked, .pill.remote { background: #1e293b; color: #94a3b8; }
    .toolbar { display: flex; gap: 0.7rem; align-items: center; margin: 0.6rem 0 0.4rem; flex-wrap: wrap; }
    .toolbar input[type="search"] { background: var(--card); border: 1px solid var(--border);
      color: var(--text); border-radius: 0.5rem; padding: 0.4rem 0.8rem; font-size: 0.85rem; width: 240px; }
    .toolbar input[type="search"]:focus { outline: none; border-color: var(--link); }
    .toolbar .hint { color: var(--muted); font-size: 0.78rem; }
    table.nodes { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    table.nodes th { position: sticky; top: 3.6rem; background: var(--bg); color: var(--muted);
      text-align: left; padding: 0.45rem 0.6rem; border-bottom: 1px solid var(--border);
      font-weight: 600; cursor: pointer; user-select: none; white-space: nowrap; }
    table.nodes th:hover { color: var(--text); }
    table.nodes td { padding: 0.4rem 0.6rem; border-bottom: 1px solid #1e293b;
      vertical-align: top; }
    table.nodes tr:hover td { background: #17203a; }
    td.node-id { font-family: ui-monospace, monospace; font-size: 0.8rem; }
    td.age { font-family: ui-monospace, monospace; white-space: nowrap; }
    td.age.old { color: var(--fail); }
    td.age.mid { color: var(--warn); }
    td.summary { color: var(--muted); font-size: 0.8rem; }
    details { margin-top: 1.4rem; }
    details > summary { cursor: pointer; color: var(--muted); font-size: 0.85rem;
      padding: 0.4rem 0; user-select: none; }
    details > summary:hover { color: var(--text); }
    details > summary::marker { color: var(--border); }
    #report { background: var(--card); border-radius: 0.5rem; padding: 1.2rem 1.5rem; margin-top: 0.6rem; }
    #report table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.84rem; }
    #report th, #report td { text-align: left; padding: 0.35rem 0.6rem; border-bottom: 1px solid var(--border); }
    #report th { color: var(--muted); font-weight: 600; position: sticky; top: 3.6rem; background: var(--card); }
    #report tr:hover td { background: #17203a; }
    #report code { background: #020617; padding: 0.15rem 0.35rem; border-radius: 0.25rem; font-size: 0.78rem; }
    #report h1 { font-size: 1.2rem; } #report h2 { font-size: 1.05rem; border-bottom: 1px solid var(--border);
      padding-bottom: 0.3rem; margin-top: 1.6rem; } #report h3 { font-size: 0.95rem; }
    #report pre { white-space: pre-wrap; background: #020617; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; }
    .err-text { color: var(--fail); }
    a { color: var(--link); }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
</head>
<body>
  <div class="topbar">
    <h1>Chaba System Report</h1>
    <span id="freshness" title="Age of the generated report data">…</span>
    <span class="spacer"></span>
    <span id="refresh-status"></span>
    <button id="refresh" type="button">Refresh now</button>
  </div>
  <div class="wrap">
    <div class="meta" id="meta">Loading…</div>
    <div class="summary" id="summary"></div>
    <div class="toolbar">
      <input type="search" id="filter" placeholder="Filter nodes… (id, summary, status)" />
      <span class="hint" id="shown-hint"></span>
    </div>
    <table class="nodes">
      <thead><tr>
        <th data-k="status">Status</th><th data-k="id">Node</th><th data-k="layer">Layer</th>
        <th data-k="last_run">Last run</th><th data-k="age">Age</th><th data-k="summary">Summary</th>
      </tr></thead>
      <tbody id="nodes"></tbody>
    </table>
    <details id="report-wrap"><summary>Full report (SYSTEM-REPORT.md)</summary>
      <div id="report"></div>
    </details>
  </div>
  <script src="app.js?v=7"></script>
</body>
</html>
