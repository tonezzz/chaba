title: TradeCanvas UI Configuration
subtitle: TradeCanvas UI pages, symbols, timeframes, and data source configuration
icon: 🎨

sections:
  - title: Pages
    icon: 📄
    items: pages
  - title: Navigation
    icon: 🔗
    items: navigation
  - title: Chart Settings
    icon: 📈
    items: chart_settings
  - title: Strategy Panel
    icon: 🎯
    items: strategy_panel
  - title: Data Policy
    icon: 📊
    items: data_policy
  - title: API Configuration
    icon: 🔌
    items: api
  - title: Recent Changes
    icon: 📝
    items: recent_changes

pages:
  index:
    title: "TradeCanvas - Trading Dashboard"
    symbol: "THB"
    show_chart: true
    show_indicators: true
    show_volume: true
    show_controls: true
    data_source: "api"  # api, csv, or auto
    api_endpoint: "/apps/trade/api/ui/chart-data"
    
navigation:
  - title: "Trading Dashboard"
    url: "index.html"
    active: true
  - title: "Compare"
    url: "compare.html"
    active: false

chart_settings:
  default_timeframe: "1Y"
  available_timeframes:
    - "1D"
    - "1W"
    - "1M"
    - "3M"
    - "6M"
    - "1Y"
    - "2Y"
  
  default_symbol: "THB"
  available_symbols:
    - value: "THB"
      label: "USD/THB"
    - value: "EUR"
      label: "EUR/USD"
    - value: "GBP"
      label: "GBP/USD"
    - value: "JPY"
      label: "USD/JPY"
    - value: "DXY"
      label: "DXY"
    - value: "OIL"
      label: "OIL"

colors:
  up: "#238636"
  down: "#da3633"
  background: "#21262d"
  grid: "#30363d"
  text: "#e6edf3"
  accent: "#58a6ff"

strategy_panel:
  title: "Strategy Control & Results"
  position: "side-panel"
  default_enabled: true
  strategies:
    sma_crossover:
      label: "SMA Crossover"
      enabled: false
      parameters:
        short_period: 20
        long_period: 50
    ema_crossover:
      label: "EMA Crossover"
      enabled: false
      parameters:
        short_period: 12
        long_period: 26
    rsi_reversal:
      label: "RSI Reversal"
      enabled: false
      parameters:
        period: 14
        oversold: 30
        overbought: 70
    macd_crossover:
      label: "MACD Crossover"
      enabled: false
      parameters:
        fast: 12
        slow: 26
        signal: 9
    bollinger_reversion:
      label: "Bollinger Reversion"
      enabled: false
      parameters:
        period: 20
        std_dev: 2.0
    hindsight_01:
      label: "Hindsight-01"
      enabled: true
      parameters:
        buy_points: []
        sell_points: []
        auto_detect: true
        min_change_pct: 0.01
      description: "Peak/valley detection with complete future knowledge - finds ALL local minima/maxima where price moves >1% in the future. Captures every meaningful reversal regardless of time window. Uses 5-day lookback/lookforward for local extremum detection, then validates with complete future knowledge."
    hindsight_02:
      label: "Hindsight-02"
      enabled: false
      parameters:
        buy_points: []
        sell_points: []
        auto_detect: true
      description: "100% win rate strategy using true hindsight - sensitive day-by-day trend detection: compares consecutive days to identify trend reversals (down→up = buy at lowest, up→down = sell at highest), captures more trading opportunities with higher sensitivity. Auto-detects on every run."
  execution:
    initial_capital: 10000
    commission: 0.001
    slippage: 0.0001
    stop_loss:
      enabled: true
      type: "percentage"
      value: 0.05
    take_profit:
      enabled: true
      type: "percentage"
      value: 0.10
    position_sizing:
      method: "percentage"
      value: 0.1
  metrics:
    - "total_return"
    - "total_trades"
    - "win_rate"
    - "profit_factor"
    - "max_drawdown"
    - "avg_win"
    - "avg_loss"
    - "final_capital"
  display:
    show_chart_markers: true
    show_equity_curve: false

# Data source configuration
data_policy:
  primary_source: "api"  # API is primary data source
  fallback_source: "csv"  # CSV is fallback only
  estimation_policy: "none"  # No estimated values - only real OHLC data shown
  ohlc_requirement: "strict"  # Only include records with complete OHLC data in charts
  gap_handling: "skip"  # Skip records without proper OHLC data rather than estimate
  
# API configuration
api:
  base_url: "http://100.75.102.88:9000"
  chart_endpoint: "/api/ui/chart-data/{symbol}?timeframe={timeframe}"
  available_symbols:
    currencies: ["THB", "EUR", "GBP", "JPY", "CAD", "CHF", "AUD", "NZD"]
    commodities: ["GOLD", "SILVER", "OIL", "WTI", "BRENT", "COPPER", "NATURAL_GAS"]
    indices: ["DXY"]
  supported_timeframes: ["1D", "1W", "1M", "3M", "6M", "1Y", "all"]
  
# Recent changes
recent_changes:
  - date: 2026-08-14
    description: "Implemented API-first data loading, OHLC filtering to prevent estimated values, Tailscale network configuration for cross-machine access"
    impact: "UI now loads from API/database, only real OHLC data shown, charts skip records without proper OHLC"
  - date: 2026-08-13
    description: "Initial API chart-data endpoint configuration"
    impact: "UI can now fetch data from API instead of static CSV files"
