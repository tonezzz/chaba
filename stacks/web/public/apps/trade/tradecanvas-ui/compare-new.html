<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeCanvas - Compare</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Navigation Menu -->
        <nav class="nav-menu">
            <ul class="nav-list">
                <li class="nav-item"><a href="index.html" class="nav-link">Trading Dashboard</a></li>
                <li class="nav-item"><a href="compare.html" class="nav-link active">Compare</a></li>
                <li class="nav-item"><a href="compare2.html?v=11" class="nav-link">Compare2</a></li>
            </ul>
        </nav>

        <header class="header">
            <h1>TradeCanvas - Compare</h1>
            <div class="header-controls">
                <span>USD/THB</span>
            </div>
        </header>

        <div class="main-content">
            <div class="chart-section">
                <div class="chart-header">
                    <h2>USD/THB - 1 Year</h2>
                    <div class="chart-info">
                        <span id="current-price">--</span>
                        <span id="price-change">--</span>
                        <span id="connection-status" class="status disconnected">Disconnected</span>
                    </div>
                </div>
                <div id="main-chart" class="chart-container"></div>

            </div>

            <div class="side-panel">
                <div class="panel-section">
                    <h3>Market Summary</h3>
                    <div class="summary-stats">
                        <div class="stat-row">
                            <span class="stat-label">Open:</span>
                            <span class="stat-value" id="stat-open">--</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">High:</span>
                            <span class="stat-value" id="stat-high">--</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Low:</span>
                            <span class="stat-value" id="stat-low">--</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Close:</span>
                            <span class="stat-value" id="stat-close">--</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Change %:</span>
                            <span class="stat-value" id="stat-change">--</span>
                        </div>
                    </div>
                </div>

                <div class="panel-section" id="strategy-panel">
                    <h3>Strategy Control & Results</h3>
                    <div id="strategy-controls">Loading strategies...</div>
                    <div id="strategy-results" style="margin-top: 10px;"></div>
                </div>
            </div>
        </div>

        <footer class="footer">
            <p>Data provided by Trade API | <span id="last-update">Last update: --</span></p>
        </footer>
    </div>

    <script src="chart-data-provider.js?v=7"></script>
    <script src="chart-renderer.js?v=8"></script>
    <script src="chart-loader.js?v=8"></script>
    <script src="strategies-new.js"></script>
    <script src="hindsight-strategies-new.js"></script>
    <script src="strategy-compare-new.js?v=15"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, initializing chart loader...');
            // Initialize chart with shared loader
            const chartLoader = new ChartLoader({
                containerId: 'main-chart',
                symbol: 'THB',
                timeframe: 'all',
                showVolume: false,
                showIndicators: false,
                enableControls: false,
                enableWebSocket: false,
                enableMarkers: false,
                autoRefresh: false
            });

            window.chartLoader = chartLoader;
            console.log('Chart loader created, calling init...');
            chartLoader.init().then(() => {
                console.log('Chart loader init complete, calling initComparePanel...');
                initComparePanel(chartLoader);
            }).catch(error => {
                console.error('Chart loader init failed:', error);
                document.getElementById('strategy-controls').innerHTML = 'Chart initialization failed: ' + error.message;
            });
        });
    </script>
</body>
</html>
