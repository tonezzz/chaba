<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>TradeCanvas - Compare</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <script src="ui-components.js?v=4"></script>
    <style>
        /* Full page layout styles */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin: 0;
            padding: 0;
            max-width: none;
            height: 100%;
        }
        
        .header-compact {
            flex-shrink: 0;
            padding: 10px 20px;
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
        }
        
        .main-content-compact {
            flex: 1;
            display: flex;
            overflow: hidden;
            padding: 0;
        }
        
        .chart-section-compact {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .chart-container-compact {
            flex: 1;
            min-height: 0;
        }
        
        .side-panel-compact {
            width: 350px;
            flex-shrink: 0;
            overflow-y: auto;
            background-color: #161b22;
            border-left: 1px solid #30363d;
        }
        
        .footer-compact {
            flex-shrink: 0;
            padding: 5px 20px;
            background-color: #161b22;
            border-top: 1px solid #30363d;
        }

        .symbol-panel .currency-selector,
        .symbol-panel .timeframe-selector {
            width: 100%;
            margin-bottom: 10px;
            padding: 6px 10px;
            border: 1px solid #30363d;
            border-radius: 6px;
            background-color: #21262d;
            color: #e6edf3;
            font-size: 14px;
        }

        .market-info {
            margin-top: 12px;
            padding: 12px;
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
        }

        .market-info-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .market-info-row + .market-info-row {
            margin-top: 8px;
        }

        .market-info .pair-label {
            font-size: 13px;
            font-weight: 600;
            color: #a8d5ff;
        }

        .market-info .status {
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .market-info .price-display {
            font-size: 18px;
            font-weight: 700;
            color: #e6edf3;
        }

        .market-info .price-change {
            font-size: 12px;
            font-weight: 600;
        }

        .market-info .price-change.positive {
            color: #3fb950;
        }

        .market-info .price-change.negative {
            color: #da3633;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Compact Header with Navigation -->
        <header class="header-compact">
            <div class="header-left">
                <h1>TradeCanvas</h1>
                <nav class="nav-compact">
                    <a href="index.html" class="nav-link">Dashboard</a>
                    <a href="compare.html" class="nav-link">Compare</a>
                    <a href="compare2.html?v=11" class="nav-link active">Compare2</a>
                </nav>
            </div>
            <div class="header-right"></div>
        </header>

        <div class="main-content-compact">
            <div class="chart-section-compact">
                <div id="main-chart" class="chart-container-compact"></div>
            </div>

            <div class="side-panel-compact">
                <div class="panel-section-compact symbol-panel" id="symbol-panel">
                    <div class="panel-header">
                        <h3>Symbol / Timeframe</h3>
                    </div>
                    <div id="currency-selector-container"></div>
                    <div id="timeframe-selector-container"></div>
                    <div class="market-info">
                        <div class="market-info-row">
                            <span class="pair-label" id="pair-label">USD/THB</span>
                            <span id="connection-status" class="status disconnected">Loading</span>
                        </div>
                        <div class="market-info-row price-row">
                            <span id="current-price" class="price-display">--</span>
                            <span id="price-change" class="price-change">--</span>
                        </div>
                    </div>
                </div>

                <div class="panel-section-compact" id="strategy-panel">
                    <div class="panel-header">
                        <h3>Strategy Comparison</h3>
                        <button id="toggle-params" class="toggle-btn">▼</button>
                    </div>
                    <div id="strategy-controls" class="strategy-controls-compact">Loading strategies...</div>
                    <div id="strategy-results" class="strategy-results-compact"></div>
                </div>
            </div>
        </div>

        <footer class="footer-compact">
            <span id="last-update">Last update: --</span>
        </footer>
    </div>

    <script src="chart-data-provider.js?v=9"></script>
    <script src="chart-renderer.js?v=9"></script>
    <script src="chart-loader.js?v=8"></script>
    <script src="strategies-new.js"></script>
    <script src="hindsight-strategies-new.js"></script>
    <script src="strategy-compare-new.js?v=15"></script>
    <script>
        // Verify all required classes are available
        console.log('Strategy class available:', typeof Strategy !== 'undefined');
        console.log('Hindsight01Strategy available:', typeof Hindsight01Strategy !== 'undefined');
        console.log('Hindsight02Strategy available:', typeof Hindsight02Strategy !== 'undefined');
        console.log('StrategyFactory available:', typeof StrategyFactory !== 'undefined');
        console.log('initComparePanel available:', typeof initComparePanel !== 'undefined');
        console.log('CurrencySelector available:', typeof CurrencySelector !== 'undefined');
        console.log('TimeframeSelector available:', typeof TimeframeSelector !== 'undefined');
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, initializing chart loader...');

            // Restore last selections from localStorage
            const savedCurrency = localStorage.getItem('trade-canvas-selected-currency') || 'THB';
            const savedTimeframe = localStorage.getItem('trade-canvas-selected-timeframe') || '1Y';

            const currencyLabels = {
                'THB': 'USD/THB',
                'EUR': 'EUR/USD',
                'GBP': 'GBP/USD',
                'JPY': 'USD/JPY',
                'GOLD': 'GOLD',
                'DXY': 'DXY',
                'OIL': 'OIL'
            };
            const pairLabelEl = document.getElementById('pair-label');
            if (pairLabelEl) {
                pairLabelEl.textContent = currencyLabels[savedCurrency] || savedCurrency;
            }

            // Initialize chart with restored (or default) selections
            const chartLoader = new ChartLoader({
                containerId: 'main-chart',
                symbol: savedCurrency,
                timeframe: savedTimeframe,
                showVolume: true,
                showIndicators: false,
                enableControls: true,
                enableWebSocket: false,
                enableMarkers: true,
                autoRefresh: false
            });

            window.chartLoader = chartLoader;
            console.log('Chart loader created, calling init...');
            chartLoader.init().then(() => {
                console.log('Chart loader init complete, calling initComparePanel...');
                initComparePanel(chartLoader);

                // Initialize currency selector after chart loader is ready
                if (typeof CurrencySelector !== 'undefined') {
                    const currencySelector = new CurrencySelector({
                        containerId: 'currency-selector-container',
                        chartLoader: chartLoader,
                        selectedCurrency: savedCurrency,
                        mode: 'compact',
                        className: 'currency-selector compact'
                    });

                    currencySelector.render();

                    // Update pair label when currency changes
                    currencySelector.on('currencyChange', (data) => {
                        const pairLabel = document.getElementById('pair-label');
                        if (pairLabel) {
                            pairLabel.textContent = data.label;
                        }
                    });

                    window.currencySelector = currencySelector;
                }

                // Initialize timeframe selector after chart loader is ready
                if (typeof TimeframeSelector !== 'undefined') {
                    const timeframeSelector = new TimeframeSelector({
                        containerId: 'timeframe-selector-container',
                        chartLoader: chartLoader,
                        selectedTimeframe: savedTimeframe,
                        className: 'currency-selector compact'
                    });

                    timeframeSelector.render();
                    window.timeframeSelector = timeframeSelector;
                }
            }).catch(error => {
                console.error('Chart loader init failed:', error);
                document.getElementById('strategy-controls').innerHTML = 'Chart initialization failed: ' + error.message;
            });
        });
    </script>
</body>
</html>
