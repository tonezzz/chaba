<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>TradeCanvas - Compare</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <style>
        /* Full page layout styles */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin: 0;
            padding: 0;
            max-width: none;
            height: 100%;
        }
        
        .header-compact {
            flex-shrink: 0;
            padding: 10px 20px;
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
        }
        
        .main-content-compact {
            flex: 1;
            display: flex;
            overflow: hidden;
            padding: 0;
        }
        
        .chart-section-compact {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .chart-container-compact {
            flex: 1;
            min-height: 0;
        }
        
        .side-panel-compact {
            width: 350px;
            flex-shrink: 0;
            overflow-y: auto;
            background-color: #161b22;
            border-left: 1px solid #30363d;
        }
        
        .footer-compact {
            flex-shrink: 0;
            padding: 5px 20px;
            background-color: #161b22;
            border-top: 1px solid #30363d;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Compact Header with Navigation -->
        <header class="header-compact">
            <div class="header-left">
                <h1>TradeCanvas</h1>
                <nav class="nav-compact">
                    <a href="index.html" class="nav-link">Dashboard</a>
                    <a href="compare.html" class="nav-link">Compare</a>
                    <a href="compare2.html?v=6" class="nav-link active">Compare2</a>
                </nav>
            </div>
            <div class="header-right">
                <span class="pair-label">USD/THB</span>
                <span id="current-price" class="price-display">--</span>
                <span id="price-change" class="price-change">--</span>
                <span id="connection-status" class="status-dot disconnected"></span>
            </div>
        </header>

        <div class="main-content-compact">
            <div class="chart-section-compact">
                <div id="main-chart" class="chart-container-compact"></div>
            </div>

            <div class="side-panel-compact">
                <div class="panel-section-compact" id="strategy-panel">
                    <div class="panel-header">
                        <h3>Strategy Comparison</h3>
                        <button id="toggle-params" class="toggle-btn">▼</button>
                    </div>
                    <div id="strategy-controls" class="strategy-controls-compact">Loading strategies...</div>
                    <div id="strategy-results" class="strategy-results-compact"></div>
                </div>
            </div>
        </div>

        <footer class="footer-compact">
            <span id="last-update">Last update: --</span>
        </footer>
    </div>

    <script src="chart-loader.js"></script>
    <script src="strategies-new.js"></script>
    <script src="hindsight-strategies-new.js"></script>
    <script src="strategy-compare-new.js"></script>
    <script>
        // Verify all required classes are available
        console.log('Strategy class available:', typeof Strategy !== 'undefined');
        console.log('Hindsight01Strategy available:', typeof Hindsight01Strategy !== 'undefined');
        console.log('Hindsight02Strategy available:', typeof Hindsight02Strategy !== 'undefined');
        console.log('StrategyFactory available:', typeof StrategyFactory !== 'undefined');
        console.log('initComparePanel available:', typeof initComparePanel !== 'undefined');
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, initializing chart loader...');
            // Initialize chart with shared loader
            const chartLoader = new ChartLoader({
                containerId: 'main-chart',
                symbol: 'THB',
                timeframe: '1Y',
                showVolume: true,
                showIndicators: false,
                enableControls: true,
                enableWebSocket: false,
                enableMarkers: true,
                autoRefresh: false
            });

            window.chartLoader = chartLoader;
            console.log('Chart loader created, calling init...');
            chartLoader.init().then(() => {
                console.log('Chart loader init complete, calling initComparePanel...');
                initComparePanel(chartLoader);
            }).catch(error => {
                console.error('Chart loader init failed:', error);
                document.getElementById('strategy-controls').innerHTML = 'Chart initialization failed: ' + error.message;
            });
        });
    </script>
</body>
</html>
