<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Mic Test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="gemini-mic" data-status="idle">
    <div class="gemini-mic-heading">
      <span class="gemini-mic-kicker">GEMINI</span>
      <span class="gemini-mic-readout">
        <span id="gemini-mic-status">OFF</span>
        <span id="gemini-mic-detail">VOICE STANDBY</span>
      </span>
    </div>
    <button id="gemini-mic-button" type="button" aria-label="Start or stop voice session">
      <span class="gemini-mic-orbit"><img src="mic.svg" alt="" /></span>
      <span class="gemini-mic-label">ON/OFF</span>
    </button>
    <div class="gemini-mic-visualizer" aria-hidden="true">
      <span style="--bar:0"></span>
      <span style="--bar:1"></span>
      <span style="--bar:2"></span>
      <span style="--bar:3"></span>
      <span style="--bar:4"></span>
      <span style="--bar:5"></span>
      <span style="--bar:6"></span>
      <span style="--bar:7"></span>
      <span style="--bar:8"></span>
      <span style="--bar:9"></span>
      <span style="--bar:10"></span>
      <span style="--bar:11"></span>
      <span style="--bar:12"></span>
      <span style="--bar:13"></span>
      <span style="--bar:14"></span>
    </div>
  </div>
  <script src="mic.js"></script>
</body>
</html>
