<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VNC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { bg: '#1a1a2e', card: '#16213e', accent: '#0a84ff' } } } };
  </script>
</head>
<body class="bg-bg text-gray-200 min-h-screen">
  <nav class="bg-card border-b border-gray-800">
    <div class="max-w-6xl mx-auto px-4 h-12 flex items-center gap-6">
      <a href="/apps/" class="text-sm text-gray-300 hover:text-accent">← Apps</a>
      <span class="text-sm font-semibold text-white">VNC</span>
    </div>
  </nav>
  <main class="max-w-4xl mx-auto px-4 py-6">
    <div class="bg-card border border-gray-700 rounded p-6">
      <h2 class="text-lg font-semibold text-white mb-4">Remote VNC connections</h2>
      <div class="space-y-4">
        <div class="border border-gray-700 rounded p-4">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-sm font-semibold text-white">XMEye VMS (Wine)</h3>
              <p class="text-xs text-gray-400 mt-1">192.168.2.67:5900 · no password</p>
            </div>
            <button onclick="copyCmd()"
               class="px-4 py-2 bg-accent text-white rounded text-sm hover:opacity-90">
              Copy command
            </button>
          </div>
          <div class="mt-3">
            <p class="text-xs text-gray-500 mb-1">Run this on tony-omen:</p>
            <code id="cmd" class="block bg-bg border border-gray-700 rounded px-3 py-2 text-sm font-mono text-gray-300">xtigervncviewer 192.168.2.67:5900</code>
          </div>
          <p id="status" class="text-xs text-green-400 mt-2 hidden">Copied!</p>
          <p class="text-xs text-gray-500 mt-2">If you want a browser-based VNC, I can add noVNC + websockify.</p>
        </div>
      </div>
    </div>
  </main>
  <script>
    function copyCmd() {
      const el = document.getElementById('cmd');
      navigator.clipboard.writeText(el.textContent).then(() => {
        const s = document.getElementById('status');
        s.classList.remove('hidden');
        setTimeout(() => s.classList.add('hidden'), 2000);
      }).catch(() => {
        window.prompt('Copy manually:', el.textContent);
      });
    }
  </script>
</body>
</html>
