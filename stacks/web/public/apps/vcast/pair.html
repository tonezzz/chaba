<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#020617">
  <title>vcast — pair display</title>
  <style>
    :root { --bg: #020617; --panel: #0f172a; --text: #f8fafc; --muted: #94a3b8; --accent: #22d3ee; --ok: #22c55e; --err: #ef4444; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; padding: 1.25rem; }
    main { max-width: 30rem; margin: 0 auto; }
    h1 { font-size: 1.3rem; }
    .card { background: var(--panel); border: 1px solid #1e293b; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
    label { font-size: 0.8rem; color: var(--muted); display: block; margin-bottom: 0.3rem; }
    input { width: 100%; font: inherit; font-size: 0.9rem; padding: 0.5rem; border-radius: 6px; border: 1px solid #334155; background: var(--bg); color: var(--text); }
    button { font: inherit; font-weight: 700; padding: 0.6rem 1rem; border-radius: 8px; border: none; background: var(--accent); color: #082f49; cursor: pointer; width: 100%; margin-top: 0.75rem; }
    button:disabled { opacity: 0.5; }
    .row { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem; }
    .row input[type=checkbox] { width: auto; }
    #result { margin-top: 0.75rem; font-size: 0.9rem; white-space: pre-wrap; word-break: break-all; }
    .ok { color: var(--ok); } .err { color: var(--err); }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    td, th { text-align: left; padding: 0.35rem 0.4rem; border-bottom: 1px solid #1e293b; }
    th { color: var(--muted); font-weight: 600; }
    .muted { color: var(--muted); font-size: 0.8rem; }
  </style>
</head>
<body>
<main>
  <h1>Pair a virtual display</h1>
  <div class="card" id="pendingCard">
    <div class="muted">Pending display</div>
    <div id="pendingInfo" style="margin-top:0.4rem">loading…</div>
  </div>

  <div class="card">
    <div class="muted">Confirm on the display before tapping — anyone on the tailnet who can see this display's QR can claim it.</div>
    <button id="pairBtn">Add as cast target</button>
    <div class="row" id="keyRow" hidden>
      <input id="adminKey" type="password" placeholder="Ada admin key (off-tailnet claim)" autocomplete="off">
    </div>
    <div id="result"></div>
    <div class="muted" id="hint"></div>
  </div>

  <div class="card">
    <div class="muted">Registered screens</div>
    <table id="screens"><thead><tr><th>#</th><th>name</th><th>device</th><th>state</th></tr></thead><tbody></tbody></table>
  </div>
</main>
<script>
  const sid = new URLSearchParams(location.search).get("sid") || "";

  async function api(path, opts) {
    // 10s ceiling — a hung relay otherwise leaves the button stuck at
    // "pairing…" forever and the pair->play budget dies silently
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 10000);
    try {
      const r = await fetch(`/api/input-bridge${path}`, { ...opts, signal: ctrl.signal });
      const data = await r.json().catch(() => ({}));
      return { status: r.status, data };
    } catch (e) {
      return { status: 0, data: { error: "relay unreachable — check tailnet, then retry" } };
    } finally {
      clearTimeout(t);
    }
  }

  async function loadPending() {
    const el = document.getElementById("pendingInfo");
    if (!sid) { el.innerHTML = '<span class="err">missing ?sid= — rescan the QR on the display</span>'; return; }
    const { status, data } = await api(`/pair-info?sid=${encodeURIComponent(sid)}`);
    el.innerHTML = status === 200
      ? `<strong>${data.label || "display"}</strong> <span class="muted">waiting since ${data.since}</span>`
      : `<span class="err">${data.error || status}</span>`;
  }

  async function loadScreens() {
    const { data } = await api("/displays");
    const tb = document.querySelector("#screens tbody");
    tb.innerHTML = "";
    for (const s of data.screens || []) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>#${s.screen}</td><td>${s.name}</td><td>${s.label || ""}</td>` +
        `<td>${s.connected ? '<span class="ok">online</span>' : '<span class="muted">offline</span>'} ${s.state || ""}</td>`;
      tb.appendChild(tr);
    }
    if (!(data.screens || []).length) tb.innerHTML = '<tr><td colspan="4" class="muted">none yet</td></tr>';
  }

  // Tailnet is keyless — show the key field only when the first claim
  // attempt proves we're off-tailnet (403), then remember it.
  const keyRow = document.getElementById("keyRow");
  const keyIn = document.getElementById("adminKey");
  const hint = document.getElementById("hint");
  keyIn.value = localStorage.getItem("vcast-admin-key") || "";
  if (location.hostname.endsWith(".ts.net") || location.hostname === "tony-dell")
    hint.textContent = "On Tailscale — claims are keyless here.";
  else
    hint.textContent = "Not on the tailnet — the first claim will ask for the Ada admin key.";

  document.getElementById("pairBtn").addEventListener("click", async () => {
    const out = document.getElementById("result");
    const btn = document.getElementById("pairBtn");
    btn.disabled = true; out.textContent = "pairing…";
    const body = { sid };
    const k = keyIn.value.trim();
    if (k) body.admin_key = k;
    const { status, data } = await api("/claim", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });
    btn.disabled = false;
    if (status === 200) {
      if (k) localStorage.setItem("vcast-admin-key", k);
      out.innerHTML = `<span class="ok">Paired — Screen #${data.screen} (${data.name})</span>`;
      loadScreens();
    } else if (status === 403 && !k) {
      keyRow.hidden = false;
      keyIn.focus();
      out.innerHTML = `<span class="err">Off-tailnet claim — paste the Ada admin key above and tap again.</span>`;
    } else if (status === 409) {
      out.innerHTML = `<span class="err">${data.error}</span><br>the name is held by a live display — release it from the admin page first.`;
    } else {
      out.innerHTML = `<span class="err">${data.error || status}</span>`;
    }
  });

  loadPending();
  loadScreens();
</script>
</body>
</html>
