<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yomi Daily Summaries</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles/daily.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/calendar.css">
  <link rel="stylesheet" href="styles/summary.css">
  <link rel="stylesheet" href="styles/messages.css">
</head>
<body>
  <header>
    <a class="back" href="/apps/yomi/">&larr; Back</a>
    <h1>Daily Summaries</h1>
    <select id="chat-select"><option value="">Loading conversations...</option></select>
  </header>
  <div id="app">
    <div class="calendar-panel">
      <div class="calendar-header">
        <button class="calendar-nav" id="prev-month">&laquo;</button>
        <div class="calendar-title" id="calendar-title">Loading...</div>
        <button class="calendar-nav" id="next-month">&raquo;</button>
      </div>
      <div class="calendar-grid" id="calendar-grid">
        <div class="calendar-day-header">Sun</div>
        <div class="calendar-day-header">Mon</div>
        <div class="calendar-day-header">Tue</div>
        <div class="calendar-day-header">Wed</div>
        <div class="calendar-day-header">Thu</div>
        <div class="calendar-day-header">Fri</div>
        <div class="calendar-day-header">Sat</div>
      </div>
    </div>
    <div class="summary-panel">
      <div class="summary-header">
        <div class="summary-date" id="summary-date">Select a date</div>
        <div class="summary-count" id="summary-count"></div>
        <button class="resummarize-btn" id="header-resummarize-btn" style="display: none;">Re-summarize</button>
      </div>
      <div class="summary-content" id="summary-content">
        <div class="empty-state">Select a date from the calendar to view the daily summary</div>
      </div>
    </div>
    <div class="message-list-panel">
      <div class="message-list-header">
        <div class="message-list-title">Messages</div>
        <div class="message-list-count" id="message-list-count"></div>
        <button class="batch-analyze-btn" id="batch-analyze-btn" onclick="analyzeBatchMedia(this)" style="display: none;">Batch Analyze</button>
      </div>
      <div class="message-list-content" id="message-list-content">
        <div class="empty-state" style="padding: 1rem;">Select a date to view messages</div>
      </div>
    </div>
  </div>
  
  <!-- Image popup modal -->
  <div id="image-popup" class="image-popup" onclick="window.closeImagePopup()">
    <div class="image-popup-content" onclick="event.stopPropagation()">
      <button class="image-popup-close" onclick="window.closeImagePopup()">&times;</button>
      <img id="image-popup-img" class="image-popup-img" src="" alt="Image">
    </div>
  </div>
  
  <!-- Load shared utilities in dependency order -->
  <script src="/apps/shared/js/date-utils.js?v=1"></script>
  <script src="/apps/shared/js/date-utils-thailand.js?v=1"></script>
  <script src="/apps/shared/js/api-utils.js?v=1"></script>
  <script src="/apps/shared/js/api-yomi.js?v=1"></script>
  <script src="/apps/shared/js/ui-utils.js?v=1"></script>
  
  <!-- Load app modules in dependency order -->
  <script src="js/config.js?v=1"></script>
  <script src="js/namespace.js?v=1"></script>
  <script src="js/init.js?v=1"></script>
  <script src="js/calendar.js?v=1"></script>
  <script src="js/summary.js?v=1"></script>
  <script src="js/messages.js?v=1"></script>
  <script src="js/media-analysis.js?v=1"></script>
  <script src="js/app.js?v=1"></script>
</body>
</html>
