<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yomi Daily Calendar</title>
  <link rel="stylesheet" href="styles/daily2.css">
</head>
<body>
  <header>
    <a class="back" href="/apps/yomi/">&larr; Back</a>
    <h1>Daily Calendar</h1>
    <select id="chat-select"><option value="">Loading conversations...</option></select>
  </header>
  <div id="app">
    <div class="calendar-panel">
      <div class="calendar-header">
        <button class="calendar-nav" id="prev-month">&laquo;</button>
        <div class="calendar-title" id="calendar-title">Loading...</div>
        <button class="calendar-nav" id="next-month">&raquo;</button>
      </div>
      <div class="calendar-grid" id="calendar-grid">
        <div class="calendar-day-header">Sun</div>
        <div class="calendar-day-header">Mon</div>
        <div class="calendar-day-header">Tue</div>
        <div class="calendar-day-header">Wed</div>
        <div class="calendar-day-header">Thu</div>
        <div class="calendar-day-header">Fri</div>
        <div class="calendar-day-header">Sat</div>
      </div>
    </div>
    <div class="summary-panel">
      <div class="summary-header">
        <div class="summary-date" id="summary-date">Select a date</div>
        <div class="summary-count" id="summary-count"></div>
      </div>
      <div class="summary-content" id="summary-content">
        <div class="empty-state">Select a date from the calendar to view the daily summary</div>
      </div>
      <div class="message-list-panel">
        <div class="message-list-header">
          <div class="message-list-title">Messages</div>
          <div class="message-list-count" id="message-list-count"></div>
        </div>
        <div class="message-list-content" id="message-list-content">
          <div class="empty-state" style="padding: 1rem;">Select a date to view messages</div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Load modules in dependency order -->
  <script src="js/init.js?v=1"></script>
  <script src="js/date-utils.js?v=2"></script>
  <script src="js/calendar.js?v=2"></script>
  <script src="js/summary.js?v=2"></script>
  <script src="js/messages.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
