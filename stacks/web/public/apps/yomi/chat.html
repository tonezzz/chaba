<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yomi — Conversation</title>
  <style>
    :root { --bg: #f8fafc; --card: #fff; --text: #0f172a; --muted: #64748b; --accent: #06b6d4; --danger: #ef4444; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
    header { background: #0f172a; color: #fff; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    h1 { margin: 0; font-size: 1.25rem; }
    main { max-width: 700px; margin: 1.5rem auto; padding: 0 1rem; }
    .back { color: #fff; text-decoration: none; font-size: .9rem; }
    .back:hover { text-decoration: underline; }
    .chat { background: var(--card); border-radius: .5rem; padding: 1rem; box-shadow: 0 1px 2px rgba(15,23,42,.05); }
    .chat-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; }
    .message {
      padding: 0.6rem 0.75rem;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-left: 3px solid var(--accent);
      border-radius: 0 0.5rem 0.5rem 0;
      margin-bottom: 0.5rem;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .message:hover {
      border-color: #cbd5e1;
      box-shadow: 0 2px 5px rgba(15, 23, 42, 0.06);
    }
    .meta { color: #94a3b8; font-size: .75rem; margin-bottom: .1rem; }
    .text { white-space: pre-wrap; word-break: break-word; font-size: .9rem; color: var(--text); }
    .text-null { color: #94a3b8; font-style: italic; }
    .media-img { max-width: 100%; max-height: 300px; border-radius: .5rem; margin-top: .25rem; display: block; cursor: pointer; }
    .media-video { max-width: 100%; max-height: 300px; border-radius: .5rem; margin-top: .25rem; display: block; background: #0f172a; }
    .media-audio { width: 100%; margin-top: .25rem; }
    .media-file { display: inline-flex; align-items: center; gap: .35rem; margin-top: .25rem; padding: .35rem .6rem; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: .375rem; color: var(--accent); text-decoration: none; font-size: .85rem; }
    .media-file:hover { background: #e2e8f0; }
    .media-placeholder { color: #64748b; font-style: italic; font-size: .85rem; }
    .error { color: #ef4444; }
    #status { color: var(--muted); padding: 1rem; }
    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      cursor: zoom-out;
    }
    #lightbox.active { display: flex; }
    #lightbox img {
      max-width: 95vw;
      max-height: 95vh;
      border-radius: .5rem;
      box-shadow: 0 25px 50px rgba(0,0,0,.5);
      cursor: default;
    }
    #lightbox .close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: rgba(15, 23, 42, 0.9);
      color: #f8fafc;
      border: none;
      border-radius: .35rem;
      width: 2rem;
      height: 2rem;
      font-size: 1.25rem;
      cursor: pointer;
    }
    #lightbox .close:hover { background: #334155; }
  </style>
</head>
<body>
  <header>
    <a class="back" href="/apps/yomi/">&larr; Back</a>
    <h1>LINE Conversation</h1>
    <span></span>
  </header>
  <main id="app"><p id="status">Loading…</p></main>
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Full-size image">
    <button id="lightbox-close" class="close" type="button" aria-label="Close">×</button>
    <img id="lightbox-img" src="" alt="Full-size image">
  </div>
  <script>
    async function load() {
      const params = new URLSearchParams(location.search);
      const id = params.get('chat');
      const app = document.getElementById('app');
      if (!id) {
        app.innerHTML = '<p id="status" class="error">No conversation selected.</p>';
        return;
      }
      try {
        const [convRes, msgRes] = await Promise.all([
          fetch('/apps/yomi/conversations.json', { credentials: 'include' }),
          fetch(`/apps/yomi/messages/${id}.json`, { credentials: 'include' })
        ]);
        if (!convRes.ok) throw new Error('Conversations ' + convRes.status);
        if (!msgRes.ok) throw new Error('Messages ' + msgRes.status);
        const { conversations } = await convRes.json();
        const { messages } = await msgRes.json();
        const conv = conversations.find(c => c.id === id);
        const title = conv?.name || id;
        document.title = `Yomi — ${title}`;
        app.innerHTML = `<div class="chat">
          <div class="chat-title">${escapeHtml(title)}</div>
          <div id="messages"></div>
        </div>`;
        const panel = document.getElementById('messages');
        if (!messages || !messages.length) {
          panel.innerHTML = '<p class="text-null">No messages.</p>';
          return;
        }
        const sorted = [...messages].sort((a, b) => a.deliveredTime - b.deliveredTime);
        for (const m of sorted) {
          const bubble = document.createElement('div');
          bubble.className = 'message';
          const time = m.deliveredTime ? ' · ' + new Date(m.deliveredTime).toLocaleString() : '';
          bubble.innerHTML = `
            <div class="meta">${escapeHtml(m.fromName || m.from || 'Unknown')}${time}</div>
            ${renderContent(m, id)}
          `;
          panel.appendChild(bubble);
        }
      } catch (e) {
        app.innerHTML = `<p id="status" class="error">${escapeHtml(e.message)}</p>`;
      }
    }
    function renderContent(m, chatId) {
      const type = String(m.mediaType || '').toLowerCase();
      if (type === 'image' && m.mediaFile) {
        const src = `media/${chatId}/${m.mediaFile}`;
        return `<img class="media-img" src="${encodeURI(src)}" alt="image" loading="lazy" onclick="openLightbox(this.src)" onerror="this.outerHTML='<span class=\\'text-null\\'>[image unavailable]</span>'">`;
      }
      if (type === 'video' && m.mediaFile) {
        const src = `media/${chatId}/${m.mediaFile}`;
        return `<video class="media-video" src="${encodeURI(src)}" controls preload="metadata" onerror="this.outerHTML='<span class=\\'media-placeholder\\'>[video unavailable]</span>'"></video>`;
      }
      if (type === 'audio' && m.mediaFile) {
        const src = `media/${chatId}/${m.mediaFile}`;
        return `<audio class="media-audio" src="${encodeURI(src)}" controls preload="metadata" onerror="this.outerHTML='<span class=\\'media-placeholder\\'>[audio unavailable]</span>'"></audio>`;
      }
      if (type === 'file') {
        if (m.mediaFile) {
          const src = `media/${chatId}/${m.mediaFile}`;
          const name = m.mediaFile.split('/').pop();
          return `<a class="media-file" href="${encodeURI(src)}" download target="_blank" rel="noopener">⬇ ${escapeHtml(name)}</a>`;
        }
        return '<span class="media-placeholder">[file]</span>';
      }
      if (type) return `<span class="media-placeholder">[${escapeHtml(type)}]</span>`;
      if (m.text == null) return '<span class="text-null">(no text)</span>';
      return `<div class="text">${escapeHtml(m.text)}</div>`;
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxClose = document.getElementById('lightbox-close');
    function openLightbox(src) { if (!src) return; lightboxImg.src = src; lightbox.classList.add('active'); }
    function closeLightbox() { lightboxImg.src = ''; lightbox.classList.remove('active'); }
    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => { if (e.target !== lightboxImg && e.target !== lightboxClose) closeLightbox(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });

    load();
  </script>
</body>
</html>
