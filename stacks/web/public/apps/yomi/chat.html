<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yomi — Conversation</title>
  <style>
    :root { --bg: #f8fafc; --card: #fff; --text: #0f172a; --muted: #64748b; --accent: #06b6d4; --danger: #ef4444; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
    header { background: #0f172a; color: #fff; padding: 0.5rem 1rem; display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; flex-shrink: 0; }
    h1 { margin: 0; font-size: 1rem; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    main { max-width: 700px; width: 100%; margin: 0 auto; padding: 0 1rem; flex: 1; overflow: hidden; display: flex; flex-direction: column; }
    .back { color: #fff; text-decoration: none; font-size: .85rem; white-space: nowrap; }
    .back:hover { text-decoration: underline; }
    .refetch-btn { background: #0ea5e9; color: #0f172a; border: none; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
    .refetch-btn:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }
    .refetch-force { background: #f59e0b; color: #0f172a; border: none; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-weight: 600; font-size: 0.85rem; margin-left: 0.5rem; }
    .refetch-force:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }
    .msg-search { padding: 4px 8px; border: 1px solid #334155; border-radius: 6px; background: #0f172a; color: #fff; font-size: 0.85rem; min-width: 120px; max-width: 180px; }
    .msg-search::placeholder { color: #94a3b8; }
    .message-match { background: #fef9c3 !important; border-color: #f59e0b !important; }
    .chat { background: var(--card); border-radius: .5rem; padding: 0.75rem; box-shadow: 0 1px 2px rgba(15,23,42,.05); flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .day-header {
      text-align: center;
      color: #94a3b8;
      font-size: .75rem;
      font-weight: 600;
      margin: .75rem 0 .5rem;
      position: relative;
    }
    .day-header::before, .day-header::after {
      content: '';
      position: absolute;
      top: 50%;
      width: calc(50% - 3.5rem);
      height: 1px;
      background: #e2e8f0;
    }
    .day-header::before { left: 0; }
    .day-header::after { right: 0; }
    .message {
      padding: 0.5rem 0.625rem;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-left: 3px solid var(--accent);
      border-radius: 0 0.5rem 0.5rem 0;
      margin-bottom: 0.4rem;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .message:hover {
      border-color: #cbd5e1;
      box-shadow: 0 2px 5px rgba(15, 23, 42, 0.06);
    }
    .meta { color: #94a3b8; font-size: .75rem; margin-bottom: .1rem; }
    .text { white-space: pre-wrap; word-break: break-word; font-size: .9rem; color: var(--text); }
    .text-null { color: #94a3b8; font-style: italic; }
    .media-img { max-width: 100%; max-height: 300px; border-radius: .5rem; margin-top: .25rem; display: block; cursor: pointer; }
    .media-video { max-width: 100%; max-height: 300px; border-radius: .5rem; margin-top: .25rem; display: block; background: #0f172a; }
    .media-audio { width: 100%; margin-top: .25rem; }
    .media-file { display: inline-flex; align-items: center; gap: .35rem; margin-top: .25rem; padding: .35rem .6rem; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: .375rem; color: var(--accent); text-decoration: none; font-size: .85rem; }
    .media-file:hover { background: #e2e8f0; }
    .media-placeholder { color: #64748b; font-style: italic; font-size: .85rem; }
    .error { color: #ef4444; }
    .analyze-btn { background: #8b5cf6; color: #fff; border: none; border-radius: 4px; padding: 4px 8px; font-size: .75rem; cursor: pointer; margin-top: .25rem; }
    .analyze-btn:hover { background: #7c3aed; }
    .analyze-btn:disabled { background: #94a3b8; cursor: not-allowed; }
    .media-analysis { background: #f0fdf4; border: 1px solid #86efac; border-radius: 4px; padding: .35rem .5rem; margin-top: .25rem; font-size: .8rem; color: #166534; }
    .media-analysis.loading { background: #fef3c7; border-color: #fcd34d; color: #92400e; }
    #status { color: var(--muted); padding: 1rem; }
    #loader { color: var(--muted); padding: .5rem; text-align: center; font-size: .85rem; flex-shrink: 0; }
    #messages { flex: 1; overflow-y: auto; }
    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      cursor: zoom-out;
    }
    #lightbox.active { display: flex; }
    #lightbox img {
      max-width: 95vw;
      max-height: 95vh;
      border-radius: .5rem;
      box-shadow: 0 25px 50px rgba(0,0,0,.5);
      cursor: default;
    }
    #lightbox .close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: rgba(15, 23, 42, 0.9);
      color: #f8fafc;
      border: none;
      border-radius: .35rem;
      width: 2rem;
      height: 2rem;
      font-size: 1.25rem;
      cursor: pointer;
    }
    #lightbox .close:hover { background: #334155; }
    #scroll-ctrls { position: fixed; right: 1rem; bottom: 5rem; display: flex; flex-direction: column; gap: 0.35rem; z-index: 1000; }
    #scroll-ctrls button { padding: 0.35rem 0.6rem; border: none; border-radius: 0.375rem; background: #0f172a; color: #fff; font-size: 0.75rem; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.2); opacity: 0.75; transition: opacity .15s; }
    #scroll-ctrls button:hover { opacity: 1; }
    #status-bar { display: none; background: #0f172a; color: #fff; padding: .25rem .75rem; text-align: center; font-size: .8rem; flex-shrink: 0; }
    #status-bar.active { display: block; }
    #reply-form { display: flex; gap: 0.5rem; padding: 0.75rem; background: #f8fafc; border-top: 1px solid #e2e8f0; position: sticky; bottom: 0; }
    #reply-input { flex: 1; padding: 0.5rem 0.75rem; border: 1px solid #cbd5e1; border-radius: 0.375rem; font-size: 0.9rem; resize: none; min-height: 2.5rem; max-height: 8rem; }
    #reply-input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
    #reply-send { padding: 0.5rem 1rem; border: none; border-radius: 0.375rem; background: var(--accent); color: #fff; font-size: 0.9rem; cursor: pointer; white-space: nowrap; }
    #reply-send:hover { opacity: 0.9; }
    #reply-send:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <a class="back" href="/apps/yomi/">&larr; Back</a>
    <h1 id="chat-name">LINE Conversation</h1>
    <input type="search" id="msg-search" class="msg-search" placeholder="Find in chat…" autocomplete="off">
    <button id="refetch" class="refetch-btn" title="Refresh this conversation from LINE">Refresh</button>
    <button id="refetch-force" class="refetch-force" title="Force refresh (bypass cache)">Force</button>
  </header>
  <div id="status-bar"></div>
  <main id="app"><p id="status">Loading…</p></main>
  <form id="reply-form">
    <textarea id="reply-input" placeholder="Type a message…" rows="1"></textarea>
    <button type="submit" id="reply-send">Send</button>
  </form>
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Full-size image">
    <button id="lightbox-close" class="close" type="button" aria-label="Close">×</button>
    <button id="lightbox-prev" class="close" type="button" aria-label="Previous image" style="right:auto;left:1rem">‹</button>
    <button id="lightbox-next" class="close" type="button" aria-label="Next image">›</button>
    <img id="lightbox-img" src="" alt="Full-size image">
  </div>
  <div id="scroll-ctrls" aria-label="Message scroll controls">
    <button type="button" data-dir="top" aria-label="Oldest messages">Top</button>
    <button type="button" data-dir="up" aria-label="Page up">Up</button>
    <button type="button" data-dir="down" aria-label="Page down">Down</button>
    <button type="button" data-dir="last" aria-label="Newest messages">Last</button>
  </div>
  <script>
    const PAGE_LIMIT = 50;
    let allMessages = [];
    let oldestCursor = null;
    let newestCursor = null;
    let loading = false;
    let exhausted = false;

    function mediaSrc(m, chatId) {
      if (m.mediaFile) return `media/${chatId}/${m.mediaFile}`;
      if (m.id) return `/api/yomi/media/${chatId}/${m.id}`;
      return null;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
    function linkify(s) {
      return String(s).replace(/\\n/g, '\n').split(/(https?:\/\/[^\s<>"'{}|\\^`\[\]]+)/gi).map(part =>
        /^https?:\/\//i.test(part)
          ? `<a href="${escapeHtml(part)}" target="_blank" rel="noopener">${escapeHtml(part)}</a>`
          : escapeHtml(part)
      ).join('');
    }

    function dayLabel(ts) {
      const d = new Date(ts);
      return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric', weekday: 'short' });
    }

    function renderContent(m, chatId) {
      const type = String(m.mediaType || '').toLowerCase();
      if (type === 'image') {
        const src = mediaSrc(m, chatId);
        if (!src) return '';
        const analysisBtn = m.id ? `<button class="analyze-btn" data-msg-id="${escapeHtml(m.id)}" data-media-type="image" onclick="analyzeMedia(this)">🔍 Analyze</button>` : '';
        const analysisDisplay = m.mediaAnalysis ? `<div class="media-analysis">AI: ${escapeHtml(m.mediaAnalysis)}</div>` : '';
        return `<img class="media-img" src="${encodeURI(src)}" alt="image" loading="lazy" onclick="openLightbox(this.src)" onerror="this.style.display='none'">${analysisBtn}${analysisDisplay}`;
      }
      if (type === 'video') {
        const src = mediaSrc(m, chatId);
        if (!src) return '';
        const analysisBtn = m.id ? `<button class="analyze-btn" data-msg-id="${escapeHtml(m.id)}" data-media-type="video" onclick="analyzeMedia(this)">🔍 Analyze</button>` : '';
        const analysisDisplay = m.mediaAnalysis ? `<div class="media-analysis">AI: ${escapeHtml(m.mediaAnalysis)}</div>` : '';
        return `<video class="media-video" src="${encodeURI(src)}" controls preload="metadata" onerror="this.style.display='none'"></video>${analysisBtn}${analysisDisplay}`;
      }
      if (type === 'audio') {
        const src = mediaSrc(m, chatId);
        if (!src) return '';
        return `<audio class="media-audio" src="${encodeURI(src)}" controls preload="metadata" onerror="this.style.display='none'"></audio>`;
      }
      if (type === 'file') {
        const src = mediaSrc(m, chatId);
        if (src) {
          const name = m.mediaFile ? m.mediaFile.split('/').pop() : 'download';
          return `<a class="media-file" href="${encodeURI(src)}" download="${escapeHtml(name)}" target="_blank" rel="noopener">⬇ ${escapeHtml(name)}</a>`;
        }
        return '';
      }
      if (type) {
        if (type === 'unavailable' && (m.e2eeDecrypted === false || m.e2eeIntegrityVerified === false)) {
          return '<span class="media-placeholder">[E2EE locked]</span>';
        }
        return `<span class="media-placeholder">[${escapeHtml(type)}]</span>`;
      }
      if (m.text == null) {
        if (m.e2eeDecrypted === false || m.e2eeIntegrityVerified === false) {
          return '<span class="media-placeholder">[E2EE locked]</span>';
        }
        return '<span class="text-null">(no text)</span>';
      }
      return `<div class="text">${linkify(m.text)}</div>`;
    }

    function createMessageEl(m, chatId) {
      const bubble = document.createElement('div');
      bubble.className = 'message';
      if (m.id) bubble.dataset.id = m.id;
      const time = m.deliveredTime ? ' · ' + new Date(m.deliveredTime).toLocaleString() : '';
      bubble.innerHTML = `
        <div class="meta">${escapeHtml(m.fromName || m.from || 'Unknown')}${time}</div>
        ${renderContent(m, chatId)}
      `;
      return bubble;
    }

    async function fetchMessages(chatId, before) {
      let url = `/api/yomi/messages?chat=${encodeURIComponent(chatId)}&limit=${PAGE_LIMIT}`;
      if (before) url += `&before=${encodeURIComponent(before)}`;
      const res = await fetch(url, { credentials: 'include' });
      if (!res.ok) throw new Error('Messages ' + res.status);
      const { messages } = await res.json();
      return messages || [];
    }

    function appendMessages(messages, chatId, toStart) {
      const panel = document.getElementById('messages');
      if (!panel) return;
      const sorted = [...messages].sort((a, b) => a.deliveredTime - b.deliveredTime);
      let currentDay = null;
      const frag = document.createDocumentFragment();
      for (const m of sorted) {
        const day = m.deliveredTime ? dayLabel(m.deliveredTime) : null;
        if (day && day !== currentDay) {
          const h = document.createElement('div');
          h.className = 'day-header';
          h.textContent = day;
          h.dataset.day = day;
          frag.appendChild(h);
          currentDay = day;
        }
        frag.appendChild(createMessageEl(m, chatId));
      }
      if (toStart) {
        const first = panel.firstChild;
        panel.insertBefore(frag, first);
      } else {
        panel.appendChild(frag);
      }
      // dedupe by message id
      const seen = new Set();
      panel.querySelectorAll('.message').forEach(el => {
        const id = el.dataset.id;
        if (id && seen.has(id)) el.remove();
        if (id) seen.add(id);
      });
    }

    async function loadInitial(chatId) {
      const app = document.getElementById('app');
      app.innerHTML = `<div class="chat"><div id="loader">Loading…</div><div id="messages"></div></div>`;
      try {
        const messages = await fetchMessages(chatId);
        const panel = document.getElementById('messages');
        const loader = document.getElementById('loader');
        if (!messages.length) {
          panel.innerHTML = '<p class="text-null">No messages.</p>';
          loader.textContent = 'No messages.';
          exhausted = true;
        } else {
          messages.forEach(m => allMessages.push(m));
          newestCursor = messages[0].deliveredTime;
          oldestCursor = messages[messages.length - 1].deliveredTime;
          appendMessages(messages, chatId, false);
          // scroll to bottom to show newest
          panel.scrollTop = panel.scrollHeight;
          panel.addEventListener('scroll', () => {
            if (panel.scrollTop < 150 && panel.scrollHeight > panel.clientHeight && !loading && !exhausted) {
              loadOlder(chatId);
            }
          });
        }
        if (messages.length < PAGE_LIMIT) {
          exhausted = true;
          loader.textContent = 'Reached the beginning.';
        } else {
          loader.style.display = 'none';
        }
      } catch (e) {
        app.innerHTML = `<p id="status" class="error">${escapeHtml(e.message)}</p>`;
      }
    }

    async function loadOlder(chatId) {
      if (loading || exhausted || !oldestCursor) return;
      loading = true;
      const panel = document.getElementById('messages');
      const loader = document.getElementById('loader');
      if (loader) { loader.textContent = 'Loading older…'; loader.style.display = ''; }
      try {
        const messages = await fetchMessages(chatId, oldestCursor);
        if (!messages.length) {
          exhausted = true;
          if (loader) loader.textContent = 'Reached the beginning.';
          return;
        }
        messages.forEach(m => allMessages.push(m));
        oldestCursor = messages[messages.length - 1].deliveredTime;
        const oldHeight = panel.scrollHeight;
        appendMessages(messages, chatId, true);
        const newHeight = panel.scrollHeight;
        panel.scrollTop += (newHeight - oldHeight);
        if (messages.length < PAGE_LIMIT) {
          exhausted = true;
          if (loader) loader.textContent = 'Reached the beginning.';
        } else {
          if (loader) loader.style.display = 'none';
        }
      } catch (e) {
        if (loader) loader.textContent = 'Error loading older: ' + e.message;
      } finally {
        loading = false;
      }
    }

    async function load() {
      const params = new URLSearchParams(location.search);
      const id = params.get('chat');
      const app = document.getElementById('app');
      if (!id) {
        app.innerHTML = '<p id="status" class="error">No conversation selected.</p>';
        return;
      }
      try {
        const convRes = await fetch('/api/yomi/conversations', { credentials: 'include' });
        if (!convRes.ok) throw new Error('Conversations ' + convRes.status);
        const { conversations } = await convRes.json();
        const conv = conversations.find(c => c.id === id);
        const title = conv?.name || id;
        document.title = `Yomi — ${title}`;
        const chatName = document.getElementById('chat-name');
        if (chatName) chatName.textContent = title;
        await loadInitial(id);
      } catch (e) {
        app.innerHTML = `<p id="status" class="error">${escapeHtml(e.message)}</p>`;
      }
    }


    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxClose = document.getElementById('lightbox-close');
    const lightboxPrev = document.getElementById('lightbox-prev');
    const lightboxNext = document.getElementById('lightbox-next');
    let gallery = [];
    let galleryIndex = -1;

    function refreshGallery() {
      gallery = [...document.querySelectorAll('.media-img')].map(img => img.src);
    }
    function showLightboxAt(i) {
      if (i < 0 || i >= gallery.length) return;
      galleryIndex = i;
      lightboxImg.src = gallery[i];
      lightboxPrev.hidden = i === 0;
      lightboxNext.hidden = i === gallery.length - 1;
      lightbox.classList.add('active');
    }
    function openLightbox(src) {
      refreshGallery();
      const i = gallery.indexOf(src);
      showLightboxAt(i >= 0 ? i : 0);
    }
    function closeLightbox() { lightboxImg.src = ''; lightbox.classList.remove('active'); }
    lightboxClose.addEventListener('click', closeLightbox);
    lightboxPrev.addEventListener('click', (e) => { e.stopPropagation(); showLightboxAt(galleryIndex - 1); });
    lightboxNext.addEventListener('click', (e) => { e.stopPropagation(); showLightboxAt(galleryIndex + 1); });
    lightbox.addEventListener('click', (e) => { if (e.target !== lightboxImg && e.target !== lightboxClose && e.target !== lightboxPrev && e.target !== lightboxNext) closeLightbox(); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft' && !lightboxPrev.hidden) showLightboxAt(galleryIndex - 1);
      if (e.key === 'ArrowRight' && !lightboxNext.hidden) showLightboxAt(galleryIndex + 1);
    });

    const msgSearch = document.getElementById('msg-search');
    if (msgSearch) {
      msgSearch.addEventListener('input', () => {
        const term = msgSearch.value.trim().toLowerCase();
        document.querySelectorAll('.message').forEach(el => {
          el.classList.toggle('message-match', term.length > 0 && el.textContent.toLowerCase().includes(term));
        });
        if (term) {
          const first = document.querySelector('.message-match');
          if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      });
    }

    const refetch = document.getElementById('refetch');
    const chatId = new URLSearchParams(location.search).get('chat');
    const statusBar = document.getElementById('status-bar');
    let lastServerUpdated = null;
    let refreshInterval = null;

    async function checkForUpdates() {
      if (!chatId) return;
      try {
        const res = await fetch('/api/yomi/last-updated', { credentials: 'include' });
        if (!res.ok) return;
        const { lastUpdated } = await res.json();
        if (lastUpdated && lastServerUpdated && new Date(lastUpdated) > new Date(lastServerUpdated)) {
          location.reload();
        }
      } catch (err) {
        console.error('Auto-refresh check failed:', err);
      }
    }

    function startAutoRefresh() {
      if (refreshInterval) clearInterval(refreshInterval);
      refreshInterval = setInterval(checkForUpdates, 30000);
    }

    async function doRefresh(force = false) {
      if (!chatId) return;
      if (refetch) { refetch.disabled = true; refetch.textContent = 'Fetching...'; }
      const forceBtn = document.getElementById('refetch-force');
      if (forceBtn) { forceBtn.disabled = true; }
      if (statusBar) { statusBar.textContent = 'Fetching from LINE…'; statusBar.classList.add('active'); }
      
      try {
        // Step 1: Fetch from LINE
        const fetchUrl = '/api/yomi/fetch?chat=' + encodeURIComponent(chatId);
        const fetchRes = await fetch(fetchUrl, { method: 'POST' });
        const fetchData = await fetchRes.json();
        if (!fetchRes.ok || !fetchData.ok) throw new Error(fetchData.error || 'Fetch failed');
        
        if (statusBar) statusBar.textContent = 'Processing...';
        if (refetch) refetch.textContent = 'Processing...';
        
        // Step 2: Process and summarize
        const processUrl = '/api/yomi/process?chat=' + encodeURIComponent(chatId) + (force ? '&force=true' : '');
        const processRes = await fetch(processUrl, { method: 'POST' });
        const processData = await processRes.json();
        if (!processRes.ok || !processData.ok) throw new Error(processData.error || 'Process failed');
        
        if (statusBar) statusBar.textContent = 'Updated. Reloading…';
        location.reload();
      } catch (err) {
        if (statusBar) statusBar.textContent = 'Refresh failed: ' + err.message;
        if (refetch) { refetch.disabled = false; refetch.textContent = 'Refresh'; }
        if (forceBtn) { forceBtn.disabled = false; }
      }
    }
    if (refetch && chatId) {
      refetch.addEventListener('click', () => doRefresh(false));
    } else if (refetch) {
      refetch.style.display = 'none';
    }
    
    const forceBtn = document.getElementById('refetch-force');
    if (forceBtn && chatId) {
      forceBtn.addEventListener('click', () => doRefresh(true));
    } else if (forceBtn) {
      forceBtn.style.display = 'none';
    }

    async function initAutoRefresh() {
      if (!chatId) return;
      try {
        const res = await fetch('/api/yomi/last-updated', { credentials: 'include' });
        if (res.ok) {
          const { lastUpdated } = await res.json();
          lastServerUpdated = lastUpdated;
          startAutoRefresh();
        }
      } catch (err) {
        console.error('Failed to init auto-refresh:', err);
      }
    }
    initAutoRefresh();

    async function analyzeMedia(btn) {
      const msgId = btn.dataset.msgId;
      const mediaType = btn.dataset.mediaType;
      const chatId = new URLSearchParams(location.search).get('chat');
      
      if (!msgId || !chatId) {
        console.error('Missing msgId or chatId');
        return;
      }
      
      // Disable button and show loading state
      btn.disabled = true;
      const originalText = btn.textContent;
      btn.textContent = 'Analyzing...';
      
      // Create or update analysis display
      let analysisDiv = btn.parentElement.querySelector('.media-analysis');
      if (!analysisDiv) {
        analysisDiv = document.createElement('div');
        analysisDiv.className = 'media-analysis loading';
        btn.parentElement.appendChild(analysisDiv);
      } else {
        analysisDiv.className = 'media-analysis loading';
      }
      analysisDiv.textContent = 'AI analysis in progress...';
      
      try {
        // Start analysis job
        const res = await fetch('/api/yomi/media/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chatId, messageId: msgId, mediaType }),
          credentials: 'include'
        });
        
        if (!res.ok) {
          const error = await res.json();
          throw new Error(error.error || 'Analysis request failed');
        }
        
        const { jobId } = await res.json();
        
        // Poll for job completion
        pollAnalysisJob(jobId, btn, analysisDiv, originalText);
        
      } catch (err) {
        console.error('Media analysis failed:', err);
        analysisDiv.className = 'media-analysis';
        analysisDiv.textContent = 'Analysis failed: ' + err.message;
        btn.disabled = false;
        btn.textContent = originalText;
      }
    }
    
    async function pollAnalysisJob(jobId, btn, analysisDiv, originalText) {
      const maxAttempts = 60; // 2 minutes with 2-second intervals
      let attempts = 0;
      
      const poll = async () => {
        attempts++;
        
        try {
          const res = await fetch(`/api/yomi/media/analyze/status?job=${jobId}`, { credentials: 'include' });
          if (!res.ok) throw new Error('Status check failed');
          
          const { job } = await res.json();
          
          if (job.status === 'completed') {
            analysisDiv.className = 'media-analysis';
            analysisDiv.textContent = 'AI: ' + job.analysisResult;
            btn.textContent = '✓ Analyzed';
            btn.disabled = true;
            // Refresh message data to get updated media_analysis field
            setTimeout(() => location.reload(), 1000);
          } else if (job.status === 'failed') {
            analysisDiv.className = 'media-analysis';
            const errorMsg = job.errorMessage || 'Analysis failed';
            // Check for rate limiting
            if (errorMsg.includes('quota') || errorMsg.includes('429')) {
              analysisDiv.textContent = 'Rate limited. Try again later.';
            } else {
              analysisDiv.textContent = 'Analysis failed: ' + errorMsg.substring(0, 100);
            }
            btn.disabled = false;
            btn.textContent = originalText;
          } else if (attempts >= maxAttempts) {
            analysisDiv.className = 'media-analysis';
            analysisDiv.textContent = 'Analysis timed out';
            btn.disabled = false;
            btn.textContent = originalText;
          } else {
            // Continue polling
            setTimeout(poll, 2000);
          }
        } catch (err) {
          console.error('Polling failed:', err);
          analysisDiv.className = 'media-analysis';
          analysisDiv.textContent = 'Status check failed: ' + err.message;
          btn.disabled = false;
          btn.textContent = originalText;
        }
      };
      
      poll();
    }

    const replyForm = document.getElementById('reply-form');
    const replyInput = document.getElementById('reply-input');
    const replySend = document.getElementById('reply-send');

    if (replyForm && chatId) {
      replyForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = replyInput.value.trim();
        if (!text) return;
        replySend.disabled = true;
        replySend.textContent = 'Sending...';
        try {
          const res = await fetch('/api/yomi/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chatId, text }),
            credentials: 'include'
          });
          const data = await res.json();
          if (!res.ok || !data.ok) {
            throw new Error(data.error || res.statusText);
          }
          replyInput.value = '';
          if (statusBar) {
            statusBar.textContent = 'Message sent. Refreshing…';
            statusBar.classList.add('active');
          }
          setTimeout(() => location.reload(), 500);
        } catch (err) {
          if (statusBar) {
            statusBar.textContent = 'Send failed: ' + err.message;
            statusBar.classList.add('active');
          }
          replySend.disabled = false;
          replySend.textContent = 'Send';
        }
      });

      replyInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          replyForm.dispatchEvent(new Event('submit'));
        }
      });
    } else if (replyForm) {
      replyForm.style.display = 'none';
    }

    const scrollCtrls = document.getElementById('scroll-ctrls');
    if (scrollCtrls) {
      scrollCtrls.addEventListener('click', (e) => {
        const btn = e.target.closest('#scroll-ctrls button');
        if (!btn) return;
        const panel = document.getElementById('messages');
        if (!panel) return;
        const dir = btn.dataset.dir;
        const page = panel.clientHeight * 0.85;
        if (dir === 'top') panel.scrollTo({ top: 0, behavior: 'smooth' });
        if (dir === 'up') panel.scrollBy({ top: -page, behavior: 'smooth' });
        if (dir === 'down') panel.scrollBy({ top: page, behavior: 'smooth' });
        if (dir === 'last') doRefresh();
      });
    }

    load();
  </script>
</body>
