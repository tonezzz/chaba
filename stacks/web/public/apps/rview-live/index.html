<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Live + RView</title>
  <style>
    :root { --bg: #0f172a; --panel: #1e293b; --text: #f8fafc; --muted: #94a3b8; --accent: #06b6d4; --danger: #ef4444; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; }
    body { display: flex; flex-direction: column; }
    header { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 1rem; background: #0b1120; border-bottom: 1px solid #334155; }
    h1 { margin: 0; font-size: 1rem; flex: 1; }
    button { font: inherit; font-size: 0.85rem; padding: 0.4rem 0.8rem; border-radius: 6px; border: none; background: var(--accent); color: #082f49; font-weight: 600; cursor: pointer; }
    button.secondary { background: #334155; color: var(--text); }
    button.danger { background: var(--danger); color: #fff; }
    main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; padding: 1rem; overflow: hidden; }
    .panel { background: var(--panel); border-radius: 8px; padding: 0.75rem; overflow: auto; display: flex; flex-direction: column; gap: 0.5rem; }
    .panel h2 { margin: 0; font-size: 0.8rem; color: var(--muted); text-transform: uppercase; }
    #log { flex: 1; overflow: auto; font-size: 0.8rem; line-height: 1.4; background: #020617; border-radius: 6px; padding: 0.5rem; }
    .log-entry { margin-bottom: 0.4rem; }
    .log-entry .ts { color: #64748b; margin-right: 0.4rem; }
    .log-entry.user { color: #38bdf8; }
    .log-entry.model { color: #a78bfa; }
    .log-entry.tool { color: #fbbf24; }
    .log-entry.error { color: var(--danger); }
    .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    .row { display: flex; gap: 0.5rem; }
    input, select { font: inherit; font-size: 0.85rem; padding: 0.35rem 0.5rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: var(--text); }
    iframe { width: 100%; flex: 1; border: none; border-radius: 6px; background: #020617; }
    #rviewStatus { font-size: 0.75rem; color: var(--muted); }
    #status { font-size: 0.75rem; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>Gemini Live + RView</h1>
    <div id="status">disconnected</div>
    <button id="toggleSession">Start</button>
    <button id="muteBtn" class="secondary" disabled>Mute</button>
  </header>
  <main>
    <div class="panel">
      <h2>Conversation</h2>
      <div id="log"></div>
      <div class="row">
        <input type="text" id="textInput" placeholder="Type a message...">
        <button id="sendText" class="secondary">Send</button>
      </div>
      <div class="controls">
        <label>Input:</label>
        <select id="audioInput"></select>
        <label>View:</label>
        <input type="text" id="viewId" value="default" style="width:90px">
        <button id="checkRview" class="secondary">RView status</button>
      </div>
    </div>
    <div class="panel">
      <h2>Remote View</h2>
      <iframe id="rviewFrame"></iframe>
      <div id="rviewStatus"></div>
    </div>
  </main>

<script>
  const WS_URL = window.GEMINI_WS_URL ||
    (location.hostname === 'localhost' && location.port !== '3002'
      ? 'ws://localhost:3002/ws'
      : '/api/rview-live/ws');
  const RVIEW_API = (location.hostname === 'localhost' && location.port !== '3007')
    ? 'http://localhost:3007/state'
    : '/apps/rview/api/state';
  document.getElementById('rviewFrame').src = `/apps/rview/index.html?api=${encodeURIComponent(RVIEW_API)}&view=default`;
  let ws = null;
  let audioCtx = null;
  let inputNode = null;
  let outputNode = null;
  let micStream = null;
  let isMuted = false;
  let outputQueue = [];

  function log(msg, cls = '') {
    const el = document.getElementById('log');
    const ts = new Date().toLocaleTimeString();
    el.innerHTML += `<div class="log-entry ${cls}"><span class="ts">${ts}</span>${esc(msg)}</div>`;
    el.scrollTop = el.scrollHeight;
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  function base64ToInt16(b64) {
    const bin = atob(b64);
    const arr = new Int16Array(bin.length / 2);
    const view = new DataView(new ArrayBuffer(bin.length));
    for (let i = 0; i < bin.length; i++) view.setUint8(i, bin.charCodeAt(i));
    for (let i = 0; i < arr.length; i++) arr[i] = view.getInt16(i * 2, true);
    return arr;
  }

  function int16ToBase64(int16) {
    const buf = new ArrayBuffer(int16.length * 2);
    const view = new DataView(buf);
    for (let i = 0; i < int16.length; i++) view.setInt16(i * 2, int16[i], true);
    let bin = '';
    const bytes = new Uint8Array(buf);
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }

  function floatToInt16(floats) {
    const out = new Int16Array(floats.length);
    for (let i = 0; i < floats.length; i++) {
      const s = Math.max(-1, Math.min(1, floats[i]));
      out[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
    }
    return out;
  }

  function int16ToFloat(int16) {
    const out = new Float32Array(int16.length);
    for (let i = 0; i < int16.length; i++) {
      out[i] = int16[i] / 0x7FFF;
    }
    return out;
  }

  async function listAudioInputs() {
    if (!navigator.mediaDevices) {
      log('mediaDevices unavailable — mic requires HTTPS or localhost', 'error');
      return;
    }
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const sel = document.getElementById('audioInput');
      sel.innerHTML = '';
      devices.filter(d => d.kind === 'audioinput').forEach(d => {
        const opt = document.createElement('option');
        opt.value = d.deviceId;
        opt.text = d.label || d.deviceId.slice(0, 8);
        sel.appendChild(opt);
      });
    } catch (e) {
      log('audio devices: ' + e.message, 'error');
    }
  }

  async function startMic() {
    if (micStream) return;
    if (!navigator.mediaDevices) {
      log('mic unavailable — use the text input instead', 'error');
      return;
    }
    try {
      const id = document.getElementById('audioInput').value;
      micStream = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: id ? { exact: id } : undefined, sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true } });
      audioCtx = new AudioContext({ sampleRate: 16000 });
      const source = audioCtx.createMediaStreamSource(micStream);
      const processor = audioCtx.createScriptProcessor(4096, 1, 1);
      processor.onaudioprocess = (e) => {
        if (isMuted || !ws || ws.readyState !== 1) return;
        const floats = e.inputBuffer.getChannelData(0);
        const pcm = floatToInt16(floats);
        ws.send(JSON.stringify({ type: 'audio', data: int16ToBase64(pcm) }));
      };
      source.connect(processor);
      processor.connect(audioCtx.destination);
      inputNode = processor;
    } catch (e) {
      log('mic error: ' + e.message, 'error');
    }
  }

  function stopMic() {
    if (inputNode) { try { inputNode.disconnect(); } catch(e){} inputNode = null; }
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
  }

  function startPlayback() {
    const outCtx = new AudioContext({ sampleRate: 24000 });
    const outProcessor = outCtx.createScriptProcessor(4096, 0, 1);
    outProcessor.onaudioprocess = (e) => {
      const out = e.outputBuffer.getChannelData(0);
      const needed = out.length;
      let written = 0;
      while (written < needed && outputQueue.length) {
        const chunk = outputQueue[0];
        const take = Math.min(chunk.length, needed - written);
        out.set(chunk.subarray(0, take), written);
        if (take === chunk.length) {
          outputQueue.shift();
        } else {
          outputQueue[0] = chunk.subarray(take);
        }
        written += take;
      }
      if (written < needed) {
        out.fill(0, written);
      }
    };
    outProcessor.connect(outCtx.destination);
    outputNode = { ctx: outCtx, node: outProcessor };
  }

  function stopPlayback() {
    if (outputNode) { try { outputNode.node.disconnect(); outputNode.ctx.close(); } catch(e){} outputNode = null; }
    outputQueue = [];
  }

  function playAudio(b64) {
    if (!outputNode) startPlayback();
    const int16 = base64ToInt16(b64);
    outputQueue.push(int16ToFloat(int16));
  }

  function connect() {
    if (ws) return;
    let url;
    if (WS_URL.startsWith('ws://') || WS_URL.startsWith('wss://')) {
      url = WS_URL;
    } else {
      const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      url = `${proto}//${window.location.host}${WS_URL}`;
    }
    ws = new WebSocket(url);
    ws.onopen = () => {
      document.getElementById('status').textContent = 'connected';
      log('Connected to Gemini Live', 'model');
    };
    ws.onclose = () => {
      document.getElementById('status').textContent = 'disconnected';
      log('Disconnected', 'error');
      ws = null;
      stopMic();
      stopPlayback();
      document.getElementById('toggleSession').textContent = 'Start';
      document.getElementById('muteBtn').disabled = true;
    };
    ws.onerror = (e) => log('WebSocket error', 'error');
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'server-content') {
        const sc = msg.content;
        if (sc.inputTranscription?.text) log('You: ' + sc.inputTranscription.text, 'user');
        if (sc.outputTranscription?.text) log('Gemini: ' + sc.outputTranscription.text, 'model');
        if (sc.modelTurn?.parts) {
          for (const part of sc.modelTurn.parts) {
            if (part.inlineData?.data) playAudio(part.inlineData.data);
          }
        }
      } else if (msg.type === 'tool-call') {
        log('Tool: ' + msg.calls.map(c => c.name).join(', '), 'tool');
      } else if (msg.type === 'error') {
        log('Error: ' + msg.message, 'error');
      } else if (msg.type === 'status') {
        document.getElementById('status').textContent = msg.message;
      }
    };
  }

  function disconnect() {
    if (ws) { ws.close(); }
  }

  document.getElementById('toggleSession').onclick = async () => {
    if (ws) {
      disconnect();
    } else {
      await startMic();
      connect();
      document.getElementById('toggleSession').textContent = 'Stop';
      document.getElementById('muteBtn').disabled = !navigator.mediaDevices;
    }
  };

  document.getElementById('muteBtn').onclick = () => {
    isMuted = !isMuted;
    document.getElementById('muteBtn').textContent = isMuted ? 'Unmute' : 'Mute';
  };

  document.getElementById('sendText').onclick = () => {
    const input = document.getElementById('textInput');
    const text = input.value.trim();
    if (!text || !ws) return;
    ws.send(JSON.stringify({ type: 'text', text }));
    input.value = '';
  };

  document.getElementById('textInput').onkeydown = (e) => { if (e.key === 'Enter') document.getElementById('sendText').click(); };

  async function refreshRview() {
    const viewId = document.getElementById('viewId').value || 'default';
    try {
      const res = await fetch(`${RVIEW_API}?action=status&view_id=${encodeURIComponent(viewId)}`);
      const data = await res.json();
      const st = document.getElementById('rviewStatus');
      if (data.ok && data.view) {
        const v = data.view;
        const item = v.current_item || {};
        st.textContent = `${v.state || 'stopped'} | ${item.media_type || '-'} | ${item.title || item.url || 'nothing'}`;
      } else {
        st.textContent = 'no view';
      }
    } catch (e) {
      document.getElementById('rviewStatus').textContent = 'error: ' + e.message;
    }
  }

  document.getElementById('checkRview').onclick = refreshRview;
  setInterval(refreshRview, 2000);

  if (navigator.mediaDevices) {
    navigator.mediaDevices.addEventListener('devicechange', listAudioInputs);
    listAudioInputs();
  } else {
    log('mic unavailable — text mode only (HTTPS or localhost required for audio)', 'error');
  }
</script>
</body>
</html>
