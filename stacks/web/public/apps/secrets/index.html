<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Secrets Console — credentials registry and login vault">
  <title>Secrets Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { bg: '#1a1a2e', card: '#16213e', accent: '#0a84ff' } } } };
  </script>
  <style>
    body { font-family: system-ui, sans-serif; }
    .badge { font-size: .68rem; padding: .1rem .45rem; border-radius: 9999px; }
    .p-consistent { background: rgba(52,211,153,.15); color: #34d399; }
    .p-DRIFT { background: rgba(248,113,113,.18); color: #f87171; }
    .p-empty, .p-error { background: rgba(251,191,36,.15); color: #fbbf24; }
    .s-high { color: #f87171; } .s-medium { color: #fbbf24; } .s-low { color: #9ca3af; }
    .slot-err { color: #f87171; } .slot-miss { color: #fbbf24; }
    dialog::backdrop { background: rgba(0,0,0,.6); }
    input, textarea, select { background: #0f1526; border: 1px solid #374151; border-radius: .375rem; padding: .4rem .6rem; font-size: .85rem; width: 100%; color: #e5e7eb; }
    button.act { background: #0a84ff22; border: 1px solid #0a84ff55; border-radius: .375rem; padding: .25rem .7rem; font-size: .78rem; }
    button.act:hover { background: #0a84ff44; }
    button.danger { border-color: #f8717155; background: #f8717118; }
  </style>
</head>
<body class="bg-bg text-gray-200 min-h-screen">
  <nav class="bg-card border-b border-gray-800">
    <div class="px-4 h-12 flex items-center gap-4">
      <b>Secrets Console</b>
      <button class="tab act" data-tab="creds">Credentials</button>
      <button class="tab act" data-tab="vault">Logins</button>
      <span id="ro" class="badge p-empty hidden">read-only</span>
      <span id="msg" class="text-xs text-gray-500 ml-auto"></span>
    </div>
  </nav>
  <main class="p-4 max-w-6xl mx-auto">
    <div id="tab-creds"></div>
    <div id="tab-vault" class="hidden">
      <div class="flex items-center gap-3 mb-3">
        <h2 class="font-semibold">Login vault</h2>
        <button class="act" onclick="showAdd()">+ Add login</button>
      </div>
      <div id="vault-list"></div>
    </div>
  </main>

  <dialog id="setdlg" class="bg-card text-gray-200 rounded-lg p-5 w-[30rem] border border-gray-700">
    <h3 class="font-semibold mb-1">Set value: <span id="set-title"></span></h3>
    <p class="text-xs text-gray-400 mb-3">Writes every slot for this credential on all hosts. Value is never shown back — fingerprint verify follows.</p>
    <input id="set-value" type="password" placeholder="new value" autocomplete="off" class="mb-2">
    <label class="flex items-center gap-2 text-xs mb-3"><input id="set-restart" type="checkbox" class="w-auto" checked> restart consumer services</label>
    <div class="flex gap-2 justify-end">
      <button class="act" onclick="document.getElementById('setdlg').close()">Cancel</button>
      <button class="act danger" onclick="doSet()">Write all slots</button>
    </div>
  </dialog>

  <dialog id="adddlg" class="bg-card text-gray-200 rounded-lg p-5 w-[30rem] border border-gray-700">
    <h3 class="font-semibold mb-3">Add login</h3>
    <div class="space-y-2">
      <input id="a-title" placeholder="title (e.g. router admin)">
      <input id="a-user" placeholder="username">
      <input id="a-url" placeholder="url">
      <input id="a-secret" type="password" placeholder="password / key" autocomplete="off">
      <input id="a-notes" placeholder="notes">
      <input id="a-tags" placeholder="tags (comma-separated)">
    </div>
    <div class="flex gap-2 justify-end mt-3">
      <button class="act" onclick="document.getElementById('adddlg').close()">Cancel</button>
      <button class="act" onclick="doAdd()">Save</button>
    </div>
  </dialog>

<script>
const $ = id => document.getElementById(id);
let CREDS = [], SET_ID = null;

function apiKey() {
  let k = sessionStorage.getItem('secrets_key');
  if (!k) { k = prompt('Console API key (write ops):'); if (k) sessionStorage.setItem('secrets_key', k); }
  return k || '';
}
function hdrs() { return {'Content-Type':'application/json', 'X-API-Key': apiKey()}; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ago(ts) { if (!ts) return '—'; const d = (Date.now()/1000 - ts)/86400; return d < 1 ? 'today' : d < 30 ? Math.floor(d)+'d ago' : Math.floor(d/30)+'mo ago'; }
function msg(t) { $('msg').textContent = t; setTimeout(() => $('msg').textContent = '', 8000); }

async function loadCreds() {
  const r = await fetch('api/credentials');
  const d = await r.json();
  CREDS = d.credentials || [];
  if (d.readonly) $('ro').classList.remove('hidden');
  $('tab-creds').innerHTML = CREDS.map(c => {
    const rows = c.slots.map(s => `
      <tr class="border-t border-gray-800">
        <td class="py-1 pr-3 text-gray-400">${esc(s.host)}</td>
        <td class="py-1 pr-3 font-mono text-xs">${esc(s.file)}${s.var ? ' · ' + esc(s.var) : ''}${s.type && s.type !== 'var' ? ' <span class="text-amber-400">[' + esc(s.type) + ']</span>' : ''}</td>
        <td class="py-1 pr-3 font-mono text-xs">${s.error ? '<span class="slot-err">err</span>' : s.present ? esc(s.fingerprint) : '<span class="slot-miss">empty</span>'}</td>
        <td class="py-1 pr-3 text-xs text-gray-500">${ago(s.mtime)}</td>
        <td class="py-1 text-xs text-gray-500">${esc(s.note || '')}</td>
      </tr>`).join('');
    const steps = (c.rotate && c.rotate.steps || []).map(s => `<li>${esc(s)}</li>`).join('');
    return `
    <div class="bg-card border border-gray-800 rounded-lg p-4 mb-3">
      <div class="flex items-center gap-3 flex-wrap">
        <b>${esc(c.title || c.id)}</b>
        <span class="badge p-${c.parity}">${c.parity}</span>
        <span class="badge s-${c.sensitivity || 'medium'}">${esc(c.kind || '')} · ${esc(c.sensitivity || '')}</span>
        <span class="ml-auto flex gap-2">
          <button class="act" onclick="verify('${esc(c.id)}')">verify</button>
          <button class="act" onclick="openSet('${esc(c.id)}')">set value</button>
        </span>
      </div>
      <table class="w-full mt-2 text-sm">${rows}</table>
      ${c.consumers.length ? `<div class="text-xs text-gray-500 mt-2">restarts: ${c.consumers.map(x => esc(x.host) + ':' + esc(x.unit)).join(', ')}</div>` : ''}
      ${steps ? `<details class="text-xs text-gray-400 mt-1"><summary>rotation steps</summary><ol class="list-decimal pl-5 mt-1">${steps}</ol>${c.rotate.url ? `<a class="text-accent" href="${esc(c.rotate.url)}" target="_blank">${esc(c.rotate.url)}</a>` : ''}</details>` : ''}
    </div>`;
  }).join('');
}

function openSet(id) { SET_ID = id; const c = CREDS.find(x => x.id === id); $('set-title').textContent = c.title || id; $('set-value').value = ''; $('setdlg').showModal(); }
async function doSet() {
  const value = $('set-value').value;
  if (!value) return;
  if (!confirm(`Write ${SET_ID} to ALL slots and ${$('set-restart').checked ? 'restart consumers' : 'no restarts'}?`)) return;
  $('setdlg').close();
  const r = await fetch(`api/credentials/${SET_ID}/set`, {method:'POST', headers:hdrs(), body: JSON.stringify({value, restart: $('set-restart').checked})});
  const d = await r.json();
  msg(r.ok ? `set ${SET_ID}: parity=${d.parity}` : `failed: ${d.detail || r.status}`);
  loadCreds();
}
async function verify(id) {
  const r = await fetch(`api/credentials/${id}/verify`, {method:'POST'});
  const d = await r.json();
  msg(`${id}: ${d.parity}`);
  loadCreds();
}

async function loadVault() {
  const r = await fetch('api/vault');
  const d = await r.json();
  $('vault-list').innerHTML = (d.entries || []).map(e => `
    <div class="bg-card border border-gray-800 rounded-lg p-3 mb-2 flex items-center gap-3">
      <div class="flex-1">
        <b>${esc(e.title)}</b>
        <span class="text-xs text-gray-400 ml-2">${esc(e.username || '')} ${e.url ? '· ' + esc(e.url) : ''}</span>
        ${e.tags ? `<span class="text-xs text-gray-500 ml-2">${e.tags.map(esc).join(', ')}</span>` : ''}
        ${e.notes ? `<div class="text-xs text-gray-500">${esc(e.notes)}</div>` : ''}
      </div>
      <button class="act" onclick="reveal('${esc(e.id)}')">reveal</button>
      <button class="act danger" onclick="del('${esc(e.id)}')">✕</button>
    </div>`).join('') || '<div class="text-gray-500 text-sm">vault empty</div>';
}
async function reveal(id) {
  const r = await fetch(`api/vault/${id}/reveal`, {method:'POST', headers:hdrs()});
  const d = await r.json();
  if (!r.ok) { msg(`reveal failed: ${d.detail || r.status}`); return; }
  await navigator.clipboard.writeText(d.secret || '');
  msg(`copied ${id} secret to clipboard`);
}
async function del(id) {
  if (!confirm(`Delete vault entry ${id}?`)) return;
  await fetch(`api/vault/${id}`, {method:'DELETE', headers:hdrs()});
  loadVault();
}
function showAdd() { $('adddlg').showModal(); }
async function doAdd() {
  const body = {title: $('a-title').value, username: $('a-user').value, url: $('a-url').value,
                secret: $('a-secret').value, notes: $('a-notes').value,
                tags: $('a-tags').value.split(',').map(s => s.trim()).filter(Boolean)};
  const r = await fetch('api/vault', {method:'POST', headers:hdrs(), body: JSON.stringify(body)});
  if (r.ok) { $('adddlg').close(); loadVault(); } else msg('add failed: ' + r.status);
}

document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('main > div').forEach(d => d.classList.add('hidden'));
  $('tab-' + b.dataset.tab).classList.remove('hidden');
});
loadCreds(); loadVault();
</script>
</body>
</html>
