services:
  mddb:
    image: tradik/mddb:latest
    container_name: mddb
    restart: unless-stopped
    command:
      - "-http-enabled=true"
      - "-http-addr=0.0.0.0:11023"
      - "-grpc-enabled=true"
      - "-grpc-addr=0.0.0.0:11024"
      - "-mcp-enabled=true"
      - "-mcp-addr=0.0.0.0:9000"
      - "-mcp-stdio=false"
      - "-mode=wr"
    ports:
      - "11023:11023"  # HTTP/REST API
      - "11024:11024"  # gRPC API
      - "9001:9000"    # MCP Server (changed from 9000 due to conflict)
    volumes:
      - ./vaults:/vaults
      - mddb-data:/app/data
    environment:
      - MDDB_LOG_LEVEL=INFO
      - TZ=Asia/Bangkok
      - MDDB_PRODUCTION=false
      - MDDB_AUTH_ENABLED=false
      - MDDB_TLS_ENABLED=false
      - MDDB_CORS_ORIGINS=*
      - MDDB_AUDIT_ENABLED=false
      - MDDB_RATE_LIMIT_ENABLED=false
      - MDDB_EMBEDDING_PROVIDER=ollama
      - MDDB_EMBEDDING_API_URL=http://gemini:11435
      - MDDB_EMBEDDING_MODEL=nomic-embed-text
      - MDDB_EMBEDDING_DIMENSIONS=768
    networks:
      - default
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=mddb"

  mddb-panel:
    image: tradik/mddb:panel-latest
    container_name: mddb-panel
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - MDDB_SERVER=http://mddb:11023
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      - mddb
    networks:
      - default
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=mddb"

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - default
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=mddb"

  gemini-ollama-proxy:
    image: node:22-alpine
    container_name: gemini-ollama-proxy
    restart: unless-stopped
    working_dir: /app
    command: ["node", "gemini-ollama-proxy.mjs"]
    ports:
      - "11435:11435"
    env_file:
      - .env
    environment:
      - GEMINI_EMBEDDING_MODEL=gemini-embedding-002
      - GEMINI_EMBEDDING_FALLBACK_MODEL=gemini-embedding-001
    volumes:
      - ../../../scripts/mddb:/app
    networks:
      default:
        aliases:
          - gemini
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:11435/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=mddb"

volumes:
  mddb-data:
    driver: local
  ollama-data:
    driver: local

networks:
  default:
    name: web_default
    external: true