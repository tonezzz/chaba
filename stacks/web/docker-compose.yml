services:
  web:
    container_name: web
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./public:/srv/public
      - /home/tony/CascadeProjects/chaba-omen/stacks/web/public/tony-omen:/srv/public/tony-omen
      - /home/tony/CascadeProjects/chaba-h3/public:/srv/public/chaba-h3
      - /home/tony/CascadeProjects/chaba/docs:/srv/docs
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - frigate_default

  status-api:
    container_name: status-api
    build:
      context: /home/tony/CascadeProjects/chaba-omen/stacks/web/status-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - REPO_PATH=/repo
      - FRIGATE_URL=http://frigate:5000
    volumes:
      - ../..:/repo
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - /sys/class/thermal:/sys/class/thermal:ro
      - /sys/class/hwmon:/sys/class/hwmon:ro
      - /sys/devices/platform/hp-wmi:/sys/devices/platform/hp-wmi:rw
      - /sys/devices/system/cpu/intel_pstate:/sys/devices/system/cpu/intel_pstate:rw
      - /home/tony/CascadeProjects/chaba-omen/stacks/web/status-api/main.py:/app/main.py:ro
    privileged: true
    networks:
      - default
      - frigate_default
    external_links:
      - web:web
      - web_default

  trade-api:
    container_name: trade-api
    build:
      context: /home/tony/CascadeProjects/trade
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=trade
      - DB_USER=chaba
      - DB_PASSWORD=chabapass
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy

  camera-control:
    container_name: camera-control
    build:
      context: ./camera-control
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ../..:/repo
    networks:
      - default

  bserver:
    container_name: bserver
    build:
      context: ./bserver
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    environment:
      - HTTP_ADDR=:8092
      - HTTPS_ADDR=:8443
    volumes:
      - ./bserver-www/_config.yaml:/srv/www/_config.yaml:ro
      - ./bserver-www/default:/srv/www/default
    networks:
      - default

  imagen2-inference:
    container_name: imagen2-inference
    build:
      context: /home/tony/CascadeProjects/chaba-h3/inference2
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - MODEL_ID=stabilityai/stable-diffusion-xl-base-1.0
      - VAE_ID=madebyollin/sdxl-vae-fp16-fix
    volumes:
      - /home/tony/.cache/huggingface:/root/.cache/huggingface
      - /home/tony/CascadeProjects/chaba-h3/inference2/main.py:/app/main.py:ro
      - /home/tony/CascadeProjects/chaba-h3/inference2/data:/app/data
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - default

  txt2vid-inference:
    container_name: txt2vid-inference
    build:
      context: /home/tony/CascadeProjects/chaba-h3/inference-cogvideo
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - MODEL_ID=a-r-r-o-w/LTX-Video-diffusers
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    volumes:
      - /home/tony/.cache/huggingface:/root/.cache/huggingface
      - /home/tony/CascadeProjects/chaba-h3/inference-cogvideo/main.py:/app/main.py:ro
      - /home/tony/CascadeProjects/chaba-h3/inference-cogvideo/data:/app/data
    ports:
      - "8002:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - default

  thai-legal-inference:
    container_name: thai-legal-inference
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    restart: unless-stopped
    command:
      - "--models-dir"
      - "/models"
      - "--models-max"
      - "2"
      - "--models-autoload"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--n-gpu-layers"
      - "${LLAMA_N_GPU_LAYERS:-auto}"
      - "--alias"
      - "thai-legal:thai-legal-gemma-4b-cpt.Q4_K_M.gguf,phi-3:Phi-3-mini-4k-instruct-q4.gguf"
    volumes:
      - /data/gguf:/models:ro
    ports:
      - "8001:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - default

  postgres:
    container_name: postgres
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: redis
    image: redis:7.4-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  activepieces:
    container_name: activepieces
    image: ghcr.io/activepieces/activepieces:latest
    restart: unless-stopped
    environment:
      - AP_DB_TYPE=POSTGRES
      - AP_POSTGRES_DATABASE=activepieces
      - AP_POSTGRES_USERNAME=activepieces
      - AP_POSTGRES_PASSWORD=${AP_POSTGRES_PASSWORD}
      - AP_POSTGRES_HOST=postgres
      - AP_POSTGRES_PORT=5432
      - AP_REDIS_URL=redis://redis:6379
      - AP_ENCRYPTION_KEY=${AP_ENCRYPTION_KEY}
      - AP_JWT_SECRET=${AP_JWT_SECRET}
      - AP_FRONTEND_URL=http://tony-omen.local:8080/apps/activepieces
    volumes:
      - ./activepieces-index.html:/usr/src/app/dist/packages/web/index.html:ro
    depends_on:
      - postgres
      - redis
    networks:
      - default

  gpu-queue:
    container_name: gpu-queue
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app/gpu-queue
    command: npm start
    volumes:
      - ../../scripts/gpu-queue:/app/gpu-queue
    environment:
      - DATABASE_URL=postgres://chaba:chabapass@postgres:5432/chaba
      - GPU_QUEUE_PORT=3001
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy

  weaviate:
    container_name: weaviate
    image: semitechnologies/weaviate:latest
    restart: unless-stopped
    ports:
      - "8082:8080"
    volumes:
      - weaviate_data:/var/lib/weaviate
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - DEFAULT_VECTORIZER_MODULE=none
      - CLUSTER_HOSTNAME=node1
    networks:
      - default

  weaviate-search:
    container_name: weaviate-search
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app/weaviate-search
    command: npm start
    volumes:
      - ../../scripts/weaviate:/app/weaviate-search
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - WEAVIATE_URL=http://weaviate:8080
      - EMBEDDING_SERVICE_URL=http://embedding-service:5000
      - PORT=3002
    ports:
      - "3002:3002"
    networks:
      - default
    depends_on:
      - weaviate
      - embedding-service

  embedding-service:
    container_name: embedding-service
    build:
      context: ../../scripts/embeddings
      dockerfile: Dockerfile
    runtime: nvidia
    restart: unless-stopped
    environment:
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - BATCH_SIZE=32
      - PORT=5000
      - NVIDIA_VISIBLE_DEVICES=all
    ports:
      - "5000:5000"
    networks:
      - default
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  netdata:
    container_name: netdata
    image: netdata/netdata:stable
    hostname: netdata
    ports:
      - "19999:19999"
    volumes:
      - netdata_config:/etc/netdata
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    restart: unless-stopped
    networks:
      - default

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  weaviate_data:
  netdata_config:
  netdata_lib:
  netdata_cache:

networks:
  frigate_default:
    external: true
