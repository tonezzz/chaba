services:
  web:
    container_name: web
    image: caddy:latest
    restart: unless-stopped
    env_file:
    - .env
    ports:
    - 127.0.0.1:8080:8080
    - 127.0.0.1:8081:8081
    volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile
    - ./public:/srv/public
    - /home/tony/CascadeProjects/chaba-h3-tony-dell/public:/srv/public/chaba-h3
    - /home/tony/CascadeProjects/chaba-tony-dell/docs:/srv/docs
    - caddy_data:/data
    - caddy_config:/config
    extra_hosts:
    - host.docker.internal:host-gateway
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
    - default
    - frigate_default
    profiles:
    - production
  netdata:
    container_name: netdata
    image: netdata/netdata:stable
    restart: unless-stopped
    pid: host
    ports:
    - 19999:19999
    environment:
    - NETDATA_DISABLE=ebpf,nfacct,perf
    volumes:
    - /proc:/host/proc:ro
    - /sys:/host/sys:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - /etc/os-release:/host/etc/os-release:ro
    cap_add:
    - SYS_PTRACE
    - SYS_ADMIN
    security_opt:
    - apparmor=unconfined
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities:
            - gpu
    networks:
    - default
  sensor-reader:
    container_name: sensor-reader
    build:
      context: ./sensor-reader
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
    - 8001:8001
    environment:
    - REPO_PATH=/repo
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=all
    runtime: nvidia
    volumes:
    - ../..:/repo
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - /sys/class/thermal:/sys/class/thermal:ro
    - /sys/class/hwmon:/sys/class/hwmon:ro
    - /sys/devices/platform/hp-wmi:/sys/devices/platform/hp-wmi:rw
    - /sys/devices/system/cpu/intel_pstate:/sys/devices/system/cpu/intel_pstate:rw
    - ./sensor-reader/main.py:/app/main.py:ro
    privileged: true
    networks:
    - default
    - frigate_default
volumes:
  caddy_data: null
  caddy_config: null
networks:
  frigate_default:
    external: true
  ai_default:
    external: true
