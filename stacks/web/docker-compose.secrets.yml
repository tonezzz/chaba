# Production Secrets Management
# This file demonstrates Docker secrets for secure secret management
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.secrets.yml --profile production up -d

# Prerequisites:
# 1. Create secrets directory: mkdir -p secrets
# 2. Generate secret files with actual values
# 3. Set proper permissions: chmod 600 secrets/*

services:
  postgres:
    secrets:
      - postgres_password
      - postgres_user
      - postgres_db

  redis:
    # Redis doesn't use secrets in this example, but could be added
    # for Redis AUTH password if needed

  activepieces:
    secrets:
      - ap_encryption_key
      - ap_jwt_secret
      - ap_postgres_password

  yomi-api:
    secrets:
      - gemini_api_key
      - postgres_password
      - postgres_user
      - postgres_db

  helm:
    secrets:
      - postgres_password
      - postgres_user
      - postgres_db

  trade-api:
    secrets:
      - postgres_password
      - postgres_user
      - postgres_db

  gpu-queue:
    secrets:
      - postgres_password
      - postgres_user
      - postgres_db

  gpu-queue-processor:
    secrets:
      - postgres_password
      - postgres_user
      - postgres_db

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  postgres_user:
    file: ./secrets/postgres_user.txt
  postgres_db:
    file: ./secrets/postgres_db.txt
  ap_encryption_key:
    file: ./secrets/ap_encryption_key.txt
  ap_jwt_secret:
    file: ./secrets/ap_jwt_secret.txt
  ap_postgres_password:
    file: ./secrets/ap_postgres_password.txt
  gemini_api_key:
    file: ./secrets/gemini_api_key.txt
  openai_api_key:
    file: ./secrets/openai_api_key.txt

# Environment variable references in services would be updated to use secrets:
# Example for postgres:
# environment:
#   - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
#   - POSTGRES_USER_FILE=/run/secrets/postgres_user
#   - POSTGRES_DB_FILE=/run/secrets/postgres_db
