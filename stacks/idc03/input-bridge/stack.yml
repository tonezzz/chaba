id: input-bridge
host: idc03
description: >-
  input-bridge container — bridges input events; node:22-alpine,
  ~/apps/input-bridge code, state in ~/.local/share/input-bridge.
verify: >-
  systemctl --user is-active input-bridge | grep -q active
secrets:
  - "~/.config/secrets/input-bridge.env"
requires:
  - "tool:podman"
state:
  - "~/apps/input-bridge — app code"
  - "~/.local/share/input-bridge — runtime state (displays/camwall/
     percussion + nodes.json fleet enroll registry)"
ports:
  - "3010 — bridge API (wildcard); POST /enroll is the public fleet
     report-back (api./app.surf-thailand.com/enroll via caddy-edge),
     GET /nodes reads the enrolled-node registry"
restore: "Standby copy on idc01 (stopped)."
related_cards: [idc01-return-role]
status: deployed
deployed: 2026-10-05
