doc: solar-system-kk
version: v2-fact-checked
status: tony-approved-v2
fact_check_sources:
  - https://science.nasa.gov/venus/venus-facts/
  - https://science.nasa.gov/solar-system/facts
  - https://science.nasa.gov/solar-system/kuiper-belt/facts/
language_primary: th
language_parallel: en
narrator: tony-clone-vyncx   # ref: voice-bench tony 20261010-201750.ogg 8.35s
pace_note: >
  Narration-first timing. ~3.0s per LTX shot (73f @24fps). TH beats written
  to ~3-4s each at gentle doc pace; EN parallel kept to same beat count so
  both cuts share the shot list.
shots:
  - shot: 1
    scene: hook
    th: "นี่คือบ้านของเรา โลกสีฟ้าใบเล็ก"
    en: "This is our home — a small blue Earth."
    est_s: 3
  - shot: 2
    scene: depart
    th: "แต่โลกเป็นเพียงจุดหนึ่ง ในครอบครัวที่ยิ่งใหญ่กว่านี้"
    en: "But Earth is just one point in a much bigger family."
    est_s: 4
  - shot: 3
    scene: sun
    th: "ศูนย์กลางของทุกสิ่ง คือดวงอาทิตย์"
    en: "At the center of everything is the Sun."
    est_s: 3
  - shot: 4
    scene: sun
    th: "ดาวฤกษ์ที่ให้แสงสว่าง และความอบอุ่นแก่เราทุกคน"
    en: "The star that gives light and warmth to us all."
    est_s: 4
  - shot: 5
    scene: mercury
    th: "ดาวพุธ ดาวเคราะห์ที่อยู่ใกล้ดวงอาทิตย์ที่สุด"
    en: "Mercury — the planet closest to the Sun."
    est_s: 3
  - shot: 6
    scene: venus
    th: "ดาวศุกร์ ร้อนที่สุดในระบบสุริยะ ใต้เมฆกรดซัลฟิวริกหนาทึบ"
    en: "Venus is the hottest planet, beneath dense sulfuric-acid clouds."
    est_s: 4
  - shot: 7
    scene: earth
    th: "โลกคือที่เดียวในระบบสุริยะที่เราพบสิ่งมีชีวิต"
    en: "Earth is the only place where we have found life in our solar system."
    est_s: 4
  - shot: 8
    scene: mars
    th: "ดาวอังคาร โลกสีแดงที่มนุษย์ฝันจะไปเยือน"
    en: "Mars — the red world humans dream of visiting."
    est_s: 3
  - shot: 9
    scene: jupiter
    th: "ดาวพฤหัสบดี ยักษ์ใหญ่แห่งระบบสุริยะ"
    en: "Jupiter — the giant of the solar system."
    est_s: 3
  - shot: 10
    scene: jupiter
    th: "พายุหมุนอันยิ่งใหญ่ ใหญ่กว่าโลกทั้งใบ"
    en: "A churning storm larger than the entire Earth."
    est_s: 3
  - shot: 11
    scene: saturn
    th: "ดาวเสาร์ เจ้าแห่งวงแหวนอันงดงาม"
    en: "Saturn — the lord of the beautiful rings."
    est_s: 3
  - shot: 12
    scene: saturn
    th: "วงแหวนของน้ำแข็งและหิน นับล้านชิ้น"
    en: "Rings made of ice and rock — millions of pieces."
    est_s: 3
  - shot: 13
    scene: uranus
    th: "ดาวยูเรนัส ดาวเคราะห์น้ำแข็งที่หมุนตะแคงข้าง"
    en: "Uranus — an ice giant rolling on its side."
    est_s: 3
  - shot: 14
    scene: neptune
    th: "ดาวเนปจูน ไกลและหนาวเย็นที่สุด ลมแรงกว่าพายุใดๆ"
    en: "Neptune — the farthest, coldest world, with winds beyond any storm."
    est_s: 4
  - shot: 15
    scene: kuiper
    th: "ไกลออกไปคือแถบไคเปอร์ แหล่งรวมวัตถุน้ำแข็ง"
    en: "Farther out lies the Kuiper Belt, home to icy bodies."
    est_s: 4
  - shot: 16
    scene: orrery
    th: "ทั้งหมดหมุนรอบดวงอาทิตย์ ในจังหวะที่สมบูรณ์แบบ"
    en: "All of it turning around the Sun in perfect rhythm."
    est_s: 4
  - shot: 17
    scene: dot
    th: "จากที่ไกลแสนไกล โลกกลายเป็นเพียงจุดสีฟ้าจางๆ"
    en: "From so very far away, Earth becomes a faint pale blue dot."
    est_s: 4
  - shot: 18
    scene: home
    th: "บ้านหลังเดียวของเรา ในจักรวาลอันกว้างใหญ่"
    en: "Our only home — in a vast, wide universe."
    est_s: 4
totals:
  shots: 18
  est_seconds: 62
  est_render_frames: 1314   # 18 x 73
