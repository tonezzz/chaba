# PyTorch GPU Inference (ResNet-18, ~1.2GB VRAM)
# Small model that fits comfortably in GTX 1650's 4GB alongside the
# persistent bge-rerank service (~2.2GB), leaving ~1.8GB for jobs.
#
# Dispatch: python3 queue/queue_manager.py enqueue \
#   --image pytorch/pytorch:2.1.0-cuda12.1-cudnn8-runtime \
#   --cmd "python /app/infer.py" \
#   --gpus 1 --min-vram 2 --require-tags gpu ...
#
# Or via a spec file passed to the queue playbook:
#   ansible-playbook playbooks/queue_operations.yml \
#     -e operation=enqueue \
#     -e job_spec_file=/home/tony/ansible/jobs/examples/gpu-torch-inference.yaml

job_id: "gpu-resnet18-{{ '%Y%m%d-%H%M' | strftime }}"
job_image: "docker.io/pytorch/pytorch:2.1.0-cuda12.1-cudnn8-runtime"
job_cmd: >
  python -c "
  import torch, torchvision, time
  print('CUDA available:', torch.cuda.is_available())
  print('Device:', torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'CPU')
  model = torchvision.models.resnet18(weights='IMAGENET1K_V1').cuda().eval()
  x = torch.randn(8, 3, 224, 224).cuda()
  t = time.time()
  with torch.no_grad():
      for _ in range(10):
          y = model(x)
  torch.cuda.synchronize()
  print(f'10 batches of 8 images: {time.time()-t:.2f}s')
  print(f'VRAM allocated: {torch.cuda.max_memory_allocated()/1024**3:.2f} GB')
  print(f'Output shape: {y.shape}')
  print('GPU INFERENCE OK')
  "

job_gpus: 1
job_min_vram_gb: 2
job_max_load_pct: 1000  # see GPU-JOBS.md — raw load1 needs oversubscription on omen
job_max_mem_pct: 90
job_timeout_sec: 1800

job_require_tags: ["gpu"]
job_exclude_tags: ["laptop"]
target_group: "all"
priority: 5
user: "tony"
project: "ml-inference"

container_runtime: "podman"
sidecar_redis_host: "100.123.163.11"