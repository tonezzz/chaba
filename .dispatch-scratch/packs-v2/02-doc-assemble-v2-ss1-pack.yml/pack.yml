# Rebuild a non-truncated v2 cut from the existing 18 shots and repaired
# v2 VO clips. This preserves the original v1 files for comparison.
name: 02-doc-assemble-v2-ss1
needs:
  gpu_gb: 0
  disk_gb: 5
venv: true
timeout_s: 1200
fetch:
  - doc-pilot/shots/
  - doc-pilot/vo/
  - doc-pilot/vo-v2/
artifacts:
  - packs/02-doc-assemble-v2-ss1/final/ss1-final-v2.mp4
  - packs/02-doc-assemble-v2-ss1/assemble-report-v2.md
publish:
  final: doc-pilot/final-v2
  assemble-report-v2.md: doc-pilot/final-v2
prep: |
  command -v ffmpeg >/dev/null || (apt-get update -qq && apt-get install -y -qq ffmpeg)
  pip install -q soundfile numpy
run: |
  import os, subprocess
  import numpy as np
  import soundfile as sf

  ROOT = NEST_ROOT
  SHOTS = f'{ROOT}/doc-pilot/shots'
  VO = f'{ROOT}/doc-pilot/vo'
  VO_V2 = f'{ROOT}/doc-pilot/vo-v2'
  OUT = f'{PACK_DIR}/final'
  TMP = f'{PACK_DIR}/tmp'
  os.makedirs(OUT, exist_ok=True)
  os.makedirs(TMP, exist_ok=True)
  report = ['# Solar-system documentary — assembly v2', '',
            '| shot | video | VO | duration_s | finite |',
            '|---:|---|---|---:|---|']
  videos, voices, missing, invalid = [], [], [], []
  for n in range(1, 19):
      video = f'{SHOTS}/ss1-shot{n:02d}.mp4'
      v2 = f'{VO_V2}/ss1-vo-{n:02d}-v2.wav'
      original = f'{VO}/ss1-vo-{n:02d}.wav'
      voice = v2 if n in (4, 8) else original
      if not (os.path.isfile(video) and os.path.isfile(voice)):
          missing.append(n)
          report.append(f'| {n} | {os.path.isfile(video)} | '
                        f'{os.path.isfile(voice)} | - | no |')
          continue
      wav, sr = sf.read(voice, dtype='float32')
      finite = bool(np.isfinite(wav).all())
      report.append(f'| {n} | {os.path.basename(video)} | '
                    f'{os.path.basename(voice)} | {len(wav)/sr:.2f} | '
                    f'{"yes" if finite else "NO"} |')
      if not finite:
          invalid.append(n)
          continue
      videos.append(video)
      voices.append(wav)
  if missing or invalid:
      open(f'{PACK_DIR}/assemble-report-v2.md', 'w').write(
          '\n'.join(report + ['', f'missing={missing}', f'nonfinite={invalid}']) + '\n')
      raise SystemExit(f'missing={missing}, nonfinite={invalid}')

  # Re-encode to uniform H.264 parameters before muxing the narration.
  concat = f'{TMP}/shots-v2.txt'
  open(concat, 'w').write(''.join(f"file '{v}'\n" for v in videos))
  vcat = f'{TMP}/video-v2.mp4'
  subprocess.run(['ffmpeg', '-y', '-f', 'concat', '-safe', '0', '-i', concat,
                  '-c:v', 'libx264', '-pix_fmt', 'yuv420p', '-r', '24', vcat],
                 check=True, capture_output=True)

  gap = np.zeros(int(24000 * 0.3), dtype='float32')
  parts = []
  for wav in voices:
      parts.extend((wav, gap))
  audio = np.concatenate(parts[:-1])
  audio_path = f'{TMP}/vo-v2.wav'
  sf.write(audio_path, audio, 24000)
  dur_audio = len(audio) / 24000
  dur_video = float(subprocess.run(
      ['ffprobe', '-v', 'quiet', '-show_entries', 'format=duration',
       '-of', 'csv=p=0', vcat], capture_output=True, text=True,
      check=True).stdout.strip())

  # tpad stop_duration is seconds; stop alone is a frame count.
  pad_s = max(0.0, dur_audio - dur_video + 0.5)
  video_filter = (f'tpad=stop_mode=clone:stop_duration={pad_s:.2f}'
                  if pad_s > 0.05 else 'null')
  final = f'{OUT}/ss1-final-v2.mp4'
  subprocess.run(['ffmpeg', '-y', '-i', vcat, '-i', audio_path,
                  '-vf', video_filter, '-c:v', 'libx264',
                  '-pix_fmt', 'yuv420p', '-c:a', 'aac', '-b:a', '160k',
                  '-shortest', final], check=True, capture_output=True)
  dur_final = float(subprocess.run(
      ['ffprobe', '-v', 'quiet', '-show_entries', 'format=duration',
       '-of', 'csv=p=0', final], capture_output=True, text=True,
      check=True).stdout.strip())
  if dur_final < dur_audio - 0.75:
      raise RuntimeError(f'narration truncated: final={dur_final:.2f}s '
                         f'vo={dur_audio:.2f}s')
  report += ['', f'video={dur_video:.2f}s', f'vo={dur_audio:.2f}s',
             f'tail_pad={pad_s:.2f}s', f'final={dur_final:.2f}s',
             f'file_bytes={os.path.getsize(final)}',
             'verdict=PASS: all VO finite and final duration retains narration']
  open(f'{PACK_DIR}/assemble-report-v2.md', 'w').write('\n'.join(report) + '\n')
  print(f'assembly v2 PASS: {dur_final:.2f}s, '
        f'{os.path.getsize(final)} bytes', flush=True)
