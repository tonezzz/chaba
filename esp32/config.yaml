esphome:
  name: esp32_test
  friendly_name: "ESP32 Test"
  on_boot:
    - priority: -100
      then:
        - light.turn_on:
            id: display_backlight
            brightness: 100%

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ESP32-Test-Fallback"
    password: "12345678"
  manual_ip:
    static_ip: 192.168.2.86
    gateway: 192.168.2.1
    subnet: 255.255.255.0
    dns1: 192.168.2.1

spi:
  - id: tft
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin:
      number: GPIO12
      ignore_strapping_warning: true

output:
  - platform: ledc
    id: backlight
    pin: GPIO21
    frequency: 1000Hz

light:
  - platform: monochromatic
    id: display_backlight
    name: "Display Backlight"
    output: backlight
    default_transition_length: 0s

font:
  - file: "gfonts://Roboto"
    id: font1
    size: 24

display:
  - platform: mipi_spi
    id: cyd_display
    model: ILI9341
    spi_id: tft
    cs_pin:
      number: GPIO15
      ignore_strapping_warning: true
    dc_pin:
      number: GPIO2
      ignore_strapping_warning: true
    invert_colors: false
    auto_clear_enabled: true
    dimensions:
      width: 240
      height: 320
    pages:
      - id: page_main
        lambda: |-
          it.fill(Color(0, 0, 0));
          it.print(0, 0, id(font1), Color(255, 255, 255), "Hello CYD");
      - id: page_status
        lambda: |-
          it.fill(Color(0, 0, 0));
          it.print(0, 0, id(font1), Color(0, 255, 0), "Status");
          it.printf(0, 30, id(font1), Color(255, 255, 255), "IP: %s", id(ip_addr).state.c_str());
          it.printf(0, 60, id(font1), Color(255, 255, 255), "SSID: %s", id(wifi_ssid_text).state.c_str());
          it.printf(0, 90, id(font1), Color(255, 255, 255), "Sig: %.0f dBm", id(wifi_signal_db).state);
          it.printf(0, 120, id(font1), Color(255, 255, 255), "Up: %.0f s", id(uptime_s).state);
          it.printf(0, 150, id(font1), Color(255, 255, 255), "Heap: %.0f", id(free_heap).state);

touchscreen:
  - platform: xpt2046
    id: cyd_touch
    spi_id: tft
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    threshold: 400
    calibration:
      x_min: 300
      x_max: 3800
      y_min: 300
      y_max: 3800

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: ip_addr
    ssid:
      name: "Connected SSID"
      id: wifi_ssid_text

sensor:
  - platform: uptime
    name: "Uptime"
    id: uptime_s
    type: seconds
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 60s
  - platform: template
    name: "Free Heap"
    id: free_heap
    unit_of_measurement: "B"
    update_interval: 5s
    lambda: |-
      return (float) ESP.getFreeHeap();

binary_sensor:
  - platform: status
    name: "Node Status"
    id: system_status

interval:
  - interval: 5s
    then:
      - display.page.show_next: cyd_display

captive_portal:
