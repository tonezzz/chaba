esphome:
  name: esp32test
  friendly_name: "ESP32 Test"
  on_boot:
    - priority: -100
      then:
        - light.turn_on:
            id: display_backlight
            brightness: 100%

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:

ota:
  - platform: esphome

wifi:
  networks:
    - ssid: !secret wifi_ssid_tony24
      password: !secret wifi_password_tony24
    - ssid: !secret wifi_ssid_tony5
      password: !secret wifi_password_tony5
    - ssid: !secret wifi_ssid_albatros24
      password: !secret wifi_password_albatros24
    - ssid: !secret wifi_ssid_albatros5
      password: !secret wifi_password_albatros5
    - ssid: !secret wifi_ssid_maesang
      password: !secret wifi_password_maesang
    - ssid: !secret wifi_ssid_tonyip
      password: !secret wifi_password_tonyip
  ap:
    ssid: "ESP32-Test-Fallback"
    password: "12345678"

spi:
  - id: tft
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin:
      number: GPIO12
      ignore_strapping_warning: true
  - id: touch
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

output:
  - platform: ledc
    id: backlight
    pin: GPIO21
    frequency: 1000Hz

light:
  - platform: monochromatic
    id: display_backlight
    name: "Display Backlight"
    output: backlight
    default_transition_length: 0s

font:
  - file: "gfonts://Roboto"
    id: font1
    size: 24
  - file: "gfonts://Roboto"
    id: font_small
    size: 12

display:
  - platform: mipi_spi
    id: cyd_display
    model: ILI9341
    spi_id: tft
    cs_pin:
      number: GPIO15
      ignore_strapping_warning: true
    dc_pin:
      number: GPIO2
      ignore_strapping_warning: true
    invert_colors: false
    auto_clear_enabled: true
    dimensions:
      width: 240
      height: 320
    pages:
      - id: page_main
        lambda: |-
          it.fill(Color(0, 0, 0));
          it.print(0, 0, id(font1), Color(255, 255, 255), "Hello CYD");
      - id: page_status
        lambda: |-
          it.fill(Color(0, 0, 0));
          it.filled_rectangle(0, 0, 240, 26, Color(0, 0, 128));
          it.print(4, 2, id(font1), Color(255, 255, 255), "Status");
          it.printf(0, 30, id(font_small), Color(255, 255, 255), "IP: %s", id(ip_addr).state.c_str());
          it.printf(0, 46, id(font_small), Color(255, 255, 255), "SSID: %s", id(wifi_ssid_text).state.c_str());
          it.printf(0, 62, id(font_small), Color(255, 255, 255), "MAC: C0:CD:D6:85:A8:38");
          it.printf(0, 78, id(font_small), Color(255, 255, 255), "Signal: %.0f dBm", id(wifi_signal_db).state);
          it.printf(0, 94, id(font_small), Color(255, 255, 255), "Uptime: %.0f s", id(uptime_s).state);
          it.printf(0, 110, id(font_small), Color(255, 255, 255), "Free heap: %.0f B", id(free_heap).state);
      - id: page_ha
        lambda: |-
          it.fill(Color(0, 0, 0));
          it.filled_rectangle(0, 0, 240, 26, Color(0, 128, 0));
          it.print(4, 2, id(font1), Color(255, 255, 255), "GPU Queue");
          it.printf(0, 30, id(font_small), Color(255, 255, 255), "Pending: %d", id(gpu_pending));
          it.printf(0, 46, id(font_small), Color(255, 255, 255), "Running: %d", id(gpu_running));
          it.printf(0, 62, id(font_small), Color(255, 255, 255), "Completed: %d", id(gpu_completed));
          it.printf(0, 78, id(font_small), Color(255, 255, 255), "Failed: %d", id(gpu_failed));
          it.printf(0, 94, id(font_small), Color(255, 255, 255), "Cancelled: %d", id(gpu_cancelled));

touchscreen:
  - platform: xpt2046
    id: cyd_touch
    spi_id: touch
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    threshold: 400
    calibration:
      x_min: 300
      x_max: 3800
      y_min: 300
      y_max: 3800

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: ip_addr
    ssid:
      name: "Connected SSID"
      id: wifi_ssid_text

sensor:
  - platform: uptime
    name: "Uptime"
    id: uptime_s
    type: seconds
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 60s
  - platform: template
    name: "Free Heap"
    id: free_heap
    unit_of_measurement: "B"
    update_interval: 5s
    lambda: |-
      return (float) ESP.getFreeHeap();

binary_sensor:
  - platform: status
    name: "Node Status"
    id: system_status

interval:
  - interval: 5s
    then:
      - display.page.show_next: cyd_display

json:

http_request:
  useragent: esphome
  timeout: 5s
  id: http_client

globals:
  - id: gpu_pending
    type: int
    restore_value: no
    initial_value: "0"
  - id: gpu_running
    type: int
    restore_value: no
    initial_value: "0"
  - id: gpu_completed
    type: int
    restore_value: no
    initial_value: "0"
  - id: gpu_failed
    type: int
    restore_value: no
    initial_value: "0"
  - id: gpu_cancelled
    type: int
    restore_value: no
    initial_value: "0"

interval:
  - interval: 30s
    then:
      - http_request.get:
          url: http://192.168.2.67:3001/health
          headers:
            Content-Type: application/json
          on_response:
            then:
              - lambda: |-
                  StaticJsonDocument<512> doc;
                  DeserializationError err = deserializeJson(doc, body);
                  if (!err) {
                    JsonObject status = doc["status"];
                    id(gpu_pending) = status["pending"].as<int>();
                    id(gpu_running) = status["running"].as<int>();
                    id(gpu_completed) = status["completed"].as<int>();
                    id(gpu_failed) = status["failed"].as<int>();
                    id(gpu_cancelled) = status["cancelled"].as<int>();
                  }

captive_portal:
