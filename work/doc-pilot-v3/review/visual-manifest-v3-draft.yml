rights_policy:
  - rights and credits are checked per asset, not inferred from agency name
  - no NASA/JPL logos or endorsement implication
  - no public release until each source, credit, permission and derived-file hash is recorded
qa_gates:
  - verify all 18 VO files are finite, non-silent and measured before shot timing is locked
  - match each scene hold to measured VO; preserve subtitles and callouts as separate layers
  - every sourced shot has an asset ID, source URL, credit, rights note and SHA-256
  - inspect keyframes and full assembled playback; reject missing/incorrect ship continuity or unreadable callouts
  - keep v4/v5/v6 and the original script untouched; v3 outputs use new filenames

