name: kk-mac-mlx-colab-scene0-control-20261124
# MLX-lane control rerender of old Colab scene0 (golden-hour-catch,
# 2026-10-22 CUDA LTX renders). Same T5 prompt embeds -> bit-identical
# text conditioning; t2v (old renders verified t2v: Drive keyframes are
# pixel-identical to rendered first/last frames). Old outputs preserved
# under gdrive:ada-nest/renders/ — this pack writes only to its own
# out/ and never overwrites.
#
# Gates (prep): owner-use stop gate (HID idle >= 600s), AC power,
# memory free >= 40%, load1 < 8, no resident llama-server runner, no
# creative/video apps, disk >= 5GB, inputs+model present, venv smoke.
# nest-worker runs packs serially -> concurrency=1. A wrapper on kk-mac
# (~/kk-video/run-mlx-control-gated.sh, tmux mlx-control) polls the same
# gates cheaply and only invokes the worker when green; prep re-checks
# once at claim time.
requires: []
needs:
  ram_gb: 8
  disk_gb: 5
  egress_only_ok: true
timeout_s: 3600
artifacts:
  - packs/kk-mac-mlx-colab-scene0-control-20261124/out/s0shot0-mlx.mp4
  - packs/kk-mac-mlx-colab-scene0-control-20261124/out/s0shot1-mlx.mp4
  - packs/kk-mac-mlx-colab-scene0-control-20261124/out/s0shot2-mlx.mp4
  - packs/kk-mac-mlx-colab-scene0-control-20261124/out/s0shot3-mlx.mp4
  - packs/kk-mac-mlx-colab-scene0-control-20261124/out/batch-result.json
  - packs/kk-mac-mlx-colab-scene0-control-20261124/out/verdict.md
prep: |
  set -eu
  # --- owner-use stop gate: KK-Mac is owner-first; require >=10min HID idle
  IDLE_NS=$(ioreg -c IOHIDSystem 2>/dev/null | awk '/HIDIdleTime/ {print $NF}' | head -1)
  case "$IDLE_NS" in ''|*[!0-9]*) echo "owner-use gate: HIDIdleTime unreadable"; exit 1;; esac
  IDLE_S=$((IDLE_NS / 1000000000))
  [ "$IDLE_S" -ge 600 ] || { echo "owner-use gate: idle ${IDLE_S}s < 600s"; exit 1; }
  # --- AC power
  pmset -g batt 2>/dev/null | grep -q "AC Power" || { echo "requires AC power"; exit 1; }
  # --- memory: unified memory; MLX 2B needs ~10GB -> require >=40% free
  FREE_PCT=$(memory_pressure 2>/dev/null | awk -F'[:%]' '/System-wide memory free percentage:/ {gsub(/[[:space:]]/, "", $2); print $2}')
  case "$FREE_PCT" in ''|*[!0-9]*) echo "memory gate: free% unreadable"; exit 1;; esac
  [ "$FREE_PCT" -ge 40 ] || { echo "memory gate: ${FREE_PCT}% < 40%"; exit 1; }
  # --- no big resident model runner (>10GB RSS; small embeds ok)
  BIG=$(ps -axo rss=,command= 2>/dev/null | awk '/llama-server/ && $1+0 > 10485760 {n++} END{print n+0}')
  [ "${BIG:-0}" -eq 0 ] || { echo "model gate: ${BIG} llama-server >10GB resident"; exit 1; }
  # --- load gate
  LOAD1=$(sysctl -n vm.loadavg 2>/dev/null | awk '{print $2}')
  awk -v l="$LOAD1" 'BEGIN{exit !(l+0 < 8.0)}' || { echo "load gate: ${LOAD1} >= 8"; exit 1; }
  # --- owner workload gate: creative/video apps
  BUSY=$(ps -axo comm 2>/dev/null | awk '{s=tolower($0); sub(/^.*\//, "", s); if(s ~ /^(ffmpeg|resolve|davinci resolve|premiere pro|adobe premiere pro|final cut pro|after effects|photoshop|blender|unreal editor)$/) n++} END {print n+0}')
  [ "$BUSY" -eq 0 ] || { echo "owner-use gate: $BUSY creative/video apps"; exit 1; }
  # --- disk
  AVAIL_KB=$(df -k "$HOME" 2>/dev/null | awk 'NR==2{print $4}')
  [ "${AVAIL_KB:-0}" -ge 5242880 ] || { echo "disk gate: ${AVAIL_KB}KB < 5GB"; exit 1; }
  # --- inputs + model + venv
  for f in inputs/shot0.pt inputs/shot1.pt inputs/shot2.pt inputs/shot3.pt run_scene0.py; do
    test -s "$PACK_DIR/$f" || { echo "missing pack file: $f"; exit 1; }
  done
  MODEL="$HOME/kk-video/ltx-mlx/models/LTX"
  for f in "ltxv-2b-0.9.8-distilled.safetensors" "tokenizer/spiece.model"; do
    test -s "$MODEL/$f" || { echo "missing model file: $f"; exit 1; }
  done
  PY="$HOME/kk-video/.venv-mlx/bin/python"
  test -x "$PY"
  "$PY" - <<'PY'
  import mlx.core, imageio.v3, numpy
  print("mlx+imageio+numpy import ok")
  PY
run_sh: |
  set -eu
  cd "$PACK_DIR"
  "$HOME/kk-video/.venv-mlx/bin/python" "$PACK_DIR/run_scene0.py"
