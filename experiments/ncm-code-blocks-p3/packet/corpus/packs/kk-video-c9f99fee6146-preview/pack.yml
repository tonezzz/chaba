# kk-video-c9f99fee6146-preview — private teaser preview for KK project.
# 10 shots @73f/40step/640x384 (proven T4 ceiling). Shots 2 and 10 are
# i2v last-frame continuations of shots 1 and 9 (the pull-back/pull-in
# moves); everything else is t2v. Order: t2v batch first, extract last
# frames, then the two i2v shots — keeps ONE pipeline resident at a time
# (two pipelines ~19GB > T4). Resumable: per-shot exists-check — a
# recycled VM continues at the missing shot. Embeds come from
# packs/doc-embeds-ss1/embeds (fetch mirrors them on fleet; on Colab the
# store path resolves directly).
name: kk-video-c9f99fee6146-preview
hf_repos:                # selective restore-hf-cache (ADA-0806)
  - Lightricks/LTX-Video
requires:           # require current preflight, embeds, source audit, and visual-use approval
  - kk-video-c9f99fee6146-r4-preflight
  - kk-video-c9f99fee6146-embeds
  - kk-video-c9f99fee6146-pdf-image-audit
  - kk-video-c9f99fee6146-source-image-use-approved
needs:
  gpu_gb: 14
  disk_gb: 30
  egress_only_ok: true
timeout_s: 9000    # 10 shots x ~7min + two model loads; resume-safe
fetch:
  - packs/kk-video-c9f99fee6146-embeds/embeds/
artifacts:
  - packs/kk-video-c9f99fee6146-preview/shots/kk-shot*.mp4
  - packs/kk-video-c9f99fee6146-preview/teaser-preview.mp4
  - packs/kk-video-c9f99fee6146-preview/teaser-preview.th.srt
  - packs/kk-video-c9f99fee6146-preview/teaser-preview.en.srt
  - packs/kk-video-c9f99fee6146-preview/narration.mp3
  - packs/kk-video-c9f99fee6146-preview/verdict.md
publish:
  shots: kk-video-c9f99fee6146/renders
prep: |
  TAR=$NEST_ROOT/model-archive/hf/ltx-slim.tar.zst
  # slim (per-repo) archive preferred: 9GB vs the 17.4GB full
  # repo tar — the render/probe needs only transformer/vae/scheduler
  [ -f "$TAR" ] || TAR=$NEST_ROOT/model-archive/hf/ltx-video.tar.zst
  apt-get install -y -qq zstd ffmpeg >/dev/null 2>&1 || true
  pip install -q 'edge-tts==7.3.1' >/dev/null
  python -c "import importlib.metadata as m; print('edge-tts', m.version('edge-tts'))"
  # LTX does not use TorchAO. A stale/incompatible optional TorchAO install
  # makes modern Diffusers import fail before the pipeline is loaded.
  pip uninstall -y -q torchao >/dev/null 2>&1 || true
  if [ -f "$TAR" ]; then
    tar -I zstd -tf "$TAR" 2>/dev/null | head -1 | grep -q '^hub/' \
      && DEST=/root/.cache/huggingface || DEST=/root/.cache/huggingface/hub
    # skip re-extract when the snapshot already has real weights (~9GB+)
    if du -sh "$DEST/models--Lightricks--LTX-Video" 2>/dev/null | awk '$1+0 >= 9 {exit 1}'; then
      mkdir -p "$DEST" && tar -I zstd -xf "$TAR" -C "$DEST" || true
    fi
  fi
  python -c "from diffusers import LTXPipeline, LTXImageToVideoPipeline; print('LTX imports ok')"
  # validate only what the pipeline reads — the 48-file snapshot list
  # includes variant files the slim cache never held (167s/it crawl
  # 2026-10-23); from_pretrained needs transformer/vae/scheduler only
  if ls "$DEST/models--Lightricks--LTX-Video"/snapshots/*/transformer/*.safetensors >/dev/null 2>&1; then
    echo "weights present — snapshot_download skipped"
  else
    python -c "from huggingface_hub import snapshot_download; snapshot_download('Lightricks/LTX-Video',ignore_patterns=['text_encoder/*','tokenizer/*','*.bin','*fp8*','*gguf*'])"
  fi
run: |
  import json, os, re, subprocess, tempfile, time, gc
  import torch
  for _v in ('model', 'pipe', 'enc', 'tok'):
      globals().pop(_v, None)
  gc.collect(); torch.cuda.empty_cache()
  from diffusers import LTXPipeline, LTXImageToVideoPipeline
  from diffusers.utils import export_to_video, load_image
  EMB = f'{NEST_ROOT}/packs/kk-video-c9f99fee6146-embeds/embeds'
  OUT = f'{PACK_DIR}/shots'; os.makedirs(OUT, exist_ok=True)
  KF = f'{PACK_DIR}/keyframes'; os.makedirs(KF, exist_ok=True)
  I2V = {2: 1, 10: 9}           # shot -> last-frame source shot
  W, H, FR, STEPS = 640, 384, 73, 40
  verdict = ['# kk-video-c9f99fee6146-preview verdict', '',
             '| shot | mode | s | peakGB | note |', '|---|---|---|---|---|']

  def emb(n):
      return {k: (v.cuda() if torch.is_tensor(v) else v)
              for k, v in torch.load(f'{EMB}/shot{n:02d}.pt',
                                     map_location='cpu').items()}

  def run_pipe(pipe, n, image=None):
      e = emb(n)
      kw = dict(prompt_embeds=e['prompt_embeds'],
                prompt_attention_mask=e['prompt_attention_mask'],
                negative_prompt_embeds=e['negative_prompt_embeds'],
                negative_prompt_attention_mask=e['negative_prompt_attention_mask'],
                width=W, height=H, num_frames=FR,
                num_inference_steps=STEPS, frame_rate=24)
      if image is not None:
          kw['image'] = image
      return pipe(**kw).frames[0]

  shot_qc = {}

  def inspect_shot(n, refresh=False):
      if not refresh and n in shot_qc:
          return shot_qc[n]
      path = f'{OUT}/kk-shot{n:02d}.mp4'
      if not os.path.isfile(path):
          result = (False, 'missing file')
          shot_qc[n] = result
          return result
      size = os.path.getsize(path)
      if size < 1024:
          result = (False, f'too small: {size}B')
          shot_qc[n] = result
          return result
      probe = subprocess.run([
          'ffprobe', '-v', 'error', '-count_frames', '-select_streams', 'v:0',
          '-show_entries',
          'stream=codec_name,width,height,nb_read_frames:format=duration',
          '-of', 'json', path,
      ], capture_output=True, text=True)
      if probe.returncode:
          result = (False, f'ffprobe rc={probe.returncode}: {probe.stderr[-160:]}')
          shot_qc[n] = result
          return result
      try:
          info = json.loads(probe.stdout)
          stream = info['streams'][0]
          duration = float(info['format']['duration'])
          frames = int(stream.get('nb_read_frames') or stream.get('nb_frames') or 0)
          codec = stream.get('codec_name')
          width, height = int(stream['width']), int(stream['height'])
      except (KeyError, IndexError, TypeError, ValueError) as exc:
          result = (False, f'incomplete ffprobe metadata: {exc}')
          shot_qc[n] = result
          return result
      if codec != 'h264' or (width, height) != (W, H) \
              or frames < FR - 3 or duration < 2.8:
          result = (False, f'{codec} {width}x{height} {frames}f {duration:.2f}s')
          shot_qc[n] = result
          return result
      decode = subprocess.run([
          'ffmpeg', '-v', 'error', '-i', path, '-f', 'null', '-',
      ], capture_output=True, text=True)
      if decode.returncode:
          result = (False, f'decode rc={decode.returncode}: {decode.stderr[-160:]}')
          shot_qc[n] = result
          return result
      black = subprocess.run([
          'ffmpeg', '-hide_banner', '-i', path,
          '-vf', 'blackdetect=d=2:pix_th=0.05', '-an', '-f', 'null', '-',
      ], capture_output=True, text=True)
      if black.returncode:
          result = (False, f'black-frame check rc={black.returncode}')
          shot_qc[n] = result
          return result
      black_s = sum(float(x) for x in
                    re.findall(r'black_duration:([0-9.]+)', black.stderr))
      if black_s >= duration * 0.8:
          result = (False, f'almost entirely black ({black_s:.2f}/{duration:.2f}s)')
          shot_qc[n] = result
          return result
      result = (True, f'{frames}f {duration:.2f}s {size}B black={black_s:.2f}s')
      shot_qc[n] = result
      return result

  def done(n):
      return inspect_shot(n)[0]

  def inspect_teaser(path):
      probe = subprocess.run([
          'ffprobe', '-v', 'error',
          '-show_entries',
          'stream=codec_type,codec_name,width,height:format=duration',
          '-of', 'json', path,
      ], capture_output=True, text=True)
      if probe.returncode:
          return False, f'ffprobe rc={probe.returncode}: {probe.stderr[-160:]}'
      try:
          info = json.loads(probe.stdout)
          video = next(s for s in info['streams'] if s['codec_type'] == 'video')
          audio = next(s for s in info['streams'] if s['codec_type'] == 'audio')
          duration = float(info['format']['duration'])
      except (KeyError, StopIteration, TypeError, ValueError) as exc:
          return False, f'incomplete final metadata: {exc}'
      if (video.get('codec_name') != 'h264'
              or (int(video.get('width', 0)), int(video.get('height', 0))) != (W, H)
              or audio.get('codec_name') != 'aac'
              or not 58 <= duration <= 62):
          return False, (
              f'video={video.get("codec_name")} '
              f'{video.get("width")}x{video.get("height")}, '
              f'audio={audio.get("codec_name")}, duration={duration:.2f}s')
      decode = subprocess.run([
          'ffmpeg', '-v', 'error', '-i', path, '-f', 'null', '-',
      ], capture_output=True, text=True)
      if decode.returncode:
          return False, f'full decode rc={decode.returncode}: {decode.stderr[-160:]}'
      return True, f'h264/aac {duration:.2f}s 640x384 full decode passed'

  def last_frame(mp4, png):
      result = subprocess.run([
          'ffmpeg', '-y', '-sseof', '-0.1', '-i', mp4,
          '-frames:v', '1', '-update', '1', png,
      ], capture_output=True, text=True)
      return (result.returncode == 0 and os.path.isfile(png)
              and os.path.getsize(png) > 0), result.stderr[-160:]

  # Reuse existing shots only after media-level validation; the former
  # file-size threshold rejected valid low-motion scenes.
  todo_t2v = [n for n in range(1, 11) if n not in I2V and not done(n)]
  print('shots passing QC before retry:',
        [n for n in range(1, 11) if done(n)], flush=True)

  # pass 1: t2v (all but the two i2v shots)
  if todo_t2v:
      pipe = LTXPipeline.from_pretrained('Lightricks/LTX-Video',
          torch_dtype=torch.bfloat16, text_encoder=None,
          tokenizer=None).to('cuda')
      print('t2v resident %.1fGB' % (torch.cuda.memory_allocated()/1e9), flush=True)
  for n in todo_t2v:
      t = time.time(); note = ''
      try:
          fr = run_pipe(pipe, n)
          export_to_video(fr, f'{OUT}/kk-shot{n:02d}.mp4', fps=24)
      except Exception as e:
          note = f'{type(e).__name__}: {str(e)[:160]}'
      ok, qc = inspect_shot(n, refresh=True)
      if not ok:
          note = f'{note}; QC failed: {qc}' if note else f'QC failed: {qc}'
      else:
          note = f'{note}; {qc}' if note else qc
      pk = torch.cuda.max_memory_allocated()/1e9
      verdict.append(f'| {n} | t2v | {time.time()-t:.0f} | {pk:.1f} | {note} |')
      print(f'shot{n} t2v {time.time()-t:.0f}s peak {pk:.1f}GB {note}', flush=True)
  if todo_t2v:
      del pipe; gc.collect(); torch.cuda.empty_cache()

  # pass 2: i2v shots 2 and 10
  todo_i2v = [n for n in I2V if not done(n)]
  if todo_i2v:
      pipe = LTXImageToVideoPipeline.from_pretrained('Lightricks/LTX-Video',
          torch_dtype=torch.bfloat16, text_encoder=None,
          tokenizer=None).to('cuda')
      print('i2v resident %.1fGB' % (torch.cuda.memory_allocated()/1e9), flush=True)
      for n in todo_i2v:
          src = I2V[n]
          t = time.time(); note = ''
          try:
              if not done(src):
                  raise RuntimeError(f'source shot {src} failed media QC')
              src_mp4 = f'{OUT}/kk-shot{src:02d}.mp4'
              png = f'{KF}/shot{src:02d}-last.png'
              frame_ok, frame_error = last_frame(src_mp4, png)
              if not frame_ok:
                  raise RuntimeError(f'last-frame extraction failed: {frame_error}')
              fr = run_pipe(pipe, n, image=load_image(png))
              export_to_video(fr, f'{OUT}/kk-shot{n:02d}.mp4', fps=24)
          except Exception as e:
              note = f'{type(e).__name__}: {str(e)[:160]}'
          ok, qc = inspect_shot(n, refresh=True)
          if not ok:
              note = f'{note}; QC failed: {qc}' if note else f'QC failed: {qc}'
          else:
              note = f'{note}; {qc}' if note else qc
          pk = torch.cuda.max_memory_allocated()/1e9
          verdict.append(f'| {n} | i2v:{src} | {time.time()-t:.0f} | {pk:.1f} | {note} |')
          print(f'shot{n} i2v {time.time()-t:.0f}s peak {pk:.1f}GB {note}', flush=True)
      del pipe; gc.collect(); torch.cuda.empty_cache()

  th_lines = [
      'ความผูกพันระหว่างพ่อกับลูกสาวเริ่มต้นจากความทรงจำที่อบอุ่น',
      'ความสูญเสียทำให้เธอต้องเติบโตและเป็นเสาหลักของครอบครัว',
      'ความฝันทั้งสี่เชื่อมโยงกับเหตุการณ์สำคัญในชีวิต',
      'แต่คำตอบของเรื่องราวนี้ยังคงเป็นคำถามที่เธอกำลังค้นหา',
  ]
  en_lines = [
      'A father and daughter begin with warm, ordinary memories.',
      'Loss forces her to grow into a pillar for the family.',
      'Four dreams become connected to moments that change her life.',
      'But the meaning remains a question she is still searching for.',
  ]

  def write_srt(path, lines):
      with open(path, 'w') as fh:
          for i, line in enumerate(lines):
              start = i * 15
              end = start + 15
              def ts(sec):
                  return '00:%02d:%02d,000' % (sec // 60, sec % 60)
              fh.write(f'{i + 1}\n{ts(start)} --> {ts(end)}\n{line}\n\n')
  write_srt(f'{PACK_DIR}/teaser-preview.th.srt', th_lines)
  write_srt(f'{PACK_DIR}/teaser-preview.en.srt', en_lines)

  missing = [n for n in range(1, 11) if not done(n)]
  concat = f'{PACK_DIR}/shots/concat.txt'
  with open(concat, 'w') as fh:
      for n in range(1, 11):
          if done(n):
              fh.write("file '%s'\n" % f'{OUT}/kk-shot{n:02d}.mp4')

  teaser = f'{PACK_DIR}/teaser-preview.mp4'
  silent = f'{PACK_DIR}/teaser-preview-silent.mp4'
  silent_tmp = f'{PACK_DIR}/teaser-preview-silent.tmp.mp4'
  assembly_error = ''
  if missing:
      assembly_error = f'assembly blocked by invalid shots: {missing}'
  else:
      assemble = subprocess.run([
          'ffmpeg', '-y', '-f', 'concat', '-safe', '0', '-i', concat,
          '-vf', 'setpts=2.0*PTS', '-an', '-t', '60',
          '-c:v', 'libx264', '-pix_fmt', 'yuv420p', silent_tmp,
      ], capture_output=True, text=True)
      if assemble.returncode == 0 and os.path.isfile(silent_tmp) \
              and os.path.getsize(silent_tmp) > 1024:
          os.replace(silent_tmp, silent)
      else:
          assembly_error = (
              f'silent assembly rc={assemble.returncode}: '
              f'{assemble.stderr[-240:]}')
          if os.path.isfile(silent_tmp):
              os.remove(silent_tmp)

  narration = f'{PACK_DIR}/narration.mp3'
  narration_tmp = f'{PACK_DIR}/narration.tmp.mp3'
  narration_error = ''

  def safe_tts_error(text):
      text = re.sub(r'''(?i)(?:https?|wss?)://[^\s'"]+''',
                    lambda m: m.group(0).split('?', 1)[0] + '?<query-redacted>',
                    text)
      return re.sub(
          r'''(?i)(TrustedClientToken|ConnectionId|Sec-MS-GEC(?:-Version)?)=[^&\s'"]+''',
          r'\1=<redacted>', text)[-240:]

  try:
      with tempfile.TemporaryDirectory(prefix='kk-preview-tts-') as tmpdir:
          segments = []
          for i, line in enumerate(th_lines):
              source = f'{tmpdir}/line-{i:02d}.mp3'
              last_tts_error = ''
              for attempt in range(1, 4):
                  if os.path.isfile(source):
                      os.remove(source)
                  tts = subprocess.run([
                      'edge-tts', '--voice', 'th-TH-PremwadeeNeural',
                      '--text', line, '--write-media', source,
                  ], capture_output=True, text=True, timeout=180)
                  if (tts.returncode == 0 and os.path.isfile(source)
                          and os.path.getsize(source) >= 1024):
                      break
                  last_tts_error = (
                      f'attempt {attempt}/3 rc={tts.returncode}: '
                      f'{safe_tts_error(tts.stderr)}')
                  if attempt < 3:
                      time.sleep(1.5 * attempt)
              else:
                  raise RuntimeError(
                      f'edge-tts line {i + 1} failed after 3 attempts: '
                      f'{last_tts_error}')
              duration = subprocess.run([
                  'ffprobe', '-v', 'error', '-show_entries', 'format=duration',
                  '-of', 'default=noprint_wrappers=1:nokey=1', source,
              ], capture_output=True, text=True, check=True)
              if not 0 < float(duration.stdout.strip()) < 15:
                  raise RuntimeError(
                      f'edge-tts line {i + 1} duration outside 0-15s: '
                      f'{duration.stdout.strip()}')
              segment = f'{tmpdir}/segment-{i:02d}.wav'
              pad = subprocess.run([
                  'ffmpeg', '-y', '-i', source,
                  '-af', 'apad=pad_dur=15,atrim=duration=15',
                  '-ar', '24000', '-ac', '1', '-c:a', 'pcm_s16le', segment,
              ], capture_output=True, text=True)
              if pad.returncode or not os.path.isfile(segment) \
                      or os.path.getsize(segment) < 10000:
                  raise RuntimeError(
                      f'audio pad line {i + 1} rc={pad.returncode}: '
                      f'{pad.stderr[-240:]}')
              segments.append(segment)

          audio_list = f'{tmpdir}/audio-concat.txt'
          with open(audio_list, 'w') as fh:
              for segment in segments:
                  fh.write(f"file '{segment}'\n")
          audio_mux = subprocess.run([
              'ffmpeg', '-y', '-f', 'concat', '-safe', '0', '-i', audio_list,
              '-c:a', 'libmp3lame', '-q:a', '4', narration_tmp,
          ], capture_output=True, text=True)
          if audio_mux.returncode or not os.path.isfile(narration_tmp) \
                  or os.path.getsize(narration_tmp) < 1024:
              raise RuntimeError(
                  f'narration mux rc={audio_mux.returncode}: '
                  f'{audio_mux.stderr[-240:]}')
          os.replace(narration_tmp, narration)
  except Exception as exc:
      narration_error = (
          f'{type(exc).__name__}: {safe_tts_error(str(exc))[:300]}')
      if os.path.isfile(narration_tmp):
          os.remove(narration_tmp)
      if os.path.isfile(narration) and os.path.getsize(narration) == 0:
          os.remove(narration)

  teaser_error = ''
  if not missing and not assembly_error and not narration_error \
          and os.path.isfile(silent) and os.path.getsize(silent) > 1024 \
          and os.path.isfile(narration) and os.path.getsize(narration) > 1024:
      teaser_tmp = f'{PACK_DIR}/teaser-preview.tmp.mp4'
      mux = subprocess.run([
          'ffmpeg', '-y', '-i', silent, '-i', narration,
          '-map', '0:v:0', '-map', '1:a:0', '-af', 'apad=pad_dur=60',
          '-t', '60', '-c:v', 'copy', '-c:a', 'aac', teaser_tmp,
      ], capture_output=True, text=True)
      teaser_ok, teaser_qc = (inspect_teaser(teaser_tmp)
                              if mux.returncode == 0
                              and os.path.isfile(teaser_tmp)
                              and os.path.getsize(teaser_tmp) > 1024
                              else (False, f'mux rc={mux.returncode}: '
                                    f'{mux.stderr[-240:]}'))
      if teaser_ok:
          os.replace(teaser_tmp, teaser)
      else:
          teaser_error = teaser_qc
      if os.path.isfile(teaser_tmp):
          os.remove(teaser_tmp)
  elif not missing and not teaser_error:
      teaser_error = 'final mux skipped because audio or silent video is invalid'

  shot_results = [(n, *inspect_shot(n)) for n in range(1, 11)]
  verdict += ['', '## final checks', '',
              f'- Invalid shots: {missing or "none"}',
              f'- Silent assembly: {assembly_error or "passed"}',
              f'- Narration: {narration_error or "passed"}',
              f'- Final teaser: {teaser_error or "passed"}',
              '', '## per-shot media QC', '',
              '| shot | result | detail |', '|---|---|---|']
  for n, ok, detail in shot_results:
      verdict.append(f'| {n:02d} | {"pass" if ok else "fail"} | {detail} |')
  open(f'{PACK_DIR}/verdict.md', 'w').write('\n'.join(verdict) + '\n')
  print(
      f'kk-video preview attempt missing={missing} '
      f'audio_error={narration_error!r} '
      f'assembly_error={assembly_error!r} '
      f'teaser_error={teaser_error!r}',
      flush=True,
  )
