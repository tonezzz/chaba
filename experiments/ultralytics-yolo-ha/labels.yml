# True labels for bench snaps. Classes: person | vehicle | package | none
# Labeled by visual inspection of each frame, 2026-10-23.
# Priority rule when multiple classes present: person > package > vehicle > none.
labels:
  vms_1__Road_In.png: vehicle          # parked scooter + car in background
  vms_1__Road_In_r2.png: person        # man seated on bench, right side
  vms_2__Guard_View.png: none          # multi-pane view, no subject
  vms_2__Guard_View_r2.png: person     # guard seated on bench, bottom-right
  vms_3__Walkway_In.png: vehicle       # scooter top-right edge
  vms_4__Entrance_Gate.png: none       # empty driveway
  vms_4__Entrance_Gate_r2.png: none    # empty driveway
  vms_5__Road_Corner.png: vehicle      # white car top-left
  vms_Front_Rd__Left.png: vehicle      # bikes, scooters, cars on street
  vms_Front_Rd__Right.png: vehicle     # truck + cars + bicycles
  vms_Mini_Mart_r2.png: person         # person in white among parked bikes
  vms_Mini_Mart_r3.png: vehicle        # bikes/cars on street
  vms_Play_Ground.png: none            # empty exercise park
  vms_Play_Ground_r2.png: none         # empty exercise park
  vms_Swimming_Pool.png: none          # courtyard + covered pool
  vms_Swimming_Pool_r2.png: person     # person at pool edge, top-left
  vms_Stairway_Room.png: none          # cat in lobby — not a target class
