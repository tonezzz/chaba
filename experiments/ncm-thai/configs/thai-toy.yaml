# Thai toy NCM — TinyStories-equivalent recipe (paper Table 5/6, TinyStories
# column) with a SentencePiece Thai base tokenizer. Paper budgets:
# tokenizer 30k updates @ 4096, generator 50k @ 2048. Smoke defaults below
# are CPU-scale; the toy profile is meant for a single rented GPU.
task: thai-toy
checkpoints:
  generator: generator.pt
  tokenizer: tokenizer.pt
data:
  train: data/thai_ids.pt        # torch.save {"ids": [N,128], "prefixes": null}
  eos_id: 2                      # SentencePiece eos
model:
  n_layer: 12
  n_head: 12
  bias: true
  dropout: 0.1
  n_embd: 768
  context_length: 129
  prefix_len: 1
  raw_token_prefix: true
  prefix_pad_token_id: 3
  vocab_size: [4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096]
  predict_level0: false
  attn_pattern: block_diagonal
  use_positional_encoding: true
  use_level_encoding: true
  use_rope: true
  rope_base: 100000
  use_qk_norm: true
  use_flex_attention: false
  query_level0: false
  tie_heads_to_codebook: true
  tie_heads_learn_scale: true
tokenizer:
  pre_tokenizer:
    name: spm
    tokenizer: spm
    model_path: data/spm_thai.model
  vqvae:
    n_layers: 6
    embed_dim: 384
    in_vocab_size: 8192
    context_length: 128
    compression_factor: 1
    dropout: 0.3
    dec_layers: 1
    pre_quant_groupnorm: 8
    use_qk_norm: true
    pre_quant_dropout: 0.0
    vqvae_vocab_size: [4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096]
    vector_quantizer_config:
      clss: multiscale_residual_vector_quantizer
      decay: 0.95
      epsilon: 1.0e-05
      commitment_cost: 0.25
      learned_l1_sampling: true
      learned_l1_cascade: true
      learned_l1_cascade_base: 4
      learned_all_sampling: false
      quant_resi:
        enabled: true
        ratio: 0.5
        share_mode: 0
        learnable_ratio: false
      levels:
        use_manual_levels: true
        manual_levels: [1, 8, 16, 24, 32, 40, 52, 64, 76, 92, 108, 128]
      learned_l1_cascade_norm: false
      learned_l1_cascade_norm_final: false
      ema_scale_by_world_size: false
      aux:
        fine_drop:
          prob: 0.5
          min_keep: 1
generation:
  temperature: 1.0
  top_k: 0
  top_p: 1.0
  cfg_scale: 0.0
training:
  tokenizer:
    updates: 1000          # paper: 30000 @ batch 4096 (GPU run)
    batch_size: 64
    peak_lr: 5.0e-4
    min_lr: 5.0e-5
    warmup: 100
    betas: [0.9, 0.95]
    weight_decay: 0.01
    grad_clip: 1.0
    log_every: 50
    save_every: 0
    bf16: true
    seed: 42
  generator:
    updates: 2000          # paper: 50000 @ batch 2048 (GPU run)
    batch_size: 64
    peak_lr: 3.0e-4
    min_lr: 3.0e-5
    warmup: 100
    betas: [0.9, 0.95]
    weight_decay: 0.1
    grad_clip: 1.0
    corruption_mean: 0.5
    corruption_schedule: shifted_linear
    loss_alpha: 0.0
    prefix_dropout: 0.0
    log_every: 50
    save_every: 0
    bf16: true
    seed: 42
out:
  dir: runs/thai-toy
