[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = True
retry_files_enabled = False
stdout_callback = yaml
result_format = yaml
forks = 10
interpreter_python = auto_silent
# Hosts are reached over Tailscale (100.x) or LAN; SSH config (~/.ssh/config)
# already carries per-host stanzas, so ansible_user defaults below mirror it.

[privilege_escalation]
become = True
become_method = sudo
