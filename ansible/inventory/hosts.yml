# Chaba host inventory — SSOT cross-refs:
#   docs/ssot/infrastructure/ssot.host-roles.yml
#   docs/ssot/infrastructure/ssot.audit.hosts.yml
#   ~/.ssh/config (Host stanzas — ansible_host mirrors them)
#
# All Linux hosts join the tailnet; ansible_host uses the Tailscale IP so
# playbooks work from anywhere, not just the home LAN. Retired/offline hosts
# are kept for documentation but excluded by default via `enabled: false`
# and the `!disabled` limit in README commands.

all:
  children:
    workstations:
      children:
        primary_workstations: {}
        secondary_workstations: {}

    servers:
      children:
        vps: {}
        portable: {}

    macos: {}

    disabled: {}

    # Baseline playbook targets: everything managed, minus portable laptops
    # (sleep/off-net is normal) minus macOS (no apt/systemd).
    baseline:
      children:
        primary_workstations: {}
        secondary_workstations: {}
        vps: {}

    # Phase B+ session-capture wiring targets (opt-in, Devin/chaba memory hosts).
    # Keep scoped; add/remove hosts intentionally per ssot.chaba.memory.yml and
    # ssot.knowledge-capture.yml rollout. Use --limit for portable/offline hosts.
    session_capture:
      hosts:
        tony-dell: {}
        tony-omen: {}
        idc03: {}

    # ada-ocb OpenChamber pane. idc02 is canonical since 2026-11-18;
    # tony-dell is the soak fallback pending Tony's retire decision.
    # Audit/verify only — never blanket-upgrade this group without approval.
    ocb_pane:
      hosts:
        idc02:
          ocb_role: primary
        tony-dell:
          ocb_role: fallback

primary_workstations:
  hosts:
    tony-omen:
      ansible_host: 100.75.102.88
      ansible_user: tony
      ssh_push_chaba: true    # dry-run probe OK 2026-11-24
      # Docker host, GPU/NVR/web server — see ssot.host-roles.yml

secondary_workstations:
  hosts:
    tony-dell:
      ansible_host: 100.68.142.13
      ansible_user: tony
      ssh_lan_host: 192.168.2.67
      ssh_push_chaba: true    # dry-run probe OK 2026-11-24
      # Secondary workstation; postgres + dnsmasq alias live here.
      # LAN alias 192.168.2.67 available via ssh config host tony-dell-lan.

vps:
  hosts:
    idc02:
      ansible_host: 100.123.163.11
      ansible_user: tony
      ssh_push_chaba: true    # dry-run probe OK 2026-11-24
      # Lab/offload node; playlived headless lane on :9240.
    idc03:
      ansible_host: 100.102.134.91
      ansible_user: tony
      ssh_push_chaba: true    # dry-run probe OK 2026-11-24
      # Primary public VPS — chaba writer checkout lives here.
    con01:
      ansible_host: 100.72.146.39
      ansible_user: tony
      # Public VPS (Contabo) — DR/absorber tier replacing retired idc01:
      # mddb-follower, standby caddy-edge, ada-stt, secrets-backup target.
      # Rootless podman, NOT docker — docker_enabled stays false.
      # See ssot.audit.hosts.yml con01 block + OPS-0763.
    # idc01: RETIRED 2026-11-14 (OPS-0096) — do not re-add.

portable:
  hosts:
    tony-macbook:
      ansible_host: 100.77.76.112
      ansible_user: tony
      # Interpreter discovery prompts for interactive sudo on this host —
      # pin the interpreter so playbooks work with BatchMode SSH.
      ansible_python_interpreter: /usr/bin/python3
      # Ubuntu 26.04 laptop — sleeps/off-net is normal; always use --limit
      # explicitly, never blanket-run against `all`.
    mn01:
      ansible_host: 100.106.196.22
      ansible_user: tony
      ssh_push_chaba: true    # dry-run probe OK 2026-11-24
      # Portable Ubuntu PC in mn-home — same caveat as tony-macbook.

macos:
  hosts:
    kk-mac:
      ansible_host: 100.108.217.17
      ansible_user: kkkakk
      ssh_enabled: false    # member device, partial key seeding — pending KK sign-off
      ssh_user: kkkakk
      ssh_identity_file: ~/.ssh/id_ed25519_opencode
      ansible_python_interpreter: /usr/bin/python3
      # KK's Mac Studio — member device, NOT infra. Managed separately;
      # excluded from `baseline` on purpose. SSH key seeding in progress
      # (see ssot.host-roles.yml kk-mac block).
      # KNOWN DRIFT for the verifier: controller ~/.ssh/config has no User
      # for this stanza (resolves to local user `tony`) while inventory
      # declares kkkakk. Ansible uses ansible_user=kkkakk, so it works;
      # the generated-config slice must reconcile this, not this gate.

disabled:
  hosts:
    idc01:
      ansible_host: 100.74.146.0
      ansible_user: tony
      enabled: false
      ssh_enabled: false
      # RETIRED public VPS — ssh dead since 2026-10-12, formally retired
      # 2026-11-14. Kept for history; never target.
