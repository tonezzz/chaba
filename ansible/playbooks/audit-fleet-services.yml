---
# audit-fleet-services.yml — fleet service-state audit vs ssot.audit.hosts.yml.
#
# Read-only Ansible port of `scripts/audit-hosts.py --all`: one JSON probe
# per host (parallel over ssh), then the controller renders the same delta
# list the Python script produces — expected_services / expected_absent /
# allowed_running / known_failed / min_free_ram_mb / oom_kills_tolerance,
# identical delta strings so results can be diffed 1:1 against
# reports/audit-hosts/<host>-*.yml.
#
# Usage (from ansible/):
#   ansible-playbook playbooks/audit-fleet-services.yml
#   ansible-playbook playbooks/audit-fleet-services.yml --limit idc03
#
# Artifacts: reports/ansible-benchmark/services/<inventory_host>.yml
# (controller-side, gitignored like reports/audit-hosts/).

- name: Probe service + resource state on every Linux host
  hosts: all:!macos:!disabled
  gather_facts: false
  become: false
  vars:
    benchmark_out: "{{ playbook_dir }}/../../reports/ansible-benchmark/services"

  tasks:
    - name: Probe host state (single round-trip, JSON out)
      ansible.builtin.shell: |
        python3 - <<'PYEOF'
        import json, subprocess
        def sh(c):
            try:
                p = subprocess.run(["bash", "-c", c], capture_output=True,
                                   text=True, timeout=60)
                return p.stdout
            except Exception:
                return ""
        def lines(t):
            return [l.strip() for l in t.splitlines() if l.strip()]
        def count(t):
            ls = lines(t)
            try:
                return int(ls[-1])
            except (ValueError, IndexError):
                return 0
        mem = sh("free -h | grep -E '^Mem:'").split()
        dfr = sh("df -h / | tail -1").split()
        out = {
            "active_user": lines(sh(r"systemctl --user list-units --no-pager --plain 2>/dev/null | grep -E '\.(service|scope|timer)' | awk '{print $1, $3}'")),
            "active_sys": lines(sh(r"systemctl list-units --state=active --no-pager --plain | grep -E '\.(service|scope|timer)' | awk '{print $1, $3}'")),
            "failed_user": lines(sh(r"systemctl --user list-units --failed --no-pager --plain 2>/dev/null | grep -E '\.(service|scope)' | awk '{print $1}'")),
            "failed_sys": lines(sh(r"systemctl list-units --failed --no-pager --plain | grep -E '\.(service|scope)' | awk '{print $1}'")),
            "mem_available": mem[6] if len(mem) > 6 else (mem[3] if len(mem) > 3 else ""),
            "disk_percent": dfr[4].rstrip("%") if len(dfr) >= 5 else "",
            "oom_user": count(sh("journalctl --user --since '-24 hours ago' --no-pager -o cat 2>/dev/null | grep -ciF 'OOM killer'")),
            "oom_sys": count(sh("journalctl --since '-24 hours ago' --no-pager -o cat 2>/dev/null | grep -ciE 'oom-kill|OOM killer|Out of memory'")),
            "uptime": sh("uptime").strip(),
        }
        print(json.dumps(out))
        PYEOF
      register: probe
      changed_when: false
      failed_when: false
      ignore_unreachable: true

    - name: Store snapshot for the controller-side diff
      ansible.builtin.set_fact:
        snap: "{{ probe.stdout | from_json }}"
      when: probe.stdout is defined and probe.stdout | length > 0
      ignore_unreachable: true

- name: Diff snapshots against ssot.audit.hosts.yml (controller-side)
  hosts: all:!macos:!disabled
  gather_facts: false
  become: false
  vars:
    benchmark_out: "{{ playbook_dir }}/../../reports/ansible-benchmark/services"
    audited_hosts: >-
      {{ groups['all']
         | difference(groups['macos'] | default([]))
         | difference(groups['disabled'] | default([]))
         | sort }}
    # inventory_hostname -> ssot.audit.hosts.yml key where they differ
    ssot_key_map:
      tony-macbook: macbook
    # Noise tables copied verbatim from scripts/audit-hosts.py — keep in
    # sync or parity checks will false-positive. Single lines on purpose:
    # a folded '>-' scalar would inject spaces into the alternations.
    noise_user_re: '^(init\.scope|session-.*|run-.*|app-.*|dbus\.service|at-spi-.*|gcr-ssh-agent.*|gnome-keyring.*|gpg-agent.*|gvfs-.*|mpris.*|pipewire.*|wireplumber.*|xdg-.*|filter-chain.*|plasma-.*|org\.gnome.*|org\.freedesktop.*|gsd-.*|evolution.*|tracker.*|ssh-agent.*|snap\..*|pk-.*|colord.*|obex.*|speech-dispatcher.*|kdeconnect.*|gnome-remote.*|rygel.*|systemd-.*|dconf\.service|localsearch.*|xfce4-notifyd.*|xfconfd.*|gnome-session-.*|chrome-remote-desktop-environment.*|podman-user-wait.*|screen-timeout-daemon.*|devin-task-.*|[0-9a-f]{40,64}(-[0-9a-f]{8,20})?\.service)$'
    hash_unit_re: '^[0-9a-f]{40,64}(-[0-9a-f]{8,20})?\.service$'
    fleet_sys_re: '(chaba|ada[-_.]|home-?assist|michael|ollama|mddb|vcast|go2rtc|nest|jev|kanban|cms|mcp[-_.]|cloudflared|cast-|camwall|sunsynk|devin|litellm|openjev|caddy|rclone|notebooklm|workflows|yomi|obsidian|input-bridge|barrier|gods-eye|gev[-_.]|playwright|yolo|xmeye|vms|raceman|helm|node-red|dnsmasq|gesture|plug-watch|secrets-console|status-data|trade-api|websockify|xvfb|bserver|redis|postgres|weaviate)'
    failed_noise_re: '^(apport.*|NetworkManager-wait-online.*|xdg-desktop-portal.*|xfce4-notifyd.*|snapd\..*|grub-initrd-fallback.*)$'
    board_notify: false
    board_api_base: "https://idc03.taila0626a.ts.net:10000"
    board_from: "devin"

  tasks:
    - name: Ensure the report dir exists
      ansible.builtin.file:
        path: "{{ benchmark_out }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true

    - name: Load the audit SSOT
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../docs/ssot/infrastructure/ssot.audit.hosts.yml"
        name: audit_ssot
      delegate_to: localhost
      run_once: true

    - name: Render per-host delta reports
      ansible.builtin.template:
        src: service-audit-deltas.j2
        dest: "{{ benchmark_out }}/{{ target }}.yml"
        mode: "0644"
      loop: "{{ audited_hosts }}"
      loop_control:
        loop_var: target
      delegate_to: localhost
      run_once: true

    - name: Show deltas per host
      ansible.builtin.debug:
        msg: >-
          {{ item }}: {{ (lookup('file', benchmark_out + '/' + item + '.yml')
             | from_yaml).deltas | length }} delta(s)
      loop: "{{ audited_hosts }}"
      delegate_to: localhost
      run_once: true

    - name: Compute fleet-service drift summary and fingerprint
      ansible.builtin.set_fact:
        fleet_service_drift_hosts: >-
          {%- set out = [] -%}
          {%- for h in audited_hosts -%}
            {%- set rpt = (lookup('file', benchmark_out + '/' + h + '.yml', errors='ignore') | default('', true)) -%}
            {%- if rpt -%}
              {%- set y = rpt | from_yaml -%}
              {%- set deltas = y.get('deltas', []) -%}
              {%- if deltas | length > 0 -%}
                {%- set _ = out.append({'host': h, 'count': (deltas | length)}) -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out }}
        fleet_service_fingerprint: >-
          {%- set out = [] -%}
          {%- for h in audited_hosts -%}
            {%- set rpt = (lookup('file', benchmark_out + '/' + h + '.yml', errors='ignore') | default('', true)) -%}
            {%- if rpt -%}
              {%- set y = rpt | from_yaml -%}
              {%- set deltas = y.get('deltas', []) -%}
              {%- if deltas | length > 0 -%}
                {%- set _ = out.append(h ~ ':' ~ (deltas | length)) -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out | join('|') }}
      delegate_to: localhost
      run_once: true

    - name: Notify board-api when fleet service drift found
      ansible.builtin.uri:
        url: "{{ board_api_base }}/card"
        method: POST
        body_format: json
        status_code: [200, 201, 400]
        return_content: true
        body:
          id: ansible-fleet-service-drift
          title: "Ansible audit: fleet service drift detected"
          column: backlog
          action: {type: manual}
          from: "{{ board_from }}"
          spec: >-
            Read-only ansible audit-fleet-services detected service/resource drift vs ssot.audit.hosts.yml.
            Hosts: {{ fleet_service_drift_hosts | map(attribute='host') | join(', ') }}.
            Report dir: reports/ansible-benchmark/services/. No remediation performed.
      when:
        - board_notify | bool
        - (fleet_service_drift_hosts | length) > 0
      register: fleet_drift_card
      delegate_to: localhost
      run_once: true

    - name: Fail on unexpected fleet drift card create error
      ansible.builtin.fail:
        msg: "board-api /card create failed: {{ fleet_drift_card.content | default('') }}"
      when:
        - board_notify | bool
        - (fleet_service_drift_hosts | length) > 0
        - fleet_drift_card.status not in [200, 201]
        - "'already exists' not in (fleet_drift_card.content | default(''))"
      delegate_to: localhost
      run_once: true

    - name: Fetch fleet drift card for comment dedupe
      ansible.builtin.uri:
        url: "{{ board_api_base }}/card/ansible-fleet-service-drift"
        method: GET
        return_content: true
        status_code: [200, 404]
      register: fleet_drift_card_for_comment
      delegate_to: localhost
      run_once: true
      when:
        - board_notify | bool
        - (fleet_service_drift_hosts | length) > 0

    - name: Compute fleet drift comment dedupe
      ansible.builtin.set_fact:
        fleet_drift_comment_text: >-
          ansible audit-fleet-services: {{ fleet_service_drift_hosts | length }} host(s) with drift.
          fp={{ fleet_service_fingerprint }}. {{ fleet_service_drift_hosts | to_json }}
        fleet_drift_comment_is_dup: >-
          {{
            (fleet_drift_card_for_comment.status | default(404)) == 200
            and (
              ((fleet_drift_card_for_comment.json.card.comms | default([]))
                | selectattr('from', 'equalto', board_from)
                | selectattr('text', 'defined')
                | selectattr('text', 'search', 'fp=' ~ (fleet_service_fingerprint | regex_escape))
                | list | length) > 0
            )
          }}
      delegate_to: localhost
      run_once: true
      when:
        - board_notify | bool
        - (fleet_service_drift_hosts | length) > 0

    - name: Comment fleet drift summary
      ansible.builtin.uri:
        url: "{{ board_api_base }}/comment"
        method: POST
        body_format: json
        status_code: [200, 201]
        body:
          id: ansible-fleet-service-drift
          from: "{{ board_from }}"
          text: "{{ fleet_drift_comment_text }}"
      when:
        - board_notify | bool
        - (fleet_service_drift_hosts | length) > 0
        - not (fleet_drift_comment_is_dup | default(false) | bool)
      delegate_to: localhost
      run_once: true

    - name: Fetch fleet drift card for cleared check
      ansible.builtin.uri:
        url: "{{ board_api_base }}/card/ansible-fleet-service-drift"
        method: GET
        return_content: true
        status_code: [200, 404]
      register: fleet_drift_card_for_cleared
      delegate_to: localhost
      run_once: true
      when:
        - board_notify | bool
        - (fleet_service_drift_hosts | length) == 0

    - name: Compute fleet drift cleared comment
      ansible.builtin.set_fact:
        fleet_drift_cleared_comment: >-
          ansible audit-fleet-services: all clear, no drift hosts. fp=cleared.
        fleet_drift_cleared_needed: >-
          {{
            (fleet_drift_card_for_cleared.status | default(404)) == 200
            and (
              ((fleet_drift_card_for_cleared.json.card.comms | default([]))
                | selectattr('from', 'equalto', board_from)
                | selectattr('text', 'defined')
                | selectattr('text', 'search', 'fp=')
                | list | length) > 0
            )
            and (
              ((fleet_drift_card_for_cleared.json.card.comms | default([]))
                | selectattr('from', 'equalto', board_from)
                | selectattr('text', 'defined')
                | selectattr('text', 'search', 'fp=cleared')
                | list | length) == 0
            )
          }}
      delegate_to: localhost
      run_once: true
      when:
        - board_notify | bool
        - (fleet_service_drift_hosts | length) == 0

    - name: Comment fleet drift cleared
      ansible.builtin.uri:
        url: "{{ board_api_base }}/comment"
        method: POST
        body_format: json
        status_code: [200, 201]
        body:
          id: ansible-fleet-service-drift
          from: "{{ board_from }}"
          text: "{{ fleet_drift_cleared_comment }}"
      when:
        - board_notify | bool
        - (fleet_service_drift_hosts | length) == 0
        - fleet_drift_cleared_needed | default(false) | bool
      delegate_to: localhost
      run_once: true

    - name: Show kanban notify summary
      ansible.builtin.debug:
        msg:
          board_notify: "{{ board_notify }}"
          drift_hosts: "{{ fleet_service_drift_hosts | map(attribute='host') | list }}"
          comment_skipped_as_dup: "{{ fleet_drift_comment_is_dup | default(false) }}"
          cleared_comment_posted: "{{ fleet_drift_cleared_needed | default(false) }}"
      when: board_notify | bool
      delegate_to: localhost
      run_once: true
