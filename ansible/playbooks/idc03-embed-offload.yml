---
# idc03-embed-offload.yml — stop racing idc03's local bge-m3 on a 15 GiB box.
#
# 2026-11-27 evidence (embed-pool-shim /health on idc03:11436):
#   * remote 100.75.102.88 bge-m3: 1239 wins, warm embed ~0.07s, alive
#   * local  100.102.134.91 bge-m3: 21397 wins, last 4716ms, 17 consecutive
#     failures, currently marked dead; direct embed probe took 16.4s
# The shim races *all* primaries, so keeping local in the list forces a
# ~1.8 GiB model to stay resident and burns CPU/IO on every embed even when
# the remote wins. This play drops local from the primaries, keeps remote as
# the sole primary, and moves the second remote plus the kk-mac shim to the
# deferred tier (they join only after 1500ms with no winner).
#
# The local llama-server then unloads on its normal 5-minute keepalive. This
# play also explicitly stops bge-m3 (reversible: the next local call reloads
# it) to free the ~1.8 GiB immediately. No service data is touched; only the
# stateless shim is restarted.
#
# Usage (controller, ALWAYS --limit):
#   ansible-playbook playbooks/idc03-embed-offload.yml --check --diff --limit idc03
#   ansible-playbook playbooks/idc03-embed-offload.yml --limit idc03 \
#     -e idc03_embed_offload_approved=true \
#     -e card_id=mddb-idc03-oom-coldstart-publisher-window
#
# Rollback: delete the 60-idc03-remote-upstreams.conf drop-in, daemon-reload,
# restart embed-pool-shim.service; the old upstream list is in the unit file
# (systemctl --user cat embed-pool-shim.service shows every Environment line).
# A local bge-m3 reload happens automatically on the next /api/embed call.

- name: Offload idc03 embeddings to warm remote bge-m3
  hosts: idc03
  gather_facts: false
  become: false

  vars:
    idc03_embed_offload_approved: false
    shim_dropin_dir: /home/tony/.config/systemd/user/embed-pool-shim.service.d
    shim_dropin: /home/tony/.config/systemd/user/embed-pool-shim.service.d/60-idc03-remote-upstreams.conf
    shim_health_url: http://100.102.134.91:11436/health

  tasks:
    - name: Require explicit approval and traceability for a real run
      ansible.builtin.assert:
        that:
          - idc03_embed_offload_approved | bool
          - card_id is defined or card_ref is defined
        fail_msg: >-
          This is a PREP preview. Re-run with
          -e idc03_embed_offload_approved=true and -e card_id=<card>.
      when: not ansible_check_mode
      tags: [always]

    - name: Ensure the shim drop-in directory exists
      ansible.builtin.file:
        path: "{{ shim_dropin_dir }}"
        state: directory
        owner: tony
        group: tony
        mode: "0755"
      tags: [offload]

    - name: Install remote-only upstream drop-in
      ansible.builtin.copy:
        dest: "{{ shim_dropin }}"
        owner: tony
        group: tony
        mode: "0644"
        content: |
          # Managed by chaba/ansible (idc03-embed-offload.yml). Do not edit on host.
          # Local ollama bge-m3 took ~16s/embed on this 15 GiB box; remote is ~0.07s.
          [Service]
          Environment=EMBED_POOL_UPSTREAMS=http://100.75.102.88:11434
          Environment=EMBED_POOL_DEFER_UPSTREAMS=http://100.72.146.39:11434,http://127.0.0.1:11447
          Environment=EMBED_POOL_TIMEOUT_S=8
      tags: [offload]

    - name: Reload the user systemd manager
      ansible.builtin.command:
        argv: [systemctl, --machine=tony@.host, --user, daemon-reload]
      become: true
      changed_when: false
      when: not ansible_check_mode
      tags: [offload]

    - name: Restart the stateless embed shim
      ansible.builtin.command:
        argv: [systemctl, --machine=tony@.host, --user, restart, embed-pool-shim.service]
      become: true
      changed_when: false
      when: not ansible_check_mode
      tags: [offload]

    - name: Read shim health after convergence
      ansible.builtin.command:
        argv: [curl, -s, --max-time, "8", "{{ shim_health_url }}"]
      changed_when: false
      register: shim_health
      when: not ansible_check_mode
      tags: [verify]

    - name: Assert the local ollama upstream is gone and remote is primary
      ansible.builtin.assert:
        that:
          - "'http://100.102.134.91:11434' not in shim_health.stdout"
          - "'http://100.75.102.88:11434' in shim_health.stdout"
        fail_msg: "Unexpected shim upstreams: {{ shim_health.stdout }}"
      when: not ansible_check_mode
      tags: [verify]

    - name: Stop the local bge-m3 model to release ~1.8 GiB immediately
      # Reversible: the next local /api/embed call reloads the model. Tolerant
      # of the model already being unloaded by its keepalive.
      ansible.builtin.command:
        argv: [podman, exec, ollama, ollama, stop, bge-m3]
      register: local_model_stop
      changed_when: local_model_stop.rc == 0
      failed_when: false
      when: not ansible_check_mode
      tags: [offload]

    - name: Report model stop result
      ansible.builtin.debug:
        msg: "ollama stop bge-m3: {{ local_model_stop.stdout | default('') | trim }}"
      when: not ansible_check_mode
      tags: [verify]
