---
# Shared contract assertions for the ada-ocb pane. Included by
# ada-ocb-verify.yml (standalone gate) and ada-ocb-upgrade.yml (post-gate).
# Runs on the controller: loads the declared contract, probes the public
# edge, then asserts producer + consumer proof against every pane host.
# A stale pin in inventory vs ssot.audit.hosts.yml fails loudly.
#
# Optional: ocb_assert_label — short label used in the final verdict.

- name: Load the declared pane contract
  ansible.builtin.include_vars: "{{ playbook_dir }}/../inventory/group_vars/ocb_pane.yml"

- name: Resolve the SSOT contract source
  ansible.builtin.set_fact:
    ocb_ssot_raw: "{{ lookup('file', playbook_dir ~ '/../../docs/ssot/infrastructure/ssot.audit.hosts.yml') }}"

- name: Include the public-edge probe
  ansible.builtin.include_tasks: ada-ocb-edge-probe.yml

- name: Pins agree with the SSOT declaration
  ansible.builtin.assert:
    that:
      - "'@openchamber/web@' ~ ocb_web_version in ocb_ssot_raw"
      - "'@opencode/cli@' ~ ocb_cli_version in ocb_ssot_raw"
    success_msg: "Pins {{ ocb_web_version }} / {{ ocb_cli_version }} are declared in ssot.audit.hosts.yml"
    fail_msg: >-
      Pins in inventory/group_vars/ocb_pane.yml are stale — update them
      together with ssot.audit.hosts.yml (single source of truth).

- name: Producer contract on each probed pane host
  ansible.builtin.assert:
    that:
      - "p.web_version == ocb_web_version or ocb_role_val not in ocb_strict_roles"
      - "p.cli_version == ocb_cli_version or ocb_role_val not in ocb_strict_roles"
      - "(required_units | difference((p.get('units', {}) | dict2items | map(attribute='key') | list))) | length == 0"
      - "(required_units | map('extract', p.get('units', {})) | reject('equalto', 'active') | list) | length == 0"
      - "p.get('bind_3000') == ocb_bind"
      - "p.get('local_http') == '200'"
      - "p.get('patch_present') | bool or ocb_role_val not in ocb_strict_roles"
      - "p.get('startup_env_mode') == '600'"
      - "p.get('litellm_dropin') | bool"
    success_msg: "{{ target }} ({{ ocb_role_val }}) producer contract OK"
    fail_msg: >-
      {{ target }} ({{ ocb_role_val }}) producer drift: web={{ p.get('web_version') }}
      cli={{ p.get('cli_version') }} required_units={{ required_units }}
      units={{ p.get('units') }} bind={{ p.get('bind_3000') }} local={{ p.get('local_http') }}
      patch={{ p.get('patch_present') }} startup_mode={{ p.get('startup_env_mode') }}
      litellm={{ p.get('litellm_dropin') }}
      probe_error={{ p.get('error') }}
  loop: "{{ groups['ocb_pane'] }}"
  loop_control:
    loop_var: target
  vars:
    p: "{{ hostvars[target].ocb_probe | default({}) }}"
    ocb_role_val: "{{ hostvars[target].ocb_role | default('fallback') }}"
    required_units: "{{ ocb_required_units + (ocb_primary_extra_units if ocb_role_val == 'primary' else []) }}"
  when: >-
    hostvars[target].ocb_probe is defined
    and hostvars[target].ocb_probe.error is not defined

- name: Strict-role hosts must have been probed this run
  ansible.builtin.assert:
    that:
      - "hostvars[target].ocb_probe is defined"
      - "hostvars[target].ocb_probe.error is not defined"
    success_msg: "{{ target }} ({{ hostvars[target].ocb_role | default('fallback') }}) probe present"
    fail_msg: >-
      {{ target }} is role={{ hostvars[target].ocb_role | default('fallback') }}
      (strict) but produced no usable ocb_probe — excluded by --limit or
      unreachable. The contract gate cannot pass an unverified strict host.
  loop: "{{ groups['ocb_pane'] }}"
  loop_control:
    loop_var: target
  when: (hostvars[target].ocb_role | default('fallback')) in ocb_strict_roles

- name: Report (non-fatal) drift on the probed soak fallback
  ansible.builtin.debug:
    msg: >-
      INFO {{ target }} is role={{ hostvars[target].ocb_role | default('fallback') }}
      (not strict): observed web={{ hostvars[target].ocb_probe.web_version }}
      cli={{ hostvars[target].ocb_probe.cli_version }}
      patch={{ hostvars[target].ocb_probe.patch_present }} — reported,
      not a gate failure (pre-migration soak copy pending Tony's retire
      decision).
  loop: "{{ groups['ocb_pane'] }}"
  loop_control:
    loop_var: target
  when: >-
    hostvars[target].ocb_role | default('fallback') not in ocb_strict_roles
    and hostvars[target].ocb_probe is defined
    and hostvars[target].ocb_probe.error is not defined

- name: Report unprobed soak fallback (non-strict, not a gate failure)
  ansible.builtin.debug:
    msg: >-
      INFO {{ target }} (fallback) produced no ocb_probe this run —
      excluded by --limit or unreachable{% if hostvars[target].ocb_probe is defined %}
      :: {{ hostvars[target].ocb_probe.error }}{% endif %}. Reported as
      unreachable in benchmark evidence; not a contract failure
      (pre-migration soak copy pending Tony's retire decision).
  loop: "{{ groups['ocb_pane'] }}"
  loop_control:
    loop_var: target
  when: >-
    hostvars[target].ocb_role | default('fallback') not in ocb_strict_roles
    and (hostvars[target].ocb_probe is not defined
         or hostvars[target].ocb_probe.error is defined)

- name: Consumer contract (public edge a user actually touches)
  ansible.builtin.assert:
    that:
      - "ocb_edge.http == '200'"
      - "ocb_edge_csp_must_contain in ocb_edge.csp"
    success_msg: "Edge 200 with CSP containing {{ ocb_edge_csp_must_contain }}"
    fail_msg: "Public edge drift: http={{ ocb_edge.http }} csp={{ ocb_edge.csp }}"

- name: Verdict
  ansible.builtin.debug:
    msg: >-
      PASS — {{ ocb_assert_label | default('ada-ocb') }}: producer + consumer
      contract verified on {{ groups['ocb_pane'] | join(', ') }}
