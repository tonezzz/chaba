# Micro-bench variant definitions — one entry per polish-model x
# downstream-model pair. bench.py --variant <id> runs the full fixture
# manifest through the pipeline: raw -> polish (or none) -> downstream.
#
# Fields:
#   id          unique slug (bench.py --variant <id>)
#   polish      null (= direct baseline, raw goes straight downstream)
#               or {provider, base_url, model, prompt} — the micro-AI step.
#               `prompt` names a template in lib.POLISH_PROMPTS.
#   downstream  {provider, base_url, model} — the receiving AI under test.
#               provider openai_compat covers ollama/llama.cpp/vllm /v1.
#               provider gemini uses GEMINI_API_KEY (or
#               ~/.config/secrets/gemini-api-key.env) + generateContent.
#   host_labels runner capability labels (same convention as voice-bench)
#   notes       free text
#
# Adopt gate lives in report.py: polish wins only if match-rate >= the
# direct baseline AND net tokens OR e2e latency is neutral-or-better.

variants:
  - id: direct-llama32
    polish: null
    downstream:
      provider: openai_compat
      base_url: http://100.102.134.91:11434/v1
      model: llama3.2:3b
    host_labels: []
    notes: "Baseline — raw input straight to llama3.2:3b on idc03.
      Establishes the no-polish floor for every metric."

  - id: polish-llama32-llama32
    polish:
      provider: openai_compat
      base_url: http://100.102.134.91:11434/v1
      model: llama3.2:3b
      prompt: normalize_v1
    downstream:
      provider: openai_compat
      base_url: http://100.102.134.91:11434/v1
      model: llama3.2:3b
    host_labels: []
    notes: "llama3.2:3b as both polisher and receiver on idc03 — cheapest
      fully-local variant; measures whether self-polish helps a small model."

  - id: polish-llama32-gemini
    polish:
      provider: openai_compat
      base_url: http://100.102.134.91:11434/v1
      model: llama3.2:3b
      prompt: normalize_v1
    downstream:
      provider: gemini
      model: gemini-3.5-flash-lite
    host_labels: []
    notes: "The production-shaped variant: local 3B polish -> real Ada
      downstream. Needs GEMINI_API_KEY; skipped fixtures error out if absent."

  - id: polish-gate-llama32-llama32
    polish:
      provider: openai_compat
      base_url: http://100.102.134.91:11434/v1
      model: llama3.2:3b
      prompt: normalize_v1
      gate: lang_preserve
    downstream:
      provider: openai_compat
      base_url: http://100.102.134.91:11434/v1
      model: llama3.2:3b
    host_labels: []
    notes: "Same as polish-llama32-llama32 but post-polish gate rejects
      script-family drift (EN->TH translation = the observed failure).
      Measures whether a sanity gate makes a weak polisher deployable:
      bad polish falls back to raw instead of poisoning downstream."

  - id: polish-t5en-gated-llama32
    polish:
      provider: ssh_cmd
      cmd: ssh idc03 /tmp/micro-bench-t5.py
      model: dayyanj/dj-ai-asr-grammar-corrector-small
      gate: lang_preserve
    downstream:
      provider: openai_compat
      base_url: http://100.102.134.91:11434/v1
      model: llama3.2:3b
    host_labels: []
    notes: "TESTED AND REJECTED 2026-10-11: dayyanj T5-small AND T5-base
      correct none of our real ASR noise classes (semantic mishearings are
      out of its function-word grammar scope; base made 'till running'
      WORSE). Kept registered as harness coverage for the ssh_cmd provider
      + gate; do not expect gains. Runner lives at idc03:/tmp/micro-bench-t5.py"

  - id: polish-pregate-gemini
    polish:
      provider: gemini
      model: gemini-3.5-flash-lite
      prompt: normalize_v1
      pre_gate: noise_dict
      gate: lang_preserve
    downstream:
      provider: gemini
      model: gemini-3.5-flash-lite
    host_labels: []
    notes: "THE DEPLOY SHAPE (preprompt precedent): cheap dict gate decides
      per-input whether polish is worth the token/latency tax. Catches
      typos+gibberish+code-switch, skips clean+real-word-mishearings
      (that class needs ASR confidence — absent on text). Runs on dell."

  - id: polish-gemini-gemini
    polish:
      provider: gemini
      model: gemini-3.5-flash-lite
      prompt: normalize_v1
      gate: lang_preserve
    downstream:
      provider: gemini
      model: gemini-3.5-flash-lite
    host_labels: []
    notes: "Quality-ceiling test: a STRONG model as polisher vs the same
      downstream. If even a good normalizer can't beat direct on the
      strong receiver, the polish idea is dead at this insertion point —
      not just the small model. Runs on dell (key lives there)."

  - id: direct-gemini
    polish: null
    downstream:
      provider: gemini
      model: gemini-3.5-flash-lite
    host_labels: []
    notes: "Baseline for the gemini-downstream variant — same receiving
      model so polish-vs-direct deltas are apples-to-apples."

  # --- future: omen phi3-gguf (ollama :11434/v1, currently unreachable from
  #     macbook), macbook Vulkan llama.cpp server (host-roles offload lane),
  #     a bigger polisher (llama3.1:8b) as the quality ceiling ---

  - id: dry-run-dummy
    polish: null
    downstream:
      provider: mock
      model: none
    host_labels: []
    notes: "Harness self-test — exercises the result schema with no services."
