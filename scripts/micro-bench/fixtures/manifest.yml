    category: asr_noise_th
    raw: ไฟในครูเปิดอยู่ไหม
    gold: ไฟในครัวเปิดอยู่ไหม
    preserve: [ไฟ]
    expected_tool_call: {name: hass_get_state, args: {entity: light.kitchen}}
