# Micro-bench fixtures — messy user inputs for the input-polish hypothesis.
#
# Each fixture: raw user text -> optional micro-AI polish -> downstream AI.
# Scored on: downstream tool_call vs expected (exact/partial/none/fabricated),
# entity preservation through the polish step, and (for polish variants)
# similarity of the polished text to `gold`.
#
# Fields:
#   id                  unique slug
#   lang                en | th | mixed (drives normalization)
#   category            asr_noise_en | asr_noise_th | thai_eng_mix | typo |
#                       fragment | clean | entity_heavy | chit_chat |
#                       ambiguous | gibberish
#   raw                 the input exactly as a user/ASR produced it
#   gold                canonical form the polish step should approach
#   preserve            strings that MUST survive polishing verbatim
#                       (normalized compare; entity-drift detector)
#   expected_tool_call  semantic call the downstream should emit, or null.
#                       null + a real call emitted = "fabricated" (invention
#                       by polish or downstream — the key regression signal)
fixtures:
  # --- English ASR mishearings (homophones, dropped/split words) ---
  - id: asr-en-kitten-lice
    lang: en
    category: asr_noise_en
    raw: turn on the kitten lice
    gold: turn on the kitchen lights
    preserve: [kitchen]
    expected_tool_call: {name: hass_turn_on, args: {domain: light, area: kitchen}}
  - id: asr-en-twenty-for
    lang: en
    category: asr_noise_en
    raw: set the air con to twenty for degrees
    gold: set the air conditioner to 24 degrees
    preserve: ["24"]
    expected_tool_call: {name: hass_set_temperature, args: {temperature: 24}}
  - id: asr-en-watching-machine
    lang: en
    category: asr_noise_en
    raw: is the watching machine till running
    gold: is the washing machine still running
    preserve: [washing machine]
    expected_tool_call: {name: hass_get_state, args: {entity: sensor.washer_power}}
  - id: asr-en-font-door
    lang: en
    category: asr_noise_en
    raw: lock the font door
    gold: lock the front door
    preserve: [front door]
    expected_tool_call: {name: hass_lock, args: {entity: front_door}}
  - id: asr-en-temperate
    lang: en
    category: asr_noise_en
    raw: what's the temperate outside right now
    gold: what is the temperature outside right now
    preserve: [outside]
    expected_tool_call: {name: hass_get_state, args: {entity: sensor.outside_temperature}}
  - id: asr-en-living-van
    lang: en
    category: asr_noise_en
    raw: turn of the living room van
    gold: turn off the living room fan
    preserve: [living room, fan]
    expected_tool_call: {name: hass_turn_off, args: {domain: fan, area: living_room}}
  - id: asr-en-soldier-power
    lang: en
    category: asr_noise_en
    raw: how much soldier power are we generating
    gold: how much solar power are we generating
    preserve: [solar]
    expected_tool_call: {name: hass_get_state, args: {entity: sensor.solar_power}}
  # --- Thai ASR mishearings ---
  - id: asr-th-fai-krap
    lang: th
    category: asr_noise_th
    raw: เปิดไฟครับ
    gold: เปิดไฟครัว
    preserve: [ไฟ]
    expected_tool_call: {name: hass_turn_on, args: {domain: light, area: kitchen}}
  - id: asr-th-tid-air
    lang: th
    category: asr_noise_th
    raw: ติดแอร์ห้องนอน
    gold: ปิดแอร์ห้องนอน
    preserve: [แอร์, ห้องนอน]
    expected_tool_call: {name: hass_turn_off, args: {domain: climate, area: bedroom}}
  - id: asr-th-unapumi
    lang: th
    category: asr_noise_th
    raw: อุณภูมิข้างนอกกี่องศา
    gold: อุณหภูมิข้างนอกกี่องศา
    preserve: [ข้างนอก]
    expected_tool_call: {name: hass_get_state, args: {entity: sensor.outside_temperature}}
  - id: asr-th-pratu-rok
    lang: th
    category: asr_noise_th
    raw: ประตูหน้ารอกอยู่ไหม
    gold: ประตูหน้าล็อกอยู่ไหม
    preserve: [ประตู]
    expected_tool_call: {name: hass_get_state, args: {entity: lock.front_door}}
  - id: asr-th-fai-kru
