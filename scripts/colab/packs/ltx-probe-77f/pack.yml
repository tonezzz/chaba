# ltx-probe-77f — T4 ceiling probe, closed-branch-by-design.
# 73f/40s peaked 13.7GB (fits); 97f OOM'd (bracket: ceiling 74-96).
# LTX frames are 8n+1 → probe 81f first, then 89f if it fits. Records
# verdict in probe-result.md EITHER WAY — OOM is a deliverable, not a
# job failure. Uses the s1 shot0 embeds already staged on Drive.
name: ltx-probe-77f
needs:
  gpu_gb: 14
  disk_gb: 30
  egress_only_ok: true
timeout_s: 1200
artifacts:
  - packs/ltx-probe-77f/probe-result.md   # gate; the mp4 (on success)
                                        # lands in the same dir, ungated
prep: |
  # fast path: restore the Drive model archive — a blind HF re-pull ran
  # ~80s/file on 2026-10-23 (an hour of metered GPU idle). Tar layout
  # varies: check whether it carries a hub/ prefix, extract accordingly,
  # then snapshot_download only validates/fills gaps.
  TAR=$NEST_ROOT/model-archive/hf/ltx-slim.tar.zst
  # slim (per-repo) archive preferred: 9GB vs the 17.4GB full
  # repo tar — the render/probe needs only transformer/vae/scheduler
  [ -f "$TAR" ] || TAR=$NEST_ROOT/model-archive/hf/ltx-video.tar.zst
  apt-get install -y -qq zstd >/dev/null 2>&1 || true
  if [ -f "$TAR" ]; then
    tar -I zstd -tf "$TAR" 2>/dev/null | head -1 | grep -q '^hub/' \
      && DEST=/root/.cache/huggingface || DEST=/root/.cache/huggingface/hub
    mkdir -p "$DEST" && tar -I zstd -xf "$TAR" -C "$DEST" || true
  fi
  if ls "$DEST/models--Lightricks--LTX-Video"/snapshots/*/transformer/*.safetensors >/dev/null 2>&1; then
    echo "weights present — snapshot_download skipped"
  else
    python -c "from huggingface_hub import snapshot_download; snapshot_download('Lightricks/LTX-Video',ignore_patterns=['text_encoder/*','tokenizer/*','*.bin','*fp8*','*gguf*'])"
  fi
run: |
  import os, torch, time, datetime, gc
  for _v in ('model', 'pipe'):
      globals().pop(_v, None)
  gc.collect(); torch.cuda.empty_cache()
  from diffusers import LTXPipeline
  from diffusers.utils import export_to_video
  EMB = f'{NEST_ROOT}/renders/ltx-embeds-s1'
  verdict, note = 'FAIL', ''
  try:
      pipe = LTXPipeline.from_pretrained('Lightricks/LTX-Video',
          torch_dtype=torch.bfloat16, text_encoder=None,
          tokenizer=None).to('cuda')
      e = {k: (v.cuda() if torch.is_tensor(v) else v)
           for k, v in torch.load(f'{EMB}/shot0.pt',
                                  map_location='cpu').items()}
      t = time.time()
      fr = pipe(prompt_embeds=e['prompt_embeds'],
          prompt_attention_mask=e['prompt_attention_mask'],
          negative_prompt_embeds=e['negative_prompt_embeds'],
          negative_prompt_attention_mask=e['negative_prompt_attention_mask'],
          width=640, height=384, num_frames=77,
          num_inference_steps=40, frame_rate=24).frames[0]
      ts = datetime.datetime.now().strftime('%Y%m%d-%H%M')
      export_to_video(fr, f'{PACK_DIR}/ltx_s1_probe_81f_{ts}.mp4', fps=24)
      verdict = 'OK'
      note = (f"81f rendered in {time.time()-t:.0f}s, "
              f"peak {torch.cuda.max_memory_allocated()/1e9:.1f}GB")
  except Exception as e:
      note = f'{type(e).__name__}: {str(e)[:400]}'
  md = ['# ltx-probe-77f — T4 ceiling probe', '',
        f'verdict: **{verdict}**', '', note, '',
        'context: 73f/40s peaked 13.7GB (fits); 97f OOM\'d. Probing 81f.',
        'result decides max frames/clip for T4 renders.']
  open(f'{PACK_DIR}/probe-result.md', 'w').write('\n'.join(md) + '\n')
  print('verdict:', verdict, note, flush=True)
