# nasa-embeds-ss1 — T5-XXL prompt embeds for the solar-system doc pilot
# (OPS-0793). CPU-friendly: t5xxl bf16 is ~10GB RAM, encode is seconds
# per prompt — keeps metered Colab GPU for render only. Reads prompts
# from inputs/storyboard.yml (copy of doc-pilot/storyboard.yml v0-draft).
# Writes per-shot .pt in the same 4-key format as renders/ltx-embeds-s1
# (prompt_embeds/mask + negative_*). Also persists the T5 encoder to
# model-archive/t5xxl/ as plain save_pretrained dirs — first run pulls
# ~10GB from HF, later runs (and future docs) load straight from Drive.
name: nasa-embeds-ss1
needs:
  gpu_gb: 0       # cpu-ok: fits() treats 0 as no requirement
  ram_gb: 13      # T5-XXL CPU path needs more than a 12GB worker
  disk_gb: 30
venv: true
keep_workdir: true    # retain the fetched T5 archive after transient failures
fetch_timeout_s: 3600 # the ~9GB archive can exceed rclone's default timeout
publish_timeout_s: 3600
timeout_s: 3600   # dominated by the first-run ~10GB HF pull
fetch:
  - model-archive/t5xxl/          # after first run: local, skip HF
artifacts:
  - packs/nasa-embeds-ss1/embeds/shot*.pt
publish:
  model-archive/t5xxl: model-archive/t5xxl   # fleet-side Drive persist
prep: |
  pip install -q torch transformers pyyaml tiktoken sentencepiece protobuf
  python -c "import torch, transformers; print('torch', torch.__version__, 'cuda', torch.cuda.is_available())"
run: |
  import os, time
  import torch
  import yaml
  from transformers import T5EncoderModel, AutoTokenizer, T5TokenizerFast
  IN = f'{PACK_DIR}/inputs'
  OUT = f'{PACK_DIR}/embeds'; os.makedirs(OUT, exist_ok=True)
  ARC_LOCAL = f'{PACK_DIR}/model-archive/t5xxl'
  ARC_FETCH = f'{NEST_ROOT}/model-archive/t5xxl'
  sb = yaml.safe_load(open(f'{IN}/storyboard.yml', encoding='utf-8'))
  STYLE = sb['style_suffix'].strip()
  NEG = sb.get('negative', '') + ', worst quality, inconsistent motion, blurry, jittery, distorted'
  dev = ('cuda' if torch.cuda.is_available() and
         torch.cuda.get_device_properties(0).total_memory >= 12e9
         else 'cpu')   # T5-XXL bf16 ~9.5GB — small GPUs (1650) go CPU
  t0 = time.time()
  archive_exists = os.path.exists(f'{ARC_FETCH}/encoder/config.json')
  if archive_exists:
      src_tok, src_enc = f'{ARC_FETCH}/tokenizer', f'{ARC_FETCH}/encoder'
      if (os.path.isfile(f'{src_tok}/tokenizer.json') and
              not os.path.isfile(f'{src_tok}/spiece.model')):
          # The archived fast tokenizer is self-contained even when the
          # sentencepiece sidecar was omitted by a prior save_pretrained.
          tok = T5TokenizerFast(tokenizer_file=f'{src_tok}/tokenizer.json')
          print('loaded T5 fast tokenizer from tokenizer.json '
                '(spiece.model absent)', flush=True)
      else:
          tok = AutoTokenizer.from_pretrained(src_tok)
      enc = T5EncoderModel.from_pretrained(src_enc, torch_dtype=torch.bfloat16,
                                           low_cpu_mem_usage=True)
  else:
      print('no t5xxl archive — pulling from HF (~10GB)', flush=True)
      src_tok = src_enc = 'Lightricks/LTX-Video'
      tok = AutoTokenizer.from_pretrained(src_tok, subfolder='tokenizer')
      enc = T5EncoderModel.from_pretrained(src_enc, subfolder='text_encoder',
                                           torch_dtype=torch.bfloat16,
                                           low_cpu_mem_usage=True)
  enc = enc.to(dev).eval()
  print(f't5xxl ready {time.time()-t0:.0f}s dev={dev}', flush=True)

  MAXL = 256   # matches renders/ltx-embeds-s1 (.pt = 2MiB: 4096x256 bf16)
  def encode(prompt):
      ti = tok(prompt, padding='max_length', max_length=MAXL,
               truncation=True, add_special_tokens=True,
               return_tensors='pt')
      mask = ti.attention_mask.bool().to(dev)
      with torch.no_grad():
          emb = enc(ti.input_ids.to(dev))[0]   # pipeline passes NO mask
      return emb.to('cpu'), mask.to('cpu')

  neg_e, neg_m = encode(NEG)
  for s in sb['shots']:
      out = f'{OUT}/shot{s["shot"]:02d}.pt'
      if os.path.exists(out):
          print(f'shot{s["shot"]} cached', flush=True); continue
      prompt = f"{s['prompt']}, {STYLE}"
      e, m = encode(prompt)
      torch.save({'prompt_embeds': e, 'prompt_attention_mask': m,
                  'negative_prompt_embeds': neg_e,
                  'negative_prompt_attention_mask': neg_m}, out)
      print(f'shot{s["shot"]} embedded {time.time()-t0:.0f}s', flush=True)
  # Persist only after the first HF download. Re-saving a shared 9GB
  # encoder on every retry creates a pointless Drive upload.
  if not archive_exists:
      try:
          os.makedirs(ARC_LOCAL, exist_ok=True)
          tok.save_pretrained(f'{ARC_LOCAL}/tokenizer')
          enc.save_pretrained(f'{ARC_LOCAL}/encoder')
          print('t5xxl archive saved', flush=True)
      except Exception as e:
          print(f'archive save skipped: {type(e).__name__}: {str(e)[:120]}',
                flush=True)
  print('nasa-embeds-ss1 complete', flush=True)
