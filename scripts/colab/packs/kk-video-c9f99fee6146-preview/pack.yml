# kk-video-c9f99fee6146-preview — private teaser preview for KK project.
# 10 shots @73f/40step/640x384 (proven T4 ceiling). Shots 2 and 10 are
# i2v last-frame continuations of shots 1 and 17 (the pull-back/pull-in
# moves); everything else is t2v. Order: t2v batch first, extract last
# frames, then the two i2v shots — keeps ONE pipeline resident at a time
# (two pipelines ~19GB > T4). Resumable: per-shot exists-check — a
# recycled VM continues at the missing shot. Embeds come from
# packs/doc-embeds-ss1/embeds (fetch mirrors them on fleet; on Colab the
# store path resolves directly).
name: kk-video-c9f99fee6146-preview
needs:
  gpu_gb: 14
  disk_gb: 30
  egress_only_ok: true
timeout_s: 9000    # 18 shots x ~5min + two model loads; resume-safe
fetch:
  - packs/kk-video-c9f99fee6146-embeds/embeds/
artifacts:
  - packs/kk-video-c9f99fee6146-preview/shots/kk-shot*.mp4
  - packs/kk-video-c9f99fee6146-preview/teaser-preview.mp4
  - packs/kk-video-c9f99fee6146-preview/teaser-preview.th.srt
  - packs/kk-video-c9f99fee6146-preview/teaser-preview.en.srt
  - packs/kk-video-c9f99fee6146-preview/narration.mp3
  - packs/kk-video-c9f99fee6146-preview/verdict.md
publish:
  shots: kk-video-c9f99fee6146/renders
prep: |
  TAR=$NEST_ROOT/model-archive/hf/ltx-slim.tar.zst
  # slim (per-repo) archive preferred: 9GB vs the 17.4GB full
  # repo tar — the render/probe needs only transformer/vae/scheduler
  [ -f "$TAR" ] || TAR=$NEST_ROOT/model-archive/hf/ltx-video.tar.zst
  apt-get install -y -qq zstd ffmpeg >/dev/null 2>&1 || true
  pip install -q edge-tts >/dev/null 2>&1 || true
  if [ -f "$TAR" ]; then
    tar -I zstd -tf "$TAR" 2>/dev/null | head -1 | grep -q '^hub/' \
      && DEST=/root/.cache/huggingface || DEST=/root/.cache/huggingface/hub
    # skip re-extract when the snapshot already has real weights (~9GB+)
    if du -sh "$DEST/models--Lightricks--LTX-Video" 2>/dev/null | awk '$1+0 >= 9 {exit 1}'; then
      mkdir -p "$DEST" && tar -I zstd -xf "$TAR" -C "$DEST" || true
    fi
  fi
  # validate only what the pipeline reads — the 48-file snapshot list
  # includes variant files the slim cache never held (167s/it crawl
  # 2026-10-23); from_pretrained needs transformer/vae/scheduler only
  if ls "$DEST/models--Lightricks--LTX-Video"/snapshots/*/transformer/*.safetensors >/dev/null 2>&1; then
    echo "weights present — snapshot_download skipped"
  else
    if ls "$DEST/models--Lightricks--LTX-Video"/snapshots/*/transformer/*.safetensors >/dev/null 2>&1; then
    echo "weights present — snapshot_download skipped"
  else
    python -c "from huggingface_hub import snapshot_download; snapshot_download('Lightricks/LTX-Video',ignore_patterns=['text_encoder/*','tokenizer/*','*.bin','*fp8*','*gguf*'])"
  fi
  fi
run: |
  import os, time, datetime, gc, subprocess
  import torch
  for _v in ('model', 'pipe'):
      globals().pop(_v, None)
  gc.collect(); torch.cuda.empty_cache()
  from diffusers import LTXPipeline, LTXImageToVideoPipeline
  from diffusers.utils import export_to_video, load_image
  EMB = f'{NEST_ROOT}/packs/kk-video-c9f99fee6146-embeds/embeds'
  OUT = f'{PACK_DIR}/shots'; os.makedirs(OUT, exist_ok=True)
  KF = f'{PACK_DIR}/keyframes'; os.makedirs(KF, exist_ok=True)
  I2V = {2: 1, 10: 9}           # shot -> last-frame source shot
  W, H, FR, STEPS = 640, 384, 73, 40
  verdict = ['# kk-video-c9f99fee6146-preview verdict', '',
             '| shot | mode | s | peakGB | note |', '|---|---|---|---|---|']

  def emb(n):
      return {k: (v.cuda() if torch.is_tensor(v) else v)
              for k, v in torch.load(f'{EMB}/shot{n:02d}.pt',
                                     map_location='cpu').items()}

  def run_pipe(pipe, n, image=None):
      e = emb(n)
      kw = dict(prompt_embeds=e['prompt_embeds'],
                prompt_attention_mask=e['prompt_attention_mask'],
                negative_prompt_embeds=e['negative_prompt_embeds'],
                negative_prompt_attention_mask=e['negative_prompt_attention_mask'],
                width=W, height=H, num_frames=FR,
                num_inference_steps=STEPS, frame_rate=24)
      if image is not None:
          kw['image'] = image
      return pipe(**kw).frames[0]

  def last_frame(mp4, png):
      subprocess.run(['ffmpeg', '-y', '-sseof', '-0.1', '-i', mp4,
                      '-frames:v', '1', '-update', '1', png],
                     capture_output=True)

  done = lambda n: os.path.exists(f'{OUT}/kk-shot{n:02d}.mp4') \
                   and os.path.getsize(f'{OUT}/kk-shot{n:02d}.mp4') > 50000

  # pass 1: t2v (all but the two i2v shots)
  pipe = LTXPipeline.from_pretrained('Lightricks/LTX-Video',
      torch_dtype=torch.bfloat16, text_encoder=None,
      tokenizer=None).to('cuda')
  print('t2v resident %.1fGB' % (torch.cuda.memory_allocated()/1e9), flush=True)
  for n in range(1, 11):
      if n in I2V or done(n):
          continue
      t = time.time(); note = ''
      try:
          fr = run_pipe(pipe, n)
          export_to_video(fr, f'{OUT}/kk-shot{n:02d}.mp4', fps=24)
      except Exception as e:
          note = f'{type(e).__name__}: {str(e)[:160]}'
      pk = torch.cuda.max_memory_allocated()/1e9
      verdict.append(f'| {n} | t2v | {time.time()-t:.0f} | {pk:.1f} | {note} |')
      print(f'shot{n} t2v {time.time()-t:.0f}s peak {pk:.1f}GB {note}', flush=True)
  del pipe; gc.collect(); torch.cuda.empty_cache()

  # pass 2: i2v shots 2 and 18
  if not all(done(n) for n in I2V):
      pipe = LTXImageToVideoPipeline.from_pretrained('Lightricks/LTX-Video',
          torch_dtype=torch.bfloat16, text_encoder=None,
          tokenizer=None).to('cuda')
      print('i2v resident %.1fGB' % (torch.cuda.memory_allocated()/1e9), flush=True)
      for n, src in I2V.items():
          if done(n):
              continue
          t = time.time(); note = ''
          try:
              src_mp4 = f'{OUT}/kk-shot{src:02d}.mp4'
              png = f'{KF}/shot{src:02d}-last.png'
              last_frame(src_mp4, png)
              fr = run_pipe(pipe, n, image=load_image(png))
              export_to_video(fr, f'{OUT}/kk-shot{n:02d}.mp4', fps=24)
          except Exception as e:
              note = f'{type(e).__name__}: {str(e)[:160]}'
          pk = torch.cuda.max_memory_allocated()/1e9
          verdict.append(f'| {n} | i2v:{src} | {time.time()-t:.0f} | {pk:.1f} | {note} |')
          print(f'shot{n} i2v {time.time()-t:.0f}s peak {pk:.1f}GB {note}', flush=True)
      del pipe; gc.collect(); torch.cuda.empty_cache()

  missing = [n for n in range(1, 11) if not done(n)]
  # Assemble a private review teaser from the ten short scene clips. The
  # deliberate 2x hold gives each 3s LTX clip roughly 6s of screen time.
  concat = f'{PACK_DIR}/shots/concat.txt'
  with open(concat, 'w') as fh:
      for n in range(1, 11):
          if done(n):
              fh.write("file '%s'\n" % f'{OUT}/kk-shot{n:02d}.mp4')
  teaser = f'{PACK_DIR}/teaser-preview.mp4'
  silent = f'{PACK_DIR}/teaser-preview-silent.mp4'
  if not os.path.exists(silent) and not missing:
      subprocess.run([
          'ffmpeg', '-y', '-f', 'concat', '-safe', '0', '-i', concat,
          '-vf', 'setpts=2.0*PTS', '-an', '-t', '60',
          '-c:v', 'libx264', '-pix_fmt', 'yuv420p', silent,
      ], check=False, capture_output=True)
  thai = (
      'เรื่องของพ่อ ความสูญเสีย ความฝัน และการเดินทางของลูกสาวที่เรียนรู้ '
      'ว่าสติช่วยให้เราผ่านช่วงเวลาที่ยากลำบากได้'
  )
  narration = f'{PACK_DIR}/narration.mp3'
  if not os.path.exists(narration):
      subprocess.run([
          'edge-tts', '--voice', 'th-TH-PremwadeeNeural',
          '--text', thai, '--write-media', narration,
      ], check=False, capture_output=True)
  if not os.path.exists(teaser) and os.path.exists(silent) \
          and os.path.exists(narration):
      subprocess.run([
          'ffmpeg', '-y', '-i', silent, '-i', narration,
          '-map', '0:v:0', '-map', '1:a:0', '-t', '60',
          '-c:v', 'copy', '-c:a', 'aac', '-shortest', teaser,
      ], check=False, capture_output=True)
  th_lines = [
      'ความผูกพันระหว่างพ่อกับลูกสาวเริ่มต้นจากความทรงจำที่อบอุ่น',
      'ความสูญเสียทำให้เธอต้องเติบโตและเป็นเสาหลักของครอบครัว',
      'ความฝันทั้งสี่เชื่อมโยงกับเหตุการณ์สำคัญในชีวิต',
      'แต่คำตอบของเรื่องราวนี้ยังคงเป็นคำถามที่เธอกำลังค้นหา',
  ]
  en_lines = [
      'A father and daughter begin with warm, ordinary memories.',
      'Loss forces her to grow into a pillar for the family.',
      'Four dreams become connected to moments that change her life.',
      'But the meaning remains a question she is still searching for.',
  ]
  def write_srt(path, lines):
      with open(path, 'w') as fh:
          for i, line in enumerate(lines):
              start = i * 15
              end = start + 15
              def ts(sec):
                  return '00:%02d:%02d,000' % (sec // 60, sec % 60)
              fh.write(f'{i + 1}\n{ts(start)} --> {ts(end)}\n{line}\n\n')
  write_srt(f'{PACK_DIR}/teaser-preview.th.srt', th_lines)
  write_srt(f'{PACK_DIR}/teaser-preview.en.srt', en_lines)
  verdict += ['', f'missing: {missing or "none"}']
  open(f'{PACK_DIR}/verdict.md', 'w').write('\n'.join(verdict) + '\n')
  print('kk-video preview done missing=%s' % missing, flush=True)
