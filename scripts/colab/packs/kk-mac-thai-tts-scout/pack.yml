# kk-mac-thai-tts-scout — the scout leaf of the TTS eval (OPS-0759 v3).
# Queries HF for Thai-capable TTS / voice-clone models -> candidates.md.
# Pure CPU + egress — the delegation demo: dell/omen can claim this
# pack; it does not need Colab at all.
name: kk-mac-thai-tts-scout
needs:
  disk_gb: 1
timeout_s: 300
artifacts:
  - packs/kk-mac-thai-tts-scout/candidates.md
run: |
  import json, urllib.request, os

  def q(url):
      req = urllib.request.Request(url, headers={'User-Agent': 'nest-scout'})
      return json.load(urllib.request.urlopen(req, timeout=30))

  cands = {}
  for url in (
      'https://huggingface.co/api/models?search=thai%20tts&limit=50',
      'https://huggingface.co/api/models?search=tts&filter=th&limit=50',
      'https://huggingface.co/api/models?search=voice%20clone&sort=downloads&direction=-1&limit=50',
      'https://huggingface.co/api/models?search=f5-tts&limit=50',
  ):
      try:
          for m in q(url):
              cands[m['id']] = m
      except Exception as e:
          print('query failed', url, e, flush=True)

  keep = []
  for mid, m in cands.items():
      tags = [str(t).lower() for t in m.get('tags') or []]
      blob = mid.lower() + ' '.join(tags)
      if any(k in blob for k in ('thai', '_th', '-th', 'th-tts', 'vits-th',
                                 'multilingual', 'f5-tts', 'xtts',
                                 'voxcpm', 'vyncx', 'thonburian',
                                 'voice-clone', 'voice_clone')):
          keep.append(m)
  keep.sort(key=lambda m: -(m.get('downloads') or 0))

  md = ['# kk-mac-thai-tts-scout — candidate list', '',
        f'{len(keep)} candidates (HF api, downloads-sorted)', '',
        '| model | downloads | likes | tags |', '|---|---|---|---|']
  for m in keep[:25]:
      tags = ','.join((m.get('tags') or [])[:6])
      md.append(f"| {m['id']} | {m.get('downloads',0)} | "
                f"{m.get('likes',0)} | {tags} |")
  open(f'{PACK_DIR}/candidates.md', 'w').write('\n'.join(md) + '\n')
  print(f'{len(keep)} candidates -> candidates.md', flush=True)
