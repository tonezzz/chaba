# gaussian-splat-edu-smoke — smallest real renderer proof for the education
# lesson. It creates a synthetic colored Gaussian scene, renders a short orbit
# with gsplat, and publishes an MP4 plus a still and measurement report.
#
# This intentionally proves the renderer before we spend time on COLMAP or
# video reconstruction. The next pack can replace the synthetic scene with a
# real PLY asset without changing the artifact contract.
name: gaussian-splat-edu-smoke-v2
needs:
  gpu_gb: 2
  ram_gb: 4
  disk_gb: 4
  egress_only_ok: true
timeout_s: 900
artifacts:
  - packs/gaussian-splat-edu-smoke-v2/out/gaussian-splat-edu-smoke-v2.mp4
  - packs/gaussian-splat-edu-smoke-v2/out/gaussian-splat-edu-smoke-v2.png
  - packs/gaussian-splat-edu-smoke-v2/report.md
prep: |
  pip install -q "gsplat>=1.5.3" imageio imageio-ffmpeg
run: |
  import os, time
  import imageio.v2 as imageio
  import torch
  from gsplat import rasterization

  OUT = f'{PACK_DIR}/out'
  os.makedirs(OUT, exist_ok=True)
  W, H, FRAMES = 640, 384, 48
  device = 'cuda' if torch.cuda.is_available() else 'cpu'
  if device != 'cuda':
      raise RuntimeError('education smoke requires a CUDA GPU')

  # Three colored Gaussian shells make depth ordering and alpha blending
  # visible while keeping the smoke test below a few thousand primitives.
  g = torch.Generator(device=device).manual_seed(42)
  n = 2400
  theta = torch.rand(n, device=device, generator=g) * 6.2831853
  z = torch.rand(n, device=device, generator=g) * 2.0 - 1.0
  r = torch.sqrt(torch.clamp(1.0 - z * z, min=0.0))
  shell = torch.stack((r * torch.cos(theta), r * torch.sin(theta), z), dim=-1)
  jitter = torch.randn((n, 3), device=device, generator=g) * 0.035
  means = shell * 0.95 + jitter
  scales = torch.full((n, 3), 0.035, device=device)
  quats = torch.zeros((n, 4), device=device)
  quats[:, 0] = 1.0
  opacities = torch.full((n,), 0.72, device=device)
  colors = torch.clamp((means + 1.0) * 0.5, 0.03, 0.98)
  Ks = torch.tensor(
      [[[W * 0.82, 0.0, W / 2], [0.0, W * 0.82, H / 2], [0.0, 0.0, 1.0]]],
      device=device, dtype=torch.float32)

  def look_at(angle):
      eye = torch.tensor([3.1 * torch.cos(angle), 3.1 * torch.sin(angle), 1.25],
                         device=device)
      target = torch.tensor([0.0, 0.0, 0.0], device=device)
      up = torch.tensor([0.0, 0.0, 1.0], device=device)
      forward = torch.nn.functional.normalize(target - eye, dim=0)
      right = torch.nn.functional.normalize(torch.linalg.cross(forward, up), dim=0)
      true_up = torch.linalg.cross(right, forward)
      view = torch.eye(4, device=device)
      # gsplat's pinhole projection uses positive camera-space z for depth.
      view[:3, :3] = torch.stack((right, true_up, forward))
      view[:3, 3] = -view[:3, :3] @ eye
      return view

  writer = imageio.get_writer(f'{OUT}/gaussian-splat-edu-smoke-v2.mp4',
                              fps=24, codec='libx264', quality=8)
  started = time.time()
  for i in range(FRAMES):
      view = look_at(torch.tensor(i / FRAMES * 6.2831853, device=device))
      renders, _, _ = rasterization(
          means, quats, scales, opacities, colors,
          viewmats=view[None], Ks=Ks, width=W, height=H)
      frame = torch.clamp(renders[0], 0, 1).detach().cpu().numpy()
      frame = (frame * 255).astype('uint8')
      writer.append_data(frame)
      if i == 0:
          imageio.imwrite(f'{OUT}/gaussian-splat-edu-smoke-v2.png', frame)
  writer.close()
  elapsed = time.time() - started
  vram = torch.cuda.max_memory_allocated() / 1e9
  open(f'{PACK_DIR}/report.md', 'w').write(
      '# Gaussian splat education smoke test v2\n\n'
      f'- renderer: gsplat\n- primitives: {n}\n- frames: {FRAMES}\n'
      f'- resolution: {W}x{H}\n- render time: {elapsed:.2f}s\n'
      f'- peak CUDA allocation: {vram:.2f}GB\n'
      '- scene: synthetic colored Gaussian shell; no training or COLMAP yet\n')
  print(f'complete: {FRAMES} frames in {elapsed:.1f}s, peak CUDA {vram:.2f}GB',
        flush=True)
