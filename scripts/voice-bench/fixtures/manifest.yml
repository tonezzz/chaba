# Bench fixtures. wav: relative path under fixtures/ (16kHz mono wav).
# expected_transcript: string the STT should recover (normalized before WER).
# expected_tool: {tool, args} the LLM stage should emit (null for chitchat/answer judged leniently).
# lang: en | th. status: active | skipped (+skip_reason).
fixtures:
  # --- English: HA device commands ---
  - id: en-cmd-01
    lang: en
    wav: en-cmd-01.wav
    text: Turn on the living room lights.
    expected_transcript: turn on the living room lights
    expected_tool: {tool: ha_service_call, args: {domain: light, service: turn_on, entity_id: light.living_room}}
  - id: en-cmd-02
    lang: en
    wav: en-cmd-02.wav
    text: Turn off the bedroom fan.
    expected_transcript: turn off the bedroom fan
    expected_tool: {tool: ha_service_call, args: {domain: fan, service: turn_off, entity_id: fan.bedroom}}
  - id: en-cmd-03
    lang: en
    wav: en-cmd-03.wav
    text: Set the thermostat to twenty two degrees.
    expected_transcript: set the thermostat to twenty two degrees
    expected_tool: {tool: ha_service_call, args: {domain: climate, service: set_temperature}}
  - id: en-cmd-04
    lang: en
    wav: en-cmd-04.wav
    text: Open the garage door.
    expected_transcript: open the garage door
    expected_tool: {tool: ha_service_call, args: {domain: cover, service: open_cover, entity_id: cover.garage_door}}
  # --- English: questions needing tool calls / answers ---
  - id: en-q-01
    lang: en
    wav: en-q-01.wav
    text: What is the temperature in the kitchen?
    expected_transcript: what is the temperature in the kitchen
