    expected_tool: {tool: answer, args: {}}
  - id: en-q-03
    lang: en
    wav: en-q-03.wav
    text: How much power is the washer using right now?
    expected_transcript: how much power is the washer using right now
    expected_tool: {tool: answer, args: {}}
  # --- English: chit-chat ---
  - id: en-chat-01
    lang: en
    wav: en-chat-01.wav
    text: Good morning, how are you today?
    expected_transcript: good morning how are you today
    expected_tool: {tool: chitchat, args: {}}
  - id: en-chat-02
    lang: en
    wav: en-chat-02.wav
    text: Thank you, that is all for now.
    expected_transcript: thank you that is all for now
    expected_tool: {tool: chitchat, args: {}}
  - id: en-chat-03
    lang: en
    wav: en-chat-03.wav
    text: What is the weather going to be like this afternoon?
    expected_transcript: what is the weather going to be like this afternoon
    expected_tool: {tool: answer, args: {}}
  # --- Thai: STT+LLM only, TTS skipped (no Thai piper voice) ---
  - id: th-cmd-01
    lang: th
    wav: th-cmd-01.wav
    text: เปิดไฟห้องนั่งเล่น
    expected_transcript: เปิดไฟห้องนั่งเล่น
    expected_tool: {tool: ha_service_call, args: {domain: light, service: turn_on}}
  - id: th-cmd-02
    lang: th
    wav: th-cmd-02.wav
