# Coverage map for scripts/trade-lesson-migrate.py (card
# trade-lesson-migrate-script, OPS-0103; parent
# trade-docs-education-migration / OPS-0102).
#
# Every docs-mcp page maps to exactly one lesson topic (or skip:true).
# Synthesis lessons that re-read pages owned by another topic declare
# their sources under topics.<name>.extra_pages instead.
#
# Seeded from scripts/lesson-drift-map.yml (the existing trade-* lesson
# family) plus the four per-topic cards: trade-lesson-getting-started,
# trade-lesson-ui-integration, trade-lesson-workflows-automation,
# trade-lesson-knowledge-base. Dry-run proposes mappings for any page
# not listed here.

docs_root: ~/CascadeProjects/trade/docs
index_json: ~/CascadeProjects/trade/.docs-mcp/documents.json

topics:
  trade-map: {level: intro}
  trade-architecture: {level: intro}
  trade-data-sources: {level: working}
  trade-signals-backtest: {level: working}
  trade-gold-thb:
    level: deep
    # synthesis lesson — all sources are owned by other topics
    extra_pages:
      - data/DATA_SOURCES
      - kb/metal-price-api-research
      - kb/thai-holiday-data-gap-analysis-2026-08-14
      - knowledge/commodity-validation-sources
  trade-getting-started: {level: intro}
  trade-ui: {level: working}
  trade-workflows: {level: working}
  trade-knowledge: {level: working}

pages:
  # --- existing family (mirrors lesson-drift-map.yml) ---
  INDEX: {topic: trade-map}
  PORTAL: {topic: trade-map}

  core/ARCHITECTURE: {topic: trade-architecture}
