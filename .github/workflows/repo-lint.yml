name: Repo lint

on:
  push:
    branches: [master, main]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".husky/**"
      - "docs/ssot/infrastructure/ssot.devnest-lanes.yml"
      - "docs/ssot/infrastructure/ssot.jobs.yml"
      - "evals/opencode-lane/**"
      - "stacks/idc03/litellm/**"
      - "systemd/generated/**"
      - "package.json"
      - ".github/workflows/repo-lint.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".husky/**"
      - "docs/ssot/infrastructure/ssot.devnest-lanes.yml"
      - "docs/ssot/infrastructure/ssot.jobs.yml"
      - "evals/opencode-lane/**"
      - "stacks/idc03/litellm/**"
      - "systemd/generated/**"
      - "package.json"
      - ".github/workflows/repo-lint.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Cheap lane gate (ssot.quality.yml id ci.repo-lint): every script
      # must at least parse. .mjs is the repo's JS convention — vendored
      # node_modules and mixed-module .js are excluded.
      - name: Python syntax check (all scripts/)
        run: python3 -m compileall -q -x 'node_modules' scripts/
      - name: JS syntax check (*.mjs, excluding vendored deps)
        run: |
          FAIL=0
          while IFS= read -r f; do
            node --check "$f" || { echo "SYNTAX FAIL: $f"; FAIL=1; }
          done < <(find scripts -name "*.mjs" -not -path "*/node_modules/*")
          exit $FAIL

  # Drift guards from the 2026-11-20 lane half-purge: a lane marked
  # retired in the SSOT must not survive in an executor allowlist, and a
  # deployed tool must be byte-identical to its committed sha256 pin.
  # Keep this next to the cheap syntax gate so both run on the same
  # scripts/ push, plus test/SSOT edits that can change the contracts.
  tooling-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python3 -m pip install --quiet pytest pyyaml
      - name: Runner tooling + lane retirement contracts
        run: >-
          python3 -m pytest -q
          tests/board/test_runner_tooling_contract.py
          tests/devin/test_unit_exit_status.py
          tests/devnest/test_sync_opencode_models.py
      # Model-route registration drift guard (card
      # model-route-registration-unify / OPS-1020): profile allowlists
      # and the jack-ide opencode provider map must only name routes the
      # LiteLLM config actually serves. --check exits 1 on breaking
      # classes (profile_route_missing, profile_default_unallowed,
      # opencode_map_unwritable); route_not_registered notes are
      # informational — the hourly opencode-models-sync job on idc02 /
      # tony_dell --writes the live runner maps, CI never writes.
      - name: OpenCode model drift check
        run: >-
          python3 scripts/devnest/sync-opencode-models.py
          --from-config stacks/idc03/litellm/config.yaml
          --opencode stacks/idc02/jack-ide/opencode/opencode.json
          --check
