name: SSOT CI

on:
  push:
    branches: [master, main]
    paths:
      - 'docs/ssot/**'
      - 'scripts/ssot-*.mjs'
      - 'scripts/ssot-*.py'
      - 'reports/SSOT_OPTIMIZATION_*.json'
  pull_request:
    branches: [master, main]
    paths:
      - 'docs/ssot/**'
      - 'scripts/ssot-*.mjs'
      - 'scripts/ssot-*.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate all SSOT files
        run: node scripts/ssot-validate-all.mjs
      - name: Check SSOT optimization warnings
        run: node scripts/ssot-optimize.mjs
      - name: Verify no warnings
        run: |
          BLOAT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('reports/SSOT_OPTIMIZATION_METRICS.json')).bloat)")
          DATA_ISOLATION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('reports/SSOT_OPTIMIZATION_METRICS.json')).data_isolation)")
          OTHER=$(node -e "console.log(JSON.parse(require('fs').readFileSync('reports/SSOT_OPTIMIZATION_METRICS.json')).other)")
          LOGS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('reports/SSOT_OPTIMIZATION_METRICS.json')).logs.issues)")
          if [ "$BLOAT" -gt 0 ] || [ "$DATA_ISOLATION" -gt 0 ] || [ "$OTHER" -gt 0 ] || [ "$LOGS" -gt 0 ]; then
            echo "SSOT optimization warnings found: bloat=$BLOAT data_isolation=$DATA_ISOLATION other=$OTHER logs=$LOGS"
            exit 1
          fi
