name: MCP Smoke Test

on:
  push:
    branches: [master, main]

jobs:
  live-mcp-call:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Run live MCP smoke test
        run: python3 scripts/mcp-smoke-live.py
