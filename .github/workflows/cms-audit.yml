name: CMS audit

on:
  push:
    branches: [master, main]
    paths:
      - "backups/ada-memory/ada-cms-pages.json"
      - "scripts/ada/cms-audit.py"
      - "scripts/ada/cms-audit-baseline.json"
      - "scripts/ada/flood-news-update.py"
      - "docs/ssot/apps/ssot.apps.cms-reports.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "backups/ada-memory/ada-cms-pages.json"
      - "scripts/ada/cms-audit.py"
      - "scripts/ada/cms-audit-baseline.json"
      - "scripts/ada/flood-news-update.py"
      - "docs/ssot/apps/ssot.apps.cms-reports.yml"

jobs:
  cms-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GitHub cannot reach the tailnet MDDB — this lints the committed
      # snapshot (refreshed by ada-memory-backup.service on tony-dell).
      # --baseline is a ratchet: new failures fail CI, and baseline
      # entries that no longer fail must be removed (it only shrinks).
      - name: Audit committed ada-cms-pages snapshot
        run: >
          python3 scripts/ada/cms-audit.py
          --file backups/ada-memory/ada-cms-pages.json
          --baseline scripts/ada/cms-audit-baseline.json
