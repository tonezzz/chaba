name: MCP Server Verification

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  verify-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      # Live probe, not a ci-gate check (ssot.quality.yml lane model): it
      # needs the host's MCP config and tailnet access — GH runners have
      # neither, so skip cleanly instead of failing forever. Coverage lives
      # in the scheduled mcp-debug audit on tony-dell.
      - name: Verify all configured MCP servers
        run: |
          if [ ! -f "${MCP_CONFIG:-$HOME/.config/devin/mcp_config.json}" ]; then
            echo "::notice::no MCP config on this runner — live probe skipped (runs on tony-dell via the scheduled suite)"
            exit 0
          fi
          python3 scripts/verify-all-mcp-servers.py
