name: MCP Server Verification

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  verify-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Verify all configured MCP servers
        run: python3 scripts/verify-all-mcp-servers.py
