# /etc/X11/xorg.conf.d/20-xorg-seat.conf
# Force the physical seat X server (:1) to use the Intel iGPU (PCI 0:2:0)
# where the monitor is connected on DP-2. Without this Xorg autoconfig
# picks the AMD card (PCI 1:0:0) and the screen stays black.

Section "Device"
    Identifier  "iGPU"
    Driver      "modesetting"
    BusID       "PCI:0:2:0"
EndSection

Section "Screen"
    Identifier  "Seat"
    Device      "iGPU"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1920x1080"
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier  "Seat"
    Screen      "Seat"
EndSection
