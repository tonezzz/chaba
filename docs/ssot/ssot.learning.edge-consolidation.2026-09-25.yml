  - docs/ssot/infrastructure/ssot.security.tony-dell.yml (serve table, vms-gate flag)
  - docs/ssot/infrastructure/ssot.secrets.yml (archived ada slots)
  - ~/.config/caddy/Caddyfile.tony-dell.retired-20260925 (archived legacy edge)
  - ~/.config/caddy/public.retired-20260925 (archived legacy tree)
