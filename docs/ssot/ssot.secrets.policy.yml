title: Secrets Policy
subtitle: How credentials move, live, and get audited across the fleet
icon: 🛡️
version: 1

overview:
  purpose: |
    The authority for handling secrets (API keys, tokens, passwords) across
    chaba/ada/mddb hosts. A secret that lands in a durable text surface —
    chat transcript, memory bank, kanban comms, git, logs — is a leak,
    whether or not it is exploited. This policy defines the only allowed
    transport, where secrets may rest, detection duties, and the incident
    response when the rules break.
  scope:
    - Transport of secrets between Tony and hosts (never via conversation)
    - Resting locations and file permissions
    - Agent duties (never echo, never commit, never log)
    - Leak detection and incident response
    - Rotation and inventory
  out_of_scope:
    - Tailscale/CF Access identity policy (ssot.infrastructure)
    - Vault product choices (no vault deployed yet; file-based policy)

policies:
  - id: transport-secret-drop
    title: Secrets travel only via secret-drop or direct file edit
    status: accepted
    rule: |
      A secret reaches a host by exactly two paths:
      (1) the secret-drop UI on the Ada chat card (ada-secret-drop card —
          posts value to the backend, lands as a 0600 file, returns only
          a sha8 receipt; the value never enters the transcript), or
      (2) direct file edit on the target host by Tony (ssh + editor).
      Every other channel is forbidden: chat text, LINE/Telegram, kanban
      card fields or comms, git commits, paste-to-agent, screenshots,
      memory banks, docs.
    applies_to:
      - all humans and agents on all hosts
    rationale: |
      Every text channel in this system is indexed, synced, or logged —
      transcripts go to MDDB, comms go to git, LINE goes to Yomi. A secret
      pasted in chat is a secret in five databases within the hour.
    consequences:
      - ada-secret-drop (kanban) builds the compliant UI path
      - agents receiving a secret in any text channel must flag it as a
        leak incident (see leak-response), not just use it quietly

  - id: resting-locations
    title: Secrets rest only under designated secrets dirs, mode 0600
    status: accepted
    rule: |
      Live secrets exist only in:
        ~/.config/secrets/           (primary, per-host)
        ~/.config/ada-ha/            (ada-ha instance keys)
        ~/.local/share/              (token stores that predate secrets/)
      All files 0600 (or 0400), dirs 0700. _attic-* backups keep the same
      perms and are excluded from all indexing. Secrets never live in a
      git checkout — a .env inside a repo dir is a bug even if ignored.
    applies_to:
      - tony-dell, tony-omen, idc02, idc03, mn01, kk-macbook
    rationale: |
      One small set of roots means the inventory script can be exhaustive
      and grep-canaries know where to look. Repo-dir secrets have leaked
      via rsync/bundle artifacts before the ignore rules existed.
    consequences:
      - new services take an env-file path under ~/.config/secrets/ at
        install time, not a .env next to the code
      - secrets dirs are excluded from backup/rsync jobs that leave the host

  - id: agent-non-disclosure
    title: Agents never echo, log, or commit secret material
    status: accepted
    rule: |
      When handling secrets, agents may report: file paths, env var names,
      masked prefixes (sk-or-v1-6336...7232 style), sha8 fingerprints,
      existence/absence, expiry status. Agents may never print the value,
      paste it into comms, write it into a card/field, or commit it.
      Redaction in output uses the first 4 + last 4 visible chars max.
    applies_to:
      - devin, ada, chaba, dispatch sessions, any tool output
    rationale: |
      The usable identifiers (label, fingerprint, expiry) are enough for
      every operational question — "which key is live" never needs the value.
    consequences:
      - masked-prefix fingerprints are the standard cross-host identity
        for a key (used in the 2026-10-09 OR key audit)
      - any tool that might print env files must be reviewed before use
        (cat-on-env is a flagged pattern in reviews)

  - id: leak-response
    title: A secret in a durable text surface = rotate, then scrub
    status: accepted
    rule: |
      If a secret is found in transcript/comms/git/logs/banks:
      (1) rotate the credential immediately — assume compromised;
      (2) scrub the surfaces (git history rewrite only if it never pushed;
          otherwise the value is already out — rotation is the fix);
      (3) file an incident card recording: which secret, which surface,
          how long exposed, confirmed rotation;
      (4) review how it got there — the transport rule failed somewhere.
      Scrubbing without rotation is cosmetic and forbidden as a response.
    applies_to:
      - all hosts, all agents
    rationale: |
      Git push, MDDB sync, and transcript export make "delete it" fiction —
      the only real fix is making the leaked value worthless.
    consequences:
      - rotation runbook per provider lives in docs/kb/ (grow as needed)

  - id: leak-detection-canary
    title: Periodic grep-canary over text surfaces for key patterns
    status: proposed
    rule: |
      A scheduled job greps comms/, focus-inbox/, cards, ops-events, and
      session transcripts for secret-shaped strings (sk-or-, AIza, ghp_,
      xoxb-, cfut_, cfat_, ya29., -----BEGIN). Hits file an incident card
      under leak-response. The canary reports counts and card IDs only —
      never the matched strings.
    applies_to:
      - chaba repo, ada transcripts, ops event stream
    rationale: |
      The 2026-10-09 mddb outage showed secrets outlive their rotations in
      attic files; a canary turns "leaked and unnoticed" into "leaked and
      rotated". Patterns are public key shapes, not the secrets themselves.
    consequences:
      - implementer must ensure the canary itself can't leak (masked
        output only) — candidate home is chaba-nag or a systemd timer

  - id: inventory-metadata-only
    title: Secret inventory audits names and metadata, never values
    status: accepted
    rule: |
      Fleet inventory (which keys exist where, expiry, last-rotated) reads
      filenames, file mtimes, and provider metadata endpoints (e.g. the
      OR /api/v1/key label/limit fields). Audits produce tables of masked
      fingerprints — the 2026-10-09 OR key audit format is the template.
    applies_to:
      - ~/.config/secrets/ on all hosts
    rationale: |
      Knowing "idc03 has an expired OR key in the attic backup" is what
      made the key-search answerable; that audit needs zero exposure of
      the value to be complete.
    consequences:
      - host audits print `sk-or-v1-XXXX...YYYY` fingerprints, not values

related_files:
  - docs/ssot/kanban/cards/ada-secret-drop.yml
  - docs/kb/crush-multi-agent.md  (config-file isolation, same hazard class)
  - backend/tools.d/kanban.py     (ada-pi — tool-side credential hygiene)
  - AGENTS.md                     (secrets section — this policy is now authority)

notes: |
  Origin: 2026-10-09 — Tony: "we need a standard procedure to manage our
  security, this could get us in trouble one day." Triggered by the OR key
  audit (3 keys found, 2 expired, active key's account broke) and the
  secret-drop product request. Part A (the UI) is dispatched via the
  ada-secret-drop card; this file is Part B.
