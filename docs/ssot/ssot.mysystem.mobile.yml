title: Mobile Environment
subtitle: Systems, devices, and setup for mobile/remote work
icon: 📱

ideas:
  - Mobile and remote work setup with dynamic network handling
  - Single primary workstation (tony-omen) accessible from various networks
  - Current network: TONY-IP WiFi (different from home network)
  - Profile switching capability between home and mobile configurations
  - Location-aware health checks and service access

sections:
  - title: Current Network Session
    icon: 📡
    layout: list
    items:
      - label: Current WiFi
        text: TONY-IP (mobile network, different from home)
        status: active
      - label: Network Type
        text: External/mobile network (not home 192.168.1.0/24)
      - label: Access Method
        text: Remote access to tony-omen via current network IP
      - label: Session Date
        text: 2026-08-07
      - label: Profile Switching
        text: Can switch back to home profile when on home network

  - title: Workstations
    icon: 💻
    layout: list
    items:
      - label: tony-omen
        text: Primary workstation (accessible via current network IP)
        tags: [primary, server, remote-access]
        current_access: Use current network IP or DDNS hostname

  - title: Network Profiles
    icon: 🔄
    layout: list
    items:
      - label: Home Profile
        text: 192.168.1.0/24 subnet with .local hostname resolution
        config: ssot.mysystem.home.yml
        health_config: ssot.health.home.yml
        switch_back: Connect to home WiFi, use .local hostnames
      - label: Mobile Profile
        text: Current network (TONY-IP) with dynamic IP access
        config: ssot.mysystem.mobile.yml (this file)
        health_config: ssot.health.mobile.yml
        switch_method: Use current IP or DDNS hostname
      - label: Profile Switching
        text: Select appropriate SSOT and health check config based on network location
        command: Update health check config references when switching networks

  - title: Network
    icon: 🌐
    layout: list
    items:
      - label: Current Network
        text: TONY-IP WiFi (external/mobile network)
      - label: Home Network
        text: 192.168.1.0/24 subnet with .local hostname resolution
      - label: Dynamic IP Challenge
        text: tony-omen IP changes across different WiFi networks
      - label: IP Discovery
        text: Current tony-omen IP on TONY-IP network (check with ip addr or ifconfig)

  - title: Dynamic IP Solutions
    icon: 🔧
    layout: list
    items:
      - label: DDNS (Dynamic DNS)
        text: Use a service like DuckDNS, No-IP, or Cloudflare to get a stable hostname that updates with your IP
      - label: VPN/Tunnel
        text: Set up Tailscale, WireGuard, or similar for stable access across networks
      - label: SSH Config
        text: Use SSH config with multiple Host entries for different networks
      - label: IP Discovery Script
        text: Run a script on tony-omen to email/message current IP when network changes
      - label: mDNS/Bonjour
        text: Use .local hostnames when on same network (doesn't work across different networks)

  - title: Services (tony-omen)
    icon: ⚙️
    layout: list
    items:
      - label: llama-router
        text: LLM inference router with model routing support (port 8001)
        tags: [ai, llm, router]
        mobile_access: http://[current-ip]:8001
      - label: postgres
        text: PostgreSQL database server (port 5432)
        tags: [database, postgres]
        mobile_access: postgresql://[current-ip]:5432
      - label: Apps Server
        text: Main apps server (port 8080)
        mobile_access: http://[current-ip]:8080
      - label: Chaba-h3 Preview
        text: Chaba-h3 preview server (port 8081)
        mobile_access: http://[current-ip]:8081

  - title: Available Apps
    icon: 📱
    layout: list
    items:
      - label: cams
        text: Camera monitor application
        tags: [camera, monitor]
      - label: track4
        text: Track4 application (training system)
        tags: [training, simulation]

  - title: Access & URLs (Mobile)
    icon: 🔗
    layout: list
    items:
      - label: Apps (tony-omen)
        text: "Use current IP: http://[current-ip]:8080/apps"
      - label: Chaba-h3 Preview
        text: "Use current IP: http://[current-ip]:8081/apps"
      - label: Llama Router API
        text: "Use current IP: http://[current-ip]:8001"
      - label: PostgreSQL
        text: "Use current IP: postgresql://[current-ip]:5432"
      - label: SSH Access
        text: "ssh tony@[current-ip]"

  - title: Profile Switching Guide
    icon: 🔄
    layout: list
    items:
      - label: Switch to Home Profile
        text: Connect to home WiFi, use .local hostnames (tony-omen.local)
        steps:
          - Connect to home WiFi network
          - Use ssot.mysystem.home.yml for configuration
          - Use ssot.health.home.yml for health checks
          - Access services via tony-omen.local
      - label: Switch to Mobile Profile
        text: Connect to external network (TONY-IP), use current IP or DDNS
        steps:
          - Connect to external WiFi network
          - Use ssot.mysystem.mobile.yml for configuration
          - Use ssot.health.mobile.yml for health checks
          - Access services via current IP or DDNS hostname
      - label: Health Check Config Update
        text: Update health check configuration references when switching profiles
        files:
          - ssot.health.home.yml (home network)
          - ssot.health.mobile.yml (mobile network)

config:
  version: 2
  last_updated: 2026-08-07
  current_network: TONY-IP
  current_profile: mobile
  maintainer: tony
  related_files:
    - ssot.mysystem.home.yml (home profile)
    - ssot.services.yml
    - ssot.apps.yml
    - infrastructure/ssot.health.mobile.yml (mobile health checks)
    - infrastructure/ssot.health.home.yml (home health checks)
