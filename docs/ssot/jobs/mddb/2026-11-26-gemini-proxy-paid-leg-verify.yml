ordering_verified: |
  fetchBackupBatch order in BOTH variants: OR/gateway leg -> direct
  free-Gemini -> PAID GEMINI_API_KEY_PAID -> Ollama (non-OR path only;
  OR path hard-fails instead of wrong-space Ollama). Paid leg engages
  only after free keys exhaust retries; caps refuse BEFORE any billed
  call; cap-hit emits embed_paid_cap ops event.

probe: |
  Harness: .dispatch-scratch/probe-paid-leg.mjs + fetch-intercept.mjs in
  the dispatch worktree (untracked scratch). Mocks Gemini upstream
  (429 for free keys, 200 for paid), Ollama (hit counter), embed
  gateway (500). Live file hardcodes generativelanguage.googleapis.com
  (no GEMINI_API_BASE env) so a node --import preload rewrites that
  host to the mock — the deployed bytes ran UNMODIFIED.
  Scenarios vs live file (sha a8c3df):
  - free-first: 2 free keys x2 retries -> 429, circuits open ->
    provider=gemini-embedding-2-paid, ollama_hits=0, paid_calls=1/req.
  - gateway-down: free 429 -> gateway 500 (or_circuit opens) ->
    direct-free skipped (circuits open) -> paid serves; req2 skips
    dead gateway entirely.
  - cap-then-ollama (PAID_GEMINI_DAILY_CAP=1): req1 paid, req2
    "paid Gemini daily-cap 1 hit" -> Ollama nomic-embed-text serves —
    literal proof Ollama is last resort and the cap bounds spend.
  Scenarios vs repo file (sha d58adf): free-first + cap-then-ollama
  identical results (single free key, geminiFree=2 hits/req).

vector_space_caveat: |
  Paid key = SAME model gemini-embedding-2, SAME vector space as free
  (paid is a billing tier, not a different embedding) — index-safe.
  Ollama nomic-embed-text is a DIFFERENT space: the OR/gateway path
  refuses it entirely (hard-fail beats wrong-space writes); only the
  no-OR path may reach it as true last resort. Documented in code
  comments (both variants) and docs/kb/mddb-embedding-providers.md.

spend_cap: |
  Live: PAID_GEMINI_DAILY_CAP=2000 batches/day + PAID_GEMINI_HOURLY_CAP
  =150/hr per UTC window (~<= $0.20/day worst case per KB doc), counters
  in /health, reset on window roll or restart. Repo defaults 0=uncapped;
  caps are env-set on idc03.

