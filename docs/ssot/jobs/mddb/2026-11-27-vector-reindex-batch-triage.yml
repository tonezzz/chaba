residual_questions:
  - "Which collection the 11-27 run died inside is not directly visible
    (no con01 journal access from mn01; the run emits no ops-event on
    SIGTERM). Stats order puts ada-ha-bank-devin-handoff ~10th of 64 —
    consistent with it consuming the whole budget, but unproven."
  - "skipped=111,688 on 11-26 vs 173,924 total docs today — the bank
    grows daily and stats documentCount semantics may differ from the
    endpoint's doc| scan; not reconciled, immaterial to the fix."
  - "Whether deployed 2.18.10's async job path has the GO-043 budget
    check exactly as 2.18.9+ describes — likely yes (2.18.10 > 2.18.9)
    but not exercised live."

rollback: "n/a — triage only, no changes applied"

lessons:
  - "mddb /v1/vector-reindex is per-collection all-or-nothing: one bolt View tx per doc for the hash-skip check — collection size, not embed count, dominates sweep cost"
  - "deployed mddb 2.18.10 already has async reindex jobs (#347, 2.18.4+) — check upstream CHANGELOG before assuming a fork patch is needed"
  - "GO-054 reindex concurrency slots are 2.19.8+ — not on 2.18.10; don't set MDDB_REINDEX_MAX_CONCURRENT expecting it to work"
  - "vector-reindex.py drops the endpoint's errors[] array — per-doc failure detail exists server-side but never reaches ops events"
