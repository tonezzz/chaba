rollback: >-
  Before the swap the rollback was mddb.db.pre-compact at
  33,689,640,960 bytes; the service would have been stopped and the old
  file moved back if any verification failed. All checks passed, so it was
  removed at 22:20 +07 per the approved procedure. The compact output and
  runner log/rc marker remain at ~/mddb-ops-compact-20261127 on idc03 as
  evidence.
residual: >-
  Total mddb-ops outage was about 15.5 minutes. Writers self-healed via
  cursor replay; the single failed hourly tick was replayed manually.
  The host-logs retention backlog (Phase C) remains backlog work — do not
  re-run the while-true drain pattern or raise the deleteWhere limit.
lesson: >-
  An SSH-command self-match in a pgrep guard aborted the first swap attempt
  harmlessly; use ps with a bracketed pattern (or anchor pgrep) so the
  guard does not match its own command line. A detached podman compact with
  an explicit rc file and a no-double-trigger guard survives session drops
  and makes the reattach-before-swap check unambiguous. Check statsPending
  with a targeted /v1/get for a known id before ever treating empty stats
  collections as data loss.
