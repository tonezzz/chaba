context: >-
  OPS-1500 Step A killed the detached prune drain loop that caused the
  deleteWhere write-lock convoy (/v1/add 10-200s). Tony approved A+B on
  2026-11-27 and chose the 22:00 +07 window for Step B. Procedure C from
  docs/kb/mddb-prune-compact.md is the only path that shrinks the bbolt file
  while preserving docs, revisions, vectors and index. Preflight at 22:01
  was green: service active/running with NRestarts=0, db 33,689,640,960
  bytes, no stray compact or .pre-compact file, no running compact,
  docker.io/golang:1.23-bookworm present, 113G free on /, and
  MDDB_ADDR=100.102.134.91:11026 confirmed tailnet-only.
