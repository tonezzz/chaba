card: mddb-cms-embed-quota-write-timeout-stall
status: verified-degraded — write path healthy, both embed lanes still lossy

incident_recap: |
  2026-11-19 ~05:00-07:30 ICT: all gemini-ollama-proxy embed legs down
  (OR daily-cap 5000, free Gemini circuit open, paid hourly-cap 150).
  mddb-cms embed queue pinned at 4000; every /v1/add blocked ~30s on
  MDDB_EMBEDDING_QUEUE_WAIT then exceeded the HTTP write timeout —
  handler logged "response not delivered". >6000 docs written without
  vectors. CMS plane has since migrated gemini-embedding-2 -> bge-m3
  (runbook 2026-11-18-cms-plane-bge-m3-migration-runbook.yml) so the
  quota-coupled failure mode no longer applies to :11027 — but the
  queue-wait/write-timeout coupling is unchanged.

verified_state_2026-11-24: |
  Leader :11023 (gemini-embedding-2 via proxy :11435):
    - /v1/vector-stats queue depth ~1641-2919/4000 (draining ~80/min),
      droppedTotal=1138 cumulative, retried=194. pendingEmbeddings
      2830->2572 over ~3min — backlog IS draining via OpenRouter.
    - Embed attempts still fail intermittently: "context deadline
      exceeded" POSTing 127.0.0.1:11435 (mddb client timeout vs slow
      OR path). Proxy log: ~3000 routed calls/30min, Gemini free keys
      429 again (daily quota pattern recurring), OR serving.
    - mddb-vector-reindex.service ran 18:02 today: embedded=30,
      skipped=50452, FAILED=2652 (ada-ha-bank-devin-handoff 2475,
      ada-ha-scenario-reports 119, ada-ha-events-* 37) — exit 1.
      Unit is pinned MDDB_BASE_URL=:11023 — CMS plane NOT covered.
  CMS :11027 (bge-m3 via embed-pool-shim :11436):
    - queue depth ~18-169/4000, droppedTotal=910, retried=741.
      indexing.failedEmbeddings=1977 and climbing ~1/45s.
    - Embed lane effectively DOWN: shim returns 504 "no upstream
      answered in time" (EMBED_POOL_TIMEOUT_S=8) on most calls;
      mddb-cms logs "embedding provider circuit open — pausing embed
      attempts" with 30s->120s backoff. Direct probe embed succeeded
      in 4s — pool is flaky, not dead.
    - Upstream health (shim /health): kk-mac admission shim
      (127.0.0.1:11447) wins but consec-fails -> dead_until cooldown;
      kkmac-admission-shim itself returns intermittent 503 (Ada Nest
      admission gate denying under load); con01 ollama won once at
      6.5s; idc03 local ollama 2 consec fails; tony-omen idle.
    - embed-pool-shim restarted 21:00:51 + 21:07:23 picking up
      0397bff9b1b (cancel losing race calls) — live md5 matches repo.
  Write path:
    - ZERO "response not delivered"/write timeouts on mddb-cms in the
      last 2h (journal grep). /v1/add no longer stalls because the
      embed queue is near-empty — the 30s QUEUE_WAIT coupling is
      latent, not active. Leader queue at ~2.9k/4k means a burst could
      re-create the stall conditions.

structural_options_assessed: |
  (a) decouple write ack from embed enqueue (async ack): mddb-fork
      change. Branch fix/embed-enqueue-breaker-open @4ac66b83 already
      implements the cheaper half (fast-drop counted/reindexable when
      breaker open) — unmerged, undeployed. True async-ack is the real
      fix for the stall class; still out of this repo's scope.
  (b) raise MDDB_HTTP_WRITE_TIMEOUT / lower QUEUE_WAIT: env-level on
      idc03 units (mddb-cms.container + mddb unit both still carry
      MDDB_EMBEDDING_QUEUE_WAIT=30s, QUEUE_SIZE=4000). Lowering wait
      converts stall->fast-fail+drop (reindexable) — arguably better
      than 30s hangs, but trades silent vector loss for loud write
      errors. Prod env change — needs Tony's call, not done here.
  (c) budget/quota alerting before caps hit: PARTIALLY DONE — proxy
      emits embed_free_budget/embed_paid_cap/embed_circuit_open ops
      events; embed-probe watches leader queue + provider health.
      GAP FOUND + FIXED THIS SESSION: probe only watched :11023 — the
      CMS plane queue had NO tripwire during the 11-19 incident.
      embed-probe.py now checks both planes (see changes).
  (d) embed-pool-shim fast-fail backlog card
      (embed-pool-shim-fast-fail-for-dead-upstr-7343c9): today's
      0397bff9b1b already deploys loser-cancellation (dead-leg latency
      -> wasted race slot fix is the remaining suspect-marking work).
      Today's 504s are race-timeout, not dead-leg latency — kk-mac
      admission 503s + slow con01 are the live cause; card still
      relevant but does not cover admission-gate flakiness.

changes: |
  - file: scripts/ada/embed-probe.py
