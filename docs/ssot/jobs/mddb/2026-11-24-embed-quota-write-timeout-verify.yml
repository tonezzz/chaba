      check_queue() is now per-plane: probes /v1/vector-stats on the
      leader AND the CMS plane (MDDB_CMS_URL, default
      http://100.102.134.91:11027, empty disables). State file migrates
      to {"planes": {leader, cms}} while mirroring leader into the
      legacy flat keys; proxy_degraded and other top-level keys are
      preserved. Event details are plane-prefixed; embed_queue_drops
      remedy text is plane-aware (reindex.service is leader-pinned;
      CMS needs MDDB_BASE_URL=:11027). Verified against live endpoints
      — cms depth/dropped read correctly, migration keeps
      proxy_degraded.

