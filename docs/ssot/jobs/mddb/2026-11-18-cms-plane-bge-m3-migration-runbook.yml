    embed-space golden eval against the bge bank FIRST (the 2026-10-15
    nomic eval is the template; bge-m3 likely scores better but prove it).
  * its embed path goes through gemini-ollama-proxy.service (:11435);
    after migration that proxy's only consumer is gone — keep it as the
    declared fallback or retire per hygiene rules.
  * leader also feeds followers idc02/con01 via gRPC replication — vector
    reindex writes ride the binlog? VERIFY: followers are read-only and
    load vectors from the replicated DB — check whether re-embedded
    vectors replicate or each follower re-embeds (followers run their
    own embed config — idc02 follower embeds? check its quadlet).
  * leader has MDDB_SEARCH_MAX_CONCURRENT=4 + heavier GOMEMLIMIT — keep.
