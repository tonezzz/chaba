title: CMS-plane BGE golden-set eval — recall@5/@10 + MRR, gemini vs bge-m3
subtitle: 69 labeled queries across 14 collections; bge-m3 within ~5% of
  gemini-embedding-2 — provider GO; live index has ~250 unembedded docs
  (coverage gap, separate issue)
type: eval
status: done
card: cms-plane-bge-golden-set-eval-measure-re-cad4f4
ref: MEM-0193 (spike), MEM-0204
repo: chaba
branch: dispatch/20261124-223607-follow-up-to-mem-0193-spike-pr
host: tony-omen
date: 2026-11-24

summary: >-
  Built a 69-query golden set with hand-verified relevant doc keys across
  all mddb-cms :11027 collections and scored three arms: the LIVE bge-m3
  index (prod /v1/vector-search), doc-level cosine vs gemini-embedding-2
  (via gemini-ollama-proxy :11435 on idc03), and doc-level cosine vs
  bge-m3 (local ollama on tony-omen — embed-pool-shim :11436 was
  degraded at eval time). Result: bge-m3 is statistically at parity with
  gemini-embedding-2 (recall@5 0.911 vs 0.954, recall@10 0.952 vs 0.957,
  MRR 0.937 vs 0.942 — pooled-candidate methodology, same as the
  2026-10-15 bank eval). VERDICT: GO on the embed-provider decision —
  and note :11027 already migrated to bge-m3 on 2026-11-19, so this eval
  validates the shipped state rather than gating a future cutover.
  Separate finding: the live index has ~250 docs with no vectors
  (embed-queue drops during pool-degraded windows) plus meta-only
  collections (devin-kb, ssot.focus) that can never embed — prod
  recall@5 is 0.54 overall / 0.68 on fully-covered collections vs the
  ~0.91 doc-level ceiling. Needs a non-force vector-reindex + drop
  investigation, NOT a provider rollback.

context_drift: >-
  Card spec assumed gemini still served :11027 — stale. Card comms
  2026-11-19 13:06 record the env swap + force reindex already happened
  (19/19 collections). No gemini-embedded CMS index exists anywhere to
  A/B against, so the gemini arm is doc-level cosine over the same
  candidate pools (the validated methodology from
  docs/ssot/jobs/ada/2026-10-15-embed-space-eval.yml, which found
  mddb-prod within 3% of doc-cosine on banks).

method: >-
  golden_set.json: 69 queries, hand-labeled relevant keys (lang-
  agnostic), stratified across chaba-lessons(8) kb-features(8)
  kb-operations(8) ada-cms-pages(10) infrastructure-ssot(7)
  chaba-docs(5) documents(5) devin-kb(4) kb-system(4) kb-development(4)
  chaba-architecture(2) chaba-archive(2) chaba-glossary(1) ssot(1).
  Includes one Thai query (nut-summary) — bge-m3 handles it fine.
  Pool per query = :11027 vector-search top-12 + qrel keys; doccos arms
  rank within pool (pooled-eval caveat: absolute numbers optimistic,
  arm-vs-arm deltas valid). Doc text = meta-title + contentMd[:1500]
  (mddb chunkSize=1500). prod arm = live index top-10, full-collection
  ranking — the honest production number.
  golden_eval.py caches embeddings (.embed_cache.json, gitignored
  candidate) so reruns are cheap.

key_numbers:
  overall_n: 69
  recall_at_5: {prod_bge_index: 0.539, gemini_doccos: 0.954, bge_doccos: 0.911}
  recall_at_10: {prod_bge_index: 0.546, gemini_doccos: 0.957, bge_doccos: 0.952}
  mrr: {prod_bge_index: 0.541, gemini_doccos: 0.942, bge_doccos: 0.937}
  full_coverage_subset_n: 49
  full_coverage_recall_at_5: {prod_bge_index: 0.677, gemini_doccos: 0.935, bge_doccos: 0.874}
  bge_vs_gemini_delta: "recall@5 -4.5%rel, recall@10 -0.5%rel, MRR -0.5%rel"
  prod_zero_but_doccos_full_rows: 26

