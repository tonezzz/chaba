    .embed_cache.json
  - scripts/mddb/spike-cms-bge/dump_corpus.py — corpus dump helper used
    for qrel authoring
  - scripts/mddb/spike-cms-bge/golden_eval_results.json — raw per-query
    rankings + metrics
  - /tmp/golden_eval3.log on tony-omen — run log (ephemeral)

verify: >-
  python3 scripts/mddb/spike-cms-bge/golden_eval.py --skip-doccos
  reproduces the prod arm; full rerun is cheap (embeddings cached).
  Live spot-check: curl -X POST :11027/v1/vector-search with any
  golden_set.json query returns the labeled keys for covered docs.
