findings:
  - "bge-m3 ≈ gemini-embedding-2 on CMS content: -4.5% recall@5 / -0.5%
    recall@10 / -0.5% MRR on identical pools. Thai query handled. The
    2026-11-19 migration to bge-m3 on :11027 is validated — GO (already
    shipped; this is post-hoc confirmation, not a gate)."
  - "prod-index recall (0.54 r@5) is far below the doc-level ceiling
    (~0.91) — NOT an embedding-space problem. Causes: (a) ~250 docs
    have no vectors — vector-stats embedded_documents < total_documents
    in chaba-archive 2/14, chaba-docs 25/40, chaba-lessons 206/207,
    devin-kb 0/9, documents 274/275, infrastructure-ssot 8450/8611,
    kb-development 7/20, kb-features 134/145, kb-operations 277/289,
    kb-system 20/34, ssot 0/1; queue stats show dropped=910, retried=753;
    (b) meta-only docs (devin-kb/*, ssot.focus) have empty contentMd and
    can never embed — vector search over those collections is structurally
    dead unless content is backfilled."
  - "Verified per-doc: qrel misses like kb-features/secret-rotation.md,
    vcast-failure-report.md, lesson-9559d7a3e16e have contentMd but rank
    below top-50/absent in vector-search — consistent with missing
    vectors, not bad ranking."
  - "embed-pool-shim :11436 was degraded during eval (504 'no upstream
    answered in time' on 1500-char batches; single short embeds OK) —
    the known cold-model/ambient-load gotcha from the spike. Used
    tony-omen local ollama bge-m3:latest instead (same model). Prod
    :11027 queue was still draining (depth 325)."

recommendation: >-
  GO — keep bge-m3 on mddb-cms :11027 (already live since 2026-11-19).
  Follow-ups (not done here — prod changes): (1) run non-force
  POST /v1/vector-reindex per affected collection to embed the ~250
  missing docs (safe: only adds vectors; schedule low-traffic);
  (2) investigate queue dropped=910 — drops during pool-degraded windows
  silently remove docs from vector search; consider alerting on
  dropped>0; (3) decide whether meta-only collections (devin-kb,
  ssot.focus) should get contentMd backfilled or be declared
  keyword-only; (4) warm-ping cron for bge-m3 upstreams per spike
  gotcha. No provider rollback indicated — gemini would not have fixed
  the coverage gap either.

artifacts:
