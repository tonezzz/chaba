# ------------------------------------------------------------- THE GOTCHA
stored_config_overrides_env: |
  mddb keeps EMBEDDING CONFIGS IN THE DB (/v1/embedding-configs), and a
  stored isDefault config WINS over MDDB_EMBEDDING_* env for the embed
  worker. Boot log "vector search enabled source=stored config" is the
  tell. :11027 worked env-only because its DB has configs:null — :11023
  had a stored default "gemini-proxy" (:11435) staged long ago, so the
  first env swap changed /v1/config (source=environment) but embeds
  still went to the gemini proxy (which is ALSO currently capped:
  OR daily-cap + paid hourly-cap -> 502s — the bge move fixes that too).

  Symptom of the mismatch: vector-reindex errors naming the gemini
  proxy's provider chain while /v1/config shows bge-m3. Diagnose with
  GET /v1/embedding-configs — check isDefault + apiUrl reachability
  (loopback OK without allowlist; private IPs need
  MDDB_OUTBOUND_ALLOWLIST/ALLOW_PRIVATE env at boot).

  Worker caches the config in memory — after PUT/set-default, restart
  mddb.service (or wait? unverified) before embeds pick it up. We
  restarted; third boot total.

