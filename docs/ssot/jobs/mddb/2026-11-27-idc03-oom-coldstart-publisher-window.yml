title: mddb idc03 OOM loop + publisher cold-start window — diagnosis and gated publishers
subtitle: >-
  mddb.service OOM-killed 9+ times on 2026-11-27 (global OOM on the 15Gi
  box); each restart leaves a ~104s window where /v1/* 404s while
  /v1/health already answers. Publishers now gate on /v1/health and
  retry transport failures; host-side memory bounds await Tony approval.
