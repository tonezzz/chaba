summary: >-
  Two timer publishers (media-inbox-update-kk, ops-health-report) exited
  1 inside the post-OOM warmup window. Root cause chain: (1) system-wide
  memory exhaustion on idc03 — 19 global OOM kills today across ~10
  mddbd (~3-4GB RSS each) and ~9 node procs (yomi-api alone killed 4x,
  ~3-3.8GB RSS); swap 4Gi completely full; (2) mddb.service effective
  config is drifted — stale ansible drop-ins
  (~/.config/systemd/user/mddb.service.d/{memory.conf,mem.conf},
  generated 2026-11-26 from the now-retired quadlet_services inventory)
  override the quadlet to GOMEMLIMIT=12000MiB + MemoryHigh=24G/
  MemoryMax=28G — cgroup limits that can never trigger on 15Gi RAM;
  (3) mddb-cms/mddb-ops quadlets have NO cgroup memory bound at all
  (mddb-cms peaked 7.1G RSS); (4) mddb-cms lacks
  MDDB_HTTP_WRITE_TIMEOUT (default 30s) — /v1/add handlers running
  36-198s under embed congestion get "response not delivered" and the
  client sees RemoteDisconnected. Publisher fixes: media-inbox-update.py
  routes _post through scripts/lib/mddb_http.py (bounded transport
  retry, landed earlier today) plus a /v1/health readiness gate
  (wait_ready, 200s budget > ~104s worst cold start) and publish timeout
  120->130s; ops-health-report.py gets the same gate+retry as an
  ada-voice patch artifact.
