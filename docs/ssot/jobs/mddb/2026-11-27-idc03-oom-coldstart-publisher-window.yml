lessons:
  - >-
    mddb /v1/health during startup returns 503 warming_up from the
    early listener while every other route 404s — it is the readiness
    probe; do not treat a health-port-open as routes-live.
  - >-
    systemd drop-ins override quadlet Environment= — check
    `systemctl --user show -p Environment` for EFFECTIVE env, not just
    the .container file; stale ansible drop-ins can silently re-impose
    retired config (same failure as the embed-probe redeploy).
  - >-
    GOMEMLIMIT bounds Go heap only; RSS can far exceed it (mddb-cms:
    2GiB limit, 7.1G peak). For hard RSS bounds use cgroup
    MemoryHigh/MemoryMax — and pick values below physical RAM.
