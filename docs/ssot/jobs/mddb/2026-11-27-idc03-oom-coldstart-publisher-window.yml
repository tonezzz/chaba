notes:
  - >-
    OOM evidence (journalctl -k, 2026-11-27): constraint=CONSTRAINT_NONE
    global_oom; kills at 11:03, 13:57, 15:24, 15:38, 15:49, 15:58, 16:26,
    16:33, 16:46, 16:54 ICT — accelerating. mddbd anon-rss at kill
    ~2.8-4.0GB; node procs ~2.9-3.8GB. One node scope resolved to
    yomi-api (4 kills). NOT a cgroup OOM — the 24-28G MemoryMax drop-in
    cannot fire on a 15Gi box.
  - >-
    Cold-start window mechanics (mddb-fork services/mddbd):
    startEarlyHealth binds the SAME addr early and serves ONLY
    /health + /v1/health (503 {"status":"warming_up","phase":...});
    every other route 404s until 'startup complete'/'mddb HTTP
    listening'. Observed gap 15:58:55->16:00:37 = 102s. /v1/health is
    therefore the correct readiness probe — no server change needed.
  - >-
    Config drift inventory on idc03 mddb.service: quadlet
    ~/.config/containers/systemd/mddb.container says
    GOMEMLIMIT=8000MiB + ollama/bge-m3@11436; drop-in memory.conf
    (Ansible, "DO NOT EDIT", generated 2026-11-26T02:17Z) overrides to
    gemini-ollama-proxy@11435 + GOMEMLIMIT=12000MiB + MemoryHigh=24G/
    MemoryMax=28G; mem.conf adds GOMEMLIMIT=22000MiB/MemoryMax=20G.
    Effective = drop-in values. Same stale-redeploy pattern as the
    2026-11-27 embed-probe incident (ansible-chaba site.yml from idc02
    redeploying retired host_vars). quadlet_services in
    ansible-chaba/inventory/host_vars/idc03.yml is now marked retired —
    the drop-ins are orphaned drift nothing will reconcile.
  - >-
    stacks/idc03/mddb/mddb.container in this repo is ALSO stale vs the
    live quadlet (image 2.15.4-lsn vs live 2.18.10-merge, gemini-
    embedding-2@11435 vs live ollama/bge-m3@11436, missing
    MDDB_FREELIST_SYNC/MDDB_OUTBOUND_ALLOWLIST). Live file appears to be
    the bge-m3-migration state; repo SSOT needs a sync pass (not done
    here — live-vs-SSOT authority for the embedding route is part of
    the open request).
  - >-
    mddb-cms (:11027) write path: no MDDB_HTTP_WRITE_TIMEOUT env ->
    30s default; journal shows /v1/add elapsed 36.3s "response not
    delivered" during ollama embed 504 congestion -> client
    RemoteDisconnected. mddb-ops (:11026) already has
    MDDB_HTTP_WRITE_TIMEOUT=120s + GOMEMLIMIT=2000MiB (OPS-1500 fix,
    precedent for the requested mddb-cms change).
  - >-
    ops-health-report.py on con01's ada-voice checkout has UNCOMMITTED
    edits (CMS-plane routing via is_cms_collection + mddb-cms-vector
    probe) — not mine, looks complete. The shipped patch targets ada-
    voice HEAD; if those edits land first, rebase: keep the
    `base = MDDB_CMS if is_cms_collection(...) else MDDB` line and swap
    MDDB->base inside post()'s health gate + Request.
  - >-
    GOMEMLIMIT caveat: mddb-cms runs GOMEMLIMIT=2000MiB yet peaked 7.1G
    RSS — Go runtime limit bounds heap, not mmap'd bbolt/vector indexes
    or GC pacing. Only a cgroup MemoryMax hard-bounds RSS; that is why
    the request offers real MemoryHigh/MemoryMax values.
  - >-
    Sibling publishers: ~15 scripts/ada/*-update.py still use unguarded
    _post (noted in 2026-11-27-cms-publish-remote-close-retry.yml).
    media-inbox-update.py was the one this card covers; adopting the
    same gate elsewhere is mechanical now that the pattern exists in
    two repos.
