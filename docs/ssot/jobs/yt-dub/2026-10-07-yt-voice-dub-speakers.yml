  - file: scripts/ops/yt-vtt-dub.py
    summary: "--diarize-file/--min-turn/--anchors/--names-map; parse_diarize, speaker_voices (PITCH_LADDER families), anchor_speakers; turns_to_cast_times accepts 3-tuples; --cast-detect also uses pitch families"
  - file: scripts/ops/yt-diarize.py
    summary: "new — pyannote speaker-diarization-3.1 -> 'start end SPEAKER_NN' (+ --rttm); runs on tony-omen ~/.venvs/diarize"
  - file: scripts/ops/yt-diarize-remote.sh
    summary: "new — omen diarize -> mn01 corpus handoff (scp in, ssh run, turn file to ~/media-corpus/yt-dub-prep/)"
  - file: scripts/ops/yt-pipeline-install.sh
    summary: FILES += yt-diarize.py, yt-diarize-remote.sh
  - file: tests/yt_dub/test_diarize_cast.py
    summary: "new — 7 regression tests (formats, micro-turn filter/merge, families, anchors, cast-times)"
  - file: tests/fixtures/yt-dub/
    summary: "U_io-pqPFfQ.diarize.txt + names-map.json + turns.json — render verification artifacts"

