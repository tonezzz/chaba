    - check: relay
      result: "input-bridge :3010 healthy, 4 screens / 4 rooms"
  lessons_learned:
    - >-
      Relay display-number vs key-name drift — live registry shows
      screen slots 1-4 mapped to ada keys screen-6/5/7/1 (assigned
      2026-10-06T09:34Z). Routing is by the numeric 'screen' field —
      the screen-N name is only the auth key. Ada's vcast_list returns
      both fields; 'screen 2' from the user means screen=2, NOT the
      display named screen-2. If a display claims name screen-N the
      relay honors N when free, so fresh pairings converge again.
    - >-
      'screen 2' currently = a "Browser" label display. If Tony means
      a different physical device by "screen 2", the live pass should
      confirm via cast_to_screen(action='list') labels before pubbing.
    - >-
      vcast ACL registry (~/.local/share/ada-pi/cast-screens.json)
      lives on idc03 and was unreachable this session (ssh timeout);
      default for unlisted screens is 'shared', so no owner-block is
      expected for Tony's cast — flag only if the live pass returns a
      denied error.
  next_steps:
