  metrics:
    - check: dub asset
      result: "LLALMFmabV4-dub.mp4 4.6MB, 180s, HTTP 200"
    - check: cached-videos-report
      result: "published en page 17:30 ICT includes LLALMFmabV4 (29 playables, 1 cached, 22 subs)"
    - check: yt-live-api
      result: ":8791 /health ok, phase=complete"
    - check: screen 2
