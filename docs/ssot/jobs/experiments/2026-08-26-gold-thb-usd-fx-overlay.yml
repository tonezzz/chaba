title: Gold/THB/USD FX Pre-Positioning
subtitle: Explore buying USD in advance to time the FX leg before gold settlement
icon: target

planning:
  goal: |
    Determine whether pre-converting THB to USD one day before the gold trade
    improves the THB-denominated risk-adjusted return. The overlay decides the
    currency (USD or THB) based on the next-day USD/THB outlook, then runs the
    chosen gold signal in that currency.
  scope: |
    - Use the existing data/aligned_thb_base.csv (XAU/USD, USD/THB, XAU/THB).
    - Implement a first FX overlay: hold USD when the next-day USD/THB return
      is predicted positive, otherwise hold THB, then execute the XAU signal in
      the chosen currency.
    - Run a walk-forward OOS backtest from 2014-2026.
    - Compare to the XAU/USD (hold USD), XAU/THB (settle THB), and THB+XAG
      graph+k-NN baselines.
    - If results are stable, update app/thb-settlement.html to show the new curve.
  out_of_scope: |
    - Live trading or trade-api integration.
    - Multi-day FX carry beyond one-day pre-positioning.
    - Thai tax, custody, or FX conversion timing finer than daily close.
  success_criteria:
    - A reproducible backtest of the USD pre-positioning overlay.
    - A metrics table comparing the overlay to the no-overlay baselines.
    - A committed SSOT and script.
    - An app update only if the overlay strictly beats a baseline.
  risks:
    - USD/THB is noisy at the one-day horizon; the overlay may add transaction
      costs without reliable prediction.
    - The FX timing and the gold timing may be collinear, so the combined signal
      could double-count the same edge.
    - Adding THB/USD conversion costs could erase small marginal gains.
  resources:
    - experiments/gold-thb-usd-causality/data/aligned_thb_base.csv
    - experiments/gold-thb-usd-causality/trended_graph_knn_thb.py
    - experiments/gold-thb-usd-causality/tune_graph_knn_thb.py
    - python3 with pandas, numpy, scikit-learn, statsmodels.
  owner: tony
  estimated_duration: 1-2 sessions

processing:
  status: in_progress
  current_step: 3
  started_at: '2026-08-26'
  last_updated: '2026-08-26'
  notes: |
    First FX overlay prototype (trended_graph_knn_fx_overlay.py) on the
    XAU/USD graph+k-NN signal with a separate USD/THB predictor for idle cash.
    Settings: W=2, K=30, KFX=30, P=0.01, edge=504, TC=0.05%, TC_FX=0.05%.
    OOS 2014-2026 result:
    - Sharpe: 2.49
    - Annual return: 21.4%
    - Annual vol: 8.6%
    - Max drawdown: -7.3%
    - Win rate: 13.7%
    It beats the hold-USD reference (Sharpe 2.19) and the THB settle variant
    (2.37) but not the XAU/USD baseline (2.77) or the THB+XAG branch best
    (3.43). The FX timing filters some THB-carry noise but the 0.05% FX
    transaction cost and the one-day horizon limit the gain.
  steps:
    - id: 1
      label: Build FX overlay data
      status: completed
      completed_at: '2026-08-26'
      notes: |
        data/aligned.csv (xau, thb) is used directly; one-day USD/THB and
        XAU/USD returns are derived inside the script.
    - id: 2
      label: Implement USD pre-positioning overlay
      status: completed
      completed_at: '2026-08-26'
      notes: |
        Implemented trended_graph_knn_fx_overlay.py. It keeps the same gold
        k-NN and adds a second k-NN that predicts next-day USD/THB return. The
        cash is pre-positioned in USD when the predicted FX return is positive,
        otherwise THB. Gold positions are always funded in USD.
    - id: 3
      label: Run OOS and compare
      status: completed
      completed_at: '2026-08-26'
      notes: |
        OOS 2014-2026 completed. The overlay is better than hold-USD but not
        the XAU/USD baseline. A TC_FX stress test or KFX tuning may be useful.
    - id: 4
      label: Update app if better
      status: pending
      notes: |
        The overlay does not beat the XAU/USD silver baseline, so the app is
        not updated. It can still be added as an optional reference curve.
    - id: 5
      label: Document conclusion
      status: pending
      notes: |
        Update this SSOT with the final tuned/sweep result and a clear
        recommendation on whether to pre-position USD.

