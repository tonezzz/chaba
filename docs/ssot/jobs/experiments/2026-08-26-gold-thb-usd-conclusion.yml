report:
  status: completed
  completed_at: '2026-08-26'
  summary: |
    After exploring ~30 distinct strategies, the branch best is the THB+XAG
    graph+k-NN (trended_graph_knn_thb_xag.py) with W=2, K=50, P_THRESHOLD=0.01,
    EDGE_LOOKBACK=504, and TC=0.05%. It produced a 3.53 Sharpe, 36.9% annual
    return, 10.5% annual vol, -7.3% max drawdown, and 17.5% win rate.

    A follow-up THB basis tool sweep (2026-08-27) found that ATR-based
    position sizing further improves the THB+XAG k-NN result. The tuned
    variant (ATR_WINDOW=7, TARGET_VOL=0.15, MAX_LEVERAGE=2.0) delivered a
    3.82 Sharpe, 44.7% annual return, 11.7% annual vol, -6.9% max drawdown,
    and 17.5% win rate.

    Key findings:
    - The THB->XAU Granger edge is the central gate that cuts the worst losses.
    - Adding XAG/silver to the k-NN feature vector improved returns over the
      THB+XAU baseline.
    - Removing the XAU own-return feature (THB+XAG only) further improved
      performance, demonstrating that XAU's own past return is redundant.
    - Volatility targeting (TARGET_VOL=0.20) raised the XAU/USD silver variant
      to a 3.46 Sharpe, but the THB+XAG non-vol variant remains the best on
      risk-adjusted return.
    - Oil, USD/EUR, multi-day horizons, dynamic K/WINDOW, alternative distance
      metrics, and volatility/trend regime gates did not beat the selected
      THB+XAG baseline.
    - THB settlement (XAU/THB target) underperformed the XAU/USD signal, mainly
      because the USD/THB carry added volatility without improving Sharpe.
  metrics_ref: docs/ssot/jobs/experiments/2026-08-26-gold-thb-usd-conclusion-metrics.yml
  top_metrics:
    - variant: THB+XAG ATR-sized (tuned)
      file: trended_atr_sizing.py
      params: W=2 K=50 ATR_WINDOW=7 TARGET_VOL=0.15 MAX_LEVERAGE=2.0
      sharpe: 3.82
      annual_return: 44.7%
      annual_vol: 11.7%
      max_dd: -6.9%
      win_rate: 17.5%
    - variant: THB+XAG graph+k-NN (branch best)
      file: trended_graph_knn_thb_xag.py
      sharpe: 3.53
      annual_return: 36.9%
      annual_vol: 10.5%
      max_dd: -7.3%
      win_rate: 17.5%
  lessons_learned:
    - The THB->XAU Granger edge is the main protective filter.
    - XAG/silver provides genuine incremental signal beyond THB and XAU.
    - XAU's own past return is redundant once THB and XAG are included.
    - Volatility targeting improves risk-adjusted return and drawdown, but not as much
      as switching to the optimal THB+XAG feature subset.
    - Oil, USD/EUR, multi-day horizons, dynamic parameter selection, and regime gates
      did not improve the final THB+XAG baseline.
    - "Transaction costs are the biggest practical risk: the strategy is robust to ~0.10% TC but breaks by 0.50%."

