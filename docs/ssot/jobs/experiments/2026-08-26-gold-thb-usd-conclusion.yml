    Capture the final results of the Gold/THB/USD causality research thread.
    Document every strategy tested, the best configuration, and why it emerged
    as the branch winner. Keep it research-only and avoid any live-trading
    implications.
  scope: |
    - List all tested strategies with their out-of-sample 2014-2026 metrics.
    - Identify the branch best and key findings.
    - Reference the scripts and data files used for each family of experiments.
