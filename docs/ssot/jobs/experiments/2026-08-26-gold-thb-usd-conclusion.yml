    - variant: 2-day THB trend
      file: trended.py
      sharpe: -0.68
      annual_return: -12.9%
      annual_vol: 18.9%
      max_dd: -76.8%
      win_rate: 29.7%
  lessons_learned:
    - The THB->XAU Granger edge is the main protective filter.
    - XAG/silver provides incremental signal.
    - Volatility targeting with TARGET_VOL=0.20 improves the silver k-NN.
    - Oil, USD/EUR, multi-day horizons, dynamic K/WINDOW, and regime gates
      did not improve the final THB+XAU+XAG baseline.
    - "Transaction costs are the biggest practical risk: robust to ~0.10% TC, breaks by 0.50%."

