title: Gold/THB/USD Research Conclusion
subtitle: Walk-forward exploration of causality and vector-analysis strategies for XAU/USD
icon: milestone

planning:
  goal: |
    Capture the final results of the Gold/THB/USD causality research thread on
    the gold-silver-causality branch. Document the tested strategies, the best
    configuration, and key findings. Research-only.
  scope: |
    - List the main strategies and their OOS 2014-2026 metrics.
    - Identify the branch best and key takeaways.
  out_of_scope: |
    - Real-time execution or trade-api integration.
    - Any claim that the backtest is a live-trading guarantee.

processing:
  status: completed
  current_step: 1
  started_at: '2026-08-26'
  last_updated: '2026-08-26'
  completed_at: '2026-08-26'
  notes: |
    Research finished. The best configuration on this branch is the vol-sized
    silver graph+k-NN: W=2, K=30, TARGET_VOL=0.20, P_THRESHOLD=0.01,
    EDGE_LOOKBACK=504, TC=0.05%. The overall best (THB+XAG, W=2, K=50,
    Sharpe 3.53) is recorded on research/thb-base-settlement.

report:
  status: completed
  completed_at: '2026-08-26'
  summary: |
    The central finding is that a THB->XAU Granger-causality edge, combined
    with a k-NN pattern matcher on THB, XAU, and XAG/silver returns, produces
    a strong walk-forward result. Volatility targeting (TARGET_VOL=0.20) and
    silver (XAG) both improve the baseline. Oil, USD/EUR, multi-day horizons,
    dynamic K/WINDOW, alternative distance metrics, and volatility-regime gates
    did not improve the selected configuration.
  metrics:
    - variant: Vol-sized silver graph+k-NN (branch best)
      file: trended_graph_knn_vol_silver.py
      params: W=2 K=30 TARGET_VOL=0.20
      sharpe: 3.46
      annual_return: 39.5%
      annual_vol: 11.4%
      max_dd: -5.4%
      win_rate: 15.6%
    - variant: Silver graph+k-NN (no vol)
      file: trended_graph_knn_silver.py
      params: W=2 K=10
      sharpe: 3.29
      annual_return: 34.0%
      annual_vol: 10.3%
      max_dd: -7.3%
      win_rate: 15.6%
    - variant: Vol-sized silver + WTI oil
      file: trended_graph_knn_vol_silver_extras.py
      params: EXTRA_COL=oil
      sharpe: 3.25
      annual_return: 36.3%
      annual_vol: 11.1%
      max_dd: -8.2%
      win_rate: 15.5%
    - variant: Vol-sized silver + Brent
      file: trended_graph_knn_vol_silver_extras.py
      params: EXTRA_COL=brent
      sharpe: 3.17
      annual_return: 35.9%
      annual_vol: 11.3%
      max_dd: -17.4%
      win_rate: 15.7%
    - variant: Vol-sized silver + USD/EUR
