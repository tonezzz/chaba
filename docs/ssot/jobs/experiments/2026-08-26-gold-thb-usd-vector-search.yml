    - Re-run the new scripts in a fresh checkout and confirm the app page loads.
  rollback_plan:
    - Delete the new SSOT file and the app/vector-search-ideas.* files.
  handoff:
    - tony for promotion to a prototype if any variant beats the 2-day trend baseline.
  deferred:
