  read: |
    WangchanX + WangchanLION own Thai NLG (news summarisation, extractive QA —
    likely domain overlap with eval data). Typhoon owns en->th MT and is the
    actively developed family. KhanomTanLLM 1B/3B scored ~0 on NLG (broken
    outputs). Absolute numbers are SEACrowd-harness, not our harness — our
    eval_run.py reproduces the same three task families for the Δ measurement.

data_pack:
  sft: "airesearch/wangchanx-seed-free-synthetic-instruct-thai-120k (MIT, 118,898 rows) — same seed-free synthetic mix WangchanX trains on; default 8k seeded slice"
  xlsum: "csebuetnlp/xlsum thai_XLSum_v2.0.tar.bz2 test=826 (12MB tarball; not datasets-loadable — parsed manually)"
  thaiqa: "lighteval/thaiqa_squad_fixed validation=74 — parquet mirror of pythainlp/thaiqa_squad (script-only repo, unloadable on datasets>=3)"
  scbmt: "pythainlp/scb-mt-en-th-2020_mt-opus test seeded 1k en->th (test split is 432k rows — must subsample)"
  verified: "prep_data.py ran end-to-end on idc02 CPU 2026-11-24; all 4 jsonl files written; metric functions unit-checked"

metric_caveats:
  - "rouge_score default tokenizer keeps only [a-z0-9] — Thai scores 0. eval_run.py uses PyThaiNLP newmm segmentation (+thainlp corpus pkg), per-char fallback."
  - "sacrebleu BLEU on unspaced Thai degenerates; chrF++ is the robust primary for Thai MT. BLEU reported for comparability — compare deltas."
  - "ThaiQA-SQuAD val = 74 items — noisy; iApp-SQuAD (SEACrowd) is the leaderboard proxy if a bigger ThaiQA set is wanted."

harness:
  dir: experiments/thai-llm-ft/
  files:
    prep_data.py: "HF -> data/{sft_train,eval_xlsum_th,eval_thaiqa_validation,eval_scbmt_en2th}.jsonl (deterministic seed 20261124)"
    train_lora.py: "QLoRA SFT, completion-only loss; unsloth backend preferred (4GB VRAM), peft+bnb fallback; r=16 a=32 lr=2e-4 2ep seq2048"
    merge_lora.py: "adapter -> merged HF dir for eval/GGUF export"
    eval_run.py: "backend hf (transformers) | openai (vllm/ollama/llama.cpp server); strips <think> blocks; writes results-*.json"
  gpu_sizing: |
    4B QLoRA ~6GB VRAM (unsloth+small bs for omen 4GB); 8B QLoRA ~10-12GB —
    omen GTX1650 4GB NOT viable for the 8B lane; needs >=12GB (rented T4 ok).
    idc02 CPU cannot train; this dispatch verified data+metrics only.

deploy_lane:
  if_winner_typhoon: "official GGUF typhoon2.5-qwen3-4b-q4_k_m (2.50GB) -> ollama on omen GPU or idc shelf; Apache-2.0 clean"
  if_winner_wangchanx: "GGUF via mradermacher/llama-3.1-8b-wangchanX-instruct-GGUF Q4_K_M (~4.9GB) or merge+convert own LoRA; llama3 license (700M-MAU cap)"
  note: "eval_run.py --backend openai scores the deployed GGUF through ollama :11434/v1 or llama.cpp server — same metrics pre/post deploy"

remaining_for_done:
  - "GPU run: 2x train_lora.py (4B ~hours on T4; 8B needs >=12GB) + eval_run.py --eval all on 4 model variants (2 instruct baselines + 2 LoRA) — then fill comparison table + verdict"
  - "decision this doc leaves open: deploy Typhoon2.5-4B GGUF now as the 'usable TODAY' baseline regardless of LoRA outcome (recommended)"

