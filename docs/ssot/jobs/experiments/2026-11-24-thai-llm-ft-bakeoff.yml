title: Thai LLM fine-tune bakeoff — Typhoon-2.5 vs WangchanX
subtitle: Desk bakeoff + ready-to-run LoRA/eval harness; GPU run is the remaining step
icon: flask
card: thai-llm-finetune-experiment-typhoon-wan-9ef801  # OPS-0760
related:
  ncm_recon: docs/ssot/jobs/experiments/2026-10-20-ncm-thai-recon.yml
  ncm_toy: docs/ssot/jobs/experiments/2026-10-20-ncm-thai-toy-train.yml
  code: experiments/thai-llm-ft/  # prep_data.py + train_lora.py + eval_run.py + merge_lora.py
  leaderboard: huggingface.co/datasets/ThaiLLM-Leaderboard/results

decision_context:
  mode: desk-bakeoff  # dispatch on idc02 — CPU-only 4c/15GB, no GPU; mirrors NCM recon/toy-train split
  host: idc02

gate_answer:
  question: "if the want is fast/usable Thai generation TODAY, does a small Thai AR model beat rebuilding NCM?"
  verdict: |
    YES — verified live, not just on paper. Typhoon2.5-Qwen3-4B Q4_K_M GGUF
    (2.5GB, official, Apache-2.0) ran on idc02 CPU-only via llama-cpp-python:
    fluent Thai self-intro, a correct one-line Thai news summary (XL-Sum-style
    prompt), and a correct EN->TH translation — ~0.4-0.6 tok/s under host load
    (uncontended CPU est. 2-4 tok/s; omen GPU would be 30-80 tok/s). "Usable
    TODAY" = deploy this GGUF on ollama; "fast" needs the GPU lane.
    NCM stays a research artifact — not instruction-tuned, Thai toy run still
    needs a GPU day (OPS-0750).
    The open question the GPU run answers: does light LoRA on the WangchanX
    120k Thai-instruct slice move either model enough to change the deploy pick?
    Published numbers say WangchanX-8B owns Thai NLG (news summarisation/QA)
    while Typhoon owns en→th MT — the bakeoff decides if that gap survives
    at 4B and after equal-data SFT.

smoke_test:
  date: 2026-11-24
  host: idc02 (4 vCPU, no GPU, load ~5 during run)
  model: typhoon-ai/typhoon2.5-qwen3-4b-gguf typhoon2.5-qwen3-4b-q4_k_m.gguf (2,497,276,128 B)
  runtime: llama-cpp-python 0.3.38, n_ctx=4096, n_threads=4, temp=0
  results:
    thai_self_intro: "fluent natural Thai, correct self-description (thinks it's Qwen — base-model identity leak through Typhoon's thin persona)"
    thai_news_summary: "accurate one-line Thai summary of XL-Sum-style Delhi-PM2.5 article"
    en_to_th_translation: "correct Thai translation; leaked '<s>' and '[/INST]' literal tokens — chat-template artifact of this GGUF on llama.cpp, cosmetic"
  speed: "0.4-0.6 tok/s under load; model load+mmap ~60s; RSS ~4.3GB"
  verdict_input: "instruct baseline already produces usable Thai — supports 'deploy now, fine-tune only if Δ justifies it'"

base_picks:
  typhoon: typhoon-ai/typhoon2.5-qwen3-4b   # Qwen3-4B instruct, 256k ctx, Apache-2.0, official GGUF
  wangchanx: airesearch/LLaMa3-8b-WangchanX-sft-Full  # Llama-3-8B instruct, llama3 license
  alternates_rejected:
    - "typhoon2-qwen2.5-7b-instruct / llama3.x-typhoon2-*-instruct — previous gens, superseded by 2.5"
    - "typhoon2.5-qwen3-30b-a3b — MoE, too big for the deploy lane"
    - "airesearch/*-cpt-sea-lionv2 / gemma-2-9b-alpaca-th-* — WangchanX pipeline experiments, no canonical instruct release"
    - "airesearch/LLaMa3-8b-WangchanX-sft-Demo — demo-size SFT, sft-Full is the flagship"

