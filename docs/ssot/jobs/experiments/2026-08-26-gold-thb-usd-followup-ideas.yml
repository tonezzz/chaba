title: Gold/THB/USD Follow-up Research Ideas
subtitle: Post-tuning follow-ups for the silver graph+k-NN and related variants
icon: target

planning:
  goal: |
    After tuning the silver graph+k-NN to W=2, K=10, p=0.01, edge=504 (Sharpe 3.43),
    explore a set of logical next ideas that either improve risk-adjusted return,
    reduce drawdown, or validate the robustness of the current best configuration.
  scope: |
    - Volatility-targeted position sizing applied to the tuned silver graph+k-NN.
    - A volatility or trend-strength regime gate on top of the existing edge filter.
    - Feature ablation: THB-only, XAU-only, XAG-only, and paired combinations.
    - Transaction-cost sensitivity: 0.10%, 0.20%, 0.50% per trade.
    - Gold/silver log-spread as an additional or replacement feature.
    - A graph filter that also requires XAG->XAU Granger significance.
  out_of_scope: |
    - Real-time trading system implementation.
    - New asset classes beyond THB, XAU, and XAG.
    - Deep-learning model training.
    - Live deployment to the trade-api stack.
  success_criteria:
    - Each idea is implemented as a reproducible walk-forward script.
    - A results table compares each variant against the W=2, K=10 silver baseline.
    - The app is updated only if a variant strictly beats the current best.
  risks:
    - Combining too many ideas at once can hide which one matters; scope one per script.
    - Volatility sizing and regime filters add hyper-parameters; tune on training data only.
    - Feature ablation may show that XAG alone is fragile; cross-check with longer OOS subperiods.
  resources:
    - experiments/gold-thb-usd-causality/data/aligned_silver.csv
    - experiments/gold-thb-usd-causality/trended_graph_knn_silver.py
    - experiments/gold-thb-usd-causality/tune_graph_knn_silver.py
    - experiments/gold-thb-usd-causality/trended_graph_knn_vol.py

