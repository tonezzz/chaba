title: Gold/THB/USD Follow-up Research Ideas
subtitle: Post-tuning follow-ups for the silver graph+k-NN and related variants
icon: target

planning:
  goal: |
    After tuning the silver graph+k-NN to W=2, K=10, p=0.01, edge=504 (Sharpe 3.43),
    explore a set of logical next ideas that either improve risk-adjusted return,
    reduce drawdown, or validate the robustness of the current best configuration.
  scope: |
    - Volatility-targeted position sizing applied to the tuned silver graph+k-NN.
    - A volatility or trend-strength regime gate on top of the existing edge filter.
    - Feature ablation: THB-only, XAU-only, XAG-only, and paired combinations.
    - Transaction-cost sensitivity: 0.10%, 0.20%, 0.50% per trade.
    - Gold/silver log-spread as an additional or replacement feature.
    - A graph filter that also requires XAG->XAU Granger significance.
  out_of_scope: |
    - Real-time trading system implementation.
    - New asset classes beyond THB, XAU, and XAG.
    - Deep-learning model training.
    - Live deployment to the trade-api stack.
  success_criteria:
    - Each idea is implemented as a reproducible walk-forward script.
    - A results table compares each variant against the W=2, K=10 silver baseline.
    - The app is updated only if a variant strictly beats the current best.
  risks:
    - Combining too many ideas at once can hide which one matters; scope one per script.
    - Volatility sizing and regime filters add hyper-parameters; tune on training data only.
    - Feature ablation may show that XAG alone is fragile; cross-check with longer OOS subperiods.
  resources:
    - experiments/gold-thb-usd-causality/data/aligned_silver.csv
    - experiments/gold-thb-usd-causality/trended_graph_knn_silver.py
    - experiments/gold-thb-usd-causality/tune_graph_knn_silver.py
    - experiments/gold-thb-usd-causality/trended_graph_knn_vol.py

processing:
  status: in_progress
  current_step: 0
  started_at: '2026-08-26'
  last_updated: '2026-08-26'
  notes: |
    The tuned silver graph+k-NN (W=2, K=10, p=0.01, EDGE_LOOKBACK=504) was the
    initial best: Sharpe 3.43, annual return 34.0%, annual vol 9.9%, max DD -6.7%,
    win rate 15.1%.

    Step 1 completed: vol-sized silver graph+k-NN (W=2, K=30, TARGET_VOL=0.20)
    becomes the new best:
    - Sharpe: 3.46
    - Annual return: 39.5%
    - Annual vol: 11.4%
    - Max drawdown: -5.4%
    - Win rate: 15.6%
    The higher target-vol version retains the silver signal and scales positions
    by XAU realized volatility with MAX_LEVERAGE=2.0. The app/vector-analysis-ideas.js
    is updated to show the combined vol-sized curve.

steps:
  - id: 1
    label: Vol-sized silver graph+k-NN
    status: completed
    started_at: '2026-08-26'
    completed_at: '2026-08-26'
    notes: |
      Combine the tuned silver graph+k-NN with volatility-targeted position sizing
      from trended_graph_knn_vol.py. Target: higher Sharpe or lower drawdown while
      preserving return. Deliverable: trended_graph_knn_vol_silver.py.

      Result: W=2, K=30, TARGET_VOL=0.20, P_THRESHOLD=0.01, EDGE_LOOKBACK=504.
      OOS 2014-2026:
      - Sharpe: 3.46
      - Annual return: 39.5%
      - Annual vol: 11.4%
      - Max drawdown: -5.4%
      - Win rate: 15.6%
      This is the new best in the branch. app/vector-analysis-ideas.js
      is updated to show the combined equity curve.
  - id: 2
    label: Volatility/trend regime gate
    status: completed
    started_at: '2026-08-26'
    completed_at: '2026-08-26'
    notes: |
      Implemented trended_graph_knn_silver_regime.py. The THB->XAU edge gate is
      combined with a realized XAU volatility gate: the month is skipped if the
      trailing XAU return volatility exceeds VOL_THRESHOLD.
      - VOL_THRESHOLD=0.015: Sharpe 2.90, ret 24.0%, vol 8.3%, max DD -6.7%
      - VOL_THRESHOLD=0.025: Sharpe 3.43, ret 34.0%, vol 9.9%, max DD -6.7%
      The 0.025 result is identical to the no-gate silver baseline, meaning the
      gate does not filter anything meaningful at that level. A stricter 0.015
      threshold cuts too much activity. The regime gate does not improve the
      current best.
  - id: 3
    label: Feature ablation
    status: completed
    started_at: '2026-08-26'
    completed_at: '2026-08-26'
    notes: |
      Implemented tune_graph_knn_silver_ablate.py. Tested feature subsets
      (thb_xau_xag, thb_xau, thb_xag, xau_xag, xag) with K=10,30,50,
      P=0.01, edge=504. Top results:
      - thb_xag, K=50: Sharpe 3.53, ann ret 36.9%, vol 10.5%, max DD -7.3%
      - thb_xag, K=30: Sharpe 3.43, ann ret 35.7%, vol 10.4%, max DD -7.3%
      - thb_xau_xag, K=10: Sharpe 3.43, ann ret 34.0%, vol 9.9%, max DD -6.7%
      - xag, K=50: Sharpe 3.18, ann ret 32.4%, vol 10.2%, max DD -6.7%
      The XAU (own-return) feature is not needed: THB + XAG alone is stronger.
      This is the most important ablation finding.
  - id: 4
    label: Transaction-cost stress test
    status: completed
    started_at: '2026-08-26'
    completed_at: '2026-08-26'
    notes: |
      Implemented trended_graph_knn_thb_xag.py (THB + XAG, K=50) and ran the
      transaction-cost sweep on the new best feature subset:
      - TC=0.05%: Sharpe 3.52, ann ret 36.8%, vol 10.4%, max DD -7.3%
      - TC=0.10%: Sharpe 3.26, ann ret 33.7%, vol 10.4%, max DD -7.5%
      - TC=0.20%: Sharpe 2.69, ann ret 27.5%, vol 10.2%, max DD -8.8%
      - TC=0.50%: Sharpe 0.86, ann ret 8.9%, vol 10.4%, max DD -31.8%
      The strategy is robust up to ~0.10% TC but breaks by 0.50%. The baseline
      0.05% remains the best for research.
  - id: 5
    label: Gold/silver spread feature
    status: pending
    started_at: null
    completed_at: null
    notes: |
      Replace raw xag_ret with the xau-xag log spread or add it as a fourth
      feature. Test whether the relative gold/silver ratio is more predictive.
      Deliverable: trended_graph_knn_silver_spread.py.
  - id: 6
    label: XAG->XAU Granger edge filter
    status: pending
    started_at: null
    completed_at: null
    notes: |
      Require both THB->XAU and XAG->XAU Granger edges to be significant before
      allowing trades. Compare to the THB-only gate. Deliverable:
      trended_graph_knn_silver_dual.py.

