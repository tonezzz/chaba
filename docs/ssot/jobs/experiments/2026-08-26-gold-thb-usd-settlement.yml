title: Gold/THB/USD THB Settlement Choice
subtitle: Compare holding USD vs settling immediately to THB for gold P/L
icon: scale

planning:
  goal: |
    Determine whether converting XAU/USD trade proceeds to THB immediately
    (XAU/THB return) changes the risk-adjusted performance of the best
    silver graph+k-NN signal.
  scope: |
    - Build an aligned THB-base CSV from XAU/USD and USD/THB.
    - Run the same graph+k-NN method on XAU/THB using THB and XAU/USD
      returns as features.
    - Compare the XAU/USD and XAU/THB equity curves in the app.
  out_of_scope: |
    - Live trading implementation.
    - Transaction costs for the USD/THB conversion leg.
    - Tax or custody considerations.
  success_criteria:
    - Both equity curves are generated and plotted side-by-side.
    - A results table quantifies the difference in Sharpe, return, vol, and max DD.

processing:
  status: in_progress
  current_step: 5
  started_at: '2026-08-26'
  last_updated: '2026-08-26'
  completed_at: null
  notes: |
    Final comparison of THB settlement choices (default W=2, K=30,
    P_THRESHOLD=0.01, EDGE_LOOKBACK=504):
    - XAU/USD silver (reference): Sharpe 3.43, ann ret 34.0%, vol 9.9%,
      max DD -6.7%, win rate 15.1%
    - XAU/USD position, USD marked to THB daily (hold USD): Sharpe 2.19,
      ann ret 22.1%, vol 10.1%, max DD -7.2%, win rate 51.5%
    - XAU/THB position (settle THB): Sharpe 2.37, ann ret 24.2%, vol 10.2%,
      max DD -8.4%, win rate 13.2%

    The pure XAU/USD silver signal is still the best on a risk-adjusted basis.
    Holding the XAU/USD position and marking USD to THB each day gives a higher
    win rate (51.5%) because the long USD/THB cash position earns the currency
    carry, but the lower Sharpe means the THB volatility is still a drag.
    Settling fully to THB removes the USD carry and produces a lower win rate
    but a slightly higher Sharpe than the hold-USD variant.

steps:
  - id: 1
    label: Build THB-base data
    status: completed
    completed_at: '2026-08-26'
    notes: prepare_thb_base.py writes data/aligned_thb_base.csv with date, xau_usd, usd_thb, xau_thb.
  - id: 2
    label: Run graph+k-NN on XAU/THB
    status: completed
    completed_at: '2026-08-26'
    notes: trended_graph_knn_thb.py generated data/trended_graph_knn_thb_equity.csv and results JSON.
  - id: 3
    label: App page for THB settlement comparison
    status: completed
    completed_at: '2026-08-26'
    notes: app/thb-settlement.html + app/thb-settlement.js plot XAU/USD silver vs XAU/THB curves.
  - id: 4
    label: Tune THB-base variant
    status: completed
    completed_at: '2026-08-26'
    notes: |
      tune_graph_knn_thb.py searched WINDOW {2,3,4,5} x K {10,20,30,50} with
      P_THRESHOLD=0.01 and EDGE_LOOKBACK=504. The best THB-base setting is
      W=3, K=20, Sharpe=2.73, annual return=23.8%, annual vol=8.7%,
      max DD=-6.5%. This is the best THB result but still below the XAU/USD
      silver graph+k-NN (Sharpe 3.43). The underperformance is robust.
  - id: 5
    label: Hold-USD settlement variant
    status: completed
    completed_at: '2026-08-26'
    notes: |
      trended_graph_knn_hold_usd.py generated data/trended_graph_knn_hold_usd_equity.csv.
      W=2, K=30: Sharpe 2.19, ann ret 22.1%, vol 10.1%, max DD -7.2%, win rate 51.5%.
      The high win rate reflects the USD/THB carry, but the Sharpe is still below
      the XAU/USD silver reference.
  - id: 6
    label: Document conclusion
    status: completed
    completed_at: '2026-08-26'
    notes: |
      Conclusion: holding gold P/L in USD (XAU/USD silver) remains best on a
      risk-adjusted basis (Sharpe 3.43). Among THB-settlement choices, the
      full XAU/THB settlement (W=3, K=20, Sharpe 2.73) slightly outperforms the
      hold-USD daily-marked variant (W=2, K=30, Sharpe 2.19) on Sharpe, while
      the hold-USD variant earns a higher win rate (51.5%) from the USD/THB
      carry. For this signal, settling in USD is preferred.

