report:
  status: completed
  completed_at: '2026-08-26'
  summary: |
    Converting XAU/USD trade proceeds to THB immediately (XAU/THB) does not
    improve the best silver graph+k-NN signal. The best THB settlement setting
    (W=3, K=20) reaches Sharpe 2.73, while the same graph+k-NN on XAU/USD
    (silver, W=2, K=10) reaches Sharpe 3.43. Holding USD and converting only
    when needed remains the better settlement choice for this signal. The
    additional USD/THB carry adds volatility and, in the hold-USD reference
    variant (Sharpe 2.19), a daily THB mark-to-market drag. This is research-only
    and does not guarantee future performance.
  metrics:
    - variant: XAU/USD silver graph+k-NN (baseline)
      sharpe: 3.43
      annual_return: 34.0%
      annual_vol: 9.9%
      max_dd: -6.7%
      win_rate: 15.1%
    - variant: XAU/THB settle (W=2, K=30)
      sharpe: 2.37
      annual_return: 24.2%
      annual_vol: 10.2%
      max_dd: -8.4%
      win_rate: 13.2%
    - variant: XAU/THB settle (tuned, W=3, K=20)
      sharpe: 2.73
      annual_return: 23.8%
      annual_vol: 8.7%
      max_dd: -6.5%
      win_rate: 11.8%
    - variant: Hold-USD mark-to-THB (reference)
      sharpe: 2.19
      annual_return: 22.1%
      annual_vol: 10.1%
      max_dd: -7.2%
      win_rate: 51.5%
  links:
    - experiments/gold-thb-usd-causality/trended_graph_knn_thb.py
    - experiments/gold-thb-usd-causality/tune_graph_knn_thb.py
    - experiments/gold-thb-usd-causality/trended_graph_knn_hold_usd.py
    - experiments/gold-thb-usd-causality/prepare_thb_base.py
    - experiments/gold-thb-usd-causality/app/thb-settlement.html
    - experiments/gold-thb-usd-causality/app/thb-settlement.js
  lessons_learned:
    - XAU/THB is not an improvement over XAU/USD for this one-day graph+k-NN
      signal when the settlement conversion is immediate.
    - The USD/THB carry is volatile and adds an FX noise layer that the k-NN
      signal does not reliably time.
    - THB-base multi-asset variants (e.g. THB+XAG) are tracked separately and
      may still be useful; the settlement-currency question is different from
      the feature-engineering question.

