title: Gold/THB/USD THB Settlement Choice
subtitle: Compare holding USD vs settling immediately to THB for gold P/L
icon: scale

planning:
  goal: |
    Determine whether converting XAU/USD trade proceeds to THB immediately
    (XAU/THB return) changes the risk-adjusted performance of the best
    silver graph+k-NN signal.
  scope: |
    - Build an aligned THB-base CSV from XAU/USD and USD/THB.
    - Run the same graph+k-NN method on XAU/THB using THB and XAU/USD
      returns as features.
    - Compare the XAU/USD and XAU/THB equity curves in the app.
  out_of_scope: |
    - Live trading implementation.
    - Transaction costs for the USD/THB conversion leg.
    - Tax or custody considerations.
  success_criteria:
    - Both equity curves are generated and plotted side-by-side.
    - A results table quantifies the difference in Sharpe, return, vol, and max DD.

processing:
  status: in_progress
  current_step: 0
  started_at: '2026-08-26'
  last_updated: '2026-08-26'
  notes: |
    Initial run of trended_graph_knn_thb.py (W=2, K=30, P_THRESHOLD=0.01,
    EDGE_LOOKBACK=504) on the THB-base data:
    - Sharpe: 2.37
    - Annual return: 24.2%
    - Annual vol: 10.2%
    - Max drawdown: -8.4%
    - Win rate: 13.2%
    For comparison, the current XAU/USD silver graph+k-NN (W=2, K=10):
    - Sharpe: 3.43
    - Annual return: 34.0%
    - Annual vol: 9.9%
    - Max drawdown: -6.7%
    - Win rate: 15.1%
    Holding USD and converting only when needed (XAU/USD) is currently better
    on a risk-adjusted basis. The XAU/THB settlement underperforms mainly
    because the USD/THB carry is volatile and slightly detracts from the
    concentrated XAU/USD signal.

steps:
  - id: 1
    label: Build THB-base data
    status: completed
    completed_at: '2026-08-26'
    notes: prepare_thb_base.py writes data/aligned_thb_base.csv with date, xau_usd, usd_thb, xau_thb.
  - id: 2
    label: Run graph+k-NN on XAU/THB
    status: completed
    completed_at: '2026-08-26'
    notes: trended_graph_knn_thb.py generated data/trended_graph_knn_thb_equity.csv and results JSON.
  - id: 3
    label: App page for THB settlement comparison
    status: completed
    completed_at: '2026-08-26'
    notes: app/thb-settlement.html + app/thb-settlement.js plot XAU/USD silver vs XAU/THB curves.
  - id: 4
    label: Tune THB-base variant
    status: completed
    completed_at: '2026-08-26'
    notes: |
      tune_graph_knn_thb.py searched WINDOW {2,3,4,5} x K {10,20,30,50} with
      P_THRESHOLD=0.01 and EDGE_LOOKBACK=504. The best THB-base setting is
      W=3, K=20, Sharpe=2.73, annual return=23.8%, annual vol=8.7%,
      max DD=-6.5%. This is the best THB result but still below the XAU/USD
      silver graph+k-NN (Sharpe 3.43). The underperformance is robust.
  - id: 5
    label: Document conclusion
    status: pending
    notes: Update this SSOT with the final tuned result and a recommendation.

