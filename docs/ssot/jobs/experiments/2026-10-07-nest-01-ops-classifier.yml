report:
  status: done
  completed_at: "2026-10-07 21:30 +07"
  summary: >
    P0 of chaba-nest-models verified end-to-end: nest-01-ops-classifier is a
    116-line pure-numpy MLP (27→32→13, softmax+SGD, capped class weights)
    trained on 2000 real Ada ops events; deterministic retrain reproduces
    50.7% test accuracy vs ~8% chance on a temporal 80/20 split, and the
    zero-dependency eval.py reproduces it from model.npz alone — the exact
    continuity check a brain respawn needs. The score trails the drifted
    test window's 61% majority baseline, which is the curriculum's first
    real lesson: features bound accuracy (tool→type ceiling 81%), imbalance
    collapses naive training, and only a time-ordered split reveals drift.
    The 10KB artifact is the right shape for per-node micro models — the
    vision premise holds even where this task's features cap the score.
    Continuous-education feed (report-ai-edge.py, Mon 06:00 → CMS
    ai-edge-report) is live. P1 (Flower federation), P2 (architecture
    curriculum → MDDB bench), P3 (NEAT evolution loop) remain on the card.
  metrics:
    - {metric: test_accuracy, value: 0.507, n: "203/400", suite: orch-bench}
    - {metric: chance_level, value: 0.08, note: "13 classes"}
    - {metric: majority_baseline_test, value: 0.61, note: "drifted window — jev_advisory wave"}
    - {metric: tool_to_type_ceiling, value: 0.81, note: "feature bound"}
    - {metric: model_size_kb, value: 10, note: "npz float64 weights"}
  artifacts:
    - experiments/nest-01-ops-classifier/ (README, train.py, eval.py, model.npz, ops-events.jsonl)
    - scripts/report-ai-edge.py + systemd/report-ai-edge.{service,timer}
    - docs/ssot/infrastructure/ssot.nest-brains.yml (entity: packed-verified)
    - docs/kb/nest-portable-brains-research.md
