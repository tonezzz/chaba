title: Update caddy container image to patched version
subtitle: Rebuild the web/Caddy container to eliminate HIGH/CRITICAL CVEs in caddy:latest
icon: target

planning:
  goal: Replace the currently deployed caddy:latest image (2.11.4 from 2026-06-22) with a patched Caddy image that has no HIGH/CRITICAL CVEs, or rebuild with an updated base and Go stdlib.
  scope: 'In scope: stacks/web/docker-compose.yml, web container image, tony-dell podman deployment. Out of scope: Caddyfile routing, other containers.'
  success_criteria:
  - trivy image caddy:<new-tag> reports 0 HIGH/CRITICAL vulnerabilities, or only accepted OS-level issues.
  - web container is running the new image and mcp-health Caddy/BServer remain healthy.
  - Old caddy:latest image is removed or retagged to avoid accidental reuse.
  risks:
  - Newer Caddy version may have config incompatibilities. Test before replacing live container.
  - Rebuild on tony-dell may require pulling a remote image; ensure Tailscale / Docker Hub access.
  resources:
  - stacks/web/docker-compose.yml
  - tony-dell podman
  - trivy
  - docker.io/library/caddy
  owner: tony
  estimated_duration: 1 session
  related_focus:
  - label: Security Vulnerabilities Found (2026-08-20)
    file: docs/ssot/ssot.focus.current.yml

