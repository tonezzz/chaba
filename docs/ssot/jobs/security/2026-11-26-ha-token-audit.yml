rollback: >-
  None needed — no credential, HA config, token file or service was
  changed. No rotation was performed because every token is valid on its
  correct endpoint.
residual: >-
  The false-positive focus-inbox item remains: board-api /inbox has no
  delete/update endpoint, and focus-inbox files are a board-owned surface,
  so it was not removed by direct file edit. It is flagged in the card
  comment for triage. The original curl/8.18.0 localhost probes from
  23–26 Nov were one-off ad-hoc diagnostics whose exact caller was not
  identified (no matching script or shell history); they have not
  recurred since 09:50:35 +07 before this audit.
lesson: >-
  Probe an HA token only against the endpoint declared for that slot.
  Wrong-endpoint 401s are not harmless: HA records them as invalid-auth
  warnings from localhost, and ha-auth-watch turns them into real
  focus-inbox alerts. Use `key-watch.py --dry-run` (which carries each
  slot's URL) instead of an ad-hoc env-file sweep. Also: a 401 from a
  token tested against the wrong HA instance is not evidence of a stale
  credential — check the slot's declared URL before rotating anything.
