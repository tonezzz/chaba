title: Scrub XMEye credential material from AGENTS.md
subtitle: card remove-device-credentials-from-agent-rules (SEC-1297) — refs replace plaintext, rotation decision escalated
icon: shield

decision:
  summary: >
    AGENTS.md "XMEye VMS" section carried plaintext device auth material:
    the VMS app login (vendor-default-ish password + saved hash, duplicated
    on two lines) and a user-supplied device/DVR test password. Replaced
    both with references: VMS app login -> saved hash in on-host
    vms-runtime/config.ini [Login] (deviation already registered in
    ssot.security.devices.yml xmeye-dvrs); device/DVR credentials ->
    ~/.config/secrets/xmeye-dvr.env (registered as xmeye-dvr in
    ssot.secrets.yml). DVR cloud IDs/usernames kept — identifiers, not
    secrets; security register classes cloud IDs as public-ip exposure
    with credentials as the control.
  scope: >
    Known section only per card spec — no harvest/bulk credential search.
    ssot.security.devices.yml still names the VMS app deviation (its job
    is to record deviations); not edited.
  exposure: >
    Plaintext entered git history in commit 989b557d (2026-10-13) and is
    an ancestor of origin/master (github.com:tonezzz/chaba). Removing it
    from HEAD does not purge history; validity unverified per card brief
    (no device login/test authorized).
  rotation: >
    Escalated to owner via board request on the card — rotation needs
    owner approval + consumer/rollback plan (DVR creds feed VMS device
    tree and ada_camera_snapshot path). No rotation/login/service change
    performed by this dispatch.
  verified: >
    Post-edit grep of AGENTS.md finds no trace of the removed password
    pattern or hash prefix; git diff is AGENTS.md only (+2/-3).

files:
  - AGENTS.md                                   # XMEye section lines ~323-324
  - docs/ssot/infrastructure/ssot.secrets.yml   # xmeye-dvr registration (read-only ref)
  - docs/ssot/infrastructure/ssot.security.devices.yml  # xmeye-dvrs deviation (read-only ref)
