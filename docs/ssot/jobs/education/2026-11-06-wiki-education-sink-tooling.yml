title: Wiki education surface — phase 2a tooling (sink + migrate script)
subtitle: >
  WikiLessonSink, HTML→wikitext converter, do_lesson dual-write flag,
  and the lesson export/migrate tool for the Education: namespace.
  Built ahead of the namespace itself — no live wiki writes made.
icon: education
version: 1

card: wiki-member-knowledge-surface-migrate-wp-3a1cf2
date: 2026-11-06
dispatch: 20261106-181239-idea-2026-11-06-tony-chat-migr

summary: |
  Phase 2a of the wp/education -> wiki migration (plan doc:
  docs/ssot/jobs/education/2026-11-06-wiki-member-knowledge-surface.yml;
  Tony answered engine=mediawiki, visibility=inhouse-after-sso,
  scope=proceed 2026-11-06). All repo-side tooling now exists so the
  only remaining gate is Tony's LocalSettings edit registering
  Education:/Reports: + Lockdown rules (snippet already on the card),
  plus the แม่แบบ:Education template page on the wiki.

shipped:
  publication.py:
    - >-
      html_to_wikitext() — stdlib HTMLParser converter for lesson-body
      HTML (headings, p/br/hr, nested ul/ol, links, bold/italic,
      code/pre, blockquote; script/style dropped, unknown tags flatten).
      Shared by the live dual-write and the migrate tool.
    - >-
      lesson_wiki_title() — readable Education: title from a topic
      (ada-nest-map -> Education:Ada-Nest-Map; md5 slugs never leak).
    - >-
      WikiLessonSink(MediaWikiSink) — kinds=('lesson',),
      surface='private' (protected ns, staff-only at cutover),
      namespace_prefix='Education:' (env WIKI_EDUCATION_PREFIX),
      template แม่แบบ:Education (env WIKI_EDUCATION_TEMPLATE).
      meta.format='wikitext' passes the body verbatim; otherwise the
      body is treated as lesson HTML and converted. Title derives from
      meta.topic when meta.wiki_title is absent.
    - "MediaWikiSink.edit_label parameterizes the edit summary."
  board-api.py:
    - >-
      _pub_sinks registers 'wiki-education' when wiki-h3-gizmo.env creds
      are present — /publish op=sinks reports it; explicit
      sinks=['wiki-education'] works today (and queues to the outbox if
      the namespace doesn't exist yet).
    - >-
      _lesson_wiki_write() + do_lesson hook — dual-write behind
      WIKI_EDUCATION_WRITE=dual in wiki-h3-gizmo.env. SHIPS OFF. A wiki
      failure reports result['wiki']={status:failed,...} and never fails
      the WP write — the WP ledger stays canonical until cutover.
  wiki-lesson-migrate.py:
    - >-
      Reads via the door (/lesson op=topics + op=get — no WP creds on
      the runner), converts to wikitext, emits Education:<Topic> pages +
      generated Education:Index (level-grouped rollup) + series hubs
      (ada-nest-map becomes Education:Ada-Nest with an appended Series
      link list; SERIES map is extensible).
    - >-
      --apply POSTs each page to /publish sinks=['wiki-education'] —
      idempotent (deterministic idempotency key), failures land in the
      publication outbox.
  tests:
    - >-
      tests/board/test_publication.py: HtmlToWikitextTest (4),
      LessonWikiTitleTest, WikiLessonSinkTest (4 — publish/metadata,
      format passthrough, derived title, kind/visibility/prefix gates),
      BoardApiWiringTest (+2 — sink registration, dual-write flag).
      43 tests green; test_board_api_mutations 21 green.

verification:
  - "python3 -m unittest tests.board.test_publication -> OK 43"
  - "python3 -m unittest tests.board.test_board_api_mutations -> OK 21"
  - >-
    scripts/wiki-lesson-migrate.py --limit 4 (live door, read-only):
    fetched real lessons, produced Education:* titles + index, clean
    wikitext (Thai section preserved, <pre>/lists/bold mapped).

