cargo_table_setup_2026_11_25:
  card: wiki-education-cargo-table-setup (OPS-1322) + wiki-education-cargo-declare-verify (OPS-1350)
  status: done
  root_cause: >
    The 2026-11-24 attempt missed Cargo 3.x's two-step model: #cargo_declare
    only records CargoTableName/CargoFields page props on the template;
    the physical table is created separately by
    CargoUtils::recreateDBTablesForTemplate (API action=cargorecreatetables,
    sysop-only right recreatecargodata, or Special:CargoTables). No host
    shell was ever needed — FTP write access to the docroot (ada@h3,
    ~/.config/secrets/plesk-ssh.env) plus a token-gated PHP helper that
    bootstraps includes/WebStart.php can call the Cargo internals directly.
  steps:
    - "Re-applied revid-481 wikitext (cargo_store + cargo_declare in <noinclude>) to แม่แบบ:Education via board-api /wiki/page -> revid 525; pageprops confirmed CargoTableName=Education + CargoFields schema."
    - "FTP-uploaded cargo-setup-*.php helper to the docroot; op=create called CargoUtils::recreateDBTablesForTemplate(pageid 42) -> cargo_tables registry + cargo__Education table created."
    - "Gotcha: custom WebStart entrypoints skip MediaWiki's shutdown commit — LBFactory::commitPrimaryChanges() must be called explicitly or the cargo_tables registry insert rolls back (physical CREATE TABLE survives via MySQL DDL autocommit, leaving an orphan)."
    - "op=populate ran CargoPopulateTableJob for all 228 template links -> 229 rows (one page, Education:Ada-Ocb-Skills, legitimately stores 2 rows from 2 template invocations with different event_id/updated)."
    - "Helper deleted via FTP; URL returns 404."
  verify:
    - "python3 scripts/wiki-cargo-check.py -> ok:true, exit 0 (table Education present, topic ada-ocb-skills found, 229 rows)."
    - "action=cargotables -> {\"cargotables\":[\"Education\"]} from anonymous API."
    - "pytest tests/test_wiki_cargo_check.py -> 4 passed."
  followups:
    - "scripts/wiki-cargo-check.py fixed: cargoquery API rejects bare _pageName alias -> now uses _pageName=page and limit 500 (was 20, could miss the topic row)."
    - "New lesson publishes auto-populate rows via onPageSaveComplete; no further host action needed."
    - "Education:Cargo-Education dedicated declaration page left as pointer note (revid 484) — declare lives on the template, which is what cargorecreatetables consumes."

