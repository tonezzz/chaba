incident_board_api_wedge: |
  ~09:00-09:17Z the chaba-board-api process on idc03 stopped answering ALL
  requests (last 200 at 08:56:12Z; only 503 lock-saturated / 504 after).
  Stack dump (LOCK-HOLD-ALERT at 09:03:50Z) showed the MAIN thread deadlocked
  in Thread.start() -> _started.wait() inside socketserver.process_request —
  no new handler threads could spawn; listen backlog is only 6, so every
  endpoint (/health /cards /comment /lesson) timed out for ~20min while the
  process stayed 'active'. Contributing load: idc03 4 cores at load ~8
  (runner-agent, kanban-commit, 60s render loop, render-board.py itself
  hitting its 60s timeout). The _lock_watchdog dumps stacks but cannot
  recover a dead accept thread. Manual `systemctl --user restart
  chaba-board-api.service` restored service immediately (health 200; the
  pending ada-deploy-flow write then completed in 8.4s). Carded as
  KNB-1423 (board-api-accept-loop-wedge-auto-restart-7dd2f1): candidates =
  systemd WatchdogSec keepalive, self-exit on accept stall, bigger backlog.

notes_for_future_passes: |
  - op:get per slug rescans the whole Education: namespace (~227 pages) —
    under load it exceeded 140s. op:list content=1 is the only sane bulk
    read; for single-lesson verification prefer direct MediaWiki API queries
    (fast, bypasses board-api entirely).
  - When board-api is wedged, writes through it cannot land — check
    journalctl --user -u chaba-board-api.service for the last 200 timestamp
    before assuming a write failed vs is still queued.
  - The html.escape(wikitext) resubmit trick round-tripped byte-identical
    on all 7 bodies this pass (incl. <pre>/<code>/[[wikilinks]] and Thai
    sections) — method remains sound.
  - no_th semantics confirmed: passing no_th:true on Thai-bearing content
    skips re-translation WITHOUT setting meta.no_th (thai_free=False);
    on Thai-free non-exempt content it WOULD set meta.no_th — do not use it
    there (let the door auto-translate instead).
