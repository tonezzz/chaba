title: Wiki member-knowledge surface — education/reports structure on wiki.h3
subtitle: >
  Plan for migrating WP education (lesson CPT) onto the existing MediaWiki
  surface and structuring it alongside the News desk and report surfaces.
  Verified live 2026-11-06 — supersedes the card-brief engine analysis,
  which predates the deployed wiki.
icon: education
version: 1

card: wiki-member-knowledge-surface-migrate-wp-3a1cf2
date: 2026-11-06

