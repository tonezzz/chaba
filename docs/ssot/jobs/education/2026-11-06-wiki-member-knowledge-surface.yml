  wiki:
    host: https://wiki.h3.gizmo-thailand.com
    api: https://wiki.h3.gizmo-thailand.com/api.php
    mediawiki: "1.46.2"
    php: "8.3.36"
    db: "MariaDB 10.5.29"
    lang: th (en fallback)
    topology: >
      Same managed host (103.99.11.249) as boards.h3.gizmo-thailand.com and
      chaba.h3.gizmo-thailand.com — i.e. the Plesk host beside boards WP.
      boards.surf-thailand.com fronts it via Cloudflare. No new service
