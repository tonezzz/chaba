title: Wiki education surface — phase 2b (Reports sink + page door + WP read)
subtitle: >
  WikiReportSink for the Reports: namespace, the guarded /wiki/page
  support-page write door, the WP report-CPT door read, and the two
  scripts that use them. Built after verifying the Education:/Reports:
  namespaces are now registered on wiki.h3 — no live wiki writes made
  (door process still runs pre-2a code).
icon: education
version: 1

card: wiki-member-knowledge-surface-migrate-wp-3a1cf2
date: 2026-11-06
