summary: |
  Phase 2b of the wp/education -> wiki migration (plan doc:
  docs/ssot/jobs/education/2026-11-06-wiki-member-knowledge-surface.yml).
  Verified live this session: Education:+talk (3004/3005) and
  Reports:+talk (3006/3007) are REGISTERED on wiki.h3 — Tony's
  LocalSettings step landed, matching the ids in the card snippet.
  Templates แม่แบบ:Education/แม่แบบ:Report are still missing; Lockdown
  on the new namespaces is unverifiable on empty namespaces and needs
  the first-write probe. The running board-api on idc03 still serves
  the pre-2a build (9 sinks, no wiki-education) — a service restart is
  required after this branch merges before any migrate --apply.

shipped:
  publication.py:
    - >-
      report_wiki_title() — Reports:<Type>/<period> living-page title
      (usage-ledger + rolling-14d -> Reports:Usage-Ledger/rolling-14d);
      same forbidden-char sanitation as lesson_wiki_title.
    - >-
      WikiReportSink(MediaWikiSink) — kinds=('report',),
      surface='private', namespace_prefix='Reports:' (env
      WIKI_REPORT_PREFIX), template แม่แบบ:Report (env
      WIKI_REPORT_TEMPLATE). Explicit opt-in only: kind=report default
      routes stay report+board, so MDDB dossier notes never land on
      the wiki unless a caller names sinks=['wiki-reports'].
      meta.format='wikitext' passes the body verbatim.
  board-api.py:
    - >-
      _wiki_login() helper + do_wiki_page() at POST /wiki/page —
      guarded raw page write for support pages the kind-gated sinks
      can't reach. Allowlist: configured templates
      (WIKI_EDUCATION_TEMPLATE/WIKI_REPORT_TEMPLATE, Template: alias
      included) + anything under Education:/Reports:. Prefix titles
      additionally verify the namespace is registered via siteinfo —
      a premature call can't litter main space with 'Education:Foo'
      pages. Main space, News/, PrivateNews: refused (News review gate
      stays the only public path).
    - >-
      _wiki_namespaces() — siprop=namespaces table (canonical +
      localized names).
    - >-
      do_report mode=wp-list|wp-get — read side for the member-facing
      WP report CPT (report_type/period/source_key meta), closing the
      'no door read exists for the report CPT' gap from the 2a notes.
  scripts:
    - >-
      wiki-support-pages.py — declares แม่แบบ:Education +
      แม่แบบ:Report wikitext in-repo; --apply writes them via
      /wiki/page (idempotent; Template ns always exists, so this is
      runnable the moment the new door is live).
    - >-
      wiki-report-migrate.py — door read (/report wp-list/wp-get) ->
      Reports:<type>/<period> pages + generated Reports:Index ->
      /publish sinks=['wiki-reports']; idempotent, --dry-run default.
      Mirror of wiki-lesson-migrate.py.

