title: education-report — consolidated Education maintenance report
subtitle: one JSON+MD artifact joining policy audit, source drift, due
  reviews, no_th exemptions, human-review queue, and compliance trend;
  read-only by default, board/TG summary gated on verify pass
icon: education
version: 1

card: education-maintenance-consolidated-report
date: 2026-10-27

components:
  script: scripts/education-report.py
  reuses:
    - "scripts/lessons-audit.py: audit_one — R1..R5 policy flags,
      imported so flag strings/counts are byte-identical"
    - "scripts/lessons-drift.py: audit_content — repo-path source refs
      vs git last-commit; refactored to a pure content-level entry
      (audit_lesson kept as the fetch wrapper — standalone job
      unchanged)"
    - "scripts/lessons-due.py: review_bucket — learned|due|upcoming,
      extracted so the same bucket rule runs on door-fetched rows"
    - board-api /lesson op=list + op=get — the ONLY door calls made;
      callers hold no WP creds
    - scripts/lesson-thai-exceptions.yml — curated intentional-no_th
      map, UNION'd with meta.no_th (new door persistence, below)
    - scripts/board/board_notify.py — tg channel for the summary
  door_change: >-
    board-api do_lesson now persists meta.no_th when a write skips Thai
    AND lands Thai-free (and keeps a prior exemption across Thai-free
    re-files); op=list exposes no_th. Closes the documented
    lesson-polish gap — audits can now tell deliberate --no-th from a
    missing translation. Polish-preserve writes (no_th + existing Thai)
    do NOT mark a lesson exempt.

artifacts:
  dir: docs/reports/education-maintenance/
  files:
    - latest.json — full machine report (per-lesson rows, checks)
    - latest.md — concise human report (tables, all flagged rows
      with their flag strings = the explanation)
    - history.jsonl — one line per run, same-day dedup; feeds trend
    - <date>-education-maintenance.* — only with --dated
  sweep: >-
    job runs cwd=served checkout on idc03; kanban-commit's git add loop
    + SAFE_PULL_GENERATED_RE were extended to cover the dir, so daily
    artifacts commit via the single writer like other generated dirs.

report_sections:
  - totals (lessons/flagged/clean/get_failures)
  - policy.flag_counts (component-identical R1-R5 multiset)
  - policy.dimensions — 7-dim lesson-polish score (content, level,
    source, next_review, thai, hub_link, split_rule) + compliance
  - "drift — drifted / source_gone / no_repo_source counts +
    explainable rows (each carries its drift:… / source-gone:… flag
    strings)"
  - reviews — due/upcoming/learned + due_rows (Tony's queue)
  - no_th — exempt count/rows/via (meta|exceptions), stale slugs
  - human_review_pending — junk-delete candidates (deletion is
    human-gated), source-gone pointers, invalid levels, fetch failures,
    due reviews — each row carries reason strings
  - trend — compliance/flagged/drifted/due vs previous history entry +
    the 2026-10-24 polish anchor (0.9307->0.9916)
  - verify — deterministic checks + digest
  - refs — card, education-due page, member index, runbook, job

schedule:
  job: "ssot.jobs.yml id=chaba-education-report"
  host: "idc03, systemd, '*-*-* 07:50:00', Persistent, 15m timeout"
  cwd: >-
    %h/CascadeProjects/chaba-tony-dell (served checkout — the writer,
    so git-drift refs resolve against a current tree and the artifacts
    land where kanban-commit sweeps)
  exec: "education-report.py --post board,tg"
  condition_path: script must exist (unit skips until merge lands)
  relations: >-
    10 min after chaba-lessons-audit (07:40), which stays running —
    the consolidated report is additive observability, the standalone
    audit remains a component + control for count agreement.

safety:
  read_only: >-
    audit mode performs only /lesson op=list/op=get. The unit-test
    whitelist test asserts no upsert bodies and no op=delete/touch are
    ever sent. Lesson fixes remain a separate explicit /lesson upsert
    stage (lesson-add.py); deletion remains human-gated (door op=delete
    is devin/tony only and this tool never calls it).
  notify_gate: >-
    --post channels fire ONLY when verify.status==pass AND no holds.
    A failed/degraded report still writes artifacts (the evidence)
    but stays silent — board/TG never announce bad data as real.
  exit_codes:
    0: generated + verified + no holds (post attempted if --post)
    1: generated but verify failed or holds present (notify suppressed)
    2: /lesson op=list unreachable — nothing written

hold_conditions:
  - get_failures>0 — one or more op=get failed; content audit is
    degraded so rows for those slugs can't be trusted
  - exceptions file unreadable/missing — exemptions would silently
    drop and inflate the Thai fail count
  - "any verify check fails — internal inconsistency (torn fetch):
    total_matches_list, buckets_sum, due_rows_match, dimensions_sum,
    flag_counts_match, drift_counts_match, exempt_subset"

verifier:
  unit_tests: >-
    tests/test_education_report.py (12 tests — fixture-driven, no
    network). Counts equal component-function output on identical
    input, drift rows equal audit_content, buckets equal review_bucket,
    reproducibility (same input -> identical rows+digest), read-only op
    whitelist, hold gating, end-to-end artifact write + notify suppress.
  live_parity: >-
    cross-checked 2026-10-27: consolidated flag_counts == standalone
    lessons-audit.py output (92 lessons, 26 flagged, same multiset).
  determinism: >-
    EDU_REPORT_NOW + --date + --fixture make a run fully replayable;
    digest field compares underlying data across runs.

first_run:
  total: 92
  flagged: 26
  compliance: 0.9643
  flag_counts: {R1:overdue: 5, R2:thin: 2, R3:no-pointer: 12,
                R4:orphan: 2, R5:consider-thai: 12}
  drift: {drifted: 3, source_gone: 40, no_repo_source: 47}
  reviews: {due: 14, upcoming: 78, learned: 0}
  no_th_exempt: 10
  human_review_pending: 51
  notes: >-
    The dominant backlog is systematic, not per-lesson: ~28 source-gone
    rows point at docs/tools/*.md and docs/kb/*.md paths referenced by
    lessons but never committed to the repo (drift report
    2026-10-25 found the same root cause). The fix is a content/pointer
    pass via /lesson upsert (or committing the docs) — deliberately NOT
    done here; this card is observability only.

manual_ops:
  rerun: >-
    python3 scripts/education-report.py
    [--out-dir DIR] [--repo PATH] [--fixture FILE] [--date YYYY-MM-DD]
    [--dated] [--post board,tg] [--exceptions FILE] [--dump-fixture F]
  fixture: --dump-fixture captures live fetch; --fixture replays it
    offline (used by tests and for debugging a bad run).
  tg_channel: board_notify tg -> BOARD_NOTIFY_TG_SEND_URL
    (default http://127.0.0.1:8911/send, ada relay loopback) — only
    reachable on idc03; elsewhere it fails soft and the failure is
    recorded in report.notify.tg.
