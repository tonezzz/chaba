gap_verified_2026_11_07: >-
  Wiki lessons were NOT in MDDB — no lesson/wiki/education collection;
  /lesson wrote WP CPT + wiki page only, so agents could not retrieve
  what they filed. Retrieval had to exist BEFORE the split, else
  knowledge moves from bloated-but-findable to thin-and-invisible.

shipped:
  dual_write: >-
    board-api do_lesson: every write (wiki-primary, dual, wp paths) now
    also mirrors into MDDB collection chaba-lessons on the mddb-cms
    content plane via _lesson_mddb_write / lesson_mddb_doc — receipt in
    result["mddb"], failure degrades (mirror != store). op=delete
    propagates via _lesson_mddb_delete. scripts/board/board-api.py.
  read_door: >-
    /lesson {op:list|get, source:"mddb"} reads the mirror back through
    the same door contract; agents may also query MDDB
    /v1/{search,semantic_search} on chaba-lessons directly.
  backfill: >-
    scripts/board/lesson-mddb-backfill.py reads every lesson via
    /lesson {op:list|get, source:wiki} and upserts the identical doc
    shape (key=lesson-<md5(topic)>). Ran live: 132 wiki lessons +
    3 lessons filed by this split = 135 docs, 0 failed; /v1/search
    verified returning content.
  lint: >-
    scripts/ssot-prose-smell.py — flags string scalars >40 lines where
    sentence-like lines dominate (code/config-shaped blocks ignored);
    exit 1 on any hit; --warn/--lines/--all flags. Post-clean status:
    0 flagged.
  agnets_codified: >-
    AGENTS.md lesson-capture duty now names the retrieval surface
    (chaba-lessons + source:mddb reads + backfill script); split rule
    gained the >~40-lines quantified smell + lint pointer.

