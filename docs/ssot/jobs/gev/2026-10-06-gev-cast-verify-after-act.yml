report:
  status: done
  completed_at: "2026-10-06 11:00 +07"
  summary: >
    Verify-after-act for GEV casts is now executable and documented.
    gev-cast-verify.mjs exercises the full contract live: cast /apps/gev/
    to a connected vcast screen, require the relay's own state read
    (state=nav + p0:frame-ok) AND the gev-gemini remote registration
    ({screen,pane}) before passing, accept the nav-mode snapshot contract
    (uncapturable-iframe whose detail is the live iframe src), displace
    with camwall (both ground truths flip — this is what ada-pi turns
    into the displaced note + split/PiP suggestion), remediate with a
    real pip layout, restore to idle. Runbook
    docs/runbooks/vcast-gev-verify-after-act.md documents the
    displaced-content tool contract and the apps-v6 self-heal. One real
    finding: deployed /apps/vcast/sw.js is v2; repo has the v3 rework —
    the live checkout is behind master.
