decisions:
  - label: Close the gap inside chaba instead of stalling on the HELD repo
    rationale: >
      The card's own comms say "pull the work into chaba staging" is a
      valid unblock path. Everything needed lives here: the bridge source,
      the staged bundle (the deployed truth — SSOT already notes the
      working bundle is patched directly), and the Caddy mount. Repo-side
      changes commit here; reaching users still needs the gated deploy
      steps on tony-dell.
    alternatives_considered: >
      Write needs-input and stall (leaves the card dead until a remote
      exists); patch only the bridge (client still drops audio — gap not
      actually closed).
  - label: Playback via binary frames + BufferSource queue, not AudioWorklet
    rationale: >
      Symmetric with the existing uplink (binary PCM frames over the same
      socket) and far less minified-patch surface than an AudioWorklet
      (needs a separate module file + worklet plumbing inside a bundle we
      can only patch surgically). Scheduled back-to-back BufferSources give
      gapless playback for Live's chunked stream.
    alternatives_considered: >
      base64-in-JSON frames (33% overhead, churn on every chunk);
      AudioWorklet (heavier patch, more places to break on rebuild).
  - label: Behavioral check via extracted method bodies, not full-bundle eval
    rationale: >
      Executing the 1.3MB IIFE needs DOM/WebAudio/Cesium mocks — brittle.
      Brace-matched extraction of setMicrophoneEnabled/onaudioprocess runs
      the SHIPPED code (not a reimplementation) against a mock graph, and
      the mutation run proves the check would catch the actual regression.
    alternatives_considered: >
      static grep only (can't prove the invariant); headless browser
      (playlive) — heavier, and the invariant is PCM-level, not UI-level.

