title: GEV voice — mute-invariant regression check, iOS doc, playback gap closed
subtitle: >
  Dispatch of kanban card gev-voice (HELD — gods-eye-view repo not
  dispatchable, see gev-program-design). Worked the card inside chaba:
  regression-tested the GainNode mute invariant behaviorally against the
  staged bundle, codified the post-build patch set (incl. the new client
  playback patch) into an idempotent script, forwarded model_turn audio in
  the bridge, and documented the iOS mic constraint.
icon: target

