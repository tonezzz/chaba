  summary: >
    gev-voice unblocked inside chaba despite the HELD repo. The mute
    invariant now has a real regression check that runs the shipped method
    bodies through a mock graph — muted yields zero outbound frames, and a
    flag-stripped mutation proves the GainNode carries the invariant (the
