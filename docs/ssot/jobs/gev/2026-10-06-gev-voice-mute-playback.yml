    Cover card gev-voice without the (non-dispatchable) gods-eye-view repo:
    prove "muted => zero outbound PCM frames" against the bundle that
    actually ships, document the iOS standalone-PWA mic constraint, and
    close the playback gap end-to-end (bridge forward + client playback).
