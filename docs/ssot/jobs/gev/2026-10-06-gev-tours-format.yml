decisions:
  - label: Tour runner lives in chaba, drives the /command relay
    rationale: >
      The app repo is held (no pushable remote, not whitelisted), and
      nothing in the app needs to change — the relay already reaches every
      tool with response collection. A runner in chaba also means tours
      are dispatchable NOW and the same file drives any display.
    alternatives_considered: >
      in-app tour controller (blocked by the hold; adds a second playback
      engine); fly_route cinematic dollies (needs a drawn route
      annotation and gives no per-stop dwell/narration semantics).
  - label: Narration cue = annotate_map label + report text
    rationale: >
      annotate_map type=label draws the cue on the 3D map at the stop
      anchor; the full cue text is preserved on the checkpoint record so
      a scenario or a later TTS path can consume it.
    alternatives_considered: >
      injecting text turns into a Gemini voice session (couples tour
      playback to a live paid session and an audio path that is not what
      a remote display is for).

