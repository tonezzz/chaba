report:
  status: done
  completed_at: "2026-10-06 17:45 +07"
  summary: >
    Tours are defined, implemented, and live-verified without touching
    the held gods-eye-view repo: the gev-gemini /command relay +
    fly_to_location(waitForArrival) is the whole playback primitive.
    gev-tour.mjs plays tour JSON files (ordered waypoints in all three
    target forms, dwell_s, narration cues drawn as map labels and recorded
    on checkpoints) and writes a report whose reached_in_order/ok flags +
    per-checkpoint {seq, reached_at, verification} are exactly what a
    scenario asserts. Flagship world-landmarks played end-to-end on
    vcast-real-6: 7/7 in order, 70.5s. Stub-relay selftest: 24/24.
