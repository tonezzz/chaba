title: GEV tours — format + runner + flagship route via the /command relay
subtitle: >
  Dispatch of kanban card gev-tours (spec'd HELD — gods-eye-view repo not
  dispatchable). Key unlock: bridge.py already exposes
  POST /apps/gev-cmd/command pushing function_call frames to registered
  GEV remotes with tool_response collection, and fly_to_location honors
  waitForArrival — so the entire tour capability lives in chaba as a
  runner script and needs zero app-repo changes. Defined the tour JSON
  format (ordered waypoints locationId|query|lat/lon, dwell_s, narration
  cues -> annotate_map labels), implemented gev-tour.mjs, authored the
  world-landmarks flagship tour, and played it live on vcast-real-6:
  7/7 checkpoints reached in order, 70.5s.
icon: route

planning:
  goal: >
    Give GEV a defined, replayable tour/flyover capability: a tour file
    format, one flagship route executed end-to-end, and a checkpoint
    report a scenario (gev-scenarios) can verify for ordered playback.
  scope: >
    stacks/web/input-bridge (gev-tour.mjs runner, gev-tour-selftest.mjs,
    tours/*.json), docs/runbooks/gev-tours.md, SSOT registry entries.
    Explicitly NOT touched: ~/gods-eye-view (held — no pushable remote,
    not in dispatch-repos.conf; unnecessary anyway since /command drives
    the existing tool surface).
  success_criteria:
    - Tour format covers ordered waypoints (locationId | query | lat/lon),
      per-stop dwell, narration cues
    - Runner reports checkpoints reached in order (machine-readable)
    - One flagship route plays to completion on a real display
    - Contract verifiable without a display (stub-relay selftest)
  risks:
    - Bridge wait cap is 10s — longer flights need the view-state poll
      fallback (implemented — flying->settled flags + coord_match)
    - Narration is a visual cue (map label), not TTS — voice narration
      would need a Gemini turn on a voice client, out of scope
  resources:
    - gev-gemini cmd relay /apps/gev-cmd/command (tony-dell :8790)
    - vcast-real-6 lab display (relay screen 1) for the live run
  owner: devin (dispatch)
  estimated_duration: 1 session
  related_focus:
    - label: gev-tours
      file: docs/ssot/kanban/cards/gev-tours.yml
    - label: gev-scenarios
      file: docs/ssot/kanban/cards/gev-scenarios.yml

