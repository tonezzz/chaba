decisions:
  - label: In-place patching over the -v1 bundle fork
    rationale: >
      gev-map established patch-gev-dist.sh + in-place staged patches as
      the convention and index.html now also loads honest-fail.js. A -v1
      copy would fork the bundle (two patched variants to keep in sync)
      and the branch's index.html predated honest-fail. Patching
      index-Bd5DfCi5.js in place keeps ONE bundle, ONE index.html, and
      matches how the dist pipeline already works.
  - label: Voice patches delegated to gev-patch-dist.mjs inside patch-gev-dist.sh
    rationale: >
      The playback patches need regex capture of minifier-renamed
      identifiers — bash/sed can't express that safely. The node script
      is already the tested, idempotent implementation; the shell script
      stays the single entry point operators run after npm run build.
  - label: Port files, don't merge the branch
    rationale: >
      The branch carried unrelated AGENTS.md/ssot.dev-system churn and
      conflicted on index.html + bundle strategy. git checkout of the
      four new paths + a hand-applied bridge hunk + fresh docs edits
      produces a clean, reviewable diff on current master.

