      status: done
      notes: "systemd-run --collect unit runs cmd, records exit_code, detects needs-input (file or exit 42 + NEEDS-INPUT: line), emits chaba event (local script or ssh tony-dell-lan), iPhone push via HA REST, job/<id> MDDB doc. Verified: done + awaiting-user paths end-to-end from tony-omen incl. chaba-events.json entries."
