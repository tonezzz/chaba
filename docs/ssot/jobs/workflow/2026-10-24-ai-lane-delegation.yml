pilots: |
  Three real chores delegated per the procedure (results on the card):
  1. timer-alert-idc03-ada-memory-sync (multi-step remote diag) -
     free lane FAILED cleanly: stopped after ~3 calls; ALSO surfaced a
     host-mismatch (agent host != target host). Verdict led to the L4
     resolution: 9 real conflicts, --take-remote, unit green.
  2. stash-graveyard-triage (single-repo list+classify+report) -
     free lane COMPLETED: 7 stashes classified, all droppable.
  3. check-traffic-report-automation (repo-search + verdict artifact) -
     this session on idc02, opencode+flash-lite in-worktree:
     run 1 FAILED - searched correctly (grep traffic, glob, read the
     card) but never wrote verdict-pilot3.json; verifier gate caught it
     (artifact missing = fail, not false-done).
     run 2 with ARTIFACT-FIRST prompt contract (write the JSON skeleton
     before searching) PASSED: verdict correct (no report automation;
     truth: only traffic-cam snapshot svc exists), minor schema
     sloppiness (empty related_components). Prompt-contract refinement
     documented in the procedure.

sharpened_boundaries: |
  - Free lane carries single-step verifiable ops AND single-repo
    list+classify+report - with an inline verifier, always.
  - Free lane cannot carry multi-step remote diagnosis or code-with-test.
  - Artifact-first prompting (write skeleton -> search -> rewrite filled)
    rescues the early-stop failure mode; search-then-write loses it.
  - Some "failures" are correct alerts (exit-1-by-design) - diagnosis
    must distinguish bug from intended signal.
  - Escalation ladder: L0 -> L1 -> L2 -> L3 -> L4 -> Tony; two clean
    fails at a rung = escalate, never silently retry.

