decisions:
  sync_direction: >-
    Pull, not push — the standby host fetches over ssh (chaba-repo-sync /
    mddb-standby-pull precedent). The driver lives on the standby so an
    omen outage just means "nothing new to pull"; no push creds or timers
    needed on the flaky host.
  mirror_target: >-
    ~/.config/home-assistant on the standby — the canonical config path,
    so promotion needs no copy step. Script guards: refuses on the source
    host, while a tony-ha/ada-ha unit or container is active locally
    (split-brain), and into a non-empty unmarked dest without --force.
  db_policy: >-
    home-assistant_v2.db* excluded from periodic rsync (live sqlite);
    --db flag takes a consistent online snapshot via the SQLite backup API
    executed on the source over ssh. Opt-in because it can be GBs —
    recommended at install and at promote time.
  standby_host: >-
    mn01 recommended (verified on home LAN 192.168.2.0/24 2026-10-26 —
    promotion preserves LAN device control; already runs ada-standby-sync
    timers). idc02 documented as degraded no-LAN alternative (the host
    ssot.jobs.yml literally names for the remote pull). tony-dell possible
    but least preferred post-drain. FINAL CHOICE PENDING the
    tony-ha-prod-placement-26f033 decision — runbook is host-parameterized
    and says to retarget to the loser.
  image_pinning: >-
    Quadlet uses floating :stable but patches/* mounts are
    HA-version-pinned (frontend JS filenames like 52451.*) — promote pins
    Image= to the repo digest. The sync script captures ref+image-id+
    digest into last-sync.txt every run so a promote never depends on
    reaching omen for image identity; save|load is the documented
    fallback (proven on michael-dev/bserver/trade-api moves).
  scope_boundary: >-
    tony-ha only. ada-ha shares the omen failure domain and the identical
    pattern is noted but not duplicated; michael-ha (Nabu Casa) and kk-ha
    (idc03) are out of scope.

