title: Lane release pipeline — per-lane twin diff + scoped promote with --confirm gate
subtitle: frontend-parity-check.sh generalized into a lane/SSOT-driven twin
  diff; promote-lane.sh engine behind promote-<lane>.sh wrappers
icon: 🚦
id: 2026-10-10-lane-release-pipeline
status: done
owner: devin-dispatch
project: chaba
started: "2026-10-10"
card: ha-release-pipeline
program: ha-lanes

planning:
  goal: |
    Make releases boring: build on dev twin, verify with a twin parity diff,
    promote dev->prod with one scoped command per lane behind an explicit
    --confirm gate, with parity evidence before and after.
  decisions:
    - id: registry-in-ssot
      decided: "2026-10-10"
      choice: >
        Lane + instance endpoint/auth metadata lives in
        docs/ssot/infrastructure/ssot.home-assistant.lanes.yml and scripts
        read it via ha-lanes.sh (release-lifecycle "reads" pattern — config
        not code). tony-dev/ada-dev are registered with `planned: true` so
        the scripts resolve them and fail fast as "not provisioned" instead
        of guessing.
    - id: destage-on-promote
      decided: "2026-10-10"
      choice: >
        The actuation guard deliberately mutilates the twin's yaml; promote
        must reverse the mutilation, not copy it. ha-config-merge.py strips
        injected `initial_state: false` (prod enable lives in the entity
        registry), treats staging-stub script/scene items as absent (prod's
        real bodies survive), and merges per id/alias — dev wins, prod-only
        items keep.
    - id: users-opt-in-only
      decided: "2026-10-10"
      choice: >
        `users` scope replaces .storage/auth{,_provider.homeassistant}
        wholesale — prod sessions/tokens become dev's and a restart is
        required. Too dangerous for `all`; it must be named explicitly.
    - id: snapshot-diff-architecture
      decided: "2026-10-10"
      choice: >
        One remote tar+md5 collection per instance (2 ssh calls max) into a
        tmpdir, then a pure-python comparator (ha-twin-diff.py). File-level
        truth beats per-API queries and works identically for local and
        remote instances.

deliverables:
  - scripts/home-assistant/ha-lanes.sh          # registry + ssh/local access + auth resolution
  - scripts/home-assistant/ha-twin-diff.py      # parity engine, 6 scopes
  - scripts/home-assistant/frontend-parity-check.sh   # rewritten: lane arg / --from--to / legacy default
  - scripts/home-assistant/promote-lane.sh      # engine: scopes, --confirm, parity before/after, backups, --card comms
  - scripts/home-assistant/promote-views.py     # ws view merge dev->prod (+--create, --dry-run plan)
  - scripts/home-assistant/ha-config-merge.py   # destage yaml merge + semantic-eq check
  - scripts/home-assistant/ws-resource-url.py   # restored (was dropped by salvage commit 6c963fc0)
  - scripts/home-assistant/promote-{ada,tony,michael}.sh  # thin lane wrappers
  - docs/ssot/infrastructure/ssot.home-assistant.lanes.yml
  - howto runbook lane_release_pipeline; release-lifecycle gates/gaps updated

