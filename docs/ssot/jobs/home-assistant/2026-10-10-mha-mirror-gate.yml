  - docs/home-assistant/dev/dev-mocks.yaml  # canonical package source
  - stacks/tony-omen/michael-dev/packages/a_dev_mocks.yaml  # host snapshot
  - stacks/tony-dell/michael-dev/packages/a_dev_mocks.yaml  # host snapshot
  - scripts/home-assistant/mirror-sweep.py  # --yaml emitter now emits gated blocks
  - docs/ssot/infrastructure/ssot.home-assistant.entities.yml
  - docs/ssot/infrastructure/ssot.home-assistant.michael.dev.yml
  - AGENTS.md  # parity-entities note documents the gate

deploy_notes: |
  Not deployed by this dispatch (worktree-only). To apply on a replica host:
  rsync docs/home-assistant/dev/dev-mocks.yaml to
  ~/.config/michael-dev/packages/a_dev_mocks.yaml then reload core
  (ha_reload_core via HA-MCP, or restart michael-dev.service).
  Residual noise: one fetch per mirror at HA startup + once daily per
  mirror — ~57 lines/event instead of ~2k/day.
  stacks/idc03/michael-dev has no packages/ snapshot in the repo — the
  live file on idc03 was never tracked; deploy + track it like the
  tony-omen/tony-dell copies.

verification:
  - python3 yaml parse of all three package files (custom !secret loader)
  - mirror name/entity collisions vs template sensors: none
  - "post-deploy on idc03/tony-omen: watch journalctl --user -u michael-dev
    / docker logs for REST timeout and UndefinedError lines; expect ~0/h
    while michael-ha is unreachable and mirrors showing state
    'unavailable'."
