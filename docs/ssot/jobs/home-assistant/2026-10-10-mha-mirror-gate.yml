title: Gate mha_mirror_* sensors behind michael-ha reachability probe
subtitle: Off-LAN michael-dev replicas (idc03, tony-omen) spammed REST
  timeouts + UndefinedError because mha_mirror_* polled
  http://michael-ha:8123 unconditionally every 30s
icon: mirror
id: 2026-10-10-mha-mirror-gate
status: done
owner: devin-dispatch
project: chaba
started: "2026-10-10"
card: michael-dev-offlan-mirrors

planning:
  goal: |
    Card: idc03 (~1.5k/day) + tony-omen (~2.1k/day) severe log lines from
    michael-dev mha_mirror_* REST sensors + template mirrors that cannot
    reach http://michael-ha:8123 cleanly off-LAN. Tony answered request
    mirror-replica-policy: "gate-mirrors — keep replicas, gate mha_mirror_*
    sensors behind a reachability check (fail quiet, retry slow)."

decision:
  chosen: gate-mirrors
  mechanism: |
    - binary_sensor.michael_ha_reachable (command_line): `curl -sf -m 5
      http://michael-ha:8123/` every 300s, always exits 0 so probe failures
      are silent — this is the slow retry path.
    - Every mha_mirror_* rest resource: scan_interval 30 -> 86400 and
      timeout: 5. The scheduled poll is now a once-a-day fallback.
    - automation mha_mirror_refresh fires homeassistant.update_entity on
      all mirror sensor ids every 30s while the gate is on (parity with the
      old cadence when LAN is fine, e.g. tony-dell), plus one burst on
      gate->off so mirrors mark unavailable promptly.
    - value_template/availability on every mirror now guard
      `value_json is defined and value_json is mapping` — the UndefinedError
      spam came from rendering `value_json.state` on failed/empty fetches.
    - The 9 template switch wrappers get availability on the same gate so
      toggles are disabled (no rest_command.mha_call hang) when unreachable.
  rejected:
    - "drop-mirrors: would lose parity entity_ids on off-LAN dev dashboards."
    - "lan-only (confine replicas to LAN hosts): kills the idc03 replica that
      chaba CI now depends on for card dev."

