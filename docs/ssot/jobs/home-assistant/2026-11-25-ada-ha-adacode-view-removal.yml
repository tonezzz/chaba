summary: >
  The ada-ha chaba-admin 'Ada Code' view (path ada-code) iframed
  https://ada-code.surf-thailand.com/ — a public edge route retired
  2026-11-24 with the opencode public-route teardown, leaving a dead tab.
  Option (a) remove was chosen: (b) repoint to ada-ocb would duplicate the
  existing OpenChamber view; (c) repoint to the live opencode-serve
  surface is not viable — it is plain http on tailnet IP:port
  (idc02 100.123.163.11:4096, opencode-serve.service, verified serving the
  OpenCode web UI) with no auth edge, so a public https dashboard page
  would block it as mixed content; (d) leaves dead weight.

