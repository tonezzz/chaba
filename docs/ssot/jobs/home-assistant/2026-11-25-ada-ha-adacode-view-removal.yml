  what: >
    lovelace.chaba_admin on ada-ha (tony-omen:8125, url_path chaba-admin):
    views[path=ada-code] removed. View order now Pair → kanban → Kanban 2 →
    Diagram → OpenChamber → Cline → Node-RED → DevNest → Wiki → Private
    Wiki → Ada Pages → Monitor → Hosts → Services → Events → Log →
    Obsidian → Gantt (18 views).
  how: >
    scripts/home-assistant/push-dashboard.py --mutate
    scripts/home-assistant/mutate-ada-ha-remove-adacode-tab.py over the HA
    websocket on tony-omen (HASS_TOKEN from
    ~/.config/secrets/ada-ha-token.env, run via ssh). Mutator guards on
    exactly one ada-code view titled 'Ada Code'.
  verify: >
    ws readback after save: no path=ada-code view and no
    ada-code.surf-thailand.com string anywhere in the config.
  sync: >
    scripts/home-assistant/sync-ssot-from-live.sh --instance ada-ha —
    resanitized ada-ha-chaba-admin-current.json (view block removed,
