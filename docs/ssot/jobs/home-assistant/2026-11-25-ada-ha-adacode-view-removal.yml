consumer_canary:
  what: >
    scripts/audit/consumer-canary.py RETIRED_HOSTS default now also covers
    the public opencode edge hostnames retired 2026-11-24:
    ada-code/opencode-ada/opencode-jack.surf-thailand.com — so this class
    of consumer drift is caught standing instead of per-incident.
  detail: >
    IGNORE gained `\.retired[-\w.]*:` alongside the existing `.bak` rule —
    idc02 keeps *.container.retired-20261124 tombstones under
    ~/.config/containers/systemd/ that legitimately still name the retired
    PUBLIC_HOSTs; without the rule the canary would re-report them every
    6h. Verified locally: tombstone lines ignored, live unit-env hits and
    Caddyfile comments still classified correctly.
  deploy_note: >
    Takes effect on idc03's exec checkout after the dispatch branch merges
    and chaba-repo-sync pulls; no unit/env change needed (script default).

verification:
  - "ws readback post-save: 18 views, ada-code absent, zero retired-host refs in config"
  - "snapshot diff: single view block removed, redactions intact"
  - "canary regex unit-check: RETIRED list, tombstone ignore, live-hit detection all pass"

lessons:
  - "opencode-serve (:4096, tailnet http) cannot iframe into the public https ada-ha dashboard — mixed content; a tailnet-only agent UI needs a tailscale-serve https edge before it can be a dashboard tab."
  - "Retired quadlets leave *.retired-<date> tombstone files under ~/.config/containers/systemd/ that still name the old PUBLIC_HOST — greps for retired hostnames must ignore .retired-* like .bak or the canary self-reports forever."
