    mutate-ada-ha-kanban2-tab.py touches only the path==kanban view
    (title/url) and inserts one deepcopy'd kanban2 view; no code path
    removes other views. The 17 non-Kanban views were verified unchanged
    by the session's own readback.
  ada_control_should_stay_absent: >
    (a) Tony/Ada already answered keep-live on the card; (b) the same
    voice+activity card pair remains the canonical Ada surface on
    ada-ha chaba-home/ai and chaba-ai dashboards, so the admin copy was
    redundant; (c) no card or session ever requested its return; (d) the
    original Nov-4 design itself treated it as an iframe slot pointing at
    chaba-home/ai.
  snapshot_ssot_state: >
    docs/home-assistant/dashboards/ada-ha-chaba-admin-current.json already
    matched live before this run (last synced 9f8f17ad68); this run
    re-verified equality and updated the chaba_admin_ada note in
    ssot.home-assistant.dashboards.yml with the investigation result.
