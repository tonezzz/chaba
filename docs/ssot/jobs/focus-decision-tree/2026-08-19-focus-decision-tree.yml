title: Focus Decision Tree Simplification
subtitle: Phase 5 of the Context Improvement Plan — add confidence thresholds to mcp_focus next
icon: target

planning:
  goal: |
    Simplify the focus decision tree to 4 primary paths and make mcp_focus next return
    a confidence score and level.
  scope: |
    - Add confidence computation to mcp_debug/focus.py next() based on triage_score.
    - Return high/medium/low confidence and a 0-1 score in the next output.
  success_criteria:
    - mcp_focus mode=next returns confidence_score and confidence.
    - High confidence means triage_score >= 7, medium >= 4, else low.
    - mcp_debug/focus.py passes py_compile.
  risks:
    - Existing consumers expect string confidence; mitigate by keeping the string and adding score.
  resources:
    - scripts/mcp_debug/focus.py
    - scripts/focus_common.py
    - docs/ssot/infrastructure/ssot.focus.triage.yml
  owner: tony
  estimated_duration: 1 session
