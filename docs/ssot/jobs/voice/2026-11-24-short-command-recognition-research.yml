findings:
  - "Commands are the highest-frequency mechanical inputs; every lane pays a provider turn per command today (TG voice->Ada, HA Live tool-call) or has a narrow hardcoded set (devnest router). The missing layer is cheap intent recognition with honest escalation."
  - "Recommended shape: gated cascade T0 deterministic (phrase table + anchored operand-gated patterns) -> T1 similarity (accept/gray/reject zones + margin gate + operand gates + vetoes) -> T2 local small-LLM route+entity (command_lane/systemone, pending OPS-0605 circuit breaker) -> T3 provider pass-through."
  - "In-system anchors: devnest-tg-relay is a working production T0 (OPS-0911); tg_relay trivial_gate is the adjacent rung; ada-stt qwen3-asr feeds transcripts to the same text cascade; HA Gemini Live deferred (needs KWS on mic stream)."
  - "Wrong-fires are specification bugs, not similarity bugs: all four initial corpus wrong-fires were fixed by structure (operand gates, vetoes, Thai device-noun gate) — threshold tuning alone could not reach zero without killing recall."
  - "Thai has no word boundaries: char n-grams + no-\\b patterns; bare เปิด/ปิด is operand-ambiguous (ปิดเสียง=mute vs ปิดไฟ=device) — same class of bug as English 'status of <non-card>'."

prototype_results:
  corpus: "68 items — 34 hard commands, 7 soft (t2:) commands, 17 pass-through traps; EN+TH"
  wrong_fires: 0
