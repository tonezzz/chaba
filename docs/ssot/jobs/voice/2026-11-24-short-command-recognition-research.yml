  what_happened: >
    2026-10-27 dispatch finished ok, comms claimed all deliverables,
    merge-sweep auto-closed the card — but the worktree checkpoint
    committed only docs/INDEX.md. The 9 real files were left uncommitted
    ("worktree kept: dirty — 9 uncommitted file(s)") and lost. merge-sweep
    verified card evidence, not file existence — false-positive close.
  fix: >
    attempt 2 commits every artifact explicitly on the dispatch branch;
    eval layout matches OPS-0919's expected paths (eval/run_eval.py
