findings:
  - "Tool use is the blocker: 0 exact / 0 partial / 14 none on tool-bearing fixtures, versus 8 exact / 5 partial / 1 none on the baseline. The model says 'I'll turn those on for you' without calling hass_turn_on."
  - "A raw BidiGenerateContent dump confirmed no functionCall parts and no toolCall message in the response — the failure is in model behavior, not adapter parsing."
  - "LOW, MEDIUM and HIGH all failed to call tools on the smoke fixture, so this is not a thinking-budget setting issue."
  - "Speech recognition and session health are fine: 20/20 ok, WER 0.01, one clean barge-in, two clean soaks (4 min here, 8 min on 2026-11-24)."
  - "Total round-trip improved from 6198ms to 5397ms, but the reported 21ms mean ttfa is a VAD-anchoring artifact from the model's empty first modelTurn; do not treat it as a real latency win."
  - "The comparison crosses keys (paid baseline vs free-tier candidate); behavior is comparable, cost/latency under production quota is not measured here."

verdict: >
  DO NOT PROMOTE. Keep gemini-3.8-live as the sole rview-live and default Live
  model. Extended-thinking may be usable for tool-free conversational Live
  turns with an explicit thinking level, but it needs a tool-use fix or a
  different tool-calling configuration before it can serve HA commands.

