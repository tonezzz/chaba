title: Bench gemini-3.8-live-extended-thinking against the 3.8-live pin
id: 2026-11-26-gemini-38-live-extended-thinking-bench
date: 2026-11-26
runner: idc03
kind: bench-result
card: gemini-38-live-extended-thinking-bench-2026-11-26  # ADA-1446

summary: >
  Extended-thinking Live runs cleanly once a thinking level is declared, and
  keeps SLA-level latency and WER, but it emitted zero function calls on all
  14 tool-bearing fixtures. It is not a drop-in replacement for the promoted
  gemini-3.8-live voice pin. DO NOT PROMOTE.

setup_requirement:
  discovery: >
    First unmodified run closed every websocket with 1007 "Thinking level must
    be specified for this model." (20/20 error, ~60s per fixture).
  probe_matrix:
    - "setup.generationConfig.thinkingConfig.thinkingLevel = LOW -> PASS"
    - "same with HIGH or MEDIUM -> PASS"
    - "setup.generationConfig.thinkingLevel -> 1007 unknown field"
    - "setup.thinkingConfig -> 1007 unknown field"
    - "thinkingLevel OFF / NONE -> 1007 invalid value"
    - "setup.toolConfig.functionCallingConfig.mode=ANY -> 1007 unknown field"
  harness_change: >
    Only a /tmp copy of scripts/voice-bench was patched to add thinkingConfig
    to setup when GEMINI_THINKING_LEVEL is set. No upstream harness, pin, key,
    billing, gateway or service change.

method:
  key_used: GEMINI_API_KEY_MICHAEL  # free-tier; paid project is spend-capped
  key_printed: false
  model: gemini-3.8-live-extended-thinking
  thinking_level: LOW
  harness: patched /tmp/opencode/voice-bench-ext (setup-only change)
  fixtures: 20 (same manifest as the 2026-11-24 3.8-live promotion gate)
  fixture_timeout_s: 90
  results:
    - scripts/voice-bench/results/gemini-live-eval-3.8-live-extended-thinking-low-20261126.json
    - scripts/voice-bench/results/gemini-live-eval-probes-extended-thinking-20261126.json

