title: ada-stt CPU-contention matrix — quiet vs busy RTF on idc02 (+con01/idc03 production check)
id: 2026-11-07-stt-cpu-contention-matrix
card: idc02-ambient-cpu-stt-latency
date: 2026-11-07
runner: tony-macbook
kind: bench-result

summary: >
  Measured quiet-vs-busy RTF for qwen3-asr-0.6b-q8 (audio.cpp, threads=4)
  as the card requires before choosing. Two corrections to the card's
  premise: (1) production STT already migrated OFF idc02 to con01:8914
  on 2026-10-22 (OPS-0763) — idc02's ada-stt is now standby/eval only,
  no production consumer; (2) con01 is now heavily loaded itself
  (load ~9-11 on 8 shared vCPU) so "move to a quieter host" has no
  quiet host to move to. Verdict: option (a) CPU priority — Nice=-10
  restores RTF ~0.7-1.4 under TOTAL 4-core saturation; the rootless
  CPUWeight=1000 approximation restores ~0.8-1.1 against in-slice
  tenants (where open-jev/mddbd/containers live). Options (b)
  threads=3 and (d) move host are rejected by the data; (c) accept is
  unnecessary since the fix is one unit property.

topline_correction:
  prod_lane: >
    idc03 ada-tg-relay env verified: TG_WHISPER_URL=
    http://100.72.146.39:8914/v1/audio/transcriptions (con01,
    TG_WHISPER_MODEL=qwen3-asr). telegram-bot.env (kk/other relay)
    uses 127.0.0.1:8914 = idc03's own ada-stt fallback. idc02:8914 has
    had no production consumers since OPS-0763 (2026-10-22).
  con01_is_loaded: >
    con01 = Contabo VPS-8, 8 shared vCPU, load 9-11 observed
    (2026-11-07): 28 containers on idc02 + ~30 user units; con01 adds
    Cline pilot + devnest model-cache since the "RTF ~0.5" SSOT note.
    con01 ambient RTF measured 2.1-2.6 (first cold hit 10.2) — WORSE
    than the idc02 numbers the card complains about.

method: >
  Second audiocpp_server instance on 127.0.0.1:8916 (identical config,
  offline mode) — live :8914 untouched except where marked live8914.
  Load injected by 4x python CPU spinners via taskset. busy0 = spinners
  at nice 0 on all cores = fair-share saturation, harsher than real
  tenants (real ambient load ~1-7 gives RTF ~0.8-1.2). Rig:
  idc02:~/stt-contention-test/{run-matrix.sh,server-test.json,
  matrix-results.csv,matrix-run.log}.

results_rtf: # wall/duration; clips = real TG voice wavs
  ambient_idc02:            {load: "~1-3", rtf: "0.41-1.21", note: "quiet-ish window"}
  busy0_4spinners_allcores: {load: "~5-10", rtf: "3.4-9.9",  note: "TTT 17-178s for 3.3-19.3s clips"}
  live8914_busy0:           {load: "~8",   rtf: "4.3-5.6",   note: "prod-shaped hit on idc02 live unit"}
  busy0_nice_minus10:       {load: "~7.5", rtf: "0.69-1.39", note: "BEST — priority survives total saturation"}
  busy0_threads3:           {load: "~7",   rtf: "2.0-11.1",  note: "threads=3 is NOT a fix"}
  shield_taskset_2cores:    {load: "~7",   rtf: "0.82-1.28", note: "server pinned cores 2-3 + load on 0-1; needs host-wide AllowedCPUs"}
  cpuweight1000_same_slice: {load: "~6.6-7.6", rtf: "0.80-1.14", note: "stress via transient user service (like real tenants) — weight wins"}
  cpuweight1000_xslice:     {load: "~3-7",  rtf: "3.2-5.5",  note: "session-scope/system bursts bypass app.slice weighting"}
  ambient2_real_tenants:    {load: "~6",   rtf: "0.80-1.06", note: "real load gentler than synthetic"}
  con01_ambient_before:     {load: "~9-11", rtf: "2.1-2.6 (10.2 cold)", note: "prod, pre-fix"}
  con01_cpuweight1000:      {load: "~10-11", rtf: "1.29-1.7", note: "prod, post-fix — ~1.7x better"}

deployed_change:
  what: "CPUWeight=1000 on ada-stt.service via `systemctl --user set-property`"
  where: [idc02, con01, idc03]
  persistence: "persistent drop-in under ~/.config/systemd/user.control; revert: set-property CPUWeight= (empty) or CPUWeight=100"
  risk: "low — only matters under contention; gives STT decode bursts precedence over other user-slice work (the intended effect)"
  coverage_gap: >
    Weight arbitrates only WITHIN app.slice — does not protect vs
    system.slice bursts (journalctl ~95%) or session scopes. Full
    protection needs one root-level knob: either convert ada-stt to a
    system unit with Nice=-10 (validated RTF 0.7-1.4 under total
    saturation) or `systemctl set-property user-1000.slice
    CPUWeight=500` (lifts ALL of tony's workload vs system.slice —
    broader blast radius).

verdict:
  choose: "(a) CPU priority — not affinity, not threads, not a host move"
  apply: "CPUWeight=1000 applied on all 3 ada-stt units (rootless-safe); recommend also Nice=-10 via system unit or slice weight for system-burst coverage"
  reject_b: "threads=3 measured 2.0-11.1 RTF under saturation — leaves headroom for others, does not help STT latency"
  reject_c: "accept-as-batch unnecessary — fix is a one-line unit property"
  reject_d: "no quiet host exists: con01 (current prod) load ~10/8vcpu, idc03 ~3-4/4, idc02 ~1-7/4 — priority is needed on whichever host serves"
  residual: "con01 post-weight RTF ~1.3-1.7 — acceptable for TG voice note batch lane; revisit if TTT SLO tightens"

evidence:
  idc02: "~/stt-contention-test/matrix-results.csv + matrix-run.log (full per-clip rows), server-test.json, spin.py"
  con01: "measurements inline above (corpus Oct-16 subset)"
  card_spec_baseline: "docs/ssot/jobs/voice/2026-10-23-local-stt-lane-eval.yml"

verify:
  - "systemctl --user show ada-stt -p CPUWeight   # =1000 on idc02/con01/idc03"
  - "curl -s http://100.72.146.39:8914/health    # con01 prod"
  - "re-run: ssh idc02 'cd ~/stt-contention-test && ./run-matrix.sh'"
