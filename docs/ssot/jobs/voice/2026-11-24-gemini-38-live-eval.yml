title: Gemini 3.8 Live promotion gate (voice eval)
id: 2026-11-24-gemini-38-live-eval
date: 2026-11-24
runner: idc03
kind: bench-result

summary: >
  Compared gemini-3.8-live (candidate) against gemini-3.1-flash-live-preview
  (incumbent) on the paid Gemini key with all 20 voice-bench fixtures plus
  barge-in and session-soak probes. 20/20 ok on both. 3.8-live had lower
  first-audio latency (306ms vs 411ms), lower WER (0.01 vs 0.02), comparable
  tool-call accuracy (8 exact / 5 partial / 1 none vs 6 / 8 / 0), equivalent
  barge-in, and better session stability (9 turns / 507s clean vs a 1008
  policy close at 168s). Verdict: PASS WITH CONDITIONS.

harness_note: >
  The stock adapter stopped at the first turnComplete. gemini-3.8-live emits
  an early turnComplete with a toolCall, then a SECOND spoken turn after the
  client sends toolResponse. On the stock harness this truncated every
  tool-call answer (0/20 spoken confirmations, ttfa null). Both runs used a
  patched copy that skips at most one early turnComplete per tool response and
  anchors ttfa to end-of-speech. The fix is now upstreamed in
  scripts/voice-bench/adapters.py, so these numbers are reproducible. A
  2026-11-25 smoke run with the exact upstreamed adapter file reproduced
  20/20 ok, 20/20 audio confirmations and mean ttfa 343ms on gemini-3.8-live.

gate:
  first_token_latency:
    incumbent_ms: 411.1
    candidate_ms: 306.2
    verdict: pass
  total_round_trip:
    incumbent_ms: 5955.25
    candidate_ms: 6197.55
    verdict: pass-with-note
    note: ~4% slower overall despite faster first audio.
  transcript_accuracy:
    incumbent_wer: 0.02
    candidate_wer: 0.01
    verdict: pass
  tool_calls:
    incumbent: {exact: 6, partial: 8, none: 0, n/a: 6}
    candidate: {exact: 8, partial: 5, none: 1, n/a: 6}
    verdict: pass-with-note
    note: >
      One regression in the original run — th-qry-temp; 3.8-live apologised in
      Thai instead of calling hass_get_state. Not reproduced in the 2026-11-25
      upstreamed-harness smoke run, where it scored partial (tool call made).
      Partial matches remain casing/arg-shape issues.
  barge_in:
    incumbent: interrupted=1, new transcript correct
    candidate: interrupted=1, new transcript correct
    verdict: pass
  session_stability:
    incumbent: 3 turns / 168.5s then 1008 policy close
    candidate: 9 turns / 506.8s, 0 errors, 0 disconnects
    verdict: pass

findings:
  - >
    Two-phase turnComplete on tool calls is a client-visible protocol change.
    Runtime clients must not treat the first completion as the end when a
    toolCall is pending, or the spoken confirmation is dropped.
  - >
    Barge-in probe does not answer tool calls, so 3.1's second turn never
    completed; the interruption event and new transcript were still observed.
  - >
    Session soak used text turns only — a stability signal, not a full-duplex
    audio soak.
  - >
    PAID, TONY and KK keys share GCP project gen-lang-client-0854236591;
    quota and spend are pooled. Keep OpenRouter/Ollama as real failover.

