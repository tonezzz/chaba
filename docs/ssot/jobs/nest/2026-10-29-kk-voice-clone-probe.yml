planning:
  goal: >-
    Generate a private one-line KK voice-clone sample for the Sacred Father
    narrator, using the existing voice-ID clips only after local ASR/reference
    quality checks.
  scope: >-
    Use the three LINE M4A samples in the private project voice-reference folder.
    Transcribe locally with faster-whisper, select a clean 5-12 second reference,
    and synthesize one line with the previously benchmarked VYNCX v2/F5-TTS
    pipeline. Do not publish, mux into the teaser, or call a hosted TTS API.
  consent: >-
    Tony reports that KK explicitly authorized voice cloning for this private
    narration probe. This consent is separate from the PDF-image approval and
    does not authorize public release.
  success_criteria:
    - Each input hash matches the private voice-reference manifest.
    - At least one single-speaker Thai clip passes duration and ASR confidence gates.
    - VYNCX produces a decodable, non-silent 24kHz clone-smoke.wav.
    - Transcript, selected reference, model and output metrics are durably reported in private Drive.
    - Existing Edge-narrated teaser remains unchanged until human listen review.
  risks:
    - ASR transcript errors can miscondition the cloned voice; preserve candidate transcripts for review.
    - VYNCX was benchmarked on CUDA, not this specific KK sample; this is a smoke only.
    - Raw voice and transcript are sensitive; keep all inputs/outputs private and do not publish.
  resources:
    - managed Colab T4; requires fresh boot registration via console Cell 1
    - private source: ada-nest/projects/kk-video-c9f99fee6146/voice-reference/
    - existing Thai narration script: kk-video-c9f99fee6146-preview/teaser-preview.th.srt
  owner: tony
  estimated_duration: 1 session
  related_focus:
    - label: Sacred Father preview and source revision
      file: docs/ssot/kanban/cards/kk-video-c9f99fee6146.yml

