    verify_artifacts would false-pass if the run fails early."
  - "gsplat JIT builds collide if two processes load_extension at once
    (ninja dir race killed one build); serialize first-use."

gotchas:
  - pycolmap 4.x has no SceneManager — use incremental_mapping ->
    dict[int, Reconstruction]; poses via image.cam_from_world().matrix()
    (3x4 w2c), intrinsics via camera.calibration_matrix() + model_name
    params table for distortion.
  - gsplat export_splats takes raw params (log scales, logit opacities,
    wxyz quats, sh0 (N,1,3), shN (N,K,3)) and flattens shN channel-major
    = PLY f_rest order; log-space scales/logit opacity are the correct
    PLY convention.
  - gsplat viewmats = world-to-camera, OpenCV convention (x right,
    y down, z forward) — build look_at with r=normalize(cross(f,up)),
    d=cross(f,r), V[:3,:3]=stack(r,d,f), V[:3,3]=-R@eye.
