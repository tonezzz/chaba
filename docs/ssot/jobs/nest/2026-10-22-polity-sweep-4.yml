  - severed-shard persistence → excised state is a live liability; quarantine or destroy
  - dark diamond custodian shard → verified verifier-slices embedded in tools/hosts
  - replay-under-torsion forensics → counterfactual replay + cross-lane diff, not log-reading
  - same-kind auditor → attack-prior auditors + standing audit-the-auditor
  - leashed-mind counter-preparation → revocation outside the lane's observable reach
  - capacity ≠ sanity → per-scale-step alignment gate, not just capability bench
  - custodial capture vector → least-privilege comms/janitorial plumbing
  - electronic-bureaucrat origin → audit authority accretion in admin automation
  - committee legitimacy decay → gate legitimacy re-earned by visible evidence
  - redundant-crew mutiny → ceremonial roles rot; retained functions need real work
  - conquered payload → adversarial capability integrated only after proven dominance
  - subpersona obsolescence → constructs ship with designed fold-back
  - custodian subversion → no curiosity budget on quarantine lanes
  - combat amalgamation → never merge a live hostile diverged persona
  - diverged-mind archive → failed brains as forensic corpus
  - unreliable oracle → upstream models/vendors are Dragon-class, motivated not authoritative

