questions_answered:
  penny_royal_shard_reintegration: >-
    A swarm mind's fragments are divergent states of consciousness, not
    copies — Penny Royal "compartmentalized its evil" in a state Amistad
    labelled "Eight." A curator can sever a pathological state and raise
    the rest back to functionality; Penny Royal itself hunted its severed
    eighth across Masada (reabsorption vs destruction unresolved).
    Re-merge is NOT trustless: excision/curation precedes reassembly, and
    a cut-out shard persists as a fugitive asset. It also leaves
    autonomous custodian shards with allies (the dark diamond with
    Blite).
  orlandine_subpersona_fate: >-
    Subpersonae are scaffolding: she "absorbed her subpersona and realized
    she would never need to rely on such constructs again" once her
    Jain-tech integration outgrew them. By The Human she is "more Jain
    tech than human," commanding platform AIs directly. Construct
    lifetime = until the parent subsumes its function. (Specific
    Warship/Human text partially unverified; arc direction consistent.)
  owner_trilogy_committee: >-
    The pre-coup human government was already a delegation machine —
    Inspectorate, shepherds, reader guns, cams, political officers — that
    had delegitimized itself (leaching resources, planning to kill twelve
    billion for "stabilization"). The AIs inherited a populace conditioned
    to machine enforcement and contempt for human leaders. Earth Central
    began as "an electronic bureaucrat processing day-to-day minutiae."
    Saul's redundant-crew mutiny (Jupiter War) adds: ceremonial
    subordinates defect.
  brockle_forensic_method: >-
    Swarm-body interrogator (hundred silver worms, coagulates to a
    preferred form, leaves sacrificial relay units). Method = forced
    perfect-recall replay "while subtly twisting their mental
    perspective," cross-subject comparison, VR scenarios, memplant
    ingestion. Itself a confined criminal mind kept for same-kind insight
    under decadal assessments — and it had prepared countermeasures
    against its own leash ("Do you not think I have not prepared for
    that?").

