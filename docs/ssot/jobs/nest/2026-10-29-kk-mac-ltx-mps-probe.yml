title: KK-Mac LTX-Video MPS single-shot probe
subtitle: Stage and run one local MPS render before considering a full video lane
icon: video
card: kk-mac-video-render-lane-ltx-video-mps-p-267f14 (OPS-0967)
date: 2026-10-29

planning:
  goal: >-
    Deliver a verified Mac-specific Nest pack and run one bounded LTX-Video
    MPS probe using the existing local cache and approved shot01 embeddings.
  scope: >-
    Render only shot01 at 640x384, 73 frames, 40 steps, 24 fps using the
    pinned cached Lightricks/LTX-Video revision
    8984fa25007f376c1a299016d0957a37a2f797bb and the precomputed shot01
    embeddings. Store the MP4 and technical report in the isolated
    gdrive:ada-nest-kk-mac-video-pilot root. Do not run the full preview,
    parallel model lanes, voice, MLX, or multi-scene render in this job.
  success_criteria:
    - The pack preflight verifies MPS, pinned model components, and shot01 input hash.
    - One shot renders and decodes as a valid 640x384 MP4.
    - Report records model revision, settings, load/generation time, MPS memory, and hashes.
    - Drive artifacts pass remote verification and the one-shot worker writes done.
  risks:
    - >-
      The full HF snapshot cache contains incomplete unrelated blobs; preserve
      them and load only the required cached model components offline.
    - >-
      Background Adobe/OneDrive/Spotlight activity may contend for unified
      memory; stop after the one probe and keep quality review separate from
      technical decode success.
    - >-
      KK-Mac is a member device; stop at the single probe and avoid any
      concurrent owner or video workload.
  resources:
    - KK-Mac M4 Max; worker reported 38.7 GiB RAM and 84.9 GB free disk; AC power
    - Existing local HF cache for Lightricks/LTX-Video revision 8984fa25007f376c1a299016d0957a37a2f797bb
    - Private shot01 embedding staged from kk-video-c9f99fee6146-embeds
  owner: tony
  estimated_duration: 1 probe
  related_focus:
    - label: OPS-0967 KK-Mac video render lane
