  decisions:
    - label: Probe Lane A MPS first
      rationale: >-
        The request is to send the existing LTX render package to KK-Mac; one
        serial MPS shot is the smallest useful validation before any wider run.
      alternatives_considered: >-
        Lane B MLX is deferred until the MPS result is available; the existing
        chain.sh would launch both lanes and is intentionally not used.
  changes:
    - file: scripts/colab/packs/kk-mac-ltx-mps-probe-20261029/pack.yml
