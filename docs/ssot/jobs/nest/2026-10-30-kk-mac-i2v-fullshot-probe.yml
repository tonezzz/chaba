    - AC power, memory-pressure, no-resident-model, and owner-app preflight passes immediately before execution.
    - Audited page-9 image and shot01 embedding hashes match the completed short probe.
    - One 640x384, 73-frame H.264 shot fully decodes and passes near-total-black QC.
    - Output, report, and hashes read back from the isolated private Mac pilot root.
  risks:
    - Full 73x40 I2V may use more unified memory than the short probe; stop on OOM or pressure changes.
    - Keep the worker serial and do not unload/interrupt KK's Ollama or owner applications.
    - Technical validity does not establish creative quality or authorize public release.
  resources:
