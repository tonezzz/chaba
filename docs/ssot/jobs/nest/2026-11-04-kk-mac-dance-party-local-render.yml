      url: gdrive:ada-nest/projects/kk-video-c9f99fee6146/renders/kk-dance-party-local-20261104-v1
    - title: ADA-1062
      file: docs/ssot/kanban/cards/ada-kk-dance-party-video-longer.yml
    - title: KK-Mac renderer procedure
      file: docs/kb/colab-mcp-jobs.md
    - title: Education lesson
      url: lesson-b6a057d429d5
  kb_review:
    - >-
      A unified job lifecycle can support different video renderers through
      adapter-native manifests while keeping privacy, admission, verification,
      review, audio, and spend gates consistent.
  lessons_learned:
    - >-
      Choose a conditioning frame that shows the intended action; blindly using
      the final source frame can continue a walk-off rather than a dance.
    - >-
      Monitor unified-memory recovery during model load as well as preflight;
      one short low-memory sample may recover after inference completes.

