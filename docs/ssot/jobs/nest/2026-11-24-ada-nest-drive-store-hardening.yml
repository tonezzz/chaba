  - '  the Drive copy is queue/runner.py — stage via the documented'
  - '  fleet-side rclone flow (docs/kb/colab-mcp-jobs.md §standard launch'
  - '  sequence) and purge queue/__pycache__ after bumping JOBS.py.'
  - 'nest-worker.py + nest-pack-submit.py deploy via each host''s'
