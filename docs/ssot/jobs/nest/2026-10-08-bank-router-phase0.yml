    Deploy = push + deploy-ada.sh on idc03 — needs approval; see
    blocked_on.
  - bench: tests/bench/domains.yml `bankq` domain (23 banks + sessions +
    skip criteria); suites.yml `bank-router` suite — golden 14 /
    hard 25 / adversarial 14; labels verified inside criteria;
    suite loads+runs via `orch-bench.py --suite bank-router`
    (stub student 0/4 as expected — no specialist yet).
  - corpus: tests/bench/bankq-corpus-20261008.jsonl — 1366 mined prod
    rows (query, utterance(687), bank_arg, hit_banks, top_bank,
    latency_s) — the free labeled training feed. Caveat: free labels
    are 'which bank produced the top hit', not intent — noise visible
    (e.g. 'what is two plus two' -> devin); hard-set rows were
    label-corrected by hand.
  - chaba worktree: scripts/ada/bank-router-probe.py (replay probe),
    scripts/ada/bank-router-mine.py (journal miner, utterance join via
    'INFO tools:' context lines + transcripts).

open_items: |
  - ~7 banks returned ~20ms with real hits on cold parallel fan-outs —
    suspected per-(collection,query) result cache or a fast path in the
    deployed 2.15.4-lsn build (image built on idc03; this checkout
    shows none). Worth one look in the deployed build when convenient.
  - Zero-hit != skippable is NOT auto-labeled — mined skip labels need
    the utterance audit; current skip cases are hand-labeled.
  - bank='all' quality issue surfaced by mining: non-memory turns still
    return scored hits (garbage-in) — the router's 'skip' also improves
    answer quality, not just latency.

