title: Storyboard panel-to-cut and action-continuity procedure
subtitle: Define a repeatable, hash-bound workflow for panel-level video cuts
icon: workflow
card: kk-mac-video-render-lane-ltx-video-mps-p-267f14
date: 2026-10-31

planning:
  goal: >-
    Define and apply a reusable procedure for extracting numbered storyboard
    panels as separate cut guides and keeping generated character action in
    storyboard order.
  scope: >-
    Document the source, crop, action-ledger, generation, QC, timing, and
    privacy gates. Prepare private cut-level references for the currently
    approved S01-S03 pages. Tony selected the ten-minute master on OPS-0967;
    stage one hash-bound render pack per panel and run only after fresh Mac
    admission passes. Do not publish private project material.
  success_criteria:
    - A reusable storyboard panel-to-cut procedure exists and is indexed.
    - Every numbered panel in the three approved pages has a traceable full-panel and visual-only crop.
    - The private Education lesson shows the procedure and all three cut-sequence contact sheets.
    - Record the target runtime and proportional per-panel durations before prompt lock.
    - Stage the 30 private per-panel packs with serial dependencies and stop-on-failure.
    - A first visible-action/camera plan passes creative review before continuing the panel chain.
  risks:
    - Incorrect crop boundaries or reading order could change the intended action; mitigate with contact-sheet and human review.
    - Source panel durations differ; scale each page to the selected master target without flattening per-panel timing.
    - Private family reference material must not leak to public documentation or generated-media surfaces.
  resources:
    - docs/kb/storyboard-panel-to-cut-procedure.md
    - "Private project crop bundle: gdrive:ada-nest/projects/kk-video-c9f99fee6146/presentations/panel-crops-v2-2026-10-31/"
    - "Education lesson: lesson-f16f13e54382 (post 3107)"
    - "Private V10 presentation: gdrive:ada-nest/projects/kk-video-c9f99fee6146/presentations/sacred-father-storyboard-complete-2026-10-31-v10.html"
  owner: tony
  estimated_duration: 1 session
  related_focus:
    - label: OPS-0967 KK-Mac video render lane
      file: docs/ssot/kanban/cards/kk-mac-video-render-lane-ltx-video-mps-p-267f14.yml

processing:
  status: completed
  started_at: "2026-10-31"
  steps:
    - id: 1
      label: Check for an existing storyboard panel procedure
      status: completed
      notes: >-
        Existing member-device/Mac procedure covered admission and pack safety,
        but not panel segmentation or character-action continuity. No
        panel-to-cut procedure was found in MDDB or SSOT.
    - id: 2
      label: Extract and inventory the approved storyboard panels
      status: completed
      notes: >-
        Prepared 30 numbered crops across pages 9, 12, and 15: a full-cell
        audit crop and visual-only guide crop per panel, plus contact sheets
        and a hash-bound map. The pages are single embedded collage images,
        each with ten numbered panels.
    - id: 3
      label: Define the reusable cut and continuity procedure
      status: completed
      notes: >-
        Added source pinning, panel ordering, crop provenance, per-cut action
        ledger, character/prop continuity, serial rendering, stop-on-failure,
        per-cut QC, timing, and privacy rules to the KB and SSOT index.
    - id: 4
      label: Update Education and record the timing decision
      status: completed
      notes: >-
        Education post 3107 now has 37 inline images, including all ten S01
        visual crops with source/target timing, action guidance, and render
        status, alongside the V10 presentation pointer, procedure, contact
        sheets, caption sheets, and 30-cut action/timing ledger. Tony answered
        `ten-minute-master` on
        OPS-0967; no S01-S03 panel render was started.
    - id: 5
      label: Stage serial per-panel KK-Mac render packs
      status: completed
      notes: >-
        Staged one shared CPU T5 embedding pack and 30 per-cut I2V packs
        (S01-C01 through S03-C10) into the isolated KK-Mac root. All 69 crop
        bundle files and 60 generated cut-pack files passed rclone checks.
        An isolated smoke run completed T5 embeddings and rendered C01 v2.
        Its technical QC passed but KK/Tony rejected the creative output:
        page-like zoom-out, off-panel people, and almost no character action.
        C02 v2 stopped at prep at 25% free memory; no C02 inference occurred.
        Later Mac inspection found Adobe Illustrator active during the C01
        test; the old preflight missed it, so that run was not a valid idle-lane
        test. The v2 panel chain is held.
    - id: 6
      label: Replace app-presence and input-idle blocks with resource checks
      status: completed
      notes: >-
        Revised the probe so HID keyboard/mouse input is informational, not a
        veto. Open design apps are judged by a 10s process CPU sample (<=1 CPU
        second/app tree) and total CPU <=65%; the pack separately requires
        >=80% free memory. Known render/export processes, uncertain readings,
        resident Ollama, and competing Nest workers remain hard blocks.
    - id: 7
      label: Run activity-gated C01 retry
      status: blocked
      notes: >-
        The first system-Python worker could not parse YAML because PyYAML was
        absent; rerunning through the kk-video venv fixed that. The v3 embed
        attempt then failed safely because its worker-count awk matched itself.
        V4 prompt embeddings completed in 26s, but the v4 render pack failed
        prep when a separate kk-llm Nest worker started. No C01 v3/v4 video or
        inference was produced. The awk pattern and full-command activity scan
        are fixed. A new v5 render-only pack reusing v4 embeddings is now staged
        and hash-verified. The v5 pack now treats input as advisory; the Mac is
        currently offline, so no render has started.
  decisions:
    - label: A panel is an action beat and visual guide, not a page to animate
      rationale: >-
        The full page collage obscures action order, and the C01 v2 render
        expanded into a page-like zoom instead of animating the visible actors.
        A panel may guide one cut or an ordered subshot sequence.
      alternatives_considered: One generic camera move over a still panel.
    - label: Prompt visible action separately from caption context
      rationale: >-
        C01's caption context mentioned the mother preparing alms, while the
        clean crop showed only father and daughter sharing food. The broad
        prompt introduced off-panel people and did not direct actor movement.
      alternatives_considered: Using the full narrative caption as the motion prompt.
    - label: Creative failure stops the sequence even when technical QC passes
      rationale: >-
        C01 v2 decoded correctly but did not satisfy the action/continuity goal.
        A technical pass cannot authorize the next cut or imply a useful result.
      alternatives_considered: Continuing the chain based only on codec/decode QC.
    - label: Keep technical QC separate from human review
      rationale: A valid decode does not prove that character action follows the storyboard.
      alternatives_considered: Marking a scene approved from codec and decode checks alone.
    - label: Normalize each page to 60 seconds for the ten-minute master
      rationale: >-
        The printed source totals are 120s, 180s, and 200s for the first three
        pages. Proportional timing preserves panel pacing while making each
        page approximately one minute.
      alternatives_considered: Uniform panel durations or preserving all source timings.
  changes:
    - file: docs/kb/storyboard-panel-to-cut-procedure.md
      summary: Added the reusable panel extraction, cut continuity, QC, and timing procedure.
    - file: docs/ssot/ssot.procedures.yml
      summary: Indexed the storyboard panel-to-cut standard.
    - file: "Private Drive panel crop bundle v2"
      summary: Added corrected 30 full/visual crops, source/target timing, action summaries, contact sheets, and caption sheets.
    - file: scripts/colab/panel-runners/mac-owner-app-activity.py
      summary: Added a read-only HID-idle and owner-app CPU activity probe.
    - file: scripts/colab/panel-runners/mac-owner-resource-gate.py
      summary: Replaced input-idle veto with measured app/system CPU and render-process checks.
    - file: tests/colab/test_mac_owner_app_activity.py
      summary: Added tests for activity thresholds, hard render-process blocks, and the KK LTX batch.
    - file: tests/colab/test_mac_owner_resource_gate.py
      summary: Added tests that recent input does not block low resource use.

