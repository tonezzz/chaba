# ------------------------------------------------------------------
# 2. Schema map — source fields -> suite row fields
# ------------------------------------------------------------------
schema_map:
  text:   card title+brief (or task prompt.txt head) — trim to request phrase
  kind:   constant 'triage'
  label:  >-
    NO direct source field — must be derived or assigned:
    (a) rules on action.*+text, (b) arbiter model, (c) hand
  set:    'triage'
  slice:  assigned at append time (clear-* / boundary / harvest-<date>)
  executor_surface_alternative: >-
    If the specialist should predict LANE (which executor suffices)
    instead of work-type, the suite's Choice criteria must change to
    lane names — then the action.lane x attempts x verdict join
    (82 card + 249 task-dir rows) is the natural label source and
    options (a)/(b) shift underneath it. The registered suite tests
    work-type; this is a spec decision, not a data problem.

# ------------------------------------------------------------------
# 3. Gap list
# ------------------------------------------------------------------
gaps:
  - cascade-outcomes log is EMPTY — the designed P5 flywheel was never
    built; instrumenting dispatch to append outcome rows is the real
    upstream fix (writer change, not labeling).
  - golden + adversarial tiers are spec-empty; golden is hand-labeled by
    definition — no cheap strategy fills it alone.
  - "'clarify' class has almost no positive corpus: ambiguous asks die in
    chat/focus-inbox before becoming cards. Needs construction
    (focus-inbox mining + arbiter, or Tony-written cases)."
  - classifier-pick x outcome join exists for only 82/675 dispatch cards
    (lane stamping is post-2026-10-25, JEV_LANE-gated).
  - attempts>0 is a confounded negative signal (test gates, crashes,
    zombie claims); only 34/66 carry last_failure reason text.
  - opencode verdict rows are verifier-real but pilot-skewed (3 cards =
    72% of 249) and single-host; other runners' dirs uncounted here.
  - verified = merge-gate verdict, not "the routing was right" —
    free_lane's 10 verified=False+done rows show the skew.

# ------------------------------------------------------------------
# 4. Labeling strategies — honest costs
# ------------------------------------------------------------------
labeling_strategies:

  a_weak_supervision:
    mechanism: >-
      Script derives labels from action.type/repo/paths + LANE_KW-style
      text rules; verified/attempts as outcome signal. One pass, no
      model calls.
    cost: '~1-2h agent scripting, $0 tokens, no human time'
    yield: >-
      ~600 noisy work-type labels (multi-tag overlap measured: code/
      ops/docs/research each hit 30-50% of cards); clarify coverage ~0;
      ≤330 executor-lane labels on the OTHER taxonomy.
    noise: 'est. 15-30% label error on boundary cases; systematic on
            clarify (absent) and ops-vs-code (overlap)'
    verdict: cheapest, labels the wrong surface at scale for this suite —
             right surface only if the suite flips to lane-prediction

  b_arbiter_adjudication:
    recommendation: '★ RECOMMENDED'
    mechanism: >-
      L2/L3 model (litellm/gemini-3.5-flash-lite free quota; paid_frontier
      gemini-2.5-flash as fallback) labels each card's request text into
      {code,docs,ops,research,clarify} + confidence; low-confidence rows
      queue for human. Exactly the arbiter-label pass the
      ssot.nest-training open_question proposes for diverged rows.
    cost: >-
      ~700-1400 Choice calls ≈ $0 on free-lane quota (<$0.15 paid worst
      case at ~300 tok/call); ~2-3h agent to wire arbiter prompt +
      emit orch-triage-cases.jsonl + sample the spot-check queue;
      Tony spot-check ~100 rows x ~20-30s ≈ 30-50 min.
    yield: >-
      Full-corpus coverage INCLUDING clarify (arbiter can flag ambiguous
      asks rules can't see); the mandatory human spot-check IS the
      ~100-row hand-labeled sample, which doubles as the golden seed.
    noise: 'est. ~85-92% agreement with human on clear slices; boundary
            cases route to human by design — noise is surfaced, not buried'
    verdict: >-
      answers the standing "who labels the diverged queue" question for
      ALL nest specialists, not just triage; reusable pass; spot-check
      supplies the golden tier that (a) cannot produce.

  c_hand_labeled_sample:
    mechanism: 'Tony/agent hand-labels ~100 rows for the golden tier.'
    cost: '~45-90 min human time (~20-30s/row); zero tokens'
    yield: 'golden-quality labels by definition; golden seed only —
            does not fill the hard tier bulk'
    verdict: >-
      required for golden REGARDLESS of the choice (suites.yml defines
      golden as hand-labeled + card-reviewed); inside (b) it is the
      spot-check step, so (b) subsumes it.

decision: >-
  ★ (b) arbiter adjudication — with (c) folded in as its human
  spot-check (~100 rows covers the golden seed). (a) alone produces
  volume on the wrong taxonomy and nothing for clarify; (c) alone
  leaves the hard tier empty. Posted as a board request on
  dispatch-triage-corpus-inventory for Tony to confirm.

followups_if_approved:
  - instrument dispatch (kanban-dispatch + runner-agent) to append
