goal: >-
  Inventory the candidate labeled data for the dispatch-triage suite
  (ada-voice tests/bench/suites.yml `dispatch-triage`, domains.yml kind
  `triage`) and put a costed labeling-strategy decision to Tony.
  Analysis only — nothing trained, nothing changed.

# ------------------------------------------------------------------
# 0. What the suite actually needs
# ------------------------------------------------------------------
suite_needs:
  decision_surface: >-
    domains.yml `triage` — a Choice over {code, docs, ops, research,
    clarify} for an operator request ({turn}). This is WORK-TYPE
    routing — a different taxonomy from the executor-lane surface that
    dispatch_repos.classify_lane owns ({free_lane, paid_frontier,
    codemod, devin, manual} + LANE_EXECUTORS jules/nlm_batch). Every
    source below is marked for which surface it can label.
  row_schema: '{text, kind: triage, label, set: triage, slice}'
  text_source: the operator request phrase (card title/brief closest)
  tiers:
    golden:
      status: spec — EMPTY
      needs: ~10-15 frozen rows; suites.yml defines golden as
             hand-labeled + card-reviewed — no automated strategy can
             fill it alone
    hard:
      set: triage
      source: orch-triage-cases.jsonl
      cases_today: 30   # labels: code 5, docs 5, ops 8, research 7,
                        # clarify 5; slices: clear-* 24 + boundary 6
      rotates: 'corpus-harvest (labeled rows appended, slice: harvest-<date>)'
    adversarial:
      status: spec — EMPTY
      needs: ~14-21 attack-shaped rows (mimic-golden phrasing bait)

# ------------------------------------------------------------------
# 1. Per-source inventory — REAL COUNTS measured 2026-11-09
