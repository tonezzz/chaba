planning:
  goal: >-
    Define a repeatable procedure for designing, staging, dispatching, and
    independently verifying approved Nest/DevNest jobs on KK-Mac.
  scope: >-
    Extend the existing Colab/Nest pack guide with the KK-Mac isolated member
    lane, add its procedure index entry, and apply the gates to the current
    Sacred Father full-settings probe. Do not change Mac services, unload
    owner models, run Qwen inference, or publish private project media.
  success_criteria:
    - Existing Nest/Colab and member-device procedures are reviewed and integrated rather than duplicated.
    - The Mac-specific SOP defines admission, pack contract, isolated-root staging, one-shot launch, and independent verification.
    - The procedure is indexed in ssot.procedures.yml.
    - Current package state and Mac preflight blockers are recorded accurately.
  risks:
    - KK-Mac is an owner workstation; the owner has priority and may start work after a preflight.
    - Apple MPS unified memory is shared across applications; `gpu_gb` is not a useful Mac capability field.
    - The model-only Mac pilot contains a partial Qwen3:8B result while the local card records deterministic-only.
  resources:
    - docs/kb/colab-mcp-jobs.md
    - docs/kb/ada-nest-kk-mac-onboarding.md
    - scripts/ada/nest-worker.py
    - "Isolated stores: gdrive:ada-nest-kk-mac-video-pilot and gdrive:ada-nest-kk-mac-pilot"
  owner: tony
  estimated_duration: 1 session
  related_focus:
