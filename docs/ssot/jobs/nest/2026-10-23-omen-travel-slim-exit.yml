# ---------------------------------------------------------------------------
# Result: omen's gemma JEV scorers now run continuously instead of only during
# the Monday 04:30 orch-bench window. The travel-slim mechanism (disabled units
# + bench ExecStartPre/ExecStartPost lifecycle + hourly reaper leash) is
# dismantled — the card's "exit travel-slim posture ... both active" is now
# durable across reboots and bench runs.
# ---------------------------------------------------------------------------

context: >-
  Travel-slim existed because omen was Tony's go-anywhere desktop — gemma
  scorers stayed dormant and the weekly orch-bench started/stopped them on
  demand, with open-jev-leash.timer reaping leftovers >2.5h. Tony made
  tony-macbook his main desktop 2026-10-12 and dedicated omen to the Nest
  lane; the 10-12 dispatch restarted the scorers but left the mechanism in
  place, so the 2026-10-19 reboot (uptime reset 17:51) silently took
  open-jev down again — the unit was disabled, so nothing restarted it.

changes_on_host_tony_omen:
  - "systemctl --user enable --now open-jev.service open-jev-student.service
     — persistent across reboots; :8777 (gemma-3-4b) + :8778 (gemma-3-1b)
     both /health ok (4b load_s ~141s on CPU)"
  - "systemctl --user disable --now open-jev-leash.timer — retired; scorers
     are supposed to stay up now, there are no 'bench leftovers' to reap"
  - "~/.config/systemd/user/ada-pi-orch-bench.service: ExecStartPost stop
     replaced with no-op + travel-slim comment updated; ExecStartPre kept
     (start is a no-op when running, health-wait remains a useful gate);
     daemon-reload done. Pre-edit copy at .bak-travelslim"

changes_repo:
  - "systemd/ada-pi-orch-bench.service — ExecStartPost no-op, comment updated
     (hand unit is the deployed source of truth; generated/ stub untouched)"
  - "systemd/open-jev-leash.service + .timer — deleted (unit retired)"
  - "ssot.health.home.system.yml — open-jev-scorer + open-jev-student-scorer
     expected_state inactive→active; open-jev-leash-timer entry removed"
  - "ssot.audit.hosts.yml — leash.timer dropped from expected units;
     open-jev*/open-jev-student* known_failed 'stop residue' entries
     re-labeled: a failed flag is now a real crash"
  - "ssot.jobs.yml ada-pi-orch-bench note — documents ExecStartPost as no-op
     since 2026-10-23"
  - "ssot.host-capacity.yml — omen note (desktop→macbook, scorers 24/7,
     ~5G avail watch), tony_macbook role primary-desktop, dell re-measure
     (220G/78G free post-SSD-upgrade, ~4G mem avail)"

