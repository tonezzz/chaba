title: KK-Mac storyboard image-conditioning probe
subtitle: Validate one approved mapped LTX I2V shot on MPS
icon: video
card: kk-mac-video-render-lane-ltx-video-mps-p-267f14
date: 2026-10-29

planning:
  goal: >-
    Use KK-Mac's available M4 Max MPS capacity to validate one image-conditioned
    LTX shot from the approved private Sacred Father V2 storyboard map.
  scope: >-
    Render only shot 1 from v1_01 storyboard page 9 using audited image-006,
    the existing shot01 prompt embedding, the already-cached pinned LTX model,
    and a short 640x384 25-frame/12-step probe. Keep input and output private
    in the isolated ada-nest-kk-mac-video-pilot store. Do not run Qwen or other
    model inference, install software, download weights, generate narration,
    render the full preview, or publish.
  approval: >-
    Tony asked to hold the Colab V2 execution and focus on KK-Mac while it is
    available. The private V2 visuals are approved; public release is not.
  success_criteria:
    - Trusted Mac access confirms AC power, at least 20 percent free memory, and no resident Ollama model.
    - Pinned local LTX cache and audited page-9 image/shot01 embedding hashes verify before inference.
    - One MPS I2V clip fully decodes as H.264 640x384 at the expected frame count.
    - Output and report land in the isolated private Mac pilot store and pass remote read-back verification.
  risks:
    - I2V on MPS has not yet been measured; stop on OOM, memory pressure, or owner workload.
    - Mac has 36 GiB unified memory; do not overlap LTX with Ollama, MLX, or another GPU job.
    - A technical decode pass is not visual-quality sign-off.
  resources:
    - KK-Mac M4 Max with cached Lightricks/LTX-Video revision 8984fa25007f376c1a299016d0957a37a2f797bb.
    - v1_01 PDF audit image-006 on page 9 and the existing shot01 embedding.
    - Trusted, read-only access through the approved tony-dell SSH hop.
  owner: tony
  estimated_duration: 1 bounded probe
  related_focus:
    - label: OPS-0967 KK-Mac video render lane
      file: docs/ssot/kanban/cards/kk-mac-video-render-lane-ltx-video-mps-p-267f14.yml

processing:
  status: completed
  started_at: '2026-10-29'
  steps:
    - id: 1
      label: Verify Mac idle/resource preflight
      status: completed
      notes: >-
        Trusted tony-dell -> kk-mac SSH preflight succeeded with host checking
        intact. Mac is on AC, 92% system memory free, 0 Ollama models resident,
        no matching compute/video owner processes, and 65GiB disk available.
        The pinned MPS venv reports Torch 2.14.1, Diffusers 0.42.1, and MPS/I2V
        import available.
    - id: 2
      label: Stage isolated one-shot I2V probe
      status: completed
      notes: >-
        Staged to ada-nest-kk-mac-video-pilot, separate from the Qwen pilot root.
        rclone check found 0 differences across six files; input image and
        embedding hashes match the audit and approved shot01 embedding.
    - id: 3
      label: Run and verify one MPS image-conditioned shot
      status: completed
      notes: >-
        An initial attempt safely stopped because Ollama had a resident model;
        no inference ran. After it became idle, a second attempt exposed an
        over-broad process-name check, also before inference. The gate was
        narrowed to exact compute/video app names and rerun successfully.
        MPS I2V generated and fully decoded one 25-frame shot in 11.23s.
  decisions:
    - label: Use one mapped I2V probe before broader Mac rendering
      rationale: >-
        Existing Mac evidence covers T2V only. A single mapped I2V probe is the
        smallest useful test of the new V2 image-conditioned path.
      alternatives_considered: Wait for the Colab CUDA path or run the full Mac render without an I2V probe.
  changes:
    - file: scripts/colab/packs/kk-mac-storyboard-i2v-probe-20261029/
      summary: Added an offline, single-shot MPS I2V pack with AC, memory, model-residency, and input-hash gates.
    - file: tests/colab/test_kk_mac_storyboard_i2v_probe.py
      summary: Added regression tests for pack scope and the audited page/image binding.

followup:
