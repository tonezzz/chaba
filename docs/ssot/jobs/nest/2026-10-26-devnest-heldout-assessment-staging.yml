decision:
  assessment: "devnest-heldout-assessment (JOBS.py entry, scope env)"
  slot: "between assets-stage and save-hf-cache — its GPU run hides the
        multi-minute hf-hub.tar.zst repack prep (the second un-hideable
        window; the warmup covers the first)"
  why_not:
    - "devnest-host-assessment skill — SSH/read-only fleet CPU work,
      cannot occupy a T4 window"
    - "DevNest replay benchmark fixtures — five safe fixtures + held-out
      verifiers are UNFROZEN; this job is a worker/queue assessment and
      is never reported as a benchmark pass"
    - "a pack — would run AFTER all JOBS and could not sit before the
      cache prep in manifest order; packs also get claimed by fleet
      nest-workers which have no T4 to assess"
  design:
    - "cache-independent: zero downloads; torch ships with the Colab
      runtime image, audit reads only Drive-side logs"
    - "held-out: fixed battery params (fp16/bf16 4096x4096 x20, 256MiB
      H2D/D2H) + production queue logs — never fitted to what it measures"
    - "artifacts gate: queue/assessments/devnest-heldout-<boot_id>.{json,md}
      (verify-before-mark, boot_id expansion)"
    - "battery verdicts: gpu_battery pass>=5 TFLOPs fp16, prep_overlap
      counts bg preps inside run windows, artifact_gate/history info"

