failure_modes_observed:
  - "ncnn -s 3 on an x4-only model: tile-scrambled output (blocks of the
     scene permuted/duplicated). RULE: run models at native scale only."
  - "realesrgan-x4plus-anime_6B: black frame on this ncnn build — exclude
     from photographic lane."
  - "spandrel BGR->RGB channel order bug in harness (fixed): blue-shifted
     output, PSNR collapsed to 22 — would have wrongly failed classical SR."
  - "HAT / Real-HAT-GAN full-frame OOM under dispatch cgroup (~12GB);
     crop-level runs fine, full-frame needs tiling."
  - "flat_region_lap_gain NaN on AI-smooth sources (no flat energy to
     amplify — treat as informational, not failure)."
  - "CLIP cosine misses spatial corruption (scrambled x3 scored 0.95) —
     pair with pixel metrics or visual QC."

correction:
  - "lesson ai-image-quality-ladder claimed x2 upscale 'comfortably'
     clears Adobe 4MP — 2048x1152 = 2.36MP < 4MP. For 1024x576 sources
     x4 (9.44MP) is the minimum compliant scale."

