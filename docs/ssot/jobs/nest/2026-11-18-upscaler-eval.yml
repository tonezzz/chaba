        #          CLIP cosine drift (external clip-drift.py this session)
  repro: /tmp/as-eval on tony-omen (src, models, receipts, crops)

decision:
  default: realesrgan-x4plus x4 via realesrgan-ncnn-vulkan
    # 32s/img on omen GTX1650 Vulkan; llvmpipe CPU fallback 19min/img;
    # GAN texture invention is desired for stock (AI-smooth -> photographic)
    # --dn 0.5 when source carries visible generation noise
  fidelity_alternate: SwinIR-M / HAT-S classical SR via spandrel
    # 45.4-46.9dB roundtrip vs 32.2 — for assets already sharp that only
    # need the 4MP gate; output reads "clean resize" not "more photo"
  rejected_default: diffusion SR (SeeSR/OSEDiff/SUPIR)
    # 8.7-30GB VRAM — no fleet host qualifies; hallucination risk is the
    # wrong default for stock QC; keep for hero assets (rented GPU)

