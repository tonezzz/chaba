id: jobs/nest/2026-10-13-nest-stale-mddb-split
title: nest-<host> stale-page alert — MDDB split-brain, not a daemon outage
card: cms-nest-stale-investigation
date: 2026-10-13
runner: tony-macbook
status: done

# ---------------------------------------------------------------------------
# cms-auto-health filed cms-auto-nest-{tony-dell,tony-omen,idc03} at 09:00 ICT
# ("last_run 42m+ overdue"). Root cause: NOT a nest-mgr failure — a migration
# artifact of MEM-0545 (commit 9a1f6b7e1, ~08:07 ICT), which moved the CMS
# content plane (ada-cms-*, chaba-*, kb-*, documents, infra-ssot, devin-kb)
# from mddb :11023 to mddb-cms :11027.
#
# The three nest-mgr daemons are INSTALLED COPIES (~/.local/share/nest/
# nest-mgr.py), not repo-run scripts — they kept the Oct-9 build with
# MDDB_BASE_URL=:11023 and kept publishing every 15 min all day into the
# parked DB. Verified: ada-cms-pages/nest-* on :11023 has refresh entries
# every ~15min through 12:23 UTC; the :11027 copies froze at 01:0x UTC.
# ---------------------------------------------------------------------------

evidence:
  timer_state: >-
    nest-mgr.service enabled + active (running) continuously on all three
    hosts — dell 3d3h, omen 1d23h wall-clock at investigation time. Never
    the problem.
  last_publish: >-
    :11027 registry last_run froze at 2026-10-13T01:0x UTC (08:0x ICT —
    last pre-migration publish). :11023 pages kept advancing every ~15min
    to 12:23 UTC (daemon restart).
  reachability: >-
    mddb-cms :11027 was up from 08:07:41 ICT and served writes all day
    (digests 15:01, audit batch 16:35, hourly jobs 19:00+; cms-auto-health
    on dell read it every 15min). The "Connection refused" tick errors in
    the nest-mgr journals (15:34-15:40 on ALL THREE hosts incl. idc03
    itself) were aimed at :11023 — the old code's target — not :11027.
  why_silent: >-
    With mddb reachable at :11023, each tick read the old registry doc,
    judged publish-due, and published successfully — stdout "published"
    lines are block-buffered under systemd so the journal stayed silent
    and stderr showed nothing. Only when :11023 briefly refused
    (15:34-15:40) did tick errors appear.
  threshold: >-
    Sane — interval 15m + 30m grace flagged the first check past 45min of
    registry staleness (09:00), card lifecycle auto-closes on recovery.
    The automation genuinely was stale on the live plane.
  recovery: >-
    install.sh redeploy of the repointed script at 19:31 ICT + service
    restart 19:33 → all three published to :11027 at 12:33 UTC; registry
    last_run advancing normally since.

residual:
  leak: >-
    Parked :11023 collections still accept writes — any stale client
    publishes into a dead letterbox with zero errors. Other live writers
    found via ~/.config/systemd/user grep: idc03 jev-bench.service
    (ExecStart --mddb :11023 -> ada-cms-pages/bench-jev, last write
    12:47 UTC), idc03 ops-health-report.service (MDDB_BASE_URL env),
    dell flood-alert.service + ada-flood-news.service (env), omen
    ada-pi-orch-bench.service (--mddb). Unit-level env/arg pins override
    repointed script defaults.
  carded: cms-11023-parked-writers (MEM-0594) — sweep unit-level pins,
    then delete parked collections after the rollback window.

lesson: >-
  For future DB migrations: repo-repoint commits only cover scripts that
  exec from a checkout. Anything installed as a copy (stacks/services/*/),
  any ExecStart --mddb arg, and any Environment=MDDB_BASE_URL pin must be
  swept separately — and the parked source collections should stop
  accepting writes (read-only or delete) as soon as the rollback window
  allows, so stale writers fail loud instead of silently splitting.

note: >-
  The task phrasing blamed scripts/ada/nest-overview.py — that script only
  owns the chaba-nest hub page and is repo-run (picked up :11027 with the
  commit). The stale pages are generated by stacks/services/nest-mgr/
  nest-mgr.py, the installed per-host observer-governor.
