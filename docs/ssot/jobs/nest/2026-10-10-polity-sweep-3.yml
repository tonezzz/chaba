questions_answered:
  submind_termination_reabsorption: >-
    Three lifecycle exits, explicit canon doctrine: resubsumption is the
    designed default ("drones loaded with their own subminds which could be
    easily resubsumed" — post-war doctrine after independent war drones
    caused "many unfortunate incidents"); emancipation is a sanctioned exit
    (subminds "either buy or are given their own independence");
    self-termination is the quiet third ("many others simply turned
    themselves off"). Termination authority is parent-held destruct codes
    (runcible AI Xanadu held destruct codes for its 206 sub-minds).
    Personas DO return and merge — fold-back is the default; standing
    autonomy is the exception.
  erebus_loyalty_mechanics: >-
    Four mechanisms, all ultimately insufficient: (1) forced subsumption —
    erase personality and moral codes, keep data ("divided up the AI's mind
    and subsumed it, erasing moral codes"); (2) favourites — subsumed minds
    whose loyalty is periodically CHECKED, not assumed ("checked the status
    of these minds… favourites… still loyal to the core"); (3) loyalty by
    provenance — new wormship captains cloned only from trusted favourites
    ("transcribe copies of themselves"); (4) core-held destruct programs as
    enforcement leash. Failure mode: Randal loosed Erebus's own kill
    programs and Polity missiles rebroadcast them — fleet decapitated in
    minutes. Loyalty could not be built in, only enforced; and the
    enforcement channel was the single point of failure. Randal's framing:
    "Erebus and its components were not melded at all as long as one
    component remained dominant" — meld = dominance, not fusion.

new_candidates:  # all land in the sweep-3 research-log table
