  - kill-channel capture → per-node authenticated non-replayable revocation
  - loyalty by provenance → spawn sub-lanes only from verified minds
  - subsumption-with-prejudice → merge data, retire persona identity
  - meld-is-dominance → member-level alignment checks in composite verdicts
  - war-drone evolution → bench-survivor generational selection
  - hivemind schizophrenia → degraded parent produces drifting lanes
  - minds-as-programs virtuality → bench as scenario simulation at speed
  - Quiet-War channel capture → gate control-plane independence

