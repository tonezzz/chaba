question: >-
  Candidate C (job_6aeea32e, comparison-c-omen-sdxl) rendered painterly
  on sdxl-lightning-4step.q4_0.gguf. Is the painterly ceiling the
  Lightning distillation or the Q4_0 quantization? Would a full
  sdxl-base GGUF (Q6_K/Q8_0) through the same /sdcpp/v1/img_gen lane
  reach stock photorealism?

premise_correction: >-
  The card says C ran "20 steps/CFG7". The actual submission
  (~/adobe-stock-gemini-c.7wBI1T/sd_submit.py on tony-dell, Nov 6)
  used sample_steps=8, txt_cfg=1.0 — Lightning's intended distilled
  recipe, not a mistuned one. Painterly output happened at the
  checkpoint's design operating point, which strengthens (not
  weakens) the distilled-ceiling hypothesis.

