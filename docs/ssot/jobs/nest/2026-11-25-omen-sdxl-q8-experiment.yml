sharpness_proxy: >-
  Laplacian variance on the 1344x768 PNGs (higher = more fine detail):
  C lightning-q4 1217.9 | D q8-unknown-params 1669.7 |
  H q8-verbatim-c-prompt 1530.8. Q8 renders carry ~26-37% more
  high-frequency detail than Lightning on the identical prompt —
  consistent with distillation (not quantization) causing the
  painterly look. Photorealism verdict remains Tony's visual QC.

verdict: >-
  Painterly output was the LIGHTNING checkpoint, not Q4 quantization:
  full sdxl-base Q8_0 through the identical prompt/pipeline produces
  a smoother, more detailed render (third Q8 data point after
  comparison-d/g, all in the same band). CPU SDXL still does not
  reach stock photorealism — omen sd lane is ILLUSTRATION-TIER for
  the adobe-stock program. Photo-tier lanes stay kk-mac diffusers,
  gemini-image, CF workers-ai. sd-server model swap = parallel
  instance on another port (proven here) or service restart; no
  hot-swap exists.

runbook:
  parallel_q8_render: >-
    ssh tony-omen; systemd-run --user --unit=sd-q8-exp -p MemoryMax=12G
    -p Nice=10 -- ~/stable-diffusion.cpp/build/bin/sd-server
    --listen-ip 100.75.102.88 --listen-port 8400
    -m ~/models/sd/sdxl-base-1.0-Q8_0.gguf --threads 6
    then POST /sdcpp/v1/img_gen on :8400; harvest via
    /sdcpp/v1/jobs/<id>; land via scripts/adobe-stock/land-render.py
    --lane local-file; stop with systemctl --user stop sd-q8-exp
  cleanup: >-
    systemctl --user stop sd-q8-exp; rm -rf ~/sd-q8-exp (after
    artifacts are landed); production sd-server.service unchanged.

