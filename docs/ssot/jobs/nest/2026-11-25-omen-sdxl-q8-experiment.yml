controlled_rerun:
  why: >-
    comparison-d's exact sampling params/prompt were not recorded
    (sd-server jobs are in-memory; journal rotated). This dispatch
    re-ran the experiment with the verbatim candidate-C prompt and
    documented params so the comparison is airtight.
  method: >-
    Parallel sd-server instance on tony-omen — NOT a service swap:
      systemd-run --user --unit=sd-q8-exp -p MemoryMax=12G -p Nice=10
        sd-server --listen-ip 100.75.102.88 --listen-port 8400
        -m ~/models/sd/sdxl-base-1.0-Q8_0.gguf --threads 6
    Production sd-server.service (:8399, lightning) untouched and
    stayed active throughout. Model load ~5s; params footprint
    ~4.0GB RAM (text_encoders 926MB + diffusion 2910MB + vae 160MB).
  request:
    endpoint: http://100.75.102.88:8400/sdcpp/v1/img_gen
    job_id: job_6b063236_00000000
    prompt: >-
      verbatim candidate-C prompt (see sd_submit.py): realistic
      commercial stock image, bright modern home office, crisp plant
      leaves, closed laptop, hardwood floor, office chair, morning
      light, copy space left, 1344x768
    negative_prompt: verbatim candidate-C negative
    params: "seed 20261106 (same as C), sample_steps 20, txt_cfg 7.0,
      sample_method euler_a, output_format png — the documented
      sdxl-q8 quality lane in scripts/adobe-stock/omen-inpaint.py"
  watcher: >-
    omen-side ~/sd-q8-exp/watch.sh (setsid, polls job every 60s,
    saves PNG + result-meta.json; survives session loss)

model_swap_gate:
  question: does sd-server support model swap without disrupting
    other jobs?
  answer: >-
    NO hot swap. sd-server (master-964, commit 1d0a58a) loads exactly
    one checkpoint via -m at startup; /sdapi/v1/sd-models lists only
    the loaded model; route table has no reload/switch endpoint
    (verified: /sdcpp/v1/{capabilities,img_gen,upscale,vid_gen},
    /sdapi/v1/*, /v1/images/*, /v1/models — all inference/metadata).
  options:
    - label: parallel instance (used here)
      detail: >-
        second sd-server on another port+model; zero disruption to
        the production lane; costs ~4GB params RAM + render buffers.
        Requires headroom — omen swap was 100% full on 2026-11-25 so
        a MemoryMax-capped transient unit is the safe wrapper.
    - label: service restart with new -m
      detail: >-
        edit ExecStart / drop-in override, systemctl --user restart
        sd-server; ~1-2min downtime + model load; kills any in-flight
        job; lane serves the new checkpoint until switched back.
        Acceptable only when the queue is empty.
    - label: sd-cli direct
      detail: >-
        omen-inpaint.py already does this for inpaint; for plain
        txt2img a one-off sd-cli -m run avoids the server entirely
        but bypasses the /sdcpp/v1/img_gen API the lane uses.

