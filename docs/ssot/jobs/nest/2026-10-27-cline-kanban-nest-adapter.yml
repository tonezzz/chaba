    - id: declare
      label: Create isolated adapter card and lifecycle record
      status: done
      notes: KNB-0932 created; this lifecycle record captures the one-host pilot scope.
    - id: implement
      label: Add idempotent Nest pack submitter and task/result verifier
      status: done
      notes: >-
        Added a con01-guarded pack that reuses tasks by job-key marker,
        starts only the pinned Ollama model in /workspace, waits for Review,
        and requires both task-state JSON and a non-empty patch.
    - id: validate
      label: Run local tests and SSOT/pack preflight
      status: done
      notes: >-
        Proxy tests 7/7, Nest adapter tests 7/7, Nest pack --dry-run valid,
        full SSOT validation 3218 files/0 errors, and cross-references pass.
        Optimizer reports 45 warnings; the baseline records the two known
        card-size warnings and the reviewed `chaba` key-alias false positive.
    - id: secure-runtime
      label: Separate the Cline app and credential-gated proxy on a private network
      status: done
      notes: >-
        PR #48 replaced the unsupported Podman pod with separate app/proxy
        containers on the private bridge. The network stack is deployed;
        preflight passes, unauthenticated UI returns 401, authenticated UI
        succeeds, WebSocket returns 101, and the host audit has no
        Cline-specific delta. The proxy secret remains isolated.
    - id: ci-tool-registry
      label: Restore SSOT/server parity for the structured mcp_files tools
      status: done
      notes: >-
        PR validation exposed four existing mcp_files_* handlers in
        scripts/mcp_debug/server.py that were missing from
        ssot.mcp-debug.yml. Added the four names to the canonical tool list;
        the smoke validator now reports 44 wired tools.
    - id: configure-model
      label: Configure local Ollama provider/model without API credentials
      status: done
      notes: >-
        Cline settings now use Ollama at http://100.75.102.88:11434/v1 with
        qwen3:4b; no API key is stored. Model catalog refresh and /v1/models
        both returned 200. The earlier root-path /chat/completions attempts
        returned 404. After adding /v1, a Cline request to /v1/chat/completions
        returned 200 in 6m33s; its turn was canceled before shell tools, with
        no workspace files changed.
    - id: test
      label: Stage isolated pack, claim once, and verify task/patch artifacts
      status: in_progress
      notes: >-
        Two isolated worker attempts targeted task fd918 with local
        qwen3:4b. One Cline session completed exit_code 0 but produced no
        tool call or expected file; no result JSON, patch, or done marker
        exists. The retry did not create a new session. After the approved
        app restart, Cline shutdown cleanup moved fd918, bbd43, and 62aaf to
        Trash and removed their task worktrees; 62aaf had held the smoke file.
    - id: resume-existing-task
      label: Resume the existing disposable smoke task and publish verified artifacts
      status: done
      notes: >-
        Fix the adapter to call `task start` for both backlog and in_progress
        tasks. The CLI start operation is idempotent when a session is already
        running and starts the session when the task was only moved to
        in_progress. The approved task key is
        `cline-nest-smoke-20261028-093509`; Cline task fd918 already carries
        that marker. Code and unit tests are merged in PRs #50 and #51; the
        deployed task still failed to create a fresh session after its prior
        session completed.
    - id: preserve-task-worktrees
      label: Prevent task worktree cleanup when the Cline app restarts
      status: in_progress
      notes: >-
        The app's default shutdown cleanup moved all in-progress tasks to
        Trash and deleted their worktrees. This branch adds the supported
        `--skip-shutdown-cleanup` option and a regression assertion; merge
        and deploy it before any further restart or smoke retry.
    - id: posix-shell-prep
      label: Make the pack launcher compatible with the fleet worker shell
      status: done
      notes: >-
        The first con01 worker pass invoked run_sh through /bin/sh and failed
        immediately because dash rejects `set -o pipefail`. Changed the
        prelude to POSIX `set -eu`; the failure occurred before the bridge
        ran, so no Cline task session or model inference was started.
  decisions:
    - label: Resume an existing in-progress task through the idempotent CLI start operation
      rationale: >-
        The current Nest task is already in_progress but has no session; the
        adapter previously skipped `task start` unless the column was backlog,
        leaving it stuck. The CLI safely no-ops for a running session and
        starts one if absent.
      alternatives_considered: >-
        Creating a new task would duplicate the approved smoke and violate the
        job-key idempotency contract. Manually moving the task back to backlog
        would mutate live task state unnecessarily.
    - label: Use localhost runtime mode behind proxy Basic Auth
      rationale: >-
        Cline Kanban's CLI task API is reliable in local mode; remote-mode
        task commands fail even when host and port environment overrides are
        set. The proxy keeps the browser on Tailnet, enforces Basic Auth and
        exact Host/Origin, and the backend port is not published. The app and
        proxy run as separate containers on a dedicated rootless bridge; only
        the proxy publishes ingress and receives the secret EnvironmentFile.
        The Cline app container cannot read the proxy credential.
      alternatives_considered: >-
        Host networking was rejected because it would let an agent container
        reach con01 loopback services. Blind Host/Origin rewriting without an
        external allowlist was rejected. Quadlet `Pod=` was rejected after
        con01's generator reported it unsupported.
    - label: Use existing local Omen qwen3:4b for one smoke task
      rationale: >-
        It is already cached, advertises tool support, and needs no model
        download or API key. One small task is a better free trial than adding
        another inference service to con01, which has 6.3 GiB available RAM.
      alternatives_considered: >-
        OpenRouter Free is available but adds a third-party API key, variable
        rate limits/model routing, and external code transfer. A local model
        download on con01 is deferred because its available memory is limited.
    - label: Keep the first adapter single-host and create-only-once
      rationale: >-
        Cline Kanban tasks run on the host owning their worktree; remote-mode
        task CLI is broken. The pilot queue is isolated and the worker acts
        only on con01. This validates Nest integration without claiming a
        shared multi-host Cline board.
      alternatives_considered: >-
        A distributed pool of independent Cline runtimes requires a separate
        worker enrollment and result/board synchronization design.
  changes:
    - file: stacks/con01/cline-kanban/Containerfile
      summary: Added a role-selecting entrypoint for the local Cline app and separate proxy container.
    - file: stacks/con01/cline-kanban/entrypoint.sh
      summary: Keep Cline task worktrees on shutdown with --skip-shutdown-cleanup.
    - file: stacks/con01/cline-kanban/cline-kanban.container
      summary: Put the Cline app on a private bridge without publishing its backend port.
    - file: stacks/con01/cline-kanban/cline-kanban-proxy.container
      summary: Added a separate bridge-connected Basic Auth proxy that alone publishes Tailnet ingress and receives the secret EnvironmentFile.
    - file: stacks/con01/cline-kanban/proxy.mjs
      summary: Added external Basic Auth and strict Host/Origin checks, stripping auth before forwarding.
    - file: stacks/con01/cline-kanban/cline-kanban.network
      summary: Uses a dedicated rootless bridge shared only by the app and proxy.
    - file: stacks/con01/cline-kanban/stack.yml
      summary: Declared the proxy secret, authenticated health verification, and shutdown-guard rollback.
    - file: stacks/con01/cline-kanban/verify.sh
      summary: Verified all Quadlet units and both unauthenticated/authenticated HTTP behavior.
    - file: docs/ssot/infrastructure/ssot.audit.hosts.yml
      summary: Declared the proxy and bridge-network units in con01 expectations.
    - file: scripts/colab/packs/cline-kanban-nest-bridge/
      summary: Added an idempotent Nest pack for one local Cline task and verified patch output.
    - file: scripts/colab/packs/cline-kanban-nest-bridge/bridge.py
      summary: Resume a matching backlog or in-progress task using the idempotent Cline CLI start operation.
    - file: docs/ssot/infrastructure/ssot.mcp-debug.yml
      summary: Registered the four already-implemented mcp_files tools so the server/SSOT wiring check passes.
    - file: .github/workflows/ssot.yml
      summary: Added CI coverage for Cline proxy and Nest adapter tests.
    - file: tests/test_cline_kanban_proxy.mjs
      summary: Added Basic Auth, header stripping, network separation, credential isolation, and shutdown-guard checks.
    - file: tests/ada/test_cline_kanban_nest_bridge.py
      summary: Added input, idempotency, provider pinning, and task-worktree selection tests.
    - file: scripts/colab/packs/cline-kanban-nest-bridge/pack.yml
      summary: Use POSIX shell options because fleet workers execute run_sh with /bin/sh.
    - file: scripts/ssot-validate-all.mjs
      summary: Use a process-specific repo-cache batch file instead of a shared /tmp path.

