title: Cline Kanban Nest worker adapter
subtitle: Submit one isolated Nest task to the con01 Cline Kanban runtime and verify its returned artifact
icon: workflow

planning:
  goal: >-
    Let a Nest-pack job submit and run one disposable task on the con01 Cline
    Kanban host, then publish task state and a verified patch as durable Nest
    artifacts without using a paid model provider.
  scope: >-
    Build a one-host pilot adapter pack and driver. The pack runs on con01,
    creates or reuses a task by idempotency key using the local Kanban CLI,
    starts it with Cline Kanban's Cline agent configured for the existing
    Omen Ollama qwen3:4b model, polls to review/completion, and copies task
    status plus a non-empty diff into pack artifacts. Stage and run it only
    under the isolated gdrive:ada-nest-cline-pilot root. No live Chaba repo,
    auto-commit, auto-PR, hosted API key, paid inference, or public route.
  success_criteria:
    - Nest worker claims only the pilot pack from its isolated queue root.
    - A single Cline Kanban task appears and runs in the disposable con01 workspace.
    - The task reaches review/completion and writes the expected smoke file.
    - A non-empty patch and task-state JSON are verified in the remote pack directory before done.
    - No model-provider API charge, Git commit, or push occurs.
  risks:
    - Cline Kanban's remote-mode task CLI fails; the backend must be localhost-only behind the authenticated Tailnet proxy.
    - The Nest worker uses podman exec to the Cline container and is therefore con01-specific in this pilot.
    - qwen3:4b is a small local model; tool use or task quality may be insufficient even though the model supports tools.
    - The smoke task consumes Omen GPU/CPU briefly through its Tailnet Ollama endpoint.
    - The Tailnet proxy uses a separate Basic Auth secret in its own pod container; it is not mounted into the Cline agent container.
  resources:
    - con01 rootless Podman, rclone, Nest worker, and disposable Git workspace
    - Cline Kanban v0.1.70 CLI inside the local container
    - tony-omen Ollama endpoint 100.75.102.88:11434, model qwen3:4b (already cached)
    - Dedicated Drive root gdrive:ada-nest-cline-pilot
    - No model API credentials
  owner: tony
  estimated_duration: 1 session
  related_focus:
    - label: Cline Kanban pilot on con01
      file: docs/ssot/jobs/infrastructure/2026-10-27-cline-kanban-con01-pilot.yml

