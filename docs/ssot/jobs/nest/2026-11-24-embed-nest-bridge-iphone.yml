notes: >-
  - iOS Safari suspends the tab in background — foreground-only worker,
    matches the card's stated constraint. No battery API on iOS; keep
    the phone on charger per the lab brief.
  - bge-m3 q4 (~300MB) fits the ~1-1.5GB tab budget alongside MiniLM;
    both pipes can coexist (lazy-loaded).
  - Pool job budget: /api/embed caller waits <=6.5s; a worker must
    embed its batch inside that — mddb sends single texts, fine.
