what: >-
  Iteration 3 on the iPhone-as-opportunistic-worker lab. Two findings
  and one rebuild:

  1. bge-compat answered WITHOUT the phone: Xenova/bge-m3 q4 via
     transformers.js (node, onnxruntime-node CPU EP — vector space is
     device-independent) vs the ollama bge-m3 reference vector in
     stacks/web/public/apps/webgpu-bench/bge-ref.json:
       pooling=cls  cosine=0.9664  COMPATIBLE (dims 1024)
       pooling=mean cosine=0.7598  divergent (bge is a CLS model)
     => browser bge-m3 CAN feed the :11028 bank's vector space. The
     on-device button 6 remains the final WebGPU-EP confirmation, but
     the space question is settled. Repro script committed:
     scripts/nest/webgpu-bge-compat.mjs (needs a dir with
     `npm i @huggingface/transformers@3.7.6`).

  2. embed-nest-bridge REBUILT — the lane-B pull->push bridge from card
     embed-pool-fleet-nest-workers was lost with its dirty worktree
     (2026-11-14, never committed). Reimplemented per the comms spec:
     scripts/nest/embed-nest-bridge.py — POST /api/embed enqueues+blocks
     (ollama-shaped {embeddings}), workers long-poll GET /v1/job +
     POST /v1/result; instant 503 when no worker in 45s; 7s job TTL under
     the pool's 8s upstream timeout; 20s claim lease requeues once.
     JobStore core unit-tested (tests/nest/test_embed_nest_bridge.py,
     8 tests) + live smoke verified claim->embed->result->200.

  3. embed-pool-shim gained the DEFER tier it lost with the same
     worktree: EMBED_POOL_DEFER_UPSTREAMS join the /api/embed race only
     after EMBED_POOL_DEFER_AFTER_MS (default 1500) with no primary
     winner — opportunistic workers burn device cycles only on fleet
     slack. Pass-through GETs/POSTs try deferred last. Tested:
     tests/embed/test_pool_shim_defer.py (3 tests, stub servers).

  4. Page iteration: /apps/webgpu-bench is now installable —
     manifest.webgpu.json (start_url ?pool=1), apple-touch metas, auto
     probe+worker boot, job.json TTL (12h, `created` stamped by
     webgpu-mddb-job.py), poll-error backoff, worker/pool status lines,
     and button 7 pool-worker mode: long-polls /apps/embed-nest/v1/job
     (bge-m3 cls), posts /v1/result. Caddyfile gained /apps/embed-nest/
     -> http://idc03.taila0626a.ts.net:11440 same-origin proxy with the
     board-api-style tailnet-identity write guard (avoids Safari
     mixed-content).

