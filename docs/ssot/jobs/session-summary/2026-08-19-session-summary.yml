title: Session Summary Automation
subtitle: Phase 6 of the Context Improvement Plan — create an mcp_session_summary tool
icon: target

planning:
  goal: |
    Create an mcp_session_summary tool that reads the current focus, session log, and decisions,
    then emits a structured session summary with KB items and decisions.
  scope: |
    - Design the session summary output schema.
    - Implement scripts/mcp_session_summary.py.
    - Add template SSOT for session summary reports.
  success_criteria:
    - mcp_session_summary returns a JSON summary with focus, subtasks, decisions, and KB candidates.
    - Summary can be used as input to auto-kb.
    - SSOT validation passes.
  risks:
    - Summaries become too noisy; mitigate with filters.
    - Missing sessions data; mitigate by graceful fallbacks.
  resources:
    - docs/ssot/ssot.focus.current.yml
    - docs/ssot/ssot.focus.sessions.yml
    - docs/ssot/ssot.focus.decisions.yml
    - .agents/skills/auto-kb/auto-kb.mjs
  owner: tony
  estimated_duration: 1 session
  related_focus:
    - label: Context improvement and optimization
      file: docs/ssot/ssot.focus.current.yml

