the_10_rules:
  - "fail loud, bounded evidence (comms + action.last_failure; verified:false = checked-failed)"
  - "bounded retries; re-arm is a deliberate human verb, producer re-queues never forgive"
  - "failure evidence rides the next attempt (RETRY_RAILS / last_failure)"
  - "blocked ≠ failed (request / needs-input.txt / exit-42 — never nonzero exit or faked success)"
  - "advisory components degrade, never block (dead API must not stop a claim loop)"
  - "gate at claim time, not mid-run (push creds, VRAM, labels, load, quiet hours, kill switch, budgets, R-class)"
  - "probes outside the card flock (2026-11-17 convoy rule)"
  - "nothing unproven is destroyed (salvage-push wip/dispatch/<tid> or KEEP)"
  - "exit codes mean crashed — findings report via comms/inbox/ops-event (OPS-0581)"
  - "finished ≠ verified — exit ∧ produced-work ∧ goals, each leg pass/fail/unverifiable"

audit_gaps_noted:
  - "three retry counters with different semantics (attempts/max_attempts global, runner ledger per-host consecutive, retries_per_card policy park) — interoperate correctly; a future card could unify vocabulary, not the ledgers"
  - "runner-agent's vendored twins (waiting_cards evaluate, RATE_LIMIT_PAT) are parity-tested, but the recurring 'installed runner-agent drifted from repo' defers show the deploy path is the weak link"
  - "devin-dispatch-watch still labels record-less finished units '(collected,inferred)' success — best-available-signal, worth knowing"
  - "awaiting_action 'deterministic-gap-only' is convention, not enforced"

