  instantiation. Live cards.json is the compact payload (KNB-1302):
  658 cards, sparse per-card fields, zero project:/project-field
  slugs — the 'adobe-stock' alias group resolves to 5 cards via
  tags/program/id-prefix, all landing in the 'members' lane until the
  project:slug convention gets adopted.

changes:
  - "js/diagram.js: import groupIdOf (was groupOf — the breakage); buildLanes uses it; added actOf/isQueued helpers (tolerate raw or normalized card shape); per-lane queued count + SVG 'claim n' lane-act button -> onLaneAction; node <title> tooltip"
  - "js/app.js: rewritten interaction layer — node click opens an action panel (was hover-follow info popup, pointer-events:none); panel posts to /apps/board-api/action: ▶ claim {do:claim,host:tony} gated client-side on action.status=queued + non-manual lane/executor/type, move <select> {do:move,column} over board-api COLUMNS (lab excluded — do_move refuses it), ✓ finish = do:finish {host:tony,ok:true} when running-by-tony else do:close (merge-guarded, same as board2's close); lane claim-queued button confirms then claims each queued card sequentially; Esc/background-click dismiss; 60s fetch timeout matching board2 api()"
  - "index.html: popup restyled interactive (.pp-head/.px/.pa/.pb/.pmv/.pmsg), .lane-act cursor+hover"
  - "auth: unchanged — same-origin POST to /apps/board-api/*; tailnet front gets Tailscale-User-Login, CF-Access vhost gets X-Board-Edge-Key injected by ~/.config/caddy/Caddyfile (edge:<cf-email>). No credentials in JS — identical to board2"

verified:
  - "node smoke (/tmp/bd-smoke, package.json type:module): buildLanes over live cards.json (658 cards) -> 'members' lane with the 5 in-scope adobe-stock cards (3 done/2 doing); actOf/isQueued correct; import resolves (the original bug class)"
