  - "routes: render-routes.py --check clean for board-diagram (55 routes, 18 pre-existing unrelated shadow warnings); routes.json already contained the route — no regen needed"
  - "HA dashboard: live lovelace.chaba_admin on tony-omen already has Diagram tab after kanban tabs and Gantt after Obsidian — repo snapshot matches"

notes:
