state_found: >
  Everything static was already on master and live: app files, the
  ssot.routes.yml route, the Caddyfile handle_path block, routes.json,
  the HA chaba-admin Diagram tab (views[3]) and Gantt-after-Obsidian
  order (views[17]) — all verified against the live lovelace.chaba_admin
  storage on tony-omen. The page was nevertheless DEAD in the browser:
  board-gantt renamed groupOf -> groupIdOf on 2026-11-24 (7c3cd799fa3)
