  - "compact cards.json (KNB-1302) drops project/program/brief on most cards — group-by-project views degenerate to alias groups + 'members' lanes until project:<slug> adoption lands"
  - "board-api COLUMNS excludes 'lab' — any move UI must not offer it or do_move 400s"
  - "board-api error bodies are {error:...} without ok:false — check j.ok===true, not j.ok===false"
