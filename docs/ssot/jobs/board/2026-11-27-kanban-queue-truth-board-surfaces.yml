  unreachable in practice (they require a prior claim/run, which manual
  cards can't get through any door); a mid-run type flip via YAML bypass
  could still leave one queued, which /queue human_waiting + Q1 then
  surface truthfully. ADA-0783 (ada-text-model-promotion-path) resolved
