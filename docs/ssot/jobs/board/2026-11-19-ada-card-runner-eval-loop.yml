title: "ada-card-runner piece 4 — bounded-retry eval loop + unstaged-opencode claim hold"
date: 2026-11-19
card: ada-card-runner
ref: ADA-0042
session: "dispatch-wt-20261119-162739-pieces-1-card-pick-strategy-se (tony-omen, devin executor)"
attempt: 2

prior_failure:
  what: >-
    idc02 runner-agent claimed the card (kw-classified free_lane) and
    start_opencode_lane held it: "OpenCode admission requires a complete
    action.lane_envelope; unstaged dispatch is held". The claim BURNED an
    attempt (fail 1/3 backoff) even though the ineligibility was
    deterministic — the card could never pass staged admission.
  root_cause: >-
    The claim-time gate (_claimable) did not replicate start-time
    routing: an executor-unset card classified to a LANE_MODELS lane with
    a resolvable profile routes to the opencode lane at start on
    OPENCODE_LANES=1 hosts — where the envelope is mandatory since
    2026-11-09 staged admission (OPS-1255). Claim succeeded, start held.

changes:
  runner_agent_claim_hold:
    file: scripts/board/runner-agent.py
    what: >-
      _claimable now holds (returns "", defer reason) when a dispatch
      card's start path would resolve to the opencode executor without a
      complete action.lane_envelope — both executor=opencode-declared and
      executor-unset lane-resolved cases. executor_defer_reason mirrors it
      so the hold surfaces on the board: "held for staging or an
      executor=devin pin". Stays queued, no attempt burned.
    note: >-
      executor=devin pins lane="" at start and can never hit the opencode
      route — the hold skips it by construction (ex != "devin").
  card_run_eval_loop:
    file: scripts/board/card-run.py
    what: >-
      --lifecycle gains spec piece 4: --attempts N (1..3, default 2) wraps
      run+eval in a bounded loop; retries resume the SAME opencode session
      via `opencode run --continue` with the eval evidence as the message
      (DEV-0253: failure evidence rides the next attempt). Eval per
      attempt = changes-present -> git-state normalize -> repo-validate
      (diff --check + syntax on touched files: py compile(), sh bash -n,
      yml/json parse) -> card's declared verifier. Post-PR --ci-wait
      (default 120s) polls gh statusCheckRollup; pending is reported, not
      a failure — merge stays the human/merge-sweep gate.
    helpers: "_porcelain_paths, _validate_changes, _evaluate_attempt, _ci_wait, RETRY_MSG"

verification:
  - "pytest tests/board/test_card_run.py — 20 tests: blocked reason, retry msg, porcelain paths, validate gate (incl. no-__pycache__), eval attempt (changes/validate/verifier), ci_wait states"
  - "pytest tests/board/test_executor_contract.py UnstagedOpencodeHoldTest — 9 tests incl. free_lane hold (the exact ada-card-runner case), envelope-present claims, OPENCODE_LANES=0 devin path, devin-pin exemption, paid_frontier+profile hold"
  - "pytest tests/board/test_executor_contract.py + test_runner_agent_lane.py + test_queue_time_classify.py + test_claim_order.py + launchd/push-guard/starvation — full pass (existing unstaged-opencode test updated to carry lane_envelope per the new contract)"
  - "smoke: card-pick.py sweep|high-value --api idc03 — live picks OK; card-context.py ada-card-runner — full pack renders"

fleet_note: >-
  runner-agent.py deploys as a single file per host — the claim hold only
  takes effect per-host after the repo copy is redeployed
  (scp scripts/board/runner-agent.py <host>:~/.local/bin/runner-agent).
  The recurring 'runner-agent drifted from repo' defer notes on this card
  say several hosts are already behind — fleet redeploy needed for the
  hold to protect claims everywhere.

