watch_implemented: >
  scripts/board/kanban-stats.py gains a "Lane routing — open cards"
  section: a lane x lane_source matrix over non-done cards plus an
  unstamped type:dispatch count. kanban-stats runs every 15min via
  kanban-sync.timer on the served checkout and mirrors into the
  system-report web data, so the free_lane cohort, pin-vs-classifier
  split, and fallback->devin volume are visible continuously instead
  of needing a manual classify audit. 'pin' (lane, no lane_source)
  = author-set, wins forever; kw/claim/fallback/jevos/timer-alert =
  classifier stamps that re-evaluate on re-queue.

