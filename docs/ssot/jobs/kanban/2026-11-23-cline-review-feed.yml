title: "cline review feed — review-column cards batched through con01 Cline with drafted verdicts"
subtitle: >-
  scripts/ops/cline-review-feed.py SELECTs cline-suitable review cards
  (auto-incidents get evidence-pack prompts, bounded deliverables get
  done-claim checks), CREATEs [CARDREVIEW:<id>] tasks on the con01
  cline-kanban board (cap 3 concurrent, ollama only), COLLECTs the
  worktree patch when the session ends, and REPORTs a verdict comms +
  a close/keep/requeue options request back to the card — never
  auto-closing. The lane-cms 5x-repost bug is fixed by deduping on
  last-reported (task_id, column, updatedAt) plus a comms/request scan
  that survives state-file loss.
icon: 🔁
