decisions:
  - id: marker-namespacing
    text: >-
      Feed-owned tasks carry [CARDREVIEW:<id>] — the mirror owns
      [CARD:<id>] (projection tasks that must never be started) and the
      intake bridge owns [NEST_JOB_KEY:]. Marker is also the idempotency
      key: a card with a live CARDREVIEW task is never re-created.
  - id: evidence-only-prompts
    text: >-
      Prompts inline the card spec/note/last-12 comms; the disposable
      workspace has no repo or hosts by design. 'investigate' is the
      honest verdict whenever proof lives outside the card text — weak
      models draft, humans gate.
  - id: two-layer-dedupe
    text: >-
      State file (~/.local/state/chaba/cline-review-feed.json) records
      last-reported (task_id, column, updatedAt) — unchanged tuple skips
      all writes. Comms/requests are scanned before posting anyway, so
      dedupe survives host moves and lost state (proven live 2026-11-23:
      re-run over e05b5/b699c wrote nothing).
  - id: never-auto-close
    text: >-
      Verdicts raise /request cline-drafted-verdict-<verdict>-* with
      options close/keep/requeue and suggested = close|keep|requeue per
      verdict — Tony answers with one word. Card column untouched.
  - id: board-json-moves
    text: >-
      Collected tasks are moved to the Cline board's review column via
      the same atomic board.json edit the mirror uses (the CLI has no
      column-move verb). Frees the in-flight cap slot.
  - id: ssh-argv-quoting
    text: >-
      Remote podman-exec argv is shlex-joined before ssh — the remote
      login shell otherwise re-expands $O/$E/$R, pipes and quotes. This
      is why bridge.py only ever ran on con01 itself; the feed works
      from any host with ssh con01.

validation:
  dedupe: >-
    --execute --phase report over the two already-fed pilots: comms scan
    found verdicts+requests already posted -> zero new writes; both tasks
    moved to Cline review column. Chaba cards show no new comms.
  create: >-
    --execute --card per pilot: cms-auto-nest-tony-macbook -> task 43d16
    (incident prompt), report-graph-producer-metas-never-reach-7b0982 ->
    task 297a1 (deliverable prompt). Both in_progress via kanban task
    start, ollama/qwen2.5:7b — zero paid spend.
  select: >-
    51 of 56 review cards classify suitable after exclusions (open human
    requests, secret/deploy/security keywords, already-fed); cap holds
    in-flight CARDREVIEW tasks at 3; incidents sort ahead of
    deliverables, stalest-updated first.

follow_ups:
  - >-
    Timer wiring (e.g. hourly cline-review-feed.timer on a host with ssh
    con01 + BOARD_API reachability) is a host-mutation step left for the
    served checkout — this lane is proven manually; declare the unit in
    ssot.jobs.yml when promoted.
  - >-
    An in_progress task whose session dies without agent_end looks
    running forever and holds a cap slot; `kanban task delete` +
    re-feed is the manual escape. Worth a stale-session watchdog if it
    recurs.
  - >-
    EXCLUDE_WORDS is a coarse keyword net — a review card needing
    secrets/host access will still get fed and honestly verdict
    'investigate'. Tighten only if noisy cards waste model-minutes.
