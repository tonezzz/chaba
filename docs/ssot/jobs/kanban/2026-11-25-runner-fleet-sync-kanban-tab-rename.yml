verification:
  - "ws readback: path='kanban' title='kanban'; path='kanban2' title='Kanban 2' unchanged"
  - "git diff snapshot: single-line title change, 2 values redacted as before"
  - "fleet sha256 audit re-run post-repair: all 8 hosts installed+ref = 1514c75c…"

lessons:
  - "runner-agent drift is judged installed-vs-CHECKOUT-REF, not installed-vs-origin — a current snapshot still declines when the host checkout is stale; check both shas."
  - "shallow clones cannot accept thin git bundles (prerequisites below the cut); a full-history bundle fetch + rm .git/shallow heals one without any remote auth."
  - "zero-byte loose objects + one broken ref is enough to fail every git fetch — scan .git/objects for size-0 files and for-each-ref+cat-file -e when fetch dies with 'bad object'."
