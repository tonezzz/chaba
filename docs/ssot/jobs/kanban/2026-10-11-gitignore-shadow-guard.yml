verified:
- >-
  python3 -m unittest discover -s tests — 220 tests, 0 failures
  (6 new shadow tests: symlink block + dir-pattern-file block +
  head-keyed re-merge in test_merge_sweep; symlink hold, dir-pattern
  hold, guard note, and a direct detector unit test in
  test_dispatch_close_out)
- >-
  Spec verification shape: worktree branch adds a `.venv` symlink over a
  `.venv/`-only .gitignore, merge path runs → merge held pre-push,
  branch still pushed, comms lists `.venv (symlink)`
- >-
  check-ignore semantics probed live: `P/` trailing-slash arg evaluates
  dir patterns even when P exists as a file; `*.log` matches `foo.log/`
  probes — the `/`-terminated matched-pattern check is what isolates the
  shadow class; symlink `P/` probes are fatal → excluded from probing

notes:
- >-
  Deliberate scope: every added symlink is flagged for a human look —
  repos do carry legitimate symlinks, but a false positive costs one
  comms entry while a false negative costs a production venv.
- >-
  A committed file that is ignored AS A FILE (e.g. `-f` add of
  `*.log`) is not flagged — different pathology (force-add), no dir
  shadow.
- >-
  merge-sweep raises comms but no card request for shadows (unlike
  conflicts): the close_out paths auto-requeue with the fix evidence,
  and the sweep's head-keyed stamp keeps the board quiet meanwhile.
