title: card-union merge driver + kanban-commit failure-streak alert
subtitle: Card YAML conflicts union-merge inline; a wedged pull falls back
  to one-shot merge; consecutive tick failures flag the ops card
icon: git
version: 1

card: kanban-commit-reconcile-rebase-deadlocks-4d95a9
date: 2026-10-23
dispatch: 20261023-165619-incident-2026-10-23-idc03-serv

incident: |
  2026-10-23: the idc03 served checkout (chaba-tony-dell) diverged 275
  commits from origin. kanban-commit.service failed every 15-min tick all
  day on "pull --rebase needs manual resolution". Root cause:
  wp-activity-cpt-timeline-links.yml differed semantically on both sides
  (local live-writer said column=done with merge-sweep comms; origin had a
  different write pushed via a dispatch worktree merge). Replaying the
  pile re-conflicted on that card until the rebase step guard aborted —
  every tick, forever — and ~6h of board writes piled up unpushed (board
  truth existed only locally). Found by accident, fixed by hand with git
  merge + union-merge of the card (local workflow fields won; comms
  unioned by at/text).

deliverables:
  - scripts/board/merge-card-yaml.py — git merge driver `card-union` for
    docs/ssot/kanban/cards/*.yml. Reuses reconcile-local-conflicts'
    merge_cards: comms unioned + deduped on (at|ts, from, text) and
    time-sorted; requests merged by id (more-resolved/newer wins);
    action/ask/pipeline per-key union; board scalars (column, note,
    claim, review_kind, awaiting_action) won by the newer `updated`;
    generic keys won by %A/ours (upstream during a rebase, the default
    branch during dispatch merges — matching both prior conventions).
    Parse/merge failure exits non-zero, which leaves the path conflicted
    for the existing upstream-wins + .local-conflict-* fallback.
    --selftest covers union, non-mapping, and unparseable sides.
  - .gitattributes — binds docs/ssot/kanban/cards/*.yml to merge=
    card-union. git-safe-pull.sh additionally self-arms
    merge.card-union.driver + the info/attributes binding on every run
    (per-clone config; info/attributes applies even while replaying
    commits whose trees predate this .gitattributes; driver path falls
    back to the running script's own copy for bootstrapping checkouts
    that have not pulled it yet). install-hooks.sh arms the same config
    for manual merges in every checkout.
  - scripts/git-safe-pull.sh — rebase failures no longer exit 1
    immediately: when the rebase cannot complete (>25 conflicted steps,
    --continue/--skip failure, conflict outside generated paths), a
    single `git merge $UPSTREAM` replaces the whole replay — one conflict
    point regardless of divergence depth. Cards union via the driver;
    other generated paths resolve upstream-wins (--theirs mid-merge —
    ours/theirs invert between rebase and merge) with the dropped local
    side preserved as .local-conflict-* exactly like the rebase path.
    Conflicts outside generated paths abort the merge and keep the old
    exit-1 contract. SAFE_PULL_NO_REBASE=1 skips the rebase entirely
    (testing knob / escape hatch).
  - scripts/board/dispatch_repos.py — _merge_in passes the card-union
    driver config into the close-out/merge-sweep `git merge --no-ff`, so
    a dispatch session's card writes union-merge with live board state
    instead of being dropped by the generated-paths --ours rule.
  - scripts/board/kanban-commit.sh — failure streak: every nonzero exit
    bumps $gitdir/kanban-commit-fail-streak; at KANBAN_FAILURE_ALERT_AFTER
    (default 3 ~= 45min of dead ticks) alert_card upserts
    ops-kanban-commit-guard with a static note (bumps `updated`, no
    per-tick comms spam). A healthy tick clears the counter; recovery
    after an alerted streak appends "recovered after N consecutive
    failed ticks" to the alert card.
  - tests/test-kanban-commit.sh — cases H (both-sides card divergence
    union-merges inline during pull --rebase, pushed to origin), I
    (SAFE_PULL_NO_REBASE merge fallback unions cards + upstream-wins
    non-card generated paths with sidecar preserved), J (3 failing ticks
    flag failure-streak on the ops card; recovery clears the counter and
    leaves a comms line).

write_path_decision: |
  Spec item (2) — accept, don't gate. Dispatch worktree merges keep
  carrying card-file writes (pre-commit already permits them via
  CHABA_ALLOW_CARD_COMMIT=1); the card-union driver makes concurrent
  writers converge mechanically on both ingress paths (kanban-commit
  pull, dispatch close-out merge). Gating card diffs out of dispatch
  merges was rejected for now: it would silently drop session writes the
  moment a served-side edit raced them, and board-api-from-worktree is
  not always reachable mid-session. board-api remains the preferred
  write path for live mutations; the driver is the convergence layer.
  If a dispatch write proves harmful, tighten per-field ownership later
  rather than rejecting card diffs outright.

verify:
  - "python3 scripts/board/merge-card-yaml.py --selftest — OK"
  - "python3 scripts/board/reconcile-local-conflicts.py --selftest — OK"
  - "bash tests/test-kanban-commit.sh — 59/59 (A–J), incl. union rebase,
    merge fallback, and the failure-streak alert+recovery"

gotchas:
  - "Union never propagates deletions: a comm or request removed on one
    side survives if the other side still has it (same caveat as the
    sidecar reconciler). Cards are append-mostly; treat deliberate
    deletions as manual ops."
  - "Scalar winner is decided by the card's `updated` stamp (minute
    resolution) — a stale/back-dated `updated` can flip column/claim to
    the wrong side."
  - "The merge fallback creates a merge commit on master — history stays
    correct but non-linear for that tick. Fallback only fires when the
    rebase could not complete; the common path is still rebase."
  - "The driver only runs when the merge.card-union.driver config AND
    the attribute binding are armed — safe-pull self-arms both per run,
    install-hooks covers manual merges. A brand-new clone before its
    first safe-pull has neither until this commit's .gitattributes is in
    the tree."
  - "kanban-commit's recovery note commits AFTER the successful push —
    it rides the next tick's push (board reads local state anyway)."
  - "failure-streak alerting still surfaces only on the board (+journal)
    — a fully wedged writer can write the card but not push it; it is
    visible on the served board immediately."
