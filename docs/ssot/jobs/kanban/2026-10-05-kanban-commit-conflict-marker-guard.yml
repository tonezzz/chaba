title: kanban-commit conflict-marker guard
subtitle: Commit loop refuses mid-rebase state and staged conflict markers; alerts via ops card
icon: shield
version: 1

card: kanban-commit-conflict-marker-guard
date: 2026-10-05
dispatch: 20261005-151544-scripts-board-kanban-commit-sh

incident: |
  2026-10-05 ~14:20: kanban-commit.timer committed card files captured
  mid-rebase with <<<<<<< / ======= / >>>>>>> markers intact
  (logs-auto-*.yml x6 + coverage). The poisoned YAML then failed
  yaml.safe_load in render-board.py and kanban-dispatch.py on the NEXT
  run — both loops dead ~15 min until manual cleanup. The failure class
  was silent: it surfaced only because dispatch also died.

root_cause: |
  Old order in kanban-commit.sh: `git add` -> commit -> `git pull
  --rebase --autostash` -> push. When the pull/rebase conflicts it leaves
  rebase-merge/ state + conflict markers in the worktree; the next tick's
  `git add` stages the conflicted files (marking them 'resolved' in the
  index) and the commit writes the markers into git history.

implementation: |
  scripts/board/kanban-commit.sh — two refuse-gates before the commit:
  1. Mid-operation gate (runs BEFORE `git add` so conflicts can't be
     accidentally 'resolved' by staging): refuse when
     $GIT_DIR/{rebase-merge,rebase-apply} exist or MERGE_HEAD/
     CHERRY_PICK_HEAD is set.
  2. Marker gate (after staging): `git diff --cached --check` — grep its
     output for 'conflict marker'. Only NEWLY-ADDED marker lines flag
     (context lines don't), so a file that already contains a marker at
     HEAD can't wedge the loop. Catches <<<<<<< / ======= / >>>>>>> /
     ||||||| base markers; trailing-whitespace warnings do NOT block.
  On refuse: log file:line to stderr (journal), upsert
  docs/ssot/kanban/cards/ops-kanban-commit-guard.yml under the
  /tmp/board-api.lock flock (the sanctioned direct-write path), exit 1.
  Card dedups — same note while open only bumps `updated`, so a
  persistent poison doesn't spam comms every 15 min; a changed file-set
  or a re-hit after close appends comms and re-opens (column -> review).
  The alert card itself lands in git on the next healthy commit since it
  lives under the watched cards/ dir.

notes: |
  - kanban-sync.sh was reviewed for the same vector and left alone: it
    only `git merge --ff-only` (can never leave rebase state) and commits
    machine-generated cards — near-zero marker risk.
  - render-board.py / kanban-dispatch.py still die on poisoned YAML if
    markers arrive another way (e.g. pushed from a second checkout); a
    parse-tolerant loader is separate work.

verification: |
  Scratch bare-remote + clone inside the worktree, KANBAN_REPO pointed
  at it, seeded with ssot.kanban.yml + render-board.py:
  - clean run: commits 'board: live card updates' + pushes (unchanged)
  - card with <<<<<<< planted: exit 1, stderr lists
    'docs/ssot/kanban/cards/test-card.yml:{3,5,7}: leftover conflict
    marker', zero new commits, ops-kanban-commit-guard.yml created with
    note naming the file, column review
  - repeat run while poisoned: still refuses, comms stays at 1 entry
  - mkdir .git/rebase-merge: refuses BEFORE staging ('rebase/merge/
    cherry-pick in progress'), second comms reason logged
  - markers fixed: next run commits normally; the alert card rides along
    into git history
  - trailing-whitespace file: commits fine (not blocked)
