context:
  user_request: >
    Tony 2026-10-08: repos pin a GitHub-only SSH key (core.sshCommand),
    so dispatch runners without that credential can't push — close_out's
    push step dies and finished branches strand on the runner worktree
    (six manual fetch-over-ssh salvages in one night; the 32h
    yt-dub-cuefit zombie nearly lost finished work). The merge guard
    correctly detects unmerged work but nothing lands it. Build a dell-
    side sweep that fetches the branch straight off the runner over
    tailscale ssh and merges it, strict stop-and-report on conflicts;
    plus a zombie lane for devin-task-* units running >6h with no
    activity — flag, never kill.

design:
  pipeline: >-
    scripts/board/merge-sweep.py (merge-sweep.timer, 15min, tony-dell):
      1. enumerate cards in doing/review with action.type=dispatch
      2. resolve task_id — action.task_id, claim.session, the comms
         'started devin-task-<id>' line, or the runner's
         ~/.local/share/runner-agent/state.json
      3. probe the recorded runner over `ssh <host> python3 -` —
         meta.json pattern ($DISPATCH_DIR/tasks/<id>/meta.json),
         worktree presence, `git status --porcelain` dirtiness, HEAD,
         repo root; falls back to the runner's own repos.conf branch
         scan when the worktree was pruned
      4. skip in-flight sessions (task still active on a probed host);
         flag stale-running, failed, dirty, and gone sessions once via
         action.sweep.* stamps
      5. `git -c core.sshCommand=ssh fetch <runner>:<worktree> HEAD` in
         the SERVED checkout — the -c override is the point: the repo's
         configured sshCommand is a GitHub-only key that cannot reach
         tailnet hosts; plain ssh uses ~/.ssh/config (tailscale)
      6. dispatch_repos.merge_state vs origin/<default> — already an
         ancestor => stamp action.verified, silent otherwise
      7. merge --no-ff in a throwaway detached worktree of the served
         repo -> push HEAD:<base> (close_out's shape — the live working
         tree is never touched; one resync+retry on push race)
  conflict_policy: >-
    STOP-AND-REPORT, strictly: any conflicted path aborts the merge,
    names the files in comms, and raises a merge-conflict<N> request on
    the card naming the paths for human resolution. Unlike close_out's
    safe-pull conventions (generated paths auto-resolve upstream-wins,
    dispatch-outcome*.md session-wins) the sweep never silently takes
    either side — the branch may carry state a human already reviewed.
    One open request per conflict event; a re-conflict after an answer
    gets a new request id.
  served_checkouts: >-
    MERGE_SWEEP_TARGETS map — chaba -> ~/CascadeProjects/chaba-tony-dell,
    ada-pi -> ~/CascadeProjects/ada-pi; anything else falls back to its
    repos.conf path. Single-writer: merges happen in detached worktrees
    + push, so the served working tree converges through kanban-commit's
    existing safe-pull; card comms/requests go through board-api when
    reachable, else direct YAML under the shared /tmp/board-api.lock.
  zombie_lane: >-
    devin-task-*.service units on dell + every runner recorded on a
    card + MERGE_SWEEP_HOSTS (tony-omen,mn01) — probed in the same pass
    via `systemctl --user list-units` on each host. 'Activity' = newest
    mtime among the unit's cgroup processes' devin_<ts>_<pid>.log files
    (the `devin acp` child logs continuously) and the task dir —
    transcript.json only exists at session exit, so log mtimes are the
    only liveness signal. age>6h AND idle>60min => one card comms flag
    (or journal line when no card resolves). Never kills.

