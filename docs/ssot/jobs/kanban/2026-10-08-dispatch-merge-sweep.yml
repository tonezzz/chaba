title: "Merge-sweep: fetch stranded dispatch branches off runners, strict-merge into the served checkout"
subtitle: >-
  15min timer on tony-dell — the remedy half of the merge guard: runners
  that can't reach GitHub strand finished branches; the sweep fetches
  them over tailscale ssh and lands them, or stops and asks
icon: 🧹
id: 2026-10-08-dispatch-merge-sweep
status: done
owner: devin-dispatch
project: chaba
card: dispatch-merge-sweep
