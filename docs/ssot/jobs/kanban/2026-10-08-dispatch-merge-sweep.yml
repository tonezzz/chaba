deployment_notes: >-
  Timer install on tony-dell: copy systemd/merge-sweep.{service,timer}
  to ~/.config/systemd/user/, daemon-reload, enable --now. The service
  runs the script from the chaba-tony-dell served checkout — it picks
  this code up on kanban-commit's next pull; until this branch merges,
  install runs the worktree copy or waits for the merge. Env knobs:
  MERGE_SWEEP_TARGETS, MERGE_SWEEP_HOSTS, BOARD_API, ZOMBIE_AGE_H,
  ZOMBIE_IDLE_MIN, CHABA_REPO.

