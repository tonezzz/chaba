  wires the gaps listed in ssot.release-lifecycle.yml deployment.gaps:
  release:-tracked cards need [exp]/[alpha] in review and the full tag chain
  + soak in done; promote-lane.sh enforces [smoke]+soak before --confirm and
  runs the post-deploy smoke itself; dev-twin-smoke.py produces the playlive
  evidence
