design:
  opt_in: >-
    Cards join the lifecycle with a truthy `release:` field (convention:
    the lane name). Opt-in keeps report/chore cards exempt — no mass
    bouncing of existing cards.
  tag_convention: >-
    [exp] [alpha] [beta] [smoke] [rc] [prod] anywhere in comms text =
    stage evidence. Documented in ssot.release-lifecycle.yml
    evidence_convention + ssot.kanban.yml card_schema.
  checker: >-
    scripts/ada/lifecycle-check.py reads bars from the standard and runs
    inside kanban-sync.sh. review-column release cards missing [exp]/[alpha]
    and done-column cards missing any tag (or the soak bar) bounce to doing
    with a comms note naming the missing gate. It also stamps soak_until
    the first time a release card is seen in review (entry + soak_hours) —
    the soak timer lives on the card, and survives any review-entry path.
    `--gate <card.yml> --stage review|preprod|done` is the read-only mode.
  preprod_gate: >-
    promote-lane.sh with --card runs the checker's --gate preprod mode
    before honoring --confirm on a release card: [smoke] evidence +
    satisfied soak required — no dev-twin playlive evidence, no promotion
    (Tony 2026-10-08). Dry-run warns instead of refusing.
  post_deploy_smoke: >-
    Inside promote-lane.sh after the parity-after diff: prod /api/ 200 +
    parity-after rc==0 + bundle 200 (when in scope). PASS -> [prod] comms;
    FAIL -> exit 1 with the rollback hint and a [prod] FAIL comms — well
    inside the 30-min bar.
  dev_twin_smoke: >-
    scripts/home-assistant/dev-twin-smoke.py drives playlived
    (playwright-headless, token injected via hassTokens like
    snapshot-card.py; env/file/refresh auth from the lanes registry),
    probes the dev twin's dashboard for HA shell + rendered cards
    (optionally --views + --selector), saves screenshot + JSON verdict to
    reports/dev-twin-smoke/ and posts [smoke] comms to --card.

