title: Board automation-card dimmer — reachability fixes + verification
subtitle: collapsed per-column automation (N) groups, expandable, localStorage-persisted
icon: layout
version: 1

card: board-automation-dimmer
date: 2026-10-06
dispatch: 20261006-215500-render-board-py-cards-whose-id

summary: |
  Third pass on this card. The core dimmer landed in dcffce02 (2026-10-05):
  ids matching AUTO_RE = /^(cms|logs|gev|vcast|disk)-auto-|-auto-health$/
  collapse into a per-column "automation (N)" group (opacity-75, ▸/▾ caret),
  toggled by .auto-tog click and persisted in localStorage
  'board-auto-open'. The previous dispatch audited it and found one gap —
  a sidebar click on a collapsed automation card no-ops because the card
  isn't in the DOM — but its fix commit was lost when the branch was pruned.
  This pass re-implements that fix plus the adjacent filter gap, and adds a
  repeatable DOM-stub verification harness.

fixes:
  - scrollToCard(id): when the target is an automation card inside a
    collapsed column group, set autoOpen[col]=true + persist + re-render
    BEFORE querying .board-card — sidebar and needs-you clicks now reach
    collapsed auto cards (scroll + flash + modal all work). Persisting is
    required: an ephemeral expand would re-collapse on the next 30s poll
    and lose the scroll position.
  - render(): a group also renders open when the active card filter matches
    any of its cards (view-only — autoOpen untouched), so a query that only
    hits automation cards shows the matches.
  - applyFilter(): when the query matches an auto card not in the DOM it
    triggers one re-render (guarded by a .board-card[data-id] DOM check —
    after re-render the element exists, can't loop).

verification:
  - scripts/test-board-dom.mjs — runs the generated page's inline script in
    a node vm against a minimal DOM stub (parser + selector engine +
    localStorage + fetch stub returning the real cards.json). 31/31 checks:
    human cards always rendered, auto cards grouped under correct
    "automation (N)" badges, toggle expand + persist, persisted state
    survives re-boot, sidebar click auto-expands + scrolls + opens modal,
    filter reveals collapsed matches, no header when a column has 0 autos.
  - Run: python3 scripts/render-board.py && node scripts/test-board-dom.mjs

notes:
  - AUTO_RE is deliberately a superset of the card spec's (cms|logs)-auto-*
    + *-auto-health — gev-auto-*, vcast-auto-*, disk-auto-* are the same
    bookkeeping class and were collapsing already in dcffce02.
  - Generated artifacts (stacks/web/public/apps/board/index.html +
    cards.json) are gitignored; the live board picks this up on the next
    render run on tony-dell after merge.
