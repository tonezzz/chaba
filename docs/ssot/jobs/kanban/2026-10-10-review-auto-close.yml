notes:
- >-
  A verified card with an open merge-conflict request holds in review —
  the request is the visible signal for a human to resolve/close. The
  sweep explains the hold once via the close_held stamp.
- >-
  auto_close records use the same field shape kanban-act's mark_done
  writes (by/at/note) so board tooling sees one convention.
