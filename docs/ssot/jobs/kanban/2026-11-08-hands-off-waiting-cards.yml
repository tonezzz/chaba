subtitle: >-
  waiting_cards eligibility+preflight gate wired into kanban-dispatch and
  runner-agent (R3/R4 never autonomous), kanban-act independent-review
  gate for model reports, lifecycle Telegram via /publish, daily digest
  job, five read-only pilot cards
