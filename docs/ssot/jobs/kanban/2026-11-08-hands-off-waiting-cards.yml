context:
  user_request: >
    Tony asked whether backup/rebuild makes all waiting work safe to
    process unattended. Correct model: recoverability is data-class-
    specific — backups do not replace secrets, external identity,
    active DB writers, uncommitted work, or human deployment decisions.
    Card KNB-0928 asks to define AND implement the hands-off procedure:
    separate queue execution from auto-close, R0-R4 recoverability,
    preflight, stop conditions, deterministic verifier + independent
    review for model reports, Telegram summaries, dry-run, daily
    report, kill switch, readiness checklist, and five read-only pilot
    cards — extending kanban-act-loop/DevNest, not a parallel queue.

design:
  prior_art: >-
    The spec layer already existed (ssot.devin-autonomy.yml
    waiting_cards, written 2026-11-07; kanban-act T2 auto-close from
    kanban-act-loop). This session implemented the enforcement and
    reporting layers on top — no parallel queue was invented:
    kanban-dispatch remains THE claim path, runner-agent THE remote
    executor, kanban-act THE close path.
  canonical_module: >-
    scripts/board/waiting_cards.py — evaluate(card, env, push_probe)
    returns {eligible, never, recoverability, reasons, checks}.
    Eligibility requires action.type in {dispatch,script,container},
    explicit action.target_host/host, autonomy <= max_autonomy, declared
    artifact + verifier, no open requests, declared recoverability,
    passing preflight, and proven push credentials for dispatch repos.
    R3/R4 set never=True — deferred in every gate mode.
  gate_modes: >-
    KANBAN_WAITING_GATE (kanban-dispatch) / RUNNER_WAITING_GATE
    (runner-agent): off|warn|strict, default warn. Warn logs verdicts
    but still claims — the pre-contract backlog lacks recoverability
    declarations and strict-by-default would starve the queue. Declared
    R3/R4 are NEVER claimed in any mode (spec: never autonomous).
    Strict flips on after the day-3 checklist.
  preflight: >-
    Pass-level (kanban-dispatch main): kill switch, deploy-lock flock,
    disk floor (WAITING_DISK_MIN_MB, default 2048MB on the repo fs) —
    any failure freezes ALL claims. Per-card: queue capacity, R2 backup
    freshness/proof (WAITING_BACKUP_PROOF or backup_fresh=True —
    fail closed), stale-heartbeat ceiling. runner-agent mirrors the
    kill switch + disk floor inside _capacity_reason so /ready
    projections stay honest.
  lifecycle_notify: >-
    start/finish/fail/stalled -> board-api POST /publish canonical
    PublicationEvents (kind progress|milestone|alert). The server-side
    NoisePolicy debounces Telegram (600s/topic); start rides progress
    = card-audit only, finish=milestone, fail/stalled=alert. Works from
    any tailnet host because /publish is a REMOTE_WRITE_PATH — no host
    needs the loopback TG relay. Best-effort: a dead api never blocks
    a claim.
  model_report_gate: >-
    kanban-act.py: a card with report: or model_report: may not
    auto-close on self-referential checks alone — auto_done_when must
    include verified_true (merge-sweep/close_out stamp) or git_merged.
    Deterministic verifier + independent evidence, per spec.
  daily_report: >-
    scripts/board/unattended-report.py on chaba-unattended-report.timer
    (idc03, daily 08:30 ICT): preflight state, queue snapshot, gate
    verdicts for queued/starting cards, today's activity, metrics —
    reports/unattended-<date>.md + one Telegram milestone. Read-only.

