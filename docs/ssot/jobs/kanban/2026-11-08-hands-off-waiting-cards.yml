deployment_notes: >-
  Code reaches runners on the normal sync paths: kanban-dispatch runs
  from the served idc03 checkout (chaba-tony-dell — kanban-commit pull
  cadence); runner-agent deploys as a single file per host (copy
  scripts/board/runner-agent.py to each runner's agent path — check
  ssot.jobs.yml runner units for the deploy convention). The daily
  timer renders via render-jobs.py --install on idc03. Gate defaults
  are warn-mode everywhere — merging changes no claim behavior except
  the R3/R4 never-claim floor and the new preflight freezes (kill
  switch, deploy lock, disk<2GB), which are the intended safety rails.
  Flip to strict only after day-3 checklist + recoverability backfill.

rollback: >-
  KANBAN_WAITING_GATE=off / RUNNER_WAITING_GATE=off disables the
  eligibility gate without a redeploy; /tmp/no-kanban-dispatch remains
  the instant freeze; kanban-act gate is additive (holds more cards,
  never closes more). Revert is a normal git revert — no state files,
  no migrations.

