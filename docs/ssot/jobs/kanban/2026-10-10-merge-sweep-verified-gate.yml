title: "merge-sweep verified gate — verified means delivered, not merged"
subtitle: >-
  action.verified=true now requires a clean unit exit AND a real deliverable
  AND the card's auto_done_when contract; provable failures mark the attempt
  failed and requeue on the retry path
icon: 🛡️
