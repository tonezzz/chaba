title: "primer-efficacy: the compounding claim is CONTRADICTED — the primer is dead"
subtitle: >-
  scripts/board/primer_efficacy.py measures coverage, repeat-failure,
  and era success over the card corpus: 15 injections ever, last one
  2026-10-11, build() crashes on string comms, 96% of dispatches run a
  lane with no primer at all
