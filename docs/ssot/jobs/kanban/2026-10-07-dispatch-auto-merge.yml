title: "Dispatch close-out: checkpoint + push + auto-merge"
subtitle: >-
  Session-end merge step for dispatch cards — leftover files checkpoint,
  branch always pushed to origin, expected_goals gate, --no-ff merge
  into origin/<default> with safe-pull conflict conventions
icon: 🔀
id: 2026-10-07-dispatch-auto-merge
status: done
