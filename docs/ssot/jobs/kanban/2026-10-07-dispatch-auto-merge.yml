context:
  user_request: >
    Tony 2026-10-07: dispatch sessions finish real work but never merge
    it — 4 cards rescued in one evening (ada-remember-confirm-flake 7
    uncommitted files, speaker-profile-tool 12 files, yt-voice-dub-mode
    1 commit unpushed, google-token-loud-fail committed on tony-omen and
    never pushed). The merge-guard blocks review->done correctly, but
    nobody merges. Fix the cause: merge verified dispatch work without
    a human.

design:
  pipeline: >-
    dispatch_repos.close_out(card) — runs on the host that owns the
    worktree, inside kanban-dispatch phase B for local cards and inside
    runner-agent finish_pass for remote claims:
      1. checkpoint(worktree) — `git add -A` + commit any uncommitted
         leftovers on the session branch ("dispatch checkpoint: N
         leftover file(s) at session end [task-id]"). Replaces the old
         "worktree dirty — commit first" merge skip; the dirty-worktree
         comms warning stays as the checkpoint-failure path.
      2. push_branch — `git push -u origin <dispatch/…>` ALWAYS, before
         any merge attempt, so work is never local-only.
      3. merge_state — head already an ancestor of origin/<default> =>
         noop (docs-only/no-commit runs skip silently).
      4. goals_gate — card.expected_goals via scripts/lib/goals.py in
         the session worktree. Failed, malformed, or unverifiable goals
         hold the merge (comms lists the failing ids).
      5. detached worktree at origin/<default>; `git merge --no-ff
         --no-edit <branch>`; push HEAD:<base>. Push race => fetch,
         reset --hard to the new base, re-merge, push once more.
  conflict_policy: >-
    safe-pull conventions (scripts/git-safe-pull.sh): paths matching
    SAFE_PULL_GENERATED_RE (default ^docs/ssot/) resolve --ours —
    the default branch carries the served/generated state;
    dispatch-outcome*.md resolves --theirs (session scratch). Any other
    conflict aborts the merge, posts the path list to comms, and the
    card stays in review — not everything merges, and that is correct.
  remote_claims: >-
    runner-agent deploys as a single file (~/.local/bin/runner-agent on
    omen); it imports dispatch_repos from DISPATCH_REPOS_DIR, its own
    directory, or ~/CascadeProjects/chaba/scripts/board, then runs the
    same close_out against the card's expected_goals before POSTing
    finish. The merge's verified flag rides the finish body
    (board-api do_finish accepts verified:bool); comms notes post after.
    action.task_id is NOT needed on the card — the runner derives the
    task id from the unit name it started.
  verified_flag: >-
    action.verified=True on merged (kanban-dispatch writes it directly;
    remote runners send it in do=finish). False on conflicts or a held
    goals gate — "checked and NOT verified", so stale review cards keep
    surfacing in the needs-you band instead of looking merged.
  disable: "KANBAN_AUTOMERGE=0 disables the whole step (both callers)."

deviations:
