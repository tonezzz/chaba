title: "dispatch zero-commit epidemic — root cause: litellm/* lane model leaked onto `devin --model`"
subtitle: >-
  Oct 25 – Nov 8 dispatch sessions across tony-macbook, idc02, mn01 (and
  likely others) exited 1 within seconds-to-minutes producing zero commits —
  branch head == base tip, no sessions.db row, no transcript. Common
  signature found in devin CLI logs + a live repro: claim-time lane
  classification wrote `action.model = LANE_MODELS[lane]` (a litellm/*
  proxy alias) which runner-agent passed as DISPATCH_MODEL to
  devin-dispatch, so `devin -p --model litellm/...` died at launch with
  "Error: Unknown model". Fixed by devin-executor-model-routing
  (DEV-0958, landed 2026-11-24) + deployed fleet-wide; verified live.
icon: 🔍
