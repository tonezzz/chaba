context:
  ask: >-
    Card dispatch-zero-commit-sessions-epidemic: 10+ sessions Oct 26-27
    across hosts (tony-macbook, idc02, mn01) and lanes produced ZERO
    commits — pushed branch head = plain master commit, unit often ends
    Failed-exit-code yet reported ok. Sample a failed session journal on
    tony-macbook + idc02, find the common signature, fix it.
  signature: >-
    Task dirs show exit_code=1, NO transcript.json, NO run.*.log (pre-tee
    devin-dispatch), and NO row in ~/.local/share/devin/cli/sessions.db —
    the devin CLI never created a session. Parent log
    (~/.local/share/devin/cli/logs/devin_<ts>_<pid>.log.gz) ends right
    after `run_repl_mode: close`, before `Model resolution complete` /
    `spawned ACP agent child` / `ACP agent child spawned and initialized`.
    On tony-macbook the unit's exit_code lands <1-3s after prompt.txt is
    written. On mn01 one failure left a 0-line ACP-child log — the child
    died during init_cli (after log_maintenance, before unleash flags).
  smoking_gun: >-
    A "finished (ok)" card comm tail reads
    `exit=0 .6, deepseek-v4-pro | devin-task-...service: Main process
    exited, cod` — the journal tail is the END of devin's "Available:"
    model list (`...swe-1.6, deepseek-v4-pro`), i.e. the unit journal
    contains `Error: Unknown model: 'litellm/...'`. Live repro on mn01
    (devin 3000.15.14): `devin -p --model litellm/gemini-3.5-flash-lite`
    prints `Error: Unknown model` + the same Available list and exits
    immediately — no session, no work.
  root_cause: >-
    Pre-DEV-0958 runner-agent (git show of the 2026-10-28 revision):
    claim-time `classify_lane(card)` persisted `a["lane"]` and, for lanes
    in LANE_MODELS, `a["model"] = LANE_MODELS[lane]` — litellm/* proxy
    aliases — and the dispatch env block set
    `env["DISPATCH_MODEL"] = lane_models[lane]` for ANY lane hit,
    executor-blind. devin-dispatch.sh then ran
    `devin -p --model "$DEVIN_MODEL"` with no validation (the
    _model_preflight guard did not exist yet). `devin` rejects foreign
    provider ids → exit 1 → exit_code=1 → zero commits. Why intermittent:
    only cards that (a) got lane-classified into LANE_MODELS
    (free_lane/paid_frontier) AND (b) fell through to the devin path
    (no OPENCODE_LANES+profile resolution on that host) AND (c) had no
    valid action.model pin died; executor=devin pins, unclassified cards,
    and opencode-routed cards survived — the coin flip.
  secondary_bug: >-
    The same window's "Finished with result 'exit-code' recorded
    'finished (ok)'" misreport: old runner-agent collect() read
    ExecMainStatus=0/Result=success DEFAULTS from --collect'ed units.
    Current collect() reads task-dir exit_code FIRST, then unit fields
    only while LoadState=loaded, then journal — unproven exits report
    not-ok (dispatch_repos.unit_exit_evidence documents the same fix).

