title: Test gate venv resolution — per-repo interpreter for the merge test gate
subtitle: checkout .venv wins when it can import pytest; system python3 stays the fallback
icon: flask
date: 2026-10-13
card: dispatch-test-gate-venv
status: done
project: chaba
program: chaba-ci

summary:
  - |
    The dispatch merge test gate (dispatch_repos.run_test_gate, card
    ci-test-gate) ran every repo's suite under system `python3`. Repos
    whose tests need their own venv deps false-failed and held good
    merges — observed on the 2026-10-13 line-multihome dispatch to
    ada-pi: 42/42 green under `~/CascadeProjects/ada-pi/.venv`, red
    under system python3 (no google.genai), merge held.
  - |
    run_test_gate now resolves the interpreter per repo before running a
    python-led command. Order (gate_python): explicit
    REPO_TESTS[repo]["python"] pin → <tree under
    test>/{.venv,venv}/bin/python[3] → <canonical
    checkout>/{.venv,venv}/bin/python[3] → <repos.conf
    path>/{.venv,venv}/bin/python[3] → "" keeps system python3. The
    canonical checkout is resolved through `git rev-parse
    --git-common-dir`, so dispatch/merge worktrees (which carry no
    .venv of their own) reach the main checkout's venv.
  - |
    Every candidate is probed with `import pytest` — existence alone is
    not enough: chaba's `venv/` has no pytest, and letting it win would
    have flipped chaba's gate from system-python-real-suite to
    fail-open skip. Non-python-led commands (make, npm, shell) pass
    through untouched. Result dicts gain a `python` key naming the
    interpreter that ran, and `command` records the resolved command so
    held-merge comms show which python produced the failure.
  - |
    ada-pi needs no pin: its canonical checkout `~/CascadeProjects/
    ada-pi` owns `.venv` (pytest + google.genai present), so resolution
    lands there automatically on any runner whose repos.conf (or the
    BUILTIN_REPOS fallback) maps the name. Hosts with a differently
    located env can set REPO_TESTS["ada-pi"]["python"].
    dispatch-repos.conf's header documents the resolution for operators.

operator_notes:
  - |
    A venv that can import pytest always wins over system python3 — if a
    repo's venv exists but is stale (missing new test deps), the gate
    red-holds on a real failure rather than silently passing. Fix is to
    refresh the canonical checkout's venv, not to pin around it.
  - |
    Verified live on tony-omen: ada-pi resolves to
    `~/CascadeProjects/ada-pi/.venv/bin/python -m pytest tests -k 'not
    slow' -x -q`; chaba resolves to system `python3 -m pytest tests -x
    -q` because its `venv/` lacks pytest (probe correctly skips it).

verify: |
  python3 -m pytest tests/board -x -q  → 109 passed
  New tests in tests/board/test_dispatch_close_out.py:
    test_gate_venv_python_unholds_merge — synthetic held-merge e2e:
    suite red under system python3 (missing dep), green under the
    canonical checkout's .venv shim; merge lands, python/command assert
    the venv interpreter.
    test_gate_skips_venv_without_pytest — `python3 -S` shim venv is
    probe-rejected; gate falls back to system python3 and merges.
    test_gate_prefers_tree_venv_over_checkout — candidate order.
    test_resolve_gate_cmd_pin_and_nonpython — explicit "python" pin
    wins; non-python commands untouched.
