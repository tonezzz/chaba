notes:
- >-
  kanban-dispatch's separate retries_per_card park + the
  kanban-parked-retry-dead-end finding (attempts never resets) are
  untouched — this change is runner-local and shares no counter with
  them.
- >-
  A held card re-arms via the board ↺ Retry button (posts 'retry
  requested' comms) or a do=queue action. Hand-edited YAML re-arms are
  invisible to the ledger — the cap note on the card says which button
  to press, and wiping the ledger file is the ops escape hatch.
