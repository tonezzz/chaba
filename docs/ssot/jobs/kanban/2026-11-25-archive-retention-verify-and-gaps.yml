title: KNB-1178 archive retention — verify lane, close /cards?id= gap, date-only updated tolerance
subtitle: Dispatch re-queue audit of the done-card archive lane; two small fixes landed
icon: archive
version: 1

card: kanban-retention-archive-done-cards-olde-bba115
date: 2026-11-25
dispatch: 20261125-155532-proposal-devin-2026-11-08-disc

summary: |
  The card was re-queued by the overnight dispatcher although the archive
  lane shipped 2026-11-08 (PRs #120/#121) and was extended 2026-11-09
  (card cap, commit 2049bf1d76). This run verified the whole lane end to
  end and fixed the two real gaps found:

  1. /cards?id=<archived> returned an empty page even though /card/<id>
     resolved archived cards via the 60s archive index — the spec's
     "archive stays searchable" clause only half-held. do_GET /cards now
     falls back to _archive_index() on an id= miss and re-runs
     card_query over the archived card with the id param removed, so
     column/action_status/since/fields/comms_tail filters still apply.
  2. Auto-generated cards (runner-auto-*, disk-auto-*, cms-auto-*,
     audit-auto-*) stamp `updated` date-only ('%Y-%m-%d') — archive-done.py
     scan() skipped them as unparseable and do_archive rejected them, so
     they could NEVER archive. Both sides now accept '%Y-%m-%d' in
     addition to '%Y-%m-%d %H:%M' (mirrored _parse_updated helpers).

