    - "Deploy vcast-real.mjs to idc02 ~/apps/vcast-real/; restart vcast-real@6 + @7"
    - "One-time heal of the wedged kanban-sync worktree on tony-dell: cd ~/CascadeProjects/chaba-kanban-sync && git fetch origin && git rebase origin/master (or reset --hard — only generated card commits at stake)"
    - "Registry drift self-heals as each display re-registers once patched server.mjs is live (iPad/screen-1 -> slot 1, screen-5 -> 5, screen-6 -> 6, screen-7 -> 7); stale ada keys screen-2/screen-4 get force-claimed away by the patched headless on first boot — no manual /release needed"
    - "THEN run cast_recast_stale_lease + cast_switch_flow — they cannot pass while screen 6 doesn't exist and screen 4 is the offline iPad"
  deferred:
    - "screens 5/'Browser' and 1/'iPad' labels: real-device registry — confirm which physical device 'screen-5' is before assuming the convention map"
    - "registerDisplay is async — two concurrent registers for the same name can still interleave (pre-existing, low odds; a per-name mutex would close it)"

report:
  status: done
  completed_at: "2026-10-07 21:30 +07"
  summary: >
    Audit found the input-bridge test lane broken in three independent
    places and fixed all of them in-repo. (1) flap-check cadence was
    zero: vcast-auto-health.py was lost to an unmerged dispatch-branch
    prune — recreated with 8 lanes (relay, displays fleet+drift, flap
    journald count, flap-check on the DEPLOYED relay via podman, stale
    capture/camwall leases, audit-cast, cast-browser-proxy, yt-live-api);
    kanban-sync.sh now rebases its generated commits when a raced push
    wedges ff-pull. (2) The headless<->real lease handoff dead-ended on
    claim 409 — headless@2/@4 were dead on idc03 since Oct 05 while
    systemd showed them running; both clients now force-claim once on
    409, headless persists its api_key (VCAST_KEY_FILE) and retries
    forever on a 30s cap, vcast-real relaunches on claim timeout.
    (3) allocScreen pinned screen-N only in /claim — re-registers
    scrambled every slot on migration day; now all paths honor and
    re-home screen-N. Metric evidence: handoff-check attach 570ms
    cold-claim / 259ms warm reattach (budget 5s); flap events are now
    greppable in the relay journal. Live remediation (deploy + unit
    restarts + kanban-sync worktree heal) listed under needs_approval —
    the two verify scenarios can't pass until the fleet is back on its
    numbered slots.
