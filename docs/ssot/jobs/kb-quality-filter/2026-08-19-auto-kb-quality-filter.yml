title: Auto-KB Quality Filter
subtitle: Phase 1 of the Context Improvement Plan — eliminate low-value auto-generated KB entries
icon: target

planning:
  goal: |
    Add negative triggers and minimum content thresholds to the auto-kb skill so it no longer creates
    low-value entries, and archive existing low-value auto-generated entries in docs/kb/.
  scope: |
    - Update .agents/skills/auto-kb/auto-kb.mjs with negative triggers and content thresholds.
    - Run a scan of existing docs/kb/auto-chaba-*.md and archive low-value entries.
    - Success: zero new low-value entries; average relevance or quality above a minimum.
  success_criteria:
    - auto-kb rejects content with negative triggers or insufficient technical detail.
    - Existing low-value auto-kb entries are moved to docs/kb/archive/.
    - All SSOT files remain valid after any SSOT updates.
  risks:
    - Over-filtering removes useful entries; mitigate by reviewing archived files before final move.
    - MDDB index not updated after archive; mitigate by reindexing KB collections.
  resources:
    - .agents/skills/auto-kb/auto-kb.mjs
    - docs/kb/
    - docs/kb/archive/
    - scripts/ssot-validate-all.mjs
  owner: tony
  estimated_duration: 1 session
  related_focus:
    - label: Context improvement and optimization
      file: docs/ssot/ssot.focus.current.yml

