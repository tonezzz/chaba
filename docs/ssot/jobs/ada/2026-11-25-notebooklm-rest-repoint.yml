title: Repoint NOTEBOOKLM_REST_BASE_URL fleet-wide to idc02 :3011 (OPS-0732 / ADA-1328)
date: 2026-11-25
card: notebooklm-rest-base-url-points-at-dead-b8ef61
dispatch: dispatch-wt-20261125-094135-found-during-ada-lanes-run-on-
status: shipped-live   # 11 env files repointed, 9 running lanes restarted clean

summary: |
  Card spec assumed notebooklm-rest might be retired; it is not — the
  service migrated tony-dell -> idc02 (OPS-0725, 2026-10-17; ssot.services.yml
  already declared tailnet_url http://100.123.163.11:3011/v1). Every Ada lane
  env still carried the dead dell URL http://100.68.142.13:3011/v1, so all
  NotebooklmClient calls failed httpx ConnectError (degraded memory recall
  only — ws sessions unaffected). Repointed all live env files and
  restarted the running units. Also resolves sibling card
  notebooklm-rest-unreachable-from-idc03-k-c38158 (OPS-0732).

findings:
  - id: rest-not-retired
    detail: |
      notebooklm-rest.service is active on idc02 (this dispatch host),
      listening 127.0.0.1:3011 + 100.123.163.11:3011; GET /health/auth ->
      {ok:true,auth:ok}, keepalive fresh. The "retired" claim lived only in
      ssot.values.yml notebooklm.mcp_host_note (now corrected) and was
      repeated into scripts/ada/transcript-archive.py + ssot.jobs.yml notes
      (now corrected). notebooklm-mcp on mn01 is a different thing (MCP/nlm
      CLI, not the REST API).
  - id: scoped-key-auth-verified
    detail: |
      ada-michael scoped key from michael-ha/backend.env -> GET
      /v1/notebooks on idc02 returns HTTP 200 with exactly the 5 michael
      notebooks — key scopes survived the migration intact.
  - id: health-gate-gap
    detail: |
      Only ada-ai-kraut + ada-ha-tony carry an ExecStartPre gate and it
      curls MDDB http://100.102.134.91:11023/health — notebooklm :3011 is
      ungated everywhere. The dead URL ran for weeks with zero gate trips.
      Follow-up carded separately.
  - id: transcript-archive-target-ok
    detail: |
      ada-transcript-archive.timer on idc03 active/waiting, next Sun
      2026-11-29 05:15 +07; last run 2026-11-22 uploaded 100/0-fail. It does
      NOT use REST — uploads via `ssh mn01 'podman exec -i notebooklm-mcp
      nlm source add'` (mn01 notebooklm-mcp Up 5 weeks). No change needed.

