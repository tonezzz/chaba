      - ~/.config/secrets/ada-ha-michael.env        # -> ada-ha-michael.service (active, disabled)
  - repo: chaba worktree (this branch)
    files:
      - docs/ssot/infrastructure/ssot.values.yml    # mcp_host_note: REST not retired, lives idc02
      - docs/ssot/infrastructure/ssot.jobs.yml      # ada-transcript-archive note corrected
      - scripts/ada/transcript-archive.py           # docstring corrected (no behaviour change)

restarts:
  - idc03: ada-ai-kraut, ada-chaba, ada-ha-ada, ada-ha-tony, ada-kk (all active/running after)
  - tony-omen: ada-dev, ada-kk-dev (active/running after)
  - mn01: ada-ha-tony, ada-ha-michael (active/running after; UnitFileState stays disabled)

verification:
  - >-
    /proc/<MainPID>/environ NOTEBOOKLM_REST_BASE_URL=http://100.123.163.11:3011/v1
    confirmed on all 9 running units across idc03/tony-omen/mn01.
  - >-
    curl http://100.123.163.11:3011/health from idc03 -> HTTP 200.
  - >-
    journalctl --user -p err --since restart on all 5 idc03 lanes: 0 error
    lines. (NotebooklmClient only fires on conversation memory ops, so the
    first real recall is the true end-to-end proof — watch next ws session.)
  - >-
    grep -rln 100.68.142.13:3011 ~/.config/secrets on idc03/tony-omen/mn01
    post-edit: CLEAN (only .bak/_attic/from-dell archive files retain it,
    intentionally — point-in-time backups).
  - >-
    Fleet sweep: tony-dell, con01, tony-macbook have no live env files with
    the var; idc01 offline.

rollback: |
  Per-file backups at <env>.bak-nlmrepoint-20261125 next to each edited
  file; `systemctl --user restart <unit>` picks env back up. REST service
  itself untouched.

