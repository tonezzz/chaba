      - ~/.config/secrets/kk-ha/backend.env         # -> ada-kk.service :8007
      - ~/.config/secrets/ada-dev.env               # -> ada-dev.service (inactive)
      - ~/.config/secrets/ada-kk-dev.env            # -> ada-kk-dev.service (inactive)
  - host: tony-omen   # dev lanes migrated here 2026-11-18
    files:
      - ~/.config/secrets/ada-dev.env               # -> ada-dev.service (active)
      - ~/.config/secrets/ada-kk-dev.env            # -> ada-kk-dev.service (active)
  - host: mn01   # disabled-but-running standby lanes
    files:
