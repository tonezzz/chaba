context: |
  Two reported symptoms, three root causes, two repos.

  1) "Screen shown as idle despite a successful cast" (screen 1 = iPad).
     registerDisplay() replaced live[screen] with the new socket but left
     the previous socket fully bound: ws.screen still set, still in room
     vcast-N, and its queued `state` messages kept writing the registry.
     Two observable failure modes on every Safari/iPad ws flap:
       a) the zombie socket's late `state:idle` (its showIdle() queued
          before dying) overwrote the NEW display's real state report —
          /displays and vcast_list show `idle` while the screen renders
          the cast. The reverse direction (stale `nav` overwriting a real
          `idle`) was also seen in transcript 689daaa11c.
       b) when the zombie finally closed, releaseScreenByWs() did an
          unconditional live.delete(ws.screen), evicting the LIVE socket —
          /displays reported connected:false for a screen that was up.
     Commit e4bd25e2 fixed this class only for the /release (unpair) path;
     the re-register path stayed open.

  2) "Repeated confirmation requests for camera/cctv capture."
     _check_capture_confirmed() only demands confirmed=true when
     _is_secondary_turn() — a positively-identified NON-owner voice.
     Unrecognized speakers keep owner rights by design, so the loop
     requires a live wrong label. Transcript e564b39502 (2026-10-03
     11:04 ICT) shows it exactly: the very first 2 s audio chunk of the
     session identified as "KK" at 84%, which passed FIRST_ID_MIN_CONF
     (0.70) and bypassed the SWITCH_AFTER hysteresis — stamping Tony's
     own session as guest person.kk and auto-learning the junk audio
     into KK's voiceprint (own=0.85, self-reinforcing pollution). Every
     camera call then hit "camera capture by secondary speaker without
     confirmed=true"; retries with self-asserted confirmed=true were
     correctly stripped; each new camera request re-asked. User:
     "ออก KK อีกแล้ว" ("it said KK AGAIN" — recurring).

  3) KK's enrolled voiceprint on idc01 now contains auto-learned prints
     of misidentified audio — future false hits are more likely until the
     profile is cleaned. Tony's own prints also score only 0.25-0.35 on
     the ha-4d0e0dee mic, so he is unrecognized most of the time (which
     fails open to owner rights — safe, but identity-blind).

fixes:

  chaba (this branch, dispatch/20260928-171200):
    - path: stacks/web/input-bridge/server.mjs
      what: >
        registerDisplay() now detaches the superseded live socket for the
        same screen (ws.screen=null + leaveRoom + terminate) BEFORE
        live.set() — its queued state reports can no longer write the
        registry and its later close cannot evict the new registration.
        releaseScreenByWs() only live.delete()s when the closing socket
        is still the live one. `state` messages are only accepted from
        the socket that currently owns live[screen].
    - path: stacks/web/input-bridge/vcast-flap-check.mjs
      what: >
        Standalone verification: spawns server.mjs on loopback with a
        stubbed ADA_AUTH_URL (any key -> screen-9), drives wsA/wsB through
        a flap, asserts 7 invariants. Before the fix it FAILS on
        "stale wsA state write ignored" (registry=idle over real image)
        and "stale wsA close keeps wsB connected" (connected=false).
        After: all PASS.
      run: "cd stacks/web/input-bridge && npm i && node vcast-flap-check.mjs"

  ada-pi (APPLIED + DEPLOYED 2026-10-03 ~22:10 ICT — commit 7882580 on
  origin/main, live on all 4 ada services via deploy-ada.sh):
    - path: docs/kb/patches/ada-pi-speaker-id-first-id-hysteresis.patch
      base: ada-pi HEAD 79721bcc (+ f394a90/d630572 owner-reclaim, compatible)
      what: >
        speaker_id.py: removes the FIRST_ID_MIN_CONF confidence bypass —
        a NEW speaker label (first identification or switch) now always
        needs consecutive wins (FIRST_AFTER=2 first label, SWITCH_AFTER=2
        switch; env-tunable). Confidence is not evidence of multiplicity:
        one 2 s chunk can score high on a polluted profile, exactly what
        stamped session e564b39502 as KK. Also drops the now-dead
        ADA_SPEAKER_FIRST_ID_CONF env var.
        tests/test_speaker_id.py: existing hysteresis tests get a second
        establishing chunk; test_first_identification_immediate becomes
        test_first_identification_needs_streak; adds two regression tests
        (confident single first hit must not label; hit-then-miss must
        not label). Verified in a scratch tree: 25/25 unittest pass.
      apply: |
        cd ~/CascadeProjects/ada-pi
        git apply <this-repo>/docs/kb/patches/ada-pi-speaker-id-first-id-hysteresis.patch
        python3 -m unittest tests.test_speaker_id
        # then commit + push main, deploy: ssh idc01 ~/.local/bin/deploy-ada.sh

