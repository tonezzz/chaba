title: LINE voice enroll + recognize (file-input speaker ID)
subtitle: Members send 2-3 voice clips over LINE to enroll; the lane recognizes
  who is speaking on voice messages; person.tony keeps owner-tier on any lane
icon: target

planning:
  goal: |
    Close the file-input gap in speaker_id: all match/enroll paths required a
    LIVE session voice buffer, so LINE/TG archived clips could not be matched
    or enrolled (speaker_profiles match failed on a LINE session 2026-10-13
    19:41). Deliver embed_file/match_file/enroll_from_file, wire match into
    the LINE audio branch with a [voice:] persona context line, an
    enroll-on-clips flow bound to the caller's person.*, match_file/enroll_file
    tool actions, and the boss rule (person.tony recognized on any member lane
    keeps owner-tier identity per persons.yml roles).
  scope: |
    ada-voice only (staged as drop-in patches in integrations/ada-voice/). No
    push/deploy from this worktree — hand to deploy-ada.sh.
  success_criteria:
    - PyAV/ffmpeg decode of LINE m4a clips to PCM16 16k embedding on idc03
    - LINE voice clip -> relay tags persona turn '[voice: speaker=<name|unknown> score=0.xx person=...]'
    - Enroll roundtrip: 3 clips under voice-corpus/<caller>/ -> 4th clip matches
    - speaker_profiles gains match_file (read) + enroll_file (mutating, _may_mutate gate)
    - >-
      Boss rule: fresh positively-identified {full: true} speaker keeps
      owner-tier on member lanes; stale labels don't elevate
    - Deploy gates green: tool-lint clean, pytest tests/ all pass
  risks:
    - LINE m4a channel codec lowers cosine scores vs live-mic prints ->
      mitigated by enrolling FROM LINE clips (channel-matched prints) via the
      new flow; threshold stays 0.45 + 0.05 margin
    - Replay/similar-voice spoofing residual -> documented caveat in
      tool_guide; recognition is evidence, not authentication
    - >-
      Owner-tier elevation on false positive -> requires fresh positive
      identify (not stale label) AND {full: true} policy — narrow surface
  resources:
    - ~/CascadeProjects/ada-voice (idc03 production checkout as diff base)
    - ~/.local/share/ada-voice-corpus/line/user-kk/*.m4a real clips
    - PyAV av 15.1.0 already pinned in ada-voice .venv
  owner: devin (dispatch)
  estimated_duration: 1 session
  related_focus:
    - label: MEM-0572 identity leg
      file: docs/ssot/kanban/

processing:
  status: completed
  started_at: 2026-10-13T19:51:00
  steps:
    - id: 1
      label: Explore speaker_id.py / line_relay.py / tool_runner policy flow
      status: completed
      notes: |
        Live-session SpeakerSession path identified; shared scoring in
        _identify_scored_core; enroll() guards (EnrollConflict, own-voice
        merge check) reusable for file path.
    - id: 2
      label: speaker_id.py — decode_audio_file, embed_file, match_file, enroll_from_file
      status: completed
      notes: |
        PyAV decode -> PCM16 mono 16k (ffmpeg-CLI fallback), ADA_SPEAKER_FILE_MAX_S
        cap 120s; _rank_scores extracted from score_audio; _identify_scored_core
        gained emb= param; enroll_from_file normalizes person (user-kk/kk/person.kk).
    - id: 3
      label: line_relay.py — match_file on saved clip, [voice:] context, enroll-on-clips
      status: completed
      notes: |
        LINE_VOICE_MATCH/LINE_VOICE_ENROLL/LINE_VOICE_ENROLL_CLIPS/
        LINE_VOICE_ENROLL_TTL_S env knobs; pending enroll per caller; matched
        clip disarms; EnrollConflict disarms loudly; acks speaker-aware.
    - id: 4
      label: speaker_profiles tool — match_file + enroll_file actions
      status: completed
      notes: enroll_file is mutating via _may_mutate (full-access or own-person profile).
    - id: 5
      label: Boss rule in tool_runner — _speaker_is_owner_tier
      status: completed
      notes: policy_identity resolves to identified full-access speaker; _is_secondary_turn exempts fresh identified owner-tier; stale fails open to lane owner without elevation.
    - id: 6
      label: tool_guide docs + 30 new tests + regression fix
      status: completed
      notes: test_line_relay_group ack expectation updated to enroll offer.
    - id: 7
      label: Verify on clean copy of idc03 checkout
      status: completed
      notes: tool-lint clean; pytest 1360 passed +31 subtests; patches dry-run clean on pristine files.
  decisions:
    - label: Whole-clip embedding, single print per clip
      rationale: LINE clips are short (2-10s); matches the existing per-buffer model; multi-clip enrollment naturally builds multi-print profiles
      alternatives_considered: VAD/segmented per-clip prints — unnecessary complexity for short clips
    - label: In-memory pending enroll keyed on caller
      rationale: Relay-process scope is enough; restart just re-arms on next unknown clip
      alternatives_considered: Persisted pending state — overkill for a 15min TTL flow
    - label: "Owner-tier by {full: true} policy, not person name"
      rationale: Policy-driven per persons.yml roles — same elevation applies to any future admin person, and stale labels can't elevate
      alternatives_considered: Hardcode person.tony — narrower and drifts from persons.yml
    - label: Patches staged in chaba integrations/ada-voice, not applied to live checkout
      rationale: "Card rails: no push/deploy — hand to deploy-ada.sh; idc03 checkout is deploy-only, tony-dell is the edit point"
      alternatives_considered: Direct commit to tony-dell checkout — outside worktree sandbox
  changes:
