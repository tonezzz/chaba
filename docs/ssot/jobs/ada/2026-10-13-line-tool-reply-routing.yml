title: LINE tool reply routing — answers stay in the originating chat
subtitle: A persona's chat_send inside a turn used to fall through to the lane
  default room or the owner's DM; sessions now bind the originating chat and a
  bare send answers in-context
icon: route

planning:
  goal: |
    Card line-tool-reply-routing-answers-leave-th-5c73e7: LINE tool replies
    left the originating chat. Root cause: chat_send posts a bare /send to
    the relay, which resolved the target as _recent_chat[instance] ->
    LINE_LANE_DEFAULT[instance] -> first allowed user. _recent_chat was
    written keyed by persona name (kaewta) but read keyed by
    ADA_INSTANCE_ID (kk) — a dead map — so bare sends landed in the lane
    default room or the owner's DM. Fix: relay hands the originating chat
    to the backend at ws connect (&chat_id=), the runner records it in a
    per-session registry (SESSION_CHAT), and chat_send defaults `to` to it.
    /send also records each delivery under the instance key so the
    fallback map is keyed the way readers query it.
  scope: |
    ada-voice only, staged as drop-in patches in integrations/ada-voice/ (drop 6).
    No push/deploy from this worktree — hand to deploy-ada.sh on idc03.
    Pair card line-delivery-send-actual-images: image sends share the same
    /send path, so they inherit the in-context rule automatically.
  success_criteria:
    - Relay ws connect carries &chat_id=<originating chat> for DM and room
      sessions
    - chat_send with empty to= on a bound session posts to the originating
      chat; explicit to= still wins; LINE_LANE_ALLOW/LOCK still gate it
    - /send keys _recent_chat by ADA_INSTANCE_ID on delivery
    - ada-voice suite green + tool-lint clean on the patched tree
  risks:
    - Bound chat outside lane allowlist -> denied, not rerouted (intended;
      the gate vets the bound target like any other)
    - Unbound sessions (voice, PWA, pre-patch relays) -> identical old
      behavior, `to=""` falls back through the existing chain
  resources:
    - /tmp clone of tonezzz/ada-voice @ 98c8e26 as diff base
    - integrations/ada-voice/ staged-drop convention (drops 1-5)
  owner: devin (dispatch)
  estimated_duration: 1 session
  related_focus:
    - label: line-delivery-send-actual-images-not-jus-652ad3 (same /send path)
      file: docs/ssot/kanban/cards/line-delivery-send-actual-images-not-jus-652ad3.yml

