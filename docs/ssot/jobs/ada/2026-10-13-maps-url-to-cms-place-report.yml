install_runbook: integrations/ada-pi/README.md — Drop 4 section

gaps_and_notes:
  - "NO DEDUP: slug = place-<name>-<sha1(name|coords)[:6]> — same place
    under different name spellings produced three jj-j-bistro pages on
    day one. lane-place-reports.md rule 5 wants cms_read-before-publish;
    neither the tool nor tool_guide enforces it. Needs a follow-up
    card: tool-side lookup (or guide instructing cms_read first)."
  - "count_cap comment in ada-pi ssot.tool-surface.yml is stale
    ('103 builtin + 9 tools.d' vs actual 37+14=51 declared) — cosmetic;
    place_report went into coverage_debt, no cap bump needed (51 < 112)."
  - "ada-kk-dev.env has NO place_report and NO ADA_CMS_PUBLIC_BASE —
    intentional for now; kk-parity render adds the tool but the dev
    lane needs the PUBLIC_BASE line hand-set or public_url falls back
    to the surf-thailand.com derivation (dead end for h3-published
    pages)."
  - "ada-pi cms.py _cms_public_base() default derives
    surf-thailand.com/<tenant>-ha/ but the live publish lane is chaba.h3
    (cms-h3-publish.timer). The default is wrong for the h3 flow — every
    lane that wants public place pages needs the env override. Worth a
    card if a second lane is added."
  - "send-link-in-LINE miss that motivated this card: reply path
    verified working (200s on /v2/bot/message/reply during the live
    test); the tool contract puts the URL in the model's spoken/text
    reply rather than a structured send — no separate link-send step."
