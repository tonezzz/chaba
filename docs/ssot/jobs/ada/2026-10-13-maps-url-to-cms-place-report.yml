title: maps-url-to-cms — LINE maps link -> resolved place -> public CMS report -> link reply (kk lane)
id: 2026-10-13-maps-url-to-cms-place-report
card: maps-url-to-cms-line-maps-link-resolved-c418f8
ref: KNB-0574
date: 2026-10-13
status: shipped-and-staged
summary: |
  Tonezzz group members paste maps.app.goo.gl / google.com/maps links to
  Kaewta asking "ร้านนี้ยังอยู่มั้ย" / "สรุปที่นี่หน่อย"; Tony's
  directive (2026-10-12): 'shop report becomes a web page sent straight
  back — ask once get answer'. Prior dispatch built and deployed the
  ada-pi half (place_report tool, ada-pi 074c7a8+e24b14d, live on idc03
  ada-kk since 15:26); THIS dispatch staged the chaba-side record:
  integrations/ada-pi drop, persons/bench tool profiles, tests, this
  doc. Verified live end to end — real place pages already served on
  chaba.h3.gizmo-thailand.com/kk-ha/ via cms-h3-publish.timer.

flow: |
  LINE msg with maps URL -> place_report(url, ask, lang) ->
  expand shortlink + parse /place/<name>|!3d!4d coords ->
  Nominatim reverse/search enrich (no key) -> meta.public markdown page
  via cms_publish_page (collection ada-cms-pages-kk, domain places,
  fresh_for 30d) -> public_url returned -> model sends it in the reply.
  cms-h3-publish.timer on tony-dell (~15min) renders meta.public docs
  into the chaba.h3 branch -> Plesk static site.

deliverables:
  - file: integrations/ada-pi/backend/tools.d/place_report.py
    role: ada tool (staged record copy — byte-identical sha256 to idc03 deployed)
    detail: |
      place_report(url?, place?, ask?, lang?) — _parse_maps_url pulls
      /place/<name> + !3d!4d/@coords; _strip_code_tokens removes leading
      plus-code/house-number tokens from Google share strings;
      Nominatim reverse (coords) or search (name) enriches; publishes
      via runner.cms_publish_page(public='true', domain='places');
      returns {ok, slug, name, address, coords, resolved_url,
      publish{public_url,view_url}}. ADA_PLACE_REPORT_NOMINATIM /
      ADA_PLACE_REPORT_UA env seams.
  - file: integrations/ada-pi/backend/tools.d/manifest.place_report.yml
    role: manifest fragment (policy=read, secondary_allowed, timeout 60)
  - file: integrations/ada-pi/backend/tool_guide.place_report.yml
    role: model usage guidance (send public_url; privacy gate)
  - file: integrations/ada-pi/README.md
    role: Drop 4 install/contract/known-gap docs
  - file: docs/ssot/apps/ssot.apps.ada-persons.yml
    role: profile update
    detail: |
      place_report added to persons.kk.tools.include,
      bench_profiles.kk-cms-only and kk-parity. ADA_CMS_PUBLIC_BASE is
      NOT render-managed — it was hand-set on idc03 ada-kk.env
      (https://chaba.h3.gizmo-thailand.com/kk-ha/); noted in the profile
      comments so a re-render doesn't silently drop the requirement.
  - file: tests/ada/test_place_report_drop.py
    role: in-worktree verification (15 tests)
    detail: |
      Pure helpers (url parse, code-token strip, short-name, slug,
      page body) + run() end-to-end with fake httpx.AsyncClient and
      fake runner.cms_publish_page: maps-URL flow, url-in-ask
      extraction, name-only search path, no-input/publish-failure/
      expand-failure honest errors, manifest+guide fragment sanity.

verify:
  worktree: "pytest tests/ada/test_place_report_drop.py -> 15 passed"
