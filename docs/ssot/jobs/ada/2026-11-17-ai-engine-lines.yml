contract_v1_fixed_surface:
  - "/ws session endpoint + /api/health + /api/auth/* (mint/import)"
  - "caller keys per-backend (ADA_INSTANCE_ID-resolved), key->person binding"
  - "tier owner|member|guest enforced server-side by the engine"
  - "per-(channel,room,sender,persona) sessions, [persona->sender] reply tags"
  - "proactive only via lane relay send URL; lane-lock honored"
  - "loud failure for undeclared capabilities — never silent no-op"

key_findings:
  - "The swap mechanics already exist: LINE_NAME_BACKENDS / TG relay env /
    tailnet-serve mounts are config pointers — engine release is genuinely
    a config swap TODAY at whole-lane granularity."
  - "The one real limit: all instances share the idc03 ada-voice checkout —
    fleet-wide engine version is single. Parallel engine lines need
    per-engine runtimes (own checkout+venv or quadlet image). Carded."
  - "Engines can't be audited: nothing reports line/version/contract.
    Required before Ada2 is measurable. Carded."
  - "No named contract conformance suite exists; scenario-live subset is
    the natural gate. Carded."

artifacts:
