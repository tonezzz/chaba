title: Ada job-brief builder — card->context bundle (SSOT + KB + similar-card outcomes)
id: 2026-11-08-ada-job-brief-builder
card: ada-job-brief-builder
ref: ADA-1132
date: 2026-11-08
runner: idc02 (dispatch worktree)

verdict: >
  Briefs calibrate the defer boundary exactly where it was weak: on
  gemini-3.5-flash-lite the job brief buys +12pt action_accuracy and
  +10pt appropriate_deference with correction_precision -> 1.0, cutting
  fact-case over-deferral 47 -> 38 while going 29/30 -> 30/30 on
  defer-gold recall. On the already-calibrated `chat` brain the brief
  is flat within noise (deference 0.908 -> 0.908) — no regression.

built:
  brief_builder:
    path: scripts/ada-jobs/brief_builder.py
    related_ssot: mddb vector-search on content plane
      (ADA_BRIEF_MDDB_URL, default http://idc03.taila0626a.ts.net:11027/v1,
      collection infrastructure-ssot) + local docs/ssot keyword grep as
      the offline path (--offline or auto on mddb failure)
    kb_lessons: same search over chaba-lessons + kb-{development,features,
      operations,system}; top-3 each lane, pointers not hydrated docs
    similar_cards: TOP-3 TF-IDF nearest neighbors over
      scripts/bench/card-judgment/corpus.jsonl (the similarity index
      already existed — the corpus IS the judgment store), returned with
      category + decision_point + proven_right. Self excluded by card_id.
    render: compact === JOB BRIEF === block (~25 lines, truncated fields);
      header marks outcomes as evidence, not authority
  consumers:
    verify_lane: verify_worker.py --with-brief — builds + prints the
      bundle before her turn, injects as snap.job_brief; works in both
      the verify prompt and the cleanup-sweep prompt
    bench: score.py --briefs briefs.json injects per-case job_brief;
      briefs generated by brief_builder --corpus-briefs. Leave-one-out —
      the case's own card is excluded from neighbors AND from
      infrastructure-ssot hits so its own comms/outcome can't leak.
  degrade: mddb unreachable -> local ssot grep + corpus NN still return a
    bundle; the brief never blocks her turn (exception -> offline path)

live_demo: >
  verify_worker.py --once --card ada-verify-probe-job-brief --with-brief
  (litellm chat): probe card created via board-api, brief retrieved
  sibling probe cards ada-verify-probe-{board-api,litellm}-alive as its
  top-2 neighbors with their proven-right observe outcomes; she closed
  review->done citing GET /cards 200 — real card scored, bundle shown.

measured:
  bench: scripts/bench/card-judgment score.py --entity ada, 98 cases,
    temperature 0, via litellm http://100.102.134.91:4000/v1
  gemini-3.5-flash-lite:   # the weak-boundary brain — where the delta lives
    baseline: {acc: 0.4898, deference: 0.5102, corr_prec: 0.875}  # run13
    briefed:  {acc: 0.6122, deference: 0.6122, corr_prec: 1.0}    # run14
    delta:    {acc: +0.122, deference: +0.102, corr_prec: +0.125}
    detail: fact-case over-deferral 47->38 (act 25->18, observe 7->5);
      defer-gold recall 29/30->30/30 — both directions of the boundary
      move the right way; briefed run still misses T3 (0.61 << 0.90)
  chat:                  # the calibrated brain — regression check
    baseline: {acc: 0.9082, deference: 0.9082, corr_prec: 1.0}    # run11
    briefed:  {acc: 0.8980, deference: 0.9082, corr_prec: 1.0}    # run12
    delta: flat within noise (fact-case over-deferral 9 -> 9)
  artifacts: scripts/bench/card-judgment/run11-14*.{md,json} + briefs.json

notes:
  - The delta claim "evidence of past outcomes beats instinct" holds for
    brains at/below the boundary; a calibrated brain gains nothing yet —
    consistent with context mostly correcting miscalibration.
  - cf-* litellm aliases are ACL'd out for the chaba key — cf-llama-70b
    (verify_worker's primary brain) could not be benched from idc02;
    rerun on idc03 where CF envs exist, or grant key access.
  - corpus.jsonl is v3/98-case; briefs.json regenerates via
    --corpus-briefs whenever the corpus is rebuilt.
  - Flip consideration — --with-brief is opt-in on the flag today; the
    flash-lite delta argues for default-on in weak-brain lanes while
    `chat`-grade brains see no cost. Decision left to card comms.
