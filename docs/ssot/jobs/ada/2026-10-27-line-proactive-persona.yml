# Job trail: LINE relay proactive persona sends
# Card: line-proactive-persona (OPS-0468)
# Dispatch: 20261027-140132-relay-is-reply-only-today-a-pe (runner idc02)

title: Persona-initiated LINE sends — member DM + in-group @mention
card: line-proactive-persona
repo: ada-voice
base: main @ 56c67c1
delivery: drop-in patches under integrations/ada-voice/ (drop 17) —
  not applied/deployed from this worktree; install steps in the drop
  README section.

scenario_driver: |
  Tony asks kaewta for the kk-car photo -> kaewta serves it ->
  kaewta engages nhong about it herself (memory bank context). Until
  this change the relay was reply-only: a persona could answer a
  mention-routed turn but had no way to start a conversation with a
  member.

decision: |
  The outbound path already existed (/send endpoint + chat_send) —
  the real gaps were addressing, policy, and durable member naming:

  - intent='proactive' is a DECLARED contract: the relay can't infer
    turn semantics, so the backend marks persona-initiated sends and
    the relay enforces policy only on declared ones. Undeclared sends
    keep today's behavior — the gate only restricts, never re-routes.
  - mention= builds a real LINE mention object (mention.mentionees
    with UTF-16 index/length — len() undercounts emoji/Thai); display
    name via the per-member group/room profile endpoint, per the card.
    Unknown member names abort the send (400) instead of silently
    dropping the ping.
  - Policy lives in the relay (single enforcement point for all
    backends): LINE_PROACTIVE_ALLOW instance allowlist (empty =
    deny-all), per (instance,chat) AND per (instance,member) debounce
    LINE_PROACTIVE_DEBOUNCE_S=600, day cap LINE_PROACTIVE_DAY_CAP=8.
    State write-through to LINE_PROACTIVE_STATE so restarts don't
    reset. Ops trail: proactive_sent/denied/debounced +
    mention_failed events, proactive_msgs in the ledger rollup.
  - Owner-tier on the tool side: secondary (identified guest) turns
    can't pass mention=, intent='proactive', or to=<other chat> —
    PermissionError. A guest can converse; they can't make a persona
    ping someone.
  - Member-name resolution extended: label cache -> LINE_USER_CALLERS
    -> LINE_PERSON_ALIASES -> persisted MEMBERS_FILE (learned from
    profile fetches + registry writes) -> throttled mddb
    line-user-registry scan. Fixes to=<name> for members who spoke
    before the process came up.

