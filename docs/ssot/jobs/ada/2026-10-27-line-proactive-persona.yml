    - _mention_wrap() (UTF-16 mentionee offsets, group profile display
      names, ValueError on unresolvable member).
    - _proactive_gate() + load/save; /send parses mention=/intent=,
      runs the gate after target resolution before media fetch.
    - proactive_msgs added to the send_rollup ledger keys.
  backend/tool_runner/chat.py:
