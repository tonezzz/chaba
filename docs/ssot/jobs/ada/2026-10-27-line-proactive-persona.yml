limits:
  - Proactive is LINE-only this drop; tg/web channels note the drop.
  - mention= needs a group/room target; member DM is plain to=<name>.
  - The member registry only knows speakers seen since first-seen
    landed + persisted names — a member who never spoke still can't be
    addressed until bound in LINE_USER_CALLERS or seen once.
