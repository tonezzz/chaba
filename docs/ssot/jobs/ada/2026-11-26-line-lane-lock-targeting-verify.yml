findings: |
  VERIFIED as documented:
    - LINE_LANE_ALLOW allowlist + LINE_LANE_LOCK rewrite + last-room
      fallback all present in deployed code, config live, mechanism
      correct.
    - All three locked lanes (kk, kk-dev, chaba) have LINE_LANE_DEFAULT
      targets inside their own LINE_LANE_ALLOW sets -> the rewrite can
      never produce a self-inflicted 403.
    - Lock runs BEFORE the allow gate: a locked lane's effective
      reachable set is exactly {LINE_LANE_DEFAULT[inst]} — member DMs
      are unreachable via chat_send while locked (intended).
  NUANCES for the retirement decision:
    - _recent_chat is per-process memory with a 600s TTL: after a relay
      restart or 10 quiet minutes, context-free sends fall to
      LINE_LANE_DEFAULT (deterministic) then first-allowed-user.
    - _deliver_turn warms _recent_chat under the PERSONA key; only the
      chaba lane (persona==instance=='chaba') gets turn-warmed fallback.
      For kk/kk-dev/tony lanes the instance-keyed fallback is warmed
      only by prior /send deliveries — 'last room' means 'last room
      this lane pushed to', not 'last active conversation' (per-session
      accuracy comes from the ?chat_id= binding instead).
    - First-allowed-user fallback iterates a set — which of the 3
      member DMs wins can vary across relay restarts (hash order).
    - instance 'tony' (:8002, persona ada) is allowlisted WITHOUT its
      pinned group Cb75 — a bare chat_send inside an ada-home turn
      would 403. Latent only: Cb75 shows zero journal activity (group
      likely dead). Same class: dev/michael instances have no
      LINE_LANE_ALLOW entries -> exempt from the gate entirely.
    - Lane-targeted chat_send traffic is thin: 1 inst-tagged send in
      the ~2-day journal window. The lock is verified correct but has
      had almost no live exercise — 'targeting stabilises' evidence
      is mechanistic, not behavioral.

