verified_chain: |
  /send resolution order (line_relay.py ~2424-2545, deployed==main):
    1. uid = body.to or body.chat_id (explicit target; chat_send fills
       both with to_eff = explicit to= OR session-bound chat OR "")
    2. display-name resolution (owner alias, profile cache,
       LINE_USER_CALLERS, LINE_PERSON_ALIASES)
    3. empty + instance -> _recent_chat[inst] if age < 600s
       (LAST-ROOM FALLBACK — in-memory dict, wiped on relay restart)
    4. empty + instance -> LINE_LANE_DEFAULT[inst]
    5. empty -> first _allowed_users() entry (LINE_ALLOWED_USER_IDS)
    6. instance in LINE_LANE_LOCK -> uid rewritten to
       LINE_LANE_DEFAULT[inst] ('lane lock: %s send to %s rewritten')
    7. instance in LINE_LANE_ALLOW and uid not in allow[inst] ->
       403 'target outside lane allowlist' ('send denied' warning)
    8. deliver; _recent_chat[inst] refreshed on every inst-tagged send
  chat_send tool side: explicit to= wins; empty to= on a bound session
  posts the originating chat (in-context); unbound -> to="" -> chain above.
  LINE_LANE_ALLOW/LOCK vet the bound target like any other (403, not
  silent reroute) — matches README drop-8 contract + Oct-13 job spec.

