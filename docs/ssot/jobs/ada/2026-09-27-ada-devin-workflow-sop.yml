planning:
  goal: |
    Write down the standard Ada->Devin workflow so any session (or Ada
    herself) can follow it without re-deriving the pipeline: when Ada
    drafts vs when Devin executes, the handoff spec format (MDDB bank doc
    + rendered focus-inbox yml), the dispatch flow, and how outcomes are
    reported back into the handoff bank's job/<id> ledger.
  scope: |
    In scope:
      - docs/runbooks/ada-devin-handoff-workflow.md (the SOP, tier-1 runbook)
      - registration in docs/ssot/ssot.runbooks.yml
      - this job trail
    Out of scope:
      - Changing the dispatch scripts or Ada tools (docs only)
      - Syncing deployed ~/.local/bin dispatch scripts back into the repo
        (drift noted in processing step 3 — separate cleanup)
  success_criteria:
    - SOP covers Ada-draft vs Devin-execute split, spec format, dispatch,
      and outcome reporting including job/<id> ledger + needs-input loop
    - Runbook registered in ssot.runbooks.yml with verified status
    - ssot-validate-all passes
  risks:
    - 'Documenting repo scripts would describe stale behavior — the live
      ~/.local/bin copies lead the repo (job/ ledger, needs-input.txt,
      resume, ssh event fallback). SOP describes live behavior and flags
      the drift explicitly.'
    - 'Parallel dispatch sessions are actively modifying this pipeline
      (e.g. task 20260927-215500-separate-failed-devin-jobs-int) — SOP
      sticks to stable interfaces (bank schema, subcommands, ledger
      states) rather than flag/env minutiae.'
  resources:
    - scripts/devin/devin-dispatch.sh + deployed ~/.local/bin/devin-dispatch
    - scripts/devin/devin-dispatch-watch.sh + deployed watch
    - scripts/devin/render-handoff-inbox.py
    - ada-pi backend/devin_dispatch.py + DEVIN_* blocks in realtime_provider.py
    - MDDB ada-ha-bank-devin-handoff (specs + job ledger),
      ada-ha-bank-devin-tony (outcome docs)
    - Ref spec: docs/ssot/focus-inbox/handoff-extract-2026-09-27-fd98e6e49c-0.yml
  owner: tony
  estimated_duration: 1 session

