  - >-
    1-turn scenario-live smoke against ws://127.0.0.1:8002/ws: PASS,
    first turn in=18139 (text channel leaner than the 27.8k voice floor;
    under the trigger either way — no regression).
  - >-
    notebooklm-rest-api.env carries no ADA_CONTEXT_* (loads second in the
    unit — would have silently overridden).

