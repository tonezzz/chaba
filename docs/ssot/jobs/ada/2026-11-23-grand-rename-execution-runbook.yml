    persona: kaewta dev twin
    rename_to: ada-ai-kaewta-dev.service | kaewta-ai-dev.service; port target :8014 (free)
  - unit: ada-chaba.service
    port: 8008
    env: "EnvironmentFile=~/.config/secrets/ada-chaba.env (flat); ADA_INSTANCE_ID=chaba; inline ADA_API_KEYS"
