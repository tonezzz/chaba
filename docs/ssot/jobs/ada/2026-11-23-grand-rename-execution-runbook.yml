# ---------------------------------------------------------------------------
# Path layer — verified 2026-11-23
# ---------------------------------------------------------------------------
paths:
  mounts: "tailscale serve on idc03: /=>:8002, /ai/kraut=>:8003, /apps/ha/ada-tony=>:8002, /apps/ha/ada-michael=>:8003, /apps/ha/ada-ha=>:8006, /apps/ha/ada-kk=>:8007, /apps/ha/ada-dev=>:8005"
  idc02_caddy: "~/.config/caddy/Caddyfile rewrites /chatui* + /ada-ws/{tony,michael,dev,kk} -> /apps/ha/ada-* on idc03 — consumer side, change WITH mounts"
  idc03_caddy: "app.surf-thailand.com handle_path /apps/ha/ada-tony/* -> :8002 (public)"
  health: "GET /api/health (NOT /health — 404s); all 7 lanes 200 as of audit"

# ---------------------------------------------------------------------------
# Per-lane execution procedure (once scheme confirmed)
# ---------------------------------------------------------------------------
procedure_per_lane:
  - "stop+disable old unit; write new unit file under ~/.config/systemd/user/<new>.service (copy old, fix Description + unit name in drop-ins if referenced)"
  - "rename flat env if applicable (~/.config/secrets/ada-<x>.env -> ada-ai-<role>.env) and repoint EnvironmentFile; HA-lane per-home dirs (<home>/backend.env) are home-scoped — do NOT rename unless retargeting ADA_KEYS_FILE + telegram-*-bot.env + consumers"
  - "key pools already per-home (<home>/keys.json) — no rename needed; leftover flat ada-ha-*-keys.json are unreferenced cleanup candidates"
  - "tailscale serve: add /ai/<role> proxy to new port; keep old /apps/ha/<name> mount during alias grace"
  - "idc02 Caddyfile: repoint /ada-ws/<x> + /chatui rewrites; reload caddy"
  - "verify: curl :PORT/api/health 200; PWA path 200 via tailscale URL; ws connect check; grep journal for startup errors"
  - "only then drop old unit file + old serve mount (phase 7)"

open_requests:
  - "scheme: family-first ada-ai-<role> (deployed, recommended) vs persona-first <role>-ai (stale spec text)"
  - "ada-chaba :8008 + ada-ha-ada :8006 dispositions (not in original map)"
  - "kaewta :8004 occupied by obsidian — move obsidian or keep :8007"
  - "member-ai :8001 — confirm no unit needed (root served by :8002)"

