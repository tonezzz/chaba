  - unit: ada-kk.service
    port: 8007
    env: "EnvironmentFile=~/.config/secrets/kk-ha/backend.env; ADA_INSTANCE_ID=kk"
    keys: "~/.config/secrets/kk-ha/keys.json"
    serves: "/apps/ha/ada-kk; idc02 /ada-ws/kk + /chatui; kk member node idc03:8126"
    persona: kaewta (KK)
