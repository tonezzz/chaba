    port: 8002
    env: "EnvironmentFile=~/.config/secrets/tony-ha/backend.env (+notebooklm-rest-api.env)"
    keys: "~/.config/secrets/tony-ha/keys.json via ADA_KEYS_FILE; ADA_INSTANCE_ID=tony"
    serves: "member/guest root via tailscale-serve / -> :8002 (since ada-pi-pwa retired 2026-11-17); /apps/ha/ada-tony; idc02 /ada-ws/tony + /chatui; public app.surf-thailand.com /apps/ha/ada-tony"
    persona: chaba (Tony's voice lane; PWA name 'Chaba AI')
    rename_to: ada-ai-chaba.service (family-first) | chaba-ai.service (persona-first)
  - unit: ada-ai-kraut.service
    port: 8003
    env: "EnvironmentFile=~/.config/secrets/michael-ha/backend.env"
    keys: "~/.config/secrets/michael-ha/keys.json; ADA_INSTANCE_ID=michael (pins banks)"
    serves: "/ai/kraut (live) + legacy /apps/ha/ada-michael; idc02 /ada-ws/michael"
    persona: kraut (Michael)
    status: DONE — first lane migrated 2026-10-16
  - unit: ada-dev.service
    port: 8005
    env: "EnvironmentFile=~/.config/secrets/ada-dev.env (flat); ADA_INSTANCE_ID=dev; inline ADA_API_KEYS"
    serves: "/apps/ha/ada-dev; idc02 /ada-ws/dev"
    persona: shared lab (tony lane dev twin)
    rename_to: ada-ai-dev.service | ada-ai.service
  - unit: ada-ha-ada.service
    port: 8006
    env: "EnvironmentFile=~/.config/secrets/ada-ha/backend.env; ADA_INSTANCE_ID=ada"
    keys: "~/.config/secrets/ada-ha/keys.json"
    serves: "/apps/ha/ada-ha"
