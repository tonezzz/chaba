findings:
  - id: venv-shebang-rot
    detail: |
      idc02 ada-voice/.venv was created while the checkout lived at
      ~/CascadeProjects/ada-pi (pyvenv.cfg command line still says so);
      after the rename every console script (uvicorn, pip, pytest, ...)
      kept shebang #!.../ada-pi/.venv/bin/python3 -> 203/EXEC on exec.
      The long-running ada-lab process masked it until restart. Fixed
      by sed on .venv/bin/* only; .pyc caches still embed the old path
      (cosmetic — traceback paths only). mn01 + idc03 venvs verified
      clean (shebangs already ada-voice).
  - id: auth-header
    detail: |
      notebooklm-rest auth is X-API-Key header, NOT Authorization:
      Bearer — Bearer returns 401 Invalid API key even with a valid
      scoped key. Worth remembering for manual probes.
  - id: lab-lane-gaps
    detail: |
      ada-lab.env carried the dead URL because the morning fleet sweep
      covered idc03/tony-omen/mn01 envs but not idc02 consumer envs
      (idc02 was only checked as the REST host). ada-lab also logs
      recurring ha.events connect failures to 100.68.142.13:8123 —
      separate HA-on-dell drift, NOT fixed here, card if it matters.

rollback: |
  Env backup at ~/.config/secrets/ada-lab.env.bak-nlmrepoint-20261125;
  `systemctl --user restart ada-lab.service` restores prior env.
  Venv shebangs are forward-only fixes (old path does not exist).

