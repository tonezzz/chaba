summary: |
  Revalidation dispatch for OPS-0732. The idc03-side fix from
  2026-11-25-notebooklm-rest-repoint.yml verified still live — no env
  edit or restart needed there. Fleet re-sweep found one consumer the
  morning sweep missed: idc02 ~/.config/secrets/ada-lab.env still
  pointed NOTEBOOKLM_REST_BASE_URL at dead tony-dell :3011. Repointed
  and restarted ada-lab.service; the restart exposed a pre-existing
  broken venv (all 20 console-script shebangs referenced the renamed
  ada-pi path) which was repaired in place. Service verified end-to-end.

