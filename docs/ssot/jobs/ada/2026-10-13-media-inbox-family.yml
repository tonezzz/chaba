findings: |
  Lane attribution model (not spelled out in the standard): a manifest
  line belongs to the RECEIVING persona's lane — the relay stamps
  `persona` (and `caller`) at ingest, the generator maps persona->lane
  (ada/chaba->tony, kaewta->kk, kaewta-cms->kk-dev). Legacy lines without
  persona fall back to MEDIA_INBOX_CHATS (the lane's chat ids); on idc03
  that is kk's family group C822026077530a29620b5041bd1a955c5, so the 2
  pre-existing manifest lines landed in ada-cms-pages-kk.
  mddb-cms on idc03 binds the TAILNET ip (100.102.134.91:11027), not
  loopback — timer env must use the tailnet address (first unit render
  used 127.0.0.1 and failed; fixed).

