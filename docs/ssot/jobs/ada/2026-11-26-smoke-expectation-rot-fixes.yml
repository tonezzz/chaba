summary: >
  Follow-up to 2026-11-26-smoke-regressions-triage.yml. All five items
  fixed in ada-voice commit 6c0aba5. Two extra findings beyond the card:
  (a) scenario-live.py's expect key is `no_calls`, not `calls_not` —
  ada_opencode_control turn2 was silently unasserted; (b) the
  'lang':'th' arg-shape miss root cause is that lang= was in the declared
  schema (enum en/th) but named nowhere the model reads — neither
  tool_guide's cms_publish_page entry nor DEFAULT_ADA_INSTRUCTIONS —
  so Thai publishes upserted the EN doc. tool_guide.yml now documents
  lang= (the repair-hint surface the lazy-schema path attaches on
  arg misses).

changes:
  scripts/scenario-live.py:
    - >-
      _mddb_base(): routes seed/seed_evict/cleanup posts by collection —
      ada-cms-*/chaba-*/kb-* + exact CMS names -> $MDDB_CMS_URL
      (default http://100.102.134.91:11027/v1), else ops :11023. Mirrors
      backend/mddb_client.py is_cms_collection; fixes cleanup 404s that
      left every cms_* fixture behind (kk-site-test public ~6wk,
      translate-probe en/th/de litter). Same bug existed in run_seed —
      kk_cms_only_seeded_recall's ada-cms-pages-kk-dev seed could never
      have worked.
    - >-
      _expand_tokens(): new {public_tenant} (ADA_PUBLIC_TENANT, default
      tony-ha) and {cms_collection} (ADA_CMS_COLLECTION, default
      ada-cms-pages) for lane-parameterized scenarios.
  tests/scenarios-live/ada_opencode_control.yaml:
    - >-
      turn2 calls_not -> no_calls (calls_not is not a driver key).
    - >-
      turn3 reworked to the approval-handshake contract: no_calls
      [ada_opencode_dispatch] + response assertion. A real receipt needs
      card envelope + board ask + Tony's yes inside the 600s TTL — not
      stageable in a smoke turn; gate refusal is the contract.
  tests/scenarios-live/auto_report_worthy.yaml:
    - >-
      calls_any widened to [ada_memory_search, cms_read, cms_get_page,
      cms_list_pages]; canonical source is the auto-report CMS page.
  tests/scenarios-live/cms_public_url_lane.yaml:
    - >-
      parameterized: {public_tenant}/{cms_collection} tokens; smoke
      defaults now match the ada-dev tony lane it actually runs on.
      Set ADA_PUBLIC_TENANT=kk-ha ADA_CMS_COLLECTION=ada-cms-pages-kk
      for the kk lane.
  tests/scenarios-live/cms_translate.yaml:
    - >-
      assertions kept as the regression tripwire; comments record the
      lang arg-shape finding.
  backend/tool_guide.yml:
    - >-
      cms_publish_page entry now documents lang= (en/th, default en) —
      root-cause fix for the missing 'lang':'th'.

