deploy_topology_gotcha:
  summary: >
    idc03's ada-voice `origin` is NOT github.com/tonezzz/ada-voice — it is
    `ssh://tony-dell/home/tony/CascadeProjects/ada-voice`, i.e. deploys pull
    tony-dell's LOCAL `main` ref. Pushing to GitHub alone does not make the
    commit deployable: dell's `main` must be fast-forwarded to origin/main
    first (it was 9 behind because the edit-point checkout sits on a
    feature branch). deploy-ada.sh reported 'already at origin/main
    (a060335)' on the first run — a stale-ref false negative that would
    have restarted prod on old code.
  fix_applied: >
    `git -C /tmp/ada-voice-ssot-get merge --ff-only origin/main` on tony-dell
    (that worktree has `main` checked out and was clean) moved refs/heads/main
    a060335 -> 5a5379a; idc03's next fetch saw it.
  lesson: >
    After pushing ada-voice to GitHub, verify `git -C
    ~/CascadeProjects/ada-voice rev-parse main` == `git rev-parse
    origin/main` on tony-dell before running deploy-ada.sh on idc03.

verification:
