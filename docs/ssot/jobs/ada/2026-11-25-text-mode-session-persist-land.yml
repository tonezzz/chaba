    'summary failed'/'session_summary failed' as ERRORs — no crash, service
    stayed active. Confirms persist is invoked on close and fails soft
    when the summarization LLM is unavailable.
  pending: >
    'next Sun 09:45 memory-distill reports >0 new docs' — time-based,
    cannot verify until 2026-11-30 09:45 +07. Inflow doc exists; distill
    reads the same collections.

