    ws://127.0.0.1:8009/ws?mode=text on ada-kk-dev (instance kk-dev, key
    user-kk-dev), one text turn -> response_completed -> ws close.
    Journal showed session 1b315de0ac closed then daily rollup
    regenerated over 1 session(s). MDDB POST /v1/search on
    ada-ha-recall-summary-kk-dev filterMeta kind=session-summary returns
    key session-2026-11-25-1b315de0ac, date 2026-11-25, contentMd a real
    LLM summary of the exchange.
  negative: >
    Same flow on ada-dev (:8005) — LiteLLM key ada-dev-2 is at cap
    ($10.004/$10, resets 2026-12-01, card budget-watch-ada-dev-2). Turn
