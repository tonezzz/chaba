verdicts:
  ada_opencode_control turn3:
    verdict: expectation-rot
    evidence: >
      ada-voice approval-handshake commits (9557656 bind dispatch to
      profile verifiers+approvals, e7cde59 exact retries,
      3425d27/d27be7c ask->respond->dispatch handshake prose in
      OPENCODE_INSTRUCTIONS realtime_provider.py:769). ada_opencode_dispatch
      now legally requires approval_receipt/issued_at/expires_at minted
      by a successful preflight + explicit user approval. Turn1 preflight
      FAILED (missing args); turn3 names a different nonexistent card
      with no receipt — refusing and narrating (what she did: ada_opencode
      + ada_persona) is correct. Expectation calls:[ada_opencode_dispatch]
      + result 'card not found' is unreachable without a staged receipt.
    fix: rework scenario — mint a real receipt in setup then dispatch a
      bogus card, or flip to calls_not + response assertion.
  auto-report-worthy turn1:
    verdict: expectation-rot (surface migration)
    evidence: >
      Canonical 'anything to report?' source is now the auto-report CMS
      page (ada-cms-pages key 'auto-report', generated by
      scenario-benchmark.py; body says 'Ada reads this page for
      anything-to-report questions'). She answered with real current
      data (fleet-jobs-report Nov-26 08:52, 7/323 timers failing) via
      cms_read x3 — the designed CMS-first path. ops-scenarios bank
      still exists but is no longer the expected route.
    fix: widen calls_any to [ada_memory_search, cms_read] or assert the
      auto-report page specifically.
  cms_public_url_lane turn4:
    verdict: expectation-rot + REAL hygiene bug (stray public page)
    evidence: >
      Scenario asserts kk-lane artifacts (/kk-ha/ URL,
      ada-cms-pages-kk cleanup) but the smoke suite runs it on ada-dev
      (ADA_INSTANCE_ID=dev, CMS_COLLECTION=ada-cms-pages -> tenant
      tony-ha). /tony-ha/kk-site-test.html is the CORRECT public_url for
      where the page landed. Cleanup targets ada-cms-pages-kk, so the
      tony-lane page is never deleted: ada-cms-pages/kk-site-test has
      been public=true since 2026-10-11, live at
      surf-thailand.com/tony-ha/kk-site-test.html (~6 weeks).
    fix: parameterize the scenario per lane or repoint to the kk
      instance; delete/unpublish the stray page (Tony decision — public).
  cms-translate turns 4-5:
    verdict: mixed — model arg-shape miss + REAL runner bug
    evidence: >
      'lang': 'th' absent from every tool_result and
      ada-cms-pages/translate-probe/th untouched since 2026-10-14 — the
      Thai publish never persisted (probable resubmit without lang='th',
      re-hitting the slug:en pending; turn5 cms_read defaulted
      lang='en'). The 'de' doc under translate-probe was written
      directly by a Nov-24 devin-dispatch, not via cms_publish_page —
      lang whitelist ('en','th') still stands (tool_runner/cms.py:408);
      German correctly routed to separate slug translate-probe-de.
      cms_get_page->cms_read merge still satisfies calls_any via alias.
    fix: watch whether the model passes lang='th' on Thai turns; see
      runner_bug for the cleanup half.

runner_bug:
