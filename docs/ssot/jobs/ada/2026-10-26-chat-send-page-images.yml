title: chat_send page=<slug> — CMS page images attached server-side in one batch
id: 2026-10-26-chat-send-page-images
card: chat-send-page-images
ref: ADA-0511
date: 2026-10-26
status: staged-drop (integrations/ada-voice drop 15; ada-voice install + deploy pending — not pushed, not deployed)

summary: |
  Prod probe 2026-10-12 showed Kaewta's photo-ask path nondeterministic:
  cms_read + image_url + deliver sometimes worked, sometimes invented
  URLs (surf-thailand.com/kk/…, unsplash → all 404), sometimes produced
  text-only phantom sends naming the page. Instruction-level fixes
  helped but could not enforce. The structural fix is page=<slug> on
  chat_send: the tool reads the CMS doc via mddb inside its background
  job, extracts every embedded image, and pushes the whole batch through
  the relay — one call cannot invent URLs or skip the read. Result notes
  report sent/failed per asset so her voice stays honest.

change:
  tool_runner: |
    backend/tool_runner/chat.py — chat_send gains `page: str = ""`.
    `_chat_send_page` queues `_chat_send_page_run` (same 'queued'
    contract). `_page_image_urls` extracts markdown ![..](..) + HTML
    <img src> in document order, dedupes, resolves site-relative and
    bare paths against LINE_URL_BASE (same default
    http://100.102.134.91:11023 the relay uses), caps at
    ADA_CHAT_PAGE_IMG_MAX (default 10). The job POSTs
    {text, image_urls:[...], caption, to, chat_id, instance} per relay;
    the response `images` list drives a per-asset sent/failed summary.
    `web` channel loops _chat_send_web per asset. say= rides the same
    payload. _chat_say_audio + _chat_notify factored out of
    _chat_send_run — no plain-path behaviour change.
  line_relay: |
    backend/line_relay.py /send accepts image_urls: each URL becomes
    its own image bubble via _image_msgs (fetch failures keep the
    honest "(image failed)" text bubble). Delivery chunks into
    consecutive <=5-msg pushes — the old msgs[:5] truncate silently
    dropped the tail of any stacked payload. Bulk class now parks the
    full msg list (_merge_msgs already re-chunks on flush). Response
    gains images:[{url, ok, status}] — delivered|parked|failed|
    fetch-failed per asset.
  tg_relay: |
    backend/tg_relay.py /send accepts image_urls → one send_photo per
    asset (each has its own failure→text fallback); send_photo now
    returns bool for the same `images` report shape.
  surface: |
    backend/realtime_provider.py — `page` added to the chat_send
    declaration (required: additionalProperties=false would reject the
    arg); image_url description now points CMS-image asks at page=.
    backend/tool_guide.yml — chat_send entry documents page='<slug>'.
    No tool-count change → no ssot.tool-surface count_cap bump.

