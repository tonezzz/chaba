notes: |
  Design choices worth knowing:
  - Advisory, not corrective: the ops event fires AFTER the write and
    does not roll back — the model self-corrects via the read-back
    note; QC counts write_fidelity events like phantom_write_claim.
  - Contradiction-only flagging: disjoint non-empty sets required, so
    a narration with no day/time/date facts never flags. Fact classes
    are deliberately narrow (weekdays, clock times, iso/slash dates) —
    numbers and proper nouns are too noisy for set-disjoint checks.
  - user-seed comparison is the stronger catch: it flags even when
    narration is entirely vague, because the seed turn itself carries
    the facts (bounded to last-3 user turns to dodge stale hits).
  - _FIDELITY_WRITE_TOOLS currently holds only cms_publish_page —
    cpt_post/wp_post writes could join the same check by extending the
    frozenset (their content arg has the same verbatim path).
