title: cms_publish_page write fidelity — narrated-vs-stored divergence guard
id: 2026-10-17-cms-write-fidelity
card: ada-cms-write-fidelity
ref: ADA-0732
date: 2026-10-17
status: staged-not-deployed
summary: |
  MEM-0498 (kk-cms-only memory bench, 2026-10-12) finding 2: during the
  suite Kaewta stored "Tuesdays" in cms_publish_page content while
  narrating "Mondays" aloud — the stored artifact and the spoken claim
  diverged, and the write persisted.

  Root-cause read (ada-voice a9a8cca): the write path is verbatim —
  tool_runner/cms.py cms_publish_page passes `content` straight to
  mddb_client.add_document -> POST /add {contentMd} with no transform;
  the confirm gate and slug/lang normalization never touch content.
  The divergence is therefore a MODEL slip: narration and tool args are
  separate generations that nothing binds. Not tool mangling.

  Fix shipped as ada-voice Drop 13 (three layers):
  1. tool-side post-write read-back — cms_publish_page re-reads the doc
     after add_document and returns stored_verified + stored_sha256 +
     stored_excerpt with a note directing the model to republish when a
     stored fact differs from what she told the user. A store-side
     mangle flips stored_verified=false; a read-back miss marks
     "unknown".
  2. provider-side write_fidelity ops event — at turn_complete,
     _fidelity_tokens extracts weekday/clock-time/date sets (en+th in
     one space) from the assistant narration AND the last-3 user turns;
     a publish call whose persisted content arg carries a CONTRADICTING
     set (both non-empty, disjoint) emits an advisory event for
     session-audit/QC. Final-segment-boundary only — fires at most once
     per turn; vague narration ("saved the page") cannot flag.
  3. bench-side deterministic assertion — kk_cms_only_seeded_recall
     turn 2 now requires call_args_contain for the seeded facts
     (Monday/Thursday/prime, en+th alternates) and pins
     calls_any: [cms_publish_page].

flow: |
  user seed -> model proposes -> confirm -> cms_publish_page(content)
  -> meta merge + add_document -> READ-BACK get_document ->
  stored_verified/stored_excerpt in the tool result (model self-check)
  -> turn_complete -> _write_fidelity_problems(narration, user-seed,
  publish-calls) -> write_fidelity ops event on contradiction ->
  session-audit scoreboard picks it up next sweep.

