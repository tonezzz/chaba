id: 2026-10-23-per-instance-secret-stores
title: Ada per-instance secret stores migration + ada-pi-pwa key-pool retirement
card: per-instance-secret-stores-migration
date: '2026-10-23'
runner: tony-omen
summary: >-
  Physical migration of Ada lanes to per-instance secret stores and
  retirement of the ada-pi-pwa shared key pool on :8001.

lane_stores:
  tony-ha:
    store: "idc03:~/.config/secrets/tony-ha/{backend.env,keys.json}"
    source: "ada-ha-tony.env + ada-ha-tony-keys.json (moved)"
    unit: ada-ha-tony.service (:8002) — EnvironmentFile repointed, ADA_KEYS_FILE pinned
    admin: fresh lane-own admin minted (was shared with ada-ai-kraut/ada-dev)
    verified: "GET :8002/api/auth/keys caller=admin, 42 issued keys incl. cms-viewer/user-guest/screen-*"
  michael-ha:
    store: "idc03:~/.config/secrets/michael-ha/{backend.env,keys.json}"
    source: "ada-ai-kraut.env + ada-ai-kraut-keys.json (moved)"
    unit: ada-ai-kraut.service (:8003) — EnvironmentFile + ADA_KEYS_FILE + telegram-mn-bot.env repointed
    admin: fresh lane-own admin minted
    verified: "GET :8003/api/auth/keys caller=admin, 2 issued keys"
  kk-ha:
    store: "idc03:~/.config/secrets/kk-ha/{backend.env,keys.json}"
    source: "ada-kk.env + ada-ha-kk-keys.json (moved)"
    unit: ada-kk.service (:8007) + telegram-kk-bot.env ADA_KEYS_FILE repointed
    admin: existing per-lane admin kept (already unique)
    verified: "GET :8007/api/auth/keys caller=admin, 9 issued keys"
  ada-ha:
    store: "idc03:~/.config/secrets/ada-ha/{backend.env,keys.json} (created)"
    unit: "ada-ha-ada.service (:8006) — NEW; env cloned from ada-dev + ada-ha HA token (tailnet :8125), fresh ADA_API_KEY + admin"
    tailnet: "/apps/ha/ada-ha -> :8006 added to idc03 tailscale serve"
    verified: "GET :8006/api/auth/keys caller=admin, empty keyring; HA event recorder subscribed"

dev_lane_admin_rotation:
  - "ada-dev.env (:8005) and ada-kk-dev.env (:8009) got fresh unique admins — the old cross-lane shared admin value is no longer live anywhere on idc03 (verified by grep; survives only in _attic-20261023 + *.bak files)"

shared_pool_retirement:
  repointed:
    - "input-bridge.container Environment=ADA_AUTH_URL -> http://127.0.0.1:8002; input-bridge.env ADA_ADMIN_KEY <- tony lane admin (vcast claim/redeem verification)"
    - "line-bot.env LINE_NAME_BACKENDS ada: -> ws://127.0.0.1:8002/ws"
    - "idc02 caddy-edge (~/.config/caddy/Caddyfile) tony-ha.surf-thailand.com /cms* + /api/cms* -> rewrite /apps/ha/ada-tony{uri}"
    - "idc02 vcast-real.env ADA_ADMIN_KEY <- tony lane admin; vcast-real@1/6/7 restarted, all active, re-claimed OK"
    - "idc03 caddy-edge (~/.config/caddy/Caddyfile) api.surf-thailand.com + 157.85.102.125.sslip.io catch-alls -> :8002"
    - "idc03 tailscale serve root / -> http://127.0.0.1:8002"
  stopped: "systemctl --user stop+disable ada-pi-pwa.service — :8001 closed; env kept at ~/.config/secrets/ada-pi-pwa.env (marked retired) for warm-DR restart"
  verified_after: "tailnet root + /api/auth/keys 200, /cms/ 200, enroll.html 200, api.surf-thailand.com 200, :8448 cms 200, LINE relay delivering, vcast screens re-registered"

household_yml:
  schema: docs/ssot/infrastructure/ssot.household.yml (new — people/roles-per-node/rooms/notable_devices)
  seeded:
    - "tony-omen:~/.config/home-assistant/household.yml (tony owner; kk/tony2/testo members; guest)"
    - "tony-omen:~/.config/ada-ha/household.yml (lab)"
    - "idc03:~/.config/kk-ha/household.yml (kk owner, nhong member, tony member)"
    - "michael-ha:/homeassistant/household.yml (michael owner, tony member)"

other_changes:
  - "mn01 standby envs: ada-ha-tony.env + ada-ha-michael.env admin values rotated to new per-lane admins; keys.json copies synced"
  - "idc03 ~/.local/bin/gemini-tier: globs */backend.env lane dirs, lane_var maps store paths, SERVICES updated (ada-ha-michael->ada-ai-kraut, -ada-pi-pwa, +ada-ha-ada)"
  - "pre-migration backups: ~/.config/secrets/_attic-20261023/ + *.bak-mig-20261023 unit/caddy copies"

ssot_updates:
  - ssot.secrets.yml — ada-device-keys slots rewritten to live lane stores; consumers updated
  - ssot.home-assistant.instances.yml — all four secrets blocks status: active; legacy_to_migrate removed; michael-ha lane renamed ada-ai-kraut; ada-ha store host corrected tony-dell->idc03
  - ssot.routes.yml — / -> :8002, /apps/ha/ada-ha -> :8006 added, ada-pi-pwa marked retired
  - ssot.apps.vcast.yml / ssot.apps.ada_pi.yml / ssot.apps.ada_ha.yml — :8001/shared-admin references updated
  - stacks/idc03/ada-pi-pwa/stack.yml — status retired-2026-10-23

followups:
  - "chaba repo scripts still reference flat env paths (deploy-ada.sh, sync-ada-state.sh, key-watch.py, rotate-ada-secrets.sh, secrets-inventory-cms.py + ~14 more) — need a follow-up pass to teach them the lane-store layout"
  - "mn01 caddy /apps/ada_ha* alias redirects to /apps/ha/ada{uri} which has no handler anywhere — pre-existing dead alias"
  - "idc01 unreachable from tony-omen at time of migration — its standby ada-pi-pwa/input-bridge copies still reference :8001-era config; refresh when idc01 is back"
  - "old shared admin value still exists in _attic + *.bak files on idc03/mn01/dell — inert but present; purge on next attic cleanup"
