    devin-bank-distill.timer — tony-omen AND idc02 (jobs.yml: canonical idc02)
    chaba-system-report.timer — tony-dell AND idc02 (jobs.yml: canonical idc02)
  Retire the stale copies on dell/omen (systemctl --user disable --now).
  idc02 expected_services also lacks the other rendered jobs
  (chaba-audit*, chaba-kb-audit, ssot-optimization-snapshot, camwall-*,
