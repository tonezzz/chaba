title: Customer-site lanes — per-site LINE group + app password (Option A)
subtitle: The approved model for onboarding real customer WP sites to
  LINE-driven maintenance — registry, isolation argument, runbook
icon: account-group
version: 1

card: line-wp-site-manager
date: 2026-10-27
dispatch: 20261027-155810-p0-wp-live-on-plesk-boards-sit
runner: tony-macbook
supersedes_open_q: open-q-from-spec-when-a-real-customer-si-952fee

context:
  decision: |
    Tony answered "proceed" (2026-10-27 15:37) to the card's open-Q
    request — the default proposal is now the standard: dedicated LINE
    group per customer-site, routed through the existing tony/kk-style
    lane pattern, backend holds a per-site revocable WP Application
    Password (~/.config/secrets/wp-<slug>.env). Option A identity map:
    LINE group/user -> lane -> site; the customer never sees
    credentials.
  why_not_the_alternatives: |
    - Split creds across two chats — rejected 2026-10-14 already: both
      halves persist in LINE history + the Yomi index, so the split
      protects nothing.
    - Per-customer password sent in chat (Option B) — fallback only;
      still puts a live credential in an indexed channel.
    - WP admin/master password anywhere near chat — never.
    - One shared "customers" lane with a site parameter — rejected:
      wp_client resolves creds from process env, so a `site` argument
      would let one customer's lane aim at another's site. Env binding
      is the isolation boundary; keep it.

model:
  topology: |
    customer LINE group --LINE_GROUP_PERSONA--> ada-<slug> lane
    (idc03, kk-clone) --env wp-<slug>.env--> WP REST on the
    customer's site. One lane instance per site; per-site app
    password minted on a dedicated low-privilege WP user, revocable
    in the customer's wp-admin without touching anything else.
  lane_profile: |
    Member-site tool set: wp_read, wp_update (policy:confirmed —
    dispatch-bound confirm gate, not self-asserted), wp_post,
    chat_send, cms_read + core memory/search. No HA tools (no
    ha_upstream for customer lanes), no internal ops tools. Optional
    own CMS collection only if the customer gets reports.
  isolation_proof: |
    wp_read/wp_update/wp_post all call backend/wp_client, which reads
    WP_SITE_URL/WP_APP_USER/WP_APP_PASSWORD from the lane's env. No
    tool exposes a site parameter — cross-site access is impossible
    by construction, not by filter. Fleet scripts pin sites via
    WP_BOARDS_ENV the same way.

