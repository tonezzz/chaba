deploy_checklist: |
  Nothing is live yet. To deploy, in order:
    1. Merge ada-pi dispatch/20260926-193151-ada-keys-apps to main; restart
       ada-ha-tony + ada-ha-michael (systemd user units on idc01).
    2. Commit HA config edits (scripts.yaml, configuration.yaml) and
       `ha core reload` (or restart) on tony-ha.
    3. cp stacks/tony-dell/tony-ha/www/{ada-users-card,ada-keys-card}.js ->
       ~/.config/home-assistant/www/ and bump ?v= in lovelace_resources.
    4. Deploy stacks/web/public/apps/ha/pair/ to mn01 caddy public + the
       tony-dell stacks/web public dir.
    5. Optional cleanup: drop the unused ada-pair-qr-card lovelace resource
       and delete www/ada-pair-qr-card.js + repo copy.
    6. Re-issue cms-viewer with apps=["view"] (or edit the keys file) so it
       shows View-only.
  Rollback: all changes are additive/backward-compatible — old callers send
  no apps and get the voice+chat default everywhere.

verification: |
