    ada-keys-apps worktree).
  - YAML parsed with a tolerant loader (scripts.yaml, configuration.yaml OK).
  - node --check on both card JS files and the pair page script — clean.
  - node scripts/ssot-validate-all.mjs — all files valid.
  - Post-deploy: pair a test key with apps=["view"], confirm the row shows
    only View + QR + Revoke, and View lands on /apps/ha/ada-tony/cms/.

