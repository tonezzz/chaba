title: LINE saves route to the right WP CPT (not just posts)
subtitle: New tools.d/cpt_post classifies LINE save-asks to expense/
  contact/reminder/asset with registered meta + saved_by attribution
icon: route
version: 1

card: line-cpt-writer-router
date: 2026-10-15
dispatch: 20261015-154713-line-saves-route-to-the-right-
runner: tony-macbook

planning:
  goal: |
    Card line-cpt-writer-router (OPS-0656): boards.surf-thailand.com has
    chaba-boards CPTs (asset, expense, contact, reminder, bench, report,
    xlate) but every LINE "post this" ask lands as a free-form wp_post.
    Route save-asks to the right CPT and fill registered meta: receipt
    photo -> expense (amount/vendor/date read in-turn), "save this
    contact" -> contact, "remind us" -> reminder, "asset: CR-V model X"
    -> asset w/ manual attachment. KK is boss of kk-home — her lane's
    saves attribute to kk without her naming herself.
  scope: |
    ada-voice staged drop-in only (integrations/ada-voice/ — drop 11) +
    chaba-boards plugin v0.5.1 (saved_by meta) + SSOT updates. No push,
    no deploy from this worktree — ada-voice lands via deploy-ada.sh on
    idc03; the plugin zip redeploys via wp-admin upload (Tony).
    Out of scope: reminder->calendar fan-out (record only), OCR inside
    the tool (the model reads receipt image turns directly), bench/
    report/xlate kinds (dedicated writers exist).
  success_criteria:
    - kind=expense|contact|reminder|asset writes the CPT + registered
      meta; wp_post stays the free-form path
    - title_standard composed server-side ("Expense — {vendor} {date}")
    - records land status=private; saved_by resolves person from the
      lane (kk lane -> kk) or explicit person=
    - contact/asset upsert by slug; expense/reminder always create
    - meta writes survive plugin version skew (saved_by needs >=0.5.1)
    - "ada-voice drop gates — tool-lint clean (coverage_debt entry),
      unit tests green"
  risks:
    - Model keeps routing saves to wp_post -> mitigated by DECLARATION
      reroute patch on wp_post + cpt_post guide text claiming the asks
    - Live plugin is 0.3.3, repo 0.5.1 -> meta degrade-retry keeps the
      record even if saved_by isn't registered yet
    - Thai-only names slugify empty -> md5 slug fallback keeps the
      upsert deterministic
  resources:
    - ada-voice checkout ~/CascadeProjects/ada-voice @ 41020cf
      (origin/main 18c0a01 — patched files identical on both)
    - integrations/wp-boards/chaba-boards.php registered-meta table
    - wp_client.create_post already had post_type/meta plumbing
  owner: devin (dispatch)
  estimated_duration: 1 session

processing:
  status: completed
  started_at: 2026-10-15T15:55:00
  steps:
    - id: 1
      label: Read card, wp_post/wp_client, tools_loader, chaba-boards meta
      status: completed
      notes: |
        wp_client.create_post already takes post_type+meta — the only
        plumbing gap was slug (upsert needs deterministic slugs; WP
        auto-slugs strip non-ascii so Thai names need an explicit slug).
        CPTs register no post_tag taxonomy — person attribution can't
        ride wp_post's person tag; added saved_by meta instead.
