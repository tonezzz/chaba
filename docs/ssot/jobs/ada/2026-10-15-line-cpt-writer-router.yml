report:
  status: completed
  completed_at: 2026-10-15T16:20:00
  summary: |
    Staged ada-voice drop 11: tools.d/cpt_post routes LINE save-asks to
    the chaba-boards CPT that matches the ask and fills its registered
    meta — wp_post keeps free-form posts (its description + guide now
    say so). Receipt photos are read in-turn by the model; the tool
    composes the standard title, uploads the archived photo as
    featured_media, writes status=private, and attributes via saved_by
    (new plugin v0.5.1 meta; degrade-retry covers older deploys).
    contact/asset upsert by slug; expense/reminder always create.
  metrics:
    - ada-voice-side unit tests: 20/20
    - chaba-side drop verifier: 11/11 (incl. git apply --check gate)
    - DECLARATION description: 228 chars (cap 300)
    - tool surface after merge: 55 declared / cap 112
  links:
    - title: Card
      file: docs/ssot/kanban/cards/line-cpt-writer-router.yml
    - title: Drop README
      file: integrations/ada-voice/README.md
  kb_review:
    - CPTs register no post_tag taxonomy — person attribution needs a
      meta key (saved_by), not wp_post's person tag
    - WP auto-slugs strip non-ascii — Thai-named records need an
      explicit slug (or hash fallback) for deterministic upsert
  lessons_learned:
    - "Deploy-order independence is worth ~15 lines — the meta degrade
      retry means the tool is correct against plugin 0.3.3 AND 0.5.1."

