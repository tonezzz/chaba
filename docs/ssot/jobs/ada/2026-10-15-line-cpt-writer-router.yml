      label: Validate
      status: completed
      notes: |
        ssot-validate-all: my files clean; found+fixed a pre-existing
        YAML syntax error in jobs/ada/2026-10-15-wp-comment-sync.yml
        (unquoted '+ fallback' scalar, committed ca235bc41). tools_loader
        loads cpt_post with zero errors; DECLARATION desc 228 chars.
  decisions:
    - label: New tool vs extending wp_post
      rationale: >-
        Separate DECLARATION keeps each schema small (the fleet is on a
        token diet) and gives the model a clean classification boundary —
        wp_post keeps the member-posts contract; cpt_post owns structured
        records. The card's own help text offered this shape.
      alternatives_considered: >-
        kind= param on wp_post — rejected: meta fields for four CPTs
        would bloat the one schema every save-ask carries, and 'post'
        vs record semantics differ (tags vs meta, public vs private).
    - label: Model-side extraction, not tool-side OCR
      rationale: >-
        LINE photos already arrive as real image turns (send_image_turn)
        — the model reads the receipt in-context and passes fields. An
        in-tool vision call would double latency/cost for no accuracy
        gain.
      alternatives_considered: gemini_pool OCR inside cpt_post.
    - label: status=private default
      rationale: >-
        Household expenses/contacts/reminders are member records, not
        public posts — the plugin's model is private-by-status (same as
        /chat/line/*). publish stays an explicit opt-in.
    - label: Upsert contact/asset, create expense/reminder
      rationale: >-
        Entities re-save over time (a phone number changes); events are
        each a new record. Deterministic slug + hash fallback keeps
        Thai-named contacts upsertable.
