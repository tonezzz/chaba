      label: Provider-agnostic backend (models, protocols, registry, aggregator)
      status: done
      notes: "backend/calendar_providers.py — CalendarService.load() mirrors memory-bank registry semantics (instances, status, fail-loud unknown adapter, absent file = disabled)."
    - id: 2
