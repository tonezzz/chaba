# SSOT Job Lifecycle: Ada Google Calendar + Tasks tools
# Give ada provider-agnostic calendar/tasks tools, Google adapter first,
# with the registry/SSOT machinery to add CalDAV/MS Graph later.

title: Ada Google Calendar + Tasks tools
subtitle: Provider-agnostic calendar backend, Google adapter, confirmed-gate writes
icon: calendar

planning:
  goal: |
    Ada can answer schedule questions, plan a day from events + open tasks,
    and create/delete events and tasks after explicit user confirmation —
    behind a provider abstraction so iCloud/Outlook can join later.
  scope: |
    In scope:
      - backend/calendar_providers.py: models, protocols, registry, aggregator
      - backend/google_calendar.py: httpx-native Calendar v3 + Tasks adapter
      - ToolRunner methods + CALENDAR_WRITE_TOOLS confirmed=true gate
      - Gemini Live function_declarations + instruction paragraph
      - scripts/ada/google-calendar-auth.py (consent) + render-calendar-providers.py
      - SSOT: ssot.apps.ada-calendar.yml, decision record, ada howto runbooks
    Out of scope:
      - CalDAV (iCloud) and MS Graph adapter implementations
      - PWA calendar UI surface (tools work via /api/tools/call already)
      - Cross-provider event replication (rejected — see decision)
      - MCP bridge for third-party calendar servers
  success_criteria:
    - Asking "what is on my calendar today" answers from live Google Calendar data
    - Creating an event requires restating details + confirmed=true
    - calendar tools degrade cleanly ('not configured') on instances with no registry
    - Adding a provider = adapter file + registry block (runbook exists)
  risks:
    - OAuth consent screen in Testing status → refresh tokens die in 7 days. Mitigation: publish the app; --check verifies refresh works.
    - Gemini Live rejects schemas — follow existing declaration shape exactly (parameters_json_schema, additionalProperties false).
    - Voice latency: calendar calls add a network hop; NON_BLOCKING + short answers keep it acceptable.
  resources:
    - ~/.config/secrets/google_credentials.json (shared OAuth client, gen-lang-client-* project)
    - ~/.config/secrets/ada-google-calendar-token.json (minted by auth script)
    - decision: ada-calendar-provider-backend in ssot.technical-decisions.yml
  owner: tony
  estimated_duration: 1 session + OAuth consent

processing:
  status: in_progress
  started_at: "2026-09-21"
  steps:
