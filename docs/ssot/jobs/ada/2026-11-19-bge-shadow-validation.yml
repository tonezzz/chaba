  Closed out the shadow's validation requirement on idc02 (staging host
  per spec). Added 8 unit tests covering the previously-unproven
  invariants (queue bound, collection bound, missing-endpoint no-op,
  deadline bounding, ops-collection exclusion, person-policy + person-scope
  ACL inheritance, non-blocking proof) and a repeatable live runner
