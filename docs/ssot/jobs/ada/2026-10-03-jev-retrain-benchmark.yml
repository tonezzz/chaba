decisions:
  - v5 student is the recommended replacement (100% failure-set, 13/13 golden, thr 0.70)
  - MiniLM 45MB tier is documented but not gate-capable (64.7% Thai)
  - gemma-1b attention head works as torch port on GTX 1650; MLX path still Mac-only
  - 4b gemma remains teacher/reference; no fine-tune attempted (VRAM)

status_note: |
  DEPLOYED 2026-10-04 — ckpt-v2-20261002 is live as jev-student.service
  on idc01:8778 (thr 0.70 embedded in config.custom_params). Rollback
  copy at idc01:~/jev-student/ckpt-v0-deployed-20261004. Post-deploy
  production benchmark: failure set 100% (32/32 @0.75 gate), corpus
  sample 98.3% (residual misses are label-noise FPs).

voice_bench_2026-10-04: |
  TTS-only run (edge-tts EN/TH → faster-whisper int8 → prod v5 gate):
  tiny 65.6% / base 84.4% / small 93.8% gate accuracy on ASR text
  (clean text = 100%). CER med 0.26/0.11/0.11; Thai CER ~2x overall
  (tiny 0.48). ASR noise is the dominant loss — cascade must trigger
  on ASR confidence (avg_logprob) not only gate gray-band, since
  mangled text gives confidently-wrong scores. small = 8.2s/clip on
  12-core x86 → not Pi5-viable as default tier.

onnx_quant_2026-10-04: |
  v5 exported to ONNX. fp32: 541MB, ~14.4ms p50 CPU (vs 24.2ms torch),
  fail-set 100% — viable fast path. int8 (dynamic + per-channel):
  136MB, ~12.1ms p50 but acc drops to 87.5% — positive probs collapse
  to ~0.56; classifier head too sensitive. DO NOT deploy int8 without
  quant-aware calibration.

hard_set_2026-10-04: |
  NEW eval file scripts/jev/hard-set.jsonl — 35 UNSEEN cases (new EN/TH
  affirm phrasings, Thai interrogatives, embedded-token negatives) not
  covered by augmentation classes. True OOD test. Results:
    v5-only        74.3%  (pos .80 neg .67; confidently-wrong p~0.01 misses)
    g270m-only     74.3%  (pos .90 neg .53)  val 98.0% @0.30, golden 12/13, 544MB bf16, 29ms CPU
    minilm-only    68.6%
    g1b-only       85.7%  (pos 1.0) at 1.4s — best single on OOD
  ORACLE (any model right): 100% — errors barely overlap; routing is the win.

cascade_sim_2026-10-04: |
  probe-probs.py records per-model p on any case file; cascade-sim.py
  replays structures offline (serial/vote/veto/disagree) with expected
  latency. Best OOD structure: v5/minilm->g1b-disagree (v5 decides;
  when v5 vs minilm disagree, g1b resolves) = 88.6% on hard-set,
  ~800ms expected — BEATS every single model incl. g1b alone.
  On eval-all the same structure is 93.8% vs v5's 100% — cascade trades
  known-set perfection for OOD robustness. Pure gray-band escalation
  cannot fix confidently-wrong misses (v5 p=0.01 on unseen affirms);
  disagreement is the correct trigger.

round2_2026-10-04: |
  Second wave — resolver tuning + ModernBERT fine-tune + stacker.
  Threshold sweep (ml@0.7 g1b@0.6) lifts disagree cascade to 91.4% OOD
  / 93.8% eval. Then ModernBERT-base seq-cls (149M, 575MB) trained on
  same corpus: val 95.0% — and it is the best single model overall:
  eval-all 100% @0.55, hard-set 80% @0.80, ~73ms CPU, no GPU needed.
  4-model stacker (logistic over v5/ml/g270m/mbert probs, corpus-trained)
  matches mbert exactly (100%/80%) — more parts, no gain. v5/mbert->g1b
  disagree = 100% eval / 82.9% hard (keeps perfection + OOD boost, but
  needs the 1.4s GPU member). g270m served via new generic shim
  serve-seqcls.py (:8781). mbert probs on corpus collected for stacker.

  FINAL LANDSCAPE (eval-all / hard-set):
    mbert seq-cls      100% / 80.0%   ~73ms CPU   <- best single
    stacker4           100% / 80.0%   ~250ms CPU
    v5/mbert->g1b      100% / 82.9%   ~800ms, GPU dep
    v5/ml->g1b         93.8% / 91.4%  ~800ms, GPU dep  <- max OOD
    v5 deployed        100% / 74.3%   ~69ms CPU
    g1b head alone     81.3% / 85.7%  1.4s GPU
  Recommendation: mbert is the strongest swap candidate for the gate
  (same size class, +6 OOD pts, no orchestration). Cascade only pays
  if OOD assurance matters more than known-set perfection.
