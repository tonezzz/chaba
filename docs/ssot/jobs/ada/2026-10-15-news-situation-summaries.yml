title: News situation summaries — situation flag on digests + index + Thai + ask-hook
subtitle: >-
  Digest parents on the WP `news` CPT are already evolving topic summaries;
  this promotes the interesting ones to tracked "situations" — flagged
  watching|pinned, listed on a /wp/ index page, Thai-first, and promotable
  by member asks and comments.
