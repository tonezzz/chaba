design:
  flag: >
    meta `situation` = watching|pinned on digest posts (+ situation_since,
    situation_by, brief_th — registered REST-writable in chaba-boards
    0.6.0). Mirrored as post_tag `situation-watching`/`situation-pinned`
    because tags were already REST-writable on news — the flag works even
    before the plugin bump deploys (unregistered meta keys are silently
    dropped by WP REST, not errors). effective_state() reads meta first,
    tag second; news-digest.py re-asserts parent meta+tags on regen so the
    flag survives digest refresh.
  ladder: >
    none -> watching -> pinned. promote_step/demote_step move one rung;
    `set` jumps. pin also sets WP `sticky` (floats on /wp/news/ — the
    "promoted digest"); unpin/clear removes it. Sticky is attempted
    best-effort: hierarchical CPTs reject it on some WP versions — the
    write retries without sticky rather than losing the flag.
  signals: >
    Additive, suggestion-only, never silent (every transition posts a WP
    comment naming actor+reason):
    - auto-nominate: news-situation.py sweep (wp-news-situation.timer :45
      hourly, after fetch :00 / digest :20) marks watching on >=3-source
      or disaster-desk digests. Never pins, never demotes, never touches
      flagged posts.
    - member-ask: news-situation.py ask "<text>" — embeds the ask
      (ollama-nomic-embed via LiteLLM, ngram fallback), matches digest
      title+lead by cosine (--threshold 0.55), promotes one rung, prints
      TH+EN briefs + link — the situational answer Ada can relay. Weak
      match -> exit 3, nothing written. --json for tool callers.
    - comment: wp-comment-sync.py news lane — pin/unpin/watch/unwatch
      (EN + ปักหมุด/เลิกปักหมุด/เฝ้าระวัง/เลิกติดตาม) within the first 60
      chars applies via the same set_state; the wcs-ack reply states the
      new state. Non-command news comments -> digest lane unchanged.
  index: >
    news-situation.py index upserts private WP page slug `situations`
    (lessons-due pattern) — pinned then watching, Thai brief first,
    sources/since/by provenance. Plugin 0.6.0 adds [chaba_situations]
    shortcode (same list, embeddable on any member page) + a badge banner
    on flagged digests' single views + a Situation column in the news
    admin list.
  thai: >
    news-digest PROMPT now returns brief_th; rendered as a สรุป paragraph
    in the digest body and cached in meta brief_th so the index renders
    Thai without parsing post HTML.

