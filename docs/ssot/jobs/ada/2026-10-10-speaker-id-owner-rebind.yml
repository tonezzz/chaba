notes:
  - >-
    Owner security is not weakened for real secondary speakers: a
    buffer that still verifies the guest label keeps denying; a false
    identity claim only binds when the audio's best match agrees;
    reverify exceptions fail closed; media can never take a person
    label's seat.
  - >-
    Tunables: ADA_SPEAKER_NON_OWNER_MIN_CONF=0.70,
    ADA_SPEAKER_OWNER_RECLAIM_MIN=0.25, ADA_SPEAKER_OWNER_RECLAIM_AFTER=3.
  - >-
    Residual gap: a wrong label pinned for a long stretch whose last
    minutes of audio are dominated by the *guest's real voice* (Tony
    hands the mic to KK, then disputes) will verify as KK and keep the
    label — correct behavior, but the system turn tells Ada to suggest
    talking longer and correcting again.
  - >-
    Follow-up candidates (not in scope): bench the 0.70 floor against
    real misidentification rates; consider same for the soft owner-hint
    path; surface 'speaker_cleared' in the ada-voice-card status line.
