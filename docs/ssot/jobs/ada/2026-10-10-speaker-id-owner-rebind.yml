    tests/test_speaker_id.py — NonOwnerFloorTest (6 cases: marginal
    guest never binds, confident guest binds, owner/media exempt,
    floored hit counts as miss + resets pending switch) and
    CorrectSpeakerTest (9 cases: owner rebind, label-verified stay,
    clear, rebind to other person, claimed-profile binds on buffer
    evidence, false claim can't override buffer, media hit clears,
    no-label no-op, streak reset).
  - >-
    tests/test_memory_banks.py — deny-path re-verify: cleared label
    proceeds + heals shared field; rebound-to-owner proceeds; buffer-
    verified label still denies; reverify exception fails closed; no
    speaker session stays denied.
  - >-
    tests/test_speaker_profiles_tool.py — CorrectActionTest (7 cases
    incl. secondary turn may correct, honest error when no session).
  - >-
    tests/scenarios/speaker_id_correction.yaml + scenario_engine
    'speaker:' step (_StubSpeakerSession with scripted verdicts):
    verified label denies → cleared label proceeds → rebound owner
    proceeds.
  - >-
    Result: 1010 passed, 1 skipped; 1 failure =
    test_tool_audit.py::LintAgainstRepoTests (voice_fx descsize,
