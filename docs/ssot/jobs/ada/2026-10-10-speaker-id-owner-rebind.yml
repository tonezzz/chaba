title: speaker-id-owner-rebind — correction rebinds/clears the ACL label
subtitle: ada-voice speaker session — user dispute re-scores the buffered voice; owner-gated denials re-verify first
icon: microphone

status: implemented-uncommitted   # tests green; awaiting commit/PR/deploy decision
project: ada-voice
card: docs/ssot/kanban/cards/speaker-id-owner-rebind.yml
owner: devin-dispatch
started: "2026-10-10"

incident: |
  Session 7a74536b32 (2026-10-07): Tony's own key-bound voice session
  was labeled 'KK' — two consecutive 64% voiceprint hits cleared
  FIRST_AFTER hysteresis and pinned person.kk as the current speaker.
  From then on every owner-gated tool (ada_memory_search,
  cms_publish_page, …) answered "Only the session owner can run this
  action" — in Tony's own voice, on his own session. Saying the label
  was wrong only got an apology; nothing re-resolved the identity, and
  there was no code path that un-pinned a disputed label.

decision: |
  Three-layer fix shipped, all in ada-voice backend + pwa_server:
  (1) NON_OWNER_MIN_CONF floor (ADA_SPEAKER_NON_OWNER_MIN_CONF, 0.70) —
      a NEW non-owner label below the floor never binds.
  (2) SpeakerSession.correct_speaker(claimed) — user dispute re-scores
      the trailing buffer now; stands/rebinds/owner-reclaim/claim/clear
      in that order; clearing loses no security (fail-open).
  (3) ToolRunner._reverify_secondary_turn() — the deny path re-scores
      the label against the buffer before "Only the session owner"
      fires; fails closed on errors.
  Full design rationale moved to Education (verdict+pointer split,
  2026-11-07): see lesson 'ada-speaker-id-rebind-layers'
  (lesson-0eb6a7a7329c, Education:Ada-Speaker-Id-Rebind-Layers).
verification:
