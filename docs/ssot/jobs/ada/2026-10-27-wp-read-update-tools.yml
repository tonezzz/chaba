decisions:
  - summary: Read and update ship as two new tools.d drops, not wp_post
      extensions.
    detail: >-
      Same call as the cpt_post precedent: wp_post keeps its
      member-posts contract. wp_read is policy:read +
      secondary_allowed (safe everywhere); wp_update is
      policy:confirmed so the confirm-before-publish requirement is
      enforced by the dispatch layer's bound-token gate — not by a
      self-asserted flag inside the tool.
  - summary: "Preview = body text in chat, not a link."
    detail: >-
      WP draft permalinks only render inside wp-admin sessions;
      members authenticate via LINE, not WP. wp_read get returns the
      rendered body as plain text — that is the preview surface.
  - summary: wp_update limited to posts+pages.
    detail: >-
      CPT records (expense/contact/reminder/asset/place/trip) carry a
      slug/meta contract owned by their writer tools; a generic
      retitle would fork upserts. Revisit only with a per-kind update
      path.
  - summary: Alternatives considered.
    detail: >-
      One wp_manage tool covering read+update — rejected: mixing a
      confirmed-gated surface with reads would either gate reads or
      ship a per-action gate the manifest can't express. Patching
      wp_post to update — rejected: its DECLARATION says 'post';
      overloading id= semantics invites wrong-turn calls.

