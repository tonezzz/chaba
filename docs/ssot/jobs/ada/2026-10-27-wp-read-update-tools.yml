title: WP read + confirm-gated update tools for the LINE boards loop
subtitle: wp_read (list/preview) + wp_update (retitle/publish/trash,
  policy:confirmed) close the member site-maintenance loop
icon: tools
version: 1

card: line-wp-site-manager
date: 2026-10-27
dispatch: 20261027-140223-p0-wp-live-on-plesk-boards-sit
runner: tony-macbook

planning:
  goal: |
    Card line-wp-site-manager (OPS-0640) P2+P3: LINE-driven WordPress
    maintenance needs the read and update halves — wp_post/cpt_post
    only create. P2 = read-only tool to list posts/pages and preview a
    draft. P3 = create/update via LINE with confirm-before-publish.
    P0 (site live + /wp-json reachable) was already true and was
    re-verified this session; P1 (revocable app password, never master
    creds in LINE) was settled 2026-10-14 (Option A identity-based —
    backend holds wp-boards.env; members never see credentials).
  scope: |
    ada-voice staged drop-in only (integrations/ada-voice/) + SSOT
    updates. No push, no deploy from this worktree — tools.d drops
    land on ada-voice via the normal drop-apply + deploy-ada.sh path
    on idc03.
  success_criteria:
    - wp_read action=list returns id/title/status/link rows for
      posts/pages/CPTs with status/person-tag/search filters
    - wp_read action=get returns title + body text as the draft
      preview (members have no wp-admin login — text is the preview)
    - wp_update edits posts/pages only; GET-then-POST reports the
      status transition; manifest policy:confirmed enforces the
      confirm-before-publish gate at dispatch, not self-asserted
    - publish flow composes — wp_post publish=false -> wp_read get ->
      member yes -> wp_update status=publish
    - drop tests green; persons include lists + ssot.wp-boards writers
      updated
  risks:
    - wp_update's confirmed gate only blocks the dispatch path —
      DECLARATION must list `confirmed` as a property (never required;
      the gate pops it pre-validation) so the model knows to send it
    - person= filter uses read-only GET tags — reusing wp.ensure_tag
      would mint tags from a read tool (tested)
    - post_type rides the REST route — charset-validated; CPT kinds
      excluded from wp_update so a blind retitle can't desync the
      cpt_post slug/upsert contract
  resources:
    - ada-voice checkout ~/CascadeProjects/ada-voice (tools.d,
      tool_runner gates, tools_loader policies)
    - integrations/ada-voice/backend/tools.d/cpt_post.py + drop 11 as
      the convention precedent
    - boards.surf-thailand.com /wp/wp-json verified 2026-10-27
  owner: devin (dispatch)
  estimated_duration: 1 session

