title: Prompt / command preprocessor for context and precision
subtitle: Design and prototype a pre-processing layer that grounds user requests in active focus, KB, and SSOT
icon: target

planning:
  goal: |
    Build a preprocessing step that runs before assistant interpretation of user requests and commands.
    It should resolve ambiguity, expand shorthand and aliases, link the goal to active focus/backlog/quick wins,
    and emit a structured, unambiguous prompt grounded in the project KB.
  scope: |
    - Survey existing disambiguation logic in mcp_focus, mcp_debug, and subagent-focus-triage.
    - Design the preprocessor schema and output contract.
    - Implement a read-only prototype that grounds a user request in active focus and KB.
    - Optionally add command canonicalization for mcp_debug/mcp_raw.
    - Validate with real ambiguous requests.
  success_criteria:
    - A documented preprocessor contract (input / output schema).
    - A working read-only prototype callable from the current session.
    - At least one real ambiguous request correctly resolved using the prototype.
    - SSOT and KB entries updated to reflect the new workflow.
  risks:
    - Over-engineering the prompt layer; mitigate by scoping to read-only v1 first.
    - Duplicating existing mcp_focus logic; mitigate by reusing focus_common and mcp_focus where possible.
  resources:
    - scripts/mcp_debug/focus.py
    - scripts/focus_common.py
    - scripts/subagent-focus-triage (if exists)
    - docs/ssot/infrastructure/ssot.mcp-focus.yml
    - docs/ssot/ssot.focus.current.yml
    - docs/kb/
    - MDDB for semantic search
  owner: tony
  estimated_duration: 2 sessions
  related_focus:
    - label: Prompt / command preprocessor for context and precision
      file: docs/ssot/ssot.focus.current.yml

