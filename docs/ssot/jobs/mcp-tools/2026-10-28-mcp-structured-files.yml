followups:
  - deploy note: mcp-debug.sh restarts the server on demand; new tools appear
    after the next mcp_debug reload / server restart on tony-dell.
  - rows format could become the recommended bulk mode in the tool
    description once agents use it; measure real-session usage first.
  - remote hosts that lack python3 would need a find/stat fallback path —
    none in the current fleet (all run chaba units needing python3).
