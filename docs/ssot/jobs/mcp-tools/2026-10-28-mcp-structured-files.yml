  - scripts/devnest/lane_gate.py            (READONLY_MCP_TOOLS +4)
  - docs/ssot/infrastructure/ssot.mcp-debug.files.yml  (files: policy section)
  - docs/ssot/infrastructure/ssot.devnest-lanes.yml    (lane note)
