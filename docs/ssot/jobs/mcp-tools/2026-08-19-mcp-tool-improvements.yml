title: MCP Tool Improvements
subtitle: Implement mcp_query_ssot, web audit report, and expose mcp_context / mcp_session_summary
icon: tools

planning:
  goal: |
    Record the top implementation ideas from the 2026-08-19 session and implement
    the top three in order: mcp_query_ssot, a web audit report, and MCP exposure
    for mcp_context and mcp_session_summary.
  scope:
    - mcp_query_ssot MCP tool in mcp_debug
    - A lightweight H3 or local web report for audit summaries
    - mcp_context and mcp_session_summary wired into the mcp_debug server
  out_of_scope:
    - Full H3 deployment or Caddy changes
    - Auto-KB quality scoring job
    - Focus decision tree web page
  success_criteria:
    - mcp_query_ssot returns a specific SSOT value or list by dotted path
    - The audit report page renders reports/audits/summary.json
    - mcp_context and mcp_session_summary are callable via the MCP server
    - All SSOT files validate and the server still starts
  risks:
    - Adding new MCP tools requires allowlist updates; risk of missing one
    - mcp_context may return large payloads; set a sensible limit
  resources:
    - mcp_debug Python package
    - reports/audits/summary.json
    - chaba-h3 public directory for the web report
  owner: tony
  estimated_duration: 2 sessions
  related_focus:
    - label: MCP Tool Improvements
      file: docs/ssot/ssot.focus.current.yml

