    coverage_debt ordering; upstream grew to 931 lines (ends
    ada_fleet_jobs) and the debt list gained ada_sweep/ada_lesson/
    ada_adobe_stock. Verified `git apply --check` clean on both
    origin/main c9a2f01 (dell) and tony-omen's local origin/main
    0a5dbd8 — all 6 drop patches apply on omen.
  - scripts/colab/packs/kk-mac-image-render-poc/inputs/render-request.json
