      notes: This file.

decisions:
  - id: no-unarchive-needed
    decision: Do not unarchive devin-kb
    rationale: |
      Moot — the repo is not archived and the content is already pushed.
      Recommendation: if devin-kb is intended to stay the personal KB,
      keep it writable and instead decide which repo is canonical for
      infra runbooks to avoid drift between the two copies (the chaba copy
      is the better fit since the profile-management series lives here).
