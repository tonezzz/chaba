lessons:
  - >-
    On zero-swap hosts, earlyoom --avoid 'just relocates the kills' (mn01
    precedent, now confirmed on idc02): exempting the LARGEST process
    maximizes collateral — one big kill reclaims more than several small
    ones. Protect via swap/headroom (zram), not via victim lists.
  - >-
    Restart=always is the real differentiator vs OPS-1516's jev case:
    SIGTERM exits look 'clean' to systemd but Restart=always still
    restarts — check the unit's Restart policy BEFORE assuming an
    earlyoom kill means a silent outage.
  - >-
    ansible ad-hoc `command` does not interpret pipes/semicolons — use
    `-m shell` for compound probes; `systemctl cat` does not work via
    --machine=, read the unit file + drop-in dirs directly instead.
  - >-
    earlyoom victim selection reads /proc/*/oom_score — cgroup
    MemoryMax/MemoryHigh caps do NOT protect a process from earlyoom;
    they only bound the separate kernel/cgroup OOM path.
