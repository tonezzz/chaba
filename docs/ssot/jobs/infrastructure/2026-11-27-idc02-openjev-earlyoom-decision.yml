decision:
  chosen: "(c) accept — leave openjev earlyoom-eligible; no playbook change, no unit change"
  rejected_a_extend_avoid: >-
    --avoid '(^|/)(jev|openjev)$' was rejected on the mn01 precedent
    (2026-11-25-mn01-mn-ha-dev-earlyoom-kills.yml, do_not list): on a
    zero-swap host earlyoom's swap arm is permanently true, so EVERY
    mem<10% excursion kills until memory recovers — --avoid does not reduce
    pressure, it relocates kills. openjev is the single biggest process
    (~3 GiB RSS, top badness): exempting it forces earlyoom to kill MORE,
    SMALLER victims per event to reclaim the same ~3 GiB — mddbd (the
    idc02 MDDB follower, already killed 4x in today's storm), chrome, or
    runner pythons holding real work product. One 3 GiB kill is the most
    efficient reclaim available; protecting it maximizes collateral damage.
    The OPS-1516 rationale for exempting jev also does not transfer: jev
    died SILENTLY (Restart=on-failure cannot see a SIGTERM clean exit ->
    17 min outage). openjev has Restart=always — proven today: SIGTERM at
    17:59:15, unit active again 17:59:39.
  rejected_b_memorymax: >-
    Already satisfied — the unit file itself carries MemoryMax=12G +
    MemorySwapMax=2G (verified live; no drop-ins). Cgroup caps do not
    influence earlyoom's userspace victim selection anyway (it reads
    /proc/*/oom_score; MemoryMax affects only the separate cgroup/kernel
    OOM path). Tightening toward the ~3 GiB steady RSS would only convert
    future pressure into cgroup-OOM SIGKILLs — per the mn01 precedent that
    manufactures hard kills for no availability gain on a stateless scorer.
    MemorySwapMax=2G is inert on a host with zero swap.
  why_accept_is_safe:
    - "Self-healing proven: Restart=always restarts on the SIGTERM clean
      exit AND on the SIGKILL escalation ('kill failed: Timer expired'
      at 17:59:25); ~24s to ActiveEnter, ~80-140s to model-loaded /health.
      Observed cost per kill: a ~2 min gap in the :8777 lane."
    - "Redundant lane: tony-omen serves the identical gemma-3-4b-it
      /v1/systemone on :8777 (ssot.audit.hosts idc02 note: 'Second
      /v1/systemone decision service'); idc02's copy is the standby, not
      the only instance."
    - "Graceful degradation: JEV_LANE claim-time classify falls back to
      the devin lane when jevos is unreachable (ssot.devnest-lanes.yml
      escalation) — a kill costs fallback tokens/latency, not correctness."
    - "Ideal victim profile: stateless scorer (no writes to corrupt),
      largest single-process reclaim on the box, auto-restarts. Better
      earlyoom victim than mddbd (infra, resync cost) or runner pythons
      (in-flight dispatch work)."

root_cause_and_followup:
  actual_problem: >-
    idc02 is chronically oversubscribed: ~11.8/16 GiB used steady-state,
    ZERO swap -> earlyoom's swap arm permanently true -> every mem<10%
    excursion (15 kills in 14 days, storms on Nov 26-27) kills the
    worst-badness process. openjev's exposure is the pressure valve working
    as designed, not a defect.
  recommended_fix: >-
    zram swap on idc02, mirroring the mn01 recommendation and the
    fleet-standard /etc/systemd/system/zram-swap.service pattern
    (ansible/playbooks/zram-swap.yml exists but is hosts: tony-omen
    hardcoded — needs an idc02-sized variant, ~8 GiB device for a 16 GiB
    host). This disarms earlyoom's permanently-true swap arm AND absorbs
    dispatch/job spikes for EVERY service on the box — strictly better
    than any per-process exemption. Filed as follow-up card
    idc02-zram-swap-earlyoom-relief.
  secondary_observations:
    - >-
      open-jev.service on idc02 has no entry in ssot.health.home.system.yml
      (only tony-omen's open-jev-scorer is registered); audit-fleet-services
      covers expected_state=active daily but a ~2 min earlyoom blip is
      invisible between audits. Optional: register an idc02 health check
      or accept — the lane self-heals faster than any monitor cadence.
    - >-
      If Tony still wants the lane protected after reading this, option (a)
      is a one-line change: earlyoom_args '(^|/)(jev|openjev)$' in
      ansible/playbooks/earlyoom-avoid-jev.yml + rerun — but expect the
      kills to move to mddbd/chrome/runner pythons, not disappear.

