---
title: "OPS-1517 — openjev earlyoom exposure on idc02 decided: ACCEPT (no exemption, no new bound)"
subtitle: >-
  Option (c) of three. openjev stays earlyoom-eligible by design — it is the
  ideal pressure valve (largest reclaim, stateless, Restart=always self-heals
  in ~24s, redundant with tony-omen:8777, graceful devin-lane fallback).
  Root cause is idc02's zero-swap chronic pressure; zram swap carded as the
  real fix per the mn01 earlyoom-kills precedent.
icon: shield
date: 2026-11-27
card: openjev-idc02-earlyoom-exposure
