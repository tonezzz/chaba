context:
  trigger: >-
    Card openjev-idc02-earlyoom-exposure (auto-captured during OPS-1516)
    noted that earlyoom --avoid '(^|/)(jev)$' exempts comm=jev only, while the
    sibling openjev process (gemma-3-4b-it torch CPU lane on tailnet :8777,
    comm=openjev) is the LARGEST process on idc02 and remains a kill
    candidate. Delegated choice: (a) extend the --avoid regex, (b) bound with
    MemoryMax like idc03-memory-guard did for jevos, or (c) accept.
  live_state_verified_2026_11_27_~2200:
    - "idc02 open-jev.service (user unit, ~/.config/systemd/user/open-jev.service,
      no drop-ins): ExecStart=.venv/bin/openjev serve --backend torch --device
      cpu --host 100.123.163.11 --port 8777 --model models/gemma-3-4b-it;
      Restart=always RestartSec=10; MemoryMax=12G MemorySwapMax=2G
      OOMScoreAdjust=200 — the bound in option (b) ALREADY EXISTS in the unit."
    - "Process table: openjev PID 836465 RSS ~2.95 GiB oom_score=920
      (adj=200) = TOP badness on the host; jev PID 1353079 RSS ~1.65 GiB
      oom_score=868; next candidates mddbd ~2.3/1.5/1.1 GiB x3, opencode,
      python. Host: 15,993 MiB total, ~11.8 GiB used, MemAvailable ~4.2 GiB
      (26%), Swap: 0/0."
    - "earlyoom journal 14d: 15 SIGTERMs. openjev killed twice — Nov 25
      14:38 (badness 880, RSS 1914 MiB) and Nov 27 17:59:15 (badness 902,
      RSS 2437 MiB, 'kill failed: Timer expired' = SIGTERM timeout during
      torch compute, escalated). Unit ActiveEnterTimestamp 17:59:39 —
      Restart=always recovered it ~24s after the kill; NRestarts=2 matches
      both journal kills. Self-healing is EMPIRICAL, not theoretical."
    - "Nov 27 20:34-20:49 storm: 7 low-memory events in ~15min, earlyoom
      killed mddbd x4 (badness ~891-896), chrome x4, jev x1 (the OPS-1516
      incident), plus Nov 26 two python procs at badness ~980 RSS ~4.3 GiB.
      openjev was NOT killed in the storm — bigger residents took the hits."
