title: MediaWiki Infrastructure/Hosts hierarchy — generator + privacy gates
subtitle: >-
  scripts/wiki-infra-hosts.py renders the canonical Infrastructure:Hosts
  rollup + per-host leaves on wiki.h3.gizmo-thailand.com from the existing
  report layer; registry-driven off ssot.audit.hosts.yml
