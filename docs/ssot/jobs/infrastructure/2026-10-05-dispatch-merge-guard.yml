title: dispatcher merge-guard + canonical default-branch worktree base
subtitle: >-
  Two session-verified failure modes closed: dispatch worktrees were cut
  from the checkout's CURRENT branch (sunsynk-bat34 rebuilt shipped
  features on the stale 'sunsynk' branch), and cards closed while session
  commits stayed unmerged or worktrees stayed dirty (~10 orphaned
  workstreams in two days). Now worktrees always base on
  origin/<default_branch>, and board-api blocks review->done while
  session commits are non-ancestors of the default branch.
icon: shield
id: 2026-10-05-dispatch-merge-guard
status: done
owner: devin-dispatch
project: chaba
card: dispatch-merge-guard
branch: dispatch/20261005-105032-in-scripts-board-kanban-dispat
