title: devin-desktop startup error — XDG_RUNTIME_DIR split-brain between watchdog and interactive launches
subtitle: >-
  "Starting error" after the 3.12 upgrade was not a package bug: the
  cron-driven devin-desktop-watchdog launches the app without
  XDG_RUNTIME_DIR, so Electron binds its single-instance socket at
  ~/.config/Devin/1.14-main.sock, while interactive launches bind
  /run/user/$UID/vscode-*-1.14-main.sock. The two never see each other —
  every launch spawns a parallel instance fighting over the same
  ~/.config/Devin profile (LevelDB LOCK errors, duplicate windows).
icon: wrench
date: 2026-11-24
card: fix-devin-desktop-startup-after-3-12-upgrade
session: "dispatch-wt-20261124-205944-diagnose-and-fix-the-devin-des (tony-dell)"
status: done — both hosts recycled onto the shared socket path, watchdog patched fleet-source

root_cause:
  mechanism: >-
    Electron/VS Code derives the single-instance socket dir from
    process.env.XDG_RUNTIME_DIR (Qv in resources/app/out/mainImpl.js):
    set -> $XDG_RUNTIME_DIR/vscode-<hash>-<ver>-main.sock; unset ->
    <user-data-dir>/<ver>-main.sock i.e. ~/.config/Devin/1.14-main.sock.
    devin-desktop-watchdog.sh runs from cron (bare env, no
    XDG_RUNTIME_DIR) and its auto-restart path is the only automated
    relauncher — so watchdog-resurrected instances are invisible to
    desktop/CRD launches and vice versa.
  evidence: >-
    tony-dell pre-fix: stale main PID 3271309 (started 2026-11-23 16:10
    by watchdog auto-restart, exe "(deleted)" after the 19:13 package
    upgrade to 3.14.30833) listened ONLY on
    ~/.config/Devin/1.14-main.sock; a manual launch spawned a SECOND
    main instead of delegating, logging repeated LevelDB LOCK errors on
    vscode-file_vscode-app_0.indexeddb.leveldb. tony-omen pre-fix: same
    pattern — watchdog instance PID 47209 (2026-11-23 19:00) held
    ~/.config/Devin/1.14-main.sock, no /run/user socket existed.
  trigger: >-
    Any watchdog auto-restart (app crash, hang-dialog escalation, host
    reboot) produces a split-brain instance; the next 3.12 package
    upgrade made the stale pre-upgrade binary persist even longer
    (deleted exe keeps running), widening the window where launches
    misbehave.

changes:
  - scripts/devin/devin-desktop-watchdog.sh: >-
      export XDG_RUNTIME_DIR=/run/user/$(id -u) when unset and the dir
      exists, before any launch/notify path — watchdog-resurrected
      instances now bind the same singleton socket as interactive
      launches, so single-instance delegation works again.
  - >-
      hosts: ~/.local/bin/devin-desktop-watchdog.sh updated on
      tony-dell and tony-omen (installed copy; repo is source of truth
      via scripts/devin/install-devin-host.sh).
  - >-
      live state: both hosts' devin-desktop recycled — stale mains
      SIGTERM'd (clean exit, zero leftover processes), relaunched on
      DISPLAY :20 with XDG_RUNTIME_DIR=/run/user/1000.

