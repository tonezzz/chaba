    - "event-driven rework of cast-ha-panel.timer (60s poll) — already deferred in tv-casting-groups decision"

report:
  status: done
  completed_at: "2026-10-05 15:50 +07"
  summary: >
    Cast lane audited end-to-end. HEALTHY: cast-browser (omen, 3d up),
    cast-browser-proxy socat :8799 (dell loopback -> omen LAN), yt-live-api
    :8791, input-bridge relay (7 screens, 0 stale leases), cast-cam scan,
    cast-shots-http :8090 (LAN-bound by design). FIXED: cast-ha-panel.timer
    was dead since last boot — OnUnitActiveSec=60s never fires without a
    first service run; added OnActiveSec=2min, loop now ticking and
    re-casting xiaomi_c201 to TONY-TV (camera/play_stream 200, mediashell
    live, go2rtc consumers=1). STOPPED: cast-desktop@1 on omen — 17,368
    restart loop on nonexistent display :1 (unit already disabled).
    SCENARIOS: cam_to_screen + cctv_snapshot_to_screen both PASS.
    METRIC: vcast cam cast 0.6s to first frame (<5s PASS); TV path warm
    <1s dispatch, cold receiver wake ~15-20s. WATCH ITEMS: xiaomi_c201
    flaps idle<->unavailable (go2rtc producer wedging — audit-cast WARNs
    are real); cast-desktop@0 retirement decision still open; weekly
    casting suite timed out at its 2h cap on 2026-10-03 (Result=timeout)
    — worth a look at suite duration vs budget; vcast_snapshot self-snap
    timed out once on screen 6 during cam_to_screen T3.
    tony-omen single-point dependency now documented in
    docs/ssot/apps/ssot.apps.vcast.yml ('Cast lane — host topology &
    single points').
