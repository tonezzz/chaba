summary: >
  Fourth dispatch attempt on this card (tony-omen this time). Re-verified
  from a new vantage that the stick is still not booted or attached
  anywhere reachable, then closed the gap that made four attempts fail
  the same way: nobody could tell WHEN the stick next boots. Delivered
  scripts/ops/stick-watch.py — a fleet-side detector that pages Tony
  with the exact fix command the moment the stick announces, steals
  mn01's session, or registers its own node — plus systemd units and
  runbook updates. The physical step itself still requires Tony to boot
  the stick (or the watcher to catch it booting elsewhere).

