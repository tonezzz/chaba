      - "update every --remote default + env var in scripts/"
      - "restart/point live remote workers (kk-mac nest-worker for kk-llm)"
      - "update colab notebook cells that mount MyDrive/<old>"
      - "card comms + this file updated"
    never_move: [backups, nest, chaba-media-corpus, colab-cache, archive, cold-storage, ada-documents, notebooklm]
  housekeeping_followups:
