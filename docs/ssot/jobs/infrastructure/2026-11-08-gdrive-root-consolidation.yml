phase_b_decision:
  recommendation: >-
    STOP at phase A. All 13 remaining chaba-managed root dirs are live service
    roots — none are dead. The four ada-nest-* siblings are independent
    remote-worker roots, not clutter; consolidating them under ada-nest/
    buys cosmetics at the cost of a coordinated multi-host migration
    (script defaults + a live kk-mac worker + colab notebook + host mounts).
    backups/, nest/, chaba-media-corpus/, colab-cache/ must never be moved
    by an unattended session (DR path / host mount / notebook mount).
