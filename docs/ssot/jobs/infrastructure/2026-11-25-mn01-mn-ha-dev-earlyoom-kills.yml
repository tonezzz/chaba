findings:
  - >-
    SMOKING GUN: `journalctl -u earlyoom` shows `sending SIGTERM to
    process <pid> "python3" ... cmdline "python3 -P -m homeassistant
    --config /config"` at every mn-ha-dev exit timestamp; 44 of 51
    earlyoom kills since 2026-11-24 were HA python. MemAvailable at kill
    time: 576-625MiB of ~6.0-6.3GiB (9.8-10.0%).
  - >-
    Exit-code-0 vs signal-15 split is a race, not two causes: SIGTERM to
    python -> HA graceful stop -> recorder closes (closed_incorrect=0,
    "finish process exit code 0"); when the signal lands during an
    in-flight shutdown or hits the s6 run script, the finish process
    reports signal 15 / exit 256 and the recorder run is marked
    closed_incorrect=1 — exactly the runs that produced the repeated
    "sqlite3 database was shutdown cleanly" warnings.
  - >-
    No call_service events for domain=homeassistant exist all-time in
    home-assistant_v2.db — the `homeassistant.restart`/`stop` service
    path was never used. automations.yaml is `[]`, scripts.yaml empty;
    the only custom integration (ha_mcp_tools) never calls
    hass.async_stop. HA-side stop theories are ruled out.
  - >-
    No kernel oom-kill, no systemd-oomd kills (journal empty), no
    MemoryMax/cgroup limit on the unit — all consistent with userspace
    earlyoom being the only killer active.
  - >-
    mn01 workload: 7.3GB RAM, 0 swap; resident set includes gnome-shell
    x2 + Xorg (desktop), 3x yolo server.py (~600MB combined),
    ada-voice uvicorn x2, netdata, xmeye-vms-stack (VMS.exe + vms-snap),
    playwright-server, antigravity-ide, devin CLI + dispatch tasks
    (~300-800MB each, lane cap ~2), and mn-ha-dev (~450-840MB).
  - >-
    earlyoom config: /etc/default/earlyoom has only `-r 3600`
    (report interval); thresholds are upstream defaults — SIGTERM at
    mem<=10% AND swap<=10%, SIGKILL at 5%. With swap=0 the swap arm is
    permanently armed.
  - >-
    Precedent: tony-dell runs `zram-swap.service` (8G zstd zram,
    priority 100) + 8G partition swap; the 2026-10-16 collapse job
    records earlyoom+zram as the in-house fix pattern. mn01 has neither.

answers_to_card_questions:
  issuer: >-
    earlyoom.service (userspace OOM killer), SIGTERM to the HA python
    process — not an HA-side stop call, not recorder/DB fault, not s6,
    not podman, not kernel OOM.
  tuning_verdict: >-
    Do NOT add MemoryMax to mn-ha-dev — a cgroup OOM would SIGKILL
    python mid-checkpoint and manufacture exactly the sqlite
    closed_incorrect corruption already seen. Restart=always /
    RestartSec=10 are working correctly; leave them.
  footprint: >-
    HA at ~700-840MB peak is normal for this config; shrinking it is not
    the lever. The lever is host memory headroom (swap) or fewer
    concurrent memory hogs on mn01.
  stability: >-
    NOT stable — NRestarts=43 at 09:32 UTC, kills continue on every
    MemAvailable<10% excursion. "Stable since 05:43" was a quiet window,
    not a fix.

recommendation:
  primary: >-
    Add zram swap on mn01 — mirror tony-dell's /etc/systemd/system/
    zram-swap.service but sized ~4G (box has 7.3GB vs dell's 16GB;
    zstd ~2-3x compression means ~1.5-2GB RAM cost). 140GB free on
    /dev/sda2 means a disk swapfile is also viable, but zram is the
    proven in-house pattern and needs no disk wear. This disarms
    earlyoom's permanently-true swap arm and absorbs dispatch-task
    spikes.
  secondary_options:
    - >-
      earlyoom -m 5 (SIGTERM only below 5% mem) in /etc/default/earlyoom —
      halves kill frequency but does not fix pressure; victims just get
      killed later and harder.
    - >-
      OOMScoreAdjust on mn-ha-dev unit — RAISING HA's score is wrong;
      LOWERING it (e.g. -500) would spare HA but shift kills onto
      devin-task pythons (losing dispatch work) — policy call for Tony.
    - >-
      Reduce mn01 load: dispatch lane cap 2->1, consolidate the 3 yolo
      server.py instances, or move mn-ha-dev back off mn01.
  do_not: >-
    MemoryMax/MemoryHigh on the quadlet; earlyoom --avoid 'homeassistant'
    (just relocates the kills).

followups:
  - >-
    DECISION NEEDED (board request on the card): add zram swap vs tune
    earlyoom vs reduce mn01 footprint vs accept periodic restarts.
  - >-
    If swap is added, re-audit earlyoom victims afterwards — VMS.exe,
    vms-snap.py, yolo server.py and chrome are all being killed too;
    the camera-wall stack on mn01 is silently degrading.
  - >-
    ha_mcp_tools _force_install_package runs `uv pip install` inside HA
