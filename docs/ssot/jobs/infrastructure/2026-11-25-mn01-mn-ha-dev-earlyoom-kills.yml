id: 2026-11-25-mn01-mn-ha-dev-earlyoom-kills
title: mn-ha-dev restart-looped 43x on mn01 — earlyoom SIGTERM kills under no-swap memory pressure
date: 2026-11-25
host: mn01
card: mn-ha-dev-crash-looped-40x-on-mn01-2026-986f32
ref: AUD-1399
dispatch: dispatch-wt-20261125-154657-found-during-mn01-yolo-xiaomi-

summary: >
  mn-ha-dev.service on mn01 restart-looped after the idc02->mn01 migration
  (~01:30 UTC): NRestarts reached 43 by 09:32 UTC and is STILL climbing.
  Root cause is NOT HA, podman, or the sqlite DB: userspace earlyoom
  (earlyoom.service, default thresholds SIGTERM@mem<=10% AND swap<=10%)
  SIGTERMs `python3 -P -m homeassistant` every time MemAvailable dips
  below ~10% of 7.3GB. mn01 has ZERO swap, so the swap arm of the
  condition is permanently true; HA python (~450-840MB RSS,
  oom_score_adj=200 from the podman unit) is consistently the highest
  oom_score victim while devin dispatch tasks, the yolo stack, gnome,
  ada-voice standby, netdata, and the XMEye VMS all share the box.
  HA handles SIGTERM gracefully (exit 0 -> s6 "finish process exit
  code 0" -> container dies -> Restart=always), which is why every
  exit looked "clean". The intermittent "received signal 15" /
  recorder closed_incorrect=1 runs are the same kills landing while
  shutdown was already in flight. earlyoom also killed VMS.exe x5,
  vms-snap.py, a yolo server.py, and a chrome OAuth proc in the same
  window — this is a host-capacity problem, not an HA defect.

