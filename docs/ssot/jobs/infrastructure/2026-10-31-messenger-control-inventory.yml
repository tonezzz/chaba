title: "Reconcile Telegram and LINE relay inventory"
subtitle: "Process OPS-0963 and publish one canonical messaging-lane inventory"
icon: route

planning:
  goal: >-
    Reconcile the documented and live Telegram/LINE control surfaces into
    one discoverable inventory, including relay services, modes, targets,
    secret references, command surfaces, publication, and topic routing.
  scope: >-
    Add one SSOT inventory, repair idc03 host-audit expectations for active
    relays, update the system map and messaging-lane pointer, and record
    provenance on OPS-0963. Do not enable/disable services, rotate tokens,
    move webhooks, or read secret values.
  success_criteria:
    - All five live idc03 relay units are represented in the inventory and idc03 audit expectations.
    - LINE group/persona/caller routing is consolidated under the same SSOT with the old path retained as a pointer.
    - OpenClaw is distinguished from Ada relay; Yomi is labeled as LINE history/search, not a relay.
    - Bot/group uncertainty and the MN push-policy conflict are explicitly marked unresolved.
    - No token values are present; group targets use aliases and source references.
    - Read-only service/port snapshot matches the five expected relay declarations without changing services.
  risks:
    - Collapsing distinct bots or routing policies into one inaccurate row.
    - Exposing credentials or unnecessary personal identifiers in public SSOT.
    - Treating a service as a relay when it is only a bot client or publication sink.
  resources:
    - "Live idc03 user units and loopback listeners"
    - "SSOT: ssot.messaging-lanes.yml, ssot.audit.hosts.yml, ssot.system-map.yml, ssot.jobs.yml"
    - "OPS-0963 messenger-control-inventory"
  owner: tony
  estimated_duration: 1 session
  related_focus:
    - label: Messenger control inventory
      file: docs/ssot/kanban/cards/messenger-control-inventory.yml

processing:
  status: complete
  started_at: 2026-10-31T09:30:43+07:00
  steps:
    - id: 1
      label: Reconcile source references and live relay state
      status: complete
      notes: >-
        Read SSOT, unit metadata, audit expectations, publication and topic registry.
        Read-only idc03 check found all five relay services active with listeners
        on 8911, 8912, 8913, 8917, and 8919. EnvironmentFile paths were inspected,
        not secret values. The idc03 audit list includes ada-line-relay,
        ada-tg-relay, and ada-tg-relay-kk but omits ada-tg-relay-mn and
        devnest-tg-relay; system-map also omits those latter two.
    - id: 2
      label: Add canonical inventory and reconcile declarations
      status: complete
      notes: >-
        Added ssot.messaging-lanes.yml, added the two missing idc03 relay
        expectations, linked all relay rows in ssot.system-map.yml, and
        changed msg-lane-standard.md to point to the canonical inventory.
        Migrated LINE group/persona routes and caller aliases into line.routing,
        updated its consumers, and left sender IDs in the host-only env file.
        Token values remain outside the repo. MN identity and outbound-policy
        conflicts remain explicit.
    - id: 3
      label: Validate and audit idc03
      status: complete
      notes: >-
        SSOT and reference validation pass; optimization gate has no new
        warnings. Static host expectations now contain all five relay units,
        matching the successful 09:30 +07 active-unit/listener snapshot. A
        later SSH recheck reset by peer, so the full host-audit command was
        not rerun after the declaration edit.
  decisions:
    - label: Treat this file as the cross-provider inventory, not as a secret store
      rationale: >-
        Keep one easy-to-follow inventory, move the detailed LINE route map
        into it, and leave token values plus LINE sender IDs in host-only
        EnvironmentFiles. Retain the old LINE path as a compatibility pointer.
      alternatives_considered: >-
        Copying tokens or LINE sender IDs into public SSOT was rejected;
        changing any applied EnvironmentFile or runtime route is out of scope.
  changes:
    - docs/ssot/apps/ssot.messaging-lanes.yml
    - docs/ssot/infrastructure/ssot.audit.hosts.yml
    - docs/ssot/infrastructure/ssot.system-map.yml
    - docs/kb/msg-lane-standard.md
