lessons:
  - "Parked .service files do NOT stop quadlet zombies: podman-user-generator regenerates units from ~/.config/containers/systemd/*.container — park the .container, not the .service"
  - "Container 127.0.0.1 upstreams are host-loopback blind — rootless podman; use tailnet IPs/names for host-bound services"
  - "systemd-socket-proxyd forwards can masquerade as the target service on a port — verify process identity before repointing (omen:5000 -> mn01 embedding, NOT frigate)"
