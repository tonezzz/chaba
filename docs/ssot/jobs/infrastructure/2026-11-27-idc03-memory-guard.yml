---
title: idc03 memory guard — replace idc01-era mddb drop-ins, bound co-tenants
subtitle: 2026-11-27 MDDB OOM loop (8 mddbd + 7 node kills); global OOM became a contained cgroup kill
icon: shield
date: 2026-11-27
card: mddb-idc03-oom-coldstart-publisher-window
ref: MEM-1507
status: applied-verified

context:
  symptom: >-
    media-inbox-update-kk and ops-health-report timer alerts traced to mddb
    restart windows; kernel OOM killed mddbd 8x and node runner jobs 7x on
    2026-11-27. Swap was 4/4 GiB exhausted; OOM was global_oom /
    CONSTRAINT_NONE, so any oom_score_adj=200 container process could be reaped.
  root_cause: >-
    idc03 (15 GiB / 4 core) still carried idc01's 31 GiB tuning in two
    mddb.service.d drop-ins: mem.conf (MemoryHigh=16G, MemoryMax=20G,
    GOMEMLIMIT=22000MiB) and memory.conf (MemoryHigh=24G, MemoryMax=28G,
    GOMEMLIMIT=12000MiB). The idc01→idc03 migration plan says "retune for
    idc03" — never done. Effective MemoryMax=28G on a 15 GiB host.
    mddb-cms/ops, litellm and jevos had no cgroup caps (cms peak 7.6 GiB).

changes:
  - "ansible/playbooks/idc03-memory-guard.yml — new idc03-only gated play."
  - "6 managed 60-idc03-memory.conf drop-ins (mddb, mddb-cms, mddb-ops,
    litellm, jevos, runner-agent) with MemoryHigh/MemoryMax and OOMScoreAdjust.
    mddb: 3800M/4500M, GOMEMLIMIT=3200MiB, -500; cms 2048M/2500M -400;
    ops 1536M/2048M -400; litellm 900M/1200M +500; jevos 1200M/1600M +500;
    runner-agent 400M/600M +500. Restart policy and embedding-proxy env
    preserved."
  - "Stale mem.conf and memory.conf removed after timestamped backup."
  - "Runtime MemoryHigh/MemoryMax applied via systemctl set-property — no
    service restarts. OOMScoreAdjust/GOMEMLIMIT are exec-time and take effect
    at each unit's next natural restart."
  - "docs/ssot/infrastructure/ssot.services.yml — drop_in path and tuning
    updated to the managed values."

