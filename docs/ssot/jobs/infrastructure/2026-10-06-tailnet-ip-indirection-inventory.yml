migration_plan:
  phase_0_prereq:
    - "Stand up svc.internal: add vhost blocks to stacks/web/Caddyfile (mddb.internal->current leader:11023, camwall.internal, jev.internal, ...) AND a tailnet-wide resolver — extend ~/.config/dnsmasq pattern to other hosts (or document /etc/hosts approach). Without this, class-b edits have nowhere to point."
    - "Decide rendered-file mechanism: extend scripts/mcp_debug/ssot.py ${ssot(...)} resolver into an env/quadlet renderer (render-env.py) driven by ssot.values.yml."
  phase_1_stale_fixes: "Fix the 6 stale idc01 sites above (correctness fix; lands naturally on the new names)."
  phase_2_class_a: "~40 unit/env lines fleet-wide -> MagicDNS names. Bulk-sed safe: IPs are unique per host. Generated units: fix generator/template, then regen."
  phase_3_class_c: "Render yomi envs (dell) + secrets envs (omen idc02.env, idc02 ada-lab.env, mn01 ada-ha-*.env) from ssot.values.yml; retire hand-edits."
  phase_4_class_b: "~80 repo files (script defaults + Caddyfile + served statics) -> svc.internal aliases; redeploy ~/.local/bin + caddy public copies."
  phase_5_sweep: "docs/ pass on next host move (or leave — history is legitimate). Keep ssot.values.yml, dnsmasq, PublishPort/self-binds literal."

open_questions:
  - "idc03 ssh access (key not on box from this user) — needed to inventory its live ~/.config; stacks/idc03 is the assumed source."
  - "Which host is 'the edge' for svc.internal — tony-dell web.service (tailnet-only) or idc03 public edge? Affects whether LAN/off-tailnet clients can use aliases."
  - "Bind-side literals (PublishPort, BIND_HOST, --host, dnsmasq listen-address): podman PublishPort requires literal IP — accept render-at-deploy (class c) rather than names."
  - "kk-macbook unreachable — playlive/VNC refs unverifiable but names already exist (kk-macbook.taila0626a.ts.net)."

verify:
