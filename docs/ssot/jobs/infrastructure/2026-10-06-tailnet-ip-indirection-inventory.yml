title: "Tailnet IP indirection — fleet inventory + migration list"
subtitle: "Hardcoded 100.x addresses in ~/.config (all hosts) and repo configs, classified per service-name-indirection card"
icon: list-check
version: 1
date: "2026-10-06"
card: service-name-indirection
status: inventory-complete-no-edits

method:
  pattern: '100\.(64-129.x.x) — full Tailscale CGNAT range 100.64.0.0/10'
  scanned:
    - "tony-dell ~/.config (all dirs incl. systemd, secrets, caddy, devin, containers, autostart, home-assistant, dnsmasq, yomi)"
    - "fleet ~/.config over SSH: tony-omen, idc01, idc02, mn01"
    - "repo: scripts/, stacks/, systemd/, apps/, tony-dell/, docs/, data/, backups/"
    - "tony-dell ~/.local/bin (deployed script copies)"
  not_scanned:
    - "idc03 ~/.config — SSH permission denied for tony@ and root@ from this host (key not installed); inventoried via stacks/idc03/ repo sources instead"
    - "michael-ha — SSH denied (HAOS; service config lives in /config, not ~/.config anyway)"
    - "kk-macbook — offline 3d"
    - "chrome/Devin profile caches (1.6G+ state, not config)"

tailnet_map:
  "100.68.142.13":  "tony-dell (self; postgres dnsmasq-alias 'postgre', caddy upstreams :3000 yomi/:3001 gpu/:3007-3009/:8000 status-data-api/:8084 weaviate/:9002 trade-api/:3011 notebooklm-rest)"
  "100.74.146.0":   "idc01 (RETIRED 2026-10-05 — any remaining reference is stale)"
  "100.102.134.91": "idc03 (mddb leader :11023 http /:11024 grpc /:9000 mcp, jev :8778, camwall-edge :3010/:8380, ollama :11434)"
  "100.123.163.11": "idc02 (mddb-ops :11025, camwall-edge :8380, open-jev :8777)"
  "100.106.196.22": "mn01 (xmeye-vms :5900, vms-snap :8377, gev :8780, weaviate-embed :5000, playwright :3939)"
  "100.75.102.88":  "tony-omen (frigate :8080, sensor-reader :8001, barrier-server :24800, desktop-stream :8082, open-jev :8777)"
  "100.80.105.88":  "michael-ha (:8123)"
  "100.124.59.112": "kk-macbook (vnc :5900, playlive :9231)"

decision_matrix:
  class_a_unit_envs:
    rule: "Environment=/ExecStart literals in systemd units + quadlets -> MagicDNS host name (e.g. idc03.taila0626a.ts.net). Valid today; pins host not service."
    caveat: "PublishPort=/BIND_HOST=/listen-address= need a literal IP at bind time — keep literal or render at deploy (class c). dnsmasq postgre.conf IS the indirection layer — keep."
    grpc_note: "MDDB_REPLICATION_LEADER_ADDR exists in exactly 2 places (dell + idc02 mddb.container) -> leader MagicDNS name."
  class_b_http_clients:
    rule: "http://<ip>:<port> in scripts/app code/MCP config -> edge alias (mddb.internal, camwall.internal, jev.internal ...) served by Caddy svc.internal blocks."
    prerequisite: "svc.internal does NOT exist yet. Needs (1) vhost blocks on the edge Caddy reverse-proxying to current backend, (2) tailnet-wide name resolution — MagicDNS cannot do custom names, so extend the existing ~/.config/dnsmasq pattern (port 5353, server=100.100.100.100 fallback) per host or use /etc/hosts+tailscale0. Design decision required before mass edit."
    interim: "Script defaults like ${MDDB_URL:-http://100.102.134.91:11023/v1} can go to MagicDNS today if alias lands later."
  class_c_secrets_env:
    rule: "~/.config/secrets/*.env and ~/.config/yomi/*.env -> rendered from ssot.values.yml hosts.* table."
    mechanism: "Existing ${ssot(...)} resolver in scripts/mcp_debug/ssot.py (ssot.dynamic-references.yml). Add an env-file renderer (render-env.py or extend regen) so a host move = edit ssot.values.yml + re-render + restart units."
  exempt:
    - "docs/ ~125 files — kanban history, KB, runbooks. Refresh opportunistically; legit historical records."
    - "backups/, data/migration-snapshots/, michael-dev .storage/auth last_used_ip + *.log — runtime state, not config."
    - "~/.config/Devin/User/History, ~/.config/containers/mddb/rebuild-*/ — editor history + one-off ingest snapshot."
    - "~/.config/secrets/archive-*/ — archives."
    - "ssot.values.yml itself — the canonical source."

