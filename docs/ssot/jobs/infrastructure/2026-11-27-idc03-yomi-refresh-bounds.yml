lessons:
  - "For a container cgroup OOM, keep the memory cap and bound the work that
    fills it: page depth, retained messages, media fan-out and sweep size."
  - "A new pinned file has no installed copy to back up; stat installed
    destinations first and only back up the ones that exist."
  - "Check-mode verification of installed hashes must be gated out when the
    install task itself is gated out, or --check reports false failures."
  - "NODE_OPTIONS in the container env file is inherited by spawned node
    workers, giving a V8 heap ceiling inside the cgroup ceiling."
