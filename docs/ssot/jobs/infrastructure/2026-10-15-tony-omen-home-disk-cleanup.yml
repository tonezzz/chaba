    Invisible to disk-trend-watch: watchlist only covered ~/.cache +
    /var/log; .config was uninstrumented.
  retired_archive: >
    /home/tony/mddb-backups-idc01-retired = 64G of Sep/Oct mddb dumps
    left behind after the 2026-10-11 move-cache pass (which only moved
    the live mddb-backups dir).
  devin_cli_backups: >
    ~/.local/share/devin/cli/backups (13G, three multi-GB sessions.db
    snapshots) + sessions.db.bak-20261013 (5.8G) — each backup is ~5.8G
    because sessions.db itself is bloated to 5.8G.
  other_growth: >
    model-bench (18G) + .ollama (18G) downloaded 10-13/10-14 (gemma-3-27b
    GGUF 15.4G, sdxl-lightning, ollama pulls) — left in place, active
    benchmarking data.

actions:
  - "purged 10,669 BrowserMetrics-*.pma (kept newest 10): ~42G freed"
  - "moved mddb-backups-idc01-retired 64G -> /data/backups/mddb-backups-idc01-retired + symlink at original path"
  - "moved 2 older devin-cli backups + sessions.db.bak-20261013 (~13.5G) -> /data/backups/devin-cli/ (kept newest on /home)"
  - "installed interim crontab on tony-omen: */30 find ~/.config/*/BrowserMetrics .pma -mmin +120 -delete (caps leak at ~2h of files until repo fix propagates)"
  - "scripts/system-maintenance.mjs: added browserMetricsCleanup() (keep 50 newest .pma per profile) — runs daily 03:00 via existing cron"
  - "scripts/ada/disk-trend-watch.py: added $HOME/.config/*/BrowserMetrics to default DU_ROOTS so the leak is trended next time"

result:
  home: "306G fs: 99% (3.7G free) -> 59% (122G free); ~118G reclaimed"
  data: "295G fs: 61% -> 86% (42G free) after absorbing ~77G of moves"

