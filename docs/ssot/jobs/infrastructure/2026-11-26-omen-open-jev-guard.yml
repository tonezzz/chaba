title: open-jev guard — OMP thread cap and conditional swap reclaim on tony-omen
date: '2026-11-26'
host: tony-omen (100.75.102.88, Tailscale)
decision: tony-omen-cpu-job-guard-2026-11-25 (ssot.technical-decisions.yml)

problem: |
  open-jev.service (port 8777, gemma-3-4b-it on CPU) runs under CPUQuota=200%
  but the process carries ~43 threads (torch's CPU-count-sized intra-op pool
  plus Starlette/anyio's 40-thread sync-endpoint pool); over ~15h its working
  set accumulated 7.5 GiB VmSwap at the MemoryHigh=4G cap. The 08:07 reclaim
  restart spiked 1m load to 93.91 during swap-in. Metrics showed real
  inference cost (214s/request), not idle spin: threads were sleeping between
  requests.

decision: |
  Keep the model and the existing caps. Cap the OpenMP pool to match the
  2-CPU quota, and turn the incident-driven reclaim into a daily conditional
  check. Do NOT raise MemoryHigh/MemoryMax to hold ~12 GiB in RAM (would
  starve the 16G cpu-jobs.slice used by evals), do NOT add a tight
  MemorySwapMax (converts accumulation into cgroup OOM), do NOT swapoff.
  Netdata cannot see user cgroups in this container, so the alert watches
  mem.swapio swap-in (the actual incident signature ~15 MiB/s) rather than a
  nonexistent per-service cgroup dimension; the exact MemorySwapCurrent > 4G
  check lives in the reclaim script.

what_changed: |
  - ansible/playbooks/open-jev-guard.yml (new, role=exec checkout; committed
    from a dispatch worktree because ~/CascadeProjects/chaba is role=exec).
  - ~/.config/systemd/user.control/open-jev.service.d/60-OMPThreads.conf
    Environment=OMP_NUM_THREADS=2.
  - ~/.local/bin/open-jev-reclaim.sh (0755) — reads MemorySwapCurrent,
    restarts open-jev only when > 4096 MiB, logs both outcomes to journal.
  - ~/.config/systemd/user/open-jev-reclaim.{service,timer} — oneshot +
    OnCalendar=*-*-* 04:00:00, Persistent=true.
  - /home/tony/netdata/etc/health.d/tony-openjev.conf — tony_openjev_swap_in
    warn > 6000 KiB/s, crit > 10000 KiB/s, 2m average, to sysadmin.

preflight: |
  Target confirmed from ansible/inventory/hosts.yml (primary_workstations,
  ansible_host 100.75.102.88) and docs/ssot/infrastructure/, not memory.
  ansible-playbook --check --diff --limit tony-omen: 0 unreachable / 0 failed,
  changed=5. First check exposed a mode regression (0700 -> 0755 on
  ~/.config/systemd/user); the file task was changed to preserve mode and
  rechecked clean. Backup before converge:
  /home/tony/backups/openjev-guard-20261126T082952 (existing dropins).
  Restart of open-jev was called out and approved as part of the request.

verification: |
  Converge: ok=11 changed=5 failed=0. Recheck (--check): changed=0.
  OMP_NUM_THREADS=2 present in /proc/<pid>/environ of both the uv parent and
  the openjev worker; torch.get_num_threads()=2 in a fresh worker process.
  Do NOT read thread count from MainPID: that is the 2-thread `uv` wrapper.
  The real worker is the child `openjev serve` process, which carries the
  Starlette/anyio default 40-token pool (every @app route is a sync `def`)
  plus torch's intra-op threads. The OMP cap binds torch's intra-op pool
  only; it does not shrink the anyio pool.
  MemorySwapCurrent 819 MiB -> 0 after restart.
  /health 200 in 88ms after model load; /metrics reachable.
  Live /score smoke test on the 2-thread cap: HTTP 200 with the correct best
  option, 400s total (prefill 121.8s + options 278.0s). A torch matmul
  microbenchmark (256x2048 @ 2048x2048, 20 reps) gave 47.5ms / 27.8ms /
  22.9ms / 18.2ms / 53.0ms at 1 / 2 / 4 / 8 / 12 threads — the 12-thread
  default is a contention cliff worse than single-thread. The cap keeps torch
  off that cliff and inside the 200% CPU quota; 8 threads is the raw-throughput
  optimum but would fight the 2-CPU quota.
  Timer next fire Fri 2026-11-27 04:00:00 +07.
  Reclaim script manual run: "open-jev swap 0MiB <= 4096MiB - no restart needed".
  Alarm loaded: GET /api/v1/alarms?all=true contains
  mem.swapio.tony_openjev_swap_in (silent at ~1.7 MiB/s swap-in, correct).
  Note: /api/v1/alarms without ?all=true only lists non-CLEAR alarms, so an
  empty list means healthy, not missing config.

follow_up_incident_20261127: |
  The daily reclaim fired correctly at 04:00 +07 on 2026-11-27: swap was
  5626 MiB > 4096 MiB, open-jev restarted, Result=success (next fire Sat 04:00).
  But by 09:17 swap was back at 5.69 GiB and /health timed out; load average
  39.18 / 20.40 / 20.88. py-spy showed 40/40 AnyIO worker threads active in
  Gemma3 `Linear.forward`, 93 threads total, 185% CPU, no requests logged
  (uvicorn only logs after a response, so the burst was never visible).
  SIGTERM failed; SIGKILL was required. Same signature as the 2026-11-26
  15:32 incident — this is a recurring availability failure, not swap alone.

  Fix (user-approved 2026-11-27): bound in-flight inference in
  openjev/server.py with a threading.Semaphore, default 2 via
  OPENJEV_MAX_INFLIGHT, acquired in /score and /v1/systemone with
  `acquire(blocking=False)`; excess requests get HTTP 429 + Retry-After: 60.
  The systemd drop-in now sets Environment=OPENJEV_MAX_INFLIGHT=2 explicitly.
  Clean commit vs upstream main is open-jev branch ops/openjev-inflight-guard
  @ 7c864c3; push to daseinlabs/open-jev was denied (403, no fork), so the
  patch is archived at docs/kb/patches/open-jev-inflight-guard-20261127.patch
  for a future PR by someone with upstream write access.
  Both copies of the repo (idc02 and tony-omen) had pre-existing uncommitted
  user changes (lane_metrics, bf16 CPU dtype); the guard was layered on top
  and left uncommitted so that work is not overwritten.

  Verified with a stubbed scorer + TestClient on tony-omen: three concurrent
  /score calls produced statuses [200, 200, 429] and /health stayed 200
  throughout. Live service restarted 09:24:44 and /health 200 in 138ms with
  load_s=55.9. The reclaim timer alone is insufficient at daily cadence;
  reassess after the concurrency bound has run for a full day.

  Production observation 2026-11-27 09:24-09:47 (+07): /health stayed 200
  (13-138ms) throughout; service MemorySwapCurrent fell from 5.69 GiB to
  ~0.98 GiB, zram from 23G to 17.9G, load average from 39.18 to 6.44.
  /metrics counted 11 completed /v1/systemone calls and 12 rejected bursts
  (429 + Retry-After: 60), all from 100.75.102.88; no AnyIO pileup recurred
  (2 worker threads, one in Linear.forward, one waiting). Important caveat:
  every completed call landed only in the le_inf latency bucket (le_60 = 0),
  ~130s each, and uvicorn logged no 200 lines for them — consistent with
  callers disconnecting on a shorter timeout while the handler still runs.
  The guard prevents collapse but does not make CPU gemma-3-4b fast; caller
  timeouts and model choice remain a separate capacity question.

rollback: |
  Delete the 4 installed files and the alarm file, then:
    systemctl --machine=tony@.host --user disable --now open-jev-reclaim.timer
    systemctl --machine=tony@.host --user daemon-reload
    docker exec netdata netdatacli reload-health
    systemctl --machine=tony@.host --user restart open-jev.service
  Original dropins are preserved in the backup path above.

lesson: |
  Netdata in this container binds /host/proc and /host/sys but does not
  discover user.slice cgroups, and apps_groups.conf would require overriding
  the whole default grouping plus a Netdata restart. A stock-chart alarm on
  the observed symptom is more robust than a custom plugin for one service.
  A fixed daily restart was replaced with a threshold check because the
  swap accumulation tracks request volume and plateaus; unnecessary restarts
  would interrupt in-flight /v1/systemone calls for no benefit.
  Do not use `ps -o nlwp` on MainPID to verify an OMP cap: MainPID is the uv
  wrapper, not the worker, and sync FastAPI endpoints lazily fill anyio's
  40-thread pool on first request. Verify with torch.get_num_threads()
  in-process or /proc/<worker-pid>/environ. The anyio pool is NOT benign:
  40 simultaneous multi-minute inferences exhaust it and take /health down.
