findings_fixed: |
  1. L3 renderer crash (ROOT CAUSE of current staleness):
     chaba-system-report.service on con01 has failed every run since
     2026-11-21 06:51 with KeyError 'no-config' in
     scripts/report-system.py render_markdown — mcp-inventory started
     emitting the `no-config` status (idc03 + mn01 answered but run no
     agent lane) and _BADGE/_WORST never learned it. Served
     system-report.yml frozen at 2026-11-20T06:48 — the watchdog's
     "stale" chain alert is correct; the "21 red nodes" picture is stale.
     FIX (this worktree): added no-config to _BADGE + _WORST (informational,
     worst=1 like untracked/planned/dormant — matches report-watch's
     BAD_NOW/BAD_SUSTAINED which already ignore it).

  2. Watchdog offline_ok gap: system-report-watchdog.py counted
     audit-hosts/macbook unreachable as red forever — registry declares
     offline_ok but the rendered yml didn't carry the flag and the
     watchdog never read the registry. FIX: resolve_node() now emits
     offline_ok per node; watchdog exempts unreachable+offline_ok, with a
     registry fallback for yml rendered before the flag existed.

  3. ha-live 502 (found via overnight-assessment health_snapshot):
     tony-omen rebooted ~2026-11-23 18:00; ha-live.service (Gemini Live
     bridge, tailscale serve :8444 -> :9005 inside tony-ha) was left
     disabled+inactive — never enabled since the 10-19 evacuation unit
     was written. Started + enabled 2026-11-25 09:41; edge returns 200.
     Sibling units still down: plug-watch, ha-stall-watchdog,
     playlive-chrome, yolo-detect — carded OPS-1367.

  4. ada-stt-con01 health check false-positive: con01 ada-stt.service
     stopped+disabled 2026-11-23 (absorber shed; undocumented). idc03's
     own ada-stt is active/healthy and is the prod fallback; the last
     consumer still pointing at con01 (telegram-mn-bot TG_WHISPER_URL on
     idc03, ada-tg-relay-mn.service) was repointed to 127.0.0.1:8914 and
     the relay restarted — mn-ha lane STT works again. SSOT health entry
     marked disabled:true with re-enable instructions (honored by
     scripts/audits/http-health-audit.mjs).

