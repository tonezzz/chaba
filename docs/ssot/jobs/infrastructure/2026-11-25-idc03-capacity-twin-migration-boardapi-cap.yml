    - "scripts/board/board-api.py: new _cards_json_payload() caches the ~14MB cards.json parse by (mtime_ns,size) signature — every /cards|/card/*|/queue call previously re-read+re-parsed it (~150MB transient allocs/call drove the RSS ratchet); failed reads are NOT cached; returns a shallow copy so callers cannot mutate the cache"
    - "tests: tests/board reads+mutations+action_persistence+jobs_evidence = 94 passed; full tests/board 226 pass / 1 unrelated env failure (board2/index.html is gitignored, absent in worktree)"
verification:
  - "idc03 free -m: available 4480MB -> 6934MB; used 11.5G -> 9.1G"
  - "board-api MemoryCurrent 2.07GB -> 0.5GB post-restart, capped at 2.2GB"
  - "omen twins active on tailnet IP; idc03->omen :8005/:8009 HTTP 200"
  - "scenario-provider-gate --dry-run --live-url http://100.75.102.88:8005 -> 'ok — provider healthy', free_lane=free, exit 0"
  - "ada-scenario-smoke.service manual run 09:35: ExecCondition status=0/SUCCESS, container Up, suite running vs omen (end-to-end verification in progress at write time; hourly timer also fires 10:00)"
gotchas_hit:
  - "systemd --user MemoryCurrent for quadlet containers includes page cache charged to the cgroup — mddb-ops read 2.95G but real anon RSS is 71MB. Always check /proc/<pid>/smaps_rollup Anonymous before believing cgroup memory."
  - "venv relocation breaks console-script shebangs silently — processes keep running on the old interpreter until restart, then 203/EXEC. After moving/renaming a venv, grep .venv/bin/* for the old path."
  - "uvicorn --host 127.0.0.1 makes a 'migration' cosmetic — the service answers locally but is unreachable from the tailnet; verify from the CONSUMER host, not localhost."
  - "LINE_NAME_BACKENDS in line-bot.env is a second consumer surface for the dev twins — scenario units were not the only 127.0.0.1:8005/8009 references."
  - "ada-scenario-smoke 'Failed with result timeout' after a completed run is a pre-existing TimeoutStartSec quirk — the suite finishes its report then gets SIGKILLed; findings still publish."
open_items:
  - "deploy-ada.sh SERVICES default still lists ada-dev ada-kk-dev — next fleet deploy on idc03 resurrects ~656MB. RECOMMENDED PATCH (ada-voice repo, could not push from dispatch): change line 33 default to drop the twins — the default is documented as the idc03 set and omen deploys already must pass ADA_SERVICES (omen lacks the other units). One-line diff: SERVICES=\"${ADA_SERVICES:-ada-ha-tony ada-ai-kraut ada-tg-relay-kk ada-tg-relay-mn ada-kk ada-line-relay ada-tg-relay}\""
  - "board-api payload-cache + gate --live-url fixes ride the dispatch branch -> master merge -> idc03 exec/served-checkout pull (~15-60min) -> board-api needs a restart to load the cache fix; gate ExecConditions already run the runner-dir copy so suites are unblocked NOW"
  - "after merge, optionally repoint the 4 ExecConditions from ~/.local/share/ada-scenario-runner/scenario-provider-gate.py back to %h/CascadeProjects/chaba/scripts/ada/scenario-provider-gate.py (repo copy will then understand --live-url)"
  - "swap still 100% used (4Gi) — left alone; pages fault back on demand, swapoff would add I/O pressure under load8-12"
  - "omen load average ~66 already — twin hosting is fine memory-wise (12Gi avail) but adds to its CPU contention; watch if omen becomes the next bottleneck"
decision:
  resize_vps: "NOT NEEDED — non-spend options recovered ~2.5Gi+ headroom (available 4.4->6.9Gi, done-condition >=4GB met). Revisit only if board-api regrowth or new residents eat the margin; the MemoryMax cap makes board-api self-limiting meanwhile."
  mn01_migration: "rejected — 684Mi available, cannot host even one twin"
  mddb_consolidation: "not feasible cheaply — mddb (1.46G) + mddb-cms (1.72G) are separate 4.8G/18G databases; merging is a migration project, not a dispatch fix; mddb-ops is only 400MB real"
  doc_archive_move: "assessed, skipped — 331MB for the complexity of repointing devin-dispatch.sh + host-services-cms consumers to omen"
