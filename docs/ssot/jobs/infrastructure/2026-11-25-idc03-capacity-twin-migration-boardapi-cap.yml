    - "fixed 24 shebangs in ~/CascadeProjects/ada-voice/.venv/bin/* ada-pi/.venv -> ada-voice/.venv; uvicorn --version verified"
    - "daemon-reload + restart -> both active, listening 100.75.102.88:8005/:8009"
    - "verified from idc03: GET / 200 in ~30ms; /ws 403 = same auth-gated response as the local twin (parity)"
    - "secrets parity proven: md5 of ADA_API_KEY/ADA_API_KEYS/ADA_INSTANCE_ID/ADA_JEV_URL identical idc03 vs omen ada-dev.env"
  idc03_consumers:
    - "ADA_LIVE_URL repointed ws://127.0.0.1:8005/ws -> ws://100.75.102.88:8005/ws in: ada-scenario-smoke.container (quadlet), ada-scenario-{cms,reports,research}.service; daemon-reload regenerated smoke unit — verified"
    - "line-bot.env LINE_NAME_BACKENDS: kaewta-cms/kaewta-dev -> :8009 and ada-dev/chaba-dev -> :8005 now point at ws://100.75.102.88 (backup .bak-pre-omen-twin-20261125); ada-line-relay.service restarted active"
    - "ada-kk-dev had ZERO consumers (only its own unit referenced :8009)"
    - "paid-lane guard in scenario-suite-run.sh keys on URL port only — ws://100.75.102.88:8005 still classifies as FREE dev lane (verified by reading the port-extraction logic)"
  idc03_reclaim:
    - "systemctl --user stop+disable ada-dev.service ada-kk-dev.service -> inactive/disabled (~656MB)"
    - "guard comments added inside both unit files warning deploy-ada.sh SERVICES still lists them"
    - "chaba-board-api.service.d/memory-cap.conf: MemoryHigh=1600M MemoryMax=2200M; service restarted 2.07GB -> 34MB fresh"
  provider_gate:
    - "FOUND+FIXED: scenario-provider-gate.py ExecCondition (smoke/cms/reports/research) requires `systemctl --user is-active ada-dev` — stopping the twin would gate every dev-lane suite 'infra' forever"
    - "added --live-url to scripts/ada/scenario-provider-gate.py (dispatch branch): remote mode probes the provider over HTTP, skips the local-journal quota check (no local journal for a remote backend; in-suite outage sentinel is the backstop), keeps the free-lane sha check against the local secrets env"
    - "deployed patched copy to idc03:~/.local/share/ada-scenario-runner/scenario-provider-gate.py and repointed the 4 ExecConditions to it with --live-url http://100.75.102.88:8005 (backups *.bak-premote-gate-20261125); repo path keeps working once the branch merges — repoint back then or keep the runner-dir copy"
    - "first post-change smoke run gated 'infra' under the OLD script (honest skip, 7/47 infra records); new gate verified --dry-run ok + live run started 09:35 with ExecCondition status=0"
