title: idc03 capacity — finish twin migration to omen, cap board-api leak, repoint scenario/LINE consumers
card: idc03-structural-capacity-15gb-4core-per-2d787f
date: 2026-11-25
executor: devin-dispatch
pattern: "idc03 15GB at ~13-14GB, dispatch load-gate starves kanban queue"
summary: >-
  Assessment + non-spend remediation for idc03 memory pressure. Phase-1
  (2026-11-18) had already moved jev-student + ada-dev/ada-kk-dev to
  tony-omen, but the twins were still active on idc03 (~656MB residual)
  and — discovered this session — the omen copies bound 127.0.0.1 only,
  so they were unreachable from idc03 since migration day and had never
  actually served a scenario. This session: rebound omen twins to the
  tailnet IP, repaired a broken relocated venv (shebangs pointed at the
  deleted ada-pi/.venv), repointed all idc03 consumers (4 scenario
  units + LINE bot name backends), stopped the idc03 twins, capped the
  board-api RSS ratchet with a systemd MemoryMax drop-in, and landed a
  load_cards() payload-cache fix on the dispatch branch. MemAvailable
  went ~4.4Gi -> ~6.9Gi. VPS resize (option a) is NOT needed now;
  documented as deferred.
pre_state:
  - "idc03: 15Gi total, ~11Gi used, available ~4.4Gi, swap 4Gi 100% used, load5 ~12 on 4 cores"
  - "board-api cgroup 2.07GB after only 13h uptime (~150MB/h ratchet); writes are atomic (card_io.atomic_write_text) so OOM restart is safe"
  - "ada-dev 345MB + ada-kk-dev 311MB still active on idc03 (disabled but restarted by every deploy-ada.sh run — SERVICES default still lists them)"
  - "omen ada-dev/ada-kk-dev active but bound 127.0.0.1:8005/:8009 — connection refused from idc03 since 2026-11-18 (prior comms flagged this)"
  - "omen ada-voice/.venv was relocated from ada-pi; all 24 console-script shebangs pointed at deleted /home/tony/CascadeProjects/ada-pi/.venv — any restart would 203/EXEC (latent outage, caught before it bit)"
  - "mn01 rejected as migration target: 684Mi available of 7.1Gi"
  - "MDDB real RSS: mddb 1.46G + mddb-cms 1.72G + mddb-ops 0.40G + panel ~0 — systemd MemoryCurrent for mddb-ops showed 2.95G but that is page-cache-inflated (anon only 71MB)"
