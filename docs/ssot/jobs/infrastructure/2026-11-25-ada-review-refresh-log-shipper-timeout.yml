title: ada-review-refresh log-shipper 600s timeout — root cause + fix
subtitle: >-
  The unit's exit-1 was an uncaught subprocess.TimeoutExpired on the
  log-shipper fallback lane, not a compute problem. Root cause is the
  same one OPS-1153 diagnosed on idc03 in November: per-doc /add posts
  cannot drain a backlog inside 600s when MDDB write latency climbs.
  The proven fix (batch via /v1/ingest + per-batch cursor checkpoint)
  existed only on an unmerged dispatch branch since 2026-11-08 — this
  change lands it on master and hardens the caller.
