title: "Routing proposal v3 — flash-lite offload: job-class lanes already on kk-mac; the real-name chain is the actual spend"
date: 2026-11-25
card: kk-mac-offload-flash-lite
ref: OPS-1363
parent_eval: kk-mac-card-judgment-eval (KNB-1087)
extends: docs/ssot/jobs/devnest/2026-11-18-kk-mac-routing-proposal.yml
session: "devin-dispatch 20261125-102320 (idc02)"
status: proposal — awaiting approval (board request raised on the card)

context: >-
  Card spec assumed the steady gemini-3.5-flash-lite spend sits in the
  tool-call/summary/classify job-class lanes and asked to move them to
  the kk-mac local legs "where admission gates pass". SpendLogs says
  otherwise: summary/classify/bench have been kk-mac leg-1 since
  2026-11-13 and their paid-leg spill is ~$0.09 in November. The money
  is in the REAL-NAME gemini-3.5-flash-lite chain, driven by opencode
  callers. This proposal covers both: confirms the deployed job-class
  placement, adds the tool-call resilience leg the eval gate has nearly
  earned, and names the real-name offload as the actual durable lever.

