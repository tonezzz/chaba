question: |
  Audit non-Live model calls and key budgets. Board-api /lesson Thai
  translation bypassed LiteLLM SpendLogs via gemini_rest's direct-Google
  default + missing GEMINI_BASE_URL. Live VerificationToken caps diverged
  from SSOT (chaba $20 vs $5, ada $30 vs $10, bench over $2). No cap or
  routing changes without owner policy.

findings: |
  1. Non-Live text inventory: metered = ada REST side-calls (per-lane
     virtual keys + lane/tool/session tags), board-api /lesson
     (free-only route, mddb key), wp-news-digest, wp-comment-sync,
     kanban-brief, embed lanes, evals on bench/chaba/ada keys.
     Unmetered = devin-bank-distill (chaba-paid.env PAID, no
     GEMINI_BASE_URL), ada-memory-distill (backend.env PAID),
     backlog-spec-enrich (PAID), ada-lesson-miner (FREE),
     wp-news-digest Thai/synth fallback legs (PAID), yomi-api, ops
     manual tools, probes (by design). Gemini Live WS + Edge TTS out of
     scope per spec.
  2. Budgets: LiteLLM_AuditLog EMPTY (audit logging off). Journal shows
     POST /key/update 2026-10-24 09:08+14:07 local, right after chaba
     $5-cap 422s during ai-workforce-eval opencode burns (~$27.5
     chaba+ada via or-claude-fable-5.1, requester tony-dell). Caps
     raised live, never written to SSOT. ada key actively serves
     opencode from tony-macbook — "spare" doc was wrong.
  3. keys ada/chaba/mddb/michael have models={} (unrestricted model
     access — any holder can burn paid legs). Live litellm config.yaml
     drifts from repo (fable/omen/colab/groq legs, custom_callbacks).
  4. No virtual-key budget watcher existed; daily-ledger published
     hardcoded stale caps.

