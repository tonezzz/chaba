title: tony-omen snapd-desktop-integration restart loop — CRD session env never reaches systemd --user
date: 2026-11-25
card: tony-omen-snap-desktop-restart-loop
ref: OPS-1323
status: fix-applied-verified-live-~18h; post-boot auto-verifier armed via self-removing @reboot cron (attempt 3); reboot deferred — active GPU eval queue on host (attempt 4)
host_scope: fix on tony-omen only (~/.config/systemd/user drop-in); read-only elsewhere

context:
  symptom: |
    snap.snapd-desktop-integration.snapd-desktop-integration.service
    (user unit, /etc/systemd/user/, auto-generated by snapd for the
    snapd-desktop-integration snap) exited every ~12s with
    "Failed to open display" / status=2/INVALIDARGUMENT.
    NRestarts passed 11,173 in the current boot; a 2026-10-24 trail
    noted ~34,580 cumulative restarts.
  environment: |
    tony-omen has NO logind graphical session (loginctl shows only
    user/manager/chrome-remote-desktop sessions; no gnome-shell,
    plasmashell, Xorg or wayland compositor). The desktop is
    Chrome Remote Desktop: chrome-remote-desktop host runs
    `Xvfb :20 -auth /home/tony/.Xauthority` plus an XFCE session
    (.chrome-remote-desktop-session -> dbus-run-session xfce4-session;
    xfce4-session/xfwm4/xfce4-panel all alive). CRD sessions bypass the
    PAM/login-session path, so DISPLAY/XAUTHORITY are never imported
    into the systemd --user manager environment
    (`systemctl --user show-environment` has no DISPLAY).
    Linger=yes, so user@1000 (and this unit, WantedBy=default.target)
    starts at boot — long before/without any display env.
  root_cause: |
    The snapd-desktop-integration daemon is a GTK app; it needs a
    display. On a normal Ubuntu desktop, gnome-session imports
    DISPLAY/WAYLAND_DISPLAY/XAUTHORITY into systemd --user and the
    unit inherits them. On tony-omen nothing performs that import, so
    every start fails "Failed to open display" and Restart=on-failure
    loops forever (~12s period, no StartLimit in the generated unit).

reproduction:
  - 'DISPLAY=:20 snap run snapd-desktop-integration -> "Authorization
    required" (X auth missing).'
  - 'DISPLAY=:20 XAUTHORITY=/home/tony/.Xauthority snap run
    snapd-desktop-integration -> runs clean — connects to Xvfb,
    prints "New theme: gtk=Greybird icon=elementary-xfce-dark ...",
    "All available theme snaps installed".'

fix:
  path: user drop-in (narrowest durable)
  file: |
    /home/tony/.config/systemd/user/
      snap.snapd-desktop-integration.snapd-desktop-integration.service.d/
      override.conf
    [Service]
    Environment=DISPLAY=:20
    Environment=XAUTHORITY=/home/tony/.Xauthority
  why_not_mask: |
    Masking would stop the loop but permanently disable snap desktop
    integration (theme sync for firefox/gemini-desktop/snap-store)
    even though a working display exists. The env fix makes the
    service actually do its job.
  why_not_snap_remove: |
    Card forbids disabling unrelated snap apps; the snap is the
    integration layer other snaps use. Untouched — `snap list` and
    `snap connections` unchanged.
  durability: |
    Drop-in lives in ~/.config/systemd/user — survives reboot and snap
    refreshes (the auto-generated unit in /etc/systemd/user is only
    rewritten by snapd, drop-ins are not touched). If CRD ever moves
    off display :20 the override needs a one-line DISPLAY update
    (noted in the file comment). If Xvfb is not yet up when the unit
    first starts after boot, Restart=on-failure retries (~2s) until
    the display exists — self-heals, restart counter may tick a few
    times then freezes.

verification:
  live: |
    systemctl --user daemon-reload + restart at 2026-11-25 09:54:57 +07.
    ActiveState=active SubState=running NRestarts=0; journal shows
    theme detection + "All available theme snaps installed", only
    harmless libEGL/DRI3 warnings under Xvfb. Stable >90s (loop period
    was ~12s).
    Attempt-2 re-check ~12h later (2026-11-25 21:53 +07): still
    active/running, NRestarts=0 (≈3,600 loop-restarts avoided), zero
    errors in 12h of journal, /proc/<pid>/environ confirms
    DISPLAY=:20 + XAUTHORITY=/home/tony/.Xauthority on the live
    process, `systemctl --user cat` shows the drop-in merged.
    Boot-order evidence from current boot (journal vacuumed before
    snap-unit entries, but unit start precedes Xvfb by design):
    user@1000 ActiveEnter 2026-11-23 18:51:55 +07, Xvfb :20 lstart
    18:51:56 — the unit's first post-fix start may fail once or twice
    while Xvfb comes up, then Restart=on-failure (2s) self-heals;
    failure cadence (~12s) stays under StartLimitBurst=5/10s so the
    unit can never get parked failed by slow Xvfb.

attempt_3_findings: |
    (2026-11-25 ~22:10 +07)
    - Fix still healthy: NRestarts was 0 from 09:54:57 to 15:05:28
      (~5h10m wall, "Consumed 1.142s CPU"), zero "Failed to open
      display" in that window.
    - Measured dead-display failure latency directly:
      `DISPLAY=:99 XAUTHORITY=... snap run snapd-desktop-integration`
      fails in ~12.5s real time. Each failed start therefore holds the
      unit ~12.5s + RestartSec=2s ≈ 14.5s, i.e. <1 start per 10s
      StartLimitInterval — StartLimitBurst=5/10s mathematically cannot
      trip, so the unit can never park failed while Xvfb is absent.
      Post-boot self-heal is guaranteed regardless of Xvfb readiness.
    - NRestarts=2 observed 15:05-15:08 — NOT the original bug. Root
      cause of those restarts: the CRD display session itself was
      recreated. chrome-remote-desktop child-process (PID 3509754)
      logged "Launching X server and X session" at 15:08:01 and a new
      Xvfb :20 (PID 3510131) replaced the Nov-23 instance; a CRD client
      (tonezzzz@gmail.com) had connected 15:07:14 and disconnected
      15:07:57. Each display-session teardown costs the GTK daemon its
      X connection -> exit status=2 -> Restart=on-failure reconnects to
      the new Xvfb (~30-60s to theme-detect). Expect NRestarts to tick
      occasionally on CRD session churn; that is correct behavior, not
      the restart loop. The 15:05:28 exit (before the client connect)
      has no "Failed to open display" line and may have been triggered
      by the manual `snap run` probe — lesson: do not `snap run` a
      live daemon snap even with a dead DISPLAY.
    - Post-boot path now covered automatically instead of waiting on a
      reboot window: user crontab @reboot line runs
      /home/tony/.local/bin/snap-boot-verify-ops1323.sh, which sleeps
      300s, reads NRestarts/ActiveState/journal-error counts plus Xvfb
      :20 presence, posts the verdict to board-api card comms, then
      removes its own cron line and deletes itself (uptime>1200s guard
      prevents firing on cron-daemon restarts mid-uptime). State kept
      in ~/.local/state/snap-boot-verify-last.txt +
      snap-boot-verify-ops1323.log. Rollback: nothing to roll back —
      it self-destructs on first real boot; to cancel early:
      `crontab -l | grep -v snap-boot-verify-ops1323 | crontab - &&
      rm ~/.local/bin/snap-boot-verify-ops1323.sh`.

attempt_4_findings: |
    (2026-11-25 ~15:25 +07)
    - Re-verified: unit active/running, NRestarts=2 (the two legit
      CRD-churn reconnects from attempt 3, stable since 15:08:39),
      zero "Failed to open display" journal lines since 10:00, drop-in
      intact in DropInPaths, `snap list` untouched (firefox,
      snap-store, gemini-desktop etc. all still enabled).
    - Reboot decision: Tony answered reboot-now at 15:02, but
      tony-omen is running an active upscale-eval queue in
      /tmp/resshift-eval — queue-v1-rsd.sh (PPID 1) chains
      resshift-v3-s4-g128 (finished ~15:24) -> resshift-v1-s15-g128
      (running) -> rsd-one-step-gpu, ~1.5h+ of GPU/CPU work remaining,
      plus llama-server and openjev services; 12 cores at load ~66.
      Rebooting now would destroy that queue for a verification the
      armed @reboot script performs automatically on the next natural
      boot. Deferred reboot; verifier remains the close-out path.
      If Tony wants instant post-boot proof anyway: reboot tony-omen,
      the script posts the verdict to this card ~5min after boot.

post_reboot: |
    COVERED AUTOMATICALLY (attempt 3) — no reboot window needed from
    Tony. A self-removing @reboot cron verifier is armed on tony-omen
    (see attempt_3_findings): ~5min after the next boot it posts
    NRestarts/ActiveState/display-error counts + Xvfb :20 presence to
    this card's comms, then deletes itself. Manual check remains:
    `systemctl --user show
    snap.snapd-desktop-integration.snapd-desktop-integration.service
    -p NRestarts` should stay flat (or tick a few times in the first
    minute while Xvfb starts, then freeze) and journal should show no
    "Failed to open display" after Xvfb is up. Note: NRestarts may
    legitimately tick 1-2x whenever the CRD display session is
    recreated (client connect/disconnect churn) — that is the daemon
    reconnecting to a NEW Xvfb, not the loop; the loop signature is
    "Failed to open display" every ~12s forever.
    History: attempts 1-2 left this PENDING pending a reboot window
    (host too loaded for unattended reboot; board request
    snap-reboot-verify-window still open with options
    reboot-now / wait-natural / tony-reboots — wait-natural is now
    the expected path since the verifier reports automatically).

rollback: |
  rm ~/.config/systemd/user/snap.snapd-desktop-integration.
  snapd-desktop-integration.service.d/override.conf &&
  systemctl --user daemon-reload && systemctl --user restart
  snap.snapd-desktop-integration.snapd-desktop-integration.service
  (returns to the previous restart-loop behavior — i.e. rollback only
  makes sense if the display env approach itself breaks).

gotchas:
  - Chrome Remote Desktop "sessions" are not logind graphical
    sessions — loginctl type is chrome-remote-desktop, no
    XDG_SESSION_TYPE=wayland/x11, and session env (DISPLAY etc.) stays
    inside the CRD dbus-run-session, invisible to systemd --user.
  - 'snap run of a confined snap with the x11 plug still needs real
    DISPLAY+XAUTHORITY in its environment; snapd does not invent them.'
  - Board-api write lock saturates under idc03 load — retry /comment
    and /request after retry_after_s instead of assuming failure.
  - User-unit journal reads need `journalctl --user -u <unit>`;
    plain `journalctl -b -u` sees only the system journal and reports
    "No entries" for user units.
  - 'Dispatch attempt-1 failure mode was procedural, not technical —
    outcome/jobdoc files were left untracked in the worktree so
    merge-sweep found nothing to land. Always git add deliverable
    docs before ending a dispatch session.'
  - 'On CRD hosts the X display (:20) is owned by a chrome-remote-
    desktop child-process and is recreated on client session churn —
    GTK user units will restart once per recreation. Distinguish that
    from a failure loop by checking for repeated "Failed to open
    display" in the journal, not just NRestarts.'
  - 'Do not probe a live daemon snap with `snap run` even using a dead
    DISPLAY — the 15:05:28 service exit coincided with a manual
    DISPLAY=:99 probe; causation unproven but the safe move is to test
    confined apps against a throwaway display or not at all.'
  - 'User crontab @reboot fires on every cron-daemon start, not just
    boot — gate post-boot one-shots on /proc/uptime before acting, and
    only self-clean after a genuine fresh-boot run.'
