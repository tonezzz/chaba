  immediate_2026-11-27T19-54+07: >-
    service active/running, Result=success, NRestarts=0; container running with
    autoRemove=false; replication current_lsn 262184205, connected=true,
    last_recv_age_ms=82, Healthy=false with lag ~2052s (actively catching up).
  soak: >-
    18-minute background monitor 2026-11-27T19:54-20:11+07, 1-minute sampling
    of ActiveState/SubState/NRestarts, LSN/healthy/lag and watchdog STALL count:
    active/running at every sample, NRestarts=0 throughout, zero STALL events.
    LSN advanced 262184914 -> 262216271 (+31357); replication_lag_s grew to
    2739 then fell to 1772 in the last two samples (catch-up turning the corner).
    This outlasts the old 6-13 min clean-exit window, so the crash loop is
    resolved.
  fleet_audit: >-
    ansible-playbook playbooks/audit-fleet-services.yml (full fleet, read-only)
    reports 0 deltas on all 7 hosts after the fix and the related SSOT
    reconciliations; idc02 report mtime 2026-11-27T20:00+07, final pass clean.
  decision_2026-11-27: >-
    Tony chose to leave runner-tools-converge.service whitelisted rather than
    publish or discard the staged adoption branch. Owner action: publish
    dispatch/20261126-213920-decision-2026-11-26-tony-adopt (13 staged files,
    including the updated runner-tooling.manifest.json pin), then clear the
    known_failed entry and re-run the converge audit.
  concurrent_deltas: >-
    Three new idc03 deltas and one new idc02 delta appeared during this job from
    other live work (19:42-19:57) and were reconciled in ssot.audit.hosts.yml:
    ada-dev/ada-kk-dev stopped+disabled on idc03 after their 2026-11-18 move to
    tony-omen (stale active expectations -> inactive), Ansible-managed
    jevos-swap-reclaim.timer declared, kanban-commit.service git index.lock
