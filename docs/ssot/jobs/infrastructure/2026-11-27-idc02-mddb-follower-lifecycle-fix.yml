lessons:
  - >-
    Podman 4.9.3 quadlet always appends `--rm` to `podman run`; Restart=alone
    does not suppress it. `PodmanArgs=--rm=false` placed after the auto flag
    wins, and `podman inspect .HostConfig.AutoRemove` proves effective state.
  - >-
    A healthy:false replication status is expected during catch-up; only a
    frozen LSN while the API is up is a stall signal, and even then a fresh
    restart needs a startup grace window before it can be trusted.
  - >-
    `healthy:false` on con01's follower is a pre-existing baseline, not a
    crash indicator - compare against peer hosts before treating it as drift.
