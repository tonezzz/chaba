title: nest_job CPT drift — live chaba-boards plugin behind repo (v0.7.x vs v0.9.0)
date: 2026-10-26
card: repair-wp-nest-job-cpt-drift
domain: wp-boards / board-api
status: deployed-verified

summary: >
  board-api POST /job fails upstream with WP REST 404 rest_no_route on
  /wp/v2/nest_job. Root cause is NOT a registration-code bug and NOT a
  revert — the live plugin was never advanced past ~v0.7.x — both the
  v0.8.0 (activity CPT) and v0.9.0 (nest_job CPT) deploys were left
  gated on Tony approval and never executed. The KNB-0659
  "all CPTs registered" claim (2026-10-14) was true at v0.3.3 — it
  predates both CPTs; nothing regressed on the live side, the deploy
  simply never happened.

evidence:
  - "anon GET /wp/index.php?rest_route=/wp/v2/types -> 21 CPTs; nest_job
     and activity absent; asset..score/xlate present => live < v0.8.0"
  - "anon GET /wp/v2/nest_job&per_page=1 -> 404 rest_no_route; same for
     /wp/v2/activity; /wp/v2/lesson + /wp/v2/score -> 200 []"
  - "board-api POST /job -> 502 surfacing wp /wp/v2/nest_job -> 404"
  - repo plugin integrations/wp-boards/chaba-boards.php = v0.9.0
    (unchanged since cdecf8cca, 2026-10-23); php -l clean (verified on
    tony-omen)
  - "tests/board/test_board_api_mutations.py — 17/17 OK: /job contract
     (slug upsert, parent slug->id, comms JSON-append, meta merge) intact"

