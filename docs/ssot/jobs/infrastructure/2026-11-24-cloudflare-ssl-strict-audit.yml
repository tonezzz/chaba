processing:
  status: done
  started_at: "2026-11-24T05:00:00Z"
  steps:
    - id: 1
      label: Verify recorded DONE state
      status: done
      notes: >-
        api.surf-thailand.com -> CF anycast, HTTP 200, <title>Ada</title>,
        cf-ray present. NOTE: api A record now points at idc03
        157.85.102.125 (repointed after idc01 retirement) — card note's
        'idc01 caddy' wording is stale but outcome equivalent.
        edge.surf-thailand.com DNS-only -> 45.136.236.190 (idc02) as
        recorded; it is a CNAME anchor for the *-ha family, direct TLS
        to edge. SNI fails by design (no site block). Zone NS =
        noor/viddy.ns.cloudflare.com.
    - id: 2
      label: Map zone + consumer-proof every surface
      status: done
      notes: >-
        27 records. Proxied: apex, www, api, app, idc01, idc03, claw
        (AAAA 100:: placeholder), ada-code, ada-ocb, cline, netdata,
        opencode-ada, opencode-jack (A->idc02), and CNAME->edge family:
        ada-ha, boards, cms, kk-ha, michael-dev, michael-dev,
        michael-ha, mn-ha, monitor, status, tony-ha. Live curls:
        tony-ha/kk-ha/michael-dev/cms/monitor 302 (CF Access),
        boards/status/apex 200, www 308, api 200.
    - id: 3
      label: SSL=strict readiness per origin
      status: done
      notes: >-
        GET /zones/<z>/settings/ssl -> value=full, editable=true (token
        has at least Zone Settings read). Origin certs via openssl
        s_client: idc03 api.+app. = valid LE (YE2) OK; idc03. = NO cert
        at SNI (stale/unused record); idc01. = origin 157.85.110.99 not
        answering (idc01 retired — record stale, already broken under
        full); wiki./wiki-internal CNAME->wiki.h3.gizmo-thailand.com
        serves LE cert whose SANs cover only *.h3.gizmo-thailand.com —
        strict outcome depends on which SNI CF sends for proxied
        CNAMEs, needs check; idc02 edge = 'tls internal' on EVERY
        Caddyfile site block -> Caddy Local Authority certs, untrusted
        -> strict would 526 all ~20 names. DECISION: do not flip.
  decisions:
    - label: "SSL=strict deferred — needs edge cert migration first"
      rationale: >-
        Card called it optional with assumption 'origin cert is valid
        LE' — true only for the Oct-3 surface (api on idc01). The edge
        has since grown ~20 proxied names on idc02 caddy-edge, all on
        tls internal. Flipping zone-wide would take down every public
        site. Follow-up card cf-ssl-strict-migrate-idc02-edge-origin-3fa959
        (OPS-0027) filed with migration paths (CF Origin Cert vs LE
        http-01-only).
      alternatives_considered: >-
        flip anyway + fix forwards (rejected: guaranteed outage);
        per-record strict (does not exist in CF — zone-wide only).
  changes:
    - { file: "docs/ssot/jobs/infrastructure/2026-11-24-cloudflare-ssl-strict-audit.yml", summary: "this trail" }

followup:
