  summary: >-
    cloudflare-setup re-verified live: all recorded surfaces healthy.
    Optional SSL=strict audited and found blocked — idc02 edge serves
    internal-CA certs on all site blocks; follow-up card OPS-0027
    filed. No infra changed.
  metrics:
