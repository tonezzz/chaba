# SSOT Job: LiteLLM gateway on idc03 — single LLM API point
# Card: llm-gateway-litellm. Deployed 2026-10-11 by devin dispatch
# (idc02). OpenAI- and Gemini-compatible proxy + Postgres spend ledger,
# job-class routing with ordered fallbacks, virtual keys with budgets.

title: LiteLLM gateway — route, classify, benchmark, spend-cap on idc03
subtitle: one tailnet-only API point fronting gemini-paid/free, openrouter, and local ollama — 2026-10-11
icon: litellm
card: llm-gateway-litellm

deployed:
  host: idc03
  units: [litellm.service, litellm-db.service]
  bind: "http://100.102.134.91:4000 (tailnet IP only; postgres 127.0.0.1:5432 only)"
  images: ["ghcr.io/berriai/litellm:main-stable", "docker.io/library/postgres:16-alpine"]
  secrets_on_host:
    - "~/.config/secrets/litellm.env — master/salt/pg/ui (generated by deploy.sh)"
    - "~/.config/secrets/litellm-keys.env — LITELLM_KEY_ADA/_CHABA/_BENCH virtual keys"
    - "LITELLM_URL + LITELLM_KEY appended to mddb-gemini.env (ada-embed-bench lane)"

changes:
  file: stacks/idc03/litellm/
  items:
    - "litellm.container + litellm-db.container — quadlets, host net, tailnet/loopback binds"
    - "config.yaml — 19 deployments: real gemini names (paid+free+or), ollama legs, 7 job classes (tool-call, summary, voice-aux, classify, bench, vision, embedding)"
    - "router_settings.fallbacks — paid → free-tier → OpenRouter → ollama (text classes only)"
    - "deploy.sh — idempotent install: quadlets, config, secrets gen, start, health wait"
    - "litellm-ledger.service/.timer — daily CMS ledger (kept disabled until branch merges; ExecStart points at live chaba checkout)"
  file: docs/ssot/infrastructure/ssot.llm-gateway.yml
  items:
    - "canonical routing table SSOT: job class -> ordered model list w/ fallbacks, endpoints, budgets, Live-API caveat"
  file: scripts/litellm/
  items:
    - "bench.py — latency + gateway-metered cost per call class vs direct provider"
    - "daily-ledger.py — 24h spend per key/model from LiteLLM_SpendLogs -> ada-cms-pages/llm-gateway-spend-ledger"
    - "mint-key.sh — virtual keys w/ budget via /key/generate"
  file: scripts/ada/embed-bench.py
  items:
    - "gateway leg when LITELLM_URL/LITELLM_KEY set — /v1/embeddings class embedding + cosine-vs-direct check; CMS page gains a gateway section"
  file: scripts/ada/session-report.py
  items:
    - "GEMINI_BASE_URL env override — chaba jobs route through the gateway unchanged otherwise"
  file: scripts/ops/rotate-or-key.sh
  items:
    - "restarts litellm on idc03 after OR key merge (it mounts mddb-gemini.env)"
  file: docs/ssot/infrastructure/ssot.health.home.datastore.yml
  items:
    - "litellm health entry (systemd check + /health/liveliness curl)"
  file: docs/ssot/ssot.index.yml
  items:
    - "registered ssot.llm-gateway.yml in both infra index sections"

verified_live:
  - "curl /health/liveliness 200; ss shows :4000 bound to 100.102.134.91 only"
  - "POST /v1/chat/completions model=tool-call|summary|voice-aux|classify|bench -> correct answers, paid gemini upstream"
  - "POST /v1/embeddings model=embedding dimensions=768 -> 768d vectors (gemini space)"
  - "POST /v1beta/models/gemini-2.5-flash:generateContent?key=<virtual> -> routed + spend-logged"
  - "google.genai SDK w/ GOOGLE_GEMINI_BASE_URL + virtual key -> Paris (ada's real client path)"
  - "fallback observed live: vision class OR-gemma:free fail -> ollama moondream answered"
  - "virtual-key model ACL enforced (403 for out-of-list models); budgets set ada $10/30d, chaba $5/30d, bench $2/30d, proxy cap $50/30d"
  - "bench.py: gateway spend delta $0.000108/run; p50 ~1-2.4s/class vs ~1.1s direct OR"
  - "embed-bench gateway leg: 10-doc batch 1.99s vs 15.6s sequential-OR direct (litellm batches what OR's Vertex route rejects as raw arrays), cosine 1.0"
  - "daily-ledger.py --publish -> ada-cms-pages/llm-gateway-spend-ledger (psql source)"

proof_lanes:
  ada: "ada-embed-bench.service — LITELLM_URL/LITELLM_KEY now in its EnvironmentFile (mddb-gemini.env); next weekly --publish run exercises the gateway leg"
  chaba: "session-report.py via GEMINI_BASE_URL + LITELLM_KEY_CHABA verified end-to-end; bench/ledger scripts are standing chaba jobs on the gateway"

open_decisions:
  - "Full ada service cutover (ada-dev/ada-ha-*): GOOGLE_GEMINI_BASE_URL is global — it would also reroute Gemini Live-API websockets, which LiteLLM does not proxy. Needs per-client base_url in ada-voice (genai.Client(http_options=...)) before voice-bearing services can migrate. Board request raised."
  - "mddb's gemini-ollama-proxy could front through litellm for spend visibility — deliberate hold: extra hop + it already hard-fails correctly on vector-space grounds."
  - "litellm-ledger.timer enablement post-merge: systemctl --user enable --now litellm-ledger.timer"

notes:
  - "OR :free catalog churns — meta-llama/llama-3.2-11b-vision:free is dead; vision primary is google/gemma-4-31b-it:free now."
  - "Non-blocking 'httpx_response is None' logging-worker noise seen on gemini /v1beta native calls — calls succeed + spend logs; upstream litellm cosmetic bug."
  - "GEMINI free-tier deployments exist only as fallback hops — paid key always first so the 20/day wall is never primary."
