id: 2026-11-23-post-restart-verify
title: Automated check-only post-restart verification via mcp-health-snapshot
date: 2026-11-23
card: automate-host-post-restart-verification-5ad4ac
ref: SYS-0863
dispatch: dispatch-wt-20261123-141054-extend-the-existing-mcp-health

summary: >
  transition.post_restart was a manual-only checklist. The existing
  mcp-health-snapshot.timer (OnBootSec=5min / OnUnitActiveSec=15min) already
  fired after every boot but only took a global health snapshot. This job
  extends that same service with a chained ExecStart running
  scripts/post-restart-verify.py — a check-only, once-per-boot verification
  pass driven entirely by ssot.operations.yml.

mechanism:
  trigger: >-
    mcp-health-snapshot.service gains a FIRST ExecStart
    `python3 scripts/post-restart-verify.py` ('-' prefix: a finding never
    fails the unit — OPS-0581 finding-reporter convention — and the snapshot
    ExecStart's known exit-nonzero quirk cannot skip the verifier, since a
    failed non-'-' ExecStart aborts later ExecStarts on a oneshot).
  once_per_boot: >-
    The script reads /proc/sys/kernel/random/boot_id and compares it to
    ~/var/chaba/post-restart-verify/last-boot-id. Match = no-op exit 0, so
    the 15-min timer cadence produces exactly one pass per boot with no
    duplicate spam. --force re-runs manually.
  scope: >-
    Only hosts in automation.post_restart_verify.configured_hosts
    (tony_omen, tony_dell) or carrying host_notes.<host>.post_restart_checks
    run a pass; every other host logs "not in scope" and exits 0.
  checks: >-
    Declarative types: command, systemd, http, file, mount, podman,
    failed_units. severity must -> inbox finding + overall=fail; warn ->
    report only (post-boot lag like mddb's 4-8 min init is expected).
  outputs:
    - "~/var/chaba/health/post-restart-verify-<host>-<bootid8>.json (+ -latest.json)"
    - "~/var/chaba/reports/timeline.jsonl result record"
    - "board-api POST /inbox: ONE aggregate finding per boot per must-fail-set
      (fingerprinted; host-ready-check pattern)"
  remediation: none — check-only by design; fixes stay manual per
    docs/kb/host-reboot-verification.md (mcp.devin's HA-container restart is
    deliberately NOT automated).

