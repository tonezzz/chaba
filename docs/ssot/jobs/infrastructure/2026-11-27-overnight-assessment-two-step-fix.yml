title: overnight-assessment 2-step fix — service-logs-sweep dict() + tony-omen ip_forward outage
subtitle: >
  Card overnight-assessment-two-step-fix (OPS-1493). overnight-assessment.service
  on idc03 was failing 3 of 4 recent runs with 3/6 workflow steps ok. One step
  (ssot_validate) was a transient malformed YAML already fixed in 3219cd79f40;
  two real failures remained and are resolved here — plus three more latent
  issues surfaced during verification.
icon: workflow
date: 2026-11-27
slug: overnight-assessment-two-step-fix
card: overnight-assessment-two-step-fix
ref: OPS-1493
kind: bugfix + host-restore
dispatch: dispatch-wt-20261127-104422-overnight-assessment-service-o (mn01)

root_causes:
  service_log_sweep: >
    scripts/overnight/service-logs-sweep.py built
    `"top_error_patterns": [dict(p) for p in top_errors]` where top_errors is
    Counter.most_common() — a list of (pattern_str, count) tuples. dict() on a
    2-tuple iterates it as key/value pairs, so element #0 is the pattern
    STRING itself; any pattern longer than 2 chars raised
    `ValueError: dictionary update sequence element #0 has length N`.
    (Card spec guessed "sqlite rows of 70 columns" — there is no sqlite in
    this script; the 70 was the length of the error-pattern string.)
    A second latent bug sat behind it: check_service()'s exception path
    omitted the "chars" key, so any unit whose mcp_logs call raised produced
    a result dict that crashed the markdown writer with KeyError: 'chars'.
  health_snapshot: >
    NOT a stale health entry and NOT a dead container. tony-omen's
    /etc/sysctl.d/99-chaba-hardening.conf (written 2026-11-26 12:38 by the
    fleet hardening pass) set net.ipv4.ip_forward=0. With forwarding off,
    docker-published ports silently drop: DNAT in nat/PREROUTING still
    fired (counter +4 per probe) but packets never reached the filter
    DOCKER chain (counter +0) and no bridge egress appeared on tcpdump.
    Host-native services (ssh:22, :8090, :8799) kept working, which is why
    only docker-backed endpoints (sensor-reader:8001, netdata:19999) timed
    out. ip_forward was restored with sysctl -w and the conflicting line
    commented out in the conf (backup: .bak-20261127).
  health_snapshot_extra: >
    Once sensor-reader recovered, the same step surfaced two genuinely-down
    con01 services (both declared active+critical in ssot.audit.hosts.yml):
    mddb-follower.service (podman quadlet, warm-DR replica :11123) and
    ada-stt.service (audio.cpp STT :8914, had been disabled). Both were
    cleanly stopped ~2026-11-26 evening — likely collateral of that night's
    con01 maintenance (warm-standby staging / quadlet inventory work), not
    an SSOT-sanctioned retirement. Restarted both; follower resumed from
    persisted LSN (the 11-26 lsn-persist work paid off — no 4.3G re-snapshot).
  ssot_validate_extra: >
    docs/ssot/jobs/infrastructure/2026-11-27-ada-review-refresh-prune-timeout.yml
    (merged ~02:08 via dispatch) had `fix:` list items written as
    `- file.py: prose` with same-indent continuation lines — YAML parses the
    head as a mapping key and the continuations as orphan keys →
    "could not find expected ':'". Fixed by folding each item into a `>-`
    block scalar (content preserved verbatim).

changes:
  - "scripts/overnight/service-logs-sweep.py: top_error_patterns now emits
    [{pattern, count}] dicts — the shape scripts/overnight/promote-reports.py
    already consumes via p.get('pattern')/p.get('count'); exception path in
    check_service() now includes chars: 0."
  - "tony-omen /etc/sysctl.d/99-chaba-hardening.conf: commented out
    net.ipv4.ip_forward=0 with reason (docker published ports require
    forwarding). Other hardening directives untouched. Applied live via
    sysctl -w net.ipv4.ip_forward=1."
  - "con01: systemctl --user start mddb-follower.service; systemctl --user
    enable --now ada-stt.service (re-created default.target.wants symlink)."
  - "docs/ssot/jobs/infrastructure/2026-11-27-ada-review-refresh-prune-timeout.yml:
    fix: items converted to folded scalars — valid YAML, same text."
  - "docs/kb/host-hardening-baseline.md: new gotcha — never set global
    net.ipv4.ip_forward=0 on container hosts; scope per-interface instead."

verification: >
  sensor-reader /health 200 from mn01+idc03; con01 :11123 and :8914 return
  200/expected. overnight-assessment.service on idc03 run via
  systemctl --user start — see card comms for per-run results.

followups:
  - "mddb-api :11023/health flaps 503 under load (observed once mid-run,
    200 before+after) — honest signal, not config drift; if it keeps
    failing the nightly, consider whether /health should distinguish
    'replica lag' from 'down'."
  - "ssot_validate has now failed twice on single newly-merged malformed
    YAML files — the merge gate doesn't run ssot-validate-all; consider
    adding it to the dispatch close-out gate."
  - "The hardening baseline gotcha added here should prevent the next
    fleet pass re-adding ip_forward=0 on container hosts."
