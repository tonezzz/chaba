  chaba_exec_checkout_units: |
    ada-flood-news, ada-market-report, ada-memory-backup,
    chaba-audit, chaba-audit-full, chaba-jobs, chaba-kb-audit,
    chaba-report-api, chaba-services-regen, daily-brief (also reads
    chaba-tony-dell cards dir), devin-bank-distill, devin-session-prune,
    devin-summaries-sync, flood-alert, ha-auth-watch, mcp-link-monitor,
    secrets-console, timer-sentinel, timer-timeline-update
  chaba_tony_dell_units: |
    ~42 units incl. kanban-commit, kanban-dispatch, chaba-board-api,
    chaba-board-render, merge-sweep, overnight-assessment, qc-scoreboard
  other_checkouts: |
    trade, ada-voice, chaba-raceman, chaba-kanban-sync (job worktree —
    expected), chaba-h3-tony-dell — separate repos, not in scope.

