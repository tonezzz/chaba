notes: >
  Serial C02T902XH03M + 2.6GHz base clock had suggested a 2018 T2 model in the
  card spec; DMI confirmed 13,3 — lesson: serial-prefix inference can mislead,
  hw.model/DMI is the only authority (matches the verified-absent protocol
  learning). No T2 steps (firmware extract, applespi, secure-boot dance) were
  ever required.
