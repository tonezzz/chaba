id: 2026-10-07-precommit-warning-baseline
title: Pre-commit SSOT gate — baseline known warnings, fail only on new debt
date: "2026-10-07"
domain: infrastructure
card: precommit-warning-baseline
actor: devin (dispatch worktree dispatch/20261007-231022-options-a-baseline-file-report)
status: done

summary: >-
  Shipped option (a) from the card — reports/SSOT_OPTIMIZATION_WARNINGS.json is
  now committed as the known-warnings baseline. The pre-commit optimization
  gate (and the matching CI step) fail only when a warning is absent from the
  baseline, i.e. new debt. Merge commits and dispatch-branch landings no longer
  need --no-verify or a different host just because known debt fires.

decision: >-
  Chose (a) baseline file over (b) inbox-ack link. Option (b) reads
  docs/ssot/focus-inbox via a path hardcoded to the served checkout
  (chaba-tony-dell), so it is host-dependent and wrong in worktrees; the
  baseline file travels with the repo and works offline on every host.

how_it_works:
  - >-
    scripts/ssot-optimize.mjs keeps rewriting
    reports/SSOT_OPTIMIZATION_WARNINGS.json on every run (unchanged — the
    working-tree copy is scratch).
  - >-
    NEW scripts/ssot-optimize-gate.mjs compares current warnings against the
    baseline. Baseline resolution — staged blob (git show :file) first so a
    commit can update warnings and baseline together, then HEAD. Missing
    baseline is advisory-only so stale branches are not blocked.
  - >-
    Warning text embeds counts ("404 lines exceeds review threshold of 350");
    digits are normalized to '#' for matching, so magnitude drift in a known
    warning is not treated as new debt.
  - >-
    .husky/pre-commit runs optimize --staged then the gate; afterwards it
    restores the baseline file (from index if a baseline update is staged,
    else HEAD, else deletes the scratch file) so the checkout does not stay
    perpetually dirty.
  - >-
    .gitignore switched reports/ to reports/* plus
    !reports/SSOT_OPTIMIZATION_WARNINGS.json so the baseline is a normal
    git add away (auditable commit, no -f needed).
  - >-
    .github/workflows/ssot.yml "Verify no warnings" step replaced by the same
    gate; log-reference issues still hard-fail (not baselined).

baseline_seed: >-
  Generated by a full `node scripts/ssot-optimize.mjs` run on origin/master
  (bc172cc) via a scratch worktree — not from this 126-commits-behind branch —
  so the landing merge does not trip on master's current debt. Seed contents:
  bloat on kanban/ssot.kanban.yml (404 > 350 review threshold), plus YAML
  syntax errors on jobs/reports/2026-10-07-hosting-provider-intl.yml and
  jobs/yt-dub/2026-10-06-yt-voice-dub-cuefit.yml. Those two have REAL parse
  errors on master (plain scalars swallowing key lines) — likely committed by
  the kanban auto-committer which runs outside the hook. They are baselined as
  known debt; fixing the YAML itself is separate work. The hook's independent
  YAML syntax check still hard-fails if those files are staged.

silence_a_warning:
  - node scripts/ssot-optimize.mjs   # full run, NOT --staged
  - git add reports/SSOT_OPTIMIZATION_WARNINGS.json
  - commit — the baseline diff is the audit trail

verified:
  - hook run with only non-warning SSOT staged — pass
  - hook run staging a new file with missing-icon/layout warnings — FAIL, listing exactly the two new warnings
  - hook run staging kanban/ssot.kanban.yml (bloat warning, baseline-covered) — pass
  - warnings file restored clean after passing run (no perpetual-dirty tree)

side_effects_noted:
  - every ssot-optimize run rewrites docs/ssot/ssot.dev-system.assessment.yml with the local checkout's metrics (pre-existing behavior, unchanged)
