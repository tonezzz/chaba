# Job: Devin Desktop startup/crash loop on tony-dell — GPU process
# Related card: fix-devin-desktop-startup-after-3-12-upgrade (DEV-1218, 2026-11-24
# XDG split-brain fix; that fix is installed and still valid, this is a new failure mode).
title: devin-desktop dies ~10s after launch on tony-dell — GPU child crash, pinned off via Ansible
status: fixed — running with --disable-gpu; argv.json pin converged idempotently
date: 2026-11-26
host: tony-dell
session: OpenChamber session-2a87ebc4 (operator-approved live fix)

symptom:
  - No devin-desktop process/window on :20; ~/.config/Devin/code.lock pointed to dead PID 1992097.
  - watchdog.log showed repeated "window unresponsive → TERM main" plus auto-restarts through the day.
  - Fresh main.log at each launch ended ~10s later; no update/earlyoom/watchdog kill in that window.
  - A fresh Crashpad dump appeared at the exact second of each death (e.g. 0cd4ede8… at 19:10:24).

diagnosis:
  method: read-only via MCP debug, then SSH; parsed minidump header directly.
  findings:
    - Minidump exception code 5, address 0, on a child thread (2009403), module list 113 — a child process
      crash, not a watchdog TERM or OOM kill. Kernel journal had no trap/OOM entry; earlyoom had no 19:10 kill.
    - Plain relaunch at 19:10:14 died at 19:10:24 with a new dump. Relaunch with --disable-gpu at 19:13:26
      stayed alive >4 min with 5 windows on :20 and the correct singleton socket.
    - Installed watchdog already carries the 2026-11-24 XDG_RUNTIME_DIR fix; not a split-brain recurrence.
    - This build reads argv.json static switches (mainImpl.js lists disable-gpu), so a pin there covers the
      desktop launcher, CLI and watchdog auto-restart paths.
  secondary: stale code.lock and a stale /run/user/1000/vscode-5cc5eca6-1.14-main.sock after each crash.

changes:
  - Live: backed up code.lock to code.lock.bak.20261126T191008 / .191326, removed stale lock + socket,
    relaunched with XDG_RUNTIME_DIR=/run/user/1000, DISPLAY=:20 and --disable-gpu (main PID 2021191).
  - Repo: ansible/playbooks/deploy-devin-desktop-gpu-off.yml — writes ~/.config/Devin/argv.json with
    {"disable-gpu": true}, mode 0644, backup on change, read-back assertion, no handler (next launch only).
  - Converged: ansible-playbook -i ansible/inventory/hosts.yml
    ansible/playbooks/deploy-devin-desktop-gpu-off.yml --limit tony-dell
    (preflight --check --diff: 0 unreachable / 0 failed; real run: changed=1; re-check: changed=0).
  - Same pin applied to tony-omen on explicit request with --limit tony-omen: preflight clean
    (0 unreachable / 0 failed), real run changed=1, re-check changed=0. Its live main PID 646135
    (22h+ uptime) was deliberately NOT restarted — the pin takes effect on the next launch.

verification:
  consumer: main PID 2021191 alive >3m55s; 3+ visible Devin windows on :20; code.lock = 2021191;
    socket /run/user/1000/vscode-5cc5eca6-1.14-main.sock owned by tony; argv.json read-back pin asserted.
  idempotency: --check --diff --limit tony-dell => changed=0, unreachable=0, failed=0.

rollback:
  - Remove ~/.config/Devin/argv.json (Ansible backups are only created when a file already existed), or set
    disable-gpu to false, then relaunch devin-desktop; expect the ~10s crash loop to return.
  - Stale-lock backups: ~/.config/Devin/code.lock.bak.20261126T191008 and .191326.

lessons:
  - A "starting error" that is actually a child crash loop: verify with a fresh crash dump timestamp at the
    exact death, not just the watchdog log — watchdog TERMs and crashes can interleave.
  - Electron/VS Code forks read argv.json static switches; {"disable-gpu": true} is a low-risk persistent
    mitigation for GPU-child crashes after a glibc/hwcap change, and covers cron/systemd watchdog relaunches.
  - Verify GUI fixes at the consumer: visible window on the real X display, singleton socket under
    /run/user/$UID, and code.lock matching the live main PID — not just "a process exists".
