known_limits:
  - "idc01/idc02/idc03 system journals unreadable (user tony not in
    systemd-journal/adm group) — same as the old ssh lane; user journals
    ship fine. Fix = usermod -aG systemd-journal tony on the VPSes."
  - "shared cursor means a fast local timer can starve the fallback lane
    into reporting shipped=0 — expected, not a bug; lane field shows who
    shipped last"
  - "ha host logs timestamps assumed UTC (journal-gatewayd host-local
    render on HAOS, which runs UTC); a TZ change on michael-ha would skew
    dedup watermarks, not lose data"
  - "re-running the installer re-arms timers — enable --now is
    idempotent"
