  installed_2026-10-05:
    tony-dell: log-shipper.timer + log-shipper-mha.timer armed; first
      fires shipped 500 (self) + 140 (michael-ha pull)
    tony-omen: timer armed; first run shipped 500
    idc01: timer armed; first run shipped 500
    idc02: timer armed; first run shipped 500
    idc03: timer armed (installed via tony-omen hop); shipped 485
    mn01: timer armed; first run shipped 500
    michael-ha: no local timer possible — covered by log-shipper-mha on
      tony-dell (ha-cli pull, key-auth ssh)
  script_location: ~/.local/share/log-shipper/log-shipper.py — installed
    copy, deliberately NOT the repo checkout so a stale/divergent
    checkout (e.g. mn01's chaba has no scripts/ada/) can never break
    shipping. Re-run the installer to propagate script updates.
  add_a_host: >-
    add a `log-shipper` job with the host key to ssot.jobs.yml (add the
    host to config.repo if new), run render-jobs.py, then
    `install-log-shipper.sh <host>`.

