report:
  status: done
  completed_at: "2026-10-06 08:10 +07"
  summary: >
    Audited vcast per card spec and fixed four real gaps. (1) SW: vendored
    libs were cache-first forever with no old-cache cleanup — new HTML +
    stale hls.min.js skew was possible; now vcast-v3 does network-first +
    no-cache revalidation for every same-origin /apps/vcast/ GET, deletes
    older vcast-* caches on activate, and ?v= pins cover the pre-SW first
    load — stale-bundle playback is impossible while the edge is
    reachable. (2) pair->play: flow is already tight (local check measured
    claim->registered ~0.1s incl. ada hops; lastCast replay covers the
    claim->registered gap); added a 10s fetch timeout in pair.html so a
    hung relay can't silently eat the budget. (3) HLS drop: fatal errors
    only toasted before — now NETWORK_ERROR re-polls, MEDIA_ERROR
    recovers x2 then rebuilds, other fatals recreate the instance;
    bounded backoff, retry state reported as hls-retry, per-pane teardown
    guards. Native Safari gets an error/ended watchdog for live
    playlists. (4) Found+fixed a relay bug: casts published while a
    display is mid-reconnect were dropped from lastCast and the
    re-register replayed a STALE cast — bookkeeping now runs before the
    empty-room early return. Verified: vcast-cast-check.mjs 15/15,
    vcast-flap-check.mjs 7/7, live image cast+stop round-trip on screen
    7, relay healthy. cast_interrupt_gate's Ada-side gate lives in
    ada-pi; the /capture lease contract it depends on is exercised by the
    new check.
