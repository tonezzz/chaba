    - ip route and service health remain unchanged after data collection
    - All speed/latency numbers are recorded in the report section
  rollback_plan:
    - No persistent changes made; only data collected
  handoff: []
  deferred:
    - Make the routing change permanent only if the user explicitly asks and a separate job is opened

