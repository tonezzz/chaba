  decisions:
    - enx iPhone USB tether interface is not currently present on tony-omen; only wlo1 and eno1 are active
    - Default internet is wlo1 via 192.168.2.1 with good throughput (25 MB/s observed)
    - Several mcp-health unknowns are due to .local mDNS resolution, not internet path
  changes:
    - file: docs/ssot/jobs/infrastructure/2026-08-19-tony-omen-internet-impact.yml
      summary: Collected interface, route, and speed data

followup:
