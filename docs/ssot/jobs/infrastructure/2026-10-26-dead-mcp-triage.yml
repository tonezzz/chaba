      - "mn01 podman notebooklm-mcp container Up 5d, MCP initialize OK (gemini-notebook-mcp 4.0.3)"
      - "mn01 auth valid: `nlm notebook list` returns real notebooks (Tony-Memory 100 sources etc.)"
