         quadlets moved to ~/.config/containers/systemd/migrated-off/ but the podman
         quadlet generator SCANS SUBDIRECTORIES, so they still generated units that
         pull localhost/<image> (missing) forever"
      - "omen: notebooklm-kb-sync.timer fires daily 00:00, exits 0 but logs ~21-23
         errors/run — `nlm` did `podman exec` locally where no container exists
         (silent degradation; manifest still touches)"
    actions:
      - "dell: systemctl --user stop+mask notebooklm-mcp.service notebooklm-rest.service; reset-failed"
      - "omen+dell: ~/.local/bin/nlm repointed to `ssh mn01 podman exec -i notebooklm-mcp nlm` (printf %q arg-safe); .bak kept"
      - "omen: ~/.config/devin/mcp-scripts/mcp-notebooklm-ssh.sh -> ssh mn01; dell: mcp-notebooklm.sh -> ssh mn01"
      - "verified: mcp initialize via new wrapper on omen OK; `nlm notebook list` OK from omen+dell"
    leftovers:
