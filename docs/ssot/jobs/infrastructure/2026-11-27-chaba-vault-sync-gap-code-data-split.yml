deploy: |
  Units are NOT auto-installed by checkout sync — after merge, on idc03:
    for u in ada-memory-sync ada-memory-drift ada-memory-gaps \
             ada-memory-distill obsidian-vault; do
      cp ~/.config/systemd/user/$u.service ~/.config/systemd/user/$u.service.bak-vaultsplit-20261127
    done
    # sed 's|CascadeProjects/chaba-vault/scripts|CascadeProjects/chaba/scripts|'
    #   and 's|CascadeProjects/chaba-vault/apps|CascadeProjects/chaba/apps|'
    #   on the 5 .service files (obsidian: script path only, keep jobenv
    #   interpreter + obsidian.env EnvironmentFile)
    systemctl --user daemon-reload
    systemctl --user restart obsidian-vault   # only long-running unit;
    # oneshots pick up the new ExecStart on next timer tick
  Verify:
    systemctl --user start ada-memory-sync.service && systemctl --user \
      show ada-memory-sync -p Result --value   # expect success
    journalctl --user -u obsidian-vault -n 20  # clean startup, vault listed
  Rollback: restore the .bak-vaultsplit files + daemon-reload.
  mn01: no chaba-vault — if its installed units still say chaba-vault they
    were already broken; repoint to chaba paths per repo files.

commit_e1128f502_fate: |
  KEEP the commit, do NOT push, do NOT drop.
  - Push: would require merging a vault-data commit (inbox file moves/
    deletions under docs/ada-memory/) across 119k commits of upstream
    divergence — high conflict risk for zero benefit; vault data reaches
    canonical stores via MDDB sync + pull-vault/push rsync, not git push
    from the replica (same conclusion as the Oct-07 leftovers note).
  - Drop (reset): the commit is the only anchor tying the live working
    tree's triage state to a known revision; under option (c) git metadata
    no longer gates code freshness, so it is harmless to keep and useful
    as a checkpoint if the vault dir is ever rebuilt.
  - The ~9 dirty tracked vault files + untracked inbox extracts are live
    vault data — untouched by this change either way.

