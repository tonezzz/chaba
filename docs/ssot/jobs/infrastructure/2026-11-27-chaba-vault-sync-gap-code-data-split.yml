id: 2026-11-27-chaba-vault-sync-gap-code-data-split
title: idc03 chaba-vault sync gap — split code from data (option c)
date: "2026-11-27"
domain: infrastructure
card: idc03-chaba-vault-sync-gap
ref: SYS-1496
actor: devin (dispatch worktree dispatch/20261127-111946-second-outage-from-this-root-c)
status: repo-change-ready

decision: |
  Option (c) — split code from data. Units execute scripts from the synced
  ~/CascadeProjects/chaba checkout (chaba-repo-sync.timer, hourly) while
  --vault / ADA_* env keep pointing at ~/CascadeProjects/chaba-vault/docs/ada-memory
  as pure data. The chaba-vault git clone stops mattering for code freshness:
  it can stay 119k+ commits behind forever without breaking anything, which
  dissolves the "live dirty checkout vs blind git pull" dilemma entirely.

  Rejected:
    (a) extend chaba-repo-sync to safe-pull chaba-vault — autostash pop across
        119k commits of divergence on a checkout with 421 dirty/untracked
        paths (tracked vault edits under docs/ada-memory/personal-kk,
        tony-projects + the surgical sync-script patch) is exactly the
        Oct-07 failure mode; also chaba-vault is a *data* replica, not an
        exec checkout, so pulling code into it buys nothing under (c).
    (b) dedicated chaba-vault-sync.timer — same pull risk as (a), plus a new
        unit to babysit; solves a problem (c) makes moot.
    (d) surgical scp + document — already proven insufficient: it is how the
        pre-11-18 script ran for 5 weeks and caused this second outage.

