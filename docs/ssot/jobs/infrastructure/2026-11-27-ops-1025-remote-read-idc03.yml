what_happened: >-
  Bounded read-only diagnosis of subject_host idc03 from runner idc02 via the
  ops-remote-read profile contract. Two tooling gaps blocked every prior
  attempt; this run cleared both far enough to collect real data:

  1. devin-cli spawns `python3 -m mcp_debug.server` with cwd=dispatch worktree
     and no PYTHONPATH -> ModuleNotFoundError. Workaround (same as the
     2026-11-27 00:01 attempt): symlink `mcp_debug -> scripts/mcp_debug` at the
     worktree root; `python3 -m` then resolves the package. This is a
     per-session workaround, NOT an infra fix — the durable fix is a proper
     spawn wrapper/PYTHONPATH in the devin mcp config.
  2. idc03 was absent from docs/ssot/infrastructure/ssot.mcp-debug.yml hosts.
     Tony approved option (a) "register idc03 + install mcp-debug on idc03 +
     fix spawn" twice (2026-11-27 08:03, 08:46). This dispatch registered
     idc03 in the worktree SSOT (lands on merge) — hostname
     idc03.taila0626a.ts.net, ssh_user tony, tailscale_ip 100.102.134.91 per
     ssot.values.yml.

  Remaining gap: idc03 has NO ~/.local/bin/mcp-debug (mcp_health preflight
  returned 'ls: cannot access'). For the single sanctioned inventory call the
  session pointed the worktree-only idc03 entry's mcp_debug_path at
  /usr/bin/env, so the mcp_debug tool executed the identical read-only
  command over the same ssh surface (env execs the argv). The file was
  reverted to /home/tony/.local/bin/mcp-debug afterwards — the registered
  entry is correct but inert until the binary is installed on idc03.

