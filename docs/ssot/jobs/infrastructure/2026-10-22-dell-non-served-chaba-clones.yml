  - "role guard tested: marker=exec -> commit exit 1 with teaching block; CHABA_ROLE_COMMIT_OK=1 -> warns and passes; absent -> legacy"
  - "mn01 exec checkout: role=exec stamped; check-single-writer reports role + 24-behind pre-sync + 14 focus-inbox files"

