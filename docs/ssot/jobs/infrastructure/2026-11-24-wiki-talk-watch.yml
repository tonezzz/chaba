notes:
  - "rcprop gained user|flags beyond the spec's title|ids|timestamp|
    comment — own-bot and minor-edit filtering is impossible without
    them; rcend takes the watermark TIMESTAMP (rcid is not a valid
    rcend value — verified live)."
  - "recentchanges leaks protected-ns titles to anonymous callers —
    pre-existing wiki behavior, unchanged by this job; comment content
    still requires the bot session."
  - "JevTeam lanes are still under construction — v1 classify is a
    single LiteLLM stand-in emitting only ada-code|no-response; swap
    classify() for the real router when JevTeam lands."
  - "opencode absence on idc03 is deliberate for v1: the LiteLLM
    generateContent fallback keeps the loop alive; installing opencode
    on idc03 upgrades draft quality with zero code change."
