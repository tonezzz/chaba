title: vms-snap /composite — one-shot multi-pane native capture
subtitle: >-
  Bind several VMS channels to monitor panes once, then capture all panes in
  a single cycle: per-pane context-menu Snapshot -> native BMP (native=1) or
  one xwd split into tiles (native=0). Replaces ~18s-per-cam serial pulls on
  the cam wall. Deployed to mn01; serial /snap remains the fallback path.
