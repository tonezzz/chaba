rollback:
  - "git reset --hard d71b491170efa68922140c3f918ed697bf0b17bd (state before
    recovery), then extract backup.tar.gz over the checkout to restore the
    13 differing cards and 52 local-only files."
  - "stash refs were never dropped; `git stash list` has the full autostash
    history if a specific mid-rebase state is needed."

follow_up:
  - "26 accumulated autostash entries and 52 sidecars are residue; review and
    prune only after Tony confirms no session needs them."
  - "scripts/backup was created root-owned by an earlier root-run job — make
    root jobs chown repo paths they create, or safe-pull will keep hitting
    permission walls."

lessons:
  - "A stale clone with hundreds of local changes is not a fetch problem: check
    whether local files are already identical to upstream before resetting."
  - "Repeated failed autostash pulls accumulate stash entries and sidecars;
    a healthy-looking hourly timer can be failing every single run — check
    unit Result, not just is-active."
  - "Hold the render lock then the board lock around any worktree reset, in
    the same order as git-safe-pull, so board-api writes cannot land mid-reset."
  - "Verify file and directory ownership under the repo before reset --hard;
    a root-owned directory blocks checkout even when the file itself is absent."
