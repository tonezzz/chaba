id: 2026-10-16-tony-dell-podman-lock-wedge
title: tony-dell collapse — stale podman shm lock + unbounded docker-ps pile -> swap thrash
date: 2026-10-16
host: tony-dell
card: tony-dell-podman-lock-wedge
ref: OPS-0718
dispatch: dispatch-wt-20261016-182606-tony-dell-collapse-2026-10-16-

summary: >
  tony-dell collapsed mid-afternoon 2026-10-16: load ~94, all TCP dead (ssh
  banner timeouts), swap 16G/23G on the 5400rpm HDD. Root-cause chain: an
  unclean podman shutdown earlier in the uptime left a stale
  /dev/shm/libpod_rootless_lock_1000 plus dead pause.pid; container-start
  units then serialized on alive.lck while a refresh hit a stale
  per-container lock (ctr 95f430e, EEXIST). With the podman state DB
  wedged, monitoring-dashboard's 30s tick kept firing 4 unbounded
  `docker ps` calls that never exited — ~700 piled processes, memory
  exhaust, swap thrash on spinning rust. Recovered by remote reboot
  14:23 (+07) and manual lock cleanup; the docker-ps pile-up was fixed in
  code at 14:35 (aa879d254). Verified 2026-10-16 18:30: host healthy,
  podman responsive, fix deployed AND running, sibling callers all
  bounded. Residual gap: stale-lock detection/recovery is still manual —
  watchdog carded.

timeline:
