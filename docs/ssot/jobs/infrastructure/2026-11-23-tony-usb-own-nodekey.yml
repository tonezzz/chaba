id: 2026-11-23-tony-usb-own-nodekey
title: tony-usb stick own tailnet nodekey — fix prepared, physical step pending
date: 2026-11-23
card: tony-usb-own-nodekey
ref: SEC-0303
dispatch: dispatch-wt-20261123-185116-the-goal-is-to-stop-the-tony-u

summary: >
  The tony-usb stick's /var/lib/tailscale/tailscaled.state is a clone of
  real mn01's node key, so any booted stick steals the mn01 tailnet
  session. The card asks for logout + state delete + `tailscale up` as a
  new node during the next stick session, plus documentation of the
  generated identity. This dispatch verified the stick is NOT currently
  booted or attached to any reachable host (tailnet, LAN sweep via
  tony-dell, lsblk on mn01/tony-dell/omen/macbook/con01/idc03), so the
  physical step cannot execute from a dispatch. Delivered instead: a
  self-contained fix script, the runbook procedure + identity registry,
  and one important correction to the spec — `tailscale logout` is
  deliberately omitted because it would expire the SHARED node key
  server-side and knock the real mn01 offline.

decision:
  logout_omitted: >
    Card spec said "sudo tailscale logout, delete tailscaled.state,
    tailscale up". While the clone exists, stick and mn01 present the
    SAME nodekey — they are one tailnet node. `tailscale logout` expires
    that node key server-side, deleting the registration for BOTH
    machines; real mn01 (runner-agent, dispatch lanes, board-api access)
    would stay offline until someone re-authenticates it. The safe
    sequence stops tailscaled (ends the contest, mn01 reclaims
    uncontested), moves the state file aside, restarts, and `tailscale
    up --hostname=tony-usb` registers a fresh node key. mn01's node is
    never deleted.
  node_name: tony-usb
    (stick hostname, verified 2026-10-25 hostnamectl=tony-usb on Omen hw;
    explicit --hostname makes the tailnet name deterministic on any guest)
  auth: >
    `tailscale up` prints a one-time login URL — the new node needs one
    admin-console approval (or TS_AUTHKEY env for zero-touch). No fleet
    auth key is stored on idc02 (~/.config/secrets has none).

