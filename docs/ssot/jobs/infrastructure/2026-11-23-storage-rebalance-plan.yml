# ------------------------------------------------------------- capacity planning
capacity:
  verdict: "rebalance, don't resize. All three VPS carry identical
    290G disks — idc03 is not under-provisioned, it is over-loaded
    (~200G of movable/dead data vs 90G of irreducible working set).
    con01/idc02 are NOT over-provisioned on disk either — their
    headroom is exactly what absorbs the migration. Their binding
    constraint is CPU (load 9-19), not storage."
  watch: "if mddb-ops stays on idc03 AND keeps growing ~6 GiB/d, the
    offload+deletes buy ~2-3 weeks; the mddb-ops migration (or an
    idc03 disk resize) becomes mandatory, not optional"
  note: "dell's fix is intra-host (NVMe -> sdb1); mn01's 150G is spare
    capacity for cold/dispatch overflow, not a VPS-tier target"

