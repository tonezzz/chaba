runbook_nugget:
  non_tty_update_fix: >-
    `devin update` exits 130 without a TTY (documented on this card
    2026-11-08). A full interactive SSH session is NOT required —
    wrap the command in util-linux `script` to give it a PTY:
      ssh -o BatchMode=yes <host> \
        'script -qec "$HOME/.local/bin/devin update" /dev/null'
    Works over BatchMode (key-only, no prompting) non-interactive SSH
    on both omen and the linux-based macbook. For the local host,
    run `devin update` under any PTY.

