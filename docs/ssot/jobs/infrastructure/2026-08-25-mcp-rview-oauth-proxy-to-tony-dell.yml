    description: mcp-rview-oauth-proxy registered under tony_dell
  - file: docs/ssot/infrastructure/ssot.health.home.other.yml
    description: mcp-rview-oauth-proxy health check added
  - file: scripts/mcp_rview/oauth_proxy.py
    description: canonical OAuth proxy source
  - file: stacks/tony-dell/mcp-rview/mcp-rview-oauth-proxy.service
    description: canonical systemd unit
  kb_review: []
  lessons_learned: []

