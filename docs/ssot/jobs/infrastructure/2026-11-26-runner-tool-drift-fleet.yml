  - "deploy-runner-tools.yml --check --diff FULL FLEET (~12:55):
    changed=0, unreachable=0 on all 7 hosts — proves SFTP-installed files
    are byte-identical to playbook output (copy checksum-gate no-op)."

rollback:
  - "ansible-deployed files: re-run deploy playbook or restore from
    ansible copy backup= (not enabled); sources are pinned in git."
  - "SFTP-installed files: rm /home/tony/.local/bin/<tool> on the host —
    they were absent before; removal restores prior state exactly."

residuals:
  - "kk-mac remains unreachable/unaudited (ssh_enabled:false member
    device) — out of scope for runner-tool convergence by design."
  - "mn01 card ops-mn01-restore-sshd-shell-20261126 is obsolete —
    commented with verification evidence; sshd now uses Match Group
    sftponly correctly."
  - "The fleet-wide global ForceCommand incident is resolved as scoped
    hardening; no card needed for idc02/idc03/con01 (fixed fleet-wide at
    ~12:49-12:50 by the same rollout that produced the backups
    sshd_config.backup.2026-11-26 on each host)."

lessons:
  - "ansible serial:1 + unreachable host aborts ALL remaining batches in
    ansible-core 2.22 — always --limit explicitly when any target may be
    down, or unreachable hosts silently skip the rest of the fleet."
  - "runner-drift-rearm.py --verify needs `ssh idc03` shell for board-cli;
    during the sftp-only window it would have failed — the HTTPS
    board-api (/comment, /action) is the fallback write door."
  - "sftp subsystem survives ForceCommand internal-sftp: ls/get/put/chmod
    all work, so pinned-byte install + hash-verify is a viable last-resort
    converge when shell SSH is dead — verify with a final ansible --check
    once shell returns."
  - "Drift transcripts age fast: both DRIFT findings were already healed
    by an earlier job before this dispatch ran — always hash-check
    installed-vs-pin before mutating (the KNOWN_PITFALLS warning was
    correct again)."
