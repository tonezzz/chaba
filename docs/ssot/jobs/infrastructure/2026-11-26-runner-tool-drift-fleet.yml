  - "ansible/playbooks/deploy-runner-tools.yml --check --diff --limit
    'tony-dell,tony-omen,tony-macbook' -> tony-dell 1 change
    (dispatch_repos.py), tony-macbook 3 changes, tony-omen in-sync."
  - "deploy-runner-tools.yml apply (same limit): tony-dell +1 tool,
    tony-macbook +3 tools; all 6 manifest pin asserts passed per host;
    restart runner-agent handler fired on both changed hosts."
  - "SFTP install on the four shell-dead hosts (pinned bytes from this
    worktree == origin/master == each host's checkout, all verified
    sha256 == manifest pin before upload): idc02 +3 tools
    (devin-dispatch-prune, dispatch-queue, dispatch_repos.py; claude-dispatch
    installed first as the sftp put/chmod proof), idc03 +4, con01 +4,
    mn01 +3 (claude-dispatch, devin-dispatch-prune, dispatch_repos.py).
    All chmod 0755."
  - "Post-fix verification: re-download of all 6 tools per host via SFTP ->
    24/24 sha256 == pin; ls -l shows -rwxr-xr-x and exact source sizes."

procedure:
  - "Step 1 locate: deploy-runner-tools.yml + audit-runner-tools.yml found;
    runner-drift-rearm.py --verify is the re-arm/close path."
  - "Step 2 confirm: inventory hosts.yml; playbook targets
    all:!macos:!disabled (7 hosts; kk-mac member device excluded by design,
    idc01 disabled)."
  - "Step 3 diagnose: manifest pins re-verified against worktree sources
    (6/6) AND against new origin/master (identical); ssh probe showed the
    ForceCommand window; SFTP ls+get replicated the audit read-only on
    unreachable hosts (installed-vs-pin and checkout-vs-pin)."
  - "Step 4 preflight: --check --diff --limit reachable -> expected deltas
    only; full-fleet --check aborted serial batch at first unreachable
    host (ansible-core 2.22 stops remaining serial batches on unreachable)."
  - "Step 5 approval: card spec explicitly directs this playbook; the
    runner-agent restart handler is the playbook's own design."
  - "Step 6 backup: ansible copy module + pin assert is the canonical
    path; SFTP installs wrote only absent files (no overwrite, no backup
    needed)."
  - "Steps 7-8 converge + verify: see verification."
  - "Step 9 evidence: this job file, card comms, artifacts under
    reports/ansible-benchmark/deploy-runner-tools/20261126-125135/."

verification:
  - "deploy --check --diff --limit 'tony-dell,tony-omen,tony-macbook':
    changed only where drift existed (dell 1, macbook 3, omen 0)."
  - "deploy apply: all pin asserts 'All assertions passed' on all 3 hosts."
  - "audit-runner-tools.yml full run (~12:52, after sshd Match-block fix
    landed): 42 OK lines (7 hosts x 6 tools), zero DRIFT/MISSING-DEST/
