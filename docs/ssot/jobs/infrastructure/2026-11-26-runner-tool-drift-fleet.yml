title: Runner-tool drift fleet card — deploy-runner-tools converge + SFTP-only window workaround
subtitle: >-
  card runner-tool-drift-fleet armed by runner-drift-rearm.py from an
  audit-runner-tools.yml transcript; converged via the canonical playbook on
  reachable hosts and via pinned-byte SFTP install on hosts caught inside the
  fleet-wide sshd ForceCommand window; final audit clean, card auto-closed.
icon: wrench

date: 2026-11-26
card: runner-tool-drift-fleet
status: deployed

context:
  trigger: >-
    scripts/board/runner-drift-rearm.py parsed an audit-runner-tools.yml
    transcript and filed runner-tool-drift-fleet with findings:
    tony-dell MISSING-DEST dispatch_repos.py; tony-macbook MISSING-DEST
    claude-dispatch/dispatch-queue/dispatch_repos.py; idc03 MISSING-DEST
    claude-dispatch/devin-dispatch-prune/dispatch-queue/dispatch_repos.py;
    idc02 DRIFT runner-agent + same 4 MISSING-DEST; con01 DRIFT devin-dispatch
    + same 4 MISSING-DEST.
  sshd_event: >-
    While this dispatch ran, the fleet was inside a global
    `ForceCommand internal-sftp` sshd window (see
    docs/ssot/jobs/infrastructure/2026-11-26-runner-tool-drift-followup.yml
    residuals and card ops-tony-dell-ssh-shell-restore). Probe at ~12:40:
    tony-dell/tony-omen/tony-macbook shell-OK; idc02/idc03/con01/mn01
    SFTP-only. At ~12:49-12:50 a scoped fix landed fleet-wide —
    `Match Group sftponly` + `ForceCommand internal-sftp` (sshd_config
    line 85-86 on every host), restoring shell for normal users while
    keeping sftp-only for the sftponly group. This is deliberate
    hardening, not an incident left open.
  stale_findings: >-
    The two DRIFT findings were already healed before this dispatch:
    idc02 runner-agent and con01 devin-dispatch had been re-converged to
    pins at ~11:28-11:33 by the earlier drift-followup job; SFTP hash-check
    confirmed installed == pin on all four unreachable hosts.

