lessons:
  - >-
    A host's local timer can silently pin the fleet to an old manifest: the
    converge script audits against its own checkout, so a 141-commit-stale
    repo keeps reporting drift=false while an old tool stays installed. Fix the
    checkout first (`fleet-repo-sync.yml --limit <host>`), then audit tools.
  - >-
    git-safe-pull --autostash fast-forwarded a host with seven uncommitted work
    files without touching them; prefer it over hand-editing a host's pinned
    files when the checkout is merely behind.
  - >-
    Stale failed state on not-found units is not an outage: check LoadState
    before escalating; reset-failed is enough.
  - >-
    "Description says every 2h" is not evidence — verify OnCalendar semantics
    (`*:0/2:05` is every 2 minutes). A misread timer multiplies every converge
    and service restart by 60x.
