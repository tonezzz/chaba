title: AWX/AAP integration for dispatch queue RBAC + approval gates — decision record
date: 2026-11-25
card: awx-aap-rbac-approval-gates
status: decided — do-not-adopt-awx-now; ship minimal in-queue gate instead

# ─── Scope 1: AWX/AAP fleet survey ────────────────────────────────────────
