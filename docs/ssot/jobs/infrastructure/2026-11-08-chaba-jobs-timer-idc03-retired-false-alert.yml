status: resolved
cards:
- timer-alert-idc03-chaba-jobs
- chaba-jobs-dispatcher-dead-fleet-wide-di-765e5b
ref: OPS-1148

summary: >
  timer-sentinel carded `chaba-jobs.timer` on idc03 as "disabled but
  expected active". Investigation — the disable is the intended
  end-state of OPS-0790. Tony approved (2026-10-29) migrating all
  dispatch:dispatcher jobs to per-job rendered systemd timers and
  retiring the legacy dispatcher. Zero dispatch:dispatcher entries
  remain in ssot.jobs.yml. Verified live on idc03 — replacements
  embed-lane-news.timer, embed-lane-lessons.timer and
  yomi-update-active.timer are armed and firing on schedule, so
  nothing is starved. The timer was already disabled when found on
  2026-10-23; re-enabling was explicitly NOT the chosen option.

  The alert was a stale-declaration false positive. "chaba-jobs" sat
  in timer-sentinel.py's hardcoded CRITICAL set, which cards any
  disabled unit by name regardless of census. idc03 had no census
  entry, so CRITICAL was the only trigger.

changes:
  - "scripts/ada/timer-sentinel.py — dropped chaba-jobs from CRITICAL;
    hosts that still expect it cover it via census expected_state:active
    (tony-dell entry unchanged — still enabled+active there during
    rollout, still alerts if it dies)."
  - "docs/ssot/infrastructure/ssot.audit.hosts.yml idc03 — added
    chaba-jobs.timer entry, expected_state:inactive, documenting the
    retirement (deliberate; do-not-re-enable; OPS-1148)."
  - "same file tony-dell — note updated to record that the tick is a
    no-op now, stays expected active until the rollout's step-3
    disable, and that dell's lesson-drift-check.timer is still unarmed."

