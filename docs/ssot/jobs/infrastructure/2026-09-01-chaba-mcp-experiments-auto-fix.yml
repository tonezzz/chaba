title: Auto-Fix chaba-mcp-experiments Worktree Drift (tony-omen via tony-dell)
subtitle: Rebase the 3-ahead/66-behind chaba-mcp-experiments branch onto master, force-push, and remove the local worktree if the rebase is clean
icon: target

planning:
  goal: Reduce branch/worktree sprawl by rebasing chaba-mcp-experiments onto origin/master and removing its local worktree, but only if the rebase is clean and the worktree has no uncommitted changes.
  scope:
    Operate on tony-omen /home/tony/CascadeProjects/chaba and /home/tony/CascadeProjects/chaba-mcp-experiments.
    Abort if the worktree is dirty or the rebase has conflicts.
    Do not push to master; only the chaba-mcp-experiments branch is rewritten.
  success_criteria:
  - chaba-mcp-experiments is rebased onto origin/master with no conflicts
  - The rebased branch is force-pushed to origin
  - The local chaba-mcp-experiments worktree is removed
  - The local chaba-mcp-experiments branch is deleted
  - A report is written to reports/2026-09-01-chaba-mcp-experiments-auto-fix.{json,md} and pushed to the experiment branch
  - If any step is unsafe, the script aborts and reports the reason
  risks:
  - Risk: rebase conflicts. Mitigation: abort immediately and report; do not continue.
  - Risk: uncommitted changes in the worktree. Mitigation: abort immediately and report.
  - Risk: force-push overwrites newer commits on origin. Mitigation: use --force-with-lease.
  - Risk: branch is valuable and should not be rebased. Mitigation: this job was approved as "auto-fix" from the Ready (Safe) queue; the script only proceeds if the 3 ahead commits rebase cleanly.
  resources:
  - tony-dell worktree /home/tony/CascadeProjects/chaba-tony-dell-experiments
  - tony-dell SSH access to tony-omen
  - Python 3 and git on tony-omen
  owner: tony
  estimated_duration: 1 session
  related_focus:
