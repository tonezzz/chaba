title: Branch/Worktree Sprawl Report — Phase 1b (tony-omen via tony-dell)
subtitle: Collect a read-only inventory of branches and worktrees for the chaba* repo family on tony-omen, dispatched through the tony-dell worker
icon: target

planning:
  goal: Extend the Phase 1 branch/worktree sprawl inventory to tony-omen by dispatching the read-only collection script from tony-dell.
  scope:
    Data collection only. No deletion, pruning, or modification of branches/worktrees on tony-omen.
    Covers /home/tony/CascadeProjects/chaba* directories on tony-omen that contain a git repository.
  success_criteria:
  - JSON report at reports/2026-09-01-branch-worktree-sprawl-tony-omen.json with per-repo branch and worktree lists
  - Markdown summary at reports/2026-09-01-branch-worktree-sprawl-tony-omen.md with counts and stale-branch candidates
  - Job report section is completed on the experiment branch
  - All output is committed and pushed to experiment/tony-dell-task-runner from tony-dell
  risks:
  - Risk: tony-dell cannot reach tony-omen via SSH. Mitigation: the job requires a pre-flight SSH check; abort if unreachable.
  - Risk: the remote git commands take too long. Mitigation: each SSH call has a 5-second connect timeout and BatchMode=yes.
  - Risk: touching unrelated repos. Mitigation: only scans directories whose names start with 'chaba' and contain a .git directory.
  resources:
  - tony-dell worktree /home/tony/CascadeProjects/chaba-tony-dell-experiment
  - tony-dell SSH access to tony-omen
  - Python 3 and git on tony-dell and tony-omen
  owner: tony
  estimated_duration: 1 session
  related_focus:
  - label: Dev-system regression
    file: docs/ssot/ssot.focus.current.active.yml
  - label: Phase 1 tony-dell report
    file: docs/ssot/jobs/infrastructure/2026-09-01-branch-worktree-sprawl-report.yml

processing:
  status: completed
  started_at: '2026-09-01T19:37:00'
  completed_at: '2026-09-01T19:38:20'
  steps:
  - id: 1
    label: Preflight SSH to tony-omen
    status: completed
    notes: ssh -o BatchMode=yes -o ConnectTimeout=5 tony-omen hostname returned tony-omen
  - id: 2
    label: Discover chaba* repos on tony-omen
    status: completed
    notes: Found one chaba repo on tony-omen (/home/tony/CascadeProjects/chaba)
  - id: 3
    label: Collect branches and worktrees
    status: completed
    notes: tony-dell script collected git branch -vv, git branch -r -vv, and git worktree list over SSH
  - id: 4
    label: Summarize
    status: completed
    notes: Generated reports/2026-09-01-branch-worktree-sprawl-tony-omen.{json,md}
  - id: 5
    label: Commit and push from tony-dell
    status: completed
    notes: tony-dell committed the reports and pushed to origin experiment/tony-dell-task-runner
  decisions:
  - label: Use --target-host for remote inventory
    rationale: Extending the phase1 script with --target-host lets tony-dell SSH into other hosts without copying the script, keeping a single worker host.
  - label: Keep reports in gitignored reports/ and use git add -f
    rationale: Reports are generated artifacts; forcing them into the bundle avoids mixing volatile output into tracked docs/. Fine for the pilot; revisit if we make the runner permanent.
  changes:
  - file: reports/2026-09-01-branch-worktree-sprawl-tony-omen.json
    summary: Raw JSON inventory of tony-omen branches and worktrees
  - file: reports/2026-09-01-branch-worktree-sprawl-tony-omen.md
    summary: Human-readable summary of tony-omen branches and worktrees

followup:
  verification:
  - Check that the JSON and MD files exist on the experiment branch
  - Verify tony-omen branch/worktree state was not modified
  rollback_plan:
  - Remove the generated report files if stale or no longer needed
  handoff:
  - Next owner: tony. Combine Phase 1 and Phase 1b reports, then approve Phase 2 pruning.
  deferred:
  - Actual branch/worktree pruning requires user approval and is out of scope for this Phase 1b job

report:
  status: completed
  completed_at: '2026-09-01T19:38:20'
  summary: tony-dell successfully collected a read-only inventory of the chaba repo on tony-omen. The repo has 19 local branches, 46 remote branch refs, and 8 linked worktrees. Notable divergences are research/thb-base-settlement (ahead 52, behind 51) and michael (ahead 30). master is ahead 1 and behind 3. No destructive actions were taken on tony-omen.
  metrics:
  - metric: repos_scanned
    value: 1
  - metric: local_branches
    value: 19
  - metric: remote_branch_refs
    value: 46
  - metric: worktrees
    value: 8
  - metric: most_diverged_branch
    value: research/thb-base-settlement (ahead 52, behind 51)
  links:
  - title: Markdown report
    url: https://github.com/tonezzz/chaba/blob/experiment/tony-dell-task-runner/reports/2026-09-01-branch-worktree-sprawl-tony-omen.md
  - title: JSON report
    url: https://github.com/tonezzz/chaba/blob/experiment/tony-dell-task-runner/reports/2026-09-01-branch-worktree-sprawl-tony-omen.json
  - title: Related focus
    file: docs/ssot/ssot.focus.current.active.yml
  - title: Phase 1 report
    file: docs/ssot/jobs/infrastructure/2026-09-01-branch-worktree-sprawl-report.yml
  kb_review:
  - tony-dell can dispatch SSH-based read-only git inventories to other hosts and push the results to origin autonomously
  lessons_learned:
  - Generated report files in a gitignored directory need git add -f; consider a tracked output directory for permanent runners
  - SSH BatchMode and ConnectTimeout keep remote git commands from hanging the worker

