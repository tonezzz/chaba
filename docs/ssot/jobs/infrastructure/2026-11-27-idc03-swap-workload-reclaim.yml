lessons:
  - "A delegated Ansible command that nests ssh to a second host can stall
    under connection reuse; tag such a task so a direct, checksum-verified
    copy can be used without skipping the rest of the play."
  - "Put the remote health gate in the same play as the relocation so a
    failed cutover cannot stop the source service."
  - "Check-mode verifies state, not effects: gate assert tasks that read
    command output on `not ansible_check_mode` or they fail on empty stdout."
  - "Superseding an owner decision is fine, but say which card it supersedes
    in the SSOT so the next session does not restore the old target."
