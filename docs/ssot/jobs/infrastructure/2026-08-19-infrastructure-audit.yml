title: Infrastructure audit
subtitle: Add health SSOT consistency checks to the consolidated audit suite
icon: infrastructure
version: 1

planning:
  goal: |
    Audit the project's infrastructure configuration by validating the health SSOT
    files for completeness and consistency. The audit should be safe to run
    without live service access and should plug into the existing consolidated
    audit plan.
  scope:
    - docs/ssot/infrastructure/ssot.health.home.yml
    - docs/ssot/infrastructure/ssot.health.mobile.yml
    - scripts/audits/infrastructure-audit.mjs
    - docs/ssot/infrastructure/ssot.audit.yml
  out_of_scope:
    - Live service health checks (handled by mcp-health)
    - Remote command execution on tony-omen or tony-dell
    - Tailscale or network connectivity probes
  success_criteria:
    - infrastructure-audit.mjs runs without errors
    - All health SSOT services have required fields for their type
    - ssot.audit.yml includes the infrastructure audit in the weekly schedule
    - Consolidated audit passes with the new audit
  risks:
    - False positives if field names differ by service type
    - Adding the audit to the default run may fail until health SSOT is cleaned up
  estimated_duration: 1 session
  related_focus:
    - label: Infrastructure audit
      file: docs/ssot/ssot.focus.current.yml

