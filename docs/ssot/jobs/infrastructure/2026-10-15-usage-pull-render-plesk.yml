idc02_caddyfile_snippet: |
  # monitor.surf-thailand.com site block (idc02 caddy-edge, host-local
  # ~/.config/caddy/Caddyfile):
  handle /feeds/usage.json {
      @authorized header Authorization "Bearer <CHABA_USAGE_FEED_TOKEN>"
      handle @authorized {
          root * /data/www
          file_server
          header Cache-Control "no-cache"
      }
      respond 403
  }
  # token = one shared random string; same value lands in wp-config.php
  # on the Plesk host as CHABA_USAGE_FEED_TOKEN.

deploy_steps: |
  1. idc02: add the /feeds/usage.json bearer-gated handle to the
     caddy-edge Caddyfile (~/.config/caddy/Caddyfile) inside the
     monitor.surf-thailand.com (or chosen public) site block; mkdir -p
     ~/.config/containers/caddy/data/www/feeds; reload caddy-edge.
     Verify: curl -o /dev/null -w '%{http_code}'
       https://monitor.surf-thailand.com/feeds/usage.json
     -> 403 without token, 404/200 with it (404 until first push).
     VERIFY at deploy that the host isn't behind CF Access — if the
     monitor hostname rides Access, pick a grey-cloud/public name or add
     an Access bypass for /feeds/* (PHP worker has no CF service token).
  2. idc03: render-jobs.py --host idc03 --install (lands usage-feed-push
     timer); or run once manually:
       python3 scripts/litellm/usage-feed.py --days 14 --push
     Prereq: idc03->idc02 BatchMode ssh works (fleet mesh; if not, run
     scripts/ops/ssh-mesh-sync.sh from tony-omen).
  3. Plesk (Tony one-time, per card help):
       - redeploy chaba-boards plugin zip (v0.5.0, both .php files) via
         wp-admin plugin upload + overwrite
       - wp-config.php: define CHABA_USAGE_FEED_URL + CHABA_USAGE_FEED_TOKEN
       - Scheduled Task "Run a PHP script":
         wp-content/plugins/chaba-boards/usage-pull-cron.php every 15 min
         (or wp-cli equivalent: wp eval 'chaba_usage_pull_run();')
  4. idc02: extend wp-watch freshness list with ops-event slug
     heartbeat-usage-pull (stale > ~90 min at 15m cadence = dead worker
     or dead feed — heartbeat only bumps inside WP so both failure modes
     surface the same way; distinguish via the heartbeat body/report hdr).

decisions_open:
  - "render target — landed: rolling private report post usage-ledger ★.
    Alternatives still open: per-day report posts (durable daily
    snapshots) or a `timeline_block` 'Timeline — usage' for a member
    visual. Feed rows support any of them — switch is PHP-side only."
  - "feed transport — landed: ssh push to idc02 webroot ★ (last-good data
    survives idc03 tailnet flaps). Alternative: idc02 caddy
    reverse_proxy to a tailnet listener on idc03 — fewer moving parts on
    idc02, but 404s when idc03 is down instead of serving stale."
  - "trigger — landed: Plesk Scheduled Task -> usage-pull-cron.php ★
    (deterministic, output captured in task log, no HTTP/CF dependency
    for triggering). WP-Cron hourly fallback already armed in-plugin."
  - "feed hostname — recommended monitor.surf-thailand.com (already a
    public static host on that edge); confirm CF posture at deploy."

caveats:
  - "Feed carries aggregates only (day x lane numbers) — safe for the
    public edge even if the bearer leaks; worst case is exposure of
    daily cost totals, no prompts/sessions/keys."
  - "SpendLogs api_key is the key alias/handle — emit truncated (<=24
    chars), never a usable token. usage.jsonl never crosses the edge."
  - "est_usd (usage.jsonl modality rates) vs spend_usd (LiteLLM
    invoiced) are both rendered side-by-side — live voice spend
    bypasses the gateway (per-lane paid Gemini keys since 2026-10-13)
    so spend_usd under-covers by design; est_usd under-covers nothing
    but is a price-table estimate. Report footer says so."
  - "ops-event CPT is registered outside chaba-boards — worker no-ops
    the heartbeat if the type is absent (post_type_exists guard)."
  - "PHP not available on the dispatch host — code is reviewed but not
    `php -l` linted. First Plesk run is the syntax check; the worker
    always writes a heartbeat incl. on failure, so a PHP fatal shows as
    a stale heartbeat (self-detecting via wp-watch)."

