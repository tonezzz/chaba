summary: |
  Tony prefers Plesk-side CPU where possible. This job implements the
  three-part design from the card:

    (a) idc03 exports ONE aggregate usage JSON — flat day x lane rows from
        ada-voice usage.jsonl + LiteLLM_SpendLogs, NO raw session data
        (it crosses the public edge) — pushed by a systemd timer to the
        idc02 caddy-edge webroot and served on a bearer-gated path.
    (b) A PHP worker inside the chaba-boards plugin (v0.5.0) runs via
        Plesk Scheduled Task, pulls the feed, and does ALL bucketing
        Plesk-side into a rolling private `report` CPT post
        (slug usage-ledger). WP-Cron hourly fallback is armed
        automatically if the Plesk task isn't set up.
    (c) Every run bumps an ops-event heartbeat post
        (slug heartbeat-usage-pull, title "ops-h3 usage-pull");
        idc02 wp-watch verifies freshness — the alert path (board-api via
        ssh tony-dell) never crosses the watched host.

topology: |
  idc03  usage-feed.py (timer, 15m)
           usage.jsonl ──► day x lane rows (turns/sessions/aux/tokens/
           LiteLLM DB    est_usd)  +  SpendLogs day x key-alias x model
                           │ scp via fleet ssh mesh (atomic .tmp+mv)
                           ▼
  idc02  caddy-edge webroot  ~/.config/containers/caddy/data/www/feeds/
           usage.json  (same docroot cms-publish-site.py writes)
                           │ GET /feeds/usage.json  Authorization: Bearer
                           ▼
  h3     Plesk Scheduled Task -> usage-pull-cron.php -> wp-load ->
           chaba_usage_pull_run()  [chaba-boards.php v0.5.0]
             -> upsert report/usage-ledger (private, member-visible)
             -> bump ops-event/heartbeat-usage-pull
                           │ REST read of `modified` (anonymous)
                           ▼
  idc02  wp-watch.timer  +freshness check -> board-api comment on stale

feed_schema: |
  {
    "feed": "chaba-usage/v1",
    "generated_at": "<utc iso>",
    "window_days": 14,
    "sources": {"usage_jsonl": "ok|unreadable:…",
                "litellm_spend": "postgres:LiteLLM_SpendLogs|admin:…|err"},
    "usage": [ {"date":"YYYY-MM-DD","lane":"ada-ha-kk|ada-backends|…",
                "turns":n,"sessions":n,"aux_calls":n,
                "tok_in":n,"tok_out":n,"tok_cached":n,"tool_use":n,
                "est_usd":f,"sources":{"live":n,…}} ],
    "spend": [ {"date":"YYYY-MM-DD","key":"<alias>","lane":"<lane>",
                "model":"<model>","calls":n,"tokens":n,"spend_usd":f} ]
  }

  Lane attribution honesty: SpendLogs rows map alias->lane via
  USAGE_FEED_KEY_LANES (default chaba->tony, michael->michael, kk->kk,
  bench->bench, <master>->master). usage.jsonl rows carry a lane only
  when usage_tracker writes unit/lane/backend on the record — otherwise
  they bucket under "ada-backends" (the file is shared across ada-*
  units; per-lane live-traffic truth still needs journald, which stays
  out of the feed per the aggregates-only rule).

