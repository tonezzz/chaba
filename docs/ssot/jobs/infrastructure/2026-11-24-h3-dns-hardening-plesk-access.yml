lessons:
  - "caddy-edge on idc02 logs to the USER journal (podman quadlet under
    user@1000) — `journalctl -u caddy-edge` (system) shows nothing; use
    `journalctl --user -u caddy-edge.service`."
  - "Caddy reverse_proxy DNS bypass: `transport http { resolvers <ips> }`
    overrides system resolvers for upstream lookups — cleaner than
    IP-pinning when the hostname may change."
