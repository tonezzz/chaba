lessons:
  - "Masking + a non-systemd .standby suffix is what makes a standby unit
     genuinely inert; a plain disabled unit is not safe against glob enable."
  - "secrets-backup bundles all of .config/systemd/user — extract only the
     named env files on con01, never the whole tree."
  - "Ansible file: state=link must not set owner/group when masking to /dev/null
     (it follows the link and chown fails Errno 1). Fixed in this play."
  - "The edge routes were already present; the real DR gap was activation
     readiness (venv, masks, inactive edge), not a missing Caddyfile route."
