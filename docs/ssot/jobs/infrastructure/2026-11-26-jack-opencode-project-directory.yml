    - Whether Jack still needs a dedicated IDE at all post-retirement.

report:
  status: completed
  completed_at: "2026-11-26"
  summary: >-
    Card premise was stale: the entire jack-ide container stack was
    retired on idc02 on 2026-11-24 (with ada-code); verified live —
    quadlets .retired-20261124, routes removed, backup holds an EMPTY
    workspace and zero enroll state. Diagnosed the project flow anyway on
    both opencode versions: the UI can only open EXISTING directories
    (no mkdir/create API on 1.19.4 or 2.4.1); external_directory=deny on
    v1 confines repo-scoped sessions away from /workspace-level files
    (AGENTS.md, shared/, outputs/) — a real workflow break for the
    promotion lane. Delivered the safe create path (jack-task
    project|scratch -> projects/<slug>, escape-proof), operator docs,
    4 new tests (20/20 pass), and a verified create->open->write->verify
    ->cleanup smoke on a faithful mock workspace.
  metrics:
    - metric: opencode versions tested
      value: 1.19.4 (container pin) + 2.4.1 (current host serve)
    - metric: tests
      value: 20 unittest cases passing
    - metric: live changes
      value: none — repo-side only
  links:
    - title: kanban card
      card: jack-opencode-project-directory-creation
    - title: stack docs
      path: stacks/idc02/jack-ide/WORKSPACES.md
  kb_review: []
  lessons_learned:
    - 'Card "live check" notes go stale — always re-verify service state on the host before treating infra as live.'
    - 'opencode UI cannot create project dirs on ANY version — the safe path is host-side mkdir inside an allowlisted layout, then open in the picker.'
    - 'v1 external_directory=deny + per-repo projects = agent locked out of workspace-level files; scope sessions to the workspace/global project or allowlist the shared paths.'

