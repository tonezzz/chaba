lessons:
  - "On an oversubscribed host, restart-reclaim is whack-a-mole: freed
    swap is re-occupied by hot services within minutes. Measure SwapFree,
    not per-unit swap, to judge real progress."
  - "systemctl is-active/is-enabled return non-zero for inactive/disabled
    — append || true or failed_when:false in verify commands or the play
    fails after doing the right thing."
  - "ansible command tasks skip in --check mode; read-only probes need
    check_mode: no. systemd_service can't see a unit whose file is only
    a pending copy — enable timers via command+changed_when:false."
  - "pwa_server HTTP health lags is-active by 30-90s; single-shot probes
    race the bind — wait-loop up to ~2min."
  - "The unit-resurrection source for 'disabled but restarted' services
    is an unconditional `systemctl --user restart $SERVICES` in
    ada-voice's deploy-ada.sh — chaba's deploy-ada.sh has an is-active
    guard and was NOT the culprit."
