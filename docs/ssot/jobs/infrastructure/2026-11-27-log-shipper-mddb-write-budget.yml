known_limits:
  - "Congestion waves >130s server-side still fail honestly — that
    is real MDDB-ops distress, not a shipper bug. The hourly timers
    all fire within ~2min fleet-wide (:50-:52), a thundering-herd
    pattern that likely CAUSES the waves; staggering schedules is a
    separate card-worthy fix."
  - "SIGTERM-killed runs (TimeoutStartSec) can exit 0 with partial
    progress — pre-existing checkpoint design, unchanged."
  - "prune /delete keeps timeout=15 — different service
    (prune-old-docs), not part of the alert path; revisit if it
    starts timing out."
