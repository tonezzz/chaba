residual: >-
  - idc02 mddb-cms/mddb-panel quadlets were retired as phantoms but the
    generated failed units may linger until reset-failed; harmless.
  - tony-dell gemini-ollama-proxy.service is enabled+failed — it will
    attempt start at next boot/login (log_tag is already fixed in
    containers.conf, so it may succeed; left for operator decision).
  - stacks/ SSOT gaps: stacks/idc02 has no mddb/notebooklm-*/status-data
    entries; stacks/idc03 has no tony-ha (running as systemd-tony-ha).
    Quadlet truth currently lives only on-host + in this trail.
  - con01/mddb-follower.container (stacks/) contains the replication
    secret in PLAINTEXT — pre-existing repo exposure, flagged not fixed.
  - ansible-chaba still contains other roles (security, monitoring,
    gpu-workers) applied by site.yml to all hosts — only the
    quadlet-services surface was retired; a future site.yml run could
    still rewrite storage.conf/containers.conf (templates now valid).
lesson: >-
  Quadlet-generated unit names hide the container name: without
  ContainerName= the container is systemd-<unit> — audit with
  `podman ps -a`, not assumed names. Ansible 'Managed by Ansible'
  headers + Documentation= URLs are the tell for generated files;
  cross-check every one against `podman inspect` before trusting.
  TOML inline tables must be single-line AND podman's storage.conf
  schema wants STRING values for pull_options — bools fail decode.
  `rootless` is not a valid storage.conf key (podman autodetects).
