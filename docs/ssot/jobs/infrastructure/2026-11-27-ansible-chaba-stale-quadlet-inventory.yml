icon: wrench
title: Reconcile ansible-chaba stale quadlet inventory — restore live truth, retire generator
date: 2026-11-27
card: ansible-chaba-stale-quadlet-inventory
context: >-
  The 2026-11-26T02:17Z fleet regeneration run by
  /home/tony/tony-projects/ansible-chaba (on idc02, previously NOT under
  version control) rewrote ~/.config/containers/systemd/*.container files
  from host_vars inventory that had drifted badly from live podman state.
  Worst case: idc03 mddb.container would have restarted the MDDB primary
  on tradik/mddb:2.15.3 with /data instead of /app/data (empty DB),
  dropping EnvironmentFile=mddb-follower.env (replication secret) and
  ~30 env vars. tony-dell suffered a mass unit-failure at 11:55-11:56
  (conmon "k8s-file doesn't support --log-tag"), idc02 mddb-cms/mddb-panel
  restart-looped to failed, mn01's podman CLI broke entirely on invalid
  storage.conf TOML. Card required: audit every ansible-managed quadlet
  vs podman inspect + stacks/ SSOT, reconcile or retire the generator,
  get ansible-chaba into VC, and NEVER restart affected units.
