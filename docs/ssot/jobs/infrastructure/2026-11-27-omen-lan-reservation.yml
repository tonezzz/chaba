outcome:
  result: fixed
  evidence:
    - "ZTE F688 DHCP bindings live: tonyomen=192.168.2.86/b0:22:7a:f0:73:cd, omenwlan=192.168.2.84/d0:57:7b:ea:6a:3c"
    - "omen eno1 NM ipv4.method=manual 192.168.2.86/24 — no DHCP on the wired LAN path"
    - "from tony-dell: ping 192.168.2.86 OK, curl http://192.168.2.86:8090/ -> 200"
    - "live cast-browser.service MEDIA_BASE=http://192.168.2.86:8090, is-active=active"
    - "192.168.2.84 confirmed dead on LAN (wlo1 moved to TP-Link 192.168.0.x)"
  residual:
    - "avahi-daemon on omen is allow-interfaces=wlo1 only (deliberate 2026-08-05 fix) — tony-omen.local does NOT resolve to .86 for non-Tailscale LAN clients (e.g. Chromecast). Left unchanged; only matters if a consumer needs mDNS — IP literal .86 is the contract."
    - "If wlo1 ever rejoins TONY-WIFI_5G it takes bound .84 — hardcoded .86 refs then depend on eno1 staying up (multi-WAN reality, documented)."
    - "ZTE binding table caps at 10 entries and is currently FULL — next new reservation requires deleting one."

lessons:
  - "Repo unit files and live ~/.config/systemd/user units drift independently — always `systemctl --user cat` the live unit before assuming repo state; the .84 MEDIA_BASE bug was live-only."
  - "ZTE F688 menuData needs the literal `_lua.lua` tag suffix plus per-page _sessionTmpToken query param, or it returns SessionTimeout — the form-action span shows the exact tag."
  - "A 'DHCP reservation exists' claim needs live verification — bindings were added 2026-09-17 yet drift still happened 2026-10-12; host-side static config was the actual fix that landed later."
