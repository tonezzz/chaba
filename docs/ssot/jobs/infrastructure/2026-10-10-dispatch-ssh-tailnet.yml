      service-ssh target policy (documented in the learning superseded note)'

report:
  status: done
  completed_at: "2026-10-10"
  summary: |
    Root cause confirmed live: Ada's devin dispatch SSHes the tony-dell LAN
    IP 192.168.2.67, which is unreachable whenever the LAN is partitioned
    (from idc02/idc03 right now) or sshd is wedged. The 2026-09-24 rule
    that forced the LAN IP is stale — Tailscale SSH is disabled on
    tony-dell (RunSSH:false) so the tailnet path carries plain sshd key
    auth with no interactive check. Flipped all six chaba-side ssh-to-dell
    defaults (canary alerts, dispatch outcome events, job-run fallback) to
    `tony-dell`, corrected the runbook + learning + job docs, and filed
    ada-dispatch-tailnet-target for the ada-pi client-side default
    (ADA_DEVIN_DISPATCH_HOST) which lives outside this worktree.
  lessons:
    - Defaults that alert on a path must not depend on that path —
      EVENT_SSH=192.168.2.67 meant a LAN outage also killed its own alarm.
    - Infrastructure lessons have a shelf life — RunSSH flipped off at some
      point and a rule written for it became the bug. Date-stamped
      superseded notes beat silent doc edits.
    - 'ssh -G <alias> + tailscale debug prefs are the two commands that
      settle "which path does service ssh actually take".'
