title: Home Network Connectivity Triage
subtitle: Verify home network connectivity between tony-dell, tony-omen, and the macbook, and reconcile mDNS/hostname profiles.
icon: target
planning:
  goal: Verify home network connectivity between tony-dell, tony-omen, and the macbook, and reconcile mDNS/hostname profiles.
  scope: Internal network paths (tony-omen, tony-dell, tailscale), mDNS .local resolution, and the tony-dell iPhone hotspot
    path.
  success_criteria:
  - All health-critical internal hosts resolve and respond on both home and mobile profiles.
  - mDNS (.local) versus tailnet hostname behavior is documented for each host.
  - iPhone hotspot path is either working or parked with a manual step.
  risks:
  - Changing hostname in health configs could break existing workflows.
  - iPhone hotspot requires on-device action; cannot be fixed from tony-dell alone.
  resources:
  - ssot.health.home.yml
  - ssot.health.mobile.yml
  - mcp-health
  - mcp_raw
  owner: tony
  estimated_duration: 1 session
  related_focus:
  - label: Network Connectivity Issues (2026-08-20)
    file: docs/ssot/ssot.improvements.yml
processing:
  status: completed
  started_at: '2026-08-20T03:00:00+07:00'
  completed_at: '2026-08-20T03:20:00+07:00'
  steps:
  - Ran mcp-health check_health and identified Redis and MDDB Container as unknown due to mcp-health running on tony-omen and not being able to run podman ps on tony-dell.
  - Disabled remote container checks for redis and mddb-container in ssot.health.home.yml and ssot.health.mobile.yml.
  - Updated mcp-health/server.js auto-detect to use tailnet short name tony-omen instead of tony-omen.local.
  - Verified tony-dell network state: enp0s31f6 up, no default route, wlx00761100125e down, no iPhone hotspot connection.
  - Added iPhone hotspot manual setup steps to ssot.tony-dell-multi-wan.yml.
  - Added Hostname / mDNS / Tailnet Reference table to ssot.tony-dell-multi-wan.yml.
  - Validated all SSOT YAML files.
  - Committed changes.
followup:
  verification:
  - Re-run mcp-health after the mcp-health server is restarted to confirm the new auto-detect code is active.
  - Manually enable iPhone "Maximize Compatibility" and connect tony-dell to test the hotspot fallback.
  rollback:
  - Re-enable redis/mddb-container container checks if mcp-health later supports remote podman checks.
  - Restore tony-omen.local ping in mcp-health/server.js if .local mDNS is preferred for the home network.
  handoff: []
report:
  status: completed
  summary: |
    mcp-health now uses tailnet short names for profile auto-detect and service URLs. Remote podman container checks
    (redis, mddb-container) are disabled because the mcp-health process runs on tony-omen and cannot invoke podman on tony-dell.
    iPhone hotspot fallback is not currently configured; the Ralink MT7601U Wi-Fi adapter is 2.4 GHz only, so iPhone
    "Maximize Compatibility" must be enabled before tony-dell can see the SSID. Manual setup steps are now in
    ssot.tony-dell-multi-wan.yml. A per-host mDNS vs tailnet reference table is also documented there.
