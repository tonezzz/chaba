title: ocb SPA route guard — moot, removed by 2026-11-24 opencode public-route retirement
subtitle: card ocb-spa-route-guard-upstream-fix verified obsolete — the @ocbUnknownRoute
  guard left the live Caddyfile when the whole opencode public edge was retired;
  upstream anomalyco/opencode#61001 still unfixed as of v2.4.1
date: 2026-11-25
card: ocb-spa-route-guard-upstream-fix
status: verified-moot
mode: read-only verification + board comms; no live mutation

context:
  trigger: "Dispatch for card ocb-spa-route-guard-upstream-fix: 'Remove caddy
    SPA route guard when opencode ships #61001 fix'. Guard was a temporary
    @ocbUnknownRoute redirect-to-/ on ada-code.surf-thailand.com +
    opencode-ada.surf-thailand.com (idc02 caddy-edge), workaround for
    anomalyco/opencode#61001 (SPA crashes 'Cannot read properties of
    undefined (reading type)' on unrecognised paths, e.g. auth-proxy
    post-login redirects). Applied 2026-11-21."

findings:
  guard_state: >
    GONE from live config. idc02 ~/.config/caddy/Caddyfile (639 lines)
    contains no ocbUnknownRoute and no site blocks for
    ada-code/opencode-ada/opencode-jack — only a retirement comment at
    ~line 599. The guard survives solely in backups
    (Caddyfile.bak-retired-opencode-20261124 still shows the full block;
    Caddyfile.bak-ocb-route-guard-20261121 is the pre-guard baseline).
  why_gone: >
    2026-11-24 the entire opencode public edge was retired: site blocks
    for opencode-jack / ada-code / opencode-ada removed from the
    Caddyfile and quadlets jack-enroll :8377 / ada-code-enroll :8378
    (CF-Access JWT gateways) deleted; backup dir
    ~/backups/retired-opencode-20261124 on idc02. The localhost
    ada-opencode container stack went with it — live opencode is now a
    host binary v2.4.1 (/usr/local/bin/opencode, @opencode/cli npm
    global) served by opencode-serve.service, listening on tailnet
    100.123.163.11:4096 only — no public vhost, no Caddy in front.
  upstream_state_2026_11_25: >
    anomalyco/opencode#61001 still OPEN; PR #61017 still OPEN and per
    opencodejr bot review incomplete (fixes the throw but leaves a
    blank page — needs a catch-all route; requireServerKey still throws
    for invalid server keys, see #60752). dev branch AND latest releases
    v2.4.0/v2.4.1 still contain `throw new Error("Unrecognised route!")`
    in packages/app/src/shell/state/layout.tsx. The bug is unfixed in
    every shipped release — moot here only because nothing public serves
    the opencode SPA anymore.
  consumer_drift_found: >
    ada-ha chaba-admin dashboard 'Ada Code' view (path ada-code) still
    iframes https://ada-code.surf-thailand.com/ — dead hostname. Carded
    as ada-ha-chaba-admin-ada-code-view-iframes-d1c492 (HOM-1394).
    consumer-canary only watches tony-dell.taila0626a.ts.net so this
    class is uncaught; audit-hosts census drift for the retired
    ada-code-enroll.service entries is already covered by card
    idc02-audit-census-reconcile.

verify_commands:
  - "ssh idc02 'grep -n ocbUnknownRoute ~/.config/caddy/Caddyfile'  # expect: no match"
  - "ssh idc02 'systemctl --user status opencode-serve.service; opencode --version'"
  - "curl -s https://api.github.com/repos/anomalyco/opencode/issues/61001 | jq .state"
  - "curl -s https://raw.githubusercontent.com/anomalyco/opencode/dev/packages/app/src/shell/state/layout.tsx | grep -n 'Unrecognised route'"

recheck_if: >
  If the opencode web UI is ever re-exposed publicly (new vhost in front
  of opencode-serve :4096 or a rebuilt ada-code container), re-run the
  upstream checks first — as of v2.4.1 the bug is still live upstream,
  so any public SPA mount needs the route guard (or an equivalent
  upstream fix) re-applied. The guard block text is preserved verbatim
  in ~/.config/caddy/Caddyfile.bak-retired-opencode-20261124 on idc02.
