  verified: >
    https://tony-dell.taila0626a.ts.net:8123/local/documents/A-68/
    A-68-deed-front-070547.jpg -> 200 image/jpeg 145059B (the exact URL
    from the original broken-image report). Post-mddb-restart manual run:
    synced 8 pages across 2 archives (A-68 + selftest-20260926).
  hardening: >
    Every curl bounded (--connect-timeout 10 --max-time 120), rsync bounded
    (--timeout 120, ssh ConnectTimeout 10 BatchMode), TimeoutStartSec=600 in
    the unit — a hung/unavailable MDDB (witnessed during the 2.15.3
    redeploy that OOM-restarted the old container) fails the run instead of
    stalling the hourly timer forever.
  caveat: >
    A-68 is deed/passport/ID scans now web-servable — only reachable over
    tailnet-gated HA :8123, matching the original intent. Do not broaden
    exposure without Tony's explicit approval.

