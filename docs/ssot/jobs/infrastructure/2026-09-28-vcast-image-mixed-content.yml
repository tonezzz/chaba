      - "have the sender resolve docs to a real URL (doc-archive /v1/archive/"
      - "page/{n} is API-key gated; ada-pi /api/documents/{key}/preview only"
      - "covers held intakes, not archived sets)"
    needs: user decision — mutating tony-ha www is a live deploy
  - item: "update MDDB ada-cms-pages 'fix-vcast-controls' with repair outcome"
    needs: ada-bank write (Tony asked the report be updated post-repair)
  - item: "deploy — rsync index.html into the live web mount"
