screen1_acl:
  request: "'screen 1 is public but Ada keeps getting denied' (transcript
    e3a3a3cded: Tony explicitly confirmed 'บันทึกไว้เลย ผมยืนยัน')"
  root_cause: >
    Two stacked issues. (1) cast-screens.json had screens."1"=person.tony —
    the speaker in those sessions resolved to anonymous (speaker-ID did not
    identify Tony; contaminated profiles — NewSpeaker/Timmy dup — are a
    known open item), so _check_screen_owner denied with 'identify the
    speaker first'. (2) Ada then 'recorded' screen 1 as public via
    ada_remember — but the ACL lives only in
    ~/.local/share/ada-pi/cast-screens.json (read fresh per call); memory
    notes can never change it, so every retry re-denied.
  fix: >
    screens."1" flipped to "shared" on idc01 (backup kept). Verified via the
    exact check logic: anonymous/tony/kk all now ALLOW on screen 1; other
    screens default shared; sources seat/omen remain person.tony.
  followups:
    - "Speaker-ID never resolved Tony in sessions fd3d4bdfcb/e3a3a3cded —
      junk profiles (NewSpeaker, Timmy) cleanup still needs Tony approval."
  denial_message_fix: >
    ada-pi commit d60305e — owner-lock denials now name cast-screens.json,
    state memory notes cannot change the ACL, and give the remediation
    (speaker-ID retry or owner flips to "shared"). Shared helper also covers
    the tv_action source-owner path. Deployed to idc01 via file copy (the
    checkout has unrelated WIP blocking a pull); all 4 Ada backends
    restarted and healthy.

