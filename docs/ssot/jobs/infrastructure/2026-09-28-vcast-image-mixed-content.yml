findings:
  root_cause_1_scheme: >
    The casted URL used http:// on tony-ha :8123, which is an HTTPS-only
    listener (verified: plain HTTP gets "400 — Client sent an HTTP request to
    an HTTPS server"). The receiver page itself is served over HTTPS
    (https://tony-dell.taila0626a.ts.net/apps/vcast/), so the browser also
    blocks http subresources as mixed content — broken image icon either way.
  root_cause_2_missing_file: >
    Even upgraded to https://, the reported URL 404s: documents/ does not
    exist in tony-ha's www (checked ~/.config/home-assistant/www — only
    ada-* cards, cam/, ha/) nor on michael-ha (404 too). A-68 pages live
    only on gdrive:ada-documents/2026/A-68 via the idc01 doc-archive service
    (GET /v1/archive/{slug}/page/{n}, X-API-Key gated — not usable as a bare
    <img> src). Whoever produced the cast URL assumed a /local/documents/
    tree that was never published.
  confirmed_working: >
    https://tony-dell.taila0626a.ts.net:8123/local/cam/*.jpg returns 200
    image/jpeg — the cctv_snapshot cast path is fine once the scheme is
    corrected.

changes:
  file: stacks/web/public/apps/vcast/index.html
  detail: >
    Added mediaUrl() — rewrites http: to https: when the page itself is
    served over TLS (on an https page an http subresource is dead anyway;
    upgrading can only help). Applied to image/play/nav/audio renderers.
    showImage() now attaches img.onerror/onload: first failure sets HUD
    "image failed", shows a toast with the (normalized) URL, and reports
    state:error to the relay (visible in /displays registry + vcast-ctl
    room). Interval refreshes keep retrying but only report once; a
    successful load re-arms error reporting. teardown() clears the handlers.
  verification: >
    Served the worktree page over local HTTPS (self-signed, CDP-driven
    headless Chrome) joined to the live relay in room vcast-test.
    POST /api/input-bridge/pub {type:image, url:http://...:8123/local/cam/
    last-xiaomi-frame.jpg} -> receiver rewrote to https, img loaded
    (naturalWidth=424, display:block). The A-68 URL now lands on https and
    correctly reports "image failed" (file genuinely absent, HTTP 404).

ada_sees_screen:
  request: "'fix ada cannot see the cast screen' + test webpage casting"
  snapshot_architecture: >
    Ada tool vcast_snapshot (ada-pi backend/realtime_provider.py, deployed on
    idc01) sends a ws snap-request -> display draws its visible element into
    a canvas -> POSTs a JPEG to relay /frame -> Ada polls
    GET /frame?screen=N&token="<tok>". Relay + display snap code were already live
    (commits 1cc139e/348d684 + uncommitted live work); this branch's worktree
    was based on an older snapshot of the files, so the live versions were
    taken as the baseline before applying fixes.
  gaps_fixed:
    - "Cross-origin <img> without CORS tainted the canvas -> Ada got an error
      instead of pixels. snapFrame now catches the SecurityError and refetches
      the same URL through a new relay endpoint GET /img?url= (server-side
      fetch, allowlisted to tailnet/LAN/loopback) — the blob copy is
      same-origin so the canvas stays clean."
    - "snap 'uncapturable-iframe' now carries detail=<iframe src> so Ada can
      name the page even though its pixels can't be read (browser security —
      no fix possible in-page)."
    - "img shown-but-unloaded posts error 'image-load-failed' with the URL."
  webpage_cast_test: >
    Live relay, connected screen 2 (Browser): POST /pub nav example.com ->
    delivered=1, /displays state=nav detail=url, iframe loads. Snap returns
    uncapturable-iframe as designed (cross-origin page pixels unreadable).
    Local harness (worktree page + local relay + CDP chrome): nav
    http://example.com rendered as https://example.com (mediaUrl applied),
    snap -> uncapturable-iframe detail=https://example.com/. Screen 2
    restored to camwall zone-a after testing.
  verified_locally:
    - "image cast http://cam URL -> https upgrade -> rendered -> snap-request
      returned real JPEG (17936B) via /img proxy fallback"
    - "GET /img: allowlisted tailnet host -> 200 JPEG; public host -> 403;
      upstream 404 -> 502"
    - "404 image -> snap posts image-load-failed with URL"

