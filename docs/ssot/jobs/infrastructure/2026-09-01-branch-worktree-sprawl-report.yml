title: Branch/Worktree Sprawl Report — Phase 1 (tony-dell)
subtitle: Collect a read-only inventory of branches and worktrees across the chaba* repo family on tony-dell
icon: target

planning:
  goal: Produce a complete, read-only inventory of git branches and worktrees for the chaba project family on tony-dell.
  scope:
    Data collection only. No deletion, pruning, or modification of branches/worktrees.
    Covers /home/tony/CascadeProjects/chaba* directories on tony-dell that contain a git repository.
  success_criteria:
  - JSON report at reports/2026-09-01-branch-worktree-sprawl.json with per-repo branch and worktree lists
  - Markdown summary at reports/2026-09-01-branch-worktree-sprawl.md with counts and stale-branch candidates
  - Job report section is completed on the experiment branch
  - All output is committed and pushed to experiment/tony-dell-task-runner
  risks:
  - Risk: running on the wrong host. Mitigation: script checks hostname and refuses unless it matches tony-dell (or --force is passed)
  - Risk: touching unrelated repos. Mitigation: only scans directories whose names start with 'chaba' and contain a .git directory
  resources:
  - tony-dell worktree /home/tony/CascadeProjects/chaba-tony-dell-experiment
  - Python 3 and git on tony-dell
  owner: tony
  estimated_duration: 1 session
  related_focus:
