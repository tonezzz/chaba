title: Branch/Worktree Sprawl Report — Phase 1 (tony-dell)
subtitle: Collect a read-only inventory of branches and worktrees across the chaba* repo family on tony-dell
icon: target

planning:
  goal: Produce a complete, read-only inventory of git branches and worktrees for the chaba project family on tony-dell.
  scope:
    Data collection only. No deletion, pruning, or modification of branches/worktrees.
    Covers /home/tony/CascadeProjects/chaba* directories on tony-dell that contain a git repository.
  success_criteria:
  - JSON report at reports/2026-09-01-branch-worktree-sprawl.json with per-repo branch and worktree lists
  - Markdown summary at reports/2026-09-01-branch-worktree-sprawl.md with counts and stale-branch candidates
  - Job report section is completed on the experiment branch
  - All output is committed and pushed to experiment/tony-dell-task-runner
  risks:
  - Risk: running on the wrong host. Mitigation: script checks hostname and refuses unless it matches tony-dell (or --force is passed)
  - Risk: touching unrelated repos. Mitigation: only scans directories whose names start with 'chaba' and contain a .git directory
  resources:
  - tony-dell worktree /home/tony/CascadeProjects/chaba-tony-dell-experiment
  - Python 3 and git on tony-dell
  owner: tony
  estimated_duration: 1 session
  related_focus:
  - label: Dev-system regression
    file: docs/ssot/ssot.focus.current.active.yml

processing:
  status: completed
  started_at: '2026-09-01T17:18:25'
  completed_at: '2026-09-01T17:19:23'
  steps:
  - id: 1
    label: Discover chaba* repos
    status: completed
    notes: Found 3 repos on tony-dell (chaba-h3-tony-dell, chaba-tony-dell, chaba-tony-dell-experiment)
  - id: 2
    label: Collect branches
    status: completed
    notes: Captured local and remote branch lists with git branch -vv and git branch -r -vv
  - id: 3
    label: Collect worktrees
    status: completed
    notes: Captured git worktree list for each repo
  - id: 4
    label: Summarize
    status: completed
    notes: Generated reports/2026-09-01-branch-worktree-sprawl.{json,md}
  - id: 5
    label: Commit and push
    status: completed
    notes: tony-dell generated the reports; git add failed because reports/ is in .gitignore, so files were scp'd to the local worktree and pushed from there
  decisions:
  - label: Use git add -f for reports
    rationale: The reports/ directory is gitignored, but these artifacts need to be committed for review
  - label: Push from local worktree after scp
    rationale: The tony-dell worktree's origin was a stale https token; SSH also failed host-key verification, so the generated files were transferred to the orchestrating host and pushed from the same experiment branch
  changes:
  - file: reports/2026-09-01-branch-worktree-sprawl.json
    summary: Raw JSON inventory of branches and worktrees from tony-dell
  - file: reports/2026-09-01-branch-worktree-sprawl.md
    summary: Human-readable summary of the same data

followup:
  verification:
  - Check that the JSON and MD files exist on the experiment branch
  - Verify the report is read-only (no branch/worktree state changed)
  rollback_plan:
  - Remove the generated report files if stale or no longer needed
  handoff:
  - Next owner: tony. After reviewing the report, approve Phase 2 (prune stale branches/worktrees).
  deferred:
  - Actual branch/worktree pruning requires user approval and is out of scope for this Phase 1 job

report:
  status: completed
  completed_at: '2026-09-01T17:19:23'
  summary: tony-dell successfully generated a read-only inventory of all chaba* repos on that host. The report revealed 3 repos, 9 local branches, 90 remote branch refs, and 9 linked worktrees. The chaba.h3 branch is the most diverged (ahead 1015, behind 1338 vs origin/chaba.h3). No destructive actions were taken.
  metrics:
  - metric: repos_scanned
    value: 3
  - metric: local_branches
    value: 9
  - metric: remote_branch_refs
    value: 90
  - metric: worktrees
    value: 9
  - metric: most_diverged_branch
    value: chaba.h3 (ahead 1015, behind 1338)
  links:
  - title: Markdown report
    url: https://github.com/tonezzz/chaba/blob/experiment/tony-dell-task-runner/reports/2026-09-01-branch-worktree-sprawl.md
  - title: JSON report
    url: https://github.com/tonezzz/chaba/blob/experiment/tony-dell-task-runner/reports/2026-09-01-branch-worktree-sprawl.json
  - title: Related focus
    file: docs/ssot/ssot.focus.current.active.yml
  kb_review:
  - tony-dell can generate and store read-only inventories safely, but needs a working git push configuration to close the loop autonomously
  lessons_learned:
  - Generated report files in a gitignored directory (reports/) require git add -f or should be written to a tracked docs/ path
  - The tony-dell worktree remote was a stale HTTPS token; for autonomous remote dispatch, tony-dell needs a valid SSH or refreshed token

config:
  version: 1
