outcome:
  result: fixed
  evidence:
    - "plug-watch.log tail: '2026-11-25 10:31:57 subscribed' (HA websocket auth_ok)"
    - "pgrep ha-stall-watchdog.sh -> pid live; probes HA :8123 every 15s"
    - "curl 127.0.0.1:9223/json/version -> Chrome/158.0.8127.88"
    - "curl 127.0.0.1:8780/detect -> JSON {person_count, counts, source: ip_cam_65_low}"
    - "systemctl --user is-enabled/is-active -> enabled/active for all 4"
  residual:
    - "yolo-detect /detect currently returns error=imdecode empty-buffer: ALL remote go2rtc sources are frameless — ip_cam_65@192.168.2.71 and xiaomi_c201@192.168.2.77 do not ping (offline), xiaomi_c100@192.168.2.81 pings but xiaomi:// producer yields 0B (token/producer issue; xiaomi-token-refresh.timer exists). omen_cam local source works (31KB frames). Camera-side outage is a separate lane — yolo-detect itself is correctly deployed and will report detections when frames return."
    - "HA template image.yolo_annotated pointed at http://192.168.2.86:8780/image — yolo-detect binds 127.0.0.1 only, so the LAN-IP image was broken (pre-existing; likely dead since jev-student took tailnet :8780 ~11-18 and yolo-xiaomi was already disabled). RESOLVED 2026-11-26 via card ha-template-image-yolo-annotated-points-5af431: templates.yaml on omen repointed to http://127.0.0.1:8780/image (backup templates.yaml.bak-20261126), template.reload applied, verified end-to-end through HA /api/image_proxy (200 image/jpeg). The audit's bare-GET 404 was NOT a missing route param — server.py /image takes none; 404 = 'no image yet' while state.annotated is empty. No new LAN bind added (ss shows only 127.0.0.1:8780 + pre-existing jev-student 100.75.102.88:8780). Caveat: declared source ip_cam_65_low is still frameless (camera outage, separate lane); /image keeps serving the last good frame, so the dashboard renders a stale omen_cam snapshot until cameras return."
    - "omen playlived REMOTE_CDP=http://127.0.0.1:9222 and the dell->omen tunnel (playlive-omen-cdp-tunnel.service, repo systemd/) are both dead ends: tunnel unit absent on dell, nothing serves omen:9222. omen's own playlive-chrome is :9223. Remote chrome-live path needs re-provisioning or config alignment — documented in playlive-hosts.yml (tony-omen now available:false for remote clients)."
    - "Port :8780 on omen is now triple-booked conceptually: jev-student bound 100.75.102.88:8780 (11-18), yolo-detect 127.0.0.1:8780, yolo-xiaomi wanted 0.0.0.0:8780 (impossible). If jev-student's :8780 was not a deliberate pick it should move — flagged, not changed."

lessons:
  - "'Post-reboot dead units' can be stale-disabled, not reboot casualties — audit-auto-tony-omen (2026-11-12) already recorded this stack as deliberately disabled; check the audit trail before assuming the reboot killed them."
  - "User journal on omen only retains the current boot (first entry 2026-11-24) — journalctl cannot prove pre-reboot unit state; use service logs (~/.local/share/*.log mtimes) and archived audit cards instead."
  - "systemd user journal 'No entries' for never-run-this-boot units is expected — verify last-run via the service's own log file, not the journal."
  - "Port collisions across binds: 0.0.0.0:PORT fails if ANY specific-addr:PORT is bound (jev-student 100.75.102.88:8780 blocks yolo-xiaomi), but specific-addr binds coexist fine (yolo-detect 127.0.0.1:8780)."
  - "Verify-by-surface caught a real upstream outage: yolo-detect serves /detect correctly but every remote camera source returns 0-byte frames — unit health != pipeline health."
