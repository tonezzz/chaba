id: 2026-11-26-cline-full-retirement
title: Cline full retirement (Tony approval 2026-11-26)
date: 2026-11-26
trigger: >-
  Tony: "Are we using Cline to do any jobs? what if we retire the Cline for now
  to save resources." Investigation showed the lane was idle (cline-intake
  idle 24h, containers 0.13% CPU / ~237MB) and the only running Cline card was
  a Devin dispatch blocked on the OpenRouter :free quota. Tony selected "Full
  retire: also drop edge route, HA tab, SSOT declarations" on the decision page.
decision:
  scope: full-retire
  approved_by: tony
  stop_services: true
  drop_edge_route: true
  drop_ha_tab: true
  drop_ssot_declarations: true
  close_related_cards: true

