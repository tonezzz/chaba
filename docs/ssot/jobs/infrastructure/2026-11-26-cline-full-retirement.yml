  containers: "con01 cline-kanban 0.13% CPU 223MB, cline-kanban-proxy 0.00% CPU 14.1MB"
  prior_assessment: "app-retirement-sweep 2026-11-24 said KEEP (live but idle) — reversed by this approval"
  ansible_playbook: none — no cline references under ansible/; one-off per-host change with backups

