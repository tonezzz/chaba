rollback:
  - "Restore the backed-up unit files on con01 (cp from backup dir), systemctl --user daemon-reload, enable --now the two timers, then recreate quadlets from stacks/con01/cline-kanban and podman compose up -d."
  - "Restore ~/.config/caddy/Caddyfile from the .bak file on idc02 and reload caddy-edge (podman exec caddy-edge caddy reload --config /etc/caddy/Caddyfile)."
  - "Restore the Ada HA dashboard via lovelace/config/save using the JSON in the tony-omen .bak file."
  - "git revert the scoped SSOT/stack/snapshot changes; re-add jobs to ssot.jobs.yml and re-render."
  - "Rollback requires a NEW explicit Tony decision — this retirement was intentional."

lessons:
  - "An idle lane can be fully retired safely: prove idleness from 24h of timer journals and container CPU/mem before stopping anything."
  - "Rendered units (ssot.jobs.yml -> systemd user) need BOTH the SSOT job removed and the installed unit file deleted; disabling alone leaves stale timers after the next render."
  - "Quadlet-generated units report enabled=generated; disable is a no-op — remove the source .container/.network files and daemon-reload."
  - "Ada HA dashboard must be changed through the lovelace websocket API (auth frame carries no id), not by editing .storage directly; HA flushes .storage edits on restart."
  - "Home Assistant websocket auth: exchange the 'ada-ha-live' refresh token from ~/.config/ada-ha/.storage/auth at /auth/token, then send the auth frame with no id."
  - "Regenerating all per-host job catalogs surfaces unrelated pre-existing drift; scope regeneration to the affected host or remove only the targeted entries."
