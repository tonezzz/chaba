id: tony-macbook-ssh-mesh-restore-enroll
title: tony-macbook — ssh mesh repair + runner-agent verify + KK-files blocker
host: tony-macbook
date: 2026-11-24
card: tony-macbook-restore-enroll
status: partial — runner verified, KK files blocked on backup media

trigger: >
  Dispatch card tony-macbook-restore-enroll (SYS-0452): restore KK files
  from the macOS backup into ~ and verify/enroll the runner-agent lane.

ssh_access:
  symptom: >
    `ssh macbook` / `ssh tony@100.77.76.112` denied (publickey) from omen
    and dell; mn01 had no Host stanza; only idc02's key still worked.
  root_cause: >
    The macbook's ~/.ssh/authorized_keys had been rebuilt down to 3 keys
    (omen id_ed25519, an omen-cascade copy, idc02) — the rejoin-seeded
    dedicated keys (omen id_ed25519_macbook, both dell keys) were gone.
    ssh-mesh-sync only APPENDS default keys, so the dedicated alias keys
    never came back on their own.
  fix:
    - re-added omen id_ed25519_macbook.pub + dell id_cascade.pub to the
      macbook's authorized_keys (via working id_ed25519 path)
    - ran scripts/ops/ssh-mesh-sync.sh — 7 hosts synced, 42 key-checks
      (idc01 unreachable, pre-existing)
    - added missing `Host macbook tony-macbook` stanza to mn01's
      ~/.ssh/config (IdentityFile id_cascade — its key was already
      authorized; bare ssh had no default identity to offer)
  verified: >
    ssh macbook works from omen AND dell; mn01/idc02/idc03 reach
    tony-macbook; authorized_keys now 9 keys covering the fleet.

runner_agent:
  state: already enrolled 2026-10-11; cap raised 2->3 2026-11-24 via
