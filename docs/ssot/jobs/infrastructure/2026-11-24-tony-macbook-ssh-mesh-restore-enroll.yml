    - "tony-dell / tony-omen / mn01 / idc02 / idc03: no ~117G usb device
      in lsblk; /mnt/ubuntu-usb on dell is an empty mountpoint"
    - "kk-mac (KK's Mac Studio): diskutil shows no external disk"
    - "restic: macbook fleet-restic covers ~/.config ~/.local/bin ~/.ssh
      only — not the backup; /dell-backup/restic-fleet/tony-macbook is
      the same config-tier repo"
  board_request: kk-files-restore-is-blocked-on-the-backu-27b870
  scope_question_raised: >
    restore-into-~ preserving backup top-level structure (recommended)
    vs merge home contents (clobbers .ssh/.config) vs user-dirs-only.

