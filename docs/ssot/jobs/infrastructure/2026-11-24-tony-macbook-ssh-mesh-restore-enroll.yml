      == origin/master 52cbc072f269 (drift defer from 08:40 healed —
      _self_update/sync-runner-tools converged it)
    - runner-agent.service + runner-agent.timer active; timer firing
    - "unit env RUNNER_CAP=3 RUNNER_MAX_LOAD_PC=0.8
      RUNNER_LABELS=macbook,local-8c,always-home"
    - "/host-status showed 3 active cards at 15:13 and merge-sweep merged
      a dispatch branch from tony-macbook at 15:23 — claims live"
  inventory:
    - ssot.host-roles.yml tony-macbook entry — present
    - ssot.kanban.yml runner_fleet prose — cap 3 labels match live unit
    - audit-hosts.py HOSTS — "macbook" -> tony-macbook present
    - ssot.host-capacity.yml tony_macbook — refreshed (disk free 203->96,
      runner note cap2/cpu,dev,portable -> cap3/macbook,local-8c,always-home)

kk_files_blocker:
