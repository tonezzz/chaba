# Job: nest-mgr v2 actuation plane — Phase 0 spec + recommend-mode implementation
title: nest-mgr v2 controlled actuation (auto-restart, guarded rebalancing)
subtitle: card nest-mgr-v2-actuation, dispatch on tony-omen
icon: gear

planning:
  goal: >-
    Turn nest-mgr from observer-governor into a controlled actuator: act on
    v1 census data through allowlisted, gated, audited actions only —
    never a parallel scheduler, never bypassing owner/quota/leash gates.
  scope: >-
    In (Phase 0, this card): mode machinery monitor/recommend/guarded,
    restart planner + never-list + throttles + circuit breakers, actions[]
    audit ring, CMS Actuation section, svc_nest_mgr_* HA attributes,
    gate-matrix test, this spec. Zero execution — recommend is the ceiling.
    Out (later phases): guarded rollout per-host opt-in (Phase 1, 1-week
    soak), broker-normalized work-stealing (Phase 2), expansion to
    omen/idc03/dell (Phase 3, per-host opt-in only).
  non_goals:
    - no parallel queue — routing stays with devnest_capacity_broker
    - no synthetic work, no bypassing owner/quota gates
    - no actuation on production lanes (ssot.nest-training.yml promotion_gate binds)
    - tony-macbook excluded until nest-mgr is installed there
  success_criteria:
    - mode resolves every tick from env NEST_MGR_MODE > mode file > monitor;
      safety flags only ever LOWER the effective mode
    - recommend mode emits planned restarts to actions[] + CMS page, executes nothing
    - guarded cannot execute without actuation.on opt-in + all per-unit gates
    - per-unit (2 fails/h), per-host (>5 execs/h), and global (actuation.off,
      NEST_MGR_MODE=monitor) breakers all verified
    - 21/21 gate-matrix tests pass (stacks/services/nest-mgr/test-actuation.py)
  owner: tony
  approval: >-
    spec APPROVED by Tony 2026-11-18 (card comm). Deploy of v2 binary to
    pilot hosts and any mode flip past monitor still need explicit approval.
  related_focus:
    - label: this card
      file: docs/ssot/kanban/cards/nest-mgr-v2-actuation.yml
    - label: runbook + operator flags
      file: stacks/services/nest-mgr/README.md
    - label: v1 card
      file: docs/ssot/kanban/cards/nest-manager-node.yml

decisions:
  control_surface: >-
    Flag files under ~/.local/share/nest/ — mode, actuation.off (kill),
    actuation.on (guarded opt-in), host-circuit.open, manual-units,
    restart-allowlist, circuit/<unit>.open. Chosen over DB/config service
    because every host operator can rm/touch them with no creds, they are
    checked every tick, and they degrade the daemon to v1 by deletion.
  never_before_allow: >-
    restart_gate checks the never-list (card-owned, unmanaged, self,
    manual, prod, on-success, circuit-open) BEFORE the allowlist — an
    allowlisted unit that is also card-owned still never restarts.
  held_verdicts_audited: >-
    Gates that block a candidate emit a `held` actions[] record (throttled
    hourly) so the CMS page shows WHY nothing happened, not just silence.
  recommend_is_phase0_ceiling: >-
    Guarded code path ships but is inert: no host gets actuation.on in this
    phase, and plan_only callers (--dry-run/--report) degrade guarded to
    recommend so a preview can never execute.
  pilot_hosts: >-
    idc02 + con01 + mn01 (fresh installs, 0-2 active nodes). tony-omen and
    idc03 stay monitor until pilot metrics look clean (Phase 1 gate).

processing:
  status: done-phase0
  started_at: "2026-11-18T21:34+07:00"
  steps:
