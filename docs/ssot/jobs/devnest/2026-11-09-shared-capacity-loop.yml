            `ready` last; depth/new hard-clamped to 3/3 regardless of
            args; live_depth counts only sealed-or-claimed packs"
  - scripts/ada/nest-worker.py:
      what: "--ready-policy auto|required|optional (default auto:
            required on *kk-llm remotes, optional elsewhere); required =
            absent/invalid marker never claimed; optional = absent is
            legacy, present-but-corrupt never claimed; one lsf --format
            sp per marked candidate; degrades safely when
            nest_pack_ready is absent"
  - scripts/ada/nest-pack-submit.py:
