            NORMALIZED spec; route_colab validates pack_source against
            the nest-pack-submit contract and seals with ready marker;
            colab_state() observes queue heartbeat age, fresh
            runtime-sessions (duplicate-runner signal), pending packs,
            JOBS.py drift vs repo canonical; record_cycle() appends a
            per-cycle record to devnest/capacity/<utc>-<rand>.json;
