stages:
  S0: "shadow/replay on the 5 frozen fixtures, paired arms, isolated worktrees"
  S1: "supervised read-only report canary, ONE runner, OPENCODE_LANES=1, concurrency=1, human watch"
  S2: "5-job read-only pilot, verifier.type=independent_devin on every artifact"
  S3: "10-20 job sampled production-read-only lane, concurrency cap 2, Telegram summaries"
  S4: "reversible artifact writes — rollback.kind in git-revert/file-restore/worktree-drop"
  S5: "branch/code tasks — STRONG_MODELS + independent verifier; production/destructive never admitted (human/Devin)"

envelope_required:
  top_level: [id, card, task_class, stage, target_host, executor,
              model, provider, mcp_allowlist, allowed_paths]
  artifact: [path, schema]
  verifier: ["type: held_out_py|command|independent_devin", ref]
  escalation: ["on_fail: manual|devin|retry_then_manual|hold",
               max_retries]
  rollback: ["kind: none|worktree-drop|git-revert|file-restore|disable-lane",
             ref]
  heartbeat: [required, stale_s]

fail_closed_denials: [kill_switch, missing_envelope_field, denied_class,
  wrong_stage, class_not_in_stage, wrong_host, missing_verifier,
  weak_verifier, denied_tool, denied_path, env_gate, quota_exceeded,
  stale_heartbeat, failed_provider, concurrency_cap, missing_rollback,
  weak_model]
post_run_failures: [missing_artifact, unverified_exit, tool_denial,
                    timeout, executor_error]

metrics_per_job: [executor, model, provider, input_tokens,
  cache_read_tokens, cache_write_tokens, output_tokens,
  provider_cost_usd, wall_s, queue_s, retries, tool_denials,
  human_minutes, verifier_pass, artifact_landed, escalated,
  combined_cost_usd, devin_equiv_tokens, failure_reason]
aggregate: "verified_success_rate (lane arm only — baselines never
  inflate), tokens+cost per verified job, wall/queue median+p95,
  retries, tool_denials, human_minutes, escalations,
  devin_tokens_displaced, failure_reasons histogram, by_stage"

