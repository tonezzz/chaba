pilot_results: |
  Executed 2026-10-26 17:42–17:52 +07 under supervision (Tony answered
  "queue all three on tony-dell now — I am watching"; runner-agent run
  manually on tony-dell with JEV_LANE=0 OPENCODE_LANES=1 — JEV_LANE=0
  avoided a claim_pass bug that re-classified pinned lanes; fixed this
  dispatch). All three jobs: executor opencode:free_lane, model
  litellm/gemini-3.5-flash-lite, 0 human-intervention minutes, 0
  escalations.
    doc    wall 36s  tok_in 35,070  tok_out 409   merged 8ea5303d
    code   wall 46s  tok_in 80,999  tok_out 816   merged b9ede30a
    report wall 38s  tok_in 56,656  tok_out 826   pushed 874a9924
  LiteLLM SpendLogs delta (list-price equivalent, not billed):
  doc+code shared window $0.0447 (321,831 tok), report $0.0253
  (254,675 tok) → $0.0700 total / 3 passed gates = $0.0233 per gate.
  Devin baseline (matched shapes, same day): doc 57.9s, code 66.1s —
  free lane was 30–38% faster on wall time with identical merge
  trajectory. Devin sessions are allowance-priced, so per the
  lane-savings hard rule the honest claim is tokens+wall+intervention,
  not dollars. Run records: docs/ssot/jobs/devnest/pilot-runs/2026-10-26-*.yml

