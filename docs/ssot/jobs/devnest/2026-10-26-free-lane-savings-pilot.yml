gaps_remaining: |
  - RESOLVED 2026-10-26: OPENCODE_LANES=1 confirmed on tony-dell — but as
    a drop-in (runner-agent.service.d/jev-lane.conf) for a unit that
    DOESN'T EXIST. tony-dell has no runner-agent.service/timer and
    kanban-dispatch is parked (2026-10-04): claims there only happen when
    a supervisor runs runner-agent.py by hand. That IS the supervised
    model — but the orphan drop-in is a host-hygiene flag, and a real
    runner-agent unit (or an ssot.jobs dispatcher job) would let queued
    cards pinned to tony-dell drain unattended. Decide: declare a unit,
    or declare dell a manual-only runner.
  - RESOLVED 2026-10-26 (this dispatch): runner-agent claim_pass
    re-classified lanes unconditionally under JEV_LANE=1, clobbering
    pinned action.lane — the doc card would have gone codemod, the code
    card paid_frontier (real spend). Fixed: explicit lane wins. The
    supervised run additionally ran with JEV_LANE=0 as a guard since
    dell's checkout carried the pre-fix code at run time.
  - RESOLVED 2026-10-26 (this dispatch): merge-sweep TASK_ID_RE only
    matched devin-dispatch tids (YYYYMMDD-HHMMSS-*); OpenCode-lane tids
    (<card-id>-<epoch>) never resolve from comms, so once finish_pass
    consumes runner state.json a held opencode merge is invisible to the
    sweep — devnest-fl-pilot-report's branch sat pushed-but-unmerged
    past a sweep tick. Fixed: regex accepts both shapes.
  - Run-record assembly is manual per the field->source table; a small
    assembler (cards + meta.json + unit journal + SpendLogs) is natural
    follow-up work — the class-2 helper lands the metric function.
  - LiteLLM SpendLogs attribution: calls log under the shared gateway
    key; attribute by model+time window (works — done in pilot-runs).
    Note SpendLogs spend is LIST-PRICE compute, not billed amount —
    Gemini free-tier billing is not visible in the proxy.
  - merge-sweep withheld `verified` on all three pilot cards (work
    present vs base but exit-evidence tier undecidable) — cards hold in
    review; verifiers were re-run manually and passed. Worth
    understanding why the opencode closeout doesn't carry the exit
    evidence tier the gate prefers (taskdir exit_code).
