job_class_placement:
  # Position = order in model_list + fallbacks. kk-mac leg-1 = max
  # savings; the shim makes a dead/hot/busy Mac a fast 503 fallthrough,
  # not a 120s timeout.
  summary:
    placement: "LIVE leg-1: [qwen32b-kkmac@shim, lite@paid, lite@free, lite@or, colab, llama3.2]"
    why: "batch posture/cms/session summaries; latency-tolerant; the
      executor contract already bounds this class on the card plane"
  classify:
    placement: "LIVE leg-1: [qwen32b-kkmac@shim, lite@paid, lite@free, lite@or, colab, llama3.2]"
    why: "cheap high-volume doc-ingest classify; same profile as summary"
  bench:
    placement: "LIVE leg-1 — natural canary: spend-isolated key, low blast radius"
  chat-local:
    placement: "LIVE leg-2: [qwen7b@tonydell, qwen32b-kkmac@shim, llama3.2@ollama, gemma3@colab]"
    why: "free-lane adopters (news-digest EN, wp-comment-sync, kanban-brief)
      carry deterministic/gemini fallbacks and bounded payloads; 32b
      upgrades prose quality over 7b when the Mac is awake. tonydell
      stays leg-1 (always-on batch host); promote kkmac only after
      availability data justifies"
  tool-call:
    placement: "DEFERRED — candidate leg-3 only: [lite@paid, lite@free, qwen32b-kkmac@shim, lite@or, colab, llama3.2]"
    why: "ada decision calls are defer-critical; 0.878 deference and
      under-defers vs llama3.2:3b. Insert at leg-3 (resilience position —
      fires only when both gemini legs fail) only after the 3-run gate;
      never promote past paid legs until deference clears 0.90"
  not_candidates:
    voice-aux: "voice-path latency + member-device jitter — never"
    chat: "ada-facing parity with 3.5-flash; revisit post-gate only"
    vision/image: "modality — wrong models"
    embedding: "768d gemini space only; a local leg poisons mddb retrieval"

