    kk-mac online window, >=24h apart, target 3 runs inside ~2 weeks.
    Queue via jevnest-kk-mac-capacity-loop (it already gates on
    heartbeat) or run manually on any tailnet host. Post each
    run-kkmac-qwen2532b.{md,json} to card kk-mac-card-judgment-eval.
  current_state: "1 run in hand (2026-11-13): acc+precision+recall
    pass, deference 0.878 fails the T3 bar — legs 1/2 for
    non-defer-critical classes are live on that basis; tool-call
    leg-3 waits for 3 clean runs AND deference >=0.90. Next pass
