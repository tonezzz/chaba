known_limits:
  - "keyword inference is deliberately narrow — ambiguous prose keeps
     the normal lane classifier; declare action.task_class for a
     deterministic route"
  - "mutation-intent is a keyword denylist, not a proof — the lane
     contract (bounded class, read-only executor, admission probe)
     remains the actual safety boundary"
