blocker_found_and_fixed:
  bug: >-
    opencode_profiles.audit_events counted EVERY write/edit/patch tool
    call as a tool_denial (den = denials + write_attempts). The
    artifact-write profile is file-mode — the agent MUST write the
    declared artifact — so every legitimate S4 run recorded
    tool_denials >= 1 and the S4 promote_gate
    (max_tool_denials: 0) was mathematically unreachable. The S4 rung
    could never have promoted.
  fix: >-
    audit_events now returns write_violations: message-mode profiles
    count every write attempt (unchanged — they hold no write
    tools); file-mode profiles count only writes whose resolved path
    differs from the envelope artifact.path. _run_attempt sums
    denials + write_violations. run.json records write_violations for
    audit transparency.
  files:
    - scripts/devnest/opencode_profiles.py
  tests: "tests/devnest/test_opencode_profiles.py + test_lane_gate.py — 142 passed"

profile_work:
  artifact_write_profile: >-
    Already committed (eacd3c058a): file-mode artifact under declared
