eval_basis:
  corpus: "scripts/bench/card-judgment/corpus.jsonl — 98 frozen card
    decision moments, judged shadow-mode; T3 bars: acc>=0.85,
    deference>=0.90, corr_precision>=0.80, >=50 cases, 3 consecutive runs"
  results_2026_11_13:
    qwen2.5:32b: "0.857 acc / 0.878 def / 0.909 prec / 1.0 rec / 0 parse-fails
      — AT the accuracy bar, just under deference; best local model"
    llama3.2:3b: "0.827 / 0.908 / 0.968 / 1.0 / 0 — beats old 0.739 baseline;
      actually the better DEFERRED (only model over the 0.90 deference bar)"
    qwen2.5vl:7b: "0.745 / 0.867 / 0.737 / 0.933 / 0"
    qwen3:8b: "0.674 / 0.806 / 0.862 / 0.833 / 16 parse-fails — parse-fragile,
      excluded from judgment-shaped routing"
  honest_read: >-
    qwen2.5:32b wins action accuracy but UNDER-DEFERS vs both the bar and
    llama3.2:3b. For defer-critical judgment the existing llama3.2:3b leg
    is the better-behaved local fallback; kk-mac's value is quality/capacity
    at $0 on bounded classes where a deterministic verifier or non-decision
    output bounds the blast radius — not judgment superiority.

two_integration_surfaces:
  executor_lane:
    what: "action.executor=kk_mac_local — dispatch cards with task_class
      summary|operator_brief|structured_extract|safe_route. Already live
      (OPS-0079 probe + auto-route dr.kk_mac_route). Admission-gated:
      fresh Ada Nest heartbeat, ollama_ok, disk>=20G, load/temp (60C cap)."
    change_shipped: >-
      DEFAULT_MODEL repinned qwen3:8b -> qwen2.5:32b in
      scripts/devnest/kk_mac_executor.py (+ matching kk_mac_llm.py
      defaults) — the eval says the old default is parse-fragile.
      Lane catalog expected_tokens note updated.
  gateway_legs:
    what: "ollama-qwen32b-kkmac deployment (LiteLLM ->
      idc03:11445 tunnel -> kk-mac:11434) inserted into job_class chains
      in ssot.llm-gateway.yml / stacks/idc03/litellm/config.yaml.
      PROPOSED ONLY — no config edits until the rerun gate below passes."

candidate_job_classes:
  # Position matters: legs tried in order. kk-mac first = max savings but
  # every dead-Mac call pays a failed-leg hop (conn-refused on the tunnel
  # is fast; a busy-but-awake Mac is the slow case — no admission gate at
  # this layer).
  summary:
    verdict: "ADOPT — leg 1: [qwen32b-kkmac, lite@paid, lite@free, lite@or, colab, llama3.2]"
    why: "batch posture/cms/session summaries; latency-tolerant; the
      executor contract already bounds this class on the card plane"
  classify:
    verdict: "ADOPT — leg 1: [qwen32b-kkmac, lite@paid, lite@free, lite@or, colab, llama3.2]"
    why: "cheap high-volume doc-ingest classify; same profile as summary"
  bench:
    verdict: "ADOPT — leg 1; natural canary: spend-isolated key, low blast radius"
  chat-local:
    verdict: "ADOPT — leg 2: [qwen7b-tonydell, qwen32b-kkmac, llama3.2-ollama, gemma3-colab]"
    why: "free-lane adopters (news-digest EN, wp-comment-sync, kanban-brief)
      already carry deterministic/gemini fallbacks and bounded payloads;
      32b upgrades prose quality over 7b when the Mac is awake. tonydell
      stays leg 1 (always-on); promote kkmac to leg 1 only after
      availability data justifies"
  tool-call:
    verdict: "DEFER — leg 3 only after gate: [lite@paid, lite@free, qwen32b-kkmac, lite@or, colab, llama3.2]"
    why: "ada decision calls are defer-critical; 0.878 deference +
      under-defers vs llama3.2:3b. Insert at leg 3 (resilience position —
      fires only when both gemini legs fail) only after the 3-run gate;
      promote past paid legs never, until deference clears 0.90"
  not_candidates:
    voice-aux: "voice-path latency + member-device jitter — never"
    chat: "ada-facing parity with 3.5-flash; revisit post-gate only"
    vision/image: "modality — wrong models"
    embedding: "768d gemini space only; a local leg poisons mddb retrieval"

savings_evidence_path:
  movable_spend: "~$22/window steady REST side-calls (gemini-3.5-flash-lite
    $11.5 + flash + image of the $69.64 Oct-11..Nov-07 ledger) — the
    summary+classify share is what leg-1 kk-mac placement buys down"
  lane_report: >-
    scripts/board/lane-savings.py — PATCHED with this proposal:
    card_lane() now honors action.executor (kk_mac_local/jules/nlm_batch/
    opencode) before the type fallback; kk_mac_local, jules, nlm_batch
    added to CHEAP_LANES. Previously every executor-pinned kk_mac dispatch
    reported as lane 'devin' and savings were invisible.
    Verify: python3 scripts/board/lane-savings.py --month 2026-11
  token_evidence_gap: >-
    lane-savings counts kk_mac_local runs but tokens stay 'unevidenced'
    unless artifacts carry the bench-edu-manage scores.<lane>.loop shape
    or action.result records usage — kk_mac_result.json usage lives in
    the taskdir, not scanned. Options: (a) finish_kk_mac_lane copies
    usage eval_count/eval_duration into action.result, or (b) a
    monthly rollup artifact under docs/reports/ in the scanned shape.
    Counts-first is honest; dollars need one of these.
  gateway_side: >-
    LiteLLM ledger already logs ollama-qwen32b-kkmac calls at $0 —
    scripts/litellm/daily-ledger.py --publish + admin UI model-spend
    table show the paid-leg delta. Expected signal: lite@paid spend
    drops by the summary+classify share; qwen32b-kkmac request count
    rises when the Mac is awake.
  verify_loop: "monthly lane-savings report + LiteLLM ledger delta +
    per-run kk_mac_result.json usage in taskdirs"

risks:
  - "member-device availability: kk-mac sleeps/powers off (tailnet
    offline 19h at eval time). Dead tunnel = conn-refused on
    idc03:11445 -> fast fallthrough, but ONLY batch/latency-tolerant
    classes get leg-1 placement for this reason"
  - "no admission gate at the LiteLLM layer: a hot/busy Mac (60C cap,
    KK's own load) still receives gateway calls -> slow responses ->
    timeouts -> cooldown churn. Mitigation: per-deployment timeout +
    LiteLLM failure cooldown; follow-up card = admission shim (503 on
    stale heartbeat/temp>60/load high) in front of :11445"
  - "qwen3:8b parse-fragility (16 parse-fails): pin qwen2.5:32b for all
    judgment/structured work; qwen38b stays deployed but out of every
    proposed chain; executor default repinned"
  - "deference gap 0.878<0.90: keep kkmac out of defer-critical
    positions; llama3.2:3b remains the better local defer-fallback"
  - "capacity: M4 Max 36GB, qwen2.5:32b ~20GB — fine resident, but keep
    NUM_PARALLEL low; batch classes only until throughput is measured"
  - "config drift: live config.yaml already diverges from repo
    (documented in ssot.llm-gateway.yml live_audit) — chain edits must
    land in repo config + restart, never live-only"

rerun_cadence:
  rule: "T3-style: 3 consecutive qualifying runs on the CURRENT corpus
    before gateway promotion; a corpus rebuild (v4/v5) or model bump
    resets the streak"
  cadence: >-
    kkmac_eval.sh qwen2.5:32b at each kk-mac online window, >=24h
    apart, target 3 runs inside ~2 weeks. Queue via
    jevnest-kk-mac-capacity-loop (it already gates on heartbeat) or run
    manually on any tailnet host. Post each run-kkmac-qwen2532b.{md,json}
    to card kk-mac-card-judgment-eval.
  current_state: "1 run in hand: acc+precision+recall pass, deference
    0.878 fails the T3 bar. Consequence: adopt legs 1/2 for the
    non-defer-critical classes NOW (summary/classify/bench/chat-local);
    tool-call leg-3 waits for 3 clean runs AND deference >=0.90 — run a
    defer-biased prompt variant next pass to see if the gap is prompt-
    or model-level"
  also_rerun_on: "ollama upgrade, qwen2.5:32b repull, corpus rebuild,
    or any prompt/template change in score.py"

