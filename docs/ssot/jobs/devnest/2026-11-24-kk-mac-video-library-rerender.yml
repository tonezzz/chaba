lessons_captured:
  - "/home/tony/ada-nest-videos moved to tony-dell:~/CascadeProjects/tony-chaba-dell/archive/ — always re-verify inventory roots before trusting card text"
  - "Colab LTX .pt embeds are torch zip+pickle 4-key tensors — injectable into ltx-mlx by monkeypatching pipe.t5/pipe.tokenizer (proven preview-mac pattern); T5 weights never needed"
  - "Drive keyframes under renders/keyframes/ are extracted FROM renders (PSNR=inf), not ViMax inputs — don't assume they're i2v conditions"
  - "nest-worker prep exit!=0 marks pack FAILED — long gate waits belong in a wrapper outside the worker, prep keeps only fast re-checks"
  - "kk-mac has no rclone on PATH (it's ~/.local/bin/rclone) and no tmux on PATH (/opt/homebrew/bin/tmux) — use absolute paths in remote scripts"
