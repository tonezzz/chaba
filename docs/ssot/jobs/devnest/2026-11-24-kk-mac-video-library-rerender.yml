  metrics: [duration, frames, resolution, fps, codec, SSIM/PSNR vs old, black/freeze events, per-shot seconds vs CUDA ~5min]
  review: contact strips + batch-result.json land in pack out/ for KK/Tony review; prompt adherence judged on strips (embeds identical => adherence delta is lane/model only)

queue_state:
