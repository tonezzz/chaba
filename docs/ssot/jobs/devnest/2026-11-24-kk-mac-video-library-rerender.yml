control_pack:
  name: kk-mac-mlx-colab-scene0-control-20261124
  staged_at: gdrive:ada-nest/kk-mac-video-pilot/packs/kk-mac-mlx-colab-scene0-control-20261124/
  repo_mirror: scripts/devnest/video-packs/kk-mac-mlx-colab-scene0-control-20261124/
  contents: ["pack.yml", "run_scene0.py", "inputs/shot0.pt", "inputs/shot1.pt", "inputs/shot2.pt", "inputs/shot3.pt", "inputs/provenance.json"]
  render: >-
    t2v, same embeds as CUDA renders (bit-identical conditioning),
    640x384 / 49f / 24fps / steps=8 / seed=42, LTX-Video 0.9.8-distilled
    2B via baisampayans/ltx-mlx on ~/kk-video/ltx-mlx/models/LTX,
    .venv-mlx python, T5 weights skipped (lp.load_t5_encoder patched).
  gates: >-
    pack.yml prep + kk-mac:~/kk-video/run-mlx-control-gated.sh (tmux
    mlx-control): owner-use HID idle>=600s, AC, memfree>=40%, load1<8,
    no llama-server >10GB RSS, no creative/video apps, disk>=5GB,
    inputs+model+venv checks; heartbeat -> queue/heartbeat every ~10min;
    12h max wait; then nest-worker --once (serial => concurrency=1).
  state_at_write: "queued on Drive; launcher waiting — KK-Mac owner-active (Chrome audio, HID idle ~0s) at 17:39 ICT"
  preserve: "old renders/ MP4s + tony-dell archive untouched; pack writes only its own out/"

comparison_plan:
