opencode_v232_breakage:
  what: >-
    opencode v2.3.2 on tony-dell: (1) `run --dir <path>` removed —
    directory is now a positional arg. (2) `{env:VAR}` substitution in
    custom-provider options.apiKey silently resolves empty -> 401 "No
    api key passed in" even with the var exported (upstream issue
    anomalyco/opencode#19946 pattern). `{file:path}` substitution works.
  fix: >-
    tony-dell: wrote ~/.config/secrets/litellm-key.txt (chmod 600) and
    repointed provider.litellm.options.apiKey to
    "{file:/home/tony/.config/secrets/litellm-key.txt}". Probe:
    litellm/gemini-3.5-flash-lite -> 'ok', $0.002.
  blast_radius: >-
    Any host whose opencode was upgraded to >=v2.3.x AND uses
    {env:LITELLM_KEY} in opencode.json is equally broken — check
    ~/.config/opencode/opencode.json per host if a litellm lane 401s.

