findings:
  - "The 60-brief set lifted accuracy from 0.80 to 0.9167 with zero false approvals at the default 0.5 threshold; 25/30 READY approved and 30/30 NOT_READY rejected."
  - "Tony reviewed the two borderline labels: nest-lane-metrics changed NOT_READY -> READY because it explicitly asks for dispatch, and devnest-news-promote-wp4010 changed READY -> NOT_READY because the action is gated on Ada/Tony approval. Rule refined: 'nothing needed from you' alone does not mean NOT_READY when dispatch is explicitly requested; idc02-runner-smoke stays NOT_READY because it says the worker drains itself."
  - "A zero-false-approval threshold calibrated on 40 train briefs (p_yes >= 0.5162) held up on 20 unseen briefs: 10/10 NOT_READY rejected, 6/10 READY approved, zero false approvals. Recall dropped versus the 0.5 threshold, so the trade-off is explicit."
  - "Approve gate is promising but not proven: zero false approvals on only 10 held-out negatives still admits roughly a 26% upper bound at 95% confidence, and the calibration set contains near-duplicate digest templates despite a cap of 5."
  - "High-confidence reject signal replicates: 13/13 rejects at confidence >= 0.90 were genuinely NOT_READY, covering 13/30 of that class."
  - "Cost stays zero output tokens: 60 decisions on 11,627 input characters used 8,826 input tokens and 0 output tokens."
  - "The 110-brief disjoint holdout tightened the false-approval bound but did not clear the gate for hands-off use: at the previously calibrated 0.5162 threshold the Decisions API made 1 false approval in 55 negatives (Wilson 95% 0.32%-9.61%); the full-model stand-in made 0 (upper bound 6.53%). Overlapping bounds mean the arms are statistically compatible on precision."
  - "The full-model stand-in was better calibrated and more accurate on this set (88.18% vs 82.73%, Brier 0.087 vs 0.1248, 42/55 vs 37/55 READY approved) and was right on 9 of 12 disagreements, but cost 252s and 2,723 output tokens plus 10,940 thought tokens versus 0.77s and zero output tokens for Decisions."
  - "Thresholds tuned on this holdout are optimistic: zero-false-approval moved to 0.536574 for the Decisions API (37/55 recall) and 0.25 for the full model (44/55 recall). Treat both as candidates requiring an independent holdout before adoption, not as deployed gates."
  - "The high-confidence reject shortcut regressed: 16 cases at confidence >= 0.90 included one genuinely READY brief (cline-kanban-offline-image-build, p_yes 0.0788), so it is no longer an all-correct auto-reject signal."
  - "Production baseline: ada_preflight has no model judge and hardcodes typed_dispatch_available=False in four places, so ready_for_dispatch is always False today and the native menu never offers Approve dispatch. This is a deliberate safety boundary, not a capability gap."
  - "The rule preconditions are not semantic readiness classifiers: no_open_requests alone would approve 52/55 negatives (precision 0.4526) and safe_scope 51/55 negatives (precision 0.2917); both together give precision 0.25 and recall 0.29. Risk-term filtering denies 34/55 genuinely READY briefs that merely mention deploy/service/wp-style terms."
  - "Model judgments would add 46 approvals beyond the wired gate, 45 of them truly READY, but every one is blocked by workflow state (non-backlog column, no typed action envelope). A model gate can only sit after preflight satisfies those preconditions; it must never bypass them."
  - "The independent 130-brief set reproduced a high-precision Decisions gate: at the default 0.5 threshold, 48/60 READY approved and only 2/70 negatives approved (precision 0.96, Brier 0.0812), with zero output tokens and 0.96s latency."
  - "The holdout-tuned 0.536574 threshold did not clear the raw-label zero-FP bar (1 false approval), but the one remaining approval is a deterministic label misfire: the brief had a spec and was dispatched. With those two labels corrected all three thresholds have zero false approvals, so the threshold generalizes on genuine negatives while recall drops to 0.71."
  - "The confidence >= 0.90 auto-reject shortcut is dead: 67 cases crossed it on the validation set and four genuinely READY briefs were high-confidence-ready (p_yes 0.92-0.93). It fails under raw and corrected labels and must not be adopted."
  - "The full-model arm could not be re-run on the validation set: gemini-3.8-flash remained 503 across three attempts and every alternate free model was 503/429/404. The holdout's 0.25 full-model threshold stays unvalidated; no conclusion about parity on the new negatives."
  - "Rubric probe did not dethrone binary noul. On the 130 set the choice P(ready) at fixed 0.5 looked better (53/62 READY, 0 FP, Brier 0.0525 vs noul 0.0767), but on the independent 110 set choice and noul were effectively tied (one FP each, Brier 0.1245 vs 0.1248). Do not adopt the choice arm on this evidence."
  - "Score questions are useful as a triage rubric but not as an approve signal: probability-weighted expected level puts 'partial' above a 0.5 threshold (63 false approvals on 130), while P(level 3) is conservative (recall 0.56). Composing choice and score never beat choice alone."
  - "The broad confidence >= 0.90 auto-reject shortcut stays rejected. A directional version (confident NO only) is clean on 130 but still falsely rejects one genuinely READY brief on 110, so neither version is safe for automation."

