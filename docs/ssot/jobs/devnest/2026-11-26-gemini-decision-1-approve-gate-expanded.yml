  - "Compare the gate against the current full-model dispatch judgment path on the same briefs."
  - "Do not replace human dispatch approval on this evidence; use as a high-precision pre-filter that escalates low/medium-confidence cases."
  - "Do not retry any paid key until the cap situation is explicitly resolved by Tony."
