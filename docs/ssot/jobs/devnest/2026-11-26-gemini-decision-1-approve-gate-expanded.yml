findings:
  - "The 60-brief set lifted accuracy from 0.80 to 0.9167 with zero false approvals at the default 0.5 threshold; 25/30 READY approved and 30/30 NOT_READY rejected."
  - "Tony reviewed the two borderline labels: nest-lane-metrics changed NOT_READY -> READY because it explicitly asks for dispatch, and devnest-news-promote-wp4010 changed READY -> NOT_READY because the action is gated on Ada/Tony approval. Rule refined: 'nothing needed from you' alone does not mean NOT_READY when dispatch is explicitly requested; idc02-runner-smoke stays NOT_READY because it says the worker drains itself."
  - "A zero-false-approval threshold calibrated on 40 train briefs (p_yes >= 0.5162) held up on 20 unseen briefs: 10/10 NOT_READY rejected, 6/10 READY approved, zero false approvals. Recall dropped versus the 0.5 threshold, so the trade-off is explicit."
  - "Approve gate is promising but not proven: zero false approvals on only 10 held-out negatives still admits roughly a 26% upper bound at 95% confidence, and the calibration set contains near-duplicate digest templates despite a cap of 5."
  - "High-confidence reject signal replicates: 13/13 rejects at confidence >= 0.90 were genuinely NOT_READY, covering 13/30 of that class."
  - "Cost stays zero output tokens: 60 decisions on 11,627 input characters used 8,826 input tokens and 0 output tokens."
  - "The 110-brief disjoint holdout tightened the false-approval bound but did not clear the gate for hands-off use: at the previously calibrated 0.5162 threshold the Decisions API made 1 false approval in 55 negatives (Wilson 95% 0.32%-9.61%); the full-model stand-in made 0 (upper bound 6.53%). Overlapping bounds mean the arms are statistically compatible on precision."
  - "The full-model stand-in was better calibrated and more accurate on this set (88.18% vs 82.73%, Brier 0.087 vs 0.1248, 42/55 vs 37/55 READY approved) and was right on 9 of 12 disagreements, but cost 252s and 2,723 output tokens plus 10,940 thought tokens versus 0.77s and zero output tokens for Decisions."
  - "Thresholds tuned on this holdout are optimistic: zero-false-approval moved to 0.536574 for the Decisions API (37/55 recall) and 0.25 for the full model (44/55 recall). Treat both as candidates requiring an independent holdout before adoption, not as deployed gates."
  - "The high-confidence reject shortcut regressed: 16 cases at confidence >= 0.90 included one genuinely READY brief (cline-kanban-offline-image-build, p_yes 0.0788), so it is no longer an all-correct auto-reject signal."

