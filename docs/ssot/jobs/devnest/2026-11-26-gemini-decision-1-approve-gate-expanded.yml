title: Expand decision-1 gate evaluation to an approve-gate threshold
subtitle: >
  One batched Decisions API call over 60 real kanban briefs, with Tony's label
  review and a held-out threshold calibration. High precision, still not a
  hands-off approve gate.
icon: education
version: 6  # v6: Decisions score/choice rubric probe on both holdouts

card: gemini-decision-1-gate-eval-2026-11-26  # ADA-1445
date: 2026-11-26
source_session: "2026-11-26 exploration track after the Managed Agents verification"

