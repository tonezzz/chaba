report:
  summary: >-
    VCAST-style enrollment gateway is live and verified on idc02.
    https://idc02.taila0626a.ts.net:8448/enroll serves the enroll page behind
    the tailnet edge (TLS + tailnet identity). Single-use JCK- codes are
    sha256-stored, TTL'd (900s default), burned on use; sessions are opaque
    Secure/HttpOnly/SameSite=Lax cookies (12h TTL) checked server-side.
    Re-mint revokes the prior session. The gateway session-gates every other
    path to the isolated jack-opencode container (private podnet, no
    published ports, basic-auth upstream, workspace+disposable-home mounts
    only). SSE streams through the edge; WS upgrade tunneling is implemented
    and unit-tested. 17/17 tests green. One real defect found+fixed in
    smoke: opencode /config echoed the LiteLLM apiKey — key moved to
    auth.json.
  evidence:
    - enroll flow: POST /enroll -> 303 / + cookie flags verified live
    - 'replay: {"error":"code_used"}; forged code -> 401 invalid_code'
    - re-register: old cookie -> 401 after new mint
    - unauth: /global/health 401 (no cookie + forged); /admin 401
    - boundary: >-
        /file/content?path=/etc/passwd denied; /workspace/* served;
        direct :4096 unreachable from host
    - UI: OpenCode SPA 200 via tailnet URL; SSE server.connected event live
    - model: podman exec opencode run -> "PONG" through LiteLLM (auth.json)
    - audit: >-
        mint_reregister/enroll_ok/enroll_code_used/ws/boot events in
        state/audit.jsonl with client IP via X-Forwarded-For
  how_to_verify: |
    jack-enroll mint                 # prints code + redeem URL
    open https://idc02.taila0626a.ts.net:8448/enroll  -> paste code -> IDE
    jack-enroll status|audit|revoke|reset
    node --test stacks/idc02/jack-ide/tests/
  rollback: |
    sudo tailscale serve --https=8448 off
    systemctl --user stop jack-enroll jack-opencode jack-ide-network
    rm ~/.config/containers/systemd/jack-*; systemctl --user daemon-reload
    (state dirs + secrets files can stay or be removed)
