title: Evaluate gemini-decision-1 as a dispatch-readiness gate
subtitle: >
  One batched Decisions API call over 10 real kanban briefs, then a 60-brief
  expansion with held-out threshold calibration. High-confidence reject gate;
  approve gate remains a high-precision pre-filter, not hands-off.
icon: education
version: 3  # v3: 60-brief expansion recorded in the companion receipt

card: gemini-decision-1-gate-eval-2026-11-26  # ADA-1445
date: 2026-11-26
source_session: "2026-11-26 session history — exploration track chosen after the gemini-api-dev skill trial"

delivered:
  method:
    source: "10 briefs from docs/ssot/kanban/cards/*.yml on idc03 (no archive, brief 60-300 chars)"
    label_rule: >
      NOT_READY if the brief says no action needed / nothing needed / leave it
      alone / details in the note / test fixture / blocked on / awaiting;
      READY if it contains a concrete action verb and has a non-empty spec.
    call: "POST https://generativelanguage.googleapis.com/v1beta/decisions — one shared input, 10 noul questions"
    key_used: GEMINI_API_KEY_MICHAEL  # free-tier key; value never displayed or copied
    artifacts_on_idc03:
      - /tmp/opencode/decision-gate-payload.json
      - /tmp/opencode/decision-gate-labels.json
      - /tmp/opencode/decision-gate-response-GEMINI_API_KEY_MICHAEL.json
      - /tmp/opencode/decision-gate-graded.json
  results:
    input_tokens: 1523
    output_tokens: 0
    agreement: "8/10 (0.80)"
    brier: 0.1098
    mean_confidence_correct: 0.915
    mean_confidence_wrong: 0.7069
    verdict: "strong high-confidence reject gate; approve gate still needs a larger labeled set and threshold calibration"
  rows:
    - {id: ada-ha-dashboard-live-view-drift, label: ready, p_yes: 0.3831, confidence: 0.6169, correct: false}
    - {id: ada-ocb-ansible-audit-verify, label: ready, p_yes: 0.8799, confidence: 0.8799, correct: true}
    - {id: ada-ocb-manual-queue-semantics, label: ready, p_yes: 0.8591, confidence: 0.8591, correct: true}
    - {id: ada-ocb-openchamber-e2e-smoke, label: ready, p_yes: 0.8089, confidence: 0.8089, correct: true}
    - {id: ada-ocb-skills-wiki-education-2026-11-24, label: ready, p_yes: 0.2030, confidence: 0.7970, correct: false}
    - {id: ada-ocb-ansible-upgrade, label: not_ready, p_yes: 0.0474, confidence: 0.9526, correct: true}
    - {id: cms-auto-ada-digest, label: not_ready, p_yes: 0.0732, confidence: 0.9268, correct: true}
    - {id: cms-auto-architecture-digest, label: not_ready, p_yes: 0.0342, confidence: 0.9658, correct: true}
    - {id: cms-auto-bench-digest, label: not_ready, p_yes: 0.0349, confidence: 0.9651, correct: true}
    - {id: cms-auto-cctv-roster, label: not_ready, p_yes: 0.0382, confidence: 0.9618, correct: true}

findings:
  - "All 5 deferring/blocked briefs were rejected with 0.9268-0.9658 confidence — a very clean reject signal."
  - "3 of 5 actionable briefs were approved with 0.8089-0.8799 confidence; 2 were rejected with 0.6169/0.7970 confidence."
  - "Both disputed cards were reviewed by Tony on 2026-11-26 and the READY labels were confirmed: both had a concrete action and a non-empty spec, and both were actually executed (dashboard card done and archived 19:40; skills wiki lesson verified at 8,092 chars). They are genuine model false rejects, not label noise, so 0.80 is the real accuracy on this set, not a lower bound."
  - "One batched call of 1,981 input characters produced 10 calibrated answers for 1,523 input tokens and 0 output tokens — supports the zero-output-token cost claim."
  - "The first attempt with GEMINI_API_KEY_PAID failed with HTTP 429 'project has exceeded its monthly spending cap'. No billing or cap change was attempted. TONY/KK share that project; MICHAEL's free-tier key worked."

label_review:
  date: 2026-11-26
  reviewer: Tony
  method: >
    Tony reviewed the two disputed briefs on the decision-1 review page after
    both cards were checked against the board and the wiki lesson endpoint.
  outcome:
    - "ada-ha-dashboard-live-view-drift: READY confirmed. Card done and archived by Tony 2026-11-26 19:40; the verify/investigate step was dispatchable work with a spec."
    - "ada-ocb-skills-wiki-education-2026-11-24: READY confirmed. The authorization was the card gate itself, the publish steps were concrete, and the lesson exists (8,092 chars)."
  recomputed:
    labels_changed: 0
    agreement: "8/10 (0.80) - unchanged, now a true accuracy figure"
    confusion_at_p_yes_ge_0.5: {tp: 3, fn: 2, tn: 5, fp: 0}
    approve_precision: 1.0
    approve_recall: 0.6
    reject_precision: 0.714
    reject_recall: 1.0
    high_confidence_reject_gate: >
      At model confidence >= 0.90 all 5 rejects were correct and none of the
      5 READY cards was auto-rejected; the two wrong rejects were at 0.6169
      and 0.7970 confidence, so a 0.90 threshold cleanly separates them on
      this 10-card set.
    high_confidence_reject_coverage: "5/5 not-ready briefs"
    approve_gate_caveat: >
      Auto-approving all 5 READY cards would need a p_yes threshold between
      0.0732 (highest not-ready) and 0.2030 (lowest ready). That boundary is
      fitted on the same 10 cards and the two lowest READY scores were exactly
      the ones Tony had to adjudicate, so it is not evidence of approve-gate
      readiness. The model's wrong rejects were confident (0.62/0.80), so
      confidence alone does not rescue them.
  verdict_after_review: >
    Use only as a high-confidence reject pre-filter that escalates low/medium
    confidence rejects to a human. Do not auto-approve dispatch on this
    evidence; validate a threshold on 30+ unambiguous labeled briefs first.

expanded_followup:
  receipt: docs/ssot/jobs/devnest/2026-11-26-gemini-decision-1-approve-gate-expanded.yml
  summary: >
    A second batched call over 60 balanced briefs (Tony reviewed two more
    borderline labels) gave 55/60 agreement at the default threshold, zero
    false approvals, and a train-calibrated p_yes >= 0.5162 threshold that held
    zero false approvals on 20 held-out briefs with 6/10 READY approved.
  consequence: >
    The original 'not yet an approve gate' caveat is narrowed: it is now viable
    as a high-precision approve pre-filter, but 10 held-out negatives still
    leave a ~26% upper bound on the false-approval rate, so human dispatch
    approval is not replaced.

