  dispatch_repos.KK_MAC_TASK_CLASSES + KK_MAC_ROUTE_KW,
  runner-agent.KK_MAC_TASK_CLASSES, kk_mac_capacity_producer.TASK_CLASSES,
  kk_mac_plan_validator.ALLOWED, devnest_capacity_broker.KK_CLASSES,
  ssot.devnest-lanes.yml task_classes, ssot.procedures.yml, both kb
  procedure docs) ONLY after a passing live re-eval on kk-mac.
verify: |
  python3 scripts/bench/kkmac-classes/build_corpus.py
  python3 scripts/bench/kkmac-classes/score.py --entity mock-oracle
  # 51/51 pass
  # live (when kk-mac is awake):
  scripts/bench/kkmac-classes/kkmac_eval.sh qwen3:8b qwen2.5vl:7b
lessons:
  - "expect.facts is a substring check on the raw response — facts must
    be verbatim evidence tokens the model echoes, not gold phrasing;
    compute the echo intersection across model responses before picking"
  - "member-device lanes (kk-mac) go offline without warning — bench
    gates fail closed; schedule re-evals for awake windows"
  - "same-tag ollama on another tailnet host is a cheap same-weights
    sanity check when the member device is asleep (not readmission
    evidence, but predicts pass/fail direction)"
