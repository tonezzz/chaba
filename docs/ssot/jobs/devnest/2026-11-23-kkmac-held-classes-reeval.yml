status: blocked-on-kk-mac-awake
parent_eval: docs/ssot/jobs/devnest/2026-11-19-kkmac-class-eval.yml
what: >
  Follow-up to kk-mac-admitted-classes-narrow. Two held task classes
  needed work before readmission: (1) operator_brief — every 2026-11-19
  miss was an expect.facts substring miss because facts were written for
  gold phrasing, not tokens the model literally echoes; (2) safe_route —
  genuinely wrong route picks (over-defer / over-act / over-observe per
  model), needing a re-bench on a memory-floor-safe model or the
  documented alternatives (route whitelist / class rethink).
corpus_fix: >
  scripts/bench/kkmac-classes/build_corpus.py — operator_brief
  expect.facts rewritten to literal-echo tokens. Method: for each of the
  16 cases, computed the intersection of evidence tokens actually echoed
  (case-insensitive substring) by all three 2026-11-19 model responses,
  then picked the most discriminating 1-2. 10 cases changed; 3 golds
  updated where the new fact required it (golds also became more faithful
  to the evidence). Cases kept unchanged on purpose: ob-stale-heartbeat
  and ob-ratelimit retain discriminating facts (22/fallback, 429/bge-m3)
  because the models that missed them produced genuinely thin briefs —
  weakening those facts would pass bad output, which is the verifier's
  job to catch. safe_route facts are the route names themselves (the
  semantic check), untouched.
  Re-scoring the RECORDED 2026-11-19 responses against the fixed corpus
  (prediction, not evidence — live re-bench still required):
  qwen3:8b operator_brief 9/16 -> 16/16; llama3.2:3b 5/16 -> 14/16
  (2 honest fails on thin briefs); qwen2.5:32b 7/16 -> 15/16.
producer_guidance: >
  docs/kb/jevnest-kk-mac-capacity-procedure.md — "What to send" now
  carries the expect.facts rule: declare only tokens the model will
  literally echo (verbatim identifiers from the evidence), 1-3 per
  package; required_keys/enums carry the structural load.
reeval: >
  BLOCKED — kk-mac (member device) went offline ~20:44 ICT 2026-11-23
  (last heartbeat 13:44Z, >4h stale at dispatch end; tailscale
  last-seen, ssh connect timeout). kkmac_eval.sh fails closed on the
  ssh/ollama gate by design — no live re-bench was possible and NO
  class was readmitted. Same-model stand-in sanity on tony-omen ollama
  (same tags/weights, production call shape via ssh->loopback
  /api/generate think=false temp=0 — de-risk evidence ONLY, not
  readmission evidence): run-omen-qwen38b.{md,json} scored the FIXED
  corpus — operator_brief 0.9375 (15/16, READY; only ob-ratelimit
  missed on fact:429 paraphrase), safe_route 0.5333 (same failure
  profile as kk-mac: over-defer + act-on-decide), structured_extract
  0.9333, summary control 0.60. A same-tag llama3.2:3b safe_route probe
  was attempted on omen but abandoned — another tenant's qwen2.5:7b
  load starved the GPU (0% util, calls timing out); not needed for the
  decision.
  NEXT SESSION (kk-mac awake): run
  scripts/bench/kkmac-classes/kkmac_eval.sh qwen3:8b qwen2.5vl:7b —
  qwen3:8b is the readmission model for operator_brief (memory-safe
  lane default); qwen2.5vl:7b (6G, in-floor, never tested) is the
