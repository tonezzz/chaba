  fine for banking one class quickly. safe_route candidates inside
  the memory floor
  (docs/reports/kk-mac-llm-bench-2026-11-20.md — 20B+ footprints breach
  it): qwen3:8b (5.2G, failed 0.53), llama3.2:3b (2G, failed 0.60
