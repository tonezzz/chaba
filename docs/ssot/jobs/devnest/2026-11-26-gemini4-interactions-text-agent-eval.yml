summary: >
  Gemini 4 could not be exercised: free-tier keys have a zero-token rate limit
  for every Gemini 4 model, and the shared paid project is monthly-cap blocked.
  The Interactions API itself was evaluated with gemini-3.5-flash-lite on six
  synthetic multi-turn tool-and-recall tasks. Stateful and stateless both scored
  6/6 tool calls and 6/6 cross-turn recall; stateful used ~2% fewer input tokens
  and was ~2.5x slower. The legacy generateContent arm hit free-tier quota after
  two tasks and lost both recall checks.

access_blocker:
  probed_via: "REST POST /v1beta/interactions, one minimal text turn per model/key"
  key_names_only: true
  key_values_logged: false
  results:
    - "GEMINI_API_KEY_MICHAEL / GEMINI_API_KEY_FREE: HTTP 429, 'limit: 0 input tokens per minute on Free Tier' for gemini-4-neon, gemini-4-carbon, gemini-4-argon"
    - "gemini-4-hydrogen: HTTP 503 'currently experiencing high demand' on free-tier keys"
    - "GEMINI_API_KEY_PAID / GEMINI_API_KEY_TONY / GEMINI_API_KEY_KK: HTTP 429 'project has exceeded its monthly spending cap'"
    - "gemini-3.8-flash: HTTP 503 high demand on free tier; gemini-3.6-flash: HTTP 429 20 requests/day already used"
    - "gemini-3.5-flash-lite and gemini-3.1-flash-lite: HTTP 200 on Interactions API"
  no_action_taken: "No key, billing, cap, gateway, or model-pin change; no retry of the capped paid project."

method:
  key_used: GEMINI_API_KEY_MICHAEL
  model: gemini-3.5-flash-lite
  harness: scripts/voice-bench/g4-interactions-eval.py (google-genai 3.6.1)
  tasks: "6 synthetic 4-turn tasks: remember a fact, schedule a meeting via one function tool, return the tool result, then recall both the fact and the meeting detail"
  arms:
    - interactions_stateful: "previous_interaction_id chains; tools + system_instruction re-sent every turn"
    - interactions_stateless: "store=False; full step history replayed in input, including thought/function_call steps"
    - legacy_generatecontent: "client.models.generate_content with client-held contents and preserved thought_signature"
  grading:
    tool: "exact tool name, attendees, date, time; topic accepted with minor phrasing normalization (the/a prefix and parentheticals removed)"
    recall: "all expected fact/date/time groups present in the final answer (date variants accepted)"
  result_json: scripts/voice-bench/results/gemini4-interactions-eval-20261126.json

