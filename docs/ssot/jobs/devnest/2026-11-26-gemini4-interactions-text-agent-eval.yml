findings:
  - "Interactions API is usable on the free tier with gemini-3.5-flash-lite, and both stateful and stateless modes completed the tool-plus-recall loop perfectly on this small set."
  - "Server-side state gave only ~1.7% fewer total input tokens (5868 vs 5968) and ~7% fewer turn-4 input tokens on average. On short sessions the caching benefit is not meaningful."
  - "Stateful calls were much slower here (27.9s vs 11.3s mean per 4-call task). Treat as free-tier/environment noise until repeated on a paid key; it is not evidence that state is faster."
  - "Legacy generateContent lost the remembered fact on both completed tasks (0/2 recall) while Interactions scored 6/6. Suggestive but underpowered: 4 of 6 legacy tasks failed on free-tier quota."
  - "Interaction-scoped parameters (tools, system_instruction, generation_config) must be re-sent on every turn, including turns using previous_interaction_id."
  - "Stateless mode requires replaying thought and function_call steps verbatim; legacy generateContent requires preserving thought_signature on function_call parts or the next request returns HTTP 400."
  - "Strict topic exact-match produced 4/6 on both Interactions arms; all six were correct once minor phrasing differences ('migration' vs 'the migration', 'Rollout (Comet)' vs 'rollout') were normalized. The rubric, not the model, was the initial problem."

verdict: >
  Interactions API is a viable stateful text-agent primitive and is worth a
  paid-tier trial with a Gemini 4 model, but this run cannot validate the
  Gemini 4 half of the track. Do not change the production agent path on this
  evidence.

