findings:
  - "Interactions API works end-to-end on 3.x: function_call/function_result tool loop, requires_action status, previous_interaction_id chaining, and full-history stateless replay all verified."
  - "Stateful chaining is strictly cleaner for agents: send only the new user_input/function_result steps; server holds history. No accuracy cost observed (both modes ~1.0 adjusted)."
  - "Stateless full-history replay MUST preserve thought-step signatures verbatim — stripped function_call history returns 400 'Function call is missing a thought_signature in functionCall parts' (Gemini 3 rule). Dump response steps with model_dump(by_alias=True, exclude_none=True)."
  - "SDK gotcha: client.interactions.create defaults to api_version v1 — preview models 404 unless api_version='v1beta' is passed."
  - "usage.total_input_tokens is context-size, not request-size: it grows identically in stateful and stateless modes, so it cannot be used alone to prove stateful token savings — compare request step counts instead."
  - "gemini-3.5-flash-lite generateContent free quota is small: ~15-20 calls then 429 RESOURCE_EXHAUSTED (interactions API on the same model has a separate, larger bucket)."
  - "Adjusted vs literal grading differed only on format variants (thousands separators, 12h vs 24h time) plus one genuine paraphrase miss — literal-token grading undercounts by ~2-7%."

