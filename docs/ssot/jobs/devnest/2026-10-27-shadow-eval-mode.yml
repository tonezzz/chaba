  reports: evals/shadow/reports/<date>-*.{md,json}
  tests: tests/devnest/test_shadow_eval.py (20 tests)
  runbook: docs/kb/devnest-shadow-eval.md

fixture_set:            # 5 paired fixtures — frozen, read-only, needs_llm=false
  - host-health         # /proc+df+systemctl --failed snapshot -> health.json
  - storage-dryrun      # df + bounded stale-candidate scan, deletions=[]
  - mcp-safety          # frozen MCP tool surface -> safety matrix (conservative)
  - worktree-safety     # git worktree list -> isolation invariants
  - backup-freshness    # newest file per declared root vs fresh_hours

arms:
  l0:       fixture's own deterministic script; PATH-only env, no secrets
  opencode: "opencode run --format json --dir <wt> --model <m> (litellm/
            gemini-3.5-flash-lite default = L2; zen free = L3; ollama/* = L1)"
  devin:    "devin --respect-workspace-trust false --permission-mode smart -p
            (env override SHADOW_DEVIN_PERMISSIONS; nested-run notes below)"

isolation:                          # enforced + verified
  - "git worktree add -b shadow/<run>-<arm>-<fixture> per arm; same run-id
     shares nothing; existing path = hard refusal"
  - "sparse-checkout excludes evals/ -> fixtures/verify.py absent from the
     arm's tree (held-out for real, not just by convention)"
  - "audit: event-log scan for verifier peeks (filePath/reader-verb
     adjacency), mutating-command denylist, post-run git-status scope check"
  - "shadow/* branches are never merged; report asserts invariant;
     clean --run-id extracts artifacts then removes worktrees+branches"

rainy_day_ladder:                   # cheapest-sufficient entry, not blind climb
  L0:  "deterministic local scripts — no net, no secrets, always available"
  L1:  "local opencode+ollama (loopback) — small prompts only (<=4000c)"
  L2:  "LAN/tailnet LiteLLM idc03:4000 — needs gateway + authed key"
  L3:  "remote LiteLLM/OpenCode Zen — WAN"
  L4:  "Devin cloud — WAN + api.devin.ai + devin cli"
  MANUAL: "Tony gate — manual keywords or all rungs blocked"

