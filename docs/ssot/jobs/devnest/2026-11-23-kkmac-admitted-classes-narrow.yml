  (0.93-1.00 under the production verifier on all 3 models tried) but
  operator_brief (0.31-0.56) and safe_route (0.33-0.60) NOT ready —
  safe_route's failures include acting on priority:high prod cards,
  the exact failure the bounded lane exists to prevent. This change
  narrows kk_mac_local admission to {summary, structured_extract}
  everywhere the class set is declared.
