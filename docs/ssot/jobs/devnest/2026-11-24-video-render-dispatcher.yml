dispatcher:
  tool: scripts/devnest/video_dispatch.py (new)
  manifests: scripts/devnest/video-manifests/*.yml (schema video-dispatch/v1)
  commands:
    plan: >-
      Read-only. Per stage: staging completeness (pack.yml + runner +
      artifacts + declared inputs present/fetchable), lane resolution
      (mlx|colab|auto), queue state on both roots, KK-Mac admission gate
      snapshot, decision (stage|skip-*|deferred|blocked) + reasons.
    apply: >-
      Refuses unless manifest approved:true. For decision=stage only:
      rclone copy source->queue packs/, rclone check (complete-staging
      proof), fetch declared inputs store->pack with sha256 verify,
      purge+rollback on input failure, dispatch event to
      <remote>/queue/dispatch-events/. Never overwrites an existing pack.
    verify: >-
      Final-artifact QC — every declared artifact glob must exist with
      size>0 on the resolved queue remote; {shot} expands per shot id.
  invariants_preserved:
    one_writer_one_runner: >-
      Dispatcher only places pack dirs on queue roots; execution stays
      with nest-worker (ada-nest) / gated nest-worker (kk-mac pilot).
      First-writer-wins claim protocol untouched.
    idempotent_shot_ids: >-
      stages declare shots:; verify expands {shot} artifact globs;
      packs already done/queued/claimed are skip-*, never re-dispatched.
    review_vs_clean: >-
      variant: field carried through plan/apply/dispatch-event.
    no_historical_rerun: >-
      only manifest-named stages are touched; terminal/queued queue
      entries are inventory only.
  routing:
    mlx: >-
      KK-Mac pilot queue only when kk_mac_admission.snapshot() eligible
      (heartbeat fresh, ollama ok, disk>=20G, load<=4, idle, temp<=60C).
      Gates fail -> deferred; MLX packs never silently reroute to Colab.
    colab: >-
      ada-nest queue only after staging_check ok + rclone check +
      declared inputs fetched (complete staging).
    auto: mlx if pack looks MLX-routed and gates pass, else colab.
  live_gate_sample_2026-11-24: >-
    KK-Mac heartbeat fresh (1.5s), disk 57G free, but load_1m=8.94 ->
    gate denied load_high; scene1/vimax stages correctly deferred.

