pending: >-
  ONE item remains, KK-sudo-gated on kk-mac (board request answered
  'proceed' 2026-11-24 19:41 — no fleet path has sudo): narrow the bind
  to the tailnet IP — LAN 192.168.0.101:11434 AND 192.168.2.90:11434
  are currently exposed (SEC-0985 intent is tailnet-only). Fix:
  edit OLLAMA_HOST=0.0.0.0:11434 -> 100.108.217.17:11434 in
  /Library/LaunchDaemons/net.adanest.ollama.plist (root:wheel — needs
