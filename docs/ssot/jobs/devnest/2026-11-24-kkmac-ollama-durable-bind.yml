pending: >-
  Needs adanest account access on kk-mac (board request raised):
  1. verify OLLAMA_HOST in net.adanest.ollama.plist so the 0.0.0.0 bind
     survives reboot — if it was a one-off env, kk-mac reboot silently
     returns ollama to loopback and the lane dies;
  2. narrow the bind to the tailnet IP (OLLAMA_HOST=100.108.217.17)
     — LAN 192.168.0.101:11434 is currently exposed (SEC-0985 intent is
     tailnet-only). If narrowed, the disabled tunnel fallback still
     works (ssh -L reaches kk-mac loopback? NO — narrowed bind drops
     loopback too unless 127.0.0.1 is also bound; ollama OLLAMA_HOST
     takes one address — keep 0.0.0.0 or use the tailnet IP and accept
     the tunnel fallback reaching it via the tailnet IP instead of
     127.0.0.1).
rollback: >-
  If the tailnet bind is lost (kk-mac reboot, plist revert):
  systemctl --user enable --now kkmac-ollama-tunnel.service on idc03,
  set shim Environment=KK_SHIM_UPSTREAM=http://127.0.0.1:11445, daemon-
  reload + restart kkmac-admission-shim.service. Expect restart flaps
  while kk-mac sleeps — that is why it is disabled.
