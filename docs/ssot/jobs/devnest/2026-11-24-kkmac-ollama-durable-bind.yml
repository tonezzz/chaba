id: 2026-11-24-kkmac-ollama-durable-bind
title: kk-mac ollama durable reachability — direct tailnet bind verified, tunnel demoted to declared fallback
host: idc03 + kk-mac
card: kkmac-ollama-durable-bind
spec_note: >-
  Card spec said "do (a) declared tunnel unit now; (b) OLLAMA_HOST bind
  when adanest access is sorted". Live verification 2026-11-24 showed
  (b) already landed 2026-11-19 (comms on the card): adanest ollama
  binds 0.0.0.0, answers on tailnet 100.108.217.17:11434 AND LAN
  192.168.0.101:11434, admission shim + embed-pool repointed to the
  direct bind, kkmac-ollama-tunnel stopped+disabled after ~19k restart
  flaps. Option (a) as specced was moot — nothing consumes :11445.
verified: >-
  2026-11-24 live checks: curl http://100.108.217.17:11434/api/version
  -> 200 {"version":"0.40.8"}; idc03
  kkmac-admission-shim.service active, GET :11447/health shows
  upstream=http://100.108.217.17:11434 and live admission verdicts
  (denied load_high at check time — owner-first gate working);
  :11445 closed (tunnel dead as intended); embed-pool-shim
  EMBED_POOL_UPSTREAMS ends at http://127.0.0.1:11447; LiteLLM
  config.yaml kk-mac api_base entries all :11447. Attempt-2 re-verify
  (via idc03 -> kkkakk@kk-mac): `launchctl print
  system/net.adanest.ollama` shows OLLAMA_HOST=0.0.0.0:11434 in the
  EnvironmentVariables of /Library/LaunchDaemons/net.adanest.ollama.plist
  (root:wheel, plutil -p readable as kkkakk) — the bind SURVIVES REBOOT,
  item (1) of the board request closed without adanest access. curl
  from kk-mac itself confirms the bind answers on tailnet
  100.108.217.17, LAN 192.168.0.101 AND LAN 192.168.2.90 — the LAN
  exposure is real on both home subnets. kkkakk has no passwordless
  sudo; adanest@ ssh is denied from idc03/tony-omen/tony-dell — item
  (2) still needs KK's sudo on kk-mac.
