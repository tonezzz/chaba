rollback: >-
  If the tailnet bind is lost (kk-mac reboot, plist revert):
  systemctl --user enable --now kkmac-ollama-tunnel.service on idc03,
  set shim Environment=KK_SHIM_UPSTREAM=http://127.0.0.1:11445, daemon-
  reload + restart kkmac-admission-shim.service. Expect restart flaps
  while kk-mac sleeps — that is why it is disabled.
