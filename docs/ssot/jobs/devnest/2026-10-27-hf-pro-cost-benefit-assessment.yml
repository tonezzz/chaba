hf_facts_2026_10_27:            # re-checked official pages today
  pro: "$9/mo — 1TB private Hub, $2/mo compute credits, 40 min/day ZeroGPU (highest pri), 10 hosted ZeroGPU Spaces"
  jobs: "positive credit balance required — NO free tier; cpu-basic $0.01/h, t4-small $0.40/h, per-minute billing, ephemeral 50 GB, no inter-job cache"
