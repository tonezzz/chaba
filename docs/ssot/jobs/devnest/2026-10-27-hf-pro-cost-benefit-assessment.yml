cost_math_at_measured_utilization:
  colab_pro_marginal: "~$0 (prepaid ~100 CU/mo; ~56 CU needed at ~2 CU/T4-h)"
  hf_jobs_payg: "$6-12/mo (15-30 h x $0.40)"
  hf_pro_total: "$16-21/mo ($9 + overage) — algebraically >=$7/mo worse than PAYG on Jobs spend alone at any usage"
  breakeven_rule: "Pro only wins when ZeroGPU quota / >100GB private Hub / hosted Spaces are actually consumed"

blocked_probe: >-
  Live HF-side run not executed: hf jobs needs a token (none on fleet
  secrets — Colab runtimes hold the only one) AND a positive credit
  balance, which is pay-as-you-go spend gated on Tony's approval. A
  bounded probe would cost ~$0.01-0.07 (cpu-basic / 10-min t4-small).

verdict: >-
  DEFER HF Pro. Keep Drive as queue/control-plane SSOT. Optional free-tier
  use: pinned private Hub artifacts/checkpoints (~30 GB need today).
  Revisit if PAYG Jobs spend would exceed ~$9/mo with Pro extras used, a
  hosted ZeroGPU Space product exists, private artifacts outgrow free
  storage, or Colab Pro lapses. Decision request posted on the card.
