findings:
  - "Managed Agents run on the free tier: fresh sandbox, code execution, file write/read, sandbox reuse with persistence, and a mounted public repo all completed."
  - "Reuse via environment_id + previous_interaction_id returned the same environment_id and preserved the file across turns; cached input rose 3,441 -> 7,559 tokens on the reuse turn."
  - "A managed-agent turn is expensive for small tasks: 11k-12k input tokens versus ~1.5k for the batched Decisions call. Use it for real sandbox work, not trivial dispatch."
  - "Raw REST POST /interactions does not include the SDK's output_text field. The answer lives in steps[type=model_output].content and tool output in steps[type=code_execution_result].result; initial false grades were corrected from stored GET /interactions/{id} responses."
  - "Repository mounting needs background mode: synchronous call timed out at 290s, background POST + GET polling completed in 288s."
  - "Free-tier generation quota remains exhausted (429, ~16h reset at probe time); the agent runs still succeeded, indicating a separate quota path from the lite-model generation bucket."
  - "batchGenerateContent returned 400 FAILED_PRECONDITION for two models on the free key. Not sufficient evidence to call the API paid-only; paid verification is still open."
  - "Task-matched cost comparison (2026-11-27, free key, same Fibonacci(20) prompt): hand-built Interactions lite + code_execution used 19 in / 66 out / 84 tool-use tokens (169 total) in 56.9s; Managed Agents remote sandbox used 11,189 in / 88 out / 168 thought tokens (11,445 total, 3,415 cached) in 31.1s. Both returned 6765. Managed Agents cost ~68x total and ~589x input tokens for ~0.55x wall time (n=1). Evidence: scripts/voice-bench/results/g4-managed-agents-cost-comparison-20261127.json."
  - "Web search works inside the managed agent on the free key: google_search plus url_context returned Asia/Bangkok with an IANA source in 45.6s, one grounding call, 16,794 total tokens. This is a different surface from generateContent Search grounding, which returned 429."
  - "Triggers work on the free key: create/get/delete of a far-future cron trigger succeeded, status active with next_run_time 2027-01-01T00:00:00Z, and the list was empty after deletion. Use stored credentials for unattended runs and delete probe triggers."

