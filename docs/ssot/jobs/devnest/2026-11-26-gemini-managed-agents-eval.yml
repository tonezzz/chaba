  - "DONE 2026-11-26: YAML receipts and result JSON parsed; JSONs force-added through a clean detached worktree push."
  - "DONE 2026-11-26: revision 3 of the Education page published via board-api /publish sink wiki-education, pageid 368 revid 798, re-read 14,109 chars with Managed Agents and batch-precondition markers present."

remaining:
  - "Compare a real end-to-end task against our hand-built agent loop on token cost and wall time; this run only establishes capability, not an efficiency win."
  - "Verify triggers and web-search tools inside the managed environment; only filesystem, code execution and repo mount were exercised."
  - "Check batchGenerateContent on paid capacity, including 50% price claim and 24h SLO, when the shared project cap is resolved."
  - "Do not promote Managed Agents into any runtime path on this evidence alone."
