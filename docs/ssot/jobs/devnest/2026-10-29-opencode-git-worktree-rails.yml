title: OpenCode Git-worktree rails alignment
subtitle: Permit narrowly scoped local commits only in the disabled branch-code profile
icon: shield

planning:
  goal: >-
    Remove the contradiction between the branch-code profile's local
    git add/commit allowlist and the generated OpenCode prompt, while keeping
    push, merge, network, and live-system operations prohibited.
  scope: >-
    Update only the OpenCode profile prompt/allowlist and its tests. Keep
    branch-code disabled and OPENCODE_LANES unchanged. Do not run OpenCode,
    call a model, install tools, alter host configuration, or push/merge a
    task branch as part of this change.
  success_criteria:
    - branch-code prompt permits only local git status/diff/log/add/commit inside its required worktree.
    - branch-code prompt and command allowlist explicitly deny push/merge/rebase/branch/worktree operations.
    - ops-readonly and other non-writing profiles continue to forbid Git mutations.
    - Profile lint and focused unit tests pass while branch-code remains disabled.
  risks:
    - A prompt/allowlist mismatch can prevent a task from landing or encourage unsafe command attempts.
    - This change does not prove the local model can reliably use tools; that remains a separate canary gate.
  resources:
    - evals/opencode-lane/profiles/branch-code/profile.yml
    - scripts/devnest/opencode_profiles.py
    - scripts/devnest/lane_gate.py
    - tests/devnest/test_opencode_profiles.py
  owner: Devin
  estimated_duration: 1 session

processing:
  status: in_progress
  started_at: "2026-10-29"
  steps:
    - id: 1
      label: Confirm current contradiction and guardrails
      status: done
      notes: >-
        branch-code is disabled; its command allowlist permits git add/commit,
        but the generated common prompt prohibits all commits. The profile
        cannot push or merge and requires an isolated worktree and independent
        verifier.
    - id: 2
      label: Make Git rails profile-specific and narrow local staging
      status: done
      notes: >-
        branch-code now gets a conditional local-commit rail; other profiles
        retain the no-stage/no-commit rail. Git staging patterns exclude
        workflow cards and the profile remains disabled.
    - id: 3
      label: Add regression tests and validate the lane
      status: done
      notes: >-
        99 focused OpenCode profile/lane tests pass; all profiles lint clean;
        3,260 SSOT files validate with zero errors. Independent PR review is
        still required before considering any profile enablement.
  decisions:
    - label: Keep branch-code disabled
      rationale: >-
        The user asked to advance OpenCode Git capability, not to enable
        unattended code writes. No non-paid code model has passed a dedicated
        tool-use canary yet.
      alternatives_considered: >-
        Enabling the existing strong-tier profile would default to a paid
        provider and exceed the approved S0-S2 read-only rollout.
  changes: []

followup:
  verification:
    - Run focused OpenCode profile tests and profile lint.
    - Verify generated prompts for branch-code and ops-readonly separately.
    - Re-run only after a fresh, explicitly approved local-model canary.
  rollback_plan:
    - Revert the prompt/allowlist/test commit; profile remains disabled either way.
  handoff:
    - Git write access is limited to the isolated worktree; trusted git-safe-push remains outside OpenCode.
  deferred:
    - Do not enable branch-code or OPENCODE_LANES until a non-paid code model passes the held-out canary.
    - Do not route live HA publication or public Access/DNS changes through OpenCode.

report:
  status: in_progress
  completed_at: null
  summary: >-
    The profile/prompt mismatch is fixed and regression-tested. The profile
    remains disabled; no OpenCode run, model inference, or Git write was made.
  metrics:
    - metric: Branch-code profile
      value: disabled; no inference or task run
    - metric: Git boundary
      value: local worktree only; no push, merge, rebase, or network
    - metric: Static validation
      value: 99 OpenCode profile/lane tests passed; profiles lint clean; SSOT 3260/3260 valid.
  links:
    - title: OpenCode Git rails card
      card: OPS-0976
  kb_review: []
  lessons_learned: []

