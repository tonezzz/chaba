      notes: Profile lint and all envelope/profile consistency checks pass; three JEV routes match without network fallback.
    - id: 3
      label: Run the three local-model planning cases sequentially
      status: done
      notes: >-
        All three cases were attempted. The readonly-report plan returned
        but the verifier rejected its task class, broad allowed_paths, and
        human-gate value; docs-only and physical-hardware timed out without
        artifacts. No task was executed.
    - id: 4
      label: Independently verify artifacts, tool audit, cost, and route results
      status: done
      notes: >-
        JEV keyword routes passed 3/3 without network fallback; held-out
        verifier self-test passed 3/3. The completed scratch OpenCode run had
        zero tool/MCP calls and zero writes, but failed its plan contract.
    - id: 5
      label: Write the run report and update DEV-0975
      status: done
      notes: >-
        Partial result and artifact link are recorded on DEV-0975. The
        integrated workflow remains blocked; no promotion or queueing.
    - id: 6
      label: Retry proposal-only output without model-controlled policy fields
      status: done
      notes: >-
        A separate profile omits task class, target, permissions, and routing
        from the model output. Policy fields remain with JEV and the
        deterministic card envelope. The local OpenCode call timed out before
        producing an artifact. A direct local-model diagnostic returned in
        165.9s but used viewpoints as a list, not the required mapping; it is
        diagnostic only and not counted as an OpenCode result.
    - id: 7
      label: Retry proposal-only OpenCode with 360s local-model timeout
      status: done
      notes: >-
        OpenCode returned a proposal with no policy fields, but viewpoints
        was a list and only one option was returned; the held-out verifier
        failed. No tools or MCP were used.
    - id: 8
      label: Retry proposal-only using a fixed JSON skeleton
      status: done
      notes: >-
        The previous proposal showed useful content but mismatched the
        required viewpoint mapping and option count. With a fixed schema,
        read-only passed; docs-only omitted the target question and hardware
        left recommendation empty. All three outputs omitted policy fields.
    - id: 9
      label: Retry docs and hardware proposals with explicit missing-info rules
      status: done
      notes: >-
        The prompt now requires a recommendation and asks the model to surface
        missing targets, budgets, and hardware details. Retry only the two
        proposal cases that failed those checks; no policy fields or tools
        are available.
    - id: 10
      label: Recheck docs-only target question with an explicit missing-field instruction
      status: done
      notes: >-
        The docs-only proposal still omitted the target workspace question
        despite the general missing-info rule. The explicit task requirement
        produced a held-out pass and named the missing repository/workspace.
    - id: 11
      label: Confirm read-only proposal under the final proposal-only prompt
      status: done
      notes: >-
        The read-only proposal passed before the latest missing-info prompt
        addition. The final synthetic read-only run passed the held-out
        verifier with no policy fields, tools, or MCP.
    - id: 12
      label: Preserve timeout diagnostics for future local-model attempts
      status: done
      notes: >-
        The runner now saves partial stdout/stderr on timeout and records
        timeout separately from missing_artifact. The first fresh scratch
        hardware attempt timed out at 180s; step 13 records the bounded
        360s retry.
    - id: 13
      label: Retry hardware proposal with standard scratch-context runner
      status: done
      notes: >-
        The V3 hardware proposal passed the held-out proposal verifier in
        356.9s. It contained no policy fields, tools, or MCP. The executable
        V1 plan contract remains failed.
    - id: 14
      label: Compile proposal-only outputs with synthetic JEV/card policy
      status: done
      notes: >-
        The evaluation-only compiler rejected model-owned policy fields,
        joined three proposals with synthetic card snapshots and JEV routes,
        and emitted review packages with execution_authorized=false. All
        compiled routes matched; the packages remain clarification/review only.
    - id: 15
      label: Draft the actual DEV-0975 workflow idea with proposal-only profile
      status: done
      notes: >-
        The model returned a schema-valid draft but failed the workflow
        content rubric: it omitted canonical-card value, JEV/Nest/Cline/
        verifier roles, policy/human-gate rationale, and the repair-first
        recommendation. A human-authored review draft was recorded separately.
    - id: 16
      label: Record the shared-card auto-close state
      status: done
      notes: >-
        DEV-0975 was auto-closed by a merge sweep after its test gate was
        skipped fail-open. A board-api comment records the mismatch and asks
        Tony whether to reopen; no column change was made here. PR #62 remains
        open with `validate` failing at the warning-baseline step.
  decisions:
    - label: Stop the first run when runtime config exposed MCP
      rationale: >-
        The evaluation contract forbids MCP. OpenCode merged the global
        mcp-debug-readonly server into the first rendered run config, so the
        attempt was stopped before accepting a result. An isolated
        XDG_CONFIG_HOME then proved the resolved tool/MCP surface could be
        emptied before later attempts.
      alternatives_considered: >-
        Continuing with inherited MCP or retrying the free remote model would
        leave the tool boundary or provider behavior unverified.
