followup:
  verification:
    - Profile lint passes; all three envelopes pass lane-gate lint and profile consistency.
    - Held-out verifier self-test passes all three expected plan shapes.
    - Isolated resolved OpenCode config has zero MCP servers and all tools disabled.
    - JEV's local deterministic classifier matches all three expected routes.
    - The V1 scratch OpenCode plan artifact is retained; its held-out verifier failed on class, path scope, and human gate.
    - Proposal-only final read-only, docs-only, and hardware proposals pass 3/3 with no policy fields, tools, or MCP.
    - The standard runner completed the V3 hardware proposal in scratch context; local inference took 356.9s.
  rollback_plan:
    - No service configuration or production state was changed; model requests were synthetic and used local or free routes only.
    - Failed run evidence remains in the evaluation worktree for review.
    - Do not promote the OpenCode lane or execute any planned task from these plans.
  handoff:
    - Review the compiler proof; a production version must bind an immutable live card id/version and JEV decision.
    - Keep Cline/Nest blocked until that deterministic envelope and the artifact-completion contract are independently verified.
    - Resolve PR #62's warning-baseline failure before any adapter deployment or live Cline canary.
    - Do not use a broader LiteLLM key or paid model without Tony's explicit approval.
    - Post the measured result and remaining gates to DEV-0975 through board-api.
  deferred:
    - Nest queue submission, Cline task execution, MCP integration, repeated benchmark runs, and production routing.

