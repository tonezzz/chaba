title: OpenCode plan-only + JEV route evaluation
subtitle: Run a no-tool, no-MCP OpenCode planning canary over three synthetic requests and verify deterministic JEV routing
icon: experiment

planning:
  goal: >-
    Evaluate the first proposed OpenCode -> JEV handoff: OpenCode emits a
    structured, non-executing job plan; the deterministic JEV classifier
    independently routes the original request. Confirm the output is
    reviewable without invoking Nest or Cline.
  scope: >-
    Use three synthetic cases: read-only report, docs-only artifact, and
    physical hardware request. Run local idc02 Ollama qwen2.5:7b-instruct
    through a task-scoped OpenCode profile with all tools and MCP disabled;
    run JEV's
    keyword-first classifier locally on the original request text. Use
    held-out validation for schema, scope, and human-gate fields. No live
    host reads, MCP calls, Nest submission, Cline task, dispatch, merge,
    deployment, or paid-model calls.
  success_criteria:
    - All three OpenCode plans pass the held-out plan-contract verifier.
    - Every OpenCode run has zero tool calls, MCP calls, write attempts, and scope violations.
    - JEV's deterministic routes match the expected free_lane/free_lane/manual labels.
    - Use only local Ollama for model generation; no paid model or broad LiteLLM key.
    - All inputs are synthetic.
    - Results and limitations are durably reported and linked to DEV-0975.
  risks:
    - The OpenCode local-provider stream may time out or return malformed plan fields; a failure is held, not blindly retried.
    - The JEV classifier is keyword-first; the three cases test explicit known keywords and do not establish general classification quality.
    - This is plan-and-route only; it does not validate Nest/Cline task submission or terminal job-state handling.
  resources:
    - OpenCode CLI on tony-macbook
    - OpenCode on tony-macbook and local idc02 Ollama qwen2.5:7b-instruct
    - LiteLLM benchmark key only for a refused model-access diagnostic; no broad key
    - Existing opencode_profiles runner and lane_gate S0 envelope validation
    - Synthetic cases only; no credentials included in prompts
  owner: tony
  estimated_duration: 1 session
  related_focus:
    - label: Pilot OpenCode-to-Cline idea refinement workflow
      file: docs/ssot/kanban/cards/opencode-cline-idea-proposal-workflow.yml

processing:
  status: blocked
