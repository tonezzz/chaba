first_reroute_pick: |
  CLASS: bounded read-only audit / assessment / review / investigate
  cards — title-scoped, mutation-verb excluded.

  Why this class:
  * Evidence: audit/assess sessions = 56.8M prompt on idc02 in 30d
    (12 sessions, avg 4.73M) and the fleet assessment flagged audit
    shapes among the 12-17M outliers. Open-card cohort shows recurring
    audit-miss-*/audit-oc-*/[audit] titles sitting in the devin
    fallback bucket because 'audit' is not a classifier keyword.
  * Lane fit: kanban-free-lane-routing-contract §3 already reserves
    read-only profiles (ops-readonly, ssot-research, info-find) for
    reports/audits; OPS-0885 pilot + ops-remote-read smoke +
    ssot-research-verifier-semantic verified-close prove the path.
  * Low risk: read-only profile cannot mutate; worst case is a failed
    free-lane attempt that escalates one lane — never devin burn.
    Cards whose title carries mutation verbs (fix/implement/deploy/
    migrate/repair) stay on the normal path.

  Why NOT bigger classes: the 61-card jevos-fallback cohort is
  genuinely ambiguous (conf 0.00) — not a clean class; goal-*/backfill
  outliers are legitimately devin-shaped (cross-repo, long horizon);
  kw:pipeline/quadlet hits are too few to justify a rule.

