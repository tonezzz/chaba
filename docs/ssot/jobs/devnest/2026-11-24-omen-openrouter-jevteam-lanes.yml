  Per-family (fast batch): tool family is where chat arms dominate —
  8780 scores 1/16 on tool cases (it only answers noul confirm-gate
  questions); 8778/8779 get 3/16. KK-Mac and both OR/LiteLLM arms get
  16/16 on tool. Stag is the discriminating family for mid-tier arms:
  oc-executor/or-paid 1.00, kkmac 0.83, omen arms 0.42-0.68.

  Devin arm: documented non-viable for this corpus — Devin is an
  agent executor (session + repo), not a completion endpoint; a
  matched run would need a full dispatch per case (~minutes each,
  billed). oc-executor (real `opencode run`) is the literal
  OpenCode-executor comparison the card asked for.

  Preflight (2026-11-24 ~19:15 ICT, from tony-macbook):
    omen: ELIGIBLE — all four endpoints /health 200
      (8777 gemma-3-4b CPU, 8778 gemma-3-1b, 8779 student replica,
      8780 jev-student-distilmulti). --smoke: 8777 noul=0.990 (48s),
      8778 noul=0.835 (6.4s), 8779 noul=0.836 (26s), 8780 noul=0.006
      (52ms — confirm-gate domain lock confirmed live: collapses on
      non-confirm phrasing, keep it confirm-only).
    openrouter: DEGRADED — gateway liveliness+readiness 200, BENCH key
      headroom $1.83/$4.00 30d, but or-free leg HTTP 429 (OR :free
      1000/day account cap exhausted by fleet traffic — same finding
      as the iter-2 job doc). Exit 1, correctly refuses admission.

verdict: |
  DONE — all arms measured. Headline: on the matched 50-case
  corpus, every chat/executor arm (0.80-0.90) beats every omen arm
  measured so far — but the incumbent jevos baseline is WORSE than
  the omen students (0.38, 11 timeouts, 122s p50), so "omen is
  useless" is wrong: the whole local decision plane is currently
  below the chat-tier floor, and jevos is degraded under load.

  Lane reads:
  - omen: health ELIGIBLE, quality NOT READY for ANY routing tier.
    8780 is a confirm-gate specialist by architecture (confirm 1.00,
    tool 0.06 — domain lock re-verified). 8778/8779 students ~0.40.
    8777 (4B) fails both axes: cannot serve even 2-way concurrency
    within 180s (all timeouts), and sequential confirm-family accuracy
    is 0.25 with miscalibrated noul scores (smoke 0.990 was one easy
    prompt, not representative). Omen's honest scope narrows to:
    8780 confirm-gate assist + privacy-sensitive async scoring where
    the CHAT arms are disqualified by data policy — accuracy there is
    'acceptable for advisory gating', never autonomous decisions.
  - openrouter: paid leg via LiteLLM is the strongest measured
    lane (or-deepseek-v4-flash 0.86 @ 1.15s p50, cost-ledgered,
    per-key budget enforced by gateway). :free leg is quota-blocked
    (OR 1000/day cap, 429) — preflight correctly reports DEGRADED
    and refuses admission until quota resets.
  - OpenCode executor arm (real `opencode run`, 0.90) edges its own
    chat brain (0.86) — agent loop helps on stag/pipe families.
  - Devin: non-viable as a corpus arm (agent executor, not a
    completion endpoint); oc-executor is the literal substitute.

  Automatic production routing stays OFF for both lanes — matches
  the card gate. Promotion path is in followups.

followups: |
  - Promotion path: when lane-arena shows an omen arm beating the
    jevos per-family baseline AND preflight is green, flip lane
    status admission-pending -> live for the DECLARED task_classes
    only (e.g. omen-8778 for bounded classify assist) — never blanket.
  - openrouter paid legs need an envelope cost_budget at claim time;
    wire that check into whichever claimer adopts the lane.
  - 8780 stays confirm-gate only — its choice head is dead and its
    noul collapses outside the confirm domain (re-verified live).
  - OR :free quota resets daily; re-run lane-preflight after reset for
    a clean eligible reading.
