title: Omen + OpenRouter JevTeam lanes — definition, preflight, held-out bench
subtitle: Two new admission-pending lanes; decision envelope schema; gates block auto-routing
icon: route
version: 1

card: jevteam-omen-or-lane-admission
ref: BEN-1050
date: 2026-11-24
dispatch: 20261124-185813-define-and-benchmark-omen-and-

question: |
  Define and benchmark Omen and OpenRouter as separate JevTeam lanes.
  Omen: local decision-plane scoring, lane classification, audit/replay,
  privacy-sensitive async work; must not execute mutations. OpenRouter:
  LiteLLM-controlled free and paid tiers with per-key/model budget, max
  tokens, 401/402/429/timeout fallback, cost ledger, no secrets. Add
  live preflight for Omen 8777/8778 and OR gateway/quota, matched
  held-out benchmark against KK-Mac/OpenCode/Devin, and a normalized
  decision envelope (executor/provider/model/lane/task_class/artifact/
  expect/max_tokens/cost_budget/fallback). Do NOT enable automatic
  production routing until health, verifier quality, and cost gates pass.

method: |
  - Lane definitions added to docs/ssot/infrastructure/
    ssot.devnest-lanes.yml as `omen` (plane: decision, executor: NONE)
    and `openrouter` (plane: work, via LiteLLM :4000 only), both
    status=admission-pending; cross-ref added to
    ssot.model-routing.yml t2-openrouter-free.
  - Normalized decision envelope: schemas/
    jevteam-decision-envelope.schema.json (draft 2020-12) +
    scripts/jev/decision_envelope.py — stdlib validator mirroring the
    schema (no jsonschema dep), card-action -> envelope normalizer,
    decision-plane mutation refusal, paid-model/zero-budget check.
    Selftest 7/7.
  - Live preflight: scripts/jev/lane-preflight.py — read-only probes
    (health/metrics/key-info + one bounded smoke call with --smoke);
    fail-closed eligible/degraded/down verdicts, exit 0/1/2.
  - Matched held-out benchmark: scripts/jev/lane-arena.py runs the
    decision-arena v2 corpus (50 labeled cases: confirm/tool/pipe/stag)
    through every arm — native /v1/systemone for omen :8777/:8778/:8779/
    :8780 + jevos idc02:8777, OpenAI-compat chat arms for kk-mac
    qwen3:8b, litellm/gemini-3.5-flash-lite (the OpenCode free-lane
    brain), or-free-nemotron-35, or-deepseek-v4-flash. Devin arm
    documented non-viable (agent runs, not completions).

