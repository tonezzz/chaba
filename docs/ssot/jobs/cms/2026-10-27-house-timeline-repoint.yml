title: house-timeline family re-homed — timer on idc03, events read from mddb-ops
subtitle: >-
  Card claimed the ada-ha-events feed had stalled. It hadn't: the ops
  split moved ada-ha-events-* writes to mddb-ops :11025 — only the
  reader (house-timeline-update.py) still queried the leader :11023,
  and its timer died with the tony-dell drain.
id: 2026-10-27-house-timeline-repoint
status: done
owner: devin-dispatch
project: chaba
card: house-timeline-orphaned-feed-repoint
branch: dispatch/20261027-102955-house-timeline-family-orphaned
started: "2026-10-27"

diagnosis:
  card_premise: >
    (1) house-timeline.timer gone with tony-dell drain — TRUE (ad-hoc
    unit, never declared in ssot.jobs.yml; unit not-found after drain).
    (2) kind=events docs in ada-ha-events-tony stalled 2026-10-23
    needing a collector repoint to the current HA URL — WRONG.
  real_cause: >
    The feed never stalled. ada-ha-tony's event_recorder (idc03:8002,
    env ~/.config/secrets/tony-ha/backend.env) already points at
    HOME_ASSISTANT_URL=https://tony-omen.taila0626a.ts.net:8123 — the
    omen evacuation was done 10-19/20. Since the 2026-10-23T13:15 ICT
    service restart, MddbClient ops routing (OPS_COLLECTION_PREFIXES +
    MDDB_OPS_URL, docs/kb/mddb-ops-split.md) sends ada-ha-events-*
    writes to mddb-ops http://100.123.163.11:11025 (idc2 — no-embed
    telemetry store). Newest kind=events doc there:
    events-tony-20261027021042131487 (period_end 2026-10-27T02:10Z).
    The leader :11023 copy simply stopped growing — read-only residue,
    per plan. Only the house-timeline reader still scanned :11023.
  evidence:
    - "GET :8002/api/home-assistant/event-recorder -> running:true,
      subscribed, 175 buffered, last_connected 2026-10-26T20:01Z"
    - "journal ada-ha-tony: zero POST /v1/add to :11023 since restart;
      POST :11025/v1/add 200s present"
    - "mddb-ops :11025 ada-ha-events-tony kind=events: 1348 docs, newest
      today; leader :11023 newest events-tony-* key 2026-10-23"
    - "dell HA https://tony-dell...:8123/api -> 000 (drained); omen
      -> 401 (alive, auth required)"

