  - scripts/ada/house-timeline-update.py:
      desc: >
        events source MDDB_BASE_URL(:11023) -> MDDB_OPS_URL(:11025);
        docstring, footer, qc + sources meta now say mddb-ops;
        VERSION 1.1.0 -> 1.2.0.
  - docs/ssot/infrastructure/ssot.jobs.yml:
      desc: >
        new job `house-timeline` — host idc03, systemd, every 1h,
        persistent, timeout 5m. env pins MDDB_OPS_URL + MDDB_CMS_URL,
        plus MDDB_BASE_URL->ops as a transitional pin so the
        pre-repoint script build on the idc03 checkout also reads the
        right plane until this merge reaches it.
