    leaves AND qc. Matches trip-calendar (newest) and timer-timeline
    (parent-wise). media-inbox-update.py still stamps qc
    parent=reports-index — known divergence, normalize on next touch.
  domain_source: >
    §2 domain row corrected: values come from ssot.cms.yml
    meta.domain.canonical, not the nav section list (the draft conflated
    them). `home` is canonical and renders as its own auto-section.
  qc_role: >
    report_role=qc is the standard role for family self-check pages;
    timer-timeline's role=leaf predates it (normalize on next touch).

