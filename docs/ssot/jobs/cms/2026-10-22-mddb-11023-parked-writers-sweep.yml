parked_collection_deletion_runbook:
  gate: rollback window — MEM-0545 landed 2026-10-13; deleting is irreversible,
        needs explicit Tony approval (board request raised on the card)
  pre_checks: |
    # 1) no writer still leaks: for each parked collection, the newest updatedAt
    #    must predate this fix's live-apply timestamp
    # 2) export before delete (belt & suspenders; :11027 already holds live copies):
    #    POST :11023/v1/backup?to=pre-cms-purge — or per-collection export
    for c in ada-cms-pages ada-cms-pages-kk ada-cms-pages-kk-dev ada-cms-automation \
             chaba-architecture chaba-archive chaba-docs chaba-glossary \
             devin-kb documents infrastructure-ssot \
             kb-development kb-features kb-operations kb-system; do
      curl -s -X POST http://100.102.134.91:11023/v1/delete-collection \
        -H 'Content-Type: application/json' -d "{\"collection\":\"$c\"}"
    done
  note: |
    Verify the exact delete-collection endpoint against mddb server API
    (DELETE /v1/collection or POST /v1/delete-collection — check server.mjs
    in the mddb repo). Safer alternative if delete is too final: per
    host-hygiene, mddb has no read-only flag — deletion is the only way to
    make parked writes fail loud. Until then any stale writer silently
    publishes into a dead letterbox (the nest-* lesson).

