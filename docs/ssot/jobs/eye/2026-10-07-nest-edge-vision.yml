decisions:
  - label: MediaPipe efficientdet-lite0 over yolov8n-int8/onnxruntime
    rationale: >
      The spec offered either; e236153 picked the proven WASM path
      (vendored tasks-vision, 4.4MB vs 12MB, no vendored-onnxruntime
      dependency chain in this repo). Kept.
    alternatives_considered: >
      onnxruntime-web + yolov8n-int8 + JS NMS — viable (ada-pi vendors
      onnxruntime-web already) but heavier first-load and unproven here.
  - label: MDDB via a dedicated same-origin edge route, not a guessed path
    rationale: >
      eye.js pointed at idc03.taila0626a.ts.net/mddb/v1 — that mount does
      not exist (idc03 tailscale-serve exports only / -> ada-pi-pwa). The
      registry's one-line-per-route rule and tailnet-identity-write class
      give a tight write-only lane (/v1/add only).
    alternatives_considered: >
      Full /v1 proxy (wider attack surface — search/get over LAN);
      report-api/board-api reuse (fixed-purpose services, not doc
      writers); ada-pi-pwa endpoint (would need a code change in ada-pi).
  - label: ada_look reads a fixed doc, never scans
    rationale: >
      One GET on ada-ha-scenario-reports/eye:latest — deterministic, cheap,
      fresh_for-tagged so Ada can quote staleness. Written only while a
      page runs ?pub=N.
    alternatives_considered: >
      append-only detection log docs (history no one asked for; write
      amplification + re-embedding cost per frame); ada-eye dedicated
      bank (needs ADA_MEMORY_BANKS_FILE registration on ada-pi side —
      extra moving part for one doc).

handoff_ada_look:
  # Ready-to-apply ada-pi spec (repo out of scope for this worktree).
  # tools/eye.yml manifest entry:
  declaration: |
    name: ada_look
    description: >-
      Read the freshest in-browser object detections from the eye page
      (/apps/eye/, running with ?pub=N). Answers "what do you see" — what
      objects/people the eye currently sees, on which source, how fresh.
      Read-only state; for actions on a camera or screen use the
      confirm-gated tools (cctv_wall, cast_to_screen, camera_snapshot).
    parameters:
      type: object
      properties: {}
  # tool_runner sketch (backend/tool_runner.py):
  runner: |
    async def ada_look(args, ctx):
        doc = await mddb_get("ada-ha-scenario-reports", "eye/latest")
        if not doc:
            return {"ok": True, "seen": "nothing",
                    "note": "no eye page is publishing — start one with "
                            "/apps/eye/?src=...&pub=10 or cast-eye.sh"}
        payload = json block of doc.contentMd  # {ts, src, detections, ua}
        age_s = now() - parse(payload["ts"])
        if age_s > 3 * payload.get("pub_s", 10):
            return {"ok": True, "stale": True, "age_s": age_s,
                    "note": "eye page stopped publishing"}
        classes = count by d["cls"] in payload["detections"]
        return {"ok": True, "src": payload["src"], "age_s": age_s,
                "objects": classes, "seen": speakable(classes)}
  notes: >
    Authority model: ada_look is a pure read — it must never trigger
    casts, snapshots, or device changes. Any "do something about what you
    see" follow-up routes through existing confirm-gated tools, unchanged.
    Eye is opt-in: no pub=N page running -> honest "nothing is looking
    right now" answer, never a hallucinated scene.

