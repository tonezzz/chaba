title: nest-edge-vision — /apps/eye phases 1-4 (page, bench CMS, cast, ada_look)
subtitle: >
  The eye page landed on master ahead of this dispatch (e236153, MediaPipe
  efficientdet_lite0 in-browser, ?bench=N). This session closed the gaps:
  a real MDDB write lane, xmeye/camwall sources, a detections publisher,
  the bench-edge CMS generator, a cast script + runbook, and the ada_look
  ada-pi handoff spec.
icon: eye

planning:
  goal: >
    Phases per card: (1) /apps/eye/ page with cam-HLS OR device-cam source
    and in-browser detection + canvas overlay; (2) bench mode reporting
    fps/infer-ms/UA to MDDB bench/edge-* trended by a bench-edge CMS page;
    (3) cast the overlay via the screenlive/vcast lane; (4) freshest
    detections in MDDB readable by an ada tool (ada_look) under the
    confirm-gate authority model.
  scope: >
    chaba repo only — stacks/web/public/apps/eye/, ssot.routes.yml,
    render-routes.py, scripts/eye/, docs/runbooks/, systemd/. ada-pi
    (tool manifest + tool_runner) is a different checkout — spec shipped
    here, implementation deferred to an ada-pi dispatch.

