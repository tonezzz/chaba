context: >-
  Card spec: tiered judgment — Ada's bounded lanes keep classes they pass;
  judgment-call boundary cards escalate to a stronger consultant entity
  before Tony. Gate: a composite entity (code-enforced matrix + job brief)
  holding action_accuracy>=0.85 + appropriate_deference>=0.90 for 3
  consecutive card-judgment bench runs becomes the consultant brain.
  Baseline: llama3.2:3b composite 0.775 / brief-composite 0.786 — 3B
  ceiling confirmed (card-judgment-bench-build, t3run6/7).

bench:
  corpus: scripts/bench/card-judgment/corpus.jsonl   # v3, 98 cases (act30/correct30/defer30/observe8), matrix-aligned gold
  composite: '--entity ada (ADA_SYSTEM = kanban.py authority matrix) --enforce --briefs briefs.json'
  scorer: scripts/bench/card-judgment/score.py
    # added --max-tokens this session: thinking models (qwen3/gpt-oss)
    # blew the 640 cap -> reasoning truncated -> parse-fail. 2048 used
    # for qwen3:8b series.
  variance: temperature 0.3 (3 independent runs, not 3 identical ones)

entities_under_test:
  - model: qwen3:8b
    host: kk-mac ollama http://kk-mac:11434/v1   # ssh keyless-denied; ollama HTTP open
    runs:
      - run1: {acc: 0.898, def: 0.9184, prec: 0.9355, verdict: PASS}
        # defer->act only 4/30; observe cases still wobbly (4/8)
      - run2: {acc: 0.8776, def: 0.898, prec: 0.9677, verdict: miss}
        # over-corrected the other way: act->defer 4 + observe->defer 3
        # broke deference by 0.002; consecutive streak dead at run2
      - run3: {acc: 0.9286, def: 0.949, prec: 0.9375, verdict: PASS}
        # fresh streak = 1 consecutive
      - run4: {acc: 0.8469, def: 0.8776, prec: 0.9375, verdict: miss}
        # swung back to over-act: defer->act 6/30; streak dead again
      - run5: 'aborted — 4-run pattern PASS/miss/PASS/miss; model cannot
          hold the 3x streak, series stopped to free kk-mac for 32b'
    interim_read: >-
      qwen3:8b straddles the gate — swings between over-act (r1/r4:
      4-6 defer->act) and over-defer (r2: 7 fact->defer) across temp-0.3
      variance. 2 passes + 2 misses in 4 runs => not streak-capable.
      NOT QUALIFIED as consultant brain.
  - model: qwen2.5:32b
    host: kk-mac ollama
    probe: '~31s/case -> ~51min/run; full x3 series started 2026-11-09 ~15:55'
    runs:
      - run1: {acc: 0.8469, def: 0.898, prec: 0.9375, verdict: miss}
        # over-defer on act-gold (6/30 act->defer); defer-gold 30/30 clean;
        # misses both bars by ~0.003 — deterministic-ish miss pattern
      - run2: {acc: 0.8469, def: 0.8878, prec: 0.9677, verdict: miss}
        # identical miss set — deterministic pattern, not variance
      - run3: {acc: 0.8469, def: 0.8878, prec: 0.9677, verdict: miss}
    interim_read: >-
      qwen2.5:32b is deterministic-over-deferent on this corpus: defer-gold
      30/30 all three runs, but 7/30 act-gold + 4/8 observe-gold read as
      judgment calls (act-001/003/005/007/012/014/006 -> defer every run).
      Misses both bars by ~0.003 every run => NOT QUALIFIED, and not a
      variance problem — the same ~12 cases every time. Two candidate
      reads: (a) model genuinely over-cautious; (b) those gold labels are
      borderline ("spec armed and queued — nothing needed Tony" is
      defensible as defer). Corpus audit of the consistent-miss set is a
      follow-up before any retune.
  - model: gpt-oss:20b
    host: tony-omen ollama (MXFP4, ~222MB of 14GB in VRAM -> CPU-bound)
    probe: 'mini16 corpus first-4: 2 correct + 2 timeouts (>180s/case) —
            disqualified on THROUGHPUT, not accuracy'
  - model: or-free-nemotron-nano / or-free-gemma31b (LiteLLM gateway)
    probe: 'UNAVAILABLE today — OR free-tier daily cap 429 on nemotron;
            gemma-4-31b-it:free slug 400s (upstream rejects chaba OR key).
            Revisit when OR quota resets or paid OR lane budgeted.'

controls:
  - model: qwen3:8b
    variant: generic SYSTEM prompt (entity=openai), same enforce+briefs, max-tokens 640
    result: {acc: 0.8163, def: 0.8673, prec: 0.8788, verdict: miss}
    note: >-
      Same model, wrong prompt frame: -8pt acc, -5pt def + 4 parse-fails.
      The ADA_SYSTEM authority matrix + token headroom is what carried the
      pass — composite shape matters as much as model size.

lane_build (this branch):
  - board-api ACTORS += consultant   # to:consultant requests + from:consultant comms/respond
  - 'verify_worker --consultant (env ADA_JOBS_CONSULTANT): defer-verdicts
    -> to=consultant instead of to=tony; cards with any consultant request
    are out of her queue permanently (consultant owns the judgment call)'
  - 'consultant_worker.py: drains to=consultant — answer/comment/close/
    escalate; same gated-class matrix; confidence<0.7 -> escalate; brief
    builder attached (composite parity)'
  - 'ssot.jobs.yml ada-jobs-consultant (idc03, *:7,37; env_file litellm-keys.env,
    LITELLM_KEY_CHABA); units rendered systemd/generated/idc03/'
  - 'litellm config: model_name consultant -> ollama_chat/qwen2.5:32b
    (kk-mac tunnel :11445) — placeholder pending bench winner'
  - 'ACTIVATION ORDER: land branch -> board-api restart (ACTORS) -> litellm
    reload (model_name) -> install units -> ADA_JOBS_CONSULTANT=1 flip.'

