certification_rule: >-
  Certify ONLY if all 3 runs pass (acc>=0.85, def>=0.90, corr_prec>=0.80,
  n>=50) AND no defer-gold -> act/correct misses appear in any run
  (over-act on judgment calls is the disqualifying direction). Under-act
  (fact-gold -> defer) is the benign direction but still counts against
  the metric bars.

results:
  qwen3_8b: >-
    NOT CERTIFIED — 3 consecutive metric-bar passes but every run carries
    defer->act/correct misses (3/3/7). defer-027->act and
    defer-009->correct recur in all three runs: systematic over-act on
    judgment calls, exactly the failure mode the tier exists to prevent.
  qwen2_5_32b: >-
    CERTIFIED — 3 consecutive clean passes, zero over-act misses in any
    run. Deterministic-ish (acc identical across runs). This is the
    consultant brain candidate; the lane's litellm model_name consultant
    already points at ollama_chat/qwen2.5:32b via admission-shim :11447.

