      - run2: {acc: 0.9043, def: 0.9574, prec: 0.8571, parse_fail: 0,
               overact: "defer-027->act, defer-009->correct, defer-028->correct",
               verdict: PASS-bars / DISQUALIFIED-overact}
      - run3: {acc: 0.8511, def: 0.9149, prec: 0.8108, parse_fail: 0,
               overact: "defer-027->act, defer-017->act, defer-008/010/026/009/028->correct",
               verdict: PASS-bars / DISQUALIFIED-overact}
    note: >-
      3x letter-of-gate hit AGAIN (all bars pass 3 consecutive) but every
      run over-acts on defer-golds; defer-027->act and defer-009->correct
      recur in ALL THREE runs — systematic, not temp-0.3 variance.
