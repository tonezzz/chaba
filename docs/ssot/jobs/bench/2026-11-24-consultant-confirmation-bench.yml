    # x3 consecutive, corrected corpus is now corpus.jsonl default
    for i in 1 2 3; do
      python3 scripts/bench/card-judgment/score.py --entity ada \
        --model qwen3:8b --base-url http://100.108.217.17:11434/v1 \
        --enforce --briefs scripts/bench/card-judgment/briefs.json \
        --temperature 0.3 --max-tokens 2048 \
        --out-md scripts/bench/card-judgment/consultant-qwen38b-confirm-run${i}.md \
        --out-json scripts/bench/card-judgment/consultant-qwen38b-confirm-run${i}.json
