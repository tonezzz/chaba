title: KB Categorization Standardization
subtitle: Phase 4 of the Context Improvement Plan — standardize KB categories and enforce them in auto-kb
icon: target

planning:
  goal: |
    Standardize all KB entries to 5 core categories (operations, development, architecture,
    troubleshooting, implementation) and add category validation to auto-kb.
  scope: |
    - Define a mapping from existing non-standard categories to the 5 core categories.
    - Add allowed category validation to .agents/skills/auto-kb/auto-kb.mjs.
    - Generate a report of KB entries that need recategorization.
  success_criteria:
    - auto-kb only creates entries with one of the 5 core categories.
    - Report lists every KB file with non-standard or missing category and a proposed mapping.
    - SSOT validation passes after any KB frontmatter changes.
  risks:
    - Merging categories loses nuance; mitigate by keeping original tags.
    - Many files missing category; report should not overwhelm.
  resources:
    - docs/kb/
    - .agents/skills/auto-kb/auto-kb.mjs
    - docs/ssot/jobs/kb-quality-filter/
  owner: tony
  estimated_duration: 1 session
  related_focus:
    - label: Context improvement and optimization
      file: docs/ssot/ssot.focus.current.yml

