title: Context Retrieval for Active Focuses
subtitle: Phase 3 of the Context Improvement Plan — provide relevant KB, SSOT, and session summaries when a focus is activated
icon: target

planning:
  goal: |
    Create an mcp_context tool that, given an active focus and a query, returns the most relevant
    KB, SSOT, and session summaries from MDDB with sub-second latency.
  scope: |
    - Design the mcp_context input/output contract.
    - Prototype a local fallback that ranks relevant docs/kb and docs/ssot files by keyword.
    - Wire the prototype to MDDB semantic search once the API contract is validated.
    - Cache results for 24 hours.
  success_criteria:
    - mcp_context returns a structured list of relevant items for any active focus.
    - Response time < 500ms for cached queries.
    - 90% of known-relevant items appear in top 10.
  risks:
    - MDDB API is not stable; mitigate with a local keyword fallback.
    - Over-querying MDDB; mitigate with file-based cache.
  resources:
    - docs/ssot/infrastructure/ssot.mcp-tools.yml
    - docs/kb/
    - docs/ssot/
    - reports/CONTEXT_IMPROVEMENT_PLAN.md
  owner: tony
  estimated_duration: 2 sessions
  related_focus:
    - label: Context improvement and optimization
      file: docs/ssot/ssot.focus.current.yml

