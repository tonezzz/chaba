  google/gemini-3.5-flash-lite              0.0     -   26   same weekly-cap 403

findings:
  dead-allowlist-ids: |
    8 ids in the ghostroute allowlist are absent from the live :free
    shelf (qwen3.8-27b, ling-3.0-flash-sante/-fin, space-bunny-alpha,
    apodex-1.1-mini, ling-3.1-flash, lyria-3-pro-preview,
    minimax-m3.1-flash) — pure dead weight, every rotation hit is a
    guaranteed failure.
  harness-gated: |
    thinkingmachines inkling + inkling-small return 403 "only available
    on agentic harnesses" on raw API calls. openclaw itself may still
    reach them (it IS a harness) but they are dead for the Ada
    side-tool use-case this bench feeds — and inkling-small sits at
    fallback#3 in the live allowlist.
  weekly-key-cap: |
    ALL three paid Gemini refs failed 403 "Key limit exceeded (weekly
    limit)" — the shared OR key has a weekly spend cap that is already
    exhausted, so the free-vs-paid comparison could not be measured.
    Confirms the card's risk note: a dedicated openclaw/bench key is
    needed (or the weekly cap raised) before paid refs can be graded.
  openrouter-free-noise: |
    openrouter/free resolved across 11 different models including
    nemotron-3.5-content-safety (a moderation endpoint that cannot
    chat) — some auto-router failures are routing to non-chat models,
    not model weakness. Keep it only as fallback-of-last-resort.
  gemma-quarantine: |
    Both gemma-4 :free ids 400'd on every call with an upstream
    "API key not valid" from OR's Google provider path — same path
    family as the paid refs' 403. Likely OR-side Google outage today;
    quarantine rather than permanent drop, re-check next sweep.

verdict: prune-and-add
aq_result: |
  DROP from ghostroute allowlist: 8 dead ids (see dead-allowlist-ids),
  + inkling, inkling-small (harness-gated), + xingchen-agi/xing4.0-29b
  (20.6 composite, 429s). QUARANTINE: gemma-4-26b/31b (upstream-broken
  today). ADD candidates: poolside/laguna-s-2.1 (100 comp),
  dots-studio/dots-3-note-preview (83.3 comp). PROMOTE:
  nemotron-3.5-super-vl (100 comp, p50 1.9s) above the harness-gated
  inklings in the fallback chain. Suggested post-prune order:
  lightning -> super-vl -> laguna-s -> flint -> dots-3 -> ultra-550b
  -> north-mini-code(native lanes) -> openrouter/free (last resort).
  Paid-ref grading is BLOCKED on the weekly key cap — needs a
  dedicated key or cap raise, then re-run just the paid rows.
