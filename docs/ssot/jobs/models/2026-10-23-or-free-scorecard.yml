title: OR :free rotation scorecard — per-model bench through the gateway surface
subtitle: super-vl + laguna-s top the side-tool composite; 8 dead ids + 2 harness-gated to prune; paid refs blocked by weekly key cap
icon: flask
version: 1

card: openclaw-bench-per-model-scorecard-acros-3df00d
ref: KNB-0174
date: 2026-10-23
dispatch: 20261023-110246-per-model-scorecard-across-the

question: |
  Grade each ghostroute OR :free model on speed + tool-call correctness
  (fixed prompt suite, jev-bench shape) so the ada-gemini-free-tier-quota
  decision knows which :free models can take Ada side-tool calls
  (classify / decision / devteam — plain chat/completions, no harness).

method: |
  scripts/bench-or-scorecard.py (landed by the 2026-10-22 dispatch) —
  5 arms x ~32 calls/model against OR /chat/completions with the model
  pinned (gateway is loopback-only on tony-omen; same emulation as
  edu-agent-bench). Arms: toolcall_native, toolcall_prompted, routing
  (12 intents), reasoning (6), json_strict (4). 3.5s global request
  spacing to protect the shared OR key; circuit breaker at 6
  consecutive errors. Models: all 17 live :free + openrouter/free
  auto-router + 3 paid refs (gemini-2.5-flash-lite, 2.5-flash,
  3.5-flash-lite). Ran 40.5min on tony-omen.

measured: |
  Raw: reports/or-free-scorecard-2026-10-23.{json,md}
  Side-tool composite = mean(routing, json_strict, toolcall_prompted).

  model                                   comp   p50    err  notes
  poolside/laguna-s-2.1:free              100.0  3.3s    0   NOT in allowlist — add; tps 15.6 (slow gen, accurate)
  nvidia/nemotron-3.5-super-vl:free       100.0  1.9s    0   allowlist fallback#2 — best overall (96 avg all arms)
  recursive/flint-v1.0:free                85.0  1.3s    0   in allowlist — keep, fast
  dots-studio/dots-3-note-preview:free     83.3  2.8s    0   NOT in allowlist — add
  nvidia/nemotron-3-ultra-550b-a55b:free   78.3  4.8s    0   keep — deep/slow lane (tps 28)
  nvidia/nemotron-3.5-lightning:free       75.6  4.1s    0   current primary — keep (100 native tools)
  cohere/north-mini-code:free              66.7  2.3s    0   100 native but 0 prompted-JSON — native-tool lanes only
  openrouter/free                          58.9  2.6s    0   auto-router; lands on content-safety (non-chat) sometimes
  nvidia/nemotron-3-nano-omni-30b:free     56.1  1.3s    0   weak reasoning/routing — don't add
  poolside/laguna-xs-2.1:free              39.4  0.8s   11   429 storm — don't add
