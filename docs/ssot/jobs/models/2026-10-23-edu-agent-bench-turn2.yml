title: Education-agent lane-lift turn 2 — structured-output loop + gpt-oss:20b
subtitle: loop hardened (args repair / schema retry / forced-JSON escalation);
  gpt-oss:20b first local lane to sweep capture+ops+recall — dedupe still
  the systemic gap; clawbot lane blocked on missing OR credential
icon: flask
version: 1

card: edu-agent-lane-lift-turn2
date: 2026-10-23
dispatch: 20261023-040252-in-chaba-repo-scripts-bench-ed
parent: docs/ssot/jobs/models/2026-10-22-edu-agent-bench.yml

question: |
  Lane-lift loop (Tony 2026-10-22): iterate the SAME agent loop across
  model lanes on the identical fixture — improve the local lane until it
  beats clawbot. Turn 2: harden tool-call JSON fidelity in the loop, then
  rerun local-gpt-oss:20b (omen ollama) and clawbot (openrouter/free)
  vs the 2026-10-22 baseline.

loop_change: |
  AgentLane in scripts/bench-edu-manage.py:
  - parallel_tool_calls: false on every request (serial calls parse
    cleaner on small models);
  - `arguments` strings that fail json.loads are repaired — balanced-
    brace extraction, trailing-comma strip, ast.literal_eval — counted
    as arg_repairs;
  - calls still unparseable or missing schema-required params are NOT
    executed with {} anymore — an error is fed back as the tool result
    so the model re-emits (stricter schema retry) — counted arg_errors;
  - a reply that looks like a malformed text-blob call (fails the
    existing _fallback_call rescue) escalates ONCE to
    response_format=json_object — auto-disabled lane-wide if the
    backend 4xx-complains — counted json_retries;
  - new --ollama-timeout (default 300s, was hardcoded 150 — a ~9 tok/s
    RAM-offloaded reasoning model hit the old cap).
  All counters land in result JSON (scores.*.loop) + a method-note line
  in the .md. Verified end-to-end against a stubbed OpenAI-compat
  backend: repair->exec, reject->error-feedback, blob->forced-JSON->
  exec all fire correctly.

lanes:
  local-gpt-oss-20b: "identical hardened loop on omen ollama /v1
    gpt-oss:20b — 20.9B MXFP4, ~2.6GB VRAM + RAM offload, ~9 tok/s.
    Sequential per shared-GPU guard; nothing else loaded during run."
  clawbot: "NOT RUN — mn01 has no OPENROUTER_API_KEY (secrets originate
    on macbook, never synced) and no LiteLLM virtual key; OR probes
    401. Board request raised on the card for a key sync. Recorded
    honestly rather than fabricated, per the card guard."
  judge: "unusable this run — both GEMINI_API_KEYs on mn01
    (ada-ha-tony, ada-ha-michael) 429 on every attempt (free-tier
    daily quota); no LiteLLM virtual key on host. draft-Q = n/a.
    All 7 filings keep full HTML in tasks[].filings[].content —
    re-judgeable offline without rerunning the lane."

measured: |
  lane                    F1     dedupe  sched/ops  recall  draft-Q  completed  p50     tokens-in
  current   (10-22)       1.0    3/5     5/5        3/3     5.0      13/13      ~0-3s   0.9k
  clawbot   (10-22)       1.0    4/5     5/5        3/3     4.72     13/13      12.5s   74k
  hermes3:8b (10-22)      0.545  2/5     3/5        1/3     3.9      12/13      19.4s   31k
  gpt-oss:20b (turn 2)    1.0    3/5     5/5        3/3     n/a      13/13      78.3s   43k
  Raw: reports/bench-edu-manage-2026-10-23.{json,md}
  Fidelity counters on gpt-oss: arg_repairs=0 arg_errors=0
  json_retries=0 — spec-clean tool_calls every round; the hardening is
  a safety net it never needed.

verdict: local-lane-lifted
aq_result: |
  Local lane massively lifted vs hermes3:8b baseline (F1 .545->1.0,
  ops 3/5->5/5, recall 1/3->3/3, completed 12/13->13/13, zero arg
  errors) — gpt-oss:20b is the first local model to match current and
  clawbot on capture/ops/recall. It does NOT beat clawbot: dedupe ties
  current at 3/5 < clawbot's 4/5, and p50 is ~6x slower (78.3s vs
  12.5s) — but at ~42% fewer prompt tokens and $0. draft-Q
  unmeasurable this run (judge quota). Loop-change effect on this lane:
  nil measured — gpt-oss emitted clean tool_calls; value is insurance
  for weaker future lanes, proven by stub test.

findings:
  - "Dedupe failures are systemic, not model-bound: gpt-oss made the
    exact two misses everyone but clawbot makes — t3 re-ask created a
    second lesson ('tailscale ACL tags' vs existing 'tailscale acl
    basics') and t6 skipped the ada-nest-* family prefix + hub refresh.
    Reinforces the 2026-10-22 followup: fix needs store-awareness
    (existing-topic list into the prompt), not a better model."
  - "Structured-output hardening is validated but unexercised on
    gpt-oss — its ollama tool_calls were spec-clean across all 36 LLM
    rounds. The machinery's worth shows on weaker lanes (hermes-class
    models) where malformed-arg turns were the silent-killer failure
    mode last turn."
  - "mn01 is credential-poor for bench work: no OPENROUTER_API_KEY, no
    LiteLLM virtual key, and both direct GEMINI_API_KEYs were quota-dead
    by 11:00 +07 — free-tier 20/day is burned early by fleet jobs. Any
    future mn01 bench dispatch needs openrouter.env + a LITELLM_KEY_*
    synced or the judge/agent lanes degrade to partial results."
  - "omen gpt-oss:20b = 20.9B MXFP4 with only ~2.6GB in VRAM — most of
    the model runs from RAM (~9-15 tok/s effective, 78s p50 vs
    clawbot's 12.5s). Workable for benches; too slow for an interactive
    education manager."

followups:
  - "Sync ~/.config/secrets/openrouter.env (and ideally a LITELLM_KEY_*
    via litellm-keys.env) to mn01, then rerun --lanes clawbot for the
    turn-2 clawbot datapoint + re-judge gpt-oss's 7 filings from
    tasks[].filings[].content — no lane rerun needed for draft-Q."
  - "Store-awareness fix (from turn-1 followup, still the top gap):
    pass existing topic list into the agent system prompt /
    CLASSIFY_PROMPT so re-asks name onto existing topics — would lift
    every non-clawbot lane's dedupe 3/5 -> ~5/5."
  - "Lane-lift turn 3 candidates: qwen2.5:7b or gemma3:12b on the same
    hardened loop; or rerun gpt-oss after the store-awareness prompt
    change to isolate dedupe lift."
