aq_result: |
  The fixed free model completed all capture and recall tasks but
  deduped only 3/5 in each rep. Ops was inconsistent (4/5, 3/5, 5/5),
  with o2-push-review/o3-due-list calls timing out in two repetitions.
  This is a cleaner fixed-model baseline than openrouter/free rotation,
  but the model is not a clear manager candidate due to tool/ops
  reliability.

