question: |
  Card ada-text-model-promotion-path (procedure card, ref ADA-0783):
  a challenger lane may take ADA_TEXT_MODEL (ada-voice text-mode model
  env, 'chat' class on the LiteLLM gateway) or side-tools ONLY after
  clearing the education-manager bench gate on the fixed fixture
  (scripts/bench-edu-manage.py + scripts/bench-edu-corpus.json, 13
  tasks, local MockStore — never prod WP). This entry is the durable
  evidence path: gate definition, every challenger measured to date,
  the verdict, and how to re-run.

gate: |
  Operational gate (card note, measured 2026-11-20):
    capture F1 = 1.0 (incumbent level)
    dedupe >= 4/5   (incumbent current lane = 3/5)
    sched/ops + recall = full marks (recall 3/3)
    p50 latency <= 15s per task
  Original AQ (edu-agent-benchmark card, still the quality bar):
    challenger draft-Q (fixed gemini-3.5-flash-lite judge, 5-axis
    rubric) must BEAT the incumbent's 5.0 AND hold dedupe — no free
    or paid model has cleared this as of 2026-11-20.
  Incumbent: gemini-3.5-flash-lite pipeline (classify + draft) for the
  bench 'current' lane; production ADA_TEXT_MODEL 'chat' class is
  gemini-3.5-flash paid with lite/free fallbacks (ssot.llm-gateway.yml).
  Gemini Live voice moat is explicitly out of scope.

