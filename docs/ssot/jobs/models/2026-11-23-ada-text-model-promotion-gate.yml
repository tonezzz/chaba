verdict: challenger-fails-gate
verdict_detail: |
  qwen2.5:7b on omen ollama (CPU) fails EVERY operational axis:
  F1 0.75 (<1.0), dedupe 3/5 (<4/5), ops 2/5, recall 1/3 (<3/3),
  draft-Q 4.27, p50 61.7s (>15s — 4x over, mean 172s). The two
  transcript timeouts (t3/t4) and the o3 HTTP 400 are CPU-inference
  failures, not capability proofs — but as DEPLOYED on omen this lane
  cannot run the education-manager loop inside latency bounds. It also
  cannot be promoted to side-tools on this evidence: chat-local's
  qwen2.5:7b leg stays a chat lane, not an edu/tool lane.
  Incumbent re-measured same-judge same-day: current F1 1.0, dedupe
  3/5, ops 5/5, recall 3/3, draft-Q 5.0 — unchanged, stays.

rerun_procedure: |
  # incumbent + judge need a Gemini path; on hosts without a Google AI
  # key, ride the LiteLLM gateway (any key allowed to call
  # gemini-3.5-flash-lite on /v1beta — verified: LITELLM_KEY_CHABA/ADA/
  # KK/MDDB/MICHAEL; LITELLM_KEY_BENCH is alias-restricted and 403s on
  # the bare model name):
  source ~/.config/secrets/litellm-keys.env
  export GEMINI_BASE_URL=http://100.102.134.91:4000
  export GEMINI_API_KEY="$LITELLM_KEY_CHABA"

  # free OR challenger (after the daily reset; needs the gateway's OR
  # key budget — or-free-* aliases are on LITELLM_KEY_BENCH's list):
  python3 scripts/bench-edu-manage.py --lanes clawbot \
    --or-model or-free-nemotron-35 \
    --out reports/bench-edu-manage-<date>-<slug>

  # local ollama challenger (direct, bypasses litellm):
  python3 scripts/bench-edu-manage.py --lanes clawbot --clawbot-ollama \
    --or-model <ollama-tag> --ollama-timeout 300 \
    --out reports/bench-edu-manage-<date>-<slug>
  # OLLAMA_URL defaults to tony-omen (100.75.102.88:11434); tool-capable
  # tags verified 2026-11-23: qwen2.5:7b, hermes3:8b, llama3.2:3b,
  # qwen3:8b. gemma3:* / phi3 have NO tool support in ollama.

  # store-aware variant (hand the agent the existing topic list —
  # production-realistic, helps dedupe): add --agent-topics.
  # multi-rep for stability: --reps 3 (triples wall time).
  # offline re-judge of saved drafts: --rescore <result.json> --no-judge
  #   is NOT needed — rescore re-runs the judge on stored HTML.

promotion_path: |
  1. Run the fixture for the challenger (commands above); commit
     reports/bench-edu-manage-<date>-<slug>.{json,md} + this jobs/ entry.
  2. Check operational gate: F1=1.0, dedupe>=4/5, ops full, recall 3/3,
     p50<=15s. draft-Q is reported but the relaxed gate does not set a
     floor; the ORIGINAL AQ still requires beating incumbent 5.0 —
     treat draft-Q < ~4.7 as a quality regression vs flash-lite even if
     the operational axes pass.
  3. If the challenger clears and Tony approves, flip ADA_TEXT_MODEL on
     the ada-voice side (env on the text-mode session path; 'chat'
     class chain lives in stacks/idc03/litellm/config.yaml) — promotion
     needs explicit approval per AGENTS.md, never auto-flip.
  4. Side-tools lanes (classify/summary/tool-call aliases) are separate
     promotions with their own chains; this bench only evidences the
     education-manager surface.
