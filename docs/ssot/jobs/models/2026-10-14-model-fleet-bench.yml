    idc03 llama3.2:3b   7.2  4vCPU VPS CPU
    idc02 L3.2-3B cpp   8.3  llama.cpp, 4vCPU
    macbk L3.2-3B cpp   8.9  vulkan build (CPU-side decode dominates)
    dell  smollm2:135m 115.8 tg (llama-bench, -t4; micro tier CPU)

poc_rpc: |
  llama.cpp ggml-rpc-server per peer on loopback, reached via ssh -L
  forwards (no tailnet/LAN listeners). Main node = omen, -t 6; model file
  on main only, tensors stream to peers at load.

    model        config                          pp tok/s   tg tok/s
    3B           local omen                         30.0      9.81
    3B           omen+dell LAN 50/50                 33.9      8.29
    3B           omen+dell tailscale 50/50           36.1      6.90 (+/-2.7)
    3B           fully-remote dell via LAN          41.9      8.83
    27B          local omen                          3.40      1.25
    27B          omen+idc02 tailscale 24/76          3.06      0.87
    27B          omen+idc02 tailscale 50/50     crashed — rpc-server OOM
                  (idc02 had ~5G free not ~10; 'Remote RPC server crashed')
    27B          omen+dell LAN 24/76            aborted — ~4G shard into
                  dell's ~4.5G free starved sshd (loadavg >60); killed
                  immediately, dell recovered unharmed.

  Links: omen->dell 15-16 MB/s both paths (omen is on wifi; tailscale rides
  the same physical hop direct — 'LAN' vs 'tailscale' to a same-LAN peer is
  nearly identical). omen->idc02 ~67ms RTT internet path.

verdict: sharding-batch-only
decision_gate: |
  Plan gate: <2 tok/s decode -> batch-only; >5 -> large-lane candidate.
  - 27B split over tailscale: 0.87 tok/s — UNDER local 1.25 already-slow
    baseline. Splitting to a remote VPS strictly loses for 27B-class.
  - 3B split over LAN: -15% decode — sharding is cheap-ish on LAN but
    pointless: the model already fits everywhere.
  - The only RPC win observed is placement, not sharding: fully-remote 3B on
    dell ran 8.8 tok/s (dell's 8c CPU beats omen's cgroup-capped i7).
  - Conclusion: no large-lane in the gateway. For >RAM models, the honest
    answer stays "fit one host or don't run it" — 70B Q2_K on omen
    (~1 tok/s CPU) beats any sharded config this fleet's links can carry.

surprises: |
  - RPC peer RAM ceiling is binding and unforgiving: rpc-server dies hard
    mid-stream (main aborts with gdb dump); free-RAM check before each run.
  - Dell is NOT a safe shard peer during HA duty — ~4.5G free is margin, not
    headroom. Its sshd starved under the stream (recovered after kill).
  - qwen3:0.6b 'TTFT' includes its thinking preamble (first visible token
    ~6-12s); harness reports it as-is — noted, not a bug in the host.
  - peak_rss_mb in first-run artifacts read the ollama parent (41MB) not the
    runner child — fixed in model-speed.py (_find_server_pid follows
    children); later runs report real server RSS.

