measured_matrix: |
  decode tok/s, median (reports/model-bench/*.json):
    omen  qwen3:0.6b   36.1  (micro; TTFT inflated — thinking-phase preamble)
    omen  llama3.2:1b  75.4  GPU-resident
    omen  llama3.2:3b  47.0  GPU-resident
    omen  phi3         17.2  GPU-resident (2.2G in 3.7G VRAM)
    omen  qwen2.5:7b    8.5  partial GPU offload — small ceiling reached
