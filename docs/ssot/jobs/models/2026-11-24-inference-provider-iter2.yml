verdict: |
  1. groq-free group: SUPERSEDED. The free models it targeted
     (gpt-oss-120b, qwen3.8-27b) now exist as cf-* Cloudflare routes
     in repo config + opencode maps, and Groq itself was re-probed
     today: still free, still fast (TTFT ~0.3-0.5s), still TPM-capped
     below one agent request. Do NOT re-add groq to LiteLLM for agent
     loops; keep it for voice-aux/classify single-turn fallback
     (verification card llm-provider-verification-2026-11 step 2
     still wants the clean groq/* route decision).
  2. Zen free: alive but quota'd — 3/4 pass then provider.free-limit
     on the 4th task. Promo lane, not an always-on brain.
  3. OpenRouter: $10 credit confirmed purchased (1000/day :free cap
     live, already consumed today). DeepSeek V4 Flash paid bench is
     DONE and excellent — 6/6 across ops+code corpora at ~$0.05 total.
     It is the cheap paid code brain the doc predicted.
  4. Mistral Codestral + Cerebras: BLOCKED — no API keys exist on any
     host. Board request raised on the card.
  5. TTFT voice-aux: Groq numbers refreshed (gpt-oss-120b ~0.3-0.5s,
     qwen3.8-27b ~0.7-2.8s cold-ish); Cerebras leg key-blocked with
     Mistral.

  Cross-cutting finding: EVERY free lane is now quota-shaped, not
  price-shaped. CF = 10K neurons/day account-wide (consumed by fleet
  before this bench even ran); Zen = promo session cap; OR :free =
  1000/day account-wide (consumed today); Groq = 8K TPM/model.
  bench/gemini-3.5-flash-lite remains the only lane that went 4/4
  historically, but today it went 1/4 on careful-count ops tasks —
  worth watching whether that's quota pressure or model drift.

