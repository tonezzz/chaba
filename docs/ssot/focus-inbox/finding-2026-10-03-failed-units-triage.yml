  - label: Decide mddb-memory-standard breach vs known_failed (exit 1 = alert by design)
    status: completed
    completed: '2026-10-04'
    note: Exit 1 IS the alert — the sweep sends ops event + HA notification on
      breach (last run 11 phantom ops + speaker prints). Added to idc01
      known_failed with action review-breach-journal so the delta stops
      double-firing; the service's own notification remains the breach signal.
  - label: Suppress desktop-noise units in audits (xdg-document-portal, session scopes, autostart)
    status: completed
    completed: '2026-10-04'
    note: 'dell: xdg-document-portal + app-devin\x2ddesktop@autostart added to
