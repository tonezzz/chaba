title: MCP-Debug Overhead & Cancellation
subtitle: Reduce per-command latency and make mcp-debug feel responsive for interactive use
icon: bug
focus:
  label: mcp-debug-overhead
  text: mcp-debug commands carry SSH wrapper overhead and are not cancellable mid-flight, causing them to appear hung and be cancelled by the user. For fast, read-only, or API-probe steps (e.g. listing Gemini models, local file checks), direct bash/ssh on the control host is much faster. This focus explores how to keep mcp-debug useful for compact multi-host snapshots while removing it from the critical path of quick, interactive probes.
  branch: main
  priority: high
  status: draft
  tags: [mcp-debug, ssh, tooling, performance, latency]
  missing_info:
  - Exact timing breakdown of mcp-debug vs raw ssh for the same command
  - Whether the mcp-debug wrapper can stream output or support cancellation/timeout
  - Whether mcp-debug can detect and short-circuit on known-slow commands automatically
  safe_to_parallel: false
  subtasks:
  - id: 1
    text: Benchmark mcp-debug overhead against direct ssh for representative commands
    status: pending
  - id: 2
    text: Add timeout/early-exit guards or streaming output to mcp-debug wrapper
    status: pending
  - id: 3
    text: Update SSOT guidance and user rules on when to use bash/ssh vs mcp-debug
    status: completed
  - id: 4
    text: Verify long commands (e.g. process-conversations, curl probes) no longer hang in daily use
    status: pending
ownership:
  owner: tony
  created: '2026-08-20'
  updated: '2026-08-20'
