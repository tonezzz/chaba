title: Focus Inbox Item
subtitle: Prompt preprocessor to disambiguate requests against project KB
icon: inbox
focus:
  label: Prompt / command preprocessor for context and precision
  text: 'Build a preprocessing layer that runs before assistant interpretation of user requests and commands.

    It should:

    - Resolve ambiguity by fetching relevant project KB, SSOT, and active focus context.

    - Expand shorthand, aliases, and cues (e.g., "next", "do this", "optimize that") into explicit, actionable requests.

    - Link the user''s goal to the active focus, quick wins, backlog, and decision-tree cases.

    - Emit a structured, unambiguous prompt with: user request, inferred goal, active focus relevance, relevant SSOT/docs,
    expected tool(s), and any missing info.

    - Reduce misunderstandings, false assumptions, and misinformation by grounding the prompt in the project KB before any
    tool is called.

    - Optionally rewrite a bare shell command to a canonical, allowed, and compact form before dispatch to mcp_debug/mcp_raw.

    '
  branch: chaba
  priority: medium
  status: deferred
  tags:
  - mcp
  - prompt
  - preprocessor
  - context
  - kb
  - focus
  - workflow
  missing_info:
  - Whether the preprocessor should be a standalone MCP tool (mcp_prompt), a prompt-template in SSOT, or a step in mcp_focus.
  - Which KB sources to prioritize: MDDB, ssot.*, decisions, focus current, or all.
  - How much of the processing should be read-only versus allowed to update focus/inbox.
  safe_to_parallel:
