title: Assess michael-ha vs michael-dev card setup parity (pfg2/tpl)
subtitle: Compare how the PFG2 and TPL views/cards are configured on both instances and suggest modularization for efficiency
icon: compare

focus:
  label: HA card setup parity — michael-ha vs michael-dev (pfg2 + tpl)
  text: >
    Assess how the pfg2 and tpl views/cards are set up on michael-ha versus
    michael-dev (bundle version, card config, images, resource URLs, layout
    differences). Then suggest improvements/modularization so we can work more
    efficiently — e.g. a single source of dashboard config promoted to
    michael-ha, shared image asset list, and/or a sync script instead of
    hand-duplicated views. Context: dev-first rule (2026-09-06) means
    michael-ha is a deployment target only; michael-dev currently on bundle
    v100, michael-ha held at v91.
  branch: feat/tpl-design
  priority: medium
  status: assessed
  tags: [home-assistant, michael-ha, michael-dev, pfg2, tpl, parity, modularization]
  missing_info:
    - Desired end state — should michael-ha mirror michael-dev's tony-test exactly, or stay minimal?
    - Whether to automate promotion (script) or keep it manual on approval.
  safe_to_parallel:
    value: true
    reason: Read-only assessment + proposal; no writes to either instance required.
  subtasks:
    - label: Diff pfg2/tpl view config between the two instances (bundle version, resources, cards, images)
      status: done
    - label: List image/asset parity gaps (/local/*.jpg on both hosts)
      status: done
    - label: Propose modularization/efficiency improvements (shared config source, promote script)
      status: done
    - label: At next michael-ha promotion, check real PV/environment temperature entities (environment_temp, radiator_temp, PV panel temp) for adding temp series to PV.a1/PV.b1 cards
      status: done

findings_2026_09_07:
  bundle:
    michael_dev: v119 (fork resource sunsynk-power-flow-card-fork-v119.js)
    michael_ha: v103 at assessment; PROMOTED to v119 on 2026-09-07 via promote-michael.sh
    gap: >-
      v103-v119 = 17 versions (drop shadow, history scrim/outline/midline,
      chart bottom-half layout, full build-data + editor modularization)
  dashboard:
    tony_test_views_dev: [pfg2, pf3, pf4, pfg1, pfg, tpl, data, solis-daily-energy-sankey, juworkshop, weather]
    tony_test_views_ha: [pfg2, pf3, solis-daily-energy-sankey, tpl, juworkshop, weather]
    note: >-
      michael-ha lacks pf4/pfg1/pfg/data test views (fine - they are dev
      playgrounds)
    pfg2_config: >-
      identical apart from entity bindings already being the same real ids
      on both (sensor.inverters_1_*, sensor.totals_*)
    tpl_cards: >-
      both 39 cards, identical titles + grid areas; the 24 .a1/.b1 variant
      cards differ only in pfg_charts (dev regenerated by tpl-variants.py
      with updated series/segments/history layering)
  entities:
    parity: dev TPL/PFG2 already bind the REAL michael-ha ids - the dev
      simulator drives those same entity ids, so promotion is config-identical
    temperature_sensors_present:
      - sensor.inverters_1_temperature (inverter)
      - sensor.batteries_1_temperature{,_1,_2,_mos}, sensor.batteries_2_temperature{,_1,_2,_mos}
      - sensor.tze200_mja3fuja_ts0601_temperature (room air sensor)
    temperature_sensors_absent: >-
      environment_temp, radiator_temp, PV panel temp - PV.a1/PV.b1 temp overlay
      is NOT possible; closest proxy is inverter temp
  images:
    michael_ha_local: >-
      all 12 TPL images present (pv-tiles, power-grid, battery-bank,
      inverter.webp, sum, home-house, pool, living, kitchen, laundry, bedroom,
      terrace) - no gap
    cleanup: 'michael-ha still serves stale bundles v99-v102 alongside current'
  proposal:
    promotion_steps:
      - deploy bundle v119 to michael-ha /local + bump resource url
      - re-push tpl view from dev config (tpl-variants.py already applied on dev)
      - optionally rm stale v99-v102 bundles after confirming resource swap
    modularization: >-
      already done - dashboard is generated by
      scripts/home-assistant/tpl-variants.py (single source) and pushed via
      push-dashboard.py --mutate; same flow promotes to michael-ha


