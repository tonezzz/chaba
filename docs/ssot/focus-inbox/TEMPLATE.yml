title: Focus Inbox Item
subtitle: One new focus, task, or idea to triage
icon: inbox

focus:
  label: Short label for the focus or task
  text: Clear description of what needs to be done
  branch: optional-project-branch
  priority: medium
  status: draft
  tags: [tag1, tag2]
  missing_info:
    - What is still unknown or needed before this can become active?
  safe_to_parallel:
    value: false
    reason: Why this focus can or cannot run in parallel with an active focus
  subtasks:
    - label: Optional first subtask
      status: not_started

ownership:
  owner: tony
  session: optional-session-id
  locked: false
  lock_reason: ""

source:
  session: optional-session-id
  date: 2026-08-15
