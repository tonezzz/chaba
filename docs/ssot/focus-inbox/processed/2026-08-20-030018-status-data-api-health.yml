  text: 'mcp-health reported status ''unknown'' for Status Data API at 2026-08-20T03:00:18. Root cause: the Caddy reverse proxy in the tony-omen web container was trying to resolve ``status-api:8000`` but the ``status-api`` service was not defined in stacks/web/docker-compose.yml. Added the missing status-api service with build context ./status-api and exposed port 8000 on the docker network. Caddy now returns HTTP 200 for /api/health.'
  status: closed
  priority: medium
  tags:
  - health
  - inbox
  - important
  - resolved
  missing_info:
