title: mcp-rview-oauth-proxy already on tony-dell, SSOT out of sync
subtitle: Runtime shows the OAuth proxy on tony-dell but SSOT still describes it as a tony-omen service
icon: inbox

focus:
  label: SSOT desync for mcp-rview-oauth-proxy
  text: |
    A scan of tony-dell found the mcp-rview-oauth-proxy is already running:
      - 127.0.0.1:9004 is listening on tony-dell
      - tailscale serve on tony-dell serves https://tony-dell.taila0626a.ts.net/ proxying to 127.0.0.1:9004
      - the mcp-rview stdio/SSE server is also on tony-dell at 127.0.0.1:9003
    However, ssot.services.yml and ssot.health still describe the proxy as a tony-omen service on 9004/443,
    and the tony-omen tailscale serve status does not show a /mcp-rview or 9004 handler.
    The whole RView MCP stack is already co-located on tony-dell; the migration is effectively done but not recorded.
  branch: feature/home-assistant-mcp
  priority: medium
  status: draft
  tags: [mcp-rview, oauth, ssot, tony-dell, sync]
  missing_info:
    - Whether the proxy was previously on tony-omen and migrated, or was always on tony-dell
    - Current OAuth provider and redirect_uri used by the Claude Desktop MCP config
    - Whether any stale tony-omen Tailscale serve 443 mapping still exists
  safe_to_parallel:
    value: false
    reason: SSOT/health updates must be committed before the next migration can be considered complete
  subtasks:
    - label: Verify tony-omen has no active mcp-rview-oauth-proxy listener or tailscale serve mapping
      status: not_started
    - label: Update docs/ssot/infrastructure/ssot.services.yml to register mcp-rview-oauth-proxy under tony_dell
      status: not_started
    - label: Update affected health files (ssot.health.home.web.yml, ssot.health.mobile.yml, public/ssot.health.mobile.yml)
      status: not_started
    - label: Update ssot.containerization.yml and the active migration job to reflect reality
      status: not_started
    - label: Commit the SSOT sync
      status: not_started

