title: Rename gemini-live back to rview-live
subtitle: Rebrand the Gemini Live voice/controller service as rview-live across repos, containers, and SSOT
icon: inbox

focus:
  label: Rename gemini-live to rview-live
  text: |
    The voice + Gemini function-calling bridge that controls RView is currently
    called `gemini-live` everywhere (stacks, docs, SSOT, Caddy, chaba-h3 proxy).
    Rename it back to `rview-live` to match its actual purpose and the original
    naming the user expects.

    Work is needed in `chaba` (master) and `chaba-h3` (chaba.h3 branch) because
    both repos contain UI, proxy, and deployment references.
  branch: master
  priority: medium
  status: draft
  tags: [rview, rview-live, gemini-live, rename, tony-dell, chaba-h3]
  missing_info:
