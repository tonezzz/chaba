      status: not_started
    - label: Update chaba-h3 public/apps/apps.yml and proxy-server.mjs to rview-live
      status: not_started
    - label: Update any docs/kb and chaba-h3 references that mention gemini-live
      status: not_started
    - label: Stop/rename/restart the tony-dell podman units for rview-live
      status: not_started
    - label: Verify https://tony-dell.taila0626a.ts.net:8443/apps/rview-live/ and wss://tony-dell.taila0626a.ts.net:8443/api/rview-live/ respond
