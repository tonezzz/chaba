    - Decide if the rename should be one `chaba` commit plus one `chaba-h3` commit, or split by repo.
    - Confirm the tony-dell podman Quadlet units can be safely renamed without data loss.
  safe_to_parallel:
    value: false
    reason: Cross-repo and cross-service rename; chaba, chaba-h3, and the live tony-dell podman containers must stay in sync to avoid breaking the UI and MCP path.
