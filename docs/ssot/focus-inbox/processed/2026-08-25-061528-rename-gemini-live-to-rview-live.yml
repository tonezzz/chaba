      status: not_started
    - label: Rename stacks/tony-dell/gemini-live/ to stacks/tony-dell/rview-live/ and update Quadlet .build/.container units
      status: not_started
    - label: Update stacks/web/Caddyfile and docker-compose routes from /api/gemini-live to /api/rview-live
      status: not_started
