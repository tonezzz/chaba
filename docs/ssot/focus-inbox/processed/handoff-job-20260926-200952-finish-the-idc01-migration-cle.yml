    - Repointed tony-omen''s `ada-memory-pull` to idc01 — verified live: it pulled idc01''s ~90 uncommitted
    extracts and pushed commit `70252c55`. A scheduled run raced the retire but landed before the delete.


    **Phase 2 sweep — mostly already done:**

