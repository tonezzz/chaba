    ## What I found


    The registry `docs/ssot/ssot.runbooks.yml` existed but had drifted within 8 days:

    - `ssot.ada.howto.yml` (6 embedded Ada runbooks, added 2026-09-21) was unregistered

    - 3 new KB runbooks (`media-casting`, `tv-casting`, `secret-rotation`) missing; 2 of them lacked the
