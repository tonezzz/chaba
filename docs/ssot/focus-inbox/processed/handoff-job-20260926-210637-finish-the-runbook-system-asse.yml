    - 14 `type: troubleshooting` KB files unlisted

    - The registry claimed `chaba-backup.timer`/`chaba-backup-monitor.timer` were "not deployed anywhere"
    — live check shows both are now **installed and firing on tony-omen** (backup daily 02:00, monitor
    hourly). `chaba-ci-pipeline.timer` is still undeployed on both hosts.


    ## What I changed (commit `1d81b755` on the dispatch branch)


    - **`docs/ssot/ssot.runbooks.yml`** → v2: added ada-howto tier-2 entry, 3 KB runbooks, a grouped troubleshooting
    index, a tier-4 convention note for `stacks/services/*/README.md` runbooks (xmeye-vms), and corrected
    the timer-reality section

    - **`tv-casting-runbook.md` + `secret-rotation.md`** → added `type: runbook` frontmatter

    - **`docs/INDEX.md`** → Runbooks section now points at the canonical registry and lists all 4 locations

    - **`docs/ssot/jobs/infrastructure/2026-09-26-runbook-system-assessment.yml`** → the assessment trail:
    inventory (4 tiers, ~45 runbook artifacts), verification status (1/7 formal runbooks verified-live,
    5 partial/aspirational), pros/cons, gaps (no restore drills, no idc01/mddb-failover incident runbooks,
    registry has no enforcement — drifted in 8 days), and open decisions for you.


    ## Verify


    - `python3 -c "import yaml; yaml.safe_load(open(''docs/ssot/ssot.runbooks.yml''))"` — passed

    - `ssh tony-omen ''systemctl list-timers | grep chaba-backup''` — confirms the timers claim

    - Read the assessment: `docs/ssot/jobs/infrastructure/2026-09-26-runbook-system-assessment.yml`


    **Open decisions left f'
