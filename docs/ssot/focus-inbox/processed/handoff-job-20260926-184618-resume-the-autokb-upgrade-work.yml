    ## What changed — commit `623bd2d` on `dispatch/20260926-184618-resume-the-autokb-upgrade-work`


    **The standard**

    - `docs/ssot/infrastructure/ssot.reports.yml` — declares the layering standard: L0-raw (append-only
    artifacts) → L1-producer → L2-domain → L3-overview, a 14-node registry of real producers, the `meta.yml`
