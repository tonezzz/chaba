    timeline spec (`~/var/chaba/reports/timeline.jsonl`, outside the repo because it grows forever).

    - `docs/kb/layered-reporting.md` — human-facing doc, indexed in `docs/INDEX.md`.


    **The implementation**

    - `scripts/lib/report.py` — shared helpers: `write_meta`, `append_timeline`, `latest_artifact`, `resolve_node`
    (meta → artifact → missing precedence, cadence-aware staleness).

    - `scripts/report-system.py` — L3 renderer: walks the registry, writes `reports/SYSTEM-REPORT.md`
    + `system-report.yml` + its own meta + timeline event.

    - Wired `audit-hosts.py` (meta per host + timeline event) and `audits/run.mjs` (`reports/audits/meta.yml`
    + timeline event) — both Python and JS producers now conform.

    - `systemd/chaba-system-report.{service,timer}` — daily 06:45; registered in `ssot.automation.yml`
    as defined-but-not-installed.

    - Registries/index updated: `ssot.index.yml` (both duplicated sections), `ssot.registry.ssot-infrastructure.yml`,
    `ssot.registry.script{,-core}.yml`.


    ## Verified


