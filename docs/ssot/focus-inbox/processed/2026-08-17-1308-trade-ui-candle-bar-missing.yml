title: Trade UI candlestick bars not rendering
subtitle: Visible candles missing in TradeCanvas after data-source/migration changes
icon: inbox

focus:
  label: Fix missing candle bars in TradeCanvas UI
  text: |
    TradeCanvas UI (compare2.html / index.html) no longer draws visible candlestick bars.
    Initial assessment on tony-dell shows the chart-data API is returning 735 points for THB,
    but each point has flat OHLC values, e.g. open=high=low=close=33.125, and volume is null.
    LightweightCharts treats flat OHLC as an invisible or near-invisible candle, so the chart
    appears to have no candle bars. The flat values are produced because the new data sources
    (FRED, open.er, etc.) only provide a daily rate/close; src/legacy_api.py falls back to close
    for missing open/high/low. This likely surfaced after the OHLC filtering / data-source migration.
  branch: trade
  priority: high
  status: draft
  tags:
    - trade
    - ui
    - chart
    - candle
    - ohlc
    - data-sources
    - migration
  missing_info:
