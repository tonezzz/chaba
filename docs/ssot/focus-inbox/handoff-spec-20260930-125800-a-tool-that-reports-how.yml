    \ follows the tools.d contract, and contains no speculative features or unrelated work.\n\n## Revised\
    \ spec\n\n# Tool Specification: `ada_devin_daily_summary`\n\n- **Purpose**: Reports the total count\
    \ of Devin sessions executed today and whether any are currently awaiting user input.\n- **Parameters**:\
    \ None\n- **Policy Class**: `read` (secondary_allowed: true)\n- **Expected Result Shape**: \n  ```json\n\
    \  {\n    \"sessions_today\": 4,\n    \"awaiting_user_input_count\": 1,\n    \"awaiting_session_ids\"\
    : [\"devin-xyz123\"]\n  }\n  ```\n- **Honest Failure Behavior**: Returns `{\"error\": \"DEVIN_API_UNREACHABLE\"\
    , \"message\": \"Failed to connect to Devin API: <reason>\"}` if the upstream service is unavailable\
    \ or credentials are missing.\n- **Test Plan & Contract Details**:\n  - **Module Path**: `backend/tools.d/ada_devin_daily_summary.py`\n\
    \  - **Manifest Entry**: Required in `manifest.yml` under the tools registry.\n  - **Smallest Meaningful\
    \ Test Plan**:\n    - *Unit Test*: Mock the Devin API client/runner to return a predefined list of\
    \ sessions (some completed today, some awaiting input) and assert that the tool parses and formats\
    \ the expected result shape correctly.\n    - *Live-Scenario Expectation*: Execute the tool against\
    \ a staged/mocked upstream endpoint to verify integration compliance and structured error handling\
    \ when the API is unreachable."
