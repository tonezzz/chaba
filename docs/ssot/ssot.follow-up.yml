consolidation_rules:
- rule: Archive processed focus-inbox items older than 7 days that are already in ssot.focus.current.yml
- rule: Mark ssot.focus.yml items with previous_status pending as completed or archived if the focus is already closed
- rule: Merge duplicate improvement entries in ssot.improvements.yml that reference the same overnight assessment
- rule: Close job artifacts whose report section is non-empty and all steps are completed
- rule: Move macbook/mysystem tasks to a dedicated macbook backlog if not relevant to chaba master
- rule: Keep ssot.focus.current.yml as the single active-work SSOT; all other open items must link to it or be archived

