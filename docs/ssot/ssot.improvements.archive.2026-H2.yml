- label: LINE API Rate Limit Mitigation
  text: 'Resolve LINE API authentication rate limit (code 103) preventing Yomi message downloads and implement retry logic
    to prevent future rate limit issues


    **Root Cause**: Previous LINE session was rate-limited (code 103) due to too many login attempts, blocking message downloads.


    **Resolution** (2026-08-12):

    - Backed up old credentials and re-authenticated with `npx @rikaidev/yomi login`

    - Session restored successfully (mid: ufdd2c3dfe084d111ed702c9c76bf6a21, displayName: Tonezzz)

    - Verified message fetching works (66/67 conversations fetched successfully)


    **Implemented Mitigations** in `fetch-conversations.mjs`:

    - **Exponential backoff retry logic**: 1min, 5min, 15min, 1hr, 4hr delays for rate limit errors

    - **Rate limit detection**: Parses error codes (103, "rate limit", "temporarily restricted", Japanese error message)

    - **Login attempt throttling**: Maximum 1 login attempt per hour tracked in `login-attempts.json`

    - **Retry on both list and single fetch**: Protects against rate limits at any API call point


    **Benefits**: Prevents future rate limit disruptions, automatic recovery from temporary restrictions, reduced manual intervention

    '
  status: completed
  priority: high
  effort: 2-4 hours
  category: yomi
  discovered: 2026-08-06
  completed: 2026-08-12
  assessment_ref: yomi-gemini-migration
  business_impact: 8
  technical_impact: 7
  user_experience_impact: 9
  cost_savings_impact: 5
  impact_summary: Restores Yomi message download capability and prevents future rate limit disruptions
  related_files:
  - scripts/yomi/fetch-conversations.mjs
  - /etc/systemd/system/yomi-fetch.service
  - /etc/systemd/system/yomi-fetch.timer
  - docs/ssot/infrastructure/ssot.services.yml
  tags:
  - yomi
