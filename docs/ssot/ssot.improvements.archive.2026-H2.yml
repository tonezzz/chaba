  - retry-logic
  - completed
  action_items:
  - Wait for LINE API rate limit to lift (code 103 restriction)
  - Re-login with `npx @rikaidev/yomi login` when restriction clears
  - Implement exponential backoff for login retries
  - Add rate limit detection and automatic retry logic
  - Monitor login attempt frequency to prevent future rate limits
  - Document LINE API rate limit policies and best practices
