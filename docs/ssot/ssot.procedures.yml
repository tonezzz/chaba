title: Procedures Index (the standard procedure for everything)
subtitle: >-
  One registry of every repeatable procedure in the Chaba Ecosystem.
  Entries are pointers — the procedure body lives wherever it was written
  (kanban card, kb doc, SSOT section, script). Never copy a body here.
icon: "\ud83d\udccb"
version: 1

meta:
  when_to_write:
    - "A procedure gets recorded only AFTER it happens for real — never speculatively. First time is improvised; second time it gets an entry."
    - "Trigger test: would a cold session repeat this correctly from this pointer alone? If yes, it belongs."
    - "If a procedure exists, follow it; if it was wrong, update it in place — never fork a second copy."
  how_to_add:
    - "Add a 4-line entry below: id, where, trigger, owner. The body stays where it was written."
    - "Cards with a `STANDARD PROCEDURE` comms block are self-registering — index links to the card."
  anti_sprawl:
    - "One index, no procedure for procedures-about-procedures beyond this file."
    - "Stale/unused entries get status: archived — deleted only when the procedure is impossible to ever need again."
    - "If two entries overlap, merge; ambiguity between procedures is a bug, not coverage."
  status: active
  created: 2026-10-09
  author: "devin (idea: tony)"

