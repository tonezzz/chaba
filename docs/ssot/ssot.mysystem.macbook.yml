title: MacBook Pro Workstation
subtitle: MacBook Pro (MacBookPro13,3) running Ubuntu Linux — portable dev/lab fleet node
icon: 💻
related_files:
  - docs/ssot/infrastructure/ssot.host-roles.yml
  - docs/ssot/ssot.mysystem.home.yml
  - docs/ssot/infrastructure/ssot.mcp-debug.yml
  - docs/kb/hardware-tony-macbook.md
  - docs/kb/ubuntu-install-macbook-pro13-3.md
  - docs/kb/mn01-stick-standard.md

ideas:
  - MacBook Pro as portable Linux dev/lab node in home network
  - Remote access via SSH + Tailscale
  - Vulkan-capable GPU offload for small whisper.cpp/llama.cpp models
  - Integration with existing home network infrastructure

sections:
  - title: Transition Record
    icon: 🔄
    layout: list
    items:
      - label: macOS wiped 2026-10-10
        text: "Was macOS 13.7.8 Ventura (user kkkakk). Turned out to be MacBookPro13,3 (2016 15\", pre-T2) — serial C02T902XH03M and 2.6GHz base clock had suggested a 2018 T2 model; the T2 fork of kk-macbook-ubuntu was never needed. Ubuntu 26.04.1 LTS installed to whole internal SSD via ubuntu-usb stick (docs/kb/ubuntu-install-macbook-pro13-3.md)."
        status: done
      - label: Backup location
        text: "Full kkkakk home (23G) + Shared (211M) preserved at /home/tony/macbook-backup-2026-10-10 on the ubuntu-usb stick (still plugged into the MacBook, mounted /run/media/tony/ubuntu-usb). Includes .ssh/authorized_keys, chaba-health, Library (Chrome Remote Desktop config), .anydesk, wifi SSID list (no PSKs)."
        status: retained
      - label: Not backed up
        text: "podman redis-macbook container data (redis-data volume, port 16379) — no .rdb/.aof dump exists; treated as disposable cache."
        status: known-gap
      - label: History
        text: Pre-2026-10-10 macOS configuration is in git history (file version <=5, last_updated 2026-09-18).

  - title: System Information
    icon: 🖥️
    layout: list
    items:
      - label: Model
        text: MacBookPro13,3 — MacBook Pro 15" Late 2016, Touch Bar (DMI verified 2026-10-11)
      - label: CPU
        text: Intel Core i7-6700HQ, 4c/8t @ 2.6GHz (Skylake)
      - label: Memory
        text: 16 GB RAM
      - label: Operating System
        text: Ubuntu 26.04.1 LTS, kernel 7.0.0-38-generic (verified 2026-10-11)
      - label: GPU
        text: Intel HD 530 (i915, display) + AMD Radeon Pro 450 Polaris11 2GB (amdgpu/RADV — Vulkan works, no OpenCL/ROCm). See docs/kb/hardware-tony-macbook.md
      - label: Hostname
        text: tony-macbook
      - label: Username
        text: tony
      - label: Storage
        text: "233.8G Apple NVMe SM0256L — nvme0n1p1 1G EFI + nvme0n1p2 232.7G ext4 / (fresh install 2026-10-10)"

  - title: Network Configuration
    icon: 🌐
    layout: list
    items:
      - label: LAN IP
        text: 192.168.2.88/24 via USB-C ethernet dongle (enx00e04c361276, MAC 00:e0:4c:36:12:76 — same dongle that held 192.168.2.80 under macOS)
      - label: Tailnet IPv4
        text: 100.77.76.112 (machine name 'tony-macbook' — new tailnet node; old macOS node 'kk-macbook' 100.124.59.112 still registered, pending revoke in admin console)
      - label: WiFi
        text: "BCM43602 via brcmfmac — interface wlp3s0 UP, driver/firmware fine, but no AP associated yet. macOS backup has SSID list only (no PSKs) — needs one manual join to TONY-WIFI."
        status: pending
      - label: Bluetooth
        text: hci0 present, unblocked
      - label: Network Status
        text: Connected to home network via ethernet dongle
        status: active

  - title: Remote Access Methods
    icon: 🔐
    layout: list
    items:
      - label: SSH Access (inbound)
        text: "ssh macbook — Host alias 'macbook'/'tony-macbook' -> 100.77.76.112, User tony, on tony-omen (~/.ssh/id_ed25519_macbook) and tony-dell (~/.ssh/id_cascade). Re-pointed 2026-10-11; verified end-to-end from both hosts."
        status: active
        tags: [ssh, command-line, key-auth]
      - label: SSH mesh (outbound)
        text: "macbook -> fleet: id_ed25519 pubkey authorized on tony-dell, tony-omen, idc02, idc03, mn01 (pushed via dell chain 2026-10-11); hostkeys scanned for all + self. removed from ssh-mesh-sync EXCLUDE + added to ssot.host-capacity.yml hosts — weekly mesh sync now covers it both directions."
        status: active
        tags: [ssh, mesh]
      - label: Authorized Keys
        text: "~/.ssh/authorized_keys re-seeded 2026-10-11 with the 3 fleet keys from macOS backup: tony@linux-pc-to-macbook (omen), mcp-debug@tony-dell, cascade (dell)"
        status: active
      - label: Chrome Remote Desktop
        text: "chrome-remote-desktop 155.0.8059.19 deb installed; XFCE virtual session (Wayland-only GNOME — no X11 GNOME session on Ubuntu 26.04), ~/.chrome-remote-desktop-session → startxfce4, HandleLidSwitch=ignore drop-in for lid-closed headless. Pairing staged 2026-10-11 — awaiting one-time --code (kanban tony-macbook-crd). Runs as chrome-remote-desktop@tony.service under tonezzzz@gmail.com."
        status: staged
      - label: Tailscale Funnel
        text: Old landing page/funnel config died with macOS — none configured on Linux
        status: removed

  - title: Installed Software
    icon: ⚡
    layout: list
    items:
      - label: Fleet stack
        text: "tailscale (own node identity — NOT the mn01 stick identity, per docs/kb/mn01-stick-standard.md), openssh-server, Chrome 155, devin-desktop (windsurf) 3.10.48, devin CLI 3000.11.3, node v22.20.0 (~/.local/node user-space install), devin-dispatch toolchain (~/.local/bin + repos.conf)"
        status: active
      - label: Devin satellite layer
        text: "~/.config/devin/mcp_config.json — 19 servers; command-type re-exec on tony-dell over ssh (satellite pattern), URL-type direct over tailnet; mddb -> idc03:9000 (dell's stale idc01 URL fixed same day). Session hooks in ~/.config/devin/scripts/ + mcp-scripts/ ported from dell. Timers: devin-cleanup, devin-session-prune, devin-dispatch-watch, devin-dispatch-prune. devin-desktop watchdog via cron."
        status: active
      - label: Runner lane
        text: "runner-agent.service+timer cap 2 labels cpu,dev,portable — enrolled in ssot.kanban.yml runner_fleet 2026-10-11 (script type only until devin CLI auth + podman)"
        status: active
      - label: GPU tooling
        text: vulkan-tools, clinfo, mesa-utils, glmark2 (bench done 2026-10-10 — see hardware doc)
      - label: Not yet installed
        text: "devin CLI login (auth status = not logged in — needs one `devin auth login` browser round), podman (no container/script container tasks yet), redis (was macOS-only, no backup), PlayLive/CDP headless endpoint, device-telemetry agent, WiFi profile (no PSK in backup)"

  - title: Power & Sleep
    icon: 🔋
    layout: list
    items:
      - label: Lid-close suspend
        text: "Disabled for headless use 2026-10-11 — /etc/systemd/logind.conf.d/headless-crd.conf sets HandleLidSwitch=ignore + HandleLidSwitchExternalPower=ignore (lid close no longer suspends, needed for CRD)"
        status: done

  - title: Maintenance & Troubleshooting
    icon: 🔧
    layout: list
    items:
      - label: Install runbook
        text: docs/kb/ubuntu-install-macbook-pro13-3.md (hardware notes, Option-key boot, BCM43602 firmware note)
      - label: SSH Troubleshooting
        text: sshd enabled (port 22); 'ssh macbook' from omen/dell
      - label: Boot picker
        text: Hold Option (⌥) at power-on — EFI Boot entries; tony-usb stick identity rules in docs/kb/mn01-stick-standard.md

  - title: Security Status
    icon: 🔒
    layout: list
    items:
      - label: Declared posture
        text: docs/ssot/infrastructure/ssot.security.tony-macbook.yml (updated to Linux 2026-10-11)
      - label: Exposure
        text: "sshd 0.0.0.0:22 (LAN+tailnet) — the only service listener besides CUPS/systemd-resolved loopback"
      - label: Firewall
        text: ufw not configured yet (desktop default)
        status: pending

  - title: Future Enhancements
    icon: 🚀
    layout: list
    items:
      - label: devin CLI auth
        text: One `devin auth login` browser round — standalone CLI/bundled say not-logged-in despite valid credentials.toml (fleet-verified). Blocks dispatch-type cards on this runner.
        status: planned
      - label: WiFi onboarding
        text: Join TONY-WIFI once with password; laptop then works untethered
        status: planned
      - label: Optional restores
        text: "redis container (no backup exists — fresh start only), PlayLive/CDP endpoint, KK user files from stick backup into ~/ on demand (CRD host no longer optional — staged 2026-10-11)"
        status: optional

