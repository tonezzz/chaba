title: Runbook Registry
subtitle: Canonical index of all operational runbooks — markdown, SSOT-embedded, and KB

convention: |
  Runbooks live in three places, on purpose:
    1. docs/runbooks/*.md — long-form operational runbooks. Required
       frontmatter: status (verified | partial | aspirational | completed |
       unverified), last_verified, verification_method, scope, owner.
    2. docs/ssot/**/*.yml — structured `runbooks:` / `*_runbook:` entries
       kept inline with the system they describe (see
       ssot.home-assistant.howto.yml, ssot.devin.maintenance.yml).
    3. docs/kb/ — reference docs; runbook-like files carry
       `type: runbook` or `type: troubleshooting` in frontmatter.
  This file is the single discovery point. Add new runbooks here and tag
  KB files rather than moving them.

status_values:
  verified: Live-tested against the running system (endpoint/service/timer confirmed)
  partial: Scripts/commands verified against source, but not exercised live, or documented automation not deployed
  aspirational: Describes intended workflow that has never been executed end-to-end
  completed: One-shot procedure that has been executed; kept for reference
  unverified: Template/generated content not yet checked

verification:
  link_check: "scripts/audits/doc-links-audit.mjs — weekly via standardization-suite; verifies markdown links and related: paths resolve"
  review_cadence: Re-verify `partial` runbooks live before relying on them in an incident; re-check links on any doc restructuring

