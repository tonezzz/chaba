- label: tony-dell podman service migration
  text: 'Migrate non-GPU Docker services from tony-omen (89% full on /home, 9.6GB free)

    to tony-dell rootless podman (14GB RAM, 67GB free disk, podman 5.7.0). tony-dell

    already runs postgres (chaba-postgres-16) and yomi-api under podman since

    2026-08-16, but both have restart=no and no Quadlet units, so they will not

    survive a reboot. tony-omen still runs a duplicate postgres container and six

    duplicate github-mcp-server containers that should be removed.

    Migration candidates (no GPU): redis, mddb + mddb-panel, raceman-php +

    raceman-web, status-api, weaviate. Must stay on tony-omen: GPU services

    (llama-server, imagen2, ollama, gpu-queue, gpu-queue-processor) and the caddy

    web edge. See ssot.containerization.yml, ssot.services.yml, and

    ssot.yomi-failover.yml for current disposition.

    '
  branch: tony-dell
  status: completed
  completed: '2026-08-17'
  started: '2026-08-17'
  priority: high
  tags:
  - tony-dell
  - podman
  - containers
  - migration
  - disk-pressure
  triage:
    urgency: 9
    importance: 8
    complication: 6
  subtasks:
  - label: Harden existing tony-dell podman containers with Quadlet units
    text: Convert chaba-postgres-16 and yomi-api to ~/.config/containers/systemd/*.container Quadlet units so they auto-start
      and survive reboot. Currently both have restart=no.
    status: completed
    completed: '2026-08-17'
    note: yomi-api.service already existed; generated chaba-postgres-16.service via podman generate systemd --new and enabled
      both
  - label: Decommission tony-omen duplicate postgres container
    text: Stop and remove the omen postgres container after verifying tony-dell chaba-postgres-16 is the primary per ssot.yomi-failover.yml.
    status: completed
    completed: '2026-08-17'
    note: No duplicate postgres container remains on tony-omen; tony-dell Quadlet unit is enabled and is the primary.
  - label: Remove six duplicate github-mcp-server containers on tony-omen
    text: docker rm the 6 stale ghcr.io/github/github-mcp-server containers (musing_bohr, thirsty_nobel, sleepy_ritchie, blissful_bassi,
      frosty_mcclintock, frosty_noether).
    status: completed
    completed: '2026-08-17'
    note: No github-mcp-server containers (running or stopped) remain on tony-omen; images also absent.
  - label: Migrate redis to tony-dell podman
    text: Move redis:7.4-alpine to tony-dell so yomi-api no longer crosses the tailnet for redis://100.75.102.88:6379. Update
      yomi-api env REDIS_URL to 127.0.0.1:6379.
    status: completed
    completed: '2026-08-17'
    note: Quadlet unit ~/.config/containers/systemd/redis.container enabled; yomi-api REDIS_URL set to tony-dell tailnet IP.
  - label: Migrate mddb + mddb-panel to tony-dell podman
    text: Move tradik/mddb:latest and tradik/mddb:panel-latest to tony-dell. Update Caddy reverse proxy on tony-omen to route
      /api/mddb/* and /mddb/* to tony-dell over the tailnet. Migrate the mddb data volume (~100MB).
    status: completed
    completed: '2026-08-17'
    note: Quadlet units enabled; Caddy on tony-omen routes to 100.68.142.13:11023 and :3002. mddb_mddb-data volume still exists
      on omen and can be reclaimed with user approval.
  - label: Migrate raceman stack to tony-dell podman
    text: Move raceman-web (nginx:alpine) and raceman-php (php-fpm) to tony-dell. Update Caddy to route :8083 to tony-dell.
      Frees omen disk.
    status: completed
    completed: '2026-08-17'
    note: raceman-web and raceman-php Quadlet units enabled; Caddy routes /apps/raceman/*, /apps/common.css, and /apps/nav.js
      to tony-dell:8083.
  - label: Assess weaviate migration to tony-dell
    text: Weaviate has no GPU dependency but depends on postgres (already on tony-dell). Measure working set size and migration
      risk before moving.
    status: completed
    completed: '2026-08-17'
    note: Migrated; ~40MB data copied. Weaviate Quadlet unit enabled on port 8084 because chaba-funnel binds 0.0.0.0:8082.
  - label: Update ssot.services.yml and ssot.containerization.yml with new disposition
    text: After each migration, update the SSOT to reflect the new host, runtime, ports, and Quadlet unit paths.
    status: completed
    completed: '2026-08-18'
    note: ssot.containerization.yml and ssot.services.yml already describe the tony-dell podman disposition and routing.
