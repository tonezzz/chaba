title: Kanban Board
subtitle: Live card system — cards in docs/ssot/kanban/cards/, board at /apps/board/
icon: layout
version: 1  # v1: live JSON page + board-api write path + kanban-dispatch executor

columns:
  - {id: lab,     title: "🧪 Lab"}
  - {id: backlog, title: Backlog}
  - {id: doing,   title: Doing}
  - {id: review,  title: Review}
  - {id: done,    title: Done}

rules:
  doing_limit: 2            # per session — soft warning only in pilot
  checkout_exclusive: true  # one claim per checkout — the merge-collision rule
  terminal: [done]

lab_rules:
  # Chaba Lab — the continuous-improvement lane. A lab card is a hypothesis,
  # not a task: it runs until its review_by date, then MUST either promote
  # (becomes a real backlog card) or retire (done + learnings in note/comms).
  # Nothing sits in lab forever — extend only with a new review_by + reason.
  flow: "lab -> backlog (promote) | lab -> done (retire)"
  review_by: "required; promotion decision is due on this date"
  review_sweep: "lab-review-sweep card — weekly check that no lab card is
                 past review_by without an outcome"
  outcome_record: "retired labs keep the card in done — the learning is the
                 artifact, record it in note/comms before closing"

card_dir: docs/ssot/kanban/cards
board_output: stacks/web/public/apps/board/index.html   # GENERATED — gitignored
json_output: stacks/web/public/apps/board/cards.json    # GENERATED — gitignored
renderer: scripts/render-board.py
# index.html/cards.json are intentionally UNTRACKED (2026-10-04): tracked
# generated files were the recurring merge-conflict source across parallel
# card sessions. The serving host regenerates them (chaba-board-render.timer
# 60s, or synchronously on every board-api write). Page self-updates: the
# page compares its baked page_version hash against cards.json's and
# reloads itself when they differ.

card_schema:
  # required
  id: "slug — matches the filename"
  title: "short human title"
  column: "backlog | doing | review | done"
  # optional — status
  claim: {session: "worker session/task id", since: "datetime"}
  note: "current status line shown on the card"
  updated: "YYYY-MM-DD or YYYY-MM-DD HH:MM"
  blocked_by: "card id or free text"
  help: "runbook markdown — shown via the ? help button"
  # optional — lab cards only (column: lab). Continuous-improvement contract:
  lab:
    hypothesis: "what we expect to learn or prove"
    metric: "how we measure it — a number or observable state"
    review_by: "YYYY-MM-DD — promote/retire decision due"
    outcome: "promote | retire | extend — written when decided"
  # optional — hands-off execution (the Start button)
  spec: "full task text — what gets dispatched; be self-contained"
  action:
    type: "dispatch | manual"        # dispatch => devin-dispatch start
    status: "idle | queued | running | done | failed"
    button: "label override (default ▶ Start / ↺ Retry / ✔ Close)"
    repo: "chaba | ada-pi | sunsynk-card | mddb-fork — devin-dispatch
           whitelist ($DISPATCH_DIR/repos.conf: name path default_branch)"
    host: "optional — pin the card to one host's dispatcher (e.g. idc01
           for mddb work). Unpinned = first eligible host under cap."
    runner: "hostname that claimed/executed — written by the dispatcher"
    task_id: "devin-task-* id — written by kanban-dispatch"
    result: "outcome text — written when the run finishes"
  # optional — standard CI pipeline (docs/ssot/ssot.ci.yml). Opt in with
  # the scalar `pipeline: ci`; the runner (scripts/ci/card-pipeline.py)
  # normalizes it to the status block on first run:
  pipeline: "ci   # opt-in scalar — becomes a map after a run:
    {opt_in: ci, started, updated,
     stages: {plan|structure|develop|audit|benchmark:
               {status: pass|fail|skip|delegated|blocked, at, detail}},
     benchmark: {metric, before, after, command, measured_at}}"
  # optional — benchmark declaration the benchmark stage consumes.
  # command is run in the worktree; last stdout line = the measured value.
  benchmark:
    metric: "what good looks like (also accepts legacy metric:/verify:)"
    command: "optional shell — prints the measured value"
    before: "optional seeded baseline"
    after: "written by the runner"
  # optional — needs-me items for Tony (button to answer on the card)
  requests:
    - id: "short-slug"
      ask: "question"
      options: "optional list — renders one-click answer buttons instead of
        a free-text box. Items are strings ('A — syncthing clipboard dir')
        or {id, label} objects. Answering posts the option text."
      status: "open | answered"
      answer: null
  # optional — append-only log; every actor writes here (board shows last 4)
  comms:
    - {at: "YYYY-MM-DD HH:MM", from: "devin | ada | chaba | tony", text: "..."}

write_path:
  api: "board-api.service on tony-dell 127.0.0.1:8787 (scripts/board/board-api.py);
        Caddy proxies /apps/board-api/* (prefix stripped). Tailnet-gated."
  endpoints:
    "POST /action {id, do: queue|close|hold|retry}":
      "queue: action.status->queued (idle/failed/done cards; column resets to
      backlog from done/review). close: column->done. hold: ->backlog."
    "POST /respond {id, request_id, answer, from?, reopen?}":
      "answers a requests[] entry; from ∈ devin|ada|chaba|tony (default tony —
      the board UI sends none). 400 'answer required' on empty answer; 400
      'already answered' on re-answer unless reopen:true (logs 're-answered')."
    "POST /comment {id, from, text}": "appends comms; from ∈ devin|ada|chaba|tony;
      400 'text required' on empty/whitespace text"
    "POST /request {id, ask, request_id?, options?, from?}":
      "raises a requests[] entry {id, ask, status: open, options?}; id is
      request_id or a slugged ask. 400 on missing ask or duplicate id. The
      ONLY safe way for agents/Ada to add a request — direct card-YAML
      edits race the write flock (must hold /tmp/board-api.lock)."
    "POST /action {id, do: claim, host}": "atomic first-wins claim under the
      write flock — for multi-host dispatchers. Sets action.runner."
    "POST /pipeline {id, opt_in?, pipeline?, stage?, status?, detail?, from?}":
      "CI pipeline write path (docs/ssot/ssot.ci.yml) — opt_in:true writes
      the `pipeline: ci` shorthand, pipeline:{...} deep-merges the status
      block (stages preserved), stage+status records one result."
    "GET /cards": "live cards.json payload — agents read board state here"

execution:
  dispatcher: "kanban-dispatch.timer (2min) -> scripts/board/kanban-dispatch.py —
               scans action.status==queued, devin-dispatch start <repo> <spec+rails>,
               writes task_id/claim/runner; polls running tasks, on finish -> status
               done, column review + session-end comms when the worktree is
               dirty (uncommitted file count) or the session branch has
               commits not in origin/<default_branch>. Tony reviews and
               presses Close."
  worktree_base: "devin-dispatch cuts worktrees from origin/<default_branch>
               (repos.conf; best-effort fetch first) — never the checkout's
               current branch, so a repo parked on a stale branch can't
               poison new sessions (sunsynk-bat34 failure mode)."
  merge_guard: "board-api apply_merge_guard (scripts/board/dispatch_repos.py)
               gates every transition into done (close + move->done):
               git merge-base --is-ancestor <session-head> origin/<default>
               in the target repo — non-ancestor => comms 'unmerged commits
               remain on <branch> (N not in <base>)' and the card stays in
               review. Resolved via action.task_id -> DISPATCH_DIR
               tasks/<id>/meta.json {worktree, branch, default_branch} with
               fallbacks (~/CascadeProjects/dispatch-wt-<id>, dispatch/<id>
               branch scan across whitelisted repos, origin/HEAD ->
               master|main probe). Unresolvable sessions log a skip note and
               allow — the guard never wedges the board. Dirty worktrees
               never block; the leftover file count rides along in the
               comms line."
  concurrency:
    # today's model — one dispatcher per host, caps local:
    host_cap: "KANBAN_HOST_CAP env on the dispatcher (default 3; tony-dell is
               RAM-tight — dispatch-queue.sh used the same cap)"
    multi_host: "devin-dispatch exists only on tony-dell today. To dispatch
               elsewhere: install devin-dispatch + a remote runner on the host;
               remote runners poll GET /apps/board-api/cards for queued cards
               whose action.host matches (or unpinned), claim atomically via
               POST /action do=claim {host} (flock-serialized — no double
               dispatch), run locally, and agents post comms back over tailnet.
               Card should fetch first — worktrees cut from origin/<default>."
    merge_safety: "parallel sessions converge on origin/master; generated files
               (index.html, cards.json, *-assessment.yml) are the recurring
               conflict source — prefer regenerating over hand-merging them"
  task_rails: "dispatched agents are told to post progress via POST {api}/comment
               and to raise questions via POST {api}/request instead of
               blocking on Tony (never direct card-YAML edits — flock race)"
  render: "chaba-board-render.timer (60s, --if-changed) catches edits not made
           via the API; the API renders synchronously on every write"
  persistence: "kanban-commit.timer (15min) — scoped git add of docs/ssot/kanban/
               + apps/board/ in chaba-tony-dell, commit, rebase, push"

update_path:
  # why the board was stale before v1:
  #   cards were edited in the `chaba` checkout but the web container bind-mounts
  #   chaba-tony-dell/stacks/web — nothing re-rendered or synced. Now:
  #   1. every API write re-renders synchronously in the SERVED checkout
  #   2. the 60s render timer catches out-of-band edits
  #   3. the page polls cards.json every 30s — no manual refresh needed
  #   4. kanban-commit pushes the state back to git for the other checkouts

page_standard:
  layout: cms-full
  reference: ada-pi/pwa/cms/index.html
  # The board follows the CMS page layout: nav (back link, title, EN/ไทย
  # toggle, refresh), filterable left sidebar, viewport-locked main pane
  # on md+, italic provenance footer ("Generated by ..."). Palette:
  # bg #1a1a2e, card #16213e, accent #0a84ff. Any kanban CMS surface
  # must keep this shell — it is the declared standard for board pages.

ops:
  # The kanban ops lanes — every timer that reads or writes cards.
  # Add a lane: new health/generator script + job entry in ssot.jobs.yml.
  lanes:
    - {id: kanban-dispatch, interval: "2min",  role: "action.queued cards -> devin-dispatch sessions -> review"}
    - {id: chaba-board-render, interval: "60s", role: "cards.yml -> cards.json + board page (--if-changed)"}
    - {id: kanban-sync, interval: "15min", role: "health lanes (cms-auto-*, logs-auto-*) -> cards -> push + dev-kanban CMS render"}
    - {id: kanban-commit, interval: "15min", role: "scoped commit+push of cards/ from the served checkout"}
    - {id: devin-dispatch-watch, interval: "15min", role: "watch local devin-task-* units, notify"}
    - {id: lab-review-sweep, interval: "weekly", role: "lab cards past review_by must promote or retire"}

  column_sla:
    # Efficiency is measured as time-in-column, not velocity:
    backlog: "unbounded; >90d untouched = retire-or-replan candidate (sweep)"
    doing:   "soft cap 2/session; >3d claimed with no comms = stale claim, reclaimable"
    review:  "Tony's queue — target <10 open; >48h waiting = the bottleneck is
              review bandwidth, not automation"
    lab:     "bounded by review_by; past date with no outcome = sweep violation"
    done:    "terminal; verified-by evidence expected in note/comms"

  cadence_rule:
    # When to adjust a lane's timer — decide by detection SLA + churn,
    # not by feel. A tick is ~15s wall / 1s CPU, so cost is not the driver;
    # detection latency is.
    floor: "5min — a tick includes pull+health+commit+push+MDDB write (~30s);
            below this, writes can interleave"
    tighten_when:
      - "a new lane's detection SLA is shorter than the current interval
         (e.g. severe-log spikes must surface in <15min)"
      - "queued->claim or incident->card latency measurably exceeds the
         interval in 2+ incidents"
    loosen_when:
      - "zero generated-card churn for 7+ consecutive days AND no lane
         reports stale-during-window"
    judge: "adjust the interval only when a named SLA is violated; record
            the change + reason in comms on kanban-system"

note: >
  Focus-inbox stays the alert queue; this board tracks CHOSEN work.
  Cards are the shared comms channel: Devin, Ada, Chaba automation and
  Tony all read/write the same fields — status in `action`, questions in
  `requests`, progress in `comms`.
