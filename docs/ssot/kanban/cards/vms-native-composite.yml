id: vms-native-composite
title: VMS native capture — multi-pane one-shot composite
column: backlog
priority: low
note: >-
  Today every native-res pull is serial: activate channel -> ~18s attach +
  BMP->PNG. Wall refresh for a 5-cam DVR costs ~90s+. Idea: bind several
  channels to panes once, take ONE monitor-composite native shot, split into
  tiles. Per-pane OSD icon x-position depends on the active layout (single
  ~1599, 4-pane-focus ~1042) — recalibrate channels.json per layout. See
  docs/ssot/ssot.learning.vms-native-snapshot.2026-10-03.yml.
updated: '2026-10-03'
