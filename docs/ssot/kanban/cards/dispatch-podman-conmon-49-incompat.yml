id: dispatch-podman-conmon-49-incompat
title: Dispatch fails on podman 4.9.3 hosts — conmon rejects --log-tag (con01/idc02/idc03)
column: backlog
updated: 2026-11-26 13:02
priority: high
tags:
- dispatch
