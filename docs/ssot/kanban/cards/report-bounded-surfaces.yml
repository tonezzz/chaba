id: report-bounded-surfaces
title: Bounded surfaces — shared budget/noise machinery for the report pipeline
brief: 'The report registry now declares the standard (bounded_surfaces in ssot.reports.yml): every rendered surface
  gets limits, suppression, explicit empties, and ordered overflow — the same knobs the memory render just gained.
  This card implements it: extract the shared helpers, wire the L3 system report as pilot, and teach report-watch
  to flag surfaces that breach their declared budget.'
column: done
priority: medium
created: 2026-10-08
updated: 2026-10-10 03:36
pipeline: ci
autonomy: t2
metric: 'SYSTEM-REPORT.md renders with a declared budget: over-budget sections shed in declared order (not arbitrary
  crop), an empty section shows ''_(empty — ran clean)_'', and meta.extra.chars is recorded per rendered node. Memory
  render and report render share the same helper code — no duplicate truncation logic.'
verify: Render SYSTEM-REPORT with an artificially tiny limit -> sections shed in overflow_order with markers; a
  clean-run section renders the empty marker; meta records chars. render-memory.py keeps passing its render unchanged
  after the lib extraction (diff before/after context.md).
spec: "1. scripts/lib/bounded.py (new): extract from render-memory.py —\n   apply_budget(lines, soft, hard), dedupe_consecutive\
  \ (×N),\n   drop_patterns, skip_status filter, entry cap. render-memory.py\n   imports from it (behavior must\
  \ not change — diff a render).\n2. scripts/report-system.py (pilot L3): read limits/overflow_order/\n   empty/suppress\
  \ from the node's registry entry; render through\n   bounded.py; write extra.chars via lib/report.py::write_meta.\n\
  3. ssot.reports.yml: add limits/overflow_order to the system-report\n   node only — other nodes opt in as their\
  \ producers get wired\n   (follow-on work, not this card).\n4. report-watch.py: flag nodes whose meta.extra.chars\
  \ > declared hard\n   limit (new BAD-class: 'overrun' is informational — report via a\n   focus-inbox note, don't\
  \ page).\n5. Do NOT add budgets to L0 artifact writers — bounded_surfaces is\n   rendered-surface only (the registry\
  \ section says why).\n\nAfter the pilot proves out, rolling the fields onto other rendered\nnodes is a per-node\
  \ follow-up — this card is the machinery + one\nworking example, per the usual demo pattern.\n"
