id: mddb-backup-tier2-idc02
title: 'Off-host backup tier: idc03 leader/cms sets → idc02'
column: done
updated: 2026-11-23 19:11
spec: 'idc02 already stores its own compressed mddb-ops backup (75M). Add an off-host copy tier: rsync/scp the gzipped
  leader + cms sets from idc03 to idc02 ~/mddb-backups-tier2/ after nightly backup, same 3-day retention. LAN-cheap
  insurance against idc03 loss (90% disk).'
