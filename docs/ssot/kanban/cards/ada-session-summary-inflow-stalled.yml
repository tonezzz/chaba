id: ada-session-summary-inflow-stalled
title: Ada session-summary feed stalled — recall-summary collections get no new docs since early Oct
column: review
updated: 2026-11-25 15:17
spec: 'Found while shipping memory-extract-merge-proposals (2026-11-18): memory-distill.timer runs Sun 09:45 on
  idc03 and exits SUCCESS but reports 0 new session summary docs in every ada-ha-recall-summary-* collection. Verified
  newest docs: ada-ha-recall-summary-tony=2026-10-03, -dev=2026-10-09, -kk=2026-10-13, -ada-dev=empty. Downstream
  effect: no source=extract drafts since ~2026-10-17 (~480 stale drafts sit unreviewed), so consolidate + merge-proposals
  pipelines have no inflow. Investigate: where session summaries are written now (moved collection? writer dead?
  renamed?), and whether memory-distill should read a different source. Evidence: systemctl --user status ada-memory-distill
  on idc03 shows last run 2026-11-15 09:45 status=0 with 0 new docs in all 7 recall-summary collections; MDDB /search
  on each collection confirms newest addedAt early Oct.'
ref: ADA-0209
