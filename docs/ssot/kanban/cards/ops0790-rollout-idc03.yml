spec: 'OPS-0790 host rollout on idc03 — Tony-approved deploy step (2026-11-07). Prereq: chaba repo at commit 7b5f86014
  or later (origin/master). Steps: (1) python3 scripts/render-jobs.py --host idc03 --ids embed-lane-news,embed-lane-lessons,yomi-update-active
  --install — writes only those unit pairs to ~/.config/systemd/user, daemon-reload, enables --now exactly those
  3 .timer units. (2) Verify each: systemctl --user list-timers <id>.timer shows armed; then one forced run per
  job: systemctl --user start <id>.service and check status/journal — a job runtime failure is data, not a blocker:
  record it, leave the timer armed. (3) Do NOT touch chaba-jobs.timer or any other unit; no other systemctl verbs;
  no package installs. (4) Commit a short rollout note to docs/reports/ops0790-rollout-idc03.md with per-job armed+first-run
  results; push or patch-relay per runner capability.'
