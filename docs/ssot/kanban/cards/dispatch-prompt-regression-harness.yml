id: dispatch-prompt-regression-harness
title: build_task regression harness — prompt-layer gates for rails and primer
column: doing
updated: 2026-11-09 16:09
brief: 'The dispatch prompt is the highest-blast-radius, lowest-verification artifact in the system: rails and primer
  merge on anecdote while micro-models get golden/hard/adversarial gates. Add a regression suite that pins build_task''s
  contract plus a byte-budget tripwire on rail accretion.'
priority: medium
tags:
- dispatch-tuning
- tests
- kanban
spec: 'New tests/board/test_build_task_regressions.py (pytest, same conventions as test_lesson_primer.py).


  Fixture cards replaying historical dispatch scenarios (build dicts in-test, mirror real card shapes):

  1. Normal card with spec — output contains spec verbatim, then TASK_RAILS with the card id + api url substituted.

  2. Retry card (action.attempts=1 + last_failure=''boom'') — RETRY_RAILS present, contains ''attempt 2'' and the
  failure text; absent for a fresh card.

  3. Report-linked card (report: slug) — REPORT_RAILS present with slug; absent otherwise.

  4. Card with no spec — falls back to title+note without crashing.

  5. KANBAN_PRIMER=0 env — no KNOWN_PITFALLS block even when primer candidates exist.

  6. Primer-on path (monkeypatch lp.build to return lines) — KNOWN_PITFALLS appears AFTER TASK_RAILS and BEFORE
  RETRY_RAILS/REPORT_RAILS; <=8 lines.

  7. Budget tripwire: render TASK_RAILS + RETRY_RAILS + REPORT_RAILS with a fixture and assert total fixed-overhead
  bytes <= 6000 — the point is a deliberate bump when rails accrete, not silent growth. Put the constant at the
  top of the test with a comment: ''rail accretion tripwire — raise only deliberately''.


  Also add tests/board/test_prompt_budget.py only if needed — prefer folding everything into the one regression
  file.


  Verify: pytest tests/board green; run the full tests/ suite to catch import side-effects (monkeypatch of lp must
  not leak).'
