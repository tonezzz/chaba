spec: Evaluate replacing MediaPipe with in-browser YOLO using ONNX Runtime Web/WebGPU for hand gesture
  detection within the /apps/eye/ project of the chaba repository. The work must be performed on host
  tony-dell. Constraints include ensuring all dependencies are compatible with the existing browser-based
  stack and maintaining local execution without external API dependencies. The verifiable done-condition
  is a working prototype integrated into /apps/eye/ that successfully runs YOLO gesture detection locally
  via ONNX Runtime Web/WebGPU with a documented evaluation of performance compared to MediaPipe.
