  tailnet + session ready (Listening). HA onboarding completed with user kk
  (owner; temp password set at bootstrap — KK should change it in her
  profile). This is the template for member-node provisioning — the standard
  procedure: (1) quadlet + minimal config on tony-dell, own loopback port +
  AddHost tailnet pins; (2) tailscale serve --https=<port>; (3) ada-<member>
  backend on idc03 (own env + keys file, ADA_INSTANCE_ID=<member>);
  (4) idc02 edge block + /ada-ws/<member> + DNS CNAME -> edge.surf-thailand.com
  + CF Access app scoped to member email; (5) preseed .storage dashboard +
  lovelace_resources before first boot; (6) member onboards via UI = node
  owner. Identity model: person.<member> shared across nodes; role per-node
  (owner/member) via HA user + Ada person policy.
