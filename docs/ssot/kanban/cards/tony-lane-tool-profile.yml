  -> render-tool-profiles.py -> ADA_INCLUDED_TOOLS managed block). Tony asked ''same tool set as kk-ha'' — the MECHANISM,
  not the literal 24 tools: kk''s list deliberately strips all home control/casting (security boundary), and ada-ha-tony''s
  7-day call log shows heavy use of tools kk''s list lacks. Copying it verbatim would silently kill Chaba''s home
  control — that is NOT the intent.


  DO:

  1. Add persons.tony.tools {instance: tony, env_file: ada-ha-tony.env, host: idc03} in ssot.apps.ada-persons.yml.

  2. include: = kk''s 24-tool list PLUS the tony-lane additions evidenced by ada-ha-tony function_call logs (7d):
  get_rk600_weather(1507), get_home_state, home_search, control_entity, ada_resolve_action, ha_confidence, cast_to_screen(814),
  cctv_wall, ada_camera_snapshot, vcast_snapshot, tv_action, gev_command, docs, drive, kanban, devin, devin_read,
  ada_device_acl, ada_member_keys, ada_enroll_speaker, ada_ops, percussion, yt, ada_look, ada_track_device, cms_edit
  already in kk list. Reconcile every name against the real declared surface (tool-lint collect_surface + _ALIASES)
  — use DECLARED seat names, absorbed names resolve via aliases.

  3. exclude: = the complement (deliberate drops — lint requires every declared tool covered by include OR exclude).

  4. Run render-tool-profiles.py --lint; fix stale names.

  5. --apply to idc03 ada-ha-tony.env + systemctl --user restart ada-ha-tony.

  6. MEASURE: open a fresh ws session, read first ''usage turn in='' before vs after — target <= ~23k (from ~31k).
  Report both numbers in card comms.

  7. REGRESSION: tests/scenarios-live/context_growth.yaml must still pass ceiling+floor; run a quick live smoke
  — cast_to_screen + control_entity + a memory recall all still resolve.

  8. Update docs/ssot/ssot.tokens.policy.yml baseline number + ssot.apps.ada-persons.yml comment noting tony-lane
  profile is usage-evidenced (not kk-parity).


  WATCH-OUT: the scenario smoke suite runs admin sessions on this lane testing tools like cast_to_screen/set_facial_expression
  — both stay in the keep-list. If a scenario-tested tool got excluded, either keep it or note the scenario needs
  retargeting (BEN-0573 moves smoke to ada-dev anyway).'
