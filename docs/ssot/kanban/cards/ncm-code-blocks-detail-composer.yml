id: ncm-code-blocks-detail-composer
title: NCM code-block composer — detail by layer (Variant B, review)
column: review
updated: 2026-11-25 20:30
brief: 'Tony 2026-11-24: use NCM to generate code from our prepared nest modules like Lego blocks, with detail increasing
  by layer (NCM coarse-to-fine levels). Design doc for review: docs/kb/ncm-code-blocks-design.md. Variant B selected
  for the first probe: Jev/nest picks the block skeleton, NCM generates the detail levels.'
priority: medium
tags:
- ncm
- code-generation
- nest
- blocks
- design
- research
spec: 'Per docs/kb/ncm-code-blocks-design.md. Variant B: keep Jev/nest as the block-sequence decision plane (deterministic
  compat gate), use NCM only as detail generator — given a chosen skeleton, refine L1 contracts -> L2 wiring ->
  L3 code/pack.yml + tests. P0 (offline, no GPU): freeze corpus of real pipelines/diffs, define level encoding (L0
  = block IDs, higher = code tokens), hand-label L0, verify deterministic decoder emits schema-valid pack; gate
  = replayable from manifest.json, zero provider calls, zero authority violations. P1: CPU/micro tokenizer+generator
  toy, reuse ncm-thai loops, stop if reconstruction gate fails. P2: benchmark Jev+nest+LLM glue vs Jev+nest+NCM
  detail vs full NCM, 3 paired reps, deterministic verifier primary / LLM judge secondary. P3: shadow then promotion
  only behind pre-registered floor. Guardrails: generated code never sets allowed_paths/tools/credentials/human
  gates; Nest owns queue; no paid GPU/API or account-tier change without explicit approval. Reject absent verifier-backed
  gain over the existing lane.'
note: 'Design doc: docs/kb/ncm-code-blocks-design.md. Related: docs/kb/ncm-jev-nest-exploration-procedure.md, docs/kb/jev-code-decision.md.
  Honest limit: NCM levels currently span token positions, not code structure — the L0 block-ID encoding is the
  crux; if it fails, feed NCM a fixed L0 from Jev and train only detail levels.'
ref: OPS-1325
