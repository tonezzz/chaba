note: >-
  E2E pass over the dub pipeline before scaling past the minimal test.
  Pros of cue-level edge-tts: free, offline-capable cache, reuses existing
  VTT + HLS plumbing, decent TH/EN voices, no new infra. Cons: cue timing
  is rough (stretch/pad sounds mechanical on long/short lines), no
  speaker separation, auto-caption errors flow straight into TTS, flat
  ducking drowns music/fx uniformly, no lip-sync (fine for info videos,
  bad for dialogue). Improvements ranked: (1) cue-fit TTS — pick voice
  rate per cue instead of post-stretch; (2) caption QC gate — flag cues
  with too few chars or implausible duration before TTS; (3) sidechain
  ducking keyed to dub segments instead of flat 20%; (4) voice-mode
  selector (off/TH/EN) on the cast URL; (5) voice casting — match a TTS
  voice to each detected speaker (gender/age/tone), consistent for the
  whole video, tracked in yt-voice-dub-cast + verified via
  yt-voice-dub-scenarios benchmark; (6) only if demand proves out:
  cloud neural TTS or full speaker-aware dub. Boundary: no voice
  cloning, lip-sync, or cloning-grade diarization until the minimal
  test lands.
help: 'parent test: yt-voice-dub-test; same pipeline refs'
