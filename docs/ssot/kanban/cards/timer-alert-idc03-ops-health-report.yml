  text: 'TRIAGE 2026-11-27 ~16:30 (read-only: idc03 user journal + mddb.service journal). Root cause = MDDB primary
    OOM-killed at 15:58:20 (exit 137), systemd restarted it 15:58:53, then cold start took ~104s: health endpoint
    opened on 11023 at 15:58:55 but ''mddb HTTP listening'' (full /v1 routes) only at 16:00:37. The 16:00:00 ops-health-report
    tick posted at 16:00:36 — one second before listeners came up — got HTTP 404 on POST /v1/add to 100.102.134.91:11023
    and exited 1. Recovery verified: 16:15:00 tic'
