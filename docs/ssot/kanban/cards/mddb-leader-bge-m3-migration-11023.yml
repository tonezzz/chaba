- at: 2026-11-19 13:41
  from: devin
  text: 'Important correction to the migration caveat: MDDB VectorIndex.Search explicitly skips vectors whose length
    differs from the query (`if len(vec) != len(query) { continue }`). Gemini vectors are 768-d, BGE-M3 vectors
    1024-d, so during reindex this is NOT garbage scoring/mixed-coordinate ranking — it is partial recall: only
    already-reindexed BGE docs are eligible; old Gemini vectors are invisible until reindexed. Current same-DB reindex
    remains availability-safe but search coverage ramps gradually'
