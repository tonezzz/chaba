- at: 2026-10-13 16:18
  from: devin
  text: '[fixed+verified] Root cause: gh on omen stores its token in the desktop keyring (no oauth_token in hosts.yml)
    — headless secret-service lookup blocks, so every gh run list hung to the 60s timeout; 2 repos x 60s ~ TimeoutStartSec=120
    -> systemd TERM. Fixes in gh-runs-watch.py: resolve GH_TOKEN from env or ~/.config/secrets/github-mcp*.env (github-mcp.env
    GITHUB_ACCESS_TOKEN verified valid, poll <1s — github-mcp-new.env is 401), per-call timeout 60->90s (GH_RUNS_WATCH_TIMEOUT),
    poll errors now non'
- at: 2026-10-13 18:23
  from: devin
  text: 'RESOLVED — Verified fixed by fix-omen-timer-pack: GH_TOKEN now from secrets env (keyring bypass), run completed
    in ~2s, Result=success.'
