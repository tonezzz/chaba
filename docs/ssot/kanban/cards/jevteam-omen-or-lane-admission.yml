  Add live preflight for Omen 8777/8778 and OR gateway/quota, matched held-out benchmark against KK-Mac/OpenCode/Devin,
  and normalized decision envelope: executor/provider/model/lane/task_class/artifact/expect/max_tokens/cost_budget/fallback.
  Do not enable automatic production routing until health, verifier quality, and cost gates pass.'
