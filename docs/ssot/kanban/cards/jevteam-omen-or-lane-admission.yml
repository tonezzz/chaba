id: jevteam-omen-or-lane-admission
title: Add Omen and OpenRouter lanes to JevTeam admission ladder
column: backlog
updated: 2026-11-14 14:06
brief: Make Omen local Jev decision services and OpenRouter free/paid tiers dependable optional lanes with health,
  quota, cost, verifier, and fallback gates.
priority: high
program: ai-workforce
tags:
- jevteam
- omen
- open-jev
- openrouter
- litellm
- fallback
- benchmark
spec: 'Define and benchmark Omen and OpenRouter as separate JevTeam lanes. Omen: local decision-plane scoring, lane
  classification, audit/replay, privacy-sensitive async work; must not execute mutations. OpenRouter: LiteLLM-controlled
  free and paid tiers with per-key/model budget, max tokens, 401/402/429/timeout fallback, cost ledger, no secrets.
  Add live preflight for Omen 8777/8778 and OR gateway/quota, matched held-out benchmark against KK-Mac/OpenCode/Devin,
  and normalized decision envelope: executor/provider/model/lane/task_class/artifact/expect/max_tokens/cost_budget/fallback.
  Do not enable automatic production routing until health, verifier quality, and cost gates pass.'
ref: BEN-1050
