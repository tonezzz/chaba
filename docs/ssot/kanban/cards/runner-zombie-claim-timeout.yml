id: runner-zombie-claim-timeout
title: 'Runner zombie-claim: board-api write commits after client timeout'
column: done
updated: 2026-11-14 14:06
brief: POST /action claim can commit server-side while the runner api() client times out at 30s — card lands status=running
  with no unit and no state.json entry; nothing ever finishes it. Observed 2026-11-07 on opencode-executor-routing-smoke
  during the board-api flock storm.
priority: high
tags:
- runner
- board-api
- bug
spec: 'Reconcile path needed: either claim returns a claim_token/tid the runner must confirm, or a sweeper detects
  running+no-task_id+no-unit older than N minutes and requeues. Runner finish POST result is also ignored (api()
  error swallowed) — a timed-out finish leaves the same zombie.'
action:
  type: manual
  status: done
ref: OPS-1071
comms:
