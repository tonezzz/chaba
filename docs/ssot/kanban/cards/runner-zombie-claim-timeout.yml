  from: chaba
  text: 'WARNING: action.type=manual — kanban-dispatch claims only type=dispatch; this card will starve in queue'
- at: 2026-11-07 16:30
  from: devin
  text: 'FIXED — PR chaba#85 (364c6371). runner-agent now runs reconcile_pass() every pass before claim_pass: any
    card status=running + runner=self missing from state gets adopted when a devin-task-<cid>-* unit exists (also
    heals runner restarts that lost state.json), or restarted via start_task under the same claim when no unit exists;
    restart failure finishes ok:false so it cannot zombie twice. kanban-dispatch claims skipped via action.task_id/claim.session
    guard. Deployed: idc02+idc03 exec checkouts p'
