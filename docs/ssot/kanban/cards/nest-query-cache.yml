id: nest-query-cache
title: Semantic query cache — Weaviate (or MDDB) layer for repeat memory queries
brief: 'Add a semantic cache in front of ada_memory_search: store {query embedding -> result} so a repeated or paraphrased
  question returns instantly instead of re-running embed + multi-bank vector search. Includes the cache-policy standard (what
  may be cached, TTLs, invalidation) and a bench suite so hit quality is measured continuously in the Nest loop.'
column: done
priority: medium
program: chaba-nest
area: ada-tools
note: 'Weaviate has no native query cache — implement it as a collection (query_embedding + bank scope + payload + TTL). Alternative:
  same pattern inside MDDB as a query-cache collection — one less moving part, but Weaviate keeps the experiment isolated
  from the memory store. Decide in phase 0 from the latency data — whichever hosts it, the contract is the same. Sibling card:
  nest-bank-router (router covers fresh queries; cache covers repeats — the instrumentation shows the split).'
spec: "Phase 0 — prove the case first:\n- From the nest-bank-router instrumentation: what fraction of real memory\n  queries\
  \ are near-repeats of earlier queries? If <~15%, the cache is a\n  niche win — scope it accordingly. Publish the distribution\
  \ in the doc.\nPhase 1 — cache-policy standard (the durable artifact):\n- Cacheable: curated memory banks (read-heavy, write-light),\
  \ CMS page\n  lookups, report summaries.\n- Never cache: live state (sensors/entities, \"is X on\"), time-sensitive\n  asks\
  \ (\"today/latest/now\"), per-turn session state.\n- Key = normalized query embedding + bank scope + speaker scope.\n  Hit\
  \ threshold tunable (start cosine >=0.92). TTL per bank class;\n  curated banks additionally invalidate on ada_remember\
  \ writes to that\n  bank (version-stamp per bank, bump on write — no per-entry eviction\n  needed).\nPhase 2 — implementation:\n\
  - query-cache collection in Weaviate (or MDDB per phase-0 call):\n  {query_vec, bank_scope, payload, bank_version, ts, ttl}.\n\
  - ada_memory_search: check cache first (single embed + one lookup);\n  hit -> return; miss -> real path -> store result.\n\
  Phase 3 — bench suite `query-cache` in ada-pi tests/bench/:\n- golden: exact repeats + obvious paraphrases -> must hit (and\
  \ return\n  the same result).\n- hard-negative: similar-but-different queries (\"what did I ask Ada\n  yesterday\" vs \"\
  what did Ada promise yesterday\") -> must NOT hit.\n- freshness: query issued after a bank write -> must not serve stale.\n\
  - report: hit-rate, false-hit rate, latency saved p50, staleness events.\nAcceptance:\n- policy doc in ssot; suite exists\
  \ and champ config passes all tiers;\n  measured p50 on repeat queries reduced >=80%; zero stale answers in\n  freshness\
  \ tier; results publish bench/cache-* docs to\n  ada-ha-scenario-reports (CMS rides the bench-edge extension).\n"
help: Reuses the bank-router corpus (same transcripts). Threshold is a tunable the Nest loop can bench per candidate config
  — hit-rate vs false-hit is the classic cache tradeoff curve; plot it. Weaviate MCP server (mcp-weaviate) already exists
  for experimentation.
