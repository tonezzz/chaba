spec: 'KK permitted using her Mac Studio (kk-mac, Mac16,9 M4 Max 36GB, macOS 15.7.3) for Ada Nest experiments —
  verified via SSH 2026-10-21. Gaps before it can host anything: (1) Tailscale install — REQUIRED since the machine
  travels with KK; gives away-from-home reachability on the tailnet like her kk-macbook. (2) Power policy — pmset
  sleep=1min kills sessions; set sleep 0 on AC + keep wake-for-network-access (womp already on). (3) Tooling — no
  brew/ollama/docker; install brew + whatever the member lane needs, services as LaunchDaemon (boot-level, not her
  login). (4) Optional: Wi-Fi is 2.4GHz-only at her desk (RSSI -68dBm, 28Mbps) — wired .80 is primary anyway, fine.
  All changes need KK sign-off at install time — see lesson ada-nest-hardware (post 1775).'
note: 'SSOT done: device_id kk-mac in mac-address-registry + host-roles.yml (offload: apple-silicon-workstation).
  Router admin still locked — needs sticker password for DHCP table (last checked 2026-10-21).'
