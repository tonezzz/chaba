brief: 'Ada chat card shows a greeting every ~5min while client ws stays connected. Server side on ada-ha-tony (idc03):
  provider stream ends -> reconnect -> "prime injected (resumed=False)" -> fresh greeting pushed into the same chat.
  142 Live connects in 90min. Each cold reconnect re-bills system+tools+prime (~2.6k chars) and generates a greeting
  — measured single-session totals of 115k input tokens. Yesterday''s rotate-resume fix (a7c2398, deployed) covers
  voice rotates but NOT this lane: chat connects with no_persist=1 so every provider drop = cold session + amnesia
  + re-greet. Likely driver underne'
