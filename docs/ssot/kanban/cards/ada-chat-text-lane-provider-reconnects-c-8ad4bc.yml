spec: 'In ada-pi pwa_server/realtime_provider text-chat path: (1) carry a resumption handle across provider reconnects
  for no_persist chat sessions the same way voice rotates do — or suppress the greeting on provider-side reconnect
  (no-greet flicker directive already exists for voice); (2) verify what actually ends the stream every ~5min on
  an idle chat — if it is the context-budget rotate firing on idle sessions, the budget accounting for a text lane
  should not rotate a quiet session; (3) do not regress the voice path. Repro: watch journalctl -u ada-ha-tony for
  "prime injected (resumed=False)" while an ada-chat-card sits open.'
