  text: 'Recommended terminology for the next phase: use `/ada process <ref>` only as a bounded lifecycle coordinator,
    never as an unconditional ''do everything until finished'' command. Define phases explicitly: observe/rank ->
    plan -> handoff -> start (explicit dispatch approval) -> run in isolated worktree -> verify -> review-ready
    -> approve -> merge -> deploy. Ada must not approve her own work; promotion is capability-scoped autonomy with
    separation of duties. Suggested tiers: T0 observe/rank, T1 plan'
