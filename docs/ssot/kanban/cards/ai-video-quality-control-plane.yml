spec: 'Extend the existing Ada Nest documentary pipeline with asset identity and continuity control. Implement in
  stages: P0 immutable per-shot manifest + asset IDs + scratch-VO timing + technical QA; P1 character/object/location
  bibles + continuity ledger + DWPose/depth controls; P2 deterministic Blender/stock/space scenes + Gaussian/camera
  plates + SCoPE camera control; P3 small VBench/T2V-CompBench/VideoScore2 fixture and scene-graph grounding. Preserve
  LTX/VYNCX and durable pack artifacts; every stage needs a verifier and an approved-take manifest. Research preview
  is in Education post 2477.'
note: Wide GitHub/Google research checked 2026-10-25; candidate techniques include StoryDiffusion, DWPose, SCoPE,
  DepthFlow, BlenderProc, SISIFOS, FlyByGen, FILM/RIFE, OmniSG, VBench, T2V-CompBench, VideoScore2, and production
  pipeline precedents.
