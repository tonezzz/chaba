spec: 'Tony rule (2026-11-07): whenever he asks a coaching/knowledge question — "educate me", feedback, how-it-works,
  explainers — the answer is filed as a wiki lesson WITHOUT asking first. Extend the existing lesson-capture duty:
  trigger shape widens from knowledge-questions to all knowledge answers; the lesson slug = topic name; upserts
  update in place. Noise handled by spaced review, not by skipping capture. Mirror the rule into Ada instructions
  if she gives similar coaching answers. Update AGENTS.md lesson-capture duty text accordingly.'
