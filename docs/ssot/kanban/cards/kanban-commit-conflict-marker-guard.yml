id: kanban-commit-conflict-marker-guard
title: 'kanban-commit: reject files containing git conflict markers before committing'
column: backlog
note: 'Incident 2026-10-05 ~14:20: a kanban-commit auto-commit captured files mid-rebase with <<<<<<< markers intact
  (logs-auto-*.yml x6 + coverage). YAML parse then failed on the NEXT run, killing kanban-commit AND kanban-dispatch
  ~15min until manually resolved. The validator caught it a cycle too late — the poison was already committed+pushed.'
spec: 'scripts/board/kanban-commit.sh (or its validate step) must refuse to commit any staged file containing conflict
  markers (lines starting <<<<<<< / ======= / >>>>>>>) — not just invalid syntax. Cheap: git diff --check --cached,
  or grep the staged set. On hit: skip the commit, log which file, and file/annotate a card (this failure class
  is silent otherwise — today it surfaced only because dispatch also died). Verify: plant a marker in a test card,
  run the service, confirm it skips+reports rather than committing.'
