- at: 2026-10-29 07:20
  from: backlog-spec-enrich
  text: spec drafted by backlog-spec-enrich (gemini-3.5-flash-lite) — review before queueing
spec: The goal is to complete the remaining repointing and follow-up work resulting from the tony-dell
  power-off, including updating ssh-hosted MCP servers in ~/.config/devin/mcp_config.json, updating DOC_PRINT_SSH
  in idc03 secrets, addressing cms-h3-publish path requirements, and verifying probe/job host assumptions.
  The work involves hosts idc02, idc03, and tony-omen, and targets configuration files and scripts. Constraints
  require ensuring all dependencies are correctly pointed away from tony-dell to their new hosts (such
  as idc03, omen, and caddy). The testable done-condition is that consumer-canary remains clean with zero
  skips, all specified MCPs and jobs function without referencing tony-dell, and health probes successfully
  target their correct new host destinations.
