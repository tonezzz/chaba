id: chaba-memory-producer-hygiene
title: 'Chaba memory: stop generating noise at the producers'
brief: 'The context render now filters noise, but the upstream scripts still *generate* it: session-end stubs written
  as events, raw journal lines in the infra digest, "(no task)" immediate pins. Fixing the producers cleans the
  data for every consumer — context render, reports, and Ada — instead of patching each reader.'
column: review
priority: medium
created: 2026-10-08
updated: 2026-10-09 20:07
pipeline: ci
autonomy: t2
metric: recent-events.yml gains no new "session ended (other)" rows; personal/ infra digests contain no raw `x2
  [timestamp]` journal fragments; immediate.yml gets no "(no task)" entries. Renderer's drop/filter counts trend
  to zero over a week.
verify: 'Run each producer on test input: session-end hook on a stub session -> nothing appended (or kind:lifecycle,
  invisible to the feed); personal-rollup on a journal with rate-limit spam -> header counts kept, no sample lines;
  immediate-pin with no task -> entry skipped.'
spec: "Three producers, all in this repo (scripts/):\n\n1. recent-event.py / devin-session-end.sh — \"session ended\
  \ (other)\"\n   is lifecycle ceremony, not an event. Either stop appending it, or\n   tag it `kind: lifecycle`\
  \ so readers can filter structurally instead\n   of by regex (render-memory currently drops by \"^session ended\"\
  ).\n   Prefer the tag — keeps the audit trail, hides it from the feed.\n\n2. personal-rollup.py — the ## spend\
  \ / ## apps blocks embed raw\n   `xN [timestamp] unit: <truncated log line>` samples. The header line\n   (count\
  \ + ⚠) is the signal; the samples are noise that truncates\n   mid-sentence in context. Keep at most 1 representative\
  \ line per\n   bucket, or drop samples entirely — the journal is always queryable.\n\n3. immediate-pin.py — don't\
  \ write entries with no task/next/open;\n   a session that did nothing leaves nothing to resume.\n\nAlso document\
  \ the session-memory.md entry convention (## Compaction\n<id> / ## Session end <id> are entry headers; '## N.\
  \ Section' blocks\nbelong to the entry above) in ssot.chaba.memory.yml — render-memory's\nentry_match depends\
  \ on it staying stable.\n\nContext: renderer-side filters shipped 2026-10-08 (drop/entry_match/\nskip_status/hide_empty).\
  \ This card is the upstream half — after it\nlands, the renderer rules stay as defense-in-depth, not the fix.\n"
