    run: opencode-executor-routing-smoke re-queued on litellm/gemini-3.5-flash-lite — verdict.json PASS, zero denials,
    all 11 data checks true, auto-merged a2d3c461 to origin/master. First fully-green OpenCode executor closeout.'
