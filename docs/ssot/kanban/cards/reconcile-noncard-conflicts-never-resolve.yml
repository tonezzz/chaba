id: reconcile-noncard-conflicts-never-resolve
title: 'reconcile-local-conflicts: non-card .local-conflict files never fold back — re-flagged every run'
column: done
updated: 2026-11-25 17:09
priority: low
tags:
- git-safe-pull
- reconcile
- hygiene
- idc03
spec: 'Observed 2026-11-17 on idc03 served checkout: 16 focus-inbox *.local-conflict-* files dated 2026-11-11 are
  logged as ''non-card conflict kept'' by reconcile-local-conflicts.py on EVERY git-safe-pull/kanban-commit exit
  — forever. Cards get folded back into canonical YAML; non-card paths have no merge path so they accumulate and
  re-flag (dedup suppresses the board flag after 6h but the stderr noise + files remain). Options: (a) teach reconcile
  a non-card merge (union/mtime-wins like generated paths), (b) after N days archive .local-conflict-* to a quarantine
  dir instead of keeping in-tree, (c) at minimum stop re-flagging files already flagged once (flag state file).
  Verify: run reconcile twice, second run silent for already-seen conflicts.'
ref: KNB-0168
