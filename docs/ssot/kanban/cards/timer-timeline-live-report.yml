spec: '1. scripts/ada/timer-timeline-update.py — ssh-collects systemctl timer state per host (dell,omen,mn01,idc02,idc03,macbook),
  appends JSONL ledger on dell, publishes timer-timeline rollup + timer-timeline-<host> leaves + timer-timeline-qc
  into ada-cms-pages. Own 15min timer.

  2. scripts/ada/timer-sentinel.py — independent 10min timer (NOT via chaba-jobs dispatcher). Reads state.json,
  fires timer-alert-<host>-<timer> kanban cards on: expected timer disabled/missing, service failed, host unreachable,
  sweep stale >30min. Dedup: comments on existing open card.

  3. Both timers declared in ssot.audit.hosts same commit.'
note: 'Live CMS timeline of every fleet timer + independent watchdog. Born from OPS-0531 (chaba-jobs.timer silently
  disabled 2d). Approved decisions: 15min refresh, rollup+per-host leaves, separate QC report, sentinel cards only
  on suspicious.'
