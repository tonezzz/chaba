spec: 'Close the last gap before real use of the Adobe Stock preview lane (OPS-1036 done, ada-voice@a8241ac deployed
  on idc02). When a render lane completes (ada-render-image-v2 gemini-3.1-flash-image, or ADA-1092 artifact landing),
  write the durable image_url into the campaign RUN.json asset entries as preview_url (and thumbnail_url when a
  smaller variant exists), then rebuild .adobe-stock/indexes via build_adobe_stock_indexes.py. Also add an index-rebuild
  trigger (post-render hook or timer) so indexes do not go stale. Constraints: preview URLs must be browser-safe
  http(s) durable relay/archive URLs — the bridge already rejects file://, credentials, and local paths; never invent
  URLs. Acceptance: a real rendered campaign asset appears in /ada adobe_stock output with a working thumbnail and
  full-preview link on the opencode-ada surface.'
ref: OPS-1131
