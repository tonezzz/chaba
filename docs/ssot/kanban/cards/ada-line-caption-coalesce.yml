spec: 'kk-home 22:25-22:28: photo sent, then caption ''translate please'' 87s later while the image turn was in-flight
  -> caption answered standalone (''please send the image''); user resent the same photo; two replies landed back-to-back
  = ''2 answers in one post''. LINE has no native photo caption - users send photo then type caption. Implement:
  when an image event arrives, hold the turn briefly (LINE_IMAGE_CAPTION_WAIT_S, ~8s) for a text from the same (chat,user)
  routed to the same persona; if one arrives merge it as the image caption and answer once. Deliver to the caption
  event''s replyToken when merged.'
ref: ADA-0629
