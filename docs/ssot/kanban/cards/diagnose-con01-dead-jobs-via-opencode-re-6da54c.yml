  report in comms with per-job verdict + first fix guess. Do NOT edit units, env files, or code — read and report
  only; fixes stay on OPS-1013. Route: action.executor=opencode, lane=free_lane, host that serves it (idc02). Verify:
  report names a failure class for all 4 jobs with journal evidence.'
