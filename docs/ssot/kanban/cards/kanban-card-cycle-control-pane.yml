id: kanban-card-cycle-control-pane
title: Extend the control pane for the Kanban card cycle
column: done
updated: 2026-11-19 20:19
brief: Design a thin, evidence-first operations pane over the existing board/API, DevNest/JevTeam routing, and OpenChamber
  sessions.
priority: medium
program: devnest
tags:
- kanban
- devnest
- jevteam
- opencode
- mcp
- control-pane
spec: Extend the existing Chaba control surfaces; do not create a second card database or scheduler. Show the card
  lifecycle and timeline, eligibility/claim reason, executor/provider/model, host/session, queue/run duration, evidence-backed
  tokens/cost, artifact/verifier, attempts/failure, and suggested escalation with reason/confidence. Board-api remains
  the only card mutation door; DevNest owns durable bounded execution; JevTeam classifies/recommends/gates; OpenChamber
  is the interactive session cockpit. Start with a read-only projection. Any queue/hold/respond/retry/lane-reroute
  actions must use narrow typed board-api-backed MCP tools with confirmation and audit. Measure queue wait, cycle
  time, first-pass verifier rate, retries, operator review time, and cost per verified completion. No production
  deployment or broad autonomous mutation is included in this design card.
ref: KNB-0229
