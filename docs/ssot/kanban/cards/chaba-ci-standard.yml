id: chaba-ci-standard
title: Establish plan → structure → develop → audit → benchmark CI standard
column: backlog
note: Define the standard pipeline every card-sized piece of work flows through, and wire it into the repo so it
  runs hands-off.
updated: 2026-10-04 08:51
help: "Goal: one declared pipeline — PLAN (spec the card), STRUCTURE (worktree +\nfiles), DEVELOP (implement), AUDIT\
  \ (ssot-validate, lint, tests),\nBENCHMARK (measurable before/after) — that any card can opt into via\n`pipeline:\
  \ ci` and that kanban-dispatch runs hands-off.\n\nDeliverables:\n1. docs/ssot/ssot.ci.yml — stages, gates, required\
  \ artifacts per stage\n2. scripts/ci/ runner — executes a card through the stages, records\n   stage results back\
  \ into the card's comms\n3. card_schema addition: `pipeline: ci` opt-in field\n4. audit + benchmark wiring: pre-commit\
  \ / timer / report node in\n   ssot.reports.yml\n5. a demonstration run on a real card\n"
spec: "Design and implement the standard Chaba CI pipeline for card-sized work:\nplan → structure → develop → audit\
  \ → benchmark.\n\nRead first: docs/ssot/kanban/ssot.kanban.yml (card standard),\nscripts/ssot-validate-all.mjs,\
  \ scripts/ssot-optimize.mjs, the pre-commit\nhook, and docs/ssot/infrastructure/ssot.reports.yml (report nodes).\n\
  \nDeliverables:\n1. docs/ssot/ssot.ci.yml declaring the five stages, the gate that ends\n   each stage, and the\
  \ artifact each stage must produce.\n2. scripts/ci/ — a runner that takes a card id, executes the stages it\n\
  \   can automate, and writes stage results into the card's comms +\n   a `pipeline:` status block. Gates it can't\
  \ automate (e.g. Tony\n   approval) become requests: entries on the card.\n3. Card schema addition: `pipeline:\
  \ ci` opt-in field (documented in\n   ssot.kanban.yml card_schema).\n4. Wire the audit stage to the existing validators;\
  \ wire the benchmark\n   stage to produce a before/after metric recorded on the card.\n5. Demonstrate on one real\
  \ small card.\n"
action:
