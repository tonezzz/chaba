title: 'Ada tools: wiki_read + wiki_search — recall the Education wiki'
column: backlog
updated: 2026-11-08 15:19
ref: ADA-1199
comms:
- at: 2026-11-08 13:49
  from: devin
  text: 'spec (ada-voice repo, main): Ada cannot read the wiki she now co-owns — Education/Reports migrated 2026-11-08,
    lessons+reports live only there.


    Build two tools.d modules:

    1. wiki_read(title) — read a wiki page''s wikitext/parse via board-api /wiki/page mode=read (guarded door exists
    for Education:/Reports:/templates; verify read op works for News: too or extend allowlist deliberately). Actor=ada.

    2. wiki_search(query) — search wiki pages. If board-api lacks a search op, add a minimal guarded /wi'
