id: pwa-intake-persist-uploads
title: PWA doc intake loses uploads — persist originals before RAM-held result
column: backlog
updated: 2026-10-13 18:44
brief: 'Found via UPS card OPS-0420: /api/documents/intake holds results in process RAM (document_check._held, cap
  20) and nothing persists the ORIGINAL upload — restart loses it forever. Tony lost 2 UPS photos this way (Oct
  10, unrecoverable). Fix: on intake, write the raw blob to a durable dir (e.g. ~/.local/share/ada/intake/<key>.<ext>
  + manifest line, same shape as LINE_MEDIA manifest) before returning, so archive/retry works after restart and
  media-inbox can pick it up. ada-pi repo — pwa_server.py documents_intake + backend/document_check.py.'
priority: medium
