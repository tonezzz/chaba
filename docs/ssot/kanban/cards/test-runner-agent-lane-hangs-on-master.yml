- at: 2026-11-23 10:55
  from: devin
  text: 'FIXED + MERGED 2026-11-23 as a84dab8234 on origin/master. Root cause: test_devin_model_survives_on_devin_path
    was the first test to reach dt.build_task_text(), which calls lesson_primer._bank_candidates() -> urllib.urlopen(MDDB/search,
    timeout=10). On idc02 (MDDB reachable but slow/unreachable) this blocked indefinitely past the 10s timeout.
    Fix: (1) mock dt_module() to None in StartTaskLaneTest.setUp so start_task falls back to spec+RAILS without
    network I/O; (2) mock OPENCODE_LANES=False in Cl'
