spec: Use opencode-jack.surf-thailand.com as the canonical shared instance. Organize /workspace into repos/, worktrees/,
  shared/, incoming/, and outputs/. Tony and Jack may read/write each other's mounted primary workspaces during
  the supervised test. Keep separate OpenCode instances only as fallback; do not delete the Tony instance yet. Add
  operator-controlled repository import, per-task branches/worktrees, local commits, secret/scope/test verification,
  scoped branch push, and PR creation without direct global GitHub PAT or SSH key exposure. Main-branch merge and
  deployment remain human gates.
help: 'First pilot: one toy/private repository, one Jack task branch, deterministic tests, independent verifier,
  local commit, and reviewable diff. Do not grant broad GitHub credentials to the OpenCode container.'
ref: OPS-1044
