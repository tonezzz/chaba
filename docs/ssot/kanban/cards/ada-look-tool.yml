  \ payload; if absent -> ok:true \"no eye page is publishing\";\n   if age_s > 3*pub_s -> stale:true with age;\
  \ else class counts +\n   speakable summary. Read-only — no side effects, no confirm needed.\n3. Scenario: eye-look-live\
  \ (what do you see while a pub page runs ->\n   non-empty objects) + eye-look-idle (no doc -> honest empty).\n"
