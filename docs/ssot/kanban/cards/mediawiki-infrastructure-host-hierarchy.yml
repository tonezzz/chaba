id: mediawiki-infrastructure-host-hierarchy
title: MediaWiki Infrastructure Hosts hierarchy
column: backlog
updated: 2026-11-05 09:56
brief: Consolidate host, service, timer, load, disk, and audit reports into one Infrastructure/Hosts rollup with
  one consolidated leaf per host, while keeping full topology private.
priority: high
program: devnest
tags:
- mediawiki
- infrastructure
- hosts
- reports
- hierarchy
- privacy
spec: 'Define and implement the MediaWiki Infrastructure/Hosts hierarchy. Canonical pages: Infrastructure/Hosts
  rollup and Infrastructure/Hosts/<host> leaves. Integrate existing scripts/ada/host-services-cms.py, scripts/audit-hosts.py,
  host-loads, disk-trend-watch, timer-timeline-update, ssot.reports.yml, and ssot.audit.hosts.yml. Each leaf requires
  Quick summary, status active|degraded|unreachable|retired, role, last_verified, services, capacity/load/disk,
  expected-service delta, source/generator links, related report links, parent=Infrastructure/Hosts, report_role=leaf.
  Rollup requires one row per declared host, status/freshness/role/key warning/link, report_role=rollup, children.
  Reconcile host registry including idc01 retirement and idc03 coverage; remove stale six-host assumptions. Preserve
  compatibility links from services-by-host and services-<host>. Full infrastructure pages remain private until
  MediaWiki access control is configured; before then only dry-run or sanitized public fleet-status derivative with
  no ports, routes, service names, or topology. Done when dry-run, orphan/missing-host checks, rollup/leaf rendering,
  compatibility links, and privacy gates pass.'
ref: SYS-1034
comms:
- at: 2026-11-05 09:35
  from: tony
  text: card captured via board-api
- at: 2026-11-05 09:40
  from: tony
  text: 'Decision proposal: use one MediaWiki instance with two visibility surfaces. Public side exposes only sanitized
    News/public pages; private in-house side exposes Infrastructure/Hosts/Home/Ops after Lockdown namespace read
    permissions + Cloudflare Access/Wiki authentication are verified. Add a sibling Wiki tab after DevNest in Ada
    HA; it is an external full app, not an HA-native panel. Keep full host/service topology private; public derivative
    only.'
- at: 2026-11-05 09:56
  from: tony
  text: 'Implemented + verified live Ada HA dashboard tab: Wiki inserted immediately after DevNest (path=wiki, icon=mdi:book-open-page-variant,
    iframe=https://wiki.h3.gizmo-thailand.com/index.php?title=News&v=1). Synced sanitized snapshot + dashboard SSOT.
    Public News view only for now; full Infrastructure/Hosts remains gated on Lockdown/private access boundary.'
