id: edge-route-registry
title: 'Edge route registry: one SSOT -> edges, routes.json, Caddy snippets'
column: doing
review_kind: verify
priority: high
note: 'Route paths/upstreams are declared in 5+ places (dell Caddy 473-line
  monolith, mn01 Caddy copy, VPS public edge, tailscale-serve mounts, and
  hardcoded in card JS — the idc01->idc03 miss that broke chaba-home/ai).
  Goal: ssot.routes.yml is the single source; render-routes.py emits
  routes.json for consumers + per-edge Caddy snippets; cards fetch
  routes.json instead of hardcoding hosts.'
spec: 'Phase 1 (this session): ssot.routes.yml with full dell-edge
  inventory, render-routes.py -> stacks/web/public/apps/routes.json +
  validation, ada-voice/ada-chat cards resolve ws via routes.json
  (/local/routes.json, fallback literal). Phase 2 (future): generate
  apps.d/*.caddy snippets from registry, modularize monolith; VPS edge +
  mn01 consume the same registry; verify: probes per route feed a health
  lane. Phase 3 (evaluate): cloudflared tunnel replaces VPS public edge —
  registry becomes the ingress config; host-per-app DNS instead of
  path-strip debugging.'
