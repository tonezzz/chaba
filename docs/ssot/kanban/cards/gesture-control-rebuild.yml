- id: model-vendored
  check: file-exists stacks/web/public/apps/vendor/mediapipe/hand_landmarker.task
- id: relay-health
  check: http 200 https://tony-dell.taila0626a.ts.net/apps/gesture-live/health
- id: relay-ws
  check: ws wss://tony-dell.taila0626a.ts.net/apps/gesture-live/ws
action:
