title: 'Gesture control: iPhone camera -> gestures -> TV/screen (ada_v2 rebuild)'
brief: 'Tony (2026-10-09): use the iPhone camera for hand-gesture control of what is shown on his TV/screens. Rebuild
  of the archived ada_v2 MediaPipe gesture UI — full port spec + constants + DOM contract already extracted in docs/kb/gesture-ui-options.md
  (READ THIS FIRST — no re-digging the archive). Supersedes rebuild-gesture-system-using-yolo-for-cu-94356f and
  rebuild-gesture-control-using-yolo-1d906b (YOLO boxes are wrong primitive — landmark pipeline stays, per the KB
  recommendation).'
