id: kanban-act-loop
title: 'Kanban close-out standard: wire kanban-act into the loop + auto_done_when contract'
brief: 'Review piles grow because closing is manual. kanban-act.py already implements T2 auto-close (autonomy: t2
  + auto_done_when deterministic checks), but nothing runs it and most cards never declare the contract. Make close-out
  a standard procedure: cards declare done-criteria at file time, a timer drains review automatically, human attention
  lands only on rk=verify/decide.'
column: done
priority: medium
created: 2026-10-08
note: '2026-10-08 review sweep: 20 verified cards sat in review needing a manual close pass — kanban-act exists
  (scripts/ada/kanban-act.py) but has no timer and only ~7 cards declare auto_done_when. Dispatch cards get verified:
  true from merge-sweep but nothing translates that into column: done. The bounded check vocabulary (page_exists/card_done/file_exists/service_active)
  already covers most dispatch evidence; add git_merged if needed.'
spec: '(1) Add a kanban-act step to the timer loop — simplest correct placement is a 4th ExecStart on chaba-kanban-brief.service
  (30min cadence, same host as the writer) or its own kanban-act.timer — pick whichever matches existing systemd
  conventions; --dry-run log first pass optional. (2) Card template/standard: document in ssot.kanban.yml (or wherever
  the card schema lives) that new dispatch/lab cards SHOULD declare autonomy + auto_done_when; add the fields to
  the card template. (3) Extend kanban-act checks if needed: git_merged:<branch-prefix> (branch landed on origin
  main/master) so dispatch cards can express "verified" natively — merge-sweep already sets verified: true, so an
  alternative is a verified_true check that just reads the field. (4) CI nudge: ssot-validate-all.mjs (or the card
  validator) warns on review-column cards with no auto_done_when and no review_kind — warning only, not an error.
  (5) Safety stays: MAX_ACTS cap, ops event per act, t3/rk=decide cards never auto-close, open requests block close.'
