id: mddb-embed-free-first
title: 'Flip mddb embed order: free Gemini first, OR fallback'
column: backlog
updated: 2026-11-13 11:58
spec: mddb-gemini.env on idc03 sets OPENROUTER_PRIMARY=1 (OR unconditional when key set). Bench 2026-09-27 proved
  AI-Studio direct == OR (cosine 1.000, same vector space). Billed OR as unconditional primary buys nothing the
  free Gemini leg doesn't. Flip to Gemini-first, OR-fallback -> OR spend ~0 except genuine outages. Edit ~tony/.config/secrets/mddb-gemini.env
  on idc03, restart mddb/mddb-cms, verify embed leg in logs.
ref: MEM-0045
