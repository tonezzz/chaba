id: mddb-blrotate-deploy
title: Deploy mddb 2.15.4-blrotate on idc01 (binlog retention)
column: done
note: Deployed both nodes 2026-10-03/04. Janitor live (256MB cap / follower-acked bound), streaming Rotate (no full-file
  buffer), snapshot on any fromLSN < oldest incl. 0, and Recv-side FailedPrecondition -> snapshot. idc01 disk 94%
  -> 54%; follower re-snapshotted from 16M-entry lag.
