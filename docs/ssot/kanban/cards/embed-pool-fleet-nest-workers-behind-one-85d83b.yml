title: embed-pool — fleet+nest workers behind one ollama-shaped endpoint
column: backlog
updated: 2026-10-25 14:44
ref: MEM-0805
comms:
- at: 2026-10-24 08:17
  from: devin
  text: 'Goal: distributed embedding capacity — every host + browser worker feeds the mddb banks through ONE ollama-compatible
    /api/embed shim pointed at by MDDB_EMBEDDING_API_URL.


    Hard constraint found: mddb has NO vector-ingest path — /add silently ignores a vector field, /v1/import|bulk|embed|batch|vectors
    all 404. Every vector in a bank must come through the internal embed queue => the pool must front EMBEDDING_API_URL,
    not write to the bank.


    Lane A (unblocks production): pool-shim.py on idc03 — ol'
- at: 2026-10-25 08:11
  from: devin
  text: 'REAL JOB PLAN (Omen, safe pilot): do NOT backfill all banks yet. First run 100 representative documents
    through nomic-embed-text + bge-m3; expose an Ollama-shaped endpoint on a non-conflicting port; measure p50/p95,
    throughput, RAM/disk, and recall@3 against current MDDB embeddings. Gate: no production pointer changes until
    recall >= current and artifact JSON+query fixtures exist. Omen data free=38G, so keep pilot <=5G.'
- at: 2026-10-25 13:57
  from: devin
  text: 'Lane A shipped and live: embed-pool-shim.service on idc03 (100.102.134.91:11436) — ollama-shaped /api/embed
    racing proxy, hedged fan-out to idc03+idc02+omen ollama bge-m3, first 2xx wins, 8s timeout under mddbs deadline.
    mddb-embed repointed to it. Measured: ~100ms/embed via pool vs 12-14s on saturated idc03 solo.


    In-flight real-world proof of the design: tony-omen went into maintenance MID-backfill — every omen call failed
    and the pool kept serving through idc02+idc03. Graceful degradation, ex'
- at: 2026-10-25 14:44
  from: devin
  text: '[status 2026-10-25 14:50] Force-backfill delivered all 2561 docs to the write path (0 failed), but the
    real completeness signal is /v1/vector-stats — embedded_documents is 1400/2561 with ~3280 chunks still draining
    the embed queue. Key lesson: backfill "copied" != "indexed"; only embedded_documents==total_documents means
    done. Pool is degraded: omen down (maintenance), idc02 now loaded ~6 (qwen2.5 chat) — idc03 carries ~90% of
    embeds at ~7s each. Drain ETA ~6h at current speed, or ~15-20min once'
