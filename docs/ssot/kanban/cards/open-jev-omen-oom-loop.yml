    once the memory fix lands.'
- at: 2026-11-12 08:27
  from: devin
  text: 'FIXED 2026-11-12 08:26. Root cause: openjev/torch_backend.py hardcoded dtype=torch.float32 on CPU — the
    bf16 checkpoint upcast to fp32, doubling RSS to ~16 GiB → OOM-kill at 14.2 GB peak every restart (4,577 kills).
    Fix: CPU now loads torch.bfloat16 (checkpoint-native, zero precision loss) → ~8-9 GiB RSS. Verified: Uvicorn
    running (first successful start in journal), /health 200 load_s=52s, /score returns sensible inference. Unit
    re-enabled (auto-start restored). CAVEAT: patch is an uncommitted '
