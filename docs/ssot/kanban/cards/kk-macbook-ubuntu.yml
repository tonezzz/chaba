id: tony-macbook-ubuntu
title: 'tony-macbook: wipe macOS, install Ubuntu as main OS'
brief: DONE — KK's old MacBook Pro is now an Ubuntu fleet node. Turned out to be MacBookPro13,3 (2016, pre-T2);
  the T2 fork was never needed. Installed 2026-10-10 by a prior session; this dispatch rejoined it to the fleet
  (ssh keys/config, SSOT) and recorded leftovers.
column: review
priority: medium
created: 2026-10-08
updated: 2026-10-11 07:20
ask:
  question: Which install path — depends on whether this Mac has the T2 chip?
  options:
  - T2 (2018+) — t2linux-patched Ubuntu ISO + firmware extract first
  - pre-T2 (2017) — standard Ubuntu ISO, much simpler
  - Fedora t2linux spin instead of Ubuntu
  - Defer — keep macOS for now
  status: answered
  answer: This is done by another session.
  answered_at: 2026-10-11 06:17
note: 'Machine: MacBookPro13,3 (2016 15" Touch Bar, i7-6700HQ, 16GB, 233.8G Apple NVMe, Radeon Pro 450) — PRE-T2
  confirmed by DMI, not the suspected 2018 T2 model. Ubuntu 26.04.1 LTS on whole disk since 2026-10-10; macOS
  wiped. Live on tailnet as tony-macbook (100.77.76.112), LAN 192.168.2.88 via USB-C ethernet. Backup: 23G
  kkkakk home + Shared on ubuntu-usb stick at /home/tony/macbook-backup-2026-10-10.'
requests:
- id: revoke-old-tailnet-node
  needed: Revoke/remove dead tailnet node 'kk-macbook' (100.124.59.112, old macOS identity) in the tailscale
    admin console — node CLI can't remove another node
  from: tony
  status: open
- id: wifi-first-join
  needed: 'One manual Wi-Fi join on the laptop (TONY-WIFI) — the macOS backup exported SSIDs only, no PSKs.
    After that it works untethered (currently USB-C ethernet dongle).'
  from: tony
  status: open
- id: optional-restores
  needed: 'Decide on optional restores: (a) copy KK user files from stick backup into ~/. default: leave on
    stick, copy on demand; (b) redis container — no backup exists, fresh start only, default: skip; (c)
    runner-agent dispatch lane install (cap 2, cpu/dev/portable), default: card it separately.'
  from: tony
  status: open
spec: "T2 FORK (likely): if hw.model = MacBookPro15,1/15,3/16,x — the Apple T2 security chip blocks stock Linux.\
  \ REQUIRED PATH: 1. WAKE MACBOOK FIRST — cannot do anything while offline. 2. BEFORE wiping macOS (irreversible):\
  \ extract Broadcom Wi-Fi +\n   Bluetooth firmware — T2 Macs source it from the macOS install\n   (t2linux guide,\
  \ firmware.sh pulls /usr/share/firmware into a\n   tarball). Skip this and the Mac has NO wifi under Linux.\n\
  3. Backup KK's data: user files; podman redis-macbook container data\n   (redis-data volume, port 16379); ~/chaba-health\
  \ script; Chrome\n   Remote Desktop config; SSH authorized_keys (will re-seed).\n4. Install media: t2linux Ubuntu\
  \ ISO (mbp-ubuntu / t2-ubuntu-repo\n   community images ship the t2 kernel) — plain Ubuntu ISO will boot\n   but\
  \ lack kb/trackpad/ssd-touch drivers. Fedora-t2 spin is the\n   alternative (better-maintained kernels, ask option\
  \ 3).\n5. Install: recovery -> Security Utility: allow external boot, no\n   secure boot; erase APFS entirely;\
  \ install to whole disk.\n6. Post-install: applespi (keyboard/trackpad), wifi firmware from\n   step-2 tarball,\
  \ audio fix, suspend quirks.\n7. Rejoin infra: tailscale (new machine name or reuse tony-macbook —\n   revoke old\
  \ key), SSH host 'macbook' in ssh-config on tony-dell/\n   tony-omen, restore redis container if wanted, update\
  \ SSOT\n   (ssot.mysystem.macbook.yml -> Linux, drop macbook-appdev.yml).\nPRE-T2 PATH (if model is 14,3): vanilla\
  \ Ubuntu 24.04 USB, standard install, broadcom-sta for wifi — skip all T2 steps."
help: 'Resolved PRE-T2. Install runbook: docs/kb/ubuntu-install-macbook-pro13-3.md; hardware record + GPU bench:
  docs/kb/hardware-tony-macbook.md; stick identity: docs/kb/mn01-stick-standard.md. Rejoin trail:
  docs/ssot/jobs/infrastructure/2026-10-11-tony-macbook-ubuntu-rejoin.yml.'
