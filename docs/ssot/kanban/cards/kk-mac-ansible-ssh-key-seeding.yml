id: kk-mac-ansible-ssh-key-seeding
title: 'kk-mac: seed SSH key/auth for Ansible R7 verification'
column: backlog
updated: 2026-11-24 08:23
brief: Controller has IP known_hosts for 100.108.217.17, but ssh auth fails as kkkakk/tony; blocks verify-host-software
  for kk-mac.
priority: medium
tags:
- ansible
- kk-mac
- ssh
- r7
spec: 'Source: 2026-11-23 ansible full-fleet verify-host-software run. kk-mac (100.108.217.17, user kkkakk, macOS,
  excluded from baseline) is unreachable: host key verification failure fixed on controller by adding hashed known_hosts
  for 100.108.217.17; but ssh still returns Permission denied (publickey,password,keyboard-interactive) for kkkakk@100.108.217.17
  and tony@kk-mac. Needs KK/Tony to authorize controller SSH key (or confirm correct user/key path) on kk-mac. After
  auth, rerun: cd ansible && ANSIBLE_CONFIG=./ansible.cfg ansible-playbook playbooks/verify-host-software.yml --limit
  kk-mac. No host changes made by agent.'
ref: SEC-0043
