id: dispatch-failed-cards-park-in-doing
title: Failed/idle dispatch cards park in doing forever — no reaper returns them to backlog
column: backlog
updated: 2026-11-19 08:30
brief: '2026-11-17 sweep found 43 cards in doing with zero live claims fleet-wide (/queue claimed=[]): 23 action.status=failed
  dispatch cards (mostly Nov-14 runner-agent-drift/push-guard defers), 7 action.status=done stuck in doing, 11 manual/no-action
  stale claims. kanban-dispatch defers leave cards in doing; nothing ever returns them to backlog or re-queues them,
  so the board overstates active work and real pending dispatches look invisible.'
priority: high
tags:
- ops
- dispatch
- kanban
- single-writer
spec: 'Decide+implement the stalled-claim lifecycle: (a) on defer/fail with no live runner, return card doing->backlog
  (or auto-retry with backoff/cap); (b) a periodic reaper that flags doing cards with no claim/runner/session older
  than N hours; (c) keep honest columns — doing means a live claim exists. Verify: a deferred card returns to backlog
  and becomes claimable; board doing-count matches /queue claimed+active.'
ref: OPS-0146
