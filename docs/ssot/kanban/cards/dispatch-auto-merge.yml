brief: 'Dispatch sessions keep finishing real work but never merging it — 4 cards were rescued in one evening (ada-pi
  ×3, chaba ×1; one existed only on tony-omen, never pushed). The merge-guard correctly blocks review→done, but
  nobody merges. Expected action: none — dispatch will build this; afterward review cards should close themselves.'
note: 'Pattern observed 2026-10-07: ada-remember-confirm-flake (7 uncommitted files), speaker-profile-tool (12 files),
  yt-voice-dub-mode (1 commit unpushed), google-token-loud-fail (committed on tony-omen, never fetched/pushed).
  Each needed a human to find the branch, commit, test, merge, push, close. The dispatch-merge-guard catches the
  symptom (blocks close); this card fixes the cause.'
links:
- docs/ssot/kanban/cards/dispatch-merge-guard.yml
