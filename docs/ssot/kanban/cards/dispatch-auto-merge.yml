spec: "Add a merge step to the dispatch lifecycle (kanban-dispatch.py /\nrunner-agent close-out):\n\n1. On session\
  \ end: commit any remaining worktree changes as a\n   checkpoint commit (sessions already do this partially —\
  \ enforce it).\n2. Push the dispatch branch to origin (always — google-token-loud-fail\n   stranded on tony-omen\
  \ because nothing pushed).\n3. Attempt merge to origin/<default_branch> via the repo's safe-pull\n   conventions:\n\
  \     - clean → merge --no-ff, push, post comms \"auto-merged <sha>\"\n     - conflict → post comms with conflict\
  \ list, keep card in review\n       for human resolution (correct outcome — not everything merges)\n4. Preconditions\
  \ before auto-merge: session reported done/ok AND the\n   card's expected_goals (when declared) pass in the worktree\
  \ — reuse\n   scripts/lib/goals.py executor from expected-goals-verify.\n5. Only for cards whose dispatch actually\
  \ produced commits; docs-only\n   or no-op runs skip silently.\n6. Keep the dirty-worktree warning but make it\
  \ actionable in the same\n   pass (auto-commit outcome docs + job records as the checkpoint)."
