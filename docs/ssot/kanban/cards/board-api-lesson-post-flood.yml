- at: 2026-11-07 17:15
  from: devin
  text: 'DIAGNOSED + FIXED. Producer: bursty /lesson POST batches (~20/min, ~270/2h) correlated with job starts
    — embed-lane-lessons at 15:45 (~120 reads), a 17:00-17:08 batch of lesson upserts (real lessons re-filed: phonon-stt,
    speaker-id, thb-xau). Flood self-stopped ~17:08. Root damage: do_lesson calls _gemini_thai on EVERY write incl.
    identical re-files -> each POST burned a gemini-3.5-flash-lite-free call against the 15 RPM cap + serialized
    wp.lock. FIX (PR chaba#87, 21daad65): sha256(content)->Tha'
