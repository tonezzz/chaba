id: text-mode-chat-send-broken
title: 'chat_send fails on text-mode sessions: OpenRouterTextProvider lacks notify_or_defer'
column: done
updated: 2026-10-17 15:49
brief: 'On mode=text sessions (TG/LINE relays), chat_send times out then crashes: pwa_server notify failed: OpenRouterTextProvider
  object has no attribute notify_or_defer.'
priority: high
tags:
- ada-voice
- text-mode
- chat-send
- bug
spec: 'Observed 2026-10-16 on ada-ai-kraut: `chat_send notify failed: timed out` (~14s) then `WARNING pwa_server:
  session=... notify failed: AttributeError: OpenRouterTextProvider object has no attribute notify_or_defer`. Kraut
  tried to send a dub-sample video via chat_send channel=line — the call hung and never delivered. Fix: implement
  notify_or_defer (or equivalent send path) on OpenRouterTextProvider in backend/openrouter_provider.py so proactive
  tools (chat_send, notifications) work in text-mode sessions; degrade gracefully where the channel cannot take
  media. Also note: TG_PUSH_DENY now guards the mn-ha group against out-of-band pushes (replies unaffected).'
ref: OPS-0730
