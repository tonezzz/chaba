spec: Follow-up from adobe-stock-upscaler-eval (OPS-1077). ResShift (174M, ~1.2GB VRAM, 15 steps) and RSD (one-step
  distilled, ~0.5GB) are non-T2I diffusion SR that fit the GTX1650 — unlike SeeSR/OSEDiff/SUPIR (9-30GB). Benchmark
  on comparison-b x4 via the same upscale-eval.py matrix; compare fidelity vs GAN texture invention vs classical
  SR. If it beats Real-ESRGAN perceptually without hallucination risk, it becomes the quality tier between realesrgan
  and rented SUPIR.
ref: SYS-0210
