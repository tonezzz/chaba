id: ada-ocb-compact2-adoption
title: 'ada-ocb: adopt board-api compact=2 + comms_tail projections'
column: done
updated: 2026-11-19 20:04
brief: 'KNB-0176 landed server-side compact=2 (id,ref,title,column,priority,updated,brief,spec,action_status) and
  comms_tail=<n> on /cards and /card/<id>. ada_mcp.py still uses its own fields= projection workaround (~1MB snapshot).
  Adopt the server-side tier: _board_cards snapshot via compact=2, single-card hydration via comms_tail for comms
  consumers. Delete bridge-side projection code where the server now covers it.'
priority: medium
tags:
- ada-ocb
- board-api
- performance
spec: 'In opencode/ada_mcp.py: (a) _board_cards/_cards_payload snapshot fetch should request compact=2 (or fields=
  equivalent if compact=2 misses a needed field — verify against board-api.py COMPACT2_FIELDS first); (b) find_card
  single-card hydration should use comms_tail=<n> (e.g. 20) instead of pulling all comms, keeping full comms only
  where a tool genuinely needs history; (c) keep the 20s TTL cache and malformed-row guards; (d) update tests/test_opencode_ada_mcp_find_card.py
  + board snapshot tests for the new params; (e) run scripts/ocb-smoke.py and scripts/ocb-eval.py --dry-run before/after
  to prove no regression. Done when: snapshot payload drops below ~800KB, all eval cases still pass, and no tool
  returns fewer comms than its contract requires.'
ref: ADA-0207
