  text: 'Follow-up 2026-10-17: same hallucination class hit Chaba — a random-clip ask produced /apps/yt-live/clip-random.mp4
    (404 replayed on every display reconnect). Root cause found deeper than CMS wording: cast_to_screen pre-flight
