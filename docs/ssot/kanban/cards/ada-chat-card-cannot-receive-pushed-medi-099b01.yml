title: ada-chat-card cannot receive pushed media (no chat_id bind, no chat_push render)
column: doing
updated: 2026-10-26 17:51
brief: 'tony-ha/mn-ha ChatUI (ada-chat-card.js) connects ws with only ?device_id&api_key — no channel/chat_id binding
  — and _handleControl has no chat_push case. webchat_deliver only reaches channel=web sessions (boards widget web-<member>).
  Result: nothing can push text/image/video into a household ChatUI lane; chat_send channel=web misses it entirely.
  Surfaced 2026-10-18 when a cast-to-tony-ha ask had no reachable surface.'
priority: medium
program: ada-voice
spec: '1) bind the card session: add &channel=web&chat_id=web-<member-or-device> to the ws URL (member when a key
  maps to one). 2) render chat_push in _handleControl: text bubble, <img> for image_url, <video controls> for video_url.
  3) verify: POST /api/webchat/send on the lane reaches the open card live; offline parks + flushes on reconnect.'
