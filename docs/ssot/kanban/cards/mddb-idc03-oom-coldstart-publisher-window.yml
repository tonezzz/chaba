spec: 'Follow-up from triage of timer-alert-idc03-media-inbox-update-kk and timer-alert-idc03-ops-health-report
  (both closed 2026-11-27 as transient). Evidence: (1) idc03 journal: mddb.service killed by OOM killer 2026-11-27
  15:58:20, exit 137, restarted 15:58:53; health endpoint on 100.102.134.91:11023 opened 15:58:55 but ''mddb HTTP
  listening'' (full routes) only 16:00:37 (~104s). ops-health-report tick started 16:00:00, POST /v1/add at 16:00:36
  got HTTP 404 -> exit 1; next tick 16:15 exited 0. (2) mddb-cms[2068] 15:55:31-33 logged ollama embed failures
  (context deadline / 504) plus ''response not delivered: handler finished after the HTTP write timeout'' POST /v1/add
  elapsed 36.3s vs writeTimeout 30s; media-inbox-update-kk _post got RemoteDisconnected -> exit 1; next two ticks
  16:10 and 16:25 exited 0. Done-condition: (a) identify/fix the OOM cause (7 restarts today; idc03 has 15Gi/4core
  — see card idc03-structural-capacity-15gb-4core-per-2d787f) or bound memory; (b) do not expose the health endpoint
  before /v1 write routes are live, or make dependent publishers gate on route readiness; (c) raise MDDB_HTTP_WRITE_TIMEOUT
  and/or add bounded retries in scripts/ada/media-inbox-update.py and ada-voice/scripts/ops-health-report.py. Host/service
  changes need Tony approval; read-only diagnosis first.'
