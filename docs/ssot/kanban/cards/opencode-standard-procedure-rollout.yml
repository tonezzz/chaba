  options:
  - id: supervised-s0-s2
    label: 'Recommended: supervised S0-S2 read-only/report/doc/small-test tasks with isolated worktrees and independent
      verifiers; keep production actions human-gated.'
  - id: stay-pilot
    label: Keep the current 3-job pilot as the only OpenCode use; do not expand yet.
  - id: fleet-wide
    label: Enable OpenCode broadly across runners; requires separate risk/budget review and is not recommended yet.
  suggested: supervised-s0-s2
