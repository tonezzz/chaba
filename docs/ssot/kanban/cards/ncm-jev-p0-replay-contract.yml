  route + selected candidate, bounded parallel + deterministic verifier; (4) pin model/revision/tokenizer/quantization/hardware
  per arm; (5) P0 gate = deterministic schema validity + reproducible replay from manifest.json without provider
  calls; (6) publish standard packet: manifest.json, results.json, report.md, verdict.json, education.html. Explicitly
  NO account upgrade, paid GPU, or paid inference; GPU stages stay blocked until authorized compute exists. NCM/JEV
  outputs never set allowed_paths/tools/credentials — Nest owns queueing.'
