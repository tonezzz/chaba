spec: 'Tony wants the batch-approval UX (like a multi-question popup) as a board feature: all cards with OPEN requests/asks
  in one pass, one click each.

  Mechanism already exists: cards carry requests[]/ask+options+suggested; render-board2.py renders ask + option
  buttons -> POST /respond {id, request_id, answer}. Build the aggregate surface:

  1. A ''Needs Tony'' section (top of board or ?decisions=1 view) listing every card with an open request — renders
  the ask text, the card title/link, and its option buttons INLINE (suggested option highlighted with a star so
  skimming = one click).

  2. Click -> POST /respond (existing) -> remove the row on success, show answered state briefly. Free-text requests
  keep the existing input box.

  3. Count badge when zero open asks -> section collapses to ''no pending decisions''.

  Reuse the existing button/handler code in render-board2.py (~lines 210-285) rather than new plumbing. Verify:
  create a synthetic card with 2 open option-asks + 1 free-text ask, answer via the new surface, confirm responses
  land on the card''s comms/request state.'
