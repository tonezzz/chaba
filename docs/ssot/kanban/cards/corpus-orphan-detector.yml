id: corpus-orphan-detector
title: "Corpus orphan detector — scripts/docs with no references surface in standard-drift"
column: backlog
priority: medium
created: '2026-10-11'
updated: '2026-10-11 13:30'
review_kind: triage
domain: chaba-ci
spec: |
  ssot.artifact-lifecycle.yml declares an Orphans detector that does not
  exist yet. Build it as a section in standard-drift-digest.py:

  - scripts/*.py, scripts/**/*.sh not referenced by ssot.jobs.yml exec,
    any tool decl, a card, AGENTS.md, or another script (graph walk,
    not just name-grep — check shebang usage + systemd units too)
  - docs/kb, docs/reports, docs/assessments files with zero inbound
    links from other docs/README/AGENTS and no git log touch in 90d
  - emit as an "Orphans" digest section listing path + last-touch +
    byte size; ratchet like the lint baseline (count only shrinks)

  Budget: keep it cheap — git log for last-touch, rg for references.
  No LLM. Cap the section at 15 rows like other sections.
comms:
  - from: devin
    text: >
      carded from ssot.artifact-lifecycle (2026-10-11) — the detector the
      standard declares. Companion to the regen lane: regen covers
      generated-page staleness, this covers unreferenced handwritten
      artifacts.
verify: >-
  standard-drift page shows an Orphans section; a known-dead script
  (e.g. one never referenced) appears; count only shrinks over time.
