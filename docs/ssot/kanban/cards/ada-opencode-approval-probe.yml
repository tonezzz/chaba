id: ada-opencode-approval-probe
title: Ada/OpenCode approval-handshake probe — bounded S3 read-only dispatch
column: backlog
updated: 2026-11-25 10:45
priority: low
tags:
- ada
- opencode
- smoke
- scenarios
- approval
brief: >-
  Dedicated canary card for the live ask->respond->dispatch approval
  scenario (ada-voice tests/scenarios-live/ada_opencode_approval.yaml,
  card ada-dispatch-approval-scenario). Fully staged S3 lane_envelope so
  a real Ada-driven dispatch is claimable on idc02 — free-tier model,
  read-only host snapshot, held-out verifier. Re-dispatchable: each
  scenario run re-arms it via on_exists=queue.
ref: ADA-1194
spec: >-
  Bounded read-only probe. The opencode job collects a host health
  snapshot of idc02 (hostname, uptime, load, cpu_count, mem, disk /,
  failed user units) and emits it as a single JSON object as its final
  message — the runner writes the declared artifact from that message.
  No writes, no installs, no secrets reads. This card exists so the Ada
  approval scenario exercises a REAL queue on the idc02 opencode
  surface (v2.2.5); the job itself is deliberately trivial.
action:
  type: dispatch
  executor: opencode
  agent_profile: ops-readonly
  profile: ops-readonly
  task_class: read_only
  lane: free_lane
  lane_source: manual
  host: idc02
  repo: chaba
  model: litellm/or-free-nemotron-ultra
  llm_key_alias: chaba
  target_host: idc02
  artifact: evals/opencode-lane/out/ada-opencode-approval-probe.json
  prompt: >-
    Produce a read-only health snapshot of host idc02 via the
    ops-readonly bash allowlist (hostname, uname, uptime, nproc, free,
    df, systemctl --user list-units). Emit ONLY a single JSON object as
    your final message — no prose — with exactly the keys in
    evals/opencode-lane/profiles/ops-readonly/fixture/task.yaml
    #contract.required_fields (host must be "idc02", read_only true).
    Do NOT write, edit, move, or delete any file; do NOT install
    anything; do NOT read ~/.config/secrets.
  lane_envelope:
    id: s3-ada-opencode-approval-probe
    card: ada-opencode-approval-probe
    task_class: read_only
    stage: S3
    target_host: idc02
    executor: opencode
    profile: ops-readonly
    model: litellm/or-free-nemotron-ultra
    provider: litellm
    unattended: true
    mcp_allowlist: []
    allowed_paths:
    - evals/opencode-lane/out/
    artifact:
      path: evals/opencode-lane/out/ada-opencode-approval-probe.json
      schema: evals/opencode-lane/profiles/ops-readonly/fixture/task.yaml #contract.required_fields
    verifier:
      type: held_out_py
      ref: evals/opencode-lane/profiles/ops-readonly/fixture/verify.py
    escalation:
      on_fail: manual
      max_retries: 0
    rollback:
      kind: none
    heartbeat:
      required: true
      stale_s: 300
    timeout_s: 420
  expect:
    required_keys: [artifact, tests, verifier]
    facts:
    - budget_usd<=0.05
    - max_turns=6
    - max_tokens=50000
    - max_wall_time_s=420
    - max_retries=0
  max_usd: 0.05
  max_turns: 6
  max_tokens: 50000
  max_wall_time_s: 420
  max_retries: 0
  status: idle
comms:
- at: 2026-11-25 10:45
  from: devin
  text: >-
    Probe card for the ada-dispatch-approval-scenario live scenario
    (card ada-dispatch-approval-scenario). Pre-staged with the full S3
    lane_envelope contract (runner-agent staged-admission requires it
    for executor=opencode claims) plus the ada_opencode preflight
    limits (max_*) as action fields so preflight passes without Ada
    supplying args. ops-readonly profile + litellm/or-free-nemotron-ultra
    = $0 per run; artifact evals/opencode-lane/out/ada-opencode-approval-probe.json;
    held-out verifier re-collects host facts on idc02. Re-dispatchable
    via on_exists=queue after each run completes.
