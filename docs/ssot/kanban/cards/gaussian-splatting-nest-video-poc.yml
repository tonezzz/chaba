id: gaussian-splatting-nest-video-poc
title: Prototype Gaussian splat scene render for Ada Nest video lane
column: backlog
updated: 2026-10-30 16:14
spec: Research and prototype the smallest useful Gaussian-splatting lane for Ada Nest video generation. First render
  a known small PLY scene; then run one photo/video reconstruction on Colab using the existing nest-pack contract.
  Publish a PLY plus orbit MP4 and timing/VRAM report to durable Drive storage. Evaluate whether the rendered scene
  plate improves LTX shot consistency. Prefer gsplat/Nerfstudio or a maintained WebGPU viewer; do not replace LTX
  as the appearance/motion generator. Stop before any paid Colab spend or production integration.
note: 'Initial research: existing repo has COLMAP, original 3DGS, Nerfstudio/gsplat Docker scaffolding and a working
  Colab nest-pack queue. GitHub leads: gsplat v1.6 main, nvpro Vulkan viewer, Visionary/WebDGS WebGPU, 4DAnyone
  for later high-memory dynamic reconstruction.'
ref: OPS-0859
