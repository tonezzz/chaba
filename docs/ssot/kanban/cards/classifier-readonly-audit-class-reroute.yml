spec: 'Parent: card devin-usage-reduction, job doc docs/ssot/jobs/devnest/2026-11-24-devin-usage-reduction.yml.
  FIRST-CLASS PICK (Tony-visible decision recorded there).


  EVIDENCE: audit/assess dispatch sessions burned 56.8M prompt tokens on idc02 in the last 30d (12 sessions, avg
  4.73M); fleet assessment flagged audit shapes among 12-17M outliers; recurring open cards audit-miss-*/audit-oc-*/[audit]
  sit in the devin jevos-fallback bucket because no keyword matches. Free-lane fit is contract-backed: kanban-free-lane-routing-contract
  §3 reserves read-only profiles (ops-readonly, ssot-research, info-find) for reports/audits; OPS-0885 pilot + ops-remote-read
  smoke + ssot-research-verifier-semantic verified-close prove the path. LANE_PROFILES already maps free_lane ->
  ops-readonly in runner-agent.


  DESIGN (mirror existing classifier conventions in scripts/board/dispatch_repos.py):

  * Title-scoped match, NOT spec-substring — the spec body of a mutation card often says ''audit X then fix Y'';
  only the title decides. Pattern: title begins with or leads with audit|assessment|review|investigate|sweep (word-boundary,
  case-insensitive), e.g. ''audit-miss-*'', ''[audit] ...'', ''Assess ...'', ''Investigate ...''.

  * Mutation-verb exclusion on the TITLE: fix|implement|deploy|migrate|merge|repair|patch|cleanup|build|create ->
  do NOT reroute (those need write-capable lanes).

  * Placement: evaluate inside/alongside the free_lane keyword pass (which already precedes devin per DEV-0045),
  source tag e.g. ''kw:audit-ro'' or ''audit-readonly'', conf 1.0 — same shape as the timer-alert pin. Explicit
  action.lane still wins; timer-alert pin still wins first.

  * Do NOT add ''audit'' to LANE_KW[''free_lane''] raw substring list — that would match spec bodies fleet-wide.


  TESTS: extend tests/board/test_queue_time_classify.py — positive: ''audit-miss-unlanded-oct06-dispatch-artifacts'',
  ''[audit] mutating_command in opencode session X'', ''Assess sys-mon coverage'' -> free_lane; negative: ''Audit
  logs then fix the shipper'' (mutation verb), ''Fix audit-cast runaway guard'' (fix-first title), explicit lane=devin
  card, timer-alert card unchanged; jevos fallback path unchanged for non-matching titles.


  VERIFY: pytest tests/board/test_queue_time_classify.py (+ neighbouring board tests) green; re-run the open-card
  classifier snapshot and confirm the audit cohort moves devin->free_lane with no unrelated card changing lane.


  QUEUE NOTE: this card''s own spec contains free_lane/report vocabulary — it will self-classify free_lane at queue
  time and hold for a lane_envelope. It is a code-change card: pin executor=devin (or stage an envelope) when queueing.
  Also note kanban-free-lane-routing-contract is still draft — if Tony wants routing changes to wait for contract
  sign-off, hold this card until then.'
