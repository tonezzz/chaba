id: ada-devin-tool-stale-endpoint
title: 'devin/devin_read tools SSH to stale LAN IP 192.168.2.67'
brief: 'Audit 2026-10-09: devin dispatch + devin_read status failed with
  "ssh: connect to host 192.168.2.67 port 22: Connection refused" — a stale
  tony-dell LAN address. devin_read action=jobs worked (different path).
  Per rules, use tailscale names, not LAN IPs.'
