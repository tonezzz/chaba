spec: "In ada-pi, find where the devin/devin_read tools resolve the dispatch host.\nIt\
  \ hardcodes or env-defaults to 192.168.2.67 (tony-dell LAN). Point it at the\ntailscale\
  \ name (tony-dell / 100.68.142.13) like every other cross-host call.\nEvidence: journal\
  \ 16:27:12, 17:01:49, 17:02:09, 17:03:18, 17:03:40 ICT —\ndevin-dispatch ssh refused. Effect:\
  \ Ada's 'hand it to Devin' dispatches silently\nfail — she approved dispatching the black-screen-cast\
  \ investigation and it\nnever left the box.\nVERIFY: devin action=dispatch from ada-ha-tony reaches\
  \ the dispatcher;\ndevin_read action=status returns ok:true.\n"
