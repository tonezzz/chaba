id: board-api-date-serialization-outage
title: board-api /cards 502 — YAML bare dates crash json.dumps (fleet-wide Ada status outage 2026-11-09)
column: backlog
updated: 2026-11-26 20:52
priority: medium
tags:
- devnest
- board
- bug
- postmortem
spec: 'Hygiene follow-up to the 2026-11-09 board-api 502 outage (fixed at 7ea2e37e47 by json.dumps default=str):
  card YAML write paths still emit bare created:/updated: date scalars that PyYAML decodes to datetime.date, so
  any plain json.dumps consumer dies. Quote/normalize date scalars at write time so every card YAML is JSON-safe
  and add a regression test that writes a card then asserts the persisted YAML parses those fields as strings. The
  watchdog/liveness half is covered separately by board-api-accept-loop-wedge-auto-restart-7dd2f1 - do not duplicate
  it. Done: normalization plus test land on chaba master, chaba gate green, outcome names the fields normalized.'
action:
