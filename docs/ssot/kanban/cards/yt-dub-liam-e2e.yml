note: >-
  Step-by-step live scenario, driven by Tony's voice:
  1. ASK — "Ada, find a recent clip with only Liam and his brother
     talking to each other" (Oasis/Gallagher interview). Ada must search
     YouTube (yt search / web_search), pick a two-person dialogue clip,
     state her choice + why before acting.
  2. DUB — run the yt-vtt-dub pipeline on the chosen video (fetch VTT,
     translate/th dub via the established tools); produce the dubbed
     media in the yt-live cache/app dir.
  3. REPORT — verify cached-videos-report (CMS) reflects the new entry
     within one tracker cycle (30m timer or run_now=true); Ada should
     then quote it correctly when asked "what videos are cached".
  4. PLAY — "Ada, play it on screen 2" — cast_to_screen / vcast must
     land the dubbed video on screen 2 (not the TV); verify
     media_player/cast state = playing.
  5. STOP — "stop" cleans up. Encode as a scenarios-live YAML after the
     first manual pass so it becomes repeatable benchmark material.
