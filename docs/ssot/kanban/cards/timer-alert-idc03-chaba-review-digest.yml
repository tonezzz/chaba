spec: Investigate recurring timeouts for the user systemd timer `chaba-review-digest.service` on host idc03. Inspect
  the service journal using `journalctl --user -u chaba-review-digest.service` on idc03 to identify the root cause
  of the timeout failures. The target host is idc03 and the repository associated with chaba services is chaba.
  The done-condition is met when the underlying issue causing the timeout is resolved and a subsequent manual or
  scheduled run of `chaba-review-digest.service` completes successfully without timing out.
