id: ai-news-education-morning-brief
title: Standard morning AI news -> Education brief
column: done
updated: 2026-11-25 17:06
spec: 'Define and implement the daily AI/model/provider news procedure. Integrate with existing wp-news-fetch, wp-news-digest,
  and wp-news-situation rather than creating a parallel raw-news store. Add a private morning brief with fixed sections:
  60-second scan; model/provider efficiency table; impact on video/Gaussian/4D/local/Colab/Nest/Ada; TRY/WATCH/NO-ACTION;
  source links and confidence; Education updates. Raw stories remain News CPT; durable comparisons update existing
  Education lessons by topic. Add on-demand query path. Verify the actual private page consumer URL and keep the
  generator non-blocking with deterministic fallback.'
note: Procedure source committed in docs/kb/ai-news-to-education-procedure.md; existing News CPT schedule already
  fetches at :00, digests at :20, and sweeps situations at :45.
