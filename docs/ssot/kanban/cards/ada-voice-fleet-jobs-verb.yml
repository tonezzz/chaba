spec: 'Follow-up to fleet-jobs-report-and-ada-verb. Contract: docs/kb/ada-report-verb-contract.md (chaba repo).


  Implement a report-verb tool in ada-voice that answers "how are jobs" / "job status" / "what is the fleet doing"
  by reading the rendered artifact only:

  - primary: POST {MDDB}/get {collection:ada-cms-pages, key:fleet-jobs-report, lang:en} -> contentMd

  - freshness gate: meta.updated vs fresh_for 4h; stale -> answer "as of <updated>"; missing -> say the report has
  not been generated

  - NEVER: run the aggregator, scan board-api /cards or /queue, psql, ssh, or systemctl on a voice turn

  - producer: fleet-jobs-report job on idc03 every 4h (ssot.jobs.yml), page already live in ada-cms-pages'
