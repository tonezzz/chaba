  from: devin
  text: 'implemented path B (digest-side): classify() in log-shipper.py now demotes JSON lines whose
    level field is info/debug/trace/notice — container stderr fd-artifact can no longer score INFO as
    severe. Deployed fleet-wide via install-log-shipper (5 hosts, idc01 skipped — retired). Verify:
    next log digest should show idc03 severe dropping toward true-error volume.'
