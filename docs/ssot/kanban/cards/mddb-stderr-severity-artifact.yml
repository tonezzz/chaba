id: mddb-stderr-severity-artifact
title: mddb writes INFO logs to stderr — journald scores them severe (21k/day on idc03)
column: doing
priority: high
program: chaba-ci
area: ops
note: 'logs-auto-idc03-severe-spike diag (a) — mddb sends INFO-level logging to stderr; journald maps container stderr to priority err and the log digest counts each as severe. Same artifact class as xmeye-vms wine noise on mn01.'
action:
  type: dispatch
  status: done
spec: |
  Fix at source OR digest — pick cheapest:
    A) mddb — redirect app logs to stdout or a file; keep stderr for real errors only.
       Check mddb logging setup (mddb.service on idc03); likely python logging
       defaulting to stderr — set StreamHandler(sys.stdout) or a FileHandler.
    B) digest — score container stderr by content priority, not fd — journald
       PRIORITY field or a known-noise regex allowlist per unit.
    Done-when — idc03 severe/24h drops from ~25k to true-error volume (<500) and
    mn01's xmeye-vms wine noise no longer counts as severe.
comms:
