  from: devin
  text: 'Iter-1b eval done: config.devnest-zen.yaml — zen/deepseek-v4.1-flash-free 4/4 @15.8s (fastest), zen/glm-5.3-flash-free
    4/4 @19.9s, bench 4/4 @27.0s, local qwen3:8b 0/4 (all timeouts). Zen free lane now a second always-on free brain.
    Still queued: Groq key needed for gpt-oss-120b leg; or-* weekly cap resets 2026-10-26 00:00Z.'
- at: 2026-10-25 10:25
  from: devin
  text: 'Iter-1c parallel research bench done (~/evals/research-lanes/): same research→lesson prompt on 4 DevNest
    lanes in ~2min. deepseek-v4.1-flash-free + glm-5.3-flash-free ran 6 websearches each → dense verified lessons;
    bench lanes did ZERO research → generic memory answers. DeepSeek output filed as education lesson 2369 (self-hosted-llm-inference-homelab).
    Finding: for research/education generation, tool-use depth is the differentiator — zen free brains beat flash-lite
    on this class too.'
- at: 2026-10-25 11:50
  from: devin
  text: 'Iter-1d Groq free tier: wired into LiteLLM on idc03 (groq-gpt-oss-120b, groq-gpt-oss-20b, groq-qwen3.8-27b
    + opencode allowlist). Bench config.devnest-groq.yaml: bench 3/4, gpt-oss-120b 1/4, qwen3.8-27b 0/4. Root causes
    measured: free TPM caps (8k/7k ITPM) sit BELOW one mid-session opencode request (~7.7-11.9k tokens) — hard fail,
    not throttle; litellm bug #47931 (reasoning_content echoed to Groq turn2+ → 400); qwen3.8 max_tokens cap 16384.
    Verdict: groq-free is for small-prompt latency-critical'
