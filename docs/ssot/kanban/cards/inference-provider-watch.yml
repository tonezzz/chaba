id: inference-provider-watch
title: Inference-provider market watch — iterate the living research + eval new brains on the dev-AI fleet
column: done
updated: 2026-11-26 03:52
brief: 'Living doc: devin-kb/docs/tools/inference-provider-market.md (iter 1, 2026-10-25). Each iteration: refresh
  prices/free tiers, add providers, and — per Tony — try candidates on the dev-AI fleet itself: eval-bed (new LiteLLM
  model group + config.<name>.yaml + cli-compare run vs bench baseline) AND live-task trials (route real chores/dispatch
  work to promising brains). Key cost rule: agent sessions are prefill-heavy, so cached-input price × cache-hit
  rate is the ranking metric, not headline $/Mtok.'
priority: medium
tags:
- research
- evals
- litellm
- recurring
spec: 'Queued experiments from iter-1 doc: (1) groq-free model group — gpt-oss-120b + qwen3.8-27b are FREE with
  real tool-calling and ~20x faster than CPU ollama — biggest free code-brain upgrade vs local qwen3:8b; add to
  LiteLLM + run config.ops.yaml comparison. (2) OpenCode Zen free promo models as zero-config runner. (3) $10 OpenRouter
  credit → 1000/day :free models + DeepSeek V4 Flash paid bench (~$0.05-0.11/session). (4) Mistral Experiment tier
  → Codestral leg. (5) Groq/Cerebras TTFT test for ada voice-aux lane. Naming note: fleet called DevNest (Ada Nest-family
  convention) pending Tony confirm.'
ref: OPS-0850
