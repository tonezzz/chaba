brief: 'Living doc: devin-kb/docs/tools/inference-provider-market.md (iter 1, 2026-10-25). Each iteration: refresh
  prices/free tiers, add providers, and — per Tony — try candidates on the dev-AI fleet itself: eval-bed (new LiteLLM
  model group + config.<name>.yaml + cli-compare run vs bench baseline) AND live-task trials (route real chores/dispatch
  work to promising brains). Key cost rule: agent sessions are prefill-heavy, so cached-input price × cache-hit
  rate is the ranking metric, not headline $/Mtok.'
