spec: 'Parent: card devin-usage-reduction, job doc docs/ssot/jobs/devnest/2026-11-24-devin-usage-reduction.yml.


  EVIDENCE (verified this session on idc02): `ls ~/.local/share/devin-dispatch/tasks | wc -l` = 917; 905 contain
  exit_code (finished per scripts/prune-devin-sessions.sh predicate), 12 do not, 9 no-exit_code dirs stale >7d.
  `systemctl --user status devin-cleanup.timer` = unit not found on idc02. Coverage map: devin-cleanup.timer declared
  in docs/ssot/infrastructure/ssot.devin.maintenance.yml for tony-dell + tony-omen only; job:devin-session-prune
  (docs/ssot/infrastructure/ssot.jobs.yml ~line 855) runs scripts/devin/session-prune.py --days 14 on tony_omen
  only and prunes sessions.db rows, NOT task dirs; repo systemd/devin-cleanup.{service,timer} ExecStart points at
  ~/CascadeProjects/chaba/scripts/prune-devin-sessions.sh which DOES contain a task-dir GC block (exit_code + retention)
  but the units were never installed on idc02.


  TASK: (1) Survey every dispatch-capable host (idc01/idc02/idc03/mn01/con01/tony-dell/tony-omen/tony-macbook):
  task-dir count, whether any prune unit/timer is installed+active, sessions.db size trend. (2) Declare coverage
  so every dispatch host gets task-dir GC — either per-host generated units (ssot.jobs.yml -> systemd/generated/<host>/)
  running a shared script, or extend session-prune.py to also GC task dirs; follow docs/kb/host-hygiene-rules.md
  (declared-or-dead, repo+restart changes, stated rollback). (3) Handle the no-exit_code case: dirs whose task died
  before writing exit_code — collect when stale (>14d) AND no live devin-task-<id> unit AND no needs-input.txt pending.
  (4) CRITICAL RETENTION CONSTRAINT: scripts/devin/devin-usage.py computes fleet usage by scanning these dirs —
  do not prune below the longest reporting window in use (30d+); either set task-dir retention >= 45d or export
  per-task metrics (prompt/cached/completion/model/finished_at JSONL) to a durable ledger before pruning older dirs.
  (5) One-time sweep of existing dirs per host after the declared path exists; post counts to this card.


  DONE WHEN: every dispatch host has a declared, active prune path covering task dirs incl. the no-exit_code case;
  ssot.jobs.yml/ssot.devin.maintenance.yml updated; devin-usage.py still returns correct 30d numbers after the sweep
  (verify by re-running before+after on idc02).'
