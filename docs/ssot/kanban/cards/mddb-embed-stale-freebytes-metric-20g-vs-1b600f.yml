  text: 'Root cause found: persistence.freeBytes is sampled ONCE at process start (statfs at open), never refreshed.
    Evidence: embed reported 20.5G (frozen from the Nov disk-full period); mddb-ops restarted 2026-11-11 reports
    45.8G = actual; restarting mddb-embed refreshed it to 45.7G = actual. Workaround = restart refreshes; real fix
    needs upstream periodic statfs — track under MEM-0024 (v2.18.x rebuild).'
