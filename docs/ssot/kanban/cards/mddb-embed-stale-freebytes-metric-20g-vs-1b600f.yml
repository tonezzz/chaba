id: mddb-embed-stale-freebytes-metric-20g-vs-1b600f
title: 'mddb-embed: stale freeBytes metric (20G vs actual ~75G)'
column: done
updated: 2026-11-14 14:14
brief: /v1/health freeBytes on :11028 is cached from a much earlier disk state; other instances report live values.
  Minor but could mask a real full-disk.
ref: MEM-0027
