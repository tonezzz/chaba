id: mddb-embed-stale-freebytes-metric-20g-vs-1b600f
title: 'mddb-embed: stale freeBytes metric (20G vs actual ~75G)'
column: done
updated: 2026-11-25 17:13
brief: /v1/health freeBytes on :11028 is cached from a much earlier disk state; other instances report live values.
  Minor but could mask a real full-disk.
ref: MEM-0027
comms:
- at: 2026-11-11 21:40
  from: devin
  text: card captured via board-api
- at: 2026-11-11 23:46
  from: devin
  text: 'Root cause found: persistence.freeBytes is sampled ONCE at process start (statfs at open), never refreshed.
    Evidence: embed reported 20.5G (frozen from the Nov disk-full period); mddb-ops restarted 2026-11-11 reports
    45.8G = actual; restarting mddb-embed refreshed it to 45.7G = actual. Workaround = restart refreshes; real fix
    needs upstream periodic statfs — track under MEM-0024 (v2.18.x rebuild).'
