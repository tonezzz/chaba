  comms. (4) Glue: document/script the tony-omen diarize -> mn01 corpus
  -> tony-dell render handoff (corpus already lives at mn01:~/media-corpus).
  Verify: full interview render with zero hand-labeled turns; turn table
  spot-checked against anchors; voices-per-speaker == 1 ready for the
  yt-voice-dub-scenarios benchmark.
