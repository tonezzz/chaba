  text: 'Landed on origin/master as ade8a652a (via ssh tony-dell push — tony-omen has no push:chaba). git-safe-pull
    now skips the board lock + entire mutating phase when upstream is already in HEAD (the common no-op tick); _gc_autostash
    moved outside the locked section (stash-refs only). _pull_needed still forces the phase for open rebases, unverifiable
    upstream, and SAFE_PULL_NO_REBASE=1. tests/test-kanban-commit.sh: 59/59 pass — G tests now inject real upstream
    commits to exercise the lock. Also docume'
