id: dispatch-merge-guard
title: 'Dispatcher: merge-guard + canonical default branch'
column: backlog
note: Two session-verified failure modes in the dispatch loop. (1) Sessions report done while leaving work uncommitted
  or unmerged — ~10 orphaned workstreams recovered in two days; a card only truly finishes when a human audits git
  state. (2) Worktrees are based on the checkout's CURRENT branch, not the repo default — the sunsynk-bat34 dispatch
  built on a stale Sep-2 'sunsynk' branch and reimplemented features mainline already shipped (verified redundant).
spec: 'In scripts/board/kanban-dispatch.py (and REPOS map in ~/.local/share/devin-dispatch): (a) add default_branch
  per repo — always create worktrees from origin/<default_branch>, never the checkout''s current branch; (b) before
  a card may transition review->done, assert ''git merge-base --is-ancestor <session-head> origin/<default>'' in
  the target repo — non-ancestor = comms entry ''unmerged commits remain'' and keep in review; (c) extend the check
  to dirty worktrees: uncommitted diff on session end = comms entry listing file count. Verify: dispatch a test
  card, leave an unmerged commit, confirm the card cannot close.'
