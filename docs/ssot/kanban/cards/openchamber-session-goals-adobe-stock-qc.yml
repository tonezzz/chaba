spec: 'Create a read-only Session Goal: inspect a named campaign idea, call the Adobe Stock reuse MCP report, list
  candidate assets with provenance, flag missing previews and open questions, and stop with a structured markdown/JSON
  artifact. The goal must not create cards, upload assets, generate images, license assets, or publish. Acceptance:
  the agent stops when the report, provenance checks, missing-preview list, and no-mutation receipt exist; it does
  not loop after completion; cost, turns, and final artifact are recorded.'
note: Later test only; keep current Ada permissions and board mutation boundary unchanged.
