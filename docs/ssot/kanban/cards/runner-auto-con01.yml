help: 'Per-check fixes:

  - tool-pin: A deployed tool''s sha differs from the pin read from origin/master (scripts/devin/runner-tooling.manifest.json).
  Refresh the checkout FIRST (git -C ~/CascadeProjects/chaba pull --ff-only), then run scripts/devin/sync-runner-tools.sh.
  If the checkout matches the pin but the install does not, the sync was skipped — check the sync-runner-tools journal
  line (dirty source / no pin / never-downgrade). Do not edit the manifest on a host; bump it in the same commit
  as the tool.

  - devin-dispatch: Usually self-heals within one chaba-repo-sync tick (sync-runner-tools.sh via git-safe-pull).
  Manual: scp scripts/devin/devin-dispatch.sh <host>:~/.local/bin/devin-dispatch && ssh <host> chmod +x ~/.local/bin/devin-dispatch'
