id: nest-mgr-mddb-writer-endpoint-404
title: 'nest-mgr on tony-macbook: MDDB publish path 404s every tick'
column: done
updated: 2026-11-26 20:34
priority: medium
tags:
- nest-mgr
- tony-macbook
- mddb
- idc03
spec: 'nest-mgr.service installed on tony-macbook 2026-11-17 (card ops-macbook-nestmgr-install) runs active but
  every tick fails: "tick error: Remote end closed connection without response". It publishes ada-cms-pages/nest-<host>
  via MDDB_BASE_URL default http://100.102.134.91:11027/v1 — port answers but GET / and /v1/ return 404 and POSTs
  get connection-closed. Find the correct writer endpoint/path for ada-cms-pages on idc03 (check mddb/mddb-cms units,
  ports 11023-11027, and how other nest/host publishers write), fix MDDB_BASE_URL or the POST path in nest-mgr.py,
  restart nest-mgr.service on tony-macbook, verify a tick lands nest-tony-macbook.'
ref: MEM-0216
comms:
- at: 2026-11-19 08:31
  from: devin
  text: card captured via board-api
- at: 2026-11-19 08:33
  from: devin
  text: 'Resolved — not a nest-mgr bug. Endpoint was always correct (mddb-cms :11027/v1, per 2026-10-13 cutover).
    Real cause: mddb-cms embed-queue saturation during Gemini/OR quota exhaustion made every /v1/add exceed the
    30s write timeout → RemoteDisconnected on the client. Writes still landed; nest-tony-macbook page kept refreshing.
    Journal clean since ~07:07 ICT; last publish 08:30 ICT verified via /v1/get. Underlying infra issue carded separately
    as mddb-cms-embed-quota-write-timeout-stall (MEM-0217)'
