comms:
- at: 2026-10-20 19:25
  from: devin
  text: 'Design: batch-job package format (notebook or script + Drive-mounted output + checkpoint-resume discipline)
    + a queue the dispatch drains when a Colab session is already alive. Candidates: NCM training (anchor), mddb
    embedding backfills, yomi yomi_daily_batch, yolo experiments (wt-yolo-idle), Thai tokenizer evals, txt2vid batch
    renders. EXCLUDE always-on inference endpoints (omen llama/imagen2/txt2vid — need stable sockets). Phase 0 =
    reuse for NCM Sudoku validation session; generalize only if t'
- at: 2026-10-23 11:48
  from: devin
  text: 'nest-queue spec (Tony 2026-10-23): ONE job-pack contract {name,lane,scope,prep,run,artifacts} on TWO transports
    — lane:colab appends to gdrive:ada-nest/queue (detached runner.py, done markers, heartbeat, prep/GPU overlap,
    save+restore hf-cache all live + verified today); lane:omen-gpu|dell-cpu|idc|kk-mac goes through EXISTING kanban
    dispatch (labels+RUNNER_CAP — do not build a second fleet queue). Hardening list: artifact-granular tasks (one
    artifact=one marker; LTX pre-split embeds is the model'
- at: 2026-10-23 12:32
  from: devin
  text: 'v2 spec APPROVED by Tony — nest-pack: pull-based worker fleet. Unit of work = pack dir {pack.yml, inputs/,
    run.sh|py} — pack.yml = {name, needs:{gpu_gb,disk_gb,egress_only_ok}, prep, run, artifacts[globs], timeout_s}.
    Lanes become CAPABILITIES not routes: colab=gpu15g+ephemeral+egress-only, omen=gpu4g+always-on, dell/idc=cpu,
    kk-mac=idle-window-gated. Same loop everywhere: scan store -> claim pack matching needs -> prep/run -> verify
    artifacts -> mark done. Transports: one interface two stores —'
- at: 2026-10-23 12:53
  from: devin
  text: 'v3 spec APPROVED — three legs: (1) PACKS: self-contained dir {pack.yml{name,needs{gpu_gb,disk_gb,egress_only_ok},prep,run|run_sh,artifacts,scope,timeout_s},inputs/}
    — needs=capability floor not hostname; optimistic claim packs/<name>/claim/<worker>; done at packs/<name>/done.
    SHIPPED in runner.py today incl smoke pack. (2) nest-job CPT: WP record upserted by slug, hierarchical parent/child
    = job tree; parent status DERIVED from children; comments = job comms (queue-mgr transitions + agent decisi'
- at: 2026-10-23 14:04
  from: devin
  text: 'v4 spec APPROVED — nest-fence (split-brain fix for cattle workers). Lease file queue/lease={worker,epoch,ts}:
    new runner bumps epoch at boot; highest epoch = only legit writer; ties break on smaller worker id. Fence thread
    re-reads lease every 15s + inline check before every mutating step (claim/done/artifact) — zombie that resurfaces
    self-exits process group BEFORE it writes. Zombie paths closed: same-VM survivor (kernel restart), 2-VM race
    (the 2-colab-tabs case — newer epoch wins, loser suici'
