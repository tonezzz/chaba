requests:
- id: which-storage-target-should-the-omen-par-dd9b61
  ask: Which storage target should the Omen partition plan optimize? No disk changes will run until you select an
    option and backup gates are satisfied.
  status: answered
  at: 2026-10-25 12:18
  from: devin
  options:
  - Expand /home p3 into the adjacent ~114.5GiB free gap; preserve p5 (recommended because /home is 98% full). Requires
    a verified full backup and offline filesystem move plan.
  - Expand /data p7 by reclaiming the ~40.7GiB gap and old p5 (64.9GiB); only if p5 contents are confirmed disposable
    or independently backed up.
  - Do both after full, off-disk backup and partition-table backup; highest usable capacity and highest operation
    risk.
  - No partition edits; keep layout and manage storage by moving caches/data to /data.
  suggested: Expand /home p3 into the adjacent ~114.5GiB free gap; preserve p5 (recommended because /home is 98%
    full). Requires a verified full backup and offline filesystem move plan.
  answer: 'Option 3: expand both /home and /data; p5 contents are disposable.'
