spec: 'Soak 2026-11-08: con01 dropped → pool stayed 15/15 ok but p50 degraded 131ms→2264ms (~17x). Shim races all
  upstreams; a dead member fails fast via connect-refused so the latency is really just losing the fastest winner
  — but a cheap improvement exists: mark an upstream suspect after N consecutive failures and race it last (or health-gate
  it) for a cooldown, so dead members cost ~0 instead of a wasted race slot. Read scripts/nest/embed-pool-shim.py
  _race/_call + /health stats for winner distribution first; keep it small — racing proxy stays the design.'
