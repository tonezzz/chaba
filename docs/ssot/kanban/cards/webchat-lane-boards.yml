spec: 'Tony 2026-10-14: a chat screen like TG/LINE on the boards website; he will test when ready. Surveyed WP plugins
  + GitHub (AI Engine/EasyIT/Kaddora/Chatzio all call a raw OpenAI-compatible endpoint — loses persona/memory/tools/journal;
  Chatwoot et al are human-agent consoles). Bespoke widget wins because the backend already exists.


  Design: ~200-line JS chat panel (LINE-style bubbles) on a private WP page under /chat/ tree; opens ws to the member''s
  ada lane (ws://lane/ws?api_key=<member key>&channel=web&chat_id=web-<member>&mode=text) or a thin POST /api/chat
  shim; assistant_transcript_delta streams bubbles; tool results with image_url/video_url render inline. Turns journal
  with channel=web so the timeline picks them up like LINE/TG turns.


  Backend gaps to fill: (a) web channel accepted on the ws path — relay-style lane routing or direct per-lane connect;
  (b) member auth — reuse /api/auth invite+redeem flow (member clicks link -> key bound to lane/person); (c) WP
  page hosting the widget (private status like /chat/line/*); (d) outbound push on web is free — solves the LINE
  quota problem for proactive sends (OPS-0651 pattern).'
