spec: 'Build a matched A/B benchmark: same finite batch workload, same host/resource gate, same inputs and verifier.
  Compare legacy systemd/dispatcher versus Nest pack/worker on time-to-start, throughput, queue wait, worker utilization,
  retries, duplicate work, stale claims, artifact completeness, verification rate, operator minutes, token/model
  cost, and recovery after worker interruption. Produce L0 JSON, L1 technical report, L2 operator brief, L3 plain
  summary. Inventory the 87 jobs in docs/ssot/infrastructure/ssot.jobs.yml and classify each as nest_candidate,
  keep_scheduled, card_dispatch, or manual/service. Do not migrate watchdogs, backups, webhooks, telemetry, or low-latency
  service loops merely for uniformity. Pilot audits/backfills/benchmarks/media batches first; require done-marker/verifier
  parity before promotion.'
