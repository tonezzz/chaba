    ssh round-trip, parallel), check_mode:no probes, controller self-detect/local pattern, per-host reports in reports/ansible-benchmark/host-software/<host>.yml.
    No host installs/changes. Syntax check passed. Sample run (--limit tony-dell,tony-omen,idc03): ok=4'
