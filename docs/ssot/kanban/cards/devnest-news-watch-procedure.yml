id: devnest-news-watch-procedure
title: 'DevNest news watch: detect milestones and update news reports'
column: review
updated: 2026-10-27 05:46
brief: Keep DevNest news reports current as the system advances, without turning every routine run into a news item.
priority: medium
program: ai-workforce
tags:
- devnest
- news
- report
- education
- procedure
spec: 'Daily/weekly scan sources: board comments/status, git commits, pack artifacts, benchmark results, lessons,
  audit reports, and cost/usage. Publish/update only on newsworthy triggers: first production milestone, verified
  benchmark delta, real savings, new capability, important failure/root cause, or user-visible interface. Every
  item needs evidence link, date, impact, before/after, confidence, and next step. Integrate with existing news-digest
  clustering; update an existing story when it is the same evolving thread, otherwise create a new parent. Link
  news -> Education for depth and SSOT for decision state. No secrets, speculation, or unverified savings.'
ref: OPS-0900
