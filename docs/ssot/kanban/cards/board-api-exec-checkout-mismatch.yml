id: board-api-exec-checkout-mismatch
title: board-api running from exec checkout — card writes not reaching served/web board
column: review
updated: 2026-11-07 11:08
brief: 'New board-api cards/commits land in idc03 ~/CascadeProjects/chaba (exec) and stay unpushed, while kanban-commit
  sweeps ~/CascadeProjects/chaba-tony-dell (served). Result: cards exist via /cards but never appear on the static
  kanban page.'
priority: high
spec: 'Evidence 2026-11-06: board-api process pid cwd = /home/tony/CascadeProjects/chaba on idc03 (pgrep -af board-api.py).
  That checkout is 133 commits ahead of origin/master and contains OPS-1045 commits e795d37ce/ab5f2a4ed/1854009d6,
  but origin/master does not contain them. kanban-commit.service ExecStart uses ~/CascadeProjects/chaba-tony-dell/scripts/board/kanban-commit.sh
  (REPO defaults to ~/CascadeProjects/chaba-tony-dell). The static board served on tony-dell (/apps/board/cards.json,
  /apps/board2/cards.json) has 1170 cards with no OPS-1045 hit, while board-api GET /cards?id=adobe-stock-kk-mac-render-poc
  returns the card. Likely fix: run/restart board-api with cwd ~/CascadeProjects/chaba-tony-dell (served writer)
  or otherwise route board-api writes into the served checkout so kanban-commit commits+pushes them; then reconcile
  the 133 unpushed chaba commits without losing card writes.'
note: Found while OPS-1045 did not appear on the kanban tab.
ref: KNB-1047
