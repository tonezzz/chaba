brief: 'Read-only browser check of https://ada-ha.surf-thailand.com/chaba-admin/ada-ocb on 2026-11-12: blank New
  session view and session-list endpoints work. After one approved diagnostic prompt, OpenChamber created session
  ses_e2cdde286ffeAKJswC0WhnOnhS and POST /api/session/<id>/prompt returned HTTP 200, but the UI showed: ''Opencode
  failed to send message with error: Authentication Error, No api key passed in.'' Selected model was Gemini 3.5
  Flash Lite (provider label ada). OpenCode compatibility reports 2.2.7 compatible. No credential/model config changed.
  Diagnostic session titled ''OpenChamber dia'
priority: medium
program: devnest
