spec: Fix Ada OpenChamber prompt execution for new sessions. The session create path succeeds; first model call
  fails with missing API key for selected Gemini 3.5 Flash Lite / ada provider. Decide whether to restore the provider
  credential or use an available free model for this project. Do not put API keys in card comments or chat; use
  the approved secret path.
note: The separate OpenChamber UI unlock is required in addition to Cloudflare Access. After unlock auth/session=200,
  GET /api/session=200. The log warnings about turn-duration/session-assist were not proven causal.
