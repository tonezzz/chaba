id: market-report-design
title: Structural market report — gold, USD/THB, stocks → CMS page
column: backlog
note: >-
  Tony ask (2026-10-06): design a structured market report covering Thai
  gold (GTA fixings, 2006+ in DB), USD/THB + majors (FRED/ECB/Yahoo,
  1971+), DXY, WTI, and interesting SET/global stocks. Suggested shape:
  generated CMS page `market-report` (en+th) with a managed block, daily
  job on a timer, provenance per ssot.apps.cms-reports.yml — same pattern
  as flood-report (flood-news-update.py). Data source: trade prod
  PostgreSQL (290k exchange_rates / 58k commodity_prices / 13k
  dollar_index rows) — query, don't re-scrape. Open questions for the
  design: which stocks make the "interesting" list; day-over-day deltas
  vs 7d trend; does it feed Ada's spoken briefing; where the daily job
  runs (idc01 vs tony-dell). Design doc goes to docs/assessments/ or
  docs/design/, then a generator script + registry entry.
updated: '2026-10-06'
