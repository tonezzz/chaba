id: render-board-worktree-rglob-slow
title: render-board.py _outcome_index rglobs docs/ssot/jobs across every dispatch-wt-* — ~60-100s per render on
  worktree-heavy hosts
column: review
updated: 2026-11-17 18:44
brief: 'Found via OPS-0127 test profiling: kanban-dispatch runs render-board.py after every card mutation; _outcome_index()
  does root.rglob(''dispatch-outcome-*.md'') for EVERY dispatch-wt-* sibling of the repo. On hosts with 15+ worktrees
  this is ~60-100s per render, every dispatch pass. Tests now noop it; production still pays it.'
priority: medium
tags:
- perf,board,dispatch
spec: 'Fix _outcome_index in scripts/render-board.py: the per-worktree rglob exists to find dispatch-outcome files
  written inside dispatch worktrees. Options: (a) index only worktrees with recent mtimes (e.g. skip dirs untouched
  >24h), (b) maintain a single index file updated at dispatch close-out instead of scanning, (c) cap the worktree
  set to active ones from /queue or runner state, (d) accept a --no-outcomes fast path for the kanban-dispatch inline
  render and let the dedicated chaba-board-render job do the full scan. Measure first: time render-board.py on idc03
  (served) and tony-omen.'
ref: KNB-0162
