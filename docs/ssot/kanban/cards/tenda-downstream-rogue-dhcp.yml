  text: 'Router forensics (ZTE F688 authenticated admin): (1) ONT DHCP scope = ONLY 192.168.2.65-.99/24, no .1.x
    scope configured. (2) Port binding: LAN1-4 + SSID1-8 all on one flat TR069_INTERNET bridge. (3) LAN client table:
    tony-macbook (00:e0:4c) cabled to LAN3 carrying the rogue .1.106 lease; KKs-Mac-Studio LAN1 (.2.80); tony-dell
    LAN2 (.2.67). (4) .1.x OFFER src MAC 06:28:58:26:4b:2c = tony-repeater wireless-side MAC — emitter is BEHIND
    the Tenda (LAN port or -ext SSID): TrueID box / TV-corner gear'
