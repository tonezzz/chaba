spec: 'Architecture: (1) code-decision service — state {task, code context, candidates} + Choice(which construct/template/library)
  + Noul(semantics preserved, convention match, minimality); (2) agent skill — call before applying a change; (3)
  eval pack — bench Jev''s choice vs human-verified verdicts. Backend: real Jev API (key) with jev-student noul
  fallback. See the design doc.'
