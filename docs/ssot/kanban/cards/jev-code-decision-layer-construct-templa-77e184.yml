brief: 'Tony 2026-10-24: can Jev decide for/while/do, which template/pattern, which replacement/modification, or
  which library to use? Decomposed: Jev = router/gate around the LLM, not the writer. Design doc written for review
  (docs/kb/jev-code-decision.md).'
