id: boards-502-residuals-dns-h3-access
title: 'Boards 502 residuals: idc02 edge DNS flakiness + h3 forensic access gap'
column: done
updated: 2026-11-25 17:27
brief: 'Two residuals from boards-public-origin-502 RCA (docs/ssot/jobs/infrastructure/2026-11-09-boards-origin-502-rca.yml):
  (1) idc02 caddy-edge gets sporadic systemd-resolved lookup i/o timeouts for boards.h3.gizmo-thailand.com (zone
  NS lin3/lin4.readyidc.com) — each blip = a public 502; still seen 11-06/11-07. Fix: pin resolved upstreams or
  give the edge a resolver/dial fallback. (2) No SSH/Plesk-panel path to h3 (ReadyIDC 103.99.11.249) exists on ops
  hosts — the 10-29 upstream-death trigger is unknowable without it. Decide where h3 panel/ssh access should live
  and record it in ssot.secrets.'
priority: medium
program: infrastructure
tags:
- boards
- dns
- plesk
- followup
spec: 'See RCA doc. Part 1: harden idc02 edge DNS for h3 upstream (measure failure rate over a week first via journalctl
  -u caddy-edge | grep "lookup boards.h3"). Part 2: obtain + register h3 Plesk-panel or SSH access for forensics;
  wp-admin credential precedent lives on tony-omen (~/.config/secrets/boards-surf-thailand-com-wp-admin-credential).'
ref: KNB-1245
