    (rerank top-K + dense tail): top10 .262/.938, top20 .251/.892, top30 .263/.887, top50 .260/.869 (overall r@5/MRR).
    Top-10 BEATS Gemini outright (.938 vs .893 MRR; Thai 1.000) at 565ms — deep pools dilute, the cross-encoder
    does its best work on the dense head. RECOMMEND: top-10 sync rerank (~565ms after ~130ms dense fetch ~= 700ms
    voice path), keep Gemini as fallback upstream. Lighter-reranker'
