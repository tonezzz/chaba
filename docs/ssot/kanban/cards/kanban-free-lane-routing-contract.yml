id: kanban-free-lane-routing-contract
title: 'Kanban lane-routing contract: free-first dispatch, envelope, verify, escalate'
column: backlog
updated: 2026-11-24 08:32
brief: 'Codify the lane-routing and closeout contract proven by the ADA-0242 free-lane pilot and the ADA-0042 runner
  fixes: exhaust free/deterministic lanes before paid_frontier and Devin; every opencode dispatch carries a complete
  lane_envelope; verification is held-out and merge-gated; escalation is deliberate and recorded.'
priority: medium
program: devnest
tags:
- kanban
- routing
- free-lane
- workflow
- contract
spec: "STATUS: draft contract for review — manual card, not queued for dispatch. Evidence base: ADA-0242 pilot (opencode/deepseek-v4.1-flash-free,\
  \ $0, 21s, verifier pass) and fixes 317d205d36, 407485dc18, 31efaee4be, d9b324556a.\n\n1. ROUTING ORDER (queue-time,\
  \ cheapest capable first):\n   a. deterministic/script lanes (codemod, kk_mac_local admitted classes) — zero tokens;\n\
  \   b. free lanes: opencode Zen free models (opencode/*-free, separate quota from OpenRouter or-free-*), jules,\
  \ nlm_batch where admitted;\n   c. paid_frontier (litellm/gemini-*) — contained work needing stronger reasoning;\n\
  \   d. devin — last resort: multi-step, cross-repo, ambiguous, or needs mutations/external access no free profile\
  \ has (AUD-0973 precedent).\n   Never blind-try every lane; classify once, record lane_source+confidence.\n\n\
  2. DISPATCH ENVELOPE (opencode/jules lanes): action.lane_envelope REQUIRED — {task_class, stage, target_host,\
  \ profile, model, provider, artifact, verifier{type,ref}, escalation{max_retries}, prompt constraints}. Envelope\
  \ may only TIGHTEN action.max_attempts/KANBAN_MAX_ATTEMPTS; max_retries:0 = one dispatch total. Missing/incomplete\
  \ envelope = held at claim, stays queued, NO attempt burned (runner-agent claim-hold, DEV-0253).\n\n3. FREE-LANE\
  \ PROFILE RULES: read-only profiles (ops-readonly, ssot-research, info-find) for reports/audits; artifact under\
  \ evals/opencode-lane/out/ or profile allowed_paths; held-out verifier ref committed to repo BEFORE dispatch;\
  \ no paid fallback, no config/service mutation, max one narrowing attempt then escalate with recorded reason.\n\
  \n4. VERIFICATION + CLOSEOUT: artifact must byte-match original host-tool output (opencode v2 shell events supported);\
  \ held-out verifier hash unchanged + re-run pass; artifact_landed, tool_denials=0, no scope violations. merge-sweep\
  \ verified gate = exit-0 evidence + real deliverable (commits vs base) + auto_done_when; verified stamps only\
  \ when head is provably on origin (runner-push-cred-gap); verified cards auto-close unless review_kind human-gated.\n\
  \n5. RETRY/ESCALATION: generic cap action.max_attempts or KANBAN_MAX_ATTEMPTS (default 2); lane_envelope.escalation.max_retries\
  \ tightens only. Human /action do=retry resets attempts=0 (explicit escape). Provider 429s scan dispatch taskdir\
  \ lane logs first and arm shared-resource cooldowns.\n\n6. CARD TEMPLATE (dispatch cards): action.{type=dispatch,\
  \ lane, model, executor?, repo, host/target_host, profile, artifact, verifier, lane_envelope, llm_key_alias?,\
  \ max_attempts?} + spec with gate/stop conditions + auto_done_when when machine-checkable.\n\n7. MEASUREMENT:\
  \ run.json records provider_cost_usd, tokens, wall_s, tool_denials, verifier_pass, human_minutes — review weekly\
  \ to tune routing."
action:
  type: manual
ref: KNB-0244
