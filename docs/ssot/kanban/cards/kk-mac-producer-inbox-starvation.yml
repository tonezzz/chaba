id: kk-mac-producer-inbox-starvation
title: kk-mac capacity producer starves on 103-file inbox — new specs never staged
column: done
updated: 2026-11-14 14:14
priority: medium
tags:
- devnest,kk-mac
spec: 'Found 2026-11-13 while checking why kk-mac lane was idle.


  SYMPTOM: gdrive:ada-nest/kk-llm/inbox/ holds 103 task specs (report-review-* etc, newest 2026-11-13) but packs/
  has produced nothing new since 2026-11-12; queue_before stuck at 1.


  ROOT CAUSE (scripts/devnest/kk_mac_capacity_producer.py):

  1. Starvation: produce() iterates inbox files in rclone-lsf order and calls load_task() (an `rclone cat` per file,
  ~5-20s each over gdrive) BEFORE the cheap `pack_name in existing_packs` check. With 90s budget it reaches only
  ~17 files/run; every run re-validates the same already-staged head of the list and hits budget_exhausted before
  reaching the ~86 unstaged specs. Runs every 5min forever, never converging.

  2. Inbox is never drained — consumed specs stay in inbox/ forever, so the already_staged re-check cost repeats
  every run and grows with the backlog.

  3. Wedged pack: kk-mac-task-report-review-a8ff708e96d4/ exists on Drive but is EMPTY (dir created 2026-10-31,
  rclone copy died mid-upload). pack_name in existing_packs -> its inbox spec reports already_staged forever, and
  the hollow dir counts as a live pack (queue_before=1 of max-depth 3) since it can never get done/failed.


  FIX OPTIONS:

  - Reorder: check pack existence BEFORE load_task (task_id == filename stem for report-review specs — verified),
  or skip cat entirely when a marker file (e.g. inbox .staged) exists.

  - Drain/move consumed inbox specs to inbox/done/ so the listing shrinks.

  - Treat empty pack dirs (no pack.yml) as not-staged so a8ff can re-stage; or have submit verify upload.

  - Alternatively batch: single rclone cat of a manifest, or raise budget within the 4m unit timeout.


  VERIFY: after fix, producer log shows staged:[...] non-empty and new kk-mac-task-report-review-* packs appear
  on Drive; kk-mac (ollama lane) claims and completes them.'
ref: OPS-0083
