id: mn01-external-canary
title: "host-down alerting — ops-event on reachability flips"
column: done
priority: medium
created: 2026-10-10
updated: '2026-10-10'
note: >
  mn01 sat dark ~5 days (Oct 5-10) unnoticed — local mn01-canary can't
  fire when the host is down. host-loads.py already detects unreachable
  every 5min; added transition detection: reachable->unreachable emits
  kind=ops-event type=host_down to ada-ha-events-tony (ops-digest picks
  it up), recovery emits host_up once. State sidecar at
  reports/host-loads/.prev-state.json. AQ: flip a host's prev-state to
  up while unreachable -> host_down doc lands in mddb; recover ->
  host_up once, no repeat spam.
links:
  - docs/kb/hardware-mn01-tony-usb.md
  - scripts/host-loads.py
