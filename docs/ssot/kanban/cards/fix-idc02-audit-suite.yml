spec: |
  From reports/audits/summary.json on idc02 (run Oct 04, still open):

  1. security-audit — scripts/security-audit.sh line ~263 calls `docker`
     which doesn't exist on idc02. Use podman fallback (podman-remote or
     detect runtime), or skip docker-only checks when absent.
  2. caddy — "Caddy format failed" — find which Caddyfile fails `caddy
     fmt` (probably stacks/web/Caddyfile post-gesture-merge — I edited it
     today for /apps/gesture-live routes; run caddy fmt --check on it).
  3. standardization — "duplicate audit name: cms-pages" — two audits
     registered under the same name in ssot.audit.yml; dedupe.
  4. The cms-pages audit itself hits the dead mddb IP — that's covered by
     card sweep-stale-mddb-endpoint; just note the dependency.

  These are the audit suite's OWN findings — fixing them is what the
  suite is for. Remove known_failed entries for chaba-audit.service /
  chaba-audit-full.service in ssot.audit.hosts.yml once the suite runs
  clean (or confirms findings genuinely resolved).
  VERIFY: manual chaba-audit.service run on idc02 exits 0 or only warns.
