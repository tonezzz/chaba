spec: 'ada_render_video calls generativelanguage.googleapis.com directly (predictLongRunning + operation polling
  via ADA_GEMINI_API_BASE/GEMINI_API_KEY), so Veo spend (~$0.15/sec, ~$1.20/8s clip) bills the lane''s AI Studio
  key but never appears in the LiteLLM spend ledger — unlike ada_render_image which routes through the ''image''
  class. Options: (a) route video through a LiteLLM ''video'' class if the proxy supports predictLongRunning + operation
  polling passthrough (verify upstream support first); (b) meter in-tool — log estimated spend (secs * rate) into
  the local spend-ledger.jsonl at submit time; (c) accept and document the gap. Recommendation: (b) as the cheap
  reliable path, (a) if LiteLLM proxying works. Context: video is now owner-only (ADA_RENDER_VIDEO_OPEN, ada-ha-tony
  only) so exposure is small, but the ledger hole is real if it ever opens wider.'
