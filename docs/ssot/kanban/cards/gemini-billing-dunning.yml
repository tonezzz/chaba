id: gemini-billing-dunning
title: 'Gemini Live dunning-blocked — "Lightning dunning decision is deny" kills every Ada session'
column: backlog
priority: high
kind: ops
created: '2026-10-11'
tags:
- incident
- billing
- gemini
- secrets
brief: 'Since ~11:40 2026-10-11 every google.genai.live connect from ada-ha-tony is
  rejected at handshake: ws close 1008, "Lightning dunning decision is deny for project:
  projects/517766007004". This is billing/account state, not app code — no local fix
  exists. Effect: TG relay turns, voice, and any Live-dependent tool die before the
  first frame; the ada-chat OR text fallback (done) covers only the chat lane.'
spec: 'Tony-side only: (a) settle the billing/dunning flag on GCP project 517766007004
  (console.cloud.google.com billing), or (b) point ada-ha-tony at a different billed
  project''s GEMINI_API_KEY via secret-drop into idc03 ~/.config/secrets/ada-ha-tony.env.
  Verify after: a ws session reaches live (no 1008) — journal stops showing the
  dunning line and a TG text turn gets a real reply.'
requests:
- id: billing-or-new-key
  ask: 'GCP project 517766007004 is dunning-denied — Gemini Live refuses every connect
    (1008). Two options, pick one: (1) settle billing on that project in the GCP
    console, or (2) secret-drop a GEMINI_API_KEY from a healthy billed project —
    I''ll swap idc03 ada-ha-tony.env and restart. No ETA pressure but TG/voice are
    down until then.'
  from: devin
  to: tony
  status: open
  options:
  - id: settle-billing
    label: settle billing on project 517766007004
  - id: new-project-key
    label: secret-drop a key from another billed project
  suggested: settle-billing
  at: 2026-10-11 14:10
comms:
- at: 2026-10-11 14:10
  from: devin
  text: 'filed during review sweep — evidence: ada-ha-tony journal 11:40 + 12:06,
    ws close 1008 "Lightning dunning decision is deny for project: projects/517766007004".
    Tony''s TG message (sent ~12:xx) never reached a session — relay logged only
    outbound sends, no inbound payload survived; asked him to resend via any lane.
    OR text fallback keeps /chat alive; TG relay + voice have no fallback.'
