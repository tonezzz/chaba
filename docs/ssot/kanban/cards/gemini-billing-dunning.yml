brief: 'Since ~11:40 2026-10-11 every google.genai.live connect from ada-ha-tony is rejected at handshake: ws close
  1008, "Lightning dunning decision is deny for project: projects/517766007004". This is billing/account state,
  not app code — no local fix exists. Effect: TG relay turns, voice, and any Live-dependent tool die before the
  first frame; the ada-chat OR text fallback (done) covers only the chat lane.'
spec: 'Tony-side only: (a) settle the billing/dunning flag on GCP project 517766007004 (console.cloud.google.com
  billing), or (b) point ada-ha-tony at a different billed project''s GEMINI_API_KEY via secret-drop into idc03
  ~/.config/secrets/ada-ha-tony.env. Verify after: a ws session reaches live (no 1008) — journal stops showing the
  dunning line and a TG text turn gets a real reply.'
