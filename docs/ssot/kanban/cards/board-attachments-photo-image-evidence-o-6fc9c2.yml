note: 'Tony: "Can you let me upload the ups image into the card. Should be a good idea to attach photo
  evidence." Driver card: find-ups-replacement-batteries — needs 2 UPS photos attached. Feature: board-api
  POST /upload or /attach {id, filename, b64|multipart} storing under docs/ssot/kanban/attachments/<card-id>/
  (or CMS media), comms entry links the file. Board UI renders thumbnails. Also useful for incident captures,
  receipts, before/after screenshots.'
