spec: 'Goal: Implement photo and image evidence attachments for Kanban cards via board-api and render
  thumbnails in the Board UI. Host/Repo: tony-dell / chaba. Constraints: Provide POST /upload or /attach
  accepting id, filename, and payload, storing files under docs/ssot/kanban/attachments/<card-id>/ while
  linking them via comms entries, and ensure board UI renders thumbnails. Testable done-condition: Uploading
  a UPS replacement battery photo via the API successfully stores the file in the designated SSOT path,
  creates a linked comms entry, and displays the thumbnail in the board UI.'
