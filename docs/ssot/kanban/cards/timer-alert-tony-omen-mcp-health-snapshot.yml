spec: Investigate the recurring exit-code failure of the `mcp-health-snapshot.service` timer on the host tony-omen.
  Check the systemd user journal using `journalctl --user -u mcp-health-snapshot.service` and review the CMS entry
  `timer-timeline-tony-omen`. Ensure the installed runner-agent is redeployed if drifted by copying `scripts/board/runner-agent.py`
  to `~/.local/bin/runner-agent` on tony-omen. The done-condition is verified when `mcp-health-snapshot.service`
  successfully executes on tony-omen without returning an exit-code failure.
