spec: 'Build scripts/voice-bench/ — the harness that every voice-fallback combo card runs through. Research base:
  docs/kb/voice-fallback-options.md.


  Requirements:

  1. fixtures/ — generated audio fixtures (NOT recorded): synthesize ~20 phrases via Gemini/Azure TTS, half English
  half Thai, covering: HA device commands (turn on X, what is Y temp), questions needing tool calls, short chit-chat.
  Store wav + expected transcript + expected tool-call JSON per fixture. Committing synthesized audio is fine (small).

  2. combos.yml — declarative combo definitions: {id, stt, llm, tts, orchestrator, host_labels, notes}. Loader validates
  against this file.

  3. bench.py — given a combo id: bring up the stack (podman/local), stream each fixture through it, measure per-fixture:
  time-to-first-audio ms, total round-trip ms, STT transcript vs expected (WER), tool-call match (exact/partial/none).
  Output results/<combo>-<ts>.json.

  4. report.py — render results to reports/voice-fallback/LATEST.md table (combo x metric) + append trend row; post
  a summary comment back to the card via board API.

  5. Keep it runnable via action.type=script on runner hosts (repo-sync + cmd). GPU combos get labels [gpu].


  Do NOT implement the combos themselves — harness only. Verify: bench.py --combo <dummy> --dry-run produces the
  JSON schema; report.py renders an empty table without error.'
