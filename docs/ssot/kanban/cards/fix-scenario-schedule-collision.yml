id: fix-scenario-schedule-collision
title: Weekly ada-scenario suites on idc03 refused by bench-lock contention
brief: 2026-10-09 audit — ada-scenario-reports (Thu 03:30) and ada-scenario-tools (Fri 03:30) fail with 'another
  scenario benchmark is already running — refusing'. The refusal is correct (concurrent suites share the Ada session
  and corrupt results), but the schedule guarantees collisions — hourly ada-scenario-smoke + daily ada-scenario-casting
  (04:30) + ada-bench-casting (02:00) all surround the weekly 03:30 slots. Weekly suites get skipped whenever a
  run overruns.
column: doing
review_kind: verify
priority: medium
kind: improvement
created: '2026-10-09'
tags:
