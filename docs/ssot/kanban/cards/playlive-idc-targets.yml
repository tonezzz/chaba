id: playlive-idc-targets
title: Provision playlived/Chrome lanes on idc hosts (target preference)
brief: 'Tony prefers idc01–idc03 as PlayLive targets (2026-10-08). No idc host
  runs playlived today — the preference is recorded but cannot activate until
  one is provisioned. This card is the provisioning work.'
column: backlog
priority: medium
created: 2026-10-08
note: 'Preference recorded in docs/ssot/infrastructure/playlive-hosts.yml
  (target_preference block) + ssot.apps.playlive.yml. Scope: pick the idc host
  (idc02 suggested — least loaded; idc01 is retired/cold-batch so keep it last),
  install a user playlived.service there (reuse stacks/ or
  mcp-servers/mcp-playlive unit from tony-dell), add the host to
  playlive-hosts.yml hosts: + per_host: + failover:, update self_heal commands,
  then flip target_preference.status to active. Constraints: VPS CPU is modest —
  headless Playwright only (no chrome-live heavy sessions); keep tony-dell
  as fallback. idc01 must never take ada services or mddb writes (retired host)
  per ssot.host-roles.'
