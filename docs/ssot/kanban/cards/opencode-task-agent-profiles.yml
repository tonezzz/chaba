spec: 'Add task-scoped OpenCode agent profiles, keeping the generic build agent out of unattended routing. Profiles:
  ops-readonly (host/MCP reports, no repo writes), ssot-research (read-only SSOT/education retrieval, citations
  required), storage-dryrun (inventory/classification only, no deletion), and branch-code (isolated worktree, strong
  model, tests and review required). Each profile must declare allowed MCP tools, denied tools, allowed paths, target_host
  requirement, artifact schema, verifier, escalation, and rollback. Render/use profiles from DevNest task envelopes;
  keep global OpenCode MCP surface minimal. Add smoke tests for denied tools/path writes and one fixture per profile.
  Do not enable branch-code or cleanup apply in this card. Acceptance: profile config validates, ops-readonly and
  ssot-research run one real read-only job each, storage-dryrun refuses unsafe automatic candidates, and metrics
  land durably.'
