    account-wide sessions. `mcp-colab` can submit/list packs, read results, and probe the tunnel/model; the live
    tool list still lacks source-defined colab_session_status. The notebook queue launcher runs all eligible JOBS/packs
    inside an already-running VM, not a selected job. Full life'
requests:
- id: which-control-boundary-do-you-want-for-t-3ffc0d
  ask: Which control boundary do you want for the next step? Full runtime auto-start/stop needs an officially supported
    API and an explicit compute time/budget cap.
  status: open
  at: 2026-10-26 14:17
  from: devin
  options:
  - Keep T4 runtime start manual; improve MCP queue, status, results, and safe preflight only (recommended; no new
    compute spend).
  - Investigate officially supported runtime auto-start/stop; only control a managed runtime and require a max session
    duration/budget before any live start/stop.
  - Consider moving the queue to an always-on/self-managed GPU worker instead of Colab.
  suggested: Keep T4 runtime start manual; improve MCP queue, status, results, and safe preflight only (recommended;
    no new compute spend).
