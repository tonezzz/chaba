  text: The guard/status-only v1 is now implemented in the canonical notebook and shared queue. It reports per-boot
    runtime/GPU/Drive, checks managed-session heartbeats and queue lease, and never stops or kills another runtime.
    Account-wide discovery/stop is still limited to Colab Runtime > Manage sessions; the optional stop-tool request
    remains an explicit follow-up decision.
