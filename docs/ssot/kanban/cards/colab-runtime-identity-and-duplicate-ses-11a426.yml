  text: 'Verified incident 2026-10-25: the connected `colab` MCP exposes only one current notebook/kernel; it has
    no account-wide list/stop tools. Current notebook was boot b4aeff1b, CPU-only, Drive unmounted, no runner. The
    separate active session was not discoverable through MCP. Existing queue runner lease fences queue writers,
    but launcher shares a numeric runner.pid across VMs and can misidentify a local PID; Runtime > Manage sessions
    is the authoritative manual inventory. Proceeding with guard/stat'
