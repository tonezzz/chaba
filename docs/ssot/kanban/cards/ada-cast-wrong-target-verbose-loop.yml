spec: 'Tony''s voice session tonight: he asked for the TV, Ada repeatedly cast to Screen 1 instead, and narrated
  each failed attempt at length — he had to get angry before she stopped. Two defects: (a) cast target resolution
  — ''TV'' resolved to Screen 1; check the session''s tool calls for which entity was picked and whether correction
  turns were honored (adjacent: MED-0493 phantom state, OPS-0567 correction commands dying at confirm gate). (b)
  no failure-loop breaker — N repeated failed attempts at the same action should trigger stop-and-ask, and verbosity
  should drop when the user repeats/corrects. Bonus observation from Tony: frustrated short commands DID make her
  efficient — model mirrors register; formalize as frustration-adaptive response budget, not a feature requiring
  cursing. Verify: scenario where a wrong-target cast + user correction resolves to the right entity within 1 retry,
  max 2 attempts then ask.'
ref: ADA-0684
