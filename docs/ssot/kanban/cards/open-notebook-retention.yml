id: open-notebook-retention
title: 'Open Notebook: keep, extend, or retire on idc01?'
column: backlog
note: 'Running 5d on idc01 (UI :8444, API :8445, 465MB+surreal), only consumer = openclaw mcp-opennb (rate-limited
  upstream). Benchmark: per-file 7/8 ≈ NotebookLM parity. Options: keep as-is / add OR provider to dodge Gemini
  quota / retire + reclaim RAM. Benchmark doc: docs/kb/experiments/open-notebook-vs-notebooklm-2026-09-17.md

  '
updated: 2026-10-04 19:59
requests:
- id: disposition
  ask: 'Open Notebook on idc01: 565MB RAM, ~0 API requests/24h, 87MB data, nightly backup + monthly restore-check
    running. Keep as-is, wire an OpenRouter provider to dodge Gemini quota, or retire and reclaim?'
  status: answered
  options:
  - id: keep
    label: keep as-is — useful shelf, Gemini quota is tolerable
  - id: or-provider
    label: wire OpenRouter free-tier provider — keep it usable when Gemini quota trips
  - id: retire
    label: retire — stop containers+timers, archive the 87MB volume, reclaim 565MB
  answer: retire — 0 API requests/24h means it earns nothing; 565MB reclaim is small but the backup/restore-check/timer
    maintenance surface is ongoing. Volume is archived so it stays recoverable
