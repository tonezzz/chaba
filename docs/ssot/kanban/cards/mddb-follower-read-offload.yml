id: mddb-follower-read-offload
title: Point read-only mddb consumers at idc02 follower
column: done
updated: 2026-11-25 17:28
spec: idc02 already runs the replicating follower. Audit which consumers use read-only query endpoints on the leader
  (:11023) and repoint eligible ones at the follower — takes read load off the hot idc03 box. Needs consumer inventory
  first (probe vector-search callers).
ref: MEM-0058
