note: 'Transcript audit 2026-10-07 (session d6cbf6e6e7, 19:52-20:04 BKK): a 12-minute session accumulated 1.5M input
  tokens, ~78k per turn by the end. At that size the model degenerated into continuation behavior — emitted "ยืนยัน—user\nบันทึกเลยmodel"
  (fabricating the user reply inside Ada''s own turn). The confirm gate caught the resulting self-asserted publish
  (denied), and the dead-turn guard only sees degenerate output — this was fluent, wrong-actor output. Guards are
  downstream band-aids; the fix is upstream: bound the context.'
spec: 'ada-pi realtime_provider.py: bound per-turn input tokens. 1) Count/context: log and gate on usage turn in=
  (already emitted) — when a session exceeds a threshold (default ~40k/turn or ~500k cumulative), trigger context
  hygiene: drop oldest assistant turns from the replayed history, summarize long tool results, or rotate the session
  transparently. 2) Role-token leak: extend the sanitizer to catch emitted role markers (`—user`, `—model`, `\nuser:`
  `\nmodel:` at line boundaries) — these are never legitimate speech. 3) Verify: replay a long session transcript,
  assert per-turn input tokens stay under threshold and that role-marker text is stripped before transcript write.'
