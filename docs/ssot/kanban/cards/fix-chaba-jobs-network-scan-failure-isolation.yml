id: fix-chaba-jobs-network-scan-failure-isolation
title: Make chaba-jobs isolate network-scan failures and back off
column: doing
updated: 2026-10-27 14:40
brief: Keep healthy dispatcher jobs running when the network-scan dashboard push fails; add per-job backoff and
  evidence.
priority: high
program: chaba-ci
tags:
