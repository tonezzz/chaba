title: Scope systemd timer installation for OPS-0790 rollout
column: backlog
updated: 2026-10-30 01:34
brief: Prevent the approved host-by-host rollout from enabling unrelated timers while installing the 8 migrated
  dispatcher jobs.
priority: high
tags:
- systemd
- dispatcher
