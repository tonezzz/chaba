spec: 'tony-omen''s chaba-repo-sync.timer runs git-safe-pull.sh, but omen has ZERO GitHub egress (github.com:443
  connect timeout, :22 no route to host). git-safe-pull compares against the stale local origin/master ref and reports
  ''upstream already in HEAD — skipped'' — the exec checkout was ~19h behind while sync reported success. Consequences:
  runner-agent and lane code on omen silently drift from master; fixes require manual scp (done for runner-agent.py
  2026-11-11). Fix needs: (a) repo-sync fetch path that works without github egress — e.g. fetch over tailnet ssh
  from idc03''s served checkout, or a git mirror remote; (b) the silent-skip check should detect a stale/unfetchable
  upstream and flag it instead of reporting success.'
