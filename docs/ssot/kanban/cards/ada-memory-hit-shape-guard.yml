  the summary''s tools (plan_day, cms_read, cast_to_screen, ada_remember ''Devin: setup a stable stack''). This
  is likely the real driver of the tool storms and a cousin of the role-marker leak — transcript-shaped content
  crossing into the live context.'
spec: 'ada-pi backend/tool_runner/memory.py: keep Devin session-dump docs out of default ada_memory_search results
