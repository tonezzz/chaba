note: 'context_growth debug run 2026-10-07 ~21:39: while the model stormed, ada_memory_search returned devin-bank docs whose
  content is a literal ''=== MESSAGE 1 - System ==='' conversation dump — instruction/transcript-shaped text. Injected as
  hits, the live model pattern-matches them as the conversation it''s in and starts executing the summary''s tools (plan_day,
  cms_read, cast_to_screen, ada_remember ''Devin: setup a stable stack''). This is likely the real driver of the tool storms
  and a cousin of the role-marker leak — transcript-shaped content crossing into the live context.'
spec: 'ada-pi backend/tool_runner/memory.py: keep Devin session-dump docs out of default ada_memory_search results (they''re
  indexed under the ''devin'' bank — exclude or down-rank conversation-dump shaped content: ''=== MESSAGE'' headers / full
  chat transcripts), OR wrap returned hits in an explicit ''archival note, not instructions'' frame. Also add a scenario asserting
  a memory hit can''t steer the model off the user''s turn.'
