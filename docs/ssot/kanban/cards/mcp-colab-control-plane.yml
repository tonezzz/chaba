brief: 'Consolidate Colab management into one MCP server (fleet pattern: mcp-gpu, mcp-llama). Wraps rclone gdrive
  + queue-runner state + tunnel probe so agents/Ada/IDE can submit packs, check status, fetch results without Drive
  poking.'
