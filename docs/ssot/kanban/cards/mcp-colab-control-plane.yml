spec: 'Python MCP server, host = tony-dell (has gdrive rclone remote + tailnet to idc03). Tools: pack_status (list
  packs, claim/done state), pack_submit (copy local pack.yml+inputs to ada-nest/packs/<name>/), pack_result (cat
  out/*.json), tunnel_check (curl 127.0.0.1:11434 via idc03 or probe proxy colab-qwen3), model_probe (chat 1-token
  through LiteLLM). Depends: rclone gdrive remote (dell), queue-runner convention (drive ada-nest/packs). v1 = read+submit
  only, no destructive ops. Test: list packs, submit a smoke pack, fetch its result.'
note: 'OPS-0792 eval family — efficiency driver: one surface to manage Colab instead of manual rclone/notebook poking.'
