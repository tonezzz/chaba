  text: 'Records land with filesystem paths (job 117: /local/local-gen/test-sdxl-1024.png — file later lost, image
    unrecoverable). v0.4.1 plugin now flags these (2/2 broken on the QC scoreboard + wp-admin widget).


    Fix the writer(s) — local_image lane (OPS-0658) + ada_render_video path: after a render completes, POST the
    binary to /wp/v2/media (or chaba/v1/media for member-gated), attach to the render_job post, and set output_url
    to the returned source_url. Convention documented in ssot.wp-boards.yml wri'
