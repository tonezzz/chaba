spec: 'Tony 2026-10-13: users send a few voice clips over LINE/TG to enroll; the lane then recognizes who is speaking
  on voice messages (boss recognition). TODAY: relay already archives audio to ~/.local/share/ada-voice-corpus/line/<caller>/<ts>.m4a;
  speaker_id.py has ECAPA-TDNN embeddings, multi-print profiles, centroid+threshold (0.45), speaker_samples/ keep-audio.
  GAP: all match/enroll paths require a LIVE session voice buffer — file input does not exist (speaker_profiles
  match failed on LINE session 2026-10-13 19:41). BUILD: (1) backend/speaker_id.py — embed_file(path) [ffmpeg ->
  pcm16 16k -> _compute_embedding], match_file(path) -> {match, score, all_scores}, enroll_from_file(path,name,person).
  (2) line_relay.py audio branch — after _archive_media run match_file; append context line to the turn ''[voice:
  speaker=<name-or-unknown> score=0.xx]'' so the persona names the speaker + can route person_entity -> scoped bank
  (completes MEM-0572 identity leg). Unknown speaker -> enroll offer. (3) ENROLL FLOW — persona says ''send me 2-3
  short clips''; relay saves each under voice-corpus/<caller>/; after N clips enroll_from_file per clip bound to
  the caller''s person (LINE user id -> person map exists in env callers). Confirmation line back: ''enrolled <name>,
  3 prints''. (4) speaker_profiles tool gains action=''match_file''|''enroll_file'' path= for ops/testing. (5) BOSS
  RULE — person.tony recognized on any member lane gets owner-tier identity (full-access) per persons.yml roles;
  document threshold + spoofing caveat in tool guide. VERIFY: ffmpeg decode m4a->embed ok on idc03; send KK clip
  -> relay log shows speaker=kk score>0.45; enroll roundtrip: 3 clips -> match recognizes 4th. RAILS: ada-pi only;
  pytest + tool-lint in worktree; no push/deploy — hand to deploy-ada.sh.'
