spec: 'In ada-voice opencode/ada_mcp.py: define BRIDGE_VERSION (git sha or semver string, injected at deploy or
  read from a VERSION file). Include it in every tool response envelope (top-level ''bridge'' object: {version,
  tools_count}) and log it at MCP startup. Optionally expose ada_bridge_info() tool returning version + feature
  list. Update calls.jsonl audit wrapper to record bridge version per call. Verify: two bridge copies (canonical
  vs stale) return different versions; OpenChamber session evidence shows which version served it. Cheap insurance
  for the per-session/per-directory MCP child model.'
