id: ada-ocb-bridge-version
title: 'ada-ocb: bridge version handshake so stale MCP children are detectable'
column: doing
updated: 2026-11-17 22:12
brief: We found Devin's ada-control MCP running a 23-tool stale bridge while OpenChamber had 25 — no way to tell
  which code a session is talking to. Add a version stamp.
priority: medium
tags:
