id: percussion-music-layer
title: "percussion: music layer — styles, moods, instruments, voice control"
column: done
priority: medium
created: 2026-10-10
updated: '2026-10-10'
spec: >
  Percussion is currently sonification-only (drums driven by fleet
  state). Tony's spec (chat 2026-10-10, verbatim):
  "add blue chords according to the mood of the system. how to change
  style, rock, ballad, funcky, electronics, edm. mix & matches, add
  more instruments" + "Poliphia band instruments style — guitar riffs
  and bending for heavy hard rock and rock ballad if possible."
  Voice flow: "Ada, make percussion funky with blue chords and add
  bass" -> Ada tool -> control.json -> app merges on next poll.
note: >
  Design: control.json {style, mood, instruments[]} polled alongside
  state.json. STYLE presets (16-step grids + bpm offset + swing):
  rock, ballad, funky, electronic, edm, hardrock, rockballad, polyphia.
  MOOD -> scale/chord sets: blue (blues+min7), bright (major),
  tense (tritone/dim), calm (maj7/lydian). NEW synth voices:
  bass, chord stabs, pad, lead, clap, ride, tamb, rim, guitar
  (waveshaped saw, riff patterns + pitch bends for hardrock/rockballad/
  polyphia; polyphia = trap hats + harmonized double-lead + staccato).
  Ops sonification semantics UNCHANGED (roles still drive drums).
  Ada side: percussion_set(style?,mood?,instruments?) tool — ada-pi card.
  DONE 2026-10-10: music layer shipped — 8 style grids + riffs
  (incl. polyphia trap hats + harmonized double lead), 4 mood
  scales/chords, 9 new synth voices (guitar has waveshaper dist +
  pitch-bend glide). Control: input-bridge POST/GET /percussion
  (idc03:3010, persisted), app polls same-origin each 30s;
  ?style=&mood=&instruments= URL override. Ada tool 'percussion'
  deployed via ada-pi (1268 tests pass, all services green).
  /send on tg-relay :8911 verified -> TG ping delivered.
