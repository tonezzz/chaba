spec: 'Extends the ocb-smoke/bench harness (ADA-0174). Create tests/eval_ocb/ (or scripts/ocb-eval.py) with ~10
  curated cases covering the failure modes we actually hit:


  - ''find the spec of tony-macbook from ssot'' -> must cite host-roles/host-capacity values (cpu/mem/tailnet),
  not doc titles

  - ''status of ADA-0172'' -> must return real column/ref, not timeout

  - ''what cards need attention'' -> must use attention/next-card path, not guess

  - SSOT deploy-flow question -> must hit vector-search docs, not collection head


  Each case: prompt -> run bridge tools (or recorded session replay) -> assert on ANSWER content (required substrings/sources),
  not just ok=true. Score per case, write kind:benchmark doc to ada-ha-scenario-reports MDDB with per-case results
  so regressions show as score drops. Keep cases read-only; no mutations. Pair with ADA-0174''s ocb-smoke.py — share
  the harness.'
