id: devnest-capacity-aware-dispatch
title: Build shared DevNest capacity-aware dispatcher
column: backlog
updated: 2026-10-30 19:40
brief: Keep KK-Mac and Colab productive when eligible by converting real ready work into normalized lane packages
  before capacity appears.
priority: high
program: ai-workforce
tags:
- devnest
