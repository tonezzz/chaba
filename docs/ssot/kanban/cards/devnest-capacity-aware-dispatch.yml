spec: 'Implement a shared DevNest capacity loop: every five minutes observe KK-Mac and Colab admission/queue state;
  select real ready work from reports, audits, service deltas, held-out evals, and finite batch prep; normalize
  task_id/task_class/evidence/lane/model/expect/artifact/timeout/fallback; refill KK-Mac to depth 3 with max 3 packages/cycle
  and concurrency 1; stage complete Colab JOBS.py/packs before launch because the runner snapshots inventory; use
  cache-independent assessment before model prep; never create synthetic production filler, duplicate Colab runners,
  or bypass owner/quota gates; record queue wait, productive time, verified success, fallback, cost, GPU time, and
  owner impact. Start with read-only reports and finite Colab evaluations. Procedure: docs/kb/devnest-capacity-aware-dispatch-procedure.md.'
