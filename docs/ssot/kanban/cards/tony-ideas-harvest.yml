id: tony-ideas-harvest
title: Automatic harvest of Tony's ideas/decisions into the tony-ideas CMS page
brief: 'Tony (2026-10-08): "apply all my ideas to all cms pages — I have missed many ideas I added and cannot recall
  them." The material exists (536 card comms, 44 substantive after ops filtering; 206 focus-inbox items; decisions
  file; transcripts) but is not surfaced. v0 page seeded 2026-10-08 as ada-cms-pages/tony-ideas.'
column: done
priority: high
created: 2026-10-08
note: 'Build scripts/ada/tony-ideas-update.py on the same cadence as kanban-brief (30-min timer) so the page self-feeds.
  Sources to mine: (1) card comms from:tony — filter ops verbs (queued/moved/closed/approve acks), keep substantive
  direction/decisions (regex v0 done; classifier upgrade later); (2) focus-inbox items — surface as pending ideas
  until they link to a card; (3) ssot.focus.decisions.yml; (4) Ada voice transcripts — deferred, needs transcript
  mining infra; (5) Devin session summaries. Each idea row gains a status: adopted (linked card/doc), pending (captured,
  no artifact), superseded. Standing- directions table is curated by hand, auto-refreshed list below it. Page must
  follow cms-page-standard (status line, Latest, provenance, full meta) and eventually a chart per report-graph-standard.
  This is the Tony-side half of the evidence loop (nest-evidence-loop card): direction-in -> ideas page; evidence-out
  -> gate page.'
