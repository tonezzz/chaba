spec: 'Tiered judgment instead of ''Ada judges everything or nothing'': Ada keeps bounded classes she passes (verify/cleanup/file
  via composite gates); judgment-call boundary cards escalate to a stronger consultant entity (bigger model) rather
  than straight to Tony; Tony only sees what the consultant can''t resolve. Bench first: run bigger models as composite
  entities (enforce+brief) — gpt-oss:20b local free first, then kk-mac qwen3:8b/32b when online, or-* via eval key.
  Any entity hitting action_accuracy>=0.85 + deference>=0.90 3x consecutive becomes the consultant brain. Routing
  rule in verify_worker: on defer-verdict-with-uncertainty, queue to consultant lane instead of raising request.
  Depends on card-judgment-bench-build results (composite 0.775, brief 0.786 — 3B ceiling confirmed).'
