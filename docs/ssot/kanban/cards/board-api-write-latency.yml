    shipping bounded lock acquire + off-lock deliveries + comment dedupe'
- at: 2026-11-17 17:11
  from: devin
  text: 'FIXED in dispatch wt 20261117-165539 (job rec docs/ssot/jobs/kanban/2026-11-17-board-api-lock-latency.yml).
    Root causes: (1) git-safe-pull held the same flock across whole pull/rebase/reconcile (minutes when upstream
    moved); (2) immediate git commit per write inside lock (BOARD_API_COMMIT, ~10-20s); (3) session-hide + session-delivery
    ran SSH/SQLite under the request lock; (4) no dedupe so timed-out retries double-posted. Render was ALREADY
    async — not the cause. Fixes: bounded LOCK_NB acquire on every lock site -> HTTP 503 BEFORE mutation (BOARD_API_LOCK_WAIT_S=25s
    default) so retries can''t double-apply; wait/hold timing logs >5s; SSH/session side effects moved to post-write
    daemon queue; /comment dedupe by request_id (stamps comms req) + same(from,text) 120s window, dedupe:false bypasses,
    reply {deduped:true}; handler socket timeout 120s; git-safe-pull now reads /tmp/board-api.lock.repo sentinel
    — pulls of other checkouts skip the served lock, lock-wait/pull-phase logged >=5s. Verified: selftest ok, kanban-commit
    59/59, sandboxed HTTP smoke (503 in ~3s under held lock, 1 comm entry after deduped retries).'
