requests:
- id: how-should-the-dirty-in-flight-work-on-i-11feb4
  ask: How should the dirty in-flight work on idc02 (retire/ops-1310-helm-leftovers) and tony-omen (127 dirty focus-inbox
    files) be handled so their chaba exec checkouts can be brought current? Tool pins are already converged; only
    the stale checkout code remains.
  status: answered
  at: 2026-11-24 22:20
  from: devin
  options:
  - stash-u-ff — git stash -u (tracked+untracked) then git pull --ff-only on both hosts; stash left for owner to
    pop (recommended, reversible)
  - commit-wip — commit the dirty work on each host branch, then rebase/merge origin/master; preserves work in history
  - leave — accept stale checkout code on these two hosts; exclude them from clone-stale audit
  - abandon — discard the dirty work then hard-reset to origin/master (destructive, needs explicit approval)
  suggested: stash-u-ff — git stash -u (tracked+untracked) then git pull --ff-only on both hosts; stash left for
    owner to pop (recommended, reversible)
  answer: stash-u-ff — git stash -u (tracked+untracked) then git pull --ff-only on both hosts; stash left for owner
    to pop (recommended, reversible)
