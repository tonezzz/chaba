note: >
  Outbound is session-driven only — no way for a headless agent to
  push "backup done" / "install complete" to Tony's TG. Add a small
  authenticated endpoint on ada-tg-relay (POST /notify with chat_id
  + text) that relays via the existing send_text. Then agents (Devin,
  jobs) can notify through TG — Tony's requested standard comm channel.
