id: ada-report-quality
title: Improve standard of Ada-generated reports
column: backlog
note: >
  Ada-made reports need a higher, enforced standard: every report page must
  carry the meta contract (summary ~240 chars, domain, fresh_for, confidence,
  timeline, updated — see meta_contract in ssot.apps.ada-cms-reports.yml),
  state time-of-event before quoting, mark staleness honestly, and follow the
  benchmark report structure (H1, score line, status table, policy
  violations, known issues) where applicable. Several pages are stale right
  now: benchmark-cms/reports/research/system last real runs 2026-09-27,
  benchmark-casting all-FAIL since 2026-10-01 (service-level outage — see
  benchmark/chaba-20261004 units_failed: ada-scenario-casting.service).
updated: '2026-10-04'
