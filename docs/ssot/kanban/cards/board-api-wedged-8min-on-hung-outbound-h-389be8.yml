id: board-api-wedged-8min-on-hung-outbound-h-389be8
title: board-api wedged ~8min on hung outbound HTTPS while holding wp.lock + card flock — all endpoints timed out
column: done
updated: 2026-11-25 17:12
priority: high
tags:
- bug
- board-api
