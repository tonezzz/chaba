help: >-
  Reuses: vendored onnxruntime-web (pwa/vendor/transformers, committed
  a14238f), screenlive cast path (verified), xmeye HLS shim, MDDB bench
  doc pattern. Constraints: iOS PWA-mode mic/cam quirks (Safari vs
  home-screen), model size one-time download, JS NMS cost on old devices.
