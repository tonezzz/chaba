id: nest-edge-vision
title: Chaba Nest edge vision — browser YOLO overlay, castable, benchable
brief: A page that shows a camera feed and draws object labels on it right in the browser, castable to the TV. Waiting
  in the backlog — no action needed.
column: done
priority: medium
created: 2026-10-07
updated: 2026-10-08 05:51
note: 'Extends the Nest to the client''s eyes: a page that plays a camera feed and runs detection in-browser (WASM),
  overlay drawn locally, and the whole page castable to TV via the proven screenlive lane. Server compute stays
  at zero — the client does vision.'
spec: "Phases: 1. `/apps/eye/` page (ada-pi `pwa/eye/` or apps stack) — video element\n   fed by cam HLS (xmeye\
  \ channels via existing proxy) OR device cam via\n   getUserMedia. Detection model in-browser: onnxruntime-web\
  \ is already\n   vendored (pwa/vendor/transformers) — pick yolov8n-int8 (~12MB) with\n   JS NMS, or MediaPipe\
  \ efficientdet-lite0 (~4MB, proven WASM path from\n   gesture work). Overlay = canvas over video.\n2. Bench mode\
  \ on the same page: run N frames, report fps/inference-ms/\n   device UA to MDDB (ada-ha-scenario-reports bench/edge-*);\
  \ a\n   `bench-edge` CMS page trends it — answers \"can my iPhone carry it\"\n   with data, per device, per model.\n\
  3. Cast what Ada sees: point the cast lane (screenlive/workspace cast,\n   verified 2026-10-07 on GEV) at the\
  \ eye page — TV shows live YOLO\n   overlay. No server-side annotate/encode needed.\n4. Ada hookup: latest detections\
  \ land in MDDB → an ada tool\n   (`ada_look`?) answers \"what do you see\" from the freshest frame;\n   keeps\
  \ the confirm-gate authority model for any action on detections."
