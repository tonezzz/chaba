spec: 'Goal: Prevent git-safe-pull autostash pop conflicts from leaving live, broken code files with conflict markers
  on execution checkouts. Host/Repo: tony-omen / chaba. Constraints: Only modify files within SAFE_PULL_GENERATED_RE
  or handle autostash conflicts safely without leaving SyntaxError-inducing markers in files executed by systemd
  jobs. Testable done-condition: A simulated autostash conflict on a non-generated code file does not leave live
  conflict markers or trigger SyntaxErrors on execution checkouts, and chaba-repo-sync reports failure instead of
  success when manual merge intervention is required.'
