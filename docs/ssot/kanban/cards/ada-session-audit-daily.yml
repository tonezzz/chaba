id: ada-session-audit-daily
title: Daily automated Ada session audit — transcripts → friction findings → CMS evidence
brief: 'The ada-transcript-audit skill only runs when Tony asks. Schedule it: daily audit of yesterday''s sessions
  — phantom tool claims, failed calls Ada glossed, repeated asks, confirm-gate friction — published as a CMS page
  and filed to focus-inbox/cards when friction is found. Labels feed the Ada corpus.'
column: done
priority: high
program: chaba-ci
area: ada-tools
note: 'Gap found 2026-10-09: capability benches are automated (orch-bench hourly, scenario/bench/embed daily, recall
  canary weekly) but session QUALITY audit is manual-only. Checklist already defined in .devin/skills/ada-transcript-audit/SKILL.md
  — the job is to run it headlessly on a timer.'
spec: "1. scripts/ada/session-audit.py (or .sh wrapping the existing steps):\n   - window: transcripts newer than\
  \ ~/.local/share/devin/ada-audit-marker\n     (mtime > marker; marker bumps after each run — idc01\n     ~/.local/share/ada/transcripts/2026-*.md)\n\
  \   - per session: phantom tool-claim turns, tool results with ok:false/err,\n     needs_confirm round-trips,\
  \ repeated user asks, friction turns\n   - journalctl ada-ha-tony function_call results for the window\n2. Output\
  \ contract:\n   - structured findings -> MDDB ada-ha-scenario-reports key\n     audit/session-<date> (kind: session-audit)\
  \ + CMS page render\n     (cms-page-standard) so the audit is discussable evidence\n   - friction items -> focus-inbox\
  \ entries (or card requests) — never\n     silently swallowed; clean days publish a short green page\n   - labeled\
  \ rows appended to the Ada corpus path the nest loop harvests\n     (same shape as bankq-router-corpus.jsonl)\n\
  3. systemd user timer daily ~05:30 on dell (before the morning digest).\n4. Close the loop: recurring friction\
  \ patterns -> kanban cards\n   (dedup against open cards by title/slug).\nAcceptance: runs hands-off for 3 days;\
  \ a seeded friction case appears on\nthe CMS page and in focus-inbox; marker advances; no false-positive flood\n\
  (threshold: only repeated or high-severity friction surfaces).\n"
help: 'Skill reference: .devin/skills/ada-transcript-audit/SKILL.md has the full manual checklist. Transcripts live
  on idc01 (~/.local/share/ada/transcripts/). This is the session-quality half of Chaba CI for Ada — the bench half
  already exists.'
