spec: Adopt docs/kb/video-history-data-management-procedure.md as the standard. Every project uses a stable project_id
  and manifest; every derived artifact records source hash, parent, model/revision, prompt/seed, renderer commit,
  QC/verdict, and supersedes links. Keep source/final/QC immutable, retain one review+final per promoted variant,
  archive reproducible superseded outputs, and clean only explicitly approved unreferenced derived/cache data. Reconcile
  Drive artifacts weekly and publish a compact history index. Keep review overlays separate from public final cuts.
