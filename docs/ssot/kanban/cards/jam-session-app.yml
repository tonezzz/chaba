id: jam-session-app
title: Jam Session — public client-side music toy branched from Percussion (camera/mic -> instruments)
column: done
updated: 2026-10-15 10:06
brief: 'Tony 2026-10-12: branch stacks/web/public/apps/percussion into a public, 100%-client-side jam toy. Camera
  button captures body/face/hands (MediaPipe landmarks — NOT YOLO, per gesture-control-rebuild precedent), mic captures
  sound events; a bindings matrix maps captures -> instruments/effects; modular feature flags for mix&match testing;
  effects + fun buttons; shareable public link for LINE friends.'
priority: medium
spec: "ARCHITECTURE — fork apps/percussion into apps/jam/ (static HTML/JS only):\n1. Audio core: reuse percussion\
  \ app.js WebAudio synth voices (drums+instruments) — all client-side.\n   The state.json/control.json fleet-sonify\
  \ feed becomes an OPTIONAL mode flag (?fleet=1), not the core.\n2. Capture layer (all client-side, getUserMedia):\n\
  \   - Camera button -> MediaPipe Tasks Vision: PoseLandmarker (body 33pt), HandLandmarker (2x21pt),\n     FaceLandmarker\
  \ (478pt) — reuse docs/kb/gesture-ui-options.md constants/DOM contract + /apps/gesture precedent.\n   - Mic button\
  \ -> WebAudio AnalyserNode: onset/clap/pitch-class/energy events.\n3. BINDINGS MATRIX (the 'associate captures\
  \ with instruments' procedure, codified):\n   a bindings.json + UI matrix editor: rows = capture events (left-hand-strike\
  \ zone, right-hand height,\n   smile, head-nod, clap, hum-pitch...), cols = instruments/effects. User edits live\
  \ -> URL-encodable\n   (#cfg=...) so Tony can share a tuned mapping. Procedure per new mapping: add capture source\
  \ ->\n   observe event in debug HUD -> bind cell -> test -> share URL.\n4. Effects/fun: delay/reverb/bitcrush/stutter\
  \ buttons + fun triggers (airhorn, riser, record-scratch,\n   crowd-cheer). Each = module under a feature-flag\
  \ toggle row so mix&match testing is trivial.\n5. 'user order' control surface: on-screen controls first; optional\
  \ voice later (Web Speech API is\n   client-side too, or Ada percussion tool on tailnet only — NOT for public).\n\
  6. MODULARITY contract: modules register via JAM.register(name, {init, onEvent, destroy}); core ships\n   event\
  \ bus only. Each module = one file apps/jam/mod/<name>.js toggled in UI + ?mods= URL arg.\nPRIVACY: camera/mic\
  \ frames never leave the device — landmarks only. No uploads, no analytics.\nPUBLIC EXPOSURE (edge-add-host procedure):\
  \ new public host or path on the existing public edge —\ncheck edge-route-registry card first; CF Access must\
  \ bypass this path (it's a no-auth toy).\nVERIFY: page loads cold <3s on phone; camera+mic permissions degrade\
  \ gracefully (buttons disable,\nnot break); tapping a drum pad plays <50ms; bindings matrix round-trips via URL."
ref: OPS-0502
