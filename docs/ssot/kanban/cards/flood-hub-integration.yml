spec: Integrate the Google Flood Hub API on host idc01 using GCP project flood-watch-510211 once waitlist
  approval lands. Enable floodforecasting.googleapis.com with an API key restricted to the API and idc01
  IP, storing it in ~/.config/secrets/flood-forecasting.env. Execute verification via scripts/ada/flood-hub-check.py,
  configure HA REST sensors on michael-dev using the mha_mirror_* pattern, and implement flood-news-update.py
  to manage an auto-block on flood-report and saraburi leaf. Finally, add the Ada flood_status tool and
  LINE alert for severity >= WARNING, optionally adding the GEV KML overlay as detailed in docs/assessments/flood-hub-assessment.md.
