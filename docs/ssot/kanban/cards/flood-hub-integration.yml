id: flood-hub-integration
title: Flood Hub API integration (blocked on waitlist)
brief: Waiting on Google's waitlist for the flood-forecast API, which reportedly takes months. Nothing to do until
  the approval email arrives.
column: doing
note: 'BLOCKED: waiting for Google waitlist approval email (submitted 2026-09-30, reportedly months). When it lands:
  reply with GCP project flood-watch-510211, enable floodforecasting.googleapis.com, key restricted to API + idc01
  IP, store in ~/.config/secrets/flood- forecasting.env. Then in order: verify with scripts/ada/flood-hub- check.py;
  HA REST sensors on michael-dev (mha_mirror_* pattern); flood-hub:auto managed block on flood-report + saraburi
  leaf via flood-news-update.py; Ada flood_status tool + LINE alert (severity >= WARNING). GEV KML overlay optional.
  Full plan: docs/assessments/flood-hub-assessment.md (CMS: flood-hub-assessment).'
