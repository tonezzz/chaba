id: chaba-admin-kanban-tab-rename-lowercase
title: Rename chaba-admin dashboard tab "Kanban" to lowercase "kanban"
column: backlog
updated: 2026-11-24 08:14
brief: The kanban tab in the ada-ha chaba-admin Lovelace dashboard (url_path chaba-admin) shows title "Kanban".
  Tony wants lowercase "kanban" for consistency. Change views[path=kanban].title in lovelace.chaba_admin over the
  HA websocket (push-dashboard.py --mutate), then re-run scripts/home-assistant/sync-ada-ha-chaba-admin.py and commit
  the sanitized snapshot. Path stays "kanban" — only the display title changes.
ref: KNB-1314
