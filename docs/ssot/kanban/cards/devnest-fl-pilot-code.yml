spec: 'Add scripts/ops/pilot_metrics.py with a pure function cost_per_passed_gate(cost_usd: float, gates_passed:
  int) that returns cost_usd / gates_passed as a float, returns 0.0 when cost_usd is 0 and gates_passed > 0, and
  returns None when gates_passed <= 0. Add tests/ops/test_pilot_metrics.py (unittest style, matching tests/ops/test_devnest_lane_label.py
  conventions) covering: free-lane case (0 spend, 1 gate -> 0.0), a paid sample (0.30 spend, 2 gates -> 0.15), and
  the zero-gate case (-> None). Write both files first, then run python3 -m pytest tests/ops/test_pilot_metrics.py
  -x -q and confirm it passes. Do not touch any other file, do not deploy, do not push manually — the runner closeout
  commits, pushes, gates, and merges. PILOT DECLARATIONS: target_host=tony-dell; base_ref=origin/master; verifier=pytest
  tests/ops/test_pilot_metrics.py all pass + branch auto-merges via runner closeout; expected_artifact=scripts/ops/pilot_metrics.py
  + tests/ops/test_pilot_metrics.py; stop_condition=halt and mark failed if pytest fails after one fix attempt or
  if any file outside the two named paths is modified; this run does not count as a free-lane datapoint unless the
  executor is opencode (meta.json executor starts with opencode:).'
