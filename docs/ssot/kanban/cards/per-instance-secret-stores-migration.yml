spec: '1. tony-ha: mkdir idc03:~/.config/secrets/tony-ha/, move ada-ha-tony.env->backend.env + ada-ha-tony-keys.json->keys.json,
  update unit EnvironmentFile= + ADA_KEYS_FILE, restart ada-ha-tony, verify /api/auth/keys.

  2. michael-ha: same pattern (ada-ha-michael.* -> michael-ha/).

  3. kk-ha: move ada-kk.env + ada-ha-kk-keys.json -> kk-ha/.

  4. household.yml: define schema (people/roles-per-node/rooms/notable devices — kk-ha owner/member pattern), seed
  per instance.

  5. retire shared pool: repoint vcast ADA_AUTH_URL off :8001, migrate cms-viewer + guest redeem + headless keys,
  then stop+disable ada-pi-pwa :8001 (decision ada-ha-native-primary-ui endgame).

  6. ada-ha lane backend: allocate port, unit, env — follows same store.

  Done when: no lane reads a shared admin key, ssot.secrets slots lose legacy_to_migrate, :8001 stopped.'
note: 'SSOT structure approved+committed 2026-10-13: every HA instance owns a lane store (~/.config/secrets/<lane>/{backend.env,keys.json})
  + household.yml in its HA config. kk-ha/ada-kk is the reference lane. This card is the physical migration.'
