spec: 'HUMAN-GATED tail of chaba card map-embed-tool (drop 17 finally landed 2026-11-24 after a month staged-only).


  STATE: ada-voice PR #22 (feat/map-embed-drop-17 -> main, commit 99ba22a off 1c94657) adds backend/tools.d/map_embed.py
  + manifest/tool_guide/scenario + count_cap 115->116. Verified: tool-lint clean, pytest 1942 passed/7 skipped,
  tools_loader registers it (read, secondary_allowed, 60s), keyless smoke correct.


  STEPS AFTER MERGE:

  1. deploy-ada.sh on idc03 (runs tool-lint + pytest gates, drains /ws, restarts persona backends) — production
  restart, needs approval.

  2. scripts/ada/render-tool-profiles.py --host idc03 --apply on the chaba served checkout — chaba ssot.apps.ada-persons.yml
  already lists map_embed under persons.tony.tools.include + kk-cms-only (merged 2026-10-27), so ADA_INCLUDED_TOOLS
  picks it up.

  3. GOOGLE_MAPS_API_KEY: Tony''s 2026-10-27 answer claimed a minted key was dropped into ~/.config/secrets/tony-ha/backend.env
  on idc03 — VERIFIED ABSENT 2026-11-24 (all persona envs grepped; only the dead gev key persists). Re-drop it (or
  mint fresh: Maps Embed + Static + Routes APIs, restricted key) for interactive embeds / Google static / Routes
  polylines. WITHOUT it the tool still works: kind=static falls back to keyless OSM multi-pin, open_url always works,
  kind=interactive returns honest needs_key.

  4. Live smoke: kind=static with two coords (expect OSM image URL today, Google static once key lands); kind=interactive
  expects needs_key until the env drop + restart.


  Until merge the tool does not exist for Ada — chaba-side drop was staged 2026-10-27 but the ada-voice landing
  was never carded (gap this card closes). Job note: docs/ssot/jobs/ada/2026-11-24-map-embed-drop17-landing.yml.'
