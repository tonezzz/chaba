spec: runner-agent-converge.service on tony-dell alternates between clean runs and `Main process exited, code=exited,
  status=4/NOPERMISSION`. Read the full journal and the underlying ansible task output around the failed runs to
  identify the exact task that loses permission (likely a become/become_user or file-mode step when redeploying
  runner-agent to remote hosts). Make the convergence idempotent and permission-correct for every managed host;
  do not weaken the pin check or disable the unit. Verify with several consecutive manual runs on tony-dell showing
  Result=success and runner-agent hashes matching the manifest pins on all reachable hosts. Then note the result
  on timer-alert-tony-dell-runner-agent-converge.
