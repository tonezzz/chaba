spec: Implement the Ada tool capability to convert a voice request into a well-formed kanban card spec in the ada-voice
  repository. The runner must deploy on host tony-dell, ensuring it operates within the local development environment
  without drifting from repository scripts. Constraints include using existing voice-to-text pipeline definitions
  and validating the generated card structure against standard Chaba board schemas. The testable done-condition
  is a passing integration test where a recorded voice input successfully generates a correctly formatted card JSON
  in the board queue.
