id: cms-regen-autofix
title: cms-regen auto-fix playbook — close the detect→fix loop on CMS automations
column: backlog
note: cms-auto-health detects and cards stale automations, but a human still presses the fix. This playbook makes
  the cards self-healing.
updated: 2026-10-05 22:57
help: 'Today: cms-auto-health.py writes cms-auto-<slug> cards when a CMS

  automation is stale, and auto-closes them on recovery — but recovery

  still needs a human (or luck). cms-regen is the act step.


  Trigger: cms-auto-<slug> card enters review (or cms-auto-health flags

  an unhealthy doc). Actions, in order:

  1. POST /api/cms/pages/<slug>/regenerate (or cms_automation run_now)

  2. Recheck the registry doc''s last_run/last_status after interval

  3. If still stale: read the generator command from the registry doc,

  check its logs/timer on the owning host, fix or escalate

  4. Phantom case: registry doc exists but the page is really refreshed

  by a bulk generator (e.g. cam-wall-cms.timer) — mark the doc

  interval_min=0 + managed_by instead of flagging (the camwall-noble-a

  pattern, fixed manually 2026-10-04)

  5. Post outcome to the card''s comms; card auto-closes on next sweep


  Gates: owner-only, confirm NOT required for the regen step (read-mostly

  — a regen is idempotent and recoverable), confirm required for any

  config/schema change to the registry doc beyond managed_by/interval.

  '
spec: 'Build the cms-regen auto-fix playbook for Ada/kanban.


  Read first: scripts/ada/cms-auto-health.py (card lifecycle),

  docs/ssot/kanban/ssot.kanban.yml (dispatch semantics),

  ada-pi backend/devteam.py + backend/devin_dispatch.py (pipeline + gate

  conventions), backend/tools.d/manifest.yml (tool policies), and the

  ada-cms-automation MDDB collection shape (enabled, interval_min,

  run_now, last_run, last_status, generator params).


  Deliverables:

  1. A cms-regen playbook in ada-pi backend/playbooks/ (if the playbook

  registry exists by then — else a tools.d ada_cms_regen tool with the

  same contract): given a slug, POST regenerate, poll the registry doc

  until last_run advances or a bounded timeout, then re-check health.

  2. Phantom-registry handling: when the registry doc has no working

  generator but the page updates via a bulk timer, write

  interval_min=0 + managed_by=<owner> instead of leaving the health

  check to re-flag it.

  3. kanban-dispatch (or cms-auto-health) gains an optional

  auto_fix: [cms-auto-*] rule — cards matching the prefix dispatch the

  playbook on entering review, with results posted to comms.

  4. Unit tests for the regen/phantom logic (mocked MDDB + HTTP).

  5. Report to the card comms + job ledger.


  Do NOT modify the confirm-gate internals, do NOT auto-dispatch on

  non-cms-auto cards, do NOT deploy to ada-ha-tony.

  '
