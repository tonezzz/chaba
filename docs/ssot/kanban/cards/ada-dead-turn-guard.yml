id: ada-dead-turn-guard
title: Guard against bare 'response:' dead turns + tool-call text leak after tool results
brief: 'Transcript audit 2026-10-07 (session 56d2e4d167): user asked "รถ KK ทะเบียนอะไร" twice at 13:41; memory search had ALREADY returned the answer (plate 5ขว 6249 in hits)… A worker session is on it
  — nothing needed unless it posts a question.'
column: done
priority: high
program: ada-tools
updated: 2026-10-07 18:37
tags:
- ada
