note: 'Transcript audit 2026-10-07 (session 56d2e4d167): user asked "รถ KK ทะเบียนอะไร" twice at 13:41; memory search had ALREADY returned the answer (plate 5ขว 6249 in hits) but Ada emitted literal "response:"
  text both times — user heard nothing and repeated the question. Same session: "tool-call text leaked into transcript" WARNs (set_facial_expression{...} spoken verbatim). Known class — ada-session-health
  doc (2026-09-27) diagnosed empty/off-focus turns. Likely contributor: ada_memory_search hits return entire documents (30-50KB each); input tokens ran 27-33k/turn.'
spec: 'ada-pi realtime_provider: three guards. 1) Dead-turn detector — when the model output text is empty or degenerate after a completed turn ("response:" prefix only, whitespace, lone structural tags),
  do NOT pass it to TTS/transcript as the answer; emit an ops event (dead_turn) and deterministically retry once, or synthesize a fallback that speaks the actual tool result ("พบแล้วค่ะ ทะเบียน 5ขว 6249"
  shape). 2) Tool-call text sanitizer — strip model-emitted text shaped like tool calls (name{key:value,...}) before TTS + transcript write; log leak_detected ops event. 3) Memory hit truncation — cap ada_memory_search
  hit content (~2KB, keep key/title/score/meta) so a 5-hit search cannot inject 100KB+ into context. Regression test: replay the plate-question turn shape — tool returns hits with the plate, model output
  stubbed to "response:" — assert user-facing answer contains the plate, never the literal tag. Preserve confirm-gate + degraded flag behavior; a degraded search should still be announced as degraded.'
