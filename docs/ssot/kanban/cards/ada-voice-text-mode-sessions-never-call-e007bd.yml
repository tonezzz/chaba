spec: 'Found via card ada-session-summary-inflow-stalled (2026-11-25). OpenRouterTextProvider.close() (backend/openrouter_provider.py
  ~line 638) only sets _closed + cancels _pending — it never invokes conversation.persist(), so text-mode sessions
  (?mode=text, ADA_TEXT_ONLY_CALLERS, channels in ADA_TEXT_ONLY_CHANNELS default telegram,tg,line; ada-ha-tony drop-in
  adds chat,web) write transcripts + session-end marker but produce NO kind=session-summary MDDB doc, NO reports/*.json,
  NO extract candidates/actions. Only GeminiLiveProvider.close() (realtime_provider.py:6711) persists. Result: ada-ha-recall-summary-*
  inflow stopped lane-by-lane (last docs tony 10-03, dev 10-09, kk 10-13, kk-dev 10-14, michael 10-17); LiteLLM
  SpendLogs show zero tool=session_summary/session_report calls since 2026-10-17 15:19 UTC; memory-distill + consolidate
  + merge-proposals starved (~480 drafts unreviewed). FIX: call conversation.persist() (or a slim variant skipping
  the NotebookLM upload) from OpenRouterTextProvider.close() in ada-voice, deploy via deploy-ada.sh on idc03. Full
  evidence: docs/ssot/jobs/ada/2026-11-25-session-summary-inflow-stalled.yml'
