spec: 'Read-only mine sessions.db and durable artifacts. Select 12-20 completed engineering/ops/education jobs with
  explicit target_host, repo/base commit, prompt, artifact, and done-condition. Normalize each into a frozen task
  fixture: task.yaml, prompt, base ref, held-out verifier, expected artifact, source session id, and redaction report.
  Arms: Devin historical outcome baseline; DevNest/JEV lane selection; OpenCode interactive/executor; deterministic
  codemod where applicable. Metrics: gate pass, graduated score, latency, tokens/cost, human interventions, merge/closeout
  success, unrelated-test breakage. Never replay destructive actions or secrets. Start with 5 safe read-only/report/code
  tasks; expand after verifier validation.'
