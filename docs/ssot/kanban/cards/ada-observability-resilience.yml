id: ada-observability-resilience
title: "Ada observability: journald suppression + durable tool-write retry"
column: backlog
note: >-
  Two audit-path gaps found 2026-10-05 (session 0d9530dbf7):
  (a) during the mddb vector_search error storm journald suppressed 37+
  messages — every function_call line for a live 10-min session vanished
  from journalctl; the only evidence was session_events in the session
  report JSON. Transcript audits must read reports/*.json, not journals.
  (b) devin_answer (and cms_publish_page, ada_camera_snapshot) failed
  during the mddb outage and the writes were simply lost — Tony's spoken
  อนุมัติ for job 20260926-205455 evaporated until re-delivered by hand.
  A tool-write retry/outbox would survive transient mddb outages.
help: >-
  session_events are the source of truth under log loss
  (~/.local/share/ada/reports/<id>.json on idc01). Retry design: failed
  ledger writes (devin_answer, cms_publish_page) could queue to a local
  outbox file + retry loop, or at minimum emit an ada-ops event so the
  failure is visible instead of silent ok=False.
action: {type: dispatch, status: idle, repo: ada-pi, button: '▶ Design outbox + audit doc'}
spec: >-
  1) Document the audit flow change: ada-transcript-audit should consult
  session_events in reports/*.json BEFORE journals (journals lose lines
  under journald rate-limit). 2) Add a small durable outbox for write
  tools that fail on mddb/transient errors — retry with backoff for a
  bounded window, surface a persistent failure to the user verbally on
  the next turn. 3) Flag dropped-log risk: optionally log function_call
  lines to a session-scoped file so journald suppression can't erase
  them.
updated: '2026-10-05'
