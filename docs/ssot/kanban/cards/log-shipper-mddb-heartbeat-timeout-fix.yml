spec: 'Fleet-wide log-shipper false failures: all 10 timer-alert-*-log-shipper* cards trace to one root cause.

  Journal evidence (idc02/mn01/tony-dell/tony-omen, 11:00-11:02 runs): ''0 host-log add failure(s), 1 heartbeat
  write failure(s) — cursor held at last confirmed line''; tony-dell/tony-omen also show ''mddb add failed - stopping''
  for the host-log leg.

  Measured from idc02 against mddb-ops (http://100.102.134.91:11026/v1): POST /add takes 12.96s and 12.7s on two
  tries, then 20.02s timeout on the third. scripts/ada/log-shipper.py post_state() hardcodes timeout=10 for the
  heartbeat /add, so the write always times out under current load even when every journal line shipped successfully.

  Fix post_state() (and the host-log _post path if it shares the same too-short budget): raise the heartbeat write
  timeout to ~45s with a bounded retry (2 attempts), keep the cursor held and the exit non-zero on a genuine MDDB
  outage. Do NOT just silence the heartbeat failure or raise the global timeout to hide an outage; the judge must
  still see silent/unreachable hosts.

  Verify by triggering log-shipper.service on idc02 and tony-omen, confirming Result=success and a fresh host-logs-state/ship/<host>
  doc, then close the green timer-alert cards after live verification.'
