- id: first-cline-proposal-canary-route
  ask: 'For the first OpenCode-to-Cline proposal canary, which safe route should we take? Live board evidence says
    the Nest adapter is deployed, but its latest local qwen3:4b smoke produced no expected durable artifact/result
    and timed out waiting for Review. Recommended: fix and independently re-test that result contract before relying
    on the adapter. A manual Cline UI analysis-only run on a versioned card snapshot is the faster alternative,
    but needs a human to land the result back on this card.'
