spec: 'Make the locked_edit fallback write path in board-janitor/merge-sweep atomic. Root cause of 2026-11-19 card
  torn writes (KNB-0212): during idc03 ENOSPC window, board-janitor''s 02:56 merge-sweep tick used a locked_edit
  fallback that does a DIRECT write_text on docs/ssot/kanban/cards/*.yml — writes tore mid-scalar at page boundaries,
  truncating 3 cards and taking down kanban-commit + board-api reads.


  Fix: locate the locked_edit/fallback write in scripts/board/ (merge-sweep / board-janitor / merge-card-yaml.py
  or wherever the non-atomic path lives) and convert to write-to-<file>.tmp + fsync + os.replace under the same
  board flock, matching board-api''s proven pattern. Audit ALL card-file mutators for the same non-atomic pattern
  (grep for write_text/open(...,''w'') on cards paths).


  Done when: no code path writes card YAML non-atomically; a fault-injection test (ENOSPC or kill mid-write) leaves
  either old or new complete file, never torn; kanban-commit YAML gate stays green.'
ref: KNB-0225
