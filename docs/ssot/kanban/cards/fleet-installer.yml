id: fleet-installer
title: 'fleet one-liner: curl app.surf-thailand.com/install | bash'
column: doing
priority: medium
created: 2026-10-10
updated: '2026-10-10'
note: >
  Static bash installer served from the public edge: tailscale +
  openssh-server + tailscale up (interactive, or TS_AUTHKEY= for
  zero-touch) + report-back. v1 serves script at
  app.surf-thailand.com/install (edge route on idc03 caddy-edge + CF
  DNS) and tailnet mirror /install on tony-dell. v2: keyless enroll
  endpoint (input-bridge /enroll → node registry) so the machine
  announces itself into host-loads/services without manual wiring.
  AQ: fresh Ubuntu runs the one-liner → lands on tailnet with ssh →
  appears in host-loads after manual service entry (v1).
