created: '2026-10-11'
brief: 'Tony wants a standard procedure for application development as a first-class
  pipeline: idea > requirement > PoC > prototype > alpha > beta > product > feedback
  — continuously evolving. Flow: Tony discusses the project with Ada (voice or TG);
  Ada stewards it (elaborates spec, stores the project in CMS report structure, keeps
  it moving); Ada asks Devin + nest for help; Devin''s job is tools/build per standard
  procedure. Ideas may arrive via TG — they must route to the right project; if unsure,
  file a card with clickable options. Also: a standing procedure to assess+improve
  the card interface itself.'
spec: 'MAPPING onto existing machinery: ssot.release-lifecycle.yml already defines
  s0 idea → s1 experiment → s2 alpha → s3 beta → s4 pre-prod → s5 production with
  per-stage feedback loops and evidence tags ([exp][alpha][beta][smoke][rc][prod],
  enforced by scripts/ada/lifecycle-check.py). Tony''s stages map: idea=s0, requirement=s0-exit-gate
  (card w/ metric+verify), PoC=s1, prototype=s1→s2, alpha=s2, beta=s3, product=s5,
  feedback=per-stage feedback_loop.


  GAPS this card must close:

  1) PROJECT CONTAINER — a named project entity grouping cards. Proposal: CMS page
  in ada-cms-pages (project template: goal, stage, members, linked cards, decision
  log) + `project: <id>` tag on cards + release-lifecycle stage field. Board filters/rollups
  by tag.

  2) TG IDEA INTAKE — ada-tg-relay already carries Tony→Ada text. Add an Ada instruction
  + tool: idea arrives → match to a project (tag/page search) → file card under it;
  if confidence is low, card in backlog + board request with clickable options (existing
  mechanism) instead of guessing.

  3) ROLES — Ada = project steward (discussion, spec elaboration, CMS page upkeep,
  nudge stalled cards); Devin = tools/build/dispatch per standard procedures; nest
  = sub-dispatch execution surface.

  4) CARD-UX IMPROVEMENT LOOP — friction observed → card tagged kanban-ux → review-digest
  picks it up.'
