spec: 'send_voice + /send audio_b64 plumbing already exists in tg_relay.py (line ~484) and tts.py has a working
  Gemini-TTS synth helper (vcast-proven). Missing: the bridge — after a text turn completes, synthesize reply with
  tts.synth_pcm -> POST audio_b64 to the relay send listener. Gate per-lane via env (e.g. TG_VOICE_REPLY=1) so lanes
  opt in. Latency: adds a few seconds per turn — acceptable for voice UX. Michael asked for a voice reply in-session
  and got text; this is the gap.'
