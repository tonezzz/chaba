id: report-loop-session-rails
title: 'Report loop: report-linked dispatch rails + cms-report-note.py helper + board badge'
brief: 'Part 3 of the report→session loop (umbrella: report-session-loop). When a card carries report:<slug>, its
  dispatched session gets extra rails: read the report first, mirror progress into the report''s session-log, leave
  it updated. Queued when Tony presses Start.'
