spec: "Design: docs/design/report-session-loop.md §2 (contract). Repo: chaba.\n1. scripts/ada/cms-report-note.py\
  \ (new) — session-side CMS write helper.\n   --read prints the ada-cms-pages/<slug> doc (title, key meta fields,\n\
  \   body). --note \"<text>\" fetches the page, appends \"* {ts} — {text}\n   (session $TASK_ID if set)\" to a\
  \ managed <!-- session-log:auto --> ...\n   <!-- /session-log:auto --> block (create it just before the\n   provenance\
  \ footer if absent), appends meta.timeline (cap 40 per\n   ssot.apps.ada-cms-reports.yml meta_contract), MERGES\
  \ old doc meta per\n   the writer_contract (never bare-replace — bank/scope/status/source/\n   written_by/subject/attribute/valid_from/last_verified\
  \ preserved or\n   stamped), stamps updated, POSTs MDDB /v1/add, then regenerates\n   reports-index via scripts/lib/cms_index.py\
  \ (pattern: report-daily-brief.py,\n   cam-wall-cms.py). Idempotent notes are fine (append-only).\n2. scripts/board/kanban-dispatch.py\
  \ — when card.report is set, append\n   REPORT_RAILS after TASK_RAILS in start_pending's task build (exact\n \
  \  text in the design doc §2b — copy it).\n3. scripts/render-board.py — render a small \U0001F4C4 report badge\
  \ on cards\n   with report: linking to the tailnet CMS page\n   (https://idc03.taila0626a.ts.net/cms/?page=<slug>\
  \ — confirm the page\n   param name against ada-pi pwa/cms; if unsure use ?page=). No api_key\n   in the URL —\
  \ the browser's stored key applies.\n4. tests: unit tests for cms-report-note block-append + meta-merge\n   (mirror\
  \ tests/board style — FakeMDDB or mocked urllib). Extend an\n   existing kanban-dispatch test or add one asserting\
  \ REPORT_RAILS is\n   appended iff card.report set.\n\nVerify: python3 scripts/ada/cms-report-note.py dev-kanban\
  \ --read prints the page; --note lands a session-log line visible on the CMS page and meta.timeline grows by one;\
  \ a queued card with report: dev-kanban produces a prompt containing the report rails (grep the task build)."
