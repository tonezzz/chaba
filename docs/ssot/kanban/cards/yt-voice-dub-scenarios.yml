id: yt-voice-dub-scenarios
title: YT voice dub — scenario + benchmark coverage
brief: Adds automated checks so dubbing quality is measured every run instead of by ear. Implementation and gate
  definitions landed in ada-pi in Oct 2026; publishing the runtime metrics sidecars is a separate deploy item.
column: done
program: yt-voice-dub
area: testing
priority: medium
metric: dub scenarios pass in ada-pi suite; benchmark tracks cue overflow % + voices-per-speaker
verify: 'Verified 2026-11-24 from merged evidence (Tony): ada-pi commit d801a83 ("dub gate: dub_* metric scenarios
  + benchmark metric capture") is an ancestor of origin/main; tests/scenarios-live/{dub_cue_timing,dub_voice_consistency,dub_duck_mix}.yaml
  and the tests/benchmark.yml dub metric registry + suites.dub are present in main. Runtime gate execution is not
  a close condition today: both dub-metrics/1 sidecars (LLALMFmabV4-dub, dub-v9-2voice) return 404 and the scenario
  preflight target tony-dell:8791 refuses connections (yt-live-api is live on tony-omen:8791) — open tony-dell deploy-gate
  follow-up, recorded in comms.'
note: 'Add dub checks to ada-pi scenario-live + tests/benchmark.yml (Tony ask 2026-10-04 — reuse for scenario &
  benchmark). Scenarios: dub_cue_timing (each TTS segment fits its cue window within tolerance), dub_voice_consistency
  (same speaker keeps same voice across cues — doubles as the yt-voice-dub-cast regression gate), dub_duck_mix (original
  ducks during dub segments, recovers after). Benchmark metrics: cue overflow %, WER of dub vs source captions,
  voices-per-speaker = 1, dub-vs-original loudness delta.'
help: ada-pi tests/scenarios-live/ + tests/benchmark.yml; template gev_pane_honest_fail
spec: 'ada-pi: add to tests/scenarios-live/ — dub_cue_timing (TTS segment fits its cue window within tolerance),
  dub_voice_consistency (same speaker keeps the same voice across cues — doubles as the yt-voice-dub-cast regression
  gate), dub_duck_mix (original ducks during dub segments, recovers after). Plus tests/benchmark.yml metrics: cue
  overflow %, WER of dub vs source captions, voices-per-speaker == 1, dub-vs-original loudness delta. QUEUE AFTER
  yt-voice-dub-cast lands — gate for the dub program.'
