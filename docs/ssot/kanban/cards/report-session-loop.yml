id: report-session-loop
title: Report -> Devin session loop — CMS page spawns a card, Ada joins the thread
brief: From a report page you should be able to kick off a work session that tracks itself on a card and keeps the
  report updated. Waiting in the backlog — no action needed.
column: backlog
priority: high
