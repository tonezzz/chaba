note: 'Tony 2026-10-07: from a CMS report (e.g. /chaba-admin/chaba-cms) start a Devin session on that report; a
  linked kanban card tracks it and the report stays updated; Tony can follow up via the card AND via Ada; "ask Ada''s
  opinion" must be saved on the card for Devin to weigh alongside Tony''s. End-to-end loop under the board standard.
  Building blocks that already exist: board-api /comment|/respond| /request with ''ada'' as a whitelisted actor;
  answers.jsonl injection into running dispatch sessions (board-answer-live-session, done); ada_board_write tool
  (comment|respond|read); devin_dispatch tool; cms_read/cms_edit/cms_publish_page on the Ada side.'
spec: 'Design the loop as four deliverables — (1) SPAWN: a "start session" affordance on CMS report pages (chaba-admin/chaba-cms
  or a global page action) that creates a kanban card {title from page, spec with report key + link, action:dispatch}
  — same effect as Ada saying "start a Devin session on this report" via devin_dispatch. (2) LINK: card carries
  report:<cms-key>; the dispatch prompt rails tell the session to refresh the report (cms_edit) and post progress
  to comms — report and card stay in sync by convention, verified in the session''s task rails. (3) ADA-IN-THE-LOOP:
  an `ada_opinion`/kanban_opinion path — Tony asks Ada aloud; she cms_reads the report, forms an opinion, posts
  it as card comms from=ada tagged [opinion]; running sessions already pick it up via answers.jsonl/comms polling.
  Tony''s replies via /respond land the same way — one thread, both voices. (4) TRAIN+BENCH: new live scenario report_opinion_loop
  in ada-pi tests/scenarios-live (Ada asked for opinion on a report -> must read it -> post tagged comms -> visible
  on card), plus orch-bench/nest topologies for the opinion-forming step once the corpus exists. Card is the umbrella
  — split implementation into sub-cards as needed; keep this card for e2e tracking.'
