    per-runner is whack-a-mole (fleet has 4+ runners; the brief only patched 3). Queue-time classify in board-api
    is the claimer-agnostic fix — even old binaries already forward action.model -> DISPATCH_MODEL. Recommend bumping
    this out of backlog.'
