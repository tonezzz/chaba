spec: 'Context: GitHub Models service retired 2026-07-30 (verified — models.github.ai returns bare OK; docs 301
  to retirement notice). PAT in ~/.config/secrets/github-models.env is valid for git/MCP but there is no models
  API.


  Verified account state (2026-11-07, api.github.com/copilot_internal/user): tonezzz = Copilot Pro individual monthly
  — premium_interactions entitlement 1500 AI credits/mo, chat+completions unlimited, cli_enabled, is_mcp_enabled,
  cloud_sessions_enabled, resets 2026-12-01.


  Goal: determine what Copilot Pro gives the infra beyond IDE completions.

  Steps:

  1. Install Copilot CLI on tony-omen, authenticate, smoke an agentic session.

  2. Test @github/copilot-sdk (JSON-RPC over Copilot CLI): listModels(), createSession, sendAndWait — check credit
  consumption per call for automation use.

  3. Evaluate SDK BYOK -> litellm/ollama wiring (SDK supports OpenAI-compatible providers incl. LiteLLM).

  4. Decide and document (lesson or kb note): does Copilot cover any Ada/litellm model needs, or is it IDE/agent-surface
  only for us?


  Constraint: no official raw inference endpoint exists — SDK/CLI is the only sanctioned programmatic path; unofficial
  api.githubcopilot.com proxies are ToS-grey, do NOT wire into litellm/Ada.'
note: Spawned from chat 2026-11-07 — GitHub Models retirement follow-up.
