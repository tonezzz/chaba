id: storage-rebalance-underused
title: 'Rebalance fleet storage: move heavy data from tight hosts to underused con01/idc02'
column: backlog
updated: 2026-11-23 07:13
brief: con01 (52% used, 140.5 GiB free) and idc02 (45%, 160.1 GiB free) are underused while idc03 (90%, 31 GiB)
  and tony-dell (88%, 25.8 GiB) are tight. Migrate yt-live-media cache, backups, mddb/backup data and large logs
  to free space.
priority: medium
tags:
- ansible
