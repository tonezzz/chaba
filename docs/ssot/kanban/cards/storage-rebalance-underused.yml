spec: 'GOAL: rebalance disk usage across the fleet. Move heavy consumers (yt-live-media cache, backups, mddb data,
  large logs) from idc03 and tony-dell onto con01/idc02. Add an underused signal (mount < 50% used or > 100 GiB
  free) to disk-headroom.yml and disk-trend-watch.py so over-provisioned hosts surface. Consider capacity planning:
  downsize con01/idc02 or expand idc03/tony-dell.'
