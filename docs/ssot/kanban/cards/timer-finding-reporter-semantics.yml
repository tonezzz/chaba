id: timer-finding-reporter-semantics
title: Finding-reporter jobs exit nonzero -> sentinel can't tell finding from crash
column: done
updated: 2026-10-13 16:28
priority: medium
tags:
- timers
- sentinel
- design
- dispatch
spec: 'Affected: arp-inventory-scan (exit1 + writes focus-inbox alert), chaba-audit-watchdog, mddb-memory-standard
  (exit1 after printing stats — unclear if breach or bug), chaba-audit-full, ada-scenario-* x5, ada-recall-canary.

  Standardize one of two ways (pick, document in docs/kb/timer-expectations.md):

  A) job exits 0 on a completed run regardless of findings; findings go to report file/focus-inbox/kanban. Sentinel
  only alerts on real crashes. Preferred.

  B) declare kind: finding-reporter in ssot.audit.hosts so sentinel classifies exit-1 as ''finding: see report''
  (yellow) not red alert.

  Also investigate mddb-memory-standard specifically: its exit-1 has no breach/error text in the journal tail —
  determine whether a breach fired silently or the exit is a bug.'
