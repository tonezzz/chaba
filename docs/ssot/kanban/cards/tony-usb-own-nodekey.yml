- at: 2026-10-25 05:33
  from: backlog-spec-enrich
  text: spec drafted by backlog-spec-enrich (gemini-3.5-flash-lite) — review before queueing
spec: The goal is to stop the tony-usb stick from stealing the real mn01 tailnet session by giving it
  its own unique node identity. On the tony-usb stick host during the next stick session, run sudo tailscale
  logout, delete /var/lib/tailscale/tailscaled.state, and run tailscale up as its own node named tony-usb
  or rescue. Finally, document the generated per-stick identity in mn01-stick-standard.md. The testable
  done-condition is that the stick successfully authenticates to the tailnet with a distinct node key
  rather than cloning mn01, and mn01-stick-standard.md is updated with the new identity details.
