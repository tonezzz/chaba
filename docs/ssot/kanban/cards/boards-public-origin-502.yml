  text: 'DNS/IP verification 2026-10-29: boards.surf-thailand.com resolves to Cloudflare proxy IPs 172.67.196.69
    and 104.21.74.33 (expected when proxied). Origin boards.h3.gizmo-thailand.com resolves to 103.99.11.249. Direct
