spec: 'Evidence 2026-10-29: https://boards.surf-thailand.com/ returns Cloudflare HTTP 502; origin https://boards.h3.gizmo-thailand.com/wp/
  returns nginx HTTP 502. Chaba board-api on idc03 remains healthy at :8787/health and public tailnet :10000/health
  returns 200. Do not start a duplicate board service on tony-dell. Diagnose origin nginx/Plesk/WP upstream, verify
  /wp/ and /wp/wp-json/ through both origin and public host, then report root cause and consumer proof.'
