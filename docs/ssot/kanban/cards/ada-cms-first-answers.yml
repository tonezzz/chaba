id: ada-cms-first-answers
title: Ada CMS-first answers + save-back standard
column: backlog
note: >
  Bring Ada up to standard on CMS documents: (1) always answer from
  reports-index / ada-cms-pages BEFORE searching elsewhere — reports are the
  first read, search is the fallback; (2) when she does answer from an
  outside source, save the finding back to CMS (cms_note_update /
  cms_publish_page) so repeat questions never need a re-search. Partially
  declared in ssot.apps.ada-cms-reports.yml (ada_ritual, tiers read_order
  L3→L2→L1→L0) but not enforced — education-correction and session summaries
  show she still free-searches. Staged verification scenarios:
  stacks/services/ada-scenario-runner/scenarios-staging/cms_first_answer.yaml
  + language_lock.yaml (install into ada-pi tests/scenarios-live/).
