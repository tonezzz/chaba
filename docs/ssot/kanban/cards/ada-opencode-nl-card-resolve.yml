  text: 'Implemented and deployed. find_card in opencode/ada_mcp.py now resolves natural-language references in
    tiers: exact id/ref/alias -> title substring -> scored token overlap over id+ref+title+brief+spec; ambiguous
    matches return candidate id/ref/title list instead of dead-end no-match. Live on idc02 ada-opencode (commit
    843cfcd, service restarted): "media pack" -> MED-1032, "kornia evaluator" -> OPS-1055, "hibiscus" -> 3 candidates
    listed, "gaussian splat smoke" -> 2 candidates listed. Unit tests:'
