id: line-push-quota-resilience
title: 'LINE relay: monthly push quota exhausted — queue-and-reply fallback + spend visibility'
column: done
updated: 2026-10-23 11:33
priority: high
tags:
- line
- relay
- ops
spec: '2026-10-14 17:12: two queued chat_send deliveries to kk-ha group (apology text, then image+caption) failed
  with LINE 429 {"message":"You have reached your monthly limit."}. The OA free-plan push quota is exhausted — every
  proactive/queued send (no fresh replyToken) burns it, and nothing reached KK.


  Facts: relay already prefers /message/reply with the event replyToken and falls back to push — so inbound-triggered
  replies are free, but ALL chat_send/proactive deliveries are push and metered. Quota hit mid-month; reset is monthly.


  Proposed fixes (pick at impl):

  1. 429-monthly fallback: when push returns monthly-limit, park the outbound payload (durable queue) and deliver
  it as /reply on the user''s next inbound event (fresh token) — or relay a heads-up text via the next free reply.

  2. Proactive-send audit: count push vs reply per day in the ops ledger so quota burn is visible before the wall.

  3. Reduce push usage: batch queued sends / prefer replying in-turn instead of background chat_send where latency
  allows.

  4. Plan decision for Tony: free tier is too small for a household bot with proactive delivery — LINE OA paid plan
  or per-member OA split is an option. Spend gate — Tony''s call.'
ref: OPS-0651
