title: 'Door read ops: /lesson op=list|get (education content to agents)'
column: backlog
updated: 2026-11-23 14:20
brief: Lessons are invisible to agents (only topics slugs exist). Add /lesson op=list (all topics+modified+level+next_review)
  and op=get (full content by slug) so agents + lessons-due can read without WP creds.
tags:
- education
- board-api
- lessons
