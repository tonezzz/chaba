id: ada-engine-runtimes
title: Per-engine runtimes — parallel engine versions on idc03 (checkout+venv or quadlet per line@version)
column: backlog
updated: 2026-11-19 20:06
priority: low
spec: 'From ai-engine-lines (ssot.apps.ada-engines.yml): every ada-* instance shares the one idc03 ada-voice checkout
  + .venv, so the fleet-wide engine version is single — lanes cant run DIFFERENT engine versions simultaneously.
  Parallel lines/versions need a per-engine runtime: own checkout+venv per <line>@<version> or a quadlet image (host-hygiene:
  quadlets-only, declared units, cgroup caps per docs/kb/ha-ada-isolation.md). One-time infra enabling ada-2 + other
  lines to coexist with ada-1.'
ref: ADA-0155
