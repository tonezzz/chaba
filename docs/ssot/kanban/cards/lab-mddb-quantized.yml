id: lab-mddb-quantized
title: 'Lab: mddb quantized vs flat vectors'
brief: "An experiment to shrink the memory database's vectors so lookups get cheaper; it's now testable on the spare node. Sitting in the backlog — no action needed."
column: backlog
lab:
  hypothesis: The quantized in-memory index is close enough in recall to flat to run as default — saving RAM on
    the 12G idc01 leader
  metric: recall@10 >= 0.95 vs flat AND RSS reduction >= 25% on the ada-* banks
  review_by: '2026-10-18'
note: 'Now testable: MDDB_VECTOR_ALGORITHMS allowlist live on both nodes (flat,quantized). Bench on follower to
  keep leader stable.'
