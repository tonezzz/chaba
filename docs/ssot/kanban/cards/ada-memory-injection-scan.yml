id: ada-memory-injection-scan
title: 'Ada memory: pre-write injection/exfiltration scan'
brief: Ada reads untrusted text (LINE messages, guest chat, transcripts) and can save it into long-term memory banks.
  Nothing currently screens that content before it lands. This adds a scan step that refuses memory writes containing
  injection phrases, credential-shaped strings, or invisible Unicode — the same class of check Hermes runs before
  accepting a memory entry.
column: review
priority: high
created: 2026-10-08
updated: 2026-10-09 20:33
pipeline: ci
autonomy: t2
metric: A seeded injection attempt via ada_remember/guest_remember returns a structured refusal (not a silent write),
  is logged as an ada event, and never reaches MDDB — while a normal memory write is unaffected.
verify: 'From an ada-dev session: attempt a memory save whose text contains a classic injection payload ("ignore
  previous instructions", a fake API key, a zero-width joiner string) — each refused with reason; a benign save
  succeeds. Scan runs pre-write, so MDDB collections show no injected doc.'
spec: "Where: ada-pi repo — a new backend/memory_write_guard.py module, called\nfrom tool_runner/memory.py (ada_remember,\
  \ guest_remember,\nguest_remember_private, vocab_note paths) before the MDDB upsert.\n\nScan classes (keep the\
  \ list data-driven — a pattern table at the top of\nthe module, not scattered regex):\n  1. prompt-injection phrases\
  \ (\"ignore previous instructions\",\n     \"system prompt\", \"you are now\", role-spoof prefixes)\n  2. credential-shaped\
  \ strings (AKIA/openai/sk-/ghp_ token regexes,\n     \"BEGIN PRIVATE KEY\", password-style assignments)\n  3.\
  \ invisible/bidi Unicode (ZWSP, ZWJ where unexpected, RTL overrides)\n  4. oversized homoglyph/whitespace floods\n\
  \nBehavior: refuse with {ok: false, reason, matched_class} so the model can\ntell the caller plainly; log a memory-scan-refused\
  \ event to the ada\nevents collection (identity, bank, class — never the payload itself).\nIdentity-aware: trusted\
  \ identities (full:true) still scanned — the scan\nguards the bank, not just the user.\n\nShip with --selftest\
  \ exercising all classes; wire the class list into\nssot.apps.ada-memory-banks.yml context so the rule is documented\
  \ in SSOT.\n\nReuse, don't reinvent: keep it string-level and dependency-free like\nrender-memory.py — no model\
  \ call in the write path.\n"
expected_goals:
- id: guard-module-exists
  check: file-exists backend/memory_write_guard.py
- id: selftest-passes
  check: command python3 backend/memory_write_guard.py --selftest expect SELFTEST-OK
