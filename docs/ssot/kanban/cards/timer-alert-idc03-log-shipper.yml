  text: '[devin] root cause found: mddb-ops /add latency is 2-6s/doc (17GB db + box load ~9 from mddb-embed retry
    storm vs ollama 504s). Sys-journal backlog >=6000 docs; shipper does 1 HTTP POST/doc and only checkpoints cursor
    at end of each journal leg -> killed at 600s with zero progress, re-wedges every run. Fixing script to bulk-ingest
    (~0.09s/doc via /v1/ingest) + per-batch cursor checkpoint.'
