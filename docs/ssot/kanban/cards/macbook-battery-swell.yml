comms:
- at: 2026-10-13 18:42
  from: devin
  text: 'MacBookPro13,3 battery has degraded to 58% of design (3,873/6,669 mAh, 87 cycles) and is now SWELLING —
    trackpad is hard to press, classic early-swell symptom pushing up from inside. Physical hazard: swollen + glued-in
    cells = puncture/fire risk on removal. Path: repair-shop replacement ~THB 2,500-4,500 (they take the puncture
    risk; A1707 battery is glued under components). Interim: stay on AC, do not leave charging unattended, do not
    compress in a bag, keep off flammable surfaces, plan removal '
