note: '2026-10-10: tony-dell GUI froze (mouse moves, zero control) — root cause: devin-desktop autostarted TWO instances
  at login, 4 Electron renderers oversubscribed all 8 cores. Reboot + killing the dupe recovered it. tony-dell is
  a server (HA+apps): devin-desktop should not autostart on login. Fix: remove its autostart entry on tony-dell,
  document "open manually when needed". AQ: login → no devin-desktop procs unless launched.

  '
