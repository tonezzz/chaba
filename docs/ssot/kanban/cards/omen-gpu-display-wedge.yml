- at: 2026-10-10 08:26
  from: devin
  text: 'Implemented in scripts/board/runner-agent.py (worktree dispatch/20261010-080645): 1) all task units on
    desktop-labeled hosts get Nice=10 + ionice best-effort/6 + CPUQuota 75%CPU + MemoryMax 75%RAM — container/script
    via systemd-run argv, dispatch via DISPATCH_UNIT_PROPS + post-start set-property/renice; 2) gpu-labeled cards
    now pass an nvidia-smi VRAM pre-flight BEFORE claim — action.gpu.min_free_mb vs free, 512MB host floor; shortfall
    defers (card stays queued), need>total refused with comms; 3'
- at: 2026-10-10 08:26
  from: devin
  text: 'RUNBOOK — display wedge manual unstick (also in docs/ssot/jobs/kanban/2026-10-10-omen-gpu-dispatch-safety.yml):
    symptom = monitor + AnyDesk frozen on a stale frame, ssh alive. 1) ssh tony-omen. 2) `cat /sys/class/tty/tty0/active`
    + `loginctl list-sessions` — find the Type=x11 session VTNr (GDM user session = vt2). 3) `sudo chvt 3; sleep
    2; sudo chvt <vt>` — forces a modeset reset, session survives. 4) If the watchdog SIGSTOPped the task it auto-resumes
    after 2 healthy probes, or `systemctl --use'
- at: 2026-10-10 08:28
  from: devin
  text: 'DONE (branch dispatch/20261010-080645, d7e904e2): runner-agent.py now (a) caps+nices every task unit on
    desktop-labeled hosts (Nice=10, ionice BE/6, CPUQuota 75%CPU, MemoryMax 75%RAM — dispatch units via DISPATCH_UNIT_PROPS
    + post-start set-property/renice), (b) pre-flights VRAM before claiming gpu cards (action.gpu.min_free_mb; defer/refuse
    + comms), (c) watchdogs presentation during gpu tasks (vsync flood or hung xrandr -> throttle -> SIGSTOP ->
    auto-SIGCONT), (d) chvt unstick in comms + docs/'
