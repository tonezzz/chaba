id: openclaw-authprofile-or-key-stale
title: '@myChabaBot silent — OpenClaw auth profile holds expired OR key'
column: done
updated: 2026-11-24 08:13
brief: 'TG DM chat 8960073266 (@myChabaBot) has been failing every model turn since 2026-11-20: 401 API key expired
  → 401 User not found. Root cause: tony-omen ~/.openclaw/state/openclaw.sqlite config_machine_state authProfiles.store
  profiles."openrouter:manual".key still holds sk-or-v1-e2c…f05528 (set 2026-10-12, expired 2026-11-11). The Nov-12/13
  fleet rotations updated the 3 env-file stores but missed this 4th store. Valid key in env files (sk-or-v1-a26…00735b,
  exp 2026-12-12) is near cap ($8.78/$10).'
priority: high
tags:
- secrets
- openclaw
- telegram
spec: '1) Tony mints a fresh OR key at openrouter.ai/keys and drops it into ~/.config/secrets/or-next-key on tony-omen.
  2) Run ~/.local/bin/rotate-or-key (never pass the key as argv) — it swaps all 4 stores incl. authProfiles.store.
  3) Restart openclaw-gateway if it cached the old key. 4) Verify: openclaw models auth paste-api-key/profile state,
  a test heartbeat turn with cost 0, and no new 401 in the telegram session transcript. 5) Update ssot.services.yml
  rotation note + close this card.'
ref: SEC-0023
