id: worktree-sprawl
title: Branch/worktree sprawl — 20 branches ahead, 51 worktrees
column: backlog
note: >-
  Standing con from DEV_SYSTEM_ASSESSMENT (was hard-failing SSOT CI until
  2026-10-03 — now advisory). Work: list worktrees, classify merged/stale/
  active, archive or delete merged branches, consolidate long-tail work.
help: |-
