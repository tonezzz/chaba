id: nest-micro-training
title: Chaba Nest micro-model evolution loop — agent-owned train→bench→promote
brief: The small-model training loop that already turned a weak model into a good one needs an owner to keep improving
  it. Waiting in the backlog — no action needed.
column: review
priority: medium
created: 2026-10-07
updated: 2026-10-07 22:11
note: 'The proven formula (jev-student: 56% gemma-1b -> 100% distilbert via 5 corpus iterations) needs an owner.
  An agent loop (OpenClaw-style or a scripted pipeline) drives: corpus delta -> candidate train -> bench -> scorecard
  -> shadow -> promote. Train+bench is T2 (reversible), promotion is T1/T3 (human gate).'
spec: "1. Task suites: per-specialist labeled sets — golden (frozen\n   regression), hard/OOD (rotating in from\
  \ corpus), adversarial.\n   Registry: tests/bench/suites.yml in ada-pi.\n2. Model registry: topologies.yml gains\
  \ models: section — task,\n   checkpoint, corpus version, bench scores, status\n   (train|shadow|prod|retired).\
  \ jev-student v5 becomes the first entry.\n3. Training lanes: tony-omen GTX1650 (distilbert FT, 1b LoRA via 4-bit),\n\
  \   Colab burst via colab-mcp (bigger runs), idc01 for cold batch jobs.\n   jev-unsloth-finetune page has the\
  \ recipe.\n4. Loop owner: agent harness or chaba script — harvest corpus deltas\n   (jev-corpus divergences, orch\
  \ misses, scenario fails), propose +\n   train candidate, run suite bench, publish bench/train-* doc, queue\n\
  \   promotion question when candidate meets gate.\n5. Promotion gate: candidate >= champ on golden, no hard-set\n\
  \   regression -> shadow deploy -> live divergence metrics decide.\n   Same posture as CAM++ speaker shadow and\
  \ client_noul edge lane."
