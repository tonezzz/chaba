spec: 'Implement ada_context_pack(query, card_reference?, profile?) in the DevNest ada-control bridge. It must return
  a compact JSON context pack: profile, allowed_sources, SSOT hits from MDDB infrastructure-ssot/chaba-glossary,
  Education lessons, Devin session summaries, optional safe card fields, budgets, provenance, and mutations_performed=[].
  No personal/household banks, no writes, no arbitrary filesystem/MDDB collection access. Wire OpenChamber/OpenCode
  to inject the pack as a session instruction entry or prepend a compact context header for /ada commands. Acceptance:
  smoke test returns cited SSOT+lesson+devin hits; read-only profile cannot mutate; stale OpenChamber project path
  fixed so sessions resolve /home/tony/DevNest.'
