spec: "Design: docs/design/report-session-loop.md §1a (read it first — it is the contract). Extend scripts/board/board-api.py\
  \ do_create to accept optional fields on POST /card:\n- spec (str): stored verbatim. If absent AND `report` is\
  \ set, compose it\n  from a REPORT_SPAWN_TEMPLATE constant so every spawn caller produces an\n  identical card.\n\
  - report (str): validate ^[a-z0-9-]{1,80}$, stored on the card (field\n  declared in ssot.kanban.yml card_schema).\n\
  - action (dict): {type: dispatch, repo: <name>} — type must be dispatch\n  or manual; repo validated against the\
  \ devin-dispatch whitelist\n  (scripts/board/dispatch_repos.py knows repos.conf — reuse its loader,\n  do not\
  \ re-parse the conf inline).\n- queue (bool): when true set action.status=queued in the same locked\n  write —\
  \ no create+queue two-call race.\n- brief, priority (high|medium|low), tags (list), program, blocked_by —\n  optional\
  \ pass-throughs. brief is the new-card convention (kanban-card-brief).\n- on_exists: 'error' (default — today's\
  \ 400) | 'queue': card exists → if\n  its action.status is running/queued return its status ('already\n  active');\
  \ otherwise set action.status=queued + comms 're-spawned from\n  report page' and return ok. This is what makes\
  \ a second button click\n  safe.\n\nREPORT_SPAWN_TEMPLATE (server-side): \"Work on the CMS report '{slug}' — \\\
  \"{title}\\\".\\nReport: ada-cms-pages/{slug}\\nThis card is report-linked (report: {slug}) — read the report\
  \ first, keep it updated per the report rails, and post progress to this card.\"\nUpdate: _selftest() cases for\
  \ each new field + on_exists paths; endpoint doc in board-api.py docstring + write_path.endpoints in docs/ssot/kanban/ssot.kanban.yml.\n\
  Verify: python3 scripts/board/board-api.py --selftest passes; a curl POST /card {title, report: 'dev-kanban',\
  \ action:{type:dispatch,repo:chaba}, queue:false, brief:...} creates the YAML; on_exists:queue re-queues it."
