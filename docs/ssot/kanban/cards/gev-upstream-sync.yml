spec: 'Rebase the tonezzz/gods-eye-view fork onto upstream bilawalsidhu/main and re-validate the Gemini voice bridge
  surface.


  Context (verified 2026-10-14):

  - Checkout: ~/gods-eye-view on tony-dell. Remotes were RENAMED today: origin = https://github.com/tonezzz/gods-eye-view
  (our fork, pushable — worktree base comes from here), upstream = https://github.com/bilawalsidhu/gods-eye-view.
  `git fetch upstream` first.

  - Our main = 7 commits ahead of the fork base (upstream 7596522 -> ours 0b5a37a): Gemini Live voice switch (src/voice/gevGeminiRealtime.js
  etc), mic gain fix, ?remote=1 passive remote-control listener, Nominatim geocode fallback + early remote channel
  + capture_frame, Thai Flood Hub inundation layers (src/data/local_data/flood_inundation/*, localLayers), sorted
  registry order, clean-view CSS fix.

  - upstream/main HEAD = 132b9e9 (~817 commits): v0.2.0+v0.2.1, Google Street View, Mapillary, Director family,
  voice-core refactor (#837) + ChatGPT Realtime OAuth (#621), tool-catalog (#896), Google 3D access tokens, many
  data-source fixes, trackpad pinch-zoom.

  - Files changed on BOTH sides (conflict candidates): index.html (ours +109 / upstream +14), src/voice/gevActions.js
  (ours +7 / upstream +2424 — they rewrote the tool surface), src/locations.js (+45/+775), src/data/layerState.js
  (+3/+652) + layerState.test.mjs (+2/+1475), src/data/localLayers.js (+40/+4), src/logoGaze.js (+1/+38), src/main.js
  (+1/+17), vite.config.js (+8/+3).

  - Our Gemini voice is mostly in files upstream never touched (gevGeminiRealtime.js); the real conflict is the
  WIRING in index.html/main.js/gevActions.js — re-attach our hooks onto their voice-core.


  Do:

  1. From the dispatch worktree (already cut from origin/main = our fork main): git fetch upstream; create the sync
  on your dispatch branch via `git merge upstream/main` (merge preferred over rebase here — our commits are few
  but the rewrites are deep; a merge keeps conflict resolution reviewable in one commit).

  2. Resolve conflicts keeping OUR voice architecture: Gemini Live via gevGeminiRealtime.js, ?remote=1 passive listener,
  capture_frame, Nominatim fallback, flood-inundation layers. Do NOT adopt upstream''s OpenAI/ChatGPT realtime —
  the gev-gemini bridge (quadlet on tony-dell) is the production voice path.

  3. npm install if package.json changed; npm test. EXPECTED pre-existing failures (baseline today): 2 schema-pin
  guards — radioMarkup.test.mjs ''no unchanged Realtime tool definition drifts silently'' and firstRunExperience.test.mjs
  ''voice TOOL SCHEMA is byte-identical to main''. These pin GEV_REALTIME_TOOLS byte-for-byte; upstream''s tool-catalog
  changes will trip them regardless. Per the tests'' own comments, re-derive the digest/pin and record in the commit
  message which tools moved. All OTHER tests must pass (baseline: 2704 pass / 2 fail / 1 skip).

  4. Regenerate the bridge tools snapshot: node ~/CascadeProjects/chaba/stacks/tony-dell/gev-gemini/tools-check.mjs
  --write against the merged vite.config.js. KNOWN WRINKLE: the committed tools.json currently carries bundle-side
  move_camera zoom/fly motions (enum zoom/stop, amount param, extra directions) that were never committed to source
  — baseline tools-check FAILS on exactly this. Decide in the merge: if upstream''s new camera tools cover those
  motions, take upstream and regen clean; if our motions are still needed, add them to GEV_REALTIME_TOOLS in vite.config.js
  first, then regen. State which you chose and why in the report.

  5. npm run build must succeed. Do NOT stage or deploy the bundle into chaba (stacks/web/public/apps/gev) — that''s
  a separate step after Tony reviews.

  6. Push your dispatch branch to origin (the fork). Do not merge to main yourself — the merge guard handles it.


  Report back: conflict files + how resolved, npm test delta vs baseline, tools-check outcome, whether gevGeminiRealtime
  still binds cleanly to upstream''s new voice-core (this is the key risk — if their refactor removed the hooks
  we attach to, say so explicitly rather than shimming silently), build success.


  DO NOT: push to upstream, touch gods-eye-view-api/gev-gemini services, edit or deploy into the chaba checkout,
  run live-check.py (Gemini Live is spend-capped — ADA-0632).'
