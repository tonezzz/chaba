id: member-nodes-to-vps-ha
title: 'Member/dev nodes to VPS (idc01/idc03) + Cloudflare HA for HA nodes'
column: backlog
priority: high
note: >-
  Tony 2026-10-09: "can we run it on idc01-03? consider move the others too,
  tony-dell is too unstable. how can we make high availability using
  cloudflare?" — assessed below.
action:
  type: manual
  status: open
  runner: devin
updated: 2026-10-09 09:15
comms:
- at: 2026-10-09 09:15
  from: devin
  text: >-
    Assessment: (1) MOVABLE: memory-only member nodes (kk-ha) and dev nodes
    (ada-ha, michael-dev) have no LAN dependency — they only need idc03 Ada
    backends + their config dir. kk-ha could even run co-located on idc03
    (edge leg drops to loopback). NOT MOVABLE: tony-ha — it owns LAN
    hardware (ESPHome/cameras/plugs/tuya-local); it is the household LAN hub
    and must stay local. Fix tony-ha stability locally instead (watchdog or
    better local box). (2) DATA: moving kk-ha puts KK's personal assistant
    config on a VPS disk — needs Tony's call. (3) CF HA options: (a) FREE —
    Cloudflare Tunnel with 2+ cloudflared connectors (tony-dell + VPS);
    CF routes to any healthy connector, real failover without LB add-on;
    (b) CF Load Balancing add-on — proper health-checked pools, paid;
    (c) cheap — two A records to idc02+idc03 edges (both already proxy the
    same backends), soft failover via browser retry; (d) node redundancy —
    standby member-node container on idc01 with config sync, promoted on
    failure. Recommend (a)+(d): tunnel multi-connector for the path, standby
    replica for the node.
requests:
- from: tony
  needed: Decide (a) move kk-ha/ada-ha/michael-dev containers to idc01 or
    idc03 — and whether KK's assistant data may live on a VPS disk; (b) CF
    approach — free tunnel multi-connector vs paid Load Balancer.
  status: open
