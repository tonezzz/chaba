spec: 'Verify and operationalize storage cleanup safely. Do not let OpenCode invent rm commands or delete arbitrary
  paths. Build a deterministic, allowlisted cleanup runner plus read-only report: capture df, root/home top-level
  usage, target sizes, active writers/locks, Devin DB quick_check and session locks, dispatch worktree/task terminal
  state, protected paths, and candidate list. First automatic targets may include only policy-approved rebuildable
  caches/log retention and Devin session pruning through the existing precleanup/prune path; never delete model-archive,
  backups, git worktrees, dispatch tasks, secrets, active databases, containers/volumes, or the ada-ha stale clone
  without explicit review. Add dry-run by default, an explicit guarded apply mode, post-cleanup verification, freed-space/skipped-items
  report, and Telegram delivery through existing board_notify BOARD_NOTIFY_CHANNEL=tg relay. Run a read-only OpenCode
  review of the candidate report before apply; apply must be deterministic and refuse if preflight, DB integrity,
  locks, backup/summary preservation, or verifier checks fail. Rollback/disable is the systemd timer kill switch.
  Validate first on tony-dell only, then consider tony-omen/macbook. Acceptance: dry-run report, no mutation in
  dry-run, JSON/Markdown artifact, TG report delivery smoke, apply mode deletes only declared automatic_ok targets,
  and post-check confirms services/DBs healthy.'
