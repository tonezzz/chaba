spec: 'Phase 1 only: (1) digest-worker change — classify each new post comment as actionable|discussion|question;
  actionable → kanban card via board-api POST /request with post_id + comment_id + permalink in spec, default column
  backlog. (2) WP identity — create proper devin/ada WP users so agent comments post under real identity and skip
  the hold queue (manual REST comment today landed status=hold, needed admin approval). (3) Loop-close convention
  — the agent that actioned a comment replies in-thread with result + card link; card comms records the comment
  id. Deferred to a later card: status badges on page (state stays on kanban), bbPress/forum rejected — kanban is
  the single work list, comments are the front door. Verify: a comment on any lesson/CMS post produces a kanban
  card (or question-thread reply) within the digest cycle, and the agent reply appears threaded under the comment
  with real author identity — no hold queue. Ref: lesson post 2040, session 2026-10-22 tony-dell.'
