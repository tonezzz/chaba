id: lesson-comments-dev-board
title: Comment → work bridge — turn WP post comments into a dev discussion board
column: doing
updated: 2026-10-28 12:39
brief: 'Tony wants comment sections on boards (lesson/CMS posts) to function as a development discussion board —
  comments become actionable threads, not just a suggestion log. Today the digest bot files comments as reference-only
  (digest:74) and nothing acts. Live demo of the target loop already ran: Tony commented images-vertical→horizontal
  on lesson-7988868998ad (post 2040, comment 74) → Devin read it via /wp/v2/comments, re-rendered landscape, updated
  the post, replied in-thread (comment 76). Automate that loop.'
priority: medium
tags:
- board
