spec: >-
  Design: docs/design/report-session-loop.md §4 (contract). Repo: ada-pi.

  1. Install tests/scenarios-live/report_opinion_loop.yaml — a STAGED copy
     exists in the chaba repo at
     stacks/services/ada-scenario-runner/scenarios-staging/report_opinion_loop.yaml
     (cms_first_answer.yaml precedent); review + copy it in, adjust
     key_name/url conventions to match the other live scenarios. It asks
     Ada for her opinion of the dev-kanban report and asserts she reads
     the page (cms_get_page) and posts to the board (ada_board_write).
     Probe card scenario-report-opinion (report: dev-kanban) already
     exists in chaba as the comms sink — scenario opinions accumulate
     there.
  2. Confirm the scenario passes once live on ada-ha-tony — run it
     manually via scripts/scenario-live.py rather than waiting for the
     batch timer, and record the result on this card.
  3. Bench domain report-opinion is already declared (status: spec) in
     chaba docs/ssot/infrastructure/ssot.nest-bench.yml — corpus = real
     [opinion] comms on report-linked cards. No scorer yet (a scorer with
     no corpus is dead code — domain rule). If a cheap seed-miner is easy
     (scan done cards' comms for [opinion] lines into a corpus jsonl),
     add it under tests/bench/; otherwise leave corpus growth to live use
     and say so in comms.
  4. orch-bench/nest topologies for the opinion-forming step: explicitly
     deferred until the corpus exists (card text) — do not build
     topologies; record that decision in comms.

  Deploy (scenario install lands via the normal ada-pi deploy) needs
  Tony's approval — do NOT deploy; finish with a note.
