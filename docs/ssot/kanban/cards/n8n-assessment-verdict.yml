id: n8n-assessment-verdict
title: 'Decision record: n8n rejected as monitoring/control panel — use board-diagram + board-api'
column: done
updated: 2026-11-14 14:15
brief: 'Tony asked to assess n8n (2026-11-09) as monitoring/control panel for Adobe Stock generation with project
  lane diagrams. Verdict: do not adopt.'
priority: low
tags:
- decision
- n8n
- board
spec: 'Rationale (verified 2026-11-09): n8n canvas is a workflow editor, not a project/lane diagram; custom UI requires
  forking the editor build or a separate frontend calling its Public API anyway; its native monitoring is weak (community
  builds Grafana/custom dashboards); it would duplicate the existing orchestration plane (board-api write door,
  kanban-commit/dispatch timers, publication layer, system-report). Chosen path: /apps/board-diagram lane view over
  cards.json + board-api /action for control — see card board-diagram-lanes-view. Revisit n8n only if drag-drop
  automation glue to external SaaS is needed.'
ref: KNB-1308
