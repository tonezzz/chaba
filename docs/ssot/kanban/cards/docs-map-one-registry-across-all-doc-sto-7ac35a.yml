spec: 'Produce docs/ssot/infrastructure/ssot.docs-map.yml as the single registry answering "where does each doc
  type live?" across repo/gdrive/wiki/mddb/wp.


  Scope/stores (minimum):

  - docs/kb: procedures/runbooks (canonical repo KB)

  - docs/ssot: machine state / SSOT YAML

  - docs/reports: reports and assessments

  - gdrive:ada-nest: packs/datasets/projects/reports/queue

  - MDDB collections: semantic mirror/search surfaces

  - MediaWiki namespaces: Education/Reports/News/Infrastructure/PrivateNews

  - WP: member surface + frozen lesson archive + ledgers


  For each store record: owner, canonical path/prefix/URI pattern, content type, write/update path, authority/volatility,
  lookup recipe, and notes/gaps. Extend or cross-reference Wiki:Wiki-Hierarchy pattern; do not migrate content.


  Deliverables: ssot.docs-map.yml + SSOT index/procedure cross-reference as appropriate + small validation/check
  entrypoint (or documented check command).

  Verify: registry exists, covers all named stores, and lookup recipes are concrete. Target host: idc02 (runner
  drift cleared).'
