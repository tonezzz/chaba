spec: '~30-60min. 1) Install Zed (flatpak or zed.dev install script). 2) In Zed settings, configure an external
  ACP agent pointing at opencode. 3) Open a repo in Zed, send the agent an o2-style YAML chore. Accept when: agent
  panel responds and edits files via opencode+LiteLLM.'
note: Needs LITELLM_KEY env for opencode (already in ~/.config/secrets/litellm-chaba.env). Part of OPS-0792.
