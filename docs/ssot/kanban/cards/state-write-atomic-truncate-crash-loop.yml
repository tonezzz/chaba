spec: Fix non-atomic state writes across affected services to prevent 0-byte state files and subsequent
  crash loops. Modify state-saving logic to write to a temporary file (STATE.tmp) and atomically replace
  the target state file upon completion. Target services and files include chaba-nag.json, wp-timeline-state.json
  (line-chat-timeline), and rika-wx-alert/state.json on idc03. The done-condition is verified when state
  writes use atomic replacement and services successfully load state files without JSON decode errors.
