comms:
- at: 2026-11-14 09:52
  from: devin
  text: 'tony-macbook (100.77.76.112) is unreachable — tailscale ping + ssh :22/:2222 all timeout, beacon silent
    ~26h. Its installed ~/.local/share/device-telemetry/agent.py predates the mddb-ops split and still writes :11023,
    so even when it wakes the HA hosts-view entities will stay stale. When reachable: cd ~/CascadeProjects/chaba
    && git pull && cp scripts/device-telemetry/agent.py ~/.local/share/device-telemetry/agent.py (repo now defaults
    :11026).'
