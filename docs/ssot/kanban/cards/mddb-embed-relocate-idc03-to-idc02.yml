spec: 'idc03 runs the whole mddb fleet on 4 cores (load ~8): mddb-embed alone ~60% CPU. idc02 sits at load 1.4 /
  7-of-15G / 171G free and already hosts the mddb follower + mddb-ops. Move the mddb-embed container/unit to idc02,
