  text: card captured via board-api
- at: 2026-11-12 14:30
  from: devin
  text: 'Done 2026-11-12. mddb-embed quadlet + 2.8G DB relocated idc03→idc02 (localhost/mddb:2.15.4-breaker image
    copied; data tar''d via podman unshare, byte-exact). Live at http://100.123.163.11:11028 — /v1/health 200, vector-stats
    intact (ada-cms-pages 1216/1252 embedded), POST /v1/search returns 50 results; embed calls still route to embed-pool-shim
