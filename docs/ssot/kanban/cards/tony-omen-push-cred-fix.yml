spec: 'tony-omen cannot push to github.com/tonezzz/chaba: `gh auth status` reports the stored token invalid, and
  no SSH key is registered for git@github.com (credential.helper is gh-only). Verified 2026-11-07 while landing
  7b5f86014 — worked around via ssh tony-dell + `git push origin FETCH_HEAD:master`. Fix options (Tony decision,
  needs his GitHub identity): (a) `gh auth login -h github.com` on tony-omen — quickest, matches the existing credential.helper;
  (b) mint a per-host repo deploy key + SSH remote/insteadOf — matches the deploy-key-per-host pattern other satellites
  use; (c) accept the gap and document ssh-via-dell/patch-relay as the permanent path. Until fixed, dispatch tasks
  requiring push:chaba must not route to tony-omen.'
action:
  type: manual
  status: done
ref: OPS-1080
