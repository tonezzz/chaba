id: adobe-stock-inpaint-defect-repair
title: Inpaint-based defect repair lane for stock candidates
column: doing
updated: 2026-11-08 15:29
brief: Mask-repair localized QC defects instead of full re-rolls.
priority: high
program: adobe-stock
tags:
- adobe-stock
- inpainting
