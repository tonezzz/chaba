id: persona-photo-store
title: Persona photo/asset store — bank doc with fetchable URL + tool returning it to relay images
column: backlog
updated: 2026-10-11 18:00
priority: medium
spec: 'Personas cannot hold or reshow photos: bank docs are text-only and no tool returns a stored image URL to
  the relay _image_msgs path (relay re-hosts any fetchable URL publicly, verified working). Needed: (1) storage
  — a served dir on idc03 (or object store) holding persona assets, referenced by URL in bank docs (meta.image_url);
  (2) a memory-search/tool path that surfaces the URL in results so the backend includes it in tool_result images;
  (3) ingestion — a way to save an in-group LINE image as a persona asset (relay downloads via message content API
  -> asset dir -> bank doc). Driver: kaewta reshowing kk car photo on request.'
note: Companion to line-proactive-persona (OPS-0468). LINE inbound images already reach the relay as image turns
  — persisting them is the missing piece.
ref: OPS-0470
