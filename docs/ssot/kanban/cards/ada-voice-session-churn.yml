- at: 2026-10-10 09:05
  from: devin
  text: 'Root cause found + fixed (not deployed): the context-budget rotate fired on turn BILLING — each blocking
    tool round re-bills the whole window, so a healthy ~26k context billed ~52k on tool turns, tripping the 45k
    budget ~1/min. Rotate cleared the resumption handle -> close() -> fresh reconnect -> cold prime -> re-greet/amnesia.
    Fix: normalize billed input by continuation passes for the budget check; non-resumed provider reconnects now
    prime with the live transcript tail + a no-greet flicker dire'
