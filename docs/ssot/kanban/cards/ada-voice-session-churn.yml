id: ada-voice-session-churn
title: Ada voice sessions churn ~1/min — disconnects, re-greeting, memory loss between sessions
kind: bug
priority: high
column: review
autonomy: t2
brief: 'Tony complaint (67b02417a8): "สายมันตัดตลอด ต้องเริ่มคุยใหม่ Ada ก็ลืม". Journal: 52 session start/end/resume
  events in 46min (15:00–15:46). Repeated mid-conversation "สวัสดีครับ Tony" greetings = fresh sessions with cold
  context. Also ada_session_recall returned a multi-day-stale UPS topic as "ล่าสุด" — recency ranking wrong. Two
  sub-bugs: (1) whatever drops the ws every ~2min, (2) recall needs recency-weighted "latest" not just relevance.'
created: '2026-10-09'
updated: 2026-10-10 11:48
comms:
- at: 2026-10-10 16:30
  from: devin
  text: >
    Root-cause trace (audit window 10-09→10-10): churn episodes are driven by
    ws keepalive timeout on the video path — 'camera frame send failed: sent
    1011 keepalive ping timeout; no close frame received' (caller=admin,
    video=high). ~40-60s after Gemini Live connects, the client stops
    answering pings -> session dies -> reconnect -> fresh greeting (the
    ha-f52670c6 greeting-every-5min loop in transcript fd210c4fbe). Not a
    quota/429 issue despite idc03 spend-warn. Suggest: ws ping keepalive
    hardening on video=high sessions or camera frame batching so the event
    loop isn't starved.
- at: 2026-10-09 16:05
  from: devin
