id: cline-chaba-admin-tab
title: Add a secure Cline tab to Chaba Admin
column: backlog
updated: 2026-10-28 23:11
brief: Add Cline Kanban after the Board tab without a second browser key prompt; reuse Cloudflare Access SSO through
  a server-side, tailnet-only proxy. Confirm the correct HA instance before mutating the dashboard.
blocked_by: cline-kanban-nest-worker-adapter
tags:
- cline
- home-assistant
- security
spec: 'Goal: add a Cline view immediately after Board in the chaba-admin Lovelace dashboard, with a full-page iframe,
  no credential in the URL/browser, and the existing Cloudflare Access login experience.


  Verified patterns: the SSOT full_page_iframe convention uses a panel view with one iframe card; live tony-ha Board
  points to https://tony-ha.surf-thailand.com/apps/board/index.html?v=6 and has no key query (only cache-buster).
  The chaba-admin dashboard is require_admin and SSOT records it on tony-ha. The supplied ada-ha URL reaches a different
  HA instance (ada-ha edge -> tony-omen:8125), while tony-ha is tony-omen:8123; confirm which dashboard to change.
  The CMS iframe tabs do use api_key query, but that is a read-only legacy pattern marked for retirement and must
  not be copied.


  Recommended design: add a Cline panel iframe to the confirmed dashboard, pointing at a root-path Cline hostname
  behind the same Cloudflare Access identity/policy; keep Cline''s con01 upstream Tailnet-only. The edge proxy should
  authorize the Cline operator group and inject the Cline proxy credential server-side; the browser must never hold
  the credential. Restrict the tab to the operator/admin identity because Cline exposes terminal/code execution,
  stronger than Board access. Keep the disposable workspace, no production repositories/provider secrets, and auto-commit/PR
  disabled.


  Options: (A) dedicated root-path hostname + panel iframe (recommended; reliable root API/WebSocket paths, needs
  DNS/Caddy/Access route); (B) same-host subpath (best-looking URL, but Cline v0.1.70 has no verified UI base-path
  setting and expects root API/WS paths; current proxy uses exact Host/Origin, so prefix stripping/rewrite must
  be proven first); (C) direct Tailnet link (smallest change, but requires Tailscale and separate passcode). Never
  put a service key in an iframe URL or client JS.


  Standard procedure deliverable: extend the existing ssot.home-assistant.dashboards.yml full_page_iframe convention
  with an embedded-app security gate (capability tier, SSO policy, no browser-visible keys, private upstream, origin/CSP/WebSocket
  checks, audit/rollback); add/update the route/service declarations; apply storage-mode dashboard changes through
  push-dashboard.py WebSocket, then sync-ssot-from-live.sh; never edit .storage directly. Verify authorized SSO
  load with no key prompt, unauthorized denial, CSP/frame behavior, WebSocket 101, no secret in URL/DOM/network
  logs, mobile layout, and rollback.


  Dependency: PR #45 must merge/deploy the split Cline proxy before this tab can be used.'
ref: HOM-0957
