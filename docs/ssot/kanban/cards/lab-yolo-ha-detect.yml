  AND CUDA on the GTX1650 — measure p50/p95 inference latency and correct-class rate vs labels. Metric to beat:
  p50 < 800ms, >=70% correct-class. Post the scorecard + verdict (promote to cms-auto-cctv-* or reject) to card
  comms.'
