spec: 'Scope (Tony approved option A, 2026-11-25): explore Ansible+Kanban possibilities and apply where fit, starting
  read-only. Phase 0: inventory 19 ansible playbooks, map to kanban/ops card classes, define board-api idempotent
  reporting contract (no direct card YAML writes), produce gap report. Phase 1 pilots: (A) extend one existing read-only
  audit (runner-tools or runner-tools-sync) to emit deduped board-api card/comment on drift/no-drift; (B) new read-only
  stale-checkout diagnosis playbook that files/updates a decision card with options (no remediation); (C) reusable
  verify-evidence helper task pattern for attaching command/report evidence to a card. Constraints: board-api is
  only write door; --check/--diff real where applicable; no host mutations; no secrets in logs; work in chaba worktree;
  idempotent reruns. Gates: rerun dedupe verified, read-only behavior verified, report/evidence attached.'
