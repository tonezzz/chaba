id: ai-engine-lines
title: AI engine lines — personas as versioned engines (Ada2, other AI lines)
column: doing
updated: 2026-11-14 14:15
priority: low
spec: 'Tony (2026-10-11): think of Ada as an ENGINE, not a single persona — release Ada2 engine, or entirely other
  AI engine lines, like sci-fi AI product families. Each lane/persona (ada-ha, tony-ha/chaba, kk-ha, future ones)
  is an engine instance; engines are versioned and swappable behind the same lane contract (WS backend + caller
  keys + tier policy). Directions: (1) Ada2 = next-gen Ada engine with new model/components; (2) distinct engine
  LINES with different internals (home/voice engine, ops/docs engine for chaba, ...); (3) engine release = lane
  config swap, not new infrastructure. Lands after line-multihome-group proves per-lane isolated backends.'
note: Vision card — capture only until the multihome mention-router proves isolated per-lane backends; then the
  engine=lane contract can be formalized.
ref: OPS-0466
