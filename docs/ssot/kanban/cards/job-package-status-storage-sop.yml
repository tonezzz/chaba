spec: 'Write the SOP doc for job-package status lifecycle + storage. REAL FACTS to use (do not invent): nest_job
  CPT status enum = {queued, claimed, running, done, failed, stalled, cancelled}; writes go through board-api POST
  /job {slug, status, kind, host, pack, runner, result_ref, error} which upserts one WP post per slug (meta keys:
  JOB_META_KEYS = kind/status/host/pack/runner/result_ref/error/updated/event_id); publication.py fans out progress|milestone|alert
  events to the nest_job adapter for live execution state; card layer kanban column is separate (backlog/doing/review/done)
  and owned by humans. Cover: lifecycle transitions, who writes status (queue-mgr, pack runner, close_out), where
  state is mirrored (WP nest_job vs kanban column vs PublicationEvent), and artifact/result_ref storage convention.'
ref: OPS-0922
