id: job-package-status-storage-sop
title: Define job package status lifecycle and storage standard
column: backlog
updated: 2026-10-29 22:07
spec: Integrate the existing Colab pack contract, nest_job lifecycle, PublicationEvent, Kanban workflow, and artifact
  storage into one operator SOP. Clarify exact status transitions and source-of-truth locations; distinguish plan/project/approval
  status from runtime job status and pack markers. Update existing docs/kb/colab-mcp-jobs.md and the colab-mcp entry
  in docs/ssot/ssot.procedures.yml; add a job-lifecycle SSOT record. Define a private project artifact root at gdrive:ada-nest/projects/<project-slug>/
  with source, ingest, brief, story, shots, assets, packs, renders, qc subfolders, and register the Sacred Father
  project's current planning/preview state without pretending a Colab pack or clip exists. No GPU jobs, paid calls,
  public publishing, or permission changes.
ref: OPS-0922
