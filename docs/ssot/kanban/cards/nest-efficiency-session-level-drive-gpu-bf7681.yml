brief: 'Measure whether the Drive-store improvements (ADA-0806, 10-23/24) actually pay. Parses queue/run-*.out.log
  + done markers + heartbeat to emit per-session metrics: wall_min, gpu_min (from gpu% in DONE lines), idle_min,
  packs_done, failures, cold_start_min, and estimated $/pack.'
