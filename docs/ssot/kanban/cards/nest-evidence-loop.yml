id: nest-evidence-loop
title: Evidence loop — every finding lands as a discussable CMS page
brief: 'Tony (2026-10-08): evidence is everything — every answer, bench
  result, and research finding must land as a CMS report page per
  cms-page-standard, discussable with Ada and assessable by Devin,
  automatically. Governance map + loop structure in
  docs/kb/nest-asher-polity-inspiration.md.'
column: doing
priority: high
created: 2026-10-08
note: 'Existing pieces: bench-orch and nest-bench already auto-write CMS
  pages; report-watch -> Ada triage brief -> Tony direction -> dispatch is
  wired. GAPS to build: (1) polity-research page — research findings
  currently live only in git docs invisible to Ada; page seeded manually
  2026-10-08, needs a writer (sync from the inspiration doc research log on
  change, or hook the sweep workflow). (2) nest-gate page — decision
  surface: pending promotions each with bench delta attached so Tony
  approves with numbers in view (anti-rubber-stamp / anti-Quiet-War
  mechanism). (3) politics-check page — periodic audit of accumulated
  auto-decisions: what got delegated, what drifted. (4) bench trend graphs —
  standard rule 4 requires charts in stacks/web/public/apps/reports/, tables
  alone are not enough. Cadence: producers write their own page per the
  report-graph-standard contract (own meta, stale detection via
  report-watch).'
