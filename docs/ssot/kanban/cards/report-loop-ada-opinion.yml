spec: "Design: docs/design/report-session-loop.md §3b (contract). Repo: ada-pi. Convention already declared in chaba\
  \ docs/ssot/infrastructure/ssot.ada-participation.yml (t1_comment .opinion_convention) — implement to that.\n\
  1. Instructions: add an opinion stanza wherever CMS/board instructions\n   live (realtime_provider CMS_INSTRUCTIONS\
  \ or the instructions file —\n   follow the existing pattern). Rule text in spirit: \"When Tony asks\n   your\
  \ opinion of a report/CMS page: cms_get_page it first (never\n   opine unread), find the kanban card whose report:\
  \ field equals the\n   slug via ada_board_write action=read, then ada_board_write\n   action=comment with text\
  \ starting '[opinion]' citing the slug +\n   updated ts you read. Also answer aloud — the comment is the durable\n\
  \   record. No linked card? Answer aloud and offer to file one\n   (action=create).\"\n2. ada_board_write (backend/tools.d/ada_board_write.py):\
  \ the read\n   action must expose the card `report` field so she can match — if the\n   compact read payload doesn't\
  \ carry it, add it.\n3. Matching rules: prefer the not-done card with report==slug; none ->\n   offer to file;\
  \ several open -> pick most recently updated, mention\n   the ambiguity aloud.\n4. Do NOT build a separate kanban_opinion\
  \ tool — action=comment with\n   the [opinion] prefix is the designed path (design doc §6 explains\n   why).\n\
  \nUnit tests for the matching/lookup helper. Deploy needs Tony's approval per ada-pi AGENTS.md — do NOT deploy;\
  \ finish with a note."
