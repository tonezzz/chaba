id: report-loop-ada-opinion
title: 'Report loop: Ada [opinion] path — read report, post tagged comms on the linked card'
brief: 'Part 5 of the report→session loop (umbrella: report-session-loop). Tony asks Ada aloud what she thinks of
  a report; she reads it, forms a view, and posts it to the card as a from=ada [opinion] comment a running session
  will see. Queued when Tony presses Start.'
