id: ada-memory-dev-lane-runtime
title: 'Ada memory: instances_readonly mounts + env:staging doc stamping (dev lane runtime)'
brief: 'Registry contract landed in chaba ssot.apps.ada-memory-banks.yml (card memory-lane-policy): prod banks declare
  instances_readonly {dev-instance: prod-instance} and dev-scratch carries env: staging. This is the ada-pi half
  — teach memory_banks.py to mount those banks read-only and memory_ops.py to stamp the bank''s env onto written
  docs.'
column: review
priority: medium
created: 2026-10-10
updated: 2026-10-22 19:54
program: ha-lanes
metric: A backend started with ADA_INSTANCE_ID=tony-dev loads every bank whose instances_readonly maps tony-dev
  (collections resolved as the mapped prod instance, {instance}->tony) with writable=false + allowed_tools=[]; its
  only writable bank is dev-scratch. ada_remember on a readonly-mounted bank is refused; a write to dev-scratch
  lands with meta env=[staging].
verify: 'Registry JSON rendered from current chaba SSOT. With ADA_INSTANCE_ID=tony-dev: GET /api/memory/banks lists
  prod banks readonly + dev-scratch writable; ada_remember(bank=general) refused, ada_remember(bank=dev-scratch)
  succeeds and the MDDB doc carries meta.env=staging. ADA_INSTANCE_ID=tony regression: all banks writable per spec,
  no env field stamped on prod writes.'
spec: "Contract (already in chaba docs/ssot/apps/ssot.apps.ada-memory-banks.yml —\nrendered verbatim into ~/.config/ada/memory-banks.json):\n\
  \n  banks.<name>.instances_readonly: {tony-dev: tony, ada-dev: tony}\n    map dev-instance -> prod instance whose\
  \ view it mirrors.\n  banks.dev-scratch.env: staging\n    bank-level provenance marker; doc meta `env` is now\
  \ in the schema\n    (ssot.apps.ada-memory-schema.yml, enum [prod, staging]).\n\nbackend/memory_banks.py (~10\
  \ lines):\n- MemoryBank: add `readonly: bool = False`, `env: str | None = None`,\n  and `read_as: str | None =\
  \ None` (for /api/memory/banks clarity).\n- _add(): before the instances check compute\n    ro_map = spec.get(\"\
  instances_readonly\") or {}\n    read_as = ro_map.get(self.instance) if isinstance(ro_map, dict) else None\n \
  \ keep the bank when self.instance in instances OR read_as; expand\n  {instance} with (read_as or self.instance);\
  \ when read_as, force\n  writable=False and allowed_tools=[]. The multi-instance scope=instance\n  guard must\
  \ still evaluate spec[\"instances\"], not readonly mounts.\n- Nothing else changes: person_policies, control_policies,\
  \ fail-fast,\n  and bank()/banks_for_person() work untouched — readonly banks flow\n  through the existing writable\
  \ gate, so ada_remember/ada_forget are\n  refused by the current writable check. Make the refusal message say\n\
  \  the bank is read-only-mounted and name dev-scratch as the write lane\n  when the instance has it assigned.\n\
  backend/memory_ops.py (~3 lines):\n- memory_meta(): `if bank.env: meta[\"env\"] = [bank.env]` — prod banks\n \
  \ have no env marker, so prod docs stay field-free.\nEdge cases to cover in tests (tests/test_memory_banks.py):\n\
  - tony-dev sees the same bank set tony sees, all readonly; personal\n  resolves ada-ha-bank-personal-tony (mapped\
  \ expansion, NOT -tony-dev).\n- dev instance (ada-dev.service) sees ONLY dev-scratch — no\n  instances_readonly\
  \ entries map `dev`, so its isolation is unchanged.\n- person.kk on a tony-dev backend: personal-kk is kk-instance-only\
  \ so\n  it is not mounted; her allow-list still intersects correctly and\n  dev-scratch (now in restricted allow\
  \ lists) is her sole writable bank.\n- unknown fields in spec must not break older/world registries.\nDeploy:\
  \ render-memory-banks.py --host idc03 then restart ada-dev +\nada-ha-* — deploy needs explicit approval, do not\
  \ auto-restart prod."
