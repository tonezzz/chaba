id: ada-lazy-tool-schemas
title: Lazy tool schemas — declare name+blurb only, fetch schema on demand
column: done
updated: 2026-10-14 08:27
priority: medium
spec: "Pattern from tool-attention (arxiv 2604.21816) + vercel/ai lazy-tool PR + Cursor dynamic context discovery\
  \ (46.9% A/B reduction): ship each declaration as {name, <=300-char blurb, EMPTY params schema}; tool_runner validates\
  \ args against the real schema server-side and returns the existing tool_guide.yml usage hint on miss — the repair-feedback\
  \ path already exists. Est cut: the schema JSON of ~49 decls is a large share of the 27.8k floor; name+blurb-only\
  \ could drop floor to ~10-15k.\nRisks to measure: more first-call arg errors while the model guesses shapes (watch\
  \ audit-fail card rate); keep full schemas for the top-10 hot tools (set_facial_expression 17k calls/7d, memory_search,\
  \ cms_read).\nVerify: context_growth.yaml ceiling+floor; compare first-turn in= before/after; count arg-error\
  \ rate delta over 24h.\n\nPromoted 2026-10-13. Concrete plan:\n1. Declared-surface split: full JSON schema retained\
  \ for hot tools only\n   (set_facial_expression, memory_search, cms_read, control_entity,\n   calendar_read, cast_to_screen,\
  \ cctv_wall, docs, kanban, chat_send);\n   all other decls ship {name, blurb, {type:object, properties:{}}}.\n\
  2. tool_runner validates args against the real schema on every call;\n   miss -> return tool_guide.yml usage hint\
  \ as the tool result so the\n   model self-repairs (path already exists). No new retry machinery.\n3. Deploy via\
  \ deploy-ada.sh (gates: tool-lint + pytest) then restart\n   ada-ha-tony.\nBenchmark (the real number, record\
  \ in comms):\n- first-turn in= on a fresh ada-ha-tony session BEFORE deploy\n  (baseline ~27.8k, from 18:25 restart\
  \ journal) and AFTER.\n- trip scenario e2e: 'Call trip_calendar with slug smoke-nonexistent-trip\n  and dates\
  \ 2030-01-01 to 2030-01-03' must still call with correct args.\n- context_growth.yaml must pass (55k ceiling +\
  \ recall floor).\n- report arg-error/retry count on first cold-tool call vs today."
note: Post-OPS-0583 measured floor is ~27.8k/turn on ada-ha-tony; decl count is no longer the driver — param JSON
  schemas are. Research-backed fix.
ref: ADA-0586
