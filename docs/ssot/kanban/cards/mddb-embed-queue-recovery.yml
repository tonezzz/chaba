note: '2026-10-05 11:40-11:55 UTC: mddb embedding queue saturated at 4000-deep; WARN logs show droppedTotal=3135
  and climbing — each "embedding queue full, dropping job" means that document has NO vector until reindexed. Same
  window: /v1/vector-search returned 400/503, Ada''s memory search ran degraded:true, and devin_answer/cms_publish_page
  writes failed. Queue is via gemini-ollama-proxy (OpenRouter gemini-embedding-2, ~1 req/s drain rate). Recovery:
  bulk-reindex docs lacking vectors; Prevention: alert when queueSize > ~500 or droppedTotal grows.'
