spec: 'Goal: Implement per-card backoff and a live retry cap in the dispatch loop on tony-omen to prevent worktree
  floods like the ~130 accumulated on Nov 8-9 for cards such as timer-log-shipper-severe and ada-proactive-digest-morning-b.
  Host/repo: tony-omen, chaba. Constraints: Prevent rapid continuous re-dispatching of failed cards without backoff
  and deduplication. Testable done-condition: The dispatch loop enforces backoff and retry limits on failed cards,
  verified via automated test or dry-run inspection ensuring failing cards are not re-spawned every 15-30 minutes.'
