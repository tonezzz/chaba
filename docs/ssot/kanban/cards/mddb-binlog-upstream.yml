id: mddb-binlog-upstream
title: Upstream binlog-retention + replication fixes to tradik/mddb
column: backlog
note: 'Patch lives only on mddb-fork — a stock image bump would lose it. Now 4 commits on binlog-retention: 598c57d janitor,
  bfb3b7c stream Rotate, dc88ede snapshot-below-oldest (incl LSN 0), 0b46e57 Recv-side FailedPrecondition -> snapshot. All
  proven on idc01+tony-dell.'
help: 'The last two are upstream-worthy bugs independent of retention: (a) ScanFrom''s too-old guard skipped fromLSN==0 so
  fresh followers replayed the entire retained log instead of snapshotting; (b) the client''s snapshot fallback only checked
  the dial error while gRPC delivers rejections via Recv — followers looped on ''stream recv error'' forever.'
updated: 2026-10-04 19:48
comms:
- at: 2026-10-04 19:11
  from: devin
  text: 'NEW upstream-worthy bug found while triaging the canary breach — snapshot-replace verify creates a doom loop: (1)
    follower LSN too old → requests ~4GB snapshot; (2) replace runs bbolt tx.Check() on the tmp file — on tony-dell this does
    not finish inside MDDB_VERIFY_TIMEOUT=6h; (3) timeout aborts the replace, follower still too old → requests ANOTHER snapshot;
    (4) meanwhile leader keepLSN stays pinned at binlog_oldest_lsn (janitor logs: nothing trimmable), so binlog grows ~500MB/cycle
    — breach wa'
- at: 2026-10-04 19:34
  from: devin
  text: 'Refinement: the 6h verify is not purely an algorithm problem — tony-dell disk is at ~97% util with load ~11 (parallel
    agent sessions running find/grep over ~ + Devin desktop + HA all competing). O(db) page walks that should take tens of
    minutes degrade to hours under this contention. So upstream fix needs BOTH: (a) bounded/skippable verify for stream snapshots,
    (b) the open path itself is O(db) NoFreelistSync — consider persisting freelist in snapshots so followers open fast. Local
    lesson: agent'
- at: 2026-10-04 19:48
  from: devin
  text: 'Deeper diagnosis via SIGQUIT goroutine dump: the doom loop is worse than verify — EVERY open of a snapshot db runs
    DB.freepages→recursivelyCheckBucket→checkInvariantProperties (full O(pages) invariant check), because leader writes snapshots
    with NoFreelistSync so no freelist is persisted. That is the same cost as tx.Check() — explains both the 6h verify timeouts
    AND why follower restarts each take ~1h+ under disk contention. Follower-side fix applied: MDDB_FREELIST_SYNC=true on
    tony-dell mddb.se'
action:
  type: devin-dispatch
  repo: mddb-fork
  status: idle
  task: 'Implement the replication snapshot-loop fixes documented in this card''s comms, on top of the 4 existing binlog-retention
    commits (598c57d..0b46e57, branch feat/vector-algorithms):

    1. Persist the freelist in leader snapshots (ship the freelist pages in the snapshot stream) so followers don''t rebuild
    it via the O(pages) freepages->checkInvariantProperties walk on every open.

    2. Default MDDB_FREELIST_SYNC=true for read-only replicas (MDDB_MODE=ro followers).

    3. Snapshot-replace verify: reuse the fast-open path or skip tx.Check() for trusted stream snapshots (MDDB_VERIFY_TIMEOUT=6h
    insufficient for ~4GB dbs under disk contention).

    4. Progress logging during the freelist/integrity walk (it is currently silent for ~1h).

    5. /v1/replication/status ''healthy'' must reflect replication state: report unhealthy/lagging when follower current_lsn==0
    or when lagging beyond a threshold — it currently reports healthy:true at LSN 0.

    Write Go tests for each change. Keep commits separate and conventional. Do NOT push to origin (tradik/mddb upstream) —
    local commits only; the card will handle PR prep.'
