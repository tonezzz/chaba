id: board-api-lock-convoy-cross-checkout
title: 'board-api write convoy: shared /tmp locks across checkouts + lock-ordering stall'
column: done
updated: 2026-11-17 18:24
priority: medium
tags:
- board-api
- infra
- locks
- idc03
spec: 'Observed live 2026-11-17 17:01-17:10 +07: all board-api writes stalled ~9min. Chain: (1) exec checkout ~/CascadeProjects/chaba
  chaba-repo-sync -> git-safe-pull.sh held /tmp/board-render.lock for minutes; (2) a board-api thread held /tmp/board-api.lock
  while waiting on board-render.lock (AB-BA vs render workers that take api.lock inside render); (3) ~30 write requests
  queued incl. deploy-preflight.py, board-render-guard.py, kanban-dispatch.py — all sharing the SAME /tmp/board-api.lock
  path regardless of which checkout/repo they serve. Lock files are global per-path, not per-repo: the exec checkout''s
  safe-pull/reconcile contends with the served checkout''s API. Reconcile has a 60s bounded wait then proceeds anyway
  — meaning it then writes card files in ITS checkout while board-api writes in the served one (probably fine, different
  trees, but the flag_via_api calls fail). Also observed: kanban-commit.service FAILED at 17:06 (pull needs manual
  resolution) leaving served checkout ahead 91 / behind 1 — likely pull raced a board-api _commit_write git op on
  index.lock. Follow-ups: (a) namespace locks per checkout (e.g. /tmp/board-api-<repo>.lock or flock on a repo-local
  file) or make safe-pull/reconcile use a distinct lock; (b) fix lock ordering — never hold board-api.lock while
  acquiring board-render.lock; (c) verify next kanban-commit tick rebases the 91 commits cleanly (merge-tree showed
  0 conflicts vs the 1 incoming commit touching runner-auto-*.yml).'
ref: SYS-0160
