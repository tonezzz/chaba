spec: 'LINE Messaging API monthly push limit is depleted — ~30 quota-blocked events in 48h (429 ''You have reached
  your monthly limit'') hitting pushes to tony DM (U7efe5dde785e89fc998de234dfbe3d90), nhong, kk, and group C822026077530a29620b5041bd1a955c5.
  Relay parks blocked msgs and flushes on next inbound, so nothing is lost — but ALL proactive pushes (digests,
  board notify, wallet-watch alerts, request-sweep pings) are starved. This directly gates KNB-0691''s per-member
  LINE digest component — a digest that can''t push is dead on arrival.


  DISPATCH SCOPE (backend/line_relay.py in ada-voice repo on idc03 + callers):

  1. Push-source census: journalctl ada-line-relay 30d -> count push attempts by source/recipient; identify what
  spends the monthly quota (notification loops? digests? per-event pushers?). Report top spenders.

  2. Policy fix in relay: classify pushes urgent|bulk. Urgent (safety/security/user-requested) pushes always attempt;
  bulk (digests, rollups, newsletters) piggyback on reply tokens or hold for next inbound window. Optionally collapse
  hourly/daily bulk pushes into one bundled message.

  3. Quota visibility: log remaining quota header if LINE exposes it (X-Line-Request-Id / quota headers), else estimate
  counter persisted across restarts; add ''quota depleted'' alert path that does NOT itself push (board comms /
  SSOT event instead).

  4. Document the plan-tier facts in SSOT: which plan the ชบา bot is on, monthly cap, when it resets — so the decision
  to upgrade is data-backed.


  OUT OF SCOPE: billing/plan changes (Tony''s call), second-channel fallback (separate card if wanted), relay-img
  transient miss spam (by-design transient keys — note only).


  VERIFY: census table posted on the card; policy change unit-tested in repo suite; no regression to reply-path
  delivery.'
