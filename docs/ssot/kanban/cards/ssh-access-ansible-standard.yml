id: ssh-access-ansible-standard
title: Standardize host SSH access with Ansible
column: done
updated: 2026-11-25 16:49
brief: 'Inventory is the declared SSH contract, but ~/.ssh/config and known_hosts are still hand-maintained per
  controller and push creds are discovered at claim time. Layered fix: declare -> generate -> verify -> bootstrap,
  with read-only verification first.'
priority: medium
tags:
- ops,ssh,ansible,host-access
spec: 'GOAL: one declared SSH access contract per host + generated, verifiable controller config. End the hand-mirrored
  ~/.ssh/config vs inventory drift and the recurring runner-push-cred-gap discovery.


  CURRENT STATE (verified 2026-11-24):

  - ansible.cfg: host_key_checking=True (keep), become=True; inventory ansible_host = Tailscale IP, ansible_user=tony,
  mirrors ~/.ssh/config by hand — README says "mirror" but nothing enforces it.

  - ~/.ssh/config: per-host stanzas for idc02/idc03/tony-dell/tony-omen (id_ed25519) + purpose keys (github-*, camwall-push,
  id_ed25519_opencode). kk-mac uses user kkkakk; key seeding still partial, pending KK sign-off.

  - known_hosts seed = manual ssh-keyscan snippet in ansible/README.md + docs/kb/new-host-onboarding.md §2; every
  new controller repeats by hand.

  - Push creds are still claim-time discovery (runner-push-cred-gap / ADA-0673); onboarding §5 asks for git push
  --dry-run per repo but no gate enforces it.


  PROPOSAL (layered; each slice independently useful):

  1. DECLARE: ssh_* vars in inventory (user, port, identity-file alias, network=tunnel|lan, enabled); ansible_*
  derived from them. ssot.host-roles.yml / ssot.audit.hosts.yml stay the upstream facts — do not duplicate.

  2. GENERATE: controller-local task renders ~/.ssh/config stanzas from inventory (delegate_to localhost); purpose-scoped
  stanzas live in a separate preserved block. No private key material in Ansible/git — identity paths only.

  3. VERIFY: read-only ssh-mesh-verify.yml — BatchMode ping, authorized_keys fingerprint present, git push --dry-run
  where push:<repo> declared; exit nonzero on drift. Same producer+consumer proof pattern as ada-ocb-verify.yml.

  4. BOOTSTRAP: ssh-bootstrap.yml seeds known_hosts for a new controller (all enabled inventory IPs, hashed) + renders
  config; keep host_key_checking=True, never StrictHostKeyChecking=no. Fold onboarding §2 into it; Tony-gated steps
  remain a card request.

  5. GUARDRAILS: !disabled limit encoded (idc01 never targeted); LAN aliases only as *-lan stanzas; self via ansible_connection=local
  (reuse disk-headroom.yml self-detect); kk-mac explicit host_vars override, no normalization before KK sign-off.


  DONE: ssh-mesh-verify.yml green on all enabled hosts from >=2 controllers; generated config byte-identical; new-controller
  bootstrap exercised once; no secrets in Ansible/git.


  SCOPE: open — see request on this card.'
ref: SYS-0032
