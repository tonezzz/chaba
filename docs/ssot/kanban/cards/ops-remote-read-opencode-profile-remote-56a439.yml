spec: 'OPS-1021 exposed the gap: ops-readonly''s held-out verifier pins artifact.host==runner host, so remote-target
  diagnosis can never pass. Needed: a sibling profile (task_classes read_only/report) where the agent collects remote
  facts via the mcp_debug allowlist (ssh surface) and the verifier checks declared required_fields + mcp usage evidence
