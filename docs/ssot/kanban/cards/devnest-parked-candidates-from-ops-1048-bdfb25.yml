spec: 'Two verified-but-parked candidates from the OPS-1048 spike, kept so they are not lost.


  1) Antigravity CLI (agy): consumer Pro/Ultra moved off gemini-cli 2026-06-18. agy -p headless works (OAuth once,
  file creds in ~/.gemini/antigravity-cli, container-safe). Quota = shared 5h+weekly windows with the IDE; headless
  cold-start burns 2.5-7x more (no prompt cache). Verdict: opportunistic free lane only, behind Jules. Revisit only
  if Jules quota proves insufficient or agy adds API-key auth.

  2) AI Studio eval lane: subscription quota applies to Studio UI only — use it for model-selection/bench arms interactively,
  then productionize winners through LiteLLM keys. Zero code; add a short howto to docs/kb so evals stop burning
  paid keys for desk research.


  Done: either a card per item when adopted, or this card closed with the docs/kb howto for (2) written.'
note: Parked options — not yet adopted lanes.
ref: OPS-1067
