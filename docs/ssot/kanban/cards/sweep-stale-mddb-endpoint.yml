id: sweep-stale-mddb-endpoint
title: Sweep stale mddb endpoint 100.74.146.0 (dead since idc01 retirement)
brief: 2026-10-09 host audit exposed fleet-wide references to mddb
  http://100.74.146.0:11023 — idc01's old address, dead since the Oct-05
  migration to idc03 (100.102.134.91:11023, verified serving). Live defaults
  in bridge.py and doc_archive.py still point at it; ssot.services.yml and
  ssot.values.yml record it as current. doc-mirror.service timing out at
  10min on idc03 is very likely this — doc_archive.py retries a dead
  endpoint until TimeoutStartSec kills it. mn01-canary had the same stale
  URL (fixed 2026-10-09 — canary now green).
column: backlog
review_kind: verify
priority: high
kind: bugfix
created: '2026-10-09'
tags:
- mddb
- idc01-retirement
