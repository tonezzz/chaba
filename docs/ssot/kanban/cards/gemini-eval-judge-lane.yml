spec: "CONTEXT\n- GCP Console quota capture 2026-11-26 (project gen-lang-client-0694401188):\n  Gemini API \"Request
  limit per model per day for a project in the paid tier 2\"\n  for gemini-3.5-flash-lite = 350,000, current usage
  1. gemini-3.8-live and\n  gemini-3.8-live-extended-thinking are Unlimited with 25 / 31 requests.\n- OPS-1255 S1
  run 2 failed only because or-free-nemotron-ultra had no litellm\n  fallback and OpenRouter free tier returned
  429 free-models-per-day-high-balance.\n  Tony's decision: requalify the SAME nemotron canary after quota reset
  — do not\n  switch its model. This card does NOT touch that canary, its verifier, or the\n  or-free-* group.\n\nROUTING
  (stacks/idc03/litellm/config.yaml)\n1. Add a new model_name `eval-judge` mirroring the existing paid gemini-3.5-flash-lite\n
  \  entry: litellm_params.model = gemini/gemini-3.5-flash-lite,\n   api_key = os.environ/GEMINI_API_KEY_PAID (mddb-gemini.env
  on idc03).\n2. router_settings.fallbacks add:\n     eval-judge: [gemini-3.5-flash-lite, ollama-llama32-3b-kkmac,
  colab-gemma3]\n   Paid first, local last. NO `:free` and NO `or-free-*` legs — those are the\n   exact rate-limited
  path this lane exists to avoid. If all legs are down the\n   caller fails closed with a visible reason; no silent
  free-tier retry.\n3. Deploy on idc03 via the normal config sync/restart; verify with a single\n   chat completion
  through the gateway before any bulk run.\n\nKEY + CAP\n4. Mint a scoped virtual key on idc03:\n     bash scripts/litellm/mint-key.sh
  eval-judge 10 30d \"eval-judge\"\n   Append the returned sk- key to ~/.config/secrets/litellm-keys.env as\n   LITELLM_KEY_EVAL_JUDGE
  (never print or commit the value). If any service\n   pins this key in its own env file, follow the OPS-1291 dependent-sync\n
  \  pattern in mint-key.sh; otherwise document \"no dependents\".\n5. App-level daily ceiling: EVAL_JUDGE_DAILY_MAX=10000
  requests (≈3% of the\n   350,000 available), plus the virtual key's $10/30d budget. Add a small\n   ledger writer
  (extend scripts/litellm/budget-watch.py or add\n   scripts/litellm/eval-budget.py) recording {ts, task, tokens,
  spend, verdict}\n   to ~/.local/state/eval-judge/<YYYY-MM-DD>.jsonl on the caller host.\n   On cap: park the card/job
  with a visible reason on the board (gate visibility\n   rule) — no retry storm, no silent fallback to free models.\n\nADOPTION
  + VERIFIER BOUNDARY\n6. Opt in only NEW bulk eval/judge work (e.g. evals/shadow judge arm,\n   consultant-bench
  style sweeps) via LITELLM_URL + LITELLM_KEY_EVAL_JUDGE.\n   Do not repoint existing prod/chat lanes and do not
  modify\n   scripts/devnest/kk_mac_executor.py verify() or any held-out verifier:\n   model verdicts are advisory;
  the deterministic verifier remains authoritative.\n7. Update docs/ssot/infrastructure/ssot.llm-gateway.yml: add
  `eval-judge` to\n   the canonical routing table and the virtual-key section, with the quota\n   source and cap
  noted.\n\nTESTS / DONE-CONDITION\n8. Tests:\n   - unit: config asserts eval-judge fallback chain has no `:free`/`or-free-*`\n
  \    member and that paid gemini leg is first;\n   - smoke: 1 completion via the new key returns 200 and a row
  with\n     tag service=eval lands in LiteLLM_SpendLogs;\n   - 100-call bounded eval on held-out fixtures: zero
  429s, zero escalations,\n     and verdict agreement with the deterministic verifier >= current baseline;\n   -
  cap test: set EVAL_JUDGE_DAILY_MAX=2, third call is parked with a visible\n     reason and makes no provider request;\n
  \  - regression assert: OPS-1255 card, its canary job and or-free-nemotron-ultra\n     are unchanged.\n9. Outcome
  doc under docs/ssot/jobs/devnest/ with the measured spend per 100\n   verdicts and the quota delta from the Console
  capture. Card to review on\n   completion; no auto-close."
