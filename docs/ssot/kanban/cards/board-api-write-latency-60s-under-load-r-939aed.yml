id: board-api-write-latency-60s-under-load-r-939aed
title: board-api write latency >60s under load — requests queue behind serialized card commits
column: done
updated: 2026-11-14 14:10
priority: medium
blocked_by: '[''idc03-served-checkout-convergence-unbloc-0acb20'']'
tags:
- board-api
