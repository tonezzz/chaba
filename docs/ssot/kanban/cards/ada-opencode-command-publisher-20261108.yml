title: Version and safely publish OpenCode-Ada commands
column: done
updated: 2026-11-24 08:39
brief: Make the OpenCode-Ada command fix durable and callable from both Ada and Devin without arbitrary repo writes.
priority: medium
tags:
- ada
- opencode
- mcp
- git
- workflow
spec: Canonicalize the OpenCode-Ada command files in a versioned Chaba source; expose a narrow shared tool for Ada
  and Devin to preview, validate, confirm, safely commit/push, sync the allowlisted command file to idc02, and verify
  its deployed hash. Do not provide arbitrary paths or shell/git execution. Include the /ada sweep native-menu requirement.
  Measure token usage against a manual baseline; do not claim savings without data.
