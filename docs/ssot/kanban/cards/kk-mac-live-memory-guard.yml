  from: tony
  text: 'Created from the 2026-11-06 Qwen3:8B one-shot: inference passed, but the live 50% memory floor was crossed.
    Keep the lane off pending a verified memory monitor/abort path.'
- at: 2026-11-06 18:53
  from: devin
  text: 'MEM-1043 implemented on branch fix/kk-mac-memory-guard (commit 0809ead3a, worktree chaba-wt-kk-mac-memguard).


    What landed:

    - scripts/devnest/kk_mac_remote_guard.py (new): runs ON KK-Mac via `ssh kk-mac python3 -` (script on stdin,
