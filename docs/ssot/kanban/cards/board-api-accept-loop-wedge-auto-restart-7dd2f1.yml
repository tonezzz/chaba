  Thread.start()->_started.wait(); every door 503/504 until a manual systemctl --user restart). In scripts/board/board-api.py,
  make handler-thread spawn failures non-fatal and add a watchdog that detects an unresponsive accept loop and restarts
  the service automatically (or equivalent in-process recovery), with one board/comms alert. Add a regression test
