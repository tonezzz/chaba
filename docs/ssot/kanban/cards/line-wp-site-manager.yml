- at: 2026-10-14 11:40
  from: devin
  text: 'WP chat timeline shipped (2026-10-14): kk+nhong editor accounts (ids 2,3; creds in ~/.config/secrets/wp-boards-users.env
    on idc03); private page tree chat>line>kk-ha (page_id 34); timeline-block-block plugin installed+active; timeline_block
    CPT id=35 REST-driven; line-chat-timeline.py syncs LINE journal -> timelines[] idempotently (196 items, 13 media
    uploads); systemd user timer every 5min on idc03. Verified: anonymous 404, rendered timelines=196 via REST.
    Caveat: media files remain public-by-U'
- at: 2026-10-14 14:07
  from: devin
  text: 'Permalinks fixed (2026-10-14): Tony switched WP to post-name; nginx lacks rewrites so set structure to
    /index.php/%postname%/ via options-general + fixed home option h3->surf (siteurl was already surf). Now /wp/index.php/tony/
    etc. resolve 200, REST intact, generated links all on public domain, page content links migrated. wp_post tag_archive
    updated (09bdf91, deployed). Residual: ugly ?tag=/?cat= canonicals still 301 to h3 (origin-side, cosmetic).
    Pure /wp/tony/ paths still 404 until Plesk ngin'
