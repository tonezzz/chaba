id: line-wp-site-manager
title: LINE-driven WordPress site maintenance (customer via LINE chat)
column: doing
updated: 2026-10-27 14:10
brief: 'Tony''s idea: a customer maintains their WordPress site by chatting in LINE — Ada receives the message and
  drives WP REST API. Testbed: boards.surf-thailand.com -> boards.h3.gizmo-thailand.com proxy (wired 2026-10-14;
  WP itself not serving yet — Plesk default page).'
priority: medium
tags:
- cms
- line
- experiment
spec: 'P0: WP live on Plesk boards site + verify WP REST /wp-json reachable. P1: mint a WP Application Password
  (revocable, API-scoped — NOT the admin password; do not send master creds into LINE where they persist in history/Yomi
  index). P2: read-only Ada tool — list posts/pages, preview draft. P3: write ops — create/update post via LINE
  request, confirm-before-publish. Open Q: which lane (tony/ada-ha) fronts it, and does the customer get a dedicated
  group?'
ref: OPS-0640
comms:
- at: 2026-10-14 08:31
  from: devin
  text: card captured via board-api
- at: 2026-10-14 08:53
  from: devin
  text: 'Decisions from Tony: (1) WP + webboard surfaces live in the TONY-HA house — no new Ada persona; tony LINE
    lane drives it via backend tools. (2) Credentials plan: NOT split-creds-across-chats (ineffective — both chats
    sit in LINE history + Yomi index). Preferred = Option A, identity-based: customer LINE user ID -> site mapping,
    backend holds a revocable WP Application Password; customer never sees credentials. Option B fallback = per-customer
    app password sent in chat (revocable). Option C = magi'
- at: 2026-10-14 10:27
  from: devin
  text: '[verified 2026-10-14] wp_post landed for real — ada-pi aa41e24 -> idc03 via deploy-ada.sh (8 services active,
    1394 tests + lint pass). Prior session claims of pages/posts were unverified: site actually had only sample-page
    + hello-world. Now real: front page = Boards home (page 2, set via REST settings), member pages ?page_id=10
    tony / =11 kk / =12 nhong, tag feeds ?tag=<person> (plain permalinks — no /tag/ or pretty post URLs). Posts
    6,7,9 live incl. LINE-archive media -> WP media library -> ht'
