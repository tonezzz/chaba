id: line-wp-site-manager
title: LINE-driven WordPress site maintenance (customer via LINE chat)
column: backlog
updated: 2026-10-14 16:46
brief: 'Tony''s idea: a customer maintains their WordPress site by chatting in LINE — Ada receives the message and
  drives WP REST API. Testbed: boards.surf-thailand.com -> boards.h3.gizmo-thailand.com proxy (wired 2026-10-14;
  WP itself not serving yet — Plesk default page).'
priority: medium
tags:
- cms
- line
- experiment
spec: 'P0: WP live on Plesk boards site + verify WP REST /wp-json reachable. P1: mint a WP Application Password
  (revocable, API-scoped — NOT the admin password; do not send master creds into LINE where they persist in history/Yomi
  index). P2: read-only Ada tool — list posts/pages, preview draft. P3: write ops — create/update post via LINE
  request, confirm-before-publish. Open Q: which lane (tony/ada-ha) fronts it, and does the customer get a dedicated
  group?'
ref: OPS-0640
