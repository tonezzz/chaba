id: wp-activity-cpt-timeline-links
title: 'WP boards: activity/incident CPT for tool events — timeline links instead of duplicates'
column: doing
updated: 2026-10-23 08:31
priority: medium
tags:
- wp-boards
- ada
- reports
spec: 'Tony 2026-10-14: add an incident/activity post type to boards WP so tool executions (image render, video
  render, translate, etc.) become durable items, and point the timeline at these items so nothing is stored twice.


  Recommended shape (not yet decided — see requests):

  - New CPT `activity` (chaba-boards plugin v0.2) rather than reusing `report` (digests/period-based) or `ops-event`
  (infra heartbeats). Title: "Activity — {tool} {lane} {date}".

  - Meta: tool, lane, status(ok|failed|blocked), model, cost_usd, artifact_url, ref_url, prompt_excerpt, session_id/chat_id,
  duration_s. Failed/blocked calls land too — that IS the incident report.

  - Writer: ada-pi tool_runner post-call hook for an allowlist (ada_render_image, ada_render_video, translate/vision
  tools) POSTs via WP app password (~/.config/secrets/wp-boards.env); failures recorded by the same hook so killed/refused
  turns (e.g. 2026-10-14 14:36 restart-mid-turn) leave durable evidence, not just a journal line.

  - Timeline dedupe: line-chat-timeline.py already rebuilds timeline_block from journals — journal entries that
  produced an activity post get the post id/url (via artifact_url match or an event_id the relay stamps into the
  journal) and render a link/embed instead of re-inlining the media.

  - Privacy: member-visible per lane like /chat/line/* (private status), artifact media already public-by-URL under
  /relay-img/arch/ — same caveat as uploads/.


  Decisions for Tony (default ★): CPT name `activity` ★ vs `incident` vs reuse `report`; emitters = renders+translate
  first ★ vs all tools; per-lane private ★ vs one shared feed.'
ref: ADA-0650
