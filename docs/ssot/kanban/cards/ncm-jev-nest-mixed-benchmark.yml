id: ncm-jev-nest-mixed-benchmark
title: Benchmark NCM + JEV + Nest mixed generation routing
column: doing
updated: 2026-10-28 22:31
spec: Explore whether NCM improves Thai generation speed/quality when orchestrated by JEV and executed by Nest.
  NCM is the candidate generator; JEV routes/gates; Nest runs parallel candidates and publishes artifacts. P0 replay
  Sudoku/Thai fixtures through AR baseline, NCM, JEV route-only, and mixed candidates. P1 run Thai NCM toy on Colab.
  P2 benchmark JEV route accuracy/gates. P3 compare NCM-only, AR-only, sequential routing, and bounded parallel
  candidates with deterministic/LLM verifier. P4 shadow production. Measure PPL, entropy, validity, semantic score,
  TTFO, tokens/sec, wall time, memory, cost, verifier pass, escalation, and human intervention. No production route
  change until three held-out repeated runs, rollback, and human approval.
note: NCM implementation exists and Sudoku validated; Thai GPU numbers are missing. Procedure committed in feat/ncm-jev-benchmark
  at ffff8c214; Education post created for the benchmark design.
