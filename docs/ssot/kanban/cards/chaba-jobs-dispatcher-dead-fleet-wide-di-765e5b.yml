requests:
- id: the-chaba-jobs-timer-is-inacti-04f0e4
  ask: The chaba-jobs.timer is inactive on idc03 and absent on dell and mn01, causing all ssot.jobs.yml jobs with
    dispatch:dispatcher to silently fail since the timer died. We need to decide how to handle the architecture
    of these dispatcher jobs moving forward before we can fix or migrate them.
  options:
  - ★ Re-enable and configure chaba-jobs.timer on idc03 as the dedicated dispatcher host and verify it runs ssot.jobs.yml
    jobs
  - Migrate all remaining dispatcher jobs to use dispatch:systemd rendered timers (like nest-queue-watch) and remove
    the legacy dispatcher
  - Postpone fixing the fleet-wide dispatcher failure until a full infrastructure review of chaba-jobs can be performed
