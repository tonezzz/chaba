  text: '[fixed] commit 6068271a46 on master. Root cause: closed timer-alert cards were reopened whenever the finding
    still appeared in sweep state (lags reality up to a sweep interval). Fix: (1) reopen path now calls _live_verify
    — one targeted ssh checking service Result + is-enabled — reopens only on confirmed-live condition; (2) per-timer/host
    findings now require fresh sweep (<=30min) so a dead collector cannot mass-respawn from stale state; (3) reconcile()
    gets sweep=None when stale so heal-closes '
