id: idc03-chaba-vault-sync-gap
title: idc03 chaba-vault checkout has no sync mechanism — 119k commits behind, caused 2 outages
column: doing
updated: 2026-11-27 11:40
priority: high
tags:
- infra
- drift
- idc03
