  - id: any-admin
    label: Any admin key holder
  suggested: tony-only
  escalated_at: 2026-10-09 07:15
  answer: tony-only — Tony only — safest; admin approval can come later
- id: invite-expiry
  ask: Should invite links expire (e.g. 24h) and be single-use?
  status: answered
  from: devin
  at: '2026-10-08'
  options:
  - id: expire-single-use
    label: Yes — 24h TTL + single-use (recommended)
  - id: persistent
    label: Persistent link — simpler, less safe
  suggested: expire-single-use
  escalated_at: 2026-10-09 07:15
  answer: expire-single-use — Yes — 24h TTL + single-use (recommended)
