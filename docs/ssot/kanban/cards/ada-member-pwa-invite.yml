id: ada-member-pwa-invite
title: Member PWA invite flow — shareable link → install as "ADA-{inst}({person})" → pending → approve
brief: Tony wants to send an ada-ha link via LINE/TG; member opens on iPhone/iPad, saves as PWA titled "ADA-TONY(Tony)",
  key lands pending until Tony/Ada approves. Restructures the current key page (ada-keys-card) around this invite
  → redeem → approve lifecycle.
column: backlog
priority: medium
created: 2026-10-08
updated: 2026-10-08
spec: "Standard first, then build end-to-end: 1. Standard doc (docs/kb/ada-member-invite.md): invite token format,\
  \ PWA\n   manifest naming pattern \"ADA-{INSTANCE}({Person})\", pending/approved key\n   states, approval surface\
  \ (Ada voice + keys card), revocation.\n2. ada-pi-pwa (idc03, public — no CF Access so members never hit a login):\n\
  \   per-invite dynamic manifest.json so iOS \"Add to Home Screen\" shows the\n   per-member name; invite landing\
  \ page (install prompt + redeem).\n3. Ada API: invite endpoint mints pending key bound to person label;\n   approved=false\
  \ until gate clears.\n4. Approval gate: Ada command (\"approve <name>\") and/or button on the\n   restructured\
  \ keys page; pending keys listed with approve/reject.\n5. Keys page restructure: Issued | Pending | Revoked sections\
  \ on\n   ada-keys-card (or a dedicated admin view on the AI tab).\n6. Nest component standard: member-facing UI\
  \ stays vanilla web-component\n   (ada-*-card pattern) — works in HA sidebar, ada-pi-pwa, and CMS embeds\n   unchanged.\
  \ iPhone 15 Safari + Add-to-Home-Screen is the target matrix."
verify: 'On iPhone: open invite link → Add to Home Screen → icon reads "ADA-TONY(<person>)" → open → shows pending
  state → Tony approves → voice/chat works; reject path revokes.'
links:
- ha-guest-lan
- ada-user-device-acl
- release-lifecycle-standard
autonomy: t2
requests:
- id: approver-default
  ask: Who approves invite requests by default — Tony only, or any admin key?
  status: open
  at: '2026-10-08'
  from: devin
  options:
  - id: tony-only
    label: Tony only — safest; admin approval can come later
  - id: any-admin
    label: Any admin key holder
  suggested: tony-only
- id: invite-expiry
  ask: Should invite links expire (e.g. 24h) and be single-use?
  status: open
  from: devin
  at: '2026-10-08'
  options:
  - id: expire-single-use
    label: Yes — 24h TTL + single-use (recommended)
  - id: persistent
    label: Persistent link — simpler, less safe
  suggested: expire-single-use
comms_tail:
- at: 2026-10-08
  from: devin
  text: 'Requested inline with ada-ha AI tab work. Existing pieces to build on: ada_issue_key rest_command (keys/{name}/redeem
    via mn01), ada-keys-card (issued/bindings/apps attrs, QR re-pair, revoke), guest redeem at /api/auth/keys/guest/redeem.
    New: pending state + dynamic manifest naming.'
- at: 2026-10-08
  from: devin
  text: 'Multi-assistant roster (Tony): Ada=dev assistant (ada-dev backend :8005, mounted /apps/ha/ada-dev), Chaba=home
    assistant (ada-ha-tony :8002), แก้วตา=KK''s assistant (new persona/instance — backend wiring needed). Built
    as separate ada-voice-card instances with key_id namespacing (isolated localStorage key/device/auto state) on
    ada-ha /chaba-ai tab. Per-user sidebar visibility: HA core only has require_admin; enforced per-user show/hide
    needs browser_mod or per-member key ACL on the page itself. roster/instance registry should live in ssot before
    more assistants are added.'
claim: {}
advice:
  from: devin
  at: 2026-10-09 07:20
  text: Recommend Tony-only approver + expiring single-use links — approval friction is one notification tap, and
    a persistent multi-use guest link is the exact thing that leaks into a shared device.
