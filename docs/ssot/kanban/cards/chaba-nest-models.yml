note: 'Vision: smallest simple micro AI per node, run everywhere, smarter when connected (Flower FedAvg over tailnet;
  syft-flwr file-based for intermittent hosts). Stack: nanochat/distillation factory (jev-student is the proven
  recipe), ONNX/TFLite-Micro/onnxruntime-web WASM deploy, orch-bench as fitness function, NEAT/OpenEvolve for the
  evolve layer. Learning track: architecture taxonomy experiments — one real task per family (dense→ops classifier,
  CNN→edge vision, LSTM→solar/power series, transformer→jev family, autoencoder→anomaly detection).'
