  split exposes drift. Continuous-education feed live: report-ai-edge.py weekly Mon 06:00 → CMS ai-edge-report.
  P1: Flower local-sim federation, then real 2-node (omen↔mn01). P2: curriculum of architecture experiments (per-task
  comparisons logged to MDDB bench collection). P3: evolution loop — NEAT population vs bench, keep winners.

  '
