id: chaba-nest-models
title: 'Chaba Nest models — micro AI per node, federated smarts'
brief: "Idea: give every small node its own tiny AI model that gets smarter when the nodes connect. It's a vision card sitting in the backlog — no action needed yet."
column: todo
priority: medium
created: 2026-10-07
updated: '2026-10-07'
note: >-
  Vision: smallest simple micro AI per node, run everywhere, smarter when
  connected (Flower FedAvg over tailnet; syft-flwr file-based for
  intermittent hosts). Stack: nanochat/distillation factory (jev-student
  is the proven recipe), ONNX/TFLite-Micro/onnxruntime-web WASM deploy,
  orch-bench as fitness function, NEAT/OpenEvolve for the evolve layer.
  Learning track: architecture taxonomy experiments — one real task per
  family (dense→ops classifier, CNN→edge vision, LSTM→solar/power series,
  transformer→jev family, autoencoder→anomaly detection).
links:
  - docs/ssot/kanban/cards/nest-edge-vision.yml
  - docs/ssot/kanban/cards/monitoring-standard.yml
spec: >
  P0 DONE 2026-10-07: experiments/nest-01-ops-classifier — pure-numpy MLP,
  2000 real ops events, 50.7% acc (chance 8%), 10KB model. Lessons:
  feature ceiling 81% (tool→type), imbalance→collapse→capped weights,
  temporal split exposes drift. Continuous-education feed live:
  report-ai-edge.py weekly Mon 06:00 → CMS ai-edge-report.
  P1: Flower local-sim federation, then real 2-node (omen↔mn01).
  P2: curriculum of architecture experiments (per-task comparisons logged
  to MDDB bench collection).
  P3: evolution loop — NEAT population vs bench, keep winners.
