id: mddb-follower-stall
title: mddb follower stream stalls silently — connected but stops applying
brief: "One memory-database replica quietly stops copying new data while still looking connected — no errors anywhere. Waiting in the backlog — no action needed yet."
column: backlog
priority: high
note: >-
  2026-10-06: idc02 follower (2.15.4-lsn) resumed from persisted LSN at
  11:34, applied to 149.57M, then silently stalled while still "connected"
  — no errors in journal. Restart at 13:50 resumed from persisted LSN
  149571828 and continued applying. Stream state isn't surfaced: leader
  shows last_seen_at fresh but confirmed_lsn frozen = the stall signal.
  Same silent-stall class as the original replication wedge. Likely a
  dropped apply goroutine or blocked binlog read.

  2026-10-07 dispatch (mn01): root cause = follower replicate() blocks in
  stream.Recv() with no deadline and no app-level heartbeat (diagnosed by
  mddb-replication-heartbeat; a silently-dead stream = blocked Recv
  forever, connected=true, silent). Code fix exists undeployed on
  mddb-fork repl-heartbeat @498cdc3 (15s heartbeat + 45s Recv deadline +
  connected/last_recv_at status fields). Mitigation shipped in chaba:
  scripts/mddb-follower-watchdog.py + systemd/mddb-follower-watchdog
  .{service,timer} restart the follower when confirmed_lsn is frozen
  >300s while last_seen_at stays fresh; mddb-binlog-canary.py now
  surfaces per-follower stream state (connected/apply_lag_lsn/
  frozen_seconds) and an explicit 'apply-stalled' alert reason. Live
  23:05Z: idc01 follower 13.2M behind but confirmed_lsn advancing — slow
  catch-up, correctly NOT flagged as stalled. Watchdog install on
  idc02/idc01 pending approval.
help: >-
  Detect: leader /v1/replication/status shows follower confirmed_lsn
  frozen while current_lsn climbs and last_seen_at stays fresh; the
  canary now reports this as 'apply-stalled' with frozen_seconds, and
  mddb-follower-watchdog.timer (once installed on the follower host)
  restarts mddb-follower.service automatically. Permanent fix: merge
  + deploy mddb-fork repl-heartbeat (Recv deadline); watchdog remains as
  safety net. See docs/ssot/jobs/infrastructure/2026-10-07-mddb-follower-stall-watchdog.yml.
updated: 2026-10-07
comms:
- at: 2026-10-06 14:30
  from: devin
  text: filed from idc01-return work — lsn-persist feature itself
    validated (resumed correctly), the stall is the upstream bug.
