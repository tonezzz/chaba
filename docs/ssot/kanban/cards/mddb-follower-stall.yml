id: mddb-follower-stall
title: mddb follower stream stalls silently — connected but stops applying
brief: One memory-database replica quietly stops copying new data while still looking connected — no errors anywhere.
  Waiting in the backlog — no action needed yet.
column: backlog
priority: high
note: '2026-10-06: idc02 follower (2.15.4-lsn) resumed from persisted LSN at 11:34, applied to 149.57M, then silently
  stalled while still "connected" — no errors in journal. Restart at 13:50 resumed from persisted LSN 149571828
  and continued applying. Stream state isn''t surfaced: leader shows last_seen_at fresh but confirmed_lsn frozen
  = the stall signal. Same silent-stall class as the original replication wedge. Likely a dropped apply goroutine
  or blocked binlog read.'
help: 'Detect: leader /v1/replication/status shows follower confirmed_lsn frozen while current_lsn climbs and last_seen_at
  stays fresh. Fix candidates: heartbeat/timeout on the follower receive loop, or a "applier-alive" metric the canary
  can watch. mddb-fork repo.'
