spec: 'Diagnose the mddb follower''s silent apply stall (idc02, v2.15.4-lsn): stream stays ''connected'', leader
  last_seen_at stays fresh, confirmed_lsn freezes, no journal errors; restart resumes cleanly. Add stream-state
  surfacing (apply-lag metric/health signal so the freeze is visible without a human comparing LSNs) plus a watchdog
  that restarts the follower when confirmed_lsn stops advancing while the stream is connected. Root-cause the dropped-apply/blocked-read
  if reachable; document findings on the card.'
