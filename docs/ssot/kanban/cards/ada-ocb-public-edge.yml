id: ada-ocb-public-edge
title: Expose OpenChamber publicly as ada-ocb.surf-thailand.com
column: done
updated: 2026-11-14 14:12
brief: The ada-ocb chaba-admin tab on ada-ha (added 2026-11-12) iframes https://ada-ocb.surf-thailand.com/, which
  does not exist yet. OpenChamber web (@openchamber/web) runs on tony-dell 0.0.0.0:3000, also reachable at http://100.68.142.13:3000
  on the tailnet.
priority: medium
program: devnest
tags:
- openchamber,infra,ada
spec: 'Build the public edge the same way ada-code was done: (a) DNS A ada-ocb.surf-thailand.com -> idc02 edge,
  proxied; (b) Cloudflare Access app — either reuse the ada-code app''s self_hosted_domains (same AUD, same allowlist)
  or a new app; (c) idc02 caddy-edge route -> upstream tony-dell:3000 over tailnet (or a session gateway if OpenChamber''s
  own passkey auth is deemed insufficient); (d) verify the iframe loads inside https://ada-ha.surf-thailand.com/chaba-admin/ada-ocb.
  Decide whether CF Access is needed given OpenChamber has its own ui-passkeys/jwt auth; a tailnet-only alternative
  is tailscale serve --https on tony-dell pointing at :3000.'
ref: ADA-0032
