id: ada-admin-key-in-ha-secrets-yaml-drifts-3fccc3
title: ada_admin_key in HA secrets.yaml drifts on ADA_API_KEY rotation — key minting 401s, chat card shows 'Add
  a device key to unlock'
column: done
updated: 2026-11-21 17:45
priority: medium
tags:
- ada
- auth
- ha
- rotation
spec: 'INCIDENT 2026-11-18: tony-ha chat card dead — mint flow (script.ada_voice_key -> rest_command.ada_issue_key)
  returned 401 because secrets.yaml ada_admin_key no longer matched the lane''s ADA_API_KEY in ~/.config/secrets/tony-ha/backend.env
  on idc03. Fixed manually: synced secrets.yaml (home-assistant + ada-ha configs on tony-omen) to current key, restarted
  tony-ha.service + ada-ha.service. SAME RISK: michael-dev (idc02) secrets.yaml has no ada_admin_key at all; per-lane
  keys differ (tony/michael/kk/ada all distinct) so one secret cannot admin all lanes — scripts.yaml uses one secret
  for instance=tony AND michael. TODO: (a) document rotation runbook — ADA_API_KEY rotation must update secrets.yaml
  on every HA host that mints for that lane + restart HA; (b) consider per-instance secrets (ada_admin_key_tony/michael)
  since lanes have distinct keys; (c) add drift check to existing tooling audit. Related: OPS-0198 runner drift,
  earlier LiteLLM key rotation incident same day.'
ref: ADA-0199
