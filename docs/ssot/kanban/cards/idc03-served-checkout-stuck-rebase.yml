spec: 'Found 2026-11-13 ~15:05 while moving OPS-0083 to done (board-api /action timed out repeatedly).


  STATE on idc03 ~/CascadeProjects/chaba-tony-dell (the served/writer checkout):

  - `git status`: "You are currently rebasing. (all conflicts fixed: run git rebase --continue)"

  - .git/rebase-merge/ contains ONLY `autostash` — no head-name/onto/done/orig-head files. Rebase state is incomplete/corrupt.

  - Branch diverged 21 vs 24 vs origin/master.

  - 90 unstaged modified files in working tree (card ymls, .render-state, .ref-seq etc).

  - kanban-commit.service logs "REFUSING to commit — rebase/merge/cherry-pick in progress" and has filed repeated
  ''kanban-commit alert (rebase-in-progress)'' commits.

  - /tmp/board-api.lock was held ~4min by kanban-dispatch.py (runner poll) — all board writes queued behind it;
  my /action POST timed out at 120s twice.


  RISK: single-writer rule means card edits on the served checkout aren''t being persisted to git; divergence grows;
  git-safe-pull.sh can''t run while rebase state exists.


  SUGGESTED: inspect .git/rebase-merge + autostash stash, decide between `git rebase --continue` (may fail — state
  files missing) vs manual cleanup (remove rebase-merge dir if rebase actually finished, then git-safe-pull). Do
  NOT git reset --hard — 90 modified files may be uncommitted card edits. Consider snapshotting the worktree first.'
