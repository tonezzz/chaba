spec: '~30 cms-auto-*-digest cards pile up in review — the auto-alert writer stamps a NEW card each error window
  instead of upserting/reopening one card per automation. Fix: find the alert producer (cms health/alert unit) and
  make it update-in-place per automation key (open card exists -> bump note/updated, not a new card); auto-resolve
  the card when the automation goes green for N windows. Then bulk-close the stale review pile as duplicates.'
ref: KNB-1099
