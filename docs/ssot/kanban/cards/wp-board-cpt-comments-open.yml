  text: spec drafted by backlog-spec-enrich (gemini-3.5-flash-lite) — review before queueing
spec: The goal is to open comment_status on board Custom Post Types (place, trip, ops-event, asset, cam,
  bench, render_job) on boards.surf-thailand.com so member comments can reach wp-comment-sync lanes. Host
  and repo must be derived strictly from available configuration since none were asserted in the card.
  Constraints require enabling comments on all board CPTs without disrupting existing news and posts behavior.
  The testable done-condition is that probing the REST API for board CPT posts returns a valid comment
  status other than rest_comment_closed.
