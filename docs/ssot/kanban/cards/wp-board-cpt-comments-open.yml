note: 'wp-comment-sync (card wp-comment-sync-suggestion-inbox, built 2026-10-15) routes member comments
  on boards.surf-thailand.com posts into suggestion lanes — but probing live shows comment_status CLOSED
  on every board CPT: place, trip, ops-event return rest_comment_closed (comment_status null), and asset/cam/bench/render_job
