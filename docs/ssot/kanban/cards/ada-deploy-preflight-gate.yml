id: ada-deploy-preflight-gate
title: Deploy-preflight gate — review-ready → preflight → Tony approval → deploy → verify
column: done
updated: 2026-11-14 14:07
brief: 'Last missing piece of the Ada dev-control-plane loop. Cards currently merge to done with no production-deploy
  stage. Build the gate: card declares deploy target, system collects preflight evidence, Tony approves explicitly,
  deploy runs, post-deploy surface is verified.'
priority: high
program: chaba-ci
tags:
- kanban
- deploy
- autonomy
- ada-control-plane
spec: 'Tony''s stated flow: review-ready → deployment preflight → exact diff/commit → tests/lint → rollback plan
  → explicit production approval → deploy → live surface verification. Autonomy SSOT already classifies deploy as
  R4 human-gated — this card builds the mechanism.


  Contract sketch:

  - Card declares deploy intent, e.g. action.deploy = {host: idc03, repo: ada-voice, command: deploy-ada.sh, verify_url:
  https://.../api/health} or per-repo default in ssot.

  - New job (scripts/board/deploy-preflight.py + timer) scans review/done-merge cards with deploy declared and no
  open deploy request.

  - Preflight evidence posted as comms + request to Tony: merge commit sha, diff stat, test/lint result (already
  produced by dispatch close-out), rollback plan (revert sha / previous tag).

  - Approval via existing board /request + /respond (options: approve / hold / abort). No silent deploy.

  - On approve: run declared deploy on target host (ssh systemd-run or the repo deploy script), capture output,
  then verify the declared health surface — BOTH producer (unit active) and consumer (endpoint 200) per verify-by-surface
  rule.

  - Result comms + card stays honest: deploy_failed is a real state, not retried silently.


  Must NOT: deploy without explicit Tony response; bypass deploy-ada.sh gates; auto-approve; touch t4 cards.'
ref: KNB-1090
