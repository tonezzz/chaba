  path (check tony-omen AllowTcpForwarding/PermitOpen or ssh-config-generate.yml), or point rearm at a working route.
  Evidence: docs/ssot/jobs/infrastructure/2026-11-27-runner-tools-converge-local-scope.yml residuals.'
