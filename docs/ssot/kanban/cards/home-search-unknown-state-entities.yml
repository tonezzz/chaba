id: home-search-unknown-state-entities
title: Verify home_search surfaces entities whose state is unknown
column: doing
updated: 2026-10-10 11:23
note: Tuya no-feedback covers like cover.gate_motor sit at state `unknown` at rest (normal — they only report while
  moving) and are flagged available:false by the entities endpoint. If home_search drops unavailable entities, the
  gate is invisible to voice search even on ada-michael. Verify the filter and surface such entities (flagged) instead
  of hiding them.
