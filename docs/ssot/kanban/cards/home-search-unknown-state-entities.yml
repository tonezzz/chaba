spec: "Self-contained spec (this card dispatches on repo ada-pi, which cannot read chaba docs):\n1. In the ada-pi\
  \ tool_runner HA module, find the code behind home_search\n   kind=device (absorbed search_home_devices / list_home_devices\
  \ /\n   ada_ha_search_devices) and the /api/home-assistant/entities handler in\n   pwa_server.py — check whether\
  \ entities with state `unknown` or\n   `unavailable` are filtered out of search results.\n2. Expected behavior:\
  \ entities at state `unknown` must remain\n   discoverable — Tuya curtain-type covers (cover.gate_motor on\n \
  \  michael-ha) have no position feedback and rest at `unknown`\n   permanently; treating them as absent makes\
  \ the physical gate\n   unfindable/uncontrollable by voice. `unavailable` entities may be\n   ranked down or annotated\
  \ but should still be mentionable when the\n   query matches (a temporarily-flapping Tuya device reads unavailable\n\
  \   for ~10-25 s bursts and recovers).\n3. If a filter exists, change it to include unknown/unavailable entities\n\
  \   flagged with their state (e.g. return them with available:false and\n   let the model explain), and add a\
  \ unit test covering cover.gate_motor-\n   style entities (state=unknown, state=unavailable) appearing in\n  \
  \ search results.\n4. Verify: tool decl lint passes; a search for \"gate\" on the michael\n   instance returns\
  \ cover.gate_motor even when its state is unknown."
