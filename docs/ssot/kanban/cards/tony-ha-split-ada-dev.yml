id: tony-ha-split-ada-dev
title: 'Split tony-ha: prod HA into dedicated container; old container becomes ada-ha (dev-only)'
column: review
priority: high
note: 'PARTIALLY DONE 2026-10-06 (parallel session): ada-ha already exists on
  tony-dell — 127.0.0.1:8125, config ~/.config/ada-ha, container healthy 14h.
  Implemented as a FRESH lab container rather than rename+rebuild, so prod
  tony-ha on :8123 was never touched (cleaner outcome). Remaining verify:
  radios still prod-only; dev mocks/tony-test dashboards moved off prod;
  ssot.home-assistant.instances.yml records the ada-ha instance.'
review_kind: decide
spec: 'Phase 0 - verify: inspect tony-ha .storage/core.config_entries for the
  zigbee radio path (slzb06 TCP vs zigbee-usb2 container) and any device mounts
  the quadlet needs. Phase 1 - safety: tar backup ~/.config/home-assistant.
  Phase 2 - split: podman rename tony-ha ada-ha; write ada-ha.container quadlet
  (config ~/.config/ada-ha seeded via cp -a, PublishPort 127.0.0.1:8125:8123,
  consider dropping host-network - dev has no reason to see it). Start new
  tony-ha container from the existing quadlet + existing config dir - comes up
  on :8123 with tokens/.storage/integrations intact; verify serve URL 200,
  entities live, recorder writing. Phase 3 - sanitize ada-ha: cloned .storage
  carries prod tokens (acceptable same-host; keep ada-ha tailnet-only); pin
  radio bridges to prod only. Phase 4 - strip dev pollution from prod:
  a_dev_mocks.yaml, mha_mirror_* entities, tony-test dashboard -> move to
  ada-ha. Phase 5 - record: ssot.home-assistant.instances.yml gains a 4th
  instance (ada-ha); ada dev flows may repoint to :8125; document the
  three-tier ladder ada-ha -> michael-dev -> tony-ha.'
help: 'Minimal attach list for prod tony-ha: config dir, tailscale serve :8123,
  radio bridges (verify which), go2rtc :1984/8554, node-red :1880
  (nodered-ha.env), ha-live bridge :9005, ha_mcp_tools :9584, xiaomi secrets
  referenced by config. Two host-net containers cannot share 8123 - prod keeps
  it, ada-ha takes 8125. Recorder DBs are per-config; no conflict. Verify:
  curl serve URL 200; ada-ha 200 on 8125; no entity loss in prod; radios not
  double-attached; consumers unchanged.'
