spec: 'Tony 2026-10-13: sent Kaewta a PDF trip ticket — she never sees it. LINE type:file messages have NO handler
  in line_relay.py; _MIME_EXT maps audio/video only so docs would archive as .bin.\n\nBUILD:\n1. line_relay.py:
  handle inbound type=file (and any unhandled media type) — fetch via existing api-data.line.me content endpoint
  -> _archive_media (already generic) + journal event with kind=file; extend _MIME_EXT with application/pdf:.pdf
  + common doc types (docx, xlsx, txt, csv). Surface to the lane session as a document-received turn (e.g. synthetic
  text turn: "[document received: <name> <mime> <archived-url>]").\n2. New tool backend/tools.d/doc_read.py: doc_read(path_or_url,
  prompt?) — resolves archived media path or relay-img URL, reads bytes, passes to the lane genai client as inline
  PDF/doc part (gemini ingests PDFs natively — no new deps) with an extraction prompt; returns structured result.
  Keep it generic (any doc), prompt arg lets the caller say what to pull (booking refs, flight legs, dates).\n3.
  kk/kk-dev ADA_INCLUDED_TOOLS += doc_read after deploy (allowlisted lanes).\n\nVERIFY: send a file-type LINE message
  to kk-dev in a test room (or unit-test the handler + tool with a fixture PDF); doc_read returns fields; journal
  records it.\nRAILS: pytest + tool-lint in worktree, no push/deploy.'
