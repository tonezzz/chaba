spec: 'Reproduced on origin/master 9e70ccc (dispatch-test-baseline-awareness): tests/ada/test_tg_forward_provenance.py
  TestHandleTurns test_forwarded_document_described + test_forwarded_sticker_described both fail with UnboundLocalError:
  turn_ok @ tg_relay.py:1216 — the forwarded-media-without-renderer path sends the reply but never binds turn_ok
  before `if turn_ok:`. Fix in the staged drop integrations/ada-voice/backend/tg_relay.forward-provenance.patch
  or upstream ada-voice tg_relay.py (bind turn_ok=False before the media-send block / set it in the send path like
  the photo branch). Verify: pytest tests/ada/test_tg_forward_provenance.py -q green.'
