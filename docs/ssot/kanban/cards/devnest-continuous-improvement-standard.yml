spec: 'Define SSOT procedure and registry lane for DevNest checks. Lifecycle: discover -> card -> target_host+done
  gate -> JEV route -> isolated execute -> independent verify -> merge/review -> artifact land -> telemetry -> feedback
  label -> weekly regression/replay -> monthly lane/cost review. Gates: no unattended destructive jobs; baseline-aware
  tests; stale/claim watchdog; evidence required before done. Integrate host-assessment->Education, Devin replay
  corpus, T4 pack artifacts, JEV confusion matrix, OpenCode closeout metrics.'
