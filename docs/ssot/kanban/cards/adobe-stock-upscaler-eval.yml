- at: 2026-11-07 18:39
  from: devin
  text: 'Scaffold landed on feat/ops-1077-upscaler-eval: scripts/adobe-stock/upscale-eval.py — backend=real esrgan-ncnn
    (ncnn binary, CPU/Vulkan), metrics = laplacian sharpness + roundtrip PSNR/SSIM (self-consistency; no ground
    truth for generated images) + optional --unsharp post-pass + JSON receipt. Metric fns verified (blur < roundtrip
    ordering correct). Live dogfood in progress: realesrgan-x4plus x4 on comparison-d running on tony-dell (~70min
    CPU). Still TODO: spandrel/diffusion backends (SeeSR/SUPI'
- at: 2026-11-07 19:25
  from: devin
  text: 'Dogfood done: realesrgan-ncnn x4plus x4 on comparison-d via upscale-eval metrics — output 5376x3072 (16.5MP),
    roundtrip PSNR 29.3dB / SSIM 0.916. Note: raw x4 laplacian var DROPPED vs source (SR nets smooth); unsharp40/60
    post-pass restores sharpness (lap 1259/1571 vs src 1583). Landed comparison-d-x4 + -sharp40 + -sharp60 to Drive
    for Tony QC. Honest read: resolution 4x''d but realism ceiling unchanged — expect ''sharper but still not photo''.'
