spec: 'Follow-up to ada-lazy-tool-schemas post-deploy verify. REGRESSION: on the voice lane the model calls cold
  tools with {} — 2/2 live sessions called trip_calendar {} with slug+dates given verbatim in the prompt; server
  returned ok:false + usage hint (repair path works) but Gemini Live did NOT retry and told the user ''missing trip
  name''. All 39 lazy-stripped decls have zero arg names on the wire; no schema-fetch tool exists for the model
  to elect.


  FIX (option b from the verify comment): in backend/realtime_provider.py _apply_lazy_schemas, for non-hot tools
  keep the property KEYS and the required list — strip only per-property type/description/enum and any nested schema
  bulk. Wire shape: {"type":"object","properties":{"slug":{},"start":{},"end":{}},"required":["slug"]}. Hot-10 FULL_SCHEMA_TOOLS
  unchanged. ADA_LAZY_SCHEMAS=0 / ADA_FULL_SCHEMA_TOOLS kill switches unchanged.


  Measure: wire decl bytes before/after — must stay far under the pre-lazy ~64k; target <=~38k for tony-voice lane
  (empty-schema floor was 27.7k; arg names only add keys).


  Verify: pytest + tool-lint green via merge gate; unit test asserting a cold decl keeps properties keys + required
  but no type/enum; assert hot tools keep full schemas; assert the {} case still validates server-side (unknown/missing
  args -> SchemaError + usage hint). Live e2e deferred — Gemini Live spend cap blocks voice sessions (ada-gemini-live-spend-cap).'
