  — 4 candidate entities (ops-classifier MVP, jev-student, orch-bench-corpus, edge-vision), blob roles, Drive appProperties
  discovery, policy defaults (retention 5, epoch fencing, per-entity memory policy). P1: nest-brain-pack.sh / nest-brain-restore.sh
  — tar+sha manifest, rclone copyto, verified round-trip. P2: cross-host respawn proof — nest-01-ops-classifier
  (10KB model, ideal MVP) checkpoint on tony-dell → restore on mn01 → bench-diff within noise = continuity proven.
  P3: checkpoint cadence (timer + on-improvement events) + Drive Changes/latest-pointer drift signal ("newer brain
