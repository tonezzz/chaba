note: 'Every Nest entity gets a versioned brain bundle (manifest + weights + memory slice + config + state anchors)
  stored on gdrive as an append-only artifact. Any host can fetch → hydrate → resume with RPO = time since last
  checkpoint. Same tier model as the deployed mddb backup offload: hot local, warm on tailnet, cold on gdrive. Research
  doc: docs/kb/nest-portable-brains-research.md'
