spec: "Design: docs/design/report-session-loop.md §1b (contract). Repo: ada-pi. The CMS viewer is pwa/cms/index.html\
  \ served by pwa_server.py behind /api/cms/* key auth; chaba-admin/chaba-cms* HA tabs iframe it.\n1. pwa/cms/index.html\
  \ — a \"▶ Devin session\" button in the report page\n   toolbar (next to Regenerate). POST {API_BASE}/api/cms/spawn\
  \ {slug};\n   on ok toast \"card <id> queued\" linking to the board\n   (/apps/board/ on the chaba edge); on 409/already-active\
  \ say so.\n2. pwa_server.py — new route POST /api/cms/spawn {slug}: read the page\n   doc (title -> card title),\
  \ then call board-api\n   POST /card {title, report: slug, action: {type: dispatch, repo: chaba},\n   queue: true,\
  \ on_exists: queue, tags: [report-session-loop, cms],\n   brief: \"Spawned from CMS page '<slug>' — session keeps\
  \ the report\n   updated; watch card comms.\"} — reuse whatever client helper\n   backend/tools.d/ada_board_write.py\
  \ already uses to reach\n   tony-dell:8787 / the Caddy /apps/board-api route; do NOT add a second\n   auth path.\n\
  3. Key capability: the shared cms-viewer key is a READ key embedded in\n   iframes — it must not gain dispatch\
  \ power. Gate the route on the key's\n   `apps` metadata carrying a new `dispatch` capability (keys file\n   schema\
  \ already tolerates extra apps values — auth.py); Tony's keys\n   get re-issued with [view, dispatch] via the\
  \ existing pair flow.\n   Document the capability in the route docstring.\n4. Note for the implementer: confirm\
  \ the CMS page deep-link param name\n   (?page= vs ?slug=) from the viewer JS before writing card comms links.\n\
  \nVerify: unittest coverage for the route (key without dispatch -> 403, spawn -> board-api called with right body\
  \ — mock the board-api call); manual smoke deferred to deploy (ada deploys need Tony's approval per ada-pi AGENTS.md\
  \ — do NOT deploy, leave a needs-input/done note)."
