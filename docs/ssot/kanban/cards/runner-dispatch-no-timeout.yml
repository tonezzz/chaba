id: runner-dispatch-no-timeout
title: 'runner-agent: dispatch units get RuntimeMaxUSec=infinity — task timeout_s never armed'
column: backlog
updated: 2026-10-30 10:45
spec: 'Found during devnest-fl-pilot-health (2026-10-30): the dispatch path''s systemd-run units carry no RuntimeMaxSec,
  so an agent in a tool-call loop runs unbounded (nemotron ran 12+ min / 77 calls / 60 denials on a 420s fixture).
  The fixture timeout_s exists in task.yaml but only the synchronous opencode_profiles.run path honors it. Fix:
  arm --property=RuntimeMaxSec=<timeout_s or default> on the opencode/kk_mac unit argv in start_opencode_lane/start_kk_mac_task,
  sourced from the profile fixture task.yaml or card action. Also consider a denial-count circuit breaker (e.g.
  abort after N consecutive denied tool calls) since headless doom_loop=ask can''t fire.'
note: 'related: runner-agent-opencode-lane-profile-bug (OPS-0996)'
ref: OPS-0999
