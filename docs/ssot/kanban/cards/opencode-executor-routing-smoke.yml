spec: "Smoke card for opencode-explicit-executor-routing. Run ONLY under the ops-readonly profile on the pinned\
  \ target_host — this card declares executor=opencode; a host without OPENCODE_LANES=1 + the opencode binary must\
  \ leave it queued, never run it on devin.\nCollect host facts using only the ops-readonly allowlist (hostname,\
  \ uname, uptime, nproc, free, df, systemctl --user list-units) and emit your FINAL MESSAGE as a single JSON object\
  \ — no prose around it — in exactly this shape:\n{\n  \"host\": \"<hostname>\",\n  \"collected_at\": \"<utc iso>\"\
  ,\n  \"uptime_seconds\": <float>,\n  \"load1\": <float>, \"load5\": <float>, \"load15\": <float>,\n  \"cpu_count\"\
  : <int>,\n  \"mem_total_mb\": <int>, \"mem_available_mb\": <int>,\n  \"disk_root_pct\": <int 0-100>,\n  \"failed_units\"\
  : [<user unit names, [] if none>],\n  \"read_only\": true\n}\nDo NOT write, edit, move, or delete any file; do\
  \ NOT install anything; do NOT read ~/.config/secrets. The runner writes the declared artifact from your final\
  \ message — the agent holds no write tools.\nContract evidence this run must leave: a dispatch/<task> branch and\
  \ worktree, task meta.json + usage.json carrying executor/provider/model/profile, events.jsonl, the landed artifact\
  \ at action.artifact, a held-out verifier pass, and then the standard close-out merge. Any missing piece holds\
  \ the merge — that hold is a PASS for this card, not a silent fallback."
