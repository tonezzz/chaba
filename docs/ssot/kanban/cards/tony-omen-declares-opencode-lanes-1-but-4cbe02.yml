spec: 'Found 2026-10-30 (KNB-1008 deploy): omen''s runner-agent.service has OPENCODE_LANES=1 but `which opencode`
  and ~/.opencode/bin are both empty — the claim gate (OPENCODE_LANES AND opencode_bin()) fails closed, so opencode
  cards wait for idc02 while omen''s defer notes spam ''no opencode binary''. Either install opencode on omen (it''s
  the GPU/deep host — a real second opencode runner helps) or drop the env flag. If installing: add binary check
  to its onboarding verify so it can''t re-drift.'
