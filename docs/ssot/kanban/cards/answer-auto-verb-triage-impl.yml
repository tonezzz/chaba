brief: 'Board health check 2026-10-25: only 2 truly-open requests but ~90 requests with status=answered whose answers
  were never executed — each gets a ''needs triage'' comm and stalls. Tony already picked the policy on knb-answer-action-triage
  (2026-10-15): auto-verb — auto-execute known verbs (queue→dispatch, close→done, hold→parked) at sweep time. That
  implementation never landed; the sweep still just logs needs-triage.'
