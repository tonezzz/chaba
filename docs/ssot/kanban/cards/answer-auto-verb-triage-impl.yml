spec: 'Extend the sweep/answer path: when a request has status=answered and answer maps to a known verb (queue,
  close, hold, retry, dispatch), execute it instead of logging needs-triage. Unknown/free-text answers still go
  to needs-triage. Post a comm line ''answer auto-triaged: <verb>'' per action. Also add a board health counter:
  answered_untriaged (target 0).'
