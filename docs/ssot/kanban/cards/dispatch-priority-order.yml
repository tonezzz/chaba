id: dispatch-priority-order
title: Priority-aware dispatch — queued cards claim high → medium → oldest, not unordered
brief: 'Cards carry priority: but nothing enforces it at claim time — runners drain the queue in whatever order
  /cards returns. An urgent card can sit behind parked work. Make claim order priority-aware.'
column: review
priority: medium
program: chaba-ci
area: dispatch
note: 'Found 2026-10-09: grep shows no priority handling in kanban-dispatch.py or runner-agent.py — the field is
  display-only. priority semantics defined in ssot.operating-model.yml (priority never overrides host labels/caps/
  merge_guard — it orders within eligibility).'
spec: "1. runner-agent claim loop: sort claimable queued cards by\n   priority rank (high > medium > low > absent)\
  \ then card updated\n   (oldest first) before claiming. Same ordering in kanban-dispatch's\n   local drain.\n\
  2. Starvation guard: a low/normal card older than N hours (suggest 12h,\n   env-tunable) claims ahead of fresh\
  \ high cards — priority is a bias,\n   not a ban.\n3. tests/board/ coverage: ordering unit test with mixed-priority\
  \ queue.\n4. Document in ssot.kanban.yml concurrency section.\nAcceptance: queue with [low old, high new, normal\
  \ oldest] drains\nhigh->oldest-normal->low; labels/caps still gate eligibility; a 13h-old\nlow card beats a fresh\
  \ high.\n"
help: Keep it a pure sort — do not add preemption (running cards never get interrupted). Same ordering must be shared
  between the two claim paths (kanban-dispatch local drain + runner-agent remote claim) — extract a helper if needed.
