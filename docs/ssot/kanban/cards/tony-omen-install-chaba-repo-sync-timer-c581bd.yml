spec: Install chaba-repo-sync.timer and chaba-repo-sync.service on tony-omen to prevent repo drift in ~/CascadeProjects/chaba.
  Copy the unit files from systemd/ in the repo to ~/.config/systemd/user/, run systemctl --user daemon-reload,
  and enable --now the timer. The host is tony-omen and the repo is chaba. The done-condition is verified when systemctl
  --user status chaba-repo-sync.timer shows active and running.
