spec: 'Goal: make the Ansible converge used for the 2026-11-25 runner-agent drift fix the governed standard for
  all remote-host / fleet / service / repeatable-config jobs.


  Why: the blocker (16 stuck cards, every host drift-blocked) was fixed by an existing playbook, but the *way* to
  it — diagnose, preflight, approval, backup, converge, verify, evidence — existed only as scattered habit. AGENTS.md
  procedure-lookup duty says define a partial procedure rather than improvise.


  Done conditions:

  1. SSOT spec: docs/ssot/infrastructure/ssot.ansible-change-procedure.yml (9 steps, playbook registry, verification
  + rollback standard)

  2. Human/Ada mirror: docs/kb/ansible-fleet-change-procedure.md with exact commands + worked example

  3. Discovery pointer in chaba AGENTS.md procedure-lookup duty

  4. Agent skill ansible-first extended with the governed workflow (auto-loaded on host/service jobs)

  5. Evidence of a real run: 7/7 hosts converged, drift-blocked 0, queue 16 -> 7, 11 claimed, second --check changed=0


  Out of scope: board-api-owned surfaces (use the write door), local repo-only work, read-only diagnosis.'
note: Defined 2026-11-25 from the live runner-agent drift converge. See SSOT + KB mirrors.
