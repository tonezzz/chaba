id: yt-voice-dub-cast
title: YT voice dub — cast TTS voices to match actors/speakers
column: backlog
program: yt-voice-dub
area: casting
priority: high
metric: each distinct speaker keeps one consistent voice, plausibly matched on gender/age/tone
verify: dub output has N distinct voices aligned to detected/labelled speakers
note: 'Next step after yt-voice-dub-test (Tony ask 2026-10-04). Two sub-problems: (a) speaker detection — YouTube
  auto-captions carry no speaker labels, so use audio diarization (pyannote / whisperx-style align+diarize) or heuristic
  cue-gap clustering; (b) voice casting — map each speaker to an edge-tts voice matched on gender/age/tone, fixed
  for the whole video. Start heuristic: 2-speaker assumption on interview/talk videos before paying for full diarization.'
help: 'voices: edge-tts --list-voices (filter th-*/en-*); diarize: pyannote/speaker-diarization; verify loop in
  yt-voice-dub-scenarios'
spec: 'Two parts. (1) Repo-home the pipeline: move ~/.local/bin/{yt-vtt-dub.py, yt-live-api.py, yt-live.sh, yt-vtt-translate.py}
  into chaba scripts/ops/ keeping installed copies working. (2) Speaker casting, heuristic first: detect speaker
  turns via cue-gap clustering on VTT timings + question-cue heuristics, 2-speaker assumption for interview/talk
  videos; map each speaker to a fixed edge-tts voice for the whole video (--cast-map index ranges already exist).
  Constraints: edge-tts has exactly 2 TH voices (Premwadee F, Niwat M) — 2-speaker demos only; TH text runs ~1.4x
  longer than the EN cue window so uniform-rate fit is the honest fix; sNh4pVMFhvQ ships NO captions — needs a Whisper
  transcription lane first. Corpus staged at ~/yt-dub-prep/: U_io-pqPFfQ (3-speaker probe), 4njFdBF_42I (2+1). Verify:
  dub output shows N distinct voices aligned to detected speakers on the staged corpus.'
