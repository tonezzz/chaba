spec: 'Sub-card of devnest-queue-consolidation (OPS-1244). REPO-ONLY change (chaba) — Jules lane.


  GOAL: one claimer. Today two mechanisms claim card actions: kanban-dispatch.py (served-host local drain, oneshot+timer)
  and runner-agent.py (remote oneshot+timer). Both were disabled fleet-wide 2026-11-08 and the queue silently stalled
  — oneshot+external-tick has no self-healing.


  DO:

  - Refactor so one code path serves both roles: keep scripts/board/runner-agent.py as the single claimer; make
  the served host (idc03) just another runner. Port anything kanban-dispatch does that runner-agent lacks (local
  card-file drain when board-api unreachable, load gate parity, devin-dispatch argv).

  - Add a long-running service mode to runner-agent (--loop or default service ExecStart) with Restart=always in
  the rendered unit — timer stays as watchdog/fallback.

  - Update render-jobs.py / install assets so runner-agent.service + .timer are generated consistently per host
  (drop-in model: api.conf, cap.conf, lane confs).

  - Retire scripts/board/kanban-dispatch.py (or reduce to a shim calling runner-agent) and remove its rendered job
  entry.

  - Preserve: claim order (dispatch_repos.claim_sort_key), push-credential guard, lane classification (JEV_LANE),
  executor map {opencode,devin,script,manual,kk_mac_local,jules,nlm_batch}, close-out merge, worktree GC.

  TESTS: extend tests/board/ for claim-path parity (served-host case). Run python3 -m unittest tests.board.* .

  DONE-CONDITION: single claimer code path; served host claims via runner-agent; unit renders from ssot.jobs.yml
  path; tests green.'
