spec: "Goal: push a Telegram alert when the RK600 at Michael site reports wind > 15 knots or rain.\n\nDesign (agreed\
  \ w/ Tony, 2026-10-19):\n- Poller on idc03 (user timer, 60s): GET http://39.99.253.232:8005/data/22100502\n  -\
  \ login POST /login (RIKA_ACCOUNT/RIKA_PASSWORD from ~/.config/secrets/rikacloud.env), JWT in 'token' header,\
  \ TTL 86400s; cache token, re-login on 401.\n  - Freshness guard: only evaluate if dataTime < ~5 min old. Stale\
  \ data = no alert (rika-hmi-watch already covers upload outages).\n- Thresholds:\n  - wind: e2 >= 772 if e2 is\
  \ cm/s (15 kt = 7.72 m/s). Observed peak 1129 on Oct-14 storm ~22kt; calm day ~12-99. VERIFY unit against a known\
  \ gust before ship; cm/s (x100 of m/s) is the best-fitting scale.\n  - rain: e5 > 0 (e5=0 dry; spikes 80-190 seen\
  \ in Oct-15 rain).\n- Edge-triggered: fire once on transition into condition; re-alert at most every 60 min while\
  \ sustained; optional all-clear note when it drops back.\n- Delivery: Telegram Bot API sendMessage with the mn\
  \ bot token (idc03 ~/.config/secrets/telegram-mn-bot.env). Recipient chat_id TBD - see request.\n- Track state\
  \ in ~/.local/state/rika-wx-alert/state; log to alert.log."
