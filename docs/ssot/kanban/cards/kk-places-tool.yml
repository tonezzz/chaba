requests:
- id: the-basic-maps-link-to-public-17f71d
  ask: The basic maps-link to public CMS page to LINE reply flow has already shipped via KNB-0574, and the original
    Google Places lookup task requires a newly created Maps Platform API key with the Places API enabled in the
    GCP console. We need to decide whether to invest the effort to add Places API enrichment (ratings, hours, open-now)
    or leave the working flow as-is.
  options:
  - ★ Create a Maps Platform API key in the GCP console, enable the Places API, and implement the ratings/hours/open-now
    enrichment in chaba
  - Postpone this card indefinitely since the current place_report flow (KNB-0574) already meets the core requirement
    without Places API enrichment
  - Close this card as obsolete given that the core ask is partially superseded by e24b14d
  status: answered
  at: 2026-10-26 13:20
  from: backlog-spec-enrich
  answer: use my google api key for now, verify if it includes maps api.
awaiting_action: true
spec: Create the kk-places tool inside the chaba repository to perform Google Places lookups for lane members. Deploy
  the updated runner-agent script by copying scripts/board/runner-agent.py to ~/.local/bin/runner-agent on the affected
  hosts (idc03, tony-macbook, idc02, and tony-dell) to resolve the runner drift. The done-condition is verified
  when the kk-places tool is fully implemented in the chaba repo and all listed hosts successfully execute the synchronized
  runner-agent without drift errors.
