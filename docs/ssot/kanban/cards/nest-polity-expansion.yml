id: nest-polity-expansion
title: Systematic Polity-AI research expansion for Nest direction
brief: 'Tony wants the Polity exploration expanded systematically — seeking
  concepts we do not yet have, not re-reading what we know. Canonical doc:
  docs/kb/nest-asher-polity-inspiration.md (Research program section defines
  axes + intake discipline). First sweep 2026-10-08 already landed 8 new
  candidate concepts (subpersona sandbox, fabricated persona provenance, HK
  forensic reads, the Brockle, swarm-AI shard/merge, deal-with-the-devil
  outputs, Skaidon coupling hazard, Polity-without-politics scholarship).'
column: backlog
priority: medium
created: 2026-10-08
note: 'Sweeps are targeted queries per axis (canon per-arc, author interviews,
  secondary scholarship, engineering translation) — every finding must land as
  adopted/candidate/rejected in the inspiration doc, never loose trivia.
  Standing open questions: submind termination/reabsorption mechanics, Quiet
  War handover detail, Jain corruption mechanism, federated-vs-single-mind
  Polity AI topology. Each adopted concept must name its real-world engineering
  analog. Feed adopted items into nest-* card specs where they change design
  (e.g. subpersona sandbox -> adversarial tier; forensic lane -> new card?).'
