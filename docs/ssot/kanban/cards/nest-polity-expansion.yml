id: nest-polity-expansion
title: Systematic Polity-AI research expansion for Nest direction
brief: 'Tony wants the Polity exploration expanded systematically — seeking concepts we do not yet have, not re-reading
  what we know. Canonical doc: docs/kb/nest-asher-polity-inspiration.md (Research program section defines axes +
  intake discipline). First sweep 2026-10-08 already landed 8 new candidate concepts (subpersona sandbox, fabricated
  persona provenance, HK forensic reads, the Brockle, swarm-AI shard/merge, deal-with-the-devil outputs, Skaidon
  coupling hazard, Polity-without-politics scholarship).'
column: doing
priority: medium
created: 2026-10-08
note: 'Sweeps are targeted queries per axis (canon per-arc, author interviews, secondary scholarship, engineering
  translation) — every finding must land as adopted/candidate/rejected in the inspiration doc, never loose trivia.
  Sweep 2 (2026-10-08) answered 3 of 4 standing questions: Quiet War = gradual delegation creep (warning for the
  promotion gate — design against rubber-stamping); Jain lifecycle = dormant seeds → host/master → timed goes-to-seed
  kill; Polity AIs = a population of self-named distinct minds, not one monolith. New candidates logged: delegation
  law, delegation creep, AI self-naming, Erebus subsumed-mind loyalty, assassin-drone one-shot personas, Jain seed
  dormancy. Continuous-development program (cycle + 7 seeded tracks) now lives in the inspiration doc. Sweep 3 (2026-10-10)
  answered the last two standing questions — submind lifecycle = resubsumption (default) / emancipation (gated)
  / self-termination, with parent-held destruct codes; Erebus loyalty = forced subsumption + checked favourites
  + clone-from-loyal captains + core-held kill programs (which Randal hijacked into a fleet decapitation). 14 new
  rows landed incl. kill-channel capture, loyalty by provenance, meld-is-dominance, bench-as-virtuality, hivemind
  schizophrenia, survivor-copying evolution; self-edited moral code REJECTED (the documented rogue pathway). Next
  targets: Penny Royal shard re-integration, Orlandine subpersona fate (Warship/Human), Owner-trilogy Committee,
  Brockle forensic method.'
