id: lane-cms-content-model
title: 'Procedure: lane-cms-content-model — declare + audit each persona CMS coverage'
column: done
updated: 2026-11-26 20:35
spec: 'Standard procedure for managing a persona lane CMS to cover its responsibility (Tony asked 2026-10-12). (1)
  persons.<id>.cms block in ssot.apps.ada-persons.yml: section→producer→cadence→source allowlist; (2) producers
  collection-scoped + source-allowlisted (member lanes = public zones only); (3) cms-auto-health-style coverage
  audit (sections exist + fresh); (4) truthfulness contract: fresh_for + timestamps, agent states data age. Write
  to ssot.procedures.yml + Ada mirror.'
ref: KNB-0497
