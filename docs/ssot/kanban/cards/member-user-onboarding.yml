comms:
- at: 2026-10-09 09:45
  from: devin
  text: 'STANDARD PROCEDURE — add user <name> to member node <node>: (1) HA user:
    ws as node admin -> config/auth/create {name, group_ids:[system-users]} then config/auth_provider/homeassistant/create
    {user_id, username, password} — do NOT use `hass --script auth add` alone (creates
    orphan credential, login fails); (2) person entity: person/create {name, user_id}
    -> ada-voice-card _myPerson() resolves person.<id> for mint; (3) Ada identity:
    add person.<id>/user-<id> entries to person_policies + control_policies in ssot.apps.ada-memory-banks.yml
    with the intended bank allowlist; (4) private memory: optional personal-<id> bank
    (scope: person, instances:[<member backend>], person_scope) — only needed if the
    member gets their own store; (5) render + deploy: scripts/ada/render-memory-banks.py
    --host idc03, restart the member''s ada-<instance>; (6) access: add member email
    to the node''s CF Access app; (7) store bootstrap creds in ~/.config/secrets/<node>-bootstrap.env.
    Cross-store memory query needs NO extra plumbing — widen the person''s `allow`
    list and recall fans across all allowed banks.'
