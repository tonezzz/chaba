id: member-user-onboarding
title: 'Standard procedure: adding a user to a member node (memory isolation model)'
column: done
priority: high
note: 'DONE 2026-10-09: Mr. Nhong added to kk-ha as member (system-users), login `nhong`
  works, person.nhong entity bound to his user. Memory model: isolation is by POLICY,
  not storage — banks are MDDB collections on idc03; each ada-<instance> backend serves
  only banks whose `instances:` list contains its instance id; within a session, person_policies/control_policies
  whitelist which banks/tools the identity may touch. Cross-store query = the identity''s
  `allow` list fans over multiple banks. Unlisted identities fall to `default` ([general,
  home]) — restricted by default.'
