    root. p5 unmounted again. Online is technically possible because p5 is unmounted and p7 is mounted: delete p5,
    grow p7 into contiguous gap+p5, then online resize2fs. But '
- at: 2026-10-25 08:54
  from: devin
  text: 'SAFETY PREP COMPLETE: tony-usb /dev/sda2 mounted then unmounted cleanly. Copied GPT backup + current sfdisk
    dump + SHA256SUMS to /mnt/omen-usb/omen-partition-safety-20261025. Also archived the entire read-only p5 old
    root (3.2G) to p5-old-root.tar and SHA256; p5 unmounted again. No partition table/filesystem changes made. Ready
    for offline rescue procedure.'
- at: 2026-10-25 09:04
  from: devin
  text: 'SWAP/HIBERNATION ASSESSMENT: Omen has 16G /swapfile + 32G /data/hibernate.swap = 48G configured swap; current
    swap use ~40G. hibernate.swap is referenced by /etc/fstab and resume=UUID/offset in GRUB + initramfs, so hibernation
    is still configured even though hibernate.target is inactive. Do NOT delete while live: first reboot normally
    to clear stale swap, then verify memory/swap; disable hibernate via systemd sleep drop-in + remove resume config,
    remove hibernate.swap from fstab, swapoff/remove '
