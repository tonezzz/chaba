  text: 'Tony tested voice-clone flow 2026-10-12: his TG sample (voice corpus tg/tony/20261011-060800.ogg) transcribed
    via Gemini REST (มีอะไรผิดพลาดเหรอ) and re-voiced — but Gemini TTS prebuiltVoiceConfig has NO cloning, so the
    reply is her configured voice, not his. Options: (1) Coqui XTTS-v2 self-hosted — free, ~2GB model, CPU-ok on
    idc03/dell, zero-shot from a 6s sample; (2) ElevenLabs instant clone — best quality, spend gate; (3) Minimax/other
    clone APIs. Pipeline around it already exists: tts.py sy'
