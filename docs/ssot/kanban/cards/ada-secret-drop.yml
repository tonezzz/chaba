id: ada-secret-drop
title: Kanban secret-drop — deposit keys when Ada is down
column: done
priority: medium
autonomy: t2
kind: ops
description: When Ada voice/chat is dead (e.g. Gemini dunning 1008, 2026-10-11), the normal "ask Ada to swap a key"
  loop is broken — the operator must ssh by hand. Add a tailnet-authed drop zone on the board (/apps/board2/) where
  Tony pastes a fresh API key; board-api writes it to ~/.config/secrets/ada-paid or ada-free on idc03 (via a small
  receiver — NOT stored in the card YAML or git), then runs scripts/ada/ada-key-swap.sh.
acceptance:
- drop UI on board2 (masked input, paid|free target select)
- receiver on idc03 writes ~/.config/secrets/<target> 0600 — key never touches the card file, comms, or git
- tailnet-identity-gated (same Tailscale-User-Login header rule as board-api writes); anonymous = 403
- after write, ada-key-swap.sh <target> runs and its `test` result is posted to the card comms
- drop itself logged as a card comms entry (target + who, never the key)
notes:
- 'manual procedure meanwhile: put key in ~/.config/secrets/ada-{free,paid} on any host, run scripts/ada/ada-key-swap.sh
  free|paid|test'
