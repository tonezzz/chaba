id: ada-secret-drop
title: Secret-drop — secure secrets input on Ada chat + secrets-hygiene standard
column: backlog
kind: feature
priority: high
autonomy: t1
created: '2026-10-09'
updated: 2026-10-09 15:26
tags:
- security
- ada-chat
- secrets
- standard-procedure
brief: 'Sensitive values (API keys, tokens) currently travel via chat text, LINE, or manual ssh edits — transcripts,
  memory banks, kanban comms, and logs all capture them. One leak in a transcript sync = a real incident. Two-part
  fix: (a) a product surface — a "secret drop" control on the Ada chat card that delivers a secret to the right
  host''s secrets dir without ever entering the conversation; (b) a written secrets-hygiene standard procedure.

  '
spec: "PART A — secret-drop UI (ada-chat-card + ada backend, ada-pi repo):\n1. ada-chat-card.js: add .acc-secret\
  \ button + modal — fields: target host\n   (dropdown: idc03/tony-dell/tony-omen/idc02), secret name (validated\n\
  \   [a-z0-9._-]+), value (type=password, autocomplete=off, no echo).\n   Submit posts to a backend endpoint; UI\
  \ shows only the receipt\n   (path + sha256 first8), never the value.\n2. Backend endpoint POST /api/secret-drop\
  \ on ada-pi: accepts\n   {host, name, value}; writes ~/.config/secrets/<name> on THIS host\n   with 0600 (ssh\
  \ delivery to other hosts out of scope for v1 —\n   idc03 is the primary target anyway); returns {path, sha8}.\
  \ MUST\n   NOT log the value (no access log body, no tool transcript).\n3. Auth: reuse the existing ada-chat key\
  \ auth — only paired keys may\n   drop secrets. Rate-limit to ~5/hour.\n4. Compliance tests: after a drop, grep\
  \ the session transcript +\n   ops-events + journal for the value — must be absent everywhere.\nPART B — secrets\
  \ hygiene standard (docs/ssot/ or docs/kb/):\n1. Transport rule: secrets only via secret-drop UI or direct file\n\
  \   edit on the target host. NEVER via chat/LINE/kanban comms/git.\n2. Detection: a periodic grep-canary for key\
  \ patterns (sk-*, AIza,\n   xoxb, cfut_, ghp_) across comms, focus-inbox, transcripts —\n   findings file an incident\
  \ card.\n3. Incident rule: any secret found in a durable text surface =\n   rotate immediately, then scrub.\n\
  4. Rotation inventory: which keys live where (per-host secrets dir\n   listing without values — a metadata-only\
  \ audit script).\n"
