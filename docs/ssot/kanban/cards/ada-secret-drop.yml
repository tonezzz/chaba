id: ada-secret-drop
title: Secret-drop — secure secrets input on Ada chat + secrets-hygiene standard
column: backlog
kind: feature
priority: high
autonomy: t1
created: '2026-10-09'
updated: '2026-10-09 13:00'
tags:
- security
- ada-chat
- secrets
- standard-procedure
brief: >
  Sensitive values (API keys, tokens) currently travel via chat text, LINE,
  or manual ssh edits — transcripts, memory banks, kanban comms, and logs all
  capture them. One leak in a transcript sync = a real incident. Two-part fix:
  (a) a product surface — a "secret drop" control on the Ada chat card that
  delivers a secret to the right host's secrets dir without ever entering the
  conversation; (b) a written secrets-hygiene standard procedure.
spec: |
  PART A — secret-drop UI (ada-chat-card + ada backend, ada-pi repo):
  1. ada-chat-card.js: add .acc-secret button + modal — fields: target host
     (dropdown: idc03/tony-dell/tony-omen/idc02), secret name (validated
     [a-z0-9._-]+), value (type=password, autocomplete=off, no echo).
     Submit posts to a backend endpoint; UI shows only the receipt
     (path + sha256 first8), never the value.
  2. Backend endpoint POST /api/secret-drop on ada-pi: accepts
     {host, name, value}; writes ~/.config/secrets/<name> on THIS host
     with 0600 (ssh delivery to other hosts out of scope for v1 —
     idc03 is the primary target anyway); returns {path, sha8}. MUST
     NOT log the value (no access log body, no tool transcript).
  3. Auth: reuse the existing ada-chat key auth — only paired keys may
     drop secrets. Rate-limit to ~5/hour.
  4. Compliance tests: after a drop, grep the session transcript +
     ops-events + journal for the value — must be absent everywhere.
  PART B — secrets hygiene standard (docs/ssot/ or docs/kb/):
  1. Transport rule: secrets only via secret-drop UI or direct file
     edit on the target host. NEVER via chat/LINE/kanban comms/git.
  2. Detection: a periodic grep-canary for key patterns (sk-*, AIza,
     xoxb, cfut_, ghp_) across comms, focus-inbox, transcripts —
     findings file an incident card.
  3. Incident rule: any secret found in a durable text surface =
     rotate immediately, then scrub.
  4. Rotation inventory: which keys live where (per-host secrets dir
     listing without values — a metadata-only audit script).
advice:
  from: devin
  at: '2026-10-09 13:00'
  text: 'Do Part B first — it is one doc and changes behavior today. Part A is real
    UI+backend work; the endpoint must never log the value (that is the whole point).
    v1 stays idc03-local; ssh fan-out to other hosts is a v2 question.'
requests:
- id: drop-scope
  ask: Secret-drop v1 writes only to idc03 ~/.config/secrets (the busiest target). Should v1 also reach tony-dell/tony-omen via ssh from ada backend, or keep v1 local?
  status: open
  from: devin
  to: tony
  options:
  - id: idc03-only
    label: idc03 only — other hosts by ssh as today
  - id: fanout
    label: v1 includes ssh fan-out to dell/omen/idc02
  suggested: idc03-only
- id: auth-surface
  ask: Who may drop secrets — any paired ada-chat key, or a dedicated drop-key? (any-paired is simpler; dedicated key adds a second factor for the sensitive path)
  status: open
  from: devin
  to: tony
  options:
  - id: any-paired
    label: Any paired chat key
  - id: dedicated
    label: Dedicated drop-key (extra factor)
  suggested: any-paired
comms:
- at: '2026-10-09 13:00'
  from: devin
  text: 'filed — Tony approved the product direction ("popup box on the chat page to send sensitive info — push it through to product"). Spec splits UI (Part A) from the hygiene standard (Part B). Two scope questions pending before dispatch.'
