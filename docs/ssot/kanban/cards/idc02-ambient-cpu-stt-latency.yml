spec: 'Found during local-stt-lane-eval re-run 2026-10-23: idc02 now runs persistent CPU tenants (open-jev gemma-3-4b-it
  ~14% CPU steady since Oct-08, mddbd ~14%, ~25 podman containers) plus transient bursts (journalctl at ~95%). qwen3-asr
  warm TTT on ada-stt (:8914) is now ~7-12s for 3-8s clips (RTF 2-3) vs ~0.5-0.7 RTF quiet-window / ~3-4s Oct-16.
  Options: (a) CPU affinity/priority for ada-stt (nice -5 or cpuset), (b) threads=3 to leave headroom, (c) accept
  as batch-lane latency, (d) move STT to a quieter host. Measure quiet vs busy RTF before choosing.'
