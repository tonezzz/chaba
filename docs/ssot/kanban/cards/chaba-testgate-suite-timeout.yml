id: chaba-testgate-suite-timeout
title: chaba merge test gate (240s) can't fit the pytest suite — dispatch merges held on timeout
column: backlog
updated: 2026-11-15 17:13
brief: dispatch_repos.py REPO_TESTS['chaba'] gate = python3 -m pytest tests -x -q @240s, but the suite (122 test
  files) runs >>1h on tony-omen — every chaba dispatch merge holds on 'suite timeout'. Observed 2026-11-15 holding
  dispatch/20261113-201329-per-docs-kb-ncm-jev-nest-explo (NCM P0 packet). CI has no pytest job, so this gate is
  the only suite runner.
priority: high
tags:
- infra,test-gate,dispatch
spec: 'Fix the chaba merge test gate so it can actually pass: options (a) raise timeout to measured suite duration
  +margin, (b) run a fast subset (-k smoke or tests/board only) at merge time with full suite on a schedule, (c)
  pytest-xdist if available, (d) mark chaba command None and rely on CI. Measure real suite duration first (probe
  running 2026-11-15). Also check why suite is so slow — possible pathological test.'
ref: OPS-0127
