  from: tony
  text: card captured via board-api
- at: 2026-11-15 17:13
  from: devin
  text: 'confirmed 2026-11-15: suite still running >35min at ~57% CPU when probe killed after merge landed manually
    (branch was test-neutral). Suite is orders of magnitude over the 240s gate — every chaba dispatch merge will
    hold until this is fixed. First known victim: ncm-jev-p0 (landed manually as efc1503e89).'
- at: 2026-11-15 17:56
  from: devin
  text: 'FIXED (gate side) 2026-11-15: chaba gate now runs a 12-file merge-smoke set (~60s, 212 tests) instead of
    the full suite — commit 60dd1cc796 on master. Added _prune_missing_test_paths so explicit-path gates degrade
    to ''tests'' in fixture/minimal repos. Residual scope: (a) 3 pathological files still slow — test_kanban_dispatch_rails
    ~300s, test_queue_starvation ~370s, test_executor_contract >300s (real network/subprocess probes — need mocking
    or scheduled runner); (b) no scheduled full-suite job ex'
- at: 2026-11-17 18:02
  from: devin
  text: 'BOTH residual items done 2026-11-17 (commit d62b368949 on master): (a) slow tests fixed — rails 299s->0.2s
    (lesson-primer env-gated; integration covered by test_build_task_regressions), queue_starvation 370s->2s + executor_contract
    >300s->2.3s (kanban-dispatch main() was running real render-board.py per mutation — RENDER no-op''d in harnesses;
    one direct start_pending call env-gated). (b) scheduled full-suite runner live: chaba-pytest-suite.timer on
    tony_omen, nightly 03:30, 2h cap, first run ton'
