spec: 'Fix each, verify with a manual service run, comment evidence on the linked timer-alert-* cards:

  1. focus-dispatcher-overnight — script bug: SSOT validation output says ''Valid files: 2090, errors: 0, All SSOT
  files are valid'' then the script aborts with ''[overnight] aborting: SSOT validation failed''. It treats a pass
  as fail (grep bug or warnings-as-errors). Find the script, fix the parse.

  2. michael-dev-parity — unhandled websockets ConnectionClosedOK (1000) crashes the mirror-sweep audit. Catch the
  close, exit clean.

  3. ada-gh-runs-watch — ''gh run list tonezzz/chaba'' timed out after 60s, service killed on timeout. Check gh
  connectivity/auth from omen (gh auth status); if API is just slow, raise the gh timeout and/or make a single failed
  poll non-fatal.

  4. ada-pi-orch-bench — killed status=15/TERM on service timeout (Mon 04:30). Check how long the bench legitimately
  takes; raise TimeoutStartSec or split the suite.

  Linked cards: timer-alert-tony-omen-{focus-dispatcher-overnight,michael-dev-parity,ada-gh-runs-watch,ada-pi-orch-bench}.'
