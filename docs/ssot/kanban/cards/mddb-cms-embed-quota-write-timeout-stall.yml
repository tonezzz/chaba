- at: 2026-11-19 13:57
  from: devin
  text: 'Follow-up code defense implemented and tested 2026-11-19 in mddb-fork branch fix/embed-enqueue-breaker-open,
    commit 4ac66b83: Enqueue fast-drops (counted/reindexable) when breaker is open, instead of waiting 30s for queue
    space that cannot free during cooldown. Regression test added; embedding-related suite passed. This is NOT the
    larger async-ack design and has not been merged/released/deployed. Requires upstream merge + image build/rollout.
    CMS plane itself migrated to bge-m3, reducing quota e'
