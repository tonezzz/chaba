id: mddb-cms-embed-quota-write-timeout-stall
title: mddb-cms /v1/add stalls 30s+ when embed providers quota-capped — fleet-wide write timeouts
column: done
updated: 2026-11-25 17:38
priority: high
tags:
- mddb
- mddb-cms
- embed
- idc03
- quota
spec: 'Observed 2026-11-19 ~05:00-07:30 ICT on idc03: gemini-ollama-proxy reported all embed legs down (OpenRouter
  daily-cap 5000, free Gemini circuit open, paid hourly-cap 150). mddb-cms embedding queue filled to 4000; every
  /v1/add blocked ~30s on embed wait then exceeded MDDB_HTTP_WRITE_TIMEOUT (30s) — handler logged "response not
  delivered" and closed the connection. Every CMS-plane writer saw RemoteDisconnected (nest-mgr tick errors every
  ~2min for ~2h; writes still landed). droppedTotal >6000 docs written without vectors — needs POST /v1/vector-reindex
  after recovery. Structural fixes to consider: (a) decouple write ack from embed enqueue — accept doc, embed async
  without holding response; (b) raise MDDB_HTTP_WRITE_TIMEOUT or lower per-doc embed wait when queue is saturated;
  (c) embed-free-lane budget alerting before caps hit; (d) confirm embed-pool-shim fast-fail backlog card covers
  dead-leg latency. Verify current state: queue drained by 08:25, no write-timeouts in last 15min, but embed jobs
  still failing with provider 502s.'
ref: MEM-0217
