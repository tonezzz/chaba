brief: 'Tony wants Ada inside the same loop we just found: inspect card → ask → educate each other. This card defines
  how far she may go on her own and how we measure readiness. Expected action: review the tier table below; T0–T2
  need no approval (mechanisms exist), T3+ gates on bench scores.'
note: 'Tony 2026-10-07: "I like it when Ada tries to reach me in any way she can. Keep this going, because to be
  fair I''d do the same if she lost contact. That''s for you too — all of us as a team." Mutual-contact is a team
  value, bidirectional: any teammate who loses the channel escalates through whatever path remains (board request
  → HA notify → OpenClaw → Telegram → ntfy), and we do the same for them.'
