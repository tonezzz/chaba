spec: "Participation tiers for Ada on the kanban loop:\n  T0 observe  — answer \"what's this card / what's running\"\
  \ from live state\n                (already possible via MDDB reads; needs card-summary tool\n               \
  \ or CMS board mirror access)\n  T1 comment  — post comms notes with evidence (\"this alert is stale —\n     \
  \           service healthy now\"). Low risk; she often sees live\n                state first.\n  T2 request\
  \  — raise card `requests` to Tony (mechanism exists in\n                board-api; push notification already\
  \ wired via\n                board_notify → OpenClaw/HA/ntfy debounce)\n  T3 queue    — propose/queue card actions.\
  \ GATED: needs card-judgment\n                bench score above threshold.\n  T4 act      — perform card work\
  \ herself. Future / micro-entity scope.\n\nEducate-vs-educated standard (generalizes the existing\neducation_correction\
  \ scenario): whoever holds fresher VERIFIED state\neducates. Ada educates when she has live probe evidence; she\
  \ gets\neducated when asserting from stale memory — every correction becomes a\nbench corpus case so regressions\
  \ surface in the hourly scenario.\n\nBenchmark: extend nest-bench with a card-judgment domain — historical\ncards\
  \ with known-good outcomes; score whether the entity's proposed\naction matched what proved right. Metrics: correction-precision,\n\
  correction-recall, appropriate-deference (defers on opinion questions),\naction-accuracy. T3 unlocks at a declared\
  \ threshold.\n\nReach-out escalation ladder (mutual): board request → HA notification\n→ OpenClaw → Telegram →\
  \ ntfy. If a channel dies, escalate to the next —\nsilence is never acceptable when something needs Tony."
