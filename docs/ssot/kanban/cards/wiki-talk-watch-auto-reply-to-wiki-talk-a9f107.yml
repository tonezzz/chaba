spec: "Supersedes manual card wiki-talk-q-a-loop-watch-talk-pages-jevt-35d318 (procedure spec there). Build the\
  \ auto-reply loop end-to-end.\n\nDELIVERABLES:\n1. scripts/wiki/wiki-talk-watch.py — new watcher (template: scripts/report/report-watch.py).\
  \ Modes: default run; --dry-run prints candidates, writes nothing.\n   Poll: GET api.php action=query&list=recentchanges&rctype=edit|new&rcnamespace=1|3|5|7|9|11|13|15|3001|3003|3005|3007&rcend=<watermark>&rcprop=title|ids|timestamp|comment&rclimit=50\
  \ on wiki.surf-thailand.com. Watermark = max rcid seen, stored ~/.local/state/wiki-talk-watch/last-rcid; idempotent\
  \ reruns.\n2. Classify v1 (JevTeam stand-in — real JevTeam lanes still under construction): LiteLLM call to gemini-3.5-flash-lite\
  \ via the gateway pattern used by board-api /lesson Thai translation (scripts/board/...). Output: lane=ada-code\
  \ | no-response. Skip own-bot comments (user=Ada) and minor/system edits.\n3. Respond: draft reply via opencode\
  \ headless (reuse card-run.py --execute invocation pattern in scripts/board/) -> POST action=edit&section=new&appendtext\
  \ via ada bot creds (~/.config/secrets/wiki-h3-gizmo.env on idc03), signed '— Ada (<lane>) ~~~~~'. GUARD: reply\
  \ visibility must match namespace protection — never put inhouse/Infrastructure/PrivateNews content on public\
  \ talk pages; members-ns comments get members-level replies only.\n4. Job registration: ssot.jobs.yml entry —\
  \ systemd user timer on idc03, every ~15min OFFSET from kanban-commit (flock contention); unit wiki-talk-watch.timer.\n\
  5. Failures -> focus-inbox flag (report-watch dedupe-by-slug pattern), no blind retries.\n\nACCEPTANCE (verify-by-surface):\
  \ post a fresh comment on a sandbox talk page (e.g. Education_talk on a test page) -> next timer tick drafts +\
  \ posts a signed reply without human action; anon still denied on protected ns; --dry-run clean.\n\nContext: Tony\
  \ drops questions on wiki talk pages expecting the agent fleet to answer. First manual reply already posted on\
  \ Education_talk:Ada-Ocb-Card-Runner as precedent (rev 243)."
