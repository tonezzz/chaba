id: weather-bakeoff-ha-config-bounded-retry
title: Bounded retry for weather-bakeoff HA /api/config fetch (kraut-rain-watch repeat)
column: backlog
updated: 2026-11-27 18:22
brief: Fix weather-bakeoff.py http_json transient HA reset with bounded retry + tests; code only, no deploy.
priority: high
tags:
