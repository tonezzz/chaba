note: 'Root fix for mddb-follower-stall. Diagnosed 2026-10-06: follower''s replicate() loop calls stream.Recv()
  with no deadline and the stream has no heartbeat — a silently-dead stream (leader send goroutine blocked, DERP
  half-open, TCP blackhole) blocks Recv forever with connected=true and zero log output. Only a restart recovers.
  Self-heal watchdog (mddb-watchdog.timer on idc02) mitigates in the meantime.'
spec: 'In services/mddbd: (1) LEADER — emit a lightweight heartbeat entry on StreamBinlog every ~15s when no real
  entries flow (new msg field or periodic empty commit marker; must not advance LSN). (2) FOLLOWER — wrap stream.Recv()
  in replicate() with a waitable deadline ~3x heartbeat interval (e.g. context.WithTimeout per Recv, or grpc WaitOnReady
  + deadline on the stream ctx): on timeout, log ''replication heartbeat timeout'' and return the error so loop()
  reconnects. (3) Expose heartbeat/last-recv state in /v1/replication/status so a frozen-but-connected stream is
  distinguishable. (4) Add a regression test: fake stream that goes silent must trigger reconnect within the deadline.
  Constraints: no LSN pollution from heartbeats; idc02 follower (image 2.15.4-lsn) must keep applying against the
  current leader without a snapshot reset.'
