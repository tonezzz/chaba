  merged).


  Scope:

  1. idc02: `opencode serve --hostname 0.0.0.0 --port 4096` is running outside OpenChamber. Determine its launch
  path (systemd unit? manual? container?) and inject OPENCODE_CLAUDE_PATH=/home/tony/CascadeProjects/tony-projects/claude-code/node_modules/.bin/claude
