  install + claude auth; install.sh first if missing, then `claude auth login` needs Tony (interactive OAuth) unless
  setup-token is used.

  2. Confirm whether idc02 opencode is even meant to serve model sessions (it may be a relay/worker) — if not user-facing,
  document and close.

  3. Re-run `openchamber-wire.sh --check` on tony-dell periodically / after openchamber updates; script is the standard.


  Out of scope: LiteLLM lane, other hosts (no OpenChamber/opencode found on omen, idc03, mn01, macs).'
