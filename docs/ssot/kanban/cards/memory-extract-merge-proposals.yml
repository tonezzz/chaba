id: memory-extract-merge-proposals
title: Weekly extract→canonical merge proposals (recommend-mode) for Ada memory banks
column: doing
updated: 2026-11-18 21:38
brief: Surface probable canonical updates hidden in extract drafts as reviewable proposals — never auto-write. Builds
  on memory-distill + consolidate-memory; closes the ADA-0478 leg-3 gap without giving up the human review gate
  on memory writes.
priority: medium
program: ai-workforce
tags:
- ada-memory
- memory-banks
- distill
