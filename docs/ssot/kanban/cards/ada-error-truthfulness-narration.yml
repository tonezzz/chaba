brief: 'kk-ha session 183e9c8d7e (2026-10-13 23:17 ICT, Tony) showed the pattern: (1) ada_enroll_speaker SchemaError
  narrated as ''never mind'' instead of ''the enroll call was rejected''; (2) Gemini stream died and reconnected
  resumed=False — full context wipe, never said aloud — which directly caused the next failure (she forgot she''d
  already found+offed the coffee plug); (3) web_search fired with {} args (SchemaError) narrated as ''can''t find
  the data''. SchemaError results already carry a `usage` hint — she ignores it.'
