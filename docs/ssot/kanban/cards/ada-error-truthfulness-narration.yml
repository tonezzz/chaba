spec: 'Session evidence (idc03 journal, session=183e9c8d7e, ada-kk 23:17-23:20 ICT 2026-10-13):


  - 23:17:41 web_search args={} -> SchemaError missing ''query''. She said ''can''t find gold price data'' — hid
  that the call never ran.

  - 23:18:41 ada_enroll_speaker args={person:''person.tony'', who:''speaker''} -> SchemaError missing ''name'',
  unknown ''person''. Narrated as ''just wanted to say never mind''.

  - 23:19:17 provider stream ended 1000; 23:19:23 reconnect resumed=False -> context wiped silently; she then contradicted
  herself on the coffee plug.

  - ada_memory_search returned degraded:true — never mentioned.


  Do:

  1. Narration rule in the persona/system instructions (ada-pi + Ada parity where she mirrors): every tool result
  with ok:false/error/degraded:true MUST be said aloud in plain terms — what was attempted + why it failed, in one
  clause, then continue. Never ''never mind''. If the call was malformed, say ''I made a bad call, retrying'' and
  RETRY with corrected args (the SchemaError `usage` field tells you the shape).

  2. On provider reconnect with resumed=False, say aloud that the connection reset and recent context may have been
  lost. Where the resume path exists, prefer it.

  3. SchemaError retry policy: same-tool retry with corrected args is allowed ONCE per turn (bounded — no retry
  storms); second failure narrates the real error.

  4. HYPOTHESIS TO CHECK: empty-args/wrong-arg calls on kk lane (web_search {}, enroll_speaker {person:...}, earlier
  trip_calendar {}) may be the lazy-schema arg-shape regression — cold tools strip parameter schemas so the model
  guesses args. If lazy decls are confirmed as cause, prefer the known fix (retain arg NAMES/property keys in lazy
  declarations, drop only types/enums) and note it; if this session predates lazy schemas being active on ada-kk,
  say so.

  5. Verify: add/extend a scenario (tests/scenarios-live/) that injects a tool failure (e.g. enroll_speaker with
  bad args on a dev lane) and asserts the reply narrates the failure (response_contains_any covering ''fail|error|couldn\''t|ล้มเหลว|ไม่สำเร็จ'').
  Run it on kk-dev if Gemini cap allows, else describe the harness check.


  Report: which instructions file(s) changed, whether lazy-schema was the arg-shape cause, scenario name + result.'
