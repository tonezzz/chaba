id: ada-ocb-manual-queue-semantics
title: 'Ada-OCB: distinguish manual queue items from dispatchable work'
column: done
updated: 2026-11-25 17:02
brief: The Ada-OCB queue picker labels queued action.type=manual cards as queued for dispatch, while board runners
  reject them as unsupported. Make the response accurately identify human-only work without changing card state
  or inventing an executor.
priority: low
tags:
- ada
- opencode
- kanban
- queue
- read-only
spec: Fix the Ada-OCB read-only card picker response for queued manual actions. Preserve manual cards as selectable
  for context/planning if appropriate, but label them as human-only and not runner-dispatchable; do not describe
  them as queued for dispatch. Keep non-manual queued-card behavior unchanged. Preserve selection-token and native-confirmation
  gates. Add unit tests for manual and non-manual queue picks. Do not modify the board state of ADA-0783 or invent
  its missing brief/spec; no dispatch, queue/claim/close/move, provider call, or deployment. Done when tests verify
  the distinction and the returned response has no misleading dispatch claim.
ref: ADA-0189
