id: mddb-embed-providers-down
title: MDDB embedding outage — OpenRouter key limit + Gemini quota both dead
column: backlog
priority: high
note: 'gemini-ollama-proxy on idc01 reports all same-space providers down: OpenRouter 403 "Key limit exceeded (total
  limit)" (breaker circuit-open) + Gemini direct 429 quota. Docs still store (adds land) but every /add burns ~25-60s
  on failed embed retries and vectors are dropped — embed queue full (4000), droppedTotal >2900. cam-wall-cms and
  roster-audit services fail each cycle on the resulting slow adds. embed-probe canary firing every 15min. Needs
  an account-side fix — client timeouts alone won''t cover it.'
updated: 2026-10-05 11:06
requests:
- id: provider-fix
  ask: 'Embedding upstream is down: raise/reset the OpenRouter key total limit (403), or wait for the Gemini daily
    quota reset — which path do you want?'
  status: open
  options:
  - id: or-limit
    label: Raise/reset OpenRouter key limit (account-side)
  - id: wait-gemini
    label: Wait for Gemini quota reset; OR stays down meanwhile
  - id: other-provider
    label: Point the proxy at another same-space embed provider
  answer: null
comms:
