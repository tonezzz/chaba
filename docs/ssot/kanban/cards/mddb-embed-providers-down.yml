  from: devin
  text: 'Filed while finishing the cam01-rename CMS work: every mddb /add retries embeds ~25-60s then often drops
    ("Remote end closed"), so cam-wall-cms.timer runs keep failing. Raised mddb_add/http_json timeouts 30s/15s->120s
    (commit 0858b5e5) which helps marginally, but the root cause is upstream. Recovery note: restarting mddb.service
    after providers are back should reindex missing vectors (reindex skips docs whose stored vector hash matches).'
