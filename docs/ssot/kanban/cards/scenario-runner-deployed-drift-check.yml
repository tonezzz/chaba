  repository is chaba. Constraints include preserving the copy-on-install isolation design while closing the detection
  gap that caused undetected exit-code alerts during recent weekly runs. The testable done-condition is a verified,
  automated drift check running on idc03 that flags any divergence between the installed scenario runner script
  and the repository version.
