spec: 'Each ada_render_video call should land one render_job post on WP boards so renders are visible + cost-trackable.
  Plugin v0.3.1 is live: render_job now carries kind=video + video meta (secs/aspect/res/ref_url/operation/est_cost_usd/parent_job/chain_index).
  Implement in backend/tools.d/ada_render_video.py using backend/wp_client.py (create_post(..., post_type=''render_job''))
  — same auth as wp_post (wp-boards.env on the backend host). Fields: kind=''video''; title ''Render — {prompt-short}
  {YYYY-MM-DD}'' per title_standard; prompt, model, secs, aspect, ref_url, operation (Veo op name — resume dedup
  key), duration_s (wall-clock), host, backend=''veo'', status ok|error, output_url=video_url, source=''ada_render_video'',
  requested_by=lane/user if known, error msg on failure. est_cost_usd: published-price estimate from model+secs+probed
  res (veo-3.1-fast ~$0.10/s 720p, ~$0.12/s 1080p) — it''s an estimate, document it as such. Write on SUCCESS and
  on FAILURE (status/error meta). Best-effort: wrap in try/except, log only — WP write must never fail the render
  or block _finish. Skip silently when wp_boards env is absent on that host. Verify: tool-lint + pytest green via
  merge gate; add a unit test stubbing wp_client.create_post asserting the render_job payload shape.'
