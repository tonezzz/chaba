spec: 'Build a read-only OpenCode session audit equivalent to the Chaba Voice transcript audit. Use an audit marker
  and inspect every OpenCode session/event file in the window, not only the newest. Report per session: prompt/task
  turns, model/provider, tool calls, denied/error calls, write/delete/commit/push attempts, artifact paths and durable
  landing, claims without evidence, context/cache/input/output tokens, wall/step latency, retries, mixed-focus/context
  contamination, and safety flags. Cross-check session claims against filesystem/Git/board artifacts; never trust
  final prose alone. Produce JSON + Markdown report, update marker only after successful audit, and file one Kanban
  card per durable artifact miss or safety issue. Reuse evals/opencode-lane and evals/shadow artifacts where possible.
  Acceptance: audit current S1/S2 OpenCode sessions, reconcile the promotion ledger vs shadow benchmark discrepancy,
  report pass/fail evidence, and add a repeatable command/test. Read-only; no session deletion or model changes.'
