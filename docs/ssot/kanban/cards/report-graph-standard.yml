note: 'First report-watch sweep (2026-10-07) audited all 21 nodes against the layered-report contract and found
  systemic gaps: wrong status vocabulary use (unreachable-as-error), missing meta contracts on remote/dormant producers,
  cross-checkout meta writes, and a retired host still audited. Plan below applies the standard uniformly.'
spec: 'Sweep findings + standard to apply: (1) STATUS VOCAB finalized in ssot.reports.yml — ok|delta|error|stale|missing|unreachable|
  planned|remote|dormant; unreachable is target-side not producer-side. (2) NODE HYGIENE — retire audit-hosts/idc01
  (dead host, permanent delta noise; its rot is a decommission checklist item not standing signal); overnight-assessment
  health_snapshot probes retired idc01 — fold into the idc01 SSOT cleanup card (100+ refs across 15 files); systemwide-assessment
  needs ada-side meta emit + push-back contract. (3) CONTRACT — every producer writes own meta (run-node augments);
  observe:remote producers scp meta to served checkout (report-feed is the reference impl); offline_ok for hosts
  that legitimately go off-net; arg-required generators = dormant, exempt until first run. (4) CONVENTIONS — new
  timer/producer lands with its node+meta in the same commit; cadence is enforced by stale detection via report-watch.
  (5) CONSUMER — report-watch flags are the review queue; optional: auto-close healed items, --json for CI gate.'
