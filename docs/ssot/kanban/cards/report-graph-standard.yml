  (dead host, permanent delta noise; its rot is a decommission checklist item not standing signal); overnight-assessment
  health_snapshot probes retired idc01 — fold into the idc01 SSOT cleanup card (100+ refs across 15 files);
  systemwide-assessment needs ada-side meta emit + push-back contract. (3) CONTRACT — every producer writes
