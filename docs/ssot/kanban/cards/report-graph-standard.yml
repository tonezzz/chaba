  reference impl); offline_ok for hosts that legitimately go off-net; arg-required generators = dormant,
  exempt until first run. (4) CONVENTIONS — new timer/producer lands with its node+meta in the same commit;
  cadence is enforced by stale detection via report-watch. (5) CONSUMER — report-watch flags are the review
  queue; optional: auto-close healed items, --json for CI gate.'
