id: board-cli-request-ask-field
title: Fix board-cli request subcommand — posts 'text' but API expects 'ask'
column: backlog
updated: 2026-11-09 09:26
brief: 'board-cli.py request subcommand POSTs {text: ...} to /request, but do_request() reads body[''ask''] — every
  ''board-cli request'' returns HTTP 400 ''ask required''. Confirmed identical bug in dell and idc03 checkouts (line
  ~168). One-word fix in the payload dict. Requests meanwhile go via curl with ''ask'' — workaround proven 2026-11-09
  on rainy-day-spend-decisions.'
priority: medium
program: chaba-ci
tags:
