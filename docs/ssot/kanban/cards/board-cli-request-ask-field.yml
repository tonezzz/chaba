  text: card captured via board-api
- at: 2026-11-09 11:03
  from: devin
  text: 'Additional verified CLI mismatch during OPS-1255 approval recording: respond sends request_id/from/text
    but omits card id; API documents POST /respond {id,request_id,answer,from}. CLI respond returned HTTP 400. Direct
    /respond with id=opencode-lane-regraduation used as workaround. Include card-id routing in regression coverage
    along with request ask field; text remains accepted by do_respond.'
