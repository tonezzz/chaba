brief: 2026-10-09 audit — ada-flood-news.service on idc02 fetches the flood news fine (journal shows fresh items
  through 15:01) then exits status=2/INVALIDARGUMENT. The unit is rendered from ssot.jobs.yml — fix the job definition,
  not the generated unit. Fails every run.
