  \ a CLI arg/env problem in a later step\n(publish to CMS? report write?).\n\n1. ssh idc02, journalctl --user -u\
  \ ada-flood-news.service -n 50 —\n   find the actual error line AFTER the item listing (the tail shows\n   items\
  \ then exits 2 — the error may be on stderr interleaved).\n2. Find the job def in docs/ssot/infrastructure/ssot.jobs.yml\n\
  \   (job:ada-flood-news) and the script it runs.\n3. Fix in ssot.jobs.yml / the script; re-render the unit per\
  \ the jobs\n   pipeline (check how other job units get rendered — probably a\n   render script or restart regenerates).\n\
  4. Remove known_failed entry for ada-flood-news.service in\n   ssot.audit.hosts.yml when green.\nVERIFY: systemctl\
  \ --user start ada-flood-news.service exits 0 on idc02.\n"
