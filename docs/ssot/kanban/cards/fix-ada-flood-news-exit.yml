spec: |
  ada-flood-news.service on idc02 exits 2 after the fetch phase succeeds.
  status=2/INVALIDARGUMENT suggests a CLI arg/env problem in a later step
  (publish to CMS? report write?).

  1. ssh idc02, journalctl --user -u ada-flood-news.service -n 50 —
     find the actual error line AFTER the item listing (the tail shows
     items then exits 2 — the error may be on stderr interleaved).
  2. Find the job def in docs/ssot/infrastructure/ssot.jobs.yml
     (job:ada-flood-news) and the script it runs.
  3. Fix in ssot.jobs.yml / the script; re-render the unit per the jobs
     pipeline (check how other job units get rendered — probably a
     render script or restart regenerates).
  4. Remove known_failed entry for ada-flood-news.service in
     ssot.audit.hosts.yml when green.
  VERIFY: systemctl --user start ada-flood-news.service exits 0 on idc02.
