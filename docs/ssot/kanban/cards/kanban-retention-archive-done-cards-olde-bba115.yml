- at: 2026-11-08 13:20
  from: devin
  text: 'Archive implemented+deployed (PRs #120 #121, master b021c54143+): board-api /action do=archive gates on
    done+action.verified+age>7d, moves file to cards/archive/ (off-board, in git), commits both sides; 60s-cached
    archive index keeps /card/<id>+mutations resolvable. scripts/board/archive-done.py --apply is the sweep; chaba-kanban-archive.timer
    installed on idc03, daily 04:20. First sweep running now: ~240 candidates; occasional 60s timeouts under git-lock
    contention retry next run. Review/unveri'
- at: 2026-11-08 13:24
  from: devin
  text: 'First sweep COMPLETE: all 240 candidates archived to cards/archive/ (2 client timeouts were post-commit
    — files confirmed moved). cards.json now 1089 cards (was ~1329); Done ~810. Verified: /card/ada-acl-explain
    resolves archived card via index; render unaffected (non-recursive glob). Timer chaba-kanban-archive.timer armed
    daily 04:20+ jitter on idc03. Reversibility: git mv back or board-api comment on archived card still works.'
- at: 2026-11-09 20:22
  from: devin
  text: 'Extended 2026-11-09 (2049bf1d76): card cap. archive-done.py --cap 600 (default, daily timer unchanged):
    after the verified pass, archives oldest done cards >7d verified-or-not until board <= cap; never cards with
    unanswered requests; board-api do_archive takes cap=true. Reason: archive ran 0/day — only 4 of 864 done cards
    were action.verified. First sweep: 455 archived, 1 timeout; board 1193 -> 739 cards, cards.json 8.2MB -> 6.2MB.
    Follow-up KNB-1302 (compact payload + doing triage).'
