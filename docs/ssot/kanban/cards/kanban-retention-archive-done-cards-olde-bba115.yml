    archive index keeps /card/<id>+mutations resolvable. scripts/board/archive-done.py --apply is the sweep; chaba-kanban-archive.timer
    installed on idc03, daily 04:20. First sweep running now: ~240 candidates; occasional 60s timeouts under git-lock
    contention retry next run. Review/unveri'
