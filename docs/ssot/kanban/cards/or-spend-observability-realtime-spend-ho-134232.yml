spec: 'Tony: OR credits drain fast, wants per-call observability. Design: (1) LiteLLM success/failure webhook callback
  -> tiny receiver on idc03 appending spend-events.jsonl; (2) hourly OR /auth/key credits poller to expose gateway-bypass
  consumers (credit delta minus gateway spend); (3) near-realtime report page ''or-panel'' in ada-cms-pages (per
  key_alias x model x hour + unexplained-credit line), 15-min refresh timer; (4) burn-rate alert -> LINE push per
  budget-watch pattern. Done-condition: Tony gets a working URL showing realtime OR spend per consumer + unexplained
  credit leakage.'
ref: OPS-0044
