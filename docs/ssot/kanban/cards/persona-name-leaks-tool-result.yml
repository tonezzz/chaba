id: persona-name-leaks-tool-result
title: persona-name-leaks-tool-result
column: backlog
updated: 2026-11-14 14:10
brief: 'Shared tool-result wording leaks Ada into non-Ada lanes: realtime_provider.py:5326 returns Ada is now <expr>
  for set_facial_expression; openrouter_provider.py:414 same pattern. On mn/Kraut lane the model sees Ada is now
  neutral (idc03 journal 2026-10-17 14:51). Fix: use ADA_PWA_NAME default Ada in result text. Same class as TG_PERSONA_NAME
  relay fix.'
priority: medium
ref: OPS-0734
