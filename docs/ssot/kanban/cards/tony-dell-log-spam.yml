id: tony-dell-log-spam
title: 'tony-dell disk: log spam from update-cam-frame + mcp-link-monitor (~1.4G/day)'
column: done
updated: 2026-10-13 08:04
brief: 'dell / is 87% used, 16.1G free, growth 1.2GiB/day => ~13 days to full. Root cause found: /var/log grows
  ~1.4G/day — yesterday syslog.1=718M. Top talkers: update-cam-frame.service 176k lines/day (cam frame fetch on
  a very frequent timer, logs every activation) and mcp-link-monitor.service 10.5k journal lines/hour (~250k/day,
  currently activating state). Fix options: (a) StandardOutput=null or LogRateLimit on both user units — logs add
  no value per-run; (b) journald SystemMaxUse cap; (c) slow the cam timer. Recommend (a)+(b). Not auto-fixed: changing
  service logging on the prod host mid-session '
priority: high
ref: OPS-0530
