id: storage-deterministic-runner-safe-targets
title: Implement deterministic storage dry-run and guarded safe-cache cleanup
column: review
updated: 2026-10-26 13:31
brief: Turn the verified OpenCode storage dry-run into a deterministic report/apply runner; start with safe OpenCode
  cache targets only.
priority: high
program: chaba-ci
tags:
- storage
- cleanup
- safety
- opencode
- telegram
spec: Implement in the chaba repo a deterministic storage cleanup runner for tony-dell. Do not let an LLM delete
  files. Default mode must be dry-run and produce JSON + Markdown with df, target sizes, active writers/locks, protected-path
  checks, candidates, blockers, and verifier status. First apply-capable targets are exact paths ~/.cache/opencode
  and ~/.local/share/opencode only; do not include model-archive, ~/.cache subtrees, Devin sessions.db/WAL, containers,
  backups, worktrees, dispatch tasks, secrets, or Trash without a separate explicit policy approval. Apply mode
  must require --apply --confirm-cleanup, refuse when opencode processes are active, refuse symlink/path escapes,
  refuse protected paths, and report before/after/freed bytes/skipped items. Add tests for dry-run immutability,
  protected-path refusal, active-process refusal, and path containment. Add optional Telegram notification through
  existing board_notify tg channel, but do not send credentials or add a timer in this card. Run the dry-run on
  tony-dell, verify the artifact independently, and leave apply disabled until a human-reviewed report exists. Record
  rollback/disable instructions and link docs/ssot/infrastructure/ssot.cleanup.yml.
