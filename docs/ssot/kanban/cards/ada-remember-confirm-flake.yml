goal: Make the bank confirmation flow deterministic for the voice model and stop Ada narrating "บันทึกเรียบร้อยแล้ว"
  on NOT EXECUTED results.
evidence:
  session: 2026-10-07-56d2e4d167 (13:40–13:48 ICT)
  stats: 'ada_remember 8 calls: 2 ok, 6 NOT EXECUTED despite confirmed:true'
  detail: The gate rejects first calls with a bound confirm_token (cfm-*, 120s TTL). The model never replays with
    the token — it just resends confirmed:true, which sometimes passes and sometimes doesn't (flaky). Three "เรียบร้อยค่ะ
    บันทึกข้อมูลแล้วค่ะ" narrations rode on failed results; the Khun Nampu document-submission and photo-printing
    facts were claimed saved but never landed (only general/timeline and general/flood-relief got created). No phantom_write_claim
    ops event fired — detection gap too.
spec: 'ada-pi ada_remember confirm gate flake (evidence: voice session 2026-10-07-56d2e4d167, 13:40-13:48 ICT —
  6/8 writes returned NOT EXECUTED with confirmed:true resent instead of confirm_token, and Ada narrated "saved"
  on the failed results). In backend confirm logic: accept confirmed:true on a retry of identical (bank,subject,text)
  within the token window — that is the model''s actual behaviour — OR keep the token mandatory but make the rejection
  text instruct the exact replay arg (confirm_token=...) prominently. Also: when a result is NOT EXECUTED, the voice
  path must not narrate success — add a phantom_write_claim ops event when the model claims a write after a failed
  result (see transcript-mine-confirms signal). Add a scenario asserting confirm_token replay works end-to-end.'
fix_options:
- Accept confirmed:true on retry of identical content within the token window (what the model already does), OR
  make the token path the only path and inject the token into the transcript-visible instruction so the model echoes
  it back.
- Suppress/override narration on NOT EXECUTED results server-side, or flag phantom_write_claim ops events when Ada
  says saved|เรียบร้อย after a failed write (mine transcript mine-confirms signal).
