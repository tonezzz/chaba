spec: 'In ada-voice opencode/ada_mcp.py add ada_ssot_get (or equivalent) accepting collection + canonical key/doc
  id/path and optional selector such as host=tony-macbook. Resolve through MDDB /get or deterministic doc lookup;
  return exact structured values plus provenance and mutations_performed=[]. Update OpenChamber/Ada guest instructions:
  search/discovery first via ada_context_pack, then call ada_ssot_get for the exact key/block. Verify "find the
  spec of tony-macbook from ssot" returns concrete cpu/memory/disk/tailnet/role values, not only document titles.
  Keep read-only boundaries; no household/personal memory banks.'
