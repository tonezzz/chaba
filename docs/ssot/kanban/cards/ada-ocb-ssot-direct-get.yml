id: ada-ocb-ssot-direct-get
title: 'ada-ocb: direct SSOT get for exact host/spec lookups'
column: doing
updated: 2026-11-17 18:40
brief: OpenChamber/Ada finds the right SSOT docs via ada_context_pack but still answers with excerpts/metadata instead
  of exact values. Add a bounded read-only direct-get path so once a canonical SSOT key is discovered the agent
  can fetch the exact document/block instead of issuing repeated broad semantic searches.
priority: high
program: ai-workforce
tags:
- ada
