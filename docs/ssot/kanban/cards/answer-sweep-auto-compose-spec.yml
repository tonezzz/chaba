id: answer-sweep-auto-compose-spec
title: 'Answer-sweep auto-compose: raise consolidated spec request when all asks answered (KNB-0180 option 2)'
column: backlog
updated: 2026-11-25 17:12
brief: 'Phase 1 of KNB-0180 option 2: when every open request on a card is answered/executed and the card still
  lacks a dispatchable spec, answer-sweep raises ONE consolidated spec request with the answers inlined — detection
  + raise only, no auto-queue. Spec: docs/ssot/jobs/kanban/2026-11-19-answer-sweep-dead-letters.yml'
priority: medium
tags:
- board
- answer-sweep
- kanban
spec: 'Parent spec: docs/ssot/jobs/kanban/2026-11-19-answer-sweep-dead-letters.yml (option 2_auto_compose_spec).
  Phase 1 scope: detect the state in answer-sweep.py (all requests answered/executed, awaiting_action still set,
  action.type=dispatch but no spec/prompt), raise a single consolidated request {id: spec-compose-<date>} listing
  the answered asks+answers, mark it so it does not re-raise. Do NOT auto-arm dispatch — spec quality bar unresolved.
  Phase 2 (template composition for repo+host-unblock pattern) is a later card. Tests in tests/board/test_answer_sweep.py.'
action:
  type: manual
ref: KNB-0243
