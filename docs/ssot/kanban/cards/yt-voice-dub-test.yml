note: >-
  Extends the yt-live subtitle pipeline. Steps: reuse cached media + VTT
  cues from ~/.cache/yt-live-media|subs, edge-tts per cue -> mp3, stretch
  to cue window, mix dub over ducked original (~20%) via ffmpeg, output to
  stacks/web/public/apps/yt-live/, cast via yt-live-api :8791. Also:
  yt-live.sh + yt-vtt-translate.py live in ~/.local/bin with no repo home —
  move to scripts/ while in there.
help: >-
