spec: 'Cherry-picked Ghost features for chaba-cms — MDDB stays the store, agents stay primary authors. NO Ghost,
  no editor UI, no new DB.


  Decisions locked with Tony (2026-10-14):

  - Hostname: cms.surf-thailand.com (new caddy edge block on idc02)

  - Digest: PER-MEMBER LINE pushes, not a family group — ''kk-ha is an office, not a home''; recipients resolved
  from member/person registry

  - Entire site behind CF Access for now (no public pages)


  COMPONENT 1 — chaba-cms-render (FastAPI on idc03, same host as CMS plane :11027):

  - ~1 app file + templates/ per kind; Jinja2 + markdown; follow docs/kb/cms-page-standard.md + media-inbox-standard.md

  - Reads LIVE from collections: ada-cms-pages, ada-cms-pages-kk, ada-cms-automation, chaba-docs — fetch-on-request,
  cache keyed by doc modified (no rebuild pipeline, no drift)

  - Routes: / (index grouped by meta.kind), /p/{slug-or-id} (kind-dispatched template: place-report, trip, house-rules,
  timeline, media-inbox, report, digest), /k/{kind} listing, /feed/{kind}.xml RSS, /healthz

  - Persona split: *-kk collection defaults Thai UI; main collection EN/ไทย toggle per page standard

  - Media: LINK existing asset URLs (relay-img thumbs, www copies) — never copies files

  - systemd unit chaba-cms-render.service; caddy handle for cms.surf-thailand.com on idc02 edge (CF Access covers
  auth)


  COMPONENT 2 — line-digest (scripts/ada/line-digest.py + timer on idc03):

  - Weekly per-member push to start; sources: house-timeline rollups, media-inbox additions, news digests, kanban
  done-count, render_job highlights

  - Short markdown -> LINE push via existing relay path with idempotent message_id

  - Phase 2 (later): event-triggered (new trip page -> push)


  DATA CONVENTIONS: add meta.slug on CMS docs for clean URLs (fallback doc id); meta.lang where it differs from
  collection default.


  NON-GOALS: member auth system (CF Access does it), editor UI (Docs->import only if KK asks), file hosting changes,
  per-member privacy beyond collection split.


  VERIFY: pytest render fns on fixture docs; /healthz; one real page per kind eyeballed; RSS validates; digest DRY-RUN
  to Tony''s LINE only before enabling member recipients.


  Origin: Tony''s Ghost-vs-WP comparison — ''create a post the way you want to store it'' — chaba-cms lacks the
  ''show it'' half; this is the presentation layer + the newsletter-equivalent (LINE, not email).'
