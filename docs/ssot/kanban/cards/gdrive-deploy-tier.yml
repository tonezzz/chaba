id: gdrive-deploy-tier
title: 'gdrive for push/deploy? verdict: no for transport, yes as cold artifact tier'
column: backlog
review_kind: decision
updated: 2026-10-11 20:53
brief: 'Tony asked whether gdrive could carry push+deploy. Analysis: no for git transport (no atomic refs/locking
  over rclone, reintroduces sync-race class git-safe-pull was built to kill, adds a third-party repo copy) and no
  for deploy trigger (deploy = scp+restart+verify+flock+confirm gates, not file-arrival; all targets already on
  tailnet). YES for cold artifact tier — the fleet already runs this pattern (rclone-gdrive.service on dell, gdrive:nest-brains
  tar+sha manifests, gcrypt remote approved).'
priority: low
tags:
- architecture
- deploy
- gdrive
spec: 'Decision recorded. If approved, implement the one useful increment:

  deploy-card.sh post-verify step runs `rclone copyto gdrive:chaba/bundles/`

  for each deployed sunsynk-power-flow-card bundle + updates latest.yml

  manifest (same manifest contract as nest-brains). Gives an offsite,

  tailscale-independent copy of every released bundle.

  '
requests:
- id: bundle-cold-tier
  ask: Wire `rclone copyto gdrive:chaba/bundles/` into deploy-card.sh post-verify (+ latest.yml manifest)? Needs
    rclone configured on whichever host runs deploys (dell has rclone-gdrive already).
  status: answered
  suggested: true
  options:
  - id: true
    label: add gdrive bundle tier to deploy-card.sh
  - id: false
    label: keep deploy local+tailscale only
  answer: true — add gdrive bundle tier to deploy-card.sh
