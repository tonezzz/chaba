id: confirm-token-retry-expiry
title: Confirm tokens expire between dispatch retries — double-prompt churn
brief: 'Sessions 38b18589b0 + 7a74536b32: user confirmed a devin dispatch, the downstream call failed on infra (SSH
  timeout), and on retry the confirm_token was already expired — forcing a second voice confirmation for the same
  request. "โทเค็นหมดอายุ อีกแล้ว" is pure friction; a downstream failure is not a reason to re-ask.'
