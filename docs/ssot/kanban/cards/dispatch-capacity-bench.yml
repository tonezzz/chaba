id: dispatch-capacity-bench
title: Dispatch capacity benchmark — all hosts, podman vs bare systemd
column: review
note: 'Measure before deciding multi-host dispatch architecture. Key gap found 2026-10-04: devin CLI exists ONLY
  on tony-dell — remote hosts can''t dispatch today regardless of the card system.'
updated: 2026-10-05 08:10
help: "Current capacity snapshot (measured 2026-10-04):\n  tony-omen  12c / 3G avail / load 7.0   — loaded, not\
  \ free capacity\n  idc01       2c / 26G avail / load 0.6  — RAM-rich CPU-poor, runs ada+mddb\n  mn01        4c\
  \ / 2G avail  / load 2.0  — standby-sized\n  idc02       4c / 11G avail / load 0.08 — idle VPS, best free capacity\n\
  \  tony-dell  RAM-tight — dispatch-queue already caps at 3\n\nPodman angle: a dispatch image (devin CLI + git\
  \ + toolchain) makes ANY\npodman host dispatchable without per-host installs, and MemoryMax-style\ncgroup bounds\
  \ answer dell's RAM-tightness directly.\n"
spec: "Benchmark minimal dispatch per host BEFORE building multi-host dispatch —\ndecide bare-systemd vs podman-wrapped\
  \ devin-task on evidence.\n\nKnown facts (verify, don't re-measure): devin CLI absent on\nomen/idc01/mn01/idc02;\
  \ host load table in `help`.\n\nSteps:\n1. Baseline on tony-dell: run one trivial devin-task, record RSS peak\n\
  \   (systemd unit cgroup) + startup latency. Repeat at 2 concurrent —\n   watch available memory.\n2. Per remote\
  \ host: document the prerequisite list to dispatch —\n   devin CLI install + auth, dispatch script, repo checkout\
  \ freshness.\n   Do NOT install anything without the request answers below.\n3. Podman evaluation: spec a devin-dispatch\
  \ image (devin CLI + git +\n   python + ssh client); measure image size and container-start latency\n   vs systemd-run;\
  \ check cgroup delegation under rootless podman for\n   per-task memory caps. Compare isolation/portability vs\
  \ overhead.\n4. Deliverables: docs/assessments/dispatch-capacity-2026-10.md with the\n   capacity table (host\
  \ → safe concurrent tasks, with evidence) and a\n   recommendation covering: podman vs bare, per-host cap values,\
  \ and\n   which hosts (if any) should get runners first.\nPost interim findings to this card's comms as you go.\n"
