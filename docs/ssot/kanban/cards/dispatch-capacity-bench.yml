requests:
- id: cli-install-ok
  ask: OK to install the devin CLI on remote hosts for the benchmark? Each host needs an auth token — how should
    that be provisioned?
  status: answered
  options:
  - id: 'yes'
    label: yes — install devin CLI on test hosts
  - id: podman-only
    label: skip CLI install — test podman path only
  - id: 'no'
    label: no — hold the benchmark
  answer: podman-only — skip CLI install; per-host auth-token provisioning is the heavy lift and spreads secrets
    across test hosts. The podman path exercises the dispatch mechanism itself; revisit CLI if podman results justify
    it
- id: podman-test-host
  ask: 'Preferred host for the podman-wrapped dispatch test: idc02 (idle) or omen (if you free it)?'
  status: answered
  options:
  - id: idc02
    label: idc02 — idle VPS
  - id: tony-omen
    label: tony-omen — if freed
  - id: neither
    label: neither — design only
  answer: 'idc02 — idle VPS: zero contention, already tailscale-connected; tony-omen would need freeing first'
- id: multi-host-dispatch-is-unblocked-except-915b8b
  ask: 'Multi-host dispatch is unblocked except auth: how should remote runners get devin credentials? (a) bind-mount
    credentials.toml read-only into the idc02 podman container per run; (b) copy credentials.toml to each bare runner
    (omen/mn01 already have it); (c) hold until a dispatch-scoped token exists. Details in docs/assessments/dispatch-capacity-2026-10.md
    section 6.'
  status: answered
  answer: b — copy credentials.toml to each runner; omen/mn01 already have it, place on idc02 and bind-mount into
    the dispatch container
