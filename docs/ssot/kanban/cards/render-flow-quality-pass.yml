spec: 'From Tony 2026-10-14: what else can we improve in the render flow for quality. Concrete items:

  1. Iterate-on-last: remember the session''s last rendered artifact so "make it warmer / change the text" auto-feeds
  it as ref_url instead of a fresh reroll (biggest UX win — edits preserve composition).

  2. Vision self-check: after a render, one cheap vision pass comparing output vs ask; retry once on obvious miss
  (garbled text, wrong subject). ~$0.004/turn cost.

  3. Multi-ref: gemini-3.1-flash-image accepts multiple reference images — ref_url is single today; take ref_urls[]
  for "combine these photos" asks.

  4. Aspect intent: map asks like "1920px landing page" to the right canvas — real landing pages are TALL; either
  warn that gen is capped at fixed aspects or compose per-section renders. Landing pages specifically: image gen
  yields a picture OF a page, not a page — if the member wants usable HTML the flow should be render hero assets
  + code a page (different tool path).

  5. Delivery fidelity: LINE re-encodes images; consider attaching the arch URL for the original-quality file on
  big renders (2K/4K) so members can grab full res.

  6. Transient retry: one automatic retry on gateway/429-vs-quota transient failures before surfacing an error.

  Depends on OPS-0651 (delivery path) being sane for #5 to matter.'
