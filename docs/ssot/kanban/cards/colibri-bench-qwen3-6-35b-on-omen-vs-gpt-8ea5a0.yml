spec: 'Pack: packs/colibri-bench — needs gpu_gb 0 (CPU) or 3 (CUDA 1650), disk_gb 35, venv:true. Prep: clone colibri,
  run start-here.sh --model qwen36-35b --yes --backend cuda (fallback cpu), start serve. Run: bench-edu-manage.py
  --lanes local-colibri --openai-base http://127.0.0.1:8000/v1 --model qwen3.6-35b (or curl-based mini-bench if
  the bench script lacks OpenAI-base support). Artifacts: out/colibri-bench-*.json + .md. First bench when the pack
  lands on Drive + omen worker picks it up (~30-60 min for install+download).'
