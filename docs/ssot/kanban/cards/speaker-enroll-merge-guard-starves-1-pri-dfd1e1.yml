id: speaker-enroll-merge-guard-starves-1-pri-dfd1e1
title: speaker enroll merge-guard starves 1-print profiles (own-voice check uses hard threshold)
column: review
updated: 2026-10-25 10:15
brief: 'enroll() own-voice check requires cosine >= DEFAULT_THRESHOLD (0.45) vs the single stored print. Michael
  profile: 3 TG corpus clips of his real voice scored 0.42/0.44 vs his sole print -> REJECTED as foreign. A sparse
  profile can never accumulate prints via the intended corpus flow; only force-replace or manual _prints surgery
  works (did the latter 2026-10-19: michael 1->3 prints). Also traps: chunks under threshold never auto-learn (floor
  0.60), so thin profiles stay thin even with real usage.'
priority: medium
program: ada-voice
spec: 'Lower the own-voice merge bar for existing profiles (e.g. max(0.30, DEFAULT_THRESHOLD-0.15)) while keeping
  the contamination guard vs OTHER speakers at full threshold; OR add an explicit verified-source bypass for enroll_from_file
  corpus clips. Decide whether owner-reclaim-identified audio (best_match=owner, sub-threshold) should feed a soft
  auto-learn lane. Regression test: a second genuine clip at ~0.44 must merge, a foreign clip at ~0.30 must not.'
ref: OPS-0746
