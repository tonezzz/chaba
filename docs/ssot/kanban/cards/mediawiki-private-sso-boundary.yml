requests:
- id: oidc-provider-choice
  ask: 'Which identity provider should wiki-internal trust for automatic Tony/Ada login? Recommended: reuse the
    existing Google identity behind Cloudflare Access via MediaWiki OpenIDConnect; alternative: configure Cloudflare
    Access as/through an OIDC provider if the account supports it; fallback: MediaWiki-native login (does not meet
    auto-login goal).'
  status: answered
  at: 2026-11-05 17:35
  from: devin
  options:
  - id: google-existing-access-idp
    label: ★ Reuse the existing Google identity/provider used by Cloudflare Access — recommended
  - id: cloudflare-access-oidc
    label: Use a Cloudflare Access OIDC issuer/provider if available in this account
  - id: mediawiki-native
    label: Use separate MediaWiki login — simplest, but no automatic Tony login
  suggested: google-existing-access-idp
  answer: google-existing-access-idp — ★ Reuse the existing Google identity/provider used by Cloudflare Access —
    recommended
- id: oidc-client-registration
  ask: Provide or approve the Google OIDC client registration for wiki-internal. The callback URL will be https://wiki-internal.h3.gizmo-thailand.com/index.php?title=Special:PluggableAuthLogin.
