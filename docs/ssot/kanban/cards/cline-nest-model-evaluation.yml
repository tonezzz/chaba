spec: 'After KNB-0932 is deployed and an OpenRouter route is approved, run a controlled Cline/Nest model comparison
  on the same frozen disposable coding task. Arms: local Omen Ollama qwen3:4b and one pinned OpenRouter :free model
  through the secret-backed LiteLLM gateway; paid reference only after explicit budget approval. Run at least 3
  repetitions per model with isolated worktrees and an independent verifier; measure pass rate, tool-call correctness,
