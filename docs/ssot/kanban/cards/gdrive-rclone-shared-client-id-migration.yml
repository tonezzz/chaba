spec: 'Audit the gdrive: rclone remotes used by fleet and member hosts, then migrate from rclone’s shared Google
  Drive client ID to an approved project-specific OAuth client before the shared ID retirement notice takes effect.
  Keep client secrets in the existing secret/config store, never in repo or chat. Verify each remote and run rclone
  check after migration. No config changes were made during the KK-Mac probe.'
