  status: running
  runner: tony-macbook
note: Devin is currently the senior reviewer; this card tests whether OpenCode/DevNest can perform the same safe
  work in parallel and what remains possible during a full internet outage. Local CPU models are known to be weak
  for long agent loops, so do not claim full replacement without evidence.
