requests:
- id: choose-news-visibility-architecture
  ask: For internal DevNest/AdaNest/*-HA updates, which privacy boundary should the News hierarchy use? The existing
    news CPT is public and its current digest writer publishes parents, so internal facts must not be mixed into
    the public digest without a guard.
  status: answered
  at: 2026-10-26 08:59
  from: devin
  options:
  - id: single-cpt-status-partition
    label: 'Recommended for one inspectable tree: reuse the existing news CPT; external items publish, internal
      items stay private, and every parent inherits the most restrictive child visibility. Requires privacy-filter
      tests before ingestion.'
  - id: separate-private-project-news
    label: Keep existing public News for external stories and add a separate private project_news CPT for DevNest/AdaNest/HA/internal
      experiments.
  - id: external-only-first
    label: Run the pilot on public external news only; use sanitized internal fixtures and defer internal ingestion/CPT
      choice.
  suggested: single-cpt-status-partition
  answer: 'single-cpt-status-partition — Recommended for one inspectable tree: reuse the existing news CPT; external
    items publish, internal items stay private, and every parent inherits the most restrictive child visibility.
    Requires privacy-filter tests before ingestion.'
