  meta-index entries, ~23.6GB freelist pressure, mddb-ops on idc03 under high load.

  Tasks: (1) inspect mddb-ops health/metrics, collection sizes, index/freelist stats, replication lag and systemd/journal
  warnings; (2) identify the dominant cause of slow /add and /ingest; (3) propose a concrete, safe remediation (e.g.
  compaction/GC window, index tuning, batch-size or retention adjustment, replica catch-up) with expected impact
  and rollback. DO NOT apply any change to the production MDDB service or data without an explicit human approval
  request on this card. File the diagnosis and proposal as a comment and open an approval request for the recommended
  change if one is warranted.

  Verify only with read-only probes; report p50/p95 /add latency and whether the congestion correlates with a specific
  collection or time window.'
