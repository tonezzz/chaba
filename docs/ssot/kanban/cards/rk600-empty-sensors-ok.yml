id: rk600-empty-sensors-ok
title: get_rk600_weather returns ok:true with empty sensors — retry storm bait
brief: 'Session 7d21066a27 (2026-10-07): weather station offline, tool returned {sensors: {}, ok: True} ~10x in
  a row. Model retried indefinitely because the result looked successful. Same silent-miss class as the cms_read
  None→ok:true bug fixed 2026-10-08.'
column: backlog
priority: medium
