spec: 'Goal: Update get_rk600_weather in the chaba repo to return ok:false and station offline/unreachable when
  the sensors dictionary is empty, following the fix pattern seen in backend/tool_runner/cms.py get on miss. Host/repo:
  tony-dell, chaba. Constraints: Apply the exact error return structure and pattern from the CMS tool runner reference.
  Testable done-condition: A unit or integration test asserts that calling get_rk600_weather with empty sensors
  yields ok:false and the specified offline message instead of ok:true.'
