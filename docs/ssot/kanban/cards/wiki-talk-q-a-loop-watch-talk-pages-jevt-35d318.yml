    user timer on idc03 every ~15min (offset from kanban-commit). Steps: (1) poll api.php list=recentchanges rctype=edit|new
    rcnamespace=all talk ns (1-15 odd + 3001/3003/3005/3007) rcend=watermark; (2) dedupe by rcid watermark in ~/.local/state/wiki-talk-watch/,
    idempotent reruns; (3) n'
