spec: 'Origin: Tony comment on Education_talk:Ada-Ocb-Card-Runner (2026-11-12) — ''Are we going to create an mcp
  for this?'' Only noticed because he asked in chat. Two work items:


  1) WIKI-TALK WATCHER + RESPONSE LOOP: poll Special:RecentChanges (rcnamespace=1,3,5,7,9,11,13,15,3001,3003,3005,3007
  or all talk ns) on a timer (idc03, ~30min); new comments -> JevTeam classify/route (its designed role: decision
  family, not executor) -> executor lane drafts + posts reply via MediaWiki API (ada bot creds, wiki-h3-gizmo.env).
  Default lane for repo/design questions = ada-code (owns context + implements); ada voice is wrong surface; ada-ocb
  is UI edge. Reply should sign itself + link the card. Dedupe by rcid/page+rev.


  2) CARD-RUNNER MCP COMPLETION (the actual comment answer): ada_card_pick + ada_card_context already exist as MCP
  tools in ada-control (global on tony-dell opencode). Missing: card_run/card_lifecycle tools + packaging as a standalone
  MCP server reachable by non-opencode agents (or document ada-control as the canonical host).


  Refs: Education:Ada-Ocb-Card-Runner (lesson), kanban ada-ocb-card-runner work (KNB-0065 pilot), ssot.terminology
  JevTeam def.'
