spec: 'Parent: live-session-token-diet (OPS-0509). set_facial_expression is NON_BLOCKING cosmetic but each call
  still runs a billed tool round (~28k context resend). Worst observed: session f245275fde ran 234 expression calls
  in one session. Options: (a) batch — let the model queue expressions inside the reply text and parse locally;
  (b) throttle — cap expression calls per turn/minute (extends ADA_TOOL_CALL_BUDGET semantics); (c) fold into a
  cheap text-mode side channel. Measure: calls/day and in-tokens/turn on ada-ha-tony before/after via usage.jsonl.'
