note: 'Session e564b39502 audio replay shows a genuine KK=0.84 match at t=0s — either KK spoke near the iPad, or
  Ada''s own TTS / another device playing KK''s voice leaked into the mic path. If no human KK was present, this
  is an echo-leak bug: self-voice or relayed audio reaching the recognizer. Owner- reclaim (f394a90 + d630572) now
  recovers the label in ~30s, but the false open still mis-greets. Also watch live identify logs for remaining sub-threshold
  owner sessions post re-enrollment.'
