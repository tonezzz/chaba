spec: "Reproduce / diagnose:\n  ssh idc03 'journalctl --user -u ada-scenario-casting.service --since today --no-pager'\n\
  \  # next daily run fires ~02:00 via ada-bench-casting OnSuccess; with\n  # PYTHONUNBUFFERED=1 the per-scenario\
  \ '== name: status' lines should\n  # show where it stalls. Manual repro while smoke is idle:\n  systemctl --user\
  \ start ada-scenario-casting.service\nHypotheses:\n  - a casting scenario blocks on a vcast screen / GEV event\
  \ that never\n    arrives (screens offline at 02:00?) — check which scenario is\n    running when it stalls (journal)\
  \ and its yaml in ada-pi\n    tests/scenarios-live/.\n  - scenario-live.py ws recv wait with no scenario-level\
  \ deadline —\n    check asyncio.wait_for coverage around tool-call waits.\nAlso consider: give casting its own\
  \ lower-impact slot or make the\ndaily rerun opt-in — a suite that fails/hung daily costs the :8199\nlock for\
  \ 2h each night (02:00-04:00), starving the 02:00/03:00 smoke\nruns (they self-skip — data gap in the hourly benchmark).\n\
  DONE WHEN: a casting run completes and writes a benchmark/casting doc\nto ada-ha-scenario-reports, or the stall\
  \ root cause is identified and\nfixed/acked.\n"
