id: ada-scenario-casting-hang
title: ada-scenario-casting hangs to TimeoutStartSec every run — zero results
brief: '2026-10-09 (found while fixing fix-scenario-schedule-collision): ada-scenario-casting.service runs daily
  at 02:00 via ada-bench-casting OnSuccess + Sat weekly timer, but every observed run (>=30d journal) burns the
  full timeout (2h, ~18s CPU) with zero scenario output — e.g. 2026-10-08 20:47->22:47 and 2026-10-09 02:00->04:00
  both ''start operation timed out''. It holds the :8199 suite lock the whole time, which is what refused every
  03:30 weekly suite. PYTHONUNBUFFERED=1 added 2026-10-09, so the next hang should show which scenario stalls. Likely
  suspect: scenario-benchmark.py subprocess timeout is 30min per scenario and casting has 19 scenarios — a ws-wait
  hang per scenario (e.g. vcast screen/service absent) exhausts the unit cap silently. Note ''last run'' evidence:
  preflight-bench passes all gates (ada up, :8002 listening, embed-probe up, no lock) so the hang is inside the
  run, not startup.'
column: backlog
review_kind: verify
priority: high
kind: bug
created: '2026-10-09'
