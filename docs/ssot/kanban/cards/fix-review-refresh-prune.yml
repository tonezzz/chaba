spec: |
  scripts/ada/prune-old-docs.py sweeps every collection in the retention
  policy against MDDB http://100.102.134.91:11023/v1 and times out at 600s
  (subprocess timeout inside ada-review-refresh, run on tony-omen).

  1. Time it: run prune-old-docs.py --dry-run on omen and see WHERE the
     time goes (which collection, list-vs-delete phase). If idc03 mddb is
     slow, check its load — it may share the box with heavy benches.
  2. Fix direction depends on finding:
     - huge collection → paginate/parallelize the sweep or split per-
       collection timeouts
     - mddb slow → report, don't mask
     - just needs longer → raise the subprocess timeout to something
       honest (20min?) and/or make the sweep resumable.
  3. Confirm ada-review-refresh.service completes end-to-end.
  VERIFY: manual ada-review-refresh run on omen exits 0; prune step
  duration recorded in card comms.
