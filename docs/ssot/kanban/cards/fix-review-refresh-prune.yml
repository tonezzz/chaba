id: fix-review-refresh-prune
title: ada-review-refresh on omen — prune-old-docs.py hits 600s timeout
brief: 2026-10-09 audit — ada-review-refresh.service on tony-omen fails
  after ~12min because its subprocess prune-old-docs.py (sweeps all mddb
  collections per retention policy) times out at 600s. Either the sweep
  is genuinely slow on a big corpus, or mddb (idc03) is slow under load.
  Refreshed corpus is stale until fixed.
column: backlog
