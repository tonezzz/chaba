    installation.'
- at: 2026-11-19 13:37
  from: devin
  text: 'done: fail-closed implemented (option 1) + repo-scoped pytest bootstrap + pytest claim label. Unrunnable
    gate (pytest-shaped cmd, tests/ present, no importable pytest) now holds the merge (gate_unrunnable) — first
    tries a locked bootstrap of the checkout .venv with REPO_TESTS[repo].bootstrap deps (KANBAN_GATE_BOOTSTRAP=0
