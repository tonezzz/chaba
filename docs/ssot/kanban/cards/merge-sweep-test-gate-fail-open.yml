  text: 'working — decision: fail-closed (option 1) per the approved direction. Design: (1) run_test_gate returns
    unrunnable→merge held when a pytest gate is configured but no interpreter can import pytest; (2) repo-scoped
    bootstrap provisions <canonical checkout>/.venv with pytest (+repo deps) before holding — the approved repo-scoped
    fix, never a global install; (3) action.test_exempt is the allowlist for docs-only cards; (4) runners auto-advertise
    a pytest label and unrunnable requeues gain labels:[py'
