spec: 'Evaluate whether kk-mac (M4 Max 36GB, ollama LaunchDaemon) can take over paid flash-lite side-call traffic
  (~$22/window of the $69.64 LiteLLM ledger is steady REST spend — the movable part). Runner is ARMED: scripts/bench/card-judgment/kkmac_eval.sh
  on any tailnet host — gates on ssh+ollama-alive (fails closed when the Mac is offline, as now: tailnet last seen
  19h), auto-detects pulled models (prefer qwen3:8b, qwen2.5:32b, llama3.2:3b, qwen2.5vl:7b), runs the 115-case
  corpus per model, writes run-kkmac-<model>.md|json next to corpus.jsonl. Success = action_accuracy comparable
  to the llama3.2:3b baseline (0.739) and near paid-flash quality — then a routing proposal (kk-mac into tool-call/summary/classify
  fallback chains) is worth making. Zero spend.'
