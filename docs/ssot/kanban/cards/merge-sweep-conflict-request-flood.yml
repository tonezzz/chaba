id: merge-sweep-conflict-request-flood
title: merge-sweep reposts conflict requests every pass after they are answered
column: done
updated: 2026-11-24 08:14
brief: 3 review cards carry 15-18 duplicate merge-conflict-* requests. open_conflict_req() counts only UNANSWERED
  ones, so once a human answers, the next 15-min pass posts a fresh request. Gate on conflict signature (head +
  paths), not answer state.
priority: medium
tags:
- merge-sweep
- kanban
- request-noise
spec: 'Observed 2026-11-21 during review-queue triage: kk-mac-routing-proposal-fold-local-qwen2-4d513b has 15 answered
  merge-conflict-* requests; trade-lesson-ui-integration has 17 answered + 1 open; trade-lesson-workflows-automation
  has 17 answered. ~50 duplicate entries total, burying the real asks.


  Root cause (scripts/board/merge-sweep.py): open_conflict_req() returns True only if a conflict request has status
  != ''answered''. Once the human answers, the next sweep sees no open request and conflict_rid() mints merge-conflict-N+1.
  The docstring says ''one request per distinct conflict event'' but the code equates ''answered'' with ''new event''.


  Fix: stamp a conflict signature (branch head + conflicting paths) like the existing shadow_blocked guard, and
  post a request only when that signature changes — answering must not re-arm it. Add a contract test covering answer-then-no-repost
  and head-change-reposts.


  Done condition: merge-sweep adds no new conflict request on repeated passes when the head/paths are unchanged
  and the prior request is answered; a genuinely new conflict still raises exactly one request.'
ref: KNB-0010
