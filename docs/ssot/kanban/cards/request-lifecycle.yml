id: request-lifecycle
title: Request lifecycle — capture Tony's asks so nothing dies in a conversation
column: backlog
note: 'The umbrella over QA/QC/CI for requests: capture → triage → card → build →
  verify → report. Requests today die at capture: they live inside a Devin chat or
  Ada voice session and never become a card. Three capture paths + one visibility
  surface fix it.'
updated: 2026-10-07 09:30
help: |-
  Goal: every non-trivial request Tony makes — in Devin chat or to Ada by
  voice — lands on the board or in focus-inbox, and there is one place to
  answer "what did I ask for that isn't done?"

  Capture paths:

  1. Devin sessions (done 2026-10-07): AGENTS.md open-ask capture duty —
     every unmet ask gets a card/inbox entry before session end; "status?"
     is answered from the board, not memory.

  2. Ada voice: ada_board_write can comment/respond on existing cards but
     cannot create one. Add board-api POST /card (minimal {title, column:
     backlog}) + ada_board_write action=create, then an instructions line:
     a request that isn't finished this conversation → file a card before
     ending. This is the voice-side mirror of the Devin rule.

  3. Drop-catcher sweep (the safety net): a daily script scans Ada
     transcripts (ada-ops/session archives already in MDDB) + Devin session
     summaries (~/.local/share/devin/cli/summaries/), extracts "Tony asked
     for X" utterances, cross-checks titles against kanban cards +
     focus-inbox, and files orphans as focus-inbox entries labeled
     orphan-ask. Regex-plus-classifier; the same shape as improvements-
     triage.py. Cheap, catches requests made while rambling or in a failed
     session.

  Visibility surface:

  - A "Tony's open asks" section — cards where requester=tony (or comms
    from tony with an unanswered request) + orphan-ask inbox items. Reuse
    the kanban-digest page or board view; the question "what's pending?"
    should have a one-screen answer.

  Scope notes:

  - QA/QC/CI (devteam review, playbook verify, scenario bench) already
    gate the build stage — this card only covers capture + visibility.
  - First corpus for the drop-catcher: the last 7 days of devin session
    summaries — ~30 sessions/day, ask rate is high enough to measure.

  Verify:
  - board-api /card creates a backlog card visible on /apps/board/
  - voice test: "Ada, remember to fix the faucet" → card exists
  - drop-catcher run over last week lists at least the telegram-bot-token
    and OpenClaw-bench asks (known orphans from this session)
  - digest page shows the open-asks section
policy:
  requester: tony
comms:
- at: 2026-10-07 09:30
  from: devin
  text: 'Designed + Devin-side rule landed (AGENTS.md open-ask capture duty).
    Remaining: board-api POST /card + ada action=create, drop-catcher sweep
    script, open-asks digest section. Dispatchable as three small tasks.'
- at: 2026-10-07 10:45
  from: devin
  text: 'CI feedback loop (per Tony): verify results write back to card comms;
    a failed verify flips the card back to doing instead of dying silently.
    Telemetry feeds new asks — orphan-ask sweep, scenario regressions, jev
    divergences -> focus-inbox -> cards: the pipeline generates its own
    backlog. Digest->Tony closes the loop to the human.'
