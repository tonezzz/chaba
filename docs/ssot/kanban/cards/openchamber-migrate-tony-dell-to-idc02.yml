id: openchamber-migrate-tony-dell-to-idc02
title: Migrate OpenChamber pane from tony-dell to idc02
column: done
updated: 2026-11-20 18:52
brief: 'Tony approved direction 2026-11-18: idc02 is the better home for the OpenChamber agent pane — always-on
  (dell sleeps/reboots), 5G RAM avail vs dell 2G, load ~1 vs ~6, and it already hosts the public edge so ada-ocb.surf-thailand.com
  shortens from caddy→tailnet→dell to caddy→localhost. Migration is moderate cost: fresh install + provider re-auth
  + edge/bridge/iframe repoints. Keep dell pane live until cutover verifies, then decide retire vs local-only.'
priority: medium
program: devnest
tags:
- openchamber
- idc02
- migration
- claude-code
- devnest
spec: 'MIGRATION RUNBOOK — OpenChamber ada-ocb pane: tony-dell → idc02.


  Current state (verified 2026-11-18):

  - Source: tony-dell openchamber.service active, UI 127.0.0.1:3000, managed opencode child; public edge ada-ocb.surf-thailand.com
  = idc02 caddy-edge → https://tony-dell.taila0626a.ts.net:8443 (tailscale serve → :3000); iframed in Ada HA dashboard
  chaba-admin tab; ada-ocb bridge in ada-voice targets dell; ada-ocb-smoke.timer on idc02 health-checks hourly.

  - Target: idc02 — 15G RAM/5G avail, load ~1, already runs ada-code + jack-opencode containers + caddy-edge. Do
  NOT touch those containers.

  - Tooling ready: scripts/claude-code/openchamber-wire.sh (--host idc02) wires claude-agent; install.sh/update.sh
  pin claude-code.


  STEPS:

  1. idc02: install Node 24 + @openchamber/web (match dell version — check `openchamber --version`/npm ls on dell
  first), systemd --user openchamber.service mirroring ssot.audit.hosts.yml notes (startup.env mode 600 with OPENCHAMBER_UI_PASSWORD,
  OPENCHAMBER_FRAME_ANCESTORS CSP, node24 path).

  2. openchamber-wire.sh --host idc02 --smoke — but FIRST: install pinned claude-code on idc02 (install.sh) + `claude
  auth login` (INTERACTIVE — needs Tony or setup-token) + `opencode auth login claude-agent` inside the new install.

  3. LiteLLM provider: copy provider config from dell ~/.config/openchamber + ~/.local/share/opencode auth (LITELLM_KEY
  lives in secrets — copy via ~/.config/secrets/, never in card/chat).

  4. Edge repoint: idc02 caddy-edge upstream ada-ocb → http://127.0.0.1:3000 (local). Keep tailscale serve :8443
  on idc02 as private backup if desired.

  5. Repoints: ada-voice ada-ocb bridge base URL → idc02 endpoint; ada-ocb-smoke.timer target; HA dashboard iframe
  src if hostname changes (prefer keeping ada-ocb.surf-thailand.com so iframe/dashboard JSON unchanged).

  6. VERIFY BY SURFACE: load https://ada-ocb.surf-thailand.com in browser, log in, send a prompt on BOTH lanes (litellm
  gemini + claude-agent haiku smoke), confirm ada-ocb-smoke passes, confirm HA iframe renders.

  7. Soak: leave dell pane running 24-48h as fallback; then either retire dell openchamber.service or keep as local-only
  backup — Tony decides at close.


  GATES (stop for Tony): claude auth login on idc02 (interactive OAuth); LiteLLM key handling; final dell retire
  decision; any DNS/CF Access change.


  RELATED: OPS-0185 (claude-agent on idc02 containerized opencodes ada-code/jack-opencode — separate scope, this
  card is the OpenChamber pane only). OPS-0184 delivered the wiring script + runbook.'
