id: thai-llm-finetune-experiment-typhoon-wan-9ef801
title: 'thai-llm-finetune-experiment: Typhoon + WangchanX'
column: backlog
updated: 2026-11-24 15:19
brief: 'Lab experiment (kept for reminder): fine-tune BOTH Thai open LLM families — Typhoon (SCB10X) and WangchanX
  (NECTEC) — side-by-side, and compare against the NCM toy-train track (OPS-0750).'
priority: low
tags:
- experiment
- thai
- llm
- lab
spec: 'Goal: if the want is fast/usable Thai generation TODAY, a small Thai AR model beats rebuilding NCM. Experiment:
  (1) pick one base each — Typhoon-2.x instruct vs WangchanX; (2) light LoRA/SFT on a Thai instruction/corpus slice;
  (3) eval side-by-side on XL-Sum Thai / ThaiQA / SCB MT; (4) produce comparison table + verdict (weather-bakeoff
  shape). Deployment lane if a winner emerges: ollama/llama.cpp on omen GPU or the idc shelf. Links: OPS-0750 (NCM
  toy-train, non-AR alternative), Education post 1588 (NCM assessment + Thai feasibility).'
ref: OPS-0760
