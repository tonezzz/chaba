spec: 'Tony 2026-10-13: need calendar/timeline pages for asks like "show my trip calendar" — 3 layers: rollup trip
  page linking to daily leaf pages, shareable via LINE/TG.\n\nDESIGN (approved defaults — merge sources + table&gantt):\n-
  Generator: scripts/ada/trip-calendar.py (chaba repo) — inputs: CalendarService calendar_read events + conv_journal
  trip context; args: --slug <trip> --from/--to (or infer) --lane kk|tony --dry-run. Writes the CMS page family
  per docs/kb/cms-page-standard.md parent/leaf/QC contract:\n  * rollup trip-<slug> (report_role=rollup): lede,
  mermaid gantt of the trip span, day table (day#|date|headline|leaf link), public-flagged when asked\n  * leaves
  trip-<slug>-<YYYY-MM-DD> (report_role=leaf, parent=rollup): that day schedule table (time|event|detail), notes\n  *
  qc leaf trip-<slug>-qc: leaf coverage/stale check\n  * regen reports-index after writes\n- Ada tool (ada-pi):
  trip_calendar(slug, dates?, public=false) in tools.d/ — thin wrapper that shells the generator (or calls into
  it), returns the rollup link + leaf count so she can answer with a real URL. Gate public= to explicit ask (same
  rule as cms_publish_page).\n- LINE/TG path: return the public URL; page_snapshot exists for image-send if the
  room prefers a picture.\n\nVERIFY: --dry-run output reviewed; live run against kk-dev lane first (ada-cms-pages-kk-dev
  collection); confirm rollup->leaf->index links; mermaid gantt renders in the CMS app.\nOUT OF SCOPE: FullCalendar.js
  grid (nice-to-have later), travel-map layer, provider writes.'
