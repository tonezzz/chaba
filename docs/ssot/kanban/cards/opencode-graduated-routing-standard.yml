id: opencode-graduated-routing-standard
title: Standardize graduated routing of safe jobs to OpenCode
column: doing
updated: 2026-10-27 14:35
brief: Define how OpenCode receives increasing job volume safely, with gates, canaries, rollback, and efficiency
  measurement.
priority: high
program: ai-workforce
