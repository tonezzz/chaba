help: 'Goal: Ada designs a tool → devteam expert panel reviews the spec →

  a playbook dispatches the build → CI verifies → report lands in

  devin-handoff. Self-improvement with a gate, not free-form dispatch.


  Done (2026-09-30/10-01):

  - backend/tools.d drop-in loader + manifest policy (read|confirmed|

  owner_only) + ada_mddb_health reference tool + handbook

  (docs/ada-tool-dev.md) — 17 tests

  - backend/devteam.py: draft spec → 4-expert panel (security_privacy,

  standards, qa, scope) → revised spec → verdict → kind=spec-review

  doc in devin-handoff — verified live on ada-dev; QA expert correctly

  BLOCKED a spec missing its test plan (spec/20260930-125800-*)

  - DEVTEAM_MODEL=gemini-3.5-flash-lite on ada-dev (shared free-tier

  gemini-2.5-flash bucket is 20 req/day — exhausted fast)


  Remaining:

  1. Playbook registry (backend/playbooks/*.yml) — build-tool playbook

  requires spec_review=pass; renders task from template; declares

  memory_domains, verify commands, report target

  2. devin_dispatch playbook arg — spec_key param → template render →

  dispatch with verify/report contract

  3. Promote tools.d + devteam to ada-ha-tony (ada-dev only today)

  4. Jev: add pending-question context to confirm probe, retrain student

  on jev-corpus-reviewed.jsonl (33 labeled rows on idc01), promote to

  enforcement on one tool once bench ≥95% vs hand labels

  5. tools-health scorecard — aggregate ada-ops events (phantom_write_claim,

  confirm_strip, jev_advisory) per tool per week → CMS report page

  '
spec: 'Build the playbook registry that closes Ada''s self-development loop in

  ada-pi.


  Read first: backend/devin_dispatch.py (dispatch + dedup),

  backend/devteam.py (spec-review pipeline), backend/tools_loader.py,

  backend/tools.d/manifest.yml, docs/ada-tool-dev.md, and a spec-review doc

  in the ada-ha-bank-devin-handoff MDDB collection (kind=spec-review,

  e.g. spec/20260930-125800-*).


  Deliverables:

  1. backend/playbooks/*.yml — registry with three playbooks:

  build-tool (requires: devin-handoff spec doc with status=pass),

  fix-scenario, investigate. Each declares params, task_template,

  memory_domains, gate {confirm, identity}, verify commands,

  report_to, max_runtime_min.

  2. devin_dispatch gains playbook + params args: renders the task from

  the template, enforces the gate (build-tool refuses when the spec

  is missing or status!=pass), stamps the job with playbook + verify

  list for the watch timer.

  3. Unit tests mocking dispatch + MDDB (no ssh, no network).

  4. A live-scenario yaml (full tier) exercising build-tool gating:

  Ada asked to build a tool without a passing spec must refuse and

  offer ada_devteam_review instead.

  5. SSOT line in chaba docs/ssot/apps/ssot.apps.ada_pi.yml.


  Do NOT touch tool_runner.py confirm-gate internals, do NOT deploy to

  ada-ha-tony. Work in a branch, PR-style commit, report back via the

  job ledger.

  '
