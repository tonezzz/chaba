spec: "Hardware tiers (see report for full matrix):\n\
  1. Vision node: Luckfox Pico Ultra W (~$35-45, RV1106G3, WiFi6, 0.5-1 TOPS NPU, CSI cam, mic,
  PoE option, Linux+RKNN) — on-device YOLO + RTSP; luckfox-frigate-cam proves the HA path.\n\
  2. MCU vision node: ESP32-P4-EYE (~$30) — TFLite-Micro person-detect 73ms, camera+mic+display;
  lowest-power tier, aligns with our ESP32 fleet.\n\
  3. Compute node (federation-capable): Orange Pi Zero 2W / Radxa Zero 3W — quad-A64, WiFi,
  Flower client + ONNX.\n\
  4. USB-cam tier for spare PCs: Logitech C920-class or Arducam IMX500 UVC AI cam (on-sensor
  inference) — zero new host hardware, onnxruntime/opencv on the PC.\n\
  Feed-only fallback: OpenIPC/Thingino reflash on cheap T31 cams (RTSP/ONVIF, fully local)."
metric: One vision node + one MCU node ordered, flashed, registered to HA/Frigate + reporting
  a first micro-AI detection into Chaba (ops event or MDDB note).
verify: Detection object from the Luckfox NPU lands in MDDB/Frigate events via tailnet; ESP32-P4
  emits a person-detect flag; both visible on the nest dashboard lane without cloud dependence.
