id: nest-node-hardware
title: Nest node hardware — shortlist, first buy, USB cams for spare PCs
brief: "Tony 2026-10-10: find a wifi camera that can itself be a Chaba Nest Node; find good
  devices for Nest Nodes generally; include USB cameras for PCs already lying around. Comparison
  matrix and buy plan in reports/nest-node-hardware.md."
