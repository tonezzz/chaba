note: 'Tony ask: continuous generative percussion driven by ops state — audible "what''s going on". Heavy timbres
  for big hosts, light for light hosts; tempo from event rate, pitch/accents from health. v1: /apps/percussion WebAudio
  page (no samples, synthesized drums), state.json fed by ops-percussion-sync timer. iPad-first (tap-to-start for
  AudioContext). Cast lane later: same page on vcast = TV speaker. AQ: page loads on kk-ipad over tailnet, audible
  groove reflects live state (verify by toggling a check), state.json < 60s stale.

