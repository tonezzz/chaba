spec: Build a browser-playable WebAudio percussion page at /apps/percussion with synthesized drums, driven
  by state.json fed via ops-percussion-sync timer on tony-dell. Heavy timbres represent big hosts, light
  timbres for light hosts, with tempo from event rate and pitch/accents from health. The page must be
  iPad-first with a tap-to-start mechanism for the AudioContext, supporting eventual casting via vcast.
  The verifiable done-condition is that the page loads over the tailnet, state.json is less than 60 seconds
  stale, and an audible groove reflects live state verified by toggling a check.
