id: ada-dispatch-tailnet-target
title: Ada devin_dispatch default host — flip ADA_DEVIN_DISPATCH_HOST from LAN IP to tailnet `tony-dell`
column: backlog
updated: 2026-10-10 09:40
priority: high
program: ada-tools
tags:
- devin-dispatch
