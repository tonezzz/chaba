spec: 'In ada-pi, the Ada -> Devin dispatch client still SSHes the tony-dell LAN IP.
  Change the default dispatch SSH target to the tailnet name `tony-dell`:
  - backend/devin_dispatch.py: ADA_DEVIN_DISPATCH_HOST default 192.168.2.67 -> tony-dell
    (everywhere the LAN IP is used for ssh — dispatch start/status/followup/logs
    commands all go through it)
  - tools.d/devin.py (and any declaration/doc strings): same target + description
  Rationale (verified live 2026-10-10, card devin-dispatch-lan-ip): from idc03 —
  Ada''s current home — `ssh 192.168.2.67` times out while `ssh -o BatchMode=yes
  tony-dell` succeeds. On tony-dell `tailscale debug prefs` shows RunSSH:false:
  tailscaled no longer intercepts :22, so the 2026-09-24 "LAN IP is mandatory"
  rule is stale. ssh configs already map `tony-dell` -> 100.68.142.13 with the
  right IdentityFile on mn01/idc03/tony-omen; MagicDNS covers the rest.
  Keep ADA_DEVIN_DISPATCH_HOST env override working. If any code comment cites
  the tailscaled-ssh re-auth rationale, correct it (superseded — see chaba
  docs/ssot/jobs/infrastructure/2026-10-10-dispatch-ssh-tailnet.yml).
  Verify: `ssh -o BatchMode=yes -o ConnectTimeout=6 tony-dell ~/.local/bin/devin-dispatch status`
  works from the Ada backend host after the change.'
