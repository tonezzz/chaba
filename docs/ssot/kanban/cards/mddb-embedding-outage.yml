id: mddb-embedding-outage
title: mddb idc03 — embedding provider chain dead, 2500+ docs dropped without vectors
brief: 'Since ~2026-10-09 morning all mddb embeddings fail: gemini-ollama-proxy returns
  "all same-space providers down (OR circuit-open + Gemini failed)". Chain: Gemini direct
  = 429 quota exhausted; OpenRouter = 402 credits exhausted; OLLAMA_FALLBACK_BASE never
  configured so idc03 local ollama (nomic-embed-text, verified healthy on
  100.102.134.91:11434) is never tried. Queue full (4000), droppedTotal ~2514 — those docs
  have no vector until reindexed. Vector search saturated 4/4 concurrent, 9828 rejected
  searches; binlog janitor lag is downstream of this.'
column: review
