requests:
- id: recovery-path
  ask: 'idc03 embedding is fully dead. Recommended: add OLLAMA_FALLBACK_BASE=http://100.102.134.91:11434
    to ~/.config/secrets/mddb-gemini.env on idc03 + restart gemini-ollama-proxy (dims match —
    nomic-embed-text is 768). Then reindex dropped docs. Alternatively: top up OpenRouter
    credits (402) or wait out the Gemini 429 quota window.'
