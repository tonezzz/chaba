  \ rest_served=0\n  verdict: \"ok — provider healthy — run proceeds\"\nada-dev produced ZERO journal lines all\
  \ of 2026-11-02 yet is-active=active (zombie uvicorn). The research suite then ran 05:55 and all 7 scenarios failed\
  \ in ~0.4s each.\n\nFix direction (pick in implementation): treat healthy_markers==0 && rest_served==0 && journal_lines\
  \ below a floor as inconclusive->infra (clean skip), or add a cheap live probe (GET /health or one ws connect)\
  \ before returning ok. Gate lives at scripts/ada/scenario-provider-gate.py; verdict logic ~line 490-513."
