spec: 'Extend host-hygiene with an R7 rule: declared capability or dead capability, one layer below services. Motivation
  (2026-11-07 rerank job): con01/idc02 had no pip, Omen had a silently broken sentence-transformers install, kk-mac
  offline — live state diverged from assumed capability and nothing reconciled. Deliverables: (1) docs/ssot/infrastructure/ssot.host-software.yml
  — per-host capability manifest (python, venv, python_ml via durable ~/.local/share/chaba-ml-venv, ollama models,
  node, podman) with probe definitions; (2) scripts/host-ready-check.py — ssh-probes each declared capability, reports
  pass/fail/unreachable per host per capability + --json-out; (3) scripts/host-capability-bootstrap.sh — per-capability
  install recipes (venv/pip via ensurepip, python_ml venv+cpu-torch+transformers, ollama pull, etc.); (4) weekly
  chaba-host-ready-check job in ssot.jobs.yml on idc03; (5) R7 section in docs/kb/host-hygiene-rules.md. Follow-up
  (not in this PR): focus-inbox flagging when the fail-set changes, mirroring lesson-drift-check.'
