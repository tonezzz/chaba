id: ncm-thai-adaptation
title: NCM (next-concept modeling) for Thai — feasibility + possible training run
column: done
updated: 2026-10-20 20:29
brief: 'Tony asked: what if we train HazyResearch/ncm for Thai? Repo is eval-only — Thai means reimplementing both
  training stages from the paper. Novel research artifact, no stack utility for Ada.'
priority: low
tags:
- research
- nlp
- thai
- parallel-generation
spec: 'Context: NCM (arXiv:2610.14162, Education post 1588 / lesson-51569f4faa8f) is a two-stage coarse-to-fine
  parallel text generator: multiscale residual VQ-VAE tokenizer + level-parallel transformer. Released checkpoints
  are <=725M params, English/German tasks only.


  Feasibility findings:

  - NO training code in repo (evaluate.py + shard scripts only). Training = reimplement both stages; VAR image codebase
  is the closest reference design.

  - Data: mC4/OSCAR Thai easily reach the paper-scale ~1B-token budget.

  - Compute: toy scale (~100-300M params) = single rented GPU, days, tens of dollars. Local GTX 1650 = toy-only.

  - Thai specifics: byte/char or SentencePiece base units (no spaces in Thai); eval via XL-Sum Thai, scb-mt-en-th,
  ThaiQA.

  - Value: first Thai coarse-to-fine generator (novel), good learning artifact. No Ada/stack payoff — not instruction-tuned.

  - Cheaper alternative for fast Thai generation: fine-tune existing small Thai AR model (Typhoon/WangchanX).


  Done-condition depends on the request outcome:

  - recon-spike: read paper training sections, estimate reimplementation LOC + compute, check/ask authors re training-code
  release, pick dataset+eval set; verdict comm on this card.

  - toy-train: additionally produce a working Thai NCM at TinyStories-equivalent scale with quality numbers vs a
  small AR Thai baseline.

  - watch-only: subscribe to repo; revisit when/if training code lands.'
ref: OPS-0750
