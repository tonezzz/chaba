  executor on idc02.


  TODAY: 8+ separate timers each scan the same card set: merge-sweep, answer-sweep, request-sweep, lab-review-sweep,
  backlog-audit, review-digest, kanban-stats (each own timer+service+state).


  DO: one board-janitor service — single tick (e.g. every 15m) running the sweeps as sub-checks in order, shared
  /cards fetch, per-check state file, per-check timeout, failure of one check does not skip the rest. Keep the existing
  sweep modules callable (import, do not rewrite logic). Render the single timer; retire the per-sweep timers in
  ssot.jobs.yml.

  - Preserve notify semantics (kanban-notify stays separate — it is event-driven not a sweep).

  - Report one summary line per tick to journald; per-check detail on failure only.

  TESTS: at minimum a smoke test that runs the janitor against a fixture card dir.

  DONE-CONDITION: one rendered unit replaces the sweep timers; check coverage parity documented in the card.'
