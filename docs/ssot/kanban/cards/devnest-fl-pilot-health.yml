      systemctl --user list-units --failed --no-legend (empty ok)

    Required JSON fields (exact names): host, collected_at,
    uptime_seconds, load1, load5, load15, cpu_count, mem_total_mb,
    mem_available_mb, disk_root_pct, failed_units, read_only.
    read_only MUST be true. The artifact lands at
    evals/opencode-lane/out/ops-readonly-health.json — emit the JSON as
    your final message and stop. No files, no writes, no secrets.
