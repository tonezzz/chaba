  text: 'Shortlist and evidence (web search, 2026-11-19): (1) anthropics/skills — skill-creator directly matches
    building/evaluating DEV-0230; webapp-testing offers Playwright-based browser/UI verification; mcp-builder is
    a useful design reference. Repo shows ~197k stars, but these are Claude implementation examples and per-skill
    LICENSE terms must be inspected; ADAPT the process, don''t import runtime assumptions. https://github.com/anthropics/skills/tree/main/skills/skill-creator
    https://github.com/anth'
- at: 2026-11-19 12:25
  from: devin
  text: 'Efficient-use plan: do NOT bulk-install skill collections. Keep a tiny registry of name+trigger; load full
    SKILL.md only for a matching task, then references/scripts only as needed (progressive disclosure). For DEV-0230,
    use skill-creator as an authoring/evaluation reference, not a dependency; build our own portable info-find skill
    and compare it against the current workflow on a small fixed prompt set. Measure source-selection accuracy,
    citation correctness, coverage, latency/token spend, fallb'
