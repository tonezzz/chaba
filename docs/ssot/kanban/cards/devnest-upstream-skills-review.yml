spec: 'Follow-up to DEV-0230: assess high-fit upstream Agent Skills for DevNest/Chaba after the info-find conversational-skill
  pilot. Inspect the actual skill files, license, maintenance/activity, bundled scripts/dependencies, tool/network
  assumptions, and overlap with existing project skills and safety rules. For each candidate, recommend adopt, adapt,
  or reject and propose a small test before any integration. Do not run third-party installers or import a whole
  repository without review. Candidate shortlist: Anthropic skill-creator (skill authoring/evals), Anthropic webapp-testing
  (Playwright UI verification), Addy Osmani code-review-and-quality or test-driven-development (engineering gates),
  Vercel web-design-guidelines (UI/accessibility review), Anthropic mcp-builder (MCP server design reference), and
  bregman-arie/devops-sre-skills (read-only SRE/runbook patterns). Deliverable: ranked fit matrix, overlap map against
  local skills/AGENTS rules, license/security notes, and adopt/adapt/reject recommendation.'
note: Initial web research found several mature catalogs, but ecosystem popularity is not enough to justify installation.
  Project already has local skills for info-find, health-check, SSOT search/validation, auto-kb, DevNest card operations,
  and host-specific operations; compare before adopting.
ref: DEV-0231
