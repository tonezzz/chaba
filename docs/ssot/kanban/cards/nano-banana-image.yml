  enables nano-banana edit/compose (image + instruction -> new image);
  (2) PNG -> vcast /frame store -> display-reachable URL; (3) relays
  already finish: tg_relay.send_photo(url) -> sendPhoto, line_relay
  turns cast_url/image_url into LINE imageMessage (public https only).
  (4) PROMPT-BUILDER FLOW: Ada interviews — subject/style/mood/ratio in
  one or two questions max, then confirms the assembled prompt before
  rendering. Params hidden from user — Ada picks aspect (1:1/16:9/9:16),
  style tags, and ref handling; user only sees the plain-words preview.
  Persona guidance belongs in DEFAULT_ADA_INSTRUCTIONS/tools desc, not a
  separate tool. Deferred: multi-turn conversational editing, veo video.
help: 'gen path: tool_runner._vcast_tts REST generateContent + _gemini_model;
