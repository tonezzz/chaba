spec: 'Phase 1: a noul/choice probe on loop state after N iterations -> halt threshold. Backend: jev-student noul
  (proven) for the halt decision; real Jev API for choice. Phase 2: wire into the runner''s per-job progress (heartbeat
  + recent outputs). Bench: replay the 4.4h stall -> does the gate HALT it early?'
