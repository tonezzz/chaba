title: Jev stagnation gate for agent/bench loops (ProgressGate pattern)
column: done
updated: 2026-11-26 03:56
brief: 'Semantic stagnation detection in agent loops: Jev judges the trajectory (recent actions/state) -> CONTINUE/WARN/REPLAN/HALT.
  Would have caught the 4.4h colibri thinking-grind (2026-10-24). Apply to bench loops (edu-agent-bench, colibri-bench,
  eval-code-lane) + the runner.'
