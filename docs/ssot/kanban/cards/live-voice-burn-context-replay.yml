note: 'Findings from the 2026-10-14 overnight dig (usage.jsonl + journald, 24h):


  Burn shape: 310 sessions, ~45.7M in / ~300K out. **~85% of input is TEXT, not audio** — context/system-prompt
  replay on every turn, not speech. Median session 40s / 89K in-tok; reconnect churn re-primes ~16K text each connect.


