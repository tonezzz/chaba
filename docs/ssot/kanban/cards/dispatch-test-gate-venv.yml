spec: 'scripts/board/dispatch_repos.py DEFAULT_TEST_CMD = ''python3 -m pytest tests -x -q'' runs system python;
  ada-pi''s repo gate does too. When the repo-under-test needs its own .venv deps (google.genai etc.) the gate false-fails
  and holds the merge — observed 2026-10-13 line-multihome dispatch (42/42 green under ada-pi .venv). Fix: resolve
  the test interpreter per repo — use <checkout>/.venv/bin/python -m pytest when present, fall back to system python3.
  ada-pi worktrees have no .venv: point at the canonical checkout''s venv (~/CascadeProjects/ada-pi/.venv on the
  runner host) or document venv resolution in dispatch_repos TEST_CMDS. Verify with a synthetic held-merge scenario.'
