id: cards-api-summary-gzip
title: '/cards read door: gzip + summary projection + discoverable filters'
column: backlog
updated: 2026-11-20 18:54
brief: GET /cards bare returns the full board (~15MB, ~2.6s) — card_query already supports id/column/action_status/since/offset/limit/fields
  but is undiscoverable and there is no compression. Fleet/agent callers keep fetching the whole board.
priority: medium
tags:
- board-api
- kanban
- performance
spec: '1) gzip response when Accept-Encoding allows (15MB JSON compresses ~10x). 2) Add ?summary=1 projection (id/ref/column/priority/updated/title/action.status
  — no comms/spec/brief) as the cheap default for overviews; keep full body opt-in via fields=all. 3) Document query
  params in docs/kb/board-api-read-door.md. Done when: curl -H Accept-Encoding: gzip /cards returns gzip and ?summary=1
  returns <1MB.'
ref: KNB-0147
