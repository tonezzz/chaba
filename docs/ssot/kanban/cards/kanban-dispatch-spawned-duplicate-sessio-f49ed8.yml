- at: 2026-11-08 16:12
  from: devin
  text: Root cause reproduced and fixed in isolated branch dispatch/20261108-160548-knb-1196. /action do=claim,
    move, and finish mutated the in-memory card under the flock but did not save it; the handler returned HTTP 200
    while disk state stayed queued/running. The new loopback concurrency test reproduced two successful claims before
    the fix and now proves one winner (200/400); move and finish persistence tests also pass. No production deployment
    yet; Omen, MacBook, and idc02 runners remain paused.
