spec: 'Add an explicit executor contract for delegated cards: action.executor=opencode|devin|script|manual and optional
  action.agent_profile/model/target_host. Board-api must preserve and validate executor/profile fields; dispatcher/runner
  must honor executor=opencode, require OPENCODE_LANES=1 and a compatible runner, and fail closed or request reroute
  instead of silently falling back to Devin. Persist executor/provider/model/profile in task meta, card comms, usage.json,
  and closeout. The OpenCode path must create an isolated worktree/branch, run the selected profile/model, land
  the declared artifact, run the verifier, then merge/close only with exit evidence and durable proof. Add tests
  for explicit OpenCode, unavailable OpenCode, explicit Devin, and no executor (safe classifier fallback). Add a
  read-only smoke card proving the end-to-end flow. No production/write capability expansion in this card.'
