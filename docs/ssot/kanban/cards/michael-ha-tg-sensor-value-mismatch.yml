spec: 'Michael noticed the sensor values sent via TG (weather-bakeoff / rain-watch reports) differ from what michael-ha
  shows. Suspects: (a) relay 127.0.0.1:18123 landing on the wrong HA instance; (b) weather-bakeoff reading a different
  entity/source than the HA dashboard; (c) stale/cached values or unit bucketing. Verify by fetching the same entity
  states via the relay AND directly on michael-ha, compare with what the TG report sent.'
