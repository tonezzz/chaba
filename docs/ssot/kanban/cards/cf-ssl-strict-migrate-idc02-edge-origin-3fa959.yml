id: cf-ssl-strict-migrate-idc02-edge-origin-3fa959
title: 'CF SSL=strict: migrate idc02 edge origin certs off tls internal, then flip zone'
column: done
updated: 2026-11-26 20:33
priority: medium
spec: 'Make surf-thailand.com zone SSL mode ''strict'' without breaking any proxied hostname.


  Current state (verified 2026-11-24):

  - Zone 4feb4a3682e44e38cce3feed65dba7f3 ssl=full, certificate_status=active

  - ~25 proxied names; origins: idc02 45.136.236.190 (caddy-edge, ALL tls internal), idc03 157.85.102.125 (api+app
  valid LE YE2), idc01 157.85.110.99 (unreachable), wiki.h3.gizmo-thailand.com 103.99.11.249 (LE cert lacks surf-thailand
  SANs)

  - idc02 Caddyfile: ~/.config/caddy/Caddyfile on idc02, every block has ''tls internal''


  Done when: ssl=strict live AND curl https://<every proxied name> returns its normal response (200/302/308 — never
  526/525).'
note: 'Follow-up to cloudflare-setup optional item. Zone ssl=full today; idc02 caddy-edge (~20 site blocks: tony-ha,
  kk-ha, michael-dev, boards, cms, monitor, status, www, apex, ada-code, ada-ocb, cline, netdata, opencode-*) all
  use ''tls internal'' = Caddy Local Authority certs — untrusted, strict would 526 every one. idc03 names (api,
  app) already serve valid LE. Blocked names to fix: idc03.surf-thailand.com (no cert at SNI — likely stale/unused,
  verify consumers or delete record), idc01.surf-thailand.'
ref: OPS-0027
