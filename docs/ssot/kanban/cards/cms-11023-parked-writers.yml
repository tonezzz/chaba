spec: 'Sweep every unit/env/script arg that pins MDDB_BASE_URL or --mddb to :11023 AND writes migrated collections
  (ada-cms-*, chaba-*, kb-*, documents, infrastructure-ssot, devin-kb). For pure-cms producers repoint env/arg to
  :11027; for mixed ones keep :11023 and add MDDB_CMS_URL=:11027 (_base() routing). Candidates found 2026-10-13:
  jev-bench.service + ops-health-report.service (idc03), flood-alert.service + ada-flood-news.service (tony-dell),
  ada-pi-orch-bench.service (tony-omen), plus chaba-audit-full.service (dell, check what it writes). Then complete
  the migration plan: delete parked collections on :11023 after the rollback window — until then any un-migrated
  writer silently publishes into a dead letterbox, which is exactly how the nest-* staleness cards happened.'
