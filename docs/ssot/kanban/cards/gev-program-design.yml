id: gev-program-design
title: GEV program — lane map, drain order, dispatch plan
brief: Tracker card that maps all the God's-Eye-View work and the order to do it in. For orientation — no action needed.
column: backlog
priority: high
note: 'Design/tracker for the gev-* family (program: gev, plus gev-command-whitelist which carries program: ada-tools). Repo
  lanes: chaba {gev-bridge, gev-health-loop, gev-screens}; ada-pi {gev-command-whitelist, gev-scenarios}; gods-eye-view {gev-map,
  gev-voice, gev-tours} — spec''d but UNARMED: the repo is not in dispatch-repos.conf and its origin is upstream bilawalsidhu
  (local main is 6 ahead, no pushable remote). Those three join the drain only after a pushable fork/remote exists or the
  work is pulled into chaba staging. Drain order: (1) gev-health-loop + gev-bridge — monitoring + core ws path; (2) gev-command-whitelist
  + gev-screens — the ada-pi card may run alongside the tool-merge wave only if files are disjoint, else queue behind it;
  gev-screens needs vcast-cast-lane healthy for its verify; (3) gev-scenarios LAST — regression gate for the whole program
  (same role as tools-regression-scenarios). App-side cards do not block the gate.'
