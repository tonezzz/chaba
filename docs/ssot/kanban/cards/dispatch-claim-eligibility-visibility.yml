id: dispatch-claim-eligibility-visibility
title: Surface why a queued dispatch card is unclaimable (label/host mismatch starves silently)
column: backlog
updated: 2026-11-07 16:00
priority: high
program: chaba-ci
tags:
- kanban-dispatch
