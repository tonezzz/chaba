spec: 'Hybrid delivery per Tony: LINE lanes get a poster jpeg + tailnet link, TG lanes get the video file itself.
  line_relay gains a video/link output path (host render output publicly - IMG_CACHE_DIR lane or doc-store asset);
  tg_relay sends the file via sendVideo. Done when ada_render_video output lands playable on both lanes.'
