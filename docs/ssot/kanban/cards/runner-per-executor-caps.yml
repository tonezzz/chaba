id: runner-per-executor-caps
title: 'runner-agent: per-executor claim caps + remote-lane load-gate exemption — stop jules/nlm idle slots starving
  local work'
column: backlog
updated: 2026-11-09 18:35
priority: high
tags:
- devnest
- queue
- efficiency
- jules
spec: 'Problem (observed 2026-11-09): remote-async executors (jules ~1h Google-side wait, nlm_batch) hold RUNNER_CAP
  slots while doing ~zero local work — omen at 3/3 jules means zero local dispatch capacity. Also heavyweight claims
  defer at RUNNER_MAX_LOAD_PC even though jules/nlm claims put no load on the host.


  DO in scripts/board/runner-agent.py (rides the same code ops-1244b is refactoring — coordinate, do not fork the
  claim path):

  1. Split cap: RUNNER_CAP stays the local-executor ceiling (devin/opencode/script/container); add RUNNER_REMOTE_CAP
  (default e.g. 6) counting remote executors {jules, nlm_batch, kk_mac_local} separately. A host can hold cap_local
  + cap_remote claims concurrently.

  2. Exempt remote executors from the RUNNER_MAX_LOAD_PC claim gate (the script-cap split RUNNER_SCRIPT_MAX_LOAD_PC
  already proves the pattern — apply the same per-class gate: remote lanes claim at load-independent ceiling, still
  bounded by their own quotas e.g. JULES_LANE_DAILY_CAP).

  3. claim_pass logs which cap/gate applied per declined card.

  TEST: extend tests/board — local cap full but remote free claims jules; load high still claims jules but not devin;
  script gate unchanged.

  DONE-CONDITION: per-executor caps live in unit env drop-ins; a jules-saturated host still claims local work and
  vice versa; tests green.'
