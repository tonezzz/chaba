id: ada-chat-machine-voice-bracket
title: Text chat — render machine voice as bracketed line + play button, no autoplay
brief: 'Tony via LINE 2026-10-09: ''Display machine voice as text in a bracket [machine voice] when in text chat.
  add play button for effect. no default play.'' Today the flat speechSynthesis voice (pwa/app.js systemSay, ~line
  305) auto-speaks on notify_voice events (~line 239), the response_completed ''text only'' fallback (~line 273),
  and boot voice — and its text lands in the log unlabelled (a bare ''This is the machine voice.'' line confused
  Tony in session ed55a8fcb6). Change: (1) every machine-voice utterance renders in the text log as a bracketed,
  visually distinct ''[machine voice] <text>'' line; (2) each such line gets a play button that replays it via speechSynthesis
  on demand; (3) NO autoplay on the text-chat surface — the voice only sounds when the user presses play (live-voice
  surface behaviour unchanged: response audio still plays there; this governs the text/chat log). Confirm LINE relay
  needs no change — it is text-only already.'
