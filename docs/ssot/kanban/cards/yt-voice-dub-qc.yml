note: 'From the E2E assessment (docs/assessments/yt-voice-dub-e2e-2026-10-06.md): every major defect Tony heard
  traced to caption artifacts, not edge-tts. Landed already: rolling-caption dedup, clean-vtt burn, <0.4s drop,
  --fix-map for TH mis-reads. Still open: a QC *gate* — score each cue (too few chars vs window, implausible chars/sec,
  dedup residue, untranslated/mistranslated TH fragments, speaker-marker noise), emit a QC report, and quarantine
  failures instead of synthesizing them. Second half: grow the --fix-map lane — watch-list of TH mis-read classes
  (ambiguous clusters, loanwords, ทร-clusters, numbers) with per-video dictionaries.'
help: 'renderer: scripts/ops/yt-vtt-dub.py (--fix-map, --dump-groups); corpus: mn01:~/media-corpus (was ~/yt-dub-prep);
  assessment: docs/assessments/yt-voice-dub-e2e-2026-10-06.md'
spec: 'Add a caption QC gate to yt-vtt-dub.py. (1) A --qc pass that scores every post-dedup cue/group before synthesis:
  chars-per-second bounds per language, min-text-vs-window ratio, leftover rolling-caption residue (high prefix
  overlap with previous cue after dedup), TH fragments that are unchanged EN (missed translation), and any cue containing
  raw speaker markers or bracketed stage directions that would be read aloud. (2) Emit a QC report (json + printed
  table) listing flagged cues with reasons; gate behavior: flagged cues are skipped for TTS but stay in the display
  burn, and the report is saved next to the output. (3) Start a per-video fix-map watch-list: seed the TH dictionary
  with the known mis-read classes from the v15 note (ตากลม/ตา-กลม, loanwords, ทร-clusters, numbers) and document
  how new entries get added. Verify on the staged corpus on mn01:~/media-corpus (4njFdBF_42I, U_io-pqPFfQ): flagged
  list should catch the known-bad patterns and a gated render should contain no duplicated or untranslated utterances.'
