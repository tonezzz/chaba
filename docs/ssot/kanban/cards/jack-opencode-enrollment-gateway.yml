id: jack-opencode-enrollment-gateway
title: Build VCAST-style one-time enrollment for Jack OpenCode
column: done
updated: 2026-10-27 17:32
brief: Let Jack paste a single-use browser enrollment code/URL and persist a scoped IDE session without exposing
  host/API keys.
priority: high
program: devnest
tags:
- opencode
- jack
- podman
- enrollment
- pairing
- idc02
spec: Implement the VCAST-style enrollment flow for the isolated Jack OpenCode Podman IDE on idc02. Provide a stable
  HTTPS /enroll page behind authenticated public/tailnet edge, accept a short-lived single-use random code or token,
  hash and consume it server-side, issue a Jack-scoped Secure/HttpOnly/SameSite session cookie/ticket, and redirect
  to the OpenCode route. Re-registration mints a fresh code and revokes/invalidates the prior Jack session. Keep
  LiteLLM, MCP, host, SSH, Ada, and Devin credentials server/container-side; never expose them to browser JS/localStorage.
  Gate the isolated Podman OpenCode route via the session proxy, support WebSockets, add revoke/health, TTL, audit,
  reset, and tests. First bind locally/tailnet on idc02; public Cloudflare Access path only after isolation smoke
  passes. Verify one-time use, expiry, replay rejection, re-registration, unauthenticated denial, workspace-only
  boundary, and browser UI access. Reuse the existing VCAST redeem pattern but do not reuse HA tokens or HA storage.
