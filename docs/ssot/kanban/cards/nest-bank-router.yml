id: nest-bank-router
title: 'Nest specialist: memory-bank router — cut Ada''s memory-query pause'
brief: Train a micro-specialist that routes a user request to the right MDDB memory bank(s) — or says "no memory
  needed" — instead of the current bank='all' fan-out across every bank. Targets Ada's audible pause on memory questions.
  Includes the bench suite so it joins the continuous train->bench->promote loop.
column: review
priority: high
program: chaba-nest
area: ada-tools
note: Today ada_memory_search defaults bank='all' — fan-out over every bank (memory_ops.memory_search, backend/tool_runner/memory.py).
  The pause Tony hears is embed latency + N vector searches + LLM tool-turn overhead. A router cuts the fan-out
  to 1-2 banks and can answer "no memory" outright — removing the whole path on non-memory turns.
spec: "Phase 0 — measure first (don't build on assumption):\n- Instrument ada_memory_search: log wall-time split\
  \ (query embed, per-bank\n  vector search, total) for ~a day of real calls. If embed latency\n  dominates (gemini-ollama-proxy\
  \ queue), the router only partly helps —\n  the doc should say so and weigh \"skip embed entirely\" wins separately.\n\
  Phase 1 — corpus + suite (the reusable deliverable):\n- Corpus: mine ada transcripts/session logs for every ada_memory_search\n\
  \  call — (utterance, bank arg, which bank produced the cited hit) = free\n  labeled cases. Augment with hand-labeled\
  \ no-memory utterances.\n- Suite in ada-pi tests/bench/: suites.yml entry `bank-router` with\n  golden (query->bank\
  \ hits), hard (ambiguous cross-bank), adversarial\n  (should-not-query: weather, small talk, live-data asks ->\
  \ must predict\n  \"skip\"). Register in domains.yml as a decision surface.\nPhase 2 — model:\n- distilbert multi-label\
  \ seq-cls (bank set + skip label) or gemma-270m\n  head — target <20ms CPU inference, fits the tony-omen-gtx1650\
  \ train\n  lane and the planned tony-dell lane.\nPhase 3 — wire + continuous:\n- ada_memory_search accepts a routed\
  \ bank hint (shadow first: log router\n  verdict vs bank='all' outcome, divergence -> corpus); promote only via\n\
  \  the promotion gate after shadow rows prove no recall loss.\n- Publish bench/train-* doc per loop contract;\
  \ lane meta rides the\n  nest-lane-tony-dell extension when it lands.\nAcceptance:\n- bench suite exists + champ\
  \ passes; shadow verdicts show bank='all'\n  recall preserved on routed subset; measured p50 memory-search latency\n\
  \  reduced >=40% on routed turns; skip verdicts verified zero-regret.\n"
help: 'Loop owner: scripts/ada/nest-train-loop.py (harvest->bench->gate). Corpus path: transcripts already record
  tool calls — bank arg + result bank are the labels. Pair with nest-lane-tony-dell for edge-inference numbers;
  adversarial skip cases are the differentiator vs a naive always-search baseline.'
