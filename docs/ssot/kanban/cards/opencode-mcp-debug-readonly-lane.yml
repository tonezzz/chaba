spec: 'Build the staged OpenCode tool-expansion lane. Phase 1: expose the existing mcp-debug server to OpenCode
  through the existing MCP allowlist proxy, allowing only read-only tools: mcp_debug (registered compact debug commands
  only), mcp_health, mcp_get_file, mcp_read_ssot, mcp_search_ssot, mcp_ssot_query, mcp_ssot_get, and mcp_mddb_doc.
  Explicitly deny mcp_raw, mcp_put_file, mcp_remediate, mcp_ssot_append, clipboard writes, and any write/deploy
  tool. Use a reversible user-level OpenCode MCP config; do not modify Devin MCP config. Verify tools/list contains
  only the allowlist, denied tools return a JSON-RPC error, mcp_health works on tony_dell, and an OpenCode read-only
  health/report task completes with usage metrics and a verifier artifact. Phase 2: supervised real read-only report
  job on one host. Phase 3: consider additional tools only after pass-rate, retry-rate, verifier, and token measurements.
  Keep OPENCODE_LANES gated for broad work; no deployment or production mutation in this card. Rollback is removing
  the OpenCode MCP entry/allowfile.'
