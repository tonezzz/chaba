id: tg-forward-provenance
title: 'tg_relay: label forwarded messages by original sender (forward_origin)'
column: done
updated: 2026-10-17 16:35
brief: Forwarded clips/messages are labeled by the forwarding account — Kraut treated Michael voice clips as Tony
  voice. Detect msg.forward_origin and attribute correctly.
priority: medium
tags:
- ada-voice
- telegram
- corpus
- provenance
spec: 'In tg_relay.py handle(): read msg.get("forward_origin") (MessageOriginUser/HiddenUser/Chat). Cases: (1) voice/audio/video_note
  forwards — save clip under original sender dir when resolvable (e.g. corpus/tg/michael/) with forwarded_by provenance
  in manifest, and prepend transcript turn with attribution like "(forwarded voice clip from Michael)" so the persona
  knows whose voice it is; (2) text forwards — prepend "(forwarded from X):" to the turn text; (3) photo/document/other
  media forwards — same attribution prefix. Unknown/hidden origin: fall back to forwarder identity but note "forwarded,
  origin hidden". Real-world proof: 2026-10-16 Tony forwarded 3 Michael clips to @KrautMNBot DM — relay labeled
  them tony/, transcripts went to Kraut as caller=tony, Kraut was confused when told they were Michael. Manual refile
  fixed corpus; this prevents recurrence.'
ref: OPS-0729
