id: or-management-key-activity
title: OR management key for per-call activity attribution
column: backlog
updated: 2026-11-12 14:11
spec: '/api/v1/activity needs a management key; the provisioned key can''t see per-call spend. Without it, attribution
  is inferred from logs each time. Optional: create mgmt key in OR dashboard, store in secrets, add to key-watch/report
  tooling.'
