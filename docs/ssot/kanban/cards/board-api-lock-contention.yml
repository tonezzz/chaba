id: board-api-lock-contention
title: board-api write latency — render/dispatch hold flock >25s causing 503s
column: backlog
updated: 2026-11-17 20:01
brief: Tony's board clicks delay then fail. journal shows "lock wait >25s path=/comment — 503" repeatedly (62 hits
  in 40min). Contenders on /tmp/board-api.lock include render-board2.py --if-changed (93% CPU) and kanban-dispatch.py.
  Writes time out while GET /cards stays fast.
priority: high
program: chaba-ci
tags:
- board-api
- performance
- kanban
ref: OPS-0725
spec: "Symptom (2026-11-17 ~18:20 ICT, idc03): POST /comment and /action\nrequests wait >25s on /tmp/board-api.lock\
  \ then return 503; client\nsees a long delay then failure. GET /cards responds 200 quickly.\n\nObserved holders\
  \ of /tmp/board-api.lock (lslocks/fuser):\n  - board-api.py itself (pid 533129)\n  - kanban-dispatch.py\n  - render\
  \ pipeline (render-board2.py --if-changed at ~93% CPU)\n\nAlso observed: render-board.py crashed with\nAttributeError:\
  \ 'str' object has no attribute 'get' in\ncompute_checks() — a card carried `action: spec-review` (scalar)\nwhere\
  \ the schema requires a dict. Fixed on the card side\n(nest-mgr-v2-actuation, commit 4eba1f9), but render-board.py\
  \ should\nalso harden: `a = c.get(\"action\") or {}` then `a.get(...)` assumes\ndict — wrap with isinstance check\
  \ so one malformed card can't kill\nthe whole board render.\n\nWork:\n1. Harden render-board.py compute_checks\
  \ (and audit siblings) against\n   non-dict action/pipeline fields.\n2. Profile why render-board2.py --if-changed\
  \ burns >90% CPU and\n   holds the lock so long — likely full-board re-render per change.\n   Options: incremental\
  \ render, render outside the write lock,\n   debounce/coalesce renders.\n3. Consider lock ordering/splitting:\
  \ card-file writes vs render\n   trigger vs WP-backed endpoints (/tmp/board-api-wp.lock exists but\n   card flock\
  \ is shared).\n4. Add a metric/log line: lock wait histogram per endpoint so\n   regressions are visible.\n\n\
  Done when: sustained board use (clicks + dispatch + render) shows\nwrite p95 < 2s and zero \"lock wait >25s\"\
  \ 503s in journal over a day.\n"
