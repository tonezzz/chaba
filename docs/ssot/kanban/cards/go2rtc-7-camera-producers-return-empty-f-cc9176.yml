spec: Fix the remaining go2rtc camera producers on tony-omen that return empty 200/0B frames for ip_cam_65 and the
  xiaomi_c100/c201 variants. Inspect and correct the producer configurations located in ~/.config/go2rtc/*.sh on
  tony-omen and check xiaomi-token-refresh.py. The target host is tony-omen and the relevant repo/environment context
  involves the local go2rtc setup. The done-condition is verified when requesting frame.jpeg for ip_cam_65, xiaomi_c100
  (and its variants), and xiaomi_c201 (and its variants) from the omen go2rtc instance successfully returns non-empty
  image payloads instead of 0B responses.
