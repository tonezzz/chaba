title: Focus Sessions
subtitle: Lightweight per-session plan and follow-up log
icon: 📒
version: 1

overview:
  purpose: |
    Keep a chronological, low-noise record of what was planned, what was done, and what
    needs follow-up for each focus session. This is not a duplicate of ssot.focus.yml
    history; it is a short-term working memory for the assistant and the user.
  scope: active and recently completed focuses only
  max_in_memory: 10
  archive_to: docs/ssot/ssot.focus.yml history section when a focus is archived

principles:
  - Append-only. Never rewrite past entries; create a new entry each session.
  - One entry per session, tied to one focus by label.
  - Skip empty fields. If there is no follow-up, omit it.
  - No full duplication of ssot.focus.current.yml or ssot.focus.yml.
  - Keep text terse; long artifacts belong in reports/ or KB.

entry_schema:
  date: ISO date of the session
  session: optional session id
  focus: label of the active focus being worked on
  source: how the session started (e.g., user request, continue, dispatcher)
  plan:
    - concise bullet of what was planned to do
  done:
    - concise bullet of what was actually completed
  follow_up:
    - next step, unresolved question, or deferred work
  next_action: one-line recommendation for the next session
  kb_items:
    - optional list of KB entries created or updated

workflow:
  - At session start, read the most recent session entry for the active focus to pick up follow_ups.
  - If the user asks for a plan, create a new entry with plan filled in and done/follow_up empty.
  - At session end, update done and follow_up in a new entry (do not edit the plan entry).
  - The mcp_focus tool may read the latest follow_up when there is no explicit user request.
  - The focus-dispatcher may append a summary entry after auto-activation.

example:
  - date: '2026-08-16'
    focus: TCP/IP link monitoring with auto-scan and safe fix
    source: continue
    plan:
    - Add 60s cache to mcp_debug/http_server.py
    - Update ssot.index.yml
    done:
    - Added cache and background refresh
    - Added ssot.index.yml entries
    follow_up:
    - Monitor whether 60s is too long for live CORS data
    next_action: Continue with mcp_focus implementation or activate next backlog item

sessions:
  - date: '2026-08-16'
    session: chaba-2026-08-16
    focus: TCP/IP link monitoring with auto-scan and safe fix
    source: continue
    plan:
      - Implement scripts/mcp-link-monitor.py
      - Update ssot.index.yml with new SSOTs
      - Add 60s cache to scripts/mcp_debug/http_server.py
    done:
      - Implemented mcp-link-monitor.py with cheap ICMP/TCP probes, state machine, scan/fix/alert flow, and IP-drift detection
      - Added ssot.host-roles.yml and related entries to ssot.index.yml
      - Added 60s cached mcp-savings.json CORS endpoint with background refresh to mcp_debug/http_server.py
    follow_up:
      - Deploy mcp-link-monitor.py as a systemd user timer/service for periodic checks
    next_action: Create and enable the mcp-link-monitor systemd units, or activate the next backlog focus

  - date: '2026-08-16'
    session: chaba-2026-08-16-mcp-debug-h3
    focus: Fix mcp_debug H3 page mixed-content (HTTP/HTTPS) error
    source: user request
    plan:
      - Assess and improve the focus intake decision SSOT for this bug report
      - Apply the chosen SSOT updates
    done:
      - Added live_bug_report case to ssot.focus.current.yml decision_tree
      - Appended the mcp_debug H3 mixed-content intake decision to ssot.focus.decisions.yml
      - User fixed chaba-h3 mcp_debug app.js and index.html (disabled HTTP live URL, added skeleton and fetch timeout)
    follow_up:
      - Verify the HTTPS page loads without mixed-content warnings
      - Deploy or push the chaba-h3 app changes
    next_action: Verify the page on chaba.h3 and push the chaba-h3 changes
  - date: '2026-08-16'
    session: chaba-2026-08-16-decision-capture
    focus: Continuous decision capture for focus and technical choices
    source: user request
    plan:
      - Answer how to continuously capture decision SSOT
      - Activate the focus and discuss hands-off processing while away
    done:
      - Proposed a three-layer decision-capture system (intake, technical SSOT, session decisions)
      - Activated the focus in ssot.focus.current.yml and ssot.focus.yml
      - Outlined the hands-off focus loop (scheduled focus-dispatcher + separate subagent runner)
    follow_up:
      - Implement the decision-capture schema and wiring
      - Decide whether to build the subagent runner or just enable the dispatcher scheduler
    next_action: Start the first subtask (define schema) or set up the focus-dispatcher systemd timer

  - date: '2026-08-16'
    session: chaba-2026-08-16-close
    focus: mcp-debug file & clipboard bridge
    source: user request
    plan:
      - Add all recent completed work into the focus sessions log and finish the session
    done:
      - Documented CSV-with-header table output and table_schemas in ssot.mcp-debug.yml
      - Added mcp_debug/formatters.py and the /mcp-table.json endpoint in http_server.py
      - Refactored focus-dispatcher.py into the scripts/focus_dispatcher/ package
      - Pointed mcp_debug CORS endpoint and H3 PHP proxy to tony-dell
      - Added H3 mcp_debug table detail view and /api/mcp-table.php proxy in chaba-h3
      - Completed mcp_report json/csv/html quick wins
      - Created ssot.technical-decisions.yml and registered it in ssot.index.yml
      - Updated tony_dell host role in ssot.mcp-debug.yml (headless primary CORS/link/overnight host)
      - Added UI policy SSOT item to the backlog in ssot.focus.yml
    follow_up:
      - Implement the 6 mcp-debug file & clipboard bridge subtasks
      - Decide when to resume the parked Trade Canvas UI focus
    next_action: Start the first file bridge subtask (create ssot.mcp-debug.files.yml)

  - date: '2026-08-16'
    session: chaba-2026-08-16-cleanup
    focus: Delegate tony-omen services and timers to tony-dell
    source: user request
    plan:
      - Commit the uncommitted SSOT/infrastructure drift and trade-canvas UI changes
      - Record the session in the focus log
    done:
      - Added SSOT optimization orchestration task and improvement
      - Updated tony-dell hardware, file-control policy, maintenance bloat check, and macbook system state
      - Completed mcp-debug baselines split (mcp_vet now writes to ssot.mcp-debug.baselines.yml)
      - Updated yomi-failover and Caddyfile to use tony-dell tailnet IP
      - Committed trade canvas compare UI and playlive-test SSOTs
      - Added Tailscale Funnel 404 and healthcheck to the focus backlog
    follow_up:
      - Push the 5 unpushed commits on master
      - Decide whether to activate the Tailscale Funnel 404 focus or a parked focus next
    next_action: Push to origin or activate the next focus

