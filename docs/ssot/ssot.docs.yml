title: Documentation Tools & Interesting Libraries
subtitle: Tools for document processing, LLM orchestration, and knowledge management
icon: 📚

sections:
  - title: Document Processing Tools
    icon: 🔧
    layout: list
    items:
      - label: Chunky
        text: Split and chunk text for LLM ingestion
      - label: Marker
        text: Process PDF documents into structured text
      - label: Crawl4AI
        text: Crawl and extract information from web pages
      - label: Instructor
        text: Structured output from LLMs using Pydantic schemas

  - title: LLM Infrastructure
    icon: 🤖
    layout: list
    items:
      - label: LLama.cpp
        text: Local LLM inference server (used via MCP and GPU queue)
      - label: LiteLLM
        text: Unified gateway and proxy for multiple LLM providers
      - label: DSPY
        text: Prompt engineering and LLM program optimization
      - label: Langfuse
        text: Observability and tracing for LLM calls

  - title: Vector & Storage
    icon: 🗄️
    layout: list
    items:
      - label: Qdrant
        text: Vector database for semantic search (alternative to Weaviate)
      - label: Weaviate
        text: Vector database currently in use (see ssot.test.weaviate.yml)

  - title: Interesting Libraries (To Evaluate)
    icon: 🔭
    layout: list
    items:
      - label: Montage
        text: Workflow orchestration — evaluate against current GPU queue approach
      - label: DeerFlow
        text: Workflow orchestration alternative
      - label: Codebase Memory MCP
        text: MCP server for persistent codebase understanding across sessions

