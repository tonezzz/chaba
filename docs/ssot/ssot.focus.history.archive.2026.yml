- label: mcp-debug visual capture bridge
  text: "Extend mcp-debug with lightweight, opt-in visual capture tools so the assistant\ncan see remote host state without switching to PlayLive or another MCP server.\nStart with non-interactive capture tools; avoid duplicating PlayLive's browser\nautomation and click/keyboard control.\n\nProposed design for the complicated bits (so this session does not need to solve them again):\n- `mcp_screenshot(host, region, format=png)` returns `{ok, content_base64, width, height, bytes, error}`.\n  Transport: macOS `screencapture -x -`; Linux `gnome-screenshot -f -`, `grim`, or `import`;\n  always base64-encode and cap at 2 MB (resize/compress if larger).\n- `mcp_window_list(host)` returns `{ok, windows: [{id, app, title, pid, focused}]}`.\n  Transport: macOS `lsappinfo`/`osascript`; X11 `xwininfo -root -tree`; Wayland `swaymsg -t get_tree`.\n- `mcp_clipboard_image_get(host)` returns `{ok, content_base64, format, bytes, error}`.\n  Transport: macOS `pbpaste -Prefer rtf` image path/NSPasteboard read; Linux `xclip -selection clipboard -t image/png -o`.\n- `mcp_a11y_tree(host, app)` returns a JSON UI element tree of a given app/window.\n  Transport: macOS AppleScript accessibility APIs; optional for later.\n\nSecurity defaults:\n- Per-host `capture: true` opt-in; default false on all hosts.\n- `mcp_screenshot` must support `region` cropping to avoid leaking full displays.\n- Hard cap on image size (2 MB default, 4 MB hard) with downscale for oversize.\n- All capture calls logged with host, type, region, and size.\n- clipboard-image is opt-in alongside clipboard text; never called automatically.\n\nImplementation order:\n1. macbook first (pbcopy/pbpaste + screencapture are safest and well documented).\n2. Add Linux screenshot fallbacks only after macOS path is stable.\n3. Do not add click/drag/keyboard automation; that stays in PlayLive.\n"
  date: '2026-08-17'
  duration: 1 session
  outcome: 'Completed subtasks: Promote this design to a dedicated SSOT (docs/ssot/infrastructure/ssot.mcp-debug.capture.yml), Add mcp_screenshot with macOS transport and size cap, Add mcp_window_list for macOS and Linux, Add mcp_clipboard_image_get for macOS, Update ssot.mcp-debug.yml with capture tools, per-host flags, and limits, Add smoke tests on macbook and one Linux host'
  tags:
  - mcp
  - mcp-debug
  - capture
  - screenshot
  - macos
  - visual
  - clipboard
  - completed
- label: tony-dell podman service migration
  text: 'Migrate non-GPU Docker services from tony-omen (89% full on /home, 9.6GB free)

    to tony-dell rootless podman (14GB RAM, 67GB free disk, podman 5.7.0). tony-dell

    already runs postgres (chaba-postgres-16) and yomi-api under podman since

    2026-08-16, but both have restart=no and no Quadlet units, so they will not

    survive a reboot. tony-omen still runs a duplicate postgres container and six

    duplicate github-mcp-server containers that should be removed.

    Migration candidates (no GPU): redis, mddb + mddb-panel, raceman-php +

    raceman-web, status-api, weaviate. Must stay on tony-omen: GPU services

    (llama-server, imagen2, ollama, gpu-queue, gpu-queue-processor) and the caddy

    web edge. See ssot.containerization.yml, ssot.services.yml, and

    ssot.yomi-failover.yml for current disposition.

    '
  date: '2026-08-17'
  duration: 2 sessions
  outcome: 'Completed subtasks: Harden existing tony-dell podman containers with Quadlet units, Decommission tony-omen duplicate postgres container, Remove six duplicate github-mcp-server containers on tony-omen, Migrate redis to tony-dell podman, Migrate mddb + mddb-panel to tony-dell podman, Migrate raceman stack to tony-dell podman, Assess weaviate migration to tony-dell, Update ssot.services.yml and ssot.containerization.yml with new disposition'
