    text: "Extend mcp-debug with small, auditable file-transfer tools so the assistant can\nfetch remote logs/configs and\
      \ push small scripts without leaving the MCP workflow.\nClipboard support is out-of-scope for the first pass and should\
      \ be added as a\nseparate, experimental tool after file transfer is stable.\n\nProposed design for the complicated bits\
      \ (so this session does not need to solve them again):\n- `mcp_get_file(host, path, max_bytes=65536)` returns `{ok,\
      \ encoding, content_base64, size, truncated}`.\n  Transport: existing SSH exec with `cat` or `head -c`, base64-encode\
      \ the payload.\n- `mcp_put_file(host, path, content_base64, mode=\"644\", overwrite=false)` returns `{ok, path, bytes_written}`.\n\
      \  Transport: existing SSH exec with a heredoc after path-allowlist vetting.\n- `mcp_clipboard_get(host)` / `mcp_clipboard_set(host,\
      \ text)` are macOS `pbpaste`/`pbcopy`\n  or Linux `xclip`/`xsel`/`wl-clipboard`. Disabled by default; per-host opt-in\
      \ only.\n\nSecurity defaults:\n- Per-host `allowed_path_prefixes` (e.g. `~/.local`, `/tmp`, `~/.config`, project dirs).\n\
      - Hard `max_bytes` cap and a `truncated` flag.\n- `overwrite=false` by default; confirmation required for writes outside\
      \ the allow-list.\n- All get/put calls logged with host, path, size, and result.\n"
