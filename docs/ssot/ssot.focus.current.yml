  layout: list
  items:
  - label: Split status-api into sensor reader and data API
    text: Refactor status-api into a stripped hardware-sensor reader that stays on tony-omen, plus a data/web API that runs
      on tony-dell and kk-macbook and receives sensor payloads. Frees tony-omen from the full web UI image.
    status: active
    priority: low
    started: '2026-08-17'
    tags:
    - status-api
    - tony-omen
    - tony-dell
    - macbook
    - refactor
    subtasks:
    - label: Create sensor-reader on tony-omen (extracted from status-api)
      status: in_progress
    - label: Create status-data-api on tony-dell and kk-macbook
      status: not_started
    - label: Update Caddy /api proxy to tony-dell
      status: not_started
    - label: Update health checks and SSOTs
      status: not_started
    - label: Decommission old status-api
      status: not_started
    request_log:
    - text: User approved implementing the status-api split after the MacBook focus was blocked.
- title: Quick Wins
  icon: quick
  layout: list
  items:
  - label: Migrate helm to tony-dell podman
    text: Move the web-helm service from tony-omen docker to tony-dell rootless podman, update Caddy /apps/helm proxy, and
      retire the tony-omen container.
    status: completed
    completed: '2026-08-17'
    started: '2026-08-17'
    priority: high
    tags:
    - tony-dell
    - podman
    - helm
    - migration
    - quick-win
