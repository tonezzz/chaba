            matched_to: Adopt focus-intake-only workflow with activation gate and apps/focus page

  - title: Active Branch Focus
    icon: branch
    layout: list
    items:
      - label: Chaba Infrastructure & Monitoring Cleanup
        text: Close out the dangling chaba infrastructure work before picking up new strategic focuses.
        branch: chaba
