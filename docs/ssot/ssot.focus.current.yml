        status: active
        priority: high
        started: 2026-08-15
        estimated_duration: 1 session
        tags: [focus, workflow, tracking]
        subtasks:
          - label: Redesign ssot.focus.yml schema for request mapping
            status: completed
          - label: Move old strategic focuses to inactive archive
            status: completed
          - label: Define assistant request-handling workflow
            status: completed
          - label: Summarize and publish new active focus
            status: completed
          - label: Use the workflow on every future assistant request
            status: not_started
          - label: Implement targeted ssot-search reads for ssot.focus.yml
            status: not_started
          - label: Split ssot.focus.yml into active and archive files when it exceeds 20KB
            status: not_started
          - label: Apply .current style to expected large SSOT files to reduce token reads
            status: completed
          - label: Adopt focus-intake-only workflow with activation gate and apps/focus page
            status: not_started
        request_log:
          - date: 2026-08-15
            request: Improve focus SSOT so every request is checked against a task or subtask and assigned or merged accordingly; keep old focuses in inactive and generate a new focus to follow up.
            matched_to: Redesign ssot.focus.yml schema for request mapping
          - date: 2026-08-15
            request: Save the token-bloat mitigation recommendation for ssot.focus.yml into the focus so it is not lost track.
            matched_to: Implement targeted ssot-search reads for ssot.focus.yml
          - date: 2026-08-15
            request: Apply .current style to expected large SSOT files to reduce token reads.
            matched_to: Apply .current style to expected large SSOT files to reduce token reads
          - date: 2026-08-15
