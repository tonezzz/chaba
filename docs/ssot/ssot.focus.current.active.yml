  - label: Tony-Dell cannot see iPhone Personal Hotspot SSID
    text: 'tony-dell''s Wi-Fi interface (wlx00761100125e) does not show the iPhone Personal Hotspot in scans.

      Initial check: the adapter is a Ralink MT7601U (148f:7601) which is 2.4 GHz only.

      iPhone Personal Hotspot on newer iOS defaults to 5 GHz when "Maximize Compatibility" is off,

      so the most likely fix is enabling "Maximize Compatibility" on the iPhone, forcing 2.4 GHz.

      If that is not enough, investigate driver/regulatory region, power-saving, and whether the

      hotspot is using a hidden SSID.

      '
    branch: tony-dell
    status: completed
    priority: medium
    started: '2026-08-24'
    completed_at: '2026-08-25'
    outcome: 'Enabled Maximize Compatibility on iPhone and rescanned tony-dell. The iPhone hotspot SSID "TONY-IP" is now visible on
      2.4 GHz channel 6. The MT7601U driver is 2.4 GHz-only and working correctly.'
    estimated_duration: 1 session
    tags:
    - tony-dell
    - wifi
    - iphone
    - hotspot
    - network
    - mt7601u
    subtasks:
    - label: Enable "Maximize Compatibility" on iPhone Personal Hotspot and rescan on tony-dell
      status: completed
      completed_at: '2026-08-25'
      note: iPhone hotspot "TONY-IP" now visible on tony-dell after enabling Maximize Compatibility (2.4 GHz).
