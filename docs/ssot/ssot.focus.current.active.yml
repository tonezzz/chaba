      \ via model-asserted confirmed=true.\n Fixes shipped (ada-pi d63e368/33e35f6/a4a4e72, deployed idc01): memory-first\
      \ steering in instructions; ADA_TOOL_CALL_BUDGET=20 + answer-now nudge; ADA_ACTUATION_BUDGET=6/turn; confirmed=true\
