  - label: yomi-llm-rate-limits
    text: 'Yomi conversation processing on tony-dell is sensitive to the Gemini model

      and rate limits configured in the yomi-api systemd user service. We already

      switched the live `yomi-api.service` environment from `gemma-4-31b-it` (which

      returns 401) to `gemini-3.5-flash-lite` (which connects), but the

      `chaba-tony-dell/stacks/web/docker-compose.yml` still lists

      `gemini-2.5-flash` and the `gemma-4` vision models. The

      `EMBEDDING_SERVICE_URL` is also stale (`100.75.102.88:5000`) and unused by

      `yomi-api.mjs`, which instead calls Google''s `getGeminiEmbedding`.


      The immediate goal is to make sure `process-conversations.mjs` can run

      reliably without exhausting the Google free-tier, and to reconcile the

      runtime `.service` configuration with the versioned compose/worktree source

      of truth.

      '
