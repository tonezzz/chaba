  - label: 'SSOT optimize: infrastructure/ssot.home-assistant.michael.yml'
    text: |
      Resolved the data-isolation warning in `ssot.home-assistant.michael.yml`
      by replacing the hardcoded HA core container IP with the Docker network
      hostname `homeassistant` and centralizing the canonical value in
      `ssot.values.yml` (hosts.michael_ha.hassio_network_host). The same change
      was applied to `ssot.home-assistant.mcp.yml` and the tony-dell
      `michael-ha-mcp-tunnel.service`, which was reloaded and is active. Also
      tightened `ssot-validate-all.mjs` so placeholder values (e.g. `<TOKEN>`)
      and multi-line key/value pairs no longer trigger false secret-value
      warnings, clearing the remaining howto/michael.dev alerts.
    status: completed
    priority: medium
