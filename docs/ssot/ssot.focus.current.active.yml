    subtasks:
    - label: Enable "Maximize Compatibility" on iPhone Personal Hotspot and rescan on tony-dell
      status: deferred
      deferred_at: '2026-08-19'
      resume_session: chaba
      resume_note: iPhone manual step; will be handled in another session
    - label: If still invisible, verify driver/firmware and regulatory domain for MT7601U
      status: completed
      completed: '2026-08-18'
      note: MT7601U (148f:7601) is present and the driver mt7601u is loaded. The adapter is 2.4 GHz only (channels 1-14, 2412-2484
