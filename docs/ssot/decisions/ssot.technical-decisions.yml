title: Technical Decisions
subtitle: Record of significant design trade-offs and the reasoning behind them
icon: ⚖️
version: 1

overview:
  purpose: |
    Keep a durable, searchable record of why a particular design or implementation
    choice was made, what options were considered, and what the consequences were.
    This is not a discussion log; it is a concise decision record that other SSOTs
    can reference.
  scope:
    - Cross-cutting architecture choices
    - Security and deployment trade-offs
    - Tooling and host selection decisions
    - Focus and workflow policy changes
  out_of_scope:
    - Routine bug fixes with no design options
    - Focus history (see ssot.focus.yml)
    - Session notes (see ssot.focus.sessions.yml)

archive: docs/ssot/decisions/ssot.technical-decisions.archive.2026.yml

decisions:
  - id: mcp-debug-file-clipboard-bridge
    date: '2026-08-17'
    title: How to add auditable remote file get/put to mcp-debug
    status: accepted
    context: |
      The assistant frequently needs to fetch remote logs/configs and push small scripts
      to tony-omen and tony-dell without leaving the MCP workflow. Existing `mcp_raw` is
      too permissive and does not enforce path allowlists, size caps, or base64 transport.
    options:
      - label: Extend mcp_raw with allowlist and size arguments
        pros: [reuses the existing raw-command path, minimal new code]
        cons: [blurs the line between raw and auditable commands, harder to log, harder to vet]
      - label: Add dedicated mcp_get_file and mcp_put_file tools
        pros: [clear contract, path-allowlist per host, hard size cap, base64 payload, overwrite control, detailed logging]
        cons: [new tool schemas, new SSOT file, more code in tools.py]
      - label: Use a separate file-transfer MCP server
        pros: [isolated security surface, could reuse scp/sftp]
        cons: [extra process, extra configuration, tailnet auth complexity]
    chosen: Add dedicated mcp_get_file and mcp_put_file tools
    reasoning: |
      A dedicated tool gives a precise contract and security defaults: per-host
      allowed_path_prefixes, 1 MiB hard cap, overwrite=false by default, and base64
      transport so binary content is safe over JSON. It lives in the same mcp-debug
      server, reusing existing `run_on_host` SSH transport, but is auditable and
      user-confirmable. Clipboard support is kept as an experimental, disabled-by-default
      add-on after file transfer is stable.
    consequences:
      - docs/ssot/infrastructure/ssot.mcp-debug.files.yml added with tool contract, allowlists, and limits
      - tools.py already contains mcp_get_file, mcp_put_file, mcp_clipboard_get, mcp_clipboard_set
      - server.py already exposes the tool schemas and dispatch
      - Round-trip smoke tests succeeded on tony-omen and tony-dell
    related:
      - docs/ssot/infrastructure/ssot.mcp-debug.files.yml
      - docs/ssot/infrastructure/ssot.mcp-debug.yml
      - scripts/mcp_debug/tools.py
      - scripts/mcp_debug/server.py

  - id: migrate-core-services-to-tony-dell-podman
    date: '2026-08-17'
    title: Migrate core chaba services from tony-omen Docker to tony-dell rootless Podman with Quadlet
    status: accepted
    context: |
      Several long-running chaba services (mddb, mddb-panel, redis, yomi-api, weaviate, raceman, postgres)
      had been running on tony-omen under Docker. To consolidate hosting, improve startup reliability,
      and run containers as an unprivileged user, we moved the workload to tony-dell using rootless Podman
      with Quadlet systemd units.
    options:
      - label: Keep Docker on tony-omen
        pros: [no migration work, existing volumes and compose files keep working]
        cons: [continues to rely on tony-omen for critical data services, no rootless isolation]
      - label: Move to tony-dell Docker with compose
        pros: [familiar docker compose tooling, direct volume migration]
        cons: [still requires rootful Docker or complex rootless setup, no native systemd integration]
      - label: Move to tony-dell rootless Podman with Quadlet
        pros: [systemd user units auto-start on boot, no root privileges, host-network simplifies known ports, aligns with existing Quadlet work]
        cons: [new Quadlet units to write, image imports via docker save | podman load, port conflicts must be resolved per service]
    chosen: Move to tony-dell rootless Podman with Quadlet
    reasoning: |
      Rootless Podman with Quadlet gives native systemd user integration, starts containers at boot without
      root, and keeps the network model simple by using --network host for most services. The migration
      reused already-built Docker images where possible (docker save | podman load) and copied data volumes
      to per-service paths under ~/.config/containers on tony-dell. Known port conflicts were resolved by
      explicit port assignments: mddb API 11023, mddb MCP 9000, raceman-php 9001, mddb-panel 3002,
      weaviate 8084 (because chaba-funnel uses 8082), and raceman-web 8083. Caddy on tony-omen now
      reverse-proxies these services from 100.68.142.13. Client MCP configs were repointed from
      localhost:9001 to 100.68.142.13:9000.
    consequences:
      - Quadlet units created at ~/.config/containers/systemd/ and enabled user services
      - Service data copied to tony-dell under /home/tony/.config/containers/<service>
      - Caddy /mddb/*, /apps/raceman/*, /apps/weaviate, and other routes now proxy to 100.68.142.13
      - mddb decommissioned on tony-omen; mddb-mcp health check now targets 100.68.142.13:9000
      - Local client configs updated: ~/.config/devin/mcp_config.json, ~/.config/windsurf/mcp_config.json, and ~/.config/Claude/mddb-bridge.py
      - Recovery actions in ssot.health.*.yml still reference old docker compose paths and should be updated
    related:
      - docs/ssot/infrastructure/ssot.services.yml
      - docs/ssot/infrastructure/ssot.containerization.yml
      - docs/ssot/infrastructure/ssot.health.home.yml
      - docs/ssot/infrastructure/ssot.mcp.yml
      - ~/.config/devin/mcp_config.json
      - ~/.config/Claude/mddb-bridge.py
      - stacks/web/Caddyfile

  - id: mcp-focus-decision-logging
    date: '2026-08-17'
    title: How to record focus intake, technical, and session decisions through mcp_focus
    status: accepted
    context: |
      The focus system needs continuous decision capture: intake dispositions,
      design trade-offs, and per-session choices. These should be durable,
      searchable, and append-only without allowing arbitrary SSOT edits.
    options:
      - label: Separate tools for each log type
        pros: [clear contract per destination, easy to permission independently]
        cons: [more MCP tools, more server wiring, more to remember]
      - label: Single mcp_focus with modes
        pros: [reuses existing session-start tool, keeps decision writing next to focus router, fewer tools]
        cons: [larger tool schema, mode dispatch adds complexity]
    chosen: Single mcp_focus with modes
    reasoning: |
      mcp_focus is already the session router. Adding technical_decision and
      session_summary modes keeps the decision capture surface small. The tools
      append only to whitelisted SSOTs and do not modify focus state. Intake
      decisions continue to be logged automatically in recommend mode.
    consequences:
      - scripts/mcp_debug/focus.py now supports mode=technical_decision and mode=session_summary
      - scripts/mcp_debug/server.py exposes the new modes in the mcp_focus tool schema
      - docs/ssot/infrastructure/ssot.mcp-focus.yml documents the new modes
      - docs/ssot/ssot.focus.sessions.yml entry_schema now includes a decisions list
    related:
      - docs/ssot/infrastructure/ssot.mcp-focus.yml
      - scripts/mcp_debug/focus.py
      - scripts/mcp_debug/server.py
      - docs/ssot/ssot.focus.sessions.yml

  - id: rview-view-number-and-media-fallback
    date: '2026-08-22'
    title: Auto-number RView views and fall back to iframe on media load failure
    status: accepted
    context: |
      RView views were referenced only by opaque view_id. Users wanted to open
      any view by a stable number and have a fallback when remote images/videos
      failed to load.
    options:
      - label: Keep view_id only and expose a separate number mapping
        pros: [no schema change, simple lookup table]
        cons: [extra API surface, number can drift when views are deleted]
      - label: Add view_number to each view and resolve numeric view_id as view_number
        pros: [stable auto-number, backward-compatible view_id support, easy URL sharing]
        cons: [requires migration for persisted views without view_number]
      - label: Fail visibly and require the user to pick a different URL
        pros: [no UI complexity]
        cons: [poor UX for Gemini-generated or third-party media]
      - label: Replace failed media with an iframe fallback
        pros: [handles broken images/videos/PDFs gracefully, keeps viewer visible]
        cons: [iframing some URLs may still fail or show mixed-content errors]
    chosen: Add view_number and use iframe fallback
    reasoning: |
      Auto-numbering gives every view a stable, shareable `?view=<number>` URL
      while preserving `view_id` compatibility. Interpreting a numeric `view_id`
      as `view_number` is intuitive and matches the URL parameter. Falling back
      to an iframe lets Gemini-supplied or third-party URLs still render even
      when the browser cannot decode them natively.
    consequences:
      - rview-api.mjs assigns view_number on creation and migrates existing state
      - RView UI uses VIEW_KEY ('view_number' for numeric, 'view_id' otherwise)
      - Failed image/video/audio/PDF elements are replaced by an iframe with the same URL
      - SSOT and MCP tool schemas updated to expose view_number
    related:
      - docs/kb/rview-tony-dell-operations.md
      - stacks/web/rview-api/rview-api.mjs
      - stacks/web/public/apps/rview/index.html

  - id: ha-live-uses-port-8444
    date: '2026-08-29'
    title: Use port 8444 for the Home Assistant Gemini Live bridge (ha-live)
    status: accepted
    context: |
      Port 8444 had been used for the legacy Chaba Funnel landing page. The new
      Home Assistant Gemini Live bridge (ha-live) needs a public Tailscale Funnel
      endpoint. Reusing 8444 for ha-live keeps the public landing page URL stable
      while retiring the old Chaba Funnel service.
    options:
      - label: Keep 8444 for the old Chaba Funnel landing page
        pros: [no URL changes for any bookmarks, no bridge reconfiguration]
        cons: [Chaba Funnel is decommissioned, 8444 would point at a dead service]
      - label: Repoint 8444 to the ha-live Gemini Live bridge
        pros: [stable public URL retained, frees 8444 from dead funnel, matches ha-live intent]
        cons: [any remaining Chaba Funnel bookmarks break, SSOT and docs need sweep]
      - label: Assign ha-live a new Tailscale port
        pros: [no historical port baggage, clean separation from old funnel]
        cons: [breaks existing public link, requires re-sharing the bridge URL]
    chosen: Repoint 8444 to the ha-live Gemini Live bridge
    reasoning: |
      The old Chaba Funnel is gone. The public `https://tony-dell.taila0626a.ts.net:8444/`
      URL should serve the Gemini Live bridge, which proxies to `127.0.0.1:9005`.
      This preserves the only public landing-page path users may have while making the
      endpoint useful. SSOT, health checks, docs, and the public apps index were all
      swept to remove stale Chaba Funnel references.
    consequences:
      - 'Tailscale 8444 now funnels to 127.0.0.1:9005 (ha-live)'
      - 'https://tony-dell.taila0626a.ts.net:8444/ is the canonical Gemini Live bridge URL'
      - 'chaba-funnel references removed from ssot.values.yml, health SSOT, KB, and public pages'
      - 'Old ssot.health 8444 health check repointed to ha-live'
    related:
      - docs/ssot/infrastructure/ssot.values.yml
      - docs/ssot/infrastructure/ssot.health.home.web.yml
      - docs/kb/tailscale-rollout-public.md
      - stacks/web/public/apps/index.html
      - stacks/web/public/apps/tailscale-funnel/index.html

  - id: workflows-mcp-persistent-container
    date: '2026-08-29'
    title: Run Workflows MCP as a persistent Podman container on tony-dell
    status: accepted
    context: |
      The Workflows MCP was previously wrapped through a fresh SSH invocation per
      request. This added latency, required a new Podman exec each time, and made
      container lifecycle management inconsistent with other persistent MCP servers.
    options:
      - label: Keep one-shot SSH wrapper per request
        pros: [fresh container state for each call, simple wrapper script]
        cons: [high latency, repeated exec overhead, harder to debug logs]
      - label: Run a persistent Podman container and connect via podman exec
        pros: [faster connection, stable logs, single container lifecycle, same model as mcp-health]
        cons: [requires a long-lived container, systemd user unit, and wrapper that execs into it]
    chosen: Run a persistent Podman container and connect via podman exec
    reasoning: |
      Persistent containers are already the norm for tony-dell MCP servers. A
      `workflows-mcp.service` systemd user unit keeps the container running, and the
      MCP wrapper uses `podman exec -i workflows-mcp workflows-mcp` to connect over
      stdio. This removes per-request SSH/podman startup and aligns the Workflows MCP
      with the rest of the tony-dell MCP fleet.
    consequences:
      - "docs/ssot/infrastructure/ssot.health.home.mcp.yml now monitors workflows-mcp.service"
      - "docs/ssot/infrastructure/ssot.mcp-wrappers.yml mcp-workflows entry updated to persistent mode"
      - "New systemd user unit workflows-mcp.service on tony-dell"
      - "Wrapper script mcp-workflows-podman-ssh.sh now does podman exec instead of starting a new container"
    related:
      - docs/ssot/infrastructure/ssot.health.home.mcp.yml
      - docs/ssot/infrastructure/ssot.mcp-wrappers.yml
      - ~/.config/devin/mcp-scripts/mcp-workflows-podman-ssh.sh
      - docs/ssot/infrastructure/ssot.mcp.yml

  - id: yolo-service-on-tony-dell
    date: '2026-09-11'
    title: Run Ultralytics YOLO service on tony-dell
    status: accepted
    context: |
      Prototype YOLOv8n service (experiments/ultralytics-yolo-ha) consumes go2rtc streams and
      exposes detections, an annotated image, and TV casting. Benchmarks: tony-omen CPU ~0.34 fps,
      GPU ~0.37 fps; kk-macbook ~0.31 fps; tony-dell local go2rtc (ip_cam_65_low 640x360) ~0.82 fps.
    chosen: tony-dell
    reasoning: |
      tony-dell hosts go2rtc and HA. tony-omen has a faster CPU/GPU but still fetches frames
      remotely, kk-macbook adds Podman VM overhead, while tony-dell avoids LAN frame transport
      and remote token management. The GPU did not improve end-to-end throughput because the
      go2rtc JPEG fetch was the bottleneck.
    consequences:
      - Run with venv /home/tony/.cache/ultralytics-yolo-venv and experiments/ultralytics-yolo-ha/server.py
      - Use GO2RTC_BASE=http://127.0.0.1:1984
      - camera-monitor.service stopped to end go2rtc restart loops from expired xiaomi_c201 passToken
      - Source is ip_cam_65_low until xiaomi_c201 token is refreshed from account.xiaomi.com cookies
      - Measured ~0.82 fps on ip_cam_65_low; retry Podman build after disk I/O settles
    related:
      - experiments/ultralytics-yolo-ha/server.py
      - experiments/ultralytics-yolo-ha/Containerfile
      - docs/ssot/infrastructure/ssot.health.home.web.yml
      - ~/.config/go2rtc/go2rtc.yaml

  - id: tony-ha-tailscale-only-access
    date: '2026-09-18'
    title: tony-ha reachable only via Tailscale HTTPS; use one URL for internal and external
    status: accepted
    context: |
      Setting up the Home Assistant companion app surfaced that tony-ha had no
      working LAN URL. HA binds loopback only (configuration.yaml http.server_host:
      127.0.0.1), so http://tony-dell:8123 and http://tony-dell.local:8123 fail —
      tailscaled owns 8123 on the tailnet IP and answers plain HTTP with
      "Client sent an HTTP request to an HTTPS server". tailscale serve provides
      the TLS-terminating proxy https://tony-dell.taila0626a.ts.net:8123 ->
      127.0.0.1:8123 (tailnet only, no Funnel on this port).
    options:
      - label: Expose plain HTTP on the LAN interface
        pros: [works without Tailscale, simple http://192.168.2.67:8123]
        cons: [widens LAN attack surface, duplicates the existing tailnet path, needs http.server_host change + restart]
      - label: Path-prefixed Caddy route (/apps/ha/tony-ha/)
        pros: [LAN HTTP via existing Caddy]
        cons: [HA UI absolute redirects break path-prefixed proxying — already rejected for michael-dev]
      - label: Use the tailscale serve HTTPS URL for both internal and external
        pros: [single canonical URL, works on LAN and remote, TLS everywhere, no HA change]
        cons: [requires Tailscale client connected on the device]
    chosen: Use the tailscale serve HTTPS URL for both internal and external
    reasoning: |
      One URL (https://tony-dell.taila0626a.ts.net:8123) covers home WiFi and
      remote access as long as the client is on the tailnet. No HA or proxy
      changes are needed and it avoids reopening a plain-HTTP listener on the
      LAN. The path-prefixed Caddy option was previously abandoned for
      michael-dev because HA absolute redirects break under a path prefix.
    consequences:
      - 'HA app: set both internal and external URL to https://tony-dell.taila0626a.ts.net:8123'
      - 'Client devices must run Tailscale; no TOTP/MFA on tony-ha (password-only login)'
      - 'Stale http://tony-dell:8123 references fixed in instances/services/health/node-red SSOTs and AGENTS.md'
      - 'Phantom Caddy /apps/ha/tony-ha/ and /api/ha-mcp/ routes marked not-implemented in SSOT'
    related:
      - docs/ssot/infrastructure/ssot.home-assistant.instances.yml
      - docs/ssot/infrastructure/ssot.home-assistant.yml
      - docs/ssot/infrastructure/ssot.services.yml
      - docs/ssot/infrastructure/ssot.health.home.web.yml
      - ~/.config/home-assistant/configuration.yaml

  - id: ada-calendar-provider-backend
    date: '2026-09-21'
    title: How ada gets calendar + tasks tools that can switch between Google, iCloud, and Outlook
    status: accepted
    context: |
      Ada needed calendar reading and task planning tools. The natural instinct
      was to find an MCP repo, but ada's ToolRunner dispatches tool calls to
      native Python methods — MCP servers cannot plug in without a client
      bridge. The user also wants the ability to switch providers (Google →
      iCloud/Hotmail) or read several at once, so the provider had to be
      modular from day one. A second constraint: GEMINI_API_KEY cannot
      authenticate calendar calls (API keys carry no user identity), but the
      OAuth Desktop client in ~/.config/secrets/google_credentials.json lives
      in the same gen-lang-client project and is reusable for consent.
    options:
      - label: Direct provider adapters behind a CalendarProvider protocol
        pros: [async-native httpx fits ada's FastAPI/asyncio design, full API
               fidelity (freebusy, per-calendar routing), zero new runtime deps,
               new provider = one file + one registry block]
        cons: [ada owns OAuth per provider; one token file per service]
      - label: Home Assistant as the provider abstraction
        pros: [zero new auth in ada — HA owns OAuth per integration;
               reuses existing home_assistant.py client]
        cons: [calendar.create_event/todo support is patchy per HA integration,
               every call inherits HA latency on top of Gemini's round trip,
               tool surface capped at what HA exposes]
      - label: MCP server bridge in ToolRunner
        pros: [unlocks the whole MCP ecosystem (nspady/google-calendar-mcp etc.)]
        cons: [new MCP client machinery inside a voice-latency path, extra
               process lifecycle to manage on mn01, overkill for v1]
      - label: Bidirectional sync between providers
        pros: [same events visible in every native app]
        cons: [conflict resolution and duplicate handling forever; rejected —
               aggregation at read time gives the same user-visible answer]
    chosen: Direct provider adapters behind a CalendarProvider protocol, Google first
    reasoning: |
      The protocol + aggregator (backend/calendar_providers.py) gives provider
      switching via the rendered registry (read: aggregate|name, write: name,
      instances:) — the same shape as memory banks. Google gets a real adapter
      (httpx + refresh token, no google-api-python-client weight on the Pi);
      CalDAV covers iCloud/Fastmail/Nextcloud as one adapter later; MS Graph
      only when actually needed. Writes require confirmed=true server-side.
      HA-mediation stays available as a future read-only adapter if a provider
      is easier to wire in HA than directly.
    consequences:
      - backend/calendar_providers.py + backend/google_calendar.py added
      - CALENDAR_WRITE_TOOLS gate in tool_runner.py; declarations + instruction
        paragraph in realtime_provider.py
      - 'Registry SSOT: docs/ssot/apps/ssot.apps.ada-calendar.yml rendered to
        ~/.config/ada/calendar.json by scripts/ada/render-calendar-providers.py'
      - 'Auth: scripts/ada/google-calendar-auth.py mints
        ~/.config/secrets/ada-google-calendar-token.json from the shared
        google_credentials.json client (scopes: calendar.readonly,
        calendar.events, tasks); consent screen must be published or tokens
        expire in 7 days'
      - Calendar/Tasks APIs must be enabled on project gen-lang-client-0694401188
    related:
      - docs/ssot/apps/ssot.apps.ada-calendar.yml
      - docs/ssot/infrastructure/ssot.ada.howto.yml
      - 'ada-pi: backend/calendar_providers.py, backend/google_calendar.py,
        backend/tool_runner.py, backend/realtime_provider.py'

  - id: ada-ha-native-primary-ui
    date: '2026-09-23'
    title: Home Assistant is the primary user-facing Ada UI; retire standalone miniapps
    status: accepted
    context: |
      Ada now has an embedded HA experience — custom:ada-voice-card ("Live
      assistant") on chaba-home/ai, plus ada-keys-card and ada-users-card on
      chaba-admin/pair — alongside a standalone PWA served by ada-pi
      (pwa_server.py, port 8001). Keeping a separate user-facing frontend
      duplicates auth/session surfaces and widens the externally exposed
      attack surface.
    options:
      - label: Keep the standalone PWA alongside the HA card
        pros: [PWA works without HA, no migration needed]
        cons: [two auth flows to secure, two UIs to maintain, more external exposure]
      - label: HA-native UI is primary; retire standalone frontends
        pros: [single auth path via HA session + per-device keys, fewer
               public-facing surfaces, less security work]
        cons: [depends on HA availability; Ada backend API routes must stay
               for the card and internal tooling]
    chosen: HA-native Ada UI is the primary user interface
    reasoning: |
      The HA card already delivers the full voice experience with HA-mediated
      per-device key issuance — no pasted API keys, no iframe, no separate
      page. Consolidating on HA gives one auth/session model and fewer
      external surfaces to secure and maintain. The user explicitly prefers
      accessing everything from inside the HA app for exactly this reason.
    consequences:
      - 'Retirement candidates once dependencies are migrated: pwa/index.html,
        app.js, chat/, cms/, enroll.html, manifest.json, and the ada-pi-pwa
        public/tailnet frontend routes'
      - 'Backend routes stay: /ws, /api/auth/*, /api/home-assistant/*,
        /api/tools/*, /api/memory/*, /api/decision/*, /api/chat/*, /api/cms/*
        are still required by the HA card and internal tooling'
      - 'Retirement is staged and dependency-aware: audit consumers first,
        then remove frontend pages, then disable ada-pi-pwa public routes —
        no silent removal'
      - chaba-admin/ada-pages (embeds the CMS miniapp) is a retirement candidate
      - Reassess pairing/QR and /redeem/{token} flows as the HA-native
        experience matures
    related:
      - docs/ssot/infrastructure/ssot.home-assistant.cards.yml
      - docs/ssot/infrastructure/ssot.home-assistant.dashboards.yml
      - stacks/tony-dell/tony-ha/www/ada-voice-card.js
      - stacks/tony-dell/tony-ha/www/ada-keys-card.js
      - stacks/tony-dell/tony-ha/www/ada-users-card.js
      - 'ada-pi: pwa_server.py, pwa/'

  - id: tv-casting-groups
    date: '2026-09-24'
    title: tony-ha automations split into managed (UI-uneditable) and editable
      groups, plus runaway-cast auditing
    status: accepted
    context: |
      tony-ha has 17 UI automations (assessed into
      ssot.home-assistant.automations.yml) plus a host-side cast pipeline
      (cast-browser :8799, cast-ha-panel.timer 60s re-cast, cast-desktop@1 HLS,
      websockify). Two failure modes are unguarded: (a) runaway behavior — cast
      storms, stuck 'playing' sessions, leaked ffmpeg/chromium processes, and
      (b) safety logic (idle shutdown, activity reset) living in the same
      UI-editable file as convenience automations, where an accidental edit can
      silently remove the only runaway protection.
    options:
      - label: Keep everything UI-editable, add audits only
        pros: [no migration, simplest]
        cons: [safety automations remain one misclick from deletion; audits
               can't trust the guards they depend on]
      - label: Split — managed package automations vs editable UI automations
        pros: [safety code is git-reviewed and UI-editor-proof (packages are
               not editable in the UI, only toggleable); clear ownership;
               editable group stays flexible]
        cons: [migration work; two places to look for automation logic]
      - label: Move all casting to host-side systemd only
        pros: [single process model]
        cons: [loses HA UI visibility, voice/conversation triggers, entity
               state conditions; worse UX]
    chosen: Split into managed (packages/cast-safety.yaml + similar) and
      editable (automations.yaml) groups
    reasoning: |
      HA's package mechanism makes automations visible-but-not-UI-editable —
      exactly the "uneditable" semantics wanted for safety. The idle-shutdown /
      activity-reset pair, the new rate-limit/session-cap/flap/source guards,
      and the cast_enabled kill switch become managed; YouTube pipeline,
      assist sentences, reminders stay editable. A host-side audit script
      complements HA-side guards for process-level runaways (ffmpeg, chromium)
      that HA can't see.
    consequences:
      implemented_2026_09_24:
        - "input_boolean.cast_enabled — master kill switch; honored by
          cast-ha-selected.sh and cast-cam.py (managed paths)"
