      **Implemented Mitigations** in `fetch-conversations.mjs`:
      - **Exponential backoff retry logic**: 1min, 5min, 15min, 1hr, 4hr delays for rate limit errors
      - **Rate limit detection**: Parses error codes (103, "rate limit", "temporarily restricted", Japanese error message)
      - **Login attempt throttling**: Maximum 1 login attempt per hour tracked in `login-attempts.json`
      - **Retry on both list and single fetch**: Protects against rate limits at any API call point

      **Benefits**: Prevents future rate limit disruptions, automatic recovery from temporary restrictions, reduced manual intervention
