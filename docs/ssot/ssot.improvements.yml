- title: Medium Priority Improvements
  icon: 🟡
  layout: list
  items:
  - label: SSOT file optimization
    text: Implement the SSOT file optimization plan (docs/ssot/ssot.file-optimization.yml). Enforce bloat thresholds, scan
      for data-isolation violations, remove redundant and obsolete entries, standardize consistency, and wire all checks into
      ssot-validate and .githooks/pre-commit. Bloat is included as Phase 1 of the plan.
    status: pending
    priority: medium
    effort: 2-4 hours
    category: ssot
    discovered: 2026-08-16
    target_date: 2026-08-23
    action_items:
    - Read thresholds from ssot.file-control.yml
    - Add bloat, data-isolation, and consistency checks to ssot-validate output
    - Add grandfather exemptions for the five current oversized files
    - Wire the checks into .githooks/pre-commit
    - Update ssot.index.yml and ssot.file-optimization.yml as work proceeds
    related_files:
    - scripts/ssot-validate-all.mjs
    - docs/ssot/ssot.file-control.yml
    - docs/ssot/ssot.file-optimization.yml
    - .githooks/pre-commit
    tags:
    - ssot
    - validation
    - bloat
    - data-isolation
    - optimization
    - tooling
  - label: SSOT optimization orchestration
    text: 'Implement scripts/ssot-optimize.mjs and the ssot-optimization-snapshot night job.

      The script should run bloat, data-isolation, obsolescence, redundancy, consistency,
      and conflict checks in order, produce a delta report, and queue resulting actions
      into focus-inbox or overnight review, keeping generated metrics out of canonical SSOTs.

      '
    status: in_progress
    priority: medium
    effort: small
    category: automation
    discovered: '2026-08-16'
    target_date: '2026-08-30'
    depends_on:
    - SSOT file optimization
    dependency_reason: 'Bloat and data-isolation checks must be implemented before they can

      be orchestrated.

      '
    action_items:
    - Add an orchestration step to scripts/ssot-validate-all.mjs or create workflows/ssot-optimization.yml
    - Define per-phase checks (bloat, data-isolation, obsolescence, redundancy, consistency)
    - Wire output into focus-inbox or overnight-focus-review
    - Store generated reports under data/ or runtime SSOTs, not docs/ssot/
    related_files:
    - docs/ssot/ssot.file-optimization.yml
    - docs/ssot/ssot.file-control.yml
    - scripts/ssot-validate-all.mjs
    - docs/ssot/ssot.focus.current.yml
