  - label: MCP Health Server Phase 3 - Enhanced Monitoring
    text: 'Enhance mcp-health server with advanced monitoring capabilities based on operational learnings from Yomi API troubleshooting.

    **Learned Issues** (2026-08-12):
    - Proxy configuration gaps: Caddy `handle` vs `handle_path` issues not detected by health checks
    - Service state conflicts: Port conflicts (EADDRINUSE) not caught before systemd restart attempts
    - Dependency analysis limitations: Doesn''t account for systemd vs container deployment conflicts
    - Manual intervention required: Service recovery needed manual process killing and systemd restart

    **Phase 3 Enhancements**:
    - Proxy configuration validation: Detect Caddy proxy misconfigurations (handle vs handle_path)
    - Port conflict detection: Pre-check port availability before service restart attempts
    - Enhanced dependency analysis: Account for deployment method conflicts (systemd vs container)
    - Automated service recovery: Safe service restart with conflict resolution
    - Real-time state validation: Better detection of running vs configured services
    - Enhanced error context: Detailed error messages with specific troubleshooting steps

    **Implementation Priority**:
    1. Port conflict detection (high - prevents service restart loops)
    2. Proxy configuration validation (high - catches routing issues early)
    3. Enhanced dependency analysis (medium - improves cascading failure detection)
    4. Automated service recovery (medium - reduces manual intervention)
    5. Enhanced error context (low - improves user experience)

    status: pending
    priority: high
    effort: medium
    category: infrastructure
    discovered: 2026-08-12
    business_impact: 4
    technical_impact: 6
    user_experience_impact: 5
    cost_savings_impact: 3
    impact_summary: Prevents service restart loops, catches proxy configuration issues early, reduces manual intervention for common service failures
    depends_on: [MCP Health Server Implementation]
    related_files:
      - mcp/mcp-health/server.js
      - docs/ssot/infrastructure/ssot.health.yml
      - docs/ssot/infrastructure/ssot.mcp.yml
    tags: ['mcp', 'health-monitoring', 'telemetry', 'enhancement']

  - label: Playlive Service Reliability Enhancement
    text: 'Improve playlived service reliability to prevent recurring Playwright browser installation issues that cause HTTP 500 errors.

    **Recurring Issue** (2026-08-12):
    - Playlived service returns HTTP 500 errors when Playwright browsers are not installed
    - Applications trying to create browser sessions fail with "Executable doesn''t exist" errors
    - Issue repeats after Playwright updates or system changes
    - No automated detection or remediation in current health checks

    **Root Cause**:
    - Playwright browsers (Chrome, Firefox, WebKit) must be installed separately via `npx playwright install`
    - Browser installation not part of systemd service startup or dependency management
    - Health checks only verify playlived daemon is running, not browser availability
    - No automated remediation when browsers are missing

    **Implemented Solutions**:
    - Added playlived to health check configuration with browser installation verification
    - Added specific recovery actions for missing Playwright browsers
    - Updated service criticality to "important" for better monitoring priority
    - Added automation service group for better dependency tracking

    **Future Enhancements**:
    - Add systemd service dependency on Playwright browser installation
    - Create automated browser installation check at service startup
    - Add browser version tracking and update notifications
    - Implement pre-flight checks before session creation attempts

    status: completed
    priority: high
    effort: low
    category: infrastructure
    discovered: 2026-08-12
    completed: 2026-08-12
    business_impact: 4
    technical_impact: 5
    user_experience_impact: 4
    cost_savings_impact: 2
    impact_summary: Prevents recurring HTTP 500 errors from missing Playwright browsers, improves service reliability and automated detection
    related_files:
      - docs/ssot/infrastructure/ssot.health.yml
      - docs/ssot/apps/ssot.apps.playlive.yml
      - /home/tony/.local/playlive/playlived.mjs
    tags: ['playlive', 'playwright', 'service-reliability', 'health-monitoring', 'completed']

