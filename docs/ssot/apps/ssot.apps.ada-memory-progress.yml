title: Ada Memory Implementation Progress
subtitle: Machine-readable milestone tracker for the Ada memory-bank rollout — update statuses here as work lands
icon: 📈
sections:
  - title: How To Use
    icon: "💡"
    layout: list
    items:
      - label: Statuses
        text: pending | in_progress | done | blocked. Update item status as work completes; bump config.updated and add a note when a milestone flips.
      - label: Scope
        text: Tracks registry → runtime → deploy. Design decisions live in ssot.apps.ada-memory.yml / -schema.yml / -audit.yml, not here.
  - title: Milestones
    icon: "🚦"
    layout: list
    items:
      - label: registry
        text: Bank registry defined in SSOT — banks, assignment, write policies, note test bank.
      - label: runtime
        text: ada-pi loads the registry, resolves collections, exposes write/recall tools.
      - label: deploy
        text: Registry rendered to ~/.config/ada/memory-banks.json on mn01 + tony-dell; services restarted; isolation verified.

