title: Ada Persona Lanes — dev/prod twin + CI procedure
subtitle: Per-persona backend lanes (kk-dev -> ada-kk). Mirrors the HA
  lanes model (ssot.home-assistant.lanes.yml) adapted to ada services.
icon: 🚦
version: 1
last_updated: "2026-10-13"

# ---------------------------------------------------------------------------
# A persona lane is a dev backend -> prod backend pair for ONE person.
# Code promotes: idc03 deploy puts every instance on the same checkout —
# "promote" means: verify on the dev port, then restart the prod service.
# Config promotes: render-tool-profiles.py writes the env managed block —
# dev env first, scenarios green, then the prod env.
# DATA NEVER PROMOTES: banks, CMS, calendars are lane-scoped; dev writes
# only reach -dev collections. Scenarios run --no_persist + cleanup blocks.
# ---------------------------------------------------------------------------

lanes:
  kk:
    dev: ada-kk-dev
    prod: ada-kk
    persona: kaewta            # LINE name binding (LINE_NAME_BACKENDS)
    ha_home: kk-ha             # virtual home — no live HA upstream
    owner_person: kk
  tony:
    dev: ada-dev               # shared lab lane — HA tools excluded
    prod: ada-ha-tony
    persona: chaba             # rebranded ada->chaba 2026-10-12 (card
                               # ada-rebrand-chaba); @ada kept as alias —
                               # LINE_NAME_BACKENDS routes both to :8002
    ha_home: tony-ha           # real production HA — owner-token lane
    owner_person: tony
  guest:
    prod: ada-guest            # PLANNED — CHABA_MEMORY=1 lane, see
                               # docs/kb/chaba-guest-service.md checklist
    persona: none              # guests reach Chaba on a guest device,
                               # never a LINE persona (guest-is-chaba
                               # decision 2026-10-12)
    ha_home: tony-ha           # svc-chaba-guest scoped creds, not owner
    owner_person: none

instances:
  ada-ha-tony:
    host: idc03
    port: 8002
    env_file: ada-ha-tony.env
    ha_upstream: tony-ha       # HOME_ASSISTANT_* points at prod tony-ha —
                               # currently an OWNER token (see
                               # ha-ada-isolation, open svc-ada request)
    bank: ada-ha-bank-personal-tony      # instance-derived default
    cms_collection: ada-cms-pages        # shared tony CMS root
    events: ada-ha-events
    tool_profile: tony         # persons.tony.tools — full surface minus
                               # ADA_EXCLUDED_TOOLS=get_habit_status,
                               # report_habit_observation
    line_persona: chaba        # display ชบา (LINE_NAME_TH); ada alias kept
    pwa_name: Chaba AI         # ADA_PWA_NAME — manifest/app name
    identity_env: ADA_IDENTITY_INSTRUCTIONS   # Chaba identity + feminine
      # register (mirrors Kaewta block) — added 2026-10-12. Overrides the
      # default introduce-yourself-as-Ada paragraph.
    note: restarted 2026-10-12 ~21:00 +07 after the storm hold —
      returned with the Chaba identity env in place (NRestarts=0).

  ada-kk:
  ada-kk:
    host: idc03
    port: 8007
    env_file: ada-kk.env
    keys_file: ada-ha-kk-keys.json
    bank: ada-ha-bank-personal-kk
    cms_collection: ada-cms-pages-kk
    cms_public_base: https://surf-thailand.com/kk-ha/
    calendar_file: calendar-kk.json        # real kk-ha calendar + task list
    events: ada-ha-events-kk
    recall_summary: ada-ha-recall-summary-kk
    line_persona: kaewta       # reachable from the real LINE group
    cms_catalog_prime: true    # ADA_CMS_CATALOG_PRIME=1 — session prime lists
                               # CMS keys so she can find pages unprompted;
                               # outside the chaba-rendered env block (survives
                               # render-tool-profiles.py)
    tool_profile: kk           # persons.kk.tools in ssot.apps.ada-persons.yml
    identity_env: ADA_IDENTITY_INSTRUCTIONS   # Kaewta identity + feminine
      # register — overrides the default introduce-yourself-as-Ada block
      # (59fceb8). Without it the lane inherits Ada's identity paragraph.

  ada-kk-dev:
    host: idc03
    port: 8009
    env_file: ada-kk-dev.env
    keys_file: ada-ha-kk-dev-keys.json
    bank: ada-ha-bank-personal-kk-dev      # dev writes stay off prod memory
    bank_read_extra: [ada-ha-bank-personal-kk]  # read the real kk bank for parity
    cms_collection: ada-cms-pages-kk-dev
    cms_public_base: ""        # no public lane for dev pages
    calendar_file: calendar-kk-dev.json    # separate test calendar
    events: ada-ha-events-kk-dev
    recall_summary: ada-ha-recall-summary-kk-dev
    line_persona: kaewta-cms   # reachable in the kk group via interview-room
                               # pinning (see relay: below)
    cms_catalog_prime: true    # same as prod — dev seeded first (2026-10-11)
    tool_profile: kk           # identical profile — same surface as prod
    status: planned            # card ada-kk-dev-lane

relay:
  persona_pins: |
    Interview-room pinning (ada-voice 24d6e3d, ada-line-relay): mentioning a
    persona in a room pins it; unaddressed messages follow the pin; another
    mention (@kaewta/@ada/@chaba/kaewta-cms) switches. Pins are per-room and
    in-memory — a relay restart falls back to LINE_DEFAULT_PERSONA, so
    re-mention after a deploy. Replies carry [persona->sender] labels on
    turns and [instance] labels on queued chat_send pushes.
  lane_lock: |
    LINE_LANE_LOCK=kk,kk-dev,chaba in line-bot.env (ada-voice 461debe): any
    chat_send from a locked lane is rewritten to the lane's LINE group
    instead of 403-ing on a bad target — deterministic delivery until
    targeting stabilises. LINE_LANE_ALLOW also allowlists tony (tony's,
    nhong's, kk's DMs + C822) so ada-ha cannot push into the tony-ha group
    (verified 403 live). Unlock per-lane when targeting is verified stable.
  group_persona: |
    LINE_GROUP_PERSONA=<group>:<persona> (ada-voice 3f4d270) hard-pins a room
    to one lane — unlike the soft interview-room pin it survives restarts,
    routes unaddressed messages to the room persona, and answers foreign
    mentions with "isn't on this lane" instead of a foreign backend turn.
    Groups: C822026077530a29620b5041bd1a955c5 = kk-ha shared multihome
    (mention-routed, unaddressed -> LINE_DEFAULT_PERSONA=kaewta);
    C4fb0ce548a58e2d758335b7e21ce3411 = tony-ha (pinned chaba, 2026-10-13).
  image_pipeline: |
    chat_send image_url resolves relative paths against LINE_URL_BASE,
    unwraps path-embedded https URLs, and caches fetched images on disk
    (IMG_CACHE_DIR) so delivered images survive relay restarts (1c1b56b,
    e2c40c4, 10084ea). Expired signed URLs (fbcdn etc.) still die at the
    source — prefer durable /api/documents/ assets.

ci:
  description: |
    Standard CI for a persona lane. Every ada-voice change ships to all
    instances at once (deploy-ada.sh) — "promotion" is a verification
    order, not a separate build. The dev instance is the tripwire:
    scenarios run against it before prod restarts.
  steps:
    - code: |
        Edit on tony-dell, push, deploy-ada.sh on idc03 (gates:
        tool-lint + pytest). Deploy restarts ada-* — dev port first to
        verify, prod service last.
    - config: |
        persons.<p>.tools / banks edits → render-tool-profiles.py writes
        the dev env block → scenarios green → render prod env → restart.
    - verify_dev: |
        .venv/bin/python scripts/scenario-live.py \
          tests/scenarios-live/<suite>.yaml \
          --url ws://127.0.0.1:8009/ws --api-key $ADA_KK_DEV_KEY
        Lane suite (tag: kk-lane): virtual-home HA exclusion,
        bank isolation, cms publish -> public_url, chat_send
        group targeting, photo asset reshow.
    - promote: |
        Scenarios green on :8009 → systemctl --user restart ada-kk →
        prod smoke = one LINE message in the group expecting a sane
        tagged reply (manual — the inbound webhook can't be synthesized).
    - rollback: |
        deploy-ada.sh ff-merge is atomic; roll back by reverting on dell
        and redeploying. Env: re-render the previous managed block.

regressions_to_cover:
  - virtual-home: home_*/ha_* tools absent on kk lane (merged-name slips)
  - memory: retracted/superseded docs invisible; vault-first writes
  - chat_send: empty to= -> last active room, never first-allowed-user DM
  - images: non-image fetch rejected (HTML SPA as image_url)
  - cms: public='yes' -> public_url; personal-data gate blocks
  - identity: LINE userId -> caller -> owner tier on her lane
  - identity: answers as Kaewta not Ada; feminine register ค่ะ/ดิฉัน,
      never ครับ/ผม; คุณโทนี่ not "Tony" (caught by tools suite 2026-10-11)
