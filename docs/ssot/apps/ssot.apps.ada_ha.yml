title: Ada HA
subtitle: iPad/iPhone PWA for full-duplex Gemini Live voice with Home Assistant integration
icon: 🏠
sections:
  - title: Core Features
    icon: "✅"
    layout: list
    items:
      - label: iPad/iPhone PWA
        text: Full-duplex voice PWA for Home Assistant, using Gemini Live and server-side HA token.
      - label: Multiple HA targets
        text: Two isolated instances — ada-ha-tony (tony-dell.taila0626a.ts.net:8123) and ada-ha-michael (michael-ha:8123).
      - label: Energy + dashboard awareness
        text: Reads G3 power sensors and tony-test dashboard tabs by voice using the live HA websocket.
      - label: Event logs
        text: HA logbook, cross-entity open/close transition queries, per-entity timelines with durations, and a background event recorder persisted to MDDB.
  - title: Technical Architecture
    icon: "⚙️"
    layout: list
    items:
      - label: /home/tony/CascadeProjects/ada-pi/pwa_server.py
        text: Shared FastAPI backend. Static PWA served from /pwa; dynamic API routes under /api/home-assistant/.
      - label: /home/tony/CascadeProjects/ada-pi/pwa/chat/
        text: 'Text chat page at {base}/chat/ sharing the same /ws endpoint: sends {"type":"text","text":...} frames (routed to provider.send_text_turn, 4000-char cap), renders assistant_transcript_delta/user_transcript bubbles, and plays PCM replies with a Voice on/off toggle. Same device-key auth (api_key param, session cookie, redeem redirect param). Each /ws connection owns its own Gemini Live provider session — chat and voice clients do NOT share context.'
      - label: /home/tony/CascadeProjects/ada-pi/backend/realtime_provider.py
        text: Gemini Live client with function calling. Speech barge-in enabled (START_OF_ACTIVITY_INTERRUPTS).
      - label: /home/tony/CascadeProjects/ada-pi/backend/home_assistant.py
        text: REST and websocket client for HA states, control, history, logbook, event transitions, power summary, and dashboard tab extraction.
      - label: /home/tony/CascadeProjects/ada-pi/backend/event_recorder.py
        text: Background websocket subscriber recording state_changed transitions for event domains; ring buffer plus batched MDDB persistence (collection ada-ha-events-*). Disable via DISABLE_EVENT_RECORDER=true.
      - label: /home/tony/CascadeProjects/ada-pi/backend/instance.py
        text: "ADA_INSTANCE_ID resolution. Required, fail-fast: pins all MDDB memory collections to ada-ha-*-<instance> (tony/michael) instead of deriving them from HOME_ASSISTANT_URL. Missing or invalid → the service refuses to start."
      - label: /home/tony/.config/systemd/user/ada-ha-tony.service
        text: Runs uvicorn on 0.0.0.0:8002 on idc01 with env /home/tony/.config/secrets/ada-ha-tony.env (mn01 unit exists but is stopped+disabled standby since 2026-09-24).
      - label: /home/tony/.config/systemd/user/ada-ha-michael.service
        text: Runs uvicorn on 0.0.0.0:8003 on idc01 with env /home/tony/.config/secrets/ada-ha-michael.env (mn01 standby as above).
      - label: /home/tony/.config/caddy/Caddyfile.mn01 + Caddyfile.tony-dell
        text: Both alias /apps/ha/ada-tony|ada-michael/* to https://idc01.taila0626a.ts.net (legacy paths kept working).
  - title: Deployment
    icon: "🚀"
    layout: list
    items:
      - label: tony instance
        text: "https://idc01.taila0626a.ts.net/apps/ha/ada-tony/"
      - label: michael instance
        text: "https://idc01.taila0626a.ts.net/apps/ha/ada-michael/"
      - label: Edge routing
        text: "tailscale serve path mounts on idc01: /apps/ha/ada-tony -> 127.0.0.1:8002, /apps/ha/ada-michael -> 127.0.0.1:8003; mn01 AND tony-dell Caddy reverse-proxy the same paths to idc01 as legacy aliases (tony-dell repointed from mn01:800x 2026-09-24)"
      - label: Registry
        text: Listed as ada-ha-tony and ada-ha-michael under the idc01 host in docs/ssot/apps/ssot.apps.yml.
  - title: REST Endpoints
    icon: "🔌"
    layout: list
    items:
      - label: Auth
        text: ADA_API_KEY (per-instance, in ~/.config/secrets/ada-ha-*.env) is required via X-Api-Key header, the api_key query param, or the ada_session HttpOnly cookie for /api/tools, /api/tools/call, POST entity power, and /ws. Named keys via ADA_API_KEYS=name:key give per-caller audit + revocation. POST /api/auth/session issues the cookie; GET /api/auth/status reports state; POST /api/auth/logout clears it. Read GET endpoints remain open.
      - label: GET /api/home-assistant/entities
        text: List controllable HA entities (lights, switches, fans, covers, buttons, media players).
      - label: GET /api/home-assistant/sensors
        text: List sensor entities; optional search and limit query params.
      - label: GET /api/home-assistant/history
        text: Fetch state history for a single sensor over N hours.
      - label: GET /api/home-assistant/logbook
        text: HA logbook entries (friendly event text like 'Front door was opened'); optional entity_id and hours params.
      - label: GET /api/home-assistant/events
        text: Cross-entity state-change transitions across event domains (binary_sensor, cover, lock, person, light, switch, ...); hours, query, limit params.
      - label: GET /api/home-assistant/entity-events
        text: Per-entity event timeline with per-state durations; entity_id and hours params.
      - label: GET /api/home-assistant/event-recorder
        text: Background recorder status plus its in-memory transition buffer.
      - label: GET /api/home-assistant/power-summary
        text: Current G3 power values plus min/max/mean over N hours.
      - label: GET /api/home-assistant/dashboard-tab
        text: Read a named tony-test tab and return its displayed entities with current states.
      - label: POST /api/home-assistant/entities/{entity_id}/power
        text: Turn a light/switch/fan/input_boolean on or off.
      - label: POST /api/decision/check
        text: "Purchase-verification pipeline (backend/decision_check.py). Body {text?, url?, image_b64?, image_mime?, mode: quick|deep} — paste listing text, a link, or a screenshot. Pipeline: Gemini normalizes a product record → active criteria docs from the 'purchase' bank → Gemini + Google Search grounding verifies price/specs/red flags and finds alternatives → result persisted as a kind=check doc in the bank + chaba-admin event via HA shell_command.chaba_event. Adapters are domain-neutral; 'shopee' is first."
      - label: GET /api/decision/history
        text: Newest-first list of past checks from the purchase bank (kind=check docs).
  - title: Gemini Tools
    icon: "🧠"
    layout: list
    items:
      - label: get_home_state
        text: Current person state and watched home plugs.
      - label: control_entity
        text: Turn on/off a controllable HA entity.
      - label: list_home_devices
        text: List all controllable HA devices.
      - label: search_home_devices
        text: Find a controllable device by name or keyword.
      - label: list_sensors
        text: List available sensor entities with current state and unit.
      - label: search_sensors
        text: Find a sensor by name or keyword.
      - label: get_power_summary
        text: Voice summary of G3 solar/grid/load/battery power and recent history.
      - label: get_sensor_history
        text: Recent history for a specific sensor.
      - label: get_logbook
        text: HA logbook event entries, optionally for one entity.
      - label: get_recent_events
        text: Recent open/close/on-off state changes across the whole home; optional keyword filter.
      - label: get_entity_events
        text: One entity's event timeline with per-state durations (open/close times).
      - label: ada_ha_search_events
        text: Search recorded events from the background recorder (memory + persisted MDDB batches).
      - label: get_dashboard_tab
        text: Read the named tony-test dashboard tab and report displayed devices.
      - label: ada_session_recall
        text: "MDDB-first recall: per-instance MDDB collections serve cached/tiered summaries instantly; NotebookLM via notebooklm-rest is the deep-recall/archive path for explicit detail requests or low MDDB confidence (~26s, runs in background). Optional group param routes to per-topic notebooks: memory (past voice sessions, default), infra (hosts/services/tailscale/mcp), apps (ada-pi/HA/playlive), kb (mddb/yomi/SSOT/docs), ops (workflows/tasks/experiments). Group map lives in NOTEBOOKLM_NOTEBOOK_IDS_JSON per instance env; transcripts persist to the memory group. Tony groups: memory=663ef269, infra=be2d05c6, apps=fdbb97d0, kb=c28b6ab9, ops=76a31e03. Michael: memory only."
      - label: ada_decision_check
        text: "Voice entry to the purchase-verification pipeline (backend/decision_check.py). Args {product, url?, mode: quick|deep} — product is the listing text/details the user dictated or pasted. NON_BLOCKING: returns 'checking' instantly, engine runs in background (~30-60s), verdict arrives via send_text_turn; a slow filler keeps the user informed. Results persist as kind=check docs (caller=voice) + chaba-admin event. Image input stays on the Check panel; criteria via ada_remember to the 'purchase' bank; past checks via ada_memory_search."
  - title: Navigation
    icon: "🗺️"
    layout: list
    items:
      - label: /apps/ha/
        text: Landing page with links to both Ada HA Tony and Michael instances.
      - label: /apps/
        text: App directory for tony-dell with links to HA, RView, and other apps.
  - title: Testing
    icon: "🧪"
    layout: list
    items:
      - label: WebSocket ready
        text: 'wss://idc01.taila0626a.ts.net/apps/ha/ada-{tony,michael}/ws returns {"type":"ready"}.'
      - label: Voice
        text: Tap Connect and ask about the G3 power summary or a dashboard tab.
      - label: Text chat
        text: 'Open {base}/chat/ (or the Text button on the chaba-admin issued-keys card), send a message, expect transcript deltas + PCM audio frames back over /ws.'
  - title: Memory Architecture
    icon: "🧠"
    layout: list
    items:
      - label: Serving tiers
        text: "Recall serves MDDB-first: per-instance summary collection ada-ha-recall-summary-<instance> warmed at connect (~0.2s); per-session summary docs + daily/weekly/monthly/yearly rollups via local Gemini (planned); NotebookLM deep recall only for explicit detail requests or low MDDB confidence (~26s, background)."
      - label: Transcript archive
        text: "Full session transcripts upload to the instance's NotebookLM memory notebook at session close (~5s). NotebookLM is the source-of-truth archive and batch-consolidation tool."
      - label: Identity
        text: "ADA_INSTANCE_ID is required (fail-fast) and pins all MDDB collection names; never derived from HOME_ASSISTANT_URL."
      - label: Fail-quick
        text: "Memory errors are logged, surfaced via GET /api/health (degraded flag + recent errors), and spoken explicitly — a failed search is never reported as 'nothing found'."
      - label: Memory groups
        text: "Per-topic NotebookLM notebooks via NOTEBOOKLM_NOTEBOOK_IDS_JSON: memory (default, receives transcripts), infra, apps, kb, ops. Tony has all five; Michael currently has memory only."
      - label: Shared home knowledge
        text: "Planned shared 'home' group (shared notebook + ada-ha-home MDDB collection, no instance suffix) for non-private cross-instance facts/news: topology, device aliases, procedures, status notices. Docs carry kind/scope/confidence/valid_from/last_verified/applies_to metadata; private transcripts, secrets, and live sensor state stay out."
  - title: Safety Model
    icon: "🛡️"
    layout: list
    items:
      - label: Server-side gate
        text: ToolRunner gates every control tool (control_entity, control_cover, press_button, control_media_player, tv_action). Dangerous entities are denied unless confirmed=true is passed; related entities inherit danger by object_id prefix (e.g. button.gate_motor_my_position inherits cover.gate_motor).
      - label: Rate limits
        text: Sliding-window limits on control calls — 5/min per entity, 30/min global (ADA_CONTROL_MAX_PER_ENTITY, ADA_CONTROL_MAX_GLOBAL, ADA_CONTROL_RATE_WINDOW_S).
      - label: Read-only mode
        text: ADA_READ_ONLY=true disables all actuating tools (voice and REST) for demo/customer instances.
      - label: Audit
        text: Every /api/tools/call is logged with tool name, args, and client IP; denials logged as warnings.
      - label: QR onboarding
        text: 'POST /api/auth/redeem-token (authenticated, body {"path": appBase}) mints a single-use redeem URL (ADA_REDEEM_TTL_S, default 10min). GET {base}/redeem/{token} burns it, sets the session cookie, and redirects to {base}/?api_key=<key> so the PWA stores the key. Scan once on iPhone/iPad and the device is authorized.'
      - label: Device keys
        text: 'POST /api/auth/keys {name} issues a per-device key persisted in ~/.config/secrets/ada-ha-<instance>-keys.json (ADA_KEYS_FILE to override) and returns its redeem URL/QR. GET lists names plus per-key bindings, DELETE /api/auth/keys/{name} revokes the key AND its sessions. POST /api/auth/keys/{name}/redeem re-mints a redeem link for an existing key (re-pair) and resets its device binding. Pair UI: /apps/ha/pair/ (admin key = ADA_API_KEYS admin:… shared on both instances).'
      - label: Device binding
        text: 'Each issued key locks to the first device id seen (TOFU): the PWA stores a random ada_device_id in localStorage and sends it as X-Device-Id header / device_id WS param; auth.enforce_device rejects requests from any other device. Admin/env keys are never bound; unbound legacy keys keep working until their PWA binds. Only the admin can reset a binding via re-pair — a stolen key cannot re-register.'
      - label: Voice path
        text: Gemini control calls route through ToolRunner; the model must pass confirmed=true after explicit user confirmation.
  - title: Known Issues
    icon: "⚠️"
    layout: list
    items:
      - label: Shared repo
        text: Both /apps/ada_pi and /apps/ha/ada use the same ada-pi code; changes affect both unless managed.
      - label: Barge-in echo
        text: iPad/iPhone speaker echo can cause false barge-in in very loud environments; headphones are the reliable fix.
  - title: Development Roadmap
    icon: "🛣️"
    layout: list
    items:
      - label: Light dimming
        text: Add set_light tool for brightness_pct and color_temp_kelvin.
      - label: Generic state/service tools
        text: Add call_service(domain, service, entity_id) for arbitrary HA service calls.
      - label: PWA entity panel
        text: Add a scrollable entity list with on/off toggles in the PWA UI.
      - label: Domain-specific tools
        text: Split control_entity into turn_on_off, set_light, set_climate, set_media_player, run_scene.
      - label: Confirmation gate
        text: Make Gemini confirm before locks, covers, or critical switches.
      - label: Tiered recall
        text: Per-session MDDB summaries + daily/weekly/monthly/yearly rollups (local Gemini), semantic search over summaries, confidence-based escalation to NotebookLM deep recall.
      - label: Shared home group
        text: Shared 'home' NotebookLM notebook + ada-ha-home MDDB collection for cross-instance home facts/news with scope/validity metadata.
  - title: Lessons Learned
    icon: "🎓"
    layout: list
    items:
      - label: Live config is not versioned
        text: User systemd units and Caddyfile snippets were only on tony-dell. They are now versioned under chaba/stacks/mn01/.
      - label: HA URLs were host-local
        text: The Tony env used 127.0.0.1:8123. On mn01 it must use a tailnet-reachable URL such as https://tony-dell.taila0626a.ts.net:8123/.
      - label: mn01 lacked a stack
        text: Creating chaba/stacks/mn01/ makes the Ada HA deployment reproducible on tony-dell or tony-omen in a failure.
      - label: Audit did not cover Ada HA
        text: ssot.audit.hosts.yml now expects ada-ha-tony.service and ada-ha-michael.service on mn01.
      - label: Secrets and tokens are not in git
        text: ~/.config/secrets/ada-ha-*.env and notebooklm-rest-api.env are still host-local and must be backed up separately.
      - label: URL-derived collection names orphan memory
        text: MDDB collections were once keyed by HOME_ASSISTANT_URL slug; moving tony from 127.0.0.1 to the tailnet URL abandoned the old collections. ADA_INSTANCE_ID now pins identity; rule is fail quick and report, never silently fall back for identity config.
      - label: Funnel makes auth mandatory
        text: mn01 and tony-dell both run Tailscale Funnel on 443, so /apps/ada_ha_* and /apps/ada_pi are public-internet paths. confirmed=true only gates the model — direct REST callers self-assert it — which is why ADA_API_KEY covers /api/tools/call AND /ws.
      - label: EnvironmentFile order overrides keys
        text: "ada-ha-*.service load ada-ha-<inst>.env THEN notebooklm-rest-api.env; a stale NOTEBOOKLM_REST_API_KEY in the second file silently overrode the per-instance scoped key, so every notebooklm-rest call returned 401 Invalid API key (key-gate runs before handlers, so the write queue never engaged). Fixed 2026-09-17 by commenting the stale key on mn01. Rule: notebooklm-rest-api.env must never carry a singular NOTEBOOKLM_REST_API_KEY on mn01 — scoped per-instance keys live only in ada-ha-*.env; the server side authenticates with NOTEBOOKLM_REST_API_KEYS + NOTEBOOKLM_REST_KEY_SCOPES."
  - title: Environment surface (ADA_*/GEMINI_*/etc.)
    icon: "🧩"
    layout: list
    items:
      - label: Identity / instance
        text: "ADA_INSTANCE_ID (required, fail-fast) — tony|michael; pins ada-ha-*-<instance> MDDB collections. ADA_MEMORY_BANKS_FILE — registry JSON override (default ~/.config/ada/memory-banks.json). ADA_TIMEZONE (America/New_York). DISABLE_EVENT_RECORDER / DISABLE_GET_HOME_STATE — feature killswitches."
      - label: Auth
        text: "ADA_API_KEY (required for writes + /ws), ADA_API_KEYS=name:key,... per-caller keys, ADA_KEYS_FILE (keys JSON path), ADA_REDEEM_TTL_S (600), ADA_SESSION_TTL_S, ADA_DASHBOARD_URL_PATH (tony-test)."
      - label: Safety / policy
        text: "ADA_READ_ONLY=true disables actuating tools. ADA_CONTROL_MAX_PER_ENTITY (5) / ADA_CONTROL_MAX_GLOBAL (30) / ADA_CONTROL_RATE_WINDOW_S (60) — sliding-window rate limits. ADA_EXCLUDED_TOOLS — comma list to hide tools."
      - label: Memory recall
        text: "ADA_BANK_SEARCH_THRESHOLD (0.45) — bank + summary vector hit floor. ADA_BANK_UPDATE_THRESHOLD (0.85) — ada_remember dedupe/correct-in-place floor. ADA_RECALL_SLOW_AFTER_S (10) — filler-speech delay before NotebookLM completes."
      - label: Summarization
        text: "ADA_SUMMARY_MODEL (gemini-3.5-flash-lite), ADA_SUMMARY_MAX_TRANSCRIPT_CHARS (8000), GEMINI_API_KEY (required for rolling/session summaries + rollup job)."
      - label: Logging / misc
        text: "ADA_LOG_DIR, ADA_LOG_LEVEL (INFO), ADA_LOG_MAX_BYTES, ADA_LOG_BACKUPS, ADA_HABIT_DB. Vision: ADA_VISION_BACKEND (auto), ADA_VIDEO_MODE (activity), ADA_HAILO_MODEL_DIR / _DETECTION_HEF / _POSE_HEF / _ROTATE_*. Gemini Live: GEMINI_LIVE_MODEL / _VOICE / _INSTRUCTIONS / GEMINI_VIDEO_RESOLUTION / GEMINI_POSTURE_MODEL. External: MDDB_BASE_URL, NOTEBOOKLM_NOTEBOOK_ID(S_JSON), GOOGLE_API_KEY."
