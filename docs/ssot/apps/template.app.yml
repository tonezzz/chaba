title: "[App Name]"
subtitle: "[1-2 sentence description of what this app does and its main purpose]"
icon: "[emoji]"
sections:
  - title: Core Features
    icon: ✅
    layout: list
    items:
      - label: "[Feature name] 1"
        text: '[Detailed description of the feature and what it accomplishes]'
      - label: "[Feature name] 2"
        text: '[Detailed description of the feature and what it accomplishes]'

  - title: Technical Architecture
    icon: ⚙️
    layout: list
    items:
      - label: "[Architecture component] 1"
        text: '[Description of the technical component and its role]'
      - label: "[Architecture component] 2"
        text: '[Description of the technical component and its role]'

  - title: Files & Modules
    icon: 📁
    layout: list
    items:
      - label: "[filename] 1"
        text: '[Brief description of file purpose and functionality]'
      - label: "[filename] 2"
        text: '[Brief description of file purpose and functionality]'

  - title: Deployment
    icon: 🚀
    layout: list
    items:
      - label: Location
        text: '[Path to app files in repository]'
      - label: URLs
        text: '[Deployment URLs and access methods]'
      - label: Registry
        text: '[How it''s listed in apps.yml or other registries]'
      - label: Branch
        text: '[Git branch(es) where this app is maintained]'

  - title: Testing
    icon: 🧪
    layout: list
    items:
      - label: "[Test type] 1"
        text: '[Description of testing approach and coverage]'
      - label: "[Test type] 2"
        text: '[Description of testing approach and coverage]'

  - title: Integration
    icon: 🔗
    layout: list
    items:
      - label: "[Integration point] 1"
        text: '[Description of how this app integrates with other systems]'
      - label: "[Integration point] 2"
        text: '[Description of how this app integrates with other systems]'

  - title: Known Issues
    icon: ⚠️
    layout: list
    items:
      - label: "[Issue description] 1"
        text: '[Details about the issue and any workarounds]'
      - label: "[Issue description] 2"
        text: '[Details about the issue and any workarounds]'

config:
  version: 1
  created: YYYY-MM-DD
  maintainer: "[maintainer name]"
  status: "[active|deprecated|experimental]"
  deployment: "[deployment target(s)]"
