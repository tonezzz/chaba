# Conversational persona — adjustable per-identity style knobs. Stored as
# doc 'persona/self' inside the speaker's resolved personal bank (personal,
# personal-kk, personal-testo), so per-person isolation rides the existing
# person-scope + person_policies machinery for free. The ada_persona tool
# validates knob/value against this schema and applies changes mid-session;
# session prime injects non-default knobs for the identified speaker.
persona:
  doc_key: persona/self
  knobs:
    tone:          {values: [warm, direct, professional, playful], default: warm}
    verbosity:     {values: [brief, normal, detailed], default: normal}
    formality:     {values: [casual, polite, formal], default: polite}
    language:      {values: [auto, en, th], default: auto}
    address_name:  {type: string, max: 40, default: ""}
    emoji:         {type: bool, default: false}
    proactiveness: {values: [minimal, normal, proactive], default: normal}

# Per-identity bank ACL — resolved against the session's memory identity:
# identified speaker's HA person entity first, then the issued device-key
# name, then 'default' for unlisted named identities, then 'unknown' for
# anonymous sessions. RESTRICTED-BY-DEFAULT: an unlisted identity gets the
# 'default' policy, NOT the full set — new people start guest-level until
# explicitly trusted. {full: true} = unrestricted (Tony's people/keys).
# allow = whitelist; deny = subtractive.
person_policies:
  admin:        {full: true, label: Tony}   # env ADA_API_KEY identity
  person.tony: {full: true, label: Tony}
  person.kk:
    label: KK
    allow: [general, home, people, purchase, personal-kk]
  user-kk:
    label: KK
    allow: [general, home, people, purchase, personal-kk]
  tony-ip:     {full: true, label: Tony}
  user-tonezzzz: {full: true, label: Tony}
  user-tony2:    {full: true, label: Tony}
  user-ha-mcp-server: {full: true, label: Tony}
  ha-03e85ebb:   {full: true, label: Tony}
  ha-4d0e0dee:   {full: true, label: Tony}
  ha-bf66722a:   {full: true, label: Tony}
  ha-testdebug001: {full: true, label: Tony}
  person.testo_2:
    label: Testo
    allow: [general, home, people, purchase, personal-testo]
  testo:
    label: Testo
    allow: [general, home, people, purchase, personal-testo]
  user-testo:
    label: Testo
    allow: [general, home, people, purchase, personal-testo]
  default:
    allow: [general, home]
  unknown:
    allow: [general, home]

# Per-identity actuation ACL — which HA control tools a session may use.
# Same identity resolution as person_policies. {full: true} bypasses the
# policy layer (the global danger-pattern floor and confirmed= flow still
# apply). Otherwise: allow_domains whitelists entity domains (absent from
# it = denied), deny_domains/deny_entities always deny. Restricted
# identities still can't actuate dangerous domains (lock/cover/alarm/…)
# because the global deny floor already blocks them.
control_policies:
  admin:        {full: true}
  person.tony: {full: true}
  person.kk:
    allow_domains: [light, switch, input_boolean, script, media_player]
  user-kk:
    allow_domains: [light, switch, input_boolean, script, media_player]
  tony-ip:     {full: true}
  user-tonezzzz: {full: true}
  user-tony2:    {full: true}
  user-ha-mcp-server: {full: true}
  ha-03e85ebb:   {full: true}
  ha-4d0e0dee:   {full: true}
  ha-bf66722a:   {full: true}
  ha-testdebug001: {full: true}
  person.testo_2:
    allow_domains: [light, switch, input_boolean, script, media_player]
  testo:
    allow_domains: [light, switch, input_boolean, script, media_player]
  user-testo:
    allow_domains: [light, switch, input_boolean, script, media_player]
  default:
    allow_domains: [light, switch, input_boolean]
  unknown:
    allow_domains: [light]

# Language policy — bilingual household (EN/TH). Preserve originals,
# index in English, answer in the user's language.
# Rationale: gemini-embedding-2 is multilingual so cross-language vector
# recall works, but same-language matching is stronger; translation at
# write time risks baking a mistranslation into permanent false facts.
# Response language is independent of storage language — tests must use
# bilingual assertions (see tests/scenarios-live/archive_recall.yaml).
language_policy:
  raw_layer:
    # transcripts, raw memories, ada_remember captures
    rule: "preserve original language; every doc carries lang: en|th"
    thai_note: "store as said; add an English gloss field for Thai memories
      so the English index layer can find them"
  index_layer:
    # canonical knowledge: gap docs, procedures, reports, SSOT-derived docs
    rule: "English only — this is the uniform retrieval surface"
  response_layer:
    rule: "Ada answers in the user's language — independent of storage"
  test_policy:
    rule: "response_contains assertions must carry EN+TH terms where the
      semantic answer could come back in either language"
  source: "decision 2026-09-24 — hybrid model; see session discussion"

config:
