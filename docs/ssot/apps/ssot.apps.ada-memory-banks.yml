title: Ada Memory Banks
subtitle: Declarative registry of named memory banks for Ada (MDDB fast tier + optional NotebookLM deep tier), each assignable per instance (tony/michael)
icon: 🧠
sections:
  - title: Concept
    icon: "💡"
    layout: list
    items:
      - label: Memory bank
        text: A named logical memory store. Each bank owns one MDDB collection (fast recall/write tier) and optionally one NotebookLM notebook (deep-recall/archive tier). Banks are the user-facing knowledge layer; the internal operational collections (ada-ha-snapshots-*, ada-ha-events-*, ada-ha-device-*, ada-ha-recall-summary-*) stay unchanged.
      - label: Assignment
        text: Every bank lists the instance IDs allowed to use it. A service loads only banks whose instances list contains its own ADA_INSTANCE_ID. Shared banks appear in both tony and michael; per-instance or single-instance banks are private.
      - label: Read-only mount (instances_readonly)
        text: "Dev/staging backends (ADA_INSTANCE_ID=dev, tony-dev, ada-dev — the ha-lanes dev twins) must not write prod memory, so they are never added to instances. Instead a bank may declare instances_readonly: {dev-instance: prod-instance} — the bank loads for the dev instance exactly as it would for the mapped prod instance ({instance} expands to the mapped ID, not the dev ID), with writable and allowed_tools forced off at load. A dev instance not listed is skipped like any unassigned instance. Runtime support lands via card ada-memory-dev-lane-runtime; until then the field is inert and dev instances simply see only their assigned banks."
      - label: Identity rule
        text: Same fail-fast policy as ADA_INSTANCE_ID — a bank that cannot resolve its collection name or is not assigned to the running instance is skipped loudly (logged + surfaced via /api/health degraded flag), never silently routed elsewhere.
  - title: Naming
    icon: "🏷️"
    layout: list
    items:
      - label: Shared banks
        text: "MDDB collection ada-ha-bank-<name> with no instance suffix. Example: ada-ha-bank-general."
      - label: Per-instance banks
        text: "scope: instance expands {instance} in mddb_collection, e.g. ada-ha-bank-personal-{instance} → ada-ha-bank-personal-tony."
      - label: Separation
        text: The ada-ha-bank-* prefix keeps curated knowledge distinct from operational telemetry (snapshots/events/device-*) so recall and retention policies can differ.
  - title: Document Metadata
    icon: "📄"
    layout: list
    items:
      - label: kind
        text: fact | preference | person | procedure | note — drives recall ranking and summary prompts.
      - label: scope
        text: shared | tony | michael — mirrors the bank assignment; private transcripts, secrets, and live sensor state never enter shared banks.
      - label: confidence
        text: 0.0–1.0; low-confidence hits escalate to the NotebookLM tier instead of being spoken as fact.
      - label: validity
        text: valid_from and last_verified (ISO dates) let recall prefer fresh facts and flag stale ones.
      - label: applies_to
        text: Optional entity_id/area list tying a fact to HA objects (e.g. cover.gate_motor).
      - label: subject / attribute
        text: Optional "what it's about" + "which aspect" pair (e.g. gate-remote / location) — the join key that lets search find differently-phrased facts about the same thing for update/conflict detection.
      - label: status
        text: active | superseded | retracted | expired — recall surfaces only active docs; superseded docs link via supersedes/superseded_by keys.
      - label: valid_until
        text: 'Optional TTL date ("pump is being repaired this week") — expiry is applied lazily at recall time as status: expired.'
      - label: source
        text: voice | manual | import — provenance for audits and later consolidation.
      - label: env
        text: "prod | staging — lane provenance stamped at write time from the bank's env marker (dev-scratch carries env: staging). Drift reports and consolidation filter env:staging docs out of prod digests. Absent = prod."
  - title: Runtime Wiring
    icon: "⚙️"
    layout: list
    items:
      - label: Registry file
        text: Authored here in SSOT; rendered to ADA_MEMORY_BANKS_FILE (default ~/.config/ada/memory-banks.json) on mn01 and tony-dell at deploy time. Services read the file, filter by ada_instance_id().
      - label: backend/memory_banks.py
        text: "Planned module in ada-pi: loads the registry, resolves mddb_collection ({instance} expansion), exposes banks(), collection_for(bank), notebook_for(bank). Fail-fast on missing registry for any bank marked required."
      - label: ada_remember tool
        text: Planned Gemini tool ada_remember(bank, text) → writes to the bank's MDDB collection with metadata above; optionally mirrors to the bank's NotebookLM notebook as a text source.
      - label: Recall routing
        text: ada_session_recall gains a bank param (superset of today's group). MDDB semantic search on the bank's collection first; low confidence or explicit detail requests escalate to the bank's notebook (~20s, background) — same tiered policy as now.
      - label: Introspection
        text: GET /api/memory/banks returns the banks assigned to the running instance with collection/notebook resolution for debugging.
      - label: ada-pi-pwa
        text: Runs ADA_INSTANCE_ID=tony, so it automatically sees every bank assigned to tony — consistent with today's shared-memory behavior.
      - label: Dev lane
        text: "Dev/staging backends (ada-dev.service ADA_INSTANCE_ID=dev; lane twins tony-dev/ada-dev per ha-lanes) write only to the dev-scratch bank and mount prod banks read-only via instances_readonly. Their operational collections (ada-ha-events-<instance>, snapshots, recall-summary) suffix per instance as usual, so test telemetry stays out of prod feeds."
  - title: NotebookLM Tier
    icon: "📓"
    layout: list
    items:
      - label: notebooklm_group
        text: Optional group name resolved per-instance via NOTEBOOKLM_NOTEBOOK_IDS_JSON (memory/infra/apps/kb/ops). Use this when each instance should keep its own deep-tier notebook.
      - label: notebooklm_id
        text: Optional literal notebook ID for a genuinely shared deep tier (one notebook both instances read). Mutually exclusive with notebooklm_group.
      - label: 'Gotcha: key scopes'
        text: 'notebooklm-rest enforces a per-key notebook allowlist (NOTEBOOKLM_REST_KEY_SCOPES in ~/.config/secrets/notebooklm-rest-api.env on tony-dell). A group mapping alone is not enough — each new notebook must also be added to the calling key''s scope or every call returns 403. Michael''s set: memory=1c12d5c8…, infra=31fba197…, apps=1aa3e5be…, kb=5f52938d…, ops=7a970489… (created 2026-09-22).'
      - label: Back-compat
        text: NOTEBOOKLM_NOTEBOOK_IDS_JSON keeps working; a recall group with no matching bank falls back to today's behavior and maps to a default ada-ha-bank-<group> collection if ever persisted.
  - title: Write & Update
    icon: "✏️"
    layout: list
    items:
      - label: Find-then-update
        text: Updates require a read first — ada_memory_search returns doc keys. A match gets corrected in place (same key, revision +1, last_verified bumped); no match creates a new doc with a derived slug key.
      - label: Three update verbs
        text: "Correct = overwrite same key in place (MDDB revision history is the audit trail). Supersede = write a new key, mark the old doc status: superseded with superseded_by/supersedes links. Retract = status: retracted, preferred over delete; hard delete only for privacy/secret leaks."
      - label: Per-bank write policy
        text: "writable gates writes entirely (false = read-only bank). write_policy reuses the ToolRunner confirmed=true gate — same pattern as dangerous HA entities: confirmed = Ada must ask before writing, direct = write immediately. allowed_tools lists which write tools may touch the bank. Banks mounted via instances_readonly are forced writable=false + allowed_tools=[] at load regardless of these fields — a dev-lane read can never become a dev-lane write."
      - label: Pre-write content scan
        text: "Every memory write (ada_remember curated banks, kind=vocab, kind=guest, guest_remember, guest_remember_private) passes through backend/memory_write_guard.py before the MDDB/chaba upsert. Content matching the write_guard rule classes below is refused with {ok: false, reason, matched_class} — the refusal is identity-agnostic (trusted full:true identities are scanned too; the scan guards the bank, not the caller) and logged as a memory-scan-refused ops event in ada-ha-events-<instance> carrying identity/bank/class/rule only — never the payload."
      - label: NotebookLM is append-only
        text: "NLM sources can't be edited, so updates are never mirrored in place — MDDB is the mutable current truth, NotebookLM is the append-only archive. On update, optionally add a 'Correction: <key> (date)' text source."
      - label: Full schema
        text: The formal meta schema and verb semantics live in ssot.apps.ada-memory-schema.yml.
  - title: Visibility
    icon: "👁️"
    layout: list
    items:
      - label: public
        text: "true = served when the vault UI runs with ADA_DEPLOY=public; absent/false = tailnet-only. Deny-by-default: a bank must be consciously marked public. Applies to vault tree/note/graph metadata, not just bodies — hidden banks are dropped before any node/edge emission."
      - label: Host vs policy
        text: "ADA_DEPLOY env declares where the service runs (context, per-host); public: declares what may leave the tailnet (policy, in SSOT). See docs/ada-memory/tony-projects/public-host-plan.md."
  - title: Status
    icon: "🚦"
    layout: list
    items:
      - label: Registry
        text: "This file is the source of truth for bank definitions; the banks: block below is machine-readable and rendered to the runtime JSON."
      - label: Implementation
        text: "memory_banks.py, ada_remember, and bank-aware recall are LIVE (deployed 2026-09-20) — banks marked status: active are serving recall/writes."
      - label: Adjusting banks
        text: "Add/remove/rename banks by editing the banks: block; flip instances to move a bank between tony and michael; no code change needed for assignment-only edits."

banks:
  general:
    title: General knowledge
    description: Free-form facts, preferences, and "remember that…" notes
    scope: shared
    instances: [tony, michael, kk]
    instances_readonly: {tony-dev: tony, ada-dev: tony}
    mddb_collection: ada-ha-bank-general
    notebooklm_group: memory
    notebooklm_id: null
    kinds: [fact, preference, note]
    writable: true
    write_policy: confirmed
    allowed_tools: [ada_remember, ada_forget, ada_outcome]
    status: active
    public: false
  home:
    title: Household knowledge
    description: "Home topology, device aliases, procedures, status notices — the shared household notebook. Writable (confirmed) since 2026-10-10 so member procedures/notices accumulate via ada_remember."
    scope: shared
    instances: [tony, michael, kk]
    instances_readonly: {tony-dev: tony, ada-dev: tony}
    mddb_collection: ada-ha-bank-home
    notebooklm_group: null
    notebooklm_id: null
    kinds: [fact, procedure, note]
    writable: true
    write_policy: confirmed
    allowed_tools: [ada_remember, ada_forget, ada_outcome]
    status: active
    public: false
  people:
    title: People and relationships
    description: Who is who, relationships, individual preferences
    scope: shared
    instances: [tony, michael, kk]
    instances_readonly: {tony-dev: tony, ada-dev: tony}
    mddb_collection: ada-ha-bank-people
    notebooklm_group: null
    notebooklm_id: null
    kinds: [person, preference, fact]
    writable: true
    write_policy: confirmed
    allowed_tools: [ada_remember, ada_forget, ada_outcome]
    status: active
    public: false
  personal:
    title: Private per-instance memory
    description: Instance-private notes that must never cross to the other instance. When speaker ID is active, this bank is the default personal bank for the instance owner (Tony on tony, Michael on michael). Other identified speakers (e.g. KK) are routed to their person-scoped bank instead.
    scope: instance
    instances: [tony, michael]
    instances_readonly: {tony-dev: tony, ada-dev: tony}
    mddb_collection: ada-ha-bank-personal-{instance}
    notebooklm_group: null
    notebooklm_id: null
    kinds: [fact, preference, note]
    writable: true
    write_policy: direct
    allowed_tools: [ada_remember, ada_forget, ada_outcome]
    status: active
    public: false
    person_scope: default
  personal-kk:
    title: KK private memory
    description: Person-scoped private memory for KK. Assigned to the kk instance (moved to kk-ha member node 2026-10-09 — ada-kk serves it; Tony's instance no longer does) but isolated from Tony's personal bank. Routed by speaker identity — only used when the current speaker is identified as KK.
    scope: person
    instances: [kk]
    mddb_collection: ada-ha-bank-personal-kk
    notebooklm_group: null
    notebooklm_id: null
    kinds: [fact, preference, note]
    writable: true
    write_policy: direct
    allowed_tools: [ada_remember, ada_forget, ada_outcome]
    status: active
    public: false
    person_scope: person.kk
    key_scope: [user-kk]   # her issued key routes here even without voice ID
  personal-nhong:
    title: Nhong private memory
    description: Person-scoped private memory for Mr. Nhong (kk-ha member). Served by the kk instance; isolated from KK's and Tony's banks — routed by speaker identity (person.nhong).
    scope: person
    instances: [kk]
    mddb_collection: ada-ha-bank-personal-nhong
    notebooklm_group: null
    notebooklm_id: null
    kinds: [fact, preference, note]
    writable: true
    write_policy: direct
    allowed_tools: [ada_remember, ada_forget, ada_outcome]
    status: active
    public: false
    person_scope: person.nhong
    key_scope: [user-nhong]
  personal-testo:
    title: Testo private memory
    description: Person-scoped private memory for Testo (HA user). Assigned to the tony instance but isolated from Tony's personal bank — routed by speaker identity (person.testo_2). Testo also gets a restricted person_policies allowlist so his sessions cannot reach Tony's banks.
    scope: person
    instances: [tony]
    instances_readonly: {tony-dev: tony, ada-dev: tony}
    mddb_collection: ada-ha-bank-personal-testo
    notebooklm_group: null
    notebooklm_id: null
    kinds: [fact, preference, note]
    writable: true
    write_policy: direct
    allowed_tools: [ada_remember, ada_forget, ada_outcome]
    status: active
    public: false
    person_scope: person.testo_2
    key_scope: [testo, user-testo]   # his keys route here even without voice ID
    speaker_name: KK
  tony-projects:
    title: Tony project notes
    description: Tony-only project and infrastructure notes
    scope: instance
    instances: [tony]
    instances_readonly: {tony-dev: tony, ada-dev: tony}
    mddb_collection: ada-ha-bank-projects-tony
    notebooklm_group: infra
    notebooklm_id: null
    kinds: [fact, procedure, note]
    writable: true
    write_policy: confirmed
    allowed_tools: [ada_remember, ada_forget, ada_outcome]
    status: active
    public: false
  note:
    title: Scratch notes (test bank)
    description: Tony-only sandbox bank for testing the ada_remember write/update flow
    scope: instance
    instances: [tony]
    instances_readonly: {tony-dev: tony, ada-dev: tony}
    mddb_collection: ada-ha-bank-note-{instance}
    notebooklm_group: null
    notebooklm_id: null
    kinds: [note, fact]
    writable: true
    write_policy: direct
    allowed_tools: [ada_remember, ada_forget, ada_outcome]
    status: testing
    public: false
    prompt_hidden: true
  dev-scratch:
    title: Dev scratch pad
    description: "Sole write target for dev/staging Ada sessions (ada-dev.service ADA_INSTANCE_ID=dev; ha-lanes twins tony-dev/ada-dev). Prod banks mount read-only on those instances via instances_readonly, so ada_remember can only land here — dev writes can never pollute prod memory. prompt_hidden keeps it out of {writable_banks} suggestions; docs are stamped env: staging (bank env marker) so drift reports/consolidation filter them out of prod digests."
    scope: shared
    instances: [dev, tony-dev, ada-dev]
    mddb_collection: ada-ha-bank-dev-scratch
    notebooklm_group: null
    notebooklm_id: null
    kinds: [note, fact]
    writable: true
    write_policy: direct
    allowed_tools: [ada_remember, ada_forget, ada_outcome]
    status: testing
    public: false
    prompt_hidden: true
    env: staging
  devin:
    title: Devin session history
    description: Tony-only read-only bank of Devin CLI session summaries (~/.local/share/devin/cli/summaries/history_*.md), synced by scripts/ada/sync-devin-summaries.py and distilled weekly by scripts/ada/distill-devin-bank.py (raw transcripts become status=superseded; devin/weekly-* digests stay active). Ask here for "what did we work on" questions.
    scope: instance
    instances: [tony]
    instances_readonly: {tony-dev: tony, ada-dev: tony}
    mddb_collection: ada-ha-bank-devin-tony
    notebooklm_group: null
    notebooklm_id: null
    kinds: [note]
    writable: false
    write_policy: confirmed
    allowed_tools: []
    status: active
    public: false
  devin-handoff:
    title: Devin task handoff
    description: Tony-only writable bank of distilled implementation specs for dispatched Devin sessions. Ada saves a spec here during conversation (ada_remember); a dispatched session is told to 'check the ada handoff' and reads the spec via the mddb MCP server. Keep entries short, self-contained, and free of secrets — a headless agent consumes them verbatim.
    scope: instance
    instances: [tony]
    instances_readonly: {tony-dev: tony, ada-dev: tony}
    mddb_collection: ada-ha-bank-devin-handoff
    notebooklm_group: null
    notebooklm_id: null
    kinds: [note, fact, procedure]
    writable: true
    write_policy: confirmed
    allowed_tools: [ada_remember, ada_forget, ada_outcome]
    status: active
    public: false
  cms:
    title: CMS pages & reports
    description: Ada CMS pages and published reports (ada-cms-pages collection). Read-only via memory search — use cms_get_page/cms_publish_page for full access. This is where "research on X" and generated reports live. Page meta is normalized onto the memory schema by scripts/ada/cms-normalize-meta.py (bank=cms, scope=tony, status, source, written_by, subject=slug, attribute=page-type, valid_from, last_verified, lang=doc-lang); cms-audit.py warns on missing schema fields (S1). flood-report + flood-report-nongdon* carry auto-updated news blocks from scripts/ada/flood-news-update.py (seed map in scripts/ada/flood-news-feeds.json). Per-page switches/knobs live in the ada-cms-automation collection — one registry doc per slug (enabled, feeds, require, since_hours, max_items, interval_min, langs, run_now + worker write-back) — see docs/implementation/cms-page-automation-plan.md.
    scope: instance
    instances: [tony]
    instances_readonly: {tony-dev: tony, ada-dev: tony}
    mddb_collection: ada-cms-pages
    notebooklm_group: null
    notebooklm_id: null
    kinds: [page]
    writable: false
    write_policy: confirmed
    allowed_tools: []
    status: active
    public: false
  ideas:
    title: Ideas inbox
    description: >-
      Raw idea-burst capture — half-formed notes, fragments, and
      quick thoughts Tony wants parked before they disappear. Verbatim
      wording is kept in contentMd (meta kind=idea, attribute=raw).
      The Devin console session elaborates raw entries into connected,
      well-formed items (attribute=elaborated) which Tony confirms
      before they are filed as focus-inbox entries or devin-handoff
      specs (attribute=filed). Direct writes — note-taking never gates
      on confirmation.
    scope: instance
    instances: [tony]
    instances_readonly: {tony-dev: tony, ada-dev: tony}
    mddb_collection: ada-ha-bank-ideas-{instance}
    notebooklm_group: null
    notebooklm_id: null
    kinds: [note, idea]
    writable: true
    write_policy: direct
    allowed_tools: [ada_remember, ada_forget]
    status: active
    public: false
