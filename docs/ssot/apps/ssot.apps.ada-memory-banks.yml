# Pre-write content scan — card ada-memory-injection-scan (2026-10-09).
# Implemented in ada-pi backend/memory_write_guard.py (stdlib-only, string
# level — no model call in the write path); the rule table lives in the
# module's SCAN_RULES, this block is the documentation mirror — keep the
# two in sync (`python3 backend/memory_write_guard.py --list-rules`).
write_guard:
  module: backend/memory_write_guard.py
  wired_into:
    - ada_remember          # curated banks (text/subject/key) + kind=guest
    - vocab paths           # _vocab_append covers ada_remember kind=vocab + vocab_note
    - guest_remember
    - guest_remember_private
  refusal_contract: "{ok: false, reason, matched_class, matched_rule, error}"
  event:
    collection: ada-ha-events-<instance>
    kind: ops-event
    type: memory-scan-refused
    fields: [identity, bank, class, rule, session_id, ts]   # never the payload
  classes:
    prompt_injection:
      what: "instruction-override and role-spoof phrasing aimed at the recalling model"
      rules:
        - injection.ignore-instructions   # 'ignore/disregard/forget … instructions'
        - injection.system-prompt-ref     # 'system prompt', jailbreak/DAN/developer-mode
        - injection.you-are-now           # 'you are now', 'pretend you are', 'act as if'
        - injection.role-spoof-prefix     # line-initial 'system:'/'assistant:'/'user:'…
        - injection.special-token         # <<SYS>>, [INST], <|im_start|> …
        - injection.instruction-header    # '## New instructions:', 'new rules:' blocks
        - injection.reveal-prompt         # 'reveal your system prompt' phrasing
        - injection.authority-spoof       # 'this is a system message', 'I am your developer'
    credential_shape:
      what: "API keys, tokens, private-key blocks and password-style assignments — banks are never a secret store"
      rules:
        - cred.aws-access-key             # AKIA/ASIA/… + 16 upper-alnum
        - cred.openai-style-key           # sk-/pk-/ak-/rk- + 20+ chars (incl. proj/ant/live/test)
        - cred.github-token               # ghp_/gho_/ghu_/ghs_/ghr_/github_pat_
        - cred.slack-token                # xox[baprs]-
        - cred.google-api-key             # AIza…
        - cred.jwt                        # eyJ… dotted three-part
        - cred.private-key-block          # -----BEGIN … PRIVATE KEY-----
        - cred.bearer-token               # 'Authorization: Bearer …'
        - cred.password-assign            # password=/api_key:=/secret= assignments
        - cred.url-embedded-auth          # scheme://user:pass@host
    invisible_unicode:
      what: "zero-width, bidi override/isolate, tag (U+E0000s) and control characters"
      rules:
        - unicode.invisible-bidi          # ZWSP/ZWNJ/LRM/RLM/soft-hyphen/BOM/tag chars;
                                          # ZWJ refused only outside emoji/Indic/Arabic contexts
    content_flood:
      what: "oversized payloads, whitespace/blank floods, homoglyph mixing"
      rules:
        - flood.oversized                 # >FLOOD_MAX_CHARS, whitespace/repeat runs,
                                          # >50% blank bodies, Latin+confusable-script mixes
                                          # (Thai is normal content — not flagged)

# Conversational persona — adjustable per-identity style knobs. Stored as
# doc 'persona/self' inside the speaker's resolved personal bank (personal,
# personal-kk, personal-testo), so per-person isolation rides the existing
# person-scope + person_policies machinery for free. The ada_persona tool
# validates knob/value against this schema and applies changes mid-session;
# session prime injects non-default knobs for the identified speaker.
persona:
  doc_key: persona/self
  knobs:
    tone:          {values: [warm, direct, professional, playful], default: direct}
    verbosity:     {values: [brief, normal, detailed], default: normal}
    formality:     {values: [casual, polite, formal], default: polite}
    language:      {values: [auto, en, th], default: auto}
    address_name:  {type: string, max: 40, default: ""}
    emoji:         {type: bool, default: false}
    sassiness:     {values: [none, light, playful], default: none}
    proactiveness: {values: [minimal, normal, proactive], default: normal}

# Per-identity bank ACL — resolved against the session's memory identity:
# identified speaker's HA person entity first, then the issued device-key
# name, then 'default' for unlisted named identities, then 'unknown' for
# anonymous sessions. RESTRICTED-BY-DEFAULT: an unlisted identity gets the
# 'default' policy, NOT the full set — new people start guest-level until
# explicitly trusted. {full: true} = unrestricted (Tony's people/keys).
# allow = whitelist; deny = subtractive.
# dev-scratch appears in restricted allow lists but is inert on prod —
# the bank is only assigned to dev instances, so it loads nowhere else;
# on a dev backend it is each identity's sole writable bank.
person_policies:
  admin:        {full: true, label: Tony}   # env ADA_API_KEY identity
  person.tony: {full: true, label: Tony}
  person.kk:
    label: KK
    allow: [general, home, people, purchase, personal-kk, dev-scratch]
  user-kk:
    label: KK
    allow: [general, home, people, purchase, personal-kk, dev-scratch]
  person.nhong:
    label: Nhong
    allow: [general, home, people, personal-nhong, dev-scratch]
  user-nhong:
    label: Nhong
    allow: [general, home, people, personal-nhong, dev-scratch]
  tony-ip:     {full: true, label: Tony}
  user-tonezzzz: {full: true, label: Tony}
  user-tony2:    {full: true, label: Tony}
  user-ha-mcp-server: {full: true, label: Tony}
  ha-03e85ebb:   {full: true, label: Tony}
  ha-4d0e0dee:   {full: true, label: Tony}
  ha-bf66722a:   {full: true, label: Tony}
  ha-testdebug001: {full: true, label: Tony}
  person.testo_2:
    label: Testo
    allow: [general, home, people, purchase, personal-testo, dev-scratch]
  testo:
    label: Testo
    allow: [general, home, people, purchase, personal-testo, dev-scratch]
  user-testo:
    label: Testo
    allow: [general, home, people, purchase, personal-testo, dev-scratch]
  default:
    allow: [general, home, dev-scratch]
  unknown:
    allow: [general, home, dev-scratch]

# Per-identity actuation ACL — which HA control tools a session may use.
# Same identity resolution as person_policies. {full: true} bypasses the
# policy layer (the global danger-pattern floor and confirmed= flow still
# apply). Otherwise the check order is:
#   deny_entities/deny_domains  — always deny (beat everything)
#   device-grants.json overlay  — runtime admin grants (ada_device_acl
#     tool), allow the entity even when allowlists wouldn't
#   allow_entities (non-empty)  — exact-entity whitelist
#   allow_domains  (non-empty)  — domain whitelist (absent = denied)
# Restricted identities still can't actuate dangerous domains
# (lock/cover/alarm/…) — the global deny floor already blocks them.
control_policies:
  admin:        {full: true}
  person.tony: {full: true}
  person.kk:
    allow_domains: [light, switch, input_boolean, script, media_player]
  user-kk:
    allow_domains: [light, switch, input_boolean, script, media_player]
  person.nhong:
    allow_domains: [light, switch, input_boolean, script, media_player]
  user-nhong:
    allow_domains: [light, switch, input_boolean, script, media_player]
  tony-ip:     {full: true}
  user-tonezzzz: {full: true}
  user-tony2:    {full: true}
  user-ha-mcp-server: {full: true}
  ha-03e85ebb:   {full: true}
  ha-4d0e0dee:   {full: true}
  ha-bf66722a:   {full: true}
  ha-testdebug001: {full: true}
  person.testo_2:
    allow_domains: [light, switch, input_boolean, script, media_player]
  testo:
    allow_domains: [light, switch, input_boolean, script, media_player]
  user-testo:
    allow_domains: [light, switch, input_boolean, script, media_player]
  default:
    allow_domains: [light, switch, input_boolean]
  unknown:
    allow_domains: [light]

# Language policy — bilingual household (EN/TH). Preserve originals,
# index in English, answer in the user's language.
# Rationale: gemini-embedding-2 is multilingual so cross-language vector
# recall works, but same-language matching is stronger; translation at
# write time risks baking a mistranslation into permanent false facts.
# Response language is independent of storage language — tests must use
# bilingual assertions (see tests/scenarios-live/archive_recall.yaml).
language_policy:
  raw_layer:
    # transcripts, raw memories, ada_remember captures
    rule: "preserve original language; every doc carries lang: en|th"
    thai_note: "store as said; add an English gloss field for Thai memories
      so the English index layer can find them"
  index_layer:
    # canonical knowledge: gap docs, procedures, reports, SSOT-derived docs
    rule: "English only — this is the uniform retrieval surface"
  response_layer:
    rule: "Ada answers in the user's language — independent of storage"
  test_policy:
    rule: "response_contains assertions must carry EN+TH terms where the
      semantic answer could come back in either language"
  source: "decision 2026-09-24 — hybrid model; see session discussion"

