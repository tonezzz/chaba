title: CMS Generated-Report Standard
subtitle: Page format, provenance meta, parent/child hierarchy, and the regenerate contract for ada-cms-pages
icon: 📰
version: 1

overview:
  purpose: |
    Standard for generated CMS reports — pages a tool produces from a log
    series or feed (flood-report, ops digests, audit rollups). Extends the
    layered reporting model in ssot.reports.yml to the CMS surface: the
    same vocabulary (generated_by, sources, children, parent) applied to
    MDDB doc meta instead of meta.yml files, because CMS pages carry their
    meta inside the document, not beside it.

    Goals: a report must be (a) referenceable — its sources and recipe are
    recorded; (b) re-playable — one command regenerates it; (c) linked —
    a child names its parent so rollups can extract with references;
    (d) auditable — cms-audit.py enforces the contract offline (snapshot)
    and live.

config:
  version: 1
  last_updated: "2026-09-29"
  maintainer: tony
  status: active
  origin: >
    Dispatch 2026-09-28 flood-news work: per-page automation registry
    (ada-cms-automation) + Tony's request — "record the sources and how we
    create the report so we can both reference and re-play it … a
    Regenerate button … mind the resources cost."
  supersedes: nothing — complements ssot.reports.yml (repo-layer reports)
    and ssot.apps.ada-memory-schema.yml (meta fields)

page_roles:
  description: >
    Every generated page declares meta.report_role. Pages without
    generated_by are hand-maintained and exempt from the R-rules.
  values:
    leaf: >
      Built directly from sources (RSS feeds, MDDB collections, logs).
      Examples: flood-report*, ops digests, ha-report.
    rollup: >
      Built from children reports, not raw sources. meta.children is
      mandatory; the body must link each child slug it extracts from.
    index: >
      Navigational hub listing children/parents; may be hand-maintained
      but still declares report_role=index.
  inference: >
    children non-empty implies rollup; absent implies leaf. role mismatch
    is an audit warning, not a failure.

page_format:
  description: >
    Standard layout for generated report pages. Generators own the
    auto-marked regions; everything outside is curated and never touched.
  template: |
    # {Title — matches meta.title}
    **อัปเดตล่าสุด:** {YYYY-MM-DD HH:MM}        (or **Updated:** on en pages)
    <!-- flood-news:auto -->                   (managed block(s) — any
    ## ข่าวน้ำท่วมอัตโนมัติ — ดึงเมื่อ …          paired <!-- X:auto --> /
    * **[item](url)** — source · เผยแพร่ ts      <!-- /X:auto --> markers)
    <!-- /flood-news:auto -->
    ## {curated sections — preserved verbatim}
    ---
    *Generated {ts} by `cmd` in {duration}s · sources: {names} ·
     parent: [slug] · children: [a, b]*
  rules:
    - H1 first line; **อัปเดตล่าสุด:** line follows when the generator refreshes it
    - managed regions sit inside paired <!-- X:auto --> markers; unbalanced markers fail audit R4
    - 'provenance footer at the bottom, italic one-liner (audit R2 regex: "Generated by|รวบรวมอัตโนมัติ|สร้างโดย")'
    - per-item lines carry publish timestamp + source link — no bare claims
    - generators must be idempotent: identical source items produce no write

provenance_meta:
  description: >
    Doc meta fields (memory-schema aligned — same names as the repo-layer
    meta_schema in ssot.reports.yml so both surfaces query identically).
    Written by the generator at publish time.
  fields:
    generated_by: exact replayable command, e.g. "flood-news-update.py --page flood-report"
    sources: list — feed names / collections / artifacts consumed this run
    children: list of CMS slugs rolled up into this page (rollup only)
    parent: CMS slug this report feeds into (leaf/rollup only)
    report_role: leaf | rollup | index
    updated: existing field = generated_at
    last_verified: existing field = freshness check date
  registry_state: >
    Runtime cost/status lives on the ada-cms-automation registry doc, not
    the page: last_run, last_status, last_count, last_error,
    last_duration_s.

regenerate_contract:
  description: >
    One mechanism serves the Ada tool, a UI button, and the timer: set
    run_now on the page's registry doc → the dispatcher runs the page's
    generator → writes content + provenance + last_* state back.
    Same cctv_wall shape as the rest of page automation.
  registry_additions:
    generator: >
      `{"kind": "rss-block", ...}` = in-process fetch path (current);
      `{"kind": "command", "cmd": "ops-report.py --hours 72",
      "cwd": "scripts/ada"}` = exec a repo script — how non-feed reports
      get a Regenerate button. command cmds are allowlist-validated to
      scripts under this repo (no arbitrary shell).
    parent: "slug — also stamped onto the page meta so hierarchy is visible"
    children: "list of slugs — same"
    cost.timeout_s: "per-run cap (default 300); exceeded = last_status=error"
    cost.max_items / since_hours: "bound the fetch volume"
  button_surfaces:
    - "Ada voice: cms_automation(slug, action=run) — P1, ada-pi repo"
    - "Ada PWA/frontend CMS viewer: ⟳ Regenerate button — P1, ada-pi repo"
    - "any MDDB client: POST /v1/add registry doc with run_now=true"
    - "dispatcher timer (e.g. 5–15 min) picks run_now up; interval_min still gates scheduled passes"

cost_model:
  description: >
    Regeneration must stay cheap and observable. Every generator reports
    its cost; knobs bound the spend before the run, last_duration_s
    reports it after.
  knobs:
    timeout_s: hard cap on one page's run (feed fetch already capped per-request)
    interval_min: minimum minutes between runs — the load governor
    max_items: cap items fetched/rendered
    since_hours: fetch window
    langs: limit which variants are rewritten
  telemetry:
    last_duration_s: worker write-back — measured wall time per page run
    last_count: items written
    benchmark: >
      Baseline measured 2026-09-29: `flood-news-update.py --all` over 3
      pages / ~10 feeds ≈ seconds-scale (network-bound, no LLM).
      Command-kind generators that call LLMs must declare cost.tier:
      cheap (fetch+render) | llm (token spend) so the dispatcher and Ada
      can prefer cheap regenerations.

ci_enforcement:
  description: >
    GitHub Actions cannot reach the tailnet MDDB — enforcement splits
    into an offline lane (snapshot lint, in CI) and a live lane (on-host,
    result published to cms-audit-report).
  offline_lane:
    input: backups/ada-memory/ada-cms-pages.json (refreshed by ada-memory-backup.service --git)
    command: python3 scripts/ada/cms-audit.py --file backups/ada-memory/ada-cms-pages.json --baseline scripts/ada/cms-audit-baseline.json
    ratchet: >
      Baseline JSON lists known failures {slug: [rules]}. CI fails on any
      NEW failure and on stale baseline entries (a page that now passes
      must be removed — the baseline only shrinks).
  live_lane:
    runner: scheduled cms-audit.py --publish on tony-dell (or the existing audit flow)
    output: ada-cms-pages/cms-audit-report
  scope: >
    A-rules and R-rules fail the page; C/S rules warn. R-rules only apply
    to docs whose meta carries generated_by.

audit_rules:
  failures:
    - "R1 generated-by-without-sources: generated_by set but sources empty"
    - "R2 no-provenance-footer: generated page body lacks the footer marker"
    - "R3 dangling-link: meta.parent/children slug not found in collection"
    - "R4 unbalanced-auto-block: <!-- X:auto --> without its closer"
    - "A1..A6: existing content rules (unchanged)"
    - "N1..N4: news digest rules, attribute-gated (unchanged)"
  warnings:
    - "R5 no-registry-doc: generated page has no ada-cms-automation entry (live mode only)"
    - "R6 role-mismatch: report_role leaf/rollup vs children inference disagrees (index exempt — indexes legitimately list children)"
    - "C1/C2, S1: unchanged consolidation/staleness/schema warnings"

writer_contract:
  description: >
    Rules every generator of ada-cms-pages docs must follow so pages stay
    memory-schema conformant (audit S-rules) across rewrites.
  rules:
    - >
      MERGE existing doc meta (GET old doc, update tool-owned keys, keep
      the rest) — never bare-replace. A full replace wipes the schema
      fields cms-normalize-meta.py stamps and reflags S1 every run.
      Examples of the pattern: cms-audit.publish, news-flood-fetch.publish.
    - >
      Emit the full schema set on every write: bank=cms, scope=tony,
      status, source, written_by, subject=slug, attribute (same value
      cms-normalize-meta.page_type would compute — divergence causes
      normalize/writer churn), valid_from (preserve existing, else doc
      addedAt, else today), last_verified=today.
    - >
      children is rollup/index-only — leaves must not carry the key.
      An empty/None value serializes as a dangling "None" slug (R3).
    - >
      Provenance footer text must contain the literal phrase the R2 regex
      matches ("Generated by" / รวบรวมอัตโนมัติ / สร้างโดย) — "Generated
      <timestamp> by …" does NOT match (tts-voice-catalog lesson).

report_first_protocol:
  description: >
    Ada's default read path (requested by Tony 2026-10-10): answers come
    from generated reports first; raw tool calls are the drill-down, not
    the entry point. One fat raw response (a full board query inside a
    voice turn) once pushed a session turn past the context-rotate
    budget and dropped the user mid-answer — reports keep turns small,
    curated, and cheap.
  read_flow:
    - >
      1. Check reports-index (or the known report slug) — read the
      report page, not the underlying collection.
    - >
      2. Check freshness: meta.updated vs meta.fresh_for — a stale
      report is still read, but the answer is flagged as stale.
    - >
      3. Drill via the report: fetch an individual doc/card only when
      the report doesn't carry the detail needed — and always before
      acting on it (the report is a snapshot).
  write_guard:
    - >
      Before any write that mutates state a report described (card move,
      comment, respond), re-read the item's `updated` stamp. If it
      changed since the report/first read, the item moved under you —
      re-read, reconcile, retry once if still applicable, otherwise
      report the conflict to the user. Tool-side: kanban write actions
      accept expected_updated= and return stale=true on mismatch.
  quality_loop:
    - >
      Report below standard (stale past fresh_for, missing blocks,
      R-rule violations): Ada fixes it with tools — regenerate via the
      page's declared generator command (report refresh actions, or the
      ada-cms-automation registry entry). She may refresh a report, she
      may not restructure it.
    - >
      If regeneration fails or the report itself is structurally wrong,
      Ada files a kanban card (kanban action=file) describing the page
      and the failure — Devin/dispatch steps in. Never silently work
      around a broken report and never speak stale data as fresh.
  board_index_structure:
    description: >
      The Ada-facing kanban report shape — a managed block inside
      kanban-brief (<!-- board-index:auto -->), one compact pipe row per
      open card, machine-readable and token-cheap:
    row_format: "id | col | pri | updated (MM-DD HH:MM) | reqs | title<=80c"
    rules:
      - >
        open cards only, ordered review→doing→todo→backlog→lab,
        recently-updated first within each column
      - >
        reqs column counts unanswered board requests — the ask/respond
        protocol depends on it
      - >
        the block is generator-owned (kanban-brief.py); prose elsewhere
        on the page stays Tony-facing
      - >
        drills happen via kanban action=read id=<id>, never by
        re-querying the whole board

nodes:
  description: CMS-side instances of the standard — the registry seed lives in the ada-cms-automation collection
  examples:
    - id: flood-report
      role: rollup
      generator: scripts/ada/flood-news-update.py --page flood-report
      parent: flood-overview
      children: [flood-report-nongdon-saraburi, flood-report-pattaya-rayong, flood-coordinates-rayong]
    - id: flood-report-nongdon-saraburi
      role: leaf
      parent: flood-report
    - id: flood-report-pattaya-rayong
      role: leaf
      parent: flood-report
    - id: flood-coordinates-rayong
      role: leaf
      parent: flood-report
      note: hand-maintained leaf (its own flood-coordinates:auto block), not feed-driven
    - id: flood-overview
      role: index
      children: [flood-report, flood-hub-assessment]
    - id: services-by-host
      role: index
      generator: scripts/ada/host-services-cms.py
      children: [services-* leaves]

