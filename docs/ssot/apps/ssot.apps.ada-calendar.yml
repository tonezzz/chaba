title: Ada Calendar & Tasks
subtitle: Provider-agnostic calendar/tasks tools for Ada — Google adapter live, CalDAV/MS Graph pluggable via registry
icon: 📅
sections:
  - title: Concept
    icon: "💡"
    layout: list
    items:
      - label: Provider-agnostic tools
        text: "Gemini-visible tools (calendar_*, tasks_*, plan_day) never name a provider. backend/calendar_providers.py defines CalendarProvider/TasksProvider protocols and normalized CalendarEvent/Task models; adapters normalize each service."
      - label: Registry-driven
        text: "The calendar: block below is rendered by scripts/ada/render-calendar-providers.py — default to ~/.config/ada/calendar.json (all providers; ADA_CALENDAR_FILE overrides). --instance <lane> renders the lane file declared in calendar.lanes (calendar-<instance>.json) filtered to providers whose instances: name the lane, with write: resolved per lane. Same pattern as memory banks: instances: + status: filter per ADA_INSTANCE_ID; unknown adapter on an active provider fails loudly."
      - label: Aggregate reads, routed writes
        text: "read: aggregate fans out list calls across active providers and merges; write: names the default write provider. Explicit 'provider:calendar_id' overrides both. Events are never replicated between providers — aggregation is the sync model."
      - label: Qualified ids
        text: "Everything returned to the model carries provider-qualified ids ('google:primary/abc123', 'google:@default/xyz') so delete/complete calls route back to the right adapter."
  - title: Auth Model
    icon: "🔐"
    layout: list
    items:
      - label: OAuth client
        text: "Reuses the Desktop-app client in ~/.config/secrets/google_credentials.json — project gen-lang-client-0694401188, the same project as GEMINI_API_KEY. Calendar API + Tasks API must be enabled on that project."
      - label: Token file
        text: "Per-identity refresh tokens: shared/tony at ~/.config/secrets/ada-google-calendar-token.json, members at ada-google-<svc>-token-<member>.json (chmod 600; override ADA_GOOGLE_TOKEN_FILE or per-provider token_file). Minted by scripts/ada/google-calendar-auth.py — --member derives the filename; scopes: calendar.readonly, calendar.events, tasks."
      - label: Member onboarding (manual-paste)
        text: "--manual prints the consent URL with a dead-localhost redirect — the member opens it on her phone, signs in as herself, and pastes the address-bar URL back (runbook member_google_onboard). Google's device flow is unusable: its endpoint rejects Calendar/Tasks scopes."
      - label: Consent screen
        text: "OAuth consent screen must be Publishing status=production — 'Testing' status expires refresh tokens after 7 days AND only whitelisted test-user accounts may consent at all (members get Error 403 access_denied). Published-but-unverified shows a 'Google hasn't verified this app' warning the member clicks through (Advanced -> Go to app)."
      - label: API key is not auth
        text: "GEMINI_API_KEY identifies the project for billing only; it can never read user calendar data. Calendar/Tasks require OAuth. Optional per-member GEMINI_API_KEY_<member> (e.g. GEMINI_API_KEY_KK in gemini-keys.env) gives own free quota — unrelated to calendar identity."
  - title: Tool Contract
    icon: "🛠️"
    layout: list
    items:
      - label: Reads (ungated)
        text: "calendar_list_calendars, calendar_list_events, calendar_freebusy, tasks_list, plan_day — NON_BLOCKING, partial results include per-provider errors list (the google adapter also degrades per-calendar: one dead/mis-shared calid lands in errors[] instead of sinking the read — added 2026-10-13 after the e468a444 404 storm)."
      - label: Writes (confirmed=true)
        text: "calendar_create_event, calendar_delete_event, tasks_add, tasks_complete — in CALENDAR_WRITE_TOOLS; _check_calendar_write_allowed requires confirmed=true and honors ADA_READ_ONLY."
      - label: Dispatch
        text: "ToolRunner.calendar lazily loads CalendarService from the rendered registry; None means not configured on this instance (tools return a 'not configured' error, not a crash)."
      - label: Timezone
        text: "All 'today/tomorrow' parsing and naive datetimes resolve in ADA_TIMEZONE (default Asia/Bangkok)."
  - title: Adapter Capability Matrix
    icon: "🧩"
    layout: list
    items:
      - label: google (live)
        text: "backend/google_calendar.py — httpx-native Calendar API v3 + Tasks API. Events list/create/delete, freebusy, task lists/tasks/complete. tasks: true."
      - label: caldav (planned)
        text: "python-caldav covers iCloud + Fastmail + Nextcloud in one adapter. iCloud tasks = VTODO (Apple Reminders). No freebusy on iCloud. Credentials pattern mirrors icloud-mcp (app-specific password)."
      - label: msgraph (planned)
        text: "Microsoft Graph for Outlook/Hotmail events + To Do tasks via msal OAuth. Build only when an Outlook calendar is actually in play."
      - label: home-assistant (rejected as primary)
        text: "HA calendar.*/todo.* integrations could proxy providers, but create-event support is per-integration and weaker; kept as a possible read adapter, not the primary path. See decision record ada-calendar-provider-backend."
  - title: Files
    icon: "📁"
    layout: list
    items:
      - label: backend/calendar_providers.py
        text: "Models, protocols, CalendarService (registry load, aggregate reads, write routing, plan_day)."
      - label: backend/google_calendar.py
        text: "Google adapter: refresh-token exchange, events, freebusy, tasks."
      - label: backend/tool_runner.py
        text: "CALENDAR_WRITE_TOOLS gate + calendar_*/tasks_*/plan_day methods."
      - label: backend/realtime_provider.py
        text: "function_declarations + instruction paragraph (calendar workflow playbook)."
      - label: scripts/ada/google-calendar-auth.py
        text: "One-time consent flow (loopback or --manual paste-back for member phones) + --check verifier + --host scp; --member derives the per-member token filename."
      - label: scripts/ada/render-calendar-providers.py
        text: "SSOT -> ~/.config/ada/calendar.json renderer (--host, --check), same shape as render-memory-banks.py. --instance <lane> renders the lane's own file (calendar.lanes.<lane>.file) with providers filtered to that lane and per-lane write."
  - title: Runbooks
    icon: "📖"
    layout: list
    items:
      - label: ssot.ada.howto.yml
        text: "google_calendar_reauth, member_google_onboard, add_calendar_provider, calendar_tool_debug live in the ada howto SSOT."
  - title: Known Issues
    icon: "⚠️"
    layout: list
    items:
      - label: Google Tasks limits
        text: "Tasks API due is date-only (time ignored); no subtasks/recurrence exposed in the normalized Task model."
      - label: All-day end date
        text: "Google all-day events use exclusive end dates — pass the day after for a one-day event; the adapter passes dates through verbatim."

# Machine-readable registry — rendered to ~/.config/ada/calendar.json by
# scripts/ada/render-calendar-providers.py. Edit here, re-render, deploy.
calendar:
  read: aggregate
  write: google
  # Per-lane registry files (card member-own-google-account):
  # render-calendar-providers.py --instance <lane> filters providers: to the
  # entries whose instances: name the lane, resolves write: from here, and
  # writes ~/.config/ada/<file>. 'lanes' is a render-time key — it never
  # appears in the rendered JSON.
  lanes:
    tony:
      file: calendar.json          # equivalent to the default render
      write: google
    kk:
      file: calendar-kk.json
      write: google-kk             # her own identity — writes land on HER account
    # kk-dev keeps its hand-maintained calendar-kk-dev.json (separate test
    # calendar) until a google-kk-dev provider is declared — rendering
    # --instance kk-dev fails loudly rather than clobber it with an empty set.
  providers:
    google:
      adapter: google
      title: Google Calendar + Tasks (tony's account)
      instances: [tony]
      status: active
      tasks: true
      # Read set — all 15 calendars on the account (verified 2026-09-21 via
      # calendar-smoke.py). 'primary' = "Tony's main". Writes go to
      # default_calendar unless the user names 'google:<calid>'.
      calendars:
        - primary                                                        # Tony's main
        - 4cf4e59c577d638143c46808598d1e1f794f1d26260c62944eb7b6f977eea95d@group.calendar.google.com  # tony-ha household
        - family00576230129484617118@group.calendar.google.com           # Family
        - en.th#holiday@group.v.calendar.google.com                      # Holidays in Thailand
        - 3c31ljkn7vs1ea05vt9sd1dfdg@group.calendar.google.com           # CallTrack
        - tanku63uj83vg0b2k4vr89r1hg@group.calendar.google.com           # Banks & payments
        - 2f3oo3ukm6hr1l2898qfluqe0o@group.calendar.google.com           # Hosting (Domain & Web)
        - lmniec088vkvphpjdluvl1nmn4@group.calendar.google.com           # Jobs (periodics)
        - 28124f2c289d2d53faeef2ab3e30c5e81255d5a51163660218af97ae9e24f0d7@group.calendar.google.com  # Jarvis Reminders
        - cd18e8b64e3bc42c4bae1af349cfab2a1f329c76817595e5339600d150ba1de9@group.calendar.google.com  # Noble Park - Working
        - edadaa3903a82265a3684223a9dedcf741ef689f3c66f910f66d5440fce45abe@group.calendar.google.com  # Noble Park - Planning
        - 5376a2affe56e30e7fabea676c42bdaab52326e6d9b0556e478d6597fdacde82@group.calendar.google.com  # Noble Park - Event
        - 12dfebf81f112ab1b42ca73c650b896c892b7717dab8590756cec35cca64a0bc@group.calendar.google.com  # Noble A - Working
        - 332136e2292f48b7d97a9bb3a3c9b84359e44d550f8b1dba75376c7f39f8726e@group.calendar.google.com  # Noble A - Planning
        - c25a2f285322ac7f96b097b588a9132058955cd72baa046f533ce88ec7ae8184@group.calendar.google.com  # Noble A - Event
      default_calendar: primary
      task_list: "@default"
      token_file: ~/.config/secrets/ada-google-calendar-token.json
    google-kk:
      adapter: google
      title: Google Calendar + Tasks (Kaewta's own account)
      instances: [kk]
      status: planned              # flip to active once her token is minted +
                                   # --check verified (member_google_onboard)
      tasks: true
      # Her own account's calendars. 'primary' should be the 'kk member
      # calendar' surfaced as 1c408592… in the shared embed; if --check
      # --member kk lists it under a different calid, add that id here.
      calendars:
        - primary
      default_calendar: primary
      task_list: "@default"
      token_file: ~/.config/secrets/ada-google-calendar-token-kk.json
    google-household:
      adapter: google
      title: Shared household calendars (read layer via Tony's token)
      instances: [kk]              # extend as more member lanes onboard
      status: active
      tasks: false
      # Hybrid read-provider: the household layer stays visible on member
      # lanes via Tony's token until each member's own account is granted
      # sharing directly. Writes never default here (lanes.<lane>.write) —
      # read_only declares intent; explicit 'google-household:<calid>'
      # targeting still routes until ada-pi enforces the flag (follow-up).
      read_only: true
      calendars:
        - 4cf4e59c577d638143c46808598d1e1f794f1d26260c62944eb7b6f977eea95d@group.calendar.google.com  # tony-ha household
        - family00576230129484617118@group.calendar.google.com           # Family
        - en.th#holiday@group.v.calendar.google.com                      # Holidays in Thailand
      token_file: ~/.config/secrets/ada-google-calendar-token.json
    icloud:
      adapter: caldav
      title: iCloud Calendar + Reminders (CalDAV)
      instances: []
      status: planned
      tasks: true
      url: https://caldav.icloud.com
      notes: "Needs caldav adapter implementation + app-specific password secret."
    outlook:
      adapter: msgraph
      title: Outlook/Hotmail + To Do (Microsoft Graph)
      instances: []
      status: planned
      tasks: true
      notes: "Needs msgraph adapter implementation + MS OAuth client."

