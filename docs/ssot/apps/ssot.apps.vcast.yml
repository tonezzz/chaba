title: vcast — Virtual Cast Display
subtitle: Software cast target PWA for testing the cast pipeline without the TV; runs on any browser incl. iPad/iPhone/Linux.
icon: "📺"
sections:
  - title: What it is
    icon: "✅"
    layout: list
    items:
      - label: Virtual cast target
        text: "A fullscreen PWA that plays the payloads the cast pipeline already produces: HLS video (camera/desktop/YouTube-subtitle paths), PNG snapshots, iframed web pages, and audio. Not a Chromecast — it does not speak castv2; it is a parallel last hop inside our own pipeline."
      - label: Screen numbers
        text: "Each paired display gets a stable screen number (Screen #1, #2, ...) assigned by the relay registry, so Ada/HA can be told 'cast to screen 1'. Numbers are unbounded — allocation picks the lowest free; an explicit screen-N claim honors N when free. Convention (2026-09-30): 1-5 = Tony's real devices (iPad, TV-adjacent), 6-9 = lab/automation displays (vcast-real@N on idc02 — real headless Chromium, the {real_screen} target in ada-pi live scenarios, default 6), 10+ = overflow/one-off tests. GEV remote registration keys on (screen, pane), so one GEV can run on many screens simultaneously — gev_command targets by screen."
      - label: Self-pairing QR
        text: "An unpaired display shows a QR code on its own screen. Scanning it with an admin phone opens /apps/vcast/pair.html which claims the display: the relay mints an ada-pi key (screen-N) server-side, burns the redeem URL itself, and pushes the api_key to the waiting display over its pending websocket. Claim is keyless — the relay holds ADA_ADMIN_KEY in ~/.config/secrets/input-bridge.env, so scanning the QR only asks for a confirm tap."
  - title: Architecture
    icon: "⚙️"
    layout: list
    items:
      - label: Receiver page
        text: "stacks/web/public/apps/vcast/index.html — joins the input-bridge WS room, registers with api_key (or shows pairing QR when unpaired), renders play/image/nav/audio/stop messages. Native HLS on iOS Safari, vendored hls.js elsewhere. Screen Wake Lock keeps the display on. mediaUrl() upgrades http: media URLs to https: when the page is served over TLS (mixed-content guard — tony-ha :8123 is HTTPS-only and answers plain HTTP with a 400); image load failures surface as HUD 'image failed' + toast + state:error report. snapFrame() answers snap-request by drawing the visible video/img element into a canvas and POSTing a JPEG to /frame; cross-origin images that taint the canvas are refetched through the relay's /img proxy so the pixels stay readable. Service worker (vcast-vN cache — never apps-*, so the shared /apps/sw.js purge leaves it alone): network-first with cache:'no-cache' revalidation for every same-origin /apps/vcast/ GET — stale-bundle playback is impossible while the relay host is reachable; bump CACHE_NAME on every deploy that touches the app (activate deletes older vcast-* caches), and bump the ?v=N pins on the vendored hls.min.js/qrcode.min.js script tags in lockstep (they cover the pre-SW first load). HLS drop recovery: fatal hls.js errors self-heal — NETWORK_ERROR re-polls the playlist via startLoad(), MEDIA_ERROR -> recoverMediaError() x2 then rebuild, other -> destroy+recreate — bounded backoff 1.5s->15s, reset on 'playing', each retry reported as state hls-retry; the native-Safari path reloads the element on 'error' and on 'ended' for live playlists (duration=Infinity) with the same backoff."
      - label: Relay + registry
        text: "stacks/web/input-bridge/server.mjs — podman quadlet input-bridge.service on idc03, bound to tailnet 100.102.134.91:3010 only (never the public VPS interface; INPUT_BRIDGE_BIND). HTTP: GET /health, GET /displays, GET /pair-info?sid=, POST /pub {screen|room,msg}, POST /claim {sid,name?,force}, POST /dismiss {sid}, POST /release {screen|name} (admin key optional — falls back to ADA_ADMIN_KEY env), POST+GET /frame (display self-snapshots), GET /img?url= (allowlisted image proxy for snapFrame fallback — tailnet/LAN/loopback only), GET+POST /capture (camera capture leases), GET+POST /camwall. WS: room broadcast + register-display; lastCast per room is replayed on re-register so a ws flap doesn't blank the screen. Keyless claim/release/dismiss trusted only from tailnet/loopback (X-Forwarded-For); off-tailnet needs admin_key. Registry persisted at ~/.local/share/input-bridge/displays.json on idc03."
      - label: Key verification
        text: "Register/claim keys are verified server-side against ada-pi-pwa — loopback on the relay host idc03 (ADA_AUTH_URL=http://127.0.0.1:8001). Screen keys are normal ada device keys named screen-N — they appear in the ada-keys-card inventory and revoke disables the display on next register."
      - label: Caddy
        text: "handle_path /api/input-bridge/* in stacks/web/Caddyfile proxies to 100.102.134.91:3010 (idc03 tailnet) — carries /ws plus /pub /displays /claim /pair-info /health. Pages are static under /apps/vcast/ on tony-dell."
  - title: Pairing flow
    icon: "🔗"
    layout: list
    items:
      - label: Unpaired
        text: "Page opens, relay returns {type:pending, sid}; page renders QR for /apps/vcast/pair.html?sid=<sid>."
      - label: Claim
        text: "Phone opens pair.html and taps confirm (no key entry — relay-side ADA_ADMIN_KEY); POSTs /claim. Relay verifies the admin key, POSTs ada /api/auth/keys {name:screen-N}, fetches the redeem URL server-side (allowlisted hosts), extracts api_key from the 302 Location, and pushes {type:paired} to the pending display."
      - label: Re-pair
        text: "POST /claim with force:true revokes the old key and issues a fresh one under the same screen-N name. Revoke from the admin page / ada-keys-card removes the key entirely."
  - title: Message protocol
    icon: "📨"
    layout: list
    items:
      - label: Inbound to display (room vcast-N)
        text: "play {url} (hls or direct video), image {url,interval}, nav {url} (iframe), audio {url}, stop, reload, snap-request {token} (self-capture -> POST /frame), uplink-start {interval} / uplink-stop (getUserMedia frames -> POST /frame token 'cam'). YouTube/Vimeo page URLs are rewritten to embed players by embedUrl()."
      - label: Outbound
        text: "register-display {api_key,label,device_id}, state {state,detail} reports (relay records them in the registry), 30s state heartbeats, POST /frame snapshot uploads, POST /capture lease records, normal room broadcast messages."
      - label: Dev override
        text: "URL params: room=vcast-N joins a room directly without pairing; api_key persists a key into localStorage; ws overrides the WS URL."
  - title: Screen ownership (ACL)
    icon: "🔒"
    layout: list
    items:
      - label: Model
        text: "Every castable screen has an owner: a person.* entity or 'shared'. A speaker may only cast to/from their own screens; shared screens are communal. Unidentified speakers get shared-only. Denials return a speakable 'denied: ... is <name>'s private screen' error."
      - label: TV path (cast-browser, tony-dell :8799)
        text: "Registry ~/.config/cast-browser/screens.json — 'destinations' keyed by media_player.*, 'sources' (seat/omen/tv-desk), 'speaker_aliases' (caller key name → person). Enforced in runCommand: nav targets screenlive*/workspace*/screen:* gate source 'seat', tony-omen:* gates 'omen'; getCastTarget result gates destination. Returns HTTP 403 + denied text. Ada-side pre-check in tool_runner._check_tv_source_owner covers the same sources (rest_command swallows the 403); speaker flows tool_runner→ha_client→rest_command payload field 'speaker'."
      - label: vcast path (Ada tool_runner, idc03)
        text: "Registry ~/.local/share/ada-pi/cast-screens.json — 'screens' {N: person.*|shared}, 'aliases'. Enforced in cast_to_screen before /pub. Default for unlisted screens: shared."
      - label: Current owners
        text: "shared: living-room TV (tony_tv_cast, tony_tv, lg_webos_tv_nano81tsa, tv_40c5000), tv-desk, vcast screen-1 (iPad — flipped to shared 2026-09-28 per Tony's explicit confirmation; speaker-ID was failing to resolve him so owner-lock denied his own casts). person.tony: omen desktop (:0), dell seat (:1). person.kk/person.michael: none yet — assign their vcast screens on pairing."
      - label: Tests
        text: "tests/scenarios-live/vcast_owner_allow.yaml (admin key → person.tony: all pass) + vcast_owner_denied.yaml (non-owner key → anonymous: personal sources/screens deny, shared TV allows). Scenario runner: scripts/scenario-live.py --api-key <issued key>; mint via POST /api/auth/keys."
  - title: Files & deployment
    icon: "📁"
    layout: list
    items:
      - label: Repo
        text: "stacks/web/public/apps/vcast/ (index.html, pair.html, manifest.json, sw.js, vendored hls.min.js + qrcode.min.js, icons), stacks/web/input-bridge/server.mjs, systemd/input-bridge.service."
      - label: Live
        text: "https://tony-dell.taila0626a.ts.net/apps/vcast/ ; web container mounts ~/CascadeProjects/chaba-tony-dell/stacks/web/public — rsync deploys instantly, no restart."
      - label: Service
        text: "systemctl --user status input-bridge.service on idc03 (quadlet; source+unit in stacks/idc03/input-bridge/). The idc01 unit is masked warm-standby; the old tony-dell unit is disabled."
      - label: Known limits
        text: "Not a real Chromecast — castv2/Chrome-cast/AirPlay senders cannot target it. nav-mode iframes cannot pass Tailscale-User-Login-gated pages (same caveat as the VMS cast path). iOS standalone-PWA mic is untrusted (use Safari tab). No auth on /pub beyond tailnet reachability. Snapshots: canvas capture works for video/img (cross-origin img via /img proxy); a nav-mode iframe returns error 'uncapturable-iframe' with the page URL in detail — Ada cannot screenshot arbitrary web pages."
  - title: Cast lane — host topology & single points (audited 2026-10-05)
    icon: "🧭"
    layout: list
    items:
      - label: tony-omen carries cast-browser (SPOF)
        text: "cast-browser.service = persistent headless Chrome + Playwright on :8799 (LAN 0.0.0.0, systemd user unit, source stacks/services/cast-browser/). Ada tv_action calls it DIRECTLY via CAST_BROWSER_URL=http://100.75.102.88:8799 (tailnet). cast-shots-http.service :8090 serves page PNGs the Chromecast fetches; cast-desktop@N.service streams X display :N to HLS (omen has only :0). WebGL pages run on SwiftShader (--enable-unsafe-swiftshader) — the GPU is not actually required, the seat/Chrome-profile is what lives there."
      - label: What degrades when tony-omen is off
        text: "DEAD: Ada tv_action (nav/click/scroll/press/type + shotAndCast PNG-to-TV) — every command fails; HA automation assist_tv_control cast-browser sentences fail; cast-desktop screenlive:/tony-omen: desktop casts; cast-shots-http. DEGRADED-BUT-UP: cast-ha-panel.timer's cast-ha-selected.sh — /tick on 127.0.0.1:8799 fails -> falls back to cast-ha-page.sh one-shot Playwright render on tony-dell (works, loses interactivity). UNAFFECTED: the whole vcast path (input-bridge idc03 + displays + /capture leases + cast_to_screen/cctv_wall), cast-cam camera/play_stream->Chromecast, yt-live-api :8791->HA play_media."
      - label: cast-browser-proxy (tony-dell :8799)
        text: "socat TCP-LISTEN:8799,bind=127.0.0.1,fork -> TCP:192.168.2.86:8799 (omen LAN). Loopback-only — exists for dell-local callers (cast-ha-selected.sh /tick), NOT for Ada (Ada goes direct to the tailnet IP). No /health endpoint on cast-browser — liveness check = any path returning JSON {err:'unknown path'} proves proxy+upstream both alive."
      - label: tv_display camera lane (tony-dell)
        text: "cast-ha-panel.timer (OnActiveSec=2min prime + OnUnitActiveSec=60s self-rearm) -> cast-ha-selected.sh -> tv_display=camera casts input_select.tv_camera via HA camera/play_stream HLS to media_player.tony_tv_cast. Guards: input_boolean.cast_enabled kill switch, camera-unavailable skip, audit-cast.timer 5min host audit (~/.local/bin/audit-cast.sh, log ~/.local/share/cast-audit.log). 2026-10-05 fix: timer previously never fired after reboot — OnUnitActiveSec has no reference until the service runs once; OnActiveSec primes the chain."
      - label: yt-live-api (tony-dell :8791)
        text: "~/.local/bin/yt-live-api.py wraps yt-live.sh: POST /cast {q|url,lang}, POST /stop, GET /status|/health. Downloads+transcodes YouTube to HLS under stacks/web/public/apps/yt-live/, casts via HA media_player/play_media to media_player.tony_tv_cast. No cast-browser/omen dependency. Media cache ~/.cache/yt-live-media (~9.5GB/16 entries at audit)."
      - label: Lease wiring (idc03 input-bridge)
        text: "GET/POST /capture: screen->{source,ch,active,since,by} capture leases — ground truth for 'camera capture running on this screen' (camera_cast_permission gate + _capture_reminder + stale-lease reconcile in ada-pi tool_runner). Ada reaches it via VCAST_API=https://tony-dell.taila0626a.ts.net/api/input-bridge (Caddy -> 100.102.134.91:3010). Verified 2026-10-05: relay healthy, no stale leases after runs."
      - label: Metric (measured 2026-10-05)
        text: "cam cast to first frame on a vcast screen: 0.6s (POST /frame publish + /pub image -> screen state=image, screen 7 vcast-real). TV path warm re-cast <1s (play_stream dispatch is async; receiver already on mediashell). Cold TV wake from receiver-off ~15-20s (Chromecast app launch + HLS buffer — outside the 5s metric but expected)."
  - title: Testing
    icon: "🧪"
    layout: list
    items:
      - label: Smoke
        text: "curl http://100.102.134.91:3010/health (tailnet) ; curl /api/input-bridge/displays ; open /apps/vcast/ in a browser, scan QR, cast via POST /api/input-bridge/pub {screen:1, msg:{type:'play',url:...m3u8}}. Snapshot check: POST /pub {screen:N,msg:{type:'snap-request',token:'<tok>'}} then poll GET /frame?screen=N&token=<tok> for image/jpeg or a JSON error."
      - label: Scenarios
        text: "ada-pi tests/scenarios-live/vcast-*.yaml cover list/cast/stop/unknown-speaker flows via Ada voice. Repo-side checks: stacks/web/input-bridge/vcast-flap-check.mjs (stale-socket race), vcast-cast-check.mjs (full pair->play flow incl. claim timing, capture-lease/interrupt delivery, lastCast reconnect replay, screen-N slot pinning) and vcast-handoff-check.mjs (stale-key 409 -> force claim -> persisted-key reattach — the 2026-10-06 migration failure mode) — all spawn the real server.mjs on loopback with a stubbed ada auth; node <file> exits 0 on pass. Live verify-after-act: gev-cast-verify.mjs casts /apps/gev/ to a connected screen and requires the state reads to prove it rendered — nav+pN:frame-ok in /displays, {screen,pane} remote in /apps/gev-cmd/command/health, displaced-content + pip remediation + /apps/sw.js purge checks; see docs/runbooks/vcast-gev-verify-after-act.md."
config:
  version: 1
  created: "2026-09-25"
  maintainer: tony
  status: active
  deployment: tony-dell (pages/edge) + idc03 (relay/registry)
