title: vcast — Virtual Cast Display
subtitle: Software cast target PWA for testing the cast pipeline without the TV; runs on any browser incl. iPad/iPhone/Linux.
icon: "📺"
sections:
  - title: What it is
    icon: "✅"
    layout: list
    items:
      - label: Virtual cast target
        text: "A fullscreen PWA that plays the payloads the cast pipeline already produces: HLS video (camera/desktop/YouTube-subtitle paths), PNG snapshots, iframed web pages, and audio. Not a Chromecast — it does not speak castv2; it is a parallel last hop inside our own pipeline."
      - label: Screen numbers
        text: "Each paired display gets a stable screen number (Screen #1, #2, ...) assigned by the relay registry, so Ada/HA can be told 'cast to screen 1'."
      - label: Self-pairing QR
        text: "An unpaired display shows a QR code on its own screen. Scanning it with an admin phone opens /apps/vcast/pair.html which claims the display: the relay mints an ada-pi key (screen-N) server-side, burns the redeem URL itself, and pushes the api_key to the waiting display over its pending websocket."
  - title: Architecture
    icon: "⚙️"
    layout: list
    items:
      - label: Receiver page
        text: "stacks/web/public/apps/vcast/index.html — joins the input-bridge WS room, registers with api_key (or shows pairing QR when unpaired), renders play/image/nav/audio/stop messages. Native HLS on iOS Safari, vendored hls.js elsewhere. Screen Wake Lock keeps the display on. mediaUrl() upgrades http: media URLs to https: when the page is served over TLS (mixed-content guard — tony-ha :8123 is HTTPS-only and answers plain HTTP with a 400); image load failures surface as HUD 'image failed' + toast + state:error report. snapFrame() answers snap-request by drawing the visible video/img element into a canvas and POSTing a JPEG to /frame; cross-origin images that taint the canvas are refetched through the relay's /img proxy so the pixels stay readable."
      - label: Relay + registry
        text: "stacks/web/input-bridge/server.mjs — runs on idc01 (INPUT_BRIDGE_BIND=100.74.146.0, port 3010, input-bridge.service). HTTP: GET /health, GET /displays, GET /pair-info?sid=, POST /pub {screen|room,msg}, POST /claim {sid,admin_key?,name?,force}, POST /release, POST /dismiss, POST+GET /frame (display self-snapshots), GET /img?url= (allowlisted image proxy for snapFrame fallback — tailnet/LAN/loopback only), GET+POST /capture (camera capture leases), GET+POST /camwall. WS: room broadcast + register-display; lastCast per room is replayed on re-register so a ws flap doesn't blank the screen. Keyless claim/release/dismiss trusted only from tailnet/loopback (X-Forwarded-For); off-tailnet needs admin_key. Registry persisted at ~/.local/share/input-bridge/displays.json on idc01."
      - label: Key verification
        text: "Register/claim keys are verified server-side against ada-pi-pwa (ADA_AUTH_URL=https://idc01.taila0626a.ts.net) via /api/auth/status. Screen keys are normal ada device keys named screen-N — they appear in the ada-keys-card inventory and revoke disables the display on next register."
      - label: Caddy
        text: "handle_path /api/input-bridge/* -> 100.74.146.0:3010 in stacks/web/Caddyfile carries /ws plus all HTTP endpoints. Pages are static under /apps/vcast/."
  - title: Pairing flow
    icon: "🔗"
    layout: list
    items:
      - label: Unpaired
        text: "Page opens, relay returns {type:pending, sid}; page renders QR for /apps/vcast/pair.html?sid=<sid>."
      - label: Claim
        text: "Phone opens pair.html, enters admin ada key (stored in phone localStorage only), POSTs /claim. Relay verifies the admin key, POSTs ada /api/auth/keys {name:screen-N}, fetches the redeem URL server-side (allowlisted hosts), extracts api_key from the 302 Location, and pushes {type:paired} to the pending display."
      - label: Re-pair
        text: "POST /claim with force:true revokes the old key and issues a fresh one under the same screen-N name. Revoke from the admin page / ada-keys-card removes the key entirely."
  - title: Message protocol
    icon: "📨"
    layout: list
    items:
      - label: Inbound to display (room vcast-N)
        text: "play {url} (hls or direct video), image {url,interval}, nav {url} (iframe), audio {url}, stop, reload, snap-request {token} (self-capture -> POST /frame), uplink-start {interval} / uplink-stop (getUserMedia frames -> POST /frame token 'cam'). YouTube/Vimeo page URLs are rewritten to embed players by embedUrl()."
      - label: Outbound
        text: "register-display {api_key,label,device_id}, state {state,detail} reports (relay records them in the registry), 30s state heartbeats, POST /frame snapshot uploads, POST /capture lease records, normal room broadcast messages."
      - label: Dev override
        text: "URL params: room=vcast-N joins a room directly without pairing; api_key persists a key into localStorage; ws overrides the WS URL."
  - title: Files & deployment
    icon: "📁"
    layout: list
    items:
      - label: Repo
        text: "stacks/web/public/apps/vcast/ (index.html, pair.html, manifest.json, sw.js, vendored hls.min.js + qrcode.min.js, icons), stacks/web/input-bridge/server.mjs, systemd/input-bridge.service."
      - label: Live
        text: "https://tony-dell.taila0626a.ts.net/apps/vcast/ ; web container mounts ~/CascadeProjects/chaba-tony-dell/stacks/web/public — rsync deploys instantly, no restart."
      - label: Service
        text: "systemctl --user status input-bridge.service on idc01 (WorkingDirectory=~/apps/input-bridge)."
      - label: Known limits
        text: "Not a real Chromecast — castv2/Chrome-cast/AirPlay senders cannot target it. nav-mode iframes cannot pass Tailscale-User-Login-gated pages (same caveat as the VMS cast path). iOS standalone-PWA mic is untrusted (use Safari tab). No auth on /pub beyond tailnet reachability. Snapshots: canvas capture works for video/img (cross-origin img via /img proxy); a nav-mode iframe returns error 'uncapturable-iframe' with the page URL in detail — Ada cannot screenshot arbitrary web pages."
  - title: Testing
    icon: "🧪"
    layout: list
    items:
      - label: Smoke
        text: "curl https://tony-dell.taila0626a.ts.net/api/input-bridge/health ; GET /displays ; open /apps/vcast/ in a browser, scan QR, cast via POST /api/input-bridge/pub {screen:1, msg:{type:'play',url:...m3u8}}. Snapshot check: POST /pub {screen:N,msg:{type:'snap-request',token:'t'}} then poll GET /frame?screen=N&token=t for image/jpeg or a JSON error."
      - label: Scenarios
        text: "ada-pi tests/scenarios-live/vcast-*.yaml cover list/cast/stop/unknown-speaker flows via Ada voice."
