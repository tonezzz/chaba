    host: idc03
    observed_at: "2026-10-31T09:30:43+07:00"
    active_units:
      - ada-line-relay.service
      - ada-tg-relay.service
      - ada-tg-relay-kk.service
      - ada-tg-relay-mn.service
      - devnest-tg-relay.service
    listeners:
      - "127.0.0.1:8911"
      - "127.0.0.1:8912"
      - "127.0.0.1:8913"
      - "127.0.0.1:8917"
      - "127.0.0.1:8919"
    secret_values_read: false
  unresolved:
    - >-
      MN bot identity is not reconciled: @KrautMNBot is used in the lane
      and Rika alert records, while @mn_ha_bot appears in Michael onboarding.
    - >-
      MN group outbound policy differs by route: generic ada-tg-relay-mn
