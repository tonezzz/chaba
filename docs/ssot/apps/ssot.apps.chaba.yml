title: Chaba
subtitle: Main chaba application and infrastructure
icon: 🏠
ideas:
- This file is the SSOT for the chaba app.
- Use Yomi to monitor Line converstions and take action.
- Session history moved to docs/sessions/
- Yomi media analysis feature: AI-powered image/video analysis using Gemma 4 models with automatic fallback (31B → 26B on rate limits)
- Media analysis stores full verbose AI response in database, with frontend toggle to show either final clean answer (last paragraph) or full analysis
- Language-matched analysis: Thai prompts for Thai conversations, English for English, with context from surrounding messages (3 before/3 after)
- Thumbnail size: 135px (progressive increases from 60px → 90px → 135px for better visibility)
- Layout stability: Analysis results have min-height and constrained width to prevent layout jumping when toggling views
