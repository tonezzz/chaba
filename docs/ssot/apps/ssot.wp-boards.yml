title: WP Boards — Member Info Surface
subtitle: boards.surf-thailand.com — post types, taxonomy axes, title standard, watchdog topology
version: 1
last_updated: "2026-10-14"

# ssot.wp-boards — WordPress member-info surface (boards.surf-thailand.com)
#
# The public member-facing site for Tony/KK/Nhong. WP owns member-facing
# content only; ops dashboards, provider accounting, and secrets stay in
# MDDB/CMS or internal infra.
site:
  public_base: https://boards.surf-thailand.com/wp
  origin_base: https://boards.h3.gizmo-thailand.com/wp
  # Permalinks: /index.php/%postname%/ — required: the Plesk vhost has no
  # try_files and no PATH_INFO for arbitrary paths, so this is the only
  # structure under which every route (pages, posts, CPT singles+archives,
  # taxonomies) resolves. Public URLs are still clean — idc02 caddy-edge
  # rewrites /wp/<path> internally to /wp/index.php/<path> and 301s
  # WP-emitted /wp/index.php/<path> links back to /wp/<path>; Location
  # headers get boards.h3 -> boards.surf-thailand.com host rewrite
  # (2026-10-14). Caveat: HTML <link>/canonical hrefs still show
  # index.php — clicks land clean via the edge bounce.
  rest_route_style: index.php?rest_route=   # /wp-json/ 404s on the vhost; /wp/wp-json/* is edge-rewritten to index.php and also works
  app_password_env: ~/.config/secrets/wp-boards.env   # WP_SITE_URL/WP_APP_USER/WP_APP_PASSWORD

post_types:
  post:          member posts from LINE asks (wp_post) — free-form human titles
  page:          member pages + private chat tree (/chat/line/*)
  place:         place_report output — hierarchical=false, archive /place/
  trip:          "trip_calendar output — hierarchical: parent=rollup,
                 children=day leaves+flight pages; archive /trip/"
  ops-event:     "heartbeats + anomaly records — publicly_queryable=false,
                 show_in_rest=true (watchers read `modified` anonymously)"
  timeline_block: timeline-block-block plugin CPT — timelines[] JSON in block markup
  attachment:    media library; images attach to trip posts via post_parent
  # chaba-boards plugin CPTs (v0.4.0, integrations/wp-boards/chaba-boards.php) —
  # public + show_in_rest, private-status posts are member-only like /chat/line/*.
  # LIVE since 2026-10-14 — deployed via wp-admin plugin zip upload
  # (update.php?action=upload-plugin + overwrite link; admin creds
  # ~/.config/secrets/boards-surf-thailand-com-wp-admin-credential on omen).
  # v0.2.0 added admin list columns so registered meta displays in wp-admin.
  # v0.3.7 (2026-10-15): repeat_ask CPT + sortable admin list.
  # v0.4.0 (2026-10-15): render_job result-thumb+prompt admin columns + job-card
  # the_content renderer; has_archive for render_job+lesson (/wp/render_job/,
  # /wp/lesson/ member indexes); lessons-due dashboard widget; prompt-assist
  # meta box -> admin-ajax -> existing free Gemini lane (CHABA_LLM_*).
  # Verified 2026-10-14 (KNB-0657 audit follow-up): /wp/v2/plugins reports
  # chaba-boards 0.3.3 active; all 10 CPTs in /wp/v2/types; private sample
  # post per core CPT seeded via REST (ids 266-271) proving the fleet-writer
  # path. The old standalone /tmp/chaba-translate.php is retired — its
  # TH<->EN translation hooks merged into this plugin (xlate CPT +
  # save_post_post Gemini call).
  asset:       "household assets (car, UPS, washer) — meta: model/serial/purchase_date/warranty_until/vendor"
  expense:     "receipt/expense records — meta: amount/currency/vendor/paid_by/receipt_date"
  contact:     "service contacts (plumber, insurance, Honda) — meta: phone/line_id/role"
  reminder:    "member-visible dated reminders — meta: due_date/assignee"
  bench:       "ada-voice benchmark/suite run results — meta: suite/run_id/pass_count/fail_count/duration_s/commit"
  report:      "report/digest publications — meta: report_type/period/source_key"
  xlate:       "member-post translation records (TH<->EN via Gemini, private) — meta: source_post/source_lang/target_lang/engine/status/chars"
  cam:         "camera captures — meta: camera_id/captured_at/kind/stream_url"
  render_job:  "local/cloud render requests, image AND video in ONE CPT —
               kind=image|video discriminates. Shared: prompt/model/duration_s
               (wall-clock render time)/host/backend/status/requested_by/
               source/output_url/rating/error. Image: negative_prompt/
               model_file/size_px/steps/sampler/cfg_scale/seed/vae_s.
               Video: secs (clip len)/aspect/res/ref_url/operation/
               est_cost_usd/parent_job/chain_index (Veo extend chains).
               est_cost_usd is a published-price estimate, not invoice truth."
  news:        "news feed items + distilled digests — hierarchical: digest
             parents own raw source items as children; has_archive +
             category/post_tag — meta: source_feed/source_url/published_at"
  repeat_ask:  "repeat-ask register mirror (docs/ssot/ssot.repeat-asks.yml) —
             counted recurrences of Tony's requests, slug ra-<topic-id>,
             meta: topic/count/last_repeat/status; admin list defaults to
             last_repeat desc, Asked/Last-repeat columns sortable (v0.3.7)"
  lesson:      "Tony's education ledger — knowledge he asked for, filed by
             agents via scripts/lesson-add.py (slug lesson-<md5>, upsert on
             re-ask). meta: topic/level(intro|working|deep)/source/
             learned_at/next_review/status — next_review feeds spaced-recall
             digests (v0.3.8)"

taxonomy_axes:
  category: "broad topic axis — curated, hierarchical. News desks live
            2026-10-14: thailand{bangkok,east,provinces} world tech
            finance{gold,markets} disaster{flood,weather} family-news (ids 9-21)
            + synthesis (34) marks distilled digest parents (vs raw items)"
  post_tag: "person axis (tony|kk|nhong) + fine keywords (krabi, southafrica).
            News items: source (bangkokpost, thethaiger, khaosod, google-news),
            lang (en|th), geo (bang-phli, rayong). Digests add:
            digest, sources:N (coverage breadth)"
  rule: one type axis = the CPT itself; never duplicate type as a tag
        (place-report/trip tags retired 2026-10-14)

title_standard:
  # Machine-generated content carries a "<Kind> — <name>" prefix so mixed
  # feeds (tag archives, REST lists) stay self-describing. Member-authored
  # posts keep free-form titles — do not prefix them.
  post:        free-form (member voice)
  place:       "Place — {name}"
  trip:        "Trip — {title}"           # children: "{Trip} — day {i} {date}"
  ops-event:   "ops-{host} (heartbeats) | ⚠ {code} {chat_id} (anomalies)"
  timeline_block: "Timeline — {lane}"
  asset:       "Asset — {name}"
  expense:     "Expense — {vendor} {date}"
  contact:     "Contact — {name}"
  reminder:    "Reminder — {title}"
  bench:       "Bench — {suite} {run_id}"
  report:      "Report — {title}"
  xlate:       "Xlate — {source_title} ({src}→{dst})"
  cam:         "Cam — {camera_id} {captured_at}"
  render_job:  "Render — {prompt-short} {date}"
  news:        "free-form (feed titles) | syndicated: '{Feed} — {title}'"
  repeat_ask:  free-form (topic text from register)
  pages:       bare names (Tony, KK, Chat, Line, Ops)

writers:
  wp_post:        post  + person tag            # LINE "ลงเว็บ/เว็บบอร์ด" asks
  place_report:   place + person tag            # maps links / place names
  trip_calendar:  trip parent+children + person # --public flag
  line-chat-timeline.py: timeline_block rebuilds (journal+ops-events)
  render_job:     "OPS-0658 local_image lane / manual — one record per render
                  (first: id 117, sdxl-lightning test 2026-10-14). Video:
                  ada_render_video auto-writes kind=video records
                  (ada-render-job-wp-log); image lane can follow same path."
  news_fetch:     "scripts/ada/news-fetch.py + news-feeds.json on idc03 —
                  wp-news-fetch.timer hourly; RSS/Atom -> news CPT, dedup by
                  slug n-<md5(link)> via ?slug= lookup (no local ledger).
                  Categories/tags mapped per feed; flood Google-News queries
                  land under disaster>flood + thailand region cats.
                  Archive: /wp/news/ (live 2026-10-14, ~120 seeded items)"
  repeat_ask_sync: "scripts/sync-repeat-asks.py on idc03 —
                  chaba-repeat-asks-sync.timer every 15min; reads
                  ssot.repeat-asks.yml, upserts private repeat_ask posts by
                  slug ra-<id>; content = full history table so the WP post
                  shows the recurrence trend itself"
  news_digest:    "scripts/ada/news-digest.py on idc03 — wp-news-digest.timer
                  at :20 hourly (after fetch). Embedding clusters
                  (ollama-nomic-embed via LiteLLM, free/local) over titles,
                  cosine 0.85 union-find; gemini-3.5-flash-lite writes
                  topic/brief/coverage-diffs JSON per multi-source cluster;
                  parent post 'Digest — {topic}' gets synthesis cat +
                  digest/sources:N tags, members reparented via post_parent.
                  Digest list: /wp/category/synthesis/"
  # Writer access caveat (2026-10-14): POSTs through the PUBLIC edge
  # (boards.surf-thailand.com) hit CF 1010 bot-check on bare/script UAs —
  # fleet writers use origin_base (boards.h3.gizmo-thailand.com) directly.

privacy:
  private_pages: /chat/line/* + /chat/ops — require editor login to view
  caveat: media files under wp-content/uploads/ are public-by-URL even on
          private pages (WP serves the file, not the page). True media
          privacy needs a protected-downloads plugin — not installed.

watchdog:
  # monitor does the work on idc03; watcher verifies from idc02; alert
  # path must not depend on the watched component (board-api via
  # ssh tony-dell, not a WP write).
  heartbeat: idc03 wp-heartbeat.timer -> POST ops-event heartbeat-idc03 (5min)
  watcher:   idc02 wp-watch.timer -> WP 200 + heartbeat<10min -> board-api comment
  trigger:   line-chat-timeline.path (PathChanged glob on journals +
             ops-events.jsonl) -> near-real-time timeline updates

static_site:
  # www.surf-thailand.com/<tenant>/ — static HTML rendered from
  # ada-cms-pages[-tenant] docs carrying meta.public by
  # scripts/ada/cms-publish-site.py (idc02 caddy-edge webroot).
  status: dormant
  # Dormant since 2026-10-14 (KNB-0657): member-facing content lives on
  # boards WP now; 0 public-flagged docs remain in ada-cms-pages(-kk) and
  # stale trip/place/post copies were superseded with moved_to links.
  # The script is kept — re-enable by setting meta.public on a page and
  # running cms-publish-site.py --tenant <lane>. Webroot retains only
  # per-tenant index + kk-ha/moved-to-boards.html redirect notice.

assessed_plugins:
  fluentboards:
    assessed: "2026-10-14"
    verdict: viable-member-kanban
    what: >-
      WP-native kanban/project-management plugin by WPManageNinja
      (FluentCRM/FluentForms vendor). Own fbs_* tables (NOT posts/CPTs),
      Vue 3 SPA in wp-admin, REST API + MCP module. GPLv2 via wp.org SVN;
      source development is private — GitHub only hosts dev-docs +
      community MCP servers. v2.2.1, actively maintained (2026-10).
    free_tier: >-
      Kanban + list views, unlimited boards/tasks/members, labels,
      comments, multi-stage. Includes public READ-ONLY board embed:
      [fluent_board_public id=N] shortcode + GET-only
      /public/boards/{id} routes gated by signed HMAC public_token
      (revocable per-board salt) — logged-out visitors can view.
    pro_tier: >-
      Frontend portal (member write without wp-admin), subtasks/groups,
      attachments (fbs_time_tracks, chunked), custom fields, task deps,
      recurring, board roles, webhooks in+out, Trello/Asana/CSV import,
      time tracking, calendar/table views, cloud storage, FluentRoadmap
      add-on, extra MCP abilities.
    fit:
      member_kanban: >-
        YES — the only sane path to a KK/Nhong-visible task board on the
        WP surface. Free tier already gives a public read-only board
        (e.g. "household board" embed); write access needs Pro frontend
        portal + per-member accounts.
      ops_kanban: >-
        NO — does not replace the chaba kanban: no git/SSOT backing, no
        dispatch model, no single-writer story. If used, treat as a
        member-facing view; keep ops cards in SSOT.
      agent_write: >-
        REST API + WP app passwords (wp-boards.env pattern) work for
        agent writes; a chaba-card -> FB-task sync shim is feasible.
        Pro adds an MCP module + community fluent-boards-mcp-server
        (danieliser) exists.
    caveats:
      - "vhost: public-token GET routes ride index.php?rest_route= — compatible with the Plesk permalink quirk."
      - "attachments: plugin protects uploads/fluent-boards via .htaccess — our vhost doesn't honor it; needs an edge deny rule (same caveat as uploads privacy in general)."
      - "separate data store: watchdogs/watchers can't see FB tasks via wp/v2 — they'd need FB REST."
    recommendation: >-
      Adopt only if a member-writable (or public-read) kanban is wanted
      on boards.surf-thailand.com. Read-only embed is zero-cost today.
      Otherwise stay on chaba-boards CPTs + chaba kanban.
