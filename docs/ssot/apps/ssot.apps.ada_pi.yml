title: Ada Pi
subtitle: iPad/iPhone PWA for full-duplex Gemini Live voice with Ada
icon: 🤖
sections:
  - title: Core Features
    icon: "✅"
    layout: list
    items:
      - label: iPad/iPhone PWA
        text: Responsive full-screen Progressive Web App with PWA manifest, animated Ada face, and touch controls.
      - label: Full-duplex Gemini Live voice
        text: Captures microphone audio at 16 kHz, streams PCM16 to the backend, and plays 24 kHz Gemini audio responses.
      - label: Server-side credentials
        text: Gemini API key and optional Home Assistant token stay on the server, not in the browser.
  - title: Technical Architecture
    icon: "⚙️"
    layout: list
    items:
      - label: chaba/stacks/web/public/apps/ada-pi/
        text: Static PWA files (index.html, app.js, manifest.json, static assets).
      - label: chaba/stacks/web/Caddyfile.tony-omen
        text: Caddy vhost for tony-omen exposing /apps/ada_pi/ on port 8082.
      - label: /home/tony/CascadeProjects/ada-pi/pwa_server.py
        text: FastAPI backend that re-uses backend/realtime_provider for Gemini Live.
      - label: /home/tony/.config/systemd/user/ada-pi-pwa.service
        text: User systemd unit running uvicorn on port 8000.
      - label: /home/tony/.config/systemd/user/caddy-tony-omen.service
        text: User systemd unit running Caddy with Caddyfile.tony-omen.
  - title: Deployment
    icon: "🚀"
    layout: list
    items:
      - label: Live services running pwa_server.py
        text: "ada-pi-pwa on idc01 :8001 (loopback, tailnet-only via tailscale serve at the idc01 root — moved from tony-dell 2026-09-23), chaba-guest on tony-dell :8014 (CHABA_MEMORY guest mode, LAN :8126 via Caddy XFF), ada-ha-tony on mn01 :8002 and ada-ha-michael on mn01 :8003 (behind /apps/ha/ada-*/ on the tailnet; idc01 also runs copies)."
      - label: Tailnet URLs
        text: "https://idc01.taila0626a.ts.net/ (standalone PWA, tailnet only), https://mn01.taila0626a.ts.net/apps/ha/ada-tony/ and …/ada-michael/."
      - label: Registry
        text: Listed in docs/ssot/apps/ssot.apps.yml.
  - title: Frontend surfaces — retirement audit (2026-09-23)
    icon: "🧭"
    layout: list
    items:
      - label: Decision
        text: "ada-ha-native-primary-ui (ssot.technical-decisions.yml): HA is the primary user-facing Ada UI; standalone frontends retire in stages. Backend API/WS routes stay — the HA cards and internal tools use them."
      - label: "pwa/ root + app.js (voice PWA)"
        text: "Served by every pwa_server instance at /. Only remaining launcher is the ada-keys-card Voice popup (redeem link lands on /redeem/{token} then redirects to the PWA root with the raw key). Redundant with custom:ada-voice-card."
      - label: "pwa/chat/"
        text: "Ada text chat. Still launched by the ada-keys-card Text popup (ui=chat redeem). No HA-native text chat exists yet — keep until one does."
      - label: "pwa/cms/"
        text: "CMS pages browser. Consumed by the chaba-admin ada-pages iframe tab (cms-viewer key passed in the URL query). Retirement candidate — remove the tab when a native CMS surface exists or the feature is dropped."
      - label: "pwa/guest/"
        text: "Chaba guest page (register → voice clip → guest chat). Served by chaba-guest :8014 on LAN :8126 via the gate QR flow. KEEP — this is the guest surface, not a miniapp duplicate."
      - label: pwa/enroll.html
        text: "Standalone speaker-enrollment page. No internal links; apps index points at idc01/enroll.html (host currently unreachable). Guest enrollment goes through guest.js instead — likely obsolete, confirm before removal."
      - label: manifest.json
        text: "PWA install metadata for the standalone app — dies with the root mount."
      - label: "/redeem/{token}"
        text: "One-time redeem → session cookie + 302 to dest/ with the raw key in the query string. Still needed for QR pairing of non-HA consumers (guest chat key, cms-viewer) and headless keys; HA-native browsers self-mint via script.ada_voice_key and never touch it."
      - label: "Static /apps/ada-pi/ (dash) snapshot"
        text: "stacks/web/public/apps/ada-pi/ is a frozen static copy served by Caddy file_server — no WS/API proxying, so it's a broken shell. Pure cleanup candidate."
      - label: "LAN exposure — resolved 2026-09-23"
        text: "ada-pi-pwa previously bound 0.0.0.0:8001 on tony-dell (full PWA on plain-HTTP LAN). Service moved to idc01 (loopback + tailnet-only serve); the tony-dell unit is stopped+disabled."
      - label: "Backend routes that must stay"
        text: "/ws, /api/auth/*, /api/chaba/*, /api/home-assistant/*, /api/speakers/*, /api/memory/*, /api/decision/*, /api/documents/*, /api/tools/*, /api/chat/transcript, /api/cms/* (until cms tab retires), /api/health."
  - title: Testing
    icon: "🧪"
    layout: list
    items:
      - label: unit
        text: "tests/ in ada-pi — unittest discover (no pytest dep). Memory/tool tests use AsyncMock MDDB; session-config tests assert the live Gemini config."
      - label: offline scenarios
        text: "tests/scenarios/*.yaml — declarative seed+steps+expect files run by tests/scenario_engine.py against ToolRunner with an in-memory FakeMddb (keyword-overlap vector stand-in). Covers recall, confirmed writes, supersede, draft visibility, access control, query expansion."
      - label: live scenarios
        text: "tests/scenarios-live/*.yaml — scripts/scenario-live.py replays user text turns over /ws with an api_key query param and asserts on tool_call/tool_result trace events + transcripts (calls_any/result_contains/response_contains). Verified live on ada-ha-michael :8003 2026-09-22."
      - label: end-to-end
        text: Open https://tony-omen.taila0626a.ts.net/apps/ada_pi/ on iPad/iPhone, tap Connect, and speak.
  - title: Known Issues
    icon: "⚠️"
    layout: list
    items:
      - label: TCP 3009 dropped
        text: The tailscale 443 reset removed the previous TCP 3009 listener; it can be re-added if still needed.
      - label: rview not migrated
        text: The old /apps/rview 443 mapping is gone; rview can be fixed separately later.
  - title: RK600-07B Data Logger + RK900 Weather Sensor
    icon: "WX"
    layout: list
    items:
      - label: Device
        text: "Rika RK600-07B data logger on Xiaomi_A654 at 192.168.31.148, MAC 0C:CF:89:A6:16:FD; connected sensor head is Rika RK900"
      - label: Protocol
        text: "Modbus TCP port 502 (unit 1, holding registers); binary device console on port 23"
      - label: Modbus register map
        text: "0 = wind direction (°), 1 = wind speed (0.01 kn), 2 = temperature (0.1 °C), 3 = humidity (0.1 %); pressure/rainfall not installed"
      - label: HA entities
        text: "sensor.rk600_* are the RK900 sensor readings exposed by the RK600-07B data logger (wind, direction, temperature, humidity, status)"
      - label: Ada Pi tool
        text: "get_rk600_weather in backend/realtime_provider.py returns the local RK900 weather via the RK600-07B logger"
      - label: Data source
        text: "ada-pi reads sensor.rk600_* from the configured Home Assistant instance (HOME_ASSISTANT_URL)"
      - label: SSOT registry
        text: "Documented in ssot.mac-address-registry.michael.yml as michael-rk600-weather and ssot.ip-address-registry.michael.yml on the michael-xiaomi-192.168.31.0-24 network"
