title: RView Live
subtitle: Real-time voice and text interaction with Gemini function-calling to drive RView
icon: 🎙️

ideas:
- RView Live runs on tony-dell at /apps/rview-live/.
- It opens a WebSocket to a Gemini Live server, streams microphone PCM audio, and plays model audio responses.
- It can send text prompts and receive tool-call events.
- It embeds RView in an iframe and polls /apps/rview/api/state.php for view status.

sections:
  - title: Core Features
    icon: ✅
    layout: list
    items:
      - label: Tabbed controls
        text: "Live, RView, and Settings tabs isolate each control surface."
      - label: Voice streaming
        text: "Captures browser microphone at 16kHz PCM, base64-encodes Int16 samples, and sends them over WebSocket to the Gemini Live server."
      - label: Audio playback
        text: "Receives base64 Int16 audio from the model, queues it, and plays it through a ScriptProcessorNode at 24kHz."
      - label: Text chat
        text: "Allows typing messages and sending them as text turns over the same WebSocket."
      - label: Tool calling
        text: "Displays tool-call events returned by the model so functions can drive RView or other downstream actions."
      - label: RView integration
        text: "Loads /apps/rview/index.html in an iframe and polls /apps/rview/api/state.php for the current view state."

  - title: Technical Architecture
    icon: ⚙️
    layout: list
    items:
      - label: WebSocket endpoint
        text: "'/api/rview-live/ws' in production, 'ws://localhost:3002/ws' on localhost."
      - label: Audio pipeline
        text: "getUserMedia -> AudioContext (16kHz) -> ScriptProcessorNode -> Int16 base64 -> WebSocket."
      - label: RView state API
        text: "'/apps/rview/api/state.php?action=status&view_id=<view>' on Caddy; proxied to a Python state server on tony-dell."
      - label: Message types
        text: "'audio', 'text', 'server-content', 'tool-call', 'error', 'status'."

  - title: Files & Modules
    icon: 📁
    layout: list
    items:
      - label: chaba-tony-dell/stacks/web/public/apps/rview-live/index.html
        text: "The single-page client for RView Live."
      - label: chaba-tony-dell/stacks/web/public/apps/rview/index.html
        text: "The remote view client embedded in an iframe."
      - label: chaba-tony-dell/scripts/rview-state-server.py
        text: "Python HTTP state API for RView."

  - title: Deployment
    icon: 🚀
    layout: list
    items:
      - label: Location
        text: "chaba-tony-dell/stacks/web/public/apps/rview-live/index.html"
      - label: URLs
        text: "http://tony-dell.local:8080/apps/rview-live/"
      - label: State server
        text: "scripts/rview-state-server.py runs on tony-dell port 3007 and is proxied by Caddy at /apps/rview/api/*."
      - label: Registry
        text: "Listed in chaba-tony-dell/stacks/web/public/apps/apps.yml."
      - label: Branch
        text: "chaba-tony-dell master"

  - title: Testing
    icon: 🧪
    layout: list
    items:
      - label: Local development
        text: "Open the tony-dell page at http://tony-dell.local:8080/apps/rview-live/; the WebSocket uses wss://tony-omen:3002/ws."
      - label: Production
        text: "The page is served by Caddy on tony-dell port 8080. The WebSocket must be reachable from the browser."
      - label: Audio permissions
        text: "Requires browser microphone permission. Use a secure or localhost origin."

  - title: Integration
    icon: 🔗
    layout: list
    items:
      - label: RView
        text: "The RView tab embeds RView and refreshes its status every 2 seconds."
      - label: Gemini Live server
        text: "Expects a WebSocket server implementing the 'audio', 'text', 'server-content', 'tool-call', and 'status' protocol."

  - title: Known Issues
    icon: ⚠️
    layout: list
    items:
      - label: WebSocket origin
        text: "If the page is opened from a file:// origin, WebSocket and mediaDevices may fail. Serve it from an http/https origin."
      - label: Audio context
        text: "Browsers may block AudioContext until the user interacts with the page. The Start button should satisfy this."

