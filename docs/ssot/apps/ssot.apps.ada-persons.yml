title: Ada Person Registry & Lifecycle Standard
subtitle: One declaration per known human — identity bindings, banks, control, persona — rendered into memory-banks.json
icon: account-group
version: 1
last_updated: "2026-10-09"

overview:
  purpose: |
    Ada must know WHO is speaking and shape memory, abilities, and manner
    per person — not per session. This file is the canonical registry:
    each person declares every alias that can resolve to them (voiceprint
    entity, HA person, chaba/devin user keys), their bank allowlist and
    private bank, their HA control domains, persona overrides, and the
    bank-doc that holds learned preferences/habits.

    Rendered into ADA_MEMORY_BANKS_FILE (memory-banks.json) at deploy —
    the persons: block compiles to person_policies + control_policies +
    a new 'persons' runtime block. Ada-pi resolves speaker entity →
    person → policy + persona in one hop.
  why_a_registry: |
    Today the same person appears as 3-4 aliases (testo / person.testo_2 /
    user-testo) and persona knobs are global — KK can't be formal-Thai
    while Tony is direct-English. One declaration per human fixes both:
    aliases collapse to a person, persona overrides attach to the person.

  layers:
    - identify: speaker_id voiceprint / device key / HA login → person_entity
    - resolve: person_entity → persons.<key> (alias map below)
    - gate: banks_read/bank_write/control from the person, not the alias
    - shape: persona overrides applied to session instructions
    - learn: habits land in prefs_doc inside the person's private bank
    - audit: memory-standard bars + person coverage check

# ------------------------------------------------------------------
# The registry. Every human Ada should know by name is an entry here.
# Wildcard keys: default (named-but-unlisted), unknown (no identity).
persons:
  tony:
    label: Tony
    role: admin
    aliases: [person.tony, admin, tony-ip, user-tonezzzz, user-tony2, tg-tony,
              user-ha-mcp-server, ha-03e85ebb, ha-4d0e0dee, ha-bf66722a,
              ha-testdebug001]
    banks_read: [all]
    bank_write: personal
    control: {domains: [full]}
    persona: {language: auto, tone: direct, verbosity: brief,
              formality: casual, proactiveness: proactive}
    prefs_doc: person/tony/prefs

  kk:
    label: KK
    role: resident
    aliases: [person.kk, user-kk, tg-kk, ha-834e7b81]
    banks_read: [general, home, people, purchase, personal-kk]
    bank_write: personal-kk
    control: {domains: [light, switch, input_boolean, script, media_player]}
    persona: {language: auto, tone: warm, verbosity: normal,
              formality: polite, proactiveness: normal}
    prefs_doc: person/kk/prefs
    tools:
      # Per-persona tool profile (card persona-tool-profiles). Rendered by
      # scripts/ada/render-tool-profiles.py into a managed block of
      # ~/.config/secrets/<env_file> on <host> at deploy; see
      # tool_profiles: below for the field semantics. Keep-list only —
      # every declared tool NOT under include: is stripped.
      instance: kk
      env_file: ada-kk.env
      host: idc03
      include:
        - ada_memory_search
        - ada_remember
        - ada_forget
        - ada_session_recall
        - cms_read
        - cms_publish_page
        - cms_edit
        - chat_send
        - web_search
        - ada_persona
        - speaker_profiles
        - voice_fx
        - set_facial_expression
        # card lists capture_frame — merged into vcast_snapshot (its
        # declared seat; capture_frame lives on as a runner alias)
        - vcast_snapshot
        - vcast_gesture
        - ada_market_quote
        - ada_render_video
      exclude:
        # Explicit drop-list — Tony-lane lures + cross-lane data leak
        # (Tony calendar/tasks on a member-tier session). Rendered as
        # ADA_EXCLUDED_TOOLS alongside the allowlist; the deploy lint
        # warns on any declared tool in NEITHER list, so merges/renames
        # force a decision here instead of slipping through.
        - calendar_read
        - calendar_write
        - plan_day
        - tasks
        - ada_resolve_action
        - devin
        - devin_read
        - kanban
        - docs
        - drive
        - yt
        - cast_to_screen
        - cctv_wall
        - tv_action
        - gev_command
        - control_entity
        - get_home_state
        - home_search
        - home_status
        - home_history
        - ha_confidence
        - get_rk600_weather
        - ada_camera_snapshot
        - ada_look
        - ada_track_device
        - ada_member_keys
        - ada_device_acl
        - ada_enroll_speaker
        - ada_ops
        - percussion

  testo:
    label: Testo
    role: user
    aliases: [testo, person.testo_2, user-testo]
    banks_read: [general, home, people, purchase, personal-testo]
    bank_write: personal-testo
    control: {domains: [light, switch, input_boolean, script, media_player]}
    persona: {language: auto, tone: direct, verbosity: normal,
              formality: polite}
    prefs_doc: person/testo/prefs

  nhong:
    label: Mr. Nhong
    role: resident
    aliases: [person.nhong, user-nhong, tg-nhong]
    banks_read: [general, home, people, personal-nhong]
    bank_write: personal-nhong
    control: {domains: [light, switch, input_boolean, script, media_player]}
    persona: {language: auto, tone: warm, verbosity: normal,
              formality: polite, proactiveness: minimal}
    prefs_doc: person/nhong/prefs
    node: kk-ha          # member user (system-users) on kk-ha; created 2026-10-09

  guest:
    label: Guest
    role: guest
    aliases: [person.guest]
    banks_read: [general, home]
    bank_write: null            # guests never write memory
    control: {domains: [light, media_player]}   # safe demo subset
    persona: {language: auto, tone: warm, verbosity: normal,
              formality: polite, proactiveness: minimal}
    prefs_doc: null             # no long-term learning for guests

  # fallbacks — not persons, behavior presets
  default:
    label: null
    role: restricted
    banks_read: [general, home, people, purchase]
    bank_write: null
    control: {domains: [light, switch, input_boolean, script, media_player]}
    persona: {tone: direct, formality: polite}
  unknown:
    label: null
    role: anonymous
    banks_read: [general, home]
    bank_write: null
    control: {domains: [light]}
    persona: {tone: warm, formality: polite, proactiveness: minimal}

tool_profiles:
  description: |
    Per-persona tool surface (card persona-tool-profiles, 2026-10-11).
    persons.<key>.tools declares which Gemini Live declarations that
    person's dedicated instance may offer. ADA_EXCLUDED_TOOLS alone is a
    denylist that rots — tool merges rename and add names faster than the
    list gets re-audited (home_search slipped onto ada-kk 2026-10-11
    while the env still named pre-merge ada_ha_* tools). The keep-list
    cannot grow silently: a merged-in tool is stripped by default until
    someone deliberately adds it here.
  fields:
    instance: ADA_INSTANCE_ID the profile applies to (the person's dedicated backend)
    env_file: basename under ~/.config/secrets/ on the host (default ada-<instance>.env)
    host: deploy host that runs the instance (render-tool-profiles.py --host)
    include: tools the persona KEEPS — renders ADA_INCLUDED_TOOLS (allowlist; all else stripped)
    exclude: tools deliberately dropped — renders ADA_EXCLUDED_TOOLS too, and completes lint coverage
  render: |
    scripts/ada/render-tool-profiles.py merges a managed block
    (>>> chaba-rendered: ada-tool-profile … <<<) into the env file —
    ADA_INCLUDED_TOOLS when include: is non-empty, ADA_EXCLUDED_TOOLS
    when exclude: is non-empty. deploy-ada.sh applies profiles whose
    host: matches the deploy target and restarts when the block drifts.
  lint: |
    A deploy-time warning (render-tool-profiles.py --lint, also run
    inside --apply): for every profiled instance, any tool DECLARED in
    ada-pi's surface (scripts/tool-lint.py collect_surface — builtins +
    tools.d) that sits in NEITHER include: nor exclude: is uncovered —
    a merge/rename slipped past the profile. Names that resolve only
    through the runner alias table are accepted (they name a declared
    seat). Unknown names in either list warn as stale.
  rules:
    - "A profile belongs on the person, not the shared prod instances —
      ada-ha-tony/ada-ha-michael/ada-dev serve mixed speakers and keep
      the full surface."
    - "include: and exclude: may coexist: include wins at runtime
      (intersection), exclude documents the decision for the lint."
    - "Renamed tools list their DECLARED seat (e.g. capture_frame ->
      vcast_snapshot); absorbed names stay reachable as runner aliases."
    - "Env edits are staged, not live: the managed block applies on the
      next service restart (deploy-ada.sh restarts on drift)."

features:
  description: |
    Feature switches Ada consults per session — the debug/interrogation
    surface. Global defaults here; a person may override any flag under
    persons.<key>.features. Live state lives in MDDB doc
    ada-config/feature-flags (ada_debug tool writes it; sessions read
    with short TTL) — toggling never needs a restart. This block is the
    DECLARED default; the MDDB doc is the LIVE override.
  flags:
    awareness:      # resolve speaker identity → person at session start
      default: true
      note: off = everyone runs as 'unknown' — the sandbox state
    persona:        # apply per-person tone/language/verbosity overrides
      default: true
    memory_read:    # bank recall in context
      default: true
    memory_write:   # ada_remember + auto-extract writes
      default: true
    recall_gate:    # relevance gate before injecting memory (0.6/60s)
      default: true
    vocab_coaching: # word-recast + glossary logging
      default: true
    confirm_gate:   # confirmation required for actuation/writes
      default: true
      note: NEVER default-off in prod — debugging only, owner turns
    jev_advisory:   # jev-student pre-check on tool calls
      default: true
    speaker_enroll: # offer enrollment to unrecognized speakers
      default: true
  override_example: |
    persons:
      kk:
        features: {vocab_coaching: false}   # quiet mode for her

lifecycle:
  description: |
    Standard procedure for a person in the system. Steps 1-3 are the
    enrollment ritual; 4-5 are continuous; 6 is the audit that keeps
    it honest.
  steps:
    - enroll: |
        Voice path: ada_enroll_speaker binds voiceprint → person_entity.
        Device path: key-issued event binds a device/login identity.
        Creates the person_entity alias; the person may not exist in
        persons: yet — they run on 'default' until declared.
    - declare: |
        Edit this file: add persons.<key> with every alias observed in
        ada-events (key-issued, speaker-enrolled, transcript identity).
        Render memory-banks.json and deploy. Private bank convention:
        personal-<key> with mddb_collection ada-ha-bank-personal-<key>,
        instances: [tony] (or per-household).
    - verify: |
        ≥3 voiceprints within the first week (auto_learn supplies them);
        banks_for_person returns the declared set; cross-bank recall
        probe shows no leaks.
    - learn: |
        Preferences/habits accumulate as docs in the person's bank —
        structured prefs_doc (person/<key>/prefs) for stable traits
        (language, units, routines), vocab kind for word coaching,
        ordinary facts as memory docs. Ada reads prefs_doc at session
        start when the speaker resolves.
    - evolve: |
        Persona knobs tune per-person register over time (KK: warm+polite;
        Tony: direct+brief). Habit docs accumulate; quarterly review
        decides promote (habit → routine Ada anticipates) or prune.
    - audit: |
        memory-standard bars still govern (cross_speaker_leaks=0,
        min_prints_after_week, voiceprint_drift events). NEW bar:
        person_coverage — every speaker entity seen in ada-events in
        the last 30d must resolve to a persons entry or 'default'.

open_questions:
  - "persona overrides need the ada-pi hook — session instructions
    currently compose globally; per-person tone/language/verbosity is
    the code change this registry enables (card ada-person-registry)."
  - "role admin persons (only tony today) may read bank_write personal
    AND reach others' banks for maintenance — admin is the exception,
    not a pattern."

