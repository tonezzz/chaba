title: God’s Eye View (GEV)
subtitle: Real-time voice-controlled map/3D view using a Gemini Live WebSocket bridge.
icon: "👁️"
sections:
  - title: Core Features
    icon: "✅"
    layout: list
    items:
      - label: Push-to-talk voice control
        text: Click the mic to start, speak a command, click again to end the turn; model receives the audio and returns a spoken response.
      - label: Gemini Live 2-way audio
        text: Browser sends 16 kHz PCM16 mic audio to the bridge; the bridge forwards model_turn audio as binary ws frames (24 kHz PCM16) and the page plays them via playGeminiAudio on a 24 kHz AudioContext.
      - label: GEV tool calling
        text: Gemini can invoke GEV tools such as fly_to_location, set_layer, and camera motion; results are returned to the model.
      - label: Live status and transcripts
        text: Console [GEV] logging and on-panel status show connection, function calls, text, and done/idle states.
  - title: Technical Architecture
    icon: "⚙️"
    layout: list
    items:
      - label: Static bundle
        text: Served from /home/tony/.config/caddy/public/apps/gev/ as index.html + versioned JS/CSS assets.
      - label: gev-gemini bridge
        text: Containerized service on tony-dell port 8789; opens a Gemini Live session and proxies audio/text/function calls between the browser and Google.
      - label: Caddy routing
        text: /apps/gev-live/* reverse-proxies to 127.0.0.1:8789.
      - label: Google Maps integration
        text: index.html loads the Maps JS API using __GOOGLE_MAPS_API_KEY__ for fly_to_location geocoding.
  - title: Files & Modules
    icon: "📁"
    layout: list
    items:
      - label: index.html
        text: App shell and loader; injects the Google Maps API key.
      - label: index-Bd5DfCi5.js
        text: Minified production bundle + post-build patches in place (api/models prefixes, msaaSamples iOS guard, voice playback, honest-fail). Patches are codified + idempotent — scripts/gev/patch-gev-dist.sh (dist pipeline) and stacks/web/scripts/gev-patch-dist.mjs (voice patches); rerun after every upstream rebuild.
      - label: bridge.py
        text: Gemini Live WebSocket proxy inside the gev-gemini container; forwards model_turn inline_data audio to the client as binary ws frames (24 kHz PCM16) alongside JSON control frames.
      - label: tools.json
        text: 31 function declarations sent to Gemini during setup (includes play_tour/stop_tour/tour_status).
      - label: tours/
        text: "Data-driven flyover tours: tours/index.json manifest + <id>.json definitions (ordered waypoint stops, dwellS, narration, annotate); flagship london-icons. Player at tours/player.js — see docs/ssot/jobs/gev/2026-10-06-gev-tour-format.yml."
      - label: Caddyfile.tony-dell
        text: Reverse proxy and static file routes for /apps/gev and /apps/gev-live.
  - title: Deployment
    icon: "🚀"
    layout: list
    items:
      - label: Location
        text: /home/tony/.config/caddy/public/apps/gev/ and the gev-gemini container on tony-dell.
      - label: URLs
        text: "https://tony-dell.taila0626a.ts.net/apps/gev/"
      - label: WebSocket
        text: "wss://tony-dell.taila0626a.ts.net/apps/gev-live/ws"
      - label: Service
        text: systemctl --user start gev-gemini.service (Docker container on port 8789).
      - label: Remote (casted) clients
        text: "A GEV page loaded inside a vcast display iframe gets ?screen=N&pane=P injected by the receiver and registers with the bridge as a passive remote (?remote=1 — no Gemini session). GET /apps/gev-cmd/command/health lists remotes {screen,pane}; POST /apps/gev-cmd/command {name,args,screen,pane} drives them. Screen-targeted commands wait GEV_REMOTE_GRACE_S (default 12s) for the remote to register — the freshly casted page is still in frame-loading — then answer {ok:false, retryable:true, retry_after_s} ('client may still be loading; retry in ~Ns'). Over-writing the pane (e.g. camwall nav) drops the remote — that read is what ada-voice cast_to_screen turns into the displaced note + split/PiP suggestion (feafff7)."
      - label: Verify-after-act for casts
        text: "A cast tool returning ok is not evidence — after casting /apps/gev/ to a screen, read state before claiming: /displays must show state=nav + pN:frame-ok AND /command/health must list the remote. Automated: node stacks/web/input-bridge/gev-cast-verify.mjs; contract doc: docs/runbooks/vcast-gev-verify-after-act.md."
      - label: Registry
        text: Listed in docs/ssot/apps/ssot.apps.yml under the tony-dell host.
  - title: Testing
    icon: "🧪"
    layout: list
    items:
      - label: Hard refresh
        text: Open https://tony-dell.taila0626a.ts.net/apps/gev/ in Chrome, hard-refresh, click the mic.
      - label: Voice command test
        text: Say "go to New York", click again to end, filter console for [GEV].
      - label: Tour playback check
        text: "node stacks/web/input-bridge/gev-tour.mjs --tour stacks/web/input-bridge/tours/world-landmarks.json --screen N — plays a defined route on any display with a GEV remote; checkpoint report asserts stops reached in order. Format + contract: docs/runbooks/gev-tours.md; stub-relay suite: gev-tour-selftest.mjs."
      - label: Tour playback verify
        text: "node stacks/web/input-bridge/gev-tour-verify.mjs --screen 6 — plays london-icons on a cast screen and asserts checkpoints arrive in order (tour_status poll + /command/events stream)."
      - label: Voice invariant check
        text: "node stacks/web/input-bridge/gev-voice-check.mjs — GainNode mute invariant (muted => zero outbound PCM frames, behavioral sim incl. flag-stripped mutation), playback path presence, iOS meta, bridge audio forward. --live checks the deployed bundle (drift = WARN)."
      - label: Bridge audio check
        text: "python3 stacks/tony-dell/gev-gemini/audio-forward-check.py — stubbed-genai unit check that pump_responses forwards model_turn audio verbatim as binary frames."
  - title: Integration
    icon: "🔗"
    layout: list
    items:
      - label: Gemini Live API
        text: Connects to Google's live bidi WebSocket through the bridge.
      - label: Google Maps
        text: fly_to_location uses the Maps Geocoder for place resolution.
  - title: Known Issues
    icon: "⚠️"
    layout: list
    items:
      - label: Country-level geocoding
        text: Thailand as a country fails; city-level queries like New York work. Likely needs a non-Google geocoder or country preset.
      - label: Minified bundle patches
        text: Post-build patches are codified by scripts/gev/patch-gev-dist.sh (api/models prefix, iPad msaaSamples ternary, honest-fail.js inject) plus the voice playback patches in stacks/web/scripts/gev-patch-dist.mjs — run them on dist/ after every npm run build; --check verifies both. The staged bundle under stacks/web/public/apps/gev/ carries them in place.
      - label: iOS mic constraint
        text: getUserMedia works in mobile Safari but NOT in a standalone home-screen PWA — index.html deliberately sets apple-mobile-web-app-capable=no (and mobile-web-app-capable=no) so iOS opens the page in-browser. Do not flip to yes without a mic fallback.
      - label: Safari verification pending
        text: Latest fixes have only been confirmed on Chrome/Windows so far.
