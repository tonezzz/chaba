    - stacks/web/rview-api/Dockerfile
    - stacks/web/public/apps/rview/index.html
    - stacks/web/Caddyfile
    - stacks/web/docker-compose.yml
    - scripts/mcp_rview/server.py
    - scripts/mcp_rview/views.py
    - scripts/mcp_rview/fetch.py
    - docs/ssot/apps/ssot.apps.yml
