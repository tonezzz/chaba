title: Storage Policy
subtitle: Canonical data storage locations, retention, and cleanup status for chaba
icon: database
version: 1
last_reviewed: '2026-08-31T13:45:00+07:00'
reviewer: assistant
owner: tony
trend: increasing

summary:
  total_estimated: 104G
  categories: 7
  critical: 1
  warning: 0
  stable: 6
  biggest_consumer: devin-cli
  note: Devin CLI bucket is 97G (sessions.db 41G + backups 96G) after 7-day prune+VACUUM.

policy:
  purpose: Track where files and data are stored, set retention and cleanup rules, and monitor status.
  review_frequency: weekly
  data_classification:
    - 'git-managed: project source and SSOT in chaba/'
    - 'non-git user data: ~/.local/share/, ~/.config/, ~/.cache/'
    - 'secrets: ~/.config/secrets/ and other mode-0600 files'
    - 'remote: Google Drive backups via rclone'

categories:
  - id: devin-cli
    label: Devin CLI session state
    paths:
      - '~/.local/share/devin/cli'
    current_size: 97G
    breakdown:
      backups/: 96G
      sessions.db: 41G
      sessions.db-wal: 729M
      logs/: 236M
      summaries/: 136M
    table_sizes:
      message_nodes: 128791
      tool_call_state: 16490
      sessions: 104
    threshold:
      warning: 30G
      critical: 50G
    status: critical
    retention: Sessions kept for 7 days; logs and summaries retained until manually pruned.
    cleanup:
      - 'Prune old sessions: scripts/prune-devin-sessions.sh [retention-days]'
      - Archive or delete old session backups
      - Archive or delete ~/.local/share/devin/cli/logs files > 90 days
    note: Prune+VACUUM completed 2026-08-31 with 7-day retention. sessions.db down from 50G to 41G. Backups at 96G are now the biggest sub-bucket.

  - id: containers
    label: Podman/Docker container storage
    paths:
      - '~/.local/share/containers/storage'
    current_size: 3.1G
    breakdown:
      localhost/status-api: 1.66G
      registry.access.redhat.com/ubi9/python-311: ~1.1G
      localhost/status-data-api: 281M
      docker.io/library/python:3.11-slim: 129M
      docker.io/library/eclipse-mosquitto:2: 23.2M
    threshold:
      warning: 8G
      critical: 12G
    status: stable
    retention: Images kept until removed; stopped containers retained with 0B runtime state.
    cleanup:
      - podman image prune
      - Remove dangling <none> images
      - Removed imagen2-inference and pytorch 2.6.0-cuda12.4-cudnn9-runtime 2026-08-30
    note: Removed imagen2-inference and pytorch images 2026-08-30 (freed ~6G).

  - id: cache
    label: User cache
    paths:
      - '~/.cache'
    current_size: 2.8G
    breakdown:
      google-chrome: 1G
      puccinialin: 871M
      ms-playwright: 656M
      rclone: 708K
    threshold:
      warning: 6G
      critical: 10G
    status: stable
    retention: Caches are disposable; rclone VFS re-hydrates from Google Drive.
    cleanup:
      - Clear ~/.cache/rclone/vfs (cleared 2026-08-30; max-size 1G)
      - '~/.cache/trivy cleared 2026-08-30; will re-fetch on next scan'
      - Clear Chrome cache if not actively needed
    note: Rclone VFS cache cleared and max-size reduced from 5G to 1G 2026-08-30. ~/.cache/huggingface is a symlink to /data/cache/huggingface (75G) and not counted here.

  - id: claude
    label: Claude Desktop data
    paths:
      - '~/.config/Claude'
    current_size: 318M
    breakdown:
      'Claude Extensions/local.unpacked.rikaidev.yomi/node_modules': 174M
      Cache: 87M
      'Code Cache': 32M
    threshold:
      warning: 200M
      critical: 500M
    status: stable
    retention: Installed extension and model cache persist until updated or uninstalled.
    cleanup:
      - Remove ~/.config/Claude/Claude Extensions/local.unpacked.rikaidev.yomi if Yomi extension not used
      - Clear Cache and Code Cache periodically

  - id: reports
    label: Generated chaba reports
    paths:
      - reports/
    current_size: 273M
    breakdown:
      overnight-assessment-20260813-112426.md: 39M
      overnight-assessment-20260813-125755.md: 34M
      overnight-assessment-20260814-020000.md: 32M
      archive/: 7.6M
      audits/: 4.3M
    threshold:
      warning: 300M
      critical: 1G
    status: stable
    retention: 30 days for overnight reports per ssot.automation.yml.
    cleanup:
      - Compress or delete old overnight-assessment-20260813-*.md files
      - Move reports > 30 days to archive or remote

  - id: app-data
    label: Application data
    paths:
      - '~/.local/share/yomi'
      - '~/.local/share/tuya'
      - '~/.local/share/home-assistant-michael'
      - '~/.local/share/wifi'
      - '~/.config/go2rtc'
    current_size: 68.5M
    breakdown:
      'yomi/search-index.db': 24M
      'yomi/search-index.db-wal': 4.9M
      tuya: 36M
      home-assistant-michael: 3.5M
      wifi: 8K
    threshold:
      warning: 100M
      critical: 500M
    status: stable
    retention: App data retained per app policy; Yomi search index is precious.
    cleanup:
      - Keep yomi/search-index.db and WAL; do not delete
      - Keep tuya/venv for Home Assistant command_line local control
      - Prune home-assistant-michael/hacs-repositories.json if stale

  - id: project-data
    label: chaba project runtime data
    paths:
      - data/
      - logs/
      - outputs/
    current_size: 3M
    breakdown:
      data/: 640K
      logs/: 2.4M
      outputs/: 4K
    threshold:
      warning: 50M
      critical: 100M
    status: stable
    retention: GPU monitor data in data/gpu-monitor/; logs rotate per automation.
    cleanup:
      - Archive > 30 day logs
      - Clear data/ssot-optimization temp files

improvements:
  - label: Prune and VACUUM Devin sessions DB
    source: ssot.storage.yml
    target_score: devin-cli < 20G
    status: completed
