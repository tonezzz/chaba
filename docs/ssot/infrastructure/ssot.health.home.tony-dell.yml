title: Chaba Health Checks (Home Profile) — Tony-Dell
subtitle: Persistent services on the tony-dell headless host, checked over the tailnet
icon: heart-pulse
services:
- id: tony-dell-tailscale
  name: Tony-Dell Tailscale Reachability
  type: http
  url: http://tony-dell:3001/health
  expected_status: 200
  timeout: 5
  category: tony-dell
  profiles:
  - home
  - mobile
  note: 'Quick reachability check over the tailnet short hostname. This relies on

    Tailscale DNS/IPs and confirms tony-dell is reachable from the health

    monitoring host (tony-omen) without using a static LAN address.

    '
  verification:
  - 'Resolve and ping: ping -c 2 tony-dell'
  - 'Tailscale ping: tailscale ping tony-dell'
  - 'GPU queue health (also on tony-dell): curl -s http://tony-dell:3001/health'
  recovery_actions:
  - 'Check tony-dell is online: tailscale status | grep tony-dell'
  - 'Check Tailscale on tony-dell: ssh tony-dell tailscale status'
  host: tony_dell

- id: barrier-client
  name: Barrier KVM Client
  type: systemd
  service: barrier-client.service
  scope: user
  host: tony_dell
  expected_state: active
  timeout: 5
  category: tony-dell
  profiles:
  - home
  - mobile
  note: Barrier KVM client on tony-dell; connects to the barriers.service on tony-omen.
  verification:
  - 'Check service: ssh tony-dell systemctl --user status barrier-client.service'
  - 'Check process: ssh tony-dell pgrep -a barrierc'
  - 'Check log: ssh tony-dell tail -n 20 /tmp/barrier-client.log'
  recovery_actions:
  - 'Restart service: ssh tony-dell systemctl --user restart barrier-client.service'
  - 'Verify tony-omen barriers.service is active: ssh tony-omen systemctl --user is-active barriers.service'
  host: tony_dell
