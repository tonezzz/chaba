      - "Start container: cd /home/tony/CascadeProjects/chaba-omen/stacks/ai && docker compose up -d llama-server"
      - "Check container logs: cd /home/tony/CascadeProjects/chaba-omen/stacks/ai && docker compose logs llama-server"
      - "Verify port 8008 is accessible: curl -s http://tony-omen.local:8008/health"
      - "Check model loading: curl -s http://tony-omen.local:8008/health (returns 503 while loading)"

  - id: imagen2
    name: Imagen2
    type: http
    url: http://tony-omen.local:8000/health
    expected_status: 200
    timeout: 10
    category: gpu
    profiles: [home]
    note: "Offline (2026-08-09) - GPU memory constraints. Start manually when needed: docker compose -f stacks/gpu/docker-compose.yml up imagen2-inference"

  - id: txt2vid
    name: Txt2Vid
    type: http
    url: http://tony-omen.local:8002/health
    expected_status: 200
    timeout: 10
    category: gpu
    profiles: [home]
    note: "Offline (2026-08-09) - GPU memory constraints. Start manually when needed: docker compose -f stacks/gpu/docker-compose.yml up txt2vid-inference"

  # Queue Services
  - id: gpu-queue
    name: GPU Queue
    type: http
    url: http://tony-omen.local:3001/health
    expected_status: 200
    timeout: 5
    category: queue
    profiles: [home]

  # Optional Services
  - id: activepieces
    name: Activepieces
    type: container
    container: activepieces
    expected_state: running
    timeout: 5
    category: optional
    profiles: [home, mobile]
