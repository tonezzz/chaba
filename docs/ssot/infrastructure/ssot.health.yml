  - id: frigate
    name: Frigate NVR
    type: http
    url: "{profile}/frigate/api/version"
    expected_status: 200
    timeout: 10
    category: optional
    profiles: [home, mobile]

  - id: camera-control
    name: Camera Control
    type: http
    url: http://tony-omen.local:8090/
    expected_status: 200
    timeout: 5
    category: optional
    profiles: [home]

  # Systemd Services
  - id: yomi-api-service
    name: Yomi API Service (systemd)
    type: systemd
    service: yomi-api.service
    expected_state: active
    timeout: 5
    category: system
