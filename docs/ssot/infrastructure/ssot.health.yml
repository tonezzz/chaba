title: Chaba Health Check Configuration
description: Health check endpoints and monitoring for all chaba services
version: 8

# Network profiles with auto-detection
profiles:
  default: auto-detect
  home:
    hostname: tony-omen.local
    base_url: http://tony-omen.local:8080
    ssids: [TONY-WIFI, TONY-WIFI_5G]
    description: Home network with local hostname
  mobile:
    hostname: tony-omen
    base_url: http://tony-omen:8080
    ssids: [TONY-IP]
    description: Mobile/external network via Tailscale
    note: Connect to Tailscale first; use the tailnet hostname `tony-omen` (100.75.102.88) instead of a dynamic IP or DDNS hostname

# Alert configuration
alerts:
  enabled: true
  channels:
    - type: log
      enabled: true
      severity: [critical, error, degraded]
      description: Log alerts to system journal
    - type: webhook
      enabled: false
      url: ""
      severity: [critical]
      description: Webhook for external monitoring systems
  
  thresholds:
    critical_services_down: 3
    sustained_failure_minutes: 5
    recovery_notification: true
    response_time_threshold_ms: 5000
  
  service_criticality:
    critical: [caddy, postgres, gpu-queue]
    important: [yomi-api, status-api, trade-api, mddb-api, playlived, llama-server, remote-exec-tony-dell, barrier-server]
    optional: [redis, weaviate, activepieces, frigate, camera-control, imagen2, txt2vid, thai-legal, cpu-frequency-monitor, gdrive-backup]

# Service groups for dependency tracking
groups:
  web-stack: [caddy, status-api, yomi-api, mddb-panel]
  gpu-stack: [imagen2, txt2vid, thai-legal, llama-server]
  datastore: [postgres, weaviate, mddb-api]
  trading: [trade-api]
  optional: [activepieces, frigate, camera-control]
  automation: [playlived]
  ssot-sync: [mddb-api, mddb-mcp, mddb-stats, mddb-vector-stats, mddb-metrics, mddb-container]
  remote-exec: [remote-exec-tony-dell]
  system: [cpu-frequency-monitor, chaba-health-monitor-timer, gdrive-backup]

# Service dependencies
dependencies:
  yomi-api: [caddy, postgres] # redis removed - not currently deployed
  status-api: [caddy]
  gpu-queue: [postgres]
  activepieces: [postgres] # redis removed - not currently deployed
  playlived: []
  remote-exec-tony-dell: []

services:
  # Web Stack Services (8080/8081)
  - id: caddy
    name: Caddy
    type: http
    url: "{profile}/apps/"
    expected_status: 200
    timeout: 5
    category: web
    profiles: [home, mobile]

  - id: bserver
    name: BServer
    type: http
    url: "{profile}/"
    expected_status: 200
    timeout: 5
    category: web
    profiles: [home, mobile]

  - id: raceman-web
    name: Raceman Web
    type: http
    url: http://tony-omen.local:8083/apps/raceman/
    expected_status: 200
    timeout: 5
    category: web
    profiles: [home]

  - id: helm
    name: Helm Dashboard
    type: http
    url: http://tony-omen.local:8080/apps/helm/
    expected_status: 200
    timeout: 5
    category: web
    profiles: [home, mobile]
    verification:
      - "Check container: docker ps | grep helm"
      - "Check container logs: docker logs helm --tail 20"
      - "Test direct container: curl -s http://localhost:3003/"
      - "Test Caddy proxy: curl -s http://tony-omen.local:8080/apps/helm/"
    recovery_actions:
      - "Restart container: cd /home/tony/CascadeProjects/chaba/stacks/web && docker compose restart helm"
      - "Rebuild container: cd /home/tony/CascadeProjects/helm && docker build -t web-helm . && cd /home/tony/CascadeProjects/chaba/stacks/web && docker compose up -d helm"
      - "Check Caddy proxy configuration in stacks/web/Caddyfile"
      - "Verify environment variables: docker exec helm env | grep LLM"

  - id: raceman-php
    name: Raceman PHP
    type: container
    container: raceman-php
    expected_state: running
    timeout: 5
    category: web
    profiles: [home]

  - id: status-api
    name: Status API
    type: http
    url: "{profile}/health"
    expected_status: 200
    timeout: 5
    category: api
    profiles: [home, mobile]
    verification:
      - "Test container: docker ps | grep status-api"
      - "Test direct container: curl -s http://localhost:8000/health"
      - "Test Caddy proxy: curl -s {profile}/health"
      - "Check container logs: docker logs status-api --tail 20"
    recovery_actions:
      - "Restart container: docker restart status-api"
      - "Check container networking: docker inspect status-api"
      - "Verify Caddy proxy configuration in stacks/web/Caddyfile"

  - id: yomi-api
    name: Yomi API
    type: http
    url: "{profile}/api/yomi/health"
    expected_status: 200
    timeout: 5
    category: api
    profiles: [home, mobile]
    verification:
      - "Test direct container access: docker exec web wget -qO- http://host.docker.internal:3000/api/yomi/health"
      - "Test Caddy proxy: curl -s {profile}/api/yomi/health"
      - "Test chat page: curl -s {profile}/apps/yomi/chat.html?chat=test"
      - "Verify container networking: docker exec web ping -c 2 host.docker.internal"
      - "Check Caddy proxy configuration uses handle_path not handle for /api/yomi/*"

  - id: yomi-summarization
    name: Yomi Summarization
    type: http
    url: "{profile}/api/yomi/summarization-status"
    expected_status: 200
    timeout: 5
    category: api
    profiles: [home, mobile]
    verification:
      - "Test API endpoint: curl -s {profile}/api/yomi/summarization-status"
      - "Test chat page with valid chat ID: curl -s {profile}/apps/yomi/chat.html?chat=valid_chat_id"
      - "Verify API returns JSON response with status information"
      - "Check browser console for API errors when loading chat page"

  - id: yomi-rate-limiter
    name: Yomi Rate Limiter
    type: http
    url: "{profile}/api/yomi/rate-limiter-status"
    expected_status: 200
    timeout: 5
    category: api
    profiles: [home, mobile]

  - id: yomi-activity-status
    name: Yomi Activity Status
    type: http
    url: "{profile}/api/yomi/activity-status"
    expected_status: 200
    timeout: 5
    category: api
    profiles: [home, mobile]

  - id: playlived
    name: Playlived
    type: http
    url: http://tony-omen.local:9230/sessions
    expected_status: 200
    timeout: 5
    category: api
    profiles: [home]
    verification:
      - "Test sessions: curl -s http://tony-omen.local:9230/sessions"
      - "Check pinned package: cat /home/tony/.local/playlive/package.json | grep '\"playwright\"'"
      - "Verify installed version: cd /home/tony/.local/playlive && npm ls playwright"
      - "Check browsers: npx playwright install --dry-run"
      - "Detect Playwright update: cd /home/tony/.local/playlive && installed=$(npm ls playwright --depth=0 2>/dev/null | grep -o 'playwright@[0-9.]*' | cut -d@ -f2) && latest=$(npm view playwright version) && echo \"installed: $installed\" && echo \"latest: $latest\" && { [ \"$installed\" != \"$latest\" ] && echo \"INFO: newer Playwright version available; review before pinning\" || true; }"
      - "Check service: systemctl --user status playlived.service"
    recovery_actions:
      - "Reinstall exact version: cd /home/tony/.local/playlive && npm ci && npx playwright install chromium"
      - "Bump version: edit /home/tony/.local/playlive/package.json to the new exact version, npm install, npx playwright install chromium, systemctl --user restart playlived.service"
      - "Restart service: systemctl --user restart playlived.service"
      - "Fix port: ss -tulpn | grep 9230 && kill conflicting process"

  # Trading Services
  - id: trade-api
    name: Trade API
    type: http
    url: http://localhost:9000/api/health
    expected_status: 200
    timeout: 5
    category: api
    profiles: [home, mobile]
    verification:
      - "Test container: docker ps | grep trade-api"
      - "Test health endpoint: curl -s http://localhost:9000/api/health"
      - "Test root endpoint: curl -s http://localhost:9000/"
      - "Check container logs: docker logs trade-api"
    recovery_actions:
      - "Restart container: docker restart trade-api"
      - "Check container networking: docker inspect trade-api"
      - "Verify port mapping: docker port trade-api"

  # Note: trading-terminal container not currently deployed
  # - id: trading-terminal
  #   name: Trading Terminal
  #   type: container
  #   container: trading-terminal
  #   expected_state: running
  #   timeout: 5
  #   category: api
  #   profiles: [home, mobile]

  # Remote Execution Services
  - id: remote-exec-tony-dell
    name: Remote Execution MCP (Tony Dell)
    type: mcp
    server: remote-exec-tony-dell
    timeout: 10
    category: api
    profiles: [home]
    verification:
      - "Test SSH connectivity: ssh -o ConnectTimeout=5 tony@tony-dell.local 'echo OK'"
      - "Test MCP server: echo '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\"}' | timeout 5 /home/tony/CascadeProjects/trade/.devin/remote-exec-wrapper.sh"
      - "Check wrapper script: cat /home/tony/CascadeProjects/trade/.devin/remote-exec-wrapper.sh"
    recovery_actions:
      - "Test SSH: ssh tony@tony-dell.local 'echo test'"
      - "Check remote server: ssh tony@tony-dell.local 'ls -la /home/tony/mcp-remote-exec/'"
      - "Verify Python dependencies: ssh tony@tony-dell.local 'cd /home/tony/mcp-remote-exec && python3 -c import yaml, psutil'"
      - "Test MCP server manually: ssh tony@tony-dell.local 'cd /home/tony/mcp-remote-exec && echo test | python3 mcp_server.py'"

  # Data Services
