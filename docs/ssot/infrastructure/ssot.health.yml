title: Chaba Health Check Configuration
description: Health check endpoints and monitoring for all chaba services
version: 5

# Network profiles with auto-detection
profiles:
  default: auto-detect
  home:
    hostname: tony-omen.local
    base_url: http://tony-omen.local:8080
    description: Home network with local hostname
  mobile:
    hostname: [CURRENT-IP]
    base_url: http://[CURRENT-IP]:8080
    description: Mobile/external network with IP placeholder
    note: Replace [CURRENT-IP] with actual IP or DDNS hostname

# Alert configuration
alerts:
  enabled: true
  channels:
    - type: log
      enabled: true
      severity: [critical, error, degraded]
      description: Log alerts to system journal
    - type: webhook
      enabled: false
      url: ""
      severity: [critical]
      description: Webhook for external monitoring systems
  
  thresholds:
    critical_services_down: 3
    sustained_failure_minutes: 5
    recovery_notification: true
    response_time_threshold_ms: 5000
  
  service_criticality:
    critical: [caddy, postgres, gpu-queue]
    important: [yomi-api, status-api, trade-api, mddb-api, playlived, ssot-sync-watcher, llama-server]
    optional: [redis, weaviate, activepieces, frigate, camera-control, imagen2, txt2vid, thai-legal]

# Service groups for dependency tracking
groups:
  web-stack: [caddy, status-api, yomi-api, mddb-panel]
  gpu-stack: [imagen2, txt2vid, thai-legal, llama-server]
  datastore: [redis, postgres, weaviate, mddb-api]
  trading: [trade-api, trading-terminal]
  optional: [activepieces, frigate, camera-control]
  automation: [playlived]
  ssot-sync: [ssot-sync-watcher, mddb-api, mddb-mcp, mddb-stats, mddb-vector-stats, mddb-metrics, mddb-container]

# Service dependencies
dependencies:
  yomi-api: [caddy, postgres, redis]
  status-api: [postgres]
  gpu-queue: [postgres]
  activepieces: [postgres, redis]
  playlived: []
  ssot-sync-watcher: [mddb-api]

services:
  # Web Stack Services (8080/8081)
  - id: caddy
    name: Caddy
    type: http
    url: "{profile}/apps/"
    expected_status: 200
    timeout: 5
    category: web
    profiles: [home, mobile]

  - id: bserver
    name: BServer
    type: http
    url: "{profile}/"
    expected_status: 200
    timeout: 5
    category: web
    profiles: [home, mobile]

  - id: raceman-web
    name: Raceman Web
    type: http
    url: http://tony-omen.local:8083/apps/raceman/
    expected_status: 200
    timeout: 5
    category: web
    profiles: [home]

  - id: raceman-php
    name: Raceman PHP
    type: container
    container: raceman-php
    expected_state: running
    timeout: 5
    category: web
    profiles: [home]

  - id: status-api
    name: Status API
    type: http
    url: "{profile}/api/health"
    expected_status: 200
    timeout: 5
    category: api
    profiles: [home, mobile]

  - id: yomi-api
    name: Yomi API
    type: http
    url: "{profile}/api/yomi/health"
    expected_status: 200
    timeout: 5
    category: api
    profiles: [home, mobile]
    verification:
      - "Test direct container access: docker exec web wget -qO- http://host.docker.internal:3000/api/yomi/health"
      - "Test Caddy proxy: curl -s {profile}/api/yomi/health"
      - "Test chat page: curl -s {profile}/apps/yomi/chat.html?chat=test"
      - "Verify container networking: docker exec web ping -c 2 host.docker.internal"
      - "Check Caddy proxy configuration uses handle_path not handle for /api/yomi/*"

  - id: yomi-summarization
    name: Yomi Summarization
    type: http
    url: "{profile}/api/yomi/summarization-status"
    expected_status: 200
    timeout: 5
    category: api
    profiles: [home, mobile]
    verification:
      - "Test API endpoint: curl -s {profile}/api/yomi/summarization-status"
      - "Test chat page with valid chat ID: curl -s {profile}/apps/yomi/chat.html?chat=valid_chat_id"
      - "Verify API returns JSON response with status information"
      - "Check browser console for API errors when loading chat page"

  - id: yomi-rate-limiter
    name: Yomi Rate Limiter
    type: http
    url: "{profile}/api/yomi/rate-limiter-status"
    expected_status: 200
    timeout: 5
    category: api
    profiles: [home, mobile]

  - id: yomi-activity-status
    name: Yomi Activity Status
    type: http
    url: "{profile}/api/yomi/activity-status"
    expected_status: 200
    timeout: 5
    category: api
    profiles: [home, mobile]

  - id: playlived
    name: Playlived
    type: http
    url: http://tony-omen.local:9230/sessions
    expected_status: 200
    timeout: 5
    category: api
    profiles: [home]
    verification:
      - "Test sessions: curl -s http://tony-omen.local:9230/sessions"
      - "Check browsers: npx playwright install --dry-run"
      - "Check service: systemctl --user status playlived.service"
    recovery_actions:
      - "Install browsers: cd /home/tony/.local/playlive && npx playwright install"
      - "Restart service: systemctl --user restart playlived.service"
      - "Fix port: ss -tulpn | grep 9230 && kill conflicting process"

  # Trading Services
  - id: trade-api
    name: Trade API
    type: container
    container: trade-api
    expected_state: running
    timeout: 5
    category: api
    profiles: [home, mobile]

  - id: trading-terminal
    name: Trading Terminal
    type: container
    container: trading-terminal
    expected_state: running
    timeout: 5
    category: api
    profiles: [home, mobile]

  # Data Services
  - id: redis
    name: Redis
    type: container
    container: redis
    expected_state: running
    timeout: 5
    category: datastore
    profiles: [home, mobile]

  - id: postgres
    name: Postgres
    type: container
    container: postgres
    expected_state: running
    timeout: 5
    category: datastore
    profiles: [home, mobile]

  - id: weaviate
    name: Weaviate
    type: http
    url: "{profile}/api/weaviate/v1/nodes"
    expected_status: 200
    timeout: 5
    category: datastore
    profiles: [home, mobile]

  - id: mddb-api
    name: MDDB API
    type: http
    url: "http://tony-omen.local:11023/health"
    expected_status: 200
    timeout: 5
    category: datastore
    profiles: [home, mobile]
    note: Direct port access for health check, bypasses Caddy routing

  - id: mddb-mcp
    name: MDDB MCP Server
    type: http
    url: "http://tony-omen.local:9001/mcp"
    expected_status: 200
    timeout: 5
    category: datastore
    profiles: [home, mobile]
    note: MCP endpoint for AI agent integration (requires /mcp path suffix)
    recovery_actions:
      - "Check MDDB container: docker ps | grep mddb"
      - "Restart MDDB: cd /home/tony/CascadeProjects/chaba-kbman/stacks/web/mddb && docker compose restart mddb"
      - "Check MDDB logs: cd /home/tony/CascadeProjects/chaba-kbman/stacks/web/mddb && docker compose logs mddb"
      - "Verify MCP endpoint: curl -s http://tony-omen.local:9001/mcp"
      - "Check MCP config: cat ~/.config/devin/mcp_config.json | grep mddb"

  - id: mddb-panel
    name: MDDB Panel
    type: http
    url: "{profile}/apps/mddb/"
    expected_status: 200
    timeout: 5
    category: web
    profiles: [home, mobile]

  - id: mddb-stats
    name: MDDB Stats Endpoint
    type: http
    url: "http://tony-omen.local:11023/v1/stats"
    expected_status: 200
    timeout: 5
    category: datastore
    profiles: [home, mobile]
    note: Direct port access for stats endpoint, bypasses Caddy routing
    recovery_actions:
      - "Check MDDB container: docker ps | grep mddb"
      - "Restart MDDB: cd /home/tony/CascadeProjects/chaba-kbman/stacks/web/mddb && docker compose restart mddb"
      - "Check MDDB logs: cd /home/tony/CascadeProjects/chaba-kbman/stacks/web/mddb && docker compose logs mddb"
      - "Verify port 11023 is accessible: curl -s http://tony-omen.local:11023/v1/stats"

  - id: mddb-vector-stats
    name: MDDB Vector Stats Endpoint
    type: http
    url: "http://tony-omen.local:11023/v1/vector-stats"
    expected_status: 200
    timeout: 5
    category: datastore
    profiles: [home, mobile]
    note: Direct port access for vector stats endpoint, bypasses Caddy routing
    recovery_actions:
      - "Check MDDB container: docker ps | grep mddb"
      - "Restart MDDB: cd /home/tony/CascadeProjects/chaba-kbman/stacks/web/mddb && docker compose restart mddb"
      - "Check MDDB logs: cd /home/tony/CascadeProjects/chaba-kbman/stacks/web/mddb && docker compose logs mddb"
      - "Verify port 11023 is accessible: curl -s http://tony-omen.local:11023/v1/vector-stats"

  - id: mddb-metrics
    name: MDDB Metrics Endpoint
    type: http
    url: "http://tony-omen.local:11023/metrics"
    expected_status: 200
    timeout: 5
    category: datastore
    profiles: [home, mobile]
    note: Direct port access for metrics endpoint, bypasses Caddy routing
    recovery_actions:
      - "Check MDDB container: docker ps | grep mddb"
      - "Restart MDDB: cd /home/tony/CascadeProjects/chaba-kbman/stacks/web/mddb && docker compose restart mddb"
      - "Check MDDB logs: cd /home/tony/CascadeProjects/chaba-kbman/stacks/web/mddb && docker compose logs mddb"
      - "Verify port 11023 is accessible: curl -s http://tony-omen.local:11023/metrics"

  - id: mddb-container
    name: MDDB Container
    type: container
    container: mddb
    expected_state: running
    timeout: 5
    category: datastore
    profiles: [home, mobile]
    note: Container-level health check for MDDB service (container name: mddb)
    recovery_actions:
      - "Check container status: docker ps -a | grep mddb"
      - "Start container: cd /home/tony/CascadeProjects/chaba-kbman/stacks/web/mddb && docker compose up -d mddb"
      - "Check container logs: cd /home/tony/CascadeProjects/chaba-kbman/stacks/web/mddb && docker compose logs mddb"
      - "Verify docker compose config: cd /home/tony/CascadeProjects/chaba-kbman/stacks/web/mddb && docker compose config"

  # SSOT Services
  - id: ssot-sync-watcher
    name: SSOT Sync Watcher (systemd)
    type: systemd
    service: ssot-sync
    expected_state: active
    timeout: 5
    category: system
    profiles: [home, mobile]
    note: Systemd service for SSOT to MDDB auto-sync file watcher
    recovery_actions:
      - "Check service status: systemctl status ssot-sync.service"
      - "Restart service: systemctl restart ssot-sync.service"
      - "Check service logs: journalctl -xeu ssot-sync.service"
      - "Verify watch script exists: ls -la /home/tony/CascadeProjects/chaba-kbman/scripts/watch-ssot-sync.py"
      - "Check script permissions: chmod +x /home/tony/CascadeProjects/chaba-kbman/scripts/watch-ssot-sync.py"
      - "Reload systemd: systemctl daemon-reload"
      - "Enable service: systemctl enable ssot-sync.service"

  # GPU Services (All offline due to GTX 1650 4GB VRAM constraints)
  - id: thai-legal
    name: Llama Router (Phi-3 only)
    type: http
    url: http://tony-omen.local:8001/health
    expected_status: 200
    timeout: 10
    category: gpu
    profiles: [home]
    note: Offline (2026-08-09) - GTX 1650 4GB cannot run multiple GPU services concurrently. Use mcp1_hold_llama and run one GPU workload at a time.

  - id: llama-server
    name: Llama Server (MCP)
    type: http
