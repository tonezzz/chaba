    profiles: [home, mobile]
    verification:
      - "Test container: docker ps | grep postgres"
      - "Test connection: docker exec postgres pg_isready"
      - "Test port: nc -zv localhost 5432"
      - "Check logs: docker logs postgres --tail 20"
    recovery_actions:
      - "Restart container: docker restart postgres"
      - "Check data volume: docker inspect postgres | grep -A 10 Mounts"
      - "Verify networking: docker network inspect bridge"

  - id: weaviate
    name: Weaviate
    type: http
    url: "{profile}/api/weaviate/v1/nodes"
    expected_status: 200
    timeout: 5
    category: datastore
    profiles: [home, mobile]

  - id: mddb-api
