    profiles: [home, mobile]
    verification:
      - "Test container: docker ps | grep redis"
      - "Test connection: docker exec redis redis-cli ping"
      - "Test memory: docker exec redis redis-cli info memory"
      - "Check logs: docker logs redis --tail 20"
    recovery_actions:
      - "Restart container: docker restart redis"
      - "Check data volume: docker inspect redis | grep -A 10 Mounts"
      - "Verify networking: docker network inspect bridge"

  - id: postgres
