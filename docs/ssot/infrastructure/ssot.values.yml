title: SSOT Value Registry
subtitle: Canonical values for ports, hosts, schedules, and thresholds used across the project
icon: registry
version: 1

overview:
  purpose: |
    Centralize canonical configuration values so scripts, systemd units, health
    checks, and web endpoints can reference them by key instead of hard-coding.

config:
  version: 1
  last_updated: '2026-09-01'
  maintainer: tony
  status: active

hosts:
  tony_omen:
    name: tony-omen
    local: tony-omen.local
    tailscale: tony-omen.taila0626a.ts.net
    tailscale_ip: '100.75.102.88'
  tony_dell:
    name: tony-dell
    local: tony-dell.local
    tailscale: tony-dell.taila0626a.ts.net
    tailscale_ip: '100.68.142.13'
    funnel: 'https://tony-dell.taila0626a.ts.net'
  michael_ha:
    name: michael-ha
    tailscale: michael-ha.taila0626a.ts.net
    tailscale_ip: '100.80.105.88'
    hassio_network_host: homeassistant
