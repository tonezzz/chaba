# Recovery suggestions for common failure modes (mobile-specific)
recovery_actions:
  network_unreachable:
    - Check if VPN is connected
    - Verify home network is accessible
    - Check mobile data connection
    - Try switching between WiFi and mobile data
    - Verify [CURRENT-IP] placeholder is replaced with actual IP

  timeout:
    - External access may be slower than local
    - Check if home network has bandwidth issues
    - VPN connection may be slow
    - Consider using local network when at home
    - Increase timeout values for mobile networks

  service_unavailable:
    - Some services may not be exposed externally
    - Check if service requires local network access
    - Container checks may not work externally
    - Use Status API for container status when available
    - Verify service is running on home network

  vpn_required:
    - Some services require VPN for external access
    - Connect to home VPN first
    - Verify VPN credentials
    - Check VPN server status

  profile_switch:
    - When returning home, switch to ssot.health.home.yml
    - Update [CURRENT-IP] placeholders with actual IP
    - Use .local hostnames when on home network
    - Consider DDNS hostname for stable external access

# Testing and debugging guidance (mobile-specific)
debugging_guidance:
  web_testing:
    - Use localhost for testing on the same machine: http://localhost:8080/apps/health-check/
    - Avoid browser preview for local testing - use regular browser instead
    - Browser preview is only for isolated environments or when direct access unavailable
    - Test mobile viewport responsiveness using browser dev tools

  location_testing:
    - On Mobile (TONY-IP): Use [CURRENT-IP] after replacing placeholder
    - External: Use VPN or external domain when away from home network
    - At Home: Switch to ssot.health.home.yml and use tony-omen.local
    - Profile switching: Update health check config when changing networks

  network_testing:
    - Test VPN connectivity before accessing services
    - Check mobile signal strength and data connection
    - Test both WiFi and mobile data for comparison
    - Use browser dev tools network throttling to simulate poor connections
    - Verify [CURRENT-IP] placeholder is replaced with actual IP

  service_testing:
    - External access has longer timeouts - be patient
    - Some services may be limited or unavailable externally
    - Use Status API for container status when direct checks fail
    - Test critical services first when connection is unstable
    - Replace [CURRENT-IP] placeholders before running health checks

  profile_switching:
    - From Mobile to Home: Connect to home WiFi, switch to ssot.health.home.yml
    - From Home to Mobile: Connect to external WiFi, switch to ssot.health.mobile.yml
    - Update URLs: Replace .local hostnames with [CURRENT-IP] when mobile
    - Update URLs: Replace [CURRENT-IP] with .local hostnames when home
    - Reference: ssot.mysystem.mobile.yml and ssot.mysystem.home.yml
