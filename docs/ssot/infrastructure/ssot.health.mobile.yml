title: Chaba Health Checks (Mobile Profile)
subtitle: Service health checks for the mobile network profile
icon: heart-pulse

services:
- id: caddy
  name: Caddy
  type: http
  url: '{profile}/apps/map/'
  expected_status: 200
  timeout: 5
  category: web
  profiles:
  - home
  - mobile
- id: helm
  name: Helm Dashboard
  type: http
  url: http://100.68.142.13:3003/apps/helm
  expected_status: 200
  timeout: 5
  category: web
  profiles:
  - home
  - mobile
  verification:
  - 'Check podman container: ssh tony-dell podman ps | grep helm'
  - 'Check podman logs: ssh tony-dell podman logs helm --tail 20'
  - 'Test direct podman container: curl -s http://100.68.142.13:3003/apps/helm/'
  - 'Test Caddy proxy: curl -s http://100.68.142.13:3003/apps/helm/'
  recovery_actions:
  - 'Restart service: ssh tony-dell systemctl --user restart helm'
  - 'Rebuild: ssh tony-dell "cd /home/tony/CascadeProjects/chaba-tony-dell/tony-dell/chaba-funnel && ./deploy.sh"'
  - Check Caddy proxy configuration in stacks/web/Caddyfile
  - 'Verify env: ssh tony-dell podman exec helm env | grep LLM'
- id: status-data-api
  name: Status Data API
  type: http
  url: http://100.68.142.13:8000/health
  expected_status: 200
  timeout: 5
  category: api
  profiles:
  - home
  - mobile
  verification:
  - 'Test service: ssh tony-dell systemctl --user status status-data-api'
  - 'Test direct container: curl -s http://100.68.142.13:8000/health'
  - 'Check podman logs: ssh tony-dell podman logs status-data-api --tail 20'
  recovery_actions:
  - 'Restart service: ssh tony-dell systemctl --user restart status-data-api'
  - 'Verify status-data-api can reach http://100.68.142.13:8000/health'
  - Verify Caddy proxy configuration in stacks/web/Caddyfile
- id: yomi-api
  name: Yomi API
  type: http
  url: http://100.68.142.13:3000/api/yomi/health
  expected_status: 200
  timeout: 5
  category: api
  profiles:
  - home
  - mobile
  recommendation: If yomi-api is down and tony-dell cannot be recovered, run /home/tony/.local/bin/yomi-failover-to-omen.sh
    on tony-omen. See docs/ssot/infrastructure/ssot.yomi-failover.yml.
  verification:
  - 'Test direct Yomi API on tony-dell: curl -s http://100.68.142.13:3000/api/yomi/health'
  - 'Test chat page: curl -s http://100.68.142.13:3000/apps/yomi/chat.html?chat=test'
- id: yomi-summarization
  name: Yomi Summarization
  type: http
  url: '{profile}/api/yomi/summarization-status'
  expected_status: 200
  timeout: 5
  category: api
  profiles:
  - home
  - mobile
  verification:
  - 'Test API endpoint: curl -s {profile}/api/yomi/summarization-status'
  - 'Test chat page with valid chat ID: curl -s {profile}/apps/yomi/chat.html?chat=valid_chat_id'
  - Verify API returns JSON response with status information
  - Check browser console for API errors when loading chat page
- id: yomi-rate-limiter
  name: Yomi Rate Limiter
  type: http
  url: '{profile}/api/yomi/rate-limiter-status'
  expected_status: 200
  timeout: 5
  category: api
  profiles:
  - home
  - mobile
- id: yomi-activity-status
  name: Yomi Activity Status
  type: http
  url: '{profile}/api/yomi/activity-status'
  expected_status: 200
  timeout: 5
  category: api
  profiles:
  - home
  - mobile
- id: trade-api
  name: Trade API
  type: http
  url: http://tony-dell:9002/api/health
  expected_status: 200
  timeout: 5
  category: api
  profiles:
  - home
  - mobile
  host: tony_dell
  verification:
  - 'Test container: ssh tony-dell podman ps | grep trade-api'
  - 'Test health endpoint: curl -s http://tony-dell:9002/api/health'
  - 'Test root endpoint: curl -s http://tony-dell:9002/'
  - 'Check container logs: ssh tony-dell podman logs trade-api'
  recovery_actions:
  - 'Restart container: ssh tony-dell podman restart trade-api'
  - 'Check container networking: ssh tony-dell podman inspect trade-api'
  - 'Verify port mapping: ssh tony-dell podman port trade-api'
- id: gpu-queue
  name: GPU Queue
  type: http
  url: http://tony-dell:3001/health
  expected_status: 200
  timeout: 5
  category: queue
  profiles:
  - home
  - mobile
  note: Migrated to tony-dell rootless podman on port 3001. GPU workers remain on tony-omen.
  verification:
  - 'Test direct: curl -s http://tony-dell:3001/health'
  - 'Check podman: ssh tony-dell podman ps | grep gpu-queue'
  - 'Check logs: ssh tony-dell podman logs gpu-queue --tail 20'
  recovery_actions:
  - 'Restart service: ssh tony-dell systemctl --user restart gpu-queue'
  - 'Check GPU queue health: curl -s http://tony-dell:3001/health'
  - 'Check GPU worker reachability: curl -s http://100.75.102.88:8008/health'
- id: playlived-omen
  name: Playlived (tony-omen)
  type: systemd
  service: playlived.service
  expected_state: active
  timeout: 5
  category: system
  profiles:
  - home
  - mobile
  disabled: true
  note: playlived is now hosted on tony-dell; tony-omen no longer runs this service.
  verification:
  - 'Check service: systemctl --user status playlived.service'
  - 'Check logs: journalctl --user -u playlived.service -n 20'
  recovery_actions:
  - 'Restart service: systemctl --user restart playlived.service'
- id: playlived-dell
  name: Playlived (tony-dell)
  type: http
  url: http://tony-dell:9230/sessions
  expected_status: 200
  timeout: 5
  category: api
  profiles:
  - home
  - mobile
  verification:
  - 'Test sessions: curl -s http://tony-dell:9230/sessions'
  - 'Check service: ssh tony-dell systemctl --user status playlived.service'
  recovery_actions:
  - 'Restart service: ssh tony-dell systemctl --user restart playlived.service'
  - 'Fix port: ssh tony-dell ss -tulpn | grep 9230 && kill conflicting process'
- id: redis
  name: Redis
  disabled: true
  type: container
  container: redis
  host: tony_dell
  expected_state: running
  timeout: 5
  category: datastore
  profiles:
  - home
  - mobile
  note: 'Migrated to tony_dell rootless podman. Disabled in mcp-health because mcp-health cannot run remote podman checks. Health is verified manually via ssh tony-dell podman ps and indirectly through yomi-api/postgres.'
  verification:
  - 'Test container on tony_dell: ssh tony-dell podman ps | grep redis'
  - 'Test connection: ssh tony-dell podman exec redis redis-cli ping'
  - 'Test memory: ssh tony-dell podman exec redis redis-cli info memory'
  - 'Check logs: ssh tony-dell podman logs redis --tail 20'
  recovery_actions:
  - 'Restart container on tony_dell: ssh tony-dell podman restart redis'
  - 'Check data volume: ssh tony-dell podman inspect redis | grep -A 10 Mounts'
  - 'Verify networking on tony_dell: ssh tony-dell podman network inspect bridge'
- id: postgres
  name: Postgres
  type: container
  container: chaba-postgres-16
  host: tony_dell
  expected_state: running
  timeout: 5
  category: datastore
  profiles:
  - home
  - mobile
  disabled: true
  note: Postgres now runs in a rootless Podman container on tony_dell. Health is best inferred from yomi-api and the pg tailscale
    endpoint. If both Postgres and Yomi are down on tony_dell, use the failover plan in docs/ssot/infrastructure/ssot.yomi-failover.yml.
  verification:
  - 'Test container on tony_dell: podman ps | grep chaba-postgres-16'
  - 'Test port: nc -zv postgre 5432'
  - 'Check logs: podman logs chaba-postgres-16 --tail 20'
  recovery_actions:
  - 'Restart container on tony_dell: podman restart chaba-postgres-16'
  - 'Check data volume: /home/tony/.config/containers/postgres/data'
  - 'If tony_dell cannot be recovered, run the failover script: /home/tony/.local/bin/yomi-failover-to-omen.sh'
- id: weaviate
  name: Weaviate
  type: http
  url: '{profile}/api/weaviate/v1/nodes'
  expected_status: 200
  timeout: 5
  category: datastore
  profiles:
  - home
  - mobile
  note: 'Weaviate container runs on tony_dell:8084; Caddy on tony_omen proxies /api/weaviate/ to 100.68.142.42:8084'
- id: mddb-api
  name: MDDB API
  type: http
  url: http://tony-dell:11023/health
  expected_status: 200
  timeout: 5
  category: datastore
  profiles:
  - home
  - mobile
  note: Direct port access for health check, bypasses Caddy routing
- id: mddb-mcp
  name: MDDB MCP Server
  type: http
  url: http://tony-dell:9000/mcp
  expected_status: 400
  timeout: 5
  category: datastore
  profiles:
  - home
  - mobile
  note: MCP endpoint for AI agent integration; GET /mcp returns 400, only POST is valid, so 400 is the healthy response
  recovery_actions:
  - 'Check MDDB container: docker ps | grep mddb'
  - 'Restart MDDB: cd /home/tony/CascadeProjects/chaba-kbman/stacks/web/mddb && docker compose restart mddb'
  - 'Check MDDB logs: cd /home/tony/CascadeProjects/chaba-kbman/stacks/web/mddb && docker compose logs mddb'
  - 'Verify MCP endpoint: curl -s http://tony-dell:9000/mcp'
  - 'Check MCP config: cat ~/.config/devin/mcp_config.json | grep mddb'
- id: mddb-panel
  name: MDDB Panel
  type: http
  url: http://100.68.142.13:3002/
  expected_status: 200
  timeout: 5
  category: web
  profiles:
  - home
  - mobile
- id: mddb-stats
  name: MDDB Stats Endpoint
  type: http
  url: http://tony-dell:11023/v1/stats
  expected_status: 200
  timeout: 5
  category: datastore
  profiles:
  - home
  - mobile
  note: Direct port access for stats endpoint, bypasses Caddy routing
  recovery_actions:
  - 'Check MDDB container: docker ps | grep mddb'
  - 'Restart MDDB: cd /home/tony/CascadeProjects/chaba-kbman/stacks/web/mddb && docker compose restart mddb'
  - 'Check MDDB logs: cd /home/tony/CascadeProjects/chaba-kbman/stacks/web/mddb && docker compose logs mddb'
  - 'Verify port 11023 is accessible: curl -s http://tony-dell:11023/v1/stats'
- id: mddb-vector-stats
  name: MDDB Vector Stats Endpoint
  type: http
  url: http://tony-dell:11023/v1/vector-stats
  expected_status: 200
  timeout: 5
  category: datastore
  profiles:
  - home
  - mobile
  note: Direct port access for vector stats endpoint, bypasses Caddy routing
  recovery_actions:
  - 'Check MDDB container: docker ps | grep mddb'
  - 'Restart MDDB: cd /home/tony/CascadeProjects/chaba-kbman/stacks/web/mddb && docker compose restart mddb'
  - 'Check MDDB logs: cd /home/tony/CascadeProjects/chaba-kbman/stacks/web/mddb && docker compose logs mddb'
  - 'Verify port 11023 is accessible: curl -s http://tony-dell:11023/v1/vector-stats'
- id: mddb-metrics
  name: MDDB Metrics Endpoint
  type: http
  url: http://tony-dell:11023/metrics
  expected_status: 200
  timeout: 5
  category: datastore
  profiles:
  - home
  - mobile
  note: Direct port access for metrics endpoint, bypasses Caddy routing
  recovery_actions:
  - 'Check MDDB container: docker ps | grep mddb'
  - 'Restart MDDB: cd /home/tony/CascadeProjects/chaba-kbman/stacks/web/mddb && docker compose restart mddb'
  - 'Check MDDB logs: cd /home/tony/CascadeProjects/chaba-kbman/stacks/web/mddb && docker compose logs mddb'
  - 'Verify port 11023 is accessible: curl -s http://tony-dell:11023/metrics'
- id: mddb-container
  name: MDDB Container
  disabled: true
  type: container
  container: mddb
  expected_state: running
  timeout: 5
  category: datastore
  profiles:
  - home
  - mobile
  note: 'Container runs on tony-dell. Disabled in mcp-health because mcp-health cannot run remote podman checks. Use MDDB API/HTTP checks instead; verify manually via ssh tony-dell podman ps | grep mddb.'
  recovery_actions:
  - 'Check container status: docker ps -a | grep mddb'
  - 'Start container: cd /home/tony/CascadeProjects/chaba-kbman/stacks/web/mddb && docker compose up -d mddb'
  - 'Check container logs: cd /home/tony/CascadeProjects/chaba-kbman/stacks/web/mddb && docker compose logs mddb'
  - 'Verify docker compose config: cd /home/tony/CascadeProjects/chaba-kbman/stacks/web/mddb && docker compose config'
- id: activepieces
  name: Activepieces
  disabled: true
  type: container
  container: activepieces
  expected_state: running
  timeout: 5
  category: optional
  profiles:
  - home
  - mobile
  note: 'Offline (2026-08-14) - intentionally stopped. Start manually when needed: docker compose -f stacks/activepieces/docker-compose.yml
    up -d'
- id: frigate
  name: Frigate NVR
  disabled: true
  type: http
  url: '{profile}/frigate/api/version'
  expected_status: 200
  timeout: 10
  category: optional
  profiles:
  - home
  - mobile
  note: 'Offline (2026-08-14) - intentionally stopped; start manually when needed: docker compose -f frigate/docker-compose.yml
    up -d'
- id: yomi-update-all-timer
  name: Yomi Update All Timer
  type: systemd
  service: yomi-update-all.timer
  expected_state: active
  timeout: 5
  category: system
  profiles:
  - home
  - mobile
  disabled: true
  note: 'Timer now runs on tony_dell as a Podman user unit. Check with tony_dell: systemctl --user status yomi-update-all.timer.'
- id: yomi-update-active-timer
  name: Yomi Update Active Timer
  type: systemd
  service: yomi-update-active.timer
  expected_state: active
  timeout: 5
  category: system
  profiles:
  - home
  - mobile
  disabled: true
  note: 'Timer now runs on tony_dell as a Podman user unit. Check with tony_dell: systemctl --user status yomi-update-active.timer.'
- id: weaviate-index-timer
  name: Weaviate Index Timer
  type: systemd
  service: weaviate-index.timer
  expected_state: active
  timeout: 5
  category: system
  profiles:
  - home
  - mobile
  host: tony_omen
  disabled: true
  note: 'Indexing runs on tony-omen to use the GPU embedding service. It writes to the Weaviate container on tony-dell:8084 via WEAVIATE_URL=http://tony-dell:8084. Check: systemctl --user status weaviate-index.timer'
- id: cpu-frequency-monitor
  name: CPU Frequency Monitor
  type: systemd
  scope: system
  service: cpufreq-limit.service
  expected_state: active
  timeout: 5
  category: system
  profiles:
  - home
  - mobile
  disabled: true
  note: tony-omen only. Disabled from tony-dell health monitor.
  verification:
  - 'Check service: systemctl status cpufreq-limit.service'
  - 'Check current CPU frequency: cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq'
  - 'Check CPU governor: cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor'
  recovery_actions:
  - 'Restart service: systemctl restart cpufreq-limit.service'
  - 'Set performance governor: echo performance | sudo tee /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor'
- id: chaba-health-monitor-timer
  name: Chaba Health Monitor Timer
  type: systemd
  service: chaba-health-monitor.timer
  expected_state: active
  timeout: 5
  category: system
  profiles:
  - home
  - mobile
  disabled: true
  note: tony-omen only. Disabled from tony-dell health monitor.
  verification:
  - 'Check timer status: systemctl --user status chaba-health-monitor.timer'
  - 'Check monitor log: tail -f /home/tony/CascadeProjects/chaba/logs/health-monitor.log'
  - 'Test script manually: bash /home/tony/CascadeProjects/chaba/scripts/health-monitor.sh'
  - 'Check CPU frequency: cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq'
  - 'Check CPU governor: cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor'
  recovery_actions:
  - 'Restart timer: systemctl --user restart chaba-health-monitor.timer'
  - 'Check script permissions: chmod +x /home/tony/CascadeProjects/chaba/scripts/health-monitor.sh'
  - 'Monitor CPU frequency: watch -n 1 ''cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq'''
  - 'Change CPU governor: echo performance | sudo tee /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor'
  - 'Check thermal throttling: watch -n 1 ''cat /sys/class/thermal/thermal_zone*/temp'''
- id: barrier-server
  name: Barrier KVM Server
  type: systemd
  service: barriers.service
  expected_state: active
  timeout: 5
  category: system
  profiles:
  - home
  - mobile
  disabled: true
  note: tony-omen only. Disabled from tony-dell health monitor.
  verification:
  - 'Check service: systemctl --user status barriers.service'
  - 'Check port: ss -tlnp | grep 24800'
  - 'Check server log: tail -n 20 /tmp/barrier-server.log'
  - 'Check connected client: tail -n 20 /tmp/barrier-client.log'
  recovery_actions:
  - 'Restart server: systemctl --user restart barriers.service'
  - 'Check log: journalctl --user -u barriers.service -n 50'
  - 'Check client: ssh -o ConnectTimeout=3 tony@tony-dell ''pgrep -a barrierc'''
  - 'Restart client: ssh -o ConnectTimeout=3 tony@tony-dell ''pkill -x barrierc 2>/dev/null; nohup /home/tony/.local/bin/barrierc
    --no-daemon --disable-crypto --name tony-dell --log /tmp/barrier-client.log 100.75.102.88 >/dev/null 2>&1 &'''
- id: ha-live
  name: Home Assistant Live (Gemini Live bridge)
  type: http
  url: https://tony-dell.taila0626a.ts.net:8444/
  expected_status: 200
  timeout: 5
  category: tailscale
  profiles:
  - home
  - mobile
  note: 'Push-to-talk Gemini Live bridge for Home Assistant on tony-dell:8444, proxied by tailscale serve to 127.0.0.1:9005. The old chaba-funnel landing page on 8447 is decommissioned.'
  verification:
  - 'Check bridge: tailscale ssh tony-dell systemctl --user is-active ha-live'
  - 'Check port: ss -tlnp | grep 9005'
  - 'Test root: curl -s -o /dev/null -w ''%{http_code}'' https://tony-dell.taila0626a.ts.net:8444/'
  - 'Check tailscale serve: tailscale serve status'
  recovery_actions:
  - 'Restart: tailscale ssh tony-dell systemctl --user restart ha-live'
  - 'Check tailscale serve: tailscale serve status'
- id: mcp-debug-cors
  name: MCP Debug CORS endpoint
  type: http
  url: http://tony-omen:9100/health
  expected_status: 200
  timeout: 5
  category: mcp-debug
  profiles:
  - home
  - mobile
  disabled: true
  note: Legacy tony-omen CORS endpoint. Deprecated in favour of the MCP Debug SSE server on tony-dell.
  verification:
  - 'Disabled; see mcp-debug-sse'
  recovery_actions:
  - 'No action: legacy endpoint, disabled'
