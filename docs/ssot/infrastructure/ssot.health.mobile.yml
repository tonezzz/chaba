- id: yomi-activity-status
  name: Yomi Activity Status
  type: http
  url: '{profile}/api/yomi/activity-status'
  expected_status: 200
  timeout: 5
  category: api
  profiles:
  - home
  - mobile
- id: trade-api
  name: Trade API
  type: http
  url: http://localhost:9000/api/health
  expected_status: 200
  timeout: 5
  category: api
  profiles:
  - home
  - mobile
  verification:
  - 'Test container: docker ps | grep trade-api'
  - 'Test health endpoint: curl -s http://localhost:9000/api/health'
  - 'Test root endpoint: curl -s http://localhost:9000/'
  - 'Check container logs: docker logs trade-api'
  recovery_actions:
  - 'Restart container: docker restart trade-api'
  - 'Check container networking: docker inspect trade-api'
  - 'Verify port mapping: docker port trade-api'
- id: redis
  name: Redis
  type: container
  container: redis
  expected_state: running
  timeout: 5
  category: datastore
  profiles:
  - home
  - mobile
  verification:
  - 'Test container: docker ps | grep redis'
  - 'Test connection: docker exec redis redis-cli ping'
  - 'Test memory: docker exec redis redis-cli info memory'
  - 'Check logs: docker logs redis --tail 20'
  recovery_actions:
  - 'Restart container: docker restart redis'
  - 'Check data volume: docker inspect redis | grep -A 10 Mounts'
  - 'Verify networking: docker network inspect bridge'
- id: postgres
  name: Postgres
  type: container
  container: chaba-postgres-16
  host: tony_dell
  expected_state: running
  timeout: 5
  category: datastore
  profiles:
  - home
  - mobile
  disabled: true
  note: Postgres now runs in a rootless Podman container on tony_dell. Health is best inferred from yomi-api and the pg tailscale
    endpoint. If both Postgres and Yomi are down on tony_dell, use the failover plan in docs/ssot/infrastructure/ssot.yomi-failover.yml.
  verification:
  - 'Test container on tony_dell: podman ps | grep chaba-postgres-16'
  - 'Test port: nc -zv postgre 5432'
  - 'Check logs: podman logs chaba-postgres-16 --tail 20'
  recovery_actions:
  - 'Restart container on tony_dell: podman restart chaba-postgres-16'
  - 'Check data volume: /home/tony/.config/containers/postgres/data'
  - 'If tony_dell cannot be recovered, run the failover script: /home/tony/.local/bin/yomi-failover-to-omen.sh'
- id: weaviate
  name: Weaviate
  type: http
