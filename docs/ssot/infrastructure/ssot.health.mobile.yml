services:
- id: caddy
  name: Caddy
  type: http
  url: '{profile}/apps/'
  expected_status: 200
  timeout: 5
  category: web
  profiles:
  - home
  - mobile
- id: bserver
  name: BServer
  type: http
  url: '{profile}/'
  expected_status: 200
  timeout: 5
  category: web
  profiles:
  - home
  - mobile
- id: helm
  name: Helm Dashboard
  type: http
  url: http://tony-omen:8080/apps/helm
  expected_status: 200
  timeout: 5
  category: web
  profiles:
  - home
  - mobile
  verification:
  - 'Check container: docker ps | grep helm'
  - 'Check container logs: docker logs helm --tail 20'
  - 'Test direct container: curl -s http://localhost:3003/'
  - 'Test Caddy proxy: curl -s http://tony-omen:8080/apps/helm/'
  recovery_actions:
  - 'Restart container: cd /home/tony/CascadeProjects/chaba/stacks/web && docker compose restart helm'
  - 'Rebuild container: cd /home/tony/CascadeProjects/helm && docker build -t web-helm . && cd /home/tony/CascadeProjects/chaba/stacks/web
    && docker compose up -d helm'
  - Check Caddy proxy configuration in stacks/web/Caddyfile
  - 'Verify environment variables: docker exec helm env | grep LLM'
- id: status-api
  name: Status API
  type: http
  url: '{profile}/health'
  expected_status: 200
  timeout: 5
  category: api
  profiles:
  - home
  - mobile
  verification:
  - 'Test container: docker ps | grep status-api'
  - 'Test direct container: curl -s http://localhost:8000/health'
  - 'Test Caddy proxy: curl -s {profile}/health'
  - 'Check container logs: docker logs status-api --tail 20'
  recovery_actions:
  - 'Restart container: docker restart status-api'
  - 'Check container networking: docker inspect status-api'
  - Verify Caddy proxy configuration in stacks/web/Caddyfile
- id: yomi-api
  name: Yomi API
  type: http
  url: '{profile}/api/yomi/health'
  expected_status: 200
  timeout: 5
  category: api
  profiles:
  - home
  - mobile
  recommendation: If yomi-api is down and tony-dell cannot be recovered, run /home/tony/.local/bin/yomi-failover-to-omen.sh
    on tony-omen. See docs/ssot/infrastructure/ssot.yomi-failover.yml.
  verification:
  - 'Test direct Yomi API on tony-dell: curl -s http://tony-dell:3000/api/yomi/health'
  - 'Test Caddy proxy on tony-omen: curl -s {profile}/api/yomi/health'
  - 'Test chat page: curl -s {profile}/apps/yomi/chat.html?chat=test'
- id: yomi-summarization
  name: Yomi Summarization
  type: http
  url: '{profile}/api/yomi/summarization-status'
  expected_status: 200
  timeout: 5
  category: api
  profiles:
  - home
  - mobile
  verification:
  - 'Test API endpoint: curl -s {profile}/api/yomi/summarization-status'
  - 'Test chat page with valid chat ID: curl -s {profile}/apps/yomi/chat.html?chat=valid_chat_id'
  - Verify API returns JSON response with status information
  - Check browser console for API errors when loading chat page
- id: yomi-rate-limiter
  name: Yomi Rate Limiter
  type: http
  url: '{profile}/api/yomi/rate-limiter-status'
