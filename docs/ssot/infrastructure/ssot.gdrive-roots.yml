    size: 82MB/41f
    consumers: "scripts/adobe-stock/* all take ADA_ADOBE_STOCK_REMOTE / --remote (default gdrive:ada-nest/adobe-stock)"
    verdict: folded-pending-drain  # old root still receives dell timer writes until exec checkout syncs; then rclone move drains it
  - id: ada-nest/devnest
    moved: "gdrive:ada-nest-devnest -> gdrive:ada-nest/devnest (2026-11-08)"
    consumers: "scripts/devnest/{devnest_capacity_broker,devnest_report_feed,kk_mac_plan_validator}.py"
    verdict: folded
  - id: ada-nest/kk-llm
    moved: "gdrive:ada-nest-kk-llm -> gdrive:ada-nest/kk-llm (2026-11-08)"
    consumers: "scripts/devnest/{kk_mac_metrics,kk_mac_capacity_producer,devnest_capacity_broker}.py; kk-mac workers poll inbox/"
