    verdict: keep-root  # approved move to ada-nest/brains is gated on dell gcrypt env repoint — see closeout doc
  - id: backups
    size: 162GB+/33f
    consumers: "systemd/{mddb-standby-pull,mddb-gdrive-tier}.service, cold-restore runbooks, omen partition snapshots, backups/devin"
    verdict: keep-root  # HIGHEST RISK — DR path; never rename
  - id: archive
    size: "~160GB"
    consumers: "cold tier root — absorbed appsheet, chaba (2 xlsx), colabgpu, cold-storage, chaba-media-corpus on 2026-11-08; deploy-card.sh now archives bundles under archive/chaba/bundles (CHABA_GDRIVE_BUNDLES)"
    verdict: keep-root
  - id: archive/chaba-media-corpus
    moved: "gdrive:chaba-media-corpus -> gdrive:archive/chaba-media-corpus (2026-11-08)"
    consumers: "FUSE path ~/GoogleDrive/archive/chaba-media-corpus/yt-live-media -> stacks/tony-dell/ada-ha/ada-ha.container Volume= (repointed 2026-11-17; needs quadlet redeploy+restart on dell)"
    verdict: folded
  - id: archive/cold-storage
    moved: "gdrive:cold-storage -> gdrive:archive/cold-storage (2026-11-08)"
    consumers: "idc02 backup cold tier writer (off-repo)"
    verdict: folded
  - id: colab-cache
    size: 170MB/1f
    consumers: "colab notebooks (outside repo) MyDrive/colab-cache/<name>/ — docs/kb/colab-gdrive-cache.md"
    verdict: keep-root  # notebook contract
  - id: notebooklm
    size: 458-obj (mostly sizeless gdocs)
    consumers: "scripts/notebooklm-kb-sync.py (NOTEBOOKLM_KB_COLLECTION, default gdrive:notebooklm/chaba)"
    verdict: keep-root
  - id: "Tony AI/backup/chaba"
