# gdrive: root-dir registry — chaba/ada-owned top-level dirs on Tony's Drive.
# Created 2026-11-08 (OPS-1187 phase-B audit); updated 2026-11-17 closeout.
# Verdict layer only; consumer map + procedure: docs/kb/gdrive-root-consolidation.md;
# execution log: docs/ssot/jobs/infrastructure/2026-11-17-gdrive-root-consolidation-closeout.yml
#
# Principle: every remaining top-level dir is a NAMED API ROOT — consumed by
# hardcoded `gdrive:<dir>` strings in scripts/systemd/quadlets, by colab
# notebooks outside this repo, and by the whole-Drive FUSE mount
# (~/GoogleDrive on tony-dell). Root renames are contract changes, not tidying.
#
# phase-A (done 2026-11-08): 6 dead pilot dirs -> ada-nest/archive/, tmp/tmp-test removed.
# phase-B (executed 2026-11-08, closed out 2026-11-17): live roots folded —
# see per-dir 'moved' markers below.
title: Google Drive root registry
roots:
  - id: ada-nest
    size: "~large (main store)"
    consumers: "queue-mgr, colab notebook MyDrive/ada-nest/queue, ~all nest jobs; packs/ queue/ reports/ archive/"
    verdict: keep-root  # canonical store; also absorbs the folded lanes below
  - id: ada-nest/ada-documents
    moved: "gdrive:ada-documents -> gdrive:ada-nest/ada-documents (2026-11-08 fold; dir renamed back to ada-documents 2026-11-17 — DRIVE_ROOT lookup is by folder NAME, not path)"
    size: 2.62GB/557f
    consumers: "stacks/idc01/doc-archive/doc_archive.py (DRIVE_ROOT=ada-documents), scripts/gdrive-archive.py, MDDB documents bank"
    verdict: folded
  - id: ada-nest/adobe-stock
