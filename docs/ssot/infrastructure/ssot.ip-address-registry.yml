title: IP Address Registry
subtitle: Per-network IP allocations linked to the MAC address registry
icon: 🗺️
version: 1
last_updated: '2026-09-08'
ideas:
- Every IP allocation links back to a stable device_id in ssot.mac-address-registry.yml
- One network_record per subnet, with an allocations list
- Track static reservations, DHCP leases, and discovered hosts
- Starting with home networks; expand to Tailscale, Docker, etc. later
sections:
- title: IP Registry Schema
  icon: 🧩
  layout: list
  items:
  - label: network_id
    text: Stable slug (e.g. home-192.168.2.0-24, legacy-192.168.1.0-24).
  - label: cidr
    text: CIDR notation of the subnet.
  - label: ssid / vlan
    text: Wi-Fi SSID, VLAN name, or link type.
  - label: gateway
    text: Router IP for that subnet.
  - label: dhcp_range
    text: DHCP pool as [start, end] (null if unknown).
  - label: allocations
    text: 'List of ip_record: ip, device_id, interface_id, kind (static/reservation/dhcp/discovered), status, first_seen,
      last_seen, source.'
- title: Home Network 192.168.2.0/24
  icon: 🏠
  layout: list
  items:
  - label: Active connection
    text: TONY-WIFI_2.4G (wlo1) and netplan-eno1 (eno1). Default gateway 192.168.2.1.
  - label: Known hosts
    text: Router, tony-omen, tony-dell, Tuya coffee/bedside/TV/Cozy Life plugs, IP camera, Xiaomi C201, HP DeskJet, Tony TV,
      ESP32 test, KKs MacBook Pro, KKs Mac Studio, Tony iPhone, realme C63, HONOR Pad 9, plus transient/randomized devices.
  - label: Note
    text: This is the current active network. The detailed allocations are in config.networks below.
- title: Legacy Network 192.168.1.0/24
  icon: 🏠
  layout: list
  items:
  - label: SSID
    text: Mountain View 5G / Mountain View 2.4G (saved NetworkManager profiles).
  - label: Known hosts
    text: macbook at 192.168.1.39, Google TV at 192.168.1.50, and tony-omen had 192.168.1.54 in earlier sessions.
  - label: Status
    text: Stale — not reachable from the current 192.168.2.0/24 network. Needs a reconnect to rescan.
- title: Next Steps
  icon: ➡️
  layout: list
  items:
  - label: Identify unknown hosts
    text: 'Identify 192.168.2.73, .74, .76, .78, .79, .86, .88, .91 and .72. Many are private Wi-Fi addresses; use owner/device
      clues or disable private MAC addressing to assign stable device_ids.'
  - label: Reconnect 192.168.1.0/24
    text: Switch to Mountain View 5G to capture current IPs and MACs for macbook and Google TV.
  - label: Expand
    text: Add Tailscale, Docker, LXC, and USB-tether networks once home networks are complete.
  - label: Automation
    text: Nightly ARP scan compares against this registry; new/duplicate IPs or MACs create focus-inbox alerts.
config:
  version: 1
  last_updated: '2026-09-09'
  maintainer: tony
  status: active
  related_files:
  - docs/ssot/infrastructure/ssot.mac-address-registry.yml
  - docs/ssot/infrastructure/ssot.tuya-smart-plug.yml
  - docs/ssot/infrastructure/ssot.ip-camera.yml
  - docs/ssot/ssot.mysystem.home.yml
  schema:
    network_record:
      required:
      - network_id
      - cidr
      fields:
        network_id: stable slug
        cidr: CIDR notation
        ssid: Wi-Fi SSID or VLAN name
        gateway: router IP
        dhcp_range:
        - start_ip
        - end_ip
        status: active/stale/unknown
        allocations:
        - ip: IPv4 address
          device_id: link to mac-address-registry
          interface_id: which interface of the device
          kind: static/reservation/dhcp/discovered
          status: active/stale/reserved
          first_seen: ISO-8601 date
          last_seen: ISO-8601 date
          source: arp/dhcp/sticker/manual
  networks:
  - network_id: home-192.168.2.0-24
    cidr: 192.168.2.0/24
