  - title: System Requirements
    icon: ⚙️
    layout: list
    items:
      - label: Disk Space
        text: Minimum 1GB free for backup retention
        current_available: 12G
        current_usage: 88%
        backup_growth: ~128K per day
        retention_impact: ~3.8MB maximum (30 days)

      - label: Script Dependencies
        text: Required system tools and permissions
        dependencies:
          - bash: Shell script execution
          - python3: JSON validation
          - git: Version control operations
          - cron: Job scheduling
          - File permissions: Read/write access to configs

      - label: MCP Server Requirements
        text: Devin Desktop with MCP server support
        required_servers:
          - docs: Documentation search (critical)
          - github: GitHub integration (high)
          - yomi: Yomi integration (high)
          - postgres: Database access (medium)
          - mcp-gpu: GPU operations (medium)
          - mcp-llama: LLM inference (medium)

