  chaba_admin:
    name: chaba-admin
    instance: tony-ha
    title: Chaba admin
    icon: mdi:shield-crown
    url: https://tony-dell.taila0626a.ts.net:8123/chaba-admin/pair
    require_admin: true
    created: "2026-09-20"
    storage_path: /home/tony/.config/home-assistant/.storage/lovelace.chaba_admin
    repo_snapshot: docs/home-assistant/dashboards/chaba-admin-current.json
    note: >-
      Sidebar dashboard (storage mode) hosting the Ada HA pair panel natively —
      no iframe. Backing config lives in tony-ha YAML:
      input_text.ada_pair_device_name / ada_pair_redeem_url,
      input_select.ada_pair_instance, scripts ada_pair_issue / ada_pair_revoke
      (scripts.yaml), rest_command ada_issue_key / ada_revoke_key,
      shell_command ada_pair_save_qr, rest sensors ada_*_issued_keys (all in
      configuration.yaml), secret ada_admin_key in secrets.yaml. QR SVG is
      written to /config/www/pair-qr.svg and shown in a picture card. Admin key
      stays server-side in secrets.yaml.
      Issued-keys card is custom:ada-keys-card (/local/ada-keys-card.js?v=4,
      repo: stacks/tony-dell/tony-ha/www/ada-keys-card.js) — each key row is a
      plain label plus four buttons: Voice and Text re-pair via callWS
      return_response (script returns resp via stop+response_variable) and
      open the fresh redeem link in a synchronously-opened popup (iOS-safe),
      consuming the single-use token in the admin browser; Re-pair refreshes
      the QR without opening; Revoke calls script.ada_pair_revoke_named.
      ada_pair_reissue takes a ui field (voice|chat) and calls
      rest_command.ada_repair_key → POST /api/auth/keys/{name}/redeem on mn01,
      which preserves key identity/audit history and accepts a `redirect`
      field: ui=chat lands on /apps/ha/ada-{instance}/chat (the Ada text-chat
      page in ada-pi pwa/chat/, served by pwa_server StaticFiles) instead of
      the voice PWA root.
      QR display is custom:ada-pair-qr-card (/local/ada-pair-qr-card.js, same
      repo dir) — renders /local/pair-qr.svg with a ?v= cache-buster derived
      from the redeem token (stock picture card caches the URL forever).
      Events tab added 2026-09-20: custom:chaba-events-card
      (/local/chaba-events-card.js, repo: stacks/tony-dell/tony-ha/www/) reads
      /local/chaba-events.json (written by /config/scripts/chaba-event-log.py —
      flock, 24h prune, 300 cap, `ack` sets responded) plus live
      persistent_notification entities (always requires-response). Shared
      filter state in input_text.chaba_events_filter ({"hidden": [...],
      "log_hidden": [...]} — both cards merge-write the shared JSON).
      Log tab added 2026-09-21: `type: panel` view with a single
      custom:chaba-log-card (/local/chaba-log-card.js?v=4, same repo dir) —
      an isolated copy of the built-in /logbook page so its UX/UI can be
      modified freely. It renders the same <ha-logbook> element +
      logbook/event_stream backend as the native page (force-loaded via a
      throwaway hui-logbook-card from loadCardHelpers), behind our own
      toolbar: Live 1h/24h/7d presets ({recent: seconds} = live tailing),
      Custom datetime range ({range:[Date,Date]} = fixed window), refresh,
      entity text filter, and the per-domain checkbox row. The list scrolls
      inside the card; vertical fit is JS-measured (parent content-box
      bottom clamped to visualViewport — innerHeight under-counts on iOS
      when the browser toolbar is visible), refit on resize/hass. The card
      renders light-DOM so :host doesn't apply — selectors are scoped via
      the tag name and clc-* classes; CSS height:100% is the fallback. Filter groups are entity domains (input_* grouped as
      "input"), persisted as "log_hidden" in the same input_text; toggling a
      group rebuilds the inner card's entities list. The inner card's chrome
      is flattened via an injected shadowRoot <style>. Events card v4 dropped
      the "logbook" checkbox (it gated a card on another tab);
      input_boolean.chaba_events_show_logbook is now vestigial — nothing
      reads it. Note HA 2026.8 logbook cards error
      ("target has no entities") without entities:/target:, so it carries a
      curated entity list (pairing/cast scripts+automations, helpers, cast
      devices, ada sensors). Producers: shell_command.chaba_event /
      chaba_event_ack (base64 JSON payload), called from ada_pair_* scripts;
      deploy-ada.sh emits over SSH. Events with requires_response && !responded
      pin to top with a pulsing border (prefers-reduced-motion respected);
      confidence <0.6 shown as outlined chip.
      Voice card added 2026-09-22 at the top of the Pair tab:
      custom:ada-voice-card (/local/ada-voice-card.js?v=3, repo:
      stacks/tony-dell/tony-ha/www/ada-voice-card.js) — embeds the full Ada
      Gemini Live client in the dashboard, no iframe/redirect. It ports the
      PWA transport (ada-pi pwa/app.js): getUserMedia -> ScriptProcessor
      downsamples to PCM16@16kHz over WebSocket; server PCM16@24kHz plays
      through a blob-URL AudioWorklet (PCMPlayer); JSON control messages
      (ready/transcripts/response_*/live_reconnecting/clear_audio) drive the
      status line. Connects to wss://mn01.taila0626a.ts.net/apps/ha/ada-tony/ws
      with device_id + api_key query params — websocket_authorized accepts
      the api_key param so no CORS/REST calls are needed. Key provisioning
      is automatic: on first connect the card calls script.ada_voice_key via
      hass.callWS (return_response) — the script creates-or-repairs a
      per-device issued key ha-<device8> (rest_command.ada_issue_key /
      ada_repair_key), then burns the redeem token server-side via
      rest_command.ada_voice_redeem (POST /api/auth/redeem with
      token+expect_name+device_id, NO api-key header — a caller key would
      override expect_name and fail) and returns the raw key, which the
      card caches in localStorage ada_voice_api_key. First WS connect TOFU-
      binds the key to the browser's device_id; a 4401 close (revoked /
      foreign binding) triggers one re-mint retry, then falls back to a
      paste-once unlock field. The admin key never leaves HA (secrets.yaml),
      no key sits in dashboard config (lovelace snapshots sync into this
      repo), and every browser gets its own revocable issued key visible in
      the ada-keys-card list. Mic needs HTTPS (satisfied via Tailscale
      serve :8123) and a user gesture for AudioContext (the mic-button
      tap). Card disconnects mic + socket in disconnectedCallback when the
      view is left.
    tabs:
      - title: Pair
        path: pair
        icon: mdi:qrcode-plus
        cards: issue/revoke form, pairing QR picture, redeem link, ada-keys-card, capabilities info
      - title: Events
        path: events
        icon: mdi:bell-badge-outline
        cards: chaba-events-card
      - title: Log
        path: log
        icon: mdi:history
        type: panel
        cards: chaba-log-card (full-height logbook 24h, own domain filters)
      - title: Ada Pages
        path: ada-pages
        icon: mdi:file-document-edit-outline
        type: panel
        cards: iframe → https://mn01.taila0626a.ts.net/apps/ha/ada-tony/cms/?api_key=...
          (dedicated ada-ha-tony key 'cms-viewer' on mn01; key is embedded in the
          URL because iframes can't set headers — it is revocable via the Pair
          tab. First browsing context to open the tab TOFU-binds the key; a
          second device shows the unlock prompt and needs its own key.
          Added 2026-09-22 via .storage edit + tony-ha restart.)

