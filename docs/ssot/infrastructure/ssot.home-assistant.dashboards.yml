manual_steps:
  - Edit the live Lovelace dashboard through the HA UI; the canonical source is .storage/lovelace.tony_test
  - To snapshot, copy the .storage file to docs/home-assistant/dashboards/tony-test-current.json
  - Tab order, titles, and paths are managed in the same .storage file
  - To add a new tab, edit the .storage file or use the HA UI, then snapshot

