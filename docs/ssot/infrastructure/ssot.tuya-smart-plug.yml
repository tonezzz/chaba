title: Tuya WiFi Smart Plugs + Nobito sensor
subtitle: Local TinyTuya control for two Tuye-10A sockets plus a CozyLife socket on tony-dell, and the cloud-only Nobito air sensor
version: 5
last_updated: '2026-09-26'

sections:
  - title: Devices
    icon: plug
    layout: list
    items:
      - label: Coffee plug
        text: 'ปลั๊กกาแฟ — ID a33be68c03a6886d7f21zf, IP 192.168.2.87, MAC 2c:b4:71:e8:aa:06, category cz, protocol 3.5'
      - label: Bedside plug
        text: 'ปลัฦหัวเตียง — ID a319217035be6c2d60opfg, IP 192.168.2.66, MAC 2c:b4:71:e8:a8:e8, category cz, protocol 3.5'
      - label: Fan plug (CozyLife)
        text: 'ปลั๊กพัดลม — CozyLife "Smart socket" model dRFfOO via the cozylife_local integration (not TinyTuya). Device ID 71759158249494b0f2df, MAC 24:94:94:b0:f2:df, IP 192.168.2.68. A fan is plugged into it (noted 2026-09-18). Formerly named "Cozy1".'
      - label: Network
        text: tony-omen (192.168.2.0/24)

  - title: Credential Storage
    icon: key
    layout: list
    items:
      - label: Cloud credentials
        text: "Stored in ~/.local/share/tuya/project-creds.json (Client ID, Client Secret, Project Code). The file is mode 600 and is not in the chaba git repository."
      - label: Legacy cloud credentials
        text: "Stored in ~/.local/share/tuya/credentials.json (Client ID, Client Secret, working region). Mode 600. Not in git."
      - label: Local device keys
        text: "Stored in ~/.local/share/tuya/devices.json once fetched from Tuya Cloud by TinyTuya. Mode 600. Not in git."
      - label: Python environment
        text: /home/tony/.local/share/tuya/venv (tinytuya 1.20.0) for local control and Home Assistant command_line.

  - title: Local Control
    icon: terminal
    layout: list
    items:
      - label: Control script
        text: /home/tony/.local/share/tuya/tuya-control.py
      - label: Commands
        text: "venv/bin/python tuya-control.py {coffee|bedside} [on|off|status]"
      - label: Home Assistant command_line
        text: "Configured in /home/tony/.config/home-assistant/configuration.yaml with two local switches: ปลั๊กกาแฟ Local (switch.plakkaaaef_local) and ปลัฦหัวเตียง Local (switch.plalhawetiiyng_local)"
      - label: Polling
        text: "scan_interval: 5 seconds; command_timeout: 15 seconds"
      - label: Runtime
        text: "A dedicated TinyTuya venv is installed at /config/tuya/venv inside the Home Assistant container. The control script uses a file lock (/.tuya.lock) and a last-state cache (/last-state.json) to serialize concurrent calls and avoid brief OFF mis-reads."

  - title: Current Status
    icon: activity
    layout: list
    items:
      - label: Cloud key fetch
        text: "Tuya IoT project linked to Smart Life/Cozy Life account. TinyTuya successfully retrieved both device IDs and local keys from the Singapore data center (openapi-sg.iotbing.com)."
      - label: Local status
        text: "Both plugs respond to local UDP/TCP Tuya commands. Coffee and bedside plugs both ON."
      - label: Official Tuya integration
        text: "Cloud-backed entities still present but the bedside plug entity remains stale (off). Local command_line switches are the authoritative on/off controls."
      - label: HA-MCP exposure
        text: 'ha_mcp_tools server is running on port 9584 with llm_api_exposure: full, so switch.plakkaaaef_local, switch.plalhawetiiyng_local, and camera.ip_cam_65 are exposed to the Gemini/LLM client.'
      - label: Fan plug entities
        text: 'switch.plakphadlom (main on/off, renamed from switch.cozy1 on 2026-09-18) plus cozylife_local helpers: schedule switch/time/selects, power-on-state and LED selects, IP sensor. Dashboard smart-home entities card updated in the same change. Auto-controlled by automation.coffee_corner_fan_follows_person since 2026-09-18: YOLO person detection on ip_cam_65 (Coffee Corner) turns the fan on, off 1 min after the corner clears.'

  - title: Nobito air-quality sensor (cloud-only)
    icon: air-filter
    layout: list
    items:
      - label: Device
        text: 'Nobito Tuya air monitor — cloud device_id a35dc1b618d6a2378a3tzw (tony-ha device registry). Not in devices.json: no local key, battery-powered, cloud path only.'
      - label: DP codes
        text: 'Recovered from tony-ha entity-registry unique_ids (tuya.<id><dp>): pm25_value, pm10, co2_value, temp_current, humidity_value, voc_value, ch2o_value, air_quality_index, battery_percentage, battery_state. Charted on chaba-home/Nobito: pm2_5, co2, pm10.'
      - label: Data path
        text: 'HA entities refresh ONLY on tuya config-entry setup (sharing MQ push is dead for this account) — hourly reload via tuya_entry_reload_watchdog bounds staleness to ~1h, which is why statistics look flat. Richer history lives in Tuya cloud DP report logs.'
      - label: History bridge
        text: 'scripts/home-assistant/nobito-tuya-logs.py (chaba repo): probe / list / live / fetch (DP logs -> ~/.local/share/tuya/nobito-logs/*.jsonl) / import (hourly aggregates -> recorder/import_statistics on tony-ha). Job doc: docs/ssot/jobs/home-assistant/2026-09-26-nobito-tuya-history-bridge.yml.'
      - label: Live values without subscription
        text: '`live` reads current DP values via the tuya_sharing consumer token inside the tony-ha container (entry 01M1PBMNRENWNDC93N205E0VZA, client HA_3y9q4ak7g4ephrvke) — the Smart-Life user path is unaffected by the expired trial. Verified 2026-09-26: pm25 44, pm10 51, co2 407, temp 27.2 while HA held stale 22/25/409. Device category hjjcy; unexposed DPs: pm1, co_value, charge_state. Caveat: refuses within 60s of access-token expiry (a refresh would rotate the shared refresh_token under HA).'
      - label: BLOCKED
        text: 'As of 2026-09-26 the developer project IoT Core trial subscription is EXPIRED — every OpenAPI call returns code 28841002. Renewal is a console click (iot.tuya.com -> Cloud -> Cloud Services -> Extend trial). Runbook: ssot.home-assistant.howto.yml -> tuya_iot_core_trial_renewal.'

  - title: Next Steps
    icon: arrow-right
    layout: list
    items:
      - label: Dashboard
        text: "Replace stale cloud switch cards with the new local entities in Home Assistant dashboards."
      - label: HA-MCP exposure
        text: "Verify ha_mcp_tools exposes switch.plakkaaaef_local and switch.plalhawetiiyng_local to Gemini/bridge clients."
      - label: Nobito history
        text: "Renew IoT Core trial, then run nobito-tuya-logs.py fetch + import to backfill statistics; reassess the Nobito chart min/scale once real ranges land."

