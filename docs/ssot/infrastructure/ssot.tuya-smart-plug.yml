  - title: Credential Storage
    layout: list
    items:
      - label: Cloud credentials
        text: 'Stored in ~/.local/share/tuya/credentials.json (Client ID, Client Secret, working region). The file is mode 600 and is not in the chaba git repository.'
      - label: Local device keys
        text: 'Stored in ~/.local/share/tuya/devices.json once fetched from Tuya Cloud. Generated by /tmp/tuya-fetch.py. Not in git.'
      - label: Python environment
        text: /tmp/tuya-venv (tinytuya 1.20.0) for local testing; replace with a persistent venv or container if promoted to a service.

  - title: Current Status
    layout: list
    items:
      - label: Discovery
        text: Device found via UDP broadcast on 192.168.2.70 (protocol 3.4).
      - label: Cloud key fetch
        text: Credentials are valid, but the Tuya IoT project data center is not enabled for the working region. Fetching local keys is blocked until the data center is enabled and the Smart Life account is linked.

  - title: Next Steps
    layout: list
    items:
      - label: Enable data center
        text: In the Tuya IoT Cloud project, go to Cloud > Development and enable the data center that matches the Smart Life account region (likely Singapore for Thailand).
      - label: Link Smart Life account
        text: In the project, go to Devices > Link Tuya App Account, then scan the QR code with the Smart Life app.
      - label: Fetch local keys
        text: 'Run: /tmp/tuya-venv/bin/python /tmp/tuya-fetch.py'
      - label: Test control
        text: 'Turn on/off with: /tmp/tuya-venv/bin/tinytuya on --name <plug-name> and /tmp/tuya-venv/bin/tinytuya off --name <plug-name>'

