        text: Done — the AisMN_5G PSK is now in the secure wifi JSON.
      - label: mn-home speed test
        text: Run a quick download test and record it in the wifi JSON.
      - label: michael-host scan
        text: Done — 58 active 192.168.1.x hosts confirmed and ssot.ip-address-registry.michael.yml updated 2026-09-13.
