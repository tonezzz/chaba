        text: SSID TONY-IP or USB enx, DHCP /28, fallback metric 100. Password tonytony. See ssot.tony-omen-multi-wan.yml.
        status: fallback
      - label: Albatros Rooms
        text: SSIDs Albatros Rooms_2.4G / Albatros Rooms_5G, passwords in wifi JSON.
        status: saved
      - label: Maesang place07
        text: SSID Maesang place07, password in wifi JSON.
