  - title: Service Access Rules
    icon: "🔌"
    layout: list
    items:
      - label: Same-network local
        text: On tony-home (192.168.2.0/24) use .local names and local IPs — tony-omen, tony-dell, tony-ha (port 8123), michael-dev (port 8124), mddb, postgres, etc.
      - label: On mn-home or other trusted Wi-Fi
        text: Local 192.168.1.x is Michael's network. Reach tony-omen/tony-dell services via Tailscale or their public funnel URLs. Use michael-ha via Tailscale (michael-ha) or Nabu Casa cloud.
      - label: Public / internet access
        text: tony-dell public funnel and Caddy endpoints (https://tony-dell.taila0626a.ts.net) and the michael-ha Nabu Casa URL are reachable from any internet-connected network.
      - label: Tailscale everywhere
        text: tailnet hostnames (tony-omen, tony-dell, michael-ha) and 100.x IPs work across all networks as long as Tailscale is connected.

  - title: Credential Storage
    icon: "🔐"
    layout: list
    items:
      - label: Wi-Fi passwords
        text: Stored in ~/.local/share/wifi/tony-omen-networks.json (mode 600) and in NetworkManager connection secrets. Not in git or SSOT.
      - label: Tailscale
        text: Logged in as the same tailnet user on tony-omen, tony-dell, and mobile devices.
      - label: Home Assistant tokens
        text: In per-service env files under ~/.config/secrets/ — not in SSOT.

  - title: Switching Networks
    icon: "🔄"
    layout: list
    items:
      - label: nmcli connect
        text: nmcli c up '<ConnectionName>'; verify with nmcli c show --active and ip route.
      - label: route check
        text: ip -4 route show default; ensure desired interface has the lowest metric.
      - label: iPhone fallback
        text: Bluetooth connect to TONY-IP triggers iOS Shortcut to enable hotspot; then connect to TONY-IP Wi-Fi or use enx USB tether.

  - title: Next Steps
    icon: "➡️"
    layout: list
    items:
