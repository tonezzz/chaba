title: Network Access & Service Reachability
subtitle: How to connect to each known network and which services are reachable from it
icon: "🌐"

ideas:
  - One SSOT for network profiles, access methods, and service reachability rules.
  - Passwords are not stored here; they live in NetworkManager or ~/.local/share/wifi/tony-omen-networks.json.
  - Tailscale is the default fallback when local (.local) hostnames do not resolve.

