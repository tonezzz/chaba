- id: wp-nest-job-cpt
  name: WP nest_job CPT registered
  type: http
  url: 'https://boards.surf-thailand.com/wp/index.php?rest_route=/wp/v2/nest_job&per_page=1'
  expected_status: 200
  timeout: 15
  category: web
  profiles:
  - home
  - mobile
  host: cloud
  note: "chaba-boards plugin drift detector (added 2026-10-26, card
    repair-wp-nest-job-cpt-drift). A registered CPT answers 200 (empty
    list anonymously — private posts stay hidden); an unregistered route
    answers 404 rest_no_route, which is exactly how board-api POST /job
    failed before the v0.9.0 deploy."
  verification:
  - 'List registered CPTs: curl -s https://boards.surf-thailand.com/wp/index.php?rest_route=/wp/v2/types | jq keys'
  - 'Compare against the CPT list in integrations/wp-boards/chaba-boards.php'
  recovery_actions:
  - 'Redeploy plugin: integrations/wp-boards/dist/chaba-boards-<ver>.zip via scripts/wp-boards/deploy-plugin-zip.sh on tony-omen (wp-admin upload; Tony gate)'
  - 'If version matches but CPT missing: check wp-admin Plugins for chaba-boards active state + PHP errors'

- id: wp-activity-cpt
  name: WP activity CPT registered
  type: http
  url: 'https://boards.surf-thailand.com/wp/index.php?rest_route=/wp/v2/activity&per_page=1'
  expected_status: 200
  timeout: 15
  category: web
  profiles:
  - home
  - mobile
  host: cloud
  note: "Sibling drift detector — activity CPT (chaba-boards v0.8.0) feeds
    scripts/ada/activity-posts.py on idc03; a 404 means the plugin
    regressed below v0.8.0 and that writer's POSTs are failing."
  verification:
  - 'curl -s https://boards.surf-thailand.com/wp/index.php?rest_route=/wp/v2/types | jq keys'
  recovery_actions:
  - 'Same as wp-nest-job-cpt — redeploy the current chaba-boards zip'
