    family: Gemini 3
    category: Live API
    free_tier:
      status: unverified
      rpm: null
      tpm: 20000
      rpd: null
    status: available
    notes: >-
      Continuous speech-to-speech translation, 70+ languages. Audio-only input,
      no tools and no text input — an interpreter, not a reasoning agent.
      Official API ID verified in the v1beta catalog 2026-11-24; the previous
      gemini-3.5-live-translate key was stale. Use constrained ephemeral tokens
      for browser clients (BidiGenerateContentConstrained?access_token=).
      tpm snapshot is from the 2026-08-15 AI Studio dashboard.
    last_verified: "2026-11-24"
