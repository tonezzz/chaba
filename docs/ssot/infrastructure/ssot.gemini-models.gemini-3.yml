  gemini-3.8-live:
    display_name: Gemini 3.8 Live
    api_name: gemini-3.8-live
    family: Gemini 3
    category: Live API
    free_tier:
      status: unverified
    status: available
    primary_for:
      - rview-live
    notes: >-
      Sole primary for the rview-live Live-voice job since 2026-11-24 and the
      runtime default since 2026-11-25 (job 2026-11-24-gemini-38-live-eval).
      Emits an early turnComplete with tool calls, then a final spoken turn
      after toolResponse — clients must not treat the first completion as the
      end. The rview-live app itself was retired 2026-10-07; this job key
      remains the registry's Live-voice label until it is renamed.
      Live websockets do not transit the LiteLLM gateway.
    last_verified: "2026-11-25"
  gemini-3.8-live-extended-thinking:
    display_name: Gemini 3.8 Live Extended Thinking
    api_name: gemini-3.8-live-extended-thinking
    family: Gemini 3
    category: Live API
    free_tier:
      status: unverified
    status: available
    notes: >-
      High-reasoning Live API variant with interactionStatus IN_PROGRESS / IDLE
      and asynchronous tool calls. Pilot only on tool-heavy diagnostic sessions.
      Benched 2026-11-26 vs the 3.8-live pin (job
      2026-11-26-gemini-38-live-extended-thinking-eval): 20/20 fixtures, WER
      tied, slightly better tool coverage, but ~75% slower round-trip and a
      mandatory thinkingLevel + NON_BLOCKING-tools protocol — pin unchanged.
    last_verified: "2026-11-26"
