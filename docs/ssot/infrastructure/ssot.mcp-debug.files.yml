title: MCP-Debug File and Clipboard Bridge
subtitle: Design and policy for remote file get/put and optional clipboard tools
version: 1

purpose:
  - Extend mcp-debug with small, auditable file-transfer tools.
  - Allow the assistant to fetch remote logs/configs and push small scripts without leaving the MCP workflow.
  - Keep clipboard support experimental and disabled by default.

tools:
  mcp_get_file:
    description: Fetch a remote file as base64 with a hard size cap.
    input:
      host: target host (must be in allowed host list)
      path: absolute or home-prefixed file path
      max_bytes: optional, default 65536, hard cap 1048576
    output:
      ok: true | false
      path: resolved path
      encoding: base64
      content_base64: base64-encoded bytes
      size: bytes read
      truncated: true if file was larger than max_bytes
      error: error message if ok is false
    transport: |
      SSH exec with `cat` or `head -c <max_bytes>` depending on size, then base64-encode the payload.
    security:
      - path must match one allowed_path_prefix for the host
      - max_bytes cannot exceed hard cap
      - all calls logged with host, path, size, truncated flag
      - reads outside allowlist are rejected

  mcp_put_file:
    description: Write a small script or config to a remote host as base64.
    input:
      host: target host (must be in allowed host list)
      path: absolute or home-prefixed file path
      content_base64: base64-encoded file content
      mode: optional file mode, default "644" (octal string)
      overwrite: optional, default false
    output:
      ok: true | false
      path: resolved path
      bytes_written: number of bytes written
      error: error message if ok is false
    transport: |
      SSH exec with a heredoc after path-allowlist vetting. File is written to a temp path and atomically moved.
    security:
      - path must match one allowed_path_prefix for the host
      - size cannot exceed hard cap (1 MiB)
      - overwrite=false by default; confirmation required for writes outside allowlist
      - all calls logged with host, path, size, mode, overwrite
      - writes to paths outside allowlist are rejected

  mcp_eget:
    description: Install or download a prebuilt binary from GitHub/GitLab/Gitea/SourceForge using eget.
    input:
      host: target host (must be in allowed host list)
      repo: source repository or URL, e.g. 'BurntSushi/ripgrep'
      to: target directory (must match an allowed_path_prefix), default ~/.local/bin
      tag: optional release tag
      asset: optional asset filter
      extract_all: extract all archive files
      download_only: use 'eget download' instead of 'eget install'
    output:
      ok: true | false
      h: host
      rc: eget exit code
      out: stdout
      err: stderr
      error: error message if ok is false
    transport: SSH exec; command is 'eget install <repo> --to <allowed_path> ...'
    security:
      - target path is vetted against the host's allowed_path_prefixes
      - all arguments are shlex-quoted
      - no sudo required

  mcp_clipboard_get:
    description: Read the target host's clipboard as text.
    status: experimental
    default: enabled
    transport: macOS `pbpaste`; Linux `xclip -selection clipboard -o` or `wl-paste`
    security:
      - per-host opt-in only
      - host must have clipboard: true in ssot.mcp-debug.capture.yml
      - all calls logged

  mcp_clipboard_set:
    description: Write text to the target host's clipboard.
    status: experimental
    default: enabled
    transport: macOS `pbpaste`; Linux `xclip -selection clipboard -i` or `wl-copy`
    security:
      - per-host opt-in only
      - host must have clipboard: true in ssot.mcp-debug.capture.yml
      - all calls logged

files:
  # mcp_files_* — structured read-only filesystem tools (card
  # mcp-structured-files-tool / OPS-0961). Server-side vetting reuses
  # limits.allowed_path_prefixes as the per-host allowlist; the shipped
  # agent (scripts/mcp_debug/files_agent.py) re-verifies after realpath
  # resolution, never descends into symlinks, and flags link_escape on
  # entries whose targets leave the allowlist.
  tools:
    mcp_files_list:
      description: List one directory level as stable JSON entries.
      input: host, path, pattern?, max_entries?, sort?, order?
    mcp_files_stat:
      description: Stat a single path; entries has exactly one item.
      input: host, path
    mcp_files_search:
      description: Recursive fnmatch search under a path.
      input: host, path, pattern, depth?, max_entries?, sort?, order?, kind?
    mcp_files_tree:
      description: Pre-order directory tree with per-entry depth.
      input: host, path, depth?, max_entries?, sort?, order?, kind?, pattern?
  output_schema:
    envelope: ok, tool, host, root, resolved_root, entries, truncated, truncated_reason, errors, errors_truncated, observed_at, counts, scanned, depth, pattern, sort, order
    entry: name, relative_path, kind, size_bytes, mtime, mode (+depth, +link_target/link_escape on symlinks)
    kinds: [file, dir, symlink, other]
    mtime: epoch seconds (int)
    mode: 4-digit octal string
    format: >-
      objects (default) = entries as objects per entry schema above.
      rows (opt-in) = same fields positionally: envelope gains
      fields[...] declaring column order and entries becomes rows of
      values — ~55-65% smaller payload for bulk listings.
  security:
    - path must normalize under limits.allowed_path_prefixes for the host (server-side check + remote realpath re-check)
    - dot-dot segments, NUL bytes, and non-absolute paths are rejected
    - symlinks are never descended; link_escape entries are flagged and recorded in errors
    - entries/depth/output caps below are enforced remotely; hard values cannot be raised by callers
    - read-only: no writes, no deletes; mcp_raw stays gated behind raw_commands.allowed_prefixes
  limits:
    max_entries:
      default: 500
      hard: 5000
    max_depth:
      default: 3
      hard: 12
    max_output_bytes:
      default: 196608
      hard: 524288
    max_errors:
      default: 50
      hard: 200
    max_scan:
      hard: 200000
    path_length:
      hard: 1024

limits:
  max_bytes:
    hard: 1048576
    default: 65536
  default_get_bytes: 65536
  max_path_length: 1024
  allowed_modes: ["400", "600", "644", "664", "755"]
  allowed_path_prefixes:
    tony_omen:
      - /tmp
      - /home/tony/.local
      - /home/tony/.config
      - /home/tony/CascadeProjects/chaba-tony-dell
      - /home/tony/CascadeProjects/chaba-h3
      - /home/tony/CascadeProjects/chaba-kbman
      - /var/log
    tony_dell:
      - /tmp
      - /home/tony/.local
      - /home/tony/.config
      - /home/tony/CascadeProjects/chaba-tony-dell
      - /home/tony/CascadeProjects/chaba-h3
      - /home/tony/CascadeProjects/chaba-kbman
      - /var/log
    macbook:
      - /tmp
      - /home/tony
      - /var/log

logging:
  level: info
  fields:
    - timestamp
    - tool
    - host
    - path
    - size
    - truncated
    - overwrite
    - ok

