implementation_notes:
- Implemented in scripts/mcp_debug/focus.py and scripts/mcp_debug/server.py.
- Shared focus model helpers (triage scoring, safe-to-parallel/ownership/lock checks, active/backlog/inbox extraction, sweep)
  live in scripts/focus_common.py and are imported by scripts/mcp_debug/focus.py, scripts/focus_dispatcher/triage.py, and
  scripts/prompt_preprocessor.py.
- mcp_focus supports mode=status (read-only active/Quick Wins listing), mode=recommend (decision tree), mode=technical_decision,
  and mode=session_summary.
- The recommend decision tree maps directly to the assistant-level cases in docs/ssot/ssot.focus.current.yml#decision_tree.
- mcp_focus appends a decision record to docs/ssot/ssot.focus.decisions.yml whenever a request is provided.
- mcp_focus mode=technical_decision appends to docs/ssot/decisions/ssot.technical-decisions.yml.
- mcp_focus mode=session_summary appends to docs/ssot/ssot.focus.sessions.yml.
- The assistant uses the returned action as the first disposition and only deviates for special cases (live_bug_report, auto_generated_alert,
  requires_mcp_data).
improvements:
- id: mcp-focus-2026-08-23
  title: Streamline mcp_focus behavior and observability
  status: in_progress
  items:
  - label: Stop automatic decision logging on every recommend
    text: Make recommend read-only by default; only log decisions when mode=technical_decision or an explicit confirm flag
      is passed.
    status: completed
    priority: high
  - label: Make mcp_focus_status a cheap read-only call
    text: Ensure status and reload modes never write to ssot.focus.decisions.yml.
    status: completed
    priority: high
  - label: Cache SSOT reads with mtime invalidation
    text: Keep parsed YAML in memory; trust mtime for staleness; use reload to force re-read.
    status: completed
    priority: medium
  - label: Improve empty/no-match triage
    text: Use priority and triage_score for parked/deferred items, not just backlog keyword matches.
    status: completed
    priority: medium
  - label: Add cross-worktree context
    text: Read ssot.workspaces.yml / ssot.host-roles.yml to include worktree/branch state in recommendations.
    status: completed
    priority: medium
  - label: Add next preview and confirm gate
    text: Return the candidate before activating; only write SSOT on confirm=true.
    status: completed
    priority: low
  - label: Expand stale warnings
    text: Detect completed without completed_at, long-parked foci, active with no recent session, and invalid status values.
    status: completed
    priority: low
  - label: Compact active_file_state output
    text: Only include non-closed foci in active_file_state to reduce payload size.
    status: completed
    priority: low
  - label: Add done-for-the-day mode
    text: Provide a mode that tells the user whether all open foci are closed.
    status: completed
    priority: low
  - label: Add live worktree dirty state
    text: Check git status --short for each declared worktree and include dirty boolean in status output.
    status: completed
    priority: low
end_to_end_flow:
  sources:
  - label: Active focuses
    file: docs/ssot/ssot.focus.current.active.yml
  - label: Backlog, quick wins, and Ready (Safe)
    file: docs/ssot/ssot.focus.current.backlog.yml
  - label: Full backlog and focus history
    file: docs/ssot/ssot.focus.yml
  - label: Unprocessed ideas
    dir: docs/ssot/focus-inbox
  runtime:
  - component: mcp_focus MCP server
    file: scripts/mcp_focus/server.py
    reads: [docs/ssot/ssot.focus.current.active.yml, docs/ssot/ssot.focus.current.backlog.yml,
            docs/ssot/ssot.focus.yml, docs/ssot/focus-inbox]
    writes: []
    notes: Read-only recommendation router (except defer/sweep/next/technical_decision/session_summary).
  - component: focus-dispatcher CLI
    file: scripts/focus-dispatcher.py
    reads: [docs/ssot/ssot.focus.current.active.yml, docs/ssot/ssot.focus.current.backlog.yml,
            docs/ssot/ssot.focus.yml, docs/ssot/focus-inbox]
    writes: [docs/ssot/ssot.focus.current.active.yml, docs/ssot/ssot.focus.current.backlog.yml,
             docs/ssot/ssot.focus.yml, reports/NEXT_FOCUS.md, reports/SUBAGENT_CONTRACT.md]
    notes: Mutation path for activation, safe-dispatch, and Ready (Safe) processing.
  - component: overnight review
    file: scripts/overnight-focus-review.py
    triggered_by: focus-dispatcher-overnight.timer
    status_file: /home/tony/var/chaba/overnight-status.json
    notes: Runs daily at 03:00, writes a JSON status summary, and can optionally process Ready (Safe) contracts when OVERNIGHT_PROCESS_READY=1.
  - component: overnight status reader
    file: scripts/overnight-status.py
    reads: [/home/tony/var/chaba/overnight-status.json]
  - component: smoke tests
    file: scripts/test-focus-smoke.py
    notes: Read-only smoke tests for mcp_focus and focus-dispatcher.
  ready_safe_handoff:
    step_1: focus-dispatcher --safe-dispatch (or --auto-process) promotes a safe-to-parallel item into the Ready (Safe) section.
    step_2: focus-dispatcher --process-ready or --process-all-ready locks the item, sets owner=focus-dispatcher, session=dispatch-<host>, and writes a SUBAGENT_CONTRACT.md.
    step_3: The assistant/user manually invokes the printed run_subagent JSON.
    step_4: The subagent executes the contract and updates subtask status in docs/ssot/ssot.focus.current.backlog.yml.
    step_5: The main session reviews the subagent result and commits/pushes when satisfied.
    note: Contracts generated during the overnight run are written with FOCUS_DISPATCHER_COMMIT=0 / FOCUS_DISPATCHER_PUSH=0 so they are not pushed before the subagent completes.
