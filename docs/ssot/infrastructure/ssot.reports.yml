title: Layered Reporting Standard
subtitle: Memory-system report hierarchy — raw artifacts up through layers to the system overview
icon: 📊
version: 1

overview:
  purpose: >
    Declared standard for turning raw operational data into a single human
    overview — layered hierarchy L0 raw → L1 producer → L2 domain → L3
    SYSTEM-REPORT.md; digests are never hand-written. `nodes` is declared
    intent; each node's meta.yml is observed state.

config:
  version: 1
  last_updated: "2026-10-05"
  maintainer: tony
  status: active
  origin: >
    Session flannel-surf plan v2 (2026-09-26): "a new standard for our
    memory system — from raw logs/data up by layers until to overview",
    timeline stored outside the repo.

layers:
  L0-raw:
    description: >
      Append-only artifacts — snapshots, logs, JSONL. Never edited, never
      summarized in place; corrections are new artifacts, not rewrites.
    examples:
      - reports/audit-hosts/<host>-<ts>.yml
      - ~/var/chaba/health/*.json
      - per-audit stdout captured in reports/audits/summary.json
  L1-producer:
    description: >
      Per-generator rollup — one node per host, per audit group, per feed.
      Carries a meta.yml so upper layers can read status without parsing
      raw artifacts.
    examples:
      - audit-hosts/<host>
      - health-monitor
      - report-feed
  L2-domain:
    description: >
      Cross-producer rollup per domain — fleet, audit suite, memory, jobs,
      attention. Rendered from its children's meta/artifacts.
    examples:
      - fleet (reports/fleet/FLEET-REPORT.md — planned)
      - audit-suite (reports/audits/summary.{json,md} — the template)
      - ada-memory-report (planned)
      - overnight-assessment
  L3-overview:
    description: >
      Single human digest — reports/SYSTEM-REPORT.md rendered by
      scripts/report-system.py from the node registry. Missing and stale
      nodes are first-class output, not silence.
    examples:
      - system-report

placement:
  description: >
    Canonical content lives in the repo (docs/, docs/ssot/ — versioned,
    reviewed, durable); CMS pages (ada-cms-pages) are generated outputs
    that link back to their repo source via meta.sources/links.
  rule: 'who needs this in 30 days? Ada speaks it / operational state -> CMS;
    Devin/human needs reasoning, spec, decision -> repo. Both -> repo
    canonical, CMS summarizes + links back.'
  repo: durable truth — architecture, assessments, decisions, runbooks; changes are commits
  cms: operational memory — reports, digests, incidents, live status; TTL'd,
    regenerated, disposable; a page restating repo knowledge must link it

format_rules:
  machine_artifacts: yml / json / jsonl for anything parsed downstream — stable keys, no prose; jsonl only for append-only streams
  digests: .md only for generated digests — never hand-edit; fix the generator or the source data
  meta_location: meta.yml in the node's output dir; meta.<slug>.yml when several nodes share a dir
  timeline_location: ~/var/chaba/reports/timeline.jsonl (outside the repo — it grows forever), overridable via CHABA_REPORTS_DIR

meta_schema:
  description: >
    One meta.yml per node, written by its generator at run end;
    scripts/lib/report.py::write_meta() is the canonical writer.
  fields:
    node: registry id (e.g. audit-hosts/tony-dell)
    layer: one of the layers above
    purpose: one line — what question this report answers
    generated_by: the exact command that produced it
    generated_at: ISO-8601 with timezone
    status: one of status_enum below
    summary: one line — the headline finding
    sources: artifacts consumed this run (paths or names)
    children: node ids rolled up into this one (L1/L2/L3 only)
    inputs_at: "map child_id -> the child generated_at this render
      consumed; the refresh graph diffs it against current child
      generated_at to detect drift (scripts/report/run-node.py writes
      it after each run)"
    pending: "list of queued refresh requests {requested_at, by, reason,
      depth} — the per-page update list (docs/design/report-live-refresh.md);
      written via lib/report.py::pending_add/pending_clear, carried
      forward by write_meta"
    extra: free-form map for node-specific details (deltas, counts, scores)

status_enum:
  ok: generated within cadence; no findings
  delta: generated; findings present (observed != expected)
  stale: last_run older than the node's declared cadence
  error: generator failed or meta unreadable
  missing: declared node with no meta and no artifacts
  untracked: artifacts exist but no meta.yml yet (legacy producer)
  remote: declared active, artifacts live off-repo — not observable locally
  planned: registered but generator not built yet — informational, not an alarm

timeline:
  path: ~/var/chaba/reports/timeline.jsonl
  env_override: CHABA_REPORTS_DIR
  format: >
    One JSON object per line appended by each generator (append_timeline);
    SYSTEM-REPORT.md renders only the last ~20 events.
  event_fields:
    ts: ISO-8601 with timezone
    node: registry id
    layer: L0|L1|L2|L3
    status: one of status_enum
    summary: one line
    ref: path to the primary artifact produced (optional)
  example: '{"ts":"2026-09-26T18:45:00+07:00","node":"fleet","layer":"L2","status":"delta","summary":"idc01: 2 missing critical","ref":"reports/fleet/FLEET-REPORT.md"}'

nodes:
  # --- Fleet domain ---
  - id: audit-hosts/tony-dell
    layer: L1-producer
    purpose: Host snapshot + delta vs expected services/resources
    generator: scripts/audit-hosts.py --host tony-dell
    cadence: 24h
    output: reports/audit-hosts
    artifact_pattern: "tony-dell-*.yml"
    meta: reports/audit-hosts/meta.tony-dell.yml
    references:
      - docs/ssot/infrastructure/ssot.audit.hosts.yml
    children: []
  - id: audit-hosts/tony-omen
    layer: L1-producer
    purpose: Host snapshot + delta vs expected services/resources
    generator: scripts/audit-hosts.py --host tony-omen
    cadence: 24h
    output: reports/audit-hosts
    artifact_pattern: "tony-omen-*.yml"
    meta: reports/audit-hosts/meta.tony-omen.yml
    references:
      - docs/ssot/infrastructure/ssot.audit.hosts.yml
    children: []
  - id: audit-hosts/mn01
    layer: L1-producer
    purpose: Host snapshot + delta vs expected services/resources
    generator: scripts/audit-hosts.py --host mn01
    cadence: 24h
    output: reports/audit-hosts
    artifact_pattern: "mn01-*.yml"
    meta: reports/audit-hosts/meta.mn01.yml
    references:
      - docs/ssot/infrastructure/ssot.audit.hosts.yml
    children: []
  # audit-hosts/idc01 retired 2026-10-07 — host retired; its residual rot
  # (missing timers, dead ada-* services) is a decommission checklist,
  # not standing signal. Re-add the node if idc01 returns to service.
  - id: audit-hosts/macbook
    layer: L1-producer
    purpose: Host snapshot (macOS) — services via launchctl
    generator: scripts/audit-hosts.py --host macbook
    cadence: 24h
    output: reports/audit-hosts
    artifact_pattern: "macbook-*.yml"
    meta: reports/audit-hosts/meta.macbook.yml
    offline_ok: true   # laptop — sleeps/off-net is normal, not an outage
    references:
      - docs/ssot/infrastructure/ssot.audit.hosts.yml
    children: []
  - id: health-monitor
    layer: L1-producer
    purpose: Continuous tony-dell health snapshots (JSON, ~5 min cycle)
    generator: scripts/tony-dell-monitor.sh via scripts/tony-dell-monitor.timer
    cadence: 1h
    output: ~/var/chaba/health
    artifact_pattern: "*.json"
    meta: ~/var/chaba/health/meta.yml
    references:
      - docs/ssot/infrastructure/ssot.tony-dell-monitoring.yml
    children: []
  - id: route-health/tony-dell-web
    layer: L1-producer
    purpose: Edge route probes from ssot.routes.yml — dead-upstream tripwire
    generator: scripts/check-routes.py --write
    cadence: 5m
    output: stacks/web/public/apps
    artifact_pattern: route-health.json
    meta: reports/route-health/meta.tony-dell-web.yml
    references:
      - docs/ssot/infrastructure/ssot.routes.yml
    children: []
  - id: host-loads
    layer: L1-producer
    purpose: Lightweight fleet load/mem/disk sampler (one SSH probe per host,
      piggybacked on tony-dell-monitor's ~5-min cycle); feeds the Host loads
      section of the system report — fresher than audit-hosts snapshots
    generator: scripts/host-loads.py via tony-dell-monitor.service
    cadence: 30m
    output: reports/host-loads
    artifact_pattern: "host-loads.yml"
    meta: reports/host-loads/meta.host-loads.yml
    references:
      - docs/ssot/infrastructure/ssot.audit.hosts.yml
    children: []
  - id: disk-trend
    layer: L1-producer
    purpose: Per-host df trend — SSH samples to ~/var/chaba/health/disk-trend.jsonl,
      least-squares slope over 7d window; disk-auto-* kanban cards + push when a
      mount is >=90% or forecast to fill <=7d; flags top-grower dirs (du watchlist)
    generator: scripts/ada/disk-trend-watch.py via kanban-sync.timer (15 min)
    cadence: 1h
    output: reports/disk-trend
    artifact_pattern: "disk-trend.yml"
    meta: reports/disk-trend/meta.disk-trend.yml
    references:
      - docs/ssot/infrastructure/ssot.audit.hosts.yml
      - docs/ssot/jobs/infrastructure/2026-10-05-disk-trend-watch.yml
    children: []
  - id: fleet
    layer: L2-domain
    purpose: Cross-host rollup — delta trend + resource min/max over window
    generator: scripts/audit-hosts.py --consolidate
    cadence: 24h
    output: reports/fleet
    meta: reports/fleet/meta.yml
    children:
      - audit-hosts/tony-dell
      - audit-hosts/tony-omen
      - audit-hosts/mn01
      - audit-hosts/idc01
      - audit-hosts/macbook
      - health-monitor
      - host-loads
      - disk-trend
  # --- Audit domain ---
  - id: audit-suite
    layer: L2-domain
    purpose: Normalized PASS/WARN/FAIL verdicts for all registered audits
    generator: node scripts/audits/run.mjs
    cadence: 7d
    output: reports/audits
    artifact_pattern: "summary.json"
    meta: reports/audits/meta.yml
    references:
      - docs/ssot/infrastructure/ssot.audit.yml
    children: []
    note: >
      Per-audit L1 children are the groups declared in ssot.audit.yml —
      referenced there instead of duplicated here.
  # --- Memory domain ---
  - id: memory-suite
    layer: L1-producer
    purpose: Ada memory-bank health — registry/MDDB drift, vault, NLM routing
    generator: node scripts/audits/memory-banks-audit.mjs (emits meta directly; also runs via run.mjs)
    cadence: 7d
    output: reports/audits
    artifact_pattern: "summary.json"
    meta: reports/audits/meta.memory-suite.yml
    references:
      - docs/ssot/infrastructure/ssot.audit.yml
    children: []
  - id: ada-memory-report
    layer: L2-domain
    purpose: Bank health + recall-canary score + NLM routing rollup
    generator: planned — renders from memory-suite + recall-canary results
    cadence: 24h
    output: reports/memory
    meta: reports/memory/meta.yml
    state: planned
    children:
      - memory-suite
  # --- Jobs domain ---
  - id: overnight-assessment
    layer: L2-domain
    purpose: Nightly job rollup — health areas, log analysis, per-job status
    generator: python3 scripts/orchestrate.py --workflow overnight
    cadence: 24h
    output: reports
    artifact_pattern: "overnight-assessment-*.md"
    meta: reports/meta.overnight-assessment.yml
    references:
      - docs/ssot/infrastructure/ssot.orchestration.overnight.yml
    children: []
  - id: systemwide-assessment
    layer: L2-domain
    purpose: Joint Ada+Devin systemwide assessment — Ada's memory/tool findings + Devin's audit/registry/SSOT state merged into one shared report
    generator: >
      manual — Ada+Devin joint session publishes CMS page
      'chaba-systemwide-assessment' in ada-cms-pages;
      scripts/ada/cms-report-reflect.py --slug chaba-systemwide-assessment
      --node systemwide-assessment mirrors page -> meta + md snapshot
      (chaba-cms-reflect.timer)
    cadence: 7d
    output: reports
    artifact_pattern: "chaba-systemwide-assessment-*.md"
    meta: reports/meta.systemwide-assessment.yml
    references:
      - docs/ssot/apps/ssot.apps.ada-testing.yml
    children:
      - audit-hosts/tony-dell
      - audit-hosts/tony-omen
      - audit-hosts/mn01
      - audit-hosts/macbook
      - memory-suite
  # --- Card CI domain ---
  - id: ci-pipeline
    layer: L1-producer
    purpose: Per-card CI pipeline runs — stage results + benchmark before/after (docs/ssot/ssot.ci.yml)
    generator: scripts/ci/card-pipeline.py <card-id>
    cadence: per card run
    output: reports/ci
    artifact_pattern: "*.json"
    meta: reports/ci/meta.yml
    references:
      - docs/ssot/ssot.ci.yml
      - docs/ssot/kanban/ssot.kanban.yml
    children: []
  # --- Kanban domain ---
  - id: kanban
    layer: L2-domain
    purpose: Board health — column counts, action/dispatch throughput,
      open requests, stale review lane
    generator: scripts/board/kanban-stats.py via kanban-sync.timer
    cadence: 15m
    output: reports/kanban
    artifact_pattern: "kanban-stats.yml"
    meta: reports/kanban/meta.yml
    references:
      - docs/ssot/kanban/ssot.kanban.yml
    children: []
    note: >
      Rides kanban-sync.timer inside the chaba-kanban-sync worktree and
      mirrors meta + stats + the system-report data/kanban.md rollup
      into the served chaba-tony-dell checkout (dual-root pattern, same
      as report-system.py). Observable on tony-dell checkouts; renders
      as missing from checkouts on other hosts.
  # --- Attention domain ---
  - id: focus-inbox
    layer: L1-producer
    purpose: Unprocessed attention items — alert ymls written by audits/monitors
    generator: multiple producers (run.mjs, audit-watchdog, mcp-health-snapshot)
    output: docs/ssot/focus-inbox
    artifact_pattern: "*.yml"
    meta: reports/meta.focus-inbox.yml
    references:
      - docs/ssot/infrastructure/ssot.focus.triage.yml
    children: []
    note: L2 attention section is rendered inside SYSTEM-REPORT.md directly.
  # --- Remote producers ---
  - id: report-feed
    layer: L1-producer
    purpose: chaba-home Report tab JSON feed (focus + ada-review + ops events)
    generator: scripts/chaba/render-report-feed.py --host tony-dell (runs on tony-omen)
    cadence: 1h
    observe: remote
    output: tony-dell HA www /local/chaba-report.json
    meta: reports/meta.report-feed.yml
    children: []
  # --- Briefing domain ---
  - id: daily-brief
    layer: L2-domain
    purpose: Twice-daily rollup for Tony — morning edition = overnight
      results (dispatches since 19:00, new cards, red flags, top open
      requests); evening edition = day's completions + "what still needs
      you before tomorrow" (unanswered requests, stale review, failed
      dispatches). The meta/CMS summary line must answer "what needs me?"
    generator: python3 scripts/report-daily-brief.py --edition auto
    cadence: 12h
    output: reports/daily-brief
    artifact_pattern: "DAILY-BRIEF-*.md"
    meta: reports/meta.daily-brief.yml
    references:
      - docs/ssot/kanban/ssot.kanban.yml
      - docs/ssot/apps/ssot.apps.ada-cms-reports.yml
    children:
      - health-monitor
      - focus-inbox
  # --- Overview ---
  - id: system-report
    layer: L3-overview
    purpose: Single human digest across all domains; makes absence loud
    generator: scripts/report-system.py
    cadence: 24h
    output: reports
    meta: reports/meta.system-report.yml
    children:
      - fleet
      - audit-suite
      - ada-memory-report
      - overnight-assessment
      - kanban
      - focus-inbox
      - daily-brief

schedule:
  system_report:
    timer: systemd/chaba-system-report.timer
    service: systemd/chaba-system-report.service
    frequency: daily at 06:45 (after overnight producers)
    status: installed on tony-dell (2026-09-27); the service runs the full
      chain — per-host audit-hosts snapshots -> --consolidate fleet L2 ->
      report-system.py L3
  daily_brief:
    timer: job:daily-brief in ssot.jobs.yml (one timer, twice daily)
    frequency: 07:05 + 19:05 (morning run lands after the 06:45 system
      report and overnight producers; edition auto-picked by hour)
    status: units rendered via render-jobs.py; install with
      `python3 scripts/render-jobs.py --host tony_dell --install`

plan:
  current_state:
    - ssot.reports.yml declares the standard — layers, node registry, meta.yml schema, status enum, timeline spec
    - scripts/lib/report.py provides write_meta / append_timeline / latest_artifact / resolve_node, plus an `emit` CLI for shell producers
    - scripts/report-system.py renders reports/SYSTEM-REPORT.md + reports/system-report.yml from the registry; also writes the focus-inbox node meta from the inbox dir itself
    - audit-hosts.py emits meta.<host>.yml + a timeline event on each run; --consolidate renders reports/fleet/FLEET-REPORT.md + meta (L2)
    - run.mjs emits reports/audits/meta.yml + a timeline event on each suite run; memory-banks-audit.mjs emits meta.memory-suite.yml
    - tony-dell-monitor.sh emits ~/var/chaba/health/meta.yml + timeline event per cycle (installed to ~/.local/bin)
    - report-daily-brief.py renders the daily-brief L2 node — morning (overnight dispatches/new cards/red flags/open requests) and evening (day completions + needs-Tony) editions; writes DAILY-BRIEF-*.md artifact + web copy at apps/system-report/data/DAILY-BRIEF.md + CMS page ada-cms-pages/daily-brief (kind:report, fresh_for=12h)
    - staleness-audit.mjs reads per-host cadences from this registry (meta.generated_at preferred over SSOT last_observed; fallback 14d)
    - chaba-system-report.service/.timer installed on tony-dell — daily chain: audit-hosts x5 -> --consolidate -> report-system.py
    - kanban L2 node (2026-10-05): scripts/board/kanban-stats.py rides kanban-sync.timer, writes reports/kanban/{meta.yml,kanban-stats.yml} + apps/system-report/data/kanban.md, mirrored to the served checkout
  next_steps:
    - ada-memory-report L2 renderer (memory-suite + recall-canary)
    - migrate tony-dell production units off the chaba-tony-dell checkout onto chaba (audit suite still writes reports/audits under the old checkout, so the audit-suite node reports missing here until then)
    - mcp-health-snapshot.timer repointed in repo (systemd/) but not installed; install on tony-dell if the snapshot feed is still wanted
    - ssot.audit.hosts.yml last_observed only refreshes via manual --save-to-ssot (rewrites YAML) — decide whether a lighter-weight scheduled refresh is wanted
related_files:
  - scripts/report-system.py
  - scripts/report-daily-brief.py
  - scripts/lib/report.py
  - scripts/audit-hosts.py
  - scripts/audits/run.mjs
  - systemd/chaba-system-report.service
  - systemd/chaba-system-report.timer
related_ssot:
  - docs/ssot/infrastructure/ssot.quality.yml
  - docs/ssot/infrastructure/ssot.audit.yml
  - docs/ssot/infrastructure/ssot.audit.hosts.yml
  - docs/ssot/infrastructure/ssot.automation.yml
  - docs/ssot/infrastructure/ssot.tony-dell-monitoring.yml
  - docs/ssot/infrastructure/ssot.orchestration.overnight.yml
  - docs/ssot/infrastructure/ssot.focus.triage.yml
related_kb:
