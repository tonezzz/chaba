title: MCP Debug
subtitle: Multi-host compact debug output and remote execution
icon: bug
version: 1

output_formats:
  table_commands:
    compact: csv_with_header
    proxy_envelope:
      ok: boolean
      headers: list of strings
      rows: list of string arrays
      command: string
      host: string
      freshness:
        collected_at: ISO-8601 timestamp
        duration_ms: float
        cache_age_ms: integer
    notes:
      - The CORS endpoint /mcp-table.json returns the proxy_envelope JSON directly.
      - A same-origin PHP proxy (api/mcp-table.php) is used for HTTPS sites.
      - Keep the existing keyed JSON compact format for non-table or hierarchical output.
  report:
    freshness:
      collected_at: ISO-8601 timestamp
      cache_age_ms: integer
      duration_ms: float
    notes:
      - Only commands listed in table_schemas are rendered as tables.
  table_schemas:
    filesystems:
      array_key: fs
      headers: [Filesystem, Size, Used, Available, UsePercent, Mount]
      fields: [f, s, u, a, m, p]
    processes:
      array_key: p
      headers: [PID, Command, CPU, MEM]
      fields: [p, c, u, m]
    process_cpu:
      array_key: p
      headers: [PID, PPID, Command, CPU]
      fields: [p, pp, c, u]
    process_mem:
      array_key: p
      headers: [PID, PPID, Command, MEM]
      fields: [p, pp, c, m]
    mounts:
      array_key: m
      headers: [Device, Path, Type, Options]
      fields: [d, p, t, o]
    block_devices:
      array_key: d
      headers: [Name, Size, FSType, Type, Mount]
      fields: [n, s, f, t, m]
    usb_devices:
      array_key: u
      headers: [Bus, Device, ID, Name]
      fields: [b, d, i, n]
    interfaces:
      array_key: i
      headers: [Interface, State, Address]
      fields: [i, s, a]
    routes:
      array_key: r
      headers: [Destination, Gateway, Interface]
      fields: [d, g, i]
    tailscale:
      array_key: p
      headers: [IP, Host, User, OS_State]
      fields: [i, h, u, o]
    systemd_units:
      array_key: u
      headers: [Unit, Load, State, Active, Description]
      fields: [u, l, s, a, d]

hosts:
  tony_omen:
    name: Tony Omen
    description: Local Devin control host
    role: headless_fallback
    local: true
    mcp_debug_path: /home/tony/.local/bin/mcp-debug
    clipboard: false
    tags: [primary, server, headless, fallback]
  tony_dell:
    name: Tony Dell
    description: Headless primary CORS/link/overnight host
    role: headless_primary
    hostname: tony-dell
    ssh_user: tony
    mcp_debug_path: /home/tony/.local/bin/mcp-debug
    tags: [secondary, testing, headless, primary]
  macbook:
    name: MacBook Pro
    description: macOS / iOS verification workstation
    role: mac_ios_verify
    hostname: macbook
    ssh_user: kkkakk
    mcp_debug_path: /Users/kkkakk/.local/bin/mcp-debug
    compact: false
    clipboard: true
    tags: [macos, ios, verify, xcode]
    note: See docs/ssot/infrastructure/ssot.host-roles.yml for macOS verification details.
debug_commands:
  systemctl list-units:
    description: Running systemd services
    compact: true
    expected_output: systemd_units
  df -h:
    description: Disk usage
    compact: true
    expected_output: filesystems
  ps:
    description: Top 20 processes by CPU
    compact: true
    expected_output: processes
  ps -eo pid,ppid,cmd,%cpu --sort=-%cpu:
    description: Top processes by CPU
    compact: true
    expected_output: process_cpu
  ps -eo pid,ppid,cmd,%mem --sort=-%mem:
    description: Top processes by memory
    compact: true
    expected_output: process_mem
  free -h:
    description: Memory usage
    compact: true
    expected_output: memory
  uptime:
    description: Uptime and load
    compact: true
    expected_output: uptime
  mount:
    description: Mounted filesystems
    compact: true
    expected_output: mounts
  lsblk:
    description: Block devices
    compact: true
    expected_output: block_devices
  lsusb:
    description: USB devices
    compact: true
    expected_output: usb_devices
  tailscale status:
    description: Tailscale network status
    compact: true
    expected_output: tailscale
  ip -4 route:
    description: IPv4 routing table
    compact: true
    expected_output: routes
  ss -tlnp:
    description: Listening TCP sockets
    compact: true
    expected_output: sockets
  ip -4 -br addr show:
    description: Interface IPv4 addresses
    compact: true
    expected_output: interfaces
raw_commands:
  allowed_prefixes:
  - systemctl
  - df
  - ps
  - free
  - uptime
  - mount
  - lsblk
  - lsusb
  - journalctl
  - ss
  - env
  - nvidia-smi
  - rocm-smi
  - tailscale
  - ip
  - tail
  - head
  - cat
  - ls
  - which
  - vm_stat
  - launchctl
  - diskutil
  - system_profiler
  - scutil
  - netstat
  - lsof
  - pgrep
  - pkill
  - sw_vers
  - sysctl
  - top
server:
  script: /home/tony/CascadeProjects/chaba/scripts/mcp-debug-server.py
  wrapper: /home/tony/.config/devin/mcp-scripts/mcp-debug.sh
  log_level: INFO
  tools:
  - mcp_debug
  - mcp_raw
  - mcp_stats
  - mcp_vet
  - mcp_savings
  - mcp_diff
  - mcp_logs
  - mcp_net
  - mcp_env
  - mcp_gpu
  - mcp_health
  - mcp_adaptive
  - mcp_get_file
  - mcp_put_file
  - mcp_clipboard_get
  - mcp_clipboard_set
  - mcp_preset_list
  - mcp_preset_run
  - mcp_report
  - mcp_focus
phases:
- id: 1
  name: SSOT and spec
  status: completed
  notes: Define hosts, commands, and progress in this file
- id: 2
  name: Deploy mcp-debug to tony-omen
  status: completed
  notes: Copied /home/tony/mcp-debug/mcp-debug.py and symlinked to ~/.local/bin
- id: 3
  name: Build host-aware mcp-debug-server
  status: completed
  notes: /home/tony/CascadeProjects/chaba/scripts/mcp-debug-server.py with mcp_debug
    and mcp_raw
- id: 4
  name: Register in Devin/Windsurf MCP
  status: completed
  notes: Generated /home/tony/.config/devin/mcp_config.json and /home/tony/.config/windsurf/mcp_config.json
- id: 5
  name: Test both hosts
  status: completed
  notes: mcp_debug and mcp_raw tested for tony-omen and tony-dell
- id: 6
  name: Deprecate remote-exec-tony-dell
  status: completed
  notes: remote-exec-tony-dell status set to deprecated; mcp-debug status set to operational
suggested_extensions:
- id: stats
  name: mcp_stats tool
  description: Measure raw vs compact word/char savings for candidate commands on
    both hosts before adding them.
  priority: high
  status: completed
- id: host-identity
  name: Host identity in compact output
  description: Add an "h" key to every compact JSON response so results are self-describing.
  priority: high
  status: completed
- id: ps-bound
  name: Bounded ps output
  description: Replace full ps with "ps top-cpu" and "ps top-mem" returning top 20
    processes by CPU or memory.
  priority: high
  status: completed
- id: memory
  name: free -h compact
  description: Compact memory summary from free -h.
  priority: medium
  status: completed
- id: uptime
  name: uptime
  description: Compact load average and uptime.
  priority: medium
  status: completed
- id: mount
  name: mount / lsblk
  description: Compact filesystem/mount and block device listing.
  priority: medium
  status: completed
- id: usb
  name: lsusb
  description: Compact USB device listing for hardware debugging.
  priority: low
  status: completed
- id: per-host-allow
  name: Per-host raw allowlists
  description: Allow different raw command prefixes per host based on capabilities.
  priority: low
  status: in_progress
  notes: macbook added with compact=false; global raw allowlist now accepts macOS
    commands (vm_stat, launchctl, diskutil, etc.).
- id: presets
  name: MCP Debug presets
  description: 'Named, multi-step, multi-host diagnostic routines exposed via mcp_preset_list
    and mcp_preset_run. First presets: quick-health, top-cpu-both, service-diff.'
  priority: high
  status: completed

baselines_source: docs/ssot/infrastructure/ssot.mcp-debug.baselines.yml

presets:
  quick-health:
    description: Service count and memory for both hosts
    steps:
    - host: tony_omen
      tool: mcp_debug
      command: systemctl list-units
    - host: tony_dell
      tool: mcp_debug
      command: systemctl list-units
    - host: tony_omen
      tool: mcp_raw
      command: free -h
    - host: tony_dell
      tool: mcp_raw
      command: free -h
  tony-omen-snapshot:
    description: Fetch the latest tony-omen health snapshot
    steps:
    - host: tony_omen
      tool: mcp_raw
      command: cat /home/tony/var/chaba/health/tony-omen-snapshot.json
  tony-dell-snapshot:
    description: Fetch the latest tony-dell health agent snapshot and check its freshness
    steps:
    - host: tony_dell
      tool: mcp_raw
      command: systemctl --user start tony-dell-health-snapshot
    - host: tony_dell
      tool: mcp_raw
      command: ls -l --time-style=full-iso /home/tony/var/chaba/health/tony-dell-snapshot.json
    - host: tony_dell
      tool: mcp_raw
      command: cat /home/tony/var/chaba/health/tony-dell-snapshot.json
  macbook-quick-look:
    description: Basic macOS system state via raw commands
    steps:
    - host: macbook
      tool: mcp_raw
      command: sw_vers
    - host: macbook
      tool: mcp_raw
      command: vm_stat
    - host: macbook
      tool: mcp_raw
      command: launchctl list | head -20
    - host: macbook
      tool: mcp_raw
      command: diskutil list
  macbook-snapshot:
    description: Refresh and show the latest macbook health snapshot
    steps:
    - host: macbook
      tool: mcp_raw
      command: launchctl start com.chaba.macbook-health
    - host: macbook
      tool: mcp_raw
      command: cat /Users/kkkakk/var/chaba/health/macbook-snapshot.json
  top-cpu-both:
    description: Top 20 processes by CPU on both Linux hosts
    steps:
    - host: tony_omen
      tool: mcp_debug
      command: ps -eo pid,ppid,cmd,%cpu --sort=-%cpu
    - host: tony_dell
      tool: mcp_debug
      command: ps -eo pid,ppid,cmd,%cpu --sort=-%cpu
  top-mem-both:
    description: Top 20 processes by memory on both Linux hosts
    steps:
    - host: tony_omen
      tool: mcp_debug
      command: ps -eo pid,ppid,cmd,%mem --sort=-%mem
    - host: tony_dell
      tool: mcp_debug
      command: ps -eo pid,ppid,cmd,%mem --sort=-%mem
  all-snapshots:
    description: Refresh and show health snapshots for all hosts
    steps:
    - host: tony_omen
      tool: mcp_raw
      command: cat /home/tony/var/chaba/health/tony-omen-snapshot.json
    - host: tony_dell
      tool: mcp_raw
      command: systemctl --user start tony-dell-health-snapshot
    - host: tony_dell
      tool: mcp_raw
      command: cat /home/tony/var/chaba/health/tony-dell-snapshot.json
    - host: macbook
      tool: mcp_raw
      command: launchctl start com.chaba.macbook-health
    - host: macbook
      tool: mcp_raw
      command: cat /Users/kkkakk/var/chaba/health/macbook-snapshot.json
  macbook-network:
    description: Listening ports on macOS
    steps:
    - host: macbook
      tool: mcp_raw
      command: lsof -i -P -n | grep LISTEN
  macbook-disks:
    description: Disk layout on macOS
    steps:
    - host: macbook
      tool: mcp_raw
      command: diskutil list
  quick-network:
    description: Listening TCP sockets and IPv4 routing on both Linux hosts
    steps:
    - host: tony_omen
      tool: mcp_debug
      command: ss -tlnp
    - host: tony_dell
      tool: mcp_debug
      command: ss -tlnp
    - host: tony_omen
      tool: mcp_debug
      command: ip -4 route
    - host: tony_dell
      tool: mcp_debug
      command: ip -4 route
  service-diff:
    description: Diff running systemd units between tony-omen and tony-dell
    steps:
    - tool: mcp_diff
      command: systemctl list-units
      hosts:
      - tony_omen
      - tony_dell
      compact: true
