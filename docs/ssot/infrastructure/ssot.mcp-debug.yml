title: MCP Debug
subtitle: Multi-host compact debug output and remote execution
icon: bug
version: 1
output_formats:
  table_commands:
    compact: csv_with_header
    proxy_envelope:
      ok: boolean
      headers: list of strings
      rows: list of string arrays
      command: string
      host: string
      freshness:
        collected_at: ISO-8601 timestamp
        duration_ms: float
        cache_age_ms: integer
    notes:
    - The CORS endpoint /mcp-table.json returns the proxy_envelope JSON directly.
    - A same-origin PHP proxy (api/mcp-table.php) is used for HTTPS sites.
    - Keep the existing keyed JSON compact format for non-table or hierarchical output.
  report:
    freshness:
      collected_at: ISO-8601 timestamp
      cache_age_ms: integer
      duration_ms: float
    notes:
    - Only commands listed in table_schemas are rendered as tables.
  table_schemas:
    filesystems:
      array_key: fs
      headers:
      - Filesystem
      - Size
      - Used
      - Available
      - UsePercent
      - Mount
      fields:
      - f
      - s
      - u
      - a
      - m
      - p
    processes:
      array_key: p
      headers:
      - PID
      - Command
      - CPU
      - MEM
      fields:
      - p
      - c
      - u
      - m
    process_cpu:
      array_key: p
      headers:
      - PID
      - PPID
      - Command
      - CPU
      fields:
      - p
      - pp
      - c
      - u
    process_mem:
      array_key: p
      headers:
      - PID
      - PPID
      - Command
      - MEM
      fields:
      - p
      - pp
      - c
      - m
    mounts:
      array_key: m
      headers:
      - Device
      - Path
      - Type
      - Options
      fields:
      - d
      - p
      - t
      - o
    block_devices:
      array_key: d
      headers:
      - Name
      - Size
      - FSType
      - Type
      - Mount
      fields:
      - n
      - s
      - f
      - t
      - m
    usb_devices:
      array_key: u
      headers:
      - Bus
      - Device
      - ID
      - Name
      fields:
      - b
      - d
      - i
      - n
    interfaces:
      array_key: i
      headers:
      - Interface
      - State
      - Address
      fields:
      - i
      - s
      - a
    routes:
      array_key: r
      headers:
      - Destination
      - Gateway
      - Interface
      fields:
      - d
      - g
      - i
    tailscale:
      array_key: p
      headers:
      - IP
      - Host
      - User
      - OS_State
      fields:
      - i
      - h
      - u
      - o
    systemd_units:
      array_key: u
      headers:
      - Unit
      - Load
      - State
      - Active
      - Description
      fields:
      - u
      - l
      - s
      - a
      - d
