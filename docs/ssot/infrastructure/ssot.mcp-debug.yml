presets:
  quick-health:
    description: Service count and memory for both hosts
    steps:
    - host: tony_omen
      tool: mcp_debug
      command: systemctl list-units
    - host: tony_dell
      tool: mcp_debug
      command: systemctl list-units
    - host: tony_omen
      tool: mcp_raw
      command: free -h
    - host: tony_dell
      tool: mcp_raw
      command: free -h
  tony-omen-snapshot:
    description: Fetch the latest tony-omen health snapshot
    steps:
    - host: tony_omen
      tool: mcp_raw
      command: cat /home/tony/var/chaba/health/tony-omen-snapshot.json
  tony-dell-snapshot:
    description: Fetch the latest tony-dell health agent snapshot and check its freshness
    steps:
    - host: tony_dell
      tool: mcp_raw
      command: systemctl --user start tony-dell-health-snapshot
    - host: tony_dell
      tool: mcp_raw
      command: ls -l --time-style=full-iso /home/tony/var/chaba/health/tony-dell-snapshot.json
    - host: tony_dell
      tool: mcp_raw
      command: cat /home/tony/var/chaba/health/tony-dell-snapshot.json
  macbook-quick-look:
    description: Basic macOS system state via raw commands
    steps:
    - host: macbook
      tool: mcp_raw
      command: sw_vers
    - host: macbook
      tool: mcp_raw
      command: vm_stat
    - host: macbook
      tool: mcp_raw
      command: launchctl list | head -20
    - host: macbook
      tool: mcp_raw
      command: diskutil list
  macbook-snapshot:
    description: Refresh and show the latest macbook health snapshot
    steps:
    - host: macbook
      tool: mcp_raw
      command: launchctl start com.chaba.macbook-health
    - host: macbook
      tool: mcp_raw
      command: cat /Users/kkkakk/var/chaba/health/macbook-snapshot.json
  top-cpu-both:
    description: Top 20 processes by CPU on both Linux hosts
    steps:
    - host: tony_omen
      tool: mcp_debug
      command: ps -eo pid,ppid,cmd,%cpu --sort=-%cpu
    - host: tony_dell
      tool: mcp_debug
      command: ps -eo pid,ppid,cmd,%cpu --sort=-%cpu
  top-mem-both:
    description: Top 20 processes by memory on both Linux hosts
    steps:
    - host: tony_omen
      tool: mcp_debug
      command: ps -eo pid,ppid,cmd,%mem --sort=-%mem
    - host: tony_dell
      tool: mcp_debug
      command: ps -eo pid,ppid,cmd,%mem --sort=-%mem
  all-snapshots:
    description: Refresh and show health snapshots for all hosts
    steps:
    - host: tony_omen
      tool: mcp_raw
      command: cat /home/tony/var/chaba/health/tony-omen-snapshot.json
    - host: tony_dell
      tool: mcp_raw
      command: systemctl --user start tony-dell-health-snapshot
    - host: tony_dell
      tool: mcp_raw
      command: cat /home/tony/var/chaba/health/tony-dell-snapshot.json
    - host: macbook
      tool: mcp_raw
      command: launchctl start com.chaba.macbook-health
    - host: macbook
      tool: mcp_raw
      command: cat /Users/kkkakk/var/chaba/health/macbook-snapshot.json
  macbook-network:
    description: Listening ports on macOS
    steps:
    - host: macbook
      tool: mcp_raw
      command: lsof -i -P -n | grep LISTEN
  macbook-disks:
    description: Disk layout on macOS
    steps:
    - host: macbook
      tool: mcp_raw
      command: diskutil list
  quick-network:
    description: Listening TCP sockets and IPv4 routing on both Linux hosts
    steps:
    - host: tony_omen
      tool: mcp_debug
      command: ss -tlnp
    - host: tony_dell
      tool: mcp_debug
      command: ss -tlnp
    - host: tony_omen
      tool: mcp_debug
      command: ip -4 route
    - host: tony_dell
      tool: mcp_debug
      command: ip -4 route
  service-diff:
    description: Diff running systemd units between tony-omen and tony-dell
    steps:
    - tool: mcp_diff
      command: systemctl list-units
      hosts:
      - tony_omen
      - tony_dell
      compact: true
  podman-info-both:
    description: Podman runtime info on both hosts
    steps:
    - host: tony_omen
      tool: mcp_debug
      command: podman info --format json
    - host: tony_dell
      tool: mcp_debug
      command: podman info --format json
  podman-images-both:
    description: Podman image inventory on both hosts
    steps:
    - host: tony_omen
      tool: mcp_debug
      command: podman image ls --format json
    - host: tony_dell
      tool: mcp_debug
      command: podman image ls --format json
  tony-omen-podman:
    description: Podman state on tony-omen
    steps:
    - host: tony_omen
      tool: mcp_raw
      command: podman ps
    - host: tony_omen
      tool: mcp_debug
      command: podman image ls --format json
  tony-dell-podman:
    description: Rootless podman container state on tony-dell
    steps:
    - host: tony_dell
      tool: mcp_raw
      command: podman ps
    - host: tony_dell
      tool: mcp_raw
      command: podman ps -a
    - host: tony_dell
      tool: mcp_raw
      command: systemctl --user list-units 'redis*' 'mddb*' 'yomi*' 'chaba*'
  tony-omen-docker:
    description: Docker container state on tony-omen
    steps:
    - host: tony_omen
      tool: mcp_raw
      command: docker ps
    - host: tony_omen
      tool: mcp_raw
      command: docker ps -a
  migrated-services-check:
    description: Verify redis, mddb, mddb-panel, and weaviate endpoints after migration
    steps:
    - host: tony_dell
      tool: mcp_raw
      command: systemctl --user status redis.service mddb.service mddb-panel.service yomi-api.service
    - host: tony_dell
      tool: mcp_raw
      command: ss -tlnp | grep -E ':(6379|11023|3002|3000|5432)'
    - host: tony_omen
      tool: mcp_raw
      command: curl -s --max-time 5 'http://tony-dell:11023/api/health'
