workflow:
  default_tool: mcp_raw
  compact_when: savings_pct_chars > 0 on the target host
  vet_new_command: mcp_stats(host, command)
  adaptive_tool: mcp_adaptive(host, command)
  recommended:
  - systemctl list-units
  - ps
  - ps -eo pid,ppid,cmd,%cpu --sort=-%cpu
  - ps -eo pid,ppid,cmd,%mem --sort=-%mem
  - free -h
  - tailscale status
  - ip -4 route
  not_recommended:
  - df -h
  - uptime
  - mount
  - lsblk
  - lsusb
  - ss -tlnp
  - ip -4 -br addr show
  gate: Run mcp_stats on both hosts before adding a new debug_command; add to recommended
    only if both hosts show positive char savings.
suggested_extensions:
- id: stats
  name: mcp_stats tool
  description: Measure raw vs compact word/char savings for candidate commands on
    both hosts before adding them.
  priority: high
  status: completed
- id: host-identity
  name: Host identity in compact output
  description: Add an "h" key to every compact JSON response so results are self-describing.
  priority: high
  status: completed
- id: ps-bound
  name: Bounded ps output
  description: Replace full ps with "ps top-cpu" and "ps top-mem" returning top 20
    processes by CPU or memory.
  priority: high
  status: completed
- id: memory
  name: free -h compact
  description: Compact memory summary from free -h.
  priority: medium
  status: completed
- id: uptime
  name: uptime
  description: Compact load average and uptime.
  priority: medium
  status: completed
- id: mount
  name: mount / lsblk
  description: Compact filesystem/mount and block device listing.
  priority: medium
  status: completed
- id: usb
  name: lsusb
  description: Compact USB device listing for hardware debugging.
  priority: low
  status: completed
- id: per-host-allow
  name: Per-host raw allowlists
  description: Allow different raw command prefixes per host based on capabilities.
  priority: low
  status: in_progress
  notes: macbook added with compact=false; global raw allowlist now accepts macOS
    commands (vm_stat, launchctl, diskutil, etc.).
- id: presets
  name: MCP Debug presets
  description: 'Named, multi-step, multi-host diagnostic routines exposed via mcp_preset_list
    and mcp_preset_run. First presets: quick-health, top-cpu-both, service-diff.'
  priority: high
  status: completed
presets:
  quick-health:
    description: Service count and memory for both hosts
    steps:
    - host: tony_omen
      tool: mcp_debug
      command: systemctl list-units
    - host: tony_dell
      tool: mcp_debug
      command: systemctl list-units
    - host: tony_omen
      tool: mcp_raw
      command: free -h
    - host: tony_dell
      tool: mcp_raw
      command: free -h
  tony-omen-snapshot:
    description: Fetch the latest tony-omen health snapshot
    steps:
    - host: tony_omen
      tool: mcp_raw
      command: cat /home/tony/var/chaba/health/tony-omen-snapshot.json
  tony-dell-snapshot:
    description: Fetch the latest tony-dell health agent snapshot and check its freshness
    steps:
    - host: tony_dell
      tool: mcp_raw
      command: systemctl --user start tony-dell-health-snapshot
    - host: tony_dell
      tool: mcp_raw
      command: ls -l --time-style=full-iso /home/tony/var/chaba/health/tony-dell-snapshot.json
    - host: tony_dell
      tool: mcp_raw
      command: cat /home/tony/var/chaba/health/tony-dell-snapshot.json
  macbook-quick-look:
    description: Basic macOS system state via raw commands
    steps:
    - host: macbook
      tool: mcp_raw
      command: sw_vers
    - host: macbook
      tool: mcp_raw
      command: vm_stat
    - host: macbook
      tool: mcp_raw
      command: launchctl list | head -20
    - host: macbook
      tool: mcp_raw
      command: diskutil list
  macbook-snapshot:
    description: Refresh and show the latest macbook health snapshot
    steps:
    - host: macbook
      tool: mcp_raw
      command: launchctl start com.chaba.macbook-health
    - host: macbook
      tool: mcp_raw
      command: cat /Users/kkkakk/var/chaba/health/macbook-snapshot.json
  top-cpu-both:
    description: Top 20 processes by CPU on both Linux hosts
    steps:
    - host: tony_omen
      tool: mcp_debug
      command: ps -eo pid,ppid,cmd,%cpu --sort=-%cpu
    - host: tony_dell
      tool: mcp_debug
      command: ps -eo pid,ppid,cmd,%cpu --sort=-%cpu
  top-mem-both:
    description: Top 20 processes by memory on both Linux hosts
    steps:
    - host: tony_omen
      tool: mcp_debug
      command: ps -eo pid,ppid,cmd,%mem --sort=-%mem
    - host: tony_dell
      tool: mcp_debug
      command: ps -eo pid,ppid,cmd,%mem --sort=-%mem
  all-snapshots:
    description: Refresh and show health snapshots for all hosts
    steps:
    - host: tony_omen
      tool: mcp_raw
      command: cat /home/tony/var/chaba/health/tony-omen-snapshot.json
    - host: tony_dell
      tool: mcp_raw
      command: systemctl --user start tony-dell-health-snapshot
    - host: tony_dell
      tool: mcp_raw
      command: cat /home/tony/var/chaba/health/tony-dell-snapshot.json
    - host: macbook
      tool: mcp_raw
      command: launchctl start com.chaba.macbook-health
    - host: macbook
      tool: mcp_raw
      command: cat /Users/kkkakk/var/chaba/health/macbook-snapshot.json
  macbook-network:
    description: Listening ports on macOS
    steps:
    - host: macbook
      tool: mcp_raw
      command: lsof -i -P -n | grep LISTEN
  macbook-disks:
    description: Disk layout on macOS
    steps:
    - host: macbook
      tool: mcp_raw
      command: diskutil list
