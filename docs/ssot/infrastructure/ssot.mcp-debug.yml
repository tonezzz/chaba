suggested_extensions:
- id: stats
  name: mcp_stats tool
  description: Measure raw vs compact word/char savings for candidate commands on both hosts before adding them.
  priority: high
  status: completed
- id: host-identity
  name: Host identity in compact output
  description: Add an "h" key to every compact JSON response so results are self-describing.
  priority: high
  status: completed
- id: ps-bound
  name: Bounded ps output
  description: Replace full ps with "ps top-cpu" and "ps top-mem" returning top 20 processes by CPU or memory.
  priority: high
  status: completed
- id: memory
  name: free -h compact
  description: Compact memory summary from free -h.
  priority: medium
  status: completed
- id: uptime
  name: uptime
  description: Compact load average and uptime.
  priority: medium
  status: completed
- id: mount
  name: mount / lsblk
  description: Compact filesystem/mount and block device listing.
  priority: medium
  status: completed
- id: usb
  name: lsusb
  description: Compact USB device listing for hardware debugging.
  priority: low
  status: completed
- id: per-host-allow
  name: Per-host raw allowlists
  description: Allow different raw command prefixes per host based on capabilities.
  priority: low
  status: in_progress
  notes: macbook added with compact=false; global raw allowlist now accepts macOS commands (vm_stat, launchctl, diskutil,
    etc.).
- id: ssot-editing
  name: SSOT append-only editing tools
  description: mcp_read_ssot, mcp_search_ssot, and mcp_ssot_append. Read/search are operational; mcp_ssot_append is append-only
    and scoped to whitelisted list sections (quick_wins, request_log, subtasks, history, notes, items, services). Use to keep
    SSOTs current without full-file edits in sub-agents.
  priority: medium
  status: in_progress
- id: registry-lookup
  name: Registry lookup tools
  description: mcp_registry_lookup and mcp_registry_get for searching the split SSOT registry by id, name, path, type, or keyword
    and returning source SSOT content.
  priority: medium
  status: completed
  notes: mcp_ssot_append exists; needs policy review before promotion to operational.
- id: presets
  name: MCP Debug presets
  description: 'Named, multi-step, multi-host diagnostic routines exposed via mcp_preset_list and mcp_preset_run. First presets:
    quick-health, top-cpu-both, service-diff. New: mcp-savings-audit preset, mcp_debug_audit single-call audit, and mcp_preset_savings
    scoring for message and payload savings.'
  priority: high
  status: completed
  updated: '2026-08-19'
  notes: Added mcp_debug_audit and mcp_preset_savings tools; mcp-savings-audit preset runs the audit as one preset call.
- id: containers
  name: Unified container list
  description: One `containers` command that auto-detects podman then docker and returns a compact, runtime-labeled JSON list.
  priority: high
  status: completed
  completed: '2026-08-17'
  notes: Implemented in scripts/mcp_debug/mcp-debug-macos and /home/tony/mcp-debug/mcp-debug.py; tested on tony-omen, tony-dell,
    and macbook.
- id: services
  name: Unified service manager list
  description: One `services` command that uses `systemctl list-units` on Linux and `launchctl list` on macOS, returning a
    compact, runtime-labeled list.
  priority: high
  status: completed
  completed: '2026-08-17'
  notes: Implemented in both wrappers; tested on tony-omen and macbook.
- id: sockets
  name: Unified listening/open socket list
  description: One `sockets` command that tries `ss -tlnp`, `netstat -an`, and `lsof -nP -iTCP` and returns a compact, runtime-labeled
    list.
  priority: medium
  status: completed
  completed: '2026-08-17'
  notes: Implemented in both wrappers; tony-omen uses ss, macbook uses lsof, netstat fallback available.
- id: gpu
  name: Unified GPU summary
  description: One `gpu` command that tries `nvidia-smi` then `rocm-smi` and returns a compact, runtime-labeled summary.
  priority: medium
  status: completed
  completed: '2026-08-17'
  notes: Implemented in Linux wrapper using nvidia-smi; macOS has no GPU tool and returns ok:false.
