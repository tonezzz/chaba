tool_examples:
  - tool: mcp_debug
    description: Run a compact debug command on a host
    example: '{"host": "tony_dell", "command": "services"}'
    note: The compact command is one of the keys in DEBUG_COMMANDS (df -h, ps, services, sockets, gpu, containers, etc.).
  - tool: mcp_logs
    description: Fetch journalctl logs for a systemd unit
    example: '{"host": "tony_dell", "unit": "yomi-api.service", "lines": 20}'
  - tool: mcp_system
    description: Run an exact systemctl command
    example: '{"host": "tony_dell", "command": "systemctl --user status mcp-debug-cors.service"}'
  - tool: mcp_remediate
    description: Restart a user service safely
    example: '{"host": "tony_dell", "unit": "yomi-api.service", "action": "restart", "dry_run": true}'
    note: Always use dry_run=true first.
  - tool: mcp_raw
    description: Run a raw allowed command on a host
    example: '{"host": "tony_dell", "command": "ss -tlnp | grep 8080"}'
    note: The command must start with an allowed base from RAW_PREFIXES.
tool_selection:
  description: 'The SSOT query and context tools are arranged from the most precise to the

    broadest. Use the smallest tool that can answer the question.

    '
  hierarchy:
  - tool: mcp_query_ssot
    for: one precise value or list at a dotted path in a known or discovered SSOT file
    example: path=docs/ssot/infrastructure/ssot.values.yml, key=ports.mcp_debug_cors
  - tool: mcp_mddb_doc
    for: full content of the most relevant SSOT document discovered by MDDB or keywords
    example: query="audit framework"
  - tool: mcp_read_ssot
    for: bounded direct read of a known SSOT file
    example: path=docs/ssot/infrastructure/ssot.mcp-debug.yml, limit=5000
  - tool: mcp_search_ssot
    for: search results/excerpts only, not full content
    example: query="focus decision tree"
  - tool: mcp_context
    for: curated set of KB/SSOT documents relevant to the active focus and an optional query
    example: query="audit"
  - tool: mcp_preprocess
    for: grounding an ambiguous request in active focus and returning a structured prompt
    example: request="continue"
