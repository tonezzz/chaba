  - free
  - uptime
  - mount
  - lsblk
  - lsusb
  - journalctl
  - ss
  - env
  - top
  - lsof
  - launchctl
  - nvidia-smi
  - rocm-smi
  - tailscale
  - ip
  - tail
  - head
  - cat
  - ls
  - which
  - vm_stat
  - launchctl
  - diskutil
  - system_profiler
  - scutil
  - netstat
  - lsof
  - pgrep
  - pkill
  - nohup
  - ssh
  - curl
  - sw_vers
  - sysctl
  - top
  - docker
  - podman
  - apt
  - apt-get
  - apt-cache
  - apt-mark
  - dpkg
