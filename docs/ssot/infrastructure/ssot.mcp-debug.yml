title: MCP Debug
subtitle: Multi-host compact debug output and remote execution
icon: bug
version: 1

output_formats:
  table_commands:
    compact: csv_with_header
    proxy_envelope:
      ok: boolean
      headers: list of strings
      rows: list of string arrays
      command: string
      host: string
      freshness:
        collected_at: ISO-8601 timestamp
        duration_ms: float
        cache_age_ms: integer
    notes:
      - The CORS endpoint /mcp-table.json returns the proxy_envelope JSON directly.
      - A same-origin PHP proxy (api/mcp-table.php) is used for HTTPS sites.
      - Keep the existing keyed JSON compact format for non-table or hierarchical output.
  report:
    freshness:
      collected_at: ISO-8601 timestamp
      cache_age_ms: integer
      duration_ms: float
    notes:
      - Only commands listed in table_schemas are rendered as tables.
  table_schemas:
    filesystems:
      array_key: fs
      headers: [Filesystem, Size, Used, Available, UsePercent, Mount]
      fields: [f, s, u, a, m, p]
    processes:
      array_key: p
      headers: [PID, Command, CPU, MEM]
      fields: [p, c, u, m]
    process_cpu:
      array_key: p
      headers: [PID, PPID, Command, CPU]
      fields: [p, pp, c, u]
    process_mem:
      array_key: p
      headers: [PID, PPID, Command, MEM]
      fields: [p, pp, c, m]
    mounts:
      array_key: m
      headers: [Device, Path, Type, Options]
      fields: [d, p, t, o]
    block_devices:
      array_key: d
      headers: [Name, Size, FSType, Type, Mount]
      fields: [n, s, f, t, m]
    usb_devices:
      array_key: u
      headers: [Bus, Device, ID, Name]
      fields: [b, d, i, n]
    interfaces:
      array_key: i
      headers: [Interface, State, Address]
      fields: [i, s, a]
    routes:
      array_key: r
      headers: [Destination, Gateway, Interface]
      fields: [d, g, i]
    tailscale:
      array_key: p
      headers: [IP, Host, User, OS_State]
      fields: [i, h, u, o]
    systemd_units:
      array_key: u
      headers: [Unit, Load, State, Active, Description]
      fields: [u, l, s, a, d]

hosts:
  tony_omen:
    name: Tony Omen
    description: Local Devin control host
    role: headless_fallback
    hostname: 100.75.102.88
    ssh_user: tony
    mcp_debug_path: /home/tony/.local/bin/mcp-debug
    clipboard: false
    tags: [primary, server, headless, fallback]
    note: Use the Tailscale IP because 'tony-omen' resolves to the unreachable 192.168.1.48 on tony-dell.
  tony_dell:
    name: Tony Dell
    description: Headless primary CORS/link/overnight host
    role: headless_primary
    hostname: tony-dell
    ssh_user: tony
    mcp_debug_path: /home/tony/.local/bin/mcp-debug
    tags: [secondary, testing, headless, primary]
  macbook:
    name: MacBook Pro
    description: macOS / iOS verification workstation
    role: mac_ios_verify
    hostname: 100.124.59.112
    ssh_user: kkkakk
    mcp_debug_path: /Users/kkkakk/.local/bin/mcp-debug
    compact: true
    clipboard: true
    tags: [macos, ios, verify, xcode]
    note: Maps to kk-macbook. mcp-debug-macos is installed for df -h, ps, uptime, and mount.
  kk-macbook:
    name: KK MacBook Pro
    description: Secondary macOS / iOS verification workstation
    role: mac_ios_verify
    hostname: 100.124.59.112
    ssh_user: kkkakk
    mcp_debug_path: /Users/kkkakk/.local/bin/mcp-debug
    compact: false
    clipboard: true
    capture: false
    tags: [macos, ios, verify, xcode]
    note: Alias for the same macOS host; capture tools use the same screencapture/osascript path as macbook.
debug_commands:
  systemctl list-units:
    description: Running systemd services
    compact: true
    expected_output: systemd_units
  df -h:
    description: Disk usage
    compact: true
    expected_output: filesystems
  ps:
    description: Top 20 processes by CPU
    compact: true
    expected_output: processes
    raw_command: 'ps aux'
  ps -eo pid,ppid,cmd,%cpu --sort=-%cpu:
    description: Top processes by CPU
    compact: true
    expected_output: process_cpu
  ps -eo pid,ppid,cmd,%mem --sort=-%mem:
    description: Top processes by memory
    compact: true
    expected_output: process_mem
  free -h:
    description: Memory usage
    compact: true
    expected_output: memory
  uptime:
    description: Uptime and load
    compact: true
    expected_output: uptime
  mount:
    description: Mounted filesystems
    compact: true
    expected_output: mounts
  lsblk:
    description: Block devices
    compact: true
    expected_output: block_devices
    raw_command: 'lsblk -O'
  lsusb:
    description: USB devices
    compact: true
    expected_output: usb_devices
    raw_command: 'lsusb -v'
  tailscale status:
    description: Tailscale network status
    compact: true
    expected_output: tailscale
  ip -4 route:
    description: IPv4 routing table
    compact: true
    expected_output: routes
  ss -tlnp:
    description: Listening TCP sockets
    compact: true
    expected_output: sockets
  ip -4 -br addr show:
    description: Interface IPv4 addresses
    compact: true
    expected_output: interfaces
    raw_command: 'ip -4 addr show'
  podman info --format json:
    description: Podman runtime, store, and graph driver info as JSON
    compact: true
    expected_output: json
    raw_command: 'podman info'
    note: Vetted positive on both tony_omen (51.5%) and tony_dell (51.6%).
  podman image ls --format json:
    description: Podman image list as compact JSON
    compact: true
    expected_output: json
    raw_command: 'podman image ls -a'
    note: Vetted positive on both tony_omen (48.7%) and tony_dell (78.5%).
  top -l 1 -n 10 -o cpu:
    description: macOS top 10 processes by CPU
    compact: true
    expected_output: top_processes
    note: macOS only; Linux top does not support these flags.
  lsof -nP -iTCP:
    description: TCP sockets and network connections
    compact: true
    expected_output: lsof_tcp
    raw_command: 'lsof -nP'
    note: Works on Linux and macOS; raw uses 'lsof -nP' to include UDP as a larger baseline.
  launchctl list:
    description: macOS launchd loaded services
    compact: true
    expected_output: launchd_services
    note: macOS only; Linux has no launchctl.
  containers:
    description: Running containers from podman or docker
    compact: true
    expected_output: containers
    note: 'Abstract command; mcp-debug auto-detects podman then docker. raw_command uses the same order.'
    raw_command: 'podman ps --format json 2>/dev/null || docker ps --format json'
  services:
    description: Running system services
    compact: true
    expected_output: services
    note: 'Abstract command; mcp-debug uses systemctl on Linux and launchctl on macOS. raw_command tries launchctl first, then systemctl.'
    raw_command: 'launchctl list 2>/dev/null || systemctl list-units --type=service --state=running --no-pager --no-legend --plain'
  sockets:
    description: Listening TCP sockets
    compact: true
    expected_output: sockets
    note: 'Abstract command; mcp-debug tries ss, then lsof, then netstat. raw_command uses the same order.'
    raw_command: 'ss -tlnp 2>/dev/null || lsof -nP -iTCP -sTCP:LISTEN 2>/dev/null || netstat -an'
  gpu:
    description: GPU utilization and memory
    compact: true
    expected_output: gpu
    note: 'Abstract command; mcp-debug uses nvidia-smi --query-gpu. raw_command uses full nvidia-smi or rocm-smi --json to provide a larger raw baseline.'
    raw_command: 'nvidia-smi 2>/dev/null || rocm-smi --json'
