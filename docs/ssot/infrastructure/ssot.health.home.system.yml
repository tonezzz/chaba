title: System timer & host health checks
subtitle: System timer & host health checks
icon: timer
services:
- id: yomi-update-all-timer
  name: Yomi Update All Timer
  type: systemd
  service: yomi-update-all.timer
  expected_state: active
  timeout: 5
  category: system
  profiles:
  - home
  - mobile
  host: tony_dell
- id: yomi-update-active-timer
  name: Yomi Update Active Timer
  type: systemd
  service: yomi-update-active.timer
  expected_state: active
  timeout: 5
  category: system
  profiles:
  - home
  - mobile
  host: tony_dell
- id: weaviate-index-timer
  name: Weaviate Index Timer
  type: systemd
  service: weaviate-index.timer
  expected_state: active
  timeout: 5
  category: system
  profiles:
  - home
  - mobile
  host: tony_omen
  note: 'Indexing runs on tony-omen to use the GPU embedding service. It writes to
    the Weaviate container on tony-dell:8084 via WEAVIATE_URL=http://tony-dell:8084.
    Check: systemctl --user status weaviate-index.timer'
- id: chaba-audit-timer
  name: Chaba Audit Timer
  type: systemd
  service: chaba-audit.timer
  expected_state: active
  timeout: 5
  category: system
  profiles:
  - home
  - mobile
  host: tony_dell
- id: chaba-kb-audit-timer
  name: Chaba KB Audit Timer
  type: systemd
  service: chaba-kb-audit.timer
  expected_state: active
  timeout: 5
  category: system
  profiles:
  - home
  - mobile
  host: tony_dell
- id: cpu-frequency-monitor
  name: CPU Frequency Monitor
  type: systemd
  scope: system
  service: cpufreq-limit.service
  expected_state: active
  timeout: 5
  category: system
  profiles:
  - home
  - mobile
  note: tony-omen only.
  verification:
  - 'Check service: systemctl status cpufreq-limit.service'
  - 'Check current CPU frequency: cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq'
  - 'Check CPU governor: cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor'
  recovery_actions:
  - 'Restart service: systemctl restart cpufreq-limit.service'
  - 'Set performance governor: echo performance | sudo tee /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor'
  host: tony_omen
- id: chaba-health-monitor-timer
  name: Chaba Health Monitor Timer
  type: systemd
  service: chaba-health-monitor.timer
  expected_state: active
  timeout: 5
  category: system
  profiles:
  - home
  - mobile
  disabled: true
  note: 'tony-omen only. Currently inactive; disabled until it is enabled.'
  verification:
  - 'Check timer status: systemctl --user status chaba-health-monitor.timer'
  - 'Check monitor log: tail -f /home/tony/CascadeProjects/chaba/logs/health-monitor.log'
  - 'Test script manually: bash /home/tony/CascadeProjects/chaba/scripts/health-monitor.sh'
  - 'Check CPU frequency: cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq'
  - 'Check CPU governor: cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor'
  recovery_actions:
  - 'Restart timer: systemctl --user restart chaba-health-monitor.timer'
  - 'Check script permissions: chmod +x /home/tony/CascadeProjects/chaba/scripts/health-monitor.sh'
  - 'Monitor CPU frequency: watch -n 1 ''cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq'''
  - 'Change CPU governor: echo performance | sudo tee /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor'
  - 'Check thermal throttling: watch -n 1 ''cat /sys/class/thermal/thermal_zone*/temp'''
  host: tony_omen
- id: barrier-server
  name: Barrier KVM Server
  type: systemd
  service: barriers.service
  host: tony_omen
  expected_state: active
  timeout: 5
  category: system
  profiles:
  - home
  - mobile
  note: tony-omen only; currently active.
  verification:
  - 'Check service: systemctl --user status barriers.service'
  - 'Check port: ss -tlnp | grep 24800'
  - 'Check server log: tail -n 20 /tmp/barrier-server.log'
  - 'Check connected client: tail -n 20 /tmp/barrier-client.log'
  recovery_actions:
  - 'Restart server: systemctl --user restart barriers.service'
  - 'Check log: journalctl --user -u barriers.service -n 50'
  - 'Check client: ssh -o ConnectTimeout=3 tony@tony-dell ''pgrep -a barrierc'''
  - 'Restart client: ssh -o ConnectTimeout=3 tony@tony-dell ''pkill -x barrierc 2>/dev/null;
    nohup /home/tony/.local/bin/barrierc --no-daemon --disable-crypto --name tony-dell
    --log /tmp/barrier-client.log 100.75.102.88 >/dev/null 2>&1 &'''
- id: gdrive-backup
  name: Google Drive Backup
  type: mount
  mount_point: /home/tony/GoogleDrive
  expected_state: mounted
  timeout: 10
  category: system
  profiles:
  - home
  note: Google Drive mount for automated backup storage at /home/tony/GoogleDrive/Tony
    AI/backup/chaba
  verification:
  - 'Check mount status: mount | grep gdrive'
  - 'Check backup directory: ls -la /home/tony/GoogleDrive/Tony AI/backup/chaba'
  - 'Check recent backups: ls -lt /home/tony/GoogleDrive/Tony AI/backup/chaba/daily/
    | head -5'
  - 'Test write access: echo ''test'' > /home/tony/GoogleDrive/Tony AI/backup/chaba/test-write.txt
    && rm /home/tony/GoogleDrive/Tony AI/backup/chaba/test-write.txt'
  - 'Check backup logs: tail -f /var/log/chaba-backup.log'
  recovery_actions:
  - 'Check rclone status: rclone status gdrive'
  - 'Remount Google Drive: rclone mount gdrive: /home/tony/GoogleDrive --daemon'
  - 'Check rclone config: rclone config show gdrive'
  - 'Check backup service: systemctl status chaba-backup.timer'
  - 'Check backup logs for errors: tail -100 /var/log/chaba-backup.log'
  host: tony_omen
- id: tony-omen-sensor-reader
  name: tony-omen sensor-reader
  type: http
  url: http://100.75.102.88:8001/health
  expected_status: 200
  timeout: 5
  category: system
  profiles:
  - home
  - mobile
  host: tony_omen
  note: 'Hardware sensor container data API on tony-omen. Reached via Tailscale IP.'
  verification:
  - 'Check container: ssh tony-omen docker ps -a | grep sensor-reader'
  - 'Check logs: ssh tony-omen docker logs sensor-reader --tail 20'
  - 'Test endpoint: curl -s http://tony-omen:8001/health'
  recovery_actions:
  - 'Start container: ssh tony-omen "cd /home/tony/CascadeProjects/chaba/stacks/web
    && docker compose up -d sensor-reader"'
  - 'Check main.py: ssh tony-omen ls -la /home/tony/CascadeProjects/chaba/stacks/web/sensor-reader/main.py'
