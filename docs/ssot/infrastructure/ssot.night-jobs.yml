title: Chaba Night Jobs
subtitle: Scheduled overnight tasks and their runtime disposition
version: 1

overnight_window:
  start: "03:00"
  host: tony_dell
  summary: The main overnight run executes the focus review, registry drift, and backlog triage on tony-dell.

jobs:
  - id: focus-dispatcher-overnight
    name: Chaba Overnight Focus Review
    host: tony_dell
    type: systemd-user-timer
    unit: focus-dispatcher-overnight.timer
    service: focus-dispatcher-overnight.service
    schedule: "*-*-* 03:00:00"
    enabled: true
    status: enabled
    last_run: '2026-08-18T02:00:00+07:00'
    next_run: '2026-08-19T03:00:00+07:00'
    description: Runs scripts/overnight-focus-review.py which calls registry-drafts.py and focus-dispatcher.py --sub-agent.
    environment:
      FOCUS_DISPATCHER_COMMIT: "1"
      FOCUS_DISPATCHER_PUSH: "1"
    log: /home/tony/var/chaba/overnight-focus-review.log
    outputs:
      - docs/ssot/focus-inbox/*.yml
      - updates to docs/ssot/ssot.focus.current.yml
    notes:
      - Health ingestion is re-enabled now that mcp-health is stable across the failover window.
      - The job now runs from the /home/tony/CascadeProjects/chaba-tony-dell worktree with ExecStartPre 'git pull --ff-only'.
      - GitHub token configured in tony-dell ~/.git-credentials; FOCUS_DISPATCHER_PUSH enabled after successful dry-run and test push.

  - id: yomi-backup
    name: Yomi and PostgreSQL Backup
    host: tony_dell
    type: systemd-user-timer
    unit: yomi-backup.timer
    schedule: daily
    enabled: true
    status: active
    description: pg_dump the chaba DB and rsync /home/tony/.local/share/yomi to a configurable backup host (default tony-omen).
    targets:
      - ${BACKUP_HOST:-tony_omen}:/home/tony/backups/yomi/chaba-latest.dump
      - ${BACKUP_HOST:-tony_omen}:/home/tony/backups/yomi-data/
    environment:
      BACKUP_HOST: tony-omen
      BACKUP_USER: tony
    note: The backup continues to run even when yomi-api is failed over to tony-omen, as long as tony-dell is up. Set BACKUP_HOST to fail over the backup destination.

  - id: yomi-update-all
    name: Yomi Update All
    host: tony_dell
    type: systemd-user-timer
    unit: yomi-update-all.timer
    schedule: hourly
    enabled: true
    status: active
    note: Paused if yomi-api has been failed over to tony-omen.

  - id: yomi-update-active
    name: Yomi Update Active
    host: tony_dell
    type: systemd-user-timer
    unit: yomi-update-active.timer
    schedule: every 15 minutes
    enabled: true
    status: active
    note: Paused if yomi-api has been failed over to tony-omen.

  - id: chaba-health-monitor
    name: Chaba Health Monitor
    host: tony_omen
    type: systemd-user-timer
    unit: chaba-health-monitor.timer
    schedule: every 15 minutes
    enabled: true
    status: active
    description: Collect tony-omen health snapshots.
    note: Independent of tony-dell.

  - id: macbook-health
    name: MacBook Health Snapshot
    host: macbook
    type: launchd
    unit: com.chaba.macbook-health
    schedule: every 15 minutes
    enabled: true
    status: active
    output: /Users/kkkakk/var/chaba/health/macbook-snapshot.json
    note: Captures lan_ip, tailscale_ip, wifi_ssid, memory pressure, process counts, disk hogs, and ports.

  - id: chaba-funnel-docs-sync
    name: Sync docs to tony-dell chaba-funnel
    host: tony_omen
    type: shell
    schedule: daily
    command: "rsync -avP --delete --checksum /home/tony/CascadeProjects/chaba-h3/public/apps/docs/ tony@tony-dell:/home/tony/chaba-funnel/public/apps/docs/"
    enabled: true
    status: planned
    note: Keeps the Tailscale Funnel docs on tony-dell in sync with the chaba-h3 docs source. --checksum verifies content, not just timestamp/size; --delete removes stale files on the target.

  - id: ssot-optimization-snapshot
    name: SSOT Optimization Snapshot
    host: tony_dell
    type: systemd-user-timer
    unit: ssot-optimization-snapshot.timer
    schedule: "*-*-* 03:30:00"
    enabled: true
    status: active
    last_run: '2026-08-19T22:54:00+07:00'
    next_run: '2026-08-20T03:30:00+07:00'
    description: Run scripts/ssot-optimize.mjs after the focus review to emit reports/SSOT_OPTIMIZATION_METRICS.json and reports/SSOT_OPTIMIZATION_SUGGESTIONS.md.
    log: /home/tony/var/chaba/night/ssot-optimization-snapshot.log
    outputs:
      - reports/SSOT_OPTIMIZATION_METRICS.json
      - reports/SSOT_OPTIMIZATION_SUGGESTIONS.md
    note: Disabled by default until ssot-optimize.mjs is implemented and the first dry run is reviewed.
    lifecycle:
      planning:
        goal: Emit structured SSOT optimization metrics and suggestions
        scope: Run scripts/ssot-optimize.mjs after the overnight focus review
        success_criteria:
          - reports/SSOT_OPTIMIZATION_METRICS.json is produced and valid
          - reports/SSOT_OPTIMIZATION_SUGGESTIONS.md is produced
          - All four lifecycle sections are present in the report
        owner: tony
        estimated_duration: 5 minutes
      processing:
        status: not_started
        steps:
          - id: 1
            label: Run ssot-optimize.mjs
            status: not_started
            notes: Reads ssot.focus.current.yml and file-control SSOTs to produce suggestions.
      followup:
        verification:
          - Check that both output files exist and are valid JSON/Markdown
        rollback_plan:
          - Disable the timer if the output is malformed
        deferred:
          - Add workload-aware capping as described in docs/ssot/ssot.improvements.yml
      report:
        status: not_started
        summary: TBD after the first dry run
        metrics: []
        links: []
        kb_review: []

parked_during_night:
  items:
    - Trade Canvas UI fixes and modularization
    - mcp-debug file & clipboard bridge
  note: Parked focuses are not auto-activated overnight. focus-dispatcher.py may create draft inbox items for them, but the user must activate them.

improvements:
  - Consolidate night-job logs under /home/tony/var/chaba/night/ by job name.
  - Add a "git pull --ff-only" step before focus-dispatcher-overnight.service runs.
  - Add a post-run health-check that reports commit count and inbox files created.
  - Move yomi-backup to a host-agnostic timer so it can run on tony-omen if tony-dell is down.
  - Document how to fail over focus-dispatcher-overnight to tony-omen for tony-dell outages.
  - Consider a separate nightly worktree so the overnight run never touches the main working tree.
