title: MCP Debug health checks
subtitle: MCP Debug health checks
icon: bug
services:
- id: mcp-debug-sse
  name: MCP Debug SSE server
  type: systemd
  service: mcp-debug-sse.service
  scope: user
  host: tony_dell
  expected_state: active
  timeout: 5
  category: mcp-debug
  profiles:
  - home
  - mobile
  note: MCP Debug SSE server on tony-dell. Clients connect via stdio-to-SSH wrapper
    (mcp-debug-ssh.sh) or directly to http://tony-dell.taila0626a.ts.net:8446/sse/.
  verification:
  - 'Check systemd: ssh tony-dell systemctl --user status mcp-debug-sse.service'
  - 'Check tailscale serve: ssh tony-dell tailscale serve status | grep 8446'
  - 'Test endpoint: curl -s -o /dev/null -w ''%{http_code}'' --max-time 2 http://tony-dell:8446/sse/'
  recovery_actions:
  - 'Restart service: ssh tony-dell systemctl --user restart mcp-debug-sse.service'
  - 'Check tailscale serve: ssh tony-dell tailscale serve status'
- id: mcp-debug-cors
  name: MCP Debug CORS endpoint
  type: http
  url: http://tony-omen:9100/health
  expected_status: 200
  timeout: 5
  category: mcp-debug
  profiles:
  - home
  - mobile
  disabled: true
  note: Legacy tony-omen CORS endpoint. Deprecated in favour of the MCP Debug SSE
    server on tony-dell.
  verification:
  - Disabled; see mcp-debug-sse
  recovery_actions:
  - 'No action: legacy endpoint, disabled'
  host: tony_omen
- id: mcp-debug-audit
  name: MCP Debug Audit Health
  type: http
  url: http://tony-omen:9100/audit-health
  expected_status: 200
  timeout: 10
  category: mcp-debug
  profiles:
  - home
  - mobile
  disabled: true
  note: Legacy tony-omen audit endpoint. Deprecated in favour of the MCP Debug SSE
    server on tony-dell.
  verification:
  - Disabled; see mcp-debug-sse
  recovery_actions:
  - 'No action: legacy endpoint, disabled'
  host: tony_omen

