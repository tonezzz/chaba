title: MCP Debug health checks
subtitle: MCP Debug health checks
icon: bug
services:
  - id: mcp-debug-sse
    name: MCP Debug SSE server
    disabled: true
    type: systemd
    service: mcp-debug-sse.service
    scope: user
    host: tony_dell
    expected_state: active
    timeout: 5
    category: mcp-debug
    profiles:
      - home
      - mobile
    note: "Retired 2026-10-20 — SSE backend removed with the dell app-origin drain;
      :8446 is intentionally gone. Disabled so the monitor no longer reports a service outage."
    verification:
      - "Check systemd: ssh tony-dell systemctl --user status mcp-debug-sse.service"
      - "Check tailscale serve: ssh tony-dell tailscale serve status | grep 8446"
      - "Test endpoint: curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://tony-dell:8446/sse/"
    recovery_actions:
      - "Restart service: ssh tony-dell systemctl --user restart mcp-debug-sse.service"
      - "Check tailscale serve: ssh tony-dell tailscale serve status"
