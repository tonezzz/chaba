  host: tony_omen
  dispatch: systemd
  on_calendar: '*:0/5'
  persistent: true
  timeout: 60s
  exec: /usr/bin/python3 %h/CascadeProjects/chaba/scripts/home-assistant/telemetry-ha-push.py
  env:
    TELEMETRY_DEVICES: tony-macbook
