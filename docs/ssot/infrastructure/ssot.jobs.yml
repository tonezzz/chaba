    into tony-ha via REST. Token file is the same home-assistant-token env file board_notify.py
    uses — credential stays on tony_omen, never on the laptop. Stale beacon docs set fresh=off
    without zeroing sensors — asleep/off-net is quiet. Card macbook-battery-swell; added 2026-10-21.
- id: device-telemetry-prune
  name: Device telemetry retention prune (7d)
  host: idc03
  dispatch: systemd
  on_calendar: '*-*-* 04:20:00'
