# --- per-host local log shippers (card logs-local-shippers, 2026-10-05) ---
# Each host ships its own journald to MDDB host-logs — kills the ssh
# dependency of the tony-omen ada-review-refresh nightly (which stays on
# as fallback lane, sharing the remote cursor files). The shipper script
# is installed self-contained at ~/.local/share/log-shipper/ by
# scripts/ada/install-log-shipper.sh — NOT exec'd from the repo checkout,
# so a stale/divergent checkout can never break shipping and adding a
# host = one installer run.
- id: log-shipper
  name: Log shipper (local journald -> MDDB host-logs)
  host: tony_dell
  dispatch: systemd
