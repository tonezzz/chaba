title: Jobs Registry
subtitle: Single manifest for scheduled work — renderer emits systemd units per host; dispatcher absorbs cheap interval
  jobs
icon: clock
version: 1
config:
  renderer: scripts/render-jobs.py
  dispatcher: scripts/job-dispatcher.py
  dispatcher_tick: 1min
  dispatcher_min_interval: 60s
  state_dir: '%h/var/chaba/jobs'
  results: '%h/var/chaba/reports/timeline.jsonl'
  generated_dir: systemd/generated
  failure_policy:
    backoff_factor: 2
    backoff_cap: 4h
  repo:
    tony_dell: '%h/CascadeProjects/chaba'
    tony_omen: '%h/CascadeProjects/chaba'
    idc01: '%h/CascadeProjects/chaba-vault'
    idc02: '%h/CascadeProjects/chaba'
    idc03: '%h/CascadeProjects/chaba'
    con01: '%h/CascadeProjects/chaba'
    mn01: '%h/CascadeProjects/chaba'
    macbook: '%h/CascadeProjects/chaba'
conventions:
  dispatch: 'systemd — render a real <id>.timer + <id>.service (isolation, TimeoutStartSec, Persistent catchup,
    journald tags). Required for heavyweight jobs and anything faster than dispatcher_min_interval. dispatcher —
    run by the single chaba-jobs.timer tick; interval jobs only (every:). For the cheap high-frequency tail.

    '
  host: 'The job''s only address — move = change this field, re-render, re-install on the new host. Host keys match
    ssot naming (tony_dell, idc01, idc02, tony_omen, mn01, macbook).

    '
  schedule: 'on_calendar: systemd OnCalendar string, or every: interval like 15m/1h/6h/1d. Dispatcher jobs MUST
    use every:.

    '
  exec: 'string or list of strings — a list renders one ExecStart per entry (oneshot chain: later steps run only
    when earlier ones succeed); for dispatcher jobs the entries are joined with &&.

    '
  persistent: catch up runs missed while the unit was down.
  timeout: per-job hard cap (e.g. 30s, 20m, 1h).
  critical: 'dispatcher jobs only — default false: a failing job is isolated
    (results record + one focus-inbox alert per episode + exponential
    backoff = interval * backoff_factor**(failures-1), floored at the
    job''s own interval, capped at config.failure_policy.backoff_cap) and
    never fails the chaba-jobs.service tick. true = the tick exits nonzero
    when this job fails (systemd failure). Promote sparingly.'
  env: inline KEY=value map -> Environment= lines (units) / process env (dispatcher).
  result_record: 'Dispatcher jobs append {name, command, ok, exit_code, duration_ms, ts} to config.results per ssot.reports.yml
    conventions.

    '
jobs:
- id: overnight-assessment
  name: Overnight Assessment
  host: idc03   # moved 2026-10-16/17 OPS-0725
  dispatch: systemd
  on_calendar: '*-*-* 02:00:00'
  persistent: true
  timeout: 30m
  exec: /usr/bin/python3 %h/CascadeProjects/chaba-tony-dell/scripts/orchestrate.py --workflow overnight --force
- id: focus-dispatcher-overnight
  name: Chaba Overnight Focus Review
  host: idc03   # moved 2026-10-16/17 OPS-0725
  dispatch: systemd
  on_calendar: '*-*-* 03:00:00'
  persistent: true
  timeout: 20m
  exec: /usr/bin/python3 %h/CascadeProjects/chaba-tony-dell/scripts/overnight-focus-review.py
  env:
    FOCUS_DISPATCHER_COMMIT: '1'
    FOCUS_DISPATCHER_PUSH: '1'
  note: runs from the chaba-tony-dell checkout (writes focus-inbox + commits)
- id: ssot-optimization-snapshot
  name: SSOT Optimization Snapshot
  host: con01
  dispatch: systemd
  on_calendar: '*-*-* 03:30:00'
  persistent: true
  timeout: 10m
  exec: '%h/.n/bin/node %h/CascadeProjects/chaba/scripts/ssot-optimize.mjs'
  note: migrated 2026-10-04; exec normalized to ~/.n/bin/node + chaba checkout. MDDB_BASE env removed
    2026-10-22 (cms-11023-parked-writers) — no child of ssot-optimize.mjs touches MDDB; the pin was vestigial
    and exactly the kind of stale :11023 reference the sweep exists to kill
- id: ha-config-backup
  name: HA Config Backup
  host: tony_omen
  dispatch: systemd
  on_calendar: '*-*-* 03:30:00'
  persistent: true
  timeout: 10m
  exec: '%h/.config/home-assistant/ha-live/snapshot-config.sh'
  note: reads tony-ha config — host-bound until moved to an idc02 remote pull
- id: chaba-audit
  name: Chaba Audit Suite (weekly)
  host: con01
  dispatch: systemd
  on_calendar: Sun *-*-* 02:00:00
  persistent: true
  timeout: 1h
  exec: '%h/CascadeProjects/chaba/scripts/audits/run-and-ship.sh %h/.n/bin/node %h/CascadeProjects/chaba/scripts/audits/run.mjs'
  note: migrated tony_dell -> idc02 2026-10-04 (node via ~/.n/bin/node symlink; PATH env needed — runner spawns
    bare `node` children). run-and-ship wraps run.mjs and rsyncs report metas to the served checkout —
    reports/* is gitignored so satellite metas never propagate via git (added 2026-10-14). MDDB_BASE + MDDB_CMS_URL
    envs added 2026-10-22 (cms-11023-parked-writers) — mixed audit suite — memory-plane checks stay :11023, audits
    that probe migrated collections (ada-cms-pages, kb-system, devin-kb) route via MDDB_CMS_URL.
  env:
    PATH: '%h/.n/bin:%h/.local/node/bin:/usr/local/bin:/usr/bin:/bin'
    MDDB_BASE: http://100.102.134.91:11023
    MDDB_CMS_URL: http://100.102.134.91:11027
- id: chaba-audit-full
  name: Chaba Audit Suite (monthly full)
  host: con01
  dispatch: systemd
  on_calendar: Sun *-*-1..7 03:00:00
  persistent: true
  timeout: 2h
  exec: '%h/CascadeProjects/chaba/scripts/audits/run-and-ship.sh %h/.n/bin/node %h/CascadeProjects/chaba/scripts/audits/run.mjs --full'
  note: migrated tony_dell -> idc02 2026-10-04; first-Sunday full run, same PATH requirement as chaba-audit. Verified
    run 2026-10-04 (~3min) — same core failures as dell (security-audit, standardization dup cms-pages, code-quality);
    idc02-only env gaps — no host caddy/docker binaries, no devin mcp_config, http-health checks dell-localhost
    gpu-queue/playlived-dell. Findings fixed in 35c0cb1a; manual --full rerun 2026-10-13 all-pass (5 warning-severity
    findings only). MDDB_BASE + MDDB_CMS_URL envs added 2026-10-22 (cms-11023-parked-writers) — same split as
    chaba-audit.
  env:
    PATH: '%h/.n/bin:%h/.local/node/bin:/usr/local/bin:/usr/bin:/bin'
    MDDB_BASE: http://100.102.134.91:11023
    MDDB_CMS_URL: http://100.102.134.91:11027
- id: chaba-system-report
  name: Chaba System Report
  host: con01
  dispatch: systemd
  on_calendar: '*-*-* 06:45:00'
  persistent: true
  timeout: 15m
  exec: /bin/bash -c 'cd /home/tony/CascadeProjects/chaba && for h in tony-dell tony-omen mn01 idc01 idc03 con01 macbook;
    do /usr/bin/python3 scripts/audit-hosts.py --host "$h" || true; done; /usr/bin/python3 scripts/audit-hosts.py
    --consolidate; /usr/bin/python3 scripts/report-system.py'
  note: migrated tony_dell -> idc02 2026-10-04; exec corrected (deployed unit ran bash chain, not the nonexistent
    .sh); audit host list + idc03 2026-10-06; on-demand refresh via chaba-report-api.service (POST /apps/system-report/api/refresh)
- id: chaba-host-loads
  name: Host-loads sampler (fleet load/mem/disk -> system-report monitor page)
  host: idc02
  dispatch: systemd
  every: 5min
  timeout: 2m
  exec:
    - /usr/bin/python3 %h/CascadeProjects/chaba/scripts/host-loads.py
    - /bin/bash -c 'install -m644 %h/CascadeProjects/chaba/reports/host-loads/host-loads.yml
      %h/CascadeProjects/chaba/stacks/web/public/apps/system-report/data/host-loads.yml
      && install -m644 %h/CascadeProjects/chaba/reports/host-loads/host-loads.yml
      %h/web-srv/public/apps/system-report/data/host-loads.yml'
  note: 're-homed off tony-dell-monitor.service 2026-10-26 (dell drained; sampler dark since
    2026-10-23 — card sys-mon-system-monitor-de88ff). First step refreshes
    reports/host-loads/{host-loads,meta.host-loads}.yml (the system-report Host loads
    section + node freshness); second publishes the yml into the idc02 web edge data
    dir so chaba-admin/monitor renders live 5-min host loads without waiting for the
    daily report. Second ExecStart assumes the idc02 web-srv layout.'
- id: chaba-cached-videos
  name: yt-live media cache -> CMS cached-videos-report
  host: idc03   # moved 2026-10-17 OPS-0725 (served-path writer)
  dispatch: systemd
  on_calendar: '*:0/30'
  persistent: true
  timeout: 2m
  exec: /usr/bin/python3 %h/CascadeProjects/chaba-tony-dell/scripts/ada/cached-videos-update.py
  note: scans ~/.cache/yt-live-media (real entries need info.json id match; mismatches listed as misplaced) + ~/.cache/yt-live-subs
    into CMS page cached-videos-report (en+th); replaces the hand-written 2026-09-27 snapshot
- id: chaba-starboard-tracker
  name: Starboard catalogs tracker -> CMS page
  host: idc03   # moved 2026-10-16/17 OPS-0725
  dispatch: systemd
  on_calendar: '*:0/30'
  persistent: true
  timeout: 2m
  exec: /usr/bin/python3 %h/CascadeProjects/chaba-tony-dell/scripts/ada/starboard-tracker-update.py
  note: renders kanban card starboard-windsurf-catalogs + manifest reports/starboard-catalogs/catalogs.yml into
    a managed block on CMS page starboard-catalogs (en+th); interval-gated via ada-cms-automation registry doc
- id: chaba-kanban-brief
  name: Kanban Eisenhower brief + T2 auto-close -> CMS kanban-brief
  host: idc03   # moved 2026-10-16/17 OPS-0725
  dispatch: systemd
  on_calendar: '*:0/30'
  persistent: true
  timeout: 5m
  cwd: '%h/CascadeProjects/chaba-tony-dell'
  env_file: '%h/.config/secrets/litellm-chaba.env'
  env:
    KANBAN_BRIEF_LLM_URL: http://100.102.134.91:4000/v1
    KANBAN_BRIEF_LLM_MODEL: chat-local
  exec:
  - /usr/bin/python3 %h/CascadeProjects/chaba-tony-dell/scripts/ada/kanban-brief.py
  - /usr/bin/python3 %h/CascadeProjects/chaba-tony-dell/scripts/ada/kanban-act.py
  - /usr/bin/python3 %h/CascadeProjects/chaba-tony-dell/scripts/ada/nest-overview.py
  note: 'three-step ExecStart chain (exec: list renders one ExecStart per line, in order — a failed step skips the
    rest). kanban-brief.py ranks open cards do-first/delegate/schedule/park by deterministic rules -> managed block
    on CMS kanban-brief (en+th), 30m registry gate. Then kanban-act.py auto-closes column:review cards carrying
    autonomy:t2 whose auto_done_when checks all pass (card_done/page_exists/ file_exists/service_active/git_merged/verified_true
    — bounded vocabulary, no shell); rk=decide and open-request cards are held; every close emits a kanban_act ops
    event. Then nest-overview.py. Deployed 2026-10-06; exec/env/cwd captured into this manifest 2026-10-08 (kanban-act-loop)
    — the rendered unit previously dropped kanban-act + nest-overview. Prose lane moved off tony-omen phi3
    onto the LiteLLM gateway chat-local alias (qwen2.5:7b on idc02 — card chat-local-free-lane, 2026-10-16);
    env_file supplies LITELLM_KEY (LITELLM_KEY_CHABA virtual key).'
- id: chaba-tony-ideas
  name: Tony ideas/decisions harvest -> CMS tony-ideas
  host: idc03   # moved 2026-10-17 OPS-0725 (served-path writer)
  dispatch: systemd
  on_calendar: '*:0/30'
  persistent: true
  timeout: 5m
  cwd: '%h/CascadeProjects/chaba-tony-dell'
  env:
    REPO: '%h/CascadeProjects/chaba-tony-dell'
  exec:
  - /usr/bin/python3 %h/CascadeProjects/chaba-tony-dell/scripts/ada/tony-ideas-update.py
  note: card tony-ideas-harvest — mines card comms from:tony (ops-verb regex filter), focus-inbox drafts, ssot.focus.decisions.yml
    and dispatch-outcome-*.md into the tony-ideas CMS page with adopted/pending/superseded statuses; the hand-curated
    Standing directions section is preserved verbatim from the live page each run. Runs against the served checkout
    (chaba-tony-dell) so it sees committed comms/inbox state; ada-cms-automation registry gate + managed-block upsert
    same contract as kanban-brief. Added 2026-10-10.
- id: chaba-cms-regen
  name: CMS registry command-generator sweeper (the missing regen lane)
  host: idc03   # moved 2026-10-17 OPS-0725 (served-path writer)
  dispatch: systemd
  on_calendar: hourly
  persistent: true
  timeout: 10m
  cwd: '%h/CascadeProjects/chaba-tony-dell'
  env:
    REPO: '%h/CascadeProjects/chaba-tony-dell'
  exec:
  - /usr/bin/python3 %h/CascadeProjects/chaba-tony-dell/scripts/ada/cms-regen-sweep.py
  note: card stale-report-regen-lane — iterates ada-cms-automation command-generators, runs the due ones (interval_min/last_run
    gate, run_now = Regenerate button, interval 0 = manual-only). cmd must be a scripts/ repo file — registry docs
    are untrusted input. Write-back stamps last_run/status/duration. Added 2026-10-10.
- id: chaba-standard-drift
  name: Standard-drift digest -> CMS standard-drift
  host: idc03   # moved 2026-10-17 OPS-0725 (served-path writer)
  dispatch: systemd
  on_calendar: hourly
  persistent: true
  timeout: 5m
  cwd: '%h/CascadeProjects/chaba-tony-dell'
  env:
    REPO: '%h/CascadeProjects/chaba-tony-dell'
  exec:
  - /usr/bin/python3 %h/CascadeProjects/chaba-tony-dell/scripts/ada/standard-drift-digest.py
  note: card standard-drift-digest — deterministic drift signals (stale generated reports past their own fresh_for,
    board drift, ada-voice tool-lint violations) -> managed block on CMS standard-drift (en+th). Hourly tick; the ada-cms-automation
    registry entry self-gates publishing to 6h. The flywheel feedback page — one digest to review instead of scattered
    fires. Added 2026-10-10.
- id: ada-pi-orch-bench
  name: Nest topology bench + nest-bench CMS trend refresh
  host: tony_omen
  dispatch: systemd
  on_calendar: Mon *-*-* 04:30
  persistent: true
  timeout: 2h
  cwd: '%h/CascadeProjects/ada-voice'
  exec:
  - '%h/.venvs/ada-voice-bench/bin/python tests/bench/orch-bench.py --student http://100.75.102.88:8778
    --heavy http://100.75.102.88:8777 --sets golden,hard --limit 30 --timeout 240 --mddb http://100.102.134.91:11023/v1
    --report-cms --corpus-out %h/.local/share/ada/orch-corpus.jsonl --stats-out %h/.local/share/ada/orch-router-stats.jsonl'
  - /usr/bin/python3 scripts/nest-bench-update.py --force
  env:
    MDDB_CMS_URL: http://100.102.134.91:11027/v1
  note: weekly compound-AI structure comparison (student/cascade/parallel/ router/verifier on golden+tool+hard sets)
    -> bench/orch-* docs + nest-bench trend page. CPU-heavy (~30-60min); gemma-3-1b/4b local on tony-omen. Corpus
    loop feeds misses into the next run. Deployed 2026-10-06. Bounded 2026-10-13 (--limit 30) after an unbounded
    run was TERM'd at the old 90m cap — the installed unit is systemd/ada-pi-orch-bench.service, which also carries
    ExecStartPre to start + health-wait open-jev + open-jev-student (ExecStartPost is a no-op since 2026-10-23 —
    travel-slim exited per omen-dedicate-nest, scorers run 24/7); the renderer cannot
    express pre/post hooks yet, so generated/tony_omen/ is a stub and the hand unit is the deployed source of truth.
    env MDDB_CMS_URL added 2026-10-22 (cms-11023-parked-writers) — mixed producer — scenario-report docs stay on
    :11023 via --mddb, ada-cms-pages writes route to :11027 via ada-pi mddb_client cms-plane.
- id: jev-bench
  name: Jev decision bench — hourly noul/choice accuracy vs jev-student (runs on con01, targets idc03)
  host: con01
  dispatch: systemd
  on_calendar: hourly
  persistent: true
  timeout: 10m
  exec: /usr/bin/python3 %h/CascadeProjects/ada-voice/tests/bench/jev-bench.py http://100.102.134.91:8778 --mddb http://100.102.134.91:11023/v1
    --report-cms
  env:
    MDDB_CMS_URL: http://100.102.134.91:11027/v1
  note: retargeted idc01 -> idc03 2026-10-09 (card fix-jev-bench-target). jev-student confirm-gate serves /v1/systemone
    on idc03 tailnet :8778; scenario-report writes stay on the idc03 leader :11023 (idc02 local :11023 is a read-only
    follower). Emits suite:jev-decision docs to ada-ha-scenario-reports + refreshes the bench-jev CMS page — consumed by
    nest-overview.py (chaba-nest L2). Bench script lives in the ada-voice checkout on idc02. Unit was hand-installed
    2026-10-01; now rendered from this manifest. MDDB_CMS_URL added 2026-10-22 (cms-11023-parked-writers) — mixed
    producer — ada-cms-pages writes route to :11027 via ada-pi mddb_client cms-plane.
- id: doc-mirror
  name: Hourly doc-archive -> HA www mirror (runs on con01 since 2026-10-22)
  host: con01
  dispatch: systemd
  every: 1h
  persistent: true
  timeout: 30m
  exec: '%h/.local/share/doc-archive/mirror-to-ha-www.sh'
  note: publishes doc-archive pages to tony-ha www/documents/ so casted
    /local/documents/<slug>/<page> render on screens. Needs
    ~/.config/secrets/doc-archive.env (API key) + rsync ssh to tony-dell-m2m
    (con01 mesh key already on dell). Reads doc-archive API + mddb on idc03.
    Moved idc03->con01 2026-10-22 (was a hand unit on idc03 — now declared).
- id: mddb-vector-reindex
  name: MDDB vector reindex — daily re-embed sweep for dropped embeddings
  host: con01
  dispatch: systemd
  on_calendar: '*-*-* 05:40:00'
  persistent: true
  timeout: 45m
  exec: /usr/bin/python3 %h/CascadeProjects/chaba/scripts/mddb/vector-reindex.py
  env:
    MDDB_BASE_URL: http://100.102.134.91:11023
    MDDB_REINDEX_HEALTH_WAIT: '1200'
    MDDB_REINDEX_TIMEOUT: '1800'
  note: >-
    POST-driven sweep against the idc03 leader — re-embeds docs whose stored
    vectors were dropped (provider outage, queue overflow) so the RAM index
    repopulates. Skips content-hash-matching docs, so a healthy daily sweep is
    cheap. Runs from con01 to keep the driver off saturated idc03 (the embed
    work itself is still leader-side). Replaces the oneshot that idc01 carried
    via mddb-vector-reindex.service(.d) — lost with that host 2026-10-12;
    declared here 2026-10-22 (OPS-0763). Same script stays wired to
    mddb.service ExecStartPost + mddb-embed-probe on idc03.
- id: embed-lane-news
  name: Embed lane — news title vectors (nomic) refresh
  host: idc03
  dispatch: systemd   # dispatcher->systemd 2026-10-29 (OPS-0790)
  every: 1h
  timeout: 5m
  cwd: '%h/CascadeProjects/chaba'
  exec: /usr/bin/python3 %h/CascadeProjects/chaba/scripts/embed/embed-lane.py news --dir %h/.local/share/embed-lane --hours 26
  env_file: '%h/.config/secrets/litellm-chaba.env'
  condition_path: '%h/CascadeProjects/chaba/scripts/embed/embed-lane.py'
  note: 'card embedding-backfill-lanes — keeps ~/.local/share/embed-lane/
    news-nomic.jsonl warm: nomic vectors (ollama-nomic-embed via LiteLLM,
    LB idc02+idc03) over published news titles, normalized exactly like
    news-digest.py so the :20 hourly digest run reuses them via its
    NEWS_VEC_CACHE default path instead of re-embedding every window.
    Resume-safe (sha1 of norm(title)); 26h window covers the 36h digest
    horizon with slack. Fresh misses inside news-digest append back to
    the same file, so the store self-heals between refreshes.
    dispatcher->systemd 2026-10-29 (OPS-0790): env_file/condition_path
    were inert under job-dispatcher — EnvironmentFile=/ConditionPathExists=
    now actually apply (embed-lane.py also self-loads the same env file,
    so a missing secrets file failed it under the dispatcher too).'
- id: embed-lane-lessons
  name: Embed lane — lesson CPT vectors (nomic) refresh
  host: idc03
  dispatch: systemd   # dispatcher->systemd 2026-10-29 (OPS-0790)
  every: 1d
  timeout: 10m
  cwd: '%h/CascadeProjects/chaba'
  exec: /usr/bin/python3 %h/CascadeProjects/chaba/scripts/embed/embed-lane.py lessons --dir %h/.local/share/embed-lane
  env_file: '%h/.config/secrets/litellm-chaba.env'
  condition_path: '%h/CascadeProjects/chaba/scripts/embed/embed-lane.py'
  note: 'card embedding-backfill-lanes — keeps ~/.local/share/embed-lane/
    lessons-nomic.jsonl current: every WP lesson CPT post (via board-api
    /lesson op=list+get — no WP creds on the host) chunked ~1500c and
    embedded in the nomic space for edu-review recall
    (embed-lane.py recall --store lessons). Resume-safe on content hash;
    changed lessons re-embed only their chunks. Daily cadence — lessons
    change rarely. dispatcher->systemd 2026-10-29 (OPS-0790) — same
    env_file/condition_path activation note as embed-lane-news.'
- id: embed-lane-banks
  name: Embed lane — MDDB bank sync into mddb-embed (bge-m3)
  host: idc02
  dispatch: systemd   # dispatcher->systemd 2026-10-29 (OPS-0790)
  every: 1d
  timeout: 45m
  cwd: '%h/CascadeProjects/chaba'
  exec: /usr/bin/python3 %h/CascadeProjects/chaba/scripts/embed/embed-lane.py banks
  condition_path: '%h/CascadeProjects/chaba/scripts/embed/embed-lane.py'
  note: 'card embedding-backfill-lanes — keeps the self-owned local bank
    (mddb-embed :11028, bge-m3 space via embed-pool-shim, MEM-0788/0805)
    in sync with the 24 vector-searched leader+CMS collections
    (BANK_COLLS). /add copies are cheap; vectors land through the target
    embed queue racing idle ollama cores. Queue-depth throttled (pauses
    at 3000/4000) and resume-safe, so a daily run only copies the delta.
    Driver on idc02 to keep it off idc03; embed work is fleet-pooled.'
- id: device-telemetry
