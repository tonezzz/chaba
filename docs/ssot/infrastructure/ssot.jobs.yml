    true; done; /usr/bin/python3 scripts/audit-hosts.py --consolidate; /usr/bin/python3
    scripts/report-system.py'
  note: migrated tony_dell -> idc02 2026-10-04; exec corrected (deployed unit ran
    bash chain, not the nonexistent .sh); audit host list + idc03 2026-10-06;
    on-demand refresh via chaba-report-api.service (POST /apps/system-report/api/refresh)
- id: chaba-cached-videos
