  host: tony_omen
  dispatch: systemd
  on_calendar: '*:0/5'
  persistent: true
  timeout: 30s
  exec: /usr/bin/python3 %h/.local/share/device-telemetry/agent.py
  note: hidden lost-device beacon — posts snapshot (tailnet/wan-geo/battery/ users/top-procs) to MDDB device-telemetry
    collection on idc03 (<device>/<ts> history + <device>/latest). install.sh also supports macOS launchd for tony-macbook.
    scripts/device-telemetry/
- id: telemetry-ha-push
