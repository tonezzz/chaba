title: Jobs Registry
subtitle: Single manifest for scheduled work — renderer emits systemd units per host;
  dispatcher absorbs cheap interval jobs
icon: clock
version: 1
config:
  renderer: scripts/render-jobs.py
  dispatcher: scripts/job-dispatcher.py
  dispatcher_tick: 1min
  dispatcher_min_interval: 60s
  state_dir: '%h/var/chaba/jobs'
  results: '%h/var/chaba/reports/timeline.jsonl'
  generated_dir: systemd/generated
  repo:
    tony_dell: '%h/CascadeProjects/chaba'
    tony_omen: '%h/CascadeProjects/chaba'
    idc01: '%h/CascadeProjects/chaba-vault'
    idc02: '%h/CascadeProjects/chaba'
    idc03: '%h/CascadeProjects/chaba'
    mn01: '%h/CascadeProjects/chaba'
    macbook: '%h/CascadeProjects/chaba'
conventions:
  dispatch: 'systemd — render a real <id>.timer + <id>.service (isolation, TimeoutStartSec,
    Persistent catchup, journald tags). Required for heavyweight jobs and anything
    faster than dispatcher_min_interval. dispatcher — run by the single chaba-jobs.timer
    tick; interval jobs only (every:). For the cheap high-frequency tail.

    '
  host: 'The job''s only address — move = change this field, re-render, re-install
    on the new host. Host keys match ssot naming (tony_dell, idc01, idc02, tony_omen,
    mn01, macbook).

    '
  schedule: 'on_calendar: systemd OnCalendar string, or every: interval like 15m/1h/6h/1d.
    Dispatcher jobs MUST use every:.

    '
  exec: 'string or list of strings — a list renders one ExecStart per entry
    (oneshot chain: later steps run only when earlier ones succeed); for
    dispatcher jobs the entries are joined with &&.

    '
  persistent: catch up runs missed while the unit was down.
  timeout: per-job hard cap (e.g. 30s, 20m, 1h).
  env: inline KEY=value map -> Environment= lines (units) / process env (dispatcher).
  result_record: 'Dispatcher jobs append {name, command, ok, exit_code, duration_ms,
    ts} to config.results per ssot.reports.yml conventions.

    '
jobs:
- id: overnight-assessment
  name: Overnight Assessment
  host: tony_dell
  dispatch: systemd
  on_calendar: '*-*-* 02:00:00'
  persistent: true
  timeout: 30m
  exec: /usr/bin/python3 %h/CascadeProjects/chaba/scripts/orchestrate.py --workflow
    overnight --force
- id: focus-dispatcher-overnight
  name: Chaba Overnight Focus Review
  host: tony_dell
  dispatch: systemd
  on_calendar: '*-*-* 03:00:00'
  persistent: true
  timeout: 20m
  exec: /usr/bin/python3 %h/CascadeProjects/chaba-tony-dell/scripts/overnight-focus-review.py
  env:
    FOCUS_DISPATCHER_COMMIT: '1'
    FOCUS_DISPATCHER_PUSH: '1'
  note: runs from the chaba-tony-dell checkout (writes focus-inbox + commits)
- id: ssot-optimization-snapshot
  name: SSOT Optimization Snapshot
  host: idc02
  dispatch: systemd
  on_calendar: '*-*-* 03:30:00'
  persistent: true
  timeout: 10m
  exec: '%h/.n/bin/node %h/CascadeProjects/chaba/scripts/ssot-optimize.mjs'
  env:
    MDDB_BASE: http://100.102.134.91:11023
  note: migrated 2026-10-04; exec normalized to ~/.n/bin/node + chaba checkout; MDDB_BASE
    points at idc03, the live leader (was dell-local env)
- id: ha-config-backup
  name: HA Config Backup
  host: tony_dell
  dispatch: systemd
  on_calendar: '*-*-* 03:30:00'
  persistent: true
  timeout: 10m
  exec: '%h/.config/home-assistant/ha-live/snapshot-config.sh'
  note: reads tony-ha config — host-bound until moved to an idc02 remote pull
- id: chaba-audit
  name: Chaba Audit Suite (weekly)
  host: idc02
  dispatch: systemd
  on_calendar: Sun *-*-* 02:00:00
  persistent: true
  timeout: 1h
  exec: '%h/.n/bin/node %h/CascadeProjects/chaba/scripts/audits/run.mjs'
  note: migrated tony_dell -> idc02 2026-10-04 (node via ~/.n/bin/node symlink; PATH
    env needed — runner spawns bare `node` children)
  env:
    PATH: '%h/.n/bin:%h/.local/node/bin:/usr/local/bin:/usr/bin:/bin'
- id: chaba-audit-full
  name: Chaba Audit Suite (monthly full)
  host: idc02
  dispatch: systemd
  on_calendar: Sun *-*-1..7 03:00:00
  persistent: true
  timeout: 2h
  exec: '%h/.n/bin/node %h/CascadeProjects/chaba/scripts/audits/run.mjs --full'
  note: migrated tony_dell -> idc02 2026-10-04; first-Sunday full run, same PATH requirement
    as chaba-audit. Verified run 2026-10-04 (~3min) — same core failures as dell
    (security-audit, standardization dup cms-pages, code-quality); idc02-only env
    gaps — no host caddy/docker binaries, no devin mcp_config, http-health
    checks dell-localhost gpu-queue/playlived-dell.
