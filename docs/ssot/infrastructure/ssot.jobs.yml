- id: chaba-kanban-brief
  name: Kanban Eisenhower brief + T2 auto-close -> CMS kanban-brief
  host: tony_dell
  dispatch: systemd
  on_calendar: '*:0/30'
  persistent: true
  timeout: 5m
  cwd: '%h/CascadeProjects/chaba-tony-dell'
  env:
    KANBAN_BRIEF_LLM_URL: http://100.75.102.88:11434/v1
    KANBAN_BRIEF_LLM_MODEL: phi3-gguf:latest
  exec:
    - /usr/bin/python3 %h/CascadeProjects/chaba-tony-dell/scripts/ada/kanban-brief.py
    - /usr/bin/python3 %h/CascadeProjects/chaba-tony-dell/scripts/ada/kanban-act.py
    - /usr/bin/python3 %h/CascadeProjects/chaba-tony-dell/scripts/ada/nest-overview.py
  note: 'three-step ExecStart chain (exec: list renders one ExecStart per
    line, in order — a failed step skips the rest). kanban-brief.py ranks
    open cards do-first/delegate/schedule/park by deterministic rules ->
    managed block on CMS kanban-brief (en+th), 30m registry gate. Then
    kanban-act.py auto-closes column:review cards carrying autonomy:t2
    whose auto_done_when checks all pass (card_done/page_exists/
    file_exists/service_active/git_merged/verified_true — bounded
    vocabulary, no shell); rk=decide and open-request cards are held;
    every close emits a kanban_act ops event. Then nest-overview.py.
    Deployed 2026-10-06; exec/env/cwd captured into this manifest
    2026-10-08 (kanban-act-loop) — the rendered unit previously dropped
    kanban-act + nest-overview.'
