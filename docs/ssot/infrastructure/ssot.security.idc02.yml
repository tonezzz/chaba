title: Security Posture — idc02
subtitle: Declared security state for the idc02 VPS; diffed live by scripts/audit-security.py
icon: shield
version: 1
last_updated: "2026-10-04"
maintainer: tony

host: idc02
standard: docs/ssot/infrastructure/ssot.security.yml

expected_exposure:
  - { listener: "0.0.0.0:22", class: tailnet-only, service: sshd,
      note: "public :22 removed 2026-09-30 post-join — ufw allows tailscale0 only; PermitRootLogin prohibit-password (key-only)" }
  - { listener: "0.0.0.0:80", class: public-ip, service: caddy-edge,
      note: "caddy-edge quadlet (container, host-net) — public edge for *-ha.surf-thailand.com; added 2026-10-03" }
  - { listener: "0.0.0.0:443", class: public-ip, service: caddy-edge,
      note: "caddy-edge quadlet TLS — Let's Encrypt per-name certs; added 2026-10-03" }

remote_access:
  sshd: { port: 22, bind: "0.0.0.0", password_auth: "off — key-only (drop-in 00-no-password.conf, 2026-10-06)" }
  tailscale_ssh: false
  recovery:
    provider_panel: "VPS provider web console — recovery path if tailnet+ssh both break"

firewall:
  tool: ufw
  inbound_default: deny
  rules:
    - "allow in on tailscale0 (all traffic — tailnet only)"
    - "allow 80/tcp anywhere (caddy-edge)"
    - "allow 443/tcp anywhere (caddy-edge)"
  note: "Enabled 2026-09-30 during baseline setup; 80/443 opened 2026-10-03 for public edge; outbound default allow"

tailscale:
  ip: "100.123.163.11"
  serve: []
  funnel: []                  # none — explicitly declared
  role: []

egress:
  warp: { enabled: false }
  transparent_proxy: { enabled: false }

baseline_applied:
  - "non-root user 'tony' (sudo, uid 1000) with ssh authorized_keys copied from root"
  - "ssh key auth verified — tony@idc02 BatchMode login works"
  - "podman + uidmap installed (rootless-capable)"
  - "loginctl enable-linger tony — user services survive logout"
  - "ufw deny-incoming / allow-outgoing + 22/tcp, enabled on boot"
  - "tailscaled installed, joined tailnet 2026-09-30 (100.123.163.11); ufw :22 tightened to tailscale0; PermitRootLogin prohibit-password; fail2ban+unattended-upgrades+auditd+chrony active; sysctl.d/90-tuning.conf (bbr+fq, swappiness=10, inotify 524288, somaxconn 8192)"

