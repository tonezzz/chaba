title: Host Roles
subtitle: Canonical roles, headless priority, and web preview targets for chaba hosts
icon: server
version: 1

hosts:
  tony-omen:
    description: Primary dev workstation and main web server
    tailnet: tony-omen
    tailscale_ip: 100.75.102.88
    tags:
      - primary
      - server
      - web-server
      - barrier-server
    headless_browser:
      enabled: true
      role: fallback
      playlive_port: 9231
      playlive_url: http://tony-omen:9231/sessions
    web_preview:
      enabled: true
      chaba_h3:
        url: http://tony-omen:8081
        description: Pre-deploy parity preview before pushing to the chaba.h3 branch
      caddy:
        url: http://tony-omen:8080
    mcp_debug_name: tony_omen

  tony-dell:
    description: Secondary workstation and primary headless browser target
    tailnet: tony-dell
    tailscale_ip: 100.68.142.13
    tags:
      - secondary
      - testing
      - barrier-client
      - headless-primary
    headless_browser:
      enabled: true
      role: primary
      playlive_port: 9230
      playlive_url: http://tony-dell:9230/sessions
    web_preview:
      enabled: false
      note: Use only when tony-omen is unavailable for remote browser preview
    mcp_debug_name: tony_dell

  tony-macbook:
    description: portable Linux dev/lab node — MacBookPro13,3 (2016 15"), Ubuntu 26.04.1 since 2026-10-10 (was macOS)
    tailnet: tony-macbook
    tailscale_ip: 100.77.76.112
    lan_ip: 192.168.2.88
    local_hostname: tony-macbook
    tags:
      - linux
      - laptop
      - portable
      - dev
      - offload
    headless_browser:
      enabled: false
      note: Chrome 155 installed; no PlayLive/CDP endpoint provisioned yet (old macOS playlived + tunnel died with the wipe)
    web_preview:
      enabled: false
    mcp_debug_name: macbook
    offload:
      eligible: true
      kind: portable-linux-laptop
      can_run:
        - standard Linux x86_64 commands and scripts
        - Vulkan-accelerated whisper.cpp/llama.cpp small-model inference (Radeon Pro 450, RADV — no CUDA/ROCm/OpenCL)
        - health snapshots and monitoring
        - subagent explore/research
      cannot_run:
        - macOS/iOS builds or Safari verification (no macOS anymore)
        - GPU/ML training workloads, CUDA/ROCm-labeled dispatch cards
        - long-running stateful services (laptop — sleeps/off-net is normal)
      preferred_for:
        - portable lab tasks, CPU/dev dispatch lane (planned, cap 2)

policies:
  headless_browser_priority:
    - tony-dell
    - tony-omen
    - tony-macbook
  mac_ios_verify: null  # retired 2026-10-11 — no macOS host left (tony-macbook is Ubuntu now)
  offload:
    candidate_order:
      - tony-dell
      - tony-macbook
      - tony-omen
    when_to_use_tony-macbook:
      - tony-dell and tony-omen are at high load or memory pressure
      - task is macOS-specific or needs Safari/WebKit
      - task is a lightweight subagent that does not need Linux containers

  web_preview:
    default: use-direct-hostname
    when_to_use_browser_preview: only in isolated environments or when direct access is unavailable
    decisions:
      - source: docs/ssot/infrastructure/ssot.health.yml
        note: Avoid browser preview for local testing; use a regular browser with direct hostnames
      - source: docs/ssot/ssot.mysystem.home.yml
        note: chaba-h3 preview on tony-omen port 8081 is for pre-deploy parity, not default local browsing

dns_aliases:
  postgre:
    target: 100.68.142.13
    current_host: tony_dell
    dns_server: 100.68.142.13:5353
    managed_by: user systemd dnsmasq on tony_dell
    notes:
      - If PostgreSQL moves to another host, update /home/tony/.config/dnsmasq/postgre.conf on tony_dell and restart dnsmasq-postgre.service.
      - tony_omen resolves postgre via tailscale0 DNS 100.68.142.13:5353.
      - tony_dell resolves postgre via loopback 127.0.0.1:5353; use resolvectl with sudo to set it.
      - Backup/failover plan is in docs/ssot/infrastructure/ssot.yomi-failover.yml.

related_files:
  - docs/ssot/infrastructure/ssot.mcp-debug.yml
  - docs/ssot/infrastructure/ssot.health.yml
  - docs/ssot/apps/ssot.apps.playlive.yml
  - docs/ssot/ssot.mysystem.home.yml
  - docs/ssot/ssot.mysystem.macbook.yml
