  - id: cloudflare-cfat
    title: Cloudflare API token cfat_ — Zone DNS r/w + Workers Scripts (makes DNS records; /user/tokens/verify rejects it but zone APIs work)
    kind: api-key
    sensitivity: high
    issuer:
      name: Cloudflare dashboard > API Tokens
      url: "https://dash.cloudflare.com/profile/api-tokens"
    rotate:
      url: "https://dash.cloudflare.com/profile/api-tokens"
      steps:
        - "CF panel: roll/edit the cfat_ token"
        - "set CF_API_TOKEN in cloudflare.env on all slots"
    slots:
      - {host: idc01, file: "~/.config/secrets/cloudflare.env", var: CF_API_TOKEN}
      - {host: idc02, file: "~/.config/secrets/cloudflare.env", var: CF_API_TOKEN}
      - {host: idc03, file: "~/.config/secrets/cloudflare.env", var: CF_API_TOKEN}
    consumers:
      - {host: idc03, unit: "claw-channel / DNS automation", note: used for claw.surf-thailand.com AAAA + route}

