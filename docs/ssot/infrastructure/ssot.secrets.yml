      - {host: tony-dell, file: "~/.config/secrets/nodered-ha.env", var: HASS_TOKEN}
      - {host: tony-omen, file: "~/.config/secrets/home-assistant-token.env", var: HA_LONG_LIVED_TOKEN}
    consumers:
