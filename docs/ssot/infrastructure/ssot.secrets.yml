      - {host: tony-dell, file: "~/.config/secrets/archive-ada-pre-idc01-20260925/ada-ha-michael.env", var: HOME_ASSISTANT_TOKEN, note: spare copy}
      - {host: tony-dell, file: "~/.config/secrets/ha-michael-live.env", var: HASS_TOKEN}
      - {host: tony-dell, file: "~/.local/share/home-assistant-michael/ha-token", type: file, note: "raw token file — same value as ha-michael-live.env"}
      - {host: tony-omen, file: "~/.config/secrets/ha-michael-live.env", var: HASS_TOKEN}
      - {host: tony-omen, file: "~/.local/share/home-assistant-michael/ha-token", type: file}
    consumers:
