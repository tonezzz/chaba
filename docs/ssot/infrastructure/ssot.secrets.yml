  - id: gemini-billing-dunning-procedure
    title: STANDARD PROCEDURE — Gemini key exhaustion / billing incidents
    kind: procedure
    sensitivity: low
    note: |
      Triage order when Gemini calls fail (learned 2026-10-10 — both keys
      dead ~5h because they shared one billing account AND one project):
      1. Classify the error — do NOT assume quota:
         - 429 RESOURCE_EXHAUSTED = per-project-model-day quota cap,
           resets midnight US/Pacific. Pool marks the key out until then.
         - 402 Payment Required = billing account out of credit/overage.
         - 403 "Lightning dunning decision is deny" = billing account has a
           PAYMENT problem (declined charge / suspended) — credit top-ups
           alone do not clear it; check payments.google.com + the billing
           console for the declined-payment banner.
      2. Probe each key directly (never infer from a card):
           curl -H "x-goog-api-key: $KEY" -X POST \\
             ".../models/gemini-2.5-flash:generateContent" -d '{"contents":[{"parts":[{"text":"ping"}]}]}'
         The error body names the PROJECT number — verify keys actually
         live in separate projects before assuming any redundancy exists.
      3. Billing-side fixes are TONY's (console/payments) — agents verify
         and document, never promise a recovery time.
      4. While down: mddb embeddings are unaffected (OpenRouter path);
         web_search degrades to duckduckgo automatically; voice Live +
         generateContent tools are dead until billing clears. A billing
         outage is account-wide — key redundancy inside one account is
         NOT redundancy.
      5. Recovery: re-probe until HTTP 200, then `gemini-tier status` to
         confirm wiring, then journal scan for clean calls.
      6. Burn-rate check when spend surprises: journal `usage turn in=N`
         sums ≈ billed input tokens (context resends dominate — ~27k/turn
         × thousands of turns ≈ 185M/day observed 10-10 = tens of $/day).
         Storms (session churn, retry loops) multiply this — check
         ops-events + session churn before blaming organic usage.
      Prevention gaps found 10-10: (a) both fleet keys lived in ONE
      project under ONE billing account — no real free-tier rollback;
      (b) no budget alert on the billing account; (c) context resend is
      the dominant cost driver, governed by ssot.tokens.policy.yml.

