title: Secrets Console manifest — credential -> slot -> consumer map
version: 1
created: '2026-09-21'
maintainer: tony
status: active

# BACKUP TOPOLOGY (2026-10-09)
# - idc03 ~/scripts/secrets-backup.sh (daily 03:00, secrets-backup.timer):
#   age tarball of idc03 creds -> idc02, idc01, tony-dell-m2m, tony-omen
#   (~/secrets-backup/secrets-*.tar.age, 14-day retention).
# - chaba scripts/ops/secrets-collect.sh (weekly Sun 04:00, secrets-collect.timer
#   on tony-omen): pulls credential-shaped paths from ALL hosts
#   (idc01/02/03, tony-dell, mn01, tony-omen) ->
#   ~/secrets-backup/hosts/<host>-*.tar.age on tony-omen, rsync-mirrored to
#   tony-dell. Keep 7 per host. Collected paths (relative to $HOME):
#   .config/secrets .ssh .config/rclone .config/camwall.env
#   .config/systemd/user .config/.wrangler .config/gh .git-credentials
#   .config/devin/mcp_config.json
#   .local/share/home-assistant-michael/ha-token
#   .local/share/tuya/{credentials,project-creds}.json
# - Restore either kind: age -d -i ~/.config/secrets/backup-age.key <file> | tar xz -C ~/
#   backup-age.key private half lives on tony-dell, tony-omen, idc01, idc02,
#   idc03 (omen added 2026-10-09 — backup store can now self-restore).
# - secrets-console.service also live-replicates writes to
#   SECRETS_VAULT_REPLICA=tony-omen:~/.local/share/secrets-vault/
#   (age-encrypted vault.json.enc — separate from the tarball flow).
# - Quarantined-but-kept secrets live in ~/.config/secrets/_attic-YYYYMMDD/.
# Cloudflare token split (verified 2026-10-09): cfat_ on idc01/02/03 has
# Zone DNS r/w + Workers Scripts (made the claw/api/ada-ha records);
# cfut_ on tony-dell/tony-omen has Workers Scripts only (no DNS, no KV);
# wrangler OAuth on tony-dell/tony-omen has KV/routes/scripts (no DNS write).

# METADATA ONLY — no secret values in this file, ever. Values live in the
# env files below; the console fingerprints them at runtime, never returns
# contents. Slot types: var = VAR=value line in an env file (default);
# file = whole file is the secret; unit = inline Environment= line in a
# systemd user unit. sensitivity: high = grants write/control; medium =
# read-only/scoped; low = LAN-local. consumers = units to restart post-write.

credentials:

  - id: gemini-ada
    title: Gemini API key — Ada voice services (LEAKED 2026-09-21, devin-bank transcript)
    kind: api-key
    sensitivity: high
    note: "FREE-TIER key — standard procedure is `gemini-tier hybrid` (since 2026-10-10): this key stays GEMINI_API_KEY primary in every slot; gemini-ada-paid rides as GEMINI_API_KEY_2 spillover (ADA_GEMINI_KEY_POLICY=priority, gemini_pool free-first). A free-tier 429 marks (key,model) out and the paid key serves until the Pacific daily reset. `gemini-tier free` = single-key rollback, `gemini-tier paid` = paid-only. Switcher + both keys on idc03 (~/.local/bin/gemini-tier, ~/.config/secrets/gemini-keys.env)."
    issuer:
      name: Google AI Studio
      url: "https://aistudio.google.com/apikey"
    rotate:
      url: "https://aistudio.google.com/apikey"
      steps:
        - "Create a new key in AI Studio"
        - "console: set all slots, restart consumers"
        - "Delete the old key in AI Studio (kills leaked copies)"
    slots:
      - {host: idc03, file: "~/.config/secrets/ada-pi-pwa.env", var: GEMINI_API_KEY, note: primary since 2026-10-06 idc03 cutover}
      - {host: idc03, file: "~/.config/secrets/ada-ha-tony.env", var: GEMINI_API_KEY}
      - {host: idc03, file: "~/.config/secrets/ada-ha-michael.env", var: GEMINI_API_KEY}
      - {host: idc01, file: "~/.config/secrets/ada-pi-pwa.env", var: GEMINI_API_KEY, note: "warm-DR standby; same value also in the masked ada-ha-tony/ada-ha-michael envs"}
      - {host: mn01, file: "~/.config/secrets/ada-ha-tony.env", var: GEMINI_API_KEY, note: standby}
      - {host: mn01, file: "~/.config/secrets/ada-ha-michael.env", var: GEMINI_API_KEY, note: standby}
      - {host: tony-dell, file: "~/.config/secrets/archive-ada-pre-idc01-20260925/", status: "archived 2026-09-25 — all ada/mddb units retired on dell"}
    consumers:
      - {host: idc03, unit: ada-pi-pwa.service}
      - {host: idc03, unit: ada-ha-tony.service}
      - {host: idc03, unit: ada-ha-michael.service}
      - {host: idc01, unit: ada-pi-pwa.service, note: warm-DR standby (running, not primary)}
      - {host: mn01, unit: ada-ha-tony.service, note: standby}
      - {host: mn01, unit: ada-ha-michael.service, note: standby}

  - id: gemini-ada-paid
    title: Gemini API key — Ada fleet, paid tier (billing-enabled GCP project, 2026-10-10)
    kind: api-key
    sensitivity: high
    issuer:
      name: Google AI Studio
      url: "https://aistudio.google.com/apikey"
    note: "Fixes the free-tier 429 brownout (card ada-gemini-free-tier-quota: 20 req/day/project/model cap, 744 failures on 10-09). Lives in a separate billed project so gemini-ada stays intact for rollback. Deployed as GEMINI_API_KEY_2 spillover under ADA_GEMINI_KEY_POLICY=priority (ada-pi b241477) — only serves when the free key marks exhausted. Caveat: Live voice sessions use the primary GEMINI_API_KEY directly, so voice runs on free-tier Live quota in hybrid mode — no spillover path for Live (separate quota, generous for single-user)."
    slots:
      - {host: idc03, file: "~/.config/secrets/gemini-keys.env", var: GEMINI_API_KEY_PAID, note: source of truth — gemini-tier rewrites the service envs from here}
      - {host: idc03, file: "~/.config/secrets/ada-ha-tony.env", var: GEMINI_API_KEY}
      - {host: idc03, file: "~/.config/secrets/ada-ha-michael.env", var: GEMINI_API_KEY}
      - {host: idc03, file: "~/.config/secrets/ada-dev.env", var: GEMINI_API_KEY}
      - {host: idc03, file: "~/.config/secrets/ada-kk.env", var: GEMINI_API_KEY}
      - {host: idc03, file: "~/.config/secrets/ada-pi-pwa.env", var: GEMINI_API_KEY}
      - {host: idc03, file: "~/.config/secrets/mddb-gemini.env", var: GEMINI_API_KEY}
    consumers:
      - {host: idc03, unit: ada-ha-tony.service}
      - {host: idc03, unit: ada-ha-michael.service}
      - {host: idc03, unit: ada-dev.service}
      - {host: idc03, unit: ada-kk.service}
      - {host: idc03, unit: ada-pi-pwa.service}
      - {host: idc03, unit: ada-embed-bench.service}

  - id: gemini-yomi
    title: Gemini API key — yomi-api + local tools
    kind: api-key
    sensitivity: medium
    issuer:
      name: Google AI Studio
      url: "https://aistudio.google.com/apikey"
    slots:
      - {host: tony-omen, file: "~/.config/systemd/user/yomi-api.service.d/override.conf", var: GEMINI_API_KEY, type: unit}
      - {host: tony-omen, file: "~/.config/secrets/ada-pi-pwa.env", var: GEMINI_API_KEY, note: local copy}
    consumers:
      - {host: tony-omen, unit: yomi-api.service}

  - id: gemini-ops
    title: Gemini API key — tony-dell ops services (ha-live, card-snapshot, node-red, mic-test)
    kind: api-key
    sensitivity: medium
    issuer:
      name: Google AI Studio
      url: "https://aistudio.google.com/apikey"
    slots:
      - {host: tony-dell, file: "~/.config/secrets/gemini-api-key.env", var: GEMINI_API_KEY}
      - {host: tony-dell, file: "~/.config/secrets/gemini-mic-test.env", var: GEMINI_API_KEY}
    consumers:
      - {host: tony-dell, unit: ha-live.service}
      - {host: tony-dell, unit: ha-card-snapshot.service}
      - {host: tony-dell, unit: node-red.service}

  - id: ha-michael-live-token
    title: michael-ha long-lived access token (LEAKED 2026-09-21, devin-bank transcript)
    kind: ha-token
    sensitivity: high
    issuer:
      name: michael-ha Profile > Security > Long-lived tokens
      url: "http://michael-ha:8123/profile/security"
    rotate:
      url: "http://michael-ha:8123/profile/security"
