    kind: ha-token
    sensitivity: high
    issuer:
      name: tony-ha Profile > Security
      url: "https://tony-dell.taila0626a.ts.net:8123/profile/security"
    rotate:
      url: "https://tony-dell.taila0626a.ts.net:8123/profile/security"
