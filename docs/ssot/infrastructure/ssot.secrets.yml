title: Secrets Console manifest — credential -> slot -> consumer map
version: 1
created: '2026-09-21'
maintainer: tony
status: active

# METADATA ONLY — no secret values in this file, ever. Values live in the
# env files below; the console fingerprints them at runtime and never
# returns contents. Slot types:
#   var  — a VAR=value line in an env file (default)
#   file — the whole file is the secret (key JSONs, .txt secrets)
#   unit — an inline Environment=VAR=... line inside a systemd user unit
# sensitivity: high = live credential that grants write/control access;
#   medium = read-only or scoped; low = LAN-local.
# consumer entries are units to `systemctl --user restart` after a write.

credentials:

  - id: gemini-ada
    title: Gemini API key — Ada voice services (LEAKED 2026-09-21, devin-bank transcript)
    kind: api-key
    sensitivity: high
    issuer:
      name: Google AI Studio
      url: "https://aistudio.google.com/apikey"
    rotate:
      url: "https://aistudio.google.com/apikey"
      steps:
        - "Create a new key in AI Studio"
        - "console: set all slots, restart consumers"
        - "Delete the old key in AI Studio (kills leaked copies)"
    slots:
      - {host: mn01, file: "~/.config/secrets/ada-ha-tony.env", var: GEMINI_API_KEY}
      - {host: mn01, file: "~/.config/secrets/ada-ha-michael.env", var: GEMINI_API_KEY}
      - {host: tony-dell, file: "~/.config/secrets/ada-pi-pwa.env", var: GEMINI_API_KEY}
      - {host: tony-dell, file: "~/.config/secrets/ada-ha-tony.env", var: GEMINI_API_KEY, note: spare copy}
      - {host: tony-dell, file: "~/.config/secrets/ada-ha-michael.env", var: GEMINI_API_KEY, note: spare copy}
      - {host: tony-dell, file: "~/.config/secrets/ada-ha-pwa.env", var: GEMINI_API_KEY, note: spare copy}
    consumers:
      - {host: mn01, unit: ada-ha-tony.service}
      - {host: mn01, unit: ada-ha-michael.service}
      - {host: tony-dell, unit: ada-pi-pwa.service}

  - id: gemini-yomi
    title: Gemini API key — yomi-api + local tools
    kind: api-key
    sensitivity: medium
    issuer:
      name: Google AI Studio
      url: "https://aistudio.google.com/apikey"
    slots:
      - {host: tony-omen, file: "~/.config/systemd/user/yomi-api.service.d/override.conf", var: GEMINI_API_KEY, type: unit}
      - {host: tony-omen, file: "~/.config/secrets/ada-pi-pwa.env", var: GEMINI_API_KEY, note: local copy}
    consumers:
      - {host: tony-omen, unit: yomi-api.service}

  - id: gemini-ops
    title: Gemini API key — tony-dell ops services (ha-live, card-snapshot, node-red, mic-test)
    kind: api-key
    sensitivity: medium
    issuer:
      name: Google AI Studio
      url: "https://aistudio.google.com/apikey"
    slots:
      - {host: tony-dell, file: "~/.config/secrets/gemini-api-key.env", var: GEMINI_API_KEY}
      - {host: tony-dell, file: "~/.config/secrets/gemini-mic-test.env", var: GEMINI_API_KEY}
    consumers:
      - {host: tony-dell, unit: ha-live.service}
      - {host: tony-dell, unit: ha-card-snapshot.service}
      - {host: tony-dell, unit: node-red.service}

  - id: ha-michael-live-token
    title: michael-ha long-lived access token (LEAKED 2026-09-21, devin-bank transcript)
    kind: ha-token
    sensitivity: high
    issuer:
      name: michael-ha Profile > Security > Long-lived tokens
      url: "http://michael-ha:8123/profile/security"
    rotate:
      url: "http://michael-ha:8123/profile/security"
      steps:
        - "michael-ha UI: create new long-lived token (name ada-YYYY-MM)"
        - "console: set all slots, restart consumers"
        - "michael-ha UI: delete the old token (kills the leaked one)"
    slots:
      - {host: mn01, file: "~/.config/secrets/ada-ha-michael.env", var: HOME_ASSISTANT_TOKEN}
      - {host: tony-dell, file: "~/.config/secrets/ada-ha-michael.env", var: HOME_ASSISTANT_TOKEN, note: spare copy}
      - {host: tony-dell, file: "~/.config/secrets/ha-michael-live.env", var: HASS_TOKEN}
      - {host: tony-omen, file: "~/.config/secrets/ha-michael-live.env", var: HASS_TOKEN}
    consumers:
      - {host: mn01, unit: ada-ha-michael.service}

  - id: ha-michael-dev-token
    title: michael-dev (HA dev instance on :8124) long-lived token
    kind: ha-token
    sensitivity: medium
    issuer:
      name: michael-dev Profile > Security
      url: "http://127.0.0.1:8124/profile/security"
    rotate:
      url: "http://127.0.0.1:8124/profile/security"
      steps:
        - "michael-dev UI: create token, set slots, delete old token"
    slots:
      - {host: tony-dell, file: "~/.config/secrets/ha-michael-dev.env", var: HASS_TOKEN}
      - {host: tony-dell, file: "~/.config/secrets/ha-michael-dev.env", var: HA_LONG_LIVED_TOKEN}
      - {host: tony-omen, file: "~/.config/secrets/ha-michael-dev.env", var: HASS_TOKEN}
    consumers: []

  - id: ha-tony-token-ops
    title: tony-ha long-lived token — scripts + node-red (home-assistant-token.env / nodered-ha.env)
    kind: ha-token
    sensitivity: high
    issuer:
      name: tony-ha Profile > Security
      url: "https://tony-dell.taila0626a.ts.net:8123/profile/security"
    rotate:
      url: "https://tony-dell.taila0626a.ts.net:8123/profile/security"
      steps:
        - "tony-ha UI: create new long-lived token"
        - "console: set slots, restart node-red"
        - "tony-ha UI: delete the old token"
    slots:
      - {host: tony-dell, file: "~/.config/secrets/home-assistant-token.env", var: HA_LONG_LIVED_TOKEN}
      - {host: tony-dell, file: "~/.config/secrets/nodered-ha.env", var: HASS_TOKEN}
      - {host: tony-omen, file: "~/.config/secrets/home-assistant-token.env", var: HA_LONG_LIVED_TOKEN}
    consumers:
      - {host: tony-dell, unit: node-red.service}

  - id: ha-tony-token-ada
    title: tony-ha tokens used by Ada services — NOTE 3 distinct values observed 2026-09-21 (mn01 ada-ha-tony 128-char; tony-dell ada-ha-tony/ada-ha-pwa JWT; ada-pi-pwa 128-char). Verify which are live before consolidating.
    kind: ha-token
    sensitivity: high
    issuer:
      name: tony-ha Profile > Security
      url: "https://tony-dell.taila0626a.ts.net:8123/profile/security"
    rotate:
      url: "https://tony-dell.taila0626a.ts.net:8123/profile/security"
      steps:
        - "tony-ha UI: create new long-lived token"
        - "console: set slots, restart consumers"
        - "tony-ha UI: delete old tokens"
    slots:
      - {host: mn01, file: "~/.config/secrets/ada-ha-tony.env", var: HOME_ASSISTANT_TOKEN}
      - {host: tony-dell, file: "~/.config/secrets/ada-ha-tony.env", var: HOME_ASSISTANT_TOKEN}
      - {host: tony-dell, file: "~/.config/secrets/ada-ha-pwa.env", var: HOME_ASSISTANT_TOKEN}
      - {host: tony-dell, file: "~/.config/secrets/ada-pi-pwa.env", var: HOME_ASSISTANT_TOKEN}
      - {host: tony-omen, file: "~/.config/secrets/ada-pi-pwa.env", var: HOME_ASSISTANT_TOKEN, note: "if present"}
    consumers:
      - {host: mn01, unit: ada-ha-tony.service}
      - {host: tony-dell, unit: ada-pi-pwa.service}

  - id: notebooklm-rest-keys
    title: NotebookLM REST API scoped keys (per-instance, Ada reads NLM through :3011)
    kind: api-key
    sensitivity: medium
    issuer:
      name: local notebooklm-rest service
      url: ""
    slots:
      - {host: mn01, file: "~/.config/secrets/notebooklm-rest-api.env", var: NOTEBOOKLM_REST_API_KEYS}
      - {host: mn01, file: "~/.config/secrets/ada-ha-tony.env", var: NOTEBOOKLM_REST_API_KEY}
      - {host: mn01, file: "~/.config/secrets/ada-ha-michael.env", var: NOTEBOOKLM_REST_API_KEY}
      - {host: tony-dell, file: "~/.config/secrets/notebooklm-rest-api.env", var: NOTEBOOKLM_REST_API_KEYS}
      - {host: tony-dell, file: "~/.config/secrets/ada-ha-tony.env", var: NOTEBOOKLM_REST_API_KEY, note: spare}
      - {host: tony-dell, file: "~/.config/secrets/ada-ha-michael.env", var: NOTEBOOKLM_REST_API_KEY, note: spare}
    consumers:
      - {host: tony-dell, unit: notebooklm-rest.service}
      - {host: mn01, unit: ada-ha-tony.service}
      - {host: mn01, unit: ada-ha-michael.service}

  - id: ada-device-keys
    title: Ada PWA device API keys (ADA_API_KEY + issued keys JSONs)
    kind: api-key
    sensitivity: high
    issuer:
      name: ada-pi /api/keys mint
      url: ""
    slots:
      - {host: mn01, file: "~/.config/secrets/ada-ha-tony-keys.json", type: file}
      - {host: mn01, file: "~/.config/secrets/ada-ha-michael-keys.json", type: file}
      - {host: mn01, file: "~/.config/secrets/ada-ha-tony.env", var: ADA_API_KEYS}
      - {host: mn01, file: "~/.config/secrets/ada-ha-michael.env", var: ADA_API_KEYS}
      - {host: mn01, file: "~/.config/secrets/ada-vault.env", var: ADA_API_KEY}
      - {host: tony-dell, file: "~/.config/secrets/ada-pi-pwa.env", var: ADA_API_KEY}
    consumers:
      - {host: mn01, unit: ada-ha-tony.service}
      - {host: mn01, unit: ada-ha-michael.service}
      - {host: mn01, unit: obsidian-vault.service}
      - {host: tony-dell, unit: ada-pi-pwa.service}

  - id: google-oauth-client
    title: Google OAuth desktop client (gen-lang-client project) — shared by calendar/tasks auth
    kind: oauth-client
    sensitivity: medium
    issuer:
      name: GCP console > Credentials
      url: "https://console.cloud.google.com/apis/credentials"
    slots:
      - {host: tony-omen, file: "~/.config/secrets/google_credentials.json", type: file}
      - {host: tony-dell, file: "~/.config/secrets/google_credentials.json", type: file}
    consumers: []

  - id: ada-google-calendar-token
    title: Ada Google Calendar/Tasks OAuth refresh token (minted by scripts/ada/google-calendar-auth.py)
    kind: oauth-refresh
    sensitivity: high
    issuer:
      name: google-calendar-auth.py consent flow
      url: ""
    slots:
      - {host: tony-omen, file: "~/.config/secrets/ada-google-calendar-token.json", type: file}
      - {host: mn01, file: "~/.config/secrets/ada-google-calendar-token.json", type: file}
    consumers:
      - {host: mn01, unit: ada-ha-tony.service}

  - id: github-pat
    title: GitHub personal access token — MCP servers + gh CLI
    kind: api-key
    sensitivity: high
    issuer:
      name: GitHub > Settings > Tokens
      url: "https://github.com/settings/tokens"
    rotate:
      url: "https://github.com/settings/tokens"
      steps:
        - "GitHub: generate new token, set slots, delete old token"
    slots:
      - {host: tony-omen, file: "~/.config/secrets/github-mcp.env", var: GITHUB_ACCESS_TOKEN}
      - {host: tony-omen, file: "~/.config/secrets/github-mcp-new.env", var: GITHUB_PERSONAL_ACCESS_TOKEN}
      - {host: tony-dell, file: "~/.config/secrets/github-mcp.env", var: GITHUB_ACCESS_TOKEN}
      - {host: tony-dell, file: "~/.config/secrets/github-mcp-new.env", var: GITHUB_PERSONAL_ACCESS_TOKEN}
    consumers: []

  - id: postgres-mcp
    title: Postgres MCP connection string (contains password)
    kind: dsn
    sensitivity: high
    slots:
      - {host: tony-omen, file: "~/.config/secrets/postgres-mcp.env", var: DATABASE_URL}
      - {host: tony-dell, file: "~/.config/secrets/postgres-mcp.env", var: DATABASE_URL}
    consumers: []

  - id: open-notebook
    title: Open Notebook (encryption key + admin password + Google key)
    kind: bundle
    sensitivity: high
    slots:
      - {host: tony-omen, file: "~/.config/secrets/open-notebook.env", var: OPEN_NOTEBOOK_ENCRYPTION_KEY}
      - {host: tony-omen, file: "~/.config/secrets/open-notebook.env", var: OPEN_NOTEBOOK_PASSWORD}
      - {host: tony-omen, file: "~/.config/secrets/open-notebook.env", var: GOOGLE_API_KEY}
      - {host: tony-dell, file: "~/.config/secrets/open-notebook.env", var: OPEN_NOTEBOOK_ENCRYPTION_KEY}
      - {host: tony-dell, file: "~/.config/secrets/open-notebook.env", var: OPEN_NOTEBOOK_PASSWORD}
      - {host: tony-dell, file: "~/.config/secrets/open-notebook.env", var: GOOGLE_API_KEY}
    consumers: []

  - id: icloud-app-password
    title: iCloud app-specific password (icloud MCP, local mode)
    kind: app-password
    sensitivity: high
    issuer:
      name: appleid.apple.com app passwords
      url: "https://appleid.apple.com"
    rotate:
      url: "https://appleid.apple.com"
      steps:
        - "appleid.apple.com: revoke + create app password, set slot"
    slots:
      - {host: mn01, file: "~/.config/secrets/icloud-mcp.env", var: ICLOUD_APP_PASSWORD}
    consumers: []

  - id: router-asus
    title: ASUS router admin login (two file names for the same router)
    kind: login
    sensitivity: high
    slots:
      - {host: tony-omen, file: "~/.config/secrets/asus-router.env", var: ASUS_ROUTER_PASS}
      - {host: tony-omen, file: "~/.config/secrets/router-192.168.1.1.env", var: ROUTER_PASS}
      - {host: tony-dell, file: "~/.config/secrets/asus-router.env", var: ASUS_ROUTER_PASS}
    consumers: []

  - id: xmeye-dvr
    title: XMEye DVR logins (noble-club + noble-a)
    kind: login
    sensitivity: high
    slots:
      - {host: tony-dell, file: "~/.config/secrets/xmeye-dvr.env", var: XMEYE_DVR_NOBLE_CLUB_PASS}
      - {host: tony-dell, file: "~/.config/secrets/xmeye-dvr.env", var: XMEYE_DVR_NOBLE_A_PASS}
    consumers: []

  - id: xiaomi-miot
    title: Xiaomi MiOT account (username/password/server)
    kind: login
    sensitivity: medium
    slots:
      - {host: tony-omen, file: "~/.config/secrets/xiaomi-miot.env", var: MIOT_PASSWORD}
      - {host: tony-dell, file: "~/.config/secrets/xiaomi-miot.env", var: MIOT_PASSWORD}
    consumers: []

  - id: xiaomi-c100-token
    title: Xiaomi C100 camera token
    kind: device-token
    sensitivity: medium
    slots:
      - {host: tony-omen, file: "~/.config/secrets/xiaomi-c100-token.env", var: XIAOMI_C100_TOKEN}
      - {host: tony-dell, file: "~/.config/secrets/xiaomi-c100-token.env", var: XIAOMI_C100_TOKEN}
    consumers: []

  - id: gev-google-maps
    title: Google Maps API key (GEV 3D view)
    kind: api-key
    sensitivity: medium
    issuer:
      name: GCP console
      url: "https://console.cloud.google.com/apis/credentials"
    slots:
      - {host: tony-dell, file: "~/.config/secrets/gev-google-maps.env", var: GOOGLE_MAPS_API_KEY}
    consumers: []

  - id: nodered-cred-secret
    title: Node-RED credential encryption secret (flows_cred decrypt key)
    kind: file-secret
    sensitivity: high
    slots:
      - {host: tony-dell, file: "~/.config/secrets/nodered-credential-secret.txt", type: file}
      - {host: tony-dell, file: "~/.config/secrets/nodered-ha.env", var: NODE_RED_CREDENTIAL_SECRET}
    consumers:
      - {host: tony-dell, unit: node-red.service}

  - id: chaba-backup-db
    title: chaba backup DB password
    kind: password
    sensitivity: medium
    slots:
      - {host: tony-omen, file: "~/.config/secrets/chaba-backup.env", var: CHABA_BACKUP_DB_PASSWORD}
    consumers: []

  - id: secrets-console-key
    title: Secrets Console write-gate API key (SECRETS_CONSOLE_API_KEY)
    kind: api-key
    sensitivity: high
    slots:
      - {host: tony-dell, file: "~/.config/secrets/secrets-console.env", var: SECRETS_CONSOLE_API_KEY}
    consumers:
      - {host: tony-dell, unit: secrets-console.service}
