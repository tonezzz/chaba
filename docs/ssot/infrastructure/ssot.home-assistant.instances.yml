title: Home Assistant Instances
subtitle: Runtime facts for all Home Assistant instances in the family

instances:
  tony-ha:
    id: tony-ha
    base: ha
    host: tony_dell
    runtime: rootless podman
    network: host
    container: tony-ha
    image: docker.io/homeassistant/home-assistant:stable
    port: 8123
    host_port: 127.0.0.1:8123
    config: /home/tony/.config/home-assistant
    url:
      local: http://127.0.0.1:8123
      tailscale: https://tony-dell.taila0626a.ts.net:8123
      note: 'HA binds loopback only (configuration.yaml http.server_host). No LAN listener; tailscale serve terminates TLS on the tailnet IP. Use the tailscale URL for both internal and external in the HA app (decision: tony-ha-tailscale-only-access). Plain http://tony-dell:8123 fails — tailscaled expects TLS on that port.'
    ssot: docs/ssot/infrastructure/ssot.home-assistant.tony.yml
    mcp: infrastructure/ssot.home-assistant.mcp.yml#servers.tony_ha
    dashboards:
      tony-test:
        ssot: docs/ssot/infrastructure/ssot.home-assistant.dashboards.yml
    status: active

  michael-dev:
    id: michael-dev
    base: michael
    host: tony_dell
    runtime: rootless podman
    network: host
    container: michael-dev
    image: docker.io/homeassistant/home-assistant:2026.9.0
    port: 8124
    host_port: 127.0.0.1:8124
    config: /home/tony/.config/michael-dev
    url:
      local: http://127.0.0.1:8124
      tailscale: https://tony-dell.taila0626a.ts.net:8124
      public: https://michael-dev.surf-thailand.com   # idc02 edge + CF Access gate (job 2026-10-08-michael-dev-edge)
    ssot: docs/ssot/infrastructure/ssot.home-assistant.michael.dev.yml
    mcp: infrastructure/ssot.home-assistant.mcp.yml#servers.michael_dev
    dashboards:
      tony-test:
        ssot: docs/ssot/infrastructure/ssot.home-assistant.dashboards.yml
        active_view: PF4
    service_unit: infrastructure/ssot.services.yml#tony-dell.michael-dev.quadlet.service_unit
    status: active

  ada-ha:
    id: ada-ha
    base: ada
    host: tony_dell
    runtime: rootless podman
    network: podman (NOT host — dev isolation)
    container: ada-ha
    image: docker.io/homeassistant/home-assistant:stable
    port: 8125
    host_port: 127.0.0.1:8125
    config: /home/tony/.config/ada-ha
    url:
      local: http://127.0.0.1:8125
      tailscale: https://tony-dell.taila0626a.ts.net:8125
      note: 'Dev/lab tier — bottom rung of ada-ha -> michael-dev -> tony-ha
        promotion ladder. Fresh config (not a prod clone); no radios, no prod
        integrations, no public route. Ada experiments + ha-exec control cards
        land here first.'
    dashboards:
      chaba-nest:
        note: >-
          Storage dashboard (url_path chaba-nest, created 2026-10-08 via
          lovelace/dashboards/create) — single panel view, iframe card
          iframing https://idc03.taila0626a.ts.net/apps/ha/ada-tony/cms/?embed=1#/chaba-nest
          (viewer api_key embedded per chaba_admin convention; embed=1 =
          document-only CMS mode, added 2026-10-08 in ada-pi 3b69147). Pinned 2nd in
          sidebar via owner user_data sidebar.panelOrder
          [home, chaba-nest, ai, ...] — HA 2026.8 uses key "sidebar" with
          panelOrder/hiddenPanels fields (older sidebar.order/core formats
          are ignored; verified via playlive DOM render).
    status: active
    note: 'created 2026-10-06 by a parallel session — see card
      tony-ha-split-ada-dev'

  michael-ha:
    id: michael-ha
    base: michael
    host: nabu_casa
    type: cloud
    tailscale:
      hostname: michael-ha
      fqdn: michael-ha.taila0626a.ts.net
      note: Canonical Tailscale IP is in ssot.values.yml::hosts.michael_ha.tailscale_ip
    port: 8123
    config: /config
    url:
      tailscale: http://michael-ha:8123/
      cloud: https://nupo4ndqdqydt78zmpq0z5wzp1bdrqgs.ui.nabu.casa/
    ssot: docs/ssot/infrastructure/ssot.home-assistant.michael.yml
    mcp: infrastructure/ssot.home-assistant.mcp.yml#servers.michael_live
    dashboards:
      tony-test:
        ssot: docs/ssot/infrastructure/ssot.home-assistant.dashboards.yml
        note: Live tony-test dashboard is stored in .storage/lovelace.tony_test on michael-ha.
    status: active

status:
  last_updated: "2026-09-15"
  last_verified: "2026-09-15"
  health: active
  notes: |
    tony-ha HA core container is healthy on port 8123, now bound to 127.0.0.1:8123
    and exposed via Tailscale HTTPS at https://tony-dell.taila0626a.ts.net:8123.
    michael-dev HA core container is healthy on port 8124 and exposed via
    Tailscale HTTPS at https://tony-dell.taila0626a.ts.net:8124.
