title: Home Assistant Instances
subtitle: Runtime facts for all Home Assistant instances in the family

instances:
  tony-ha:
    id: tony-ha
    base: ha
    role: prod           # restructure 2026-10-10: sole home-control plane
    host: tony_dell
    runtime: rootless podman
    network: host
    container: tony-ha
    image: docker.io/homeassistant/home-assistant:stable
    port: 8123
    host_port: 127.0.0.1:8123
    config: /home/tony/.config/home-assistant
    url:
      local: http://127.0.0.1:8123
      tailscale: https://tony-dell.taila0626a.ts.net:8123
      note: 'HA binds loopback only (configuration.yaml http.server_host). No LAN listener; tailscale serve terminates TLS on the tailnet IP. Use the tailscale URL for both internal and external in the HA app (decision: tony-ha-tailscale-only-access). Plain http://tony-dell:8123 fails — tailscaled expects TLS on that port.'
    ssot: docs/ssot/infrastructure/ssot.home-assistant.tony.yml
    mcp: infrastructure/ssot.home-assistant.mcp.yml#servers.tony_ha
    dashboards:
      tony-test:
        ssot: docs/ssot/infrastructure/ssot.home-assistant.dashboards.yml
    status: active

  michael-dev:
    id: michael-dev
    base: michael
    host: idc03     # migrated tony-dell -> idc03 2026-10-09
    runtime: rootless podman
    network: podman (was host-net on tony-dell)
    container: michael-dev
    image: docker.io/homeassistant/home-assistant:2026.9.0
    port: 8124
    host_port: 127.0.0.1:8124
    config: /home/tony/.config/michael-dev    # now on idc03
    url:
      local: http://127.0.0.1:8124
      tailscale: https://idc03.taila0626a.ts.net:8124
      public: https://michael-dev.surf-thailand.com   # idc02 edge -> idc03:8124 + CF Access gate
    migration_notes: >-
      .storage/http had server_port 8124 (host-net legacy) — quadlet maps
      8124->8124 (not :8123). server_host was 127.0.0.1 — removed so the
      container binds all ifaces. trusted_proxies needed the podman bridge
      subnet (values::paths.podman_bridge_subnet).
    ssot: docs/ssot/infrastructure/ssot.home-assistant.michael.dev.yml
    mcp: infrastructure/ssot.home-assistant.mcp.yml#servers.michael_dev
    dashboards:
      tony-test:
        ssot: docs/ssot/infrastructure/ssot.home-assistant.dashboards.yml
        active_view: PF4
    service_unit: infrastructure/ssot.services.yml#tony-dell.michael-dev.quadlet.service_unit
    status: active

  ada-ha:
    id: ada-ha
    base: ada
    role: lab            # restructure 2026-10-10: tony-ha=prod, ada-ha+kk-ha=virtual homes for project dev
    host: tony_dell
    runtime: rootless podman
    network: podman (NOT host — dev isolation)
    container: ada-ha
    image: docker.io/homeassistant/home-assistant:stable
    port: 8125
    host_port: 127.0.0.1:8125
    config: /home/tony/.config/ada-ha
    url:
      local: http://127.0.0.1:8125
      tailscale: https://tony-dell.taila0626a.ts.net:8125
      note: 'Dev/lab tier — bottom rung of ada-ha -> michael-dev -> tony-ha
        promotion ladder. NOTE (audit 2026-10-10): no longer a fresh config —
        has organically grown to 340 entities/25 integrations incl. TONY-IP +
        Watch mobile_app, TONY-TV remote, sonoff/tuya/xiaomi/cozylife LAN
        plugs, esphome, cameras. Still no live automations. See
        docs/assessments/ada-ha-consumer-audit-2026-10-10.md.'
    dashboards:
      chaba-nest:
        note: >-
          Storage dashboard (url_path chaba-nest, created 2026-10-08 via
          lovelace/dashboards/create) — single panel view, iframe card
          iframing https://idc03.taila0626a.ts.net/apps/ha/ada-tony/cms/?embed=1#/chaba-nest
          (viewer api_key embedded per chaba_admin convention; embed=1 =
          document-only CMS mode, added 2026-10-08 in ada-pi 3b69147). Pinned 2nd in
          sidebar via owner user_data sidebar.panelOrder
          [home, chaba-nest, ai, ...] — HA 2026.8 uses key "sidebar" with
          panelOrder/hiddenPanels fields (older sidebar.order/core formats
          are ignored; verified via playlive DOM render). Dashboard is
          multi-tab (views): Nest → #/chaba-nest, Polity → #/polity-research,
          Security → #/cctv-walls, Traffic → #/camwall-traffic, Flood →
          #/flood-overview, Board → /chaba-nest/board — each a type:panel
          view with a single iframe card on ?embed=1 (document-only mode).
          Board tab added by Tony 2026-10-09 via HA web UI — iframe →
          https://tony-dell.taila0626a.ts.net/apps/board/ (TAILNET-ONLY:
          board-api 403s non-tailnet writes; blank off-tailnet. The only
          tab not embedding the Ada CMS — it points at the chaba web
          stack on tony-dell, so the tab dies if dell sleeps).
          Tabs chosen by Tony 2026-10-08 to mirror the CMS tab groups; a
          standalone polity-research sidebar dashboard was created then
          removed — the tab is the home.
          Per-topic Reports subviews added 2026-10-08: Polity/Security/
          Traffic/Flood topic tabs are type:sections (max_columns=1) with a
          markdown "Reports →" nav pill above the doc iframe; each links to a
          subview:true view (<topic>-reports, back_path to the topic tab)
          embedding the full CMS browser pre-filtered — ?tab=<topic> for
          security/traffic/flood (CMS tab classification is the filter),
          ?tab=pages&q=polity%7Cnest for polity (q = regex-or-substring
          filter param, ada-pi 29c738e). HA has no nested tabs — subview
          drill-down is the minimal native pattern. Runbook:
          chaba_nest_dashboard in ssot.home-assistant.howto.yml.
    status: active
    note: 'created 2026-10-06 by a parallel session — see card
      tony-ha-split-ada-dev'

  kk-ha:
    id: kk-ha
    base: kk
    role: lab            # restructure 2026-10-10: KK's virtual home for project dev
    host: idc03     # migrated tony-dell -> idc03 2026-10-09 (capacity + stability)
    runtime: rootless podman
    network: podman (NOT host — member isolation)
    container: kk-ha
    image: docker.io/homeassistant/home-assistant:stable
    port: 8126
    host_port: 127.0.0.1:8126
    config: /home/tony/.config/kk-ha
    stack: stacks/tony-dell/kk-ha/   # quadlet + minimal configuration.yaml + scripts.yaml
    url:
      local: http://127.0.0.1:8126
      tailscale: https://idc03.taila0626a.ts.net:8126
      public: https://kk-ha.surf-thailand.com   # idc02 edge -> idc03:8126 + CF Access (kk-ha app)
    note: >-
      KK member node (created 2026-10-09) — minimal HA: Kaewta voice + memory
      only, no hardware integrations. Ada backend ada-kk on idc03 :8007
      (instance kk, own admin key + ada-ha-kk-keys.json store, mounted at
      tailnet /apps/ha/ada-kk). Owner: kk (onboarded via UI — first user).
      Member-node pattern: person.kk identity is shared across nodes; role is
      per-node (owner here, member elsewhere). Voice card dials same-origin
      /ada-ws/kk on the public edge first, tailnet fallback.
      GOTCHA: HA 2026.8 migrates http: to .storage/http on first boot with
      yaml_migration_done — later YAML edits to http: are ignored; patch
      .storage/http stable block instead (trusted_proxies must include the
      podman bridge subnet — ssot.values.yml::paths.podman_bridge_subnet —
      because tailscale serve enters the podman bridge via the gw IP).
    status: active

  michael-ha:
    id: michael-ha
    base: michael
    host: nabu_casa
    type: cloud
    tailscale:
      hostname: michael-ha
      fqdn: michael-ha.taila0626a.ts.net
      note: Canonical Tailscale IP is in ssot.values.yml::hosts.michael_ha.tailscale_ip
    port: 8123
    config: /config
    url:
      tailscale: http://michael-ha:8123/
      cloud: https://nupo4ndqdqydt78zmpq0z5wzp1bdrqgs.ui.nabu.casa/
    ssot: docs/ssot/infrastructure/ssot.home-assistant.michael.yml
    mcp: infrastructure/ssot.home-assistant.mcp.yml#servers.michael_live
    dashboards:
      tony-test:
        ssot: docs/ssot/infrastructure/ssot.home-assistant.dashboards.yml
        note: Live tony-test dashboard is stored in .storage/lovelace.tony_test on michael-ha.
    status: active

status:
  last_updated: "2026-09-15"
  last_verified: "2026-09-15"
  health: active
  notes: |
    tony-ha HA core container is healthy on port 8123, now bound to 127.0.0.1:8123
    and exposed via Tailscale HTTPS at https://tony-dell.taila0626a.ts.net:8123.
    michael-dev HA core container is healthy on port 8124 and exposed via
    Tailscale HTTPS at https://tony-dell.taila0626a.ts.net:8124.
