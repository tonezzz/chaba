title: Chaba System Automation
description: Automated monitoring and maintenance schedules for Chaba infrastructure
version: 8

automation:
  gpu_monitoring:
    script: scripts/gpu-monitor.mjs
    schedule: "*/5 * * * *"
    frequency: every 5 minutes
    log_file: logs/automation/gpu-monitor.log
    data_dir: data/gpu-monitor
    thresholds:
      vram_warning: 80
      vram_critical: 90
      temp_warning: 75
      temp_critical: 85
    status: retired (2026-09-12)
    note: Superseded by tony-omen sensor-reader and the live monitoring dashboard. The script is no longer scheduled.

  system_maintenance:
    script: scripts/system-maintenance.mjs
    workflow: workflows/maintenance/system-cleanup.yml
    schedule: "0 3 * * *"
    frequency: daily at 3 AM
    log_file: logs/automation/system-maintenance.log
    tasks:
      - docker cleanup (images, containers, volumes, cache)
      - journal cleanup (limit to 500M)
      - log cleanup (>30 days)
      - disk space monitoring
      - docker health check
      - gpu monitoring integration
    status: active (2026-08-06)

  overnight_assessment:
    script: scripts/overnight-jobs-expanded.sh
    orchestrator: python3 scripts/orchestrate.py --workflow overnight
    workflow: docs/ssot/infrastructure/ssot.orchestration.overnight.yml
    schedule: "0 2 * * *"
    frequency: daily at 2 AM
    log_file: logs/overnight-TIMESTAMP.log
    report_dir: reports/
    report_retention: 30 days
    features:
      - enhanced health check integration (14 comprehensive areas)
      - enhanced comprehensive log analysis (7-day patterns + frequency analysis)
      - enhanced database performance deep dive (historical trends + long-running queries)
      - extended GPU & queue analysis (job history + patterns)
      - enhanced Yomi system health (rate limit analysis)
      - network performance analysis (interface stats + connectivity)
      - backup verification (status + integrity checks)
      - enhanced container security analysis (Trivy vulnerability scanning + security audit)
      - dependency security audit (outdated packages + vulnerabilities)
      - enhanced system resource deep dive (capacity planning + historical trends)
      - documentation consistency (SSOT validation + hostname checks)
      - configuration validation (YAML + environment variables)
      - MCP health server integration (PostgreSQL for historical analysis)
      - performance baseline comparison (7-day trend analysis + degradation detection)
      - auto-improvement creation (automatic SSOT entry generation for critical findings)
    status: active (2026-08-13)

  worktree_sync:
    script: python3 scripts/worktree-sync.py
    orchestrator: python3 scripts/orchestrate.py --workflow worktrees
    workflow: docs/ssot/infrastructure/ssot.orchestration.worktrees.yml
    schedule: "0 1 * * 0"
    frequency: weekly on Sunday at 1 AM
    log_file: logs/worktree-sync.log
    status: active (2026-08-25)

  backup_system:
    script: scripts/backup-manager.sh
    schedule: "0 2 * * *"
    frequency: daily at 2 AM
    log_file: /var/log/chaba-backup.log
    backup_root: /home/tony/GoogleDrive/Tony AI/backup/chaba
    retention:
      daily: 30 days
      weekly: 12 weeks
      monthly: 6 months
    backup_types:
      - database (PostgreSQL with compression)
      - docker_volumes (postgres_data, redis_data, weaviate_data)
      - configurations (Docker Compose, environment files, SSOT, systemd)
      - documentation (docs directory)

  backup_monitor:
    script: scripts/backup-monitor.sh
    schedule: hourly
    log_file: /var/log/chaba-backup-monitor.log
    checks:
      - backup freshness (36-hour threshold)
      - backup size (10MB minimum)
      - backup integrity (gzip verification)
      - backup completeness
      - backup rotation
      - backup failures
      - disk space

  backup_restoration:
    script: scripts/restore-manager.sh
    features:
      - selective restoration (database, volumes, configs)
      - restoration verification
      - user confirmation prompts
      - safe restoration procedures
    systemd_services:
      - chaba-backup.service
      - chaba-backup.timer
      - chaba-backup-monitor.service
      - chaba-backup-monitor.timer
    status: active (2026-08-13)

  audit_suite:
    ssot: docs/ssot/infrastructure/ssot.audit.yml
    runner: scripts/audits/run.mjs
    schedule: "0 2 * * 0"
    frequency: Sunday at 2 AM
    timer: systemd/chaba-audit.timer
    service: systemd/chaba-audit.service
    log_file: logs/audit-suite.log
    report_dir: reports/audits
    status: active (2026-08-19)

  kb_audit:
    ssot: docs/ssot/ssot.kb.yml
    runner: scripts/auto-kb-quality-audit.mjs
    extra:
      - scripts/kb-categorize-audit.mjs
      - scripts/audits/kb-modularity-audit.mjs
    schedule: "0 4 * * 0"
    frequency: Sunday at 4 AM
    timer: systemd/chaba-kb-audit.timer
    service: systemd/chaba-kb-audit.service
    log_file: logs/kb-audit.log
    reports:
      - reports/KB_QUALITY_AUDIT.json
      - reports/KB_CATEGORIZATION_REPORT.md
      - reports/kb-modularity.json
      - reports/kb-modularity.md
    status: active (2026-08-19)

  mcp-health-snapshot:
    script: scripts/mcp-health-snapshot.mjs
    runner: /usr/bin/node
    schedule: "*/10 * * * *"
    frequency: every 10 minutes
    timer: systemd/mcp-health-snapshot.timer
    service: systemd/mcp-health-snapshot.service
    log_file: logs/mcp-health-snapshot.log
    alert_dir: docs/ssot/focus-inbox
    status: active (2026-08-29)

  system_report:
    ssot: docs/ssot/infrastructure/ssot.reports.yml
    script: scripts/report-system.py
    schedule: "45 6 * * *"
    frequency: daily at 06:45 (after overnight producers)
    timer: systemd/chaba-system-report.timer
    service: systemd/chaba-system-report.service
    log_file: logs/system-report.log
    reports:
      - reports/SYSTEM-REPORT.md
      - reports/system-report.yml
    status: defined (2026-09-26); timer not yet installed on any host

  flood_news:
    ssot: docs/ssot/apps/ssot.apps.cms-reports.yml
    script: scripts/ada/flood-news-update.py --all
    config: scripts/ada/flood-news-feeds.json
    registry: MDDB collection ada-cms-automation (per-page switches/knobs)
    schedule: "every 15min (OnUnitActiveSec) — dispatcher tick"
    frequency: >-
      15-min tick; per-page interval_min gates real work and run_now queues
      one-shot regeneration — worst-case ~15 min latency
    timer: systemd/ada-flood-news.timer
    service: systemd/ada-flood-news.service
    reports:
      - ada-cms-pages flood-report* auto blocks
      - ada-cms-automation last_* registry write-back
    status: committed (2026-09-29); install AFTER merge — the service runs
      %h/CascadeProjects/chaba (master) which lacked the script until then

  gh_runs_watch:
    script: scripts/audits/gh-runs-watch.py --git
    schedule: "every 15min (OnUnitActiveSec)"
    frequency: every 15 minutes
    host: tony-omen (gh authenticated there; tony-dell gh is NOT authed)
    timer: systemd/ada-gh-runs-watch.timer
    service: systemd/ada-gh-runs-watch.service
    outputs:
      - docs/ssot/focus-inbox/*-gh-run-*.yml (committed+pushed via --git)
      - reports/gh-runs/meta.yml + timeline event
    status: committed (2026-09-29); install AFTER merge so omen's master
      checkout has the script — closes "CI failures die in the GH UI" gap

  ada_memory_backup:
    script: scripts/ada/backup-mddb-banks.py --git
    schedule: "30 4 * * *"
    frequency: daily at 04:30
    timer: systemd/ada-memory-backup.timer
    service: systemd/ada-memory-backup.service
    outputs:
      - backups/ada-memory/*.json (repo-bound banks; commits+pushes)
      - ~/.local/share/ada-backups/ (private banks)
    note: feeds the ci.cms-audit snapshot lane — see ssot.quality.yml
    status: active — installed on tony-omen (verified 2026-09-29, next
      run 04:30; pushes the dump to origin master nightly)

  services_regen:
    ssot: docs/ssot/apps/ssot.apps.cms-reports.yml
    script: scripts/ada/host-services-cms.py
    schedule: "30 5 * * 0"
    frequency: weekly Sunday 05:30 (after the audit/kb-audit block)
    host: tony-dell (reaches every host except michael-ha; unreachable
      hosts render a stale-data note by design)
    timer: systemd/chaba-services-regen.timer
    service: systemd/chaba-services-regen.service
    on_failure: >-
      chaba-services-regen-fail.service (OnFailure=) — POSTs a comms entry on
      the cms-services-weekly-regen kanban card via board-api 127.0.0.1:8787;
      writes a docs/ssot/focus-inbox alert into the chaba-tony-dell served
      checkout when the board API is unreachable
    reports:
      - ada-cms-pages services-by-host (index)
      - ada-cms-pages services-{tony-dell,tony-omen,idc01,idc02,mn01,michael-ha}
    status: active — installed on tony-dell 2026-10-04 (kanban card
      cms-services-weekly-regen); service ExecStart also fails the unit on
      any PUBLISH FAIL line so partial publishes alert too

  ada_cms_generators:
    description: >-
      Audit of scripts/ada/*.py generators that publish ada-cms-pages or
      write report artifacts (ada-review corpus, reports/, kanban cards).
      Audited 2026-10-05 (kanban card cms-generator-schedule-audit) against
      live timers on tony-dell, tony-omen, idc01, idc02 — every live+valuable
      generator is ALREADY scheduled; none needed a new timer. The real gap
      was failure visibility, closed by systemd/ada-report-fail@.service +
      OnFailure= on the chain/dedicated units.
    status_enum: "scheduled | manual-on-purpose | dead"
    chain_timers:
      ada-review-refresh.timer:
        host: tony-omen
        schedule: daily 08:45 (Persistent)
        units: systemd/ada-review-refresh.{service,timer}
        entrypoint: scripts/ada/export-transcripts.py
        on_failure: ada-report-fail@ada-review-refresh.service
      kanban-sync.timer:
        host: tony-dell
        schedule: every 15min
        job: ssot.jobs.yml kanban-sync (rendered — do not edit generated unit)
        entrypoint: scripts/ada/kanban-sync.sh (detached worktree, ff-pulls master)
        on_failure: ada-report-fail@kanban-sync.service
    generators:
      # --- ada-cms-pages publishers ---
      host-services-cms.py:
        status: scheduled
        scheduler: chaba-services-regen.timer — Sun 05:30 tony-dell
        outputs: ada-cms-pages services-by-host + services-{6 hosts}
        on_failure: chaba-services-regen-fail.service (precedent unit)
      flood-news-update.py:
        status: scheduled
        scheduler: ada-flood-news.timer — every 15min, idc02 (ssot.jobs.yml)
        outputs: ada-cms-pages flood-report* auto blocks + ada-cms-automation write-back
        note: >-
          STALE DUPLICATE: the pre-migration unit still fires on tony-dell
          alongside idc02 (verified live 2026-10-05) — retire the dell copy.
          No OnFailure: exits 2 on all-skipped ticks (known wart), would
          spam the board.
      news-flood-fetch.py:
        status: scheduled
        scheduler: news-flood.timer — hourly, idc01
        outputs: ada-cms-pages news-flood (md5-gated)
        on_failure: ada-report-fail@news-flood.service
      kanban-cms.py:
        status: scheduled
        scheduler: kanban-sync.timer — every 15min, tony-dell
        outputs: ada-cms-pages dev-kanban (hash-gated)
      vocab-pages-sync.py:
        status: scheduled
        scheduler: ada-review-refresh chain (daily, tony-omen)
        outputs: ada-cms-pages my-words* per-speaker sections
      weekly-digest.py:
        status: scheduled
        scheduler: weekly-digest.timer — Mon 07:00, tony-omen
        outputs: ada-cms-pages digest-weekly
        on_failure: ada-report-fail@weekly-digest.service
      embed-bench.py:
        status: scheduled
        scheduler: ada-embed-bench.timer — Sat 06:00, idc01 (runs --publish)
        outputs: ada-cms-pages embed-route benchmark page
      cms-audit.py:
        status: scheduled
        scheduler: chaba-audit suite audit cms-pages-live — weekly on idc02
          (ssot.audit.yml); CI lane .github/workflows/cms-audit.yml runs the
          snapshot+ratchet variant on pushes
        outputs: ada-cms-pages cms-audit-report (--publish lane)
      cms-normalize-meta.py:
        status: manual-on-purpose
        outputs: rewrites ada-cms-pages doc meta onto the memory-bank schema
        note: maintenance fixup — run after schema changes or cms-audit S* warnings
      # --- report-artifact writers (ada-review corpus / kanban cards) ---
      export-transcripts.py:
        status: scheduled
        scheduler: IS the ada-review-refresh entrypoint (daily 08:45, tony-omen)
        outputs: ~/.local/share/ada-review/ corpus refresh
      session-report.py:
        status: scheduled
        scheduler: event-driven — ada-pi conversation_memory runs it at each
          session end on the ada hosts; export-transcripts --backfill covers
          gaps (manual flag, LLM cost)
        outputs: ~/.local/share/ada/reports/*.json (mirrored to ada-review)
      journal-report.py:
        status: scheduled
        scheduler: ada-review-refresh chain
        outputs: session-ops.jsonl + ops{} merged into reports/*.json
      host-report.py:
        status: scheduled
        scheduler: ada-review-refresh chain
        outputs: host-ops.jsonl
      ha-report.py:
        status: scheduled
        scheduler: ada-review-refresh chain
        outputs: ha-ops.jsonl
      logs-report.py:
        status: scheduled
        scheduler: ada-review-refresh chain (--no-publish; still posts
          host-logs-state report/24h for logs-kanban)
        outputs: infra-digest block + host-logs-state rollup
      ops-report.py:
        status: scheduled
        scheduler: ada-review-refresh chain (personal-tier collectors loop)
        outputs: ada-ops-events.jsonl
      devin-report.py:
        status: scheduled
        scheduler: ada-review-refresh chain
        outputs: devin-ops.jsonl
      net-report.py:
        status: scheduled
        scheduler: ada-review-refresh chain
        outputs: net-ops.jsonl (reads reports/network-inventory-scan-*.json)
      tasks-report.py:
        status: scheduled
        scheduler: ada-review-refresh chain
        outputs: tasks-ops.jsonl
      spend-report.py:
        status: scheduled
        scheduler: ada-review-refresh chain
        outputs: spend-ops.jsonl
      caddy-report.py:
        status: scheduled
        scheduler: ada-review-refresh chain
        outputs: apps-ops.jsonl
      ha-events-report.py:
        status: scheduled
        scheduler: ada-review-refresh chain
        outputs: ha-events-ops.jsonl
      personal-rollup.py:
        status: scheduled
        scheduler: ada-review-refresh chain
        outputs: personal-digest.md + infra-digest.md
      focus-rollup.py:
        status: scheduled
        scheduler: ada-review-refresh chain
        outputs: focus-digest.md + focus-index.json
      bloat-report.py:
        status: scheduled
        scheduler: ada-review-refresh chain
        outputs: MDDB growth block in the digest
      log-shipper.py:
        status: scheduled
        scheduler: ada-review-refresh chain
        outputs: MDDB host-logs collection
      prune-old-docs.py:
        status: scheduled
        scheduler: ada-review-refresh chain
        outputs: retention sweep (host-logs 14d, events/snapshots 30d)
      cms-auto-health.py:
        status: scheduled
        scheduler: kanban-sync.timer — every 15min, tony-dell
        outputs: docs/ssot/kanban/cards/cms-auto-*.yml (committed by wrapper)
      logs-kanban.py:
        status: scheduled
        scheduler: kanban-sync.timer — every 15min, tony-dell
        outputs: docs/ssot/kanban/cards/logs-auto-*.yml
      transcript-index.py:
        status: manual-on-purpose
        outputs: transcript-index.jsonl (stage-1 mechanical index)
        note: no callers anywhere — stage-1 diagnostic kept as a tool; the
          live pipeline produces stage-2 reports via session-report.py at
          session end instead of batch-indexing transcripts
      # --- verified dead ---
      # none — every enumerated generator is either scheduled or a live tool
    out_of_scope_scheduled: >-
      scripts/ada bank/memory pipeline (not cms/report generators, all already
      scheduled): sync-ada-memory-to-mddb (ada-memory-sync, idc01 hourly),
      rollup-summaries (ada-memory-rollup, omen), memory-distill
      (ada-memory-distill, idc01), memory-gap-report (ada-memory-gaps, idc01),
      recall-drift-report (ada-memory-drift, idc01), recall-canary
      (ada-recall-canary, idc01), memory-health-check (ada-memory-health,
      omen), memory-staleness-sweep (ada-memory-staleness, omen),
      backup-mddb-banks (ada-memory-backup, omen), distill-devin-bank
      (devin-bank-distill, idc02 — STALE DUPLICATE still firing on omen),
      sync-devin-summaries (devin-summaries-sync, dell hourly).
    out_of_scope_manual: >-
      consolidate-memory (human-gated inbox promotion), memory-distill-benchmark,
      embed-probe, google-calendar-auth, restore-mddb-banks,
      seed-purchase-criteria, calendar-smoke, webui-timing, flood-hub-check
      (waitlist-gated API probe), render-memory-banks + render-calendar-providers
      (SSOT->runtime renderers, run after registry edits).
    status: audited 2026-10-05

monitoring:
  gpu:
    metrics:
      - memory_used
      - memory_total
      - memory_percent
      - utilization
      - temperature
    retention: indefinite
    alerting:
      - vram_usage_thresholds
      - temperature_thresholds
      - historical_anomaly_detection

  system:
    metrics:
      - disk_usage
      - docker_container_health
      - resource_utilization
    retention: 30 days (logs), indefinite (alerts)
    alerting:
      - disk_space_thresholds
      - container_health_status
      - maintenance_task_failures

data_locations:
  gpu_monitoring:
    usage_log: data/gpu-monitor/gpu-usage.log
    alert_log: data/gpu-monitor/gpu-alerts.log
    historical_data: 24 hours retention

  system_maintenance:
    maintenance_log: logs/maintenance/maintenance.log
    automation_log: logs/automation/system-maintenance.log

  overnight_assessment:
    reports: reports/overnight-assessment-YYYY-MM-DD-HH-MM-SS.md
    archive: reports/archive/
    improvements: docs/ssot/ssot.improvements.yml
    mcp_health_database: PostgreSQL (chaba database, health_checks/alerts tables)

  backup_system:
    backup_root: /home/tony/GoogleDrive/Tony AI/backup/chaba
    daily_backups: daily/ (postgres_*.sql.gz, volumes_*.tar.gz, configs_*.tar.gz, docs_*.tar.gz)
    weekly_backups: weekly/week_YYYY-WW/
    monthly_backups: monthly/month_YYYYMM/
    logs: logs/ (backup_report_*.txt, monitoring_report_*.txt)
    system_logs: /var/log/chaba-backup.log, /var/log/chaba-backup-monitor.log, /var/log/chaba-backup-alerts.log

integration:
  status_api:
    gpu_monitoring: true
    system_health: true
    dashboard_support: true

  gpu_queue:
    resource_allocation: true
    priority_management: true
    load_balancing: true

  ssot:
    auto_improvement_creation: true
    configuration_validation: true
    dependency_tracking: true

troubleshooting:
  common_issues:
    - nvidia-smi not available
    - docker daemon not running
    - insufficient permissions
    - cron service not running
    - log directory permissions
    - hostname resolution failures (/etc/hosts misconfiguration)
    - network connectivity issues (DNS vs HTTP discrepancy)

  log_locations:
    automation: logs/automation/
    maintenance: logs/maintenance/
    gpu_data: data/gpu-monitor/
    reports: reports/

security:
  permissions:
    gpu_monitoring: standard user
    system_maintenance: sudo for journal cleanup
    docker_operations: docker group access

  data_protection:
    - log files should be protected from unauthorized access
    - gpu monitoring data contains system information
    - maintenance logs may contain sensitive system information

maintenance:
  log_rotation:
    automation_logs: monthly review
    maintenance_logs: monthly review
    gpu_monitoring_logs: quarterly review
    assessment_reports: 30-day auto-archive

  data_cleanup:
    gpu_monitoring: manual review before cleanup
    system_logs: automated (>30 days)
    assessment_reports: automated (>30 days)

performance_impact:
  gpu_monitoring: minimal (<1 second per check)
  system_maintenance: variable (1-5 minutes depending on cleanup)
  overnight_assessment: 15-25 minutes (14 comprehensive assessment areas + auto-improvement + Trivy scanning)
  backup_system: 5-15 minutes (full backup with verification)

future_enhancements:
  - web-based monitoring dashboard
  - email/SMS alert notifications
  - predictive maintenance using historical data
  - integration with monitoring services (Prometheus, Grafana)
  - automated remediation for common issues
  - resource usage forecasting

workflow_automation:
  implementation: workflows-mcp (YAML-based workflow orchestration)
  workflow_directory: /home/tony/CascadeProjects/chaba-tony-dell/workflows
  categories:
    - automation: General automation workflows
    - maintenance: System maintenance workflows
    - monitoring: Health monitoring workflows
    - interactive: Interactive workflows with user prompts
  capabilities:
    - YAML workflow definitions
    - Dependency-aware execution
    - Interactive prompts with pause/resume
    - Async job management with queue visibility
    - Server-side secrets management
    - Integration with existing MCP servers
  status: operational (2026-08-10)
  examples:
    - gpu-health-check: GPU monitoring with thresholds and historical stats
    - system-cleanup: System maintenance with Docker, journal, logs, disk, and GPU checks
    - universal-health-check: Auto-detecting health check for home/mobile profiles
    - example-health-check: Basic health check template
