title: Michael IP Address Registry
subtitle: Per-network IP allocations for Michael's home network
icon: 🗺️
ideas:
  - Every allocation links back to a stable device_id in ssot.mac-address-registry.michael.yml
  - Tracks static, DHCP, and discovered allocations
sections:
