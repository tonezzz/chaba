        text: '192.168.1.0/24, gateway 192.168.1.1, SSID unknown. Active hosts discovered by ping sweep from michael-ha.'
  - title: Known allocations
    icon: 📋
    layout: list
    items:
      - label: Count
        text: '15 known allocations; unknown active hosts are in the matching michael-home-scan report'

