id: ssot.devin-claims
title: Session Claim & Checkout Rules
subtitle: How Devin/Ada/Chaba sessions claim work, share checkouts, and converge
category: infrastructure
status: operational
source_of_truth: true

purpose: |
  Parallel sessions caused real breakage (duplicated code, undeclared render
  crashes, version races, wedged rebases, generated-file merge storms). This
  doc is the claim/checkout standard that keeps concurrent sessions safe.

worktree_per_session:
  rule: |
    Card-repo code changes happen in a per-session worktree, never in a
    shared live checkout when another session may be running.
  dispatch: |
    devin-dispatch cuts dispatch-wt-<ts>-<slug> worktrees from local HEAD.
    The branch is dispatch/<ts>-<slug>.
  merge_back: |
    A dispatched worktree is finished when its card reaches review. The
    reviewer merges or discards the branch; kanban-dispatch does NOT merge
    itself. Stale dispatch branches are pruned by weekly maintenance
    (proposed: >7d with no card movement -> archive label, then delete).

deploy_checkouts:
  rule: |
    Served/deploy checkouts are pull-only: chaba-tony-dell (web container
    bind-mount), ada-pi on idc01 (production Ada), ada-pi on idc02
    (staging). Pull --ff-only or --rebase --autostash. Never
    checkout -f / reset --hard on a shared checkout.
  rebase_hygiene: |
    NEVER leave a rebase mid-flight on a deploy checkout — every
    subsequent pull fails silently and the served tree silently drifts
    (incident 2026-10-04: chaba-tony-dell wedged rebase made the live
    board appear stale for hours). If a pull stops, resolve or abort
    immediately; `git status` must not show 'rebase in progress' when
    you walk away.
  snapshots: |
    Snapshot uncommitted work (wip/deploy-snapshot-*) before any pull that
    might conflict, per the ada-pi deploy flow.

claims:
  card_claim: |
    A kanban card is claimed atomically via board-api `do: claim {host}` —
    first writer wins under the API's write flock. Dispatcher sets
    action.status=running + claim.session/claim.host + action.runner.
    Already-claimed cards are skipped by other dispatchers.
  checkout_exclusive: |
    Only one session mutates a checkout's index/working tree at a time.
    If a checkout is dirty from another session, leave the dirt alone and
    commit only your own paths.
  deploy_lock: |
    deploy-card.sh uses flock /tmp/pfg-deploy.lock — concurrent deploys
    are refused. Do not bypass.
  doing_limit: |
    Soft cap on concurrent running cards per session (board warns at 2).
    Host-level cap: KANBAN_HOST_CAP on each dispatcher (dell default 3
    devin-task-* units).

resource_courtesy:
  rule: |
    tony-dell's disk saturates easily (observed 97% util, load ~11 under
    normal agent + desktop + HA load). Every session shares that budget:
    - NEVER run unconstrained scans (find ~, grep -r over repo roots or
      home). Bound every scan (maxdepth, explicit dirs, timeout) and use
      the provided search tools (ripgrep-backed), which are faster and
      permission-aware.
    - O(db-size) walks on multi-GB files (bbolt freelist rebuild, mddb
      verify, rsync of big trees) degrade to hours under contention —
      schedule them, don't stack them.
    - A process stuck in D state on IO is normal under saturation; give
      it time rather than spawning competing retries.
  incident_2026_10_04: |
    mddb snapshot-verify loop: follower snapshots timed out at 6h partly
    because agent find/grep scans were saturating the same disk that had
    to walk a 3.9GB database page-by-page.

generated_artifacts:
  rule: |
    Generated files are regenerated, never hand-merged and ideally never
    tracked. gitignore + render-on-serving-host is the fix for recurring
    merge churn.
  currently_ignored:
    - stacks/web/public/apps/board/index.html
    - stacks/web/public/apps/board/cards.json
    - docs/ssot/kanban/.render-state
  known_generated_but_tracked:
    - docs/ssot/ssot.dev-system.assessment.yml  # regenerated by assessment
      # job; conflicts resolved by taking the newest last_reviewed side.
    # Consider untracking once consumers read it live instead of from git.

finish_and_close_gate:
  rule: |
    A session isn't done until: work summarized, card comms updated,
    changes committed+pushed (or explicitly left dirty with a note),
    and the card moved to review/done. The finish-and-close skill encodes
    this; the focus gate (advance_focus) enforces it for tracked foci.
  card_comms: |
    Progress belongs in card comms[] (from: devin|ada|chaba|tony) — the
    shared channel all agents read. Blocking questions go to requests[]
    with options[] where one-click answers suffice.

references:
  - docs/ssot/infrastructure/ssot.devin-modes.yml
  - docs/ssot/kanban/ssot.kanban.yml  # execution.concurrency protocol
  - AGENTS.md  # parallel-session rules, deploy policy
  - skills: finish-and-close, save-to-focus
