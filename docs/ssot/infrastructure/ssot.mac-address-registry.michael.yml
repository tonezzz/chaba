title: Michael MAC Address Registry
subtitle: MAC registry for Michael's home network devices
icon: 🔗
ideas:
- Treat MAC as an attribute, not a primary key
- Devices with duplicate or unknown MACs are kept separate and linked by device_id
sections:
- title: Network
  icon: 🏠
  layout: list
  items:
  - label: Michael home network
    text: 192.168.1.0/24, gateway 192.168.1.1, scanned via michael-ha (192.168.1.160) over Tailscale SSH
- title: Duplicate MAC handling
  icon: ⚠️
  layout: list
  items:
  - label: Device_id is the primary key
    text: MAC is a soft attribute. If two devices collide, set mac_conflict=true and a shared conflict_group, then resolve with local_ids, observed network, and vendor verification.
- title: Known devices
  icon: 📋
  layout: list
  items:
  - label: Count
    text: 58 devices with known MAC or local ID from HA config and device registry
