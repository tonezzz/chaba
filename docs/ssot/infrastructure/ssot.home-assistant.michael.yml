title: Michael Home Assistant Instance
subtitle: Michael cloud instance configuration for the Home Assistant family

instance:
  id: michael-ha
  base: michael
  upstream_remote: chaba
  upstream_branch: ha
  host: nabu_casa
  type: cloud

tailscale:
  hostname: michael-ha
  fqdn: michael-ha.taila0626a.ts.net
  ip: 100.80.105.88
  status: active
  derp_relay: sin
  direct_connection: false
  ha_url: http://michael-ha:8123/
  note: Reachable via the Tailscale app on Home Assistant OS

services:
  home-assistant-michael:
    url: https://nupo4ndqdqydt78zmpq0z5wzp1bdrqgs.ui.nabu.casa/
    note: Cloud-hosted Home Assistant for Michael (Nabu Casa remote access)
    status: active

deploy:
  script: scripts/home-assistant/deploy-michael.sh
  remote:
    host: michael-ha
    user: root
    port: 22
    config_path: /config
    ssh_key: /home/tony/.ssh/michael-ha
    status: active
    note: SSH key deployed and tested; rsync over Tailscale
  token_file: /home/tony/.local/share/home-assistant-michael/ha-token
  reload_url: http://michael-ha:8123/api/services/homeassistant/reload_core_config
  dashboards:
    source: docs/home-assistant/dashboards/
    destination: /config/lovelace/
    optional: true
    note: Only enable if dashboards are managed as YAML files

addons:
  - id: core_ssh
    name: Terminal & SSH
    status: active
    note: Pre-installed official SSH add-on; configured with ed25519 deploy key and restarted
  - id: a0d7b954_ssh
    name: SSH & Web Terminal
    status: pending
    note: Community alternative; not needed while core_ssh is active

mcp:
  custom_component: ha_mcp_tools
  status: active
  entry_id: 01M1FYJ0RZ107E2PZE81562HA8
  server_user_id: 5831b83ffece4085b808cf6d2e9c3e11
  server_port: 9584
  bind_host: 0.0.0.0
  secret_path: /private_oBVC604-FnxgBDP00t1L9g
  webhook_id: mcp_b7f1f8bbc01e5363d70e556bcf09c0f1
  local_url: http://127.0.0.1:9584/private_oBVC604-FnxgBDP00t1L9g
  tailnet_url: http://tony-dell:19584/private_oBVC604-FnxgBDP00t1L9g
  mcp_path: /private_oBVC604-FnxgBDP00t1L9g
  tunnel:
    type: ssh
    host: tony-dell
    local_port: 19584
    remote: 172.30.32.1:9584
    via: root@michael-ha
    status: active
    verified_at: '2026-09-03'
    note: TCP forward via core_ssh (tcp_forwarding enabled). 172.30.32.1 is the HA core container IP on the hassio network; matches the ExecStart in the tony-dell tunnel service. Systemd user service is enabled and running; a raw GET to the MCP path returns 405, a valid MCP POST returns 200.
  note: ha_mcp_tools loaded; MCP endpoint reachable over the tailnet via tony-dell

packages:
  - docs/home-assistant/configuration/packages/batteries_sankey.yaml
  - docs/home-assistant/configuration/packages/pool_sankey.yaml

dashboards:
  - docs/home-assistant/dashboards/tony-test-current.json
  - docs/home-assistant/dashboards/tony-test-original.json

live_features:
  michael-live:
    path: stacks/web/public/apps/michael-live/
    description: Modular live dashboard using the family/page pattern from TradeCanvas compare.
    family: michael-family
    pages:
      - michael-live
      - michael-live2
    endpoint: /apps/michael-live/

sync_rules:
  - "git -C chaba-michael fetch chaba ha"
  - "git -C chaba-michael rebase chaba/ha michael-ha"
  - "git -C chaba-michael push origin michael-ha"
  - "git -C chaba-michael rebase michael-ha michael-live"
  - "git -C chaba-michael push origin michael-live"
