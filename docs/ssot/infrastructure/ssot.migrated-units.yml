# Migrated-unit manifest — tony-dell full-service migration (OPS-0725)
#
# The card spec requires every migrated unit to declare four facts:
#   {data_dirs, unit_file, secrets_env, front_name}
# This file is that declaration. Paths are host-local (%h = service user's
# home). `front_name` is the stable consumer-facing address — tailnet serve,
# edge route, or direct tailnet-IP port. `null` = confirmed none / N/A.
# `pending` = known to exist but not yet captured — fill on next touch.
#
# Dell powered off 2026-10-20 for multi-day SSD+RAM work (phase 6 verify
# window). Dell returns as failover capacity only (phase 7) — do NOT move
# units back wholesale.
#
# Sources: docs/kb/host-migration-tony-dell.md + card comms; fields verified
# against live units 2026-10-22.

title: Migrated-unit manifest — tony-dell full-service migration (OPS-0725)

