title: Host Capacity & Placement Registry
subtitle: >-
  Per-host capacity snapshot + placement policy for the Chaba ecosystem.
  Re-measured 2026-10-19 post-constellation (pg+yomi+redis+trade→idc03) + 2026-10-18 post-ph3 —
  post kanban-writer migration (OPS-0725 phase 2). Refresh on each service
  deployment/migration phase or via health-check.
icon: "\ud83d\udcbb"
version: 1

hosts:
  tony_dell:
    role: lan-hub   # DRAINING (OPS-0725) — becomes failover capacity after SSD+RAM upgrade
    cpu_cores: 8
    mem_gb: 15.3    # ~7G avail — pressured but stable post-stabilization
    disk_gb: {total: 118, free: 21}     # relieved — 82% used post ph4 offload (was 96%); still drain-priority
    gpu: none
    note: >-
      Household LAN hub — tony-ha + ada-ha (LAN-bound) stay until phase 5.
      Kanban single-writer family moved to idc03 2026-10-16 (OPS-0725 ph2):
      writer units stopped+disabled — do NOT re-enable (split-brain).
      `~/CascadeProjects/chaba-tony-dell` is a FROZEN stale checkout;
      ~25 exec-only units still run code from it — convert to pull-mirror
      or repoint to `~/CascadeProjects/chaba` before dell goes dark.
      Board-api compat shim on dell web proxies old URLs to idc03.
      Ralink USB WiFi adapter physically pins chaba-guest-lan/ha-guest-lan.
  tony_omen:
    role: nest-gpu-lane    # absorbs the LAN group next (tony-ha/ada-ha/go2rtc/camera-panel per OPS-0725 ph5)
    cpu_cores: 12
    mem_gb: 31        # ~25G avail — good room
    disk_gb: {total: 98, free: 56}
    gpu: yes          # GTX1650 4GB — jev/nest serve+train lane, ollama :11434 (user svc, reinstalled 2026-10-12)
    note: >-
      LAN-connected + GPU — target host for dell's LAN-dependent services
      (same network segment keeps devices reachable). heavy/ML workloads,
      development; power-hungry — prefer Colab for burst GPU.
  idc02:
    role: edge-primary   # +capacity-absorber 2026-10-16 — idlest host, bias new VPS placements HERE
    cpu_cores: 4
    mem_gb: 16        # ~8G avail, load <0.5 even after absorbing ~10 ph3 services — absorber confirmed
    disk_gb: {total: 290, free: 205}  # grew after gdrive-tier drained backup backlog
    gpu: none
    note: >-
      public edge (caddy, CF) + tailnet front door (idc02.taila0626a.ts.net,
      serve→caddy:8088→dell compat). Large headroom — preferred target for
      new VPS placements (APIs, timers, standby roles incl. board standby).
  idc03:
    role: backend-hub + kanban-writer   # writer family migrated from dell 2026-10-16 (OPS-0725 ph2)
    cpu_cores: 4
    mem_gb: 16        # ~7G avail, load ~2.4/4 cores post-constellation (pg+redis+yomi+trade) — warm, still watch
    disk_gb: {total: 290, free: 133}  # stabilized after constellation landed (pg+redis+yomi+trade 10-19)
    gpu: none
    note: >-
      Ada backends, MDDB leader, secondary edge (api.surf-thailand.com),
      kk-ha (:8126), michael-dev (:8124), kanban writer family + board-api
      (:8787, serve :10000), runner-agent lane. SATURATION WATCH: 4 cores
      carrying the fleet's write path — reserve for MDDB-local/board-local
      work; new VPS placements default to idc02. Borrows chaba deploy key
      via gh-chaba ssh alias (proper key = OPS-0682). Node.js installed
      2026-10-16 for pre-commit SSOT validation.
  mn01:
    role: legacy-home
    cpu_cores: 4
    mem_gb: 7         # ~4G used
    disk_gb: {total: 234, free: 167}
    gpu: none
    note: legacy/home node; warm capacity. Unreachable at 2026-10-16 probe
      (off-net is normal for it — verify before counting on it).
  tony_macbook:
    role: portable-dev
    cpu_cores: 4
    mem_gb: 16        # i7-6700HQ, MacBookPro13,3
    disk_gb: {total: 234, free: 203}
    gpu: none         # Radeon Pro 450 2GB — Vulkan only, no CUDA/ROCm/OpenCL
    note: >-
      Tony's travel workstation (Ubuntu 26.04 since 2026-10-10). Laptop —
      sleeps/off-net is normal; never a hard dependency. Runner lane cap 2
      labels cpu,dev,portable (enrolled 2026-10-11).
  idc01:
    role: retired    # per ada-voice rules: mddb masked, never unmask
    note: do not place anything — retired, not warm DR.

placement_policy:
  - "LAN-bound services (ha integrations, cameras, radios): tony-dell until OPS-0725 ph5, then tony-omen (same LAN segment)."
  - "Member nodes + dev nodes (no LAN dependency): prefer idc02 — it is the idle absorber since 2026-10-16; VPS headroom beats tony-dell."
  - "VPS-suitable services from dell (OPS-0725): default idc02; idc03 only when co-locating with MDDB or the board checkout."
  - "Ada backends + memory banks: idc03 (co-located with MDDB). idc03 is near-saturated — do not grow it without a capacity check."
  - "Public ingress: idc02 primary, idc03 secondary."
  - "GPU/burst: tony-omen, else Colab free tier."
  - "Backups/DR artifacts: mn01 + idc02/idc03 cold copy."
  - "Single-writer assets (board checkout, card files): exactly one live writer host — currently idc03; standbys stay stopped."

procedure:
  before_deploy:
    - "Check this registry + live 'free -g' / 'df -BG /' on the target."
    - "Match service class -> host via placement_policy."
    - "Record host + reason in the service's SSOT entry / card."
  rebalance_triggers:
    - "disk free < 15% of total, or mem sustained > 80%."
    - "load average sustained > cpu_cores (committed-load saturation — idc03 hit this 2026-10-16)."
    - "any host marked unstable in session notes."
  rebalance_flow:
    - "audit-hosts.py --consolidate + health-monitor alerts (load>80%, disk) feed ops-health; a trigger event = a kanban card naming source host, target host, service list, verify steps."
    - "Move via the service's own stack (quadlet/install.sh per stacks/services/<svc>/) — never ad-hoc rsync."
    - "After the move: re-measure + update this file, verify the moved service's health lane, close the card with evidence."
  capacity_adjust:
    - "Full QA/QC/audit procedure: docs/kb/capacity-adjust.md — measure (3-day sustained, host-loads sampler) -> card with QA plan + ref-sweep -> move via stack -> QC (audit-hosts delta = intended only, route-health, 24h soak) -> audit (update this file + ssot.audit.hosts + evidence on card)."
  add_capacity:
    - "New host: provision OS + tailscale + podman; reachable by tailnet name."
    - "Bootstrap the dispatch runner: scripts/devin/install-devin-host.sh <host> (card runner-bootstrap-check covers verification)."
    - "Register: append a hosts: block here + add to the audit-hosts.py host list (ssot.jobs ~line 128) so capacity stays measured."
    - "First placements go through placement_policy; nothing lands by convenience."
  refresh:
    - "Re-measure this file after any service lands or moves; add 'as-of' date."
    - "OPS-0725 gate: each migration phase exit includes re-measure + this-file update (docs/kb/host-migration-tony-dell.md)."

