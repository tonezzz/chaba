  mn01:
    role: legacy-home
    cpu_cores: 4
    mem_gb: 7         # ~4G used
    disk_gb: {total: 234, free: 167}
    gpu: none
    note: legacy/home node; warm capacity. Unreachable at 2026-10-16 probe
      (off-net is normal for it — verify before counting on it).
  tony_macbook:
    role: portable-dev
    cpu_cores: 4
    mem_gb: 16        # i7-6700HQ, MacBookPro13,3
    disk_gb: {total: 234, free: 203}
    gpu: none         # Radeon Pro 450 2GB — Vulkan only, no CUDA/ROCm/OpenCL
    note: >-
      Tony's travel workstation (Ubuntu 26.04 since 2026-10-10). Laptop —
      sleeps/off-net is normal; never a hard dependency. Runner lane cap 2
      labels cpu,dev,portable (enrolled 2026-10-11).
  idc01:
    role: retired    # per ada-voice rules: mddb masked, never unmask
    note: do not place anything — retired, not warm DR.

placement_policy:
  - "LAN-bound services (ha integrations, cameras, radios): tony-dell until OPS-0725 ph5, then tony-omen (same LAN segment)."
  - "Member nodes + dev nodes (no LAN dependency): prefer idc02 — it is the idle absorber since 2026-10-16; VPS headroom beats tony-dell."
  - "VPS-suitable services from dell (OPS-0725): default idc02; idc03 only when co-locating with MDDB or the board checkout."
  - "Ada backends + memory banks: idc03 (co-located with MDDB). idc03 is near-saturated — do not grow it without a capacity check."
  - "Public ingress: idc02 primary, idc03 secondary."
  - "GPU/burst: tony-omen, else Colab free tier."
  - "Backups/DR artifacts: mn01 + idc02/idc03 cold copy."
  - "Single-writer assets (board checkout, card files): exactly one live writer host — currently idc03; standbys stay stopped."

procedure:
  before_deploy:
    - "Check this registry + live 'free -g' / 'df -BG /' on the target."
    - "Match service class -> host via placement_policy."
    - "Record host + reason in the service's SSOT entry / card."
  rebalance_triggers:
    - "disk free < 15% of total, or mem sustained > 80%."
    - "load average sustained > cpu_cores (committed-load saturation — idc03 hit this 2026-10-16)."
    - "any host marked unstable in session notes."
  rebalance_flow:
    - "audit-hosts.py --consolidate + health-monitor alerts (load>80%, disk) feed ops-health; a trigger event = a kanban card naming source host, target host, service list, verify steps."
    - "Move via the service's own stack (quadlet/install.sh per stacks/services/<svc>/) — never ad-hoc rsync."
    - "After the move: re-measure + update this file, verify the moved service's health lane, close the card with evidence."
  capacity_adjust:
    - "Full QA/QC/audit procedure: docs/kb/capacity-adjust.md — measure (3-day sustained, host-loads sampler) -> card with QA plan + ref-sweep -> move via stack -> QC (audit-hosts delta = intended only, route-health, 24h soak) -> audit (update this file + ssot.audit.hosts + evidence on card)."
  add_capacity:
    - "New host: provision OS + tailscale + podman; reachable by tailnet name."
    - "Bootstrap the dispatch runner: scripts/devin/install-devin-host.sh <host> (card runner-bootstrap-check covers verification)."
    - "Register: append a hosts: block here + add to the audit-hosts.py host list (ssot.jobs ~line 128) so capacity stays measured."
    - "First placements go through placement_policy; nothing lands by convenience."
  refresh:
    - "Re-measure this file after any service lands or moves; add 'as-of' date."
    - "OPS-0725 gate: each migration phase exit includes re-measure + this-file update (docs/kb/host-migration-tony-dell.md)."

