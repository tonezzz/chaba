schema: 1
title: Chaba edge route registry
purpose: >-
  Single source of truth for every HTTP/WS route. Motivation (2026-10-07,
  card edge-route-registry): the same path lived in 5 places — dell Caddy
  monolith, mn01 Caddy copy, VPS public edge, tailscale-serve mounts, and
  hardcoded in card JS (idc01 broke chaba-home/ai). render-routes.py emits
  apps/routes.json for code consumers and (phase 2) per-edge Caddy
  snippets. Rules: hostnames are tailnet names, never IPs (except
  loopback); app code NEVER hardcodes hosts — it resolves via routes.json
  or same-origin relative paths; one host retires = one line here.

edges:
  # an edge = a reverse-proxy surface that serves `routes` entries
  tony-dell-web:
    kind: caddy-container          # stacks/web/Caddyfile, `web` container
    listen: "http://:80 (lan), tailnet via host"
    serves: [lan, tailnet]
  mn01-web:
    kind: caddy                    # mn01 :8080 behind tailscale-serve /
    listen: "http://127.0.0.1:8080 via tailscale-serve /"
    serves: [tailnet, funnel]
  vps-public:
    kind: caddy-edge               # quadlet on idc02/idc03 public IP
    listen: "https://*-ha.surf-thailand.com behind Cloudflare Access"
    serves: [public]
  cf-surf:
    kind: cf-worker                # Cloudflare Workers on surf-thailand.com zone
    listen: "https://claw.surf-thailand.com/* — KV-backed, no origin"
    serves: [public]
    note: "claw-channel lab (card lab-cf-kv-claw-channel): GET unlisted
      paths unauthenticated, POST needs X-Ingest-Key; stack +
      worker in stacks/edge/claw-channel/ + edge/claw-channel/; not a
      routes[] entry — render-routes.py kinds are proxy/static/alias only"
  tony-dell-serve:
    kind: tailscale-serve          # tailnet TLS edge in front of the web caddy
    mounts:
      /: http://127.0.0.1:80                      # web container (all /apps/* routes)
      # Retired (OPS-0754, 2026-10-20 — serve config was wiped; census found
      # nothing local left to proxy):
      #   :8123 tony-ha     -> tony-omen tailscale serve :8123
      #   :8124 michael-dev -> idc03 tailscale serve :8124
      #   :8444 ha-live     -> tony-omen :8444 (-> :9005)
      #   :8448 go2rtc      -> tony-omen :1984 direct (no serve port)
      # Watchdog: check-serve-config.timer alerts when this edge has no config
      #   while a mount is declared here (this file is the expectation).
  idc03-serve:
    kind: tailscale-serve          # host fabric exports
    mounts:
      /: http://127.0.0.1:8002                    # ada-ha-tony (root repointed off ada-pi-pwa :8001, retired 2026-10-23)
      /apps/ha/ada-tony: http://127.0.0.1:8002    # ada-ha-tony backend
      /apps/ha/ada-michael: http://127.0.0.1:8003 # ada-ai-kraut backend (renamed from ada-ha-michael 2026-10-16)
      /apps/ha/ada-dev: http://127.0.0.1:8005     # ada-dev backend (added 2026-10-08 for Chaba AI tab)
      /apps/ha/ada-ha: http://127.0.0.1:8006      # ada-ha-ada backend (Ada lab lane, added 2026-10-23)
      /apps/ha/ada-kk: http://127.0.0.1:8007      # ada-kk backend (Kaewta — KK member node, 2026-10-09)
      # :8447 mount = vcast display front (2026-10-17): whole port proxies to
      # caddy-edge http://127.0.0.1:8749, which serves /srv/public static
      # (apps/vcast/, pair, remote) + strips /api/input-bridge/* ->
      # 127.0.0.1:3010 loopback. Display page+ws no longer ride tony-dell's
      # web caddy — dell restarts were killing screen ws (code 1001 flap).
      # Display URL: https://idc03.taila0626a.ts.net:8447/apps/vcast/
      # dell edge still serves the same paths for clients on the old URL.
      # Canonical display client for screen 1: vcast-real@1.service on idc02
      # (drop-in edge.conf pins VCAST_PAGE/VCAST_API to this :8447 front);
      # fleet @6/@7 still default to the dell edge.
  # api.surf-thailand.com public edge (idc03 caddy-edge) also serves:
  #   /apps/ha/ada-tony/* -> 127.0.0.1:8002 — public redeem + Ada voice PWA
  #   (single-use bearer redeem; mint endpoint stays tailnet-only) 2026-10-08
  #   /install -> /data/install static (fleet one-liner) 2026-10-10
  #   /enroll* -> 127.0.0.1:3010 input-bridge — keyless fleet report-back;
  #   same host_online ops-event contract as stick-announce (2026-10-26,
  #   card fleet-installer-v2). app.surf-thailand.com carries the same
  #   /install+/enroll handles — live since 2026-10-26 (A record
  #   app -> 157.85.102.125 proxied via cf-dns-upsert-when-ready.path on
  #   idc02; LE cert issued; /install 200 + /enroll POST verified).
  # ada-ha.surf-thailand.com edge (idc02 caddy) also serves — same-origin Ada
  # lane so voice cards dial THIS host/path and the network can move underneath:
  #   /ada-ws/tony/*    -> rewrite /apps/ha/ada-tony{uri}    -> https://idc03.taila0626a.ts.net
  #   /ada-ws/michael/* -> rewrite /apps/ha/ada-michael{uri} -> https://idc03.taila0626a.ts.net
  #   /ada-ws/dev/*     -> rewrite /apps/ha/ada-dev{uri}     -> https://idc03.taila0626a.ts.net
  # (rides the CF Access session; ws + /api/* both proxy) 2026-10-09
  # kk-ha.surf-thailand.com edge (idc02 caddy): same-origin lane
  #   /ada-ws/kk/* -> rewrite /apps/ha/ada-kk{uri} -> https://idc03.taila0626a.ts.net
  # then proxy -> https://idc03.taila0626a.ts.net:8126 (member node kk-ha)
  # mn-ha.surf-thailand.com edge (idc02 caddy): Michael's HA —
  #   reverse_proxy -> http://michael-ha.taila0626a.ts.net:8123
  #   renamed 2026-10-16 from michael-ha.surf-thailand.com; old name is now a
  #   301 -> mn-ha (both gated by their own CF Access apps — mn-ha app
  #   0e0e65e0, policies tony + tony-gmail, 720h session, like michael-ha's)
  # tony-ha.surf-thailand.com edge (idc02 caddy): Chaba AI dashboard tabs
  #   redir /chatui -> /chatui/chat.html ; redir /cms -> /cms/
  #   handle_path /chatui* -> rewrite /apps/ha/ada-tony{uri} -> idc03 tailnet
  #   (handle_path strips /chatui; chat card derives ws {base}/ws -> ada-tony
  #    /ws on :8002 — no separate /ada-ws route needed for the tab)
  #   /cms* + /api/cms* -> rewrite /apps/ha/ada-tony{uri} -> idc03 tailnet
  #   (repointed 2026-10-23 off idc03 root/:8001 shared pool onto the tony lane)
  #   /ada-ws/tony/* -> rewrite /apps/ha/ada-tony{uri} -> idc03 tailnet
  #   (voice card same-origin lane; missing route 404'd the card 2026-10-13)
  #   /apps/roster* -> 127.0.0.1:8099 web origin (agents roster console,
  #   card roster-agents-tab; explicit handle needed — catch-all falls to
  #   HA :8123 and 404s unlisted /apps/*) added 2026-10-20

