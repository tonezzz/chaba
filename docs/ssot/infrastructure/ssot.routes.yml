routes:
  # kind: proxy (upstream sees path per `strip`), static (root under
  # /srv/public), alias (301/308 to target). `edges:` defaults to
  # [tony-dell-web]. `verify` = cheap probe for health lane.
  - {id: yt-cache,         kind: static, path: /apps/yt-cache/*,       owner: chaba, custom: true, note: "local media mount /srv/media/yt-cache (not /srv/public)"}
  - {id: yt-corpus,        kind: static, path: /apps/yt-corpus/*,      owner: chaba, custom: true, note: "local media mount /srv/media/yt-corpus — gdrive corpus snapshot on idc02"}
  - {id: board-api,        kind: proxy,  path: /apps/board-api/*,      strip: /apps/board-api, upstream: "https://idc03.taila0626a.ts.net:10000", auth: tailnet-identity-write, owner: chaba, note: "canonical writer on idc03 — forward via tailscale serve so tailnet identity headers stay valid. 2026-10-22: CF-Access-gated public vhosts (tony-ha.surf-thailand.com) inject X-Board-Edge-Key (BOARD_EDGE_KEY env on the edge, BOARD_API_EDGE_KEY on the api) so public-edge writes verify as edge:<cf-email>; tailnet front :8088 keeps tailnet-only guard"}
  - {id: report-api,       kind: proxy,  path: /apps/system-report/api/*, strip: /apps/system-report/api, upstream: "idc02.taila0626a.ts.net:8792", auth: tailnet-identity-write, owner: chaba}
  - {id: system-report,    kind: static, path: /apps/system-report/*,  owner: chaba, public_host: monitor.surf-thailand.com}
  # usage-feed — card wp-usage-pull-render-plesk-worker (OPS-0661):
  # idc03 usage-feed.py pushes aggregate JSON into the idc02 caddy-edge
  # webroot (/data/www/feeds/); edge serves it under a bearer gate so the
  # boards-WP Plesk worker can pull it. Aggregates only — public edge.
  - {id: usage-feed,       kind: static, path: /feeds/usage.json,      edges: [vps-public], owner: chaba, public_host: surf-thailand.com, auth: bearer-token, note: "Caddyfile idc02: @ok header Authorization 'Bearer <CHABA_USAGE_FEED_TOKEN>' else 403; file_server root /data/www. LIVE 2026-10-15 — apex chosen because monitor.* rides CF Access (302 login on every path); verified 403 anon / 200 bearer"}
  - {id: jev-bench,        kind: static, path: /apps/jev-bench/*,      owner: chaba, headers: {Cross-Origin-Opener-Policy: same-origin, Cross-Origin-Embedder-Policy: require-corp, Cross-Origin-Resource-Policy: cross-origin, Cache-Control: "public, max-age=86400"}}
  - {id: webgpu-bench,     kind: static, path: /apps/webgpu-bench/*,   owner: chaba, note: "OPS-0779 — iPhone WebGPU worker probe; CDN-loaded transformers.js so NO cross-origin isolation headers"}
  - {id: gev-cmd,          kind: proxy,  path: /apps/gev-cmd/*,        strip: /apps/gev-cmd, upstream: "100.123.163.11:8790", owner: gev}
  - {id: gev-api,          kind: proxy,  path: /apps/gev/api/*,        upstream: "100.123.163.11:4173", owner: gev}
  - {id: gev,              kind: static, path: /apps/gev/*,            owner: gev}
  - {id: gev-live,         kind: proxy,  path: /apps/gev-live/*,       ws: true, upstream: "100.123.163.11:8789", owner: gev, custom: true, note: "mixed ws-proxy + static sub-handles — hand block in renderer"}
  - {id: gev-token,        kind: proxy,  path: /apps/gev/token,        strip: /apps/gev/token, upstream: "100.123.163.11:8790", owner: gev}
  - {id: gesture-live,     kind: proxy,  path: /apps/gesture-live/*,   ws: true, upstream: "100.123.163.11:8794", owner: gesture, custom: true, verify: {get: "/health", expect: 200}, note: "ws fan-out relay — /ws plus /health on the same port; no static side"}
  - {id: gesture,          kind: static, path: /apps/gesture/*,        owner: gesture, custom: true, verify: {get: "/", expect: 200}, note: "controller + screen pages; /screen rewrites to screen.html"}
  - {id: ada-tony,         kind: proxy,  path: /apps/ha/ada-tony/*,    upstream: "https://idc03.taila0626a.ts.net", upstream_host: idc03.taila0626a.ts.net, ws: /ws, owner: ada-voice, verify: {get: "/", expect: 200}}
