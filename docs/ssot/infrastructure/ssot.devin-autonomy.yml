id: ssot.devin-autonomy
title: Devin autonomy contract — hands-off control, Tony stays in charge
subtitle: >-
  The single file that caps what unattended Devin dispatch may do. Distinct
  axes: card-side `autonomy:` (what ANY automation may do to that card) and
  Ada's tiers (ssot.ada-participation.yml) still apply — this file gates the
  DISPATCHER itself.
category: infrastructure
status: active
source_of_truth: true
card: docs/ssot/kanban/cards/devin-autonomy-contract.yml
related:
  - docs/ssot/infrastructure/ssot.ada-participation.yml   # Ada tier ladder (parallel contract)
  - docs/ssot/infrastructure/ssot.release-lifecycle.yml   # stage gates before production
  - docs/ssot/kanban/cards/release-lifecycle-standard.yml # evidence checker that enforces gates
  - scripts/board/kanban-dispatch.py                      # reads `dispatch:` below
notes: >-
  Queueing is already human-gated (action.status: queued is set via board API
  by Tony or an approved actor). This file adds the safety envelope around
  that approval: when, how much, and never-what.

dispatch:
  kill_switch: /tmp/no-kanban-dispatch   # touch to freeze new claims instantly
  quiet_hours: "00:00-06:00"             # ICT — no new claims inside window
  sessions_per_day: 12                   # claimed-session budget per host per day
  retries_per_card: 2                    # action.attempts > this -> parked + comms
  max_autonomy: t3                       # cards carrying autonomy:t4 are never claimed
  state_file: /tmp/kanban-dispatch-state.json

tiers:
  # mirrors the card-side autonomy: field; the dispatcher intersects card tier
  # with dispatch.max_autonomy — a card may always LOWER its own ceiling
  t0: observe only
  t1: propose (comments/specs on cards, no state change)
  t2: execute in lab/dev twin (worktrees, ada-ha, idc02) — no prod writes
  t3: may promote to prod IF all lifecycle gates pass with evidence attached
  t4: never autonomous — prod secrets, destructive ops, DNS, money, keys

guards:
  immutable_fields: [autonomy, verify]   # agent sessions may never edit these;
                                         # a dispatch diff touching them fails review
  never_without_approval:
    - prod writes without t3 + passed gates
    - secrets/credentials/DNS changes
    - deleting files outside the session worktree
    - editing autonomy/verify/card schema on any card
  failure_rule: >-
    any dispatch failure -> card stays/goes back with a comms note; no silent
    retry beyond retries_per_card; exhausted cards park, they don't loop

control:
  # Tony's levers — the only knobs, everything else is mechanical
  levers:
    - 'card autonomy: tier (per card)'
    - 'action.status: queued (per card — the go signal)'
    - 'this file: kill_switch, quiet_hours, budgets, max_autonomy'
    - 'review column + Ada "what''s pending" digest'
  audit:
    every_claim_appends: comms_tail         # already true via comms_add
    weekly_review_card: true                # auto-card listing autonomous changes (gap: not yet wired)

waiting_cards:
  # KNB-0928 — hands-off processing for safe waiting cards.
  # Extends dispatch/tiers/guards above; it does NOT replace
  # kanban-dispatch, runner-agent, or kanban-act — it names which cards
  # those may touch unattended and what must be true first.
  scope: >-
    Any card a runner, dispatcher, or act-loop may pick up without a
    human watching: action.status=queued with action.type in
    {dispatch, script, container} on an unattended path (timer,
    runner-agent, kanban-act). Manual cards and review-column judgment
    calls (review_kind: decide/triage) are out of scope by definition.
  eligibility:
    all_required:
      - "action.type in [dispatch, script, container] — an executor exists"
      - "action.host/repo resolves to a live runner for this card"
      - "autonomy tier <= dispatch.max_autonomy (t3 ceiling; t4 never)"
      - "card declares artifact + verifier (action.artifact/verifier or auto_done_when/pipeline.goals)"
      - "no open requests: entries on the card"
      - "recoverability class declared (recoverability: R0-R4)"
      - "preflight passes (below)"
  recoverability:
    # Data-class-specific — a backup does NOT make secrets, external
    # accounts, active DB writers, or uncommitted work safe.
    R0: "rebuildable caches/reports/derived data — failure loses nothing"
    R1: "git-tracked worktree state — recoverable iff clean or merged; uncommitted work is NOT recoverable"
    R2: "stateful DB/service data — only with verified backup + integrity check + no active writer"
    R3: "secrets/identity/external accounts — NEVER autonomous, backups irrelevant"
    R4: "production/destructive/deploy — human-gated always"
    rule: >-
      A card's recoverability is the WORST data class it can touch,
      not the best. Mixed work takes the max class. R3/R4 cards may
      still be queued — they just require a human at the gate, which
      the autonomy tier already expresses.
  preflight:
    # runner verifies all of these BEFORE claim/act; any failure defers
    - "runner/timer unit active, heartbeat fresh"
    - "queue depth + per-host session budget within caps"
    - "target host reachable when the card is host-bound"
    - "push credentials proven for the card's repo (push_capable / push:<repo>)"
    - "disk headroom on target above the job floor"
    - "backup freshness verified for R2 cards"
    - "no conflicting locks (deploy lock, card flock, lane/killswitch gates)"
  stop_conditions:
    # any one => stop safely, comms note, no retry storm
    - "stale heartbeat / host unreachable mid-run"
    - "missing declared artifact or verifier failure"
    - "wrong host / dirty or unmerged worktree at close-out"
    - "spend or budget cap hit (litellm keys, API quotas)"
    - "an open Tony request appears on the card mid-run"
    - "kill_switch present (/tmp/no-kanban-dispatch)"
  reporting:
    - "start/finish/fail/stalled summaries -> Telegram via board_notify (debounced)"
    - "daily unattended-run digest — GAP: not yet wired; until then the QC scoreboard + card comms are the record"
  dry_run: >-
    runner-agent/kanban-dispatch dry-run logs the eligibility decision
    without claiming. Any new card class or recoverability class gets a
    dry-run pass before it may run unattended.
  readiness_checklist:
    day1: "eligibility fields present on pilot cards; dry-run logs clean"
    day2: "one R0/R1 card auto-processed end-to-end with verifier evidence"
    day3: "daily report reviewed; kill-switch drill performed; metrics recorded on the card"
  pilots: >-
    Validate with five read-only pilot cards (report generation, digest
    refresh, cache rebuild, doc sync, health probe) — record
    evidence/metrics on the card before widening eligibility beyond
    R0/R1.
