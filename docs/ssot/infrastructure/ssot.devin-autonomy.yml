id: ssot.devin-autonomy
title: Devin autonomy contract — hands-off control, Tony stays in charge
subtitle: >-
  The single file that caps what unattended Devin dispatch may do. Distinct
  axes: card-side `autonomy:` (what ANY automation may do to that card) and
  Ada's tiers (ssot.ada-participation.yml) still apply — this file gates the
  DISPATCHER itself.
category: infrastructure
status: active
source_of_truth: true
card: docs/ssot/kanban/cards/devin-autonomy-contract.yml
related:
  - docs/ssot/infrastructure/ssot.ada-participation.yml   # Ada tier ladder (parallel contract)
  - docs/ssot/infrastructure/ssot.release-lifecycle.yml   # stage gates before production
  - docs/ssot/kanban/cards/release-lifecycle-standard.yml # evidence checker that enforces gates
  - docs/kb/devin-error-handling-standard.md              # companion lane contract (DEV-0253)
  - scripts/board/kanban-dispatch.py                      # reads `dispatch:` below
notes: >-
  Queueing is already human-gated (action.status: queued is set via board API
  by Tony or an approved actor). This file adds the safety envelope around
  that approval: when, how much, and never-what.

dispatch:
  kill_switch: /tmp/no-kanban-dispatch   # touch to freeze new claims instantly
  quiet_hours: "00:00-06:00"             # ICT — no new claims inside window
  sessions_per_day: 12                   # claimed-session budget per host per day
  retries_per_card: 2                    # action.attempts > this -> parked + comms;
                                         # action.lane_envelope.escalation.max_retries
                                         # may only tighten the effective cap
                                         # (max_retries:0 = one shot)
  max_autonomy: t3                       # cards carrying autonomy:t4 are never claimed
  state_file: /tmp/kanban-dispatch-state.json

tiers:
  # mirrors the card-side autonomy: field; the dispatcher intersects card tier
  # with dispatch.max_autonomy — a card may always LOWER its own ceiling
  t0: observe only
  t1: propose (comments/specs on cards, no state change)
  t2: execute in lab/dev twin (worktrees, ada-ha, idc02) — no prod writes
  t3: may promote to prod IF all lifecycle gates pass with evidence attached
  t4: never autonomous — prod secrets, destructive ops, DNS, money, keys

guards:
  immutable_fields: [autonomy, verify]   # agent sessions may never edit these;
                                         # a dispatch diff touching them fails review
  never_without_approval:
    - prod writes without t3 + passed gates
    - secrets/credentials/DNS changes
    - deleting files outside the session worktree
    - editing autonomy/verify/card schema on any card
  failure_rule: >-
    any dispatch failure -> card stays/goes back with a comms note; no silent
    retry beyond retries_per_card; exhausted cards park, they don't loop

control:
  # Tony's levers — the only knobs, everything else is mechanical
  levers:
    - 'card autonomy: tier (per card)'
    - 'action.status: queued (per card — the go signal)'
    - 'this file: kill_switch, quiet_hours, budgets, max_autonomy'
    - 'review column + Ada "what''s pending" digest'
  audit:
    every_claim_appends: comms_tail         # already true via comms_add
    weekly_review_card: true                # auto-card listing autonomous changes (gap: not yet wired)

waiting_cards:
  # KNB-0928 — hands-off processing for safe waiting cards.
  # Extends dispatch/tiers/guards above; it does NOT replace
  # kanban-dispatch, runner-agent, or kanban-act — it names which cards
  # those may touch unattended and what must be true first.
  scope: >-
    Any card a runner, dispatcher, or act-loop may pick up without a
    human watching: action.status=queued with action.type in
    {dispatch, script, container} on an unattended path (timer,
    runner-agent, kanban-act). Manual cards and review-column judgment
    calls (review_kind: decide/triage) are out of scope by definition.
  eligibility:
    all_required:
      - "action.type in [dispatch, script, container] — an executor exists"
      - "action.host/repo resolves to a live runner for this card"
      - "autonomy tier <= dispatch.max_autonomy (t3 ceiling; t4 never)"
      - "card declares artifact + verifier (action.artifact/verifier, action.lane_envelope.artifact/verifier, or auto_done_when/pipeline.goals)"
      - "no open requests: entries on the card"
      - "recoverability class declared (recoverability: R0-R4)"
      - "preflight passes (below)"
  recoverability:
    # Data-class-specific — a backup does NOT make secrets, external
    # accounts, active DB writers, or uncommitted work safe.
    R0: "rebuildable caches/reports/derived data — failure loses nothing"
    R1: "git-tracked worktree state — recoverable iff clean or merged; uncommitted work is NOT recoverable"
    R2: "stateful DB/service data — only with verified backup + integrity check + no active writer"
    R3: "secrets/identity/external accounts — NEVER autonomous, backups irrelevant"
    R4: "production/destructive/deploy — human-gated always"
    rule: >-
      A card's recoverability is the WORST data class it can touch,
      not the best. Mixed work takes the max class. R3/R4 cards may
      still be queued — they just require a human at the gate, which
      the autonomy tier already expresses.
  preflight:
    # runner verifies all of these BEFORE claim/act; any failure defers
    - "runner/timer unit active, heartbeat fresh"
    - "queue depth + per-host session budget within caps"
    - "target host reachable when the card is host-bound"
    - "push credentials proven for the card's repo (push_capable / push:<repo>)"
    - "disk headroom on target above the job floor"
    - "backup freshness verified for R2 cards"
    - "no conflicting locks (deploy lock, card flock, lane/killswitch gates)"
  stop_conditions:
    # any one => stop safely, comms note, no retry storm
    - "stale heartbeat / host unreachable mid-run"
    - "missing declared artifact or verifier failure"
    - "wrong host / dirty or unmerged worktree at close-out"
    - "spend or budget cap hit (litellm keys, API quotas)"
    - "an open Tony request appears on the card mid-run"
    - "kill_switch present (/tmp/no-kanban-dispatch)"
  reporting:
    - "start/finish/fail/stalled summaries -> Telegram via board-api /publish
       (PublicationEvent fan-out; server-side noise policy debounces —
       implemented 2026-11-08 in kanban-dispatch._notify/_flush_notify and
       runner-agent._notify; start=progress is card-audit only, never TG)"
    - "daily unattended-run digest -> scripts/board/unattended-report.py on
       chaba-unattended-report.timer (idc03, daily) — reports/unattended-<date>.md
       + one Telegram milestone"
  implementation: >-
    2026-11-08 (card hands-off-waiting-card-procedure, job
    docs/ssot/jobs/kanban/2026-11-08-hands-off-waiting-cards.yml):
    scripts/board/waiting_cards.py is the canonical evaluator
    (eligibility + preflight + R0-R4 + /publish notify + CLI
    --evaluate/--board/--preflight). kanban-dispatch.py gates claims
    through it (KANBAN_WAITING_GATE=off|warn|strict, default warn —
    declared R3/R4 are NEVER claimed in any mode) plus a pass-level
    preflight (kill switch, deploy lock, disk floor). runner-agent.py
    carries the single-file twin (RUNNER_WAITING_GATE) plus kill-switch
    and disk-floor in _capacity_reason. kanban-act.py gained the
    independent-review gate: report-linked/model_report cards need
    verified_true or git_merged evidence — self-referential checks
    alone cannot auto-close a model report. scripts/board/
    unattended-report.py is the daily digest. Dry-run: waiting_cards
    --evaluate/--board and kanban-act --dry-run; the claim gate itself
    is warn-mode until the readiness checklist flips it to strict.
  dry_run: >-
    waiting_cards.py --evaluate <card> / --board reports verdicts
    without claiming; kanban-act.py --dry-run reports would-act closes;
    KANBAN_WAITING_GATE=off|warn|strict and RUNNER_WAITING_GATE are the
    rollout dials. Any new card class or recoverability class gets a
    dry-run pass before it may run unattended.
  readiness_checklist:
    day1: "eligibility fields present on pilot cards; dry-run logs clean
      — DONE 2026-11-08: 5 read-only pilot cards filed ELIGIBLE
      (unattended-pilot-*), gate verdicts + negative cases verified"
    day2: "one R0/R1 card auto-processed end-to-end with verifier
      evidence — PENDING merge+deploy of this branch, then queue one
      unattended-pilot-* card"
    day3: "daily report reviewed; kill-switch drill performed
      (`touch /tmp/no-kanban-dispatch`, confirm claims freeze, remove);
      flip KANBAN_WAITING_GATE/RUNNER_WAITING_GATE to strict after
      backfilling recoverability on queued cards"
  pilots: >-
    Five read-only pilot cards filed 2026-11-08 (backlog, not queued —
    they run only when a human queues them post-deploy):
    unattended-pilot-report-gen, -digest-refresh, -cache-rebuild,
    -doc-sync, -health-probe — all action.type=script, host=idc03,
    recoverability=R0, autonomy=t2, artifact+verifier declared.
    Gate verdicts: 5/5 ELIGIBLE (waiting_cards --evaluate, 2026-11-08).
    Negative evidence: R3/R4 -> never=True HOLD; open request -> HOLD;
    missing host/artifact/verifier/recoverability -> HOLD; R2 without
    backup proof -> HOLD (tests/board/test_waiting_cards.py, 25 tests).

gate_visibility:
  # standard-gate-visibility-everywhere (OPS-1193, 2026-11-25). Generalizes
  # the OPS-1097 unclaimable-flag and KNB-1183 host-gate work, plus the
  # embed-storm lesson (service-level silent retry burn): the rule is not
  # about cards specifically — it is about ANY queued item and ANY
  # component that declines to act on it.
  rule: >-
    ANY component that decides not to act on a queued item — skip,
    defer, hold, retry-without-progress, park — MUST emit a rate-limited,
    consumer-visible reason on the item itself or on a fleet-level
    surface that a consumer actually reads. A "claim pass skipped" line
    in a journal nobody greps is silent starvation: the item looks
    queued forever and no human or agent ever learns why.
  scope:
    applies_to: >-
      runner-agent, kanban-dispatch, kanban-act, Ada sweep tools,
      mddb workers — and by extension every future claim/act gate,
      including service-level retry loops (embed storms) and non-card
      queues (jobs, lessons, reports, inbox entries).
    decides: >-
      A decision is "not acting": the component evaluated a queued or
      claimable item and chose not to start/finish it this pass. Pure
      pass-level gates (kill switch, quiet hours, load) decide about the
      WHOLE pass, not an item — they owe the fleet surface, not per-item
      comms.
  contract:
    reason:
      - "names WHICH gate declined and the evidence (e.g. 'host
        overloaded (load/core 1.10 > 0.7)', 'labels:[exec] match no
        declared runner') — not a bare 'skipped'"
      - "short enough to act on (~240-500 chars); pointers to runbooks
        or cards when the fix is non-obvious"
    rate_limited:
      - "debounced per distinct NORMALIZED reason — volatile numbers
        stripped (OPS-1314: un-normalized reasons produced ~12k defer
        comms on one card). Same reason within the window = no repost"
      - "per-item notes debounce on the item's own comms; per-host state
        lives in a sidecar ledger (e.g. runner defer-ledger.json)"
    consumer_visible_surface:
      per_item: >-
        card comms via board-api /comment ('<host> defers: <reason>')
        for per-item, per-host refusals. Item-level queues use their own
        visible note field — the invariant is 'the item carries the
        reason', not 'the reason is a comms line'.
      fleet_level: >-
        for fleet-wide or pass-level verdicts: board-api /ready
        verdicts (GET /queue hosts), queue-starve ops-events,
        unattended-report digest. A gate whose verdict lives ONLY in a
        unit journal or state file is non-conforming.
    escalation:
      - "deterministic gaps a human must fix (card no declared runner
        can serve — dispatch_repos.unsatisfiable_reasons) may set
        awaiting_action on the item; transient per-host refusals
        (load, cap, drift) MUST NOT — one host's 'no' is not a fleet
        verdict"
  exemplars:
    - "runner-agent.note_defer + _defer_norm — per-card defer comms,
      GPU_DEFER_SECS window, normalized-reason debounce, awaiting flag
      only for fleet-unclaimable"
    - "kanban-dispatch._defer_note — served-side twin; comms are the
      debounce store (the 2026-11-07 ops0790 ~3h invisible starve is why
      this exists)"
    - "kanban-dispatch._flag_unclaimable / UNCLAIM_MARK — queued card no
      runner can serve writes WHY + awaiting_action (OPS-1097)"
    - "kanban-dispatch.verdict_pass -> POST /ready — pass-level verdicts
      on a fleet surface every queued card is projected onto"
    - "merge-sweep fail_attempt / retry_record_failure — failure IS the
      visible reason (verified:false + last_failure + comms)"
  nonconforming:
    - "bare `continue`/`return` on a queued item with only a journal or
      stdout line — the ops0790 starve pattern"
    - "retry loops that re-attempt a skipped/failed item with no
      surfaced reason and no backoff signal (embed-storm silent burn)"
    - "defer/failure notes that spam: un-debounced or un-normalized
      reasons"
    - "host-level holds visible only in a per-host state file no other
      component or human reads (KNB-1183 class)"
  new_component_checklist:
    - "if your gate can skip/defer/hold/retry a queued item, wire the
      reason to the item or a fleet surface BEFORE shipping — journal
      logging alone does not count"
    - "reuse the existing debounce helpers (note_defer/_defer_norm or
      the item's own comms); do not invent a third retry/debounce
      ledger (see docs/kb/devin-error-handling-standard.md rule 2)"
    - "test the negative case: a gated item must produce exactly one
      visible reason per debounce window, and the surface must be
      readable by a consumer that never opens your journal"
