title: Home Assistant Custom Cards
subtitle: Build, deploy, source, and design context for the forked pfg3d-card and related custom cards

repositories:
  pfg3d-card:
    path: /home/tony/CascadeProjects/sunsynk-power-flow-card
    fork_of: slhub/sunsynk-power-flow-card
    current_commit: 6962e63
    package_version: 7.3.3
    bundle_version: 240
    build:
      command: npm run build
      tool: rollup -c --bundleConfigAsCjs
      output: dist/pfg3d-card.js
    deploy:
      michael-dev:
        target_host: ssot.values.yml::hosts.tony_dell
        target_path: /home/tony/.config/michael-dev/www/pfg3d-card-v240.js
        lovelace_resources: /home/tony/.config/michael-dev/.storage/lovelace_resources
        resource_path: /local/pfg3d-card-v240.js
        restart: systemctl --user restart michael-dev.service
        service_ref: infrastructure/ssot.services.yml#tony-dell.michael-dev.quadlet.service_unit
        test_url: https://tony-dell.taila0626a.ts.net:8124/tony-test/pf4
      michael-ha:
        target_host: ssot.values.yml::hosts.michael_ha
        target_path: /config/www/pfg3d-card-v239.js
        lovelace_resources: /config/.storage/lovelace_resources
        resource_path: /local/pfg3d-card-v239.js
        restart: ha core restart
        test_url: https://nupo4ndqdqydt78zmpq0z5wzp1bdrqgs.ui.nabu.casa/tony-test/pf3
        note: >-
          2026-09-06: michael-ha Tailscale was offline (OOM-killed tailscaled,
          watchdog was disabled), so the bundle was briefly served from
          cdn.jsdelivr.net (@bd29c44). After the add-on restart, bundle v79 and
          the 4 pfg tile images were copied to /config/www and the resource was
          repointed to /local/. PFG2 tab was later removed; current live bundle
          is v122 (source commit may differ from dev). Tailscale watchdog is
          now enabled. Fallback: cdn.jsdelivr.net/gh/tonezzz/sunsynk-power-flow-card@<commit>/dist/...
      tony-ha:
        target_host: ssot.values.yml::hosts.tony_dell
        target_path: /home/tony/.config/home-assistant/www/pfg3d-card-v239.js
        lovelace_resources: /home/tony/.config/home-assistant/.storage/lovelace_resources
        resource_path: /local/pfg3d-card-v239.js
        restart: systemctl --user restart tony-ha.service
        test_url: https://tony-dell.taila0626a.ts.net:8123/
    source_files:
      primary_modifications:
        - src/components/compact/bat/bat-elements.ts
        - src/index.ts
        - src/inverters/dto/custom-entity.ts
      other_modified:
        - src/cards/compact-card.ts
        - src/types.ts
        - src/cards/pfg/history-cache.ts
        - src/cards/pfg/charts/history.ts
        - src/cards/pfg/charts/surface3d.ts
        - src/cards/pfg/charts/bar3d.ts
        - src/cards/pfg/charts/pfg3d-loader.ts
        - src/cards/pfg/charts/pfg3d-chart.ts
        - dist/pfg3d-card.js
      new_untracked:
        - src/cards/ss2-card.ts
        - src/cards/ss3-card.ts
        - src/cards/ss4-card.ts
        - src/cards/pfg-card.ts
        - src/cards/pfg-presets.ts
        - src/cards/pfg-shared.ts
        - src/cards/test2-card.ts
      removed:
        - rollup.config-1754858379256.cjs
    design_notes:
      battery_status_format: "{target}% | {current}%"
      render_anchor:
        x: 290
        y: 358
        align: left-align
        class: st13 st8
      battery_svg_groups:
        plain:
          - Battery1_SOC
          - Battery2_SOC
          - Battery3_SOC
          - Battery4_SOC
        combined:
          - Battery1_SOC_Shutdown
          - Battery1_SOC_Program_Capacity
          - Battery2_SOC_Shutdown
          - Battery2_SOC_Program_Capacity
          - Battery3_SOC_Shutdown
          - Battery3_SOC_Program_Capacity
          - Battery4_SOC_Shutdown
          - Battery4_SOC_Program_Capacity
      overlay_fix_2026_09_04:
        summary: Hide the plain Battery*_SOC <svg> display when the combined '{target}% | {current}%' or '{current}% | {current}%' text is shown.
        logic: >
          Add `data.inverterProg.show || (config.battery*?.shutdown_soc && !config.battery*?.shutdown_soc_offgrid)`
          to the `display:` ternary on the plain `Battery*_SOC` `<svg>` element so it becomes `none` when the
          combined shutdown / program capacity overlay is visible.
      layout: compact-card
      note: |
        The plain SOC group and the combined groups are mutually exclusive.  The combined text uses the
        same battery entity and `left-align st13 st8` style anchored near x=290, y=358 in compact mode.
      ios_camera_thumbnail_fix_2026_09_10:
        summary: Prefer type picture over picture-entity for camera thumbnails in the HA iOS Companion app.
        rationale: picture-entity with camera entities relies on /api/camera_proxy tokens that can expire or return grey image-broken.svg on iOS. type picture loads a plain image URL and is handled reliably by the iOS WebView.
        pattern:
          - entity: avoid if possible; use only for more-info / badges.
          - image: /local/cam/last-*.jpg for static freeze frames, or go2rtc https://.../api/frame.jpeg?src=... for no-cache live frames.
          - tap_action: open more-info for the camera entity, or a go2rtc stream.html / stream.m3u8 URL for live viewing.

cards:
  - id: pfg3d-card
    name: PFG3D Card
    repo_ref: repositories.pfg3d-card
    bundle_version: 240
    deployed_as: "/local/pfg3d-card-v240.js on michael-dev (md5 93f0d7c22b347a427894eac68124a21c); /local/pfg3d-card-v239.js on michael-ha (md5 d39394d4aa1fc64d687792d418ff3176)"
    dashboards:
      - id: tony-test/v0
        tab: V0
        test_url: https://tony-dell.taila0626a.ts.net:8124/tony-test/p0
      - id: tony-test/v1
        tab: V1
        test_url: https://tony-dell.taila0626a.ts.net:8124/tony-test/p0-2
      - id: tony-test/g1
        tab: G1
        test_url: https://tony-dell.taila0626a.ts.net:8124/tony-test/g1
      - id: tony-test/tpl
        tab: TPL
        test_url: https://tony-dell.taila0626a.ts.net:8124/tony-test/tpl
      - id: tony-test/tpl2
        tab: TPL2
        test_url: https://tony-dell.taila0626a.ts.net:8124/tony-test/tpl2
      - id: michael-ha tony-test/v0
        tab: V0
        test_url: https://nupo4ndqdqydt78zmpq0z5wzp1bdrqgs.ui.nabu.casa/tony-test/p0
      - id: michael-ha tony-test/v1
        tab: V1
        test_url: https://nupo4ndqdqydt78zmpq0z5wzp1bdrqgs.ui.nabu.casa/tony-test/p0-2
      - id: michael-ha tony-test/g1
        tab: G1
        test_url: https://nupo4ndqdqydt78zmpq0z5wzp1bdrqgs.ui.nabu.casa/tony-test/g1
      - id: michael-ha tony-test/tpl
        tab: TPL
        test_url: https://nupo4ndqdqydt78zmpq0z5wzp1bdrqgs.ui.nabu.casa/tony-test/tpl
    instance: ssot.home-assistant.michael.dev.yml::environments.dev
  - id: michael-live
    name: Michael Live (ha-live bridge front-end)
    source: stacks/web/public/apps/michael-live/
    instance: ssot.home-assistant.michael.dev.yml::environments.dev

  - id: weather-station-card
    name: Weather Station Card
    source: https://github.com/chriguschneider/weather-station-card
    purpose: Past weather-station sensor history + live current condition + optional weather.* forecast
    use_for:
      - statistics
      - forecast overlay
      - local station (RK900) history
    dashboards:
      - id: tony-test/mn-weather
        tab: mnweather
        instance: ssot.home-assistant.michael.dev.yml::environments.dev
    note: >
      Fits the RK900/RK600 use case because it charts the local Modbus
      sensor history and can overlay weather.forecast_home in the same view.
      Manual install: download weather-station-card.js from the latest GitHub
      release, place in /local/community/weather-station-card/weather-station-card.js,
      and add the module to Lovelace resources.

  - id: pro-v-weather-card
    name: PRO-V Weather Card
    source: https://github.com/mycrouch/pro-v-weather-card
    purpose: Console-style weather-station panel
    use_for:
      - console
      - wind compass
      - current readings
    note: >
      Source-agnostic Ecowitt/PRO-V console clone. Every slot is a GUI-selectable
      entity; panels hide when not configured. Good for a single-glance RK900
      dashboard with clock, moon, forecast, pressure, UV, solar and wind.

  - id: nimbus-weather-card
    name: Nimbus Weather Card
    source: https://github.com/maxfok/nimbus-weather-card
    purpose: Beautiful forecast / multi-source weather view
    use_for:
      - forecast
      - multiple locations
      - weather comparison
    note: Apple Weather-inspired card with tabs, particle effects and hourly/daily toggle.

  - id: apexcharts-card
    name: ApexCharts Card
    source: https://github.com/RomRider/apexcharts-card
    purpose: Highly customisable statistics and time-series charts
    use_for:
      - custom statistics
      - long-term data
      - overlay history and forecast
    note: Use with HA statistics or data_generator to build bespoke wind/temp/humidity charts.

  - id: troinine-weather-forecast-card
    name: Weather Forecast Card (troinine)
    source: https://github.com/troinine/ha-weather-forecast-card
    purpose: Scrollable weather forecast with chart and hourly/daily toggle
    use_for:
      - forecast
      - precipitation
      - hourly daily toggle
    note: Scrollable horizontal forecast list, toggle hourly/daily, chart mode, condition effects, tap actions.

  - id: ltek-weather-flex-card
    name: Weather Flex Card
    source: https://github.com/Ltek/weather-flex-card
    purpose: Sectioned, highly flexible weather/forecast card
    use_for:
      - forecast
      - custom layout
      - multiple weather sources
    note: Independent sections (header, metrics, hourly, daily, sky bar, sun position, clock). Custom overrides per metric.

  - id: tobiasb80-detailed-weather-forecast
    name: Detailed Weather Forecast Card
    source: https://github.com/tobiasb80/detailed-weather-forecast
    purpose: Compact detailed forecast with expandable views
    use_for:
      - forecast
      - detailed view
      - nowcast
    note: Large header, daily/hourly scrolling, expandable details, sunrise/sunset, nowcast precipitation chart.

  - id: jvilhuber-ha-card-weather-conditions
    name: Weather Conditions Card
    source: https://github.com/jvilhuber/ha-card-weather-conditions
    purpose: Composite conditions, marine, air quality, alerts
    use_for:
      - composite weather
      - marine
      - air quality
      - pollen
    note: Combines current/forecast, marine, UV, pollen, air quality, lightning, weather alerts, meteogram, wind map.

  - id: thyraz-weather-forecast-extended
    name: Weather Forecast Extended Card
    source: https://github.com/Thyraz/weather-forecast-extended
    purpose: Default-style forecast with precipitation values
    use_for:
      - forecast
      - precipitation
    note: Large header, daily/hourly, sunrise/sunset markers, precipitation values, nowcast.

cardstyle_policy:
  as_of: "2026-09-23"
  canonical:
    pfg: "Tile-grid renderer; all TPL/workshop/wall tiles"
    pfg2: "Tile-grid renderer, 15x15 default grid; V0/V1 wall views"
    full: "Classic animated sunsynk flow diagram; juWorkshop view on all hosts"
  retired:
    - compact
    - lite
    - test2
    - ss2
    - ss3
    - ss4
    - ju
  notes: >-
    'ju' existed only in the legacy sunsynk-power-flow-card-fork bundles and is
    NOT a cardstyle in pfg3d-card — it matches no dispatch branch and renders
    blank. The retired cardstyles above still have renderers in the bundle
    (code-prune pending) but no dashboard uses them; do not add new cards with
    them. pfg has no flow/arrows chart type, so 'full' is the only animated
    flow view until/unless a flow tile lands.
  legacy_bundles:
    note: >-
      custom:power-flow-card and its bundles (sunsynk-power-flow-card-fork-v*.js,
      power-flow-card-v3.js) retired fleet-wide 2026-09-23: resources deleted on
      tony-ha, michael-ha, michael-dev; stale files removed from www/ on
      tony-ha + michael-dev. pfg3d-card is the only flow/tile card in use.
      v206+v239 both registered pfg-cycle causing a duplicate-element
      DOMException on every dashboard load — that collision is gone.

status:
  last_build: "2026-09-08"
  last_verified: "2026-09-16"
  health: active; pfg3d-card-v239 on michael-dev and tony-ha, v214 on michael-ha (per-host counters — verify cross-host parity by md5sum, not version); legacy power-flow-card bundles retired fleet-wide 2026-09-23; cardstyle inventory is pfg + pfg2 + one 'full' juWorkshop diagram per host — see cardstyle_policy
