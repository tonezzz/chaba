title: Home Assistant Custom Cards
subtitle: Build, deploy, source, and design context for the forked sunsynk-power-flow-card and related custom cards

repositories:
  sunsynk-power-flow-card-fork:
    path: /home/tony/CascadeProjects/sunsynk-power-flow-card
    fork_of: slhub/sunsynk-power-flow-card
    current_commit: 6e85fe2
    package_version: 7.3.3
    bundle_version: 151
    build:
      command: npm run build
      tool: rollup -c --bundleConfigAsCjs
      output: dist/sunsynk-power-flow-card.js
    deploy:
      michael-dev:
        target_host: ssot.values.yml::hosts.tony_dell
        target_path: /home/tony/.config/michael-dev/www/sunsynk-power-flow-card-fork-v151.js
        lovelace_resources: /home/tony/.config/michael-dev/.storage/lovelace_resources
        resource_path: /local/sunsynk-power-flow-card-fork-v151.js
        restart: systemctl --user restart michael-dev.service
        service_ref: infrastructure/ssot.services.yml#tony-dell.michael-dev.quadlet.service_unit
        test_url: https://tony-dell.taila0626a.ts.net:8124/tony-test/pf4
      michael-ha:
        target_host: ssot.values.yml::hosts.michael_ha
        target_path: /config/www/sunsynk-power-flow-card-fork-v151.js
        lovelace_resources: /config/.storage/lovelace_resources
        resource_path: /local/sunsynk-power-flow-card-fork-v151.js
        restart: ha core restart
        test_url: https://nupo4ndqdqydt78zmpq0z5wzp1bdrqgs.ui.nabu.casa/tony-test/pf3
        note: >-
          2026-09-06: michael-ha Tailscale was offline (OOM-killed tailscaled,
          watchdog was disabled), so the bundle was briefly served from
          cdn.jsdelivr.net (@bd29c44). After the add-on restart, bundle v79 and
          the 4 pfg tile images were copied to /config/www and the resource was
          repointed to /local/. PFG2 tab was later removed; current live bundle
          is v122 (source commit may differ from dev). Tailscale watchdog is
          now enabled. Fallback: cdn.jsdelivr.net/gh/tonezzz/sunsynk-power-flow-card@<commit>/dist/...
    source_files:
      primary_modifications:
        - src/components/compact/bat/bat-elements.ts
        - src/index.ts
        - src/inverters/dto/custom-entity.ts
      other_modified:
        - src/cards/compact-card.ts
        - src/types.ts
        - dist/sunsynk-power-flow-card.js
      new_untracked:
        - src/cards/ss2-card.ts
        - src/cards/ss3-card.ts
        - src/cards/ss4-card.ts
        - src/cards/pfg-card.ts
        - src/cards/pfg-presets.ts
        - src/cards/pfg-shared.ts
        - src/cards/test2-card.ts
      removed:
        - rollup.config-1754858379256.cjs
    design_notes:
      battery_status_format: '{target}% | {current}%'
      render_anchor:
        x: 290
        y: 358
        align: left-align
        class: st13 st8
      battery_svg_groups:
        plain:
          - Battery1_SOC
          - Battery2_SOC
          - Battery3_SOC
          - Battery4_SOC
        combined:
          - Battery1_SOC_Shutdown
          - Battery1_SOC_Program_Capacity
          - Battery2_SOC_Shutdown
          - Battery2_SOC_Program_Capacity
          - Battery3_SOC_Shutdown
          - Battery3_SOC_Program_Capacity
          - Battery4_SOC_Shutdown
          - Battery4_SOC_Program_Capacity
      overlay_fix_2026_09_04:
        summary: Hide the plain Battery*_SOC <svg> display when the combined '{target}% | {current}%' or '{current}% | {current}%' text is shown.
        logic: >
          Add `data.inverterProg.show || (config.battery*?.shutdown_soc && !config.battery*?.shutdown_soc_offgrid)`
          to the `display:` ternary on the plain `Battery*_SOC` `<svg>` element so it becomes `none` when the
          combined shutdown / program capacity overlay is visible.
      layout: compact-card
      note: |
        The plain SOC group and the combined groups are mutually exclusive.  The combined text uses the
        same battery entity and `left-align st13 st8` style anchored near x=290, y=358 in compact mode.

