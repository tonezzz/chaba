# Observed inventory surface (card KNB-0019). `servers` above is declared
# truth; this block only declares where the producer looks and which
# declarations are expected to be configured. Never put live observations
# here — they belong in append-only reports/mcp-inventory/ artifacts.
fleet_observation:
  producer: scripts/mcp-inventory.py
  report_node: mcp-fleet
  report_artifact: reports/mcp-fleet/MCP-FLEET-REPORT.md
  cadence: 24h
  config_surfaces:
    devin: ~/.config/devin/mcp_config.json
    windsurf: ~/.config/windsurf/mcp_config.json
    codeium: ~/.config/codeium/mcp_config.json
    opencode: ~/.config/opencode/opencode.json
  expected_statuses:
    - operational
  # Declared-vs-observed scope model (card OPS-0025). Every server in
  # `servers` carries an explicit scope; absence of a `scope:` key is a
  # declaration bug and the producer fails loudly. Host rows in `hosts`
  # are observation targets, not scope — only `agent_lane_hosts` decides
  # which hosts are expected to carry the global agent-lane servers.
  scope_model:
    default: agent-lanes
    agent_lane_hosts: [tony_omen, tony_dell]
    values:
      fleet: expected on every observed host that has a config surface
      agent-lanes: expected only on agent_lane_hosts
      hosts: a YAML list of host keys — expected only on those hosts
    rule: >-
      Scope alone decides which hosts expect a server. A per_host map is an
      implementation override (wrapper/pattern/env), not an inclusion filter;
      use a named-host list to restrict a server. Unknown scope values fail
      the producer instead of silently widening what counts as missing.
  finding_states: [open, carded, suppressed]
  # Human-owned triage of stable finding IDs (open | carded | suppressed).
  # Producers read this map and annotate findings; they never write it.
  # `suppressed` requires a reason; `until` (YYYY-MM-DD) expires it.
  finding_triage:
    # Resolved findings are removed from this map (OPS-0035/36, 2026-11-20);
    # the cards keep the decision trail. Only live findings are triaged here.
    mcp-tony-dell-undeclared-configured:
      state: suppressed
      reason: 'ada-control is injected into opencode.json by OpenChamber, not provisioned as a fleet-managed MCP server'
      by: tony
    mcp-idc02-undeclared-configured:
      state: suppressed
      reason: 'idc02 is a job host with no agent lane; these are OpenChamber Code Mode tools in opencode.json, not fleet declarations'
      by: tony
    mcp-michael-ha-host-unreachable:
      state: suppressed
      reason: 'michael-ha is an HA appliance: SSH key auth is refused by design and the web UI is reachable, so no SSH config surface will ever exist'
      by: tony
  note: >-
    L0 artifacts under reports/mcp-inventory/ are append-only; each host's
    meta.*.yml carries observed state. An unreachable host is reported as
    unreachable with no missing-server findings — unobserved is not missing.
    A reachable host with no MCP client configs is reported as no-config
    (informational, not drift) — an infra host without an agent lane is not
    a declaration violation.
  hosts:
    tony_omen: {ssh: tony-omen, role: primary-workstation}
    tony_dell: {ssh: tony-dell, role: headless-primary}
    mn01: {ssh: mn01, role: services}
    idc02: {ssh: idc02, role: job-host}
    idc03: {ssh: idc03, role: canonical-mddb-primary}
    michael-ha: {ssh: michael-ha, role: appliance}
