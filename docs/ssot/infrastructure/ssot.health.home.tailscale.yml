title: Tailscale funnel & network health checks
subtitle: Tailscale funnel & network health checks
icon: network
services:
- id: ha-live
  name: Home Assistant Live (Gemini Live bridge)
  type: http
  url: https://tony-dell.taila0626a.ts.net:8444/
  expected_status: 200
  timeout: 5
  category: tailscale
  profiles:
  - home
  - mobile
  note: Push-to-talk Gemini Live bridge for Home Assistant on tony-dell:8444, proxied
    by tailscale serve to 127.0.0.1:9005. The old chaba-funnel landing page on 8447
    is decommissioned.
  verification:
  - 'Check bridge: tailscale ssh tony-dell ps -ef | grep ha-live/bridge.py'
  - 'Check port: ss -tlnp | grep 9005'
  - 'Test root: curl -s -o /dev/null -w ''%{http_code}'' https://tony-dell.taila0626a.ts.net:8444/'
  - 'Check tailscale serve: tailscale serve status'
  recovery_actions:
  - 'Restart: cd /home/tony/.config/home-assistant/ha-live && ./restart.sh'
  - 'Check tailscale serve: tailscale serve status'
  host: tony_dell
