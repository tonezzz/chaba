title: Tailscale funnel & network health checks
subtitle: Tailscale funnel & network health checks
icon: network
services:
  - id: ha-live
    name: Home Assistant Live (Gemini Live bridge)
    type: http
    url: https://tony-omen.taila0626a.ts.net:8444/
    expected_status: 200
    timeout: 5
    category: tailscale
    profiles:
      - home
      - mobile
    note: Push-to-talk Gemini Live bridge for Home Assistant on tony-omen:8444, proxied
      by tailscale serve to 127.0.0.1:9005. Evacuated from tony-dell 2026-10-19/20 (OPS-0725 ph5).
    verification:
      - "Check bridge: tailscale ssh tony-omen systemctl --user is-active ha-live"
      - "Test root: curl -sk -o /dev/null -w '%{http_code}' https://tony-omen.taila0626a.ts.net:8444/"
    recovery_actions:
      - "Restart: tailscale ssh tony-omen systemctl --user restart ha-live"
      - "Check tailscale serve: tailscale serve status"
    host: tony_omen

  - id: michael-ha-tailscale
    name: michael-ha via Tailscale
    type: http
    url: http://michael-ha:8123/
    expected_status: 200
    timeout: 15
    category: tailscale
    profiles:
      - home
      - mobile
    disabled: true
    note: "Disabled 2026-10-23 — idc03->michael-ha:8123 deliberately dropped by
      mn-ha-quarantine.service (Tony order). Re-enable when quarantine lifts."
    verification:
      - "tailscale ping -c 3 michael-ha"
    host: michael_ha
