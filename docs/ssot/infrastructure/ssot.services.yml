  gpu-queue:
    container: gpu-queue
    image: node:20-alpine
    port: 3001 (host), 3001 (internal)
    networks: web_default, ai_default (external)
    database: postgres (chaba database)
    scheduling: memory_aware (GPU memory-aware scheduling)
    features:
      - Intelligent scheduling with memory-aware and predictive features
      - Dynamic priority adjustment based on system state
      - Job duration prediction using historical data
      - Multi-layer caching with Redis integration
      - Comprehensive monitoring and metrics
    job_types:
      - embedding (priority 4)
      - txt2vid, cogvideo (priority 3)
      - imagen2, yomi_summary, yomi_daily, yomi_daily_batch (priority 2)
      - llama (priority 1)
    llama_integration:
      - URL: http://ai-llama-server-1:8008/v1/chat/completions
      - Network: ai_default external network
      - Status: Fixed (2026-08-13) - corrected from incorrect IP/port
    prediction_model:
      - Current model: weighted (recent jobs weighted more)
      - Accuracy: 12.20% (improving from 0%)
      - Training data: 41 total jobs, 22 completed
      - Average execution time: 871ms
      - Average queue wait: 3.6s
    status: implemented (2026-08-13), fully operational with improved prediction accuracy