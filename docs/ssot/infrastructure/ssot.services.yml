title: Chaba Services Configuration
subtitle: Service definitions and configurations for Chaba infrastructure
version: 2

tony-omen:
  llama-router:
    container: ai-llama-server-1
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    mode: router (--models-dir, --models-max 2, --models-autoload)
    models:
      - thai-legal-gemma-4b-cpt.Q4_K_M.gguf (5GB)
      - Phi-3-mini-4k-instruct-Q4_K_M.gguf (2.3GB)
    port: 8008 (host), 8008 (internal)
    network: ai_default (external network)
    vram_overhead: ~70MB (vs 4.8GB for separate container)
    routing:
      - /v1/chat/completions → Phi-3-mini-4k-instruct-q4
      - GPU queue → http://ai-llama-server-1:8008/v1/chat/completions
      - MCP llama server → http://ai-llama-server-1:8008
    status: implemented (2026-08-13), network configuration fixed
  postgres:
    container: postgres
    image: postgres:16-alpine
    port: 5432
  mddb:
    container: mddb
    image: tradik/mddb:latest
    port: 11023 (API), 9000 (web)
    status: implemented (2026-08-12)
    routing:
      - /api/mddb/* → mddb:11023 (Caddy reverse proxy)
      - /apps/mddb/* → mddb-panel:3000 (container name routing)
    notes: Personal Knowledge Base system with panel and API services
  mddb-panel:
    container: mddb-panel
    image: tradik/mddb:panel-latest
    port: 3002 (host), 3000 (internal)
    status: implemented (2026-08-13), Caddy routing updated
    routing:
      - /apps/mddb/* → mddb-panel:3000 (container name routing in Caddy)
      - /api/mddb/* → mddb:11023 (Caddy reverse proxy for API)
      - SPA assets: Referer-based routing for /assets/* requests from MDDB panel
    notes: MDDB web panel interface, uses container name for routing. Updated Caddy routing to use handle directive (preserves full path) instead of handle_path for SPA asset loading. Uses Referer-based asset routing to handle root-relative asset requests from the panel.
  gemini-api:
    service: Google Gemini API
    provider: Google Cloud
    models:
      - gemma-4-31b-it (30.7B params, 256K context, frontier performance)
      - gemma-4-26b-a4b-it (25.2B params, 3.8B active, MoE architecture)
      - gemma-4-12b-unified (11.95B params, 256K context)
      - gemini-1.5-flash (fallback model)
    api_key: GEMINI_API_KEY environment variable
    current_key: [Set via GEMINI_API_KEY environment variable - do not commit real keys]
    rate_limit: 15 requests/minute (conservative default, varies by model)
    usage: Yomi summarization (conversation and daily summaries)
    integration: gemini-integration.mjs
    status: implemented (2026-08-06), enabled via USE_GEMINI environment variable
    functions:
      - geminiConversationSummary() - Generate conversation summaries
      - geminiDailySummary() - Generate daily summaries
      - geminiBatchDailySummary() - Generate batch daily summaries
      - testGeminiConnection() - Test API connectivity
    language_support:
      - Thai system prompts for Thai/mixed content
      - English system prompts for English content
      - Language detection via detectLanguage() function
    priority_system:
      - "GEMINI_MAX_DATES: Maximum dates per run (default: 10)"
      - "GEMINI_PRIORITY_MODE: recent, high-activity, all (default: recent)"
      - "prioritizeDates() function for selective re-summarization"
