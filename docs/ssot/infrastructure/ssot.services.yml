tony-omen:
  llama-router:
    container: thai-legal-inference
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    mode: router (--models-dir, --models-max 2, --models-autoload)
    models:
      - thai-legal-gemma-4b-cpt.Q4_K_M.gguf (5GB)
      - Phi-3-mini-4k-instruct-q4.gguf (2.3GB)
    port: 8001 (host), 8000 (internal)
    vram_overhead: ~70MB (vs 4.8GB for separate container)
    routing:
      - /apps/thai-legal/api/* → thai-legal-gemma-4b-cpt.Q4_K_M
      - /v1/*, /apps/chatllama/* → Phi-3-mini-4k-instruct-q4
      - MCP llama server → http://localhost:8001
    status: implemented (2026-07-31)
  postgres:
    container: postgres
    image: postgres:16-alpine
    port: 5432
  gemini-api:
    service: Google Gemini API
    provider: Google Cloud
    models:
      - gemma-4-31b-it (30.7B params, 256K context, frontier performance)
      - gemma-4-26b-a4b-it (25.2B params, 3.8B active, MoE architecture)
      - gemma-4-12b-unified (11.95B params, 256K context)
      - gemini-1.5-flash (fallback model)
    api_key: GEMINI_API_KEY environment variable
    current_key: AQ.Ab8RN6IdyXzbZT6Inpiaf5yQG_RrVrKey7G07gYbQW6ghNUxvQ
    rate_limit: 15 requests/minute (conservative default, varies by model)
    usage: Yomi summarization (conversation and daily summaries)
    integration: gemini-integration.mjs
    status: implemented (2026-08-06), enabled via USE_GEMINI environment variable
    functions:
