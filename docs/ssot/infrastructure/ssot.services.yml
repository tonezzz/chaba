    schedule: daily
    target: tony-dell:/home/tony/.local/share/notebooklm/notebooklm-rest-data/storage_state.json
    action: 'notebooklm login --browser-cookies chrome, rsync storage_state.json to tony-dell, restart notebooklm-rest'
    status: retired 2026-09-17 (timer disabled)
    note: 'Retired: notebooklm-rest now holds master_token.json and self-mints/refreshes cookies in-container every 15min via auth refresh --verify — Chrome cookie extraction is no longer needed. The script remains at ~/.local/bin/notebooklm-rest-auth-refresh (fixed to rsync to notebooklm-rest-data/) if cookie re-seeding is ever required manually. Lesson: Chrome >=127 ABE can silently drop SID/HSID/SSID producing a partial cookie file; and a copied jar dies when the source Chrome rotates __Secure-1PSIDTS.'
