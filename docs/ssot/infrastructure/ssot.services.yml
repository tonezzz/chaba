  notebooklm-mcp:
    container: notebooklm-mcp
    image: localhost/notebooklm-mcp
    runtime: rootless podman
    network: host
    host: tony_dell
    data_volume: /home/tony/.local/share/notebooklm/.notebooklm-mcp-cli
    quadlet:
      container_unit: ~/.config/containers/systemd/notebooklm-mcp.container
      service_unit: ~/.config/systemd/user/notebooklm-mcp.service
    cli_helpers:
      nlm: ~/.local/bin/nlm
      nlm-add: ~/.local/bin/nlm-add
    drive_collection:
      collection: chaba
      folder_id: 1H7FHxy5nDxMOmcFtL79lmy_bttV35kjB
      rclone_path: gdrive:notebooklm/chaba
    notebooks_dir: gdrive:notebooklm/chaba/notebooks
    status: implemented (2026-09-15)
    note: 'Persistent rootless Podman container. Mounts the authenticated .notebooklm-mcp-cli profile. Devin connects via podman exec. The ~/.local/bin/nlm wrapper calls podman exec on tony-dell or ssh there from tony-omen. Google Drive collection for sources: gdrive:notebooklm/chaba. The nlm-add helper uploads local files to gdrive:notebooklm/chaba/notebooks/<nb-id>/files, converts text to .docx, adds by Drive ID, and writes a local manifest.'

  notebooklm-rest:
    container: notebooklm-rest
    image: localhost/notebooklm-rest
    runtime: rootless podman
    port: 8000
    host_port: '127.0.0.1:${ssot("docs/ssot/infrastructure/ssot.values.yml", "ports.notebooklm_rest")}'
    host: tony_dell
    data_volume: /home/tony/.local/share/notebooklm/notebooklm-rest-data
    secrets:
      - notebooklm-rest-api-key
    environment:
      - NOTEBOOKLM_STORAGE_PATH=/data/storage_state.json
    env_file: ~/.config/secrets/notebooklm-rest-api.env
    caddy_path: /apps/notebooklm/api
    caddy_upstream: '127.0.0.1:${ssot("docs/ssot/infrastructure/ssot.values.yml", "ports.notebooklm_rest")}'
    public_url: 'https://${ssot("docs/ssot/infrastructure/ssot.values.yml", "hosts.tony_dell.tailscale")}/apps/notebooklm/api'
    quadlet:
      container_unit: ~/.config/containers/systemd/notebooklm-rest.container
      service_unit: ~/.config/systemd/user/notebooklm-rest.service
    cli_helpers:
      nbapi: ~/.local/bin/nbapi
    drive_collection:
      collection: chaba
      folder_id: 1H7FHxy5nDxMOmcFtL79lmy_bttV35kjB
      rclone_path: gdrive:notebooklm/chaba
    notebooks_dir: gdrive:notebooklm/chaba/notebooks
    status: 'implemented (2026-09-15); upgraded 2026-09-17 (master-token auth — container self-mints cookies from /data/master_token.json, no Chrome dependency)'
    note: 'FastAPI REST API on top of notebooklm-py. X-API-Key header enforced via NOTEBOOKLM_REST_API_KEYS; NOTEBOOKLM_REST_KEY_SCOPES maps scoped keys to notebook allowlists (ada-michael key -> 1c12d5c8 notebook only, ada-tony key -> fdfd3483 only, admin key unrestricted). Exposed through Caddy at /apps/notebooklm/api on tony-dell.taila0626a.ts.net. Keys live in ~/.config/secrets/notebooklm-rest-api.env (not in git). Source and Dockerfile versioned in stacks/tony-dell/notebooklm-rest/, deployed to ~/.local/share/notebooklm/notebooklm-rest-api. Features: in-container auth keepalive (notebooklm auth refresh --verify every NOTEBOOKLM_KEEPALIVE_INTERVAL=900s), GET /health/auth passive probe + POST /health/auth/refresh, Idempotency-Key dedupe on POSTs, write queue (/v1/queue, flush on auth recovery), POST .../sources/prune lifecycle (prefix/age/keep/dry_run). The ~/.local/bin/nbapi wrapper sends the request to tony-dell (local curl on tony-dell, ssh on tony-omen). Google Drive collection for sources: gdrive:notebooklm/chaba. Notebook files stored under gdrive:notebooklm/chaba/notebooks/<nb-id>/files.'

