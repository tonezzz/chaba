    container: chaba-postgres-16
    image: docker.io/pgvector/pgvector:pg16
    runtime: rootless podman
    data_volume: /home/tony/.config/containers/postgres/data
    port: 5432
    host_port: 127.0.0.1:5432
    tailscale_serve: --bg --tcp 5432 127.0.0.1:5432
    dns_alias: postgre
    dns_target: 100.68.142.13
    quadlet:
      container_unit: ~/.config/containers/systemd/chaba-postgres-16.container
      service_unit: ~/.config/systemd/user/chaba-postgres-16.service
    status: implemented (2026-08-16)
    note: |
      Memory tuned 2026-08-31:
      - shared_buffers = 1GB
      - work_mem = 32MB
      - effective_cache_size = 10GB
      - maintenance_work_mem = 256MB
