title: Chaba Services Configuration
subtitle: Service definitions and configurations for Chaba infrastructure
version: 3

production_deployment:
  profiles:
    - production (--profile production flag)
  environment_separation:
    - development: NODE_ENV=development, placeholder API keys, direct project mounts
    - production: NODE_ENV=production, real API keys, static asset mounts only
  secrets_management:
    - docker-compose.secrets.yml for Docker secrets
    - generate-secrets.sh script for secret generation
    - chmod 600 permissions for secret files
  configuration_files:
    - .env.production for production environment variables
    - docker-compose.prod.yml for production overrides
    - .env.example for environment template
  deployment_commands:
    - development: docker compose up -d
    - production: docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile production up -d --build
    - production with secrets: docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.secrets.yml --profile production up -d --build
  status: implemented (2026-08-13)
  notes: Production deployment system with environment separation, secrets management, and comprehensive documentation in production-deployment-operations.md

tony-dell:
  postgres:
    container: chaba-postgres-16
    image: docker.io/pgvector/pgvector:pg16
    runtime: rootless podman
    data_volume: /home/tony/.config/containers/postgres/data
    port: 5432
    host_port: 127.0.0.1:5432
    tailscale_serve: --bg --tcp 5432 127.0.0.1:5432
    dns_alias: postgre
    dns_target: 100.68.142.13
    status: implemented (2026-08-16)
  yomi-api:
    container: yomi-api
    image: docker.io/library/node:22-slim
    runtime: rootless podman
    port: 3000
    host_port: 127.0.0.1:3000
    tailscale_serve: --bg --tcp 3000 127.0.0.1:3000
    caddy_upstream: tony-dell:3000
    data_volume: /home/tony/.local/share/yomi
    related_units:
      - yomi-api.service
      - yomi-update-all.timer
      - yomi-update-active.timer
      - yomi-backup.timer
    status: implemented (2026-08-16)
    failover_plan: docs/ssot/infrastructure/ssot.yomi-failover.yml

tony-omen:
  llama-router:
    container: ai-llama-server-1
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    mode: router (--models-dir, --models-max 2, --models-autoload)
    models:
      - thai-legal-gemma-4b-cpt.Q4_K_M.gguf (5GB)
      - Phi-3-mini-4k-instruct-Q4_K_M.gguf (2.3GB)
    port: 8008 (host), 8008 (internal)
    network: ai_default (external network)
    vram_overhead: ~70MB (vs 4.8GB for separate container)
    routing:
      - /v1/chat/completions → Phi-3-mini-4k-instruct-q4
      - GPU queue → http://ai-llama-server-1:8008/v1/chat/completions
      - MCP llama server → http://ai-llama-server-1:8008
    status: implemented (2026-08-13), network configuration fixed
  postgres:
    container: postgres
    image: postgres:16-alpine
    port: 5432
  mddb:
    container: mddb
    image: tradik/mddb:latest
    port: 11023 (API), 9000 (web)
    status: implemented (2026-08-12)
    routing:
      - /api/mddb/* → mddb:11023 (Caddy reverse proxy)
      - /apps/mddb/* → mddb-panel:3000 (container name routing)
    notes: Personal Knowledge Base system with panel and API services
  mddb-panel:
    container: mddb-panel
    image: tradik/mddb:panel-latest
    port: 3002 (host), 3000 (internal)
    status: implemented (2026-08-13), resolved with dedicated path routing
    routing:
      - /mddb/* → mddb-panel:3000 (dedicated path to avoid asset conflicts)
      - /apps/mddb/* → /mddb/* (redirect to dedicated path)
      - /api/mddb/* → mddb:11023 (Caddy reverse proxy for API)
    notes: MDDB web panel interface, resolved asset routing conflicts by using dedicated /mddb/ path instead of /apps/mddb/. Panel SPA uses root-relative assets which conflicted with other services' /assets/* handlers.
