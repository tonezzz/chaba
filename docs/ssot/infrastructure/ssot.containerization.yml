title: Service Containerization Strategy
subtitle: Migration plan for host services to Docker containers for better resource management and deployment consistency
icon: 🐳

ideas:
  - Central tracking of containerization progress for host services
  - Resource management and deployment consistency improvements
  - Dependency management between containerized services
  - Integration with existing Docker Compose stacks
  - Systemd service replacement with containerized equivalents

sections:
  - title: Current Service Distribution
    icon: 📊
    layout: list
    items:
      - label: Host System Services (systemd --user)
        text: 'Total: 30 running services (after containerization)

          **Containerized (3):**
          - yomi-api.service → yomi-api container
          - gpu-queue.service → gpu-queue container
          - gpu-queue-processor.service → gpu-queue-processor container

          **Retained on host (4):**
          - playlived - Shared browser session daemon (Playwright complexity, systemd service for reliability)
          - barriers.service - Barrier KVM server (input device access)
          - clip-sync-dell.service - Clipboard sync (X11 dependencies)
          - rclone-gdrive.service - Google Drive mount (FUSE requirements)

          **System/Desktop services (23):**
          - GNOME/XFCE desktop services, PipeWire audio, D-Bus services, etc.'
        status: current_state
        tags: ['systemd', 'host-services', 'post-containerization']

      - label: Docker Containers
        text: 'Total: 18 running containers (after containerization)

          **Chaba web stack (12):**
          - web (caddy) - Reverse proxy
          - bserver - Backend server
          - sensor-reader - Hardware sensor / GPU / Docker reader on tony-omen
          - camera-control - Camera control service
          - redis - Cache/queue
          - postgres - Database with pgvector
          - weaviate - Vector database
          - netdata - Monitoring (deployed 2026-08-19, netdata/netdata:stable v2.11.0, nvidia_smi GPU charts active)
          - trading-terminal - Trading interface
          - yomi-api - Yomi API server (NEWLY CONTAINERIZED)
          - gpu-queue - GPU Queue Manager (NEWLY CONTAINERIZED)
          - gpu-queue-processor - GPU Queue Processor (NEWLY CONTAINERIZED)

          **Chaba raceman stack (2):**
          - raceman-web (nginx)
          - raceman-php (PHP-FPM)

          **Other services (4):**
          - frigate - NVR/camera system
          - imagen2-inference - Image generation (GPU)
          - txt2vid-inference - Video generation (GPU)
          - thai-legal-inference - LLM inference (GPU)'
        status: current_state
        tags: ['docker', 'containers', 'post-containerization']

