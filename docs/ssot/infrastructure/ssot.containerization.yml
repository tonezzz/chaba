title: Service Containerization Strategy
subtitle: Migration plan for host services to Docker containers for better resource management and deployment consistency
icon: 🐳

ideas:
  - Central tracking of containerization progress for host services
  - Resource management and deployment consistency improvements
  - Dependency management between containerized services
  - Integration with existing Docker Compose stacks
  - Systemd service replacement with containerized equivalents

sections:
  - title: Current Service Distribution
    icon: 📊
    layout: list
    items:
      - label: Host System Services (systemd --user)
        text: 'Total: 30 running services (after containerization)

          **Containerized (3):**
          - yomi-api.service → yomi-api container
          - gpu-queue.service → gpu-queue container
          - gpu-queue-processor.service → gpu-queue-processor container

          **Retained on host (4):**
          - playlived - Shared browser session daemon (Playwright complexity, systemd service for reliability)
          - barriers.service - Barrier KVM server (input device access)
          - clip-sync-dell.service - Clipboard sync (X11 dependencies)
          - rclone-gdrive.service - Google Drive mount (FUSE requirements)

          **System/Desktop services (23):**
          - GNOME/XFCE desktop services, PipeWire audio, D-Bus services, etc.'
        status: current_state
        tags: ['systemd', 'host-services', 'post-containerization']

      - label: Docker Containers
        text: 'Total: 18 running containers (after containerization)

          **Chaba web stack (12):**
          - web (caddy) - Reverse proxy
          - bserver - Backend server
          - status-api - Status API
          - camera-control - Camera control service
          - redis - Cache/queue
          - postgres - Database with pgvector
          - weaviate - Vector database
          - netdata - Monitoring
          - trading-terminal - Trading interface
          - yomi-api - Yomi API server (NEWLY CONTAINERIZED)
          - gpu-queue - GPU Queue Manager (NEWLY CONTAINERIZED)
          - gpu-queue-processor - GPU Queue Processor (NEWLY CONTAINERIZED)

          **Chaba raceman stack (2):**
          - raceman-web (nginx)
          - raceman-php (PHP-FPM)

          **Other services (4):**
          - frigate - NVR/camera system
          - imagen2-inference - Image generation (GPU)
          - txt2vid-inference - Video generation (GPU)
          - thai-legal-inference - LLM inference (GPU)'
        status: current_state
        tags: ['docker', 'containers', 'post-containerization']

  - title: "Phase 1: Easy Wins (Completed)"
    icon: ✅
    layout: list
    items:
      - label: Clean up GitHub MCP containers
        text: Removed 8 duplicate GitHub MCP server containers that accumulated due to docker run -i --rm not cleaning up properly.
        status: completed
        priority: high
        effort: low
        completed: 2026-08-09
        tags: ['cleanup', 'mcp', 'docker', 'completed']

      - label: Containerize Yomi API
        text: Successfully containerized Yomi API with host networking for LINE integration, health checks, and proper environment configuration.
        status: completed
        priority: high
        effort: medium
        completed: 2026-08-09
        tags: ['containerization', 'yomi', 'nodejs', 'completed']

      - label: Containerize GPU Queue services
        text: Successfully containerized both gpu-queue and gpu-queue-processor with host networking for GPU monitoring and proper service dependencies.
        status: completed
        priority: high
        effort: medium
        completed: 2026-08-09
        tags: ['containerization', 'gpu', 'queue', 'completed']

  - title: "Phase 2: Moderate Effort (Completed)"
    icon: ✅
    layout: list
    items:
      - label: Production Deployment Configuration
        text: Implemented comprehensive production deployment system with environment separation, Docker secrets management, and production-specific configurations. Created production profile system, environment templates, and deployment documentation.
        status: completed
        priority: high
        effort: medium
        completed: 2026-08-13
        related_files:
          - stacks/web/.env.production
          - stacks/web/docker-compose.prod.yml
          - stacks/web/docker-compose.secrets.yml
          - stacks/web/scripts/generate-secrets.sh
          - docs/runbooks/production-deployment-operations.md
        tags: ['production', 'deployment', 'security', 'docker', 'completed']

      - label: Evaluate Playlived containerization
        text: NOT RECOMMENDED - Playwright complexity, CDP networking, display access requirements outweigh benefits.
        status: completed
        priority: medium
        effort: high
        completed: 2026-08-09
        tags: ['containerization', 'playlive', 'mcp', 'not-recommended', 'completed']

      - label: Consider Clip Sync containerization
        text: NOT RECOMMENDED - X11 dependencies, SSH key management, and low benefit make containerization unnecessary.
        status: completed
        priority: medium
        effort: low
        completed: 2026-08-09
        tags: ['containerization', 'sync', 'network', 'not-recommended', 'completed']

  - title: "Phase 3: Advanced (Completed)"
    icon: ✅
    layout: list
    items:
      - label: Evaluate Barriers containerization
        text: NOT RECOMMENDED - Input device access, X11 dependencies, sudo requirements make containerization impractical.
        status: completed
        priority: low
        effort: very_high
        completed: 2026-08-09
        tags: ['containerization', 'kvm', 'input', 'not-recommended', 'completed']

      - label: Keep Rclone on host
        text: NOT RECOMMENDED - FUSE requirements, privileged containers, and security implications make containerization impractical.
        status: completed
        priority: low
        effort: very_high
        completed: 2026-08-09
        tags: ['host-service', 'fuse', 'mount', 'not-recommended', 'completed']

  - title: Services to Keep on Host
    icon: 🖥️
    layout: list
    items:
      - label: Desktop/System Services
        text: Core desktop functionality stays on host for proper integration (GNOME, PipeWire, D-Bus, etc.)
        tags: ['host-services', 'desktop', 'system']

  - title: "Tony-Dell podman migration (in progress)"
    icon: "🔄"
    layout: list
    items:
      - label: chaba-postgres-16
        text: 'Migrated to tony-dell rootless podman. Quadlet units at ~/.config/containers/systemd/chaba-postgres-16.container and ~/.config/systemd/user/chaba-postgres-16.service. Auto-starts on boot.'
        status: completed
        completed: 2026-08-17
        tags: ['tony-dell', 'podman', 'postgres', 'quadlet']
      - label: yomi-api
        text: 'Migrated to tony-dell rootless podman. Quadlet units at ~/.config/containers/systemd/yomi-api.container and ~/.config/systemd/user/yomi-api.service. Tailscale TCP 3000 served locally.'
        status: completed
        completed: 2026-08-17
        tags: ['tony-dell', 'podman', 'yomi-api', 'quadlet']
      - label: weaviate
        text: 'Assessed and approved for migration. ~50MiB working set, 0.12% CPU, no GPU dependency. Quadlet units planned at ~/.config/containers/systemd/weaviate.container and ~/.config/systemd/user/weaviate.service.'
        status: approved
        completed: 2026-08-17
        tags: ['tony-dell', 'podman', 'weaviate', 'quadlet', 'approved']

