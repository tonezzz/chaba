id: ssot.tools
title: Canonical Agent Tool Registry
subtitle: Every agent-callable capability — canonical name, signature, policy tier, backend, transport, allowed agent lanes
icon: wrench
version: 1
maintainer: tony
status: active
category: infrastructure
source_of_truth: true
overview:
  purpose: 'Single catalog of every tool an agent lane can call, so a future agent inherits the full toolset instead of rediscovering it. Supersedes
    the three parallel registries: ada-voice tools.d manifest + realtime_provider native declarations, opencode/ada_mcp.py (ada-control MCP bridge),
    and devin mcp_config.json servers. Design: docs/kb/agent-tool-federation.md.'
  how_to_read: One row per canonical tool (kind=tool) or MCP server (kind=provider). name is domain-namespaced (domain.verb); surfaces maps agent
    lane -> the name that lane actually calls. sig is a JSON-schema-ish condensed signature (declared properties; req = required). policy reuses
    tools.d vocabulary; secondary mirrors manifest secondary_allowed. backend is the service the call reaches; transport is how the agent invokes
    it.
  inventoried: 2026-11-18 from ada-voice @ Nov 13-18 checkout (tony-omen) + devin mcp_config.json — re-run inventory before trusting counts.
  related:
  - docs/kb/agent-tool-federation.md — registry->surface generator design + migration order
  - infrastructure/ssot.mcp.yml — MCP server infra definitions (endpoints, wrappers)
  - infrastructure/ssot.mcp-tools.yml — domain->server selection policy (which MCP for what)
  - infrastructure/ssot.mcp-wrappers.yml — devin stdio launcher scripts
  - ada-voice backend/tools.d/manifest.yml — current ada-voice tool manifest (generation target)
vocab:
  kind:
    tool: one callable function
    provider: an MCP server exposing N tools (rows for its tools are per-tool via mcp_list_tools)
  policy:
    read: callable without confirmation
    confirmed: requires confirmed=true (voice confirm gate or two-call/native-menu gate) or a selection/handoff token
    owner_only: owner-tier only — denied outright to non-owner identities
    mixed: provider rows — per-tool policy inside the server
  secondary: mirrors tools.d manifest secondary_allowed — whether an identified non-owner (secondary) voice/session may call it. Absent = not
    applicable to that lane.
  transport:
    native-decl: model-native function declaration (Gemini Live tools / in-process dispatch)
    stdio-mcp: MCP server over stdio (FastMCP / wrapper script)
    http: remote HTTP MCP endpoint or direct HTTP service
  agent_lanes:
    ada-voice: production voice instances (ada-ha-tony, ada-ha-michael, PWA, relays) — realtime_provider + tools.d
    ada-voice-guest: guest/Chaba-web sub-surface of ada-voice — CHABA_ALLOW allowlist, guest-scoped decls
    ada-dev: dev voice instance — same code surface, separate deploy on idc03
    ada-ocb: OpenCode bridge lane — opencode.json -> opencode/ada_mcp.py FastMCP "ada-control" (stdio)
    devin: Devin CLI/Desktop + dispatch runners — ~/.config/devin/mcp_config.json + wrapper scripts
    future: reserved — new agents inherit this registry via the generators in docs/kb/agent-tool-federation.md
  backends:
    board-api: https://idc03.taila0626a.ts.net:10000 (also /apps/board-api via tony-dell Caddy) — unified mutation door
    mddb: idc03 :11023 memory / :11027 cms / :9000 mcp — per collection
    ha: Home Assistant via ha_client / ha-mcp (tony-ha, michael-ha)
    wp-boards: boards WordPress site — writes via wp_client or board-api doors
    vcast: screen/display services on tony-dell
inventory:
  sources:
    tools.d manifest: 31 modules (backend/tools.d/manifest.yml + DECLARATION/TOOL dicts)
    realtime_provider builtins: 36 native decls + ada_camera_snapshot + 3 guest-scoped CHABA_DECLARATIONS (re-decls of remember/search/enroll)
    ada_mcp.py: 26 FastMCP tools (stdio ada-control for ada-ocb/OpenCode)
    devin mcp_config.json: 21 servers (20 active + google-home disabled)
  coverage: 111 registry rows covering 31 tools.d + 37 native decls (+3 guest re-decls) + 26 ada_mcp + 21 devin providers
  dupes:
  - memory.search — ada-voice builtin AND ada_mcp ada_memory_search (separate impl; bridge reimplements bank+lesson search)
  - wiki.extensions — tools.d wiki_extension AND ada_mcp ada_wiki_extensions/ada_wiki_extension (list vs mutate ops)
  - media.adobe_stock_qc — tools.d ada_adobe_stock AND ada_mcp ada_adobe_stock_qc(+_decide)
  - board.* — tools.d kanban (voice authority matrix) vs ada_mcp ada_plan/ada_status/ada_next_card/ada_preflight family (agent workflow gates)
    — complementary, not literal dupes, but the bridge re-implements board reads instead of proxying services (phase-2 thin adapter)
  gaps:
  - ada-voice lanes have no board.plan/preflight/start_check/dispatch_check — those gates exist only in ada_mcp (ada-ocb)
  - devin lane reaches board.* only via board-api HTTP directly, no packaged tool surface
  - mcp.colab vs mcp.colab_upstream — two colab servers with near-identical names in mcp_config.json
  - google-home provider disabled in mcp_config.json (oauth) — kept as status=disabled row
