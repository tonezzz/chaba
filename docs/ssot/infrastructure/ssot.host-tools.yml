id: ssot.host-tools
title: Host Network & System Toolkit
subtitle: Standard diagnostic and inspection tools for decision making across hosts
icon: toolbox
version: 1
maintainer: tony
status: active
category: infrastructure
source_of_truth: true

overview:
  purpose: |
    Single source of truth for the CLI network and system tools that should be
    available on each host. Use it to answer "which tool should I use for X?"
    and to verify that every host has the expected toolkit installed and working.
  usage: |
    python3 scripts/check-host-tools.py --host mn01
    python3 scripts/check-host-tools.py --host tony-dell --install-missing
    python3 scripts/check-host-tools.py --host tony-dell --verify-all
  decision_support:
    - "Which tool should I use to check network throughput? → iperf3"
    - "Which tool should I use to inspect link speed/duplex? → ethtool"
    - "Which tool should I use to find disk hogs? → ncdu"
    - "Which tool should I use to check active connections? → nmcli or ss"
    - "Which tool should I use to inspect kernel errors? → dmesg"

tools:
  network:
    - name: ip
      package:
        linux: iproute2
      command: "ip -br -c a"
      verify: "ip -V"
      decisions: ["verify interface state", "check IP and route"]
      priority: essential

    - name: ss
      package:
        linux: iproute2
      command: "ss -tlnp"
      verify: "ss -h"
      decisions: ["list listening TCP sockets", "check ports"]
      priority: essential

    - name: ethtool
      package:
        linux: ethtool
        mac: ethtool
      command: "ethtool -S <iface>"
      verify: "ethtool --version"
      decisions: ["diagnose link speed/duplex", "check NIC counters"]
      priority: essential

    - name: iperf3
      package:
        linux: iperf3
        mac: iperf3
      command: "iperf3 -c <host> -t 10"
      verify: "iperf3 --version"
      decisions: ["measure real throughput between hosts"]
      priority: useful

    - name: nmcli
      package:
        linux: network-manager
      command: "nmcli con show --active"
      verify: "nmcli --version"
      decisions: ["inspect active connections", "troubleshoot NetworkManager"]
      priority: useful

    - name: tcpdump
      package:
        linux: tcpdump
        mac: tcpdump
      command: "tcpdump -i any -c 20"
      verify: "tcpdump --version"
      decisions: ["capture and inspect network traffic"]
      priority: useful

    - name: ping
      builtin: true
      package: {}
      command: "ping -c 4 <host>"
      verify: "ping -V"
      decisions: ["basic reachability"]
      priority: essential

    - name: curl
      builtin: true
      package:
        linux: curl
        mac: curl
      command: "curl -sfL <url>"
      verify: "curl --version"
      decisions: ["test HTTP/TCP endpoints"]
      priority: essential

  system:
    - name: htop
      package:
        linux: htop
        mac: htop
      command: "htop"
      verify: "htop --version"
      decisions: ["inspect CPU, memory and process load"]
      priority: essential

    - name: iotop
      package:
        linux: iotop
      command: "iotop -ao"
      verify: "iotop --version"
      decisions: ["find processes causing disk I/O"]
      priority: useful

    - name: smartctl
      package:
        linux: smartmontools
      command: "smartctl -a /dev/sda"
      verify: "smartctl --version"
      decisions: ["check disk health"]
      priority: useful

    - name: dmesg
      builtin: true
      package: {}
      command: "dmesg -T -l err"
      verify: "dmesg --help"
      decisions: ["review kernel errors and hardware alerts"]
      priority: essential

    - name: sar
      package:
        linux: sysstat
      command: "sar -u 1 5"
      verify: "sar -V"
      decisions: ["collect CPU utilization samples"]
      priority: useful

  storage:
    - name: lsblk
      package:
        linux: util-linux
      command: "lsblk -f"
      verify: "lsblk --version"
      decisions: ["list block devices and filesystems"]
      priority: essential

    - name: df
      builtin: true
      package: {}
      command: "df -h"
      verify: "df --version"
      decisions: ["check free disk space"]
      priority: essential

    - name: ncdu
      package:
        linux: ncdu
        mac: ncdu
      command: "ncdu /"
      verify: "ncdu -h"
      decisions: ["find what is consuming disk space"]
      priority: useful

  containers:
    - name: podman
      package:
        linux: podman
      command: "podman ps -a"
      verify: "podman --version"
      decisions: ["list running/stopped podman containers"]
      priority: useful

    - name: docker
      package:
        linux: docker.io
        mac: docker
      command: "docker ps -a"
      verify: "docker --version"
      decisions: ["list Docker containers when podman is not used"]
      priority: optional

hosts:
  tony_omen:
    os: linux
    package_manager: apt
    recommended: all
  tony_dell:
    os: linux
    package_manager: apt
    recommended: all
  mn01:
    os: linux
    package_manager: apt
    recommended: essential
  macbook:
    os: mac
    package_manager: brew
    recommended: essential

runner:
  script: scripts/check-host-tools.py
  workflow:
    - check: "command -v <name>"
    - verify: "<verify>"
    - install: "<install_command>"
    - cleanup: "rm -f /tmp/host-tools-*"
  install_commands:
    apt: "sudo apt-get update && sudo apt-get install -y <package>"
    brew: "brew install <package>"
  cleanup:
    paths:
      - /tmp/host-tools-*.json
      - /tmp/host-tools-*.log
      - /tmp/host-tools-*.pcap
      - /tmp/iperf3-test-*
    note: |
      Removes all temporary report, log, capture and download artifacts created
      by the runner. The cleanup step always runs, even if a check or install fails.
  report:
    format: json
    path: /tmp/host-tools-report-<host>.json

related_ssot:
  - docs/ssot/infrastructure/ssot.audit.hosts.yml
  - docs/ssot/infrastructure/ssot.values.yml
  - docs/ssot/infrastructure/ssot.mcp-debug.yml
