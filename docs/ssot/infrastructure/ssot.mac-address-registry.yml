title: MAC Address Registry
subtitle: Central registry of network interfaces and how to handle duplicate MACs
icon: 🔗
version: 1
last_updated: '2026-09-01'

ideas:
  - One source of truth for every MAC on the home network
  - MAC is an attribute, not a primary key
  - Track duplicate / reused MACs common in cheap/Chinese IoT devices
  - Link every IP allocation to a stable device_id

sections:
  - title: Why MAC is not the primary key
    icon: 🔑
    layout: list
    items:
      - label: MAC collisions happen
        text: 'Low-cost Tuya, ESP, and off-brand IoT devices sometimes ship with duplicate or randomized MACs. Using mac as the primary key breaks as soon as two devices collide.'
      - label: device_id is the stable key
        text: 'Every device gets a stable slug like tuya-plug-coffee, ip-cam-65, or hp-deskjet-2700. It survives IP and MAC changes.'
      - label: One device, many interfaces
        text: 'A workstation may have wired, Wi-Fi, USB-tether, and Tailscale interfaces. Each is a child of the same device_id.'

  - title: MAC Registry Schema
    icon: 🧩
    layout: list
    items:
      - label: device_id
        text: 'Required. Stable unique slug for the device.'
      - label: label
        text: 'Required. Human-readable name.'
      - label: local_ids
        text: 'Device-native IDs used to disambiguate duplicates: tuya_id, serial, hostname, bluetooth_addr.'
      - label: interfaces
        text: 'List of interface records: interface_id, mac, oui, vendor, type, source, first_seen, status.'
      - label: mac_conflict
        text: 'true when this device''s MAC is also claimed by another device_id.'
      - label: conflict_group
        text: 'Hash of the duplicated MAC, used to link colliding records.'
      - label: duplicate_resolution
        text: 'Strategy: network_observed, vendor_verified, local_id_tiebreaker.'
      - label: status
        text: 'active / stale / unknown.'

  - title: Duplicate MAC Handling
    icon: ⚠️
    layout: list
    items:
      - label: Detect
        text: 'ARP scan, mDNS, or DHCP logs show the same MAC in two places, or two device records share a MAC.'
      - label: Triage
        text: 'Compare vendor (OUI), device label/sticker, local control ID, and the network it was observed on. Chinese/white-label gear is the usual culprit.'
      - label: Resolve
        text: 'Keep both device records. Set mac_conflict=true and the same conflict_group. Use device_id in IP and automation references. Treat MAC as a soft lookup key only.'
      - label: Example
        text: 'If a new plug also reports 2c:b4:71:e8:aa:06, create device_id tuya-plug-duplicate-01, set mac_conflict=true and the same conflict_group, and resolve via Tuya device ID and observed IP.'

  - title: Known Devices
    icon: 📋
    layout: list
    items:
      - label: tony-omen
        text: 'Primary workstation. Interfaces: eno1 (b0:22:7a:f0:73:cd) and wlo1 (d0:57:7b:ea:6a:3c).'
      - label: home-router
        text: 'Default gateway 192.168.2.1, MAC 98:00:6a:68:f7:c6.'
      - label: tuya-plug-coffee
        text: 'ปลั๊กกาแฟ — MAC 2c:b4:71:e8:aa:06, Tuya ID a33be68c03a6886d7f21zf.'
      - label: tuya-plug-bedside
        text: 'ปลัฦหัวเตียง — MAC 2c:b4:71:e8:a8:e8, Tuya ID a319217035be6c2d60opfg.'
      - label: ip-cam-65
        text: 'VStarcam C7824WIP — MAC d4:9e:3b:6a:94:90.'
      - label: hp-deskjet-2700
        text: 'HP DeskJet 2700 series — MAC e0:73:e7:05:c5:16, serial CN33BDZ0KS.'
      - label: Unknown hosts
        text: '192.168.2.65, .67, .73, .78, .81 discovered in the 2026-09-01 scan. MACs recorded as discovered-* device_ids.'
      - label: Legacy network
        text: 'macbook on 192.168.1.39 and google-tv on 192.168.1.50; MACs unknown/stale.'

  - title: Next Steps
    icon: ➡️
    layout: list
    items:
      - label: Resolve unknown hosts
        text: 'Identify 192.168.2.65, .67, .73, .78, .81 by checking router DHCP leases, device labels, or HTTP/HTTPS fingerprints.'
      - label: Populate legacy network
        text: 'Reconnect to Mountain View 5G/2.4G to scan 192.168.1.0/24 and capture macbook / Google TV MACs.'
      - label: Watch duplicates
        text: 'Run nightly ARP scan and compare against this registry. New or duplicate MACs create a focus-inbox alert.'

config:
  version: 1
  last_updated: '2026-09-01'
  maintainer: tony
  status: active
  related_files:
    - docs/ssot/infrastructure/ssot.ip-address-registry.yml
    - docs/ssot/infrastructure/ssot.tuya-smart-plug.yml
    - docs/ssot/infrastructure/ssot.ip-camera.yml
    - docs/ssot/ssot.mysystem.home.yml
  schema:
    mac_record:
      required: [device_id, label]
      fields:
        device_id: stable unique slug for the device (primary key)
        label: human name
        local_ids:
          tuya_id: Tuya device ID
          serial: manufacturer serial number
          hostname: configured hostname
          bluetooth_addr: Bluetooth MAC if relevant
        interfaces:
          - interface_id: eth0/wlan0/primary etc.
            mac: IEEE 48-bit address (may be null or duplicate)
            oui: first 24 bits / vendor prefix
            vendor: resolved vendor name (null if unknown)
            type: ethernet/wifi/tailscale/bluetooth/usb
            source: sticker/arp/mdns/dhcp/manual
            first_seen: ISO-8601 date
            status: active/stale/unknown
        mac_conflict: boolean
        conflict_group: hash of the duplicated MAC (links duplicates)
        duplicate_resolution: network_observed/vendor_verified/local_id_tiebreaker
        status: active/stale/unknown
  mac_registry:
    - device_id: tony-omen
      label: tony-omen primary workstation
      local_ids:
        hostname: tony-omen
      interfaces:
        - interface_id: eno1
          mac: b0:22:7a:f0:73:cd
          oui: b0:22:7a
          type: ethernet
          source: manual
          first_seen: '2026-09-01'
          status: active
        - interface_id: wlo1
          mac: d0:57:7b:ea:6a:3c
          oui: d0:57:7b
          type: wifi
          source: manual
          first_seen: '2026-09-01'
          status: active
      mac_conflict: false
      status: active
    - device_id: home-router
      label: Home router (192.168.2.1)
      local_ids: {}
      interfaces:
        - interface_id: lan
          mac: 98:00:6a:68:f7:c6
          oui: 98:00:6a
          type: ethernet
          source: arp
          first_seen: '2026-09-01'
          status: active
      mac_conflict: false
      status: active
    - device_id: tuya-plug-coffee
