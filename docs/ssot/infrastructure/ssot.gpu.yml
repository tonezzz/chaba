embedding_offload:
  status: not_switched
  reason: Gemini round-trip latency is ~3.7x higher than local Ollama (see reports/gemini-embedding-comparison.md)
  ollama_service: still running on tony-omen port 11434 for query-time MDDB embeddings
  gemini_proxy: available on tony-omen port 11435 for batch/off-peak re-indexing
  gpu_usage_ollama: ~388 MB reported by nomic-embed-text

monitoring:
  netdata:
    status: deployed
    version: v2.11.0
    container: chaba-omen-netdata
    host: tony-omen
    access_points:
      - http://tony-omen.local:8080/apps/netdata/
      - http://tony-omen.local:8081/apps/netdata/
      - http://localhost:19999
    gpu_metrics_available:
      - GPU utilization percentage
      - VRAM usage (used/free/total)
      - GPU temperature
      - GPU power consumption
      - GPU clock frequencies
      - GPU processes and memory usage
      - Historical GPU performance data
    integration: Auto-discovers NVIDIA GPU via nvidia-smi using the go.d nvidia_smi collector; requires --gpus all and a container restart after creation for the first GPU chart discovery
    retention: Default Netdata retention (1 hour detail, 1 day reduced resolution)
    alerts: Configurable alerts for GPU temperature, VRAM usage, utilization
    notes:
      - NETDATA_DISABLE=ebpf,nfacct,perf to avoid ENOBUFS errors
      - Caddy /apps/netdata/ reverse proxy added to chaba/stacks/web/Caddyfile
      - Netdata compose service added to chaba/stacks/web/docker-compose.yml

  mcp_gpu:
    tool: mcp1_gpu_status
    output: JSON with VRAM usage, process list, memory per process
    use_case: On-demand GPU status checks, programmatic access
    realtime: No (snapshot only)

  health_checks:
    gpu_services:
      - thai-legal (http://tony-omen.local:8001/health)
      - imagen2 (http://tony-omen.local:8000/health)
      - txt2vid (container state: txt2vid-inference)
    use_case: Service availability monitoring
    gpu_metrics: No (service health only)
