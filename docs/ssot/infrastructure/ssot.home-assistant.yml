title: Home Assistant Platform
subtitle: Shared Home Assistant infrastructure, bridge, and services

platform:
  name: Home Assistant
  container: tony-ha
  image: docker.io/homeassistant/home-assistant:stable
  runtime: rootless podman
  network: host
  host: tony_dell
  port: 8123
  host_port: 0.0.0.0:8123
  config: /home/tony/.config/home-assistant
  quadlet:
    container_unit: ~/.config/containers/systemd/tony-ha.container
    service_unit: ~/.config/systemd/user/tony-ha.service
  autostart: loginctl enable-linger tony is yes; Quadlet WantedBy=default.target
  status: mcp server active

instances:
  ssot: docs/ssot/infrastructure/ssot.home-assistant.instances.yml
  note: Consolidated runtime facts for tony-ha, michael-dev, and michael-ha.

mcp:
  server: ha_mcp_tools in-process
  status: active
  entry_id: 01M0WCBKSZBCPES52XGQMT4JRS
  server_user_id: 4f49ee3b95e54bada6d3c767236b5ab0
  server_port: 9584
  bind_host: 0.0.0.0
  secret_path: /private_CtYuVkJEl28cp8qA8yXNCQ
  webhook_id: mcp_d5528537d57627164033dc5e3e5e5aa6
  local_url: http://tony-dell:9584/private_CtYuVkJEl28cp8qA8yXNCQ
  tailnet_url: http://tony-dell:9584/private_CtYuVkJEl28cp8qA8yXNCQ
  webhook: http://tony-dell:8123/api/webhook/mcp_d5528537d57627164033dc5e3e5e5aa6
  caddy:
    host_path: /apps/home-assistant/
    mcp_path: /api/ha-mcp/
    backend: 100.68.142.13
    caddyfile: /home/tony/CascadeProjects/chaba-tony-dell/stacks/web/Caddyfile
  ssot: docs/ssot/infrastructure/ssot.home-assistant.mcp.yml

custom_components:
  - ha_mcp_tools

custom_cards:
  ssot: docs/ssot/infrastructure/ssot.home-assistant.cards.yml
  note: Build, deploy, source, and design context for the forked sunsynk-power-flow-card and related cards.

dashboards:
  tony-test:
    ssot: docs/ssot/infrastructure/ssot.home-assistant.dashboards.yml
    note: Tony-test Lovelace layout, tabs, and active test views.

howto:
  ssot: docs/ssot/infrastructure/ssot.home-assistant.howto.yml
  note: Runbooks for adding tabs, copying cards, building/deploying custom cards, creating tokens, and fixing overlays.

entities:
  ssot: docs/ssot/infrastructure/ssot.home-assistant.entities.yml
  note: Canonical entity IDs and dummy data used by the tony-test PF3 sunsynk card.

design:
  ssot: docs/ssot/infrastructure/ssot.home-assistant.design.yml
  note: SVG layout, text rendering, alignment, and overlay conventions for custom cards.

go2rtc:
  purpose: H.264 proxy for ip_cam_65
  port: 1984
  rtsp: 8554
  webrtc: 8555
  config: /home/tony/.config/go2rtc/go2rtc.yaml

ha_live:
  name: Home Assistant Live (Gemini Live bridge)
  source:
    repo: stacks/ha-live/bridge.py
    host: /home/tony/.config/home-assistant/ha-live/bridge.py
  host: tony_dell
  local_port: 127.0.0.1:9005
  tailscale_funnel: 'https://tony-dell.taila0626a.ts.net:8444'
  websocket: 'wss://tony-dell.taila0626a.ts.net:8444/ws'
  snapshot: 'https://tony-dell.taila0626a.ts.net:8444/snapshot'
  expected_status: 200
  files:
    - stacks/ha-live/bridge.py
    - stacks/ha-live/index.html
    - stacks/ha-live/restart.sh
    - stacks/ha-live/ha-live.service
    - stacks/ha-live/README.md
  live_pages:
    tony_live: 'http://tony-dell.taila0626a.ts.net:8080/apps/tony-live/'
    michael_live: 'http://tony-dell.taila0626a.ts.net:8080/apps/michael-live/'
  health_checks:
    - 'tailscale ssh tony-dell ps -ef | grep ha-live/bridge.py'
    - 'ss -tlnp | grep 9005'
    - "curl -s -o /dev/null -w '%{http_code}' https://tony-dell.taila0626a.ts.net:8444/"
  recovery:
    - 'cd /home/tony/.config/home-assistant/ha-live && ./restart.sh'
    - 'tailscale serve status'

health:
  home_assistant: ssh tony-dell curl -sf http://127.0.0.1:8123/ >/dev/null
  note: Container rootless podman on tony-dell. HA-MCP active. Caddy reverse proxy, health check, and autostart configured.
