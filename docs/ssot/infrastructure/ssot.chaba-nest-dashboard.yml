# chaba-nest dashboard spec — the SINGLE SOURCE for the ada-ha dashboard.
# Edit this file, then regenerate + push with:
#   python3 scripts/home-assistant/chaba-nest-build.py --apply
# (auth: ~/.config/ada-ha refresh token tony-devin; CMS key reused from the
#  live dashboard config or CMS_API_KEY env / ~/.config/secrets/ada-ha-cms.env)
#
# Conventions:
# - each topic becomes a masonry view: nav pill card + one CMS summary-tile
#   card per slug (?card=1 — clamped, never scrolls; TILE STANDARD)
# - `reports:` becomes a subview (<path>-reports) iframing the filtered CMS
#   browser; use "tab=<topic>" for CMS-classified groups, "tab=pages&q=<rx>"
#   for regex filtering
# - tile order = card order; top-tier doc first
#
# AUTO-DISCOVERY (standard procedure, Tony 2026-10-10):
# - `match:` per topic = regex on slug+title used by --discover (mirrors the
#   CMS tab classification; q= topics reuse their reports regex)
# - tiles may be a bare slug (state: pinned) or {slug, state, why}
# - states: pinned = human-approved, no badge | auto = auto-added over the
#   threshold, badge AUTO | proposed = discovered, awaiting decision, badge
#   PROPOSED with why + options popover
# - lifecycle: chaba-nest-build.py --discover proposes; --auto-add promotes
#   over threshold; --accept <slug> pins; --reject <slug> drops
# - default is human-gated: discovery proposes, Tony decides. auto-add is
#   the exception for topics he has explicitly delegated (auto_add: true)
id: ssot.chaba-nest-dashboard
title: Chaba Nest Dashboard Spec
subtitle: Declarative spec for the ada-ha chaba-nest dashboard — tiles + subviews
dashboard:
  url_path: chaba-nest
  title: Chaba Nest
  cms_base: https://idc03.taila0626a.ts.net/apps/ha/ada-tony/cms/
  zoom: '1.15'
  tile_aspect: 55%
topics:
- name: Nest
  path: nest
  match: nest|polity|tony-ideas
  tiles:
  - chaba-nest
  - nest-bench
  - nest-portable-brains
  - nest-oss-landscape
  - tony-ideas
  - polity-research
  - slug: nest-idc03
    state: proposed
    why: 'proposed: per-host nest-mgr node report (card nest-manager-node), matched nest|polity|tony-ideas on 2026-10-09'
  - slug: nest-tony-omen
    state: proposed
    why: 'proposed: per-host nest-mgr node report (card nest-manager-node), matched nest|polity|tony-ideas on 2026-10-09'
  - slug: nest-tony-dell
    state: proposed
    why: 'proposed: per-host nest-mgr node report (card nest-manager-node), matched nest|polity|tony-ideas on 2026-10-09'
  reports: tab=pages&q=nest
- name: Polity
  path: polity
  match: polity|nest
  tiles:
  - polity-research
  - nest-bench
  - nest-portable-brains
  - nest-oss-landscape
  - chaba-nest
  reports: tab=pages&q=polity%7Cnest
- name: Security
  path: security
  match: security|cctv|dvr|noble|tony.?house|cam-|vms|transcript-audit
  exclude: traffic|rama ?9|rama9|dohweb|burapha|chonburi|จราจร|บางนา|ชลบุรี|^cam-(?!wall)
  tiles:
  - security-digest
  - cctv-digest
  - cctv-walls
  - dvr-wall
  - camwall-tony-house
  - camwall-noble-club
  - camwall-noble-a
  - cctv-roster-audit
  reports: tab=security
- name: Traffic
  path: traffic
  match: traffic|rama ?9|rama9|dohweb|burapha|chonburi|จราจร|บางนา|ชลบุรี
  exclude: ^cam-(?!wall)
  tiles:
  - camwall-traffic
  - camwall-rama9
  - camwall-dohweb
  - camwall-chonburi
  - camwall-burapha
  - cctv-walls
  reports: tab=traffic
- name: Flood
  path: flood
  match: flood|น้ำท่วม|อุทกภัย
  tiles:
  - flood-overview
  - flood-digest
  - flood-report
  - flood-report-pattaya-rayong
  - flood-report-nongdon-saraburi
  - flood-hub-assessment
  - flood-coordinates-rayong
  - news-flood
  reports: tab=flood
status:
  health: active — generated + pushed 2026-10-09, verified via playlive
  last_updated: '2026-10-09'
