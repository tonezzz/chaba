# ssot.host-software.yml — declared per-host software capabilities (R7)
#
# The service-layer twin of ssot.audit.hosts.yml. Services are
# declared-or-dead; this file makes the same true for runtimes one
# layer down: a host either HAS a declared capability or it does not —
# nothing in between (card r7-host-software-baseline-declared-capab-ab6a48).
#
# Each capability has a probe (a shell snippet run over ssh) and a
# bootstrap recipe key (scripts/host-capability-bootstrap.sh <cap>).
# host-ready-check.py runs the probes and reports drift.

id: ssot.host-software
title: Host Software Capabilities
subtitle: Declared per-host runtimes and libraries with readiness probes
icon: chip
version: 1
maintainer: tony
status: active
category: infrastructure

capabilities:
  python3:
    probe: 'python3 --version'
    expect_re: 'Python 3\.(9|1[0-9])\.'
  venv:
    probe: 'python3 -m venv /tmp/.r7-venv-check && rm -rf /tmp/.r7-venv-check'
    bootstrap: venv
    note: ensurepip must work — pip-less hosts can only run stdlib
  python_ml:
    probe: '$HOME/.local/share/chaba-ml-venv/bin/python -c "import torch, transformers"'
    bootstrap: python_ml
    note: durable shared ML venv at ~/.local/share/chaba-ml-venv —
      NOT /tmp (cleared on reboot and by cleanup jobs)
  python_ml_gpu:
    probe: '$HOME/.local/share/chaba-ml-gpu-venv/bin/python -c "import torch, transformers; assert torch.cuda.is_available()"'
    bootstrap: manual
    note: GPU lane — uv-managed cpython 3.12 venv at
      ~/.local/share/chaba-ml-gpu-venv with cuda torch (cp314 cuda wheels
      do not exist yet for the system py3.14). Recipe — install uv,
      `uv python install 3.12`, `uv venv --python 3.12`,
      `uv pip install --index-url .../cu128 torch transformers`.
      Requires working nvidia driver (2026-11-08 reboot restored
      595.99.02/CUDA 13.2 on Omen).
  ollama_bge_m3:
    probe: 'H="$(tailscale ip -4 2>/dev/null | head -n1 || true)"; [ -n "$H" ] || H="$(hostname -I 2>/dev/null | awk "{print \$1}" || true)"; [ -n "$H" ] || H="$(ipconfig getifaddr en0 2>/dev/null || true)"; [ -n "$H" ] || H="$(ifconfig 2>/dev/null | awk "/inet / && \$2 != \"127.0.0.1\" {print \$2; exit}" || true)"; [ -n "$H" ] || H=127.0.0.1; curl -fsS --max-time 10 "http://$H:11434/api/tags" | grep -q bge-m3'
    bootstrap: ollama_pull_bge_m3
    note: ollama service running AND bge-m3 model present (probe falls back tailscale/hostname-I/ipconfig/ifconfig/localhost for macOS portability)
  node:
    probe: 'node --version || $HOME/.local/bin/node --version'
    bootstrap: node
    note: user-space node per new-host-onboarding §3 — ssot-validate + dispatch need it
  podman:
    probe: 'podman --version'
    bootstrap: manual
    note: quadlet/container tasks — install is sudo, out of bootstrap scope
  opencode:
    probe: 'for c in "$OPENCODE_BIN" "$HOME/.opencode/bin/opencode" "$HOME/.local/bin/opencode" "$HOME/.npm-global/bin/opencode" "$HOME/.local/node/bin/opencode"; do [ -n "$c" ] && [ -x "$c" ] && exit 0; done; command -v opencode >/dev/null 2>&1'
    bootstrap: manual
    note: >-
      opencode CLI binary only — lane enablement is separate
      (OPENCODE_LANES drop-in + lane_gate stage, ssot.devnest-lanes.yml).
      Probe mirrors runner-agent opencode_bin() resolution
      ($OPENCODE_BIN -> PATH -> ~/.opencode/bin -> ~/.local/bin) plus
      the npm-global prefix install path (omen 2026-11-24). Install is
      `npm i -g @opencode/cli` or the official installer into
      ~/.opencode/bin. Added 2026-11-24 (KNB-1008 card
      tony-omen-declares-opencode-lanes-1-but-4cbe02) after omen ran
      OPENCODE_LANES=1 with no binary for weeks.

hosts:
  tony-dell:
    capabilities: [python3, venv, node, podman, opencode]
  tony-omen:
    capabilities: [python3, venv, python_ml, python_ml_gpu, ollama_bge_m3, opencode]
  con01:
    capabilities: [python3, venv, python_ml, ollama_bge_m3, opencode]
  idc02:
    capabilities: [python3, venv, ollama_bge_m3, opencode]
  idc03:
    capabilities: [python3, venv, ollama_bge_m3, podman, opencode]
  kk-mac:
    capabilities: [python3, venv, ollama_bge_m3]
  kk-macbook:
    capabilities: [python3, venv]
    note: laptop — often offline; unreachable is informational, not a defect
  mn01:
    capabilities: [python3, venv]
