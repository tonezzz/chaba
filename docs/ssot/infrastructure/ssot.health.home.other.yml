- id: yomi-update-active-timer
  name: Yomi Update Active Timer
  type: systemd
  service: yomi-update-active.timer
  expected_state: active
  timeout: 5
  category: system
  profiles:
  - home
  - mobile
  disabled: true
  note: 'Timer now runs on tony_dell as a Podman user unit. Check with tony_dell: systemctl --user status yomi-update-active.timer.'
- id: weaviate-index-timer
  name: Weaviate Index Timer
  type: systemd
  service: weaviate-index.timer
  expected_state: active
  timeout: 5
  category: system
  profiles:
  - home
  - mobile
  disabled: true
  note: 'The weaviate container and its index timer now run on tony-dell as Podman user units. Check with tony_dell: systemctl --user status weaviate-index.timer'
- id: chaba-audit-timer
  name: Chaba Audit Timer
  type: systemd
  service: chaba-audit.timer
  expected_state: active
  timeout: 5
  category: system
  profiles:
  - home
  - mobile
- id: chaba-kb-audit-timer
  name: Chaba KB Audit Timer
  type: systemd
  service: chaba-kb-audit.timer
  expected_state: active
  timeout: 5
  category: system
  profiles:
  - home
  - mobile
- id: cpu-frequency-monitor
  name: CPU Frequency Monitor
  type: systemd
  scope: system
  service: cpufreq-limit.service
  expected_state: active
  timeout: 5
  category: system
  profiles:
  - home
  - mobile
  disabled: true
  note: tony-omen only. Disabled from tony-dell health monitor.
  verification:
  - 'Check service: systemctl status cpufreq-limit.service'
  - 'Check current CPU frequency: cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq'
  - 'Check CPU governor: cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor'
  recovery_actions:
  - 'Restart service: systemctl restart cpufreq-limit.service'
  - 'Set performance governor: echo performance | sudo tee /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor'
- id: chaba-health-monitor-timer
  name: Chaba Health Monitor Timer
  type: systemd
  service: chaba-health-monitor.timer
  expected_state: active
  timeout: 5
  category: system
  profiles:
  - home
  - mobile
  disabled: true
  note: tony-omen only. Disabled from tony-dell health monitor.
  verification:
  - 'Check timer status: systemctl --user status chaba-health-monitor.timer'
  - 'Check monitor log: tail -f /home/tony/CascadeProjects/chaba/logs/health-monitor.log'
  - 'Test script manually: bash /home/tony/CascadeProjects/chaba/scripts/health-monitor.sh'
  - 'Check CPU frequency: cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq'
  - 'Check CPU governor: cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor'
  recovery_actions:
  - 'Restart timer: systemctl --user restart chaba-health-monitor.timer'
  - 'Check script permissions: chmod +x /home/tony/CascadeProjects/chaba/scripts/health-monitor.sh'
  - 'Monitor CPU frequency: watch -n 1 ''cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq'''
  - 'Change CPU governor: echo performance | sudo tee /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor'
  - 'Check thermal throttling: watch -n 1 ''cat /sys/class/thermal/thermal_zone*/temp'''
- id: barrier-server
  name: Barrier KVM Server
  type: systemd
  service: barriers.service
  host: tony_omen
  expected_state: active
  timeout: 5
  category: system
  profiles:
  - home
  - mobile
  disabled: true
  note: tony-omen only. Disabled from tony-dell health monitor.
  verification:
  - 'Check service: systemctl --user status barriers.service'
  - 'Check port: ss -tlnp | grep 24800'
  - 'Check server log: tail -n 20 /tmp/barrier-server.log'
  - 'Check connected client: tail -n 20 /tmp/barrier-client.log'
  recovery_actions:
  - 'Restart server: systemctl --user restart barriers.service'
  - 'Check log: journalctl --user -u barriers.service -n 50'
  - 'Check client: ssh -o ConnectTimeout=3 tony@tony-dell ''pgrep -a barrierc'''
  - 'Restart client: ssh -o ConnectTimeout=3 tony@tony-dell ''pkill -x barrierc 2>/dev/null; nohup /home/tony/.local/bin/barrierc --no-daemon --disable-crypto --name tony-dell --log /tmp/barrier-client.log 100.75.102.88 >/dev/null 2>&1 &'''
- id: gdrive-backup
  name: Google Drive Backup
  type: mount
  mount_point: /home/tony/GoogleDrive
  expected_state: mounted
  timeout: 10
  category: system
  profiles:
  - home
  note: Google Drive mount for automated backup storage at /home/tony/GoogleDrive/Tony AI/backup/chaba
  verification:
  - 'Check mount status: mount | grep gdrive'
  - 'Check backup directory: ls -la /home/tony/GoogleDrive/Tony AI/backup/chaba'
  - 'Check recent backups: ls -lt /home/tony/GoogleDrive/Tony AI/backup/chaba/daily/ | head -5'
  - 'Test write access: echo ''test'' > /home/tony/GoogleDrive/Tony AI/backup/chaba/test-write.txt && rm /home/tony/GoogleDrive/Tony AI/backup/chaba/test-write.txt'
  - 'Check backup logs: tail -f /var/log/chaba-backup.log'
  recovery_actions:
  - 'Check rclone status: rclone status gdrive'
  - 'Remount Google Drive: rclone mount gdrive: /home/tony/GoogleDrive --daemon'
  - 'Check rclone config: rclone config show gdrive'
  - 'Check backup service: systemctl status chaba-backup.timer'
  - 'Check backup logs for errors: tail -100 /var/log/chaba-backup.log'
- id: mcp-rview
  name: MCP RView Proxy
  type: sse
  url: http://127.0.0.1:9003/sse
  expected_status: 200
  timeout: 5
  category: mcp
  profiles:
  - home
  - mobile
  host: tony_dell
  verification:
  - 'Test SSE endpoint: curl -sfI -H "Accept: text/event-stream" http://127.0.0.1:9003/sse'
  - 'Check service: ssh tony-dell systemctl --user status mcp-rview'
  - 'Check proxy log: ssh tony-dell journalctl --user -u mcp-rview --tail 20'
  - 'Check tool list: ssh tony-dell podman exec rview-live python3 /scripts/mcp_rview/server.py and send {"jsonrpc":"2.0","id":1,"method":"tools/list"}'
  recovery_actions:
  - 'Restart service: ssh tony-dell systemctl --user restart mcp-rview'
  - 'Verify rview-api is reachable from mcp-rview: ssh tony-dell curl -sf http://127.0.0.1:3007/state?action=list'
  - 'Check server.py source: /home/tony/CascadeProjects/chaba-tony-dell/scripts/mcp_rview/server.py'
- id: mcp-rview-oauth-proxy
  name: MCP RView OAuth2 Proxy
  type: http
  url: http://127.0.0.1:9004/.well-known/oauth-authorization-server
  expected_status: 200
  timeout: 5
  category: mcp
  profiles:
  - home
  - mobile
  host: tony_dell
  verification:
  - 'Test well-known endpoint: curl -sf http://127.0.0.1:9004/.well-known/oauth-authorization-server'
  - 'Check service: ssh tony-dell systemctl --user status mcp-rview-oauth-proxy'
  - 'Check port: ssh tony-dell ss -tlnp | grep 9004'
  recovery_actions:
  - 'Restart service: ssh tony-dell systemctl --user restart mcp-rview-oauth-proxy'
  - 'Check env file: ssh tony-dell cat /home/tony/.config/mcp-rview-oauth-proxy.env'
- id: tony-omen-host
  name: tony-omen host reachability
  type: http
  url: http://tony-omen:9100/health
  expected_status: 200
  timeout: 5
  category: system
  profiles:
  - home
  - mobile
  host: tony_omen
  note: 'Canary for tony-omen host and tailnet connectivity. Depends on mcp-debug-cors being up; if it is down but the host is up, the SSH verification can isolate the failure.'
  verification:
  - 'Check host: ssh tony-omen uptime'
  - 'Check tailnet: ping -c 1 tony-omen'
  - 'Check mcp-debug: curl -s http://tony-omen:9100/health'
  recovery_actions:
  - 'Check power/network on tony-omen'
  - 'Restart mcp-debug-cors: ssh tony-omen systemctl --user restart mcp-debug-cors.service'
- id: tony-omen-sensor-reader
  name: tony-omen sensor-reader
  type: http
  url: http://tony-omen:8001/health
  expected_status: 200
  timeout: 5
  category: other
  profiles:
  - home
  - mobile
  host: tony_omen
  note: 'Hardware sensor / Docker container data API on tony-omen. Container is currently stopped (Exited 127); this check will fail until it is restarted.'
  verification:
  - 'Check container: ssh tony-omen docker ps -a | grep sensor-reader'
  - 'Check logs: ssh tony-omen docker logs chaba-omen-sensor-reader --tail 20'
  - 'Test endpoint: curl -s http://tony-omen:8001/health'
  recovery_actions:
  - 'Start container: ssh tony-omen "cd /home/tony/CascadeProjects/chaba-omen/stacks/web && docker compose up -d sensor-reader"'
  - 'Check main.py: ssh tony-omen ls -la /home/tony/CascadeProjects/chaba-omen/stacks/web/sensor-reader/main.py'
