title: Chaba Health Checks (Home Profile) — Other
subtitle: Home network health checks for the other category
icon: heart-pulse
services:
- id: chaba-funnel
  name: Chaba Funnel landing page
  type: http
  url: https://tony-dell.taila0626a.ts.net:8444/health
  expected_status: 200
  timeout: 5
  category: tailscale
  profiles:
  - home
  - mobile
  note: 'Tailscale Funnel landing page, /health endpoint, and /apps/docs/ on tony-dell:8444, proxied by tailscale serve to 127.0.0.1:8082. Port 443 on tony-dell remains the mcp-rview-oauth-proxy on 9004; 8443 is Caddy/rview.'
  verification:
  - 'Check systemd: systemctl --user status chaba-funnel.service'
  - 'Check port: ss -tlnp | grep 8082'
  - 'Test root: curl -s -o /dev/null -w ''%{http_code}'' https://tony-dell.taila0626a.ts.net:8444/'
  - 'Test health: curl -s https://tony-dell.taila0626a.ts.net:8444/health'
  - 'Test docs: curl -s -o /dev/null -w ''%{http_code}'' https://tony-dell.taila0626a.ts.net:8444/apps/docs/index.html'
  recovery_actions:
  - 'Restart: systemctl --user restart chaba-funnel.service'
  - 'Check tailscale serve: tailscale serve status'
  - 'Check syntax: python3 -m py_compile /home/tony/chaba-funnel/funnel-server.py'
- id: trade-automation
  name: Trade Automation
  type: systemd
  service: trade-automation.service
  scope: user
  host: tony_dell
  expected_state: active
  timeout: 5
  category: automation
  profiles:
  - home
  note: Background trade automation worker on tony-dell rootless podman (same image as trade-api, no exposed host port)
  verification:
  - 'Check service: ssh tony-dell systemctl --user status trade-automation.service'
  - 'Check container: ssh tony-dell podman ps | grep trade-automation'
  - 'Check logs: ssh tony-dell podman logs trade-automation'
  recovery_actions:
  - 'Restart service: ssh tony-dell systemctl --user restart trade-automation.service'
  - 'Check container: ssh tony-dell podman ps | grep trade-automation'
- id: mcp-debug-sse
  name: MCP Debug SSE server
  type: systemd
  service: mcp-debug-sse.service
  scope: user
  host: tony_dell
  expected_state: active
  timeout: 5
  category: mcp-debug
  profiles:
  - home
  - mobile
  note: MCP Debug SSE server on tony-dell. Clients connect via stdio-to-SSH wrapper (mcp-debug-ssh.sh) or directly to http://tony-dell.taila0626a.ts.net:8446/sse/.
  verification:
  - 'Check systemd: ssh tony-dell systemctl --user status mcp-debug-sse.service'
  - 'Check tailscale serve: ssh tony-dell tailscale serve status | grep 8446'
  - 'Test endpoint: curl -s -o /dev/null -w ''%{http_code}'' --max-time 2 http://tony-dell:8446/sse/'
  recovery_actions:
  - 'Restart service: ssh tony-dell systemctl --user restart mcp-debug-sse.service'
  - 'Check tailscale serve: ssh tony-dell tailscale serve status'
- id: mcp-debug-cors
  name: MCP Debug CORS endpoint
  type: http
  url: http://tony-omen:9100/health
  expected_status: 200
  timeout: 5
  category: mcp-debug
  profiles:
  - home
  - mobile
  disabled: true
  note: Legacy tony-omen CORS endpoint. Deprecated in favour of the MCP Debug SSE server on tony-dell.
  verification:
  - 'Disabled; see mcp-debug-sse'
  recovery_actions:
  - 'No action: legacy endpoint, disabled'
- id: mcp-debug-audit
  name: MCP Debug Audit Health
  type: http
  url: http://tony-omen:9100/audit-health
  expected_status: 200
  timeout: 10
  category: mcp-debug
  profiles:
  - home
  - mobile
  disabled: true
  note: Legacy tony-omen audit endpoint. Deprecated in favour of the MCP Debug SSE server on tony-dell.
  verification:
  - 'Disabled; see mcp-debug-sse'
  recovery_actions:
  - 'No action: legacy endpoint, disabled'
- id: playlived-omen
  name: Playlived (tony-omen)
  type: systemd
  service: playlived.service
  host: tony_omen
  expected_state: active
  timeout: 5
  category: system
  profiles:
  - home
  - mobile
  verification:
  - 'Check service: systemctl --user status playlived.service'
  - 'Check logs: journalctl --user -u playlived.service -n 20'
  recovery_actions:
  - 'Restart service: systemctl --user restart playlived.service'
- id: yomi-update-all-timer
  name: Yomi Update All Timer
  type: systemd
  service: yomi-update-all.timer
  expected_state: active
