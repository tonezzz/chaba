title: Night Jobs — tony_omen
subtitle: Overnight and scheduled jobs running on tony_omen
icon: moon
host: tony_omen
jobs:
- id: chaba-health-monitor
  name: Chaba Health Monitor
  host: tony_omen
  type: systemd-user-timer
  unit: chaba-health-monitor.timer
  schedule: every 15 minutes
  enabled: false
  status: decommissioned
  description: Collect tony-omen health snapshots.
  note: Superseded by chaba-dell-health-agent.timer and tony-dell-mcp-health.timer on tony-dell. Retained for reference.
- id: chaba-funnel-docs-sync
  name: Sync docs to tony-dell chaba-funnel
  host: tony_omen
  type: shell
  schedule: daily
  command: rsync -avP --delete --checksum /home/tony/CascadeProjects/chaba-h3/public/apps/docs/ tony@tony-dell:/home/tony/chaba-funnel/public/apps/docs/
  enabled: false
  status: decommissioned
  note: chaba-funnel was decommissioned on 2026-08-28 and port 8444 was reassigned to ha-live. This job is disabled and
    retained only for reference.
- id: arp-inventory-scan
  name: ARP inventory scan
  host: tony_omen
  type: systemd-user-timer
  unit: arp-inventory-scan.timer
  schedule: '*-*-* 04:00:00'
  enabled: true
  status: active
  description: >
    Run scripts/arp-inventory-scan.py on the current default subnet, compare results
    with ssot.mac-address-registry.yml and ssot.ip-address-registry.yml, update
    reports/network-inventory-last-seen.json, and create a focus-inbox alert if
    new or duplicate MACs are detected.
  note: Never rewrites the canonical SSOT files automatically. New/duplicate MACs
    are surfaced as draft focus-inbox items for human review.
- id: focus-dispatcher-safe-dispatch
  name: Focus Dispatcher — Auto-dispatch safe foci to tony-dell
  host: tony_omen
  type: shell
  schedule: '*-*-* *:05:00'
  command: cd /home/tony/CascadeProjects/chaba && python3 scripts/focus-dispatcher.py --auto-process --host tony_dell
  enabled: false
  status: planned
  description: Pick the highest safe-to-parallel focus, promote it to Ready (Safe), and write a tony-dell subagent contract.
  note: |
    This job is disabled until the new subagent/host validation has been tested.
    Enable by setting enabled: true and switching type to systemd-user-timer with a
    dedicated unit once the focus pipeline is stable.
