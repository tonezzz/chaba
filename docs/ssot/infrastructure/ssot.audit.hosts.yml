title: Host Service & Resource Audit
subtitle: Expected and observed state for tony-dell, tony-omen and kk-macbook
icon: server
version: 1
last_updated: '2026-09-11'
maintainer: tony

overview:
  purpose: |
    Single source of truth for which services and resources each Chaba host is
    expected to provide. A periodic or on-demand audit runner snapshots the live
    state, compares it to this file, and reports deltas so service verification
    becomes a one-command diff instead of manual ssh + systemctl + ps + free.
  usage: |
    python3 scripts/audit-hosts.py --host tony-dell
    python3 scripts/audit-hosts.py --host tony-omen
    python3 scripts/audit-hosts.py --host macbook

runner:
  script: scripts/audit-hosts.py
  command: python3
  output_dir: reports/audit-hosts
  ssot: docs/ssot/infrastructure/ssot.audit.hosts.yml
  schedule: daily
  note: |
    The runner writes per-host reports under reports/audit-hosts/ and prints a
    delta summary. It does not overwrite this SSOT file automatically; the user
    reviews the report and updates the canonical expected state here.

hosts:
