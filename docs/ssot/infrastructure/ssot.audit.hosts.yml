title: Host Service & Resource Audit
subtitle: Expected and observed state for tony-dell, tony-omen and tony-macbook (Linux since 2026-10-10)
icon: server
version: 1
last_updated: "2026-09-11"
maintainer: tony
overview:
  purpose: "Single source of truth for which services and resources each Chaba host
    is

    expected to provide. A periodic or on-demand audit runner snapshots the live

    state, compares it to this file, and reports deltas so service verification

    becomes a one-command diff instead of manual ssh + systemctl + ps + free.

    "
  usage: "python3 scripts/audit-hosts.py --host tony-dell

    python3 scripts/audit-hosts.py --host tony-omen

    python3 scripts/audit-hosts.py --host macbook

    "
runner:
  script: scripts/audit-hosts.py
  command: python3
  output_dir: reports/audit-hosts
  ssot: docs/ssot/infrastructure/ssot.audit.hosts.yml
  schedule: daily
  note: "The runner writes per-host reports under reports/audit-hosts/ AND
    upserts audit-auto-<host> kanban cards (--cards, in the chaba-system-report
    chain on tony-dell — OPS-0521 drift-reconcile). It does not overwrite this
    SSOT file automatically; the user reviews the report and updates the
    canonical expected state here.

    Per-host fields the diff enforces:
      expected_services — must be running (expected_state: active|inactive|absent)
      expected_absent   — must NOT be running (migrated/retired ghosts)
      allowed_running   — fnmatch globs allowed to run undeclared
      known_failed      — failed units that are tolerated/explained
      offline_ok        — unreachable host is normal (laptops)
      retired           — host out of the placement contract; not audited
      oom_kills_tolerance, expected_resources — resource thresholds

    "
