    known_failed:
      - name: app-devin-desktop
        reason: Devin desktop is started as a background nohup job, not a persistent
          systemd scope
        action: restart-devin-desktop
      - name: session-c2.scope
        reason: Transient session scope, no PIDs left to attach
        action: ignore
      - name: obex.service
        reason: No Bluetooth adapter on headless host
        action: ignore-or-mask
      - name: tony-dell-mcp-health.service
        reason: SSH mcp-health query to tony-omen failed
        action: investigate
      - name: chrome-remote-desktop@tony.service
        reason: Display ':20' not configured
        action: disable-or-configure
      - name: apport-autoreport.service
        reason: whoopsie upload timeout
        action: disable-if-not-needed
      - name: sync-to-hdd.service
        reason: /media/storage/backup not mounted
        action: mount-backup-drive
      - name: ha-card-snapshot.service
        reason: Home Assistant card snapshot helper is not currently running
        action: investigate
      - name: xdg-desktop-portal-gtk.service
        reason: GTK portal for sandboxed apps; fails without an active X session
        action: ignore-or-mask
      - name: xdg-desktop-portal.service
        reason: Desktop portal fails when no matching X session is active
        action: ignore-or-mask
      - name: plasma-xdg-desktop-portal-kde.service
        reason: KDE portal backend; no KDE session on the xfce seat
        action: ignore-or-mask
      - name: xiaomi-token-refresh.service
        reason: Nightly timer fails — no valid passToken cookie; Chrome on tony-dell is logged out of account.xiaomi.com. Cameras still stream on the stored token; it breaks when that token expires
        action: re-login-xiaomi-browser
      - name: user@60578.service
        reason: Transient UID user-manager (greeter/login seat) — UID not in passwd
        action: ignore
      - name: xfce4-notifyd.service
        reason: XFCE notification daemon; fails when no X session is active
        action: ignore-or-mask
      - name: yomi-update-active.service
        reason: Yomi active conversation update worker is not configured
        action: disable-or-configure
      - name: yomi-update-all.service
        reason: Yomi all-conversations update worker is not configured
