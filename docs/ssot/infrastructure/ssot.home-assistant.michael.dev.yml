title: Michael Home Assistant Dev Staging Flow
subtitle: Local development and test flow on tony-dell before deploying to the live michael-ha instance
icon: beaker

overview:
  purpose: Provide a safe, reproducible dev/test Home Assistant instance on tony-dell for editing packages, dashboards, and automations before applying them to the live michael-ha Nabu Casa instance.
  live_instance: docs/ssot/infrastructure/ssot.home-assistant.michael.yml
  target_use_cases:
    - UI/card development and review
    - automation and package logic validation
    - custom frontend card testing (e.g., sunsynk-power-flow-card fork)
  out_of_scope:
    - Add-on testing (HA OS add-ons do not run in HA Container)
    - Zigbee/Z-Wave/Modbus hardware discovery (real devices are on michael's network)

environments:
  dev:
    host: tony_dell
    container: michael-dev
    image: docker.io/homeassistant/home-assistant:2026.9.0
    runtime: rootless podman
    network: host
    port: 8124
    host_port: 0.0.0.0:8124
    quadlet:
      container_unit: ~/.config/containers/systemd/michael-dev.container
      service_unit: ~/.config/systemd/user/michael-dev.service
    config: /home/tony/.config/michael-dev
    repo_config: /home/tony/CascadeProjects/chaba-tony-dell/docs/home-assistant/configuration
    repo_dashboards: /home/tony/CascadeProjects/chaba-tony-dell/docs/home-assistant/dashboards
    caddy:
      note: Not used — Tailscale serve provides HTTPS on port 8124. HA UI absolute redirects require internal_url to match the Tailnet HTTPS URL.
    https:
      provider: tailscale_serve
      tailnet_url: https://tony-dell.taila0626a.ts.net:8124
      proxy_target: http://127.0.0.1:8124
      note: tailscale serve --https=8124 http://127.0.0.1:8124 (must run as root or via sudo).
    health_check: ssh tony-dell curl -sf https://tony-dell.taila0626a.ts.net:8124/ >/dev/null
    mcp:
      server: ha_mcp_tools in-process
      status: active
      entry_id: 01M22027A3F326A34C31498D0F3
      server_user_id: 9b6eb3a940c44994834b36a6d64de13a
      server_port: 9585
      bind_host: 0.0.0.0
      secret_path: /private_B3WMIAChoseTpDS7fwgwRw
      webhook_id: mcp_ed77567866f1ebbb6fb091dc816cb550
      local_url: http://127.0.0.1:9585/private_B3WMIAChoseTpDS7fwgwRw
      tailnet_url: http://tony-dell:9585/private_B3WMIAChoseTpDS7fwgwRw
      note: HA-MCP Server runs inside the dev container, exposed on host port 9585.
    autostart: loginctl enable-linger tony is yes; Quadlet WantedBy=default.target
    status: enabled
    core_config:
      internal_url: https://tony-dell.taila0626a.ts.net:8124
      note: Required so the frontend OAuth client_id and absolute redirects match the Tailnet HTTPS URL.
    auth:
      provider: homeassistant
      username: nakva
      display_user: nakvac@gmail.com
      source: saved live michael-ha credentials file
      token:
        file: /home/tony/.config/secrets/ha-michael-dev.env
        env: HASS_TOKEN
        created: 2026-09-04
        note: Long-lived access token for automated Playlive / REST access. Do not commit the token file.
      manual_steps:
        - Log in to the michael-dev Home Assistant web UI at https://tony-dell.taila0626a.ts.net:8124
        - Navigate to your user profile (left sidebar bottom user icon) and switch to the Security tab
        - Under Long-Lived Access Tokens, click CREATE TOKEN
        - Name the token, e.g. devin-playlive, and copy the token string
        - Save it to /home/tony/.config/secrets/ha-michael-dev.env as HASS_TOKEN=<token> with chmod 600
        - For Playlive auto-login, append ?auth_token=<token> to HA dashboard URLs
      note: Same password as live michael-ha; auth_provider.homeassistant user and credentials copied manually. Token is now the preferred automated credential.
    access:
      local: http://127.0.0.1:8124
      tailscale: https://tony-dell.taila0626a.ts.net:8124
  live:
    host: michael-ha
    type: nabu_casa
    deploy_script: scripts/home-assistant/deploy-michael.sh
    remote_config: /config
    tailnet_url: http://michael-ha:8123/
    cloud_url: https://nupo4ndqdqydt78zmpq0z5wzp1bdrqgs.ui.nabu.casa/
    auth:
      token:
        file: /home/tony/.config/secrets/ha-michael-live.env
        env: HASS_TOKEN
        note: Awaiting valid token. The previous token was invalid and the file was removed.
      manual_steps:
        - Log in to the live Home Assistant instance via the Nabu Casa URL
        - Navigate to your user profile and open the Security tab
        - Under Long-Lived Access Tokens, click CREATE TOKEN
        - Name the token, e.g. devin-playlive, and copy the token string
        - Save it to /home/tony/.config/secrets/ha-michael-live.env as HASS_TOKEN=<token> with chmod 600

config_source:
  packages: docs/home-assistant/configuration/packages/
  helpers: docs/home-assistant/configuration/*.yaml
  dashboards:
    repo_path: docs/home-assistant/dashboards/
    ssot: docs/ssot/infrastructure/ssot.home-assistant.dashboards.yml
    note: Not the active source for tony-test. For live parity, copy michael-ha .storage/lovelace* files to the dev .storage directory instead.
  custom_cards:
    - stacks/web/public/apps/michael-live/
    - docs/home-assistant/www/

cards:
  ssot: docs/ssot/infrastructure/ssot.home-assistant.cards.yml
  note: Build, deploy, source, and design context for the forked sunsynk-power-flow-card and related custom cards.
  caddy_snippet: stacks/tony-dell/michael-dev/caddy-snippet

howto:
  ssot: docs/ssot/infrastructure/ssot.home-assistant.howto.yml
  note: Runbooks for tabs, cards, build/deploy, tokens, and SVG overlay fixes.

entities:
  ssot: docs/ssot/infrastructure/ssot.home-assistant.entities.yml
  note: Entity IDs and dummy battery data used by the tony-test PF3 sunsynk card.

design:
  ssot: docs/ssot/infrastructure/ssot.home-assistant.design.yml
  note: SVG layout, text rendering, alignment, and overlay conventions for custom cards.

full_flow:
  - step: 1
    label: Edit in chaba
    action: Modify packages, dashboards, helpers, or custom cards in the repo and commit/push to the working branch.
  - step: 2
    label: Deploy to dev
    action: Run scripts/home-assistant/deploy-michael-dev.sh
    result: Repo config is rsynced to ~/.config/michael-dev/ and the michael-dev container is restarted.
  - step: 2.5
    label: Sync live dashboards to dev .storage
    action: Copy live michael-ha:/config/.storage/lovelace_dashboards and lovelace.tony_test to the dev .storage directory.
    note: "The dev configuration.yaml must not contain a lovelace: block. If present after deploy, remove it so the copied .storage dashboards are used."
  - step: 3
    label: Test on tony-dell
    action: Open https://tony-dell.taila0626a.ts.net:8124 or http://127.0.0.1:8124 locally and verify UI, cards, and automation traces.
  - step: 4
    label: Deploy to live
    action: Run scripts/home-assistant/deploy-michael.sh
    result: Repo config is rsynced to michael-ha:/config and the live core config is reloaded.
  - step: 5
    label: Verify live
    action: Check the Nabu Casa URL or http://michael-ha:8123/ and confirm no errors.

scripts:
  deploy_dev:
    path: scripts/home-assistant/deploy-michael-dev.sh
    description: Rsync repo config to the tony-dell dev instance and restart it.
    env:
      - name: MICHAEL_DEV_CONFIG
        default: ~/.config/michael-dev
      - name: MICHAEL_DEV_SERVICE
        default: michael-dev.service
      - name: MICHAEL_DEPLOY_DASHBOARDS
        default: "0"
  deploy_live:
    path: scripts/home-assistant/deploy-michael.sh
    description: Rsync repo config to the live michael-ha instance and reload core config.

custom_components:
  dev_parity:
    - ha_mcp_tools (port 9585; secret path /private_B3WMIAChoseTpDS7fwgwRw)
    - sunsynk-power-flow-card fork deployed to /config/www/ for dev testing

entity_mocks:
  purpose: Real devices (Sunsynk, Tuya, Zigbee) do not exist on tony-dell. Use dev-only mocks to test automation logic.
  repo_source: /home/tony/CascadeProjects/chaba-tony-dell/docs/home-assistant/dev/dev-mocks.yaml
  deployed_to: /home/tony/.config/michael-dev/packages/a_dev_mocks.yaml
  note: Deployed as packages/a_dev_mocks.yaml by deploy-michael-dev.sh. Keep out of deploy-michael.sh path so it is never sent to live.

verification:
  dev:
    - systemctl --user status michael-dev.service
    - curl -sf http://127.0.0.1:8124/
    - curl -sf https://tony-dell.taila0626a.ts.net:8124/
    - ss -tlnp | grep 8124
    - ss -tlnp | grep 9585
    - curl -s -o /dev/null -w "%{http_code}" http://tony-dell:9585/private_B3WMIAChoseTpDS7fwgwRw
    - tailscale serve status | grep 8124
  live:
    - tailscale ping michael-ha
    - curl -sf http://michael-ha:8123/
    - confirm dashboard shows expected updates

rollback:
  dev:
    - systemctl --user stop michael-dev.service
    - rm -rf /home/tony/.config/michael-dev (or restore from backup)
  live:
    - Revert the last git commit in chaba and re-run scripts/home-assistant/deploy-michael.sh.
    - Restore michael-ha:/config from a snapshot if available.

related_files:
  - docs/ssot/infrastructure/ssot.home-assistant.michael.yml
  - scripts/home-assistant/deploy-michael.sh
  - docs/home-assistant/configuration/packages/batteries_sankey.yaml
  - docs/home-assistant/configuration/packages/pool_sankey.yaml
  - docs/home-assistant/dashboards/tony-test-current.json

