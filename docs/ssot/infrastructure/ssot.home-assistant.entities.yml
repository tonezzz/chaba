title: Home Assistant Entity Mappings
subtitle: Canonical entity IDs and dummy data used by the tony-test PF3 sunsynk card

source:
  dashboard_ssot: docs/ssot/infrastructure/ssot.home-assistant.dashboards.yml
  live_config_path: /config/.storage/lovelace.tony_test
  live_instance: michael-ha
  repo_snapshot: docs/home-assistant/dashboards/tony-test-current.json

instances:
  michael-dev:
    dashboard: tony-test/pf3
    cardstyle: lite
    card_title: Sunsynk 3-battery test
    battery_count: 4
    note: Original testbed; may differ from michael-ha until synced.
  michael-ha:
    dashboard: tony-test/pf3
    cardstyle: lite
    card_title: Sunsynk 3-battery live
    battery_count: 4

entity_groups:
  inverter:
    dc_transformer_temp_90: sensor.inverters_1_temperature
    inverter_voltage_154: sensor.inverters_1_ac_output_voltage
    inverter_current_164: sensor.inverters_1_load_current_essential_1
    inverter_power_175: sensor.inverters_1_load_power
    inverter_status_59: sensor.inverters_1_inverter_mode

  solar:
    pv1_voltage_109: sensor.inverters_1_pv_voltage_1
    pv1_current_110: sensor.inverters_1_pv_current_1
    pv1_power_186: sensor.inverters_1_pv_power_1
    pv2_voltage_111: sensor.inverters_1_pv_voltage_2
    pv2_current_112: sensor.inverters_1_pv_current_2
    pv2_power_187: sensor.inverters_1_pv_power_2
    pv_total: sensor.inverters_1_pv_power

  grid:
    grid_power_169: sensor.inverters_1_grid_power
    grid_ct_power_172: sensor.inverters_1_grid_power_ld
    grid_voltage: sensor.inverters_1_grid_voltage
    load_frequency_192: sensor.inverters_1_grid_frequency

  daily_aggregates:
    day_battery_charge_70: sensor.solis_s6_eh3p10k_h_zp_today_battery_charge_energy
    day_battery_discharge_71: sensor.solis_s6_eh3p10k_h_zp_today_battery_discharge_energy
    day_load_energy_84: sensor.solis_s6_eh3p10k_h_zp_today_energy_consumption
    day_grid_import_76: none
    day_grid_export_77: none
    day_pv_energy_108: none

  calculated_sensors:
    note: Pack 1 power/current derived from total minus packs 2 and 3.
    battery_1_calculated_power: sensor.battery_1_calculated_power
    battery_1_calculated_current: sensor.battery_1_calculated_current
    package: docs/home-assistant/configuration/packages/batteries_calculated.yaml

  main_battery:
    note: Total/aggregate battery bank (card slot "battery").
    battery_voltage_183: sensor.totals_battery_voltage
    battery_soc_184: sensor.totals_battery_state_of_charge
    battery_power_190: sensor.totals_battery_power
    battery_current_191: sensor.totals_battery_current
    battery_current_direction: none

  battery_2:
    note: Card slot "battery2" - physical pack 1 (power/current calculated from total).
    battery2_voltage_183: sensor.batteries_1_voltage
    battery2_soc_184: sensor.batteries_1_state_of_charge
    battery2_power_190: sensor.battery_1_calculated_power
    battery2_current_191: sensor.battery_1_calculated_current

  battery_3:
    note: Card slot "battery3" - physical pack 2.
    battery3_voltage_183: sensor.batteries_2_voltage
    battery3_soc_184: sensor.batteries_2_state_of_charge
    battery3_power_190: sensor.batteries_2_power
    battery3_current_191: sensor.batteries_2_current

  battery_4:
    note: Card slot "battery4" - physical pack 3.
    battery4_voltage_183: sensor.batteries_3_voltage
    battery4_soc_184: sensor.batteries_3_state_of_charge
    battery4_power_190: sensor.batteries_3_power
    battery4_current_191: sensor.batteries_3_current

battery_settings_pf3:
  battery:
    energy: 14280
    shutdown_soc: 20
    show_daily: true
    colour: '#00E676'
    animation_speed: 6
    max_power: 10000
    count: 4
    invert_power: true
    show_absolute: true
  battery2:
    energy: 14280
    shutdown_soc: 20
    show_daily: false
    show_remaining_energy: false
    colour: '#00E676'
    invert_power: true
    show_absolute: true
  battery3:
    energy: 14280
    shutdown_soc: 20
    show_daily: false
    show_remaining_energy: true
    colour: '#00E676'
    invert_power: true
    show_absolute: true
  battery4:
    energy: 14280
    shutdown_soc: 20
    show_daily: false
    show_remaining_energy: false
    colour: '#00E676'
    invert_power: true
    show_absolute: true

unused:
  note: Entities not used by the PF3 card.
  remaining_solar: none
  battery1_voltage_183: none
  battery1_soc_184: none
  battery1_power_190: none
  battery1_current_191: none

status:
  last_updated: '2026-09-04'
  last_verified: '2026-09-04'
  health: active
