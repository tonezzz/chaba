    label: Chaba — Tony's household persona
    unit: ada-ha-tony.service
    host: idc03
    listen: 127.0.0.1:8002
    tailnet: https://idc03.taila0626a.ts.net/apps/ha/ada-tony
    home: tony-ha
    keys: [gemini-tony-paid, litellm-vkey-chaba, ha-tony-token-svc-ada, ada-device-keys]
  - id: kraut-ai
    label: Kraut — Michael's household persona (name TBC by Tony)
    unit: ada-ha-michael.service
    host: idc03
    listen: 127.0.0.1:8003
    tailnet: https://idc03.taila0626a.ts.net/apps/ha/ada-michael
    home: mn-ha
    keys: [gemini-ada-lane-paid, litellm-vkey-michael, ha-michael-live-token, ada-device-keys]
    note: Gemini key is currently FREE-tier (…VPnw, rotated 2026-10-15) —
      bump to a paid key minted under Michael's billing when that lands.
  - id: kaewta-ai
    label: Kaewta — KK's household persona
    unit: ada-kk.service
    host: idc03
    listen: 127.0.0.1:8007
    tailnet: https://idc03.taila0626a.ts.net/apps/ha/ada-kk
    home: kk-ha
    keys: [gemini-ada-kk, litellm-vkey-kk, ada-device-keys]
  - id: ada-ai
    label: Ada — lab/dev persona
    unit: ada-dev.service
    host: idc03
    listen: 127.0.0.1:8005
    tailnet: https://idc03.taila0626a.ts.net/apps/ha/ada-dev
    home: ada-ha
    keys: [gemini-ada, litellm-vkey-bench]
  - id: ada-pi-pwa
    label: PWA/guest surface (voice+chat, member keys)
    unit: ada-pi-pwa.service
    host: idc03
    listen: 127.0.0.1:8001
    tailnet: https://idc03.taila0626a.ts.net/
