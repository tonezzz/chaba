  - id: tony-dev
    label: Tony dev twin (planned)
    host: tony-dell
    ha_url: http://127.0.0.1:8127
    public_url: null
    voice_backend: null
    planned: true                    # card ha-dev-instances — blocked; promote-tony.sh uses --from michael-dev meanwhile
  - id: ada-dev
    label: Ada dev twin (planned)
    host: tony-dell
    ha_url: http://127.0.0.1:8128
    public_url: null
