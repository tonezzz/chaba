# ---------------------------------------------------------------------------
# LAYER 3 — Edge & messaging plumbing (how traffic reaches personas)
# ---------------------------------------------------------------------------
edges:
  - id: caddy-edge-idc02
    role: public edge — *-ha.surf-thailand.com + monitor + board hosts
    host: idc02
    config: ~/.config/caddy/Caddyfile  # hand-maintained; blocks per host
    gate: cloudflare-access            # one self-hosted app per hostname
  - id: caddy-edge-idc03
    role: api.surf-thailand.com — LINE/TG webhooks, PWA redeem, ada-ws
    host: idc03
  - id: ada-line-relay
    role: LINE webhook + push; group-pinned lanes (C4fb0ce…=chaba, C8220…=kaewta)
    unit: ada-line-relay.service
    host: idc03
    keys: [line-relay-channel]
  - id: ada-tg-relay
    role: Telegram relay — tony lane
    unit: ada-tg-relay.service
    host: idc03
  - id: ada-tg-relay-kk
    role: Telegram relay — kk-ha lane (kk_ha_bot)
    unit: ada-tg-relay-kk.service
    host: idc03
  - id: litellm-gateway
    role: REST/embedding LLM gateway — per-lane virtual keys, budget caps
    host: idc03
    listen: 100.102.134.91:4000
    upstream_key: gemini-ada-paid      # all vkey traffic bills here (pooled)
  - id: cloudflare
    role: DNS (cfat_ on idc01/02/03) + Access (cfut_ on tony-omen/tony-dell)
    note: two tokens, different scopes — ssot.secrets.yml cloudflare-* entries

# ---------------------------------------------------------------------------
# LAYER 4 — Keys & secrets (per-lane: Live key + REST vkey + HA token + key pool)
# Detail = ssot.secrets.yml credential ids below; fingerprints come from the
# live scanner (scripts/secret-inventory.py, ada-pi), never stored here.
# ---------------------------------------------------------------------------
lane_keys:
  per_home: [GEMINI_API_KEY, ADA_GEMINI_REST_API_KEY, HOME_ASSISTANT_TOKEN, ADA_API_KEYS]
  infra_only:
    - gemini-ada-paid        # LiteLLM upstream + mddb-gemini
    - openrouter-ada-safety  # OR fallback ($10 cap)
    - cloudflare-cfat        # DNS
    - cloudflare-cfut        # Access + Workers
    - mddb-mcp-api-key
    - mddb-replication-secret
    - backup-age
    - secrets-console-key
    - github-pat
    - postgres-mcp

# ---------------------------------------------------------------------------
# LAYER 5 — Data & ops
# ---------------------------------------------------------------------------
data:
  - id: mddb
    role: memory banks + ada-cms-pages content store
    host: idc03 (leader), idc01/idc02 followers
  - id: spend-ledger
    role: usage.jsonl + lane budgets (lane_budget.py) + daily-ledger.py
    note: shared ledger — untagged rows count toward every lane (known
      overcount, carded under ADA-0631 follow-ups)
  - id: secrets-backup
    role: age-encrypted tarballs — idc03 daily + secrets-collect weekly
  - id: kanban
    role: board-api on tony-dell :8787 + cards.json render on web edge

# ---------------------------------------------------------------------------
# TARGET NAMING — grand-rename spec (card mn-dev-rename / OPS-0726 grown up).
# Physical resources still carry the 'now' names; ids above are the target.
# Port slot convention: member=1, chaba=2, kraut=3, kaewta=4, ada=5.
# Prod backend :800N, persona dev backend :801N. Renumber is optional phase.
# ---------------------------------------------------------------------------
rename_map:
  units:
    - {now: ada-pi-pwa.service,     to: ada-ai.service,           port_now: 8001, port_target: 8001, note: "family root — member/guest surface; catch-all on app.surf-thailand.com + legacy /api/cms*; ADA_INSTANCE_ID=tony"}
    - {now: ada-ha-tony.service,    to: ada-ai-chaba.service,     port_now: 8002, port_target: 8002}
    - {now: ada-ha-michael.service, to: ada-ai-kraut.service,     port_now: 8003, port_target: 8003, status: "DONE 2026-10-16 — unit/env/keys.json renamed, ADA_KEYS_FILE pinned, ADA_INSTANCE_ID=michael kept (pins MDDB banks), /ai/kraut alias live, old path kept during transition"}
    - {now: ada-dev.service,        to: ada-ai-dev.service,       port_now: 8005, port_target: 8005, note: "lab backend — the name finally says what it is"}
    - {now: ada-kk.service,         to: ada-ai-kaewta.service,    port_now: 8007, port_target: 8004, note: "renumber optional"}
    - {now: ada-kk-dev.service,     to: ada-ai-kaewta-dev.service, port_now: 8009, port_target: 8014, note: "renumber optional"}
  paths: {from: "/apps/ha/<name>", to: "/ai/<role>"}   # /ai/chaba, /ai/kraut, /ai/kaewta, /ai/ada (member), /ai/dev
  env_files: {from: "~/.config/secrets/ada-<x>.env", to: "~/.config/secrets/ada-ai-<role>.env"}
  key_pools: {from: "~/.config/secrets/ada-ha-<lane>-keys.json", to: "~/.config/secrets/ada-ai-<role>-keys.json"}
  ha_dev_twins: {michael-dev: mn-ha-dev}   # unit+container+dirs+~119 refs — OPS-0726
  future_families: "<family>-ai-<role>[-dev] — e.g. adam-ai-chaba (ChatGPT family), eve-ai-chaba. Ports: new family gets its own block (:81xx adam, :82xx eve…)"
  open_decisions:
    - "RESOLVED kraut — confirmed (sauerkraut, Michael likes Sour Kraut)"
    - "RESOLVED ports — sort to slot convention approved (8007->8004, 8009->8014 when that lane migrates)"
    - "RESOLVED surface name — family-first scheme makes ada-pi-pwa -> ada-ai"
    - "cutover: alias grace chosen in practice (old serve path kept alongside /ai/kraut)"

notes:
  - "Naming is compositional: <x>-ha / <x>-ha-dev / <x>-ai / <x>-ai-dev.
    Dev twins attach to homes; persona dev backends attach to personas
    (provisioned on demand — only kaewta-ai-dev exists today). There is no
    chaba-dev/kraut-dev/kaewta-dev — those persona names never take a bare
    -dev; their dev surfaces are the -ai-dev voice units."
  - "mn-ha renamed from michael-ha 2026-10-16 — old name 301s, both Access-gated."
  - "Persona display names (chaba-ai / kraut-ai / kaewta-ai / ada-ai) are Tony's
    vocabulary — confirm kraut-ai before it lands in docs/UI."
  - "kk-ha has no dedicated HA WebUI of its own here — its lane is the member
    node on idc03:8126 behind the kk-ha hostname."
