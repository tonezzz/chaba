schema: 1
title: Chaba system map — layered view (homes -> personas -> plumbing -> keys -> data)
created: '2026-10-16'
maintainer: tony
status: active
purpose: >-
  Tony's mental model of the whole platform, written down: every home
  (HA instance) is a base layer; each home has one voice persona; the
  plumbing layer carries traffic between them; the key layer lists which
  credential each service holds (detail lives in ssot.secrets.yml —
  this file references credential ids, never values).

naming: >-
  Compositional scheme (2026-10-16). Homes: <name>-ha = HA node,
  <name>-ha-dev = its dev twin. Voice: <family>-ai-<role>[-dev] —
  family = assistant provider (ada = Gemini Live stack; future providers
  get their own family, e.g. adam-ai-chaba for a ChatGPT-backed chaba),
  role = household persona (chaba/kraut/kaewta/member), -dev = that
  backend's dev twin (on-demand, free-tier keys). Base `ada-ai` = the
  member/guest surface (was ada-pi-pwa); `ada-ai-dev` = lab backend (was
  ada-dev.service). Hyphens, never underscores — DNS-safe. Physical
  unit/dir names predate this scheme — renames are carded migrations
  (grand-rename card, subsumes OPS-0726).

