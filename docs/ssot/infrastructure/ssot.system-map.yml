    public_url: https://tony-ha.surf-thailand.com   # CF Access app 70aa9fe3
    voice_backend: ada-ha-tony
    ssot: docs/ssot/infrastructure/ssot.home-assistant.instances.yml
  - id: mn-ha
    label: Michael's house
    host: michael-ha                 # HAOS appliance (aarch64)
    ha_url: http://michael-ha:8123/
    nabu_casa: https://nupo4ndqdqydt78zmpq0z5wzp1bdrqgs.ui.nabu.casa/
    public_url: https://mn-ha.surf-thailand.com   # CF Access app 0e0e65e0; renamed from michael-ha.surf-thailand.com 2026-10-16
