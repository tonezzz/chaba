      bump to a paid key minted under Michael's billing when that lands.
  - id: kaewta-ai
    label: Kaewta — KK's household persona
    unit: ada-kk.service
    host: idc03
    listen: 127.0.0.1:8007
    tailnet: https://idc03.taila0626a.ts.net/apps/ha/ada-kk
    home: kk-ha
    keys: [gemini-ada-kk, litellm-vkey-kk, ada-device-keys]
    dev_backend: ada-kk-dev.service  # = kaewta-ai-dev — live on idc03 :8009, free key
  - id: ada-ai
    label: Ada — lab/dev persona
