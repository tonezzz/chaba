    keys: [gemini-tony-paid, litellm-vkey-chaba, ada-device-keys]

# ---------------------------------------------------------------------------
# LAYER 3 — Edge & messaging plumbing (how traffic reaches personas)
# ---------------------------------------------------------------------------
edges:
  - id: caddy-edge-idc02
    role: public edge — *-ha.surf-thailand.com + monitor + board hosts
    host: idc02
    config: ~/.config/caddy/Caddyfile  # hand-maintained; blocks per host
    gate: cloudflare-access            # one self-hosted app per hostname
  - id: caddy-edge-idc03
    role: api.surf-thailand.com — LINE/TG webhooks, PWA redeem, ada-ws
    host: idc03
  - id: ada-line-relay
    role: LINE webhook + push; group-pinned lanes (C4fb0ce…=chaba, C8220…=kaewta)
    unit: ada-line-relay.service
    host: idc03
    keys: [line-relay-channel]
  - id: ada-tg-relay
    role: Telegram relay — tony lane
    unit: ada-tg-relay.service
    host: idc03
  - id: ada-tg-relay-kk
    role: Telegram relay — kk-ha lane (kk_ha_bot)
    unit: ada-tg-relay-kk.service
    host: idc03
  - id: litellm-gateway
    role: REST/embedding LLM gateway — per-lane virtual keys, budget caps
    host: idc03
    listen: 100.102.134.91:4000
    upstream_key: gemini-ada-paid      # all vkey traffic bills here (pooled)
  - id: cloudflare
    role: DNS (cfat_ on idc01/02/03) + Access (cfut_ on tony-omen/tony-dell)
    note: two tokens, different scopes — ssot.secrets.yml cloudflare-* entries

# ---------------------------------------------------------------------------
# LAYER 4 — Keys & secrets (per-lane: Live key + REST vkey + HA token + key pool)
# Detail = ssot.secrets.yml credential ids below; fingerprints come from the
# live scanner (scripts/secret-inventory.py, ada-pi), never stored here.
# ---------------------------------------------------------------------------
lane_keys:
  per_home: [GEMINI_API_KEY, ADA_GEMINI_REST_API_KEY, HOME_ASSISTANT_TOKEN, ADA_API_KEYS]
  infra_only:
    - gemini-ada-paid        # LiteLLM upstream + mddb-gemini
    - openrouter-ada-safety  # OR fallback ($10 cap)
    - cloudflare-cfat        # DNS
    - cloudflare-cfut        # Access + Workers
    - mddb-mcp-api-key
    - mddb-replication-secret
    - backup-age
    - secrets-console-key
    - github-pat
    - postgres-mcp

# ---------------------------------------------------------------------------
# LAYER 5 — Data & ops
# ---------------------------------------------------------------------------
data:
  - id: mddb
    role: memory banks + ada-cms-pages content store
    host: idc03 (leader), idc01/idc02 followers
  - id: spend-ledger
    role: usage.jsonl + lane budgets (lane_budget.py) + daily-ledger.py
    note: shared ledger — untagged rows count toward every lane (known
      overcount, carded under ADA-0631 follow-ups)
  - id: secrets-backup
    role: age-encrypted tarballs — idc03 daily + secrets-collect weekly
  - id: kanban
    role: board-api on tony-dell :8787 + cards.json render on web edge

notes:
  - "mn-ha renamed from michael-ha 2026-10-16 — old name 301s, both Access-gated."
  - "Persona display names (chaba-ai / kraut-ai / kaewta-ai / ada-ai) are Tony's
    vocabulary — confirm kraut-ai before it lands in docs/UI."
  - "kk-ha has no dedicated HA WebUI of its own here — its lane is the member
    node on idc03:8126 behind the kk-ha hostname."
