    host: idc03
    listen: 127.0.0.1:8002
    tailnet: https://idc03.taila0626a.ts.net/apps/ha/ada-tony
    home: tony-ha
    keys: [gemini-tony-paid, litellm-vkey-chaba, ha-tony-token-svc-ada, ada-device-keys]
  - id: kraut-ai
    label: Kraut — Michael's household persona (confirmed 2026-10-16 — Kraut = sauerkraut, Michael likes it)
    unit: ada-ai-kraut.service       # renamed from ada-ha-michael.service 2026-10-16 — first lane of grand-rename
    host: idc03
    listen: 127.0.0.1:8003
    tailnet: https://idc03.taila0626a.ts.net/ai/kraut
    tailnet_legacy: https://idc03.taila0626a.ts.net/apps/ha/ada-michael   # alias kept during transition
    home: mn-ha
    keys: [gemini-ada-lane-paid, litellm-vkey-michael, ha-michael-live-token, ada-device-keys]
