fallbacks:
  helm-llm:
    primary: gemini-3.1-flash-lite
    chain:
    - model: gemini-3.5-flash-lite
      expected_quality: high
      reason: 3x RPM and 25x RPD vs Gemini 2.5 Flash; identical limits to gemini-3.1-flash-lite
    - model: gemini-3.7-flash
      expected_quality: medium-high
      reason: Newest Flash family with low observed usage; 5 RPM / 20 RPD, adequate for code
    - model: gemini-3.5-flash
      expected_quality: medium
      reason: Same 5 RPM / 20 RPD as 3.7; useful when 3.1/3.5-lite quotas are exhausted
    - model: gemini-2.5-flash-lite
      expected_quality: medium
      reason: Higher RPM (10) but observed over RPD on 2026-08-18; use after daily reset
    - model: gemini-2.5-flash
      expected_quality: medium
      reason: Previously primary; 5 RPM / 20 RPD and observed over RPD on 2026-08-18
    - model: gemini-3.6-flash
      expected_quality: medium
      reason: 5 RPM / 20 RPD; observed over RPD on 2026-08-18; fall back to this after reset
  yomi-summarization:
    primary: gemma-4-31b-it
    chain:
    - model: gemma-4-26b-a4b-it
      expected_quality: high
      reason: Same Gemma 4 family; MoE variant with identical limits
    - model: gemini-2.5-flash-lite
      expected_quality: medium-high
      reason: 2x RPM and large context; good for long Thai/English summaries
    - model: gemini-2.5-flash
      expected_quality: medium
      reason: Large context and TPM; lower RPM and different style
  media-analysis:
    primary: gemma-4-31b-it
    chain:
    - model: gemma-4-26b-a4b-it
      expected_quality: high
      reason: Same Gemma 4 family; MoE variant with identical limits
    - model: gemini-2.5-flash
      expected_quality: medium-high
      reason: Strong multimodal/text reasoning; lower RPM
    - model: gemini-2.5-flash-lite
      expected_quality: medium
      reason: Higher RPM for batched media jobs; slightly lighter model
