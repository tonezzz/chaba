title: Google Generative Models
subtitle: Canonical model registry with free-tier rate limits for all Chaba Google API usage
icon: 🧠

# Source of truth for model names, rate limits, and usage assignments.
# Other SSOT files and KB docs should reference entries here by model id
# instead of duplicating names or limits.

config:
  version: 1
  last_updated: 2026-08-15
  maintainer: tony
  status: active

source:
  url: https://aistudio.google.com/app/apikey
  last_verified: 2026-08-15
  input_file: null
  note: Free-tier limits captured from the Google AI Studio rate-limits dashboard

sections:
  - title: Registry Overview
    icon: 📋
    layout: list
    items:
      - label: Canonical source
        text: Google AI Studio free-tier rate-limits dashboard
      - label: Active assignments
        text: gemma-4-31b-it for Yomi summarization; gemini-2.5-flash for Helm
      - label: Ingest script
        text: scripts/ingest-gemini-rate-limits.py updates this file from JSON/YAML input
      - label: Consumers
        text: 'Referenced by docs/kb/gemini-integration.md and docs/ssot/infrastructure/ssot.services.yml'

  - title: Model Status Legend
    icon: 🏷️
    layout: list
    items:
      - label: active
        text: 'Currently used in production (has verified free-tier limits)'
      - label: available
        text: 'Available but not currently wired to a service'
      - label: deprecated
        text: 'Legacy; do not use for new work'
      - label: not_used
        text: 'Not relevant to Chaba workload'

models:
  gemma-4-31b-it:
    display_name: Gemma 4 31B
    api_name: gemma-4-31b-it
    category: Other models
    params: "30.7B"
    context_window: "256K"
    free_tier:
      rpm: 30
      tpm: 16000
      rpd: 14400
    status: active
    primary_for: [yomi-summarization, media-analysis]
    notes: Default Yomi summarization model. Higher free-tier RPD budget than Flash models.

  gemma-4-26b-a4b-it:
    display_name: Gemma 4 28B (AI Studio) / 26B A4B (API)
    api_name: gemma-4-26b-a4b-it
    category: Other models
    params: "25.2B (3.8B active, MoE)"
    context_window: "256K"
    free_tier:
      rpm: 30
      tpm: 25000
      rpd: 14400
    status: active
    fallback_for: [yomi-summarization, media-analysis]
    notes: |
      Marketing name in AI Studio is "Gemma 4 28B".
      API name is gemma-4-26b-a4b-it. Used as vision fallback.

  gemma-4-12b-unified:
    display_name: Gemma 4 12B
    api_name: gemma-4-12b-unified
    category: Other models
    params: "11.95B"
    context_window: "256K"
    free_tier:
      rpm: null
      tpm: null
      rpd: null
      status: unverified
    status: available
    notes: Not currently used. Capture free-tier limits from AI Studio if enabled.

  gemini-3.6-flash:
    display_name: Gemini 3.6 Flash
    api_name: gemini-3.6-flash
    category: Text-out models
    free_tier:
      rpm: 5
      tpm: 250000
      rpd: 20
    status: available
    notes: Newer Flash generation; not currently wired to any Chaba service.

  gemini-2.5-flash:
    display_name: Gemini 2.5 Flash
    api_name: gemini-2.5-flash
    category: Text-out models
    free_tier:
      rpm: 5
      tpm: 250000
      rpd: 20
    status: active
    primary_for: [helm-llm]
    notes: Helm primary provider for complex reasoning and code generation.

  gemini-2.5-flash-lite:
    display_name: Gemini 2.5 Flash Lite
    api_name: gemini-2.5-flash-lite
    category: Text-out models
    free_tier:
      rpm: 10
      tpm: 250000
      rpd: 20
    status: available
    notes: Higher RPM limit than standard 2.5 Flash on the free tier.

  gemini-1.5-flash:
    display_name: Gemini 1.5 Flash
    api_name: gemini-1.5-flash
    category: Text-out models
    free_tier:
      rpm: null
      tpm: null
      rpd: null
      status: unverified
    status: deprecated
    notes: Legacy fallback referenced in gemini-integration.mjs. Verify availability before relying on it.

  gemini-flash-latest:
    display_name: Gemini Flash Latest
    api_name: gemini-flash-latest
    category: Text-out models
    free_tier:
      rpm: null
      tpm: null
      rpd: null
      status: alias
    status: available
    notes: Rolling API alias. Rate limits match whichever Flash model it currently resolves to.

  antigravity:
    display_name: Antigravity
    api_name: antigravity
    category: Agents
    free_tier:
