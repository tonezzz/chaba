title: Google Generative Models
subtitle: Canonical model registry with free-tier rate limits for all Chaba Google API usage
icon: 🧠
config:
  version: 1
  last_updated: 2026-08-15
  maintainer: tony
  status: active
source:
  url: https://aistudio.google.com/app/apikey
  last_verified: '2026-08-15'
  input_file: /tmp/rate-limits.txt
  note: Free-tier limits captured from the Google AI Studio rate-limits dashboard
sections:
- title: Registry Overview
  icon: 📋
  layout: list
  items:
  - label: Canonical source
    text: Google AI Studio free-tier rate-limits dashboard
  - label: Active assignments
    text: gemma-4-31b-it for Yomi summarization; gemini-2.5-flash for Helm
  - label: Ingest script
    text: scripts/ingest-gemini-rate-limits.py updates this file from JSON/YAML input
  - label: Consumers
    text: Referenced by docs/kb/gemini-integration.md and docs/ssot/infrastructure/ssot.services.yml
- title: Model Status Legend
  icon: 🏷️
  layout: list
  items:
  - label: active
    text: Currently used in production (has verified free-tier limits)
  - label: available
    text: Available but not currently wired to a service
  - label: deprecated
    text: Legacy; do not use for new work
  - label: not_used
    text: Not relevant to Chaba workload
