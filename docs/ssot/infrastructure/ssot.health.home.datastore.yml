title: Chaba Health Checks (Home Profile) — Datastore
subtitle: Home network health checks for the datastore category
icon: heart-pulse
services:
  - id: redis
    name: Redis
    type: container
    container: redis
    host: tony_dell
    expected_state: running
    timeout: 5
    category: datastore
    profiles:
      - home
      - mobile
    note: "Migrated to tony-dell rootless podman; health is checked by podman ps locally on tony-dell."
    verification:
      - "Test container on tony_dell: ssh tony-dell podman ps | grep redis"
      - "Test connection: ssh tony-dell podman exec redis redis-cli ping"
      - "Test memory: ssh tony-dell podman exec redis redis-cli info memory"
      - "Check logs: ssh tony-dell podman logs redis --tail 20"
    recovery_actions:
      - "Restart container on tony_dell: ssh tony-dell podman restart redis"
      - "Check data volume: ssh tony-dell podman inspect redis | grep -A 10 Mounts"
      - "Verify networking on tony_dell: ssh tony-dell podman network inspect bridge"
  - id: postgres
    name: Postgres
    type: container
    container: chaba-postgres-16
    host: tony_dell
    expected_state: running
    timeout: 5
    category: datastore
    profiles:
      - home
      - mobile
    note: "Postgres runs in a rootless Podman container on tony-dell; health is checked locally."
    verification:
      - "Test container on tony_dell: podman ps | grep chaba-postgres-16"
      - "Test port: nc -zv postgre 5432"
      - "Check logs: podman logs chaba-postgres-16 --tail 20"
    recovery_actions:
      - "Restart container on tony_dell: podman restart chaba-postgres-16"
      - "Check data volume: /home/tony/.config/containers/postgres/data"
      - "If tony_dell cannot be recovered, run the failover script: /home/tony/.local/bin/yomi-failover-to-omen.sh"
  - id: weaviate
    name: Weaviate
    type: http
    url: "{profile}/api/weaviate/v1/nodes"
    expected_status: 200
    timeout: 5
    category: datastore
    profiles:
      - home
      - mobile
    note: Weaviate container runs on tony_dell:8084; Caddy on tony_dell proxies /api/weaviate/
      to 100.68.142.13:8084
    recovery_actions:
      - "Start container: ssh tony-dell podman start weaviate"
      - "Check container: ssh tony-dell podman ps | grep weaviate"
      - "Check logs: ssh tony-dell podman logs weaviate --tail 20"
    host: tony_dell
  - id: mddb-api
    name: MDDB API
    type: http
    url: http://idc01:11023/health
    expected_status: 200
    timeout: 5
    category: datastore
    profiles:
      - home
      - mobile
    note: MDDB on idc01 (tailnet-only). Direct port access for health check, bypasses Caddy routing
    host: idc01
  - id: mddb-mcp
    name: MDDB MCP Server
    type: http
    url: http://idc01:9000/mcp
    expected_status: 400
    timeout: 5
    category: datastore
    profiles:
      - home
      - mobile
    note: MCP endpoint for AI agent integration; GET /mcp returns 400, only POST is
      valid, so 400 is the healthy response
    recovery_actions:
      - "Check MDDB container: ssh idc01 podman ps | grep mddb"
      - "Restart MDDB: ssh idc01 systemctl --user restart mddb.service"
      - "Check MDDB logs: ssh idc01 journalctl --user -u mddb.service --since '-1h'"
      - "Verify MCP endpoint: curl -s http://idc01:9000/mcp"
      - "Check MCP config: cat ~/.config/devin/mcp_config.json | grep mddb"
    host: idc01
  - id: mddb-stats
    name: MDDB Stats Endpoint
    type: http
    url: http://idc01:11023/v1/stats
    expected_status: 200
    timeout: 5
    category: datastore
    profiles:
      - home
      - mobile
    note: MDDB on idc01 (tailnet-only). Direct port access, bypasses Caddy routing
    recovery_actions:
      - "Check MDDB service: ssh idc01 systemctl --user status mddb.service"
      - "Restart MDDB: ssh idc01 systemctl --user restart mddb.service"
      - "Check MDDB logs: ssh idc01 journalctl --user -u mddb.service --since '-1h'"
      - "Verify port 11023: curl -s http://idc01:11023/v1/stats"
    host: idc01
  - id: mddb-vector-stats
    name: MDDB Vector Stats Endpoint
    type: http
    url: http://idc01:11023/v1/vector-stats
    expected_status: 200
    timeout: 5
    category: datastore
    profiles:
      - home
      - mobile
    note: MDDB on idc01 (tailnet-only). Direct port access, bypasses Caddy routing
    recovery_actions:
      - "Check MDDB service: ssh idc01 systemctl --user status mddb.service"
      - "Restart MDDB: ssh idc01 systemctl --user restart mddb.service"
      - "Check MDDB logs: ssh idc01 journalctl --user -u mddb.service --since '-1h'"
      - "Verify port 11023: curl -s http://idc01:11023/v1/vector-stats"
    host: idc01
  - id: mddb-metrics
    name: MDDB Metrics Endpoint
    type: http
    url: http://idc01:11023/metrics
    expected_status: 200
    timeout: 5
    category: datastore
    profiles:
      - home
      - mobile
    note: MDDB on idc01 (tailnet-only). Direct port access, bypasses Caddy routing
    recovery_actions:
      - "Check MDDB service: ssh idc01 systemctl --user status mddb.service"
      - "Restart MDDB: ssh idc01 systemctl --user restart mddb.service"
      - "Check MDDB logs: ssh idc01 journalctl --user -u mddb.service --since '-1h'"
      - "Verify port 11023: curl -s http://idc01:11023/metrics"
    host: idc01
  - id: mddb-container
    name: MDDB Service
    type: systemd
    service: mddb.service
    expected_state: active
    timeout: 5
    category: datastore
    profiles:
      - home
      - mobile
    note: "MDDB runs as a podman quadlet (mddb.service, user unit) on idc01."
    recovery_actions:
      - "Check service: ssh idc01 systemctl --user status mddb.service"
      - "Restart: ssh idc01 systemctl --user restart mddb.service"
      - "Check logs: ssh idc01 journalctl --user -u mddb.service --since '-1h'"
      - "Quadlet file: ~/.config/containers/systemd/mddb.container on idc01"
    host: idc01
  - id: gemini-ollama-proxy
    name: Gemini-Ollama Embedding Proxy
    type: systemd
    service: gemini-ollama-proxy.service
    expected_state: active
    timeout: 5
    category: datastore
    profiles:
      - home
      - mobile
    note: "Gemini-to-Ollama embedding proxy on idc01, loopback-only
      (127.0.0.1:11435) — only mddb needs it. MDDB embeds through this;
      ollama.service on idc01 is the fallback."
    verification:
      - "Check service: ssh idc01 systemctl --user status gemini-ollama-proxy.service"
      - "Test health: ssh idc01 curl -s http://127.0.0.1:11435/health"
      - "Check logs: ssh idc01 journalctl --user -u gemini-ollama-proxy.service --since '-1h'"
    recovery_actions:
      - "Restart: ssh idc01 systemctl --user restart gemini-ollama-proxy.service"
      - "Verify GEMINI_API_KEY podman secret: ssh idc01 podman secret ls"
    host: idc01
