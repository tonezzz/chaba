title: Chaba Health Checks (Home Profile) — Datastore
subtitle: Home network health checks for the datastore category
icon: heart-pulse
services:
  - id: redis
    name: Redis
    type: container
    container: redis
    host: tony_dell
    expected_state: running
    timeout: 5
    category: datastore
    profiles:
      - home
      - mobile
    note: "Migrated to tony-dell rootless podman; health is checked by podman ps locally on tony-dell."
    verification:
      - "Test container on tony_dell: ssh tony-dell podman ps | grep redis"
      - "Test connection: ssh tony-dell podman exec redis redis-cli ping"
      - "Test memory: ssh tony-dell podman exec redis redis-cli info memory"
      - "Check logs: ssh tony-dell podman logs redis --tail 20"
    recovery_actions:
      - "Restart container on tony_dell: ssh tony-dell podman restart redis"
      - "Check data volume: ssh tony-dell podman inspect redis | grep -A 10 Mounts"
      - "Verify networking on tony_dell: ssh tony-dell podman network inspect bridge"
  - id: postgres
    name: Postgres
    type: container
    container: chaba-postgres-16
    host: tony_dell
    expected_state: running
    timeout: 5
    category: datastore
    profiles:
      - home
      - mobile
    note: "Postgres runs in a rootless Podman container on tony-dell; health is checked locally."
    verification:
      - "Test container on tony_dell: podman ps | grep chaba-postgres-16"
      - "Test port: nc -zv postgre 5432"
      - "Check logs: podman logs chaba-postgres-16 --tail 20"
    recovery_actions:
      - "Restart container on tony_dell: podman restart chaba-postgres-16"
      - "Check data volume: /home/tony/.config/containers/postgres/data"
      - "If tony_dell cannot be recovered, run the failover script: /home/tony/.local/bin/yomi-failover-to-omen.sh"
  - id: weaviate
    name: Weaviate
    type: http
    url: "{profile}/api/weaviate/v1/nodes"
    expected_status: 200
    timeout: 5
    category: datastore
    profiles:
      - home
      - mobile
    note: Weaviate container runs on tony_dell:8084; Caddy on tony_dell proxies /api/weaviate/
      to 100.68.142.13:8084
    recovery_actions:
      - "Start container: ssh tony-dell podman start weaviate"
      - "Check container: ssh tony-dell podman ps | grep weaviate"
      - "Check logs: ssh tony-dell podman logs weaviate --tail 20"
    host: tony_dell
  - id: mddb-api
    name: MDDB API
    type: http
    url: http://idc03:11023/health
    expected_status: 200
    timeout: 5
    category: datastore
    profiles:
      - home
      - mobile
    note: MDDB leader on idc03 (tailnet-only). Direct port access for health check, bypasses Caddy routing
    host: idc03
  - id: mddb-mcp
    name: MDDB MCP Server
    type: http
    url: http://idc03:9000/mcp
    expected_status: 401
    timeout: 5
    category: datastore
    profiles:
      - home
      - mobile
    note: MCP endpoint for AI agent integration; GET /mcp returns 400, only POST is
      valid, so 400 is the healthy response
    recovery_actions:
      - "Check MDDB container: ssh idc03 podman ps | grep mddb"
      - "Restart MDDB: ssh idc03 systemctl --user restart mddb.service"
      - "Check MDDB logs: ssh idc03 journalctl --user -u mddb.service --since '-1h'"
      - "Verify MCP endpoint: curl -s http://idc03:9000/mcp"
      - "Check MCP config: cat ~/.config/devin/mcp_config.json | grep mddb"
    host: idc03
  - id: mddb-stats
    name: MDDB Stats Endpoint
    type: http
    url: http://idc03:11023/v1/stats
    expected_status: 200
    timeout: 60
    severity: warning
    category: datastore
    profiles:
      - home
      - mobile
    note: MDDB leader on idc03 (tailnet-only). Direct port access, bypasses Caddy routing.
      /v1/stats walks the full catalog and routinely takes ~30s — timeout 60 is required.
      severity warning (2026-10-13) — the walk is O(full DB) over an 8.2GB mddb.db;
      cold cache or backup-window I/O (mddb-backup.timer 02:30 integrity check)
      pushes it past any sane timeout, and while it runs it starves /metrics +
      /v1/vector-stats. A slow stats endpoint is a warn, not an outage — liveness
      stays fatal via mddb-api /health. Root fix tracked in card mddb-stats-o1-counts.
    recovery_actions:
      - "Check MDDB service: ssh idc03 systemctl --user status mddb.service"
      - "Restart MDDB: ssh idc03 systemctl --user restart mddb.service"
      - "Check MDDB logs: ssh idc03 journalctl --user -u mddb.service --since '-1h'"
      - "Verify port 11023: curl -s http://idc03:11023/v1/stats"
    host: idc03
  - id: mddb-vector-stats
    name: MDDB Vector Stats Endpoint
    type: http
    url: http://idc03:11023/v1/vector-stats
    expected_status: 200
    timeout: 5
    severity: warning
    category: datastore
    profiles:
      - home
      - mobile
    note: MDDB leader on idc03 (tailnet-only). Direct port access, bypasses Caddy routing.
      severity warning (2026-10-13) — same contention class as mddb-stats; under
      full-DB walks / backup integrity-check I/O it degrades (540ms observed);
      liveness stays fatal via mddb-api /health.
    recovery_actions:
      - "Check MDDB service: ssh idc03 systemctl --user status mddb.service"
      - "Restart MDDB: ssh idc03 systemctl --user restart mddb.service"
      - "Check MDDB logs: ssh idc03 journalctl --user -u mddb.service --since '-1h'"
      - "Verify port 11023: curl -s http://idc03:11023/v1/vector-stats"
    host: idc03
  - id: mddb-metrics
    name: MDDB Metrics Endpoint
    type: http
    url: http://idc03:11023/metrics
    expected_status: 200
    timeout: 5
    severity: warning
    category: datastore
    profiles:
      - home
      - mobile
    note: MDDB leader on idc03 (tailnet-only). Direct port access, bypasses Caddy routing.
      severity warning (2026-10-13) — ~2.5s warm already; during a concurrent
      /v1/stats walk or the 02:30 backup integrity check it exceeds 5s+10s —
      timed out in the 2026-10-13 overnight health_snapshot. Liveness stays
      fatal via mddb-api /health.
    recovery_actions:
      - "Check MDDB service: ssh idc03 systemctl --user status mddb.service"
      - "Restart MDDB: ssh idc03 systemctl --user restart mddb.service"
      - "Check MDDB logs: ssh idc03 journalctl --user -u mddb.service --since '-1h'"
      - "Verify port 11023: curl -s http://idc03:11023/metrics"
    host: idc03
  - id: mddb-container
    name: MDDB Service
    type: systemd
    service: mddb.service
    expected_state: active
    timeout: 5
    category: datastore
    profiles:
      - home
      - mobile
    note: "MDDB leader runs as a podman quadlet (mddb.service, user unit) on idc03.
      con01 runs mddb-follower.service (read-only follower :11123) — the
      warm-DR promote target since 2026-10-22. Retired idc01's masked
      old-leader unit must never be unmasked (host offline anyway)."
    recovery_actions:
      - "Check service: ssh idc03 systemctl --user status mddb.service"
      - "Restart: ssh idc03 systemctl --user restart mddb.service"
      - "Check logs: ssh idc03 journalctl --user -u mddb.service --since '-1h'"
      - "Quadlet file: ~/.config/containers/systemd/mddb.container on idc03"
    host: idc03
  - id: mddb-follower-con01
    name: MDDB Follower (con01 warm-DR)
    type: http
    url: http://con01:11123/v1/health
    expected_status: 200
    timeout: 10
    category: datastore
    profiles:
      - home
      - mobile
    note: "Read-only replication follower on con01 (mddb-follower.service,
      100.72.146.39:11123 http / :11124 gRPC, leader idc03:11024) — the warm-DR
      replica; promote-first path if idc03 dies. Replaces the retired idc01
      follower 2026-10-22 (OPS-0763); initial sync flag healthy:false while
      current_lsn catches up — check /v1/replication/status."
    recovery_actions:
      - "Check service: ssh con01 systemctl --user status mddb-follower.service"
      - "Check lag: curl -s http://con01:11123/v1/replication/status"
      - "Restart: ssh con01 systemctl --user restart mddb-follower.service"
      - "Logs: ssh con01 journalctl --user -u mddb-follower.service --since '-1h'"
    host: con01
  - id: ada-stt-con01
    name: Ada STT (audio.cpp Qwen3-ASR, con01)
    type: http
    url: http://con01:8914/health
    expected_status: 200
    timeout: 10
    category: datastore
    profiles:
      - home
      - mobile
    note: "Native service (ada-stt.service, ~/audio-cpp-eval) bound tailnet
      100.72.146.39:8914 — migrated off idc02 2026-10-22 (OPS-0763). Warm
      RTF ~0.5 on threads=4 (8 thrashes shared vCPU). Voice consumers point
      TG_WHISPER_URL/LINE_WHISPER_URL here; idc03 ~/audio-cpp is the
      loaded-host fallback. Transcribe probe: POST /v1/audio/transcriptions."
    recovery_actions:
      - "Check service: ssh con01 systemctl --user status ada-stt.service"
      - "Restart: ssh con01 systemctl --user restart ada-stt.service"
      - "Logs: ssh con01 journalctl --user -u ada-stt.service --since '-1h'"
      - "Rollback: re-enable ada-stt on idc02 + revert TG_WHISPER_URL envs"
    host: con01
  - id: gemini-ollama-proxy
    name: Gemini-Ollama Embedding Proxy
    type: systemd
    service: gemini-ollama-proxy.service
    expected_state: active
    timeout: 5
    category: datastore
    profiles:
      - home
      - mobile
    note: "Gemini-to-Ollama embedding proxy on idc03, loopback-only
      (127.0.0.1:11435) — only mddb needs it. MDDB embeds through this;
      ollama.service on idc03 is the fallback. (idc01 twin is masked warm-standby.)"
    verification:
      - "Check service: ssh idc03 systemctl --user status gemini-ollama-proxy.service"
      - "Test health: ssh idc03 curl -s http://127.0.0.1:11435/health"
      - "Check logs: ssh idc03 journalctl --user -u gemini-ollama-proxy.service --since '-1h'"
    recovery_actions:
      - "Restart: ssh idc03 systemctl --user restart gemini-ollama-proxy.service"
      - "Verify GEMINI_API_KEY podman secret: ssh idc03 podman secret ls"
    host: idc03
  - id: litellm
    name: LiteLLM LLM Gateway
    type: systemd
    service: litellm.service
    expected_state: active
    timeout: 5
    category: datastore
    profiles:
      - home
      - mobile
    note: "Single LLM API point on idc03 — tailnet-only bind
      (100.102.134.91:4000). Virtual keys + Postgres spend ledger
      (litellm-db sidecar, loopback-only). Routing table SSOT:
      docs/ssot/infrastructure/ssot.llm-gateway.yml"
    verification:
      - "Check service: ssh idc03 systemctl --user status litellm.service litellm-db.service"
      - "Test health: curl -s http://100.102.134.91:4000/health/liveliness"
      - "Check logs: ssh idc03 journalctl --user -u litellm.service --since '-1h'"
    recovery_actions:
      - "Restart: ssh idc03 systemctl --user restart litellm.service"
      - "OR key rotation also restarts this (rotate-or-key.sh)"
    host: idc03
