  - 'Verify port 11023 is accessible: curl -s http://tony-dell:11023/v1/vector-stats'
  host: tony_dell
- id: mddb-metrics
  name: MDDB Metrics Endpoint
  type: http
  url: http://tony-dell:11023/metrics
  expected_status: 200
  timeout: 5
  category: datastore
  profiles:
  - home
  - mobile
  note: Direct port access for metrics endpoint, bypasses Caddy routing
  recovery_actions:
  - 'Check MDDB container: docker ps | grep mddb'
  - 'Restart MDDB: cd /home/tony/CascadeProjects/chaba-kbman/stacks/web/mddb && docker
    compose restart mddb'
  - 'Check MDDB logs: cd /home/tony/CascadeProjects/chaba-kbman/stacks/web/mddb &&
    docker compose logs mddb'
  - 'Verify port 11023 is accessible: curl -s http://tony-dell:11023/metrics'
  host: tony_dell
- id: mddb-container
  name: MDDB Container
  type: container
  container: mddb
  expected_state: running
  timeout: 5
  category: datastore
  profiles:
  - home
  - mobile
  note: 'MDDB container runs on tony-dell; health is checked by podman ps locally.'
  recovery_actions:
  - 'Check container status: docker ps -a | grep mddb'
  - 'Start container: cd /home/tony/CascadeProjects/chaba-kbman/stacks/web/mddb &&
    docker compose up -d mddb'
  - 'Check container logs: cd /home/tony/CascadeProjects/chaba-kbman/stacks/web/mddb
    && docker compose logs mddb'
  - 'Verify docker compose config: cd /home/tony/CascadeProjects/chaba-kbman/stacks/web/mddb
    && docker compose config'
  host: tony_dell
- id: gemini-ollama-proxy
  name: Gemini-Ollama Embedding Proxy
  type: http
  url: http://tony-dell:11435/health
  expected_status: 200
  timeout: 10
  category: datastore
  profiles:
  - home
  - mobile
  note: Gemini-to-Ollama embedding proxy on tony-dell. MDDB uses this for embeddings.
    Migrated from tony-omen docker compose.
  verification:
  - 'Check podman: ssh tony-dell podman ps | grep gemini-ollama-proxy'
  - 'Test health: curl -s http://tony-dell:11435/health'
  - 'Check logs: ssh tony-dell podman logs gemini-ollama-proxy --tail 20'
  recovery_actions:
  - 'Restart: ssh tony-dell systemctl --user restart gemini-ollama-proxy'
  - 'Verify GEMINI_API_KEY podman secret: ssh tony-dell podman secret ls'
  host: tony_dell
