title: Chaba Health Checks (Home Profile)
subtitle: Service health checks for the home network profile
icon: heart-pulse

services:
- id: caddy
  name: Caddy
  type: http
  url: '{profile}/apps/map/'
  expected_status: 200
  timeout: 5
  category: web
  profiles:
  - home
  - mobile
- id: bserver
  name: BServer
  type: http
  url: '{profile}/'
  expected_status: 200
  timeout: 5
  category: web
  profiles:
  - home
  - mobile
- id: raceman-web
  name: Raceman Web
  type: http
  url: http://tony-dell:8083/apps/raceman/
  expected_status: 200
  timeout: 5
  category: web
  profiles:
  - home
- id: helm
  name: Helm Dashboard
  type: http
  url: http://tony-omen:8080/apps/helm
  expected_status: 200
  timeout: 5
  category: web
  profiles:
  - home
  - mobile
  verification:
  - 'Check podman container: ssh tony-dell podman ps | grep helm'
  - 'Check podman logs: ssh tony-dell podman logs helm --tail 20'
  - 'Test direct podman container: curl -s http://tony-dell:3003/apps/helm/'
  - 'Test Caddy proxy: curl -s http://tony-omen:8080/apps/helm/'
  recovery_actions:
  - 'Restart service: ssh tony-dell systemctl --user restart helm'
  - 'Rebuild: ssh tony-dell "cd /home/tony/CascadeProjects/chaba-tony-dell/tony-dell/chaba-funnel && ./deploy.sh"'
  - Check Caddy proxy configuration in stacks/web/Caddyfile
  - 'Verify env: ssh tony-dell podman exec helm env | grep LLM'
- id: raceman-php
  name: Raceman PHP
  type: container
  container: raceman-php
  host: tony_dell
  expected_state: running
  timeout: 5
  category: web
  profiles:
  - home
  note: 'Migrated to tony_dell rootless podman.'
- id: sensor-reader
  name: Sensor Reader
  type: http
  url: http://tony-omen:8001/health
  expected_status: 200
  timeout: 5
  category: api
  profiles:
  - home
  - mobile
  verification:
  - 'Test container: docker ps | grep sensor-reader'
  - 'Test direct container: curl -s http://tony-omen:8001/health'
  - 'Check container logs: docker logs sensor-reader --tail 20'
  recovery_actions:
  - 'Restart container: docker compose -f stacks/web/docker-compose.yml restart sensor-reader'
  - 'Check Caddy /api/* proxy to tony-dell:8000'
- id: status-data-api
  name: Status Data API
  type: http
  url: '{profile}/api/health'
  expected_status: 200
  timeout: 5
  category: api
  profiles:
  - home
  - mobile
  verification:
  - 'Test service: ssh tony-dell systemctl --user status status-data-api'
  - 'Test direct container: curl -s http://tony-dell:8000/health'
  - 'Test Caddy proxy: curl -s {profile}/api/health'
  - 'Check podman logs: ssh tony-dell podman logs status-data-api --tail 20'
  recovery_actions:
  - 'Restart service: ssh tony-dell systemctl --user restart status-data-api'
  - 'Verify status-data-api can reach http://tony-omen:8001/health'
  - Verify Caddy proxy configuration in stacks/web/Caddyfile
- id: rview-api
  name: RView API
  type: http
  url: '{profile}/apps/rview/api/state.php?action=list'
  expected_status: 200
  timeout: 5
  category: api
  profiles:
  - home
  - mobile
  host: tony_dell
  verification:
  - 'Test direct: curl -s http://tony-dell:3007/state.php?action=list'
  - 'Test Caddy proxy: curl -s {profile}/apps/rview/api/state.php?action=list'
  - 'Check podman container: ssh tony-dell podman ps | grep rview-api'
  - 'Check podman logs: ssh tony-dell podman logs rview-api --tail 20'
  recovery_actions:
  - 'Restart container: ssh tony-dell systemctl --user restart rview-api'
  - 'Check state directory: ssh tony-dell ls -la /home/tony/.local/share/rview-api'
  - Verify Caddy proxy configuration in stacks/web/Caddyfile
- id: gemini-live
  name: Gemini Live API
  type: http
  url: '{profile}/api/gemini-live/health'
  expected_status: 200
  timeout: 5
  category: api
  profiles:
  - home
  - mobile
  host: tony_dell
  verification:
  - 'Test direct: curl -s http://tony-dell:3008/health'
  - 'Test Caddy proxy: curl -s {profile}/api/gemini-live/health'
  - 'Check podman container: ssh tony-dell podman ps | grep gemini-live'
  - 'Check podman logs: ssh tony-dell podman logs gemini-live --tail 20'
  - 'Verify GEMINI_API_KEY env: ssh tony-dell podman exec gemini-live env | grep GEMINI_API_KEY'
  recovery_actions:
  - 'Restart container: ssh tony-dell systemctl --user restart gemini-live'
  - 'Check env file: ssh tony-dell cat /home/tony/.config/containers/systemd/gemini-live.env'
  - 'Rebuild image: ssh tony-dell "cd /home/tony/CascadeProjects/chaba && bash stacks/tony-dell/gemini-live/build.sh"'
  - Verify Caddy proxy configuration in stacks/web/Caddyfile
- id: yomi-api
  name: Yomi API
  type: http
  url: '{profile}/api/yomi/health'
  expected_status: 200
  timeout: 5
  category: api
  profiles:
  - home
  - mobile
  recommendation: If yomi-api is down and tony-dell cannot be recovered, run /home/tony/.local/bin/yomi-failover-to-omen.sh
    on tony-omen. See docs/ssot/infrastructure/ssot.yomi-failover.yml.
  verification:
  - 'Test direct Yomi API on tony-dell: curl -s http://tony-dell:3000/api/yomi/health'
  - 'Test Caddy proxy on tony-omen: curl -s {profile}/api/yomi/health'
  - 'Test chat page: curl -s {profile}/apps/yomi/chat.html?chat=test'
- id: yomi-summarization
  name: Yomi Summarization
  type: http
  url: '{profile}/api/yomi/summarization-status'
  expected_status: 200
  timeout: 5
  category: api
  profiles:
  - home
  - mobile
  verification:
  - 'Test API endpoint: curl -s {profile}/api/yomi/summarization-status'
  - 'Test chat page with valid chat ID: curl -s {profile}/apps/yomi/chat.html?chat=valid_chat_id'
  - Verify API returns JSON response with status information
  - Check browser console for API errors when loading chat page
- id: yomi-rate-limiter
  name: Yomi Rate Limiter
  type: http
  url: '{profile}/api/yomi/rate-limiter-status'
  expected_status: 200
  timeout: 5
  category: api
  profiles:
  - home
  - mobile
- id: yomi-activity-status
  name: Yomi Activity Status
  type: http
  url: '{profile}/api/yomi/activity-status'
  expected_status: 200
  timeout: 5
  category: api
  profiles:
  - home
  - mobile
- id: playlived-dell
  name: Playlived (tony-dell)
  type: http
  url: http://tony-dell:9230/sessions
  expected_status: 200
  timeout: 5
  category: api
  profiles:
  - home
  verification:
  - 'Test sessions: curl -s http://tony-dell:9230/sessions'
  - 'Check pinned package: cat /home/tony/.local/playlive/package.json | grep ''"playwright"'''
  - 'Check browsers: npx playwright install --dry-run'
  - 'Check service: ssh tony-dell systemctl --user status playlived.service'
  recovery_actions:
  - 'Reinstall exact version: cd /home/tony/.local/playlive && npm ci && npx playwright install chromium'
  - 'Restart service: ssh tony-dell systemctl --user restart playlived.service'
  - 'Fix port: ssh tony-dell ss -tulpn | grep 9230 && kill conflicting process'
- id: playlived-omen
  name: Playlived (tony-omen)
  type: systemd
  service: playlived.service
  expected_state: active
  timeout: 5
  category: system
  profiles:
  - home
  - mobile
  verification:
  - 'Check service: systemctl --user status playlived.service'
  - 'Check logs: journalctl --user -u playlived.service -n 20'
  recovery_actions:
  - 'Restart service: systemctl --user restart playlived.service'
- id: trade-api
  name: Trade API
  type: http
  url: http://tony-dell:9002/api/health
  expected_status: 200
  timeout: 5
  category: api
  profiles:
  - home
  - mobile
  host: tony_dell
  verification:
  - 'Test container: ssh tony-dell podman ps | grep trade-api'
  - 'Test health endpoint: curl -s http://tony-dell:9002/api/health'
  - 'Test root endpoint: curl -s http://tony-dell:9002/'
  - 'Check container logs: ssh tony-dell podman logs trade-api'
  recovery_actions:
  - 'Restart container: ssh tony-dell podman restart trade-api'
  - 'Check container networking: ssh tony-dell podman inspect trade-api'
  - 'Verify port mapping: ssh tony-dell podman port trade-api'
- id: trade-automation
  name: Trade Automation
  type: container
  container: trade-automation
  expected_state: running
  timeout: 5
  category: automation
  profiles:
  - home
  note: Background trade automation worker (same image as trade-api, no exposed host port)
  verification:
  - 'Check container: docker ps | grep trade-automation'
  - 'Check container logs: docker logs trade-automation'
  recovery_actions:
  - 'Restart container: docker restart trade-automation'
  - 'Check status: docker inspect trade-automation'
- id: redis
  name: Redis
  disabled: true
  type: container
  container: redis
  host: tony_dell
  expected_state: running
  timeout: 5
  category: datastore
  profiles:
  - home
  - mobile
  note: 'Migrated to tony_dell rootless podman. Disabled in mcp-health because mcp-health cannot run remote podman checks. Health is verified manually via ssh tony-dell podman ps and indirectly through yomi-api/postgres.'
  verification:
  - 'Test container on tony_dell: ssh tony-dell podman ps | grep redis'
  - 'Test connection: ssh tony-dell podman exec redis redis-cli ping'
  - 'Test memory: ssh tony-dell podman exec redis redis-cli info memory'
  - 'Check logs: ssh tony-dell podman logs redis --tail 20'
  recovery_actions:
  - 'Restart container on tony_dell: ssh tony-dell podman restart redis'
  - 'Check data volume: ssh tony-dell podman inspect redis | grep -A 10 Mounts'
  - 'Verify networking on tony_dell: ssh tony-dell podman network inspect bridge'
- id: postgres
  name: Postgres
  type: container
  container: chaba-postgres-16
  host: tony_dell
  expected_state: running
  timeout: 5
  category: datastore
  profiles:
  - home
  - mobile
  disabled: true
  note: Postgres now runs in a rootless Podman container on tony_dell. Health is best inferred from yomi-api and the pg tailscale
    endpoint. If both Postgres and Yomi are down on tony_dell, use the failover plan in docs/ssot/infrastructure/ssot.yomi-failover.yml.
  verification:
  - 'Test container on tony_dell: podman ps | grep chaba-postgres-16'
  - 'Test port: nc -zv postgre 5432'
  - 'Check logs: podman logs chaba-postgres-16 --tail 20'
  recovery_actions:
  - 'Restart container on tony_dell: podman restart chaba-postgres-16'
  - 'Check data volume: /home/tony/.config/containers/postgres/data'
  - 'If tony_dell cannot be recovered, run the failover script: /home/tony/.local/bin/yomi-failover-to-omen.sh'
- id: weaviate
  name: Weaviate
  type: http
  url: '{profile}/api/weaviate/v1/nodes'
  expected_status: 200
  timeout: 5
  category: datastore
  profiles:
