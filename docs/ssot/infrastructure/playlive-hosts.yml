---
title: PlayLive Host Registry
subtitle: Chrome CDP host registry for the PlayLive MCP client
# Playlive Chrome CDP host registry.
# This file is the SSOT for which Chrome CDP endpoints the local playlive MCP
# client can attach to.  The playlive-hosts-loader.py wrapper reads it, sets
# PLAYLIVE_HOSTS as JSON, and then execs playlive-server.py.
playlive_url: http://tony-dell.taila0626a.ts.net:9230
hosts:
  tony-dell:
    cdp: http://127.0.0.1:9222
    description: Local headless Chrome CDP on tony-dell (primary target)
    available: true
  tony-omen:
    cdp: http://127.0.0.1:9228
    description: Chrome CDP on tony-omen, forwarded to tony-dell via 127.0.0.1:9228 (SSH tunnel)
    available: true
  kk-macbook:
    cdp: http://127.0.0.1:9229
    description: Chrome CDP on kk-macbook, forwarded to tony-dell via 127.0.0.1:9229 (SSH tunnel to ::1:9222)
    available: true

per_host:
  tony_dell:
    playlive_url: http://127.0.0.1:9230
  tony_omen:
    playlive_url: http://tony-dell.taila0626a.ts.net:9230

failover:
  tony_dell:
    playlive_url: http://tony-omen.taila0626a.ts.net:9230
  tony_omen:
    playlive_url: http://127.0.0.1:9230

self_heal:
  enabled: true
  retry_delay: 5
  commands:
    tony_dell:
      - systemctl
      - --user
      - restart
      - playlived.service
    tony_omen:
      - systemctl
      - --user
      - restart
      - playlived.service

session_selection:
  default:
    daemon: tony-dell
    host: tony_dell
    session_type: playwright
    headless: true
    playlive_url: http://127.0.0.1:9230
    note: Fastest default; no remote Chrome required.
  visual_debug:
    daemon: tony-dell
    host: tony_dell
    session_type: chrome_live
    playlive_url: http://127.0.0.1:9230
    remote_url: http://127.0.0.1:9222
    note: Use when a visible browser window or live screenshot is needed.
  macos:
    daemon: kk-macbook
    host: macbook
    session_type: playlive_macbook
    playlive_url: http://tony-dell.taila0626a.ts.net:9230
    remote_url: http://127.0.0.1:9229
    note: Use for Safari/WebKit/macOS-specific verification.
  fallback:
    daemon: tony-omen
    host: tony_omen
    session_type: playwright
    headless: true
    playlive_url: http://tony-omen.taila0626a.ts.net:9230
    note: Use when tony-dell daemon is unavailable after self-heal.

focus:
  enabled: true
  inbox_dir: /home/tony/CascadeProjects/chaba-tony-dell/docs/ssot/focus-inbox
