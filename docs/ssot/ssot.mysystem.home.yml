config:
  version: 2
  last_updated: 2026-08-11
  current_network: 192.168.1.0/24 (home WiFi)
  current_profile: home
  maintainer: tony
  partitions:
    - label: ubuntu-working (primary)
      device: /dev/nvme0n1p6
      mount: /
      size: 100G
      usage: 91% (88G/100G)
      boot: true
      boot_name: ubuntu-working
    - label: ubuntu-home
      device: /dev/nvme0n1p3
      mount: /home
      size: 100G
      usage: 71% (62G/92G)
      boot: false
    - label: ubuntu-data
      device: /dev/nvme0n1p7
      mount: /data
      size: 300G
      usage: 59% (172G/295G)
      boot: false
    - label: ubuntu-000
      device: /dev/nvme0n1p5
      mount: (not mounted)
      size: 64.9G
      usage: minimal
      boot: true
      boot_name: Ubuntu 26.04 LTS
      purpose: partition job/testing
  related_files:
    - ssot.mysystem.mobile.yml (mobile profile)
    - ssot.services.yml
    - ssot.apps.yml
    - infrastructure/ssot.health.home.yml (home health checks)
    - infrastructure/ssot.health.mobile.yml (mobile health checks)
