context:
  agent:
    - "tony-omen: dev/GPU host. tony-dell: HA + apps host. idc03: primary public VPS + Ada/memory host (mddb leader, ada-pi-pwa, ada-ha-*, obsidian-vault, caddy public edge — migrated 2026-10-05/06; 4vCPU/16G/290G). idc01: warm-DR VPS (mddb-follower :11123, standby edge, masked former-prod units; specs: docs/kb/hardware-idc01-specs.md, public 157.85.110.99). mn01: mn-home node — Ada standby + legacy Caddy alias to the VPS edge + devin-dispatch lane (cap ~2)."
    - "All HA URLs are Tailscale HTTPS; no LAN/plain-HTTP access to tony-ha."
    - "Deploys to production (michael-ha, tony-ha, idc03/idc01 public) require explicit same-session approval."
  guest:
    - "This is Tony's home assistant. Lights and media are controllable; doors and gates are not."
    - "Weather and house status are visible on the dashboard."
