  - title: Hardware Specifications
    icon: 🔧
    layout: list
    items:
      - label: tony-omen CPU
        text: Intel Core i7-9750H (6 cores/12 threads), 2.60GHz hardware max, 800MHz min
        tags: [hardware, cpu, performance]
      - label: tony-omen CPU operational cap
        text: Software capped to 2.20GHz via cpufreq-limit.service (cpupower -u 2.20GHz, governor performance)
        tags: [hardware, cpu, performance, power]
        status: active
      - label: tony-omen GPU
        text: NVIDIA GeForce GTX 1650 (4GB VRAM)
        tags: [hardware, gpu, performance]
      - label: tony-omen Memory
        text: 32GB RAM
        tags: [hardware, memory]
      - label: tony-omen CPU and Thermal Monitoring
        text: Monitored via sensor-reader (port 8001), cpufreq-limit.service, and Netdata; checks load, temperature, throttling, and frequency cap.
        tags: [monitoring, cpu, gpu, thermal, health-check]
        status: active

  - title: Power Management
    icon: 🔋
    layout: list
    items:
      - label: Screen Timeout
        text: Screen turns off after 5 minutes of idle time; long-running processes continue running (no system suspend)
        status: active
        tags: [power, automation, screen-timeout]
      - label: Timeout Value
        text: "300 seconds (5 minutes) - DPMS Off: 300s"
      - label: Service
        text: systemd --user screen-timeout-daemon.service on tony-dell and tony-omen
      - label: Daemon Script
        text: /home/tony/screen-timeout-daemon.sh
      - label: Log Location
        text: /home/tony/.local/share/screen-timeout-daemon.log
      - label: Current Settings (tony-omen)
        text: "Screen timeout: 600s (X screensaver, ignored), DPMS: Enabled, Off: 300s"
      - label: Current Settings (tony-dell)
        text: "Screen timeout: 600s (X screensaver, ignored), DPMS: Enabled, Off: 300s"
      - label: Implementation Date
        text: 2026-09-07

  - title: Network
    icon: 🌐
    layout: list
    items:
      - label: Local Network
        text: 192.168.1.0/24 subnet with .local hostname resolution
      - label: tony-omen
        text: Primary workstation; tailnet tony-omen (100.75.102.88). Current LAN/WiFi IP is recorded in the health snapshot.
      - label: tony-dell
        text: Secondary workstation; tailnet tony-dell (100.68.142.13). Current LAN/WiFi IP is recorded in the health snapshot.

  - title: Omen-Dell Clipboard Sync
    icon: clipboard
    layout: list
    items:
      - label: Independent pollers
        text: clip-sync-dell.service on Omen and clip-sync-omen.service on Dell poll clipboard content over SSH/X11. They remain independent of the retired Barrier KVM.
      - label: Image clipboard history
        text: The pollers were added to mirror image/* payloads that Barrier 2.4.0 did not relay. See docs/ssot/jobs/infrastructure/2026-10-04-barrier-image-clipboard.yml for the historical implementation record.

  - title: Physical Display (tony-dell)
    icon: 🖥️
    layout: list
    items:
      - label: Monitor output
        text: DP-2 on the Intel iGPU (PCI 0:2:0, /dev/dri/card1-DP-2)
      - label: Black screen cause
        text: Xorg autoconfig picks the AMD card (PCI 1:0:0, /dev/dri/card0) by default, which has no monitor connected
      - label: Xorg seat service
        text: root Xorg :1 vt7 via /etc/systemd/system/xorg-seat.service; repo copy in systemd/xorg-seat.service
      - label: Xorg iGPU config
        text: /etc/X11/xorg.conf.d/20-xorg-seat.conf forces the Intel iGPU; repo copy in systemd/xorg-seat.conf
      - label: Install / update
        text: sudo install -m 0644 systemd/xorg-seat.conf /etc/X11/xorg.conf.d/20-xorg-seat.conf && sudo install -m 0644 systemd/xorg-seat.service /etc/systemd/system/xorg-seat.service && sudo systemctl daemon-reload && sudo systemctl restart xorg-seat.service
      - label: LXQt desktop session
        text: User unit lxqt-seat.service runs startlxqt on DISPLAY=:1; it needs XAUTHORITY=/run/user/1000/gdm/Xauthority to connect to the root Xorg; repo copy in systemd/lxqt-seat.service
      - label: Install LXQt user unit
        text: cp systemd/lxqt-seat.service ~/.config/systemd/user/lxqt-seat.service && systemctl --user daemon-reload && systemctl --user enable --now lxqt-seat.service
      - label: Physical-seat VT pin
        text: barrier-pin-vt.timer retains its legacy name but only keeps the Xorg/LXQt physical seat on vt7; it does not run Barrier KVM.
      - label: Check
        text: DISPLAY=:1 XAUTHORITY=/run/user/1000/gdm/Xauthority xrandr should show DP-2 connected and primary, and systemctl --user is-active xfce-seat barrier-pin-vt.timer should be active

  - title: Web (tony-dell)
    icon: 🌐
    layout: list
    items:
      - label: Public HTTPS endpoint
        text: https://tony-dell.taila0626a.ts.net/ (Tailscale terminates TLS and proxies to local Caddy)
      - label: Tailscale serve
        text: tailscaled owns 100.68.142.13:8080 and forwards HTTP to the Caddy backend
      - label: Tailscale serve unit
        text: /etc/systemd/system/tailscale-serve-8080.service; repo copy in systemd/tailscale-serve-8080.service
      - label: Install tailscale serve unit
        text: sudo install -m 0644 systemd/tailscale-serve-8080.service /etc/systemd/system/tailscale-serve-8080.service && sudo systemctl daemon-reload && sudo systemctl enable --now tailscale-serve-8080.service
      - label: Caddy backend
        text: rootless podman container named web; Caddy serves http://127.0.0.1:8080 only (bind 127.0.0.1, auto_https off)
      - label: Caddyfile
        text: /home/tony/CascadeProjects/chaba-tony-dell/stacks/web/Caddyfile (worktree copy on tony-dell)
      - label: Critical Caddyfile directives
        text: "{ auto_https off } globally and http://127.0.0.1:8080 { bind 127.0.0.1 ... } to avoid colliding with tailscaled"
      - label: Restart Caddy
        text: /usr/bin/docker restart web
      - label: Port conflict warning
        text: Do not let Caddy bind 0.0.0.0:8080 or tailscale will not be able to serve; do not point tailscale-serve-8080 to 127.0.0.1:8082 (that is tailscale-connections-server.py, not Caddy)
      - label: Check
        text: "curl -s -o /dev/null -w %{http_code} https://tony-dell.taila0626a.ts.net/apps/tony-live/ should return 200"

