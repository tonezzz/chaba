title: SSOT Index
subtitle: Master index of all SSOT files — purpose, location, and key content
icon: 🗂️

ideas:
  - Single entry point for orienting to the SSOT system
  - Use ssot-search skill to search across all SSOT content (YAML only) or all documentation (MCP docs server)
  - Use ssot-validate skill to check all files for errors
  - See docs/kb/documentation-search.md for dual search methods guide
  - Files without subtitles are config-type (flexible structure, no title required)
  - SSOT summaries in docs/ssot-summaries/ provide searchable overviews for MCP docs server

