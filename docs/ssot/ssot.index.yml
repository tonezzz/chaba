title: SSOT Index
subtitle: Master index of all SSOT files — purpose, location, and key content
icon: 🗂️

ideas:
  - Single entry point for orienting to the SSOT system
  - Use ssot-search skill to search across all SSOT content
  - Use ssot-validate skill to check all files for errors
  - Files without subtitles are config-type (flexible structure, no title required)

sections:
  - title: Core / Cross-Project
    icon: 🌐
    layout: list
    items:
      - label: ssot.index.yml
        text: This file. Master index of all SSOT files.
        path: docs/ssot/ssot.index.yml

      - label: ssot.focus.yml
        text: Strategic focus areas — shared vs per-branch, active/pending/completed with dependency tracking and history
        path: docs/ssot/ssot.focus.yml

      - label: ssot.improvements.yml
        text: Pending system improvements with priority, effort, dependencies, and impact scoring. Active items only.
        path: docs/ssot/ssot.improvements.yml

      - label: ssot.improvements.archive.yml
        text: Completed improvements, archived from ssot.improvements.yml to reduce noise
        path: docs/ssot/ssot.improvements.archive.yml

      - label: ssot.validation-patterns.yml
        text: Validation rules, file-type classifications, and best practices for the SSOT system itself
        path: docs/ssot/ssot.validation-patterns.yml

      - label: ssot.token-optimization.yml
        text: MCP filter config, Headroom proxy, Devin usage patterns — strategies for reducing AI token costs
        path: docs/ssot/ssot.token-optimization.yml

  - title: System & Environment
    icon: 🖥️
    layout: list
    items:
      - label: ssot.mysystem.home.yml
        text: Home environment — workstations (tony-omen, tony-dell), network, services, health check URLs
        path: docs/ssot/ssot.mysystem.home.yml

      - label: ssot.mysystem.mobile.yml
        text: Mobile/remote environment — device setup and service access from outside home network
        path: docs/ssot/ssot.mysystem.mobile.yml

      - label: infrastructure/ssot.health.yml
        text: Health check endpoint definitions and recovery guidance for all services (location-agnostic)
        path: docs/ssot/infrastructure/ssot.health.yml

      - label: infrastructure/ssot.health.home.yml
        text: Home-specific health check config (uses tony-omen.local hostnames)
        path: docs/ssot/infrastructure/ssot.health.home.yml

      - label: infrastructure/ssot.health.mobile.yml
        text: Mobile/remote health check config (uses localhost or VPN paths)
        path: docs/ssot/infrastructure/ssot.health.mobile.yml

      - label: infrastructure/ssot.gpu.yml
        text: GPU policy, VRAM budget, queue implementation details, systemd services, and MCP tool reference
        path: docs/ssot/infrastructure/ssot.gpu.yml

      - label: infrastructure/ssot.services.yml
        text: Service configuration summary — llama-router, postgres, and container details
        path: docs/ssot/infrastructure/ssot.services.yml

  - title: UI & Frontend
    icon: 🎨
    layout: list
    items:
      - label: ssot.libs.yml
        text: Design tokens, shared components (nav, app cards), asset paths, build workflow, and constraints
        path: docs/ssot/ssot.libs.yml

      - label: ssot.ui.yml
        text: Stub — redirects to ssot.libs.yml for the authoritative UI reference
        path: docs/ssot/ssot.ui.yml

      - label: ssot.diagrams.yml
        text: Architecture and connection diagrams for Playlive, Barrier, and other multi-host setups
        path: docs/ssot/ssot.diagrams.yml

  - title: Applications
    icon: 📱
    layout: list
    items:
      - label: apps/ssot.apps.yml
        text: App registry — all app names and per-host deployment mappings
        path: docs/ssot/apps/ssot.apps.yml

      - label: apps/ssot.apps.playlive.yml
        text: Playlive browser automation — sessions, tools, caveats, screen management
        path: docs/ssot/apps/ssot.apps.playlive.yml

      - label: apps/ssot.apps.track4.yml
        text: Track4 course simulator — modularization, features, and testing
        path: docs/ssot/apps/ssot.apps.track4.yml

      - label: apps/ssot.apps.aihub.yml
        text: AI Hub — multi-AI browser automation via Playlive
        path: docs/ssot/apps/ssot.apps.aihub.yml

      - label: apps/ssot.apps.chaba.yml
        text: Main chaba application and infrastructure overview
        path: docs/ssot/apps/ssot.apps.chaba.yml

      - label: apps/ssot.apps.map3d.yml
        text: Map3D 3D map viewer — point clouds, Gaussian splats, tiltable overlays
        path: docs/ssot/apps/ssot.apps.map3d.yml

      - label: apps/ssot.apps.wind.yml
        text: Wind forecast page for Track4 course locations
        path: docs/ssot/apps/ssot.apps.wind.yml

      - label: apps/ssot.apps.cams.yml
        text: Camera monitor application
        path: docs/ssot/apps/ssot.apps.cams.yml

      - label: apps/ssot.apps.imagen2.yml / apps/ssot.apps.imagen3.yml
        text: Image generation service configurations
        path: docs/ssot/apps/ssot.apps.imagen2.yml

      - label: apps/ssot.apps.deka.yml
        text: Deka application
        path: docs/ssot/apps/ssot.apps.deka.yml

  - title: Tooling & Knowledge
    icon: 🔧
    layout: list
    items:
      - label: ssot.devin.tools.yml
        text: MCP server definitions and launch configuration for Devin/Windsurf (config-type)
        path: docs/ssot/ssot.devin.tools.yml

      - label: ssot.docs.yml
        text: Document processing tools, LLM infrastructure, and interesting libraries to evaluate
        path: docs/ssot/ssot.docs.yml

      - label: ssot.test.weaviate.yml
        text: Weaviate vector database — embedding service setup, test plans, and optimization notes
        path: docs/ssot/ssot.test.weaviate.yml

  - title: Templates
    icon: 📋
    layout: list
    items:
      - label: template.yml
        text: Canonical template for creating new SSOT files — copy and fill in
        path: docs/ssot/template.yml

config:
  version: 1
  last_updated: 2026-08-05
  maintainer: tony
  notes: Update this index when adding or renaming SSOT files
