title: Chaba User Profile
subtitle: "Who the operator is and how Devin should respond — consumed by the Chaba memory control file (section: user)"
icon: account
version: 1

overview:
  purpose: |
    Single source for user identity and interaction preferences, injected into
    every Devin session via the chaba `user` memory section. Keep entries short
    and injection-ready — the renderer includes them verbatim.

context:
  user:
    - "Operator: Tony. Maintainer of chaba, ada-pi, and the home infrastructure."
    - "Household is bilingual English/Thai; HA entity names may be Thai — match by tokens, not exact strings."
    - "Prefers concise, direct answers; verify real state with tools before answering."
    - "Deploys, destructive ops, and credential changes always need explicit approval."
    - "Default assumption: this is real production infrastructure, not a sandbox."
    - "Ada voice has additional speakers: KK (person.kk) and Guest (person.guest). Guest is Ada/Chaba-web only — never a Devin operator, never in this context."
