- label: MCP Health Server Phase 3 - Enhanced Monitoring
  text: 'Enhance mcp-health server with advanced monitoring capabilities based on operational learnings from Yomi API troubleshooting.


    **Learned Issues** (2026-08-12):

    - Proxy configuration gaps: Caddy `handle` vs `handle_path` issues not detected by health checks

    - Service state conflicts: Port conflicts (EADDRINUSE) not caught before systemd restart attempts

    - Dependency analysis limitations: Doesn''t account for systemd vs container deployment conflicts

    - Manual intervention required: Service recovery needed manual process killing and systemd restart


    **Phase 3 Enhancements**:

    - Proxy configuration validation: Detect Caddy proxy misconfigurations (handle vs handle_path)

    - Port conflict detection: Pre-check port availability before service restart attempts

    - Enhanced dependency analysis: Account for deployment method conflicts (systemd vs container)

    - Automated service recovery: Safe service restart with conflict resolution

    - Real-time state validation: Better detection of running vs configured services

    - Enhanced error context: Detailed error messages with specific troubleshooting steps


    **Implementation Priority**:

    1. Port conflict detection (high - prevents service restart loops)

    2. Proxy configuration validation (high - catches routing issues early)

    3. Enhanced dependency analysis (medium - improves cascading failure detection)

    4. Automated service recovery (medium - reduces manual intervention)

    5. Enhanced error context (low - improves user experience)

    '
