# Repeat-ask register — times Tony had to ask for the same thing again.
#
# Purpose: durable evidence of recurring asks. A request that dies in chat is a
# process failure; a request that has to be repeated N times is a counted,
# visible process failure. Agents MUST check this register when Tony flags a
# repeat ("how many times have I asked...", "why do I keep seeing...", "again?")
# and increment the entry with the date + card/bug reference.
#
# Entries: one per recurring topic. count = times Tony explicitly (re)asked.
# Keep history: each recurrence gets a dated line so the trend is visible.
version: 1
title: Repeat-ask register — counted recurrences of Tony's requests
description: "Durable count of times Tony had to re-ask the same thing.
  Agents increment on recurrence; see header comment for rules."
topics:
  - id: decision-buttons
    topic: "Tony-facing decisions surfaced without clickable option buttons"
    count: 4
    status: fixed-2026-10-15
    notes: "Emitters raised requests without options (merge-sweep, card-pipeline);
      board-api now auto-attaches [proceed,hold] to tony-facing asks; renderers
      patched for queue-fallback lie. Guard is API-level; YAML-bypass emitters
      still possible — invariant test pending."
    history:
      - {at: "2026-10-14", ask: "update cards with option buttons", cards: []}
      - {at: "2026-10-14", ask: "scan all cards and add decision requests", cards: []}
      - {at: "2026-10-15", ask: "Where is my decision buttons? cards without it", cards: [OPS-0688]}
      - {at: "2026-10-15", ask: "cards came back or never move — this cards with button", cards: [OPS-0688]}
  - id: recall-aid-suggestions
    topic: "Short recommendation/recall text on decision options so Tony can answer from memory"
