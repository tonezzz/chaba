title: Strategic Focus Management
subtitle: Shared vs per-branch strategic focus tracking
icon: 🎯

# Ideas and notes about strategic focus management
# This SSOT file serves as the central repository for strategic focus areas
ideas:
  - Maintain clear separation between shared infrastructure and branch-specific strategic work
  - Prevent context fragmentation by defining explicit strategic focus areas
  - Track focus history to understand resource allocation patterns across projects
  - Support dependency management between shared and branch-specific strategic initiatives
  - Enable strategic planning by identifying high-impact focus areas
  - Validate focus constraints to prevent over-commitment

# Validation rules for focus management
validation:
  max_active_shared_focus: 1
  max_active_branch_focus: 1
  require_priority: true
  require_tags: true
  allow_focus_overlap: false  # Prevent same focus in multiple categories

