  - title: Focus Management Rules
    icon: 📋
    layout: list
    items:
      - label: Single Active Focus Rule
        text: Maximum 1 shared + 1 per-branch strategic focus active at any time to prevent strategic fragmentation
        enforcement: validation
        tags: [rules, focus, constraints]
        
      - label: Strategic Priority Alignment
        text: High-priority strategic focuses take precedence over medium/low priorities across all branches
        enforcement: manual
        tags: [rules, priority, alignment]
        
      - label: Dependency First Principle
        text: Strategic dependencies must be addressed before dependent focuses can become active
        enforcement: validation
        tags: [rules, dependencies, sequencing]
        
      - label: Focus Duration Tracking
        text: Track time spent on each strategic focus to optimize resource allocation and identify bottlenecks
        enforcement: manual
        tags: [tracking, metrics, optimization]
        
      - label: Strategic Handoff Documentation
        text: When switching strategic focuses, document current state, blockers, and next steps clearly
        enforcement: manual
        tags: [rules, handoff, documentation]

