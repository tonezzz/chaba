      \ [{id, app, title, pid, focused}]}`.\n  Transport: macOS `lsappinfo`/`osascript`; X11 `xwininfo -root -tree`; Wayland\
      \ `swaymsg -t get_tree`.\n- `mcp_clipboard_image_get(host)` returns `{ok, content_base64, format, bytes, error}`.\n\
      \  Transport: macOS `pbpaste -Prefer rtf` image path/NSPasteboard read; Linux `xclip -selection clipboard -t image/png\
      \ -o`.\n- `mcp_a11y_tree(host, app)` returns a JSON UI element tree of a given app/window.\n  Transport: macOS AppleScript\
      \ accessibility APIs; optional for later.\n\nSecurity defaults:\n- Per-host `capture: true` opt-in; default false on\
      \ all hosts.\n- `mcp_screenshot` must support `region` cropping to avoid leaking full displays.\n- Hard cap on image\
      \ size (2 MB default, 4 MB hard) with downscale for oversize.\n- All capture calls logged with host, type, region, and\
      \ size.\n- clipboard-image is opt-in alongside clipboard text; never called automatically.\n\nImplementation order:\n\
      1. macbook first (pbcopy/pbpaste + screencapture are safest and well documented).\n2. Add Linux screenshot fallbacks\
      \ only after macOS path is stable.\n3. Do not add click/drag/keyboard automation; that stays in PlayLive.\n"
