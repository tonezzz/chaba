      x-goog-api-key: !secret flood_hub_api_key
    payload: '{"loop": {"vertices": [{"latitude": 14.3, "longitude": 100.4}, {"latitude": 14.3, "longitude": 101.1}, {"latitude": 15.1, "longitude": 101.1}, {"latitude": 15.1, "longitude": 100.4}]}, "pageSize": 20000, "includeNonQualityVerified": false}'
    scan_interval: 21600
    timeout: 30
    sensor:
      - name: "Flood Hub Saraburi Lopburi Severity"
        unique_id: flood_hub_saraburi_lopburi_severity
        icon: mdi:waves
        availability: *fh_avail
        value_template: *fh_sev
      - name: "Flood Hub Saraburi Lopburi Alert Count"
        unique_id: flood_hub_saraburi_lopburi_alert_count
        icon: mdi:alert-outline
        availability: *fh_avail
        value_template: *fh_count
      - name: "Flood Hub Saraburi Lopburi Worst Gauge"
        unique_id: flood_hub_saraburi_lopburi_worst_gauge
        icon: mdi:gauge
        availability: *fh_avail
        value_template: *fh_gauge
      - name: "Flood Hub Saraburi Lopburi Issued"
        unique_id: flood_hub_saraburi_lopburi_issued
        icon: mdi:clock-outline
        availability: *fh_avail
        value_template: *fh_issued

  # --- Chao Phraya Dam (flood-report-nongdon-saraburi area 2) ---
