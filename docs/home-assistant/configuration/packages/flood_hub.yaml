    method: post
    headers:
      Content-Type: "application/json"
      x-goog-api-key: !secret flood_hub_api_key
    payload: '{"loop": {"vertices": [{"latitude": 14.9, "longitude": 99.8}, {"latitude": 14.9, "longitude": 100.7}, {"latitude": 15.5, "longitude": 100.7}, {"latitude": 15.5, "longitude": 99.8}]}, "pageSize": 20000, "includeNonQualityVerified": false}'
    scan_interval: 21600
    timeout: 30
    sensor:
      - name: "Flood Hub Chao Phraya Dam Severity"
        unique_id: flood_hub_chaophraya_dam_severity
        icon: mdi:waves
        availability: *fh_avail
