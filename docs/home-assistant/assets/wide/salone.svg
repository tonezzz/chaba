<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260">
  <defs>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sliderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- dark rounded card background -->
  <rect x="8" y="8" width="224" height="244" rx="24" ry="24" fill="#0f172a" />

  <!-- room label -->
  <text x="120.0" y="38" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" letter-spacing="1">SALONE</text>

  <!-- gauge arc -->
  <path d="M 56.36 183.64 A 90 90 0 1 1 183.64 183.64" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round" />
  <path d="M 56.36 183.64 A 90 90 0 1 1 183.64 183.64" fill="none" stroke="url(#arcGrad)" stroke-width="10" stroke-linecap="round" />

  <!-- big set temperature -->
  <text x="120.0" y="130" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="700">21.5</text>

  <!-- separator line under big number -->
  <line x1="76" y1="138" x2="164" y2="138" stroke="#475569" stroke-width="1.5" />

  <!-- small current temp and humidity -->
  <text x="96" y="160" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="500">22.8</text>
  <text x="158" y="160" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="500">53%</text>

  <!-- icons: flame and radiator -->
  <text x="96" y="192" text-anchor="middle" font-size="24">🔥</text>
  <text x="158" y="192" text-anchor="middle" font-size="24">♨️</text>

  <!-- bottom slider -->
  <rect x="50" y="215" width="140" height="10" rx="5.0" fill="url(#sliderGrad)" />
  <rect x="121.25" y="213" width="8" height="14" rx="4" fill="#ffffff" />
</svg>