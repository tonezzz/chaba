# Dev-only mock entities for michael-dev
# Use the Data tab on the tony-test dashboard to adjust these live.

input_select:
  dev_inverter_mode:
    options:
      - Normal
      - Standby
      - Self-test
      - Fault
      - Off
    initial: Normal
    icon: mdi:solar-power
  dev_battery_direction:
    options:
      - charge
      - discharge
      - idle
      - unknown
    initial: discharge
    icon: mdi:battery

input_number:
  dev_inverter_temperature:
    min: 0
    max: 100
    step: 1
