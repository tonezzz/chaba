  - question: How do I fix devin-desktop after a crash on tony-dell?
    tool: notebooklm
    elapsed: 58.32
    answer: "{\n  \"answer\": \"`devin-desktop` on **tony-dell** is not managed as a\
      \ systemd service; instead, it runs as a background `nohup` job attached to the\
      \ active X display [1].\\n\\n### **1. Restart Command**\\nYou can relaunch `devin-desktop`\
      \ over SSH using the following command [1]:\\n\\n```bash\\nssh tony-dell 'export\
      \ DISPLAY=:1 XAUTHORITY=/run/user/1000/gdm/Xauthority; nohup /usr/bin/devin-desktop\
      \ > /home/tony/.local/share/devin/cli/devin-restart-20260912.log 2>&1 </dev/null\
      \ &'\\n```\\n\\n### **2. Verify the Process**\\nTo confirm that the application\
      \ is running, execute [1]:\\n\\n```bash\\nssh tony-dell 'pgrep -a -f devin-desktop\
      \ | grep -v \\\"pgrep\\\\|ssh\\\\|tailscaled\\\"'\\n```\\n\\n---\\n\\n### **3.\
      \ Known Causes & Diagnostics**\\n* **Orphaned Child Processes**: Crashes can leave\
      \ behind stale `app-devin-desktop-*.scope` units containing orphaned background\
      \ processes (such as `yolo` server or `websockify`) [2].\\n* **CPU Watchdog Kills**:\
      \ The watchdog automatically kills renderer processes if CPU usage exceeds 50%\
      \ for 10 seconds [2].\\n* **Payload Errors**: Sessions may report `HTTP 413 Payload\
      \ Too Large` errors when handling large screenshot payloads without the Headroom\
      \ proxy running [2, 3].\\n* **Log Locations**:\\n  * **Devin session logs**: `~/.local/share/devin/cli/logs/devin_YYYYMMDD-HHMMSS_<pid>.log`\
      \ [3]\\n  * **Watchdog log**: `~/.local/share/devin/cli/watchdog.log` [3]\\n \
      \ * **Cleanup log**: `~/.local/share/devin/cli/cleanup.log` [3]\\n* **Version\
      \ Downgrade**: If build `3.10.23` remains unstable, a cached `.deb` for version\
      \ `3.9.19-1788908513` is available in `/var/cache/apt/archives/` for downgrade\
      \ [3].\\n\\n\U0001F4A1 Would you like to review the maintenance schedule for the\
      \ Devin sessions database (`sessions.db`) on `tony-dell`?\",\n  \"question\":\
      \ \"How do I fix devin-desktop after a crash on tony-dell?\",\n  \"conversation_id\"\
      : \"4d96473d-1bfc-4360-9aea-9a1c25df4420\",\n  \"sources_used\": [\n    \"8f71dc41-d77c-4040-b138-88b0da1bddae\"\
