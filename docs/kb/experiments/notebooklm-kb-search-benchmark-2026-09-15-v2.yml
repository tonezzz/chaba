      \ worktree add /home/tony/CascadeProjects/sunsynk-wt-<feature> -b <feature>\\\
      n  ```\\n* Merge changes back to `main` after verifying the build, as deploys\
      \ are run from `main` [2].\\n\\n---\\n\\n### **2. Typecheck the Code**\\n* Run\
      \ a typecheck before trusting the bundle [3]:\\n  ```bash\\n  npx -p typescript\
      \ tsc --noEmit\\n  ```\\n  *(Note: Rollup uses Babel and does not perform TypeScript\
      \ type-checking during the build process [3]).*\\n\\n---\\n\\n### **3. Run Automated\
      \ Deployment**\\n* Execute the deployment script from the repo root [4]:\\n  ```bash\\\
      n  ./scripts/home-assistant/deploy-card.sh\\n  ```\\n  *(For a specific host,\
      \ you can run `./scripts/home-assistant/deploy-card.sh --host michael-dev` [5]).*\\\
      n\\n  **What `deploy-card.sh` handles automatically:**\\n  * **Deploy lock**:\
      \ Uses `flock /tmp/pfg-deploy.lock` to prevent concurrent deploy races [2].\\\
      n  * **Build**: Executes `npm run build` [3, 4].\\n  * **Version derivation**:\
      \ Reads current versioning from `michael-dev`'s remote `lovelace_resources` to\
      \ derive the next version number [4, 5].\\n  * **Transfer & Resource update**:\
