      \ your application files inside `stacks/web/public/apps/<your-app>/` along with\
      \ an `index.html` file [1, 2].\\n2. **Regenerate `apps.yml`**: Run `python3 /home/tony/CascadeProjects/chaba/scripts/apps-yml-generate.py\
      \ --generate --verify` to update the registry [2].\\n3. **Commit & Push**: Commit\
      \ and push your changes to the repository [3].\\n4. **Automated Sync**: The **`apps-health-sync.timer`**\
      \ will automatically regenerate `docs/ssot/infrastructure/ssot.health.home.apps.yml`,\
      \ `rsync` the public app files to Caddy's root directory (`~/.config/caddy/public/apps/`),\
      \ and perform live HTTP verification against `https://tony-dell.taila0626a.ts.net`\
      \ [2, 3].\\n\\n### **Manual Sync & Verification**\\n\\n* To deploy immediately\
      \ without waiting for the timer, execute `rsync -avz /home/tony/CascadeProjects/chaba/stacks/web/public/apps/\
      \ tony-dell:/home/tony/.config/caddy/public/apps/` [3].\\n* To verify local consistency,\
      \ run `python3 scripts/apps-yml-generate.py --verify` [3].\\n* To run live HTTP\
      \ checks against the deployed app, execute `python3 scripts/apps-yml-generate.py\
      \ --verify --live` [3].\\n\\n\U0001F4A1 Would you like to check the Caddy reverse\
      \ proxy routing rules in `Caddyfile.tony-dell` for apps that require a backend\
      \ service or WebSocket connection?\",\n  \"question\": \"How do I add a new app\
