  - question: What is the nlm-add workflow for adding SSOT sources to NotebookLM?
    tool: notebooklm
    elapsed: 55.79
    answer: "{\n  \"answer\": \"The **`nlm-add` workflow** uses the CLI helper tool\
      \ (`~/.local/bin/nlm-add`) to automate converting, uploading, and registering\
      \ local SSOT files (`.yml`, `.md`, or `.txt`) into NotebookLM [1-3].\\n\\n###\
      \ **Command Syntax**\\n```bash\\nnlm-add <notebook-id> <local-file> [-t \\\"<title>\\\
      \"]\\n```\\n[1]\\n\\n### **Workflow Steps**\\n1. **Format Conversion**: Converts\
      \ local text or YAML files (`.md`, `.yml`, `.txt`) into `.docx` format prior to\
      \ uploading [1, 2].\\n2. **Google Drive Upload**: Uploads the file to the per-notebook\
      \ Google Drive storage path located at `gdrive:notebooklm/chaba/notebooks/<notebook-id>/files`\
      \ [1, 2].\\n3. **NotebookLM Source Import**: Imports the file as a source in NotebookLM\
      \ by its Google Drive File ID using `nlm source add <nb> --drive <FILE_ID> --type\
      \ doc --wait` [1, 2, 4].\\n4. **Manifest Recording**: Logs the added source and\
      \ its metadata in the local manifest file at `~/.local/share/notebooklm/notebooks/<notebook-id>/manifest.yml`\
