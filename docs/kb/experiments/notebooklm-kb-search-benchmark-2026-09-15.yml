  answer: "{\n  \"answer\": \"To add a new app to the public apps page on **tony-dell**,\
    \ follow this standard deployment workflow [1-3]:\\n\\n### **Standard Workflow**\\\
    n\\n1. **Add the App Files**:\\n   Create a directory for your app under the repo\
    \ source path with an `index.html` file [2]:\\n   ```bash\\n   stacks/web/public/apps/<your-app>/index.html\\\
    n   ```\\n\\n2. **Regenerate `apps.yml`**:\\n   Run the script to update the app\
    \ registry [2]:\\n   ```bash\\n   python3 /home/tony/CascadeProjects/chaba/scripts/apps-yml-generate.py\
    \ --generate --verify\\n   ```\\n\\n3. **Commit and Push**:\\n   Commit and push\
    \ your changes to the repository [3].\\n\\n4. **Automated Sync**:\\n   The `apps-health-sync.timer`\
    \ automatically handles the rest [3]:\\n   * Regenerates `docs/ssot/infrastructure/ssot.health.home.apps.yml`\
    \ [3].\\n   * `rsync`s the public app files to Caddy's served root directory (`~/.config/caddy/public/apps/`)\
    \ on **tony-dell** [2, 3].\\n   * Runs live HTTP verification against `https://tony-dell.taila0626a.ts.net`\
    \ [3].\\n\\n---\\n\\n### **Manual Sync & Verification**\\n\\nIf you need the app\
    \ live immediately without waiting for the timer, run a manual `rsync` [3]:\\\
    n```bash\\nrsync -avz /home/tony/CascadeProjects/chaba/stacks/web/public/apps/\
    \ tony-dell:/home/tony/.config/caddy/public/apps/\\n```\\n\\nTo verify the setup:\\\
    n* **Local consistency**:\\n  ```bash\\n  python3 scripts/apps-yml-generate.py\
    \ --verify\\n  ```\\n* **Live HTTP check**:\\n  ```bash\\n  python3 scripts/apps-yml-generate.py\
    \ --verify --live\\n  ```\\n\\n---\\n\U0001F4A1 Would you like to check the Caddy\
    \ reverse proxy routing rules in `Caddyfile.tony-dell` for apps that require a\
