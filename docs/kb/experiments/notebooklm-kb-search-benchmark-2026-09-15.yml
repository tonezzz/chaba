- question: What is the nlm-add workflow for adding SSOT sources to NotebookLM?
  tool: notebooklm
  elapsed: 43.43
  answer: "{\n  \"answer\": \"The **`nlm-add` workflow** uses the helper tool (`~/.local/bin/nlm-add`)\
    \ to automate the process of converting, uploading, and registering local SSOT\
    \ files (`.yml`, `.md`, or `.txt`) into NotebookLM [1, 2].\\n\\n### **Command\
    \ Syntax**\\n```bash\\nnlm-add <notebook-id> <local-file> [-t \\\"<title>\\\"\
    ]\\n``` [1]\\n\\n### **Workflow Steps**\\n1. **Format Conversion**: Converts local\
    \ text or YAML files (`.md`, `.yml`, `.txt`) into `.docx` format prior to upload\
    \ [1].\\n2. **Google Drive Upload**: Uploads the file into the per-notebook Google\
    \ Drive folder located at `gdrive:notebooklm/chaba/notebooks/<notebook-id>/files`\
    \ [1-3].\\n3. **NotebookLM Source Import**: Registers the source with NotebookLM\
    \ by its Google Drive File ID using `nlm source add <nb> --drive <FILE_ID> --type\
    \ doc --wait` [1, 4].\\n4. **Manifest Recording**: Logs the added source and its\
    \ metadata in the local manifest file at `~/.local/share/notebooklm/notebooks/<notebook-id>/manifest.yml`\
    \ [1, 2].\\n\\n---\\n\U0001F4A1 Would you like to explore how the daily auth refresh\
    \ service (`notebooklm-rest-auth-refresh`) maintains session authentication for\
    \ these NotebookLM CLI tools?\",\n  \"question\": \"What is the nlm-add workflow\
