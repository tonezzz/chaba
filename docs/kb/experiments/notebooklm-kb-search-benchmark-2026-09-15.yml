- question: How do I fix devin-desktop after a crash on tony-dell?
  tool: notebooklm
  elapsed: 55.55
  answer: "{\n  \"answer\": \"To restart `devin-desktop` on **tony-dell** after a\
    \ crash, note that it is **not** managed as a systemd service; instead, it runs\
    \ as a background `nohup` job attached to the active X display [1].\\n\\n### **1.\
    \ Quick Restart Command**\\nRun this SSH command from your control machine to\
    \ relaunch `devin-desktop` with the required X display environment [1]:\\n\\n```bash\\\
    nssh tony-dell 'export DISPLAY=:1 XAUTHORITY=/run/user/1000/gdm/Xauthority; nohup\
    \ /usr/bin/devin-desktop > /home/tony/.local/share/devin/cli/devin-restart-20260912.log\
    \ 2>&1 </dev/null &'\\n```\\n\\n---\\n\\n### **2. Verify the Process**\\nCheck\
    \ that the process is running [1]:\\n\\n```bash\\nssh tony-dell 'pgrep -a -f devin-desktop\
    \ | grep -v \\\"pgrep\\\\|ssh\\\\|tailscaled\\\"'\\n```\\n\\n---\\n\\n### **3.\
    \ Troubleshooting & Known Causes**\\n* **Stale Scopes:** Crashes can leave behind\
    \ orphaned child processes (such as `yolo` server or `websockify`) inside `app-devin-desktop-*.scope`\
    \ units [2].\\n* **CPU Watchdog Kills:** The watchdog kills renderers if CPU usage\
    \ stays above 50% for 10 seconds [2].\\n* **Log File Locations:** You can inspect\
    \ diagnostic logs at [3]:\\n  * **Devin session logs:** `~/.local/share/devin/cli/logs/devin_YYYYMMDD-HHMMSS_<pid>.log`\
    \ [3]\\n  * **Watchdog log:** `~/.local/share/devin/cli/watchdog.log` [3]\\n \
    \ * **Cleanup log:** `~/.local/share/devin/cli/cleanup.log` [3]\\n* **Version\
    \ Downgrade:** If version `3.10.23` continues to crash, a cached `.deb` for version\
    \ `3.9.19-1788908513` is stored in `/var/cache/apt/archives/` and can be reinstalled\
    \ [3].\\n\\n---\\n\\n\U0001F4A1 Would you like to review the session database\
    \ cleanup or maintenance settings for Devin on **tony-dell**?\",\n  \"question\"\
    : \"How do I fix devin-desktop after a crash on tony-dell?\",\n  \"conversation_id\"\
    : \"4d96473d-1bfc-4360-9aea-9a1c25df4420\",\n  \"sources_used\": [\n    \"3230c2de-07c8-44a0-a66f-aa846f387141\"\
