title: Chaba Knowledge Base & Session Memories
subtitle: Session learnings, decisions, discoveries, and conventions
icon: 🧠

# Purpose: Capture KB-worthy facts from assistant sessions
# This SSOT file serves as the central repository for session learnings
ideas:
  - Capture decisions, discoveries, infrastructure changes, conventions, workarounds
  - Link sessions to KB documentation files (docs/kb-*.md)
  - Track session metadata (date, topics, duration, outcomes)
  - Maintain searchable history of system evolution
  - Support cross-session learning and context preservation
  - Integrate with existing KB documentation system

# Memory corpus structure
corpus:
  system:
    description: System architecture, infrastructure, and configuration decisions
    location: docs/kb-system.md
    tags: [architecture, infrastructure, configuration]
  
  development:
    description: Development workflows, coding conventions, and tooling decisions
    location: docs/kb-development.md
    tags: [workflow, conventions, tooling]
  
  operations:
    description: Operational procedures, monitoring, and incident response
    location: docs/kb-operations.md
    tags: [operations, monitoring, incidents]
  
  features:
    description: Feature implementations, enhancements, and user-facing changes
    location: docs/kb-features.md
    tags: [features, enhancements, user-facing]

