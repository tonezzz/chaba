# SSOT Template
# Copy this file to create new SSOT YAML files
# Replace placeholder content with your actual data

title: Project Name
subtitle: Brief description of this SSOT file's purpose
icon: 📁

# Ideas and notes about this SSOT file
# Use this section for brainstorming, future plans, or context
ideas:
  - Purpose of this SSOT file
  - Key concepts or relationships
  - Future improvements or changes needed

# Main content sections
# Each section should have a clear title, icon, and layout
sections:
  - title: Section Name
    icon: 🎯
    layout: list  # Options: list, grid, timeline
    items:
      - label: Item Label
        text: Detailed description or content
        # Optional fields:
        # url: https://example.com
        # status: active | completed | planned
        # priority: high | medium | low
        # tags: [tag1, tag2]

  - title: Another Section
    icon: 📋
    layout: list
    items:
      - label: Another Item
        text: More content here

# Configuration and metadata (optional)
config:
  version: 1
  last_updated: 2026-08-02
  maintainer: your-name
  related_files:
    - ssot.related-file.yml
    - docs/related-documentation.md
